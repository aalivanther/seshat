ría «Is there any cake?»\"],\"itemIds\":[\"enhowmuchisit\",\"enthis\",\"encake\"]},{\"id\":\"ena1m6l2e2\",\"type\":\"match\",\"prompt\":\"Empareja el precio escrito con cómo se dice\",\"pairs\":[{\"target\":\"three pounds fifty\",\"source\":\"£3.50\"},{\"target\":\"fifty p\",\"source\":\"50p\"},{\"target\":\"thirteen pounds\",\"source\":\"£13\"},{\"target\":\"thirty pounds\",\"source\":\"£30\"}],\"itemIds\":[\"enpound\",\"enpence\",\"enitsthreepoundsfifty\"],\"tip\":\"13/30: si el golpe de voz va al final (thir-TEEN) es 13; al principio (THIR-ty) es 30.\"},{\"id\":\"ena1m6l2e3\",\"type\":\"listen\",\"prompt\":\"Escucha el precio — ¿13 o 30?\",\"text\":\"It's thirteen pounds.\",\"translation\":\"Son trece libras (£13).\",\"hints\":[\"¿Dónde cae el golpe de voz?\",\"thir-TEEN, acento al final = 13\"],\"itemIds\":[\"enpound\"],\"tip\":\"Esta pareja decide puntos del examen: en el Listening T1 siempre hay un precio con 13/30, 14/40 o 15/50.\"},{\"id\":\"ena1m6l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa — son varias\",\"text\":\"How much ___ these apples?\",\"answers\":[\"are\"],\"translation\":\"¿Cuánto cuestan estas manzanas?\",\"hints\":[\"apples es plural\",\"How much a-r-e ...\"],\"itemIds\":[\"enhowmuchare\",\"enthese\"]},{\"id\":\"ena1m6l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa el precio del té\",\"text\":\"“How much is the tea?” — “It's one ___ fifty.”\",\"answers\":[\"pound\"],\"translation\":\"—¿Cuánto cuesta el té? —1,50 £.\",\"hints\":[\"La moneda británica, en singular con one\",\"one p-o-u-n-d fifty\"],\"itemIds\":[\"enpound\",\"enitsthreepoundsfifty\"]},{\"id\":\"ena1m6l2e6\",\"type\":\"build\",\"prompt\":\"Construye la pregunta señalando lejos\",\"target\":\"How much is that cake?\",\"translation\":\"¿Cuánto cuesta esa tarta?\",\"distractors\":[\"are\",\"this\"],\"itemIds\":[\"enhowmuchisit\",\"enthat\",\"encake\"]},{\"id\":\"ena1m6l2e7\",\"type\":\"speak\",\"prompt\":\"Di el precio en voz alta\",\"text\":\"It's three pounds fifty.\",\"phonetic\":\"its ZRÍI páunds̬ FIF-ti\",\"translation\":\"Son 3,50 £.\",\"itemIds\":[\"enitsthreepoundsfifty\"]},{\"id\":\"ena1m6l2e9\",\"type\":\"audiomc\",\"prompt\":\"Pregunta primero, escucha después — ¿13 o 30?\",\"audio\":\"That's thirty pounds, please.\",\"question\":\"¿Cuánto pagas?\",\"options\":[\"£30\",\"£13\",\"£3\"],\"answer\":0,\"whyWrong\":[null,\"thirteen llevaría el golpe al FINAL (thir-TEEN) — sonó THIR-ty, al principio\",\"three sería sin -ty: sonó thirty\"],\"itemIds\":[\"enpound\"],\"tip\":\"El golpe de voz ES el dato: THIR-ty (principio) = 30 · thir-TEEN (final) = 13. En el examen este par vale puntos.\"},{\"id\":\"ena1m6l2e10\",\"type\":\"transform\",\"prompt\":\"Transforma: del precio a la pregunta\",\"source\":\"The cake is three pounds fifty.\",\"instruction\":\"No sabes el precio — pregúntalo\",\"answers\":[\"How much is the cake?\",\"How much is the cake\"],\"translation\":\"¿Cuánto cuesta la tarta?\",\"hints\":[\"La pregunta del precio, con is (una sola tarta)\",\"How much is ...?\"],\"itemIds\":[\"enhowmuchisit\",\"encake\"],\"tip\":\"De la respuesta a la pregunta: How much is + la cosa. Producir la pregunta es lo que te pide el oral del examen.\"},{\"id\":\"ena1m6l2e11\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — hay UN solo error\",\"wrong\":\"How much cost these shoes?\",\"answers\":[\"How much do these shoes cost?\",\"How much do these shoes cost\",\"How much are these shoes?\",\"How much are these shoes\"],\"why\":\"cost no tiene nada de malo: How much do these shoes cost? es tan inglés como el pan. Lo que falta es el AUXILIAR. Con un verbo normal, la pregunta se monta con do/does, y el sujeto va delante del verbo: How much + do + these shoes + cost? Sin do, la frase se queda coja.\",\"translation\":\"¿Cuánto cuestan estos zapatos?\",\"hints\":[\"Falta el auxiliar de las preguntas con verbo normal\",\"How much ___ these shoes cost?\"],\"itemIds\":[\"enhowmuchare\",\"enshoes\"],\"tip\":\"Dos caminos, los dos nativos: How much are these shoes? (con be — el de la tienda, más corto) y How much do these shoes cost? (con do + cost). Lo único imposible es la mezcla sin auxiliar.\"},{\"id\":\"ena1m6l2e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cuánto cuestan esas manzanas?\",\"answers\":[\"How much are those apples?\",\"How much are those apples\"],\"hints\":[\"Varias y lejos\",\"How much are those ...\"],\"itemIds\":[\"enhowmuchare\",\"enthose\"],\"tip\":\"How much are + those: pregunta de precio y señalador en una sola jugada.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m6-1\",\"book\":\"It's ten pounds.\",\"real\":\"It's ten quid.\",\"meaning\":\"«Son diez libras» — quid es «libra» en jerga.\",\"when\":\"Lo oirás constantemente en Londres al hablar de dinero entre gente de confianza. Nunca en precios escritos, nunca en el examen, y tú no lo necesitas decir: pounds vale siempre. Ojo: quid no tiene plural — five quid, jamás «quids».\",\"register\":\"jerga\",\"note\":\"Como «pavos» para los euros/dólares: ten quid = diez pavos británicos.\",\"sound\":\"kuíd\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"LanguageCert ESOL A1 Preliminary — examen oficial\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a1-preliminary-2275\",\"note\":\"Tu norte: en su Listening T1 caen precios, números y horas — exactamente lo de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":
