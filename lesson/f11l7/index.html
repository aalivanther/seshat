10. Ich habe viel gelernt und ich kann es!\u003cbr/\u003e\u003cbr/\u003eFíjate: Nico narra con \u003cb\u003ehaben\u003c/b\u003e (gearbeitet, eingekauft, gekocht, gelesen, geübt), con \u003cb\u003esein\u003c/b\u003e (gegangen, aufgestanden, gefahren), con \u003cb\u003ewar/hatte\u003c/b\u003e para estados — y su plan de mañana va en \u003cb\u003epresente\u003c/b\u003e. Todo el curso está en estas 10 frases."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"f11l7\",\"phaseId\":\"f11\",\"title\":\"Nicos Woche\",\"subtitle\":\"El mini-cuento final — todo el curso en una semana\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas\",\"itemIds\":[\"woche\",\"geuebt\",\"ichmachediepruefung\",\"pruefung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Nicos Woche — la historia final\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f11l7e1\",\"type\":\"mc\",\"prompt\":\"Comprensión: ¿qué hizo Nico el martes?\",\"question\":\"Am Dienstag ...\",\"options\":[\"hizo la compra\",\"fue al cine\",\"trabajó mucho\"],\"answer\":1,\"whyWrong\":[\"Eso fue el miércoles (Am Mittwoch habe ich eingekauft)\",null,\"Eso fue el jueves (ich habe viel gearbeitet)\"],\"itemIds\":[\"inskinogegangen\",\"dienstag\"],\"tip\":\"Relee la frase 3: «Am Dienstag bin ich ins Kino gegangen».\"},{\"id\":\"f11l7e2\",\"type\":\"mc\",\"prompt\":\"Comprensión: el giro final\",\"question\":\"¿Qué hace Nico mañana?\",\"options\":[\"Trabaja\",\"Estudia alemán en casa\",\"Hace el examen A1\"],\"answer\":2,\"whyWrong\":[\"Dice justo lo contrario: «Morgen arbeite ich nicht»\",\"Ya estudió toda la semana — mañana toca demostrarlo\",null],\"itemIds\":[\"ichmachediepruefung\",\"pruefung\"],\"tip\":\"«Ich mache die Prüfung» va en presente — pero habla de mañana. Es tu lección 6 en acción.\"},{\"id\":\"f11l7e3\",\"type\":\"cloze\",\"prompt\":\"Completa la primera frase del cuento\",\"text\":\"Das war meine ___! (semana)\",\"answers\":[\"Woc
