 y stopped doing.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m7l7e1\",\"type\":\"match\",\"prompt\":\"Empareja la acepción de cocina\",\"pairs\":[{\"target\":\"It turned out fine.\",\"source\":\"al final salió bien\"},{\"target\":\"I'll pick it up at four.\",\"source\":\"lo recojo a las cuatro\"},{\"target\":\"It fills you up.\",\"source\":\"te llena\"},{\"target\":\"It freezes well.\",\"source\":\"aguanta bien el congelador\"},{\"target\":\"batch cooking\",\"source\":\"cocinar en tandas\"}],\"itemIds\":[\"enb2m7turnedoutfine\",\"enb2m7pickitup\",\"enb2m7fillup\",\"enb2m7freezewell\",\"enb2m7batchcooking\"],\"tip\":\"Cinco bloques de cocina que no se construyen palabra a palabra. Pick it up at four no es pick up English.\"},{\"id\":\"enb2m7l7e2\",\"type\":\"mc\",\"prompt\":\"Diet no es hábito\",\"question\":\"«Eating habits» y «a diet» se distinguen porque…\",\"options\":[\"Habits son costumbres; a diet es un régimen, contable\",\"Son sinónimos en B2\",\"Diet es solo para médicos\"],\"answer\":0,\"whyWrong\":[null,\"Si lo fueran, el campo no los listaría aparte.\",\"Diet es de menú y de revista también. Lo que no es, es un sinónimo de habits.\"],\"itemIds\":[\"enb2m7adiets\",\"enb2m7eatinghabits\"],\"tip\":\"I'm on a diet / my eating habits have changed. Dos bloques, dos conversaciones.\"},{\"id\":\"enb2m7l7e3\",\"type\":\"gapbank\",\"prompt\":\"Completa el recado de Sam\",\"text\":\"I'll ___ it up at four. The soup fills you ___, and it ___ out fine without cream. Batch ___ on Monday; it freezes ___.\",\"answers\":[\"pick\",\"up\",\"turned\",\"cooking\",\"well\"],\"bank\":[\"pick\",\"up\",\"turned\",\"cooking\",\"well\",\"take\",\"in\",\"came\",\"making\",\"good\"],\"translation\":\"Lo recojo a las cuatro. La sopa te llena, y salió bien sin nata. Tandas el lunes; aguanta bien el congelador.\",\"itemIds\":[\"enb2m7pickitup\",\"enb2m7fillup\",\"enb2m7turnedoutfine\",\"enb2m7batchcooking\",\"enb2m7freezewell\"],\"tip\":\"Came out es prima de turned out y no es el bloque. Making cooking no existe: batch cooking es el nombre.\"},{\"id\":\"enb2m7l7e4\",\"type\":\"paraphrase\",\"prompt\":\"Dejar un hábito, sin stop ni give\",\"source\":\"I stopped eating sugar.\",\"forbid\":[\"stop\",\"give\",\"sugar\"],\"answers\":[\"I packed it in\",\"I've cut it out\",\"I packed it in for good\"],\"translation\":\"Dejé de comer azúcar.\",\"hints\":[\"Packed it in, o cut out\",\"I packed it ...\"],\"itemIds\":[\"enb2m7natpackeditin\",\"enb2m7cutoutsugar\",\"enb1m6giveup\"],\"tip\":\"«I packed sugar in» no es el bloque: el it es el hábito, no el alimento. Cut out sugar sí nombra el alimento. Packed it in lo da por sentado.\"},{\"id\":\"enb2m7l7e5\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — cuaderno. Sam y Valeria cierran la carta. Dos escuchas.\",\"notepad\":true,\"audio\":\"Right. Shorter menu. Seasonal soup, the sourdough, one plant-based that isn't bland, and the buns. I'll pick the veg up at seven on Tuesday and Thursday. If it doesn't turn out, we don't put it on the board — we don't source a tired replacement just to keep year-round availability looking pretty.|And the freezer?|It takes up half the kitchen and I still need it. Batch cooking on Monday, soup that freezes well. Leftovers go in the bag, not in the bin. If someone is on a diet they can say so; I'm not printing eating habits on a sticker.|Put off the Thursday special until it isn't soggy.|Already done. Packed that one in.\",\"question\":\"¿Qué se queda fuera de la carta nueva, de momento?\",\"options\":[\"El especial del jueves, hasta que deje de estar chicloso; y la fruta cansada de todo el año\",\"El pan de masa madre\",\"El congelador\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El sourdough se queda. Es de lo que Sam está más keen.\",\"El congelador se queda, aunque ocupe media cocina.\"],\"itemIds\":[\"enb2m7pickitup\",\"enb2m7turnedoutfine\",\"enb2m7yearround\",\"enb2m7takeupspace\",\"enb2m7batchcooking\",\"enb2m7freezewell\",\"enb2m7leftovers\",\"enb2m7adiets\",\"enb2m7soggy\",\"enb2m7natpackeditin\"],\"tip\":\"Packed that one in = lo ha dejado. Put off the Thursday special aquí es quitarlo / aplazarlo hasta que no esté soggy. Dos phrasals, dos oficios, misma tarde.\"},{\"id\":\"enb2m7l7e6\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el recado\",\"text\":\"I'll pick it up at four. It fills you up, and it freezes well.\",\"phonetic\":\"ail pik it ap at foo. it fils yu ap, and it FRÍI-s̬is uel\",\"translation\":\"Lo recojo a las cuatro. Te llena, y aguanta bien el congelador.\",\"itemIds\":[\"enb2m7pickitup\",\"enb2m7fillup\",\"enb2m7freezewell\"],\"tip\":\"Tres up / well, tres golpes: PICK, FILLS, FREEZ-es. Si les das el mismo peso a I'll y to, se te deshace el recado.\"},{\"id\":\"enb2m7l7e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"La cadena de suministro no cabe en una etiqueta.\",\"answers\":[\"The supply chain doesn't fit on a sticker\",\"The supply chain does not fit on a sticker\",\"The supply chain won't fit on a label\"],\"hint\":\"two words: the chain that brings the food\",\"itemIds\":[\"enb2m7supplychain\"],\"tip\":\"Supply chain es el bloque de informe. En una reseña rara vez entra; en la lectura A, sí.\"},{\"id\":\"enb2m7l7exw1\",\"type\":\"write\",\"prompt\":\"Writing 1 · formal 100-150. Off-topic = 0.\",\"scenario\":\"Write to Ms Chen at the supplier: a crate of short-dated stock arrived yesterday and will be waste by Friday. Three points, polite register. Off-topic = 0.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"bullets\":[\"Open with the purpose.\",\"One reason and one request.\",\"Close politely.\"],\"checks\":[{\"re\":\"(Dear|I am writing)\",\"label\":\"apertura formal\"},{\"re\":\"(could|would|please)\",\"label\":\"petición educada\"},{\"re\":\"(Yours sincerely|Kind regards)\",\"label\":\"cierre\"}],\"minWords\":100,\"maxWords\":150,\"model\":\"Dear Ms Chen,\\nI am writing about a crate of short-dated stock that arrived yesterday afternoon. The use-by date is Friday, and the kitchen cannot serve it all without waste. Could you collect the unsold units, please, or credit the invoice by Wednesday? I would be grateful if you could also confirm whether Tuesday's delivery will be longer-dated, because otherwise we will be throwing food again. Please let me know if a morning slot still stands; the back door is free from seven. The supply chain does not fit on a sticker, but the date on the crate does, and that is what we have to work with this week.\\nKind regards,\\nValeria Soto\",\"itemIds\":[],\"tip\":\"Off-topic = 0. Could/would, not Give me.\"},{\"id\":\"enb2m7l7exw2\",\"type\":\"write\",\"prompt\":\"Writing 2 · 150-200. Off-topic = 0.\",\"scenario\":\"Neighbourhood site: leftover boxes from the café. One idea per paragraph. Taste and waste, not the library. Off-topic = 0.\",\"genre\":\"article\",\"register\":\"polite\",\"bullets\":[\"Topic sentence first.\",\"One example.\",\"A close that does not copy the opening.\"],\"checks\":[{\"re\":\"(The problem is|The reason|First)\",\"label\":\"frase-tema\"},{\"re\":\"(for example|for instance)\",\"label\":\"ejemplo\"},{\"re\":\"(Could we|I would keep|I would)\",\"label\":\"cierre con propuesta\"}],\"minWords\":150,\"maxWords\":200,\"model\":\"The problem is not that people dislike the food. It is that the café throws a tray of still-good portions when the last sitting ends. For example, Tuesday's lentil stew was gone from the board at eight and in the bin at nine, because nobody is allowed to take a box home. Shift workers on Green Street would buy those portions if the hatch stayed open twenty minutes. I would keep a labelled shelf by the door and measure, for a month, how many boxes actually leave. Could we at least try that, please, before anyone calls it a hygiene risk? Waste is not a flavour. It is a decision about who the leftover is for, and a city that bins a full tray has already chosen. That hour is not a luxury; it is the only hour that works. That hour is not a luxury; it is the only hour that works.\",\"itemIds\":[],\"tip\":\"Una idea por párrafo. Off-topic = 0.\"},{\"id\":\"enb2m7l7exd1\",\"type\":\"transform\",\"prompt\":\"Pasiva de lo que se tira.\",\"source\":\"They threw the bread away.\",\"instruction\":\"Pasiva.\",\"answers\":[\"The bread was thrown away.\"],\"translation\":\"El pan se tiró.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd2\",\"type\":\"errorfix\",\"prompt\":\"Concordancia.\",\"wrong\":\"This soup taste good.\",\"answers\":[\"This soup tastes good.\"],\"why\":\"Tercera persona: tastes, no taste.\",\"translation\":\"Esta sopa está buena.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd3\",\"type\":\"cloze\",\"prompt\":\"Cadena.\",\"text\":\"The ___ chain does not fit on a sticker.\",\"answers\":[\"supply\"],\"translation\":\"La cadena de suministro no cabe en una etiqueta.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd4\",\"type\":\"transform\",\"prompt\":\"Registro de reseña.\",\"source\":\"The stew was well good.\",\"instruction\":\"Registro escrito.\",\"answers\":[\"The stew was very good.\"],\"translation\":\"El guiso estaba muy bueno.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd5\",\"type\":\"errorfix\",\"prompt\":\"Phrasal: dejar un hábito.\",\"wrong\":\"I packed smoking in last year.\",\"answers\":[\"I packed it in last year.\"],\"why\":\"Packed it in lleva el it; packed smoking in no es el bloque.\",\"translation\":\"Lo dejé el año pasado.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd6\",\"type\":\"cloze\",\"prompt\":\"Fecha de caducidad.\",\"text\":\"The use-by ___ is Friday.\",\"answers\":[\"date\"],\"translation\":\"La fecha de caducidad es el viernes.\",\"itemIds\":[]},{\"id\":\"enb2m7l7exd7\",\"type\":\"transform\",\"prompt\":\"Sin desperdicio como decisión.\",\"source\":\"We bin the tray because it is late.\",\"instruction\":\"Haz visible al agente de la decisión.\",\"answers\":[\"The kitchen bins the tray because it is late.\"],\"translation\":\"La cocina tira la bandeja porque es
