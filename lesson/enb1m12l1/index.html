u003c/b\u003e, cuatro partes de \u003cb\u003etres minutos cada una\u003c/b\u003e, con un interlocutor de carne y hueso —presencial o por vídeo—. Vale \u003cb\u003e50 puntos\u003c/b\u003e, se aprueba con \u003cb\u003e25\u003c/b\u003e y el \u003ci\u003eHigh Pass\u003c/i\u003e está en \u003cb\u003e38\u003c/b\u003e. La conversación se graba y \u003cb\u003equien te pone la nota no es quien habla contigo\u003c/b\u003e: es un examinador central que solo oye el audio.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla que cambia toda tu estrategia: no hay mínimos por destreza.\u003c/b\u003e Dentro del escrito, Listening, Reading y Writing \u003cb\u003ese suman\u003c/b\u003e. Si el Writing te sale regular, lo puedes recuperar en las otras dos — y al revés. Por eso Reading y Listening, que suman 52 de los 76 puntos brutos del escrito (Listening 26 + Reading 26 + Writing 24) y se corrigen con plantilla, son \u003cb\u003eel terreno donde se recupera\u003c/b\u003e: ahí no hay opiniones, hay respuestas. LanguageCert escala esos puntos brutos hasta los 150 finales, pero no publica la tabla exacta de conversión.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTodos los audios se oyen dos veces\u003c/b\u003e, en las cuatro partes del Listening. No es un favor: es parte del diseño, y significa que la primera escucha puedes gastarla en entender \u003ci\u003ede qué va\u003c/i\u003e, sin desesperarte por el dato.\u003cbr/\u003e\u003cbr/\u003eY ahora el aviso incómodo. \u003cb\u003eTu A2 duraba 1 h 40. Esto dura 2 h 40.\u003c/b\u003e Una hora más, y la hora que se añade es la del final, cuando ya estás cansado y toca escribir. \u003cb\u003eLa resistencia es parte del examen\u003c/b\u003e, y se entrena como se entrena todo lo demás: haciendo el papel entero, cronometrado, más de una vez."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l1\",\"phaseId\":\"enb1m12\",\"title\":\"Two hours and forty minutes\",\"subtitle\":\"El examen por dentro: el reloj, los puntos y por qué la resistencia se entrena\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las cuatro palabras que ordenan el día\",\"itemIds\":[\"enb1m12writtenexam\",\"enb1m12spokenexam\",\"enb1m12twohoursforty\",\"enb1m12stamina\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El LanguageCert B1 Achiever, por dentro\",\"body\":\"$17\",\"table\":[[\"\",\"Tu A2 (Access)\",\"Este B1 (Achiever)\"],[\"Escrito\",\"1 h 40\",\"2 h 40 seguidas\"],[\"Writing\",\"60-100 palabras\",\"70-100 + 100-120\"],[\"Reading Part 4\",\"7 preguntas de test\",\"8 preguntas que escribes tú\"],[\"Oral\",\"9 minutos\",\"12 minutos\"],[\"Horas oficiales\",\"95 GLH\",\"180 GLH\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del día del examen\",\"pairs\":[{\"target\":\"the written exam\",\"source\":\"el examen escrito, todo seguido\"},{\"target\":\"the spoken exam\",\"source\":\"el examen oral, doce minutos\"},{\"target\":\"two hours and forty minutes\",\"source\":\"lo que dura el escrito\"},{\"target\":\"stamina\",\"source\":\"la resistencia: aguantar hasta el final\"}],\"itemIds\":[\"enb1m12writtenexam\",\"enb1m12spokenexam\",\"enb1m12twohoursforty\",\"enb1m12stamina\"],\"tip\":\"«stamina» no es una palabra de examen: es una palabra de deporte. Y está aquí por eso — porque lo que se te va a acabar en el minuto 130 no es el inglés, es la concentración.\"},{\"id\":\"enb1m12l1e2\",\"type\":\"mc\",\"prompt\":\"El reloj\",\"question\":\"¿Cuánto dura el examen escrito y cómo está repartido?\",\"options\":[\"2 h 40 seguidas: ~30 min de Listening y 2 h 10 de Reading y Writing.\",\"2 h 40 con media hora de descanso entre el Listening y el resto.\",\"1 h 40, como en el A2, pero con más preguntas.\"],\"answer\":0,\"whyWrong\":[null,\"No hay descanso. Eso es exactamente lo que hace que la última media hora sea la más cara.\",\"1 h 40 era el A2. Aquí es una hora más, y la hora que se añade cae al final.\"],\"itemIds\":[\"enb1m12twohoursforty\",\"enb1m12writtenexam\"],\"tip\":\"Apúntate el reparto que vas a usar el día D: Listening ~30 · Reading ~70 · Writing ~55 · repaso 5. Si no llevas un plan de reloj, el Writing se queda sin tiempo — siempre.\"},{\"id\":\"enb1m12l1e3\",\"type\":\"mc\",\"prompt\":\"La regla que decide tu estrategia\",\"question\":\"En el escrito no hay nota mínima por destreza. ¿Qué significa eso para ti?\",\"options\":[\"Que Listening, Reading y Writing se suman: lo que pierdes en uno lo recuperas en otro.\",\"Que puedes dejar el Writing en blanco si vas bien de Reading.\",\"Que basta con aprobar dos de las tres destrezas.\"],\"answer\":0,\"whyWrong\":[null,\"El Writing vale 24 de los 76 puntos brutos del escrito (Listening 26 + Reading 26 + Writing 24). Dejarlo en blanco no es compensar: es regalar casi un tercio de lo que puntúa.\",\"No se aprueba por destrezas: se aprueba por la suma. Son 75 de 150, vengan de donde vengan.\"],\"tip\":\"Compárate con el Goethe alemán, donde cada módulo se aprueba por separado. Aquí no: aquí Reading y Listening, que se corrigen con plantilla y no dependen del gusto de nadie, son tu colchón. Entrénalos como tales.\"},{\"id\":\"enb1m12l1e4\",\"type\":\"mc\",\"prompt\":\"La regla de oro del Listening\",\"question\":\"¿Cuántas veces se oye cada audio?\",\"options\":[\"Dos veces, en las cuatro partes.\",\"Dos veces en las partes 1 y 2, y una sola vez en las partes 3 y 4.\",\"Una sola vez, como en el examen oral.\"],\"answer\":0,\"whyWrong\":[null,\"No hay excepciones: las cuatro partes se oyen dos veces, también la ficha de notas.\",\"Una sola vez sería otro examen. Aquí tienes dos pasadas siempre.\"],\"itemIds\":[\"entwice\",\"enrecording\"],\"tip\":\"Esto no es un consuelo: es una táctica. La primera pasada, para el sentido general y para marcar por dónde va cada pregunta. La segunda, solo para los datos que te faltan.\"},{\"id\":\"enb1m12l1e5\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿esto pasa en el escrito o en el oral?\",\"categories\":[\"El examen escrito\",\"El examen oral\"],\"items\":[{\"text\":\"Eight questions you answer in your own words\",\"bucket\":0},{\"text\":\"Spelling your surname out loud\",\"bucket\":1},{\"text\":\"A note sheet with seven gaps\",\"bucket\":0},{\"text\":\"Thirty seconds to prepare a topic\",\"bucket\":1},{\"text\":\"A formal letter of 70-100 words\",\"bucket\":0},{\"text\":\"Two role-play situations\",\"bucket\":1}],\"tip\":\"Los dos exámenes son independientes de verdad: se pagan por separado, se hacen por separado y salen dos certificados. Si uno te sale mal, repites solo ese.\"},{\"id\":\"enb1m12l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa el dato del reloj\",\"text\":\"The written exam lasts two hours and forty ___.\",\"answers\":[\"minutes\"],\"translation\":\"El examen escrito dura dos horas y cuarenta minutos.\",\"hints\":[\"Es la unidad de tiempo pequeña\",\"mi-nu-tes\"],\"itemIds\":[\"enb1m12twohoursforty\"],\"tip\":\"Ojo a la pronunciación: «minutes» aquí es MÍ-nits, dos sílabas comidas. El adjetivo «minute» (diminuto) suena mai-NIÚUT — no es la misma palabra hablando.\"},{\"id\":\"enb1m12l1e7\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz: el vocabulario de examen que ya traes del A1\",\"pairs\":[{\"target\":\"the exam\",\"source\":\"el examen\"},{\"target\":\"the part\",\"source\":\"la parte\"},{\"target\":\"twice\",\"source\":\"dos veces\"},{\"target\":\"the topic\",\"source\":\"el tema\"},{\"target\":\"the examiner\",\"source\":\"el examinador\"}],\"targetSeconds\":20,\"itemIds\":[\"enexam\",\"enpart\",\"entwice\",\"entopic\",\"enexaminer\"],\"tip\":\"Cinco palabras que aprendiste hace un año y que hoy tienen que salir sin pensarlas. Eso es exactamente lo que mide el examen: no cuántas palabras sabes, sino cuántas te salen a tiempo.\"},{\"id\":\"enb1m12l1e8\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I will present me to the exam in June.\",\"answers\":[\"I will take the exam in June.\",\"I'm going to take the exam in June.\"],\"why\":\"«Presentarse a un examen» en inglés es \u003cb\u003etake an exam\u003c/b\u003e, sin reflexivo y sin «present». «Present» es presentar algo a alguien; «present me» directamente no existe. Y ojo: aprobarlo es \u003cb\u003epass\u003c/b\u003e, hacerlo es \u003cb\u003etake\u003c/b\u003e. «I passed the exam» = aprobé; «I took the exam» = lo hice, y ya veremos.\",\"translation\":\"Me presento al examen en junio.\",\"itemIds\":[\"enexam\"]},{\"id\":\"enb1m12l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el aviso que te leen antes de empezar\",\"text\":\"Read the ___ carefully before you start. You have two hours and forty ___ for the whole written paper, and you may not leave the ___ before the end.\",\"answers\":[\"instructions\",\"minutes\",\"room\"],\"bank\":[\"instructions\",\"minutes\",\"room\",\"questions\",\"seconds\",\"building\"],\"translation\":\"Lea las instrucciones con atención antes de empezar. Dispone de dos horas y cuarenta minutos para todo el examen escrito, y no puede salir de la sala antes de que termine.\",\"itemIds\":[\"enb1m12twohoursforty\"],\"tip\":\"Las instrucciones del examen van SIEMPRE en inglés y son SIEMPRE las mismas. Léelas una vez ahora, con calma, y el día D no te robarán ni un minuto.\"},{\"id\":\"enb1m12l1e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"El examen escrito y el oral se pueden hacer en días distintos.\",\"answers\":[\"The written exam and the spoken exam can be taken on different days\",\"You can take the written exam and the spoken exam on different days\",\"The written and the spoken exam can be done on different days\"],\"hint\":\"Empieza nombrando los dos exámenes\",\"itemIds\":[\"enb1m12writtenexam\",\"enb1m12spokenexam\"],\"tip\":\"Y conviene: hacer 2 h 40 de escrito y luego el oral el mismo día es pedirle a tu cabeza algo que no tienes por qué pedirle.\"},{\"id\":\"enb1m12l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el dato del reloj\",\"text\":\"The written exam lasts two hours and forty minutes.\",\"translation\":\"El examen escrito dura dos horas y cuarenta minutos.\",\"hints\":[\"Empieza por «The written exam…»\",\"… lasts two hours and forty ___\"],\"itemIds\":[\"enb1m12twohoursforty\",\"enb1m12writtenexam\"],\"tip\":\"«forty» no lleva la u de «four»: suena FÓO-ti. Y «fourteen» lleva el golpe al final. En la ficha de notas de la Parte 3 esa diferencia vale un punto.\"},{\"id\":\"enb1m12l1e12\",\"type\":\"audiomc\",\"prompt\":\"Formato examen: lee la pregunta ANTES de darle al play. Dos escuchas.\",\"audio\":\"Right, before we start: you've got the Listening first, that's about half an hour, and then straight on to the Reading and Writing. There's no break in between, so if you need water, get it now. Phones off and under your chair, please.\",\"question\":\"¿Qué avisa la persona que habla?\",\"options\":[\"Que no habrá pausa entre el Listening y el resto.\",\"Que el Listening dura hora y media.\",\"Que hay que dejar el móvil en recepción.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «about half an hour», media hora.\",\"Dice «under your chair», debajo de la silla, no en recepción.\"],\"itemIds\":[\"enb1m12writtenexam\",\"enlistencarefully\"],\"tip\":\"Fíjate en «straight on to»: es la señal de que no hay corte. Los avisos reales del examen van llenos de estos phrasal verbs, y son justo los que un hispanohablante no oye porque espera un verbo largo de origen latino.\"},{\"id\":\"enb1m12l1e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Voy a hacer el examen escrito en junio, y el oral la semana siguiente.\",\"answers\":[\"I'm going to take the written exam in June, and the spoken exam the following week\",\"I am going to take the written exam in June and the spoken exam the following week\",\"I'm going to take the written exam in June and the spoken one the week after\"],\"hints\":[\"«Hacer un examen» = take an exam\",\"I'm going to take the written exam in June, and…\"],\"itemIds\":[\"enb1m12writtenexam\",\"enb1m12spokenexam\"],\"tip\":\"Dilo en voz alta con la fecha de verdad. Poner fecha cambia cómo estudias: deja de ser «algún día» y pasa a ser una cuenta atrás.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m12-1\",\"book\":\"Let me think.\",\"real\":\"Hang on, let me think.\",\"meaning\":\"Espera, déjame pensar\",\"when\":\"En el oral, cuando la pregunta te pilla en blanco. Sirve en las cuatro partes y con cualquier interlocutor: es informal pero no descuidado. Lo que NO puedes hacer es callarte tres segundos, porque el silencio se oye en la grabación y la fluidez es un criterio entero de los cuatro.\",\"register\":\"neutral\",\"exam\":\"That's an interesting question. Let me think for a moment.\",\"note\":\"«Hang on» es literalmente «agárrate», y aquí significa «un momento». Pedir tiempo EN INGLÉS suma; quedarte callado o decir «eeeh» a la española, no. La versión de examen es más larga a propósito: mientras la dices, ya estás pensando.\",\"sound\":\"jang on, let mi zink\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m12nathangon\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Descárgate hoy el Practice Paper 1 completo y NO lo hagas. Solo míralo: cuenta las partes, mira dónde está el Writing y hazte a la idea del grosor. Lo harás entero al final de este módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe
