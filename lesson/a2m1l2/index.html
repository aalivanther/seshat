ación no se oiría: gewart\u003cb\u003eet\u003c/b\u003e, gearbeit\u003cb\u003eet\u003c/b\u003e. Y los Umlauts del infinitivo se quedan: hören → geh\u003cb\u003eö\u003c/b\u003ert.\",\"table\":[[\"infinitivo\",\"participio\"],[\"machen (hacer)\",\"gemacht\"],[\"lernen (aprender)\",\"gelernt\"],[\"spielen (jugar)\",\"gespielt\"],[\"kaufen (comprar)\",\"gekauft\"],[\"hören (escuchar)\",\"gehört — ¡la ö se queda!\"],[\"tanzen (bailar)\",\"a2m1getanzt\"],[\"warten (esperar)\",\"gewartet — raíz en -t → -tet\"],[\"arbeiten (trabajar)\",\"gearbeitet — raíz en -t → -tet\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m1l2e1\",\"type\":\"match\",\"prompt\":\"Empareja participio y traducción\",\"pairs\":[{\"target\":\"a2m1getanzt\",\"source\":\"bailado\"},{\"target\":\"a2m1gefragt\",\"source\":\"preguntado\"},{\"target\":\"a2m1gesagt\",\"source\":\"dicho\"},{\"target\":\"a2m1gewartet\",\"source\":\"esperado\"}],\"itemIds\":[\"a2m1getanzt\",\"a2m1gefragt\",\"a2m1gesagt\",\"a2m1gewartet\"]},{\"id\":\"a2m1l2e2\",\"type\":\"mc\",\"prompt\":\"Pasa por la fábrica\",\"question\":\"El participio de kaufen es ...\",\"options\":[\"gekauft\",\"gekaufen\",\"kauft\"],\"answer\":0,\"whyWrong\":[null,\"-en es de los irregulares — kaufen es regular y sale de la fábrica con -t\",\"Sin ge- delante no es participio: eso es «él compra»\"],\"itemIds\":[\"gekauft\"],\"tip\":\"kaufen → ge + kauf + t. La fábrica no falla con los regulares.\"},{\"id\":\"a2m1l2e3\",\"type\":\"cloze\",\"prompt\":\"Completa el participio\",\"text\":\"Wir haben viel ___. (bailado)\",\"answers\":[\"a2m1getanzt\"],\"translation\":\"Bailamos mucho.\",\"hints\":[\"tanzen por la fábrica\",\"ge + tanz + t\"],\"itemIds\":[\"a2m1getanzt\",\"tanzen\"]},{\"id\":\"a2m1l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa — raíz en -t\",\"text\":\"Ich habe eine Stunde ___. (esperado)\",\"answers\":[\"a2m1gewartet\"],\"translation\":\"Esperé una hora.\",\"hints\":[\"warten: la raíz acaba en -t\",\"ge + wart + et\"],\"itemIds\":[\"a2m1gewartet\",\"warten\"],\"tip\":\"warten y arbeiten piden -tet: sin esa -e- extra la terminación no se oiría.\"},{\"id\":\"a2m1l2e5\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«He comprado pan» →\",\"options\":[\"Ich habe Brot gekauft\",\"Ich habe Brot gekaufen\",\"Ich habe gekauft Brot\"],\"answer\":0,\"whyWrong\":[null,\"kaufen es regular: el participio acaba en -t, no en -en\",\"El participio va al FINAL — nada puede ir detrás\"],\"itemIds\":[\"gekauft\",\"brot\"]},{\"id\":\"a2m1l2e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"Sofia hat einen Kuchen gekauft\",\"translation\":\"Sofía compró un pastel\",\"distractors\":[\"kauft\",\"gekaufen\"],\"itemIds\":[\"gekauft\",\"kuchen\"],\"tip\":\"Con er/sie el auxiliar es hat — el participio no cambia nunca: gekauft para todos.\"},{\"id\":\"a2m1l2e7\",\"type\":\"cloze\",\"prompt\":\"Completa el participio\",\"text\":\"Was hast du ___? (dicho)\",\"answers\":[\"a2m1gesagt\"],\"translation\":\"¿Qué dijiste?\",\"hints\":[\"sagen por la fábrica\",\"ge + sag + t\"],\"itemIds\":[\"a2m1gesagt\",\"sagen\"]},{\"id\":\"a2m1l2e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Wir haben getanzt und Musik gehört\",\"translation\":\"Bailamos y escuchamos música\",\"hints\":[\"Dos participios de la fábrica\",\"getanzt ... gehört — con ö\"],\"itemIds\":[\"a2m1getanzt\",\"a2m1gehoert\",\"musik\"]},{\"id\":\"a2m1l2e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Anna preguntó\",\"answers\":[\"Anna hat gefragt\"],\"hints\":[\"fragen por la fábrica\",\"Anna hat ge...\"],\"itemIds\":[\"a2m1gefragt\"],\"tip\":\"fragen → gefragt, directo de la fábrica. Ya fabricas participios sin pensar — ese es el objetivo.\"}]}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra por A2 y busca «Perfekt»: más participios regulares para seguir fabricando.\"}]}}]\n"])</script><script>s
