eSi tú dirías «hoy fui al médico», «esta mañana desayuné tarde»\u003c/b\u003e —o sea, si hablas como en la mayor parte de Latinoamérica—, tu instinto \u003cb\u003einfrausa\u003c/b\u003e el perfecto. Vas a decir \u003ci\u003eDid you finish yet?\u003c/i\u003e y \u003ci\u003eI just arrived\u003c/i\u003e, y vas a contar tu experiencia de vida en pasado simple: \u003ci\u003eI never went to London\u003c/i\u003e en vez de \u003ci\u003eI've never been to London\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí va la aclaración que casi todos los manuales se saltan:\u003c/b\u003e «\u003ci\u003ehe ido AYER\u003c/i\u003e» \u003cb\u003eno\u003c/b\u003e es correcto tampoco en España. \u003ci\u003eAyer\u003c/i\u003e cierra el periodo y pide indefinido en todas partes del mundo hispanohablante. Lo que cambia de una orilla a otra es el periodo \u003cb\u003eabierto\u003c/b\u003e —hoy, esta semana, este año—, no el cerrado. Así que la trampa española no es «el español permite todo»: es que \u003cb\u003eel reparto español no coincide con el inglés\u003c/b\u003e, y en cada orilla falla por un lado distinto.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa solución no es pensar. Es mirar el marcador.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eEl inglés no decide por el sentimiento de cercanía, decide por una pregunta mecánica: \u003cb\u003e¿el periodo de tiempo ha terminado o sigue abierto?\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eTerminado → pasado simple, SIEMPRE\u003c/b\u003e: yesterday, last week, last year, two days ago, in 2019, when I was a child, at six o'clock.\u003cbr/\u003e· \u003cb\u003eAbierto o sin decir → present perfect\u003c/b\u003e: ever, never, just, already, yet, so far, recently, this week, this month, this year, today, three times.\u003cbr/\u003e\u003cbr/\u003e[[I saw Amy last week.|Vi a Amy la semana pasada.]] — la semana pasada acabó.\u003cbr/\u003e[[I've seen Amy this week.|He visto a Amy esta semana.]] — esta semana sigue.\u003cbr/\u003e\u003cbr/\u003eY una regla de bolsillo que vale oro en el examen: \u003cb\u003esi preguntas «cuándo», es pasado simple\u003c/b\u003e. [[When did it happen?|¿Cuándo pasó?]] — nunca \u003ci\u003eWhen have you seen her?\u003c/i\u003e, porque preguntar \u003ci\u003ecuándo\u003c/i\u003e ya cierra el periodo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se usan los dos juntos, que es lo que hace un nativo:\u003c/b\u003e se abre con el perfecto (la noticia, sin fecha) y se sigue en pasado simple (los detalles, con fecha).\u003cbr/\u003e\u003ci\u003eI've been to Scotland!\u003c/i\u003e — \u003ci\u003eReally? When did you go?\u003c/i\u003e — \u003ci\u003eI went in 2022, with Ben.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l6\",\"phaseId\":\"ena2m10\",\"title\":\"Yesterday or so far?\",\"subtitle\":\"La frontera de verdad: cuándo el inglés NO te deja usar el perfecto\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El tiempo cerrado y el tiempo abierto\",\"itemIds\":[\"ena2m10isawherlastweek\",\"ena2m10iveseenherthisweek\",\"ena2m10whendidithappen\",\"ena2m10thisweekthisyear\",\"ena2m10threetimes\",\"enyesterday\",\"ena2m1lastweek\",\"ena2m1twodaysago\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tu español te va a engañar — y de dos maneras opuestas\",\"body\":\"$17\",\"table\":[[\"marcador\",\"tiempo verbal\",\"ejemplo\"],[\"yesterday · last week · …ago · in 2019\",\"pasado simple\",\"I saw Amy last week.\"],[\"when…?\",\"pasado simple\",\"When did it happen?\"],[\"ever · never · three times\",\"present perfect\",\"I've never been to Scotland.\"],[\"just · already · yet · recently\",\"present perfect\",\"I've just arrived.\"],[\"this week · this month · today\",\"present perfect\",\"I've seen Amy this week.\"],[\"so far\",\"present perfect\",\"I've read two books so far.\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"last week (cerrado)\",\"pastExample\":\"I saw Amy last week.\",\"nowLabel\":\"this week (abierto)\",\"nowExample\":\"I've seen Amy this week.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l6e1\",\"type\":\"bucket\",\"prompt\":\"Clasifica EL MARCADOR, no el verbo — así se hace en el examen\",\"categories\":[\"cierra el periodo → pasado simple\",\"lo deja abierto → present perfect\"],\"items\":[{\"text\":\"yesterday\",\"bucket\":0},{\"text\":\"ever\",\"bucket\":1},{\"text\":\"last week\",\"bucket\":0},{\"text\":\"already\",\"bucket\":1},{\"text\":\"two days ago\",\"bucket\":0},{\"text\":\"this year\",\"bucket\":1},{\"text\":\"in 2019\",\"bucket\":0},{\"text\":\"so far\",\"bucket\":1}],\"itemIds\":[\"enyesterday\",\"ena2m1lastweek\",\"ena2m1twodaysago\",\"ena2m1in2024\",\"ena2m10thisweekthisyear\",\"ena2m10ivealreadyseenit\"],\"tip\":\"Ni una sola de estas decisiones necesita mirar el verbo. Clasificar el marcador es más rápido, más fiable y no depende de cómo hables tú en español.\"},{\"id\":\"ena2m10l6e2\",\"type\":\"mc\",\"prompt\":\"La frase que delata a medio mundo hispanohablante\",\"question\":\"«Vi a Amy ayer» / «He visto a Amy ayer». En inglés:\",\"options\":[\"I saw Amy yesterday.\",\"I have seen Amy yesterday.\",\"Las dos valen\"],\"answer\":0,\"whyWrong\":[null,\"yesterday cierra el periodo: el inglés no admite ahí el perfecto, y es el error que más se penaliza\",\"No valen las dos: con un marcador cerrado solo hay una opción\"],\"itemIds\":[\"ena2m10isawherlastweek\",\"enyesterday\"],\"tip\":\"Y ojo, porque el español tampoco lo admite: «he visto a Amy ayer» no se dice ni en España. Lo que engaña es «he visto a Amy hoy», que sí se dice — y ese hoy es periodo abierto.\"},{\"id\":\"ena2m10l6e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el sobreuso — la mitad española de la trampa\",\"wrong\":\"I have seen Amy last week.\",\"answers\":[\"I saw Amy last week.\"],\"why\":\"last week es un periodo TERMINADO, y eso obliga a pasado simple en inglés, sin excepción. Si tú dirías «he visto a Amy la semana pasada», el inglés no te sigue: la traducción es saw, a secas. Y si dirías «vi a Amy la semana pasada», ya estabas en lo correcto.\",\"translation\":\"Vi a Amy la semana pasada.\",\"itemIds\":[\"ena2m10isawherlastweek\",\"ena2m1lastweek\"]},{\"id\":\"ena2m10l6e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el infrauso — la mitad latinoamericana de la trampa\",\"wrong\":\"I never went to Scotland.\",\"answers\":[\"I've never been to Scotland.\",\"I have never been to Scotland.\"],\"why\":\"Aquí no se habla de un viaje concreto: se habla de tu vida entera hasta hoy, y eso en inglés es perfecto. Si tú dirías «nunca fui a Escocia», te va a salir el pasado simple y sonará raro en inglés; si dirías «no he estado nunca en Escocia», tu instinto acierta. Ojo también al participio: de visitas se habla con been, no con gone.\",\"translation\":\"No he estado nunca en Escocia.\",\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10ivebeento\"]},{\"id\":\"ena2m10l6e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta\",\"wrong\":\"When have you seen her?\",\"answers\":[\"When did you see her?\"],\"why\":\"Preguntar «cuándo» ya cierra el periodo: pides una fecha, y una fecha es pasado simple. El perfecto sirve justo para lo contrario, para no decir cuándo. Por eso when y have + participio no se llevan.\",\"translation\":\"¿Cuándo la viste?\",\"itemIds\":[\"ena2m10whendidithappen\"]},{\"id\":\"ena2m10l6e6\",\"type\":\"cloze\",\"prompt\":\"Completa — mira el marcador antes de decidir\",\"text\":\"I ___ Amy two days ago at the bus stop.\",\"answers\":[\"saw\"],\"translation\":\"Vi a Amy hace dos días en la parada.\",\"hints\":[\"«…ago» cierra el periodo\",\"s…\"],\"itemIds\":[\"ena2m10isawherlastweek\",\"ena2m1twodaysago\",\"enbusstop\"]},{\"id\":\"ena2m10l6e7\",\"type\":\"cloze\",\"prompt\":\"Y ahora el mismo verbo con otro marcador\",\"text\":\"I've ___ Amy three times this week.\",\"answers\":[\"seen\"],\"translation\":\"He visto a Amy tres veces esta semana.\",\"hints\":[\"«this week» sigue abierta, y detrás de have va la tercera columna\",\"s…n\"],\"itemIds\":[\"ena2m10iveseenherthisweek\",\"ena2m10thisweekthisyear\",\"ena2m10threetimes\"]},{\"id\":\"ena2m10l6e8\",\"type\":\"transform\",\"prompt\":\"Cambia el marcador y arrastra el verbo\",\"source\":\"I've seen that film this month.\",\"instruction\":\"Dilo con «last month»\",\"answers\":[\"I saw that film last month.\",\"Last month I saw that film.\"],\"translation\":\"Vi esa película el mes pasado.\",\"hints\":[\"El marcador cierra el periodo: el verbo tiene que seguirle\",\"I s… that film last month.\"],\"itemIds\":[\"ena2m10isawherlastweek\",\"ena2m10thisweekthisyear\",\"enmonth\"],\"tip\":\"Es el ejercicio que resume la lección: no cambias de idea ni de significado, cambias de marcador, y el tiempo verbal va detrás obligado.\"},{\"id\":\"ena2m10l6e9\",\"type\":\"gapbank\",\"prompt\":\"La noticia y los detalles: rellena con el banco\",\"text\":\"«I ___ never been to Scotland!» «Really? I ___ there last summer.» «And ___ you like it?» «I ___ it. We stayed in Edinburgh.»\",\"answers\":[\"have\",\"went\",\"did\",\"loved\"],\"bank\":[\"have\",\"went\",\"did\",\"loved\",\"has\",\"gone\",\"have loved\"],\"translation\":\"«¡No he estado nunca en Escocia!» «¿En serio? Yo estuve allí el verano pasado.» «¿Y te gustó?» «Me encantó. Nos quedamos en Edimburgo.»\",\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10ivebeento\",\"ena2m10whendidithappen\",\"ensummer\"],\"tip\":\"Mira el reparto: el primer hueco no lleva fecha (perfecto) y los otros tres sí (pasado simple). Así se conversa de verdad — se abre sin fecha y se continúa con fecha.\"},{\"id\":\"ena2m10l6e10\",\"type\":\"order\",\"prompt\":\"Ordena la conversación, de la noticia al detalle\",\"sentences\":[\"Guess what — I've just booked my flight!\",\"I've never been to Scotland before.\",\"My sister went there in 2022 and she loved it.\",\"She stayed in Edinburgh for a week.\",\"So I've decided to go in the summer.\"],\"translation\":\"Adivina: ¡acabo de reservar el vuelo! No he estado nunca en Escocia. Mi hermana estuvo allí en 2022 y le encantó. Se quedó una semana en Edimburgo. Así que he decidido ir en verano.\",\"itemIds\":[\"ena2m10ivejustfinished\",\"ena2m10ivebeento\",\"ena2m1in2024\",\"ensister\"],\"tip\":\"Cuenta los tiempos: perfecto, perfecto, pasado, pasado, perfecto. Los dos del medio son los únicos que llevan fecha. No es casualidad, es la regla.\"},{\"id\":\"ena2m10l6e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés — cuidado con el marcador\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Vi a Ben ayer, pero no he visto a Amy esta semana.\",\"answers\":[\"I saw Ben yesterday, but I haven't seen Amy this week.\",\"I saw Ben yesterday but I haven't seen Amy this week.\",\"I saw Ben yesterday, but I have not seen Amy this week.\"],\"hint\":\"un periodo está cerrado y el otro sigue abierto\",\"itemIds\":[\"ena2m10isawherlastweek\",\"ena2m10iveseenherthisweek\",\"enyesterday\"]},{\"id\":\"ena2m10l6e12\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"I've read two books this month, but I didn't read anything last month.\",\"answers\":[\"He leído dos libros este mes, pero el mes pasado no leí nada.\",\"Este mes he leído dos libros, pero el mes pasado no leí nada.\",\"He leído dos libros este mes, pero no leí nada el mes pasado.\"],\"itemIds\":[\"ena2m10thisweekthisyear\",\"enread\",\"enbook\"],\"tip\":\"Aquí el español y el inglés coinciden por una vez, y coinciden por la misma razón: este mes sigue abierto y el pasado no.\"},{\"id\":\"ena2m10l6e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha dos veces — la pregunta va por el tiempo verbal\",\"audio\":\"I've worked in three cafés, but I didn't like the first one. I left after two months.\",\"question\":\"¿Qué sabemos con seguridad?\",\"options\":[\"Que ha trabajado en tres cafés a lo largo de su vida\",\"Que trabaja en tres cafés ahora mismo\",\"Que sigue en el primer café\"],\"answer\":0,\"whyWrong\":[null,\"Para eso haría falta un presente: «I work in three cafés»\",\"El audio dice justo lo contrario: I left after two months\"],\"plays\":2,\"itemIds\":[\"ena2m10shesworkedin\",\"ena2m2sleptgroup\"],\"tip\":\"El perfecto suma la experiencia («tres cafés en total, sin decir cuándo») y el pasado simple entra en cuanto se cuenta un episodio concreto. Los dos en cinco segundos de audio.\"},{\"id\":\"ena2m10l6e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción — la regla entera en una frase\",\"question\":\"No he estado nunca en Escocia, pero fui a Gales el año pasado.\",\"answers\":[\"I've never been to Scotland, but I went to Wales last year.\",\"I have never been to Scotland, but I went to Wales last year.\",\"I've never been to Scotland but I went to Wales last year.\"],\"hints\":[\"Sin fecha → perfecto · con fecha → pasado simple\",\"I've n… been to Scotland, but I w… to Wales last year.\"],\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10ivebeento\",\"ena2m1lastyear\"],\"tip\":\"Ahí está el módulo entero: dos mitades, dos tiempos verbales, y quien decide no eres tú ni tu español — es el marcador.\"}]}],\"resources\":[{\"label\":\"British Council — Past simple or present perfect?\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple-present-perfect\",\"note\":\"Es la página clave del módulo. Léela dos veces: una hoy y otra al terminar la lección 9. Y haz los ejercicios subrayando el marcador antes de elegir el verbo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6eh
