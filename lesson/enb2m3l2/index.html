nt no.\u003cbr/\u003e\u003cbr/\u003eEn el teléfono: \u003ci\u003eCould you put me through to billing?\u003c/i\u003e · \u003ci\u003ePlease hold the line.\u003c/i\u003e Hold the line no es «aguanta la línea» de ropa: es no cuelgues.\",\"table\":[[\"Brusco\",\"Educado\",\"Examen\"],[\"Look at this.\",\"I was wondering if you could look at this.\",\"I would appreciate it if you could look at this.\"],[\"Check the payments.\",\"Would you mind checking the payments?\",\"I would be grateful if you could check the payments.\"],[\"Put me through.\",\"Could you put me through to billing?\",\"I would like to be put through to billing, please.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m3l2e1\",\"type\":\"match\",\"prompt\":\"Empareja la envoltura\",\"pairs\":[{\"target\":\"I was wondering if you could look at this.\",\"source\":\"pasado de cortesía + petición\"},{\"target\":\"Would you mind checking the last three payments?\",\"source\":\"mind + -ing\"},{\"target\":\"I would appreciate it if you could call me back.\",\"source\":\"la de examen\"},{\"target\":\"Could you put me through to billing?\",\"source\":\"páseme con facturación\"}],\"itemIds\":[\"enb2m3iwonderingif\",\"enb2m3wouldyoumind\",\"enb2m3iwouldappreciate\",\"enb2m3putthrough\"]},{\"id\":\"enb2m3l2e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Would you mind to check the last three payments?\",\"answers\":[\"Would you mind checking the last three payments?\"],\"why\":\"Mind lleva -ing, no to. El mismo hueco que look forward to + -ing del B1, otra pieza. *mind to es el calco de «te importaría revisar».\",\"translation\":\"¿Le importaría revisar los tres últimos pagos?\",\"itemIds\":[\"enb2m3wouldyoumind\"]},{\"id\":\"enb2m3l2e3\",\"type\":\"transform\",\"prompt\":\"Del imperativo al pasado de cortesía\",\"source\":\"Look at this.\",\"instruction\":\"Dilo con I was wondering if you could…\",\"answers\":[\"I was wondering if you could look at thi
