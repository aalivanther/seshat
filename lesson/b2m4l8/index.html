":\"Un Antrag de B2 lleva al menos un atributo o un Gerundivum. \u003ci\u003eHiermit beantrage ich die Verlängerung der in §4 genannten Frist.\u003c/i\u003e Aufgabe 2: Sie, Anrede, Gruß, puntos en orden. Aufgabe 1: foro sobre el Numerus clausus, intro, pros/contras, propuesta.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m4l8e1\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Hiermit beantrage ich dir die Verlängerung.\",\"answers\":[\"Hiermit beantrage ich die Verlängerung.\",\"Hiermit beantrage ich bei Ihnen die Verlängerung.\"],\"why\":\"beantragen no rige dativo de persona como «pedirte». El objeto es la Verlängerung. dir es además fuga de Sie.\",\"itemIds\":[\"b2m4hiermitbeantrage\",\"b2m4verlaengerung\"]},{\"id\":\"b2m4l8e2\",\"type\":\"gapbank\",\"prompt\":\"Borrador del Antrag\",\"text\":\"Hiermit beantrage ich die Verlängerung der in §4 genannt___ Frist. Die zu schreibend___ Hausarbeit umfasst eine im Ausland erbracht___ Leistung.\",\"answers\":[\"en\",\"e\",\"e\"],\"bank\":[\"en\",\"e\",\"es\",\"er\",\"em\"],\"itemIds\":[\"b2m4hiermitbeantrage\",\"b2m4abgabefrist\",\"b2m4hausarbeit\",\"b2m4anerkennung\"]},{\"id\":\"b2m4l8e3\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Antrag an Prof. Dr. Holm. Sie.\",\"scenario\":\"Eres Leo. La Abgabefrist de la Hausarbeit te pilla con una prestación extranjera por reconocer. Escribe a tu tutor, Prof. Dr. Holm. Sie. Tres puntos.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Solicita la prórroga con Hiermit y nombra la en §4 genannte Frist (un atributo).\",\"Explica la prestación a reconocer y pide tutoría (Sprechstunde).\",\"Propón una fecha y cierra con Grußformel.\"],\"checks\":[{\"re\":\"(Hiermit|beantrage)\",\"label\":\"abres con Hiermit / beantragen\"},{\"re\":\"(genannt|zu |eingericht|beschlossen|Partizip|Frist)\",\"label\":\"hay un atributo o Gerundivum\"},{\"re\":\"(Sprechstunde|Donnerstag|Termin)\",\"label\":\"pides tutoría o propones fecha\"}],\"frame\":[\"Sehr geehrter Herr Professor Holm,\",\"Hiermit beantrage ich die Verlängerung der in §4 genannten Frist.\",\"Die im Ausland erbrachte Leistung …\",\"Könnte ich in Ihre Sprechstunde kommen?\",\"Mit freundlichen Grüßen + Leo\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"weil\",\"da\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":125,\"model\":\"Sehr geehrter Herr Professor Holm,\\nhiermit beantrage ich die Verlängerung der in §4 genannten Abgabefrist. Die im Ausland erbrachte Leistung muss noch anerkannt werden, und die zu lesende Literatur ist umfangreicher als im Modulhandbuch angegeben. Deshalb bitte ich um einen Termin in Ihrer Sprechstunde am Donnerstag. Außerdem läge mir viel an einer kurzen Rückmeldung des Prüfungsamts zur Anerkennung. Das Transcript und die Modulbeschreibungen lege ich bei. Die wissenschaftliche Betreuung haben Sie bereits übernommen; dafür danke ich Ihnen. Ich bitte um eine kurze schriftliche Bestätigung des Eingangs.\\nMit freundlichen Grüßen\\nLeo\",\"itemIds\":[\"b2m4hiermitbeantrage\",\"b2m4verlaengerung\",\"b2m4abgabefrist\",\"b2m4anerkennung\",\"b2m4zulesende\",\"b2m4sprechstunde\",\"b2m4pruefungsamt\",\"b2m4transcript\",\"b2m4modulbeschreibung\",\"b2m4wibetreuung\"]},{\"id\":\"b2m4l8e4\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Foro: Numerus clausus.\",\"scenario\":\"En un foro universitario alguien afirma que el NC es la única forma justa de repartir plazas. Escribe un comentario: concede, ventaja e inconveniente, propuesta (Fachhochschule, Betreuung, Anerkennung) y cierra. Un atributo o un Gerundivum.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Paula H.\",\"text\":\"Ohne Numerus clausus bricht das System zusammen. Wer bessere Noten hat, bekommt den Platz. Das zu lösende Problem ist nicht der NC, sondern die faulen Bewerber.\"},\"bullets\":[\"Concede que las plazas son limitadas y marca dónde no estás de acuerdo.\",\"Ventaja e inconveniente del NC, con un atributo.\",\"Propón una vía (FH, tutoría, reconocimiento) y cierra.\"],\"checks\":[{\"re\":\"(zwar|allerdings|stimme)\",\"label\":\"concedas\"},{\"re\":\"(Vorteil|Nachteil)\",\"label\":\"ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|Fachhochschule|Betreuung|Anerkennung)\",\"label\":\"propuesta\"}],\"frame\":[\"Zu dem Beitrag von Paula H. …\",\"Zwar … Allerdings …\",\"Die vom Senat beschlossene Regelung …\",\"Ein zu prüfender Weg ist die Fachhochschule.\",\"Deshalb …\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":185,\"model\":\"Zu dem Beitrag von Paula H. möchte ich Folgendes sagen: Zwar sind die Plätze knapp, das bestreitet niemand. Allerdings ist «faule Bewerber» keine Analyse. Ein Vorteil des Numerus clausus ist die klare Zulassung. Ein Nachteil sind die ständig steigenden Hürden für alle, deren Noten knapp darunter liegen. Die vom Senat beschlossene Regelung löst das zu lösende Problem nicht, sie verschiebt es. Deshalb sollte die wissenschaftliche Betreuung früher ansetzen, und die Anerkennung von Abschlüssen der Fachhochschule erleichtert werden. Außerdem gehört in jede Studienordnung ein Satz zu den Leistungspunkten, den auch ein Erstsemester versteht. Die zu prüfenden Nachweise — Transcript und Modulbeschreibung — müssen klar sein, bevor jemand einen Antrag stellt. Was mich daran stört, ist vor allem die Lücke zwischen Sprechstunde und Paragraph. Deshalb plädiere ich für eine Ordnung, die auch ohne Sprechstunde verständlich ist, und für eine Betreuung, auf die man sich stützen kann.\",\"itemIds\":[\"b2m4nc\",\"b2m4zulassung\",\"b2m4steigendepreise\",\"b2m4langenattribut\",\"b2m4zuloesende\",\"b2m4wibetreuung\",\"b2m4anerkennung\",\"b2m4fachhochschule\",\"b2m4studienordnung\",\"b2m4leistungspunkte\"]},{\"id\":\"b2m4l8extra1\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Nachricht Sie. Off-topic = 0.\",\"scenario\":\"Eres Leo. La noch nicht anerkannte Leistung extranjera te bloquea la Abgabefrist. Escribes a tu tutora, Frau Schuster, Sie: pide prórroga y nombra la prestación con atributo participial.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Nombra el motivo en la primera frase, con Sie.\",\"Pide una acción concreta y un plazo.\",\"Cierra con Grußformel.\"],\"checks\":[{\"re\":\"(Sehr geehrte|Guten Tag)\",\"label\":\"hay Anrede\"},{\"re\":\"(bitte|könnten|würde ich)\",\"label\":\"hay una petición\"},{\"re\":\"(Mit freundlichen Grüßen|Freundliche Grüße)\",\"label\":\"hay Gruß\"}],\"frame\":[\"Anrede Sie\",\"motivo\",\"petición + plazo\",\"Gruß + nombre\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"weil\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":120,\"model\":\"Sehr geehrte Frau Schuster,\\ndie noch nicht anerkannte ausländische Leistung blockiert meine Abgabefrist, weil das Amt den Bescheid erst in drei Wochen schickt. Die zu schreibende Hausarbeit kann ich ohne diese Anerkennung nicht abschließen. Deshalb bitte ich Sie, die Frist um vierzehn Tage zu verlängern. Außerdem könnte ich den bereits fertigen Teil am Montag abgeben, damit Sie sehen, dass ich nicht warte. Allerdings ändert eine mündliche Zusage nichts, solange nichts Schriftliches vorliegt. Ich stehe für Rückfragen gern zur Verfügung. Eine kurze schriftliche Bestätigung reicht. Eine kurze schriftliche Bestätigung reicht.\\nMit freundlichen Grüßen\\nLeo\",\"itemIds\":[],\"tip\":\"Menos de 50 palabras o tema equivocado: 0. Ni un du.\"},{\"id\":\"b2m4l8extra2\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag. Off-topic = 0.\",\"scenario\":\"Foro universitario: alguien dice que el NC es la única forma justa. Tú reaccionas con die zu vergebenden Plätze y un criterio que no sea solo nota. Off-topic = 0.\",\"genre\":\"forum\",\"stimulus\":{\"a
