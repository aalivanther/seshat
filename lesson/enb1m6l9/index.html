e been really stressed lately\u003c/i\u003e), las relativas del módulo 2 (\u003ci\u003ethe doctor who saw me\u003c/i\u003e) y el estilo indirecto del módulo 3 (\u003ci\u003eshe told me to rest\u003c/i\u003e). No son temas nuevos: son las tres cosas que el examen espera oír en cualquier monólogo de B1, digas de lo que digas.\u003cbr/\u003e\u003cbr/\u003eUn último aviso de vocabulario, que es el que más cara le cambia a un texto: \u003cb\u003e\u003ci\u003eadvice\u003c/i\u003e es incontable\u003c/b\u003e. \u003ci\u003eSome good advice\u003c/i\u003e, \u003ci\u003ea piece of advice\u003c/i\u003e, nunca «two advices». Y el verbo se escribe con s: \u003ci\u003eadvise\u003c/i\u003e."])</script><script>self.__next_f.push([1,"18:T663,"])</script><script>self.__next_f.push([1,"You look terrible.|Thanks, Amy. That is exactly what I needed this morning.|I mean it. How long have you had that cough?|Ten days? Twelve. It must be twelve, because it started the Saturday of the market.|And you still haven't rung the surgery.|I rang on Monday. They gave me an appointment for the fourteenth.|That's three weeks away.|That's what I said. The receptionist told me that if it got worse I should ring 111, and that if I couldn't breathe I should go straight to A\u0026E.|Which is correct, by the way. People are rude to receptionists and they shouldn't be. She is reading you the map. She isn't the one who drew it.|I know. I wasn't rude.|Good. Right, listen. A cough after a cold is normal for three weeks. It can't be anything serious if you're sleeping and eating and you haven't got a temperature. Have you got a temperature?|No.|Then it might just be the tail end of the virus. But twelve days with no improvement at all is a different thing from twelve days getting slowly better. Which is it?|Slowly better, I suppose. It was worse last week.|Then you probably don't need the fourteenth of anything.|You sound very sure.|I'm not sure. That's the point. I'm a nurse on a ward, not your GP, and I would  gave me an appointment for the fourteenth.|That's three weeks away.|That's what I said. The receptionist told me that if it got worse I should ring 111, and that if I couldn't breathe I should go straight to A\u0026E.|Which is correct, by the way. People are rude to receptionists and they shouldn't be. She is reading you the map. She isn't the one who drew it.|I know. I wasn't rude.|Good. Right, listen. A cough after a cold is normal for three weeks. It can't be anything serious if you're sleeping and eating and you haven't got a temperature. Have you got a temperature?|No.|Then it might just be the tail end of the virus. But twelve days with no improvement at all is a different thing from twelve days getting slowly better. Which is it?|Slowly better, I suppose. It was worse last week.|Then you probably don't need the fourteenth of anything.|You sound very sure.|I'm not sure. That's the point. I'm a nurse on a ward, not your GP, and I would rather tell you what to watch for than tell you what it is. If you start coughing anything up, or if it comes back after it has gone, that's when you ring.|And the appointment?|Keep it. If you're better you cancel it, and somebody else gets it that morning. Don't just not turn up.|Nobody ever tells you that bit.|Nobody ever tells you any of it. That's why people end up in A\u0026E at eleven at night with a sore throat."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l9\",\"phaseId\":\"enb1m6\",\"title\":\"All in all\",\"subtitle\":\"Resumir, cuidarse y hablar minuto y medio de salud sin repetir «I think»\",\"minutes\":25,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las cinco frases del cierre\",\"itemIds\":[\"enb1m4allinall\",\"enb1m6tosumup\",\"enb1m6stressed\",\"enb1m6getsomerest\",\"enb1m6takecareofyourself\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se monta un monólogo sobre salud\",\"body\":\"$17\",\"table\":[[\"Paso\",\"Frase tipo\"],[\"1. Anunciar\",\"I'd like to talk about how I look after myself.\"],[\"2. Un caso concreto\",\"Last winter I came down with something and carried on working.\"],[\"3. Deducir y opinar\",\"It must have been the stress. I probably won't do that again.\"],[\"4. Cerrar\",\"All in all, I've learnt to stop earlier.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre el módulo entero\",\"pairs\":[{\"target\":\"a GP\",\"source\":\"un médico de cabecera\"},{\"target\":\"a prescription\",\"source\":\"una receta\"},{\"target\":\"a sore throat\",\"source\":\"dolor de garganta\"},{\"target\":\"a rash\",\"source\":\"un sarpullido\"},{\"target\":\"a sick note\",\"source\":\"un justificante médico\"}],\"targetSeconds\":24,\"itemIds\":[\"enb1m6gp\",\"ena2m8aprescription\",\"ena2m8ihaveasorethroat\",\"enb1m6rash\",\"enb1m6sicknote\"],\"tip\":\"Cinco palabras que hace nueve días no tenías. Si salen en veinticuatro segundos, están dentro; si tardas, vuelve a la lección 4 antes del monólogo.\"},{\"id\":\"enb1m6l9e2\",\"type\":\"mc\",\"prompt\":\"El incontable que todo el mundo pluraliza\",\"question\":\"«Me dio dos consejos» →\",\"options\":[\"She gave me two pieces of advice.\",\"She gave me two advices.\",\"She gave me two advice.\"],\"answer\":0,\"whyWrong\":[null,\"«advice» no tiene plural, igual que «information» o «news». «Advices» no existe.\",\"Sin plural pero con «two» delante tampoco funciona: hay que contarlo con «pieces of».\"],\"itemIds\":[\"ena2m5apieceofadvice\",\"ena2m5uncountablegroup\",\"enb1m6advisedmeto\"],\"tip\":\"Los diez incontables del A2 vuelven aquí porque «advice» es el que más sale en un módulo de salud. Y el verbo, con s: «she advised me to rest».\"},{\"id\":\"enb1m6l9e3\",\"type\":\"bucket\",\"prompt\":\"Los mismos modales, dos oficios: ¿deduce u obliga?\",\"categories\":[\"Deduce (lo que creo que pasa)\",\"Obliga (lo que hay que hacer)\"],\"items\":[{\"text\":\"It must be the flu.\",\"bucket\":0},{\"text\":\"You must register with a GP first.\",\"bucket\":1},{\"text\":\"She can't be at home.\",\"bucket\":0},{\"text\":\"You mustn't take more than eight a day.\",\"bucket\":1},{\"text\":\"He might be at the surgery.\",\"bucket\":0},{\"text\":\"You have to bring proof of address.\",\"bucket\":1}],\"itemIds\":[\"enb1m6mustbe\",\"enb1m6cantbe\",\"enb1m6registerwith\"],\"tip\":\"Este ejercicio es el módulo entero en seis frases. El truco para decidirlo en un segundo: si el sujeto es «you» y hay alguien mandando, obliga; si el hablante está sacando una conclusión de algo que ve, deduce.\"},{\"id\":\"enb1m6l9e4\",\"type\":\"errorfix\",\"prompt\":\"Vuelve el error del módulo 3. Cambia UNA palabra.\",\"wrong\":\"She said me that it wasn't serious.\",\"answers\":[\"She told me that it wasn't serious.\"],\"why\":\"«say» no admite persona detrás: o «she said that…» o «she told ME that…». El español no distingue —«me dijo» sirve para las dos— y por eso este error sobrevive a todos los módulos si nadie lo caza.\",\"translation\":\"Me dijo que no era grave.\",\"itemIds\":[\"enb1m3toldmethat\"]},{\"id\":\"enb1m6l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa el balance\",\"text\":\"___ in all, the system worked.\",\"answers\":[\"All\",\"all\"],\"translation\":\"En conjunto, el sistema funcionó.\",\"hints\":[\"Es la misma palabra que aparece después de «in»\",\"Tres letras\"],\"itemIds\":[\"enb1m4allinall\"],\"tip\":\"«All in all» se dice entero o no se dice: no existe «in all» solo con ese sentido. Y va siempre al principio de la frase, con coma detrás.\"},{\"id\":\"enb1m6l9e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el balance de Valeria\",\"text\":\"___ , the system worked. The wait was long, ___ . I ___ probably go back to work on Monday, and I ___ have to take anything else.\",\"answers\":[\"All in all\",\"though\",\"will\",\"don't\"],\"bank\":[\"All in all\",\"though\",\"will\",\"don't\",\"might\",\"mustn't\",\"otherwise\"],\"translation\":\"En conjunto, el sistema funcionó. La espera fue larga, eso sí. Seguramente vuelva al trabajo el lunes, y no me hace falta tomar nada más.\",\"itemIds\":[\"enb1m4allinall\",\"enb1m5though\",\"enb1m6willprobably\",\"enb1m6donthaveto\"],\"tip\":\"Cuatro huecos y cuatro cosas distintas del módulo: el conector de cierre, el de contraste final, el adverbio en su sitio y la diferencia entre «no hace falta» y «está prohibido». Si los cuatro te salen, el módulo está.\"},{\"id\":\"enb1m6l9e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «feeling» y sin «great»\",\"source\":\"I'm not feeling too great.\",\"forbid\":[\"feeling\",\"great\"],\"answers\":[\"I'm not very well\",\"I don't feel well\",\"I'm not well at all\"],\"translation\":\"No me encuentro muy allá.\",\"hints\":[\"Puedes cambiar el verbo por su forma simple\",\"I don't ...\"],\"itemIds\":[\"enb1m6natnottoogreat\"],\"tip\":\"Tres maneras de decir lo mismo, de la más británica a la más neutra. En el Writing formal usa la neutra; en el Speaking, la que te salga primero — lo que puntúa es no callarse.\"},{\"id\":\"enb1m6l9e8\",\"type\":\"transform\",\"prompt\":\"Del consejo directo al consejo envuelto\",\"source\":\"Rest for a few days.\",\"instruction\":\"Dilo con «You should» y añade el motivo con «otherwise»\",\"answers\":[\"You should rest for a few days, otherwise you won't get over it\",\"You should rest for a few days; otherwise you won't get over it\",\"You should rest for a few days, otherwise you'll be back at the doctor's\"],\"translation\":\"Deberías descansar unos días; si no, no te lo vas a quitar de encima.\",\"hints\":[\"Empieza envolviendo el imperativo\",\"You should rest for a few days, otherwise ...\"],\"itemIds\":[\"enb1m6youshouldsee\",\"enb1m6getover\",\"enb1m2otherwise\"],\"tip\":\"Un consejo con motivo puntúa el doble que un consejo a secas: cumple la función y además enseña un conector. Es la jugada más rentable del Speaking Part 3.\"},{\"id\":\"enb1m6l9e9\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"Health: how I look after myself, and a time when I ignored it\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about how I look after myself. I'll say three things.»\"},{\"title\":\"2. What I normally do\",\"hint\":\"Rutina, en presente y con phrasal verbs: «I've cut down on… I try to get some rest… I gave up…»\"},{\"title\":\"3. The time I ignored it\",\"hint\":\"Un caso concreto, en pasado y con estilo indirecto: «I came down with something and carried on working. The doctor told me to…»\"},{\"title\":\"4. Deduce and close\",\"hint\":\"Deduce la causa y haz balance: «It must have been the stress… I probably won't do that again. All in all…»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Usé al menos tres phrasal verbs del módulo (come down with, get over, look after, cut down on, give up, carry on)\",\"Deduje algo al menos una vez (must be / can't be / might be)\",\"Usé al menos un conector de contraste y uno de cierre (though, in spite of, all in all, to sum up)\",\"Conté al menos una cosa en estilo indirecto (the doctor told me / she said that…)\",\"No dije ni un «said me» ni un «I have it since…»\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 3, para que el resto sea tuyo: «Last February I came down with something and I carried on working for a week, because we were short-staffed and I didn't want to let anybody down. By the Friday I couldn't talk. The GP told me to stay at home for four days and said I should have rung her on the Monday. It must have been the stress as much as the virus, to be honest.»\",\"itemIds\":[\"enb1m6natcomedownwith\",\"enb1m6getover\",\"enb1m6lookafter\",\"enb1m6carryon\",\"enb1m4allinall\",\"enb1m6stressed\"],\"tip\":\"La salud es el tema perfecto para este módulo porque no se puede contar sin deducir: nadie sabe seguro por qué se puso malo. Y si te falta un dato, «as far as I know» te saca del apuro sin mentir.\"},{\"id\":\"enb1m6l9e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"He estado muy estresada últimamente y necesito descansar.\",\"answers\":[\"I've been really stressed lately and I need to get some rest\",\"I have been really stressed lately and I need to get some rest\",\"I've been very stressed lately and I need to get some rest\"],\"hint\":\"La primera mitad es present perfect: empezó antes y sigue\",\"itemIds\":[\"enb1m6stressed\",\"enb1m6getsomerest\",\"enb1m1havelivedhere\"],\"tip\":\"«Lately» es marcador de present perfect, como «so far» o «recently»: si lo pones con pasado simple, chirría. Es el módulo 1 asomando en mitad del 6.\"},{\"id\":\"enb1m6l9e11\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre: escribe la frase que oyes\",\"text\":\"All in all, the system worked.\",\"translation\":\"En conjunto, el sistema funcionó.\",\"hints\":[\"Empieza por el conector de balance\",\"All in all, the system ...\"],\"itemIds\":[\"enb1m4allinall\"],\"tip\":\"«All in all» suena «oo-lin-OOL», casi una sola palabra. Escríbela con sus tres piezas y su coma: en el examen escrito, la coma es parte del criterio.\"},{\"id\":\"enb1m6l9e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Cuídate y descansa: seguramente no te haga falta nada más.\",\"answers\":[\"Take care of yourself and get some rest: you probably won't need anything else\",\"Take care of yourself and get some rest. You probably won't need anything else\",\"Take care of yourself and get some rest, you probably won't need anything else\"],\"hints\":[\"Las dos primeras son imperativos, que entre amigos sí valen\",\"Take care of yourself and get some rest: you probably ...\"],\"itemIds\":[\"enb1m6takecareofyourself\",\"enb1m6getsomerest\",\"enb1m6probablywont\"],\"tip\":\"Ojo: el imperativo pelado con un amigo es normal («take care», «get some rest»). Lo que suena a orden es en una carta formal o pidiéndole algo a un desconocido. El registro depende de a quién le hablas, no de la forma en sí.\"},{\"id\":\"enb1m6l9e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy hace balance en la cocina. Dos escuchas.\",\"audio\":\"So how was it, in the end? The whole thing.|Honestly? Better than I expected. The phone appointment was the same day, and the prescription was at the chemist's before I got there.|And the specialist?|That's the other half of the story. The referral went in on the ninth and I'm still waiting. Eleven weeks, they said, and that's the good list.|Mmm. That's the bit nobody defends.|No. All in all it worked, though. I didn't pay a penny and nobody asked me what I earn. Where I'm from, that second part isn't obvious.\",\"question\":\"¿Cuál es el balance de Valeria?\",\"options\":[\"Que funcionó, aunque la espera del especialista es larguísima\",\"Que no funcionó en absoluto\",\"Que lo peor fue tener que pagar la receta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice literalmente «All in all it worked, though».\",\"Dice justo lo contrario: «I didn't pay a penny».\"],\"itemIds\":[\"enb1m4allinall\",\"enb1m5though\",\"enb1m6referral\",\"enb1m6freeatthepoint\"],\"tip\":\"Fíjate en el orden del balance: primero lo bueno, después lo malo, y el «though» del final devuelve el peso al lado bueno. Cambiar el orden cambia la conclusión — y el Listening Part 2 pregunta exactamente por eso.\"},{\"id\":\"enb1m6l9e14\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, cinco preguntas. Léelas TODAS antes del play y usa el cuaderno. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Cuánto tiempo lleva Valeria con la tos?\",\"options\":[\"Doce días\",\"Diez días exactos\",\"Tres semanas\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"«Ten days?» es la primera cifra, y se corrige a sí misma en la frase siguiente: «Twelve. It must be twelve».\",\"Tres semanas es lo que falta para la cita, y también lo que Amy dice que dura una tos normal.\"],\"itemIds\":[\"enb1m6ivehaditfor\",\"enb1m6mustbe\"],\"tip\":\"Cuando alguien se corrige en voz alta, la buena es la SEGUNDA. Es un recurso clásico del examen: mete la cifra falsa primero para ver si apuntas y dejas de escuchar.\"},{\"id\":\"enb1m6l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: la deducción de Amy.\",\"audio\":\"$19\",\"question\":\"¿En qué se apoya Amy para decir que no puede ser nada grave?\",\"options\":[\"En que duerme, come y no tiene fiebre\",\"En que la cita es dentro de tres semanas\",\"En que ella es enfermera y lo ha visto mil veces\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La fecha de la cita no dice nada del cuadro: es lo que Amy acaba discutiendo, no en lo que se apoya.\",\"Dice justo lo contrario: que es enfermera de planta y no su médica de cabecera, y que por eso no da un diagnóstico.\"],\"itemIds\":[\"enb1m6cantbe\",\"enb1m6symptom\",\"enb1m6mightbe\"],\"tip\":\"«It can't be anything serious IF…» — el modal de deducción viene con su prueba pegada. En el examen, cuando oigas must be o can't be, apunta lo que va detrás del if o del because: ahí está la respuesta.\"},{\"id\":\"enb1m6l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: actitud.\",\"audio\":\"$1a\",\"question\":\"¿Qué piensa Amy de cómo trata la gente a los recepcionistas del centro de salud?\",\"options\":[\"Que no es justo: leen el mapa, no lo han dibujado\",\"Que tienen razón, porque dan citas imposibles\",\"Que da igual, porque quien decide es el médico\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Amy dice expresamente «they shouldn't be» rudos. La cita de tres semanas le parece mal, pero no culpa a quien la da.\",\"No dice que dé igual: dedica dos frases a defenderlos, que es lo contrario de restarle importancia.\"],\"itemIds\":[\"enb1m6receptionist\",\"enb1m6attitude\",\"enb1m6notwhattheysay\"],\"tip\":\"Las preguntas de actitud no se contestan con lo que se dice, sino con la metáfora que alguien elige. «She is reading you the map. She isn't the one who drew it» vale por un párrafo entero.\"},{\"id\":\"enb1m6l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: el matiz que decide.\",\"audio\":\"$1b\",\"question\":\"¿Qué distinción hace Amy con los doce días?\",\"options\":[\"Entre doce días sin ninguna mejora y doce días mejorando poco a poco\",\"Entre doce días de tos y tres semanas de gripe\",\"Entre lo que dura un virus y lo que dura una alergia\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Las tres semanas son la duración normal de una tos, no un término de la comparación.\",\"De alergias no se habla en este audio.\"],\"itemIds\":[\"enb1m6getover\",\"enb1m6goodchance\",\"enb1m6unlikely\"],\"tip\":\"El mismo dato —doce días— significa dos cosas distintas según la curva. Esto es exactamente lo que el Listening Part 4 llama «contraste», y suele ser el ítem más difícil del audio.\"},{\"id\":\"enb1m6l9e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5, y hay que deducirla.\",\"audio\":\"$1c\",\"question\":\"¿Por qué le dice Amy que no anule la cita ya, pero que tampoco falte sin avisar?\",\"options\":[\"Porque si la anula a tiempo esa mañana la aprovecha otra persona\",\"Porque anularla le costaría dinero\",\"Porque sin cita no le darían la baja\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"En el NHS la cita con el médico de cabecera no se paga, y en este audio nadie habla de dinero.\",\"La baja —el sick note— no sale en la conversación.\"],\"itemIds\":[\"enb1m6bookanappointment\",\"enb1m6turnup\",\"enb1m6donthaveto\"],\"tip\":\"«Don't just not turn up» — doble negación seguida, que en inglés no se anula: la primera niega la orden y la segunda, la acción. Suena rarísimo y se oye a diario.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1d\",\"6\",{}]]\n"])</script></body></html>
