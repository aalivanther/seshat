s/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8c2,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. El módulo 1 se llevó el Listening Part 1; el 2, el Reading Part 1; el 3, el Listening Part 3. Hoy toca el \u003cb\u003eReading Part 2\u003c/b\u003e, y le toca a este módulo por un motivo muy concreto: \u003cb\u003elo que se prueba ahí es literalmente cohesión y contraste\u003c/b\u003e — es decir, los conectores que llevas nueve lecciones aprendiendo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl formato, exacto:\u003c/b\u003e un texto de unas 250 palabras al que le han quitado \u003cb\u003eseis frases\u003c/b\u003e. Debajo hay \u003cb\u003esiete\u003c/b\u003e: seis van en su sitio y \u003cb\u003euna sobra\u003c/b\u003e. Vale 6 puntos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que NO se hace:\u003c/b\u003e leer el hueco y buscar la frase que «tenga que ver con el tema». Todas tienen que ver con el tema — están escritas para eso.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que sí se hace: buscar las tres señales.\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eReferencia hacia atrás.\u003c/b\u003e Una frase que empieza por \u003ci\u003ethis\u003c/i\u003e, \u003ci\u003ethat\u003c/i\u003e, \u003ci\u003ethese\u003c/i\u003e, \u003ci\u003esuch\u003c/i\u003e, \u003ci\u003eit\u003c/i\u003e, \u003ci\u003ethem\u003c/i\u003e, \u003ci\u003enone of those\u003c/i\u003e está agarrada a algo que va JUSTO ANTES. Busca ese algo y tendrás el hueco.\u003cbr/\u003e2. \u003cb\u003eEl conector.\u003c/b\u003e Si la frase empieza por \u003ci\u003ehowever\u003c/i\u003e, \u003ci\u003eeven so\u003c/i\u003e, \u003ci\u003eon the other hand\u003c/i\u003e, lo que va delante tiene que decir \u003cb\u003elo contrario\u003c/b\u003e. Si empieza por \u003ci\u003ebesides\u003c/i\u003e o \u003ci\u003efor instance\u003c/i\u003e, lo que va delante va en \u003cb\u003ela misma dirección\u003c/b\u003e. Este es el punto donde el módulo entero se cobra.\u003cbr/\u003e3. \u003cb\u003eLa repetición léxica.\u003c/b\u003e Si la frase habla de \u003ci\u003ethe machine\u003c/i\u003e y el párrafo anterior habla de \u003ci\u003ea machine by the front door\u003c/i\u003e, están cosidas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa estrategia, en orden:\u003c/b\u003e lee el texto entero de un tirón sin mirar las frases · empieza por los huecos \u003cb\u003efáciles\u003c/b\u003e y tacha esas frases de la lista · \u003cb\u003edeja para el final el hueco que no ves\u003c/b\u003e, porque para entonces solo quedarán dos candidatas · y no dejes ningún hueco en blanco: \u003cb\u003eno se resta por fallar\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la trampa de la frase que sobra:\u003c/b\u003e no intentes adivinar cuál es al principio. La descubres al final, cuando ya has colocado las demás. Si te obsesionas con ella desde el minuto uno, pierdes seis puntos por buscar el que no existe.\u003cbr/\u003e\u003cbr/\u003eHoy vas a hacer una versión de cuatro huecos y cinco frases, para que el mecanismo se vea entero sin que se te vaya la mañana."])</script><script>self.__next_f.push([1,"18:T6ae,"])</script><script>self.__next_f.push([1,"Lee el texto entero primero, sin mirar las frases. Los huecos van marcados \u003cb\u003e[1]\u003c/b\u003e, \u003cb\u003e[2]\u003c/b\u003e, \u003cb\u003e[3]\u003c/b\u003e y \u003cb\u003e[4]\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eLast month a supermarket in my town put a machine by the front door. You feed it your empty plastic bottles and it gives you twenty pence for each one. \u003cb\u003e[1]\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eThe idea is not new. Germany has had one since 2003, and in Norway more than nine out of ten bottles come back. \u003cb\u003e[2]\u003c/b\u003e The interesting question is not whether the machines work, but why they took so long to arrive here.\u003cbr/\u003e\u003cbr/\u003ePart of the answer is money. Somebody has to pay for the machine, for the lorry and for the counting. \u003cb\u003e[3]\u003c/b\u003e Supermarkets argued for years that it should be the councils; the councils said it should be the drinks companies.\u003cbr/\u003e\u003cbr/\u003eThere is also a quieter reason. \u003cb\u003e[4]\u003c/b\u003e A deposit is not a fine and it is not a favour: it is your own money, coming back. That small difference changes how people behave in a way that [[leaflets|folletos]] never have.\u003cbr/\u003e\u003cbr/\u003eTwo weeks in, the machine at my supermarket has already broken down twice, and the queue on Saturday morning is long enough to be annoying. Even so, I have not seen a single plastic bottle on that [[pavement|acera]] since it arrived.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLAS CINCO FRASES\u003c/b\u003e (cuatro van en su sitio, una sobra):\u003cbr/\u003e\u003cb\u003eA.\u003c/b\u003e In the first three days it took in eleven thousand of them.\u003cbr/\u003e\u003cb\u003eB.\u003c/b\u003e The technology has been working perfectly well for twenty years.\u003cbr/\u003e\u003cb\u003eC.\u003c/b\u003e That is not a small bill, and nobody volunteered to pay it.\u003cbr/\u003e\u003cb\u003eD.\u003c/b\u003e People do not like being told what to do, but they do like getting something back.\u003cbr/\u003e\u003cb\u003eE.\u003c/b\u003e Most of the bottles are made in factories outside the country."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l10\",\"phaseId\":\"enb1m8\",\"title\":\"Exam lab: Reading Part 2\",\"subtitle\":\"Un texto con seis agujeros, siete frases donde elegir y una que sobra\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de la consigna\",\"itemIds\":[\"enb1m8oneextrasentence\",\"enb1m8refersback\",\"enmissingsentence\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es el Part 2, y por qué este módulo es el que le toca\",\"body\":\"$17\",\"table\":[[\"Señal en la frase\",\"Qué significa\",\"Dónde va\"],[\"This / that / these / them\",\"referencia hacia atrás\",\"justo detrás de lo que nombra\"],[\"However / even so\",\"gira el sentido\",\"detrás de algo que dice lo contrario\"],[\"Besides / for instance\",\"sigue en la misma dirección\",\"detrás de algo que apoya lo mismo\"],[\"Repite una palabra del texto\",\"cosido léxico\",\"junto a esa palabra\"]]}},{\"kind\":\"note\",\"title\":\"El texto de hoy\",\"note\":{\"title\":\"THE TWENTY-PENCE BOTTLE — cuatro huecos, cinco frases\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Reading Part 2, ¿qué se hace primero?\",\"options\":[\"Leer el texto entero de un tirón, sin mirar todavía las frases\",\"Leer las siete frases y buscar cuál sobra\",\"Ir hueco por hueco desde el principio, sin leer el resto\"],\"answer\":0,\"whyWrong\":[null,\"Buscar la que sobra al principio es la trampa: se descubre al final, por descarte, cuando ya has colocado las demás.\",\"Sin haber leído el final no sabes hacia dónde va el texto, y el Part 2 va justo de eso.\"],\"itemIds\":[\"enb1m8oneextrasentence\",\"enmissingsentence\"],\"tip\":\"El texto de este ejercicio tiene un plan: presenta, generaliza, explica y remata. Si no lo lees entero, cada hueco parece resoluble de tres maneras.\"},{\"id\":\"enb1m8l10e2\",\"type\":\"mc\",\"prompt\":\"HUECO [1] — «…it gives you twenty pence for each one. [1]»\",\"question\":\"¿Qué frase va en el hueco 1?\",\"options\":[\"In the first three days it took in eleven thousand of them.\",\"The technology has been working perfectly well for twenty years.\",\"Most of the bottles are made in factories outside the country.\"],\"answer\":0,\"whyWrong\":[null,\"Habla de tecnología, y ahí todavía no se ha dicho que la tecnología sea vieja: eso viene en el párrafo siguiente.\",\"No se engancha a nada: ni a «twenty pence», ni a la máquina, ni a lo que viene después.\"],\"itemIds\":[\"enb1m8refersback\",\"enb1m8depositscheme\"],\"tip\":\"La señal es el «them» del final: se refiere a las botellas de la frase anterior. Y el «it» del principio, a la máquina. Dos referencias hacia atrás en una sola frase: eso es un hueco regalado.\"},{\"id\":\"enb1m8l10e3\",\"type\":\"mc\",\"prompt\":\"HUECO [2] — «…in Norway more than nine out of ten bottles come back. [2] The interesting question is not whether the machines work…»\",\"question\":\"¿Qué frase va en el hueco 2?\",\"options\":[\"That is not a small bill, and nobody volunteered to pay it.\",\"The technology has been working perfectly well for twenty years.\",\"Most of the bottles are made in factories outside the country.\"],\"answer\":1,\"whyWrong\":[\"Habla de dinero, y el dinero no aparece hasta el párrafo siguiente. Además «that» no tiene a qué referirse aquí.\",null,\"Sigue sin engancharse a nada, ni por delante ni por detrás.\"],\"itemIds\":[\"enb1m8refersback\"],\"tip\":\"Aquí la señal está en lo que viene DESPUÉS: «The interesting question is not whether the machines work». Para poder decir eso, el texto tiene que haber dicho antes que funcionan. Los huecos también se resuelven mirando hacia delante.\"},{\"id\":\"enb1m8l10e4\",\"type\":\"mc\",\"prompt\":\"HUECO [3] — «Somebody has to pay for the machine, for the lorry and for the counting. [3] Supermarkets argued for years that it should be the councils…»\",\"question\":\"¿Qué frase va en el hueco 3?\",\"options\":[\"That is not a small bill, and nobody volunteered to pay it.\",\"People do not like being told what to do, but they do like getting something back.\",\"Most of the bottles are made in factories outside the country.\"],\"answer\":0,\"whyWrong\":[null,\"Esa habla de cómo se comporta la gente, no de quién paga. Y el párrafo entero va de dinero.\",\"Tercera vez que aparece y tercera vez que no encaja. Empieza a sospechar.\"],\"itemIds\":[\"enb1m8refersback\",\"enb1m8mostofthe\"],\"tip\":\"«That is not a small bill» recoge en dos palabras la lista de gastos de antes, y «nobody volunteered to pay it» abre la discusión de después. La frase correcta casi siempre está cosida por los dos lados.\"},{\"id\":\"enb1m8l10e5\",\"type\":\"mc\",\"prompt\":\"HUECO [4] — «There is also a quieter reason. [4] A deposit is not a fine and it is not a favour…»\",\"question\":\"¿Qué frase va en el hueco 4?\",\"options\":[\"In the first three days it took in eleven thousand of them.\",\"People do not like being told what to do, but they do like getting something back.\",\"Most of the bottles are made in factories outside the country.\"],\"answer\":1,\"whyWrong\":[\"Esa ya está colocada en el hueco 1, y aquí no tendría a qué referirse su «them».\",null,\"Y van cuatro. Esta es la que sobra.\"],\"itemIds\":[\"enb1m8refersback\",\"enb1m8oneextrasentence\"],\"tip\":\"El «quieter reason» del texto anuncia una razón psicológica, no económica, y la frase D la da entera. Fíjate además en cómo la frase siguiente («A deposit is not a fine…») desarrolla justo eso.\"},{\"id\":\"enb1m8l10e6\",\"type\":\"mc\",\"prompt\":\"La frase que sobra\",\"question\":\"¿Cuál es la frase que no va en ningún hueco, y por qué?\",\"options\":[\"«Most of the bottles are made in factories outside the country» — habla del tema pero no se engancha a nada\",\"«The technology has been working perfectly well for twenty years» — es demasiado general\",\"«That is not a small bill» — no tiene sujeto claro\"],\"answer\":0,\"whyWrong\":[null,\"Esa va en el hueco 2: sostiene el «The interesting question is not whether the machines work» de después.\",\"Su sujeto es justo lo que la coloca: «that» recoge la lista de gastos de la frase anterior.\"],\"itemIds\":[\"enb1m8oneextrasentence\",\"enb1m8mostofthe\"],\"tip\":\"La frase que sobra siempre habla del tema — está escrita para engañar. Lo que no tiene es COSIDO: ni una referencia hacia atrás, ni un conector que gire, ni una palabra repetida del texto. Se descubre por descarte, y solo al final.\"},{\"id\":\"enb1m8l10e7\",\"type\":\"bucket\",\"prompt\":\"¿Esta frase mira hacia atrás o abre algo nuevo?\",\"categories\":[\"MIRA ATRÁS — va pegada a lo anterior\",\"ABRE — introduce algo nuevo\"],\"items\":[{\"text\":\"That is not a small bill.\",\"bucket\":0},{\"text\":\"There is also a quieter reason.\",\"bucket\":1},{\"text\":\"In the first three days it took in eleven thousand of them.\",\"bucket\":0},{\"text\":\"The idea is not new.\",\"bucket\":1},{\"text\":\"None of those three wanted to pay.\",\"bucket\":0},{\"text\":\"Part of the answer is money.\",\"bucket\":1}],\"itemIds\":[\"enb1m8refersback\",\"enmissingsentence\"],\"tip\":\"Las que miran atrás llevan «that», «those», «them», «it». Las que abren llevan «there is», «part of the answer», «the idea is». Con esa sola distinción resuelves la mitad del Part 2.\"},{\"id\":\"enb1m8l10e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen del texto con los conectores correctos\",\"text\":\"The machine has been in Germany since 2003. ___, it took twenty years to arrive here. ___ nobody wanted to pay for it, the supermarkets and the councils argued for years about who should. ___ the queue and the breakdowns, the writer has not seen a bottle on the pavement since.\",\"answers\":[\"However\",\"Since\",\"Despite\"],\"bank\":[\"However\",\"Since\",\"Despite\",\"Instead\",\"Unless\",\"Otherwise\"],\"translation\":\"La máquina existe en Alemania desde 2003. Sin embargo, aquí ha tardado veinte años en llegar. Como nadie quería pagarla, los supermercados y el ayuntamiento estuvieron años discutiendo sobre quién debía hacerlo. A pesar de la cola y de las averías, quien escribe no ha vuelto a ver una botella en la acera.\",\"itemIds\":[\"enb1m8however\",\"enb1m2sincecausal\",\"enb1m1despite\"],\"tip\":\"Hueco 1: detrás de un punto y girando el sentido, solo cabe «however». Hueco 2: lleva frase entera detrás y da la CAUSA, no el contraste. Hueco 3: lleva sustantivos detrás, así que ahí solo entra «despite». Esa es exactamente la lógica del Part 2: primero miras qué pieza cabe, y solo después qué significa.\"},{\"id\":\"enb1m8l10e9\",\"type\":\"errorfix\",\"prompt\":\"Un calco en un resumen de examen\",\"wrong\":\"Despite the machine works, nobody wanted to pay for it.\",\"answers\":[\"Although the machine works, nobody wanted to pay for it.\",\"Despite the machine working, nobody wanted to pay for it.\"],\"why\":\"«despite» no admite sujeto + verbo detrás. O se cambia el conector a «although», o el verbo pasa a -ing («despite the machine working»).\",\"translation\":\"Aunque la máquina funciona, nadie quería pagarla.\",\"itemIds\":[\"enb1m8despiteliving\",\"enb1m1despite\",\"enb1m1although\"]},{\"id\":\"enb1m8l10e10\",\"type\":\"transform\",\"prompt\":\"Cose dos frases sueltas con un conector\",\"source\":\"The machine breaks down. I have not seen a bottle on the pavement.\",\"instruction\":\"Únelas en una sola frase con «Even though»\",\"answers\":[\"Even though the machine breaks down, I have not seen a bottle on the pavement\",\"Even though the machine breaks down, I haven't seen a bottle on the pavement\"],\"translation\":\"Aunque la máquina se avería, no he vuelto a ver una botella en la acera.\",\"hints\":[\"El conector va delante y lleva frase entera detrás\",\"Even though the machine ..., I have not seen a bottle on the pavement\"],\"itemIds\":[\"enb1m8eventhough\"],\"tip\":\"Coser dos frases es exactamente lo que hace el Part 2 al revés: allí te dan el texto cosido con un trozo de menos. Si sabes coser, sabes descoser.\"},{\"id\":\"enb1m8l10e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"La consigna literal del examen: ¿qué te está pidiendo?\",\"source\":\"There is one extra sentence which you do not need.\",\"answers\":[\"Sobra una frase que no vas a necesitar\",\"Hay una frase de más que no necesitas\"],\"itemIds\":[\"enb1m8oneextrasentence\"],\"tip\":\"Léela dos veces el día del examen. Cada año hay gente que intenta colocar las siete y pierde tres puntos por no haber leído la línea que se lo advertía.\"},{\"id\":\"enb1m8l10e12\",\"type\":\"speak\",\"prompt\":\"Di en voz alta la regla del laboratorio, para que se te quede\",\"text\":\"Read the whole text first. The extra sentence comes last.\",\"phonetic\":\"riid de jóul tekst féest. di ÉKS-tra SÉN-tens kams laast\",\"translation\":\"Lee primero el texto entero. La frase que sobra sale la última.\",\"itemIds\":[\"enb1m8oneextrasentence\",\"enmissingsentence\"],\"tip\":\"Dos frases de siete palabras que valen seis puntos del examen. No hay estrategia más barata en todo el Reading.\"},{\"id\":\"enb1m8l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"Aunque la máquina se avería, no he vuelto a ver una botella en la acera.\",\"answers\":[\"Even though the machine breaks down, I haven't seen a bottle on the pavement\",\"Although the machine breaks down, I haven't seen a bottle on the pavement\",\"Even though the machine breaks down, I have not seen a bottle on the pavement\"],\"hints\":[\"Concesión con frase entera detrás\",\"Even though the machine breaks down, I haven't seen a bottle on the ...\"],\"itemIds\":[\"enb1m8eventhough\",\"enb1m8depositscheme\"],\"tip\":\"Ocho laboratorios hechos, cuatro por delante. En el módulo 12 te sientas al examen entero y ya no hay ninguna parte que veas por primera vez.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Reading)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo el Reading Part 2 del past paper, con reloj: quince minutos, sin mirar las claves. Seis huecos, siete frases. Es el mejor termómetro que tienes hoy.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",
