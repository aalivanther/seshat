jo al orden: en alemán el genitivo va \u003cb\u003edetrás\u003c/b\u003e — das Fest \u003cb\u003edes Jahres\u003c/b\u003e, nunca «des Jahres Fest». La [[Menge|multitud]] del Oktoberfest lo dice cada septiembre: \u003cb\u003edas größte Volksfest der Welt\u003c/b\u003e.\",\"table\":[[\"\",\"der / das (m · n)\",\"die (f) · Plural\"],[\"Nominativ\",\"der Umzug · das Fest\",\"die Tradition · die Feste\"],[\"Genitiv\",\"des Umzug(e)s · des Fest(e)s\",\"der Tradition · der Feste\"],[\"ejemplo\",\"der Anfang des Festes\",\"die Musik der Tradition\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l1e1\",\"type\":\"mc\",\"prompt\":\"Lee el genitivo\",\"question\":\"„das Fest des Jahres“\",\"options\":[\"la fiesta del año\",\"la fiesta con los años\",\"la fiesta desde hace un año\"],\"answer\":0,\"whyWrong\":[null,\"«con los años» sería mit den Jahren\",\"«desde hace un año» sería seit einem Jahr\"],\"itemIds\":[\"b1m7fetradition\"],\"tip\":\"des Jahres = del año. La -es del final es la firma del genitivo masculino/neutro.\"},{\"id\":\"b1m7l1e2\",\"type\":\"match\",\"prompt\":\"Cada fiesta, en su sitio del mapa germanohablante\",\"pairs\":[{\"target\":\"das Oktoberfest\",\"source\":\"Múnich — y empieza en septiembre\"},{\"target\":\"die Fasnacht\",\"source\":\"Basilea (Suiza) — arranca a las cuatro de la madrugada\"},{\"target\":\"der Krampus\",\"source\":\"Austria — la noche del 5 de diciembre\"},{\"target\":\"die Bundesfeier\",\"source\":\"Suiza — el 1 de agosto\"}],\"itemIds\":[\"b1m7feoktoberfest\",\"b1m7fefasnacht\",\"b1m7fekrampus\",\"b1m7febundesfeier\"],\"tip\":\"El examen es plurizéntrico: los textos vienen de Alemania, Austria y Suiza. Las fiestas también.\"},{\"id\":\"b1m7l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el eslogan de Múnich\",\"text\":\"Das Oktoberfest ist das größte Volksfest ___ Welt.\",\"answers\":[\"der\"],\"translation\":\"El Oktoberfest es la fiesta popular más grande del mundo.\",\"hints\":[\"die Welt es femenino\",\"Femenino en genitivo → d-e-r, y la palabra no cambia\"],\"itemIds\":[\"b1m7feoktoberfest\"]},{\"id\":\"b1m7l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Qué artículo pide el genitivo?\",\"categories\":[\"des + -(e)s\",\"der (sin cambio)\"],\"items\":[{\"text\":\"der Umzug\",\"bucket\":0},{\"text\":\"das Fest\",\"bucket\":0},{\"text\":\"die Tradition\",\"bucket\":1},{\"text\":\"die Feste (Plural)\",\"bucket\":1},{\"text\":\"der Brauch\",\"bucket\":0},{\"text\":\"die Musik\",\"bucket\":1}],\"itemIds\":[\"b1m7febrauch\",\"b1m7fetradition\"],\"tip\":\"Solo hay dos casillas. Masculino y neutro comparten des; femenino y plural comparten der.\"},{\"id\":\"b1m7l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa la fecha del Krampus\",\"text\":\"Am Abend ___ fünften Dezembers kommt der Krampus.\",\"answers\":[\"des\"],\"translation\":\"La tarde del cinco de diciembre llega el Krampus.\",\"hints\":[\"der Dezember es masculino\",\"d-e-s + -s: Dezembers\"],\"itemIds\":[\"b1m7fekrampus\"]},{\"id\":\"b1m7l1e6\",\"type\":\"mc\",\"prompt\":\"Nombres propios en genitivo\",\"question\":\"«El disfraz de Leo» se dice ...\",\"options\":[\"Leos Kostüm\",\"Leo's Kostüm\",\"das Kostüm Leos\"],\"answer\":0,\"whyWrong\":[null,\"El apóstrofo es un anglicismo: en alemán correcto no se escribe\",\"El orden es al revés: el nombre propio va delante\"],\"itemIds\":[\"b1m7fekostuem\"],\"tip\":\"Con nombres propios el genitivo se adelanta y se pega: Annas Party, Leos Kostüm, Omas Kuchen.\"},{\"id\":\"b1m7l1e7\",\"type\":\"build\",\"prompt\":\"Construye la frase con genitivo\",\"target\":\"Die Tradition des Festes ist sehr alt\",\"translation\":\"La tradición de la fiesta es muy antigua\",\"distractors\":[\"dem\",\"das\"],\"itemIds\":[\"b1m7fetradition\"],\"tip\":\"des Festes va DETRÁS del sustantivo al que pertenece — el orden español, no el inglés.\"},{\"id\":\"b1m7l1e8\",\"type\":\"transform\",\"prompt\":\"Del «von» hablado al genitivo escrito\",\"source\":\"die Musik von dem Fest\",\"instruction\":\"Dilo con genitivo (el registro escrito del examen)\",\"answers\":[\"die Musik des Festes\",\"die Musik des Fests\"],\"translation\":\"la música de la fiesta\",\"hints\":[\"von dem → des\",\"das Fest → des Fest(e)s\"],\"itemIds\":[\"b1m7fetradition\"],\"tip\":\"«von + Dativ» se oye en la calle; el genitivo es lo que puntúa en Schreiben. Los dos existen: elige según el registro.\"},{\"id\":\"b1m7l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el programa del desfile\",\"text\":\"Der Umzug ___ Karnevals beginnt um elf Uhr. Die Kostüme ___ Kinder sind bunt. Am Ende ___ Tages sind alle müde.\",\"answers\":[\"des\",\"der\",\"des\"],\"bank\":[\"des\",\"der\",\"dem\",\"den\",\"vom\"],\"translation\":\"El desfile del carnaval empieza a las once. Los disfraces de los niños son de colores. Al final del día todos están cansados.\",\"itemIds\":[\"b1m7feumzug\",\"b1m7fekarneval\",\"b1m7fekostuem\"],\"tip\":\"die Kinder es plural → der. Es la casilla que más se falla porque «der» suena a masculino.\"},{\"id\":\"b1m7l1e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige el genitivo\",\"wrong\":\"Das ist das Fest des Jahr.\",\"answers\":[\"Das ist das Fest des Jahres.\"],\"why\":\"Con des, el sustantivo masculino o neutro también cambia: necesita su -(e)s. des Jahr → des Jahres. Las DOS piezas llevan marca, no solo el artículo.\",\"translation\":\"Esa es la fiesta del año.\",\"itemIds\":[\"b1m7fetradition\"]},{\"id\":\"b1m7l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La tradición de la fiesta es muy antigua\",\"answers\":[\"Die Tradition des Festes ist sehr alt\",\"Die Tradition des Fests ist sehr alt\",\"Die Tradition des Festes ist sehr alt.\"],\"hints\":[\"die Tradition + des Festes detrás\",\"Fest → des Fest(e)s\"],\"itemIds\":[\"b1m7fetradition\"],\"tip\":\"Si te salió «des Festes» sin pensarlo, el genitivo ya es tuyo. En la próxima lección lo pones a trabajar con während, wegen y trotz.\"},{\"id\":\"b1m7l1e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · megafonía en la fiesta. Cada uno de los cinco textos del Teil 1 abre con una afirmación Richtig/Falsch, y se oye DOS veces. Lee la afirmación y decide.\",\"audio\":\"Achtung, eine Durchsage für alle Besucher des Festumzugs: Der Umzug beginnt heute erst um vierzehn Uhr dreißig, also eine halbe Stunde später als angekündigt – wegen des starken Regens heute Morgen. Die Straßen rund um den Marktplatz bleiben bis Mitternacht gesperrt. Und wer mit dem Auto gekommen ist: Bitte nutzen Sie den Parkplatz an der Schule, der Innenhof des Rathauses ist heute geschlossen.\",\"question\":\"Der Festumzug beginnt später als angekündigt.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«erst um vierzehn Uhr dreißig, also eine halbe Stunde später als angekündigt»: empieza más tarde, así que la afirmación es Richtig\"],\"itemIds\":[\"b1m7feumzug\",\"b1m7fewegendeswetters\"],\"tip\":\"La afirmación NUNCA repite las palabras del audio: el aviso dice «erst um vierzehn Uhr dreißig … später als angekündigt» y la tarea dice «später als angekündigt». Y de propina, tres genitivos en veinte segundos: «des Festumzugs», «des starken Regens», «des Rathauses».\"},{\"id\":\"b1m7l1e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo aviso, segunda tarea: la de opción múltiple. Dos escuchas, como en el examen.\",\"audio\":\"Achtung, eine Durchsage für alle Besucher des Festumzugs: Der Umzug beginnt heute erst um vierzehn Uhr dreißig, also eine halbe Stunde später als angekündigt – wegen des starken Regens heute Morgen. Die Straßen rund um den Marktplatz bleiben bis Mitternacht gesperrt. Und wer mit dem Auto gekommen ist: Bitte nutzen Sie den Parkplatz an der Schule, der Innenhof des Rathauses ist heute geschlossen.\",\"question\":\"¿Dónde hay que aparcar?\",\"options\":[\"En el aparcamiento del colegio\",\"En el patio del ayuntamiento\",\"En la plaza del mercado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El patio del ayuntamiento está cerrado hoy\",\"Las calles de alrededor del mercado están cortadas\"],\"itemIds\":[\"b1m7fetradition\",\"b1m7feumzug\"],\"tip\":\"En una Durchsage siempre hay un sitio que se recomienda y otro que se descarta. El examen pregunta por uno y pone el otro de distractor: quédate con los dos.\"}]}],\"resources\":[{\"label\":\"DW — Landeskunde: Feste im deutschsprachigen Raum\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Feste»: vídeos cortos sobre Oktoberfest, Karneval y Silvester con subtítulos alemanes.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
