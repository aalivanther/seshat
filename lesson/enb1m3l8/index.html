e: lo has oído. Es la palabra del rumor. \u003ci\u003eApparently, they're closing the café.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e· Actually\u003c/b\u003e — «en realidad». Corrige lo que el otro esperaba. \u003ci\u003eIt isn't the roof, actually — it's the kitchen.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e· At least\u003c/b\u003e — «al menos». Rescata lo bueno de algo malo. \u003ci\u003eAt least nobody is losing their job.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e· Anyway\u003c/b\u003e — «en fin». Cierra la digresión y vuelve a lo importante. \u003ci\u003eAnyway, let me know your dates.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la advertencia grande: «actually» NO es «actualmente».\u003c/b\u003e Es el falso amigo que más veces rompe una frase de un hispanohablante. «Actualmente» es \u003cb\u003ecurrently\u003c/b\u003e o \u003cb\u003eat the moment\u003c/b\u003e. Si escribes \u003ci\u003eActually I live in London\u003c/i\u003e queriendo decir «actualmente vivo en Londres», lo que entiende un británico es «pues resulta que vivo en Londres» — y se queda esperando la corrección que no llega.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos verbos que también se confunden:\u003c/b\u003e \u003ci\u003ehear \u003cb\u003efrom\u003c/b\u003e somebody\u003c/i\u003e = tener noticias de alguien (que te escriba, que te llame). \u003ci\u003eHear \u003cb\u003eof\u003c/b\u003e somebody\u003c/i\u003e = haber oído hablar de alguien. \u003ci\u003eHave you heard from Emma?\u003c/i\u003e ≠ \u003ci\u003eHave you heard of Emma?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY para abrir la historia, la fórmula: \u003cb\u003eYou'll never guess what happened.\u003c/b\u003e Es la que usan de verdad en un mensaje, y en el Writing Task 2 arranca la carta con energía sin salirse del registro."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l8\",\"phaseId\":\"enb1m3\",\"title\":\"You'll never guess what happened\",\"subtitle\":\"Contar un lío por escrito: apparently, actually, anyway, at least — y la carta a Emma\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras que llevan una historia\",\"itemIds\":[\"enb1m3youllneverguess\",\"enb1m3apparently\",\"enb1m3anyway\",\"enb1m2atleast\",\"enb1m3actually\",\"enb1m3heardfrom\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: cuatro palabras que hacen de guion\",\"body\":\"$17\",\"table\":[[\"Marcador\",\"Qué hace\",\"Ejemplo\"],[\"Apparently\",\"no te consta: lo has oído\",\"Apparently, they're closing.\"],[\"Actually\",\"corrige lo esperado\",\"It's the kitchen, actually.\"],[\"At least\",\"lo bueno dentro de lo malo\",\"At least nobody lost their job.\"],[\"Anyway\",\"vuelve al tema\",\"Anyway, let me know.\"],[\"Currently\",\"«actualmente» de verdad\",\"I'm currently working at a café.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l8e1\",\"type\":\"match\",\"prompt\":\"Empareja cada marcador con lo que hace\",\"pairs\":[{\"target\":\"Apparently, they're closing the café.\",\"source\":\"por lo visto (no me consta, lo he oído)\"},{\"target\":\"Actually, it wasn't true.\",\"source\":\"en realidad (corrige lo que esperabas)\"},{\"target\":\"At least she apologised.\",\"source\":\"al menos (lo bueno dentro de lo malo)\"},{\"target\":\"Anyway, I told her the truth.\",\"source\":\"en fin (vuelvo a lo importante)\"}],\"itemIds\":[\"enb1m3apparently\",\"enb1m3actually\",\"enb1m2atleast\",\"enb1m3anyway\"],\"tip\":\"No son adornos: son señales de tráfico. Quien lee sabe, antes de la frase, si vas a matizar, a rescatar algo o a cerrar el paréntesis. Eso es el criterio de Organisation.\"},{\"id\":\"enb1m3l8e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo más caro del nivel\",\"question\":\"«Actualmente trabajo en un café» →\",\"options\":[\"I'm currently working at a café.\",\"Actually I work at a café.\",\"In fact I work at a café.\"],\"answer\":0,\"whyWrong\":[null,\"«actually» es «en realidad»: suena a que estás corrigiendo lo que el otro creía.\",\"«in fact» también corrige o refuerza; tampoco significa «actualmente».\"],\"itemIds\":[\"enb1m3actually\"],\"tip\":\"actually = en realidad · currently / at the moment = actualmente. Y su pareja: eventually = al final, con el tiempo; NO «eventualmente». Los dos caen en el Reading, y los dos cambian el sentido de la frase entera.\"},{\"id\":\"enb1m3l8e3\",\"type\":\"bucket\",\"prompt\":\"¿Te consta o te lo han contado?\",\"categories\":[\"Me consta (lo he visto yo)\",\"Me lo han contado (no me consta)\"],\"items\":[{\"text\":\"Apparently, they're closing the café.\",\"bucket\":1},{\"text\":\"I saw the sign on the door myself.\",\"bucket\":0},{\"text\":\"Sam told me they're closing.\",\"bucket\":1},{\"text\":\"The rent went up in June — I paid it.\",\"bucket\":0},{\"text\":\"They say the kitchen is being repaired.\",\"bucket\":1},{\"text\":\"I was there when it happened.\",\"bucket\":0}],\"itemIds\":[\"enb1m3apparently\",\"enb1m3rumour\",\"enb1m3toldmethat\"],\"tip\":\"Marcar de dónde sale lo que cuentas es media nota de un texto B1 y todo el Listening Part 4: «hecho frente a opinión» empieza por saber quién lo dice y cómo lo sabe.\"},{\"id\":\"enb1m3l8e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Anyway, I told to her the truth.\",\"answers\":[\"Anyway, I told her the truth.\"],\"why\":\"«tell» lleva la persona pegada, sin «to»: told her, told me, told Sam. El «to» es el calco de «se lo dije A ella».\",\"translation\":\"En fin, le dije la verdad.\",\"itemIds\":[\"enb1m3anyway\",\"enb1m3toldmethat\"]},{\"id\":\"enb1m3l8e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Have you heard of Emma? She never writes.\",\"answers\":[\"Have you heard from Emma? She never writes.\"],\"why\":\"«hear from» = tener noticias de alguien. «hear of» = haber oído hablar de alguien, y con una amiga tuya no tiene sentido: claro que has oído hablar de ella.\",\"translation\":\"¿Has sabido algo de Emma? No escribe nunca.\",\"itemIds\":[\"enb1m3heardfrom\"]},{\"id\":\"enb1m3l8e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje a Emma\",\"text\":\"I heard it from a customer, so ___ they're closing the café for two weeks. ___ nobody is losing their job, which is something. And it isn't the roof, ___ — it's the kitchen. ___ , I'll have two weeks off in November.\",\"answers\":[\"apparently\",\"At least\",\"actually\",\"Anyway\"],\"bank\":[\"apparently\",\"At least\",\"actually\",\"Anyway\",\"Of course\",\"besides\",\"after all\"],\"translation\":\"Me lo ha dicho un cliente, así que por lo visto van a cerrar el café dos semanas. Al menos nadie se queda sin trabajo, que ya es algo. Y no es el tejado, en realidad: es la cocina. En fin, voy a tener dos semanas libres en noviembre.\",\"itemIds\":[\"enb1m3apparently\",\"enb1m2atleast\",\"enb1m3actually\",\"enb1m3anyway\"],\"tip\":\"Cada hueco lo decide una pista del contexto: «I heard it from…» pide apparently; «which is something» pide at least; el guion que corrige pide actually; y volver al plan pide anyway.\"},{\"id\":\"enb1m3l8e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «told» ni «somebody»\",\"source\":\"Somebody told me the café was closing.\",\"forbid\":[\"told\",\"somebody\"],\"answers\":[\"Apparently the café is closing\",\"I heard that the café was closing\",\"They say the café is closing\"],\"translation\":\"Alguien me dijo que el café iba a cerrar.\",\"hints\":[\"Hay un marcador que significa «por lo visto»\",\"Apparently the café ...\"],\"itemIds\":[\"enb1m3apparently\",\"enb1m3rumour\"],\"tip\":\"«Apparently» se come el sujeto entero. Es lo que hace un nativo cuando la fuente no importa o no la quiere decir: en vez de «somebody told me», una palabra al principio.\"},{\"id\":\"enb1m3l8e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — así se abre una historia\",\"text\":\"You'll never guess what happened. Apparently, they're closing the café for two weeks.\",\"phonetic\":\"yuul NÉ-va gues uot JÁ-pend · a-PÁ-rent-li, dea KLÓU-s̬ing de KÁ-fei fo tuu uíiks\",\"translation\":\"No te vas a creer lo que pasó. Por lo visto van a cerrar el café dos semanas.\",\"itemIds\":[\"enb1m3youllneverguess\",\"enb1m3apparently\"],\"tip\":\"«You'll never guess…» se dice de un tirón, con el golpe en GUESS y en HAPPENED. Es la fórmula con la que empieza el noventa por ciento de los audios de examen que cuentan un lío.\"},{\"id\":\"enb1m3l8e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Al menos pidió perdón.\",\"answers\":[\"At least she apologised\",\"At least he apologised\",\"At least she said sorry\"],\"hint\":\"Empieza por el marcador de «lo bueno dentro de lo malo»\",\"itemIds\":[\"enb1m2atleast\",\"enb1m3apologisedfor\"],\"tip\":\"«At least» abre frase y no lleva coma detrás cuando va pegado al sujeto («At least she apologised»). Con coma («At least, …») suena a otra cosa: a «por lo menos, que yo sepa».\"},{\"id\":\"enb1m3l8e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, ha visto una foto rara del café en un grupo y te escribe. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! Somebody at my class said your café was closing down — is that true?? I saw a photo of it on a group with CLOSING written across it. Tell me what's really going on. And are you still free in November?\"},\"bullets\":[\"Cuéntale qué te dijo Sam exactamente (en estilo indirecto).\",\"Aclara el lío: qué es verdad y qué no.\",\"Contéstale a lo de noviembre y propón un plan.\"],\"checks\":[{\"re\":\"(sam (said|told)|he (said|told)|she (said|told))\",\"label\":\"Cuentas lo que dijo Sam, en estilo indirecto\"},{\"re\":\"(apparently|actually|rumour|it turned out|wasn'?t true|not true)\",\"label\":\"Aclaras qué es verdad y qué no\"},{\"re\":\"(let me know|do you know|could you tell me|we could|shall we|why don'?t we)\",\"label\":\"Contestas a lo de noviembre y propones un plan\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea que abra la historia («You'll never guess…»)\",\"Qué pasó, en dos frases: la foto, el grupo, lo que creyó la gente\",\"Punto 1 — lo que dijo Sam: «Sam told me (that)…» en estilo indirecto\",\"Punto 2 — la aclaración: «Actually…» / «Apparently…» / «although…»\",\"Punto 3 — noviembre: «Anyway, let me know…» + un plan concreto\",\"Tu nombre a secas. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"though\",\"anyway\",\"at least\",\"actually\",\"apparently\",\"after all\",\"besides\",\"since\",\"unless\",\"of course\",\"for instance\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nYou'll never guess what happened here. Somebody put a photo of our café on a neighbourhood group with the word CLOSING across it, and by Friday half the street believed it.\\nSam told me on Monday what was really going on: the café is shutting for two weeks in November because the kitchen is being repaired, although nobody is losing their job. Actually, the owner had explained it on a sign by the door, but nobody reads signs any more.\\nAnyway, at least the rumour brought us customers. Let me know your dates for November and we could go to Brick Lane.\\nValeria\",\"itemIds\":[\"enb1m3youllneverguess\",\"enb1m3apparently\",\"enb1m3actually\",\"enb1m3anyway\",\"enb1m2atleast\",\"enb1m3toldmethat\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo — cuatro marcadores distintos (although, Actually, Anyway, at least), un estilo indirecto («Sam told me… that the café is shutting») y ni un «Yours sincerely». Meter la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m3l8e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Por lo visto van a cerrar dos semanas, pero al menos nadie se queda sin trabajo.\",\"answers\":[\"Apparently they're closing for two weeks, but at least nobody is losing their job\",\"Apparently they are closing for two weeks, but at least nobody is losing their job\",\"Apparently they're closing for two weeks, but at least nobody loses their job\"],\"hints\":[\"Dos marcadores: el del rumor y el del consuelo\",\"Apparently ... , but at least ...\"],\"itemIds\":[\"enb1m3apparently\",\"enb1m2atleast\"],\"tip\":\"«nobody is losing their job»: en inglés «their» vale para una persona de sexo desconocido y es lo normal desde hace siglos. Nadie escribe «his or her» en una carta a una amiga.\"},{\"id\":\"enb1m3l8e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"Apparently they're closing the café for two weeks.\",\"translation\":\"Por lo visto van a cerrar el café dos semanas.\",\"strictContractions\":true,\"hints\":[\"Empieza por el marcador de «por lo visto»\",\"Apparently they're ... for two weeks\"],\"itemIds\":[\"enb1m3apparently\"],\"tip\":\"«apparently» se dice en cuatro sílabas con el golpe en PA: a-PÁ-rent-li. Muchos hablantes se comen la última: «a-PÁ-rent-li» → «a-PÁ-rentli». Escríbela entera.\"},{\"id\":\"enb1m3l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy vuelve del turno y pregunta por el lío. Toma notas mientras suena. Dos escuchas.\",\"notepad\":true,\"audio\":\"Is it true about the café, then? Everyone at work was talking about it.|Depends what they told you. Apparently the whole street thinks we're shutting for good.|And you're not?|Two weeks in November, that's all. The kitchen's being redone — there's a sign on the door, it's been there since Tuesday.|So where did the photo come from?|A customer took it, cropped the top off and put it on the group. Actually I don't think she meant anything by it. Anyway, at least it's brought people in: three of them came just to ask if we were closing, and they all bought coffee.\",\"question\":\"¿Qué dice Valeria del cliente que hizo la foto?\",\"options\":[\"Que no cree que lo hiciera con mala intención\",\"Que lo hizo para perjudicar al café\",\"Que se inventó el cartel entero\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice justo lo contrario: «I don't think she meant anything by it».\",\"El cartel existe: lo que hizo fue cortarle la parte de arriba a la foto.\"],\"itemIds\":[\"enb1m3apparently\",\"enb1m3actually\",\"enb1m2atleast\"],\"tip\":\"Tres marcadores del módulo seguidos: «Apparently…», «Actually…», «Anyway, at least…». Cuando los oigas en el examen, apunta lo que viene detrás: el marcador anuncia que la información cambia de estatus.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Writing (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Compara tu carta con la Tarea 2 oficial: 100-120 palabras, carta a un amigo y DOS funciones que cumplir. Cuenta las palabras a mano una vez: te calibra para siempre.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"m
