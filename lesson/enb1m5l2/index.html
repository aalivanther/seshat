e TIENES que hacer; te cuento lo que haría yo. La decisión sigue siendo tuya. Eso es lo que ablanda la frase.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl detalle raro: «were» con todas las personas.\u003c/b\u003e En este condicional el verbo \u003ci\u003ebe\u003c/i\u003e usa \u003cb\u003ewere\u003c/b\u003e también con \u003ci\u003eI\u003c/i\u003e, \u003ci\u003ehe\u003c/i\u003e, \u003ci\u003eshe\u003c/i\u003e e \u003ci\u003eit\u003c/i\u003e: \u003ci\u003eIf I \u003cb\u003ewere\u003c/b\u003e you\u003c/i\u003e, \u003ci\u003eIf it \u003cb\u003ewere\u003c/b\u003e cheaper\u003c/i\u003e. Es lo que queda de un subjuntivo antiguo, y es lo que se enseña y lo que puntúa. Ahora bien, \u003cb\u003een la calle se oye «If I was you» constantemente\u003c/b\u003e y no es un error de nadie: es habla normal. Regla práctica: \u003cb\u003edi y escribe «were»\u003c/b\u003e, y no te sorprendas al oír «was».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escalera del consejo\u003c/b\u003e, de más suave a más directo:\u003cbr/\u003e1. \u003ci\u003eHave you thought about…?\u003c/i\u003e — ni siquiera aconseja: pregunta.\u003cbr/\u003e2. \u003ci\u003eYou could always…\u003c/i\u003e — pone una opción encima de la mesa.\u003cbr/\u003e3. \u003ci\u003eWhy don't you…?\u003c/i\u003e — propone, con confianza.\u003cbr/\u003e4. \u003ci\u003eIf I were you, I'd…\u003c/i\u003e — te mojas, pero desde tu sitio.\u003cbr/\u003e5. \u003ci\u003eIt would be better to…\u003c/i\u003e — ya es una valoración: úsala cuando te la hayan pedido.\u003cbr/\u003e\u003cbr/\u003eY un aviso de forma: detrás de \u003ci\u003eHave you thought \u003cb\u003eabout\u003c/b\u003e\u003c/i\u003e va \u003cb\u003e-ing\u003c/b\u003e, no infinitivo — \u003ci\u003eabout sell\u003cb\u003eing\u003c/b\u003e it\u003c/i\u003e. Ese «to» de \u003ci\u003elook forward to\u003c/i\u003e, \u003ci\u003ebe used to\u003c/i\u003e y \u003ci\u003ethink about\u003c/i\u003e es preposición, no infinitivo: lo que viene detrás termina en -ing."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l2\",\"phaseId\":\"enb1m5\",\"title\":\"If I were you\",\"subtitle\":\"Aconsejar sin mandar — y el «were» que vale para todas las personas\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cinco maneras de aconsejar sin ofender\",\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5whatwouldyoudo\",\"enb1m5whynotaskfor\",\"enb1m5haveyouthoughtabout\",\"enb1m5youcouldalways\",\"enb1m5itwouldbebetterto\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el inglés disfraza el consejo de hipótesis\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l2e1\",\"type\":\"match\",\"prompt\":\"Empareja cada fórmula con lo que hace de verdad\",\"pairs\":[{\"target\":\"Have you thought about selling it?\",\"source\":\"pregunta: ni siquiera aconseja\"},{\"target\":\"You could always sell it.\",\"source\":\"pone una opción encima de la mesa\"},{\"target\":\"Why don't you ask for a refund?\",\"source\":\"propone, con confianza\"},{\"target\":\"If I were you, I would talk to the manager.\",\"source\":\"te mojas, pero desde tu sitio\"},{\"target\":\"It would be better to wait for the sales.\",\"source\":\"ya es una valoración\"}],\"itemIds\":[\"enb1m5haveyouthoughtabout\",\"enb1m5youcouldalways\",\"enb1m5whynotaskfor\",\"enb1m5ifiwereyou\",\"enb1m5itwouldbebetterto\"],\"tip\":\"Las cinco dicen lo mismo. Lo que cambia es cuánto te metes en la vida del otro — y esa escalera es la mitad del criterio de registro en el examen oral.\"},{\"id\":\"enb1m5l2e2\",\"type\":\"mc\",\"prompt\":\"El «were» raro\",\"question\":\"¿Cuál escribirías en el examen?\",\"options\":[\"If I were you, I would keep the receipt.\",\"If I am you, I would keep the receipt.\",\"If I would be you, I would keep the receipt.\"],\"answer\":0,\"whyWrong\":[null,\"El presente rompe la hipótesis: «If I am you» dice que puede pasar de verdad, y no puede.\",\"El «would» de la mitad del if, otra vez. No existe.\"],\"itemIds\":[\"enb1m5ifiwereyou\"],\"tip\":\"«If I was you» lo dice medio Reino Unido y no pasa nada al oírlo. Pero en el papel escribe «were»: es lo que espera el corrector, y no cuesta nada.\"},{\"id\":\"enb1m5l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"If I would be you, I would talk to the manager.\",\"answers\":[\"If I were you, I would talk to the manager.\"],\"why\":\"«Si yo fuera tú» no lleva condicional en inglés: lleva el pasado irreal de be, que en este caso es «were» para todas las personas. El «would» se queda solo en la otra mitad.\",\"translation\":\"Yo que tú hablaría con el encargado.\",\"itemIds\":[\"enb1m5ifiwereyou\"]},{\"id\":\"enb1m5l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el consejo\",\"text\":\"If I ___ you, I'd keep the receipt.\",\"answers\":[\"were\",\"was\"],\"translation\":\"Yo que tú guardaría el tique.\",\"hints\":[\"Es el pasado de «be», no el presente\",\"Con «I» el examen espera la forma en -ere\"],\"itemIds\":[\"enb1m5ifiwereyou\"],\"tip\":\"Se aceptan las dos porque las dos se oyen. Pero fíjate en cuál has escrito: si te ha salido «was», acostúmbrate a «were» antes del examen.\"},{\"id\":\"enb1m5l2e5\",\"type\":\"transform\",\"prompt\":\"Del consejo directo al consejo educado\",\"source\":\"You should talk to the manager.\",\"instruction\":\"Dilo con «If I were you…»\",\"answers\":[\"If I were you, I would talk to the manager\",\"If I were you I would talk to the manager\",\"If I were you, I'd talk to the manager\"],\"translation\":\"Yo que tú hablaría con el encargado.\",\"hints\":[\"Empieza por la fórmula de «yo que tú»\",\"If I were you, I ... to the manager\"],\"itemIds\":[\"enb1m5ifiwereyou\"],\"tip\":\"«You should» no está mal, pero apunta al otro con el dedo. «If I were you» apunta a ti mismo y dice lo mismo. En una reclamación, en una carta y en el oral, esa diferencia se nota.\"},{\"id\":\"enb1m5l2e6\",\"type\":\"gapbank\",\"prompt\":\"Contesta al mensaje de Amy completando los huecos\",\"text\":\"Look, I'd hate to be in your position. If I ___ you, I'd ring them tomorrow. Have you thought ___ writing instead? It would be ___ than calling to have it in writing, and at least you ___ show them the email later.\",\"answers\":[\"were\",\"about\",\"better\",\"could\"],\"bank\":[\"were\",\"about\",\"better\",\"could\",\"was\",\"of\",\"best\",\"should\"],\"translation\":\"Mira, no me gustaría estar en tu lugar. Yo que tú los llamaría mañana. ¿Te has planteado escribir en vez de llamar? Sería mejor que llamar tenerlo por escrito y, por lo menos, podrías enseñarles el correo después.\",\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5haveyouthoughtabout\",\"enb1m5itwouldbebetterto\",\"enb1m5youcouldalways\"],\"tip\":\"Cuatro huecos, cuatro maneras distintas de aconsejar en cuatro líneas. Así escribe un B1: no repite «you should» cuatro veces.\"},{\"id\":\"enb1m5l2e7\",\"type\":\"build\",\"prompt\":\"Construye la pregunta que aconseja sin aconsejar\",\"target\":\"Have you thought about selling it\",\"translation\":\"¿Te has planteado venderlo?\",\"distractors\":[\"to\",\"sell\"],\"itemIds\":[\"enb1m5haveyouthoughtabout\"],\"tip\":\"Las dos fichas que sobran forman el calco: «thought about to sell». Detrás de una preposición el inglés pone -ing, siempre.\"},{\"id\":\"enb1m5l2e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¿Qué harías si te quedaras sin trabajo?\",\"answers\":[\"What would you do if you lost your job\",\"What would you do if you lost your job?\",\"What would you do if you lost your work?\"],\"hint\":\"Los dos verbos van en mitades distintas: uno con «would», el otro en pasado\",\"itemIds\":[\"enb1m5whatwouldyoudo\"],\"tip\":\"Es la pregunta con la que arranca media conversación de B1: «What would you do if…?». Aprende el molde y luego cámbiale el final.\"},{\"id\":\"enb1m5l2e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «why» y sin «refund»\",\"source\":\"Why don't you ask for a refund?\",\"forbid\":[\"why\",\"refund\"],\"answers\":[\"You could ask for your money back\",\"Have you thought about asking for your money back\",\"If I were you, I'd ask them to give the money back\"],\"translation\":\"¿Por qué no pides que te devuelvan el dinero?\",\"hints\":[\"Usa la fórmula de «siempre puedes…»\",\"You could always ask for your ... back\"],\"itemIds\":[\"enb1m5whynotaskfor\",\"enb1m5refund\"],\"tip\":\"Rodear una palabra que no te sale es LA habilidad del B1. «Refund» no aparece, y sin embargo se entiende perfectamente qué quieres.\"},{\"id\":\"enb1m5l2e10\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It would be better wait for the sales.\",\"answers\":[\"It would be better to wait for the sales.\"],\"why\":\"Falta el «to». En español «sería mejor esperar» no lleva nada entre medias; en inglés, detrás de «better» va infinitivo con «to».\",\"translation\":\"Sería mejor esperar a las rebajas.\",\"itemIds\":[\"enb1m5itwouldbebetterto\"]},{\"id\":\"enb1m5l2e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu fórmula de consejo para el oral\",\"text\":\"If I were you, I'd have a word with the manager first.\",\"phonetic\":\"if ai uée yu, aid jav a ueed uid de MÁ-ni-dcha feest\",\"translation\":\"Yo que tú hablaría antes con el encargado.\",\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5natwordwith\"],\"tip\":\"El golpe va en WERE, en WORD y en FIRST. Y fíjate en «I'd»: es una sola sílaba, «aid». Si lo dices en dos («ai uud»), suena a robot.\"},{\"id\":\"enb1m5l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Yo que tú se lo devolvería y pediría el dinero.\",\"answers\":[\"If I were you, I would take it back and ask for a refund\",\"If I were you I would take it back and ask for a refund\",\"If I were you, I'd take it back and ask for a refund\",\"If I were you, I would return it and ask for a refund\"],\"hints\":[\"Empieza por la fórmula del consejo\",\"If I were you, I would ... and ask for a refund\"],\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5whynotaskfor\",\"enb1m5refund\"],\"tip\":\"Un solo «would» para dos verbos: «I would take it back and ask». No hace falta repetirlo, y repetirlo suena a principiante.\"},{\"id\":\"enb1m5l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy le pide consejo a Valeria. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"So I paid a hundred and forty for the coat and it arrived with a hole in the sleeve.|A hole? Have you rung them?|Twice. The first time nobody picked up and the second time they said the returns team would ring me back. That was nine days ago.|Right. If I were you I'd stop ringing and put it in writing. Email them, attach a photo of the sleeve and the order number, and say what you want them to do.|You think that works better?|It's not that it works better. It's that you've got a copy. On the phone it's your word against theirs.\",\"question\":\"¿Por qué le aconseja Valeria que escriba en vez de llamar?\",\"options\":[\"Porque así queda constancia de lo que ha dicho\",\"Porque por teléfono no la van a atender nunca\",\"Porque el correo llega antes al equipo de devoluciones\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No dice eso: dice que por teléfono es su palabra contra la de ellos.\",\"De la rapidez no habla nadie en todo el audio.\"],\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5complainedto\",\"enb1m5proofofpurchase\"],\"tip\":\"«It's not that it works better. It's that…» es una estructura de corrección muy útil: rechaza el motivo que le han ofrecido y pone el suyo. Cuando la oigas en el examen, la respuesta viene detrás.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__
