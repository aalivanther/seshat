my. “And I'm thirsty.”\u003cbr/\u003e2. “Let's go to Sam's café! [[Good idea?|¿Buena idea?]]” — “Yes!”\u003cbr/\u003e3. At the café, Sam says: “Hello! Can I help you?”\u003cbr/\u003e4. Valeria: “Can I have eggs and bread, please? And a coffee.”\u003cbr/\u003e5. Amy: “Can I have a tea and a cake, please?”\u003cbr/\u003e6. Sam: “Anything else?” — Valeria: “Is there any orange juice?” — Sam: “Yes, there is!”\u003cbr/\u003e7. Sam [[brings|trae]] the breakfast: “Here you go!”\u003cbr/\u003e8. Valeria [[tries|prueba]] the eggs: “Mmm — the eggs are delicious!”\u003cbr/\u003e9. Amy: “Breakfast at Sam's is my favourite.” — “Mine too. Thank you, Sam!”\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: orange juice = zumo de naranja · me too / mine too = yo también / el mío también · el «Here you go» de Sam ya lo conoces de la píldora Nativo.\u003c/i\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m5l6e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 1-2)\",\"question\":\"¿Por qué van al café de Sam?\",\"options\":[\"Valeria tiene hambre y Amy tiene sed\",\"Es el cumpleaños de Amy\",\"Quieren ver a Ben\"],\"answer\":0,\"whyWrong\":[null,\"El cumpleaños no aparece en la historia\",\"Ben no sale en esta historia\"],\"itemIds\":[\"enimhungry\",\"enimthirsty\"]},{\"id\":\"ena1m5l6e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 5)\",\"question\":\"¿Qué pide Amy?\",\"options\":[\"Huevos y pan\",\"Un té y una tarta\",\"Un zumo de naranja\"],\"answer\":1,\"whyWrong\":[\"Eso lo pide Valeria (frase 4)\",null,\"Por el zumo pregunta Valeria (frase 6)\"],\"itemIds\":[\"entea\",\"encake\"]},{\"id\":\"ena1m5l6e3\",\"type\":\"order\",\"prompt\":\"Ordena la historia del sábado\",\"sentences\":[\"Valeria is hungry, and Amy is thirsty.\",\"They go to Sam's café.\",\"Valeria says: “Can I have eggs and a coffee, please?”\",\"Sam brings the breakfast.\",\"The eggs are delicious!\"],\"translation\":\"Valeria tiene hambre y Amy sed. Van al café de Sam. Valeria pide huevos y un c ulo ya desayunas, pides y opinas en inglés. Módulo cerrado.\"},{\"id\":\"ena1m5l6e9\",\"type\":\"audiomc\",\"prompt\":\"Solo con el oído: ¿quién habla?\",\"audio\":\"Can I have a tea and a cake, please?\",\"question\":\"¿Quién dice esta frase en la historia?\",\"options\":[\"Amy — pide su desayuno\",\"Sam — trae el desayuno\",\"Valeria — pide huevos y pan\"],\"answer\":0,\"whyWrong\":[null,\"Sam no pide: pregunta (Anything else?) y trae (Here you go!)\",\"Valeria pide eggs and bread — esto fue a tea and a cake\"],\"itemIds\":[\"entea\",\"encake\",\"encanihaveacoffee\"],\"tip\":\"El Listening T3 pregunta QUIÉN habla: une el pedido con su dueño, no solo las palabras con el oído.\"},{\"id\":\"ena1m5l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡Los huevos están riquísimos!\",\"answers\":[\"The eggs are delicious!\",\"The eggs are delicious\",\"The eggs are delicious.\"],\"hints\":[\"eggs es plural → are\",\"The eggs are ...\"],\"itemIds\":[\"eneggs\",\"endelicious\"],\"tip\":\"El piropo de Valeria, escrito por ti: delicious abre puertas (y repite postre) en cualquier mesa.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m5-3\",\"book\":\"Thank you.\",\"real\":\"Cheers!\",\"meaning\":\"«¡Gracias!» al RECIBIR algo — el café, el cambio, la bolsa.\",\"when\":\"Justo cuando te ponen algo en la mano: Sam le pasa el café a Amy y ella responde Cheers! Es el gracias del intercambio rápido en cafés y tiendas. En un email o una situación formal: thank you, siempre.\",\"register\":\"neutral\",\"note\":\"Ya lo conoces como gracias multiusos (módulo 3) — aquí lo ves en su momento estrella: el instante en que recibes algo.\",\"sound\":\"chías̬\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"BBC Learning English\",\"url\":\"https://www.bbc.co.uk/learningenglish\",\"note\":\"Busca «English at the café»: escenas reales de pedir comida, con el vocabulario de este módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{
