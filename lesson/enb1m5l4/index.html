ic/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6d8,"])</script><script>self.__next_f.push([1,"Un aviso cultural antes que gramatical: en el Reino Unido \u003cb\u003esubir la voz te quita la razón\u003c/b\u003e. La reclamación se gana con dos cosas —los hechos y el papel— y se dice con la fórmula más envuelta que tengas a mano. Cuanto más te enfadas, más educado te pones. Suena contradictorio y es exactamente así.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escalera del registro\u003c/b\u003e, de la calle al papel:\u003cbr/\u003e· \u003ci\u003eCan I have a word?\u003c/i\u003e — de tú a tú, antes de que la cosa vaya a más.\u003cbr/\u003e· \u003ci\u003eExcuse me, this kettle's faulty.\u003c/i\u003e — en el mostrador.\u003cbr/\u003e· \u003ci\u003eI'd like to make a complaint.\u003c/i\u003e — la fórmula que se dice al encargado y la que se escribe.\u003cbr/\u003e· \u003ci\u003eI am writing regarding…\u003c/i\u003e — la carta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuatro palabras que no puedes no saber:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003efaulty\u003c/b\u003e — defectuoso. No es «broken» (que lo has roto tú): es que vino mal.\u003cbr/\u003e· \u003cb\u003ea refund\u003c/b\u003e — que te devuelvan el dinero. \u003ci\u003eCan I have a refund?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eunder warranty\u003c/b\u003e — en garantía. También se oye \u003ci\u003eunder guarantee\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eproof of purchase\u003c/b\u003e — el justificante. En el Reino Unido no siempre hace falta el tique: vale el extracto del banco o el correo del pedido.\u003cbr/\u003e\u003cbr/\u003eY dos preposiciones que no se negocian:\u003cbr/\u003e· \u003ci\u003eexchange it \u003cb\u003efor\u003c/b\u003e a bigger one\u003c/i\u003e — cambiarlo POR otro.\u003cbr/\u003e· \u003ci\u003ecomplain \u003cb\u003eto\u003c/b\u003e the manager\u003c/i\u003e \u003cb\u003eabout\u003c/b\u003e the noise — te quejas A alguien DE algo. «Complain with» es calco directo de «quejarse con» y no existe.\u003cbr/\u003e\u003cbr/\u003eÚltima cosa, y es la que más nota vale: \u003cb\u003e«I want my money back» no se escribe nunca en una carta.\u003c/b\u003e No es que sea grosero exactamente; es que suena a niño. La misma idea envuelta —\u003ci\u003eI would be grateful if you could refund the cost\u003c/i\u003e— es la que consigue que te contesten."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l4\",\"phaseId\":\"enb1m5\",\"title\":\"I'd like to make a complaint\",\"subtitle\":\"Quejarse en inglés sin sonar borde — y la carta que sí te contestan\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario de la devolución\",\"itemIds\":[\"enb1m5makeacomplaint\",\"enb1m5refund\",\"enb1m5faulty\",\"enb1m5underwarranty\",\"enb1m5exchangeitfor\",\"enb1m5complainedto\",\"enb1m5proofofpurchase\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: en inglés se reclama fuerte y se dice suave\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cinco piezas de la reclamación\",\"pairs\":[{\"target\":\"The kettle is faulty.\",\"source\":\"El hervidor está defectuoso.\"},{\"target\":\"Can I have a refund?\",\"source\":\"¿Me pueden devolver el dinero?\"},{\"target\":\"It's still under warranty.\",\"source\":\"Todavía está en garantía.\"},{\"target\":\"proof of purchase\",\"source\":\"el justificante de compra\"},{\"target\":\"I complained to the manager.\",\"source\":\"Me quejé al encargado.\"}],\"itemIds\":[\"enb1m5faulty\",\"enb1m5refund\",\"enb1m5underwarranty\",\"enb1m5proofofpurchase\",\"enb1m5complainedto\"],\"tip\":\"«faulty» es la palabra que abre la puerta legal: si el producto es faulty, tienes derechos que no dependen de la buena voluntad de la tienda.\"},{\"id\":\"enb1m5l4e2\",\"type\":\"mc\",\"prompt\":\"Registro: la misma idea, cuatro alturas\",\"question\":\"¿Cuál escribirías en una carta a la empresa?\",\"options\":[\"I want my money back.\",\"I'd like to make a complaint about a kettle I bought last week.\",\"Can I have a word?\"],\"answer\":1,\"whyWrong\":[\"Se entiende perfectamente y no te contesta nadie: en una carta suena a exigencia de niño.\",null,\"Es de viva voz, y de tú a tú. En papel no significa nada.\"],\"itemIds\":[\"enb1m5makeacomplaint\",\"enb1m5natwordwith\"],\"tip\":\"Las tres dicen lo mismo. Lo que cambia es dónde caben. En LanguageCert el registro entra en el criterio de Vocabulary, y meter la de la calle en la carta te baja la banda sin que nadie te corrija un verbo.\"},{\"id\":\"enb1m5l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra de la garantía\",\"text\":\"Don't worry about paying for the repair — it's still under ___.\",\"answers\":[\"warranty\",\"guarantee\"],\"translation\":\"No te preocupes por pagar el arreglo: todavía está en garantía.\",\"hints\":[\"Empieza por «w» y también vale un sinónimo con «g»\",\"war...\"],\"itemIds\":[\"enb1m5underwarranty\"],\"tip\":\"«Warranty» y «guarantee» valen igual aquí. Ojo con la ortografía de la segunda: gua-ran-TEE, con el golpe al final.\"},{\"id\":\"enb1m5l4e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I complained with the manager.\",\"answers\":[\"I complained to the manager.\"],\"why\":\"«Quejarse con alguien» es calco: en inglés te quejas A alguien, «complain TO». Y de lo que te quejas va con «about»: complain to the manager ABOUT the noise.\",\"translation\":\"Me quejé al encargado.\",\"itemIds\":[\"enb1m5complainedto\",\"enb1m3complainedabout\"]},{\"id\":\"enb1m5l4e5\",\"type\":\"bucket\",\"prompt\":\"¿Esto se dice en el mostrador o se escribe en la carta?\",\"categories\":[\"De viva voz, en la tienda\",\"Por escrito, en la carta formal\"],\"items\":[{\"text\":\"Can I have a word?\",\"bucket\":0},{\"text\":\"Excuse me, this kettle's faulty.\",\"bucket\":0},{\"text\":\"Can I have a refund?\",\"bucket\":0},{\"text\":\"I am writing regarding a kettle I ordered on 3 May.\",\"bucket\":1},{\"text\":\"I would be grateful if you could send me a replacement.\",\"bucket\":1},{\"text\":\"I look forward to hearing from you.\",\"bucket\":1}],\"itemIds\":[\"enb1m5natwordwith\",\"enb1m5faulty\",\"enb1m5refund\",\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\"],\"tip\":\"No hay ninguna que esté «mal»: están todas bien en su sitio. El error de registro es de sitio, no de gramática, y por eso no se ve al releer.\"},{\"id\":\"enb1m5l4e6\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que dice Valeria en el mostrador\",\"text\":\"Good morning. I bought this kettle here on Saturday and it's ___. I've got the receipt, so I've got ___ of purchase. Could I exchange it ___ another one? And if you haven't got the same model, I'd rather have a ___, please.\",\"answers\":[\"faulty\",\"proof\",\"for\",\"refund\"],\"bank\":[\"faulty\",\"proof\",\"for\",\"refund\",\"broke\",\"prove\",\"from\",\"complaint\"],\"translation\":\"Buenos días. Compré este hervidor aquí el sábado y está defectuoso. Tengo el tique, así que tengo justificante de compra. ¿Me lo podrían cambiar por otro? Y si no les queda el mismo modelo, prefiero que me devuelvan el dinero, por favor.\",\"itemIds\":[\"enb1m5faulty\",\"enb1m5proofofpurchase\",\"enb1m5exchangeitfor\",\"enb1m5refund\"],\"tip\":\"Cuatro huecos y toda la reclamación en cuatro frases: qué pasa, qué papel tienes, qué pides y qué pides si lo primero no puede ser. Ese orden es el que funciona.\"},{\"id\":\"enb1m5l4e7\",\"type\":\"transform\",\"prompt\":\"De la exigencia a la petición\",\"source\":\"Give me my money back.\",\"instruction\":\"Dilo como se pide en un mostrador británico\",\"answers\":[\"Could I have a refund, please?\",\"Could I have my money back, please?\",\"I'd like a refund, please\",\"I would like a refund, please\"],\"translation\":\"¿Me pueden devolver el dinero, por favor?\",\"hints\":[\"Empieza por el modal de cortesía\",\"Could I have a ..., please?\"],\"itemIds\":[\"enb1m5refund\",\"enb1m5makeacomplaint\"],\"tip\":\"En alemán el registro se juega en du/Sie. En inglés no existe ese par: se juega aquí, en cómo envuelves la petición. Nadie te va a corregir por ello — simplemente no te dan el dinero.\"},{\"id\":\"enb1m5l4e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa exactamente?\",\"source\":\"I'm afraid we can only exchange it for another one — we don't do refunds on sale items.\",\"answers\":[\"Me temo que solo podemos cambiárselo por otro: no devolvemos el dinero de los artículos rebajados\",\"Lo siento, solo se lo podemos cambiar por otro: en las rebajas no devolvemos el dinero\"],\"itemIds\":[\"enb1m5exchangeitfor\",\"enb1m5refund\",\"ensale\"],\"tip\":\"«We don't do refunds» es la frase que oirás de verdad, y es más dura de lo que parece: no es que no puedan, es que su política dice que no. Ahí es donde toca preguntar si el artículo es «faulty», porque entonces la política no manda.\"},{\"id\":\"enb1m5l4e9\",\"type\":\"build\",\"prompt\":\"Construye la petición del mostrador\",\"target\":\"Could I exchange it for a bigger one\",\"translation\":\"¿Me lo podrían cambiar por uno más grande?\",\"distractors\":[\"change\",\"by\"],\"itemIds\":[\"enb1m5exchangeitfor\"],\"tip\":\"Las dos fichas que sobran son el calco de «cambiar por»: «change it by». En inglés es «exchange it FOR».\"},{\"id\":\"enb1m5l4e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el correo que te llegó, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Compraste un hervidor por internet y llegó mal. Escribe a la tienda para reclamar. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Correo automático de Halstead Home\",\"text\":\"HALSTEAD HOME — Order confirmation. Order number HK4192. 1 x Halstead 1.7L kettle, £34.99. Dispatched 3 May. Problems with your order? Write to Customer Services, Halstead Home, Unit 6, Baynes Way, Leeds LS9 4TR.\"},\"bullets\":[\"Di qué compraste, cuándo y con qué número de pedido.\",\"Explica qué le pasa al aparato y qué has intentado ya.\",\"Di qué quieres que hagan y pide una respuesta.\"],\"checks\":[{\"re\":\"(order|bought|purchased|receipt)\",\"label\":\"Dices qué compraste y cuándo, con el número de pedido\"},{\"re\":\"(faulty|broken|damaged|stopped working|does ?n'?o?t work)\",\"label\":\"Explicas qué le pasa\"},{\"re\":\"(refund|replacement|exchange|money back)\",\"label\":\"Dices qué quieres que hagan\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — sin nombre, porque el correo no lo da\",\"Por qué escribes: «I am writing regarding a kettle I ordered on…»\",\"Punto 2 — el problema, con un conector de contraste: «Although it arrived on time, it…»\",\"Lo que ya has intentado: «In spite of two telephone calls, nobody…»\",\"Punto 3 — lo que pides: «I would be grateful if you could…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"in spite of\",\"in addition\",\"on the other hand\",\"therefore\",\"besides\",\"unless\",\"for instance\",\"of course\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing regarding a kettle I ordered from your website on 3 May, order number HK4192. Although it arrived on time, it stopped working after four days and the handle is now loose. In spite of two telephone calls, nobody has been able to help me. The kettle is still under warranty and I have kept the receipt as proof of purchase. I would be grateful if you could send me a replacement or refund the cost. I look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5faulty\",\"enb1m5underwarranty\",\"enb1m5proofofpurchase\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\",\"enb1m5inspiteof\"],\"tip\":\"Cuenta las palabras antes de darle a comprobar: 70-100. Y fíjate en que el modelo no dice ni una vez «I want». La petición va envuelta en «I would be grateful if you could…», que es la fórmula que más se usa y la que más puntúa.\"},{\"id\":\"enb1m5l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Les agradecería que me enviaran uno nuevo.\",\"answers\":[\"I would be grateful if you could send me a replacement\",\"I would be grateful if you could send me a new one\",\"I'd be grateful if you could send me a replacement\"],\"hints\":[\"Empieza por la fórmula de agradecimiento anticipado\",\"I would be grateful if you could ...\"],\"itemIds\":[\"enb1m5gratefulifyoucould\"],\"tip\":\"Es una fórmula congelada: no la analices como condicional, apréndetela entera. Sirve para pedir cualquier cosa por escrito y sube el registro de golpe.\"},{\"id\":\"enb1m5l4e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu apertura de reclamación en el mostrador\",\"text\":\"I'm sorry to bother you, but I'd like to make a complaint about this kettle.\",\"phonetic\":\"aim SÓ-ri tu BÓ-da yu, bat aid laik tu meik a kom-PLÉINT a-BÁUT dis KÉ-tol\",\"translation\":\"Perdone que le moleste, pero quisiera poner una reclamación por este hervidor.\",\"itemIds\":[\"enb1m5makeacomplaint\",\"ena2m7imsorrytobotheryou\",\"enb1m5faulty\"],\"tip\":\"Fíjate en la melodía: «I'm sorry to bother you» baja, «but» sube y «complaint» lleva el golpe. Dicho todo plano suena a bronca aunque las palabras sean amables — y el tono se juzga en el oral.\"},{\"id\":\"enb1m5l4e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en el mostrador de devoluciones. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Morning. I bought this kettle here a fortnight ago and it's stopped working.|Have you got your receipt?|I haven't, I'm afraid. I've got the card statement on my phone, though — is that any good?|That's fine, that counts as proof of purchase. Right, a fortnight, so it's well within the warranty. Would you rather have a replacement or your money back?|A replacement, if you've got the same model.|We have, but not until Thursday. If you can wait until Thursday I'll put one by with your name on it. If not, I can do the refund now.\",\"question\":\"¿Qué le ofrecen a Valeria?\",\"options\":[\"Esperar al jueves para el cambio, o el dinero hoy mismo\",\"Solo el cambio, porque no tiene el tique\",\"Solo el dinero, porque ya no queda el modelo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El tique no hace falta: el extracto del banco vale como proof of purchase.\",\"Sí queda el modelo, pero no llega hasta el jueves.\"],\"itemIds\":[\"enb1m5proofofpurchase\",\"enb1m5underwarranty\",\"enb1m5refund\"],\"tip\":\"La respuesta llega en un primer condicional partido en dos: «If you can wait… I'll put one by. If not, I can do the refund now». En el mostrador se negocia así, con dos ramas y sin adornos.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m5-2\",\"book\":\"I want to complain.\",\"real\":\"Can I have a word?\",\"meaning\":\"¿Puedo hablar un momento contigo?\",\"when\":\"Cara a cara y antes de que la cosa se ponga formal: al encargado del café, a un compañero, a un vecino. Avisa de que viene algo serio pero deja la puerta abierta. En un correo o en el Writing no cabe, y al escribirlo a un desconocido suena incluso amenazante.\",\"register\":\"neutral\",\"exam\":\"I'd like to make a complaint.\",\"note\":\"Ojo con el tono: dicho suave es «oye, ¿te puedo comentar una cosa?»; dicho seco y con el ceño fruncido, en el Reino Unido es la antesala de una bronca. Y no es «una palabra»: «a word» aquí significa una conversación corta.\",\"sound\":\"kan ai jav a ueed\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m5natwordwith\"}}],\"resources\":[{\"label\":\"Which? — Letter templates para reclamar\",\"url\":\"https://www.which.co.uk/consumer-rights/letter\",\"note\":\"Plantillas de carta reales para faulty goods y refunds. Compara la tuya con la suya: verás las mismas cinco líneas del esqueleto.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
