atic/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T728,"])</script><script>self.__next_f.push([1,"\u003cb\u003e1. «evidence» e «information» no tienen plural.\u003c/b\u003e Ninguno de los dos. Nunca.\u003cbr/\u003e· \u003ci\u003eThere is \u003cb\u003eno evidence\u003c/b\u003e for that.\u003c/i\u003e — jamás «no evidences».\u003cbr/\u003e· \u003ci\u003eAll the \u003cb\u003einformation came\u003c/b\u003e from the same person.\u003c/i\u003e — jamás «all the informations».\u003cbr/\u003eVan con \u003cb\u003eis\u003c/b\u003e, no con \u003ci\u003eare\u003c/i\u003e, y si necesitas contarlos se usa \u003ci\u003ea piece of\u003c/i\u003e: \u003ci\u003etwo pieces of information\u003c/i\u003e. Es el mismo grupo que \u003ci\u003enews, advice, furniture, luggage\u003c/i\u003e que ya viste en A2, y el hispanohablante los pluraliza todos porque en español sí se pueden.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Dos conectores nuevos, y son los que te faltaban para argumentar:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eIn addition,\u003c/b\u003e — añade otra razón en la misma dirección. Abre frase y lleva coma. Es el hermano formal de \u003ci\u003ebesides\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eOn the other hand,\u003c/b\u003e — introduce la otra cara. No es «por otra parte» de relleno: exige que antes hayas dicho una cara.\u003cbr/\u003eLos dos son de tu nivel. \u003ci\u003eMoreover\u003c/i\u003e, \u003ci\u003efurthermore\u003c/i\u003e y \u003ci\u003ewhereas\u003c/i\u003e \u003cb\u003eno\u003c/b\u003e: son B2 y ponerlos no sube nada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. Y la pregunta del módulo: ¿hecho u opinión?\u003c/b\u003e\u003cbr/\u003eUn \u003cb\u003ehecho\u003c/b\u003e se puede comprobar: \u003ci\u003eTwo hundred people went to the meeting.\u003c/i\u003e Una \u003cb\u003eopinión\u003c/b\u003e es un juicio: \u003ci\u003eThe council has handled this badly.\u003c/i\u003e No es que una valga y la otra no — las dos van en un texto bueno. Lo que se cobra en el examen es \u003cb\u003econfundirlas\u003c/b\u003e: el Listening Part 4 pregunta literalmente cuál de las dos está diciendo cada voz, y el Reading Part 4 tiene siempre alguna pregunta cuya respuesta es lo que el autor \u003cb\u003eopina\u003c/b\u003e, no lo que cuenta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY un aviso de traducción:\u003c/b\u003e \u003ci\u003emisleading\u003c/i\u003e no es «mentira». Es \u003cb\u003eque induce a error\u003c/b\u003e: puede ser todo verdad y aun así llevarte a la conclusión equivocada. Un titular \u003ci\u003emisleading\u003c/i\u003e es la especialidad de la casa."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l8\",\"phaseId\":\"enb1m4\",\"title\":\"Fact or opinion?\",\"subtitle\":\"Pruebas, titulares que engañan — y tu carta al periódico\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que se comprueba y lo que se opina\",\"itemIds\":[\"enb1m4asurvey\",\"enb1m4evidence\",\"enb1m4misleading\",\"enb1m4theinformation\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m4factoropinion\",\"enb1m4checkbeforeyoushare\",\"enb1m4natrubbish\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos incontables, dos conectores y una pregunta\",\"body\":\"$17\",\"table\":[[\"No se dice\",\"Se dice\",\"Por qué\"],[\"There are no evidences.\",\"There is no evidence.\",\"incontable\"],[\"All the informations…\",\"All the information…\",\"incontable\"],[\"Moreover, the photo was old.\",\"In addition, the photo was old.\",\"moreover es B2\"],[\"The headline was a lie.\",\"The headline was misleading.\",\"puede ser verdad y engañar\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del argumento\",\"pairs\":[{\"target\":\"a survey\",\"source\":\"una encuesta\"},{\"target\":\"There is no evidence for that.\",\"source\":\"No hay pruebas de eso.\"},{\"target\":\"The headline was misleading.\",\"source\":\"El titular inducía a error.\"},{\"target\":\"Is that a fact or an opinion?\",\"source\":\"¿Eso es un hecho o una opinión?\"}],\"itemIds\":[\"enb1m4asurvey\",\"enb1m4evidence\",\"enb1m4misleading\",\"enb1m4factoropinion\"],\"tip\":\"«evidence» es «pruebas» en el sentido de indicios, no «evidencia» de «es evidente». Falso amigo de nivel medio, y de los que cambian el sentido de un párrafo entero.\"},{\"id\":\"enb1m4l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Hecho u opinión? Un hecho se puede comprobar; una opinión, no\",\"categories\":[\"HECHO — se puede comprobar\",\"OPINIÓN — es un juicio\"],\"items\":[{\"text\":\"Two hundred people went to the meeting.\",\"bucket\":0},{\"text\":\"The survey was carried out in June.\",\"bucket\":0},{\"text\":\"The photo was taken in 2019.\",\"bucket\":0},{\"text\":\"The paper is printed once a fortnight.\",\"bucket\":0},{\"text\":\"The headline was misleading.\",\"bucket\":1},{\"text\":\"The council has handled this badly.\",\"bucket\":1},{\"text\":\"It is the best local paper in London.\",\"bucket\":1},{\"text\":\"Nobody should share that post.\",\"bucket\":1}],\"itemIds\":[\"enb1m4asurvey\",\"enb1m4misleading\",\"enb1m4council\"],\"tip\":\"Truco para separarlas: pregúntate «¿cómo lo compruebo?». Si tiene respuesta —cuento a la gente, miro la fecha— es hecho. Si la respuesta es «depende de a quién preguntes», es opinión.\"},{\"id\":\"enb1m4l8e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"There are no evidences for that.\",\"answers\":[\"There is no evidence for that.\"],\"why\":\"«evidence» es incontable en inglés: no tiene plural y va con «is». El español sí pluraliza «pruebas», y de ahí sale el calco.\",\"translation\":\"No hay pruebas de eso.\",\"itemIds\":[\"enb1m4evidence\"]},{\"id\":\"enb1m4l8e4\",\"type\":\"mc\",\"prompt\":\"El falso amigo del módulo\",\"question\":\"«The headline was misleading» significa que el titular…\",\"options\":[\"era mentira\",\"inducía a error, aunque fuera verdad\",\"estaba mal escrito\"],\"answer\":1,\"whyWrong\":[\"Eso sería «the headline was false». «Misleading» puede ser cierto palabra por palabra y aun así llevarte al sitio equivocado.\",null,\"Eso sería «badly written». «Misleading» habla del efecto, no de la redacción.\"],\"itemIds\":[\"enb1m4misleading\"],\"tip\":\"El titular «POOL TO CLOSE IN MARCH» sobre una consulta que aún no ha empezado no miente en ninguna palabra: solo te deja creyendo algo que no es. Eso es «misleading».\"},{\"id\":\"enb1m4l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa el conector que añade\",\"text\":\"The photo was six years old. ___, it wasn't even taken in this city.\",\"answers\":[\"In addition\",\"Besides\"],\"translation\":\"La foto tenía seis años. Además, ni siquiera estaba hecha en esta ciudad.\",\"hints\":[\"Añade una segunda razón en la misma dirección\",\"In a-ddi-tion\"],\"itemIds\":[\"enb1m4inaddition\",\"enb1m1besides\"],\"tip\":\"«In addition» y «Besides» valen los dos aquí. El primero es más formal y el segundo más hablado, pero los dos llevan coma detrás — y esa coma puntúa en el criterio de Organisation.\"},{\"id\":\"enb1m4l8e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de opinión — cuatro conectores\",\"text\":\"The story was based on one screenshot. ___, the photo was six years old and it was taken in another city. ___, the paper printed a correction the following week, ___ most papers never do that. Check things before you share them; ___ you end up passing on somebody else's mistake.\",\"answers\":[\"In addition\",\"On the other hand\",\"although\",\"otherwise\"],\"bank\":[\"In addition\",\"On the other hand\",\"although\",\"otherwise\",\"unless\",\"despite\",\"for instance\"],\"translation\":\"La historia se apoyaba en una sola captura de pantalla. Además, la foto tenía seis años y estaba hecha en otra ciudad. Por otro lado, el periódico publicó una corrección a la semana siguiente, cosa que casi ningún periódico hace. Comprueba las cosas antes de compartirlas; si no, acabas propagando el error de otro.\",\"itemIds\":[\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m1although\",\"enb1m2otherwise\"],\"tip\":\"Mira el orden: primero se acumulan las pegas, luego se concede algo a la otra parte y al final se cierra con un consejo. Esa es la forma de un párrafo de opinión de B1, y los conectores son los que la hacen visible.\"},{\"id\":\"enb1m4l8e7\",\"type\":\"transform\",\"prompt\":\"Sube el registro sin cambiar el contenido\",\"source\":\"Everyone says the headline gave the wrong idea.\",\"instruction\":\"Empieza por «It…» y usa «misleading»\",\"answers\":[\"It is said that the headline was misleading\",\"It is said that the headline was misleading.\"],\"translation\":\"Todo el mundo dice que el titular inducía a error.\",\"hints\":[\"Molde 1 de la lección anterior\",\"It is said that the headline was ...\"],\"itemIds\":[\"enb1m4misleading\",\"enb1m4itissaidthat\"],\"tip\":\"Dos cambios en una frase: el molde impersonal y una palabra precisa en vez de tres vagas. Eso es exactamente lo que separa una banda de otra en el criterio de vocabulario.\"},{\"id\":\"enb1m4l8e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «gave» y sin «wrong»\",\"source\":\"The headline gave the wrong idea.\",\"forbid\":[\"gave\",\"wrong\"],\"answers\":[\"The headline was misleading\",\"The headline was misleading.\"],\"translation\":\"El titular inducía a error.\",\"hints\":[\"Una sola palabra sustituye a las tres\",\"The headline was mis...\"],\"itemIds\":[\"enb1m4misleading\"],\"tip\":\"Tres palabras vagas cambiadas por una precisa. En un texto de cien palabras hacer esto dos o tres veces se nota más que añadir vocabulario raro.\"},{\"id\":\"enb1m4l8e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Toda la información venía de la misma persona.\",\"answers\":[\"All the information came from the same person\",\"All the information came from the same person.\"],\"hint\":\"Ojo con el número: en inglés esa palabra no tiene plural\",\"itemIds\":[\"enb1m4theinformation\"],\"tip\":\"«information» en singular siempre, y con verbo en singular. Si te sale «informations», es el español escribiendo por ti.\"},{\"id\":\"enb1m4l8e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"On the other hand, there is no evidence for any of it.\",\"answers\":[\"Por otro lado, no hay pruebas de nada de eso\",\"Por otra parte, no hay pruebas de nada de eso\"],\"itemIds\":[\"enb1m4ontheotherhand\",\"enb1m4evidence\"],\"tip\":\"«On the other hand» necesita que antes hayas dado la primera cara. Si lo pones sin haberla dado, el corrector lo lee como relleno y no cuenta como cohesión.\"},{\"id\":\"enb1m4l8e11\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee lo que ha publicado el periódico, mira el esqueleto y contesta. 70-100 palabras, tres conectores distintos.\",\"scenario\":\"El periódico de tu barrio ha publicado una nota sobre la biblioteca donde trabajas y ha pedido cartas de los lectores. Escribe al director tratando LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Hackney Gazette — nota del director, 12 de marzo\",\"text\":\"LIBRARY 'TO CLOSE IN MARCH'. Readers have told us that the evening service at the library is to be closed this month. The council has not commented, and a photograph of the doors has been widely shared online. If you use the library in the evenings, write to the Editor and tell us what you know: 4 Mare Street, London E8.\"},\"bullets\":[\"Di a qué texto contestas y dónde lo has leído.\",\"Corrige un dato: di lo que se ha decidido de verdad, en pasiva.\",\"Pide algo al periódico con cortesía: una corrección, una respuesta.\"],\"checks\":[{\"re\":\"(gazette|article|letter|paper)\",\"label\":\"Dices a qué texto contestas\"},{\"re\":\"(has|have) (not )?been\",\"label\":\"Corriges el dato en pasiva\"},{\"re\":\"(could you|would you|i would be grateful|please)\",\"label\":\"Pides algo con cortesía\"}],\"frame\":[\"Saludo: «Dear Editor,» — con coma\",\"Por qué escribes: «I am writing about the article on… , which was published…»\",\"Quién eres, en una línea: «I work at the library and…»\",\"Punto 2 — la corrección: «No decision has been taken yet, although…»\",\"Punto 3 — la petición: «Could you print a short correction…, please?»\",\"Cierre y despedida formal: «Yours sincerely, …»\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"though\",\"in addition\",\"on the other hand\",\"besides\",\"therefore\",\"otherwise\",\"at least\",\"apart from\",\"while\",\"since\",\"for instance\",\"despite\",\"in spite of\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Editor,\\nI am writing about the article on the evening library service, which was published in the Gazette last week. I work there, and I would like to correct one point: no decision has been taken yet, although our opening hours have been cut. In addition, the photograph was not taken in Hackney. Could you print a short correction next week, please? On the other hand, I am glad the story was covered at all.\\nYours sincerely,\\nValeria Soto\",\"itemIds\":[\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m4wascovered\",\"enb1m4hasbeenclosed\",\"enb1m1although\"],\"tip\":\"Cuenta las palabras: 70-100. Y fíjate en que el modelo no pide nada con «I want»: en inglés el registro se juega ahí, en la forma de la petición. «Could you… please?» y «I would like to…» son las dos fórmulas que tienes que llevar puestas.\"},{\"id\":\"enb1m4l8e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la escalera entera\",\"text\":\"That's rubbish. I don't think that's accurate. There is no evidence for that.\",\"phonetic\":\"dats RÁ-bish · ai dóunt zink dats Á-kiu-rat · déa is̬ nóu É-vi-dens foo dat\",\"translation\":\"Eso es una tontería. · No creo que eso sea exacto. · No hay pruebas de eso.\",\"itemIds\":[\"enb1m4natrubbish\",\"enb1m4evidence\"],\"tip\":\"Las tres dicen «no me lo creo» y ninguna es intercambiable con las otras. La primera con amigos, la segunda en una reunión, la tercera por escrito. Elegir mal no es un error de gramática: es un error de persona.\"},{\"id\":\"enb1m4l8e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Compruébalo antes de compartirlo: el titular inducía a error.\",\"answers\":[\"Check it before you share it: the headline was misleading\",\"Check it before you share it. The headline was misleading\",\"Check it before you share it, the headline was misleading\"],\"hints\":[\"Empieza con un imperativo\",\"Check it before you ..., the headline was ...\"],\"itemIds\":[\"enb1m4checkbeforeyoushare\",\"enb1m4misleading\"],\"tip\":\"Fíjate en el tiempo verbal tras «before»: «before you share it», presente. En inglés, después de «before», «when» y «as soon as» no se pone futuro nunca — y el español sí lo pone.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m4-4\",\"book\":\"That is not true.\",\"real\":\"That's rubbish.\",\"meaning\":\"Eso es una tontería (literalmente «eso es basura»)\",\"when\":\"Con amigos, en la cocina, en el pub. Es fuerte pero no grosero. Con tu jefa, en una reunión o por escrito, NO: ahí baja el registro de golpe y te deja como alguien que no sabe discutir.\",\"register\":\"amigos\",\"exam\":\"I don't think that's accurate.\",\"note\":\"El inglés discrepa por abajo, no por arriba: «I'm not sure that's right», «I don't think that's accurate». Cuanto más fuerte es tu desacuerdo, más suave se pone la fórmula — al revés que en español.\",\"sound\":\"dats RÁ-bish\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m4natrubbish\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
