n \u003cb\u003ein her forties with short dark hair\u003c/b\u003e\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eDelante caben los adjetivos sueltos, en el orden del A2 (\u003ci\u003ea big old black bag\u003c/i\u003e). Detrás cabe todo lo demás, y son \u003cb\u003etres formas\u003c/b\u003e, que son las tres del nivel:\u003cbr/\u003e· \u003cb\u003econ preposición\u003c/b\u003e: \u003ci\u003ea woman \u003cb\u003ein\u003c/b\u003e a red coat\u003c/i\u003e, \u003ci\u003ea man \u003cb\u003ewith\u003c/b\u003e a beard\u003c/i\u003e, \u003ci\u003ea man \u003cb\u003eof\u003c/b\u003e average height\u003c/i\u003e, \u003ci\u003ea woman \u003cb\u003ein\u003c/b\u003e her forties\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003econ relativa\u003c/b\u003e: \u003ci\u003ethe woman \u003cb\u003ewho runs\u003c/b\u003e the community centre\u003c/i\u003e. Es el módulo 2 trabajando aquí dentro, sin anunciarse.\u003cbr/\u003e· \u003cb\u003econ participio\u003c/b\u003e, que es la elegante: \u003ci\u003ethe man \u003cb\u003estanding\u003c/b\u003e by the door\u003c/i\u003e. Es la relativa a la que le has quitado el \u003ci\u003ewho is\u003c/i\u003e. Las dos son correctas; la corta suena mejor.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco:\u003c/b\u003e el español también pone lo largo detrás («una mujer alta de unos cuarenta con el pelo corto»), así que el orden no es el problema. El problema es \u003cb\u003eintentar meter lo largo delante\u003c/b\u003e: \u003ci\u003e\u003cs\u003ea with short dark hair woman\u003c/s\u003e\u003c/i\u003e. Si tiene más de una palabra y lleva preposición, va detrás. Siempre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas edades, que se dicen de una forma muy concreta:\u003c/b\u003e \u003ci\u003ein her twenties\u003c/i\u003e, \u003ci\u003ein his thirties\u003c/i\u003e, \u003ci\u003ein her early forties\u003c/i\u003e, \u003ci\u003ein his late fifties\u003c/i\u003e. Con \u003cb\u003ein\u003c/b\u003e, con posesivo y en plural. Y para la estatura, cuando no es ni alto ni bajo: \u003ci\u003e\u003cb\u003eof average height\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora lo que de verdad se pregunta en el examen.\u003c/b\u003e Del A2 traes las dos preguntas: \u003ci\u003eWhat does she look like?\u003c/i\u003e (la cara) y \u003ci\u003eWhat's she like?\u003c/i\u003e (el carácter). La segunda es la que da puntos, porque pide adjetivos que no son ni \u003ci\u003enice\u003c/i\u003e ni \u003ci\u003egood\u003c/i\u003e:\u003cbr/\u003e· \u003cb\u003egenerous\u003c/b\u003e — generoso, con el dinero y con el tiempo.\u003cbr/\u003e· \u003cb\u003estubborn\u003c/b\u003e — cabezota. Ni bueno ni malo; depende del día.\u003cbr/\u003e· \u003cb\u003ejealous\u003c/b\u003e — \u003cb\u003eceloso Y envidioso\u003c/b\u003e: el inglés usa la misma palabra para las dos cosas, y va con \u003cb\u003eof\u003c/b\u003e. \u003ci\u003eShe was jealous \u003cb\u003eof\u003c/b\u003e her sister.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003elook up to somebody\u003c/b\u003e — admirar a alguien, tenerlo de referente. Y su contrario, \u003ci\u003elook down on somebody\u003c/i\u003e, despreciarlo.\u003cbr/\u003e· \u003cb\u003etake after somebody\u003c/b\u003e, de la lección 4: parecerse en el carácter."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l8\",\"phaseId\":\"enb1m10\",\"title\":\"A tall woman in her forties\",\"subtitle\":\"Lo corto delante, lo largo detrás — y el carácter, que es lo que de verdad se pregunta\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Personas descritas en una sola pieza\",\"itemIds\":[\"enb1m10atallwomaninherforties\",\"enb1m10ofaverageheight\",\"enb1m10thewomanwhoruns\",\"enb1m10themanstandingbythedoor\",\"enb1m10generous\",\"enb1m10stubborn\",\"enb1m10jealousof\",\"enb1m10lookupto\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: lo corto delante, lo largo detrás\",\"body\":\"$17\",\"table\":[[\"Pieza\",\"Dónde va\",\"Ejemplo\"],[\"adjetivo suelto\",\"delante\",\"a tall woman\"],[\"preposición + sustantivo\",\"detrás\",\"…in her forties, with short dark hair\"],[\"relativa\",\"detrás\",\"…who runs the centre\"],[\"participio\",\"detrás\",\"…standing by the door\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro descripciones\",\"pairs\":[{\"target\":\"a tall woman in her forties with short dark hair\",\"source\":\"una mujer alta, de unos cuarenta y tantos, con el pelo corto y moreno\"},{\"target\":\"a man of average height\",\"source\":\"un hombre de estatura media\"},{\"target\":\"the man standing by the door\",\"source\":\"el hombre que está de pie junto a la puerta\"},{\"target\":\"I look up to my older sister.\",\"source\":\"Admiro a mi hermana mayor.\"}],\"itemIds\":[\"enb1m10atallwomaninherforties\",\"enb1m10ofaverageheight\",\"enb1m10themanstandingbythedoor\",\"enb1m10lookupto\"],\"tip\":\"Mira la primera: un adjetivo delante y dos bloques detrás. Con esa plantilla describes a cualquiera del examen sin repetir «and she has… and she is…».\"},{\"id\":\"enb1m10l8e2\",\"type\":\"mc\",\"prompt\":\"Dónde va cada cosa\",\"question\":\"«Una mujer con el pelo corto» →\",\"options\":[\"a woman with short hair\",\"a with short hair woman\",\"a short hair's woman\"],\"answer\":0,\"whyWrong\":[null,\"Lo que lleva preposición va SIEMPRE detrás del sustantivo. Delante solo caben adjetivos sueltos.\",\"El apóstrofo es para los dueños («Amy's flat»), no para las características.\"],\"itemIds\":[\"enb1m10atallwomaninherforties\",\"ena2m3shorthair\"],\"tip\":\"«Short» sola sí puede ir delante: «a short woman». Lo que no puede ir delante es «with short hair», porque son tres palabras y una preposición.\"},{\"id\":\"enb1m10l8e3\",\"type\":\"bucket\",\"prompt\":\"¿Delante o detrás del sustantivo?\",\"categories\":[\"Delante del sustantivo\",\"Detrás del sustantivo\"],\"items\":[{\"text\":\"tall\",\"bucket\":0},{\"text\":\"in her forties\",\"bucket\":1},{\"text\":\"dark\",\"bucket\":0},{\"text\":\"with short dark hair\",\"bucket\":1},{\"text\":\"standing by the door\",\"bucket\":1},{\"text\":\"old\",\"bucket\":0}],\"itemIds\":[\"enb1m10atallwomaninherforties\",\"enb1m10themanstandingbythedoor\"],\"tip\":\"Cuenta las palabras de cada ficha y ya tienes la respuesta sin pensar: una palabra, delante; dos o más, detrás. La regla aguanta casi siempre.\"},{\"id\":\"enb1m10l8e4\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra: la preposición del adjetivo.\",\"wrong\":\"She was jealous from her sister.\",\"answers\":[\"She was jealous of her sister.\"],\"why\":\"«Jealous» pide «of», igual que «proud of» o «afraid of». El español dice «celosa DE», y aun así el calco de «from» aparece constantemente porque suena a «desde».\",\"translation\":\"Tenía envidia de su hermana.\",\"itemIds\":[\"enb1m10jealousof\",\"enb1m1proudof\"]},{\"id\":\"enb1m10l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición de la edad\",\"text\":\"She's a quiet woman ___ her fifties who has lived here all her life.\",\"answers\":[\"in\"],\"translation\":\"Es una mujer callada, de cincuenta y tantos, que ha vivido aquí toda la vida.\",\"hints\":[\"Dos letras\",\"La misma que en «i-n her twenties»\"],\"itemIds\":[\"enb1m10atallwomaninherforties\",\"ena2m3hesinhisthirties\"],\"tip\":\"La fórmula entera es «in + posesivo + década en plural»: in her twenties, in his thirties, in her early forties. Nunca «she has forty years», que es el calco que todo el mundo intenta el primer año.\"},{\"id\":\"enb1m10l8e6\",\"type\":\"build\",\"prompt\":\"Construye el sintagma entero\",\"target\":\"a tall woman in her forties with short dark hair\",\"translation\":\"una mujer alta, de unos cuarenta y tantos, con el pelo corto y moreno\",\"distractors\":[\"is\",\"and\"],\"itemIds\":[\"enb1m10atallwomaninherforties\"],\"tip\":\"Sobran «is» y «and» porque esto no es una frase: es UNA pieza, un solo bloque que después puede ser el sujeto de cualquier oración. Ahí está la diferencia entre A2 y B1.\"},{\"id\":\"enb1m10l8e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la descripción de Yvonne\",\"text\":\"The woman ___ runs the community centre is a tall woman ___ her forties ___ short dark hair.\",\"answers\":[\"who\",\"in\",\"with\"],\"bank\":[\"who\",\"in\",\"with\",\"which\",\"on\",\"of\"],\"translation\":\"La mujer que lleva el centro cívico es una mujer alta, de cuarenta y tantos, con el pelo corto y moreno.\",\"itemIds\":[\"enb1m10thewomanwhoruns\",\"enb1m10atallwomaninherforties\"],\"tip\":\"Tres piezas de post-modificación en una sola frase: una relativa y dos preposiciones. Escribir así en el Writing sube el criterio de estructuras sin usar ni una palabra difícil.\"},{\"id\":\"enb1m10l8e8\",\"type\":\"transform\",\"prompt\":\"Tres frases cortas, un solo sintagma\",\"source\":\"She is tall. She is in her forties. She has short dark hair.\",\"instruction\":\"Descríbela en una sola pieza, empezando por «a tall woman…»\",\"answers\":[\"a tall woman in her forties with short dark hair\",\"A tall woman in her forties with short dark hair\",\"a tall woman in her forties with short, dark hair\"],\"translation\":\"una mujer alta, de unos cuarenta y tantos, con el pelo corto y moreno\",\"hints\":[\"El adjetivo suelto va delante y los dos bloques largos detrás\",\"a tall woman ... with ...\"],\"itemIds\":[\"enb1m10atallwomaninherforties\"],\"tip\":\"Tres frases de A2 comprimidas en una pieza de B1. En el Reading Part 2, media pregunta se contesta reconociendo que un sintagma largo se refiere a alguien que ya salió antes.\"},{\"id\":\"enb1m10l8e9\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el anuncio, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"El centro cívico de tu barrio busca candidaturas para el premio a la vecina del año. Escribe al comité proponiendo a Nora, tu vecina. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Palmer Road Community Centre\",\"text\":\"NEIGHBOUR OF THE YEAR. Every year we ask residents to tell us about somebody on their street who makes a difference. Write to the committee and tell us who the person is, one thing they have done, and why you think they should win. Letters by 30 April, please.\"},\"bullets\":[\"Di a quién propones y descríbela en una sola pieza (edad, aspecto o carácter).\",\"Cuenta UNA cosa concreta que hizo, y lo que ya había pasado antes.\",\"Explica por qué crees que debería ganar, y despídete pidiendo respuesta.\"],\"checks\":[{\"re\":\"(woman in her|man in his|of average height|with (short|long|grey|dark)|nominate)\",\"label\":\"Dices a quién propones y la describes en una pieza\"},{\"re\":\"(had not|hadn'?t|had been|had put|had gone|found out|noticed)\",\"label\":\"Cuentas una cosa concreta y lo que ya había pasado antes\"},{\"re\":\"(deserve|should win|never mentions|without being asked|look forward)\",\"label\":\"Explicas por qué debería ganar y te despides\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — el anuncio no da nombre, así que sin nombre\",\"Por qué escribes: «I would like to nominate…» + quién es, en un solo sintagma\",\"El hecho concreto, en pasado simple\",\"Lo que ya había pasado antes, con «had»: «…because the mother had been taken into hospital»\",\"El motivo, con un conector de contraste o de suma: «Although…» / «Besides,…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully,…»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"besides\",\"despite\",\"therefore\",\"in addition\",\"on the other hand\",\"apart from\",\"while\",\"at least\",\"for instance\",\"though\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI would like to nominate my neighbour, Nora, for this year's award. She is a woman in her eighties with a very loud doorbell and an opinion about everybody.\\nAlthough she has lived on Palmer Road for fifty years, she still learns the name of every new tenant. Last winter she noticed that the family at number twelve had not put their bins out, and she found out that the mother was in hospital.\\nBesides, she never mentions any of it.\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m10atallwomaninherforties\",\"enb1m10hadalreadyleft\",\"enb1m1although\",\"enb1m1besides\",\"enb1m6lookafter\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y mira el modelo: la descripción no ocupa tres frases, ocupa media («a woman in her eighties with a very loud doorbell»), y el «had not put» coloca la causa por debajo del hecho sin explicar nada. Eso es lo que el criterio de estructuras llama rango.\"},{\"id\":\"enb1m10l8e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo más corto — sin usar las palabras prohibidas\",\"source\":\"the man who is standing by the door\",\"forbid\":[\"who\",\"is\"],\"answers\":[\"the man standing by the door\",\"the man by the door\"],\"translation\":\"el hombre que está de pie junto a la puerta\",\"itemIds\":[\"enb1m10themanstandingbythedoor\"],\"tip\":\"Quitarle el «who is» a una relativa y dejar el participio se llama reducción, y es de las cosas que más se leen y menos se escriben. Con hacerlo una vez por texto, ya se nota.\"},{\"id\":\"enb1m10l8e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Es muy cabezota, pero es la persona más generosa que conozco.\",\"answers\":[\"She's very stubborn, but she's the most generous person I know\",\"She is very stubborn, but she is the most generous person I know\",\"He's very stubborn, but he's the most generous person I know\"],\"hint\":\"Los dos adjetivos son de carácter, no de aspecto\",\"itemIds\":[\"enb1m10stubborn\",\"enb1m10generous\"],\"tip\":\"«Stubborn» y «generous» son justo el tipo de adjetivo que el examen busca cuando pregunta «What's he like?». Contestar «nice» te entienden, pero no puntúa igual.\"},{\"id\":\"enb1m10l8e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"I've always looked up to her, even when we didn't get on.\",\"answers\":[\"Siempre la he admirado, incluso cuando no nos llevábamos bien\",\"Siempre ha sido mi referente, incluso cuando no nos llevábamos bien\",\"Siempre la he admirado, hasta cuando no nos llevábamos bien\"],\"itemIds\":[\"enb1m10lookupto\",\"enb1m1getonwith\"],\"tip\":\"Ojo con no confundir «look up to» (admirar) con «look after» (cuidar) ni con «look up» a secas (buscar una palabra). Son tres phrasal verbs distintos con el mismo verbo.\"},{\"id\":\"enb1m10l8e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la descripción completa de una persona\",\"text\":\"She's a tall woman in her forties with short dark hair, and she's the most generous person I know.\",\"phonetic\":\"shis a tool UÚ-man in jee FÓO-tis̬ uid shóot daak jéa, and shis de móust DCHÉ-na-ras PÉE-son ai nóu\",\"translation\":\"Es una mujer alta, de unos cuarenta y tantos, con el pelo corto y moreno, y es la persona más generosa que conozco.\",\"itemIds\":[\"enb1m10atallwomaninherforties\",\"enb1m10generous\"],\"tip\":\"Aspecto y carácter en una sola respiración, sin repetir «she is» tres veces. Esta frase, cambiando los adjetivos, sirve tal cual para el Speaking Part 1.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/ses
