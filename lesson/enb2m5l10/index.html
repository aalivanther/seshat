/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4fd,Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. Hoy toca el \u003cb\u003eListening Part 3\u003c/b\u003e: un \u003cb\u003emonólogo\u003c/b\u003e —charla, presentación, emisión—, una \u003cb\u003eficha de siete encabezados\u003c/b\u003e, y hay que escribir la información correcta en cada uno. Se oye \u003cb\u003edos veces\u003c/b\u003e, como todo el Listening.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl salto respecto al B1:\u003c/b\u003e allí el tope eran \u003cb\u003euna a tres palabras\u003c/b\u003e. En B2 el Practice Paper pide literalmente \u003ci\u003eshort answers of one to five words\u003c/i\u003e. La unidad de dictado ya no es una palabra suelta: es un sintagma. Escribir de más sigue restando; escribir de menos, también, si te dejas el dato.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué se falla:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003ePor no leer los encabezados antes.\u003c/b\u003e «Venue», «Number of…», «Next talk on» te dicen el tipo de dato.\u003cbr/\u003e2. \u003cb\u003ePor copiar una frase entera.\u003c/b\u003e Cinco palabras son el techo, no el objetivo. Recorta.\u003cbr/\u003e3. \u003cb\u003ePor no usar el cuaderno.\u003c/b\u003e En B2 la respuesta está más lejos: el dato del hueco 6 llega al minuto cuatro.\u003cbr/\u003e4. \u003cb\u003ePor la ortografía.\u003c/b\u003e El baremo acepta \u003ci\u003eany recognisable spelling\u003c/i\u003e y variantes (\u003ci\u003e16 / sixteen\u003c/i\u003e). No acepta un dato distinto.\u003cbr/\u003e\u003cbr/\u003eHoy oyes la charla de Dr Haq en la biblioteca, dos veces, y rellenas los siete huecos. El audio no se muestra: la pregunta, sí."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l10\",\"phaseId\":\"enb2m5\",\"title\":\"Exam lab: Listening Part 3\",\"subtitle\":\"Un monólogo, una ficha de siete huecos, y de una a cinco palabras\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos reglas de la ficha, y el campo que suena\",\"itemIds\":[\"enb2m5oneoffivewords\",\"ena2m12theheading\",\"enb2m5scientificdevelopment\",\"enb2m5spaceexploration\",\"enb2m5invention\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 3 en B2, y por qué ya no es una palabra suelta\",\"body\":\"$17\",\"table\":[[\"Encabezado\",\"Qué dato buscas\",\"Respuesta válida (1-5 palabras)\"],[\"Venue\",\"un sitio\",\"Kentish Town Library\"],[\"Number in the sample\",\"una cifra\",\"fifty / 50 (residents)\"],[\"Main finding\",\"un resultado corto\",\"brains prefer a story\"],[\"Next talk on\",\"un tema\",\"space exploration\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Part 3 del B2, ¿cuál es el tope por hueco?\",\"options\":[\"De una a cinco palabras\",\"De una a tres palabras, como en B1\",\"Una frase completa, sin tope\"],\"answer\":0,\"whyWrong\":[null,\"Ese era el B1. En B2 el enunciado oficial dice one to five words.\",\"Sin tope se acaba escribiendo lo oído entero, y el hueco se anula.\"],\"itemIds\":[\"enb2m5oneoffivewords\",\"enb1m3makenotes\"],\"tip\":\"Cinco no es un premio: es el techo. La respuesta buena suele tener dos o tres. Recorta lo que el encabezado ya dice.\"},{\"id\":\"enb2m5l10e2\",\"type\":\"mc\",\"prompt\":\"Qué se hace primero\",\"question\":\"Antes del play, ¿qué haces?\",\"options\":[\"Leer los siete encabezados y decidir qué TIPO de dato busca cada uno\",\"Esperar a oír el audio y luego mirar la ficha\",\"Traducir los encabezados palabra por palabra\"],\"answer\":0,\"whyWrong\":[null,\"Sin saber qué cazas, escribes lo que no sirve. El dato pasa y no vuelve hasta la segunda escucha.\",\"Traducir no te dice si buscas un sitio, una cifra o un tema. El tipo de dato sí.\"],\"itemIds\":[\"ena2m12theheading\"],\"tip\":\"«Number of…» ya te dice que viene una cifra; «Venue», un sitio; «Next talk on», un tema. El oído caza lo que el ojo ha encargado.\"},{\"id\":\"enb2m5l10e3\",\"type\":\"audiomc\",\"prompt\":\"PRIMERA ESCUCHA · La charla entera. Lee la pregunta antes. Cuaderno abierto: vas a necesitar esas notas siete veces.\",\"notepad\":true,\"audio\":\"Good evening, and thank you to Kentish Town Library for having me. I'm Farida Haq. I'll be speaking for about forty minutes, and there will be time for questions at the end. I want to start with a study from the Indian Institute of Science: a sample of fifty residents in one block were asked what they thought when the landing lights flickered. Thirty-one chose something unexplained. The wiring report was on the hall table. That is the finding I want you to steal: brains prefer a story to a pipe. If you would like the paper, it is on the table by the door, in a blue folder. Next month, on the twelfth of May, I will be back to talk about space exploration and the lights we mistake for signs. You can book at reception, and you do not need to have come tonight. One last practical thing: the caretaker has asked me to finish by eight, because the alarm is set. I am due to start the questions at ten to. Thank you.\",\"question\":\"¿De qué trata principalmente la charla?\",\"options\":[\"De un estudio sobre por qué la gente prefiere una historia a una causa aburrida\",\"De cómo reservar la charla de mayo sobre exploración espacial\",\"De un cambio de horario de la biblioteca\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es un anuncio al final, no el tema.\",\"El horario se menciona por el alarma del conserje, no como tema.\"],\"itemIds\":[\"enb2m5asampleof\",\"enb2m5spaceexploration\",\"enb2m5flickering\",\"enb2m5dueatseven\"],\"tip\":\"La primera frase útil no es «good evening»: es «I want to start with a study». En el Part 3, esa de la sala\",\"on the table ...\"],\"itemIds\":[\"enb2m5peerreviewed\",\"enb2m5oneoffivewords\"],\"tip\":\"«in a blue folder» y «on the table by the door» valen las dos: son el mismo dato en dos tamaños. Elige la que quepa en cinco.\"},{\"id\":\"enb2m5l10e8\",\"type\":\"type\",\"prompt\":\"FICHA · hueco 5 de 7 — «Date of the next talk». Máximo cinco palabras.\",\"question\":\"Date of the next talk\",\"answers\":[\"the twelfth of May\",\"twelfth of May\",\"12 May\",\"12th of May\",\"12th May\",\"May the twelfth\"],\"hints\":[\"Una fecha de primavera\",\"the twelfth of ...\"],\"itemIds\":[\"enb2m5oneoffivewords\"],\"tip\":\"«Next month, on the twelfth of May» — el «next month» lo come el encabezado si el examen es en abril; la fecha, no. Escribe la fecha.\"},{\"id\":\"enb2m5l10e9\",\"type\":\"type\",\"prompt\":\"FICHA · hueco 6 de 7 — «Topic of the next talk». Máximo cinco palabras.\",\"question\":\"Topic of the next talk\",\"answers\":[\"space exploration\",\"space exploration and lights\",\"lights we mistake for signs\"],\"hints\":[\"El campo SCIENCE del módulo\",\"space ex...\"],\"itemIds\":[\"enb2m5spaceexploration\",\"enb2m5oneoffivewords\"],\"tip\":\"«space exploration» son dos palabras y el dato entero. «and the lights we mistake for signs» te pasa de cinco si lo pegas todo.\"},{\"id\":\"enb2m5l10e10\",\"type\":\"type\",\"prompt\":\"FICHA · hueco 7 de 7 — «Where to book for May». Máximo cinco palabras.\",\"question\":\"Where to book for May\",\"answers\":[\"at reception\",\"reception\",\"book at reception\"],\"hints\":[\"Un sitio del edificio\",\"at re...\"],\"itemIds\":[\"enb2m5oneoffivewords\"],\"tip\":\"Y fíjate en la cola: «you do not need to have come tonight». El hueco pregunta dónde reservar, no si hace falta haber venido. El audio siempre trae un dato de más al lado del que sirve.\"},{\"id\":\"enb2m5l10e11\",\"type\":\"audiomc\",\"prompt\":\"SEGUNDA ESCUCHA · la misma charla. Comprueba tus siete huecos mientras suena.\",\"notepad\":true,\"audio\":\"Good evening, and thank you to Kentish Town Library for having me. I'm Farida Haq. I'll be speaking for about forty minutes, and there will be time for questions at the end. I want to start with a study from the Indian Institute of Science: a sample of fifty residents in one block were asked what they thought when the landing lights flickered. Thirty-one chose something unexplained. The wiring report was on the hall table. That is the finding I want you to steal: brains prefer a story to a pipe. If you would like the paper, it is on the table by the door, in a blue folder. Next month, on the twelfth of May, I will be back to talk about space exploration and the lights we mistake for signs. You can book at reception, and you do not need to have come tonight. One last practical thing: the caretaker has asked me to finish by eight, because the alarm is set. I am due to start the questions at ten to. Thank you.\",\"question\":\"¿A qué hora tiene que terminar, y por qué?\",\"options\":[\"A las ocho, porque el conserje pone la alarma\",\"A las diez menos diez, porque empiezan las preguntas\",\"A las nueve, porque la biblioteca cierra\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las diez menos diez es cuando empiezan las preguntas, no cuando termina la sesión.\",\"De las nueve no se dice nada.\"],\"itemIds\":[\"enb2m5dueatseven\",\"ena2m12theheading\"],\"tip\":\"«I am due to start the questions at ten to» es el due to de calendario. Si en el hueco te preguntaran «Time questions begin», la respuesta sería ten to eight, no eight.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/stati
