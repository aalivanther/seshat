u003cbr/\u003eValeria ha abierto su primera nómina en el 55, de camino a las tardes del mostrador. El bruto no es el líquido. Hay una casilla que no entiende. Nadia Kowalczyk, la de la agencia, le dijo «read the job description twice». Ahora sabe por qué.\",\"table\":[[\"El rodeo (comunica, no puntúa)\",\"El nombre (puntúa)\"],[\"they decided to close it\",\"the decision to close it\"],[\"prices went up\",\"the rise in / an increase in prices\"],[\"they paid us late\",\"the delay in payment\"],[\"make the situation better\",\"improve / ease\"],[\"a lot of money\",\"a considerable sum\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l1e1\",\"type\":\"match\",\"prompt\":\"Empareja el rodeo con el nombre\",\"pairs\":[{\"target\":\"The decision to close it angered everyone.\",\"source\":\"la decisión de cerrarlo enfadó a todos\"},{\"target\":\"The rise in prices cut our sales.\",\"source\":\"la subida de precios recortó las ventas\"},{\"target\":\"the delay in payment\",\"source\":\"el retraso en el pago\"},{\"target\":\"a circumlocution\",\"source\":\"un circunloquio\"}],\"itemIds\":[\"enb2m2thedecisionto\",\"enb2m2therisein\",\"enb2m2thedelayin\",\"enb2m2circumlocution\"]},{\"id\":\"enb2m2l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — el léxico del trabajo que ya es tuyo\",\"pairs\":[{\"target\":\"the salary\",\"source\":\"el sueldo (mensual, en el contrato)\"},{\"target\":\"my income\",\"source\":\"mis ingresos\"},{\"target\":\"good prospects\",\"source\":\"buenas perspectivas\"},{\"target\":\"overtime\",\"source\":\"horas extra\"},{\"target\":\"a permanent contract\",\"source\":\"un contrato indefinido\"}],\"targetSeconds\":22,\"itemIds\":[\"enb1m2salary\",\"enb1m2income\",\"enb1m2prospects\",\"enb1m2overtime\",\"enb1m2permanentcontract\"]},{\"id\":\"enb2m2l1e3\",\"type\":\"transform\",\"prompt\":\"Nominaliza\",\"source\":\"They decided to close it, and that angered everyone.\",\"instruction\":\"Una frase, con the decision to…\",\"answers\":[\"The decision to close it angered everyone\",\"The decision to close it angered everyone.\"],\"translation\":\"La decisión de cerrarlo enfadó a todo el mundo.\",\"itemIds\":[\"enb2m2thedecisionto\",\"enb2m2condense\"],\"tip\":\"Has perdido «they» y has ganado un sujeto que se puede modificar: the sudden decision, the unpopular decision. Eso es rango.\"},{\"id\":\"enb2m2l1e4\",\"type\":\"transform\",\"prompt\":\"Otra vez: del verbo al nombre\",\"source\":\"Because prices went up, we sold less.\",\"instruction\":\"The rise in prices…\",\"answers\":[\"The rise in prices cut our sales\",\"The rise in prices cut our sales.\",\"The rise in prices reduced our sales\"],\"translation\":\"La subida de precios recortó las ventas.\",\"itemIds\":[\"enb2m2therisein\",\"enb2m2cutoursales\"]},{\"id\":\"enb2m2l1e5\",\"type\":\"paraphrase\",\"prompt\":\"Prohíbe el rodeo: sin «went up» ni «gone up»\",\"source\":\"Overtime has gone up this month.\",\"forbid\":[\"gone up\",\"went up\",\"go up\",\"going up\"],\"answers\":[\"There has been an increase in overtime this month\",\"There has been an increase in overtime this month.\",\"There has been a rise in overtime this month\",\"Overtime has increased this month\"],\"translation\":\"Las horas extra han subido este mes.\",\"itemIds\":[\"enb2m2anincreasein\",\"enb2m2therisein\",\"enb2m2natgoup\"],\"tip\":\"En B2 se prohíbe el verbo fácil para forzar el nombre. «Go up» no está mal; «an increase in» puntúa en un informe.\"},{\"id\":\"enb2m2l1e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The delay of the payment angered everyone.\",\"answers\":[\"The delay in payment angered everyone.\",\"The delay in the payment angered everyone.\"],\"why\":\"Se dice delay IN, no delay OF. La preposición va pegada al nombre igual que al verbo: a delay in, a rise in, an increase in, a decision to.\",\"translation\":\"El retraso en el pago enfadó a todo el mundo.\",\"itemIds\":[\"enb2m2thedelayin\"]},{\" ice before you start — the hours are in there, and the pay. And when the first payslip comes, check the deductions. People always ring me about the delay in payment and it's usually National Insurance, not a mistake.\",\"question\":\"¿Qué le dice Nadia que mire cuando llegue la primera nómina?\",\"options\":[\"Las retenciones: casi nunca es un retraso, es la casilla de National Insurance\",\"Si el contrato es indefinido o no\",\"Si puede hacer horas extra la primera semana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del tipo de contrato no habla en este recado.\",\"De las horas extra no habla.\"],\"itemIds\":[\"enb2m2thedelayin\",\"enb2m2payslip\",\"enb2m2jobdescription\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m2-2\",\"book\":\"increase\",\"real\":\"The rent's gone up again.\",\"meaning\":\"subir / un aumento\",\"when\":\"El verbo de la calle, con Ben en el autobús o con Amy en la cocina. En un informe o en la Writing 1, a rise in / an increase in. «Gone up» en una carta a la agencia baja el registro; «an increase in» en el pub lo sube de más.\",\"register\":\"neutral\",\"exam\":\"There has been a rise in overtime this month.\",\"note\":\"Tres alturas de la misma subida: go up (calle) · increase (verbo neutro) · a rise in / an increase in (nombre de informe). El módulo entrena subir y bajar a voluntad.\",\"sound\":\"de rents gon ap a-GHÉN\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m2natgoup\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:
