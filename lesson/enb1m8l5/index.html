03cbr/\u003e· \u003cmark class=\"akk\"\u003eNeither shops take\u003c/mark\u003e → \u003cb\u003eNeither shop takes\u003c/b\u003e. \u003cb\u003eNeither\u003c/b\u003e y \u003cb\u003eeither\u003c/b\u003e van con \u003cb\u003esingular\u003c/b\u003e: hablan de dos cosas, pero de una en una.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa pareja de dos:\u003c/b\u003e \u003cb\u003eboth\u003c/b\u003e = los dos · \u003cb\u003eeither\u003c/b\u003e = uno cualquiera de los dos · \u003cb\u003eneither\u003c/b\u003e = ninguno de los dos. Y «neither» ya es negativo: \u003ci\u003eNeither shop takes batteries\u003c/i\u003e, no \u003cmark class=\"akk\"\u003eneither shop doesn't take\u003c/mark\u003e.\u003cbr/\u003e\u003cbr/\u003eSe pronuncia \u003cb\u003eNÁI-da\u003c/b\u003e o \u003cb\u003eNÍI-da\u003c/b\u003e según la persona: las dos son británicas y ninguna es mejor. Elige una y no la cambies."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l5\",\"phaseId\":\"enb1m8\",\"title\":\"All, most, both, neither\",\"subtitle\":\"Cuánta gente, cuántas cosas — y el «of» que sobra la mitad de las veces\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Contar sin números\",\"itemIds\":[\"enb1m8mostofthe\",\"enb1m8allthe\",\"enb1m8both\",\"enb1m8neither\",\"enb1m8eitherbin\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cuándo lleva «of» y cuándo no\",\"body\":\"$17\",\"table\":[[\"Sin «of»\",\"Con «of»\",\"Español\"],[\"most people\",\"most of the people here\",\"la mayoría de la gente\"],[\"all the bottles\",\"all of the bottles\",\"todas las botellas\"],[\"both bins\",\"both of the bins\",\"los dos cubos\"],[\"neither shop takes…\",\"neither of the shops takes…\",\"ninguna de las dos tiendas\"],[\"either bin\",\"either of the bins\",\"cualquiera de los dos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l5e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — los determinantes que ya traes del A2\",\"pairs\":[{\"target\":\"Most people take the bus.\",\"source\":\"La mayoría de la gente coge el autobús.\"},{\"target\":\"all of them\",\"source\":\"todos / todas (de un grupo concreto)\"},{\"target\":\"None of them.\",\"source\":\"Ninguno. / Ninguna de ellas.\"},{\"target\":\"more than ten pounds\",\"source\":\"más de diez libras\"}],\"targetSeconds\":20,\"itemIds\":[\"ena2m4mostpeople\",\"ena2m4allofthem\",\"ena2m4noneofthem\",\"ena2m4morethantenpounds\"],\"tip\":\"«None» es para tres o más; «neither», solo para dos. Es la única diferencia entre ellos, y hoy vas a usar las dos.\"},{\"id\":\"enb1m8l5e2\",\"type\":\"mc\",\"prompt\":\"«La mayoría del embalaje»\",\"question\":\"«La mayor parte del embalaje es plástico» →\",\"options\":[\"The most of the packaging is plastic.\",\"Most of the packaging is plastic.\",\"Most of packaging is plastic.\"],\"answer\":1,\"whyWrong\":[\"«The most» no significa «la mayoría»: significa «el que más» (the most expensive). Aquí el artículo sobra.\",null,\"Si pones «of», detrás tiene que ir «the»: most of THE packaging. Sin artículo, sería «most packaging» (en general).\"],\"itemIds\":[\"enb1m8mostofthe\",\"enb1m8packaging\"],\"tip\":\"Dos frases correctas y distintas: «most packaging» habla del embalaje del mundo; «most of the packaging» habla de este embalaje de aquí.\"},{\"id\":\"enb1m8l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The most of the packaging is plastic.\",\"answers\":[\"Most of the packaging is plastic.\"],\"why\":\"«la mayoría» es «most», sin artículo delante. «The most» es el superlativo: the most expensive, the most useful.\",\"translation\":\"La mayor parte del embalaje es plástico.\",\"itemIds\":[\"enb1m8mostofthe\"]},{\"id\":\"enb1m8l5e4\",\"type\":\"errorfix\",\"prompt\":\"El artículo que sobra, otra vez\",\"wrong\":\"The both bins were full.\",\"answers\":[\"Both bins were full.\"],\"why\":\"«both» nunca lleva «the» delante. Las dos formas correctas son «both bins» y «both of the bins».\",\"translation\":\"Los dos cubos estaban llenos.\",\"itemIds\":[\"enb1m8both\",\"enb1m8thebin\"]},{\"id\":\"enb1m8l5e5\",\"type\":\"errorfix\",\"prompt\":\"El artículo que falta\",\"wrong\":\"All of bottles go in the green bin.\",\"answers\":[\"All the bottles go in the green bin.\",\"All of the bottles go in the green bin.\"],\"why\":\"Con «of» hace falta un determinante detrás: all of THE bottles. Sin «of», también vale «all the bottles». Lo que no existe es «all of bottles».\",\"translation\":\"Todas las botellas van al cubo verde.\",\"itemIds\":[\"enb1m8allthe\"]},{\"id\":\"enb1m8l5e6\",\"type\":\"transform\",\"prompt\":\"«Neither» va con singular\",\"source\":\"Neither shops take old batteries.\",\"instruction\":\"Arregla la concordancia: neither pide singular\",\"answers\":[\"Neither shop takes old batteries\",\"Neither shop takes old batteries.\",\"Neither of the shops takes old batteries\"],\"translation\":\"Ninguna de las dos tiendas recoge pilas usadas.\",\"hints\":[\"Se quita una -s y se pone otra\",\"Neither shop ... old batteries\"],\"itemIds\":[\"enb1m8neither\",\"enshop\"],\"tip\":\"Aquí se mueven dos piezas a la vez —el sustantivo pierde la -s y el verbo la gana—, y por eso esto va de transformación y no de corrección: no es un error, son dos caras del mismo.\"},{\"id\":\"enb1m8l5e7\",\"type\":\"bucket\",\"prompt\":\"¿Lleva «of» o no?\",\"categories\":[\"SIN of\",\"CON of\"],\"items\":[{\"text\":\"most ___ people\",\"bucket\":0},{\"text\":\"most ___ the packaging\",\"bucket\":1},{\"text\":\"both ___ bins\",\"bucket\":0},{\"text\":\"both ___ them\",\"bucket\":1},{\"text\":\"either ___ bin\",\"bucket\":0},{\"text\":\"neither ___ the shops\",\"bucket\":1}],\"itemIds\":[\"enb1m8mostofthe\",\"enb1m8both\",\"enb1m8eitherbin\",\"enb1m8neither\"],\"tip\":\"Mira siempre la palabra de después del hueco: si es «the», «my», «this» o un pronombre, va «of». Si es un sustantivo pelado, no.\"},{\"id\":\"enb1m8l5e8\",\"type\":\"cloze\",\"prompt\":\"Completa con both, either o neither\",\"text\":\"___ shop takes old batteries, so I had to go to the supermarket.\",\"answers\":[\"Neither\"],\"translation\":\"Ninguna de las dos tiendas recoge pilas usadas, así que tuve que ir al supermercado.\",\"hints\":[\"Son dos tiendas y ninguna sirve\",\"N...\"],\"itemIds\":[\"enb1m8neither\",\"ensupermarket\"],\"tip\":\"El «so I had to go to the supermarket» es la prueba: si alguna de las dos hubiera servido, no habría hecho falta ir a otro sitio.\"},{\"id\":\"enb1m8l5e9\",\"type\":\"build\",\"prompt\":\"Construye la instrucción del cubo\",\"target\":\"All the bottles go in the green bin\",\"translation\":\"Todas las botellas van al cubo verde\",\"distractors\":[\"of\",\"most\"],\"itemIds\":[\"enb1m8allthe\",\"enb1m8thebin\",\"ena2m3green\"],\"tip\":\"Con «the» detrás, el «of» es opcional — y la ficha te lo pone a huevo para que caigas. Aquí la frase ya está completa sin él.\"},{\"id\":\"enb1m8l5e10\",\"type\":\"gapbank\",\"prompt\":\"Completa el aviso del portal\",\"text\":\"___ of the packaging you leave here is plastic — nine bags out of ten. ___ bins are emptied on Tuesday, the blue one and the black one. ___ of them takes glass: the glass bank is on the corner.\",\"answers\":[\"Most\",\"Both\",\"Neither\"],\"bank\":[\"Most\",\"Both\",\"Neither\",\"Every\",\"Each\",\"Either\"],\"translation\":\"La mayor parte del embalaje que dejáis aquí es plástico: nueve bolsas de cada diez. Los dos cubos se vacían el martes, el azul y el negro. Ninguno de los dos admite vidrio: el contenedor de vidrio está en la esquina.\",\"itemIds\":[\"enb1m8mostofthe\",\"enb1m8both\",\"enb1m8neither\",\"enb1m8packaging\"],\"tip\":\"Cada hueco lo decide un dato que está escrito al lado: «nine bags out of ten», «the blue one and the black one», «the glass bank is on the corner». Y ojo con la pareja que se confunde: con DOS cosas, «neither»; con tres o más, «none».\"},{\"id\":\"enb1m8l5e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Puedes usar cualquiera de los dos cubos.\",\"answers\":[\"You can use either bin\",\"You can use either of the bins\",\"You can use either bin.\"],\"hint\":\"Uno cualquiera de los dos, en singular\",\"itemIds\":[\"enb1m8eitherbin\",\"enb1m8thebin\"],\"tip\":\"«either bin», en singular, aunque hablemos de dos. El plural solo aparece cuando metes «of»: either of the bins.\"},{\"id\":\"enb1m8l5e12\",\"type\":\"order\",\"prompt\":\"Ordena la conversación del portal\",\"sentences\":[\"Do I put the glass in the blue bin or the black one?\",\"Neither, I'm afraid. Glass goes to the bank on the corner.\",\"Both of them were full again this morning, anyway.\",\"I know. Most of the flats leave the boxes on the floor now.\"],\"translation\":\"«¿El vidrio lo echo al cubo azul o al negro?» «En ninguno de los dos, me temo. El vidrio va al contenedor de la esquina.» «Los dos estaban llenos otra vez esta mañana, por cierto.» «Ya. La mayoría de los pisos deja ahora las cajas en el suelo.»\",\"itemIds\":[\"enb1m8neither\",\"enb1m8both\",\"enb1m8mostofthe\"],\"tip\":\"Los tres determinantes seguidos, en una conversación de cuatro líneas. Así es como salen de verdad: no de uno en uno, sino encadenados.\"},{\"id\":\"enb1m8l5e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La mayor parte del embalaje es plástico, y los dos cubos estaban llenos.\",\"answers\":[\"Most of the packaging is plastic and both bins were full\",\"Most of the packaging is plastic, and both bins were full\",\"Most of the packaging is plastic and both of the bins were full\"],\"hints\":[\"«La mayoría» no lleva artículo delante\",\"Most of the ... and both ... were full\"],\"itemIds\":[\"enb1m8mostofthe\",\"enb1m8both\",\"enb1m8packaging\"],\"tip\":\"Ni «the most» ni «the both». Si te han salido las dos sin artículo, los dos calcos están cerrados.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$
