n Kompromiss schreibt, …\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003einsofern\u003c/b\u003e = en la medida en que (limitas lo que acabas de afirmar). A menudo con \u003ci\u003eals\u003c/i\u003e: \u003cb\u003einsofern, als die Verwaltung zuhört\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003eohne dass\u003c/b\u003e + verbo conjugado: \u003cb\u003eohne dass der Betrieb leidet\u003c/b\u003e. \u003cb\u003eohne zu\u003c/b\u003e + infinitivo solo si el sujeto no cambia: \u003cb\u003eohne zu leiden\u003c/b\u003e. El hispanohablante mezcla las dos.\u003cbr/\u003e· \u003cb\u003eanstatt dass\u003c/b\u003e + conjugado (sujetos distintos) frente a \u003cb\u003eanstatt zu\u003c/b\u003e (mismo sujeto).\u003cbr/\u003e· \u003cb\u003egeschweige denn\u003c/b\u003e = por no hablar de. Va \u003cu\u003edespués\u003c/u\u003e de una negación o de algo ya escaso: \u003cb\u003eohne Lieferwagen, geschweige denn ohne Parkplatz\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eSi el debate se [[zuspitzen|encrudece]], casi siempre es porque nadie [[differenzieren|matiza]].\",\"table\":[[\"si el sujeto es el mismo\",\"si cambia el sujeto\"],[\"ohne zu + infinitivo\",\"ohne dass + verbo conjugado\"],[\"anstatt zu + infinitivo\",\"anstatt dass + verbo conjugado\"],[\"Er geht, ohne zu grüßen.\",\"…, ohne dass der Betrieb leidet.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m5l4e1\",\"type\":\"mc\",\"prompt\":\"sofern o insofern\",\"question\":\"„___ das Bezirksamt den Kompromiss schreibt, war der Abend keine Show.“\",\"options\":[\"Sofern\",\"Insofern\",\"Zumal\"],\"answer\":0,\"whyWrong\":[null,\"insofern limita una afirmación ya hecha, no pone una condición a futuro\",\"zumal añade una razón, no una condición\"],\"itemIds\":[\"b2m5sofern\",\"b2m5insofern\"],\"tip\":\"sofern ≈ falls, pero más escrito. insofern ≈ «en ese sentido». Se parecen al oído y no se tocan.\"},{\"id\":\"b2m5l4e2\",\"type\":\"cloze\",\"prompt\":\"Sin que el sujeto cambie de frase\",\"text\":\"Die Lieferungen können morgens kommen, ohne ___ der Betrieb leidet.\",\"answers\":[\"dass\"],\"translation\":\"Las entregas pueden venir por la mañana, sin que el negocio se resienta.\",\"hints\":[\"ohne + la completiva, porque el sujeto cambia\",\"ohne d...\"],\"itemIds\":[\"b2m5ohnedass\"],\"tip\":\"der Betrieb ≠ las Lieferungen → ohne dass. Si fuera el mismo sujeto: ohne zu leiden.\"},{\"id\":\"b2m5l4e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ohne Lieferwagen, geschweige dann ohne Parkplatz, geht die Küche nicht.\",\"answers\":[\"Ohne Lieferwagen, geschweige denn ohne Parkplatz, geht die Küche nicht.\",\"Ohne Lieferwagen, geschweige denn ohne Parkplatz, geht die Küche nicht\"],\"why\":\"La pieza es geschweige denn, nunca dann. Es una locución fija, y va después de algo ya negado o escaso.\",\"translation\":\"Sin furgoneta, por no hablar de sin aparcamiento, la cocina no funciona.\",\"itemIds\":[\"b2m5geschweigedenn\"]},{\"id\":\"b2m5l4e4\",\"type\":\"transform\",\"prompt\":\"Cambia el sujeto: de ohne zu a ohne dass\",\"source\":\"Er spricht, ohne zu differenzieren.\",\"instruction\":\"El que no matiza es «die Debatte» (cambia el sujeto)\",\"answers\":[\"Die Debatte spitzt sich zu, ohne dass jemand differenziert\",\"Die Debatte spitzt sich zu, ohne dass jemand differenziert.\",\"Es wird gesprochen, ohne dass differenziert wird\",\"Es wird gesprochen, ohne dass differenziert wird.\"],\"translation\":\"El debate se encrudece sin que nadie matice.\",\"hints\":[\"ohne dass + verbo conjugado\",\"…, ohne dass jemand differenziert\"],\"itemIds\":[\"b2m5ohnedass\",\"b2m5differenzieren\",\"b2m5zuspitzen\"]},{\"id\":\"b2m5l4e5\",\"type\":\"gapbank\",\"prompt\":\"Completa la condición de Lena\",\"text\":\"Beteiligung lohnt sich nur, ___ die Verwaltung zuhört. ___ das Amt den Beschluss schreibt, war es keine Show. ___ dass wir noch einmal reden, sollten wir entscheiden.\",\"answers\":[\"insofern\",\"Sofern\",\"Anstatt\"],\"bank\":[\"insofern\",\"Sofern\",\"Anstatt\",\"obwohl\",\"damit\",\"weil\"],\"translation\":\"La participación solo merece la pena en la medida en que la administración escucha. Siempre que la oficina escriba el acuerdo, no fue teatro. En lugar de volver a hablar, deberíamos decidir.\",\"itemIds\":[\"b2m5insofern\",\"b2m5sofern\",\"b2m5anstattdass\"],\"tip\":\"Anstatt dass / anstatt zu: aquí el hueco pide solo Anstatt, porque dass ya está escrito. El banco no trae obwohl: esa concesión ya la tienes.\"},{\"id\":\"b2m5l4e6\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"Ich sehe das anders.\",\"real\":\"Seh ich anders.\",\"translation\":\"Yo lo veo de otra manera.\",\"itemIds\":[\"b2m5natsehichanders\",\"b1m2ichsehedasanders\"],\"tip\":\"El sujeto se cae y el verbo abre. En el examen escribes la del libro; en el Kiez oyes la otra.\"},{\"id\":\"b2m5l4e7\",\"type\":\"speak\",\"prompt\":\"Di el desacuerdo de examen — no el del chat\",\"text\":\"Dem kann ich mich nicht anschließen.\",\"phonetic\":\"deem kan ij mij nijt AN-shlíi-sen\",\"translation\":\"A eso no me sumo.\",\"itemIds\":[\"b2m5demkannichmichnichtanschliessen\"]},{\"id\":\"b2m5l4e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Sin furgoneta, por no hablar de sin aparcamiento, el bar no funciona\",\"answers\":[\"Ohne Lieferwagen, geschweige denn ohne Parkplatz, geht der Betrieb nicht\",\"Ohne Lieferwagen, geschweige denn ohne Parkplatz, geht der Betrieb nicht.\"],\"hints\":[\"geschweige denn, después de algo ya escaso\",\"Ohne Lieferwagen, geschweige denn …\"],\"itemIds\":[\"b2m5geschweigedenn\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m5-3\",\"book\":\"Ich sehe das anders.\",\"real\":\"Seh ich anders.\",\"meaning\":\"Yo lo veo de otra manera.\",\"when\":\"Réplica rápida entre conocidos. En asamblea con micrófono y en el Sprechen, la fórmula de examen no suelta el sujeto y cambia el verbo.\",\"register\":\"amigos\",\"exam\":\"Dem kann ich mich nicht anschließen.\",\"note\":\"La calle tir
