03cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn pasado es idéntico\u003c/b\u003e, con un solo ayudante para todas las personas: \u003cb\u003edid\u003c/b\u003e. \u003ci\u003eShe work\u003cu\u003eed\u003c/u\u003e\u003c/i\u003e, pero \u003ci\u003eDi\u003cu\u003ed\u003c/u\u003e she \u003cu\u003ework\u003c/u\u003e?\u003c/i\u003e y \u003ci\u003eShe didn't \u003cu\u003ework\u003c/u\u003e\u003c/i\u003e. La -ed se muda a did y el verbo se queda limpio.\u003cbr/\u003e\u003cbr/\u003eDe ahí sale el error número uno del hispanohablante en A2: \u003cb\u003e\u003ci\u003eDid you watched…?\u003c/i\u003e\u003c/b\u003e Es exactamente el mismo fallo que decir \u003ci\u003eDoes she works?\u003c/i\u003e — el pasado marcado dos veces. Una marca por frase, y la lleva el auxiliar.\u003cbr/\u003e\u003cbr/\u003eY el contraste con el español, que explica por qué al principio se te olvida el did entero: \u003cb\u003een español la pregunta se hace con la entonación\u003c/b\u003e («¿trabajaste ayer?», mismas palabras que «trabajaste ayer»). En inglés no hay entonación que valga: \u003cb\u003esin auxiliar no hay pregunta\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn regalo escondido:\u003c/b\u003e como detrás de did el verbo va desnudo, \u003cb\u003eya puedes preguntar por cualquier verbo, incluidos los que no obedecen\u003c/b\u003e — \u003ci\u003eDid you go to the concert?\u003c/i\u003e, \u003ci\u003eDid you have a good weekend?\u003c/i\u003e. Sus pasados raros (went, had) son del módulo siguiente; las preguntas, no.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa excepción que conviene saber\u003c/b\u003e: cuando la palabra qu- ES el sujeto, no hace falta ayudante. \u003cb\u003eWhat happened?\u003c/b\u003e (¿qué pasó?), \u003cb\u003eWho phoned?\u003c/b\u003e (¿quién llamó?). Nadie dice \u003ci\u003eWhat did happen?\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m1l8\",\"phaseId\":\"ena2m1\",\"title\":\"Did you watch the match?\",\"subtitle\":\"Preguntar y negar en pasado: el do/does del A1, un tiempo más allá\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preguntar por el finde de otro\",\"itemIds\":[\"ena2m1whatdidyoudo\",\"ena2m1didyouwatchit\",\"ena2m1ididntwork\",\"ena2m1yesidid\",\"ena2m1whathappened\",\"enyesido\"]},{\"kind\":\"note\",\"note\":{\"title\":\"did: la misma máquina que ya montaste en el A1\",\"body\":\"$17\",\"table\":[[\"presente (A1)\",\"pasado (aquí)\"],[\"Do you work?\",\"Did you work?\"],[\"Does she work?\",\"Did she work?\"],[\"I don't work.\",\"I didn't work.\"],[\"She doesn't work.\",\"She didn't work.\"],[\"Yes, I do. / No, I don't.\",\"Yes, I did. / No, I didn't.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Las tres formas, en fila\",\"body\":\"Una sola cosa que vigilar: \u003cb\u003ela -ed aparece en la afirmativa y desaparece en las otras dos\u003c/b\u003e. Si la ves dos veces en la misma frase, sobra una.\",\"table\":[[\"afirmativa\",\"negativa\",\"pregunta\"],[\"I worked.\",\"I didn't work.\",\"Did you work?\"],[\"She watched TV.\",\"She didn't watch TV.\",\"Did she watch TV?\"],[\"They played football.\",\"They didn't play football.\",\"Did they play football?\"],[\"We stayed at home.\",\"We didn't stay at home.\",\"Did you stay at home?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l8e1\",\"type\":\"mc\",\"prompt\":\"«¿Viste el partido?»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"Did you watch the match?\",\"Did you watched the match?\",\"You watched the match?\"],\"answer\":0,\"whyWrong\":[null,\"Pasado marcado dos veces: did ya lo dice, así que watch va desnudo\",\"Sin auxiliar no hay pregunta inglesa; la entonación sola es un calco del español\"],\"itemIds\":[\"ena2m1didyouwatchit\"],\"tip\":\"Piensa en el A1: nadie dice «Does she works?». Pues esto es lo mismo, un tiempo más allá.\"},{\"id\":\"ena2m1l8e2\",\"type\":\"bucket\",\"prompt\":\"¿El verbo lleva -ed o va desnudo?\",\"categories\":[\"con -ed\",\"desnudo (detrás de did / didn't)\"],\"items\":[{\"text\":\"I watched a film\",\"bucket\":0},{\"text\":\"Did you watch a film?\",\"bucket\":1},{\"text\":\"She didn't work on Sunday\",\"bucket\":1},{\"text\":\"They played football\",\"bucket\":0},{\"text\":\"Did they play football?\",\"bucket\":1},{\"text\":\"We cooked dinner\",\"bucket\":0}],\"itemIds\":[\"ena2m1didyouwatchit\",\"ena2m1ididntwork\"],\"tip\":\"Una marca de pasado por frase. Si ya está en did, el verbo no la repite.\"},{\"id\":\"ena2m1l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta\",\"text\":\"___ you watch the film last night?\",\"answers\":[\"Did\"],\"translation\":\"¿Viste la película anoche?\",\"hints\":[\"El ayudante del pasado, para todas las personas\",\"D…\"],\"itemIds\":[\"ena2m1didyouwatchit\",\"enlastnight\"]},{\"id\":\"ena2m1l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa la negativa\",\"text\":\"I ___ work on Sunday.\",\"answers\":[\"didn't\",\"did not\"],\"translation\":\"No trabajé el domingo.\",\"hints\":[\"did + not, contraído\",\"d…'t\"],\"itemIds\":[\"ena2m1ididntwork\"]},{\"id\":\"ena2m1l8e5\",\"type\":\"transform\",\"prompt\":\"Pásala a negativa\",\"source\":\"I worked on Sunday.\",\"instruction\":\"Ponla en negativa\",\"answers\":[\"I didn't work on Sunday.\",\"I did not work on Sunday.\"],\"translation\":\"No trabajé el domingo.\",\"hints\":[\"El pasado se muda al auxiliar\",\"I d…'t work on Sunday.\"],\"itemIds\":[\"ena2m1ididntwork\",\"ena2m1iworked\"]},{\"id\":\"ena2m1l8e6\",\"type\":\"transform\",\"prompt\":\"Pásala a pregunta\",\"source\":\"She watched a film.\",\"instruction\":\"Hazla pregunta\",\"answers\":[\"Did she watch a film?\"],\"translation\":\"¿Vio una película?\",\"hints\":[\"El auxiliar abre la frase y el verbo se desnuda\",\"D… she watch a film?\"],\"itemIds\":[\"ena2m1didyouwatchit\",\"ena2m1shewatchedafilm\"]},{\"id\":\"ena2m1l8e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el doble pasado — es el error nº 1 del A2\",\"wrong\":\"Did you watched the match?\",\"answers\":[\"Did you watch the match?\"],\"why\":\"El pasado se marca UNA vez por frase, y lo lleva el auxiliar. Con did delante, el verbo vuelve a su forma de diccionario: watch, work, play. Igual que en presente nadie dice «Does she works?».\",\"translation\":\"¿Viste el partido?\",\"itemIds\":[\"ena2m1didyouwatchit\"]},{\"id\":\"ena2m1l8e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta sin auxiliar\",\"wrong\":\"What you did last weekend?\",\"answers\":[\"What did you do last weekend?\"],\"why\":\"En español la pregunta se hace con la entonación y el orden no cambia («¿qué hiciste el finde?»). En inglés hace falta el auxiliar Y va delante del sujeto: What DID YOU do…? El verbo do del final es el verbo de verdad, «hacer».\",\"translation\":\"¿Qué hiciste el fin de semana pasado?\",\"itemIds\":[\"ena2m1whatdidyoudo\"],\"tip\":\"Ojo a la frase: lleva did dos veces, pero no son lo mismo. El primero es el ayudante; el segundo (do) es «hacer».\"},{\"id\":\"ena2m1l8e9\",\"type\":\"mc\",\"prompt\":\"La excepción que hay que conocer\",\"question\":\"«¿Qué pasó?»\",\"options\":[\"What happened?\",\"What did happen?\",\"What did happened?\"],\"answer\":0,\"whyWrong\":[null,\"Cuando la palabra qu- ES el sujeto (¿qué?, ¿quién?), el auxiliar sobra\",\"Y esta marca el pasado dos veces, además\"],\"itemIds\":[\"ena2m1whathappened\"],\"tip\":\"Regla corta: si la pregunta es «¿QUIÉN hizo algo?» o «¿QUÉ pasó?», nada de did. Si es «¿qué hiciste TÚ?», did obligatorio.\"},{\"id\":\"ena2m1l8e10\",\"type\":\"build\",\"prompt\":\"Construye la pregunta — y fíjate en el verbo\",\"target\":\"Did you go to the concert on Sunday\",\"translation\":\"¿Fuiste al concierto el domingo?\",\"distractors\":[\"went\",\"goes\"],\"itemIds\":[\"ena2m1didyouwatchit\",\"ena2m1concert\"],\"tip\":\"go es de los que no obedecen, y aun así aquí no te hace falta su pasado: detrás de did, el verbo va desnudo. Esa es la puerta al módulo 2.\"},{\"id\":\"ena2m1l8e11\",\"type\":\"audiomc\",\"prompt\":\"Pregunta y respuesta corta — 2 escuchas\",\"audio\":\"Did you phone Amy? | No, I didn't. I was really tired.\",\"question\":\"¿Llamó a Amy?\",\"options\":[\"No\",\"Sí\",\"No se sabe\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La respuesta corta empieza por No, I didn't\",\"Se sabe perfectamente: lo dice y además da el motivo\"],\"itemIds\":[\"ena2m1yesidid\",\"ena2m1phoned\",\"ena2m1tired\"],\"tip\":\"La respuesta corta repite el auxiliar, no el verbo: Yes, I did / No, I didn't. Exactamente como el «Yes, I do» del A1.\"},{\"id\":\"ena2m1l8e12\",\"type\":\"speak\",\"prompt\":\"El intercambio completo, en voz alta\",\"text\":\"Did you have a good weekend? Yes, I did!\",\"phonetic\":\"did yu jav a gud UÍI-kend? yes, ái DID\",\"translation\":\"¿Qué tal el finde? — ¡Muy bien!\",\"itemIds\":[\"ena2m1yesidid\",\"ena2m1didyouwatchit\"],\"tip\":\"have va desnudo detrás de did, sin pasado raro que aprender. Y el DID de la respuesta va acentuado: ahí sí suena fuerte.\"},{\"id\":\"ena2m1l8e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Qué hiciste el finde pasado? — No trabajé. Vi una película.\",\"answers\":[\"What did you do last weekend? I didn't work. I watched a film.\",\"What did you do last weekend? I didn't work. I watched a movie.\",\"What did you do last weekend? I did not work. I watched a film.\"],\"hints\":[\"Pregunta con did + negativa con didn't + afirmativa con -ed\",\"What d… you do last weekend? I d…'t work. I watch… a film.\"],\"itemIds\":[\"ena2m1whatdidyoudo\",\"ena2m1ididntwork\",\"ena2m1shewatchedafilm\"],\"tip\":\"Las tres formas en tres frases: pregunta, negativa y afirmativa. Si te sale esto, el pasado regular ya es tuyo entero.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m1-5\",\"book\":\"What did you do at the weekend?\",\"real\":\"What did you get up to at the weekend?\",\"meaning\":\"¿Qué hiciste el finde? / ¿En qué has andado metido?\",\"when\":\"Entre amigos y compañeros, el lunes por la mañana. Tiene un puntito travieso, como el «¿qué has estado tramando?» español, pero se usa con total normalidad. En el examen, la versión del libro.\",\"register\":\"amigos\",\"note\":\"get up to = «hacer», con guasa. Y al hablar rápido, did you se funde en «did-ya»: uót DÍD-ya guet AP tu…\",\"sound\":\"uót did yu guet AP tu at de UÍI-kend\",\"level\":\"a2\",\"itemId\":\"ena2m1whatdidyoudo\"}}],\"resources\":[{\"label\":\"British Council — Past simple: questions and negatives\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple\",\"note\":\"Fíjate solo en los ejemplos con did y didn't, y comprueba en cada uno que el verbo va desnudo. Diez minutos y la trampa se cae.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
