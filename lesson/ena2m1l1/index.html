xt/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4d1,Para poner un verbo en pasado, le añades \u003cb\u003e-ed\u003c/b\u003e. Y ya está.\u003cbr/\u003e\u003cbr/\u003ework → \u003cb\u003eworked\u003c/b\u003e · watch → \u003cb\u003ewatched\u003c/b\u003e · cook → \u003cb\u003ecooked\u003c/b\u003e · play → \u003cb\u003eplayed\u003c/b\u003e · walk → \u003cb\u003ewalked\u003c/b\u003e · rain → \u003cb\u003erained\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY no cambia con la persona.\u003c/b\u003e Ni una vez. I worked, you worked, \u003cu\u003eshe worked\u003c/u\u003e, we worked, they worked. Aquella \u003cb\u003e-s\u003c/b\u003e de tercera persona que tanto costó en el A1 (\u003ci\u003eshe works\u003c/i\u003e) \u003cb\u003edesaparece en el pasado\u003c/b\u003e: es la única vez que el inglés te regala algo, aprovéchala.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora el contraste que te ahorra medio nivel.\u003c/b\u003e En español tienes dos pasados y eliges entre ellos todo el rato: «ayer \u003ci\u003ecanté\u003c/i\u003e» y «de pequeña \u003ci\u003ecantaba\u003c/i\u003e». \u003cb\u003eEl inglés tiene UNA sola forma para las dos.\u003c/b\u003e \u003ci\u003eI sang\u003c/i\u003e, \u003ci\u003eI worked\u003c/i\u003e, \u003ci\u003eI played\u003c/i\u003e valen para el pretérito indefinido y para el imperfecto: la diferencia, si hace falta, la pone el contexto (\u003ci\u003eevery summer\u003c/i\u003e, \u003ci\u003ewhen I was a child\u003c/i\u003e), nunca el verbo. Así que no busques la segunda forma: no existe.\u003cbr/\u003e\u003cbr/\u003eOjo a una cosa más, que el español provoca: en inglés el sujeto \u003cb\u003enunca\u003c/b\u003e se cae. «Llovió» es \u003cb\u003eIt rained\u003c/b\u003e, con su \u003ci\u003eit\u003c/i\u003e delante — \u003ci\u003eRained all day\u003c/i\u003e no es inglés."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m1l1\",\"phaseId\":\"ena2m1\",\"title\":\"Last weekend I worked\",\"subtitle\":\"El pasado, en una sola letra — y una forma para «canté» y «cantaba»\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que hiciste el finde pasado\",\"itemIds\":[\"ena2m1lastweekend\",\"ena2m1iworked\",\"ena2m1shewatchedafilm\",\"ena2m1wecookedtogether\",\"ena2m1itrained\",\"ena2m1theywalkedtothepark\",\"enyesterday\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Bienvenido al A2 — y no empiezas de cero\",\"body\":\"Enhorabuena: entras en A2. Lo primero, la buena noticia: \u003cb\u003eel inglés que traes del A1 es el 80 % de lo que vas a usar\u003c/b\u003e. El presente, las preguntas con do/does, there is/are, los adjetivos delante, la hora, los días — todo eso sigue en pie. Lo que cambia son tres cosas:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eYa no hablas solo de hoy.\u003c/b\u003e El A2 es el nivel del \u003cb\u003epasado\u003c/b\u003e: contar lo que pasó, no solo describir lo que hay. Por eso el nivel abre con este módulo y no con otro.\u003cbr/\u003e2. \u003cb\u003eFrases más largas.\u003c/b\u003e En A1 decías «I work in a café». Aquí vas a decir «Last Saturday I worked in the café and I watched a film in the evening». Misma gramática, más metros.\u003cbr/\u003e3. \u003cb\u003eTe preguntan tu opinión.\u003c/b\u003e No solo «¿qué hiciste?», también «¿qué tal estuvo?». Para eso están [[It was great!|¡Estuvo genial!]] y [[There were a lot of people.|Había mucha gente.]]\u003cbr/\u003e\u003cbr/\u003eY el A1 ya te dejó dos pistas de esto: en el módulo 11 oíste \u003cb\u003ewas\u003c/b\u003e, \u003cb\u003ewere\u003c/b\u003e, \u003cb\u003edanced\u003c/b\u003e y \u003cb\u003eplayed\u003c/b\u003e sin tener que producirlos. Hoy pasan a ser tuyos.\",\"table\":[[\"A1\",\"A2\"],[\"«I work in a café.»\",\"«Last week I worked in a café.»\"],[\"Reconocer was/were al oírlos\",\"Producirlos tú\"],[\"Frases de 5-6 palabras\",\"Frases enlazadas con and / but\"],[\"¿Qué haces?\",\"¿Qué hiciste, y qué tal estuvo?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"-ed: la regla más barata del inglés\",\"body\":\"$17\",\"table\":[[\"ahora\",\"el finde pasado\"],[\"I work every day.\",\"I worked last Saturday.\"],[\"She watches TV.\",\"She watched a film.\"],[\"We cook together.\",\"We cooked dinner together.\"],[\"They play football.\",\"They played football.\"],[\"It rains a lot.\",\"It rained all day.\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"last weekend\",\"pastExample\":\"I worked on Saturday.\",\"nowLabel\":\"now\",\"nowExample\":\"I work every day.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el pasado\",\"question\":\"“I worked on Saturday.”\",\"options\":[\"Trabajé el sábado\",\"Trabajo los sábados\",\"Voy a trabajar el sábado\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «I work on Saturdays» — sin -ed no hay pasado\",\"El futuro llega en el módulo 6; aquí la -ed dice que ya pasó\"],\"itemIds\":[\"ena2m1iworked\"],\"tip\":\"La -ed es la única señal de que algo ya pasó. Si se te cae, has dicho otra cosa.\"},{\"id\":\"ena2m1l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — estos verbos ya son tuyos del A1\",\"pairs\":[{\"target\":\"work\",\"source\":\"trabajar\"},{\"target\":\"cook\",\"source\":\"cocinar\"},{\"target\":\"walk\",\"source\":\"andar / ir a pie\"},{\"target\":\"watch TV\",\"source\":\"ver la tele\"},{\"target\":\"listen to music\",\"source\":\"escuchar música\"}],\"targetSeconds\":25,\"itemIds\":[\"enwork\",\"encook\",\"enwalk\",\"enwatchtv\",\"enlistentomusic\"],\"tip\":\"El A2 no se gana añadiendo palabras: se gana sacando más rápido las que ya tienes. El cronómetro aquí solo premia.\"},{\"id\":\"ena2m1l1e3\",\"type\":\"match\",\"prompt\":\"Empareja el pasado con su significado\",\"pairs\":[{\"target\":\"worked\",\"source\":\"trabajé / trabajaba\"},{\"target\":\"watched\",\"source\":\"vi / veía\"},{\"target\":\"cooked\",\"source\":\"cociné / cocinaba\"},{\"target\":\"walked\",\"source\":\"anduve / andaba\"}],\"itemIds\":[\"ena2m1iworked\",\"ena2m1shewatchedafilm\",\"ena2m1wecookedtogether\",\"ena2m1theywalkedtothepark\"],\"tip\":\"Fíjate en las traducciones: cada -ed vale por DOS formas españolas. Ese es el regalo del inglés.\"},{\"id\":\"ena2m1l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Lo hace todos los días o lo hizo el finde pasado?\",\"categories\":[\"ahora / todos los días\",\"el finde pasado\"],\"items\":[{\"text\":\"I work in a café\",\"bucket\":0},{\"text\":\"I worked on Saturday\",\"bucket\":1},{\"text\":\"She watches TV\",\"bucket\":0},{\"text\":\"She watched a film\",\"bucket\":1},{\"text\":\"They play football\",\"bucket\":0},{\"text\":\"We cooked dinner\",\"bucket\":1}],\"itemIds\":[\"ena2m1iworked\",\"ena2m1shewatchedafilm\",\"ena2m1wecookedtogether\"],\"tip\":\"Todo lo que decide está al final de la palabra. En inglés la gramática vive en las terminaciones, no delante.\"},{\"id\":\"ena2m1l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el pasado del verbo entre paréntesis\",\"text\":\"Yesterday I ___ (work) in the café until six.\",\"answers\":[\"worked\"],\"translation\":\"Ayer trabajé en el café hasta las seis.\",\"hints\":[\"El verbo no cambia de persona: solo se le añade algo al final\",\"work + …\"],\"itemIds\":[\"ena2m1iworked\",\"enyesterday\"]},{\"id\":\"ena2m1l1e6\",\"type\":\"cloze\",\"prompt\":\"Y el sujeto que el español se come\",\"text\":\"___ rained all day on Sunday.\",\"answers\":[\"It\"],\"translation\":\"Llovió todo el domingo.\",\"hints\":[\"En español «llovió» no lleva sujeto; en inglés SIEMPRE lo lleva\",\"El mismo i-t de «It's raining» del A1\"],\"itemIds\":[\"ena2m1itrained\",\"enitsraining\"],\"tip\":\"Del A1 ya traes «It's raining». Cambia el tiempo, no el it: el inglés no deja huecos donde va el sujeto.\"},{\"id\":\"ena2m1l1e7\",\"type\":\"mc\",\"prompt\":\"La regla de oro del pasado inglés\",\"question\":\"«De pequeña jugaba al fútbol» y «Ayer jugué al fútbol». ¿Cuántas formas inglesas necesitas?\",\"options\":[\"Una: played sirve para las dos\",\"Dos, una para cada tiempo español\",\"Ninguna: en inglés se usa el presente\"],\"answer\":0,\"whyWrong\":[null,\"Esa es la trampa: buscas un imperfecto que en inglés no existe\",\"El presente diría que sigues jugando hoy\"],\"itemIds\":[\"enplayed\"],\"tip\":\"Indefinido e imperfecto se funden en una sola forma. Lo que en español elige el verbo, en inglés lo dice el contexto: when I was a child, every summer, yesterday.\"},{\"id\":\"ena2m1l1e8\",\"type\":\"transform\",\"prompt\":\"Del presente al pasado\",\"source\":\"I watch a film every Friday.\",\"instruction\":\"Ponla en pasado, con «last Friday»\",\"answers\":[\"I watched a film last Friday.\",\"Last Friday I watched a film.\"],\"translation\":\"Vi una película el viernes pasado.\",\"hints\":[\"Solo cambia el verbo: +ed\",\"watch → watch…\"],\"itemIds\":[\"ena2m1shewatchedafilm\",\"enwatchafilm\"]},{\"id\":\"ena2m1l1e9\",\"type\":\"transform\",\"prompt\":\"Y ahora con «she» — cuidado con la trampa\",\"source\":\"She watches TV every evening.\",\"instruction\":\"Ponla en pasado, con «last night»\",\"answers\":[\"She watched TV last night.\",\"Last night she watched TV.\"],\"translation\":\"Anoche vio la tele.\",\"hints\":[\"En pasado la -s de tercera persona desaparece\",\"watches → watch…\"],\"itemIds\":[\"ena2m1shewatchedafilm\",\"enwatches\",\"enlastnight\"],\"tip\":\"watches → watched, no «watchesed». En pasado se olvida la persona: la misma forma para todos.\"},{\"id\":\"ena2m1l1e10\",\"type\":\"build\",\"prompt\":\"Construye la frase del sábado\",\"target\":\"We cooked dinner together\",\"translation\":\"Hicimos la cena juntas\",\"distractors\":[\"cook\",\"cooks\"],\"itemIds\":[\"ena2m1wecookedtogether\",\"endinner\",\"entogether\"]},{\"id\":\"ena2m1l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"They walked to the park.\",\"translation\":\"Fueron andando al parque.\",\"hints\":[\"walk + la terminación del pasado\",\"They walk… to the park.\"],\"itemIds\":[\"ena2m1theywalkedtothepark\",\"enpark\"]},{\"id\":\"ena2m1l1e12\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — este lo escriben nueve de cada diez hispanohablantes\",\"wrong\":\"I have worked last Saturday.\",\"answers\":[\"I worked last Saturday.\"],\"why\":\"«last Saturday» es un tiempo TERMINADO, y un tiempo terminado pide pasado simple, siempre. Si tú dirías «he trabajado el sábado» (España), la traducción no es have + participio: es worked a secas. Y si dirías «trabajé el sábado» (Latinoamérica), ya lo tienes.\",\"translation\":\"Trabajé el sábado pasado.\",\"itemIds\":[\"ena2m1iworked\"],\"tip\":\"Regla mecánica: si en la frase hay yesterday, last… o …ago, el present perfect queda prohibido.\"},{\"id\":\"ena2m1l1e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu primera frase de A2\",\"text\":\"Last weekend I worked and I watched a film.\",\"phonetic\":\"laast UÍI-kend ái UÉEKT and ái UÓCHT a film\",\"translation\":\"El finde pasado trabajé y vi una película.\",\"itemIds\":[\"ena2m1lastweekend\",\"ena2m1iworked\",\"ena2m1shewatchedafilm\"],\"tip\":\"worked y watched son de UNA sílaba: uéekt, uócht. Ni «uor-ked» ni «uat-ched» — eso lo trabajamos entero en la lección 5.\"},{\"id\":\"ena2m1l1e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ayer trabajé y vi una película.\",\"answers\":[\"Yesterday I worked and I watched a film.\",\"Yesterday I worked and watched a film.\",\"I worked yesterday and I watched a film.\",\"Yesterday I worked and I watched a movie.\"],\"hints\":[\"Marcador + verbo con -ed + and + otro verbo con -ed\",\"Yesterday I work… and I watch… a film.\"],\"itemIds\":[\"enyesterday\",\"ena2m1iworked\",\"ena2m1shewatchedafilm\"],\"tip\":\"Dos verbos en pasado en la misma frase y ni un cambio de persona. Ya estás produciendo A2.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m1-1\",\"book\":\"It was very good.\",\"real\":\"It was brilliant.\",\"meaning\":\"Estuvo genial / de lujo\",\"when\":\"Con amigos y compañeros, en cuanto valoras algo: una fiesta, una peli, un finde. En Reino Unido se oye a todas horas. En el examen escrito, la versión del libro (very good, really nice) también puntúa: brilliant no te resta, pero no lo estires a un email formal.\",\"register\":\"amigos\",\"note\":\"brilliant en inglés británico casi nunca es «brillante»: es «genial». Y su hermana pequeña, lovely, ya la traes del A1.\",\"sound\":\"it uos̬ BRÍ-liant\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Past simple\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple\",\"note\":\"Lee la ficha entera (5 min) y haz los dos ejercicios. Fíjate solo en los verbos con -ed: los raros son del módulo siguiente.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\"
