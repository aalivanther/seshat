 us pay twice.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eIt\u003c/b\u003e takes ages to get an answer.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eIt\u003c/b\u003e's up to the council.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e's worth complaining.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e's raining.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e· THERE — para decir que algo EXISTE o no existe.\u003c/b\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eThere\u003c/b\u003e's nothing we can do about it.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eThere\u003c/b\u003e were three bags of rubble in the entry.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eThere\u003c/b\u003e's no point in complaining.\u003c/i\u003e (esta ya la traías del módulo 5)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se elige entre los dos, sin pensarlo:\u003c/b\u003e si puedes cambiarlo por «hay», va \u003cb\u003ethere\u003c/b\u003e; si puedes cambiarlo por «es» o «resulta», va \u003cb\u003eit\u003c/b\u003e. No falla.\u003cbr/\u003e\u003cbr/\u003eEl error de omitirlo —\u003ci\u003e«Is not fair»\u003c/i\u003e, \u003ci\u003e«Takes ages»\u003c/i\u003e— debería estar resuelto desde el A1, y por eso, cuando aparece en B1, no es un despiste: es una fosilización. Aquí se caza en frases largas, que es donde vuelve.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el molde que de verdad te hace falta para opinar:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eIt's + adjetivo + that + frase\u003c/b\u003e → \u003ci\u003eIt's unfair that nobody asked us.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eIt's + adjetivo + to + verbo\u003c/b\u003e → \u003ci\u003eIt's hard to prove it.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eIt's unfair ON somebody\u003c/b\u003e — ojo con la preposición: en español es «injusto \u003cb\u003epara\u003c/b\u003e», en inglés es \u003cb\u003eon\u003c/b\u003e. \u003ci\u003eIt's unfair on the neighbours.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una negación que el español dobla y el inglés no:\u003c/b\u003e «no hay nada que podamos hacer» es \u003ci\u003eThere's \u003cb\u003enothing\u003c/b\u003e we can do\u003c/i\u003e, con UNA sola negación. \u003ci\u003e«There isn't nothing»\u003c/i\u003e significaría lo contrario y, sobre todo, suena a error de principiante."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l7\",\"phaseId\":\"enb1m11\",\"title\":\"It isn't fair\",\"subtitle\":\"En inglés siempre hay alguien delante del verbo, aunque no sea nadie\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis frases de opinión que empiezan por «it» o por «there»\",\"itemIds\":[\"enb1m11itisntfairthat\",\"enb1m11ittakesages\",\"enb1m11theresnothingwecando\",\"enb1m11unfairon\",\"enb1m11itsuptothecouncil\",\"enb1m11natoutoforder\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El hueco que el español deja vacío y el inglés no puede dejar\",\"body\":\"$17\",\"table\":[[\"En español\",\"En inglés\",\"Lo que NO se dice\"],[\"No es justo que…\",\"It isn't fair that…\",\"Is not fair that…\"],[\"Se tarda un siglo en…\",\"It takes ages to…\",\"Takes ages to…\"],[\"No hay nada que hacer\",\"There's nothing we can do.\",\"There isn't nothing we can do.\"],[\"Es injusto para los vecinos\",\"It's unfair on the neighbours.\",\"It's unfair for the neighbours.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l7e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro frases de opinión\",\"pairs\":[{\"target\":\"It isn't fair that some of us pay twice.\",\"source\":\"No es justo que algunos paguemos dos veces.\"},{\"target\":\"It takes ages to get an answer.\",\"source\":\"Se tarda un siglo en conseguir respuesta.\"},{\"target\":\"There's nothing we can do about it.\",\"source\":\"No hay nada que podamos hacer.\"},{\"target\":\"It's up to the council.\",\"source\":\"Le toca decidirlo al ayuntamiento.\"}],\"itemIds\":[\"enb1m11itisntfairthat\",\"enb1m11ittakesages\",\"enb1m11theresnothingwecando\",\"enb1m11itsuptothecouncil\"],\"tip\":\"Las cuatro empiezan por una palabra que en español no se dice. Tres «it» y un «there»: repite la prueba del «hay» y verás que sale sola.\"},{\"id\":\"enb1m11l7e2\",\"type\":\"mc\",\"prompt\":\"El hueco que hay que rellenar\",\"question\":\"«Se tarda un siglo en conseguir respuesta» es…\",\"options\":[\"It takes ages to get an answer.\",\"Takes ages to get an answer.\",\"There takes ages to get an answer.\"],\"answer\":0,\"whyWrong\":[null,\"El inglés no puede empezar una frase por el verbo si no es una orden. Ese hueco tiene que llevar algo.\",\"«There» solo vale para decir que algo existe. Aquí no existe nada: se está midiendo el tiempo que cuesta algo.\"],\"itemIds\":[\"enb1m11ittakesages\"],\"tip\":\"Este error debería estar cerrado desde el A1, pero vuelve siempre en frases largas: cuanto más piensa uno en el contenido, más se le olvida el «it». Por eso se practica aquí, con frases de opinión de verdad.\"},{\"id\":\"enb1m11l7e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Falta una palabra.\",\"wrong\":\"Takes ages to get an answer from them.\",\"answers\":[\"It takes ages to get an answer from them.\"],\"why\":\"El español deja el sujeto vacío («se tarda»); el inglés obliga a rellenarlo con «it», aunque ese «it» no signifique nada. Sin él la frase no existe.\",\"translation\":\"Se tarda un siglo en conseguir respuesta de ellos.\",\"itemIds\":[\"enb1m11ittakesages\"]},{\"id\":\"enb1m11l7e4\",\"type\":\"bucket\",\"prompt\":\"¿«It» o «there»? Prueba a cambiarlo por «hay»\",\"categories\":[\"It …\",\"There …\"],\"items\":[{\"text\":\"___ isn't fair that some of us pay twice.\",\"bucket\":0},{\"text\":\"___'s nothing we can do about it.\",\"bucket\":1},{\"text\":\"___ takes ages to get an answer.\",\"bucket\":0},{\"text\":\"___'s a sheet on the noticeboard.\",\"bucket\":1},{\"text\":\"___'s up to the council.\",\"bucket\":0},{\"text\":\"___ were three bags of rubble in the entry.\",\"bucket\":1}],\"itemIds\":[\"enb1m11itisntfairthat\",\"enb1m11theresnothingwecando\",\"enb1m11ittakesages\",\"enb1m11itsuptothecouncil\"],\"tip\":\"Seis frases y una sola prueba: si cabe «hay», es «there». Si cabe «es» o «resulta», es «it». No hay que saber gramática para acertar las seis.\"},{\"id\":\"enb1m11l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa con la preposición que pide «unfair»\",\"text\":\"The new rule is unfair ___ the people who work nights.\",\"answers\":[\"on\",\"to\"],\"translation\":\"La norma nueva es injusta para los que trabajan de noche.\",\"hints\":[\"No es «for», aunque el español diga «para»\",\"Dos letras\"],\"itemIds\":[\"enb1m11unfairon\"],\"tip\":\"«Unfair on» es lo más frecuente en británico; «unfair to» también vale y se oye mucho. Lo que no se dice es «unfair for», que es el calco directo del español.\"},{\"id\":\"enb1m11l7e6\",\"type\":\"build\",\"prompt\":\"Construye la queja\",\"target\":\"It isn't fair that some of us pay twice\",\"translation\":\"No es justo que algunos paguemos dos veces\",\"distractors\":[\"there\",\"for\"],\"itemIds\":[\"enb1m11itisntfairthat\"],\"tip\":\"Las dos fichas que sobran son los dos calcos: «there» por confundir los dos rellenos y «for» por la preposición del español.\"},{\"id\":\"enb1m11l7e7\",\"type\":\"transform\",\"prompt\":\"De la frase suelta a la frase con molde\",\"source\":\"Nobody asked us. That's not right.\",\"instruction\":\"Júntalas en una sola con «It's unfair that…»\",\"answers\":[\"It's unfair that nobody asked us\",\"It's unfair that nobody asked us.\",\"It is unfair that nobody asked us\"],\"translation\":\"Es injusto que no nos preguntaran.\",\"hints\":[\"El molde es It's + adjetivo + that + frase\",\"It's unfair that ...\"],\"itemIds\":[\"enb1m11itisntfairthat\",\"enb1m11unfairon\"],\"tip\":\"Este molde es la manera más barata de subir de A2 a B1 por escrito: dos frases cortas se convierten en una con opinión dentro, y el criterio de estructuras lo nota inmediatamente.\"},{\"id\":\"enb1m11l7e8\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que dijo una vecina en la reunión\",\"text\":\"The rule is ___ on the people who work nights: they pay the same and can't use the entry at all. It's ___ that nobody asked them, and the only ___ thing would be to look at it again.\",\"answers\":[\"unfair\",\"wrong\",\"fair\"],\"bank\":[\"unfair\",\"wrong\",\"fair\",\"allowed\",\"permitted\",\"up\"],\"translation\":\"La norma es injusta para los que trabajan de noche: pagan lo mismo y no pueden usar el callejón. Está mal que no les preguntaran, y lo único justo sería volver a mirarlo.\",\"itemIds\":[\"enb1m11unfairon\",\"enb1m11itisntfairthat\",\"enb1m11theonlyfairthing\"],\"tip\":\"Fíjate en el tercer hueco: «the only fair thing would be to…» es una fórmula entera de proponer sin imponer. Guárdala para el oral, que ahí vale puntos.\"},{\"id\":\"enb1m11l7e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar las palabras prohibidas\",\"source\":\"There's nothing we can do about it.\",\"forbid\":[\"nothing\",\"do\"],\"answers\":[\"There isn't much we can change\",\"It's out of our hands\",\"There's no way of changing it\"],\"translation\":\"No hay nada que podamos hacer.\",\"itemIds\":[\"enb1m11theresnothingwecando\",\"enb1m11itsuptothecouncil\"],\"tip\":\"«It's out of our hands» es la que más suena a nativo de las tres, y es exactamente lo que dice alguien de una oficina cuando la decisión no es suya. Vale también en el trabajo.\"},{\"id\":\"enb1m11l7e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Es injusto para los vecinos y se tarda un siglo en conseguir respuesta.\",\"answers\":[\"It's unfair on the neighbours and it takes ages to get an answer\",\"It is unfair on the neighbours and it takes ages to get an answer\",\"It's unfair to the neighbours and it takes ages to get an answer\"],\"hint\":\"Dos frases, dos huecos que rellenar delante del verbo\",\"itemIds\":[\"enb1m11unfairon\",\"enb1m11ittakesages\"],\"tip\":\"Ojo: hay que poner «it» DOS veces. En español la segunda mitad se cuelga de la primera sin sujeto, y en inglés cada verbo quiere el suyo.\"},{\"id\":\"enb1m11l7e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué te están diciendo?\",\"source\":\"That's a bit out of order, if you ask me.\",\"answers\":[\"Eso está un poco feo, si me lo preguntas\",\"A mí eso me parece que no se hace\",\"Eso no está bien, la verdad\"],\"itemIds\":[\"enb1m11natoutoforder\",\"enb1m11asfarasimconcerned\"],\"tip\":\"«Out of order» aplicado a una máquina es «averiada»; aplicado a una persona o a una conducta es «eso no se hace». Y «a bit» delante no lo suaviza tanto como parece: es el understatement británico otra vez.\"},{\"id\":\"enb1m11l7e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"There's nothing we can do about it.\",\"translation\":\"No hay nada que podamos hacer.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «There is»\",\"There's nothing we ...\"],\"itemIds\":[\"enb1m11theresnothingwecando\"],\"tip\":\"Escribe la contracción: en un dictado se corrige lo que sonó. Y cuenta las negaciones al terminar — tiene que haber UNA sola, la de «nothing».\"},{\"id\":\"enb1m11l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Ben y Valeria, en la parada. Dos escuchas.\",\"audio\":\"They've changed the collection to Tuesdays.|And?|And I'm on nights Monday to Thursday. So I put the bin out Monday evening and I get a card through the door saying I put it out too early.|Can you not do it Tuesday morning?|Tuesday morning I'm asleep. I finish at six, I'm in bed by seven, and the lorry's gone by half eight.|That's a bit out of order, that.|It's not out of order, it's just nobody thought about it. Which is worse, in a way. If somebody had decided it, you could argue with them.|So what are you going to do?|Ask Nora. She's up at six anyway and she's been putting her own bin out for forty years. It's not a solution, it's a favour.\",\"question\":\"¿Qué le molesta a Ben exactamente?\",\"options\":[\"Que nadie pensara en los que trabajan de noche al cambiar el día\",\"Que le hayan puesto una multa por sacar el cubo antes de tiempo\",\"Que Nora tenga que sacarle el cubo todos los martes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo que le llega es una tarjeta de aviso, no una multa — y no es de eso de lo que se queja.\",\"Lo de Nora es su solución, no su queja, y él mismo dice que es un favor y no una solución.\"],\"itemIds\":[\"enb1m11natoutoforder\",\"enb1m11unfairon\",\"enb1m11itisntfairthat\"],\"tip\":\"Fíjate en cómo corrige Ben a Valeria: «It's not out of order, it's just nobody thought about it. Which is worse». Distinguir entre mala intención y falta de cuidado es una idea de B1 entera, y se dice con frases cortísimas.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m11-2\",\"book\":\"That's not fair.\",\"real\":\"That's a bit out of order.\",\"meaning\":\"Eso está feo / eso no se hace\",\"when\":\"Hablando, entre iguales: con amigos, con vecinos, con compañeros de trabajo. Es más fuerte de lo que parece — «a bit» no lo suaviza, lo enmascara. Con un jefe o en un escrito, no. En el examen, la versión de la derecha, que es la que se puede defender delante de cualquiera.\",\"register\":\"amigos\",\"exam\":\"I don't think that's fair.\",\"note\":\"«Out of order» de una máquina es «averiada»; de una persona es «se ha pasado». El británico casi nunca dice «that's not fair» de adulto: suena a patio de colegio.\",\"sound\":\"dats a bit áut ov ÓO-da\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m11natoutoforder\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"conten
