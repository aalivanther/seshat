lfsmittel, die nicht auf der Liste stehen, werden eingezogen. Die Entscheidung des Prüfungsausschusses ist zu begründen. Eine mündliche Nachprüfung findet nicht statt. Fristen, die auf einen Feiertag fallen, verschieben sich auf den nächsten Werktag. Die Fakultät veröffentlicht die Termine jeweils zum Semesterbeginn. Einsprüche gegen die Termine sind ausgeschlossen."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m12l4\",\"phaseId\":\"b2m12\",\"title\":\"Lesen Teil 4 y 5: posturas y Studienordnung\",\"subtitle\":\"Ocho opiniones, un titular sobra · reglamento universitario\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Del Leserbrief a la norma de facultad\",\"itemIds\":[\"b2m12standpunkte\",\"b2m4studienordnung\",\"b2m12regeln\",\"b2m12titelzuordnen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 4 infiere postura; Teil 5 infiere el título del párrafo\",\"body\":\"Teil 4: \u003cb\u003e8 opiniones\u003c/b\u003e (a–h) y titulares; \u003cb\u003euna sobra\u003c/b\u003e. Nadie escribe «ich bin dafür»: se infiere, como en el m11. Manda el final de cada texto, no la concesión inicial.\u003cbr/\u003e\u003cbr/\u003eTeil 5: una \u003cb\u003eStudienordnung\u003c/b\u003e (ya no una Hausordnung de B1). 3 párrafos, títulos de índice, \u003cb\u003e4 títulos sobran\u003c/b\u003e, ~6 min. Nominalización pura. Busca obligaciones (ist … zu / muss / hat … zu) y condiciones (sofern, erst nach).\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m12l4e1\",\"type\":\"bucket\",\"prompt\":\"Teil 4 en miniatura: ¿a favor de la Pflicht de Homeoffice?\",\"categories\":[\"dafür (Pflicht)\",\"dagegen / nur Wahl\"],\"items\":[{\"text\":\"„Ohne Pflicht ändert sich nichts. Die Firma muss setzen.“\",\"bucket\":0},{\"text\":\"„Natürlich verstehe ich die Bahn. Trotzdem zerstört Pflicht den Effekt.“\",\"bucket\":1},{\"text\":\"„Zwei Tage, aber nur wer will. Sonst spalten wir.“\",\"bucket\":1},{\"text\":\"„Andere Länder machen das längst
