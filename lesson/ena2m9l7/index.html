3c/i\u003e, y aun así lo natural es \u003cb\u003ehow often\u003c/b\u003e. Las respuestas son estas: \u003cb\u003e[[once a week|una vez por semana]]\u003c/b\u003e, \u003ci\u003etwice a month\u003c/i\u003e, \u003ci\u003ethree times a week\u003c/i\u003e, \u003ci\u003eevery day\u003c/i\u003e, \u003ci\u003ehardly ever\u003c/i\u003e, \u003ci\u003enever\u003c/i\u003e. Fíjate en el \u003cb\u003ea\u003c/b\u003e de «once a week»: es «por», no «un».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. WHY = ¿por qué?\u003c/b\u003e — y necesita su auxiliar como cualquier otra pregunta.\u003cbr/\u003e\u003cb\u003e[[Why didn't you tell me?|¿Por qué no me lo dijiste?]]\u003c/b\u003e — nunca \u003ci\u003eWhy you didn't tell me?\u003c/i\u003e\u003cbr/\u003eY se contesta con \u003cb\u003ebecause\u003c/b\u003e (módulo 2), no con \u003ci\u003efor\u003c/i\u003e: \u003ci\u003eBecause I forgot.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. WHICH = ¿cuál (de estos)?\u003c/b\u003e\u003cbr/\u003e\u003cb\u003e[[Which room is yours?|¿Cuál es tu habitación?]]\u003c/b\u003e · \u003ci\u003eWhich one is better?\u003c/i\u003e\u003cbr/\u003eAquí está la trampa más fina del módulo, y es de las que marcan a un hispanohablante a un kilómetro: el español tiene \u003cb\u003e«cuál»\u003c/b\u003e para todo, y el inglés reparte:\u003cbr/\u003e· \u003cb\u003ewhich\u003c/b\u003e cuando eliges entre un número \u003cb\u003ecerrado\u003c/b\u003e de cosas que están ahí: dos habitaciones, tres llaves, estas dos fotos.\u003cbr/\u003e· \u003cb\u003ewhat\u003c/b\u003e cuando la opción está \u003cb\u003eabierta\u003c/b\u003e: \u003ci\u003eWhat's your name?\u003c/i\u003e, \u003ci\u003eWhat's your phone number?\u003c/i\u003e, \u003ci\u003eWhat do you want?\u003c/i\u003e\u003cbr/\u003ePor eso «¿cuál es tu nombre?» es \u003cb\u003eWhat's your name?\u003c/b\u003e y jamás \u003ci\u003eWhich is your name?\u003c/i\u003e: los nombres posibles son infinitos."])</script><script>self.__next_f.push([1,"18:T4e6,Una casa compartida se sostiene con tres frases, y las tres son de este módulo:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[It's your turn.|Te toca.]]\u003c/b\u003e — y su pregunta, \u003cb\u003eWhose turn is it?\u003c/b\u003e Cuidado con el calco: «me toca» no es \u003ci\u003eit touches me\u003c/i\u003e, que significa que te está tocando físicamente.\u003cbr/\u003e· \u003cb\u003eWe take turns.\u003c/b\u003e — nos vamos turnando.\u003cbr/\u003e· \u003cb\u003e[[do the washing-up · take out the rubbish · hoover the flat|fregar los platos · sacar la basura · pasar la aspiradora]]\u003c/b\u003e — las tres tareas que aparecen en cualquier nota de cocina británica. Añade \u003ci\u003edo the shopping\u003c/i\u003e (hacer la compra), \u003ci\u003eclean the bathroom\u003c/i\u003e y \u003ci\u003eput the bins out\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eVocabulario que solo se entiende sabiendo dónde estás:\u003c/b\u003e \u003ci\u003ewashing-up\u003c/i\u003e es fregar los platos a mano (y el aparato es el \u003ci\u003edishwasher\u003c/i\u003e); \u003ci\u003ethe rubbish\u003c/i\u003e es la basura (los americanos dicen \u003ci\u003etrash\u003c/i\u003e); y \u003ci\u003ehoover\u003c/i\u003e es aspirar — viene de la marca Hoover, exactamente igual que en español se dice «un kleenex».\u003cbr/\u003e\u003cbr/\u003eY la pieza pragmática: para pedir un turno se usa la \u003cb\u003eescalera de cortesía del módulo 5\u003c/b\u003e, no el imperativo. \u003ci\u003eTake out the rubbish\u003c/i\u003e suena a orden; \u003cb\u003eCould you take out the rubbish, please?\u003c/b\u003e es lo que se escribe en la nota de la nevera."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l7\",\"phaseId\":\"ena2m9\",\"title\":\"How often? Why? Which?\",\"subtitle\":\"Las preguntas finas — y quién friega los platos\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preguntar con puntería, y repartir la casa\",\"itemIds\":[\"ena2m9howoftendoyouclean\",\"ena2m9onceaweek\",\"ena2m9whichroomisyours\",\"ena2m9whydidntyoutellme\",\"ena2m9itsyourturn\",\"ena2m9choresgroup\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres preguntas que el A1 no te dio\",\"body\":\"$17\",\"table\":[[\"pregunta\",\"cuándo\",\"ejemplo\",\"el calco\"],[\"How often…?\",\"por la frecuencia\",\"How often do you clean it?\",\"How much times…?\"],[\"Why…?\",\"por la razón\",\"Why didn't you tell me?\",\"Why you didn't tell me?\"],[\"Which…?\",\"elección cerrada\",\"Which room is yours?\",\"—\"],[\"What…?\",\"elección abierta\",\"What's your surname?\",\"Which is your surname?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"El reparto de la casa: turnos y tareas\",\"body\":\"$18\",\"table\":[[\"en español\",\"en inglés\"],[\"Te toca.\",\"It's your turn.\"],[\"¿A quién le toca?\",\"Whose turn is it?\"],[\"fregar los platos\",\"do the washing-up\"],[\"sacar la basura\",\"take out the rubbish\"],[\"pasar la aspiradora\",\"hoover the flat\"],[\"hacer la compra\",\"do the shopping\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l7e1\",\"type\":\"match\",\"prompt\":\"Empareja cada pregunta con lo que quiere saber\",\"pairs\":[{\"target\":\"How often…?\",\"source\":\"cada cuánto pasa\"},{\"target\":\"Why…?\",\"source\":\"la razón\"},{\"target\":\"Which…?\",\"source\":\"cuál, entre pocos\"},{\"target\":\"How many…?\",\"source\":\"la cantidad, en cosas contables\"}],\"itemIds\":[\"ena2m9howoftendoyouclean\",\"ena2m9whydidntyoutellme\",\"ena2m9whichroomisyours\",\"enhowmany\"]},{\"id\":\"ena2m9l7e2\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta de frecuencia\",\"wrong\":\"How much times do you clean the kitchen?\",\"answers\":[\"How often do you clean the kitchen?\"],\"why\":\"«Times» es contable, así que ni siquiera podría llevar «much». Pero la forma natural en inglés no es contar veces: es preguntar «how often». Guarda «how many times» para cuando de verdad quieras el número exacto.\",\"translation\":\"¿Cada cuánto limpias la cocina?\",\"itemIds\":[\"ena2m9howoftendoyouclean\"]},{\"id\":\"ena2m9l7e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «cuál» que no es which\",\"wrong\":\"Which is your surname?\",\"answers\":[\"What is your surname?\"],\"why\":\"«Which» solo vale cuando eliges entre un grupo cerrado que está delante (estas dos habitaciones, estas tres llaves). Los apellidos posibles son infinitos, así que la pregunta abre con «what». Es la trampa del «cuál» español, que sirve para las dos cosas.\",\"translation\":\"¿Cuál es tu apellido?\",\"itemIds\":[\"ena2m9whichroomisyours\",\"ensurname\"]},{\"id\":\"ena2m9l7e4\",\"type\":\"bucket\",\"prompt\":\"¿Which o what?\",\"categories\":[\"which (elección cerrada)\",\"what (elección abierta)\"],\"items\":[{\"text\":\"___ room is yours, this one or that one?\",\"bucket\":0},{\"text\":\"___ is your phone number?\",\"bucket\":1},{\"text\":\"___ of these two keys is mine?\",\"bucket\":0},{\"text\":\"___ do you want for dinner?\",\"bucket\":1},{\"text\":\"___ one is cheaper, the blue one or the red one?\",\"bucket\":0},{\"text\":\"___ time do you get up?\",\"bucket\":1}],\"itemIds\":[\"ena2m9whichroomisyours\",\"ena2m4whichisbetterforme\",\"enwhatsyourphone\"],\"tip\":\"Prueba rápida: si puedes señalar las opciones con el dedo, es «which». Si la respuesta puede ser cualquier cosa del mundo, es «what».\"},{\"id\":\"ena2m9l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta de frecuencia\",\"text\":\"How ___ do you take out the rubbish? — Twice a week.\",\"answers\":[\"often\"],\"translation\":\"¿Cada cuánto sacas la basura? — Dos veces por semana.\",\"hints\":[\"Cinco letras, y no es «many times»\",\"o…\"],\"itemIds\":[\"ena2m9howoftendoyouclean\",\"ena2m9choresgroup\",\"entwice\"]},{\"id\":\"ena2m9l7e6\",\"type\":\"cloze\",\"prompt\":\"Completa la respuesta\",\"text\":\"I hoover the flat ___ a week, usually on Sundays.\",\"answers\":[\"once\",\"twice\"],\"translation\":\"Paso la aspiradora una vez por semana, normalmente los domingos.\",\"hints\":[\"Una vez = una sola palabra, no «one time»\",\"o… / t…\"],\"itemIds\":[\"ena2m9onceaweek\",\"ena2m9choresgroup\",\"enusually\"]},{\"id\":\"ena2m9l7e7\",\"type\":\"mc\",\"prompt\":\"El turno\",\"question\":\"«Te toca fregar los platos» es…\",\"options\":[\"It's your turn to do the washing-up.\",\"It touches you to do the washing-up.\",\"You have the turn of the washing-up.\"],\"answer\":0,\"whyWrong\":[null,\"«Touch» es tocar con la mano. El turno inglés se dice con «turn»\",\"«Have the turn of» no es inglés: la fórmula es It's your turn to + verbo\"],\"itemIds\":[\"ena2m9itsyourturn\",\"ena2m9choresgroup\"],\"tip\":\"La fórmula entera, para copiarla tal cual: It's my / your / his / her turn to + verbo en infinitivo.\"},{\"id\":\"ena2m9l7e8\",\"type\":\"transform\",\"prompt\":\"Convierte la orden en petición — la escalera del módulo 5\",\"source\":\"Take out the rubbish.\",\"instruction\":\"Dilo como lo escribirías en la nota de la nevera\",\"answers\":[\"Could you take out the rubbish, please?\",\"Could you take the rubbish out, please?\",\"Can you take out the rubbish, please?\"],\"translation\":\"¿Puedes sacar la basura, por favor?\",\"hints\":[\"Envuelve la orden en una pregunta y añade please al final\",\"C… you take out the rubbish, p…?\"],\"itemIds\":[\"ena2m9choresgroup\",\"ena2m5couldyoubringussomewater\"],\"tip\":\"En español «saca la basura» entre compañeros de piso no es maleducado. En inglés, sí. La escalera de cortesía del módulo 5 se cobra aquí entera.\"},{\"id\":\"ena2m9l7e9\",\"type\":\"build\",\"prompt\":\"Construye la pregunta que más se oye en un piso compartido\",\"target\":\"Whose turn is it to clean the bathroom\",\"translation\":\"¿A quién le toca limpiar el baño?\",\"distractors\":[\"who's\",\"of\"],\"itemIds\":[\"ena2m9itsyourturn\",\"ena2m9whoseorwhos\",\"enbathroom\"],\"tip\":\"El distractor «who's» es el par homófono de la lección 5: suena igual y aquí sería un error de escritura, no de oído.\"},{\"id\":\"ena2m9l7e10\",\"type\":\"audiomc\",\"prompt\":\"El reparto de la semana — 2 escuchas\",\"audio\":\"Right, so I do the washing-up on Monday and Wednesday, you take out the rubbish on Fridays, and we hoover the flat once a month, both of us together.\",\"question\":\"¿Cada cuánto pasan la aspiradora?\",\"options\":[\"Una vez al mes\",\"Una vez por semana\",\"Los viernes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso sería «once a week»: en el audio suena «once a month»\",\"Los viernes es la basura, no la aspiradora\"],\"notepad\":true,\"itemIds\":[\"ena2m9choresgroup\",\"ena2m9onceaweek\",\"ena2m9howoftendoyouclean\"],\"tip\":\"Tres tareas y tres frecuencias en un audio corto. Apunta las tres parejas en el cuaderno mientras suena: de memoria no salen.\"},{\"id\":\"ena2m9l7e11\",\"type\":\"write\",\"prompt\":\"La nota de la nevera: reparte las tareas — 30-50 palabras\",\"scenario\":\"Vives con Amy y Ben. Este mes nadie ha fregado y estáis todos hartos. Escribe la nota que vas a pegar en la nevera para repartir las tareas.\",\"bullets\":[\"Propón repartir las tareas con «Could we…?» o «Could you…?»\",\"Nombra al menos una tarea de la casa\",\"Pregunta a quién le toca algo, con «whose turn»\"],\"checks\":[{\"re\":\"(could|can) (you|we|i)\",\"label\":\"una petición con could/can\"},{\"re\":\"(washing-up|rubbish|bathroom|hoover|shopping)\",\"label\":\"al menos una tarea de la casa\"},{\"re\":\"whose|turn\",\"label\":\"preguntar de quién es el turno\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"polite\",\"requireConnectors\":{\"min\":2,\"bank\":[\"and\",\"but\",\"because\",\"so\"]},\"model\":\"Hi both, Could we share the jobs this month, please? I'll do the washing-up on Monday and Wednesday. Ben, could you take out the rubbish on Fridays, because you finish early? And whose turn is it to clean the bathroom? Valeria\",\"itemIds\":[\"ena2m9choresgroup\",\"ena2m9itsyourturn\",\"ena2m9howoftendoyouclean\"],\"tip\":\"Antes de corregir, cuenta los imperativos pelados que has escrito («Take out the rubbish», «Clean the bathroom»). Cada uno de ellos, en inglés, suena a bronca — y en el examen es la nota de registro.\"},{\"id\":\"ena2m9l7e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la pregunta y la respuesta\",\"text\":\"How often do you clean the kitchen? Once a week, usually on Sundays.\",\"phonetic\":\"jáu Ó-fen du yu KLIIN de KI-chen? UÁNS a UÍIK, YÚU-yua-li on SAN-deis̬\",\"translation\":\"¿Cada cuánto limpias la cocina? Una vez por semana, normalmente los domingos.\",\"itemIds\":[\"ena2m9howoftendoyouclean\",\"ena2m9onceaweek\",\"enusually\"],\"tip\":\"«once» suena UÁNS, con la o de «one». Y ojo a la a de «once a week»: aquí significa «por», y va átona, casi no se oye.\"},{\"id\":\"ena2m9l7e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cada cuánto friegas los platos? ¿Y por qué no me lo dijiste?\",\"answers\":[\"How often do you do the washing-up? And why didn't you tell me?\",\"How often do you do the washing-up? Why didn't you tell me?\",\"How often do you do the washing up? And why didn't you tell me?\"],\"hints\":[\"Las dos preguntas llevan su auxiliar: do en la primera, didn't en la segunda\",\"How o… do you do the washing-up? And why d… you tell me?\"],\"itemIds\":[\"ena2m9howoftendoyouclean\",\"ena2m9whydidntyoutellme\",\"ena2m9choresgroup\"],\"tip\":\"Dos preguntas, dos auxiliares, y en la segunda el pronombre pegado a tell. Módulos 1, 2 y 9 en una línea.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-7\",\"book\":\"Can you take out the rubbish?\",\"real\":\"Can you stick the bins out?\",\"meaning\":\"¿Sacas la basura?\",\"when\":\"Entre compañeros de piso y en familia, en Reino Unido. «The bins» son los cubos grandes que se dejan en la acera, y «stick» aquí no es pegar: significa «poner ahí sin más». En la nota de la nevera y en el examen, «take out the rubbish».\",\"register\":\"amigos\",\"note\":\"«Stick it in the fridge», «stick it on the table», «stick the kettle on»: stick sirve para colocar cualquier cosa en cualquier sitio sin ceremonia. Es de las palabras más útiles del inglés doméstico.\",\"sound\":\"kan yu STIK de BINS̬ áut\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Question words\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/question-words\",\"note\":\"La ficha completa de las palabras interrogativas. Fíjate solo en los ejemplos de which frente a what: es la distinción que el español no hace.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
