g\",\"source\":\"la iluminación\"},{\"target\":\"a sketch\",\"source\":\"un boceto\"},{\"target\":\"the catalogue\",\"source\":\"el catálogo\"},{\"target\":\"contemporary art\",\"source\":\"arte contemporáneo\"},{\"target\":\"classical art\",\"source\":\"arte clásico\"}],\"itemIds\":[\"enb2m10abrushstroke\",\"enb2m10thelighting\",\"enb2m10asketch\",\"enb2m10thecatalogue\",\"enb2m10contemporaryart\",\"enb2m10classicalart\"]},{\"id\":\"enb2m10l7e2\",\"type\":\"cloze\",\"prompt\":\"La evaluación de examen, no la de B1\",\"text\":\"I found it profoundly ___.\",\"answers\":[\"moving\"],\"translation\":\"Me resultó profundamente conmovedor.\",\"itemIds\":[\"enb2m10profoundlymoving\"]},{\"id\":\"enb2m10l7e3\",\"type\":\"paraphrase\",\"prompt\":\"Sube el registro: quita very nice\",\"source\":\"The photograph was very nice.\",\"forbid\":[\"nice\",\"very\",\"good\"],\"answers\":[\"I found it profoundly moving.\",\"I found the photograph profoundly moving.\",\"The photograph was profoundly moving.\"],\"translation\":\"La fotografía me resultó profundamente conmovedora.\",\"itemIds\":[\"enb2m10profoundlymoving\"]},{\"id\":\"enb2m10l7e4\",\"type\":\"audiomc\",\"prompt\":\"Ade y Valeria, en la sala. Pregunta ANTES. Cuaderno: la evaluación llega al final.\",\"notepad\":true,\"plays\":2,\"audio\":\"You've been in the small room a while.|Nora wanted another minute.|Take your time. That's the point.|She said the lighting made the woman look colder than she was.|It does. That's the North.|Is it contemporary or is it just old?|It's a photograph from 1984 hung as if it were a relic. The hanging is contemporary. The picture isn't.|She asked me if she could buy the catalogue.|It's twelve pounds. The research is in there. The caption isn't.|She was like, I don't need the book. I know the platform.\",\"question\":\"¿Qué distingue Ade entre la foto y el montaje, y qué dice Nora del catálogo?\",\"options\":[\"El montaje es contemporáneo y la foto no; Nora no necesita el catálogo porque reconoce el andén.\",\"La foto es arte contemporáneo y Nora quiere comprar el catálogo sí o sí.\",\"Ade no distingue nada y le recomienda a Nora que no entre.\"],\"answer\":0,\"whyWrong\":[null,\"Nora dice I don't need the book. El catálogo es lo que Ade ofrece, no lo que ella pide.\",\"Take your time. That's the point. Es lo contrario de no entrar.\"],\"itemIds\":[\"enb2m10thelighting\",\"enb2m10contemporaryart\",\"enb2m10thecatalogue\",\"enb2m10thecaption\"]},{\"id\":\"enb2m10l7e5\",\"type\":\"gapbank\",\"prompt\":\"Un párrafo de catálogo, con el léxico de hoy\",\"text\":\"The ___ of the still life is simple: fruit, a knife, a window. What holds it is the ___ — one long mark in the dark. A ___ on the back of the canvas, unsigned, suggests the painter had been looking at the same window for months. The work is not on ___; it belongs to the collection.\",\"answers\":[\"composition\",\"brushstroke\",\"sketch\",\"loan\"],\"bank\":[\"composition\",\"brushstroke\",\"sketch\",\"loan\",\"caption\",\"lighting\",\"ticket\",\"shelf\"],\"translation\":\"La composición del bodegón es simple: fruta, un cuchillo, una ventana. Lo que lo sostiene es la pincelada: una marca larga en lo oscuro. Un boceto en el reverso, sin firmar, sugiere que el pintor llevaba meses mirando la misma ventana. La obra no está en préstamo: es de la colección.\",\"itemIds\":[\"enb2m10thecomposition\",\"enb2m10abrushstroke\",\"enb2m10asketch\",\"enb2m10onloan\"]},{\"id\":\"enb2m10l7e6\",\"type\":\"errorfix\",\"prompt\":\"Un solo error: composition de texto donde iba la del cuadro\",\"wrong\":\"The essay of the painting is very balanced.\",\"answers\":[\"The composition of the painting is very balanced.\",\"The composition of the painting is balanced.\"],\"why\":\"Essay es el texto. Composition, junto a painting, es cómo está montado el cuadro. El calco viene de «la composición del cuadro» mal traducida por la palabra que el alumno ya usa para escribir.\",\"translation\":\"La composición del cuadro está muy equilibrada.\",\"itemIds\":[\"enb2m10thecomposition\"]},{\"id\":\"enb2m10l7e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Al inglés, con found it + adverbio\",\"source\":\"Me resultó profundamente conmovedor.\",\"answers\":[\"I found it profoundly moving.\",\"I found it deeply moving.\"],\"hint\":\"I found it profoundly…\",\"itemIds\":[\"enb2m10profoundlymoving\"]},{\"id\":\"enb2m10l7e8\",\"type\":\"shadow\",\"prompt\":\"Sombrea la de la calle, para reconocerla. No la escribas en el examen.\",\"text\":\"It got me, that.\",\"phonetic\":\"it got mi, dat\",\"translation\":\"Eso sí que me llegó.\",\"reps\":2,\"itemIds\":[\"enb2m10itgotme\"]},{\"id\":\"enb2m10l7e9\",\"type\":\"type\",\"prompt\":\"La colocación: no está en venta, está…\",\"question\":\"La obra no es de esta galería: está ___ ___ from Leeds.\",\"answers\":[\"on loan\"],\"itemIds\":[\"enb2m10onloan\"]},{\"id\":\"enb2m10l7ext2\",\"type\":\"transform\",\"prompt\":\"Orden reportada en negativo\",\"source\":\"Don't go, he told her.\",\"instruction\":\"Estilo indirecto: told / advised + not to\",\"answers\":[\"He told her not to go.\",\"He advised her not to go.\",\"He told Nora not to go.\"],\"translation\":\"Le dijo que no fuera.\",\"itemIds\":[\"enb2m10hetoldmenotto\",\"enb2m10headvisedmenotto\"],\"tip\":\"El not se pega al infinitivo. He told her to not to go duplica el to y es el calco.\"},{\"id\":\"enb2m10l7exw2\",\"type\":\"write\",\"prompt\":\"Artículo de 140-180. Describe la sala de Ade, no un inventario ni una tesis sobre el arte.\",\"scenario\":\"La revista del barrio pide un artículo sobre la sala pequeña de la Palmer Road Gallery. 140-180 palabras. Valeria acompaña a Nora; Ade Balogun abre la puerta. Describe la sala y lo que había debajo. No es un relato de cuarenta años (eso es la L8) y no es una crítica de ismos. Fuera de tema vale cero.\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review — call for pieces\",\"text\":\"Describe a room in a local gallery and what sits underneath the looking. Stay in that room. Off-topic scores nothing.\"},\"bullets\":[\"Describe la sala con al menos un sentido concreto (luz, silencio, el banco).\",\"Mete una capa de fondo (who had been / which she had kept / past perfect).\",\"Cierra con looking back / I found it… / beneath it all, no with «very nice».\"],\"checks\":[{\"re\":\"(lighting|quiet|silence|bench|photograph|gallery)\",\"label\":\"Describes the room with a concrete sense or object\"},{\"re\":\"(had (been|kept)|who had|which she had)\",\"label\":\"Puts a past-perfect layer underneath\"},{\"re\":\"(looking back|profoundly|beneath)\",\"label\":\"Closes with B2 evaluation, not very nice\"}],\"frame\":[\"Párrafo 1 — entrar: la luz, el banco, Ade\",\"Párrafo 2 — el fondo: Nora, who had been… / the ticket she had kept\",\"Párrafo 3 — Looking back… / I found it profoundly…\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"looking back\",\"at that point\",\"although\",\"beneath it all\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"The small room at the back of the Palmer Road Gallery holds one photograph and a bench. Ade Balogun, who curates the house, opened the door and said little. The lighting is winter light, even in June. Nora, who had been waiting in the doorway, took Valeria's arm. She had kept a ticket from that station for forty years.\\nThe woman on the platform wears a coat that still exists. Beneath it all the picture is not about photography. It is about the length of time a person can look. Amy would have asked for the caption. Ben would have checked the hours. Nora did neither. At that point she stopped reading the card.\\nLooking back, Valeria found it profoundly moving, although she could not have said why until Nora nodded. In the years that followed, Nora went back. The catalogue was twelve pounds; she did not buy it. She already knew the platform. That is the room. It is not an argument about contemporary art. It is a description of a Saturday that had been waiting underneath.\",\"itemIds\":[\"enb2m10thelighting\",\"enb2m10whohadbeenwaiting\",\"enb2m10beneathitall\",\"enb2m10profoundlymoving\",\"enb2m10adescriptivecomposition\",\"enb2m10anexhibition\"],\"tip\":\"Si te sale un inventario (there was a bench, there was a wall) o un ismo, recorta. La sala hace el trabajo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m10-4\",\"book\":\"He told me not to go.\",\"real\":\"He was like, don't go.\",\"meaning\":\"Me dijo que no fuera.\",\"when\":\"Was like + la orden en directo es de conversación, de contar lo que dijo alguien. En el relato del examen, he told me not to go o he advised me not to go. Like no es un verbo de decir en el papel.\",\"register\":\"amigos\",\"exam\":\"He advised me not to go.\",\"note\":\"El not se pega al infinitivo. He advised me to not to go duplica el to y es el calco.\",\"sound\":\"ji uos̬ laik, dóunt góu\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m10headvisedmenotto\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web
