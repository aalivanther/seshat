, y de él salen los otros dos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eError 2 — qué preposición.\u003c/b\u003e El español usa «desde» para las dos cosas; el inglés reparte:\u003cbr/\u003e· \u003cb\u003efor\u003c/b\u003e + \u003cb\u003ecuánto DURA\u003c/b\u003e: [[for three years|desde hace tres años]], for two months, for ten minutes, for a long time, [[all my life|toda mi vida]].\u003cbr/\u003e· \u003cb\u003esince\u003c/b\u003e + \u003cb\u003ecuándo EMPEZÓ\u003c/b\u003e: [[since 2019|desde 2019]], since March, since Monday, since I arrived, [[since school|desde el colegio]].\u003cbr/\u003e\u003cbr/\u003eTruco para no dudar: si detrás puedes poner un reloj o un calendario contando hacia atrás, es \u003cb\u003efor\u003c/b\u003e. Si detrás hay un punto en el calendario, es \u003cb\u003esince\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eError 3 — el calco de «desde hace».\u003c/b\u003e «Desde hace tres años» tiene DOS palabras, y la mano quiere traducir las dos: sale \u003cb\u003e\u003ci\u003esince three years\u003c/i\u003e\u003c/b\u003e, que en inglés no significa nada. «Tres años» es una duración, así que es \u003cb\u003efor three years\u003c/b\u003e y punto. \u003ci\u003edesde hace\u003c/i\u003e = \u003cb\u003efor\u003c/b\u003e. Una palabra.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la pregunta que abre todo esto:\u003c/b\u003e [[How long have you worked here?|¿Cuánto tiempo llevas trabajando aquí?]] — nunca \u003ci\u003eHow long do you work here?\u003c/i\u003e, que preguntaría por tu horario.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn detalle que sorprende:\u003c/b\u003e verbos como \u003ci\u003eknow\u003c/i\u003e, \u003ci\u003ehave\u003c/i\u003e o \u003ci\u003ebe\u003c/i\u003e no admiten el continuo, así que se dicen con el perfecto simple: \u003ci\u003eI've known Ben since school\u003c/i\u003e, no \u003ci\u003eI'm knowing Ben\u003c/i\u003e. Y la traducción española es un presente puro: «conozco a Ben desde el colegio»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l7\",\"phaseId\":\"ena2m10\",\"title\":\"For three years, since 2019\",\"subtitle\":\"«Desde hace tres años»: tres errores encadenados, uno por uno\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuánto llevas haciendo algo\",\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10forthreeyears\",\"ena2m10since2019\",\"ena2m10howlonghaveyou\",\"ena2m10iveknownbensince\",\"ena2m10allmylife\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Empecemos por el español, porque el problema está ahí\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"por qué\"],[\"Trabajo aquí desde hace tres años.\",\"I've worked here for three years.\",\"perfecto + for (duración)\"],[\"Trabajo aquí desde 2019.\",\"I've worked here since 2019.\",\"perfecto + since (arranque)\"],[\"Conozco a Ben desde el colegio.\",\"I've known Ben since school.\",\"presente español = perfecto inglés\"],[\"¿Cuánto llevas aquí?\",\"How long have you been here?\",\"how long + perfecto\"],[\"Llevo dos meses estudiando.\",\"I've studied for two months.\",\"«llevar + gerundio» = perfecto\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l7e1\",\"type\":\"bucket\",\"prompt\":\"¿Duración (for) o punto de arranque (since)?\",\"categories\":[\"for — cuánto dura\",\"since — cuándo empezó\"],\"items\":[{\"text\":\"three years\",\"bucket\":0},{\"text\":\"2019\",\"bucket\":1},{\"text\":\"two months\",\"bucket\":0},{\"text\":\"March\",\"bucket\":1},{\"text\":\"a long time\",\"bucket\":0},{\"text\":\"I arrived in London\",\"bucket\":1},{\"text\":\"ten minutes\",\"bucket\":0},{\"text\":\"last Monday\",\"bucket\":1}],\"itemIds\":[\"ena2m10forthreeyears\",\"ena2m10since2019\",\"ena2m10allmylife\"],\"tip\":\"Fíjate en que ninguna decisión depende del verbo: solo de si detrás hay una cantidad de tiempo o una fecha. Es una regla de dos segundos.\"},{\"id\":\"ena2m10l7e2\",\"type\":\"mc\",\"prompt\":\"El calco más caro de la lección\",\"question\":\"«Trabajo aquí desde hace tres años»\",\"options\":[\"I've worked here for three years.\",\"I work here since three years.\",\"I'm working here since three years.\"],\"answer\":0,\"whyWrong\":[null,\"Tres errores a la vez: presente por perfecto, since por for, y el calco de «desde hace»\",\"El continuo no arregla el since: el problema es que tres años es una DURACIÓN\"],\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10forthreeyears\"],\"tip\":\"«desde hace» son dos palabras en español y UNA en inglés: for. Cuando te salga el impulso de traducir las dos, corta por lo sano.\"},{\"id\":\"ena2m10l7e3\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"I've studied English ___ three years.\",\"answers\":[\"for\"],\"translation\":\"Llevo tres años estudiando inglés.\",\"hints\":[\"Tres años es una cantidad de tiempo, no una fecha\",\"f…\"],\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10forthreeyears\"]},{\"id\":\"ena2m10l7e4\",\"type\":\"cloze\",\"prompt\":\"Y ahora la otra\",\"text\":\"She's worked at the hospital ___ 2019.\",\"answers\":[\"since\"],\"translation\":\"Trabaja en el hospital desde 2019.\",\"hints\":[\"2019 es un punto en el calendario\",\"s…\"],\"itemIds\":[\"ena2m10since2019\",\"enhospital\"]},{\"id\":\"ena2m10l7e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error 1: el tiempo verbal\",\"wrong\":\"I live in London since 2023.\",\"answers\":[\"I've lived in London since 2023.\",\"I have lived in London since 2023.\"],\"why\":\"El español usa presente («vivo aquí desde 2023») porque le basta con «desde» para decir que la cosa viene de atrás. El inglés necesita marcarlo en el verbo: empezó antes y sigue, o sea perfecto. La preposición aquí estaba bien; lo que fallaba era el tiempo.\",\"translation\":\"Vivo en Londres desde 2023.\",\"itemIds\":[\"ena2m10since2019\",\"enlondon\"]},{\"id\":\"ena2m10l7e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error 2: la preposición\",\"wrong\":\"I've studied English since three years.\",\"answers\":[\"I've studied English for three years.\"],\"why\":\"«Tres años» dice cuánto DURA, no cuándo empezó, y eso es for. Con since haría falta un punto del calendario: since 2022, since March, since I arrived. El tiempo verbal de esta frase ya estaba bien: aquí el único fallo era la preposición.\",\"translation\":\"Llevo tres años estudiando inglés.\",\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10forthreeyears\"]},{\"id\":\"ena2m10l7e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error 3: la pregunta\",\"wrong\":\"How long do you work here?\",\"answers\":[\"How long have you worked here?\",\"How long have you been here?\"],\"why\":\"«How long do you work here?» pregunta por tu horario: cuántas horas haces. Para preguntar desde cuándo llevas en el sitio hace falta el perfecto: How long HAVE you WORKED here? Es la misma diferencia que hay entre «¿cuánto trabajas?» y «¿cuánto llevas trabajando?».\",\"translation\":\"¿Cuánto tiempo llevas trabajando aquí?\",\"itemIds\":[\"ena2m10howlonghaveyou\",\"endoyouwork\"]},{\"id\":\"ena2m10l7e8\",\"type\":\"transform\",\"prompt\":\"Del español al inglés, paso a paso\",\"source\":\"I know Ben since school.\",\"instruction\":\"Arregla solo el tiempo verbal (la preposición ya está bien)\",\"answers\":[\"I've known Ben since school.\",\"I have known Ben since school.\"],\"translation\":\"Conozco a Ben desde el colegio.\",\"hints\":[\"know → knew → known\",\"I've kn…n Ben since school.\"],\"itemIds\":[\"ena2m10iveknownbensince\",\"ena2m2knewgroup\",\"enschool\"],\"tip\":\"know no admite continuo: nada de «I'm knowing». Con estos verbos —know, have, be, like— el perfecto simple es la única opción.\"},{\"id\":\"ena2m10l7e9\",\"type\":\"build\",\"prompt\":\"Construye la pregunta\",\"target\":\"How long have you worked at the café\",\"translation\":\"¿Cuánto tiempo llevas trabajando en el café?\",\"distractors\":[\"do\",\"since\"],\"itemIds\":[\"ena2m10howlonghaveyou\"]},{\"id\":\"ena2m10l7e10\",\"type\":\"gapbank\",\"prompt\":\"La entrevista de Valeria: for o since\",\"text\":\"«How long ___ you lived in London?» «___ 2023.» «And how long have you worked at the café?» «___ eight months.»\",\"answers\":[\"have\",\"Since\",\"For\"],\"bank\":[\"have\",\"Since\",\"For\",\"do\",\"Ago\",\"During\"],\"translation\":\"«¿Cuánto tiempo llevas viviendo en Londres?» «Desde 2023.» «¿Y cuánto llevas trabajando en el café?» «Ocho meses.»\",\"itemIds\":[\"ena2m10howlonghaveyou\",\"ena2m10since2019\",\"ena2m10forthreeyears\",\"enlondon\"],\"tip\":\"Ojo al banco: Ago y During están ahí porque son los dos vecinos que más se cuelan. «ago» va detrás y con pasado simple (two years ago); «during» dice dentro de qué periodo, no cuánto dura.\"},{\"id\":\"ena2m10l7e11\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"I've known Amy for two years.\",\"translation\":\"Conozco a Amy desde hace dos años.\",\"hints\":[\"Dos años es duración\",\"I've kn…n Amy f… two years.\"],\"itemIds\":[\"ena2m10iveknownbensince\",\"ena2m10forthreeyears\"]},{\"id\":\"ena2m10l7e12\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés — la frase con la que empezó la lección\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Trabajo aquí desde hace tres años y conozco a Ben desde el colegio.\",\"answers\":[\"I've worked here for three years and I've known Ben since school.\",\"I have worked here for three years and I have known Ben since school.\",\"I've worked here for three years and I've known Ben since school!\"],\"hint\":\"una mitad cuenta cuánto dura y la otra dice cuándo empezó\",\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10iveknownbensince\",\"ena2m10forthreeyears\"],\"tip\":\"Dos «desde» españoles y dos preposiciones inglesas distintas en la misma frase. Si te ha salido, has desmontado los tres errores de una vez.\"},{\"id\":\"ena2m10l7e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cuánto tiempo llevas estudiando inglés? — Desde 2022. Unos tres años.\",\"answers\":[\"How long have you studied English? Since 2022. About three years.\",\"How long have you studied English? Since 2022. For about three years.\",\"How long have you studied English? Since 2022. Around three years.\"],\"hints\":[\"La pregunta va con have + tercera columna; la fecha con since y la duración con for\",\"How long h… you studied English? S… 2022.\"],\"itemIds\":[\"ena2m10howlonghaveyou\",\"ena2m10since2019\",\"ena2m10ivestudiedenglishfor\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m10-7\",\"book\":\"I have worked here for a long time.\",\"real\":\"I've been here ages.\",\"meaning\":\"Llevo aquí un montón de tiempo\",\"when\":\"Charla informal en el trabajo o con vecinos. Fíjate en dos cosas: «ages» es «un montón», no «edades», y en esta fórmula hasta el for se cae. En el examen escribe la de arriba, con for y todo.\",\"register\":\"amigos\",\"note\":\"«ages» es tan común que sirve para todo: «I haven't seen you for ages» — «hace siglos que no te veo». Esa sí conserva el for.\",\"sound\":\"áiv bin jía ÉI-dchis̬\",\"level\":\"a2\",\"itemId\":\"ena2m10forthreeyears\"}}],\"resources\":[{\"label\":\"British Council — 'for' and 'since'\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/for-since\",\"note\":\"Cinco minutos. Y luego escribe tres frases tuyas de verdad: una con for, una con since y una pregunta con How long. Con tus datos, no con los del ejemplo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:nu
