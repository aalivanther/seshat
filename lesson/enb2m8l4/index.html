elato o descripción. El Practice Paper 1 dice literalmente \u003ci\u003eWrite an essay… «My earliest childhood memories»\u003c/i\u003e — lo llama essay y pide una descripción narrativa. Las dos cosas son ciertas: para LanguageCert, essay aquí significa «pieza continua para una publicación», no «argumentación con tesis».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY sin embargo el temario de B2 sí dice\u003c/b\u003e, con todas las letras: \u003ci\u003epresent an argument giving points for and against, supporting and evaluating different views\u003c/i\u003e. El First de Cambridge y el ISE II de Trinity sí lo examinan. Un B2 que solo sepa cartas llega cojo al trabajo y cojo al siguiente examen.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eSe enseña igual, y se te dice cuál es cuál.\u003c/b\u003e Hoy escribes el género que el descriptor pide. El m10 te entrenará la Writing 2 exacta (relato o descripción, 150-200). No es un capricho: es no dejar el nivel a medias.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl esqueleto, cuatro párrafos:\u003c/b\u003e\u003cbr/\u003e1. Tesis. Una. Al principio. \u003ci\u003eIt could be argued that…\u003c/i\u003e — sin In my opinion si puedes.\u003cbr/\u003e2. A favor, con ejemplo.\u003cbr/\u003e3. En contra \u003cb\u003ey la concesión\u003c/b\u003e. Admittedly… Nevertheless…\u003cbr/\u003e4. Conclusión que \u003cb\u003eno copia la tesis\u003c/b\u003e: pesa, decide, reserva.\u003cbr/\u003e\u003cbr/\u003e150-180 hoy. 150-200 en la L8, con más conectores."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m8l4\",\"phaseId\":\"enb2m8\",\"title\":\"The essay they don't ask\",\"subtitle\":\"For and against: el género rey, y por qué LanguageCert no te lo pone en el papel\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tesis, concesión, y la sorpresa nº 3\",\"itemIds\":[\"enb2m8forandagainst\",\"enb2m8athesis\",\"enb2m8aconcession\",\"enb2m8itcouldbearguedthat\",\"enb2m8theexamdoesnotask\",\"enb2m8evaluating\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es un ensayo a favor y en contra, y por qué lo enseño aunque el papel no lo pida\",\"body\":\"$17\",\"table\":[[\"Qué\",\"LanguageCert Writing 2\",\"Este módulo\"],[\"Género\",\"carta / relato / descripción\",\"ensayo for-and-against\"],[\"¿Lo pide el papel?\",\"sí, y lo llama essay a una descripción\",\"no, y se enseña igual\"],[\"¿Lo pide el descriptor?\",\"también cartas e informes\",\"sí, for and against, con todas las letras\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l4e1\",\"type\":\"mc\",\"prompt\":\"La sorpresa, de frente\",\"question\":\"El Writing 2 de LanguageCert B2 es…\",\"options\":[\"Una carta personal, un relato o una descripción — no un ensayo a favor y en contra\",\"Un ensayo a favor y en contra de 150-200 palabras\",\"Un informe con datos y reservas\"],\"answer\":0,\"whyWrong\":[null,\"Eso es lo que el descriptor pide y lo que Cambridge First examina. LanguageCert, en el papel, no.\",\"Eso era el m5. Tampoco cae en el Writing 2.\"],\"itemIds\":[\"enb2m8theexamdoesnotask\",\"enb2m8forandagainst\"],\"tip\":\"Si alguien te ha vendido «B2 = essay for and against» como formato de LanguageCert, te ha vendido Cambridge. Aquí se enseña el género y se marca cuál es cuál.\"},{\"id\":\"enb2m8l4e2\",\"type\":\"mc\",\"prompt\":\"Por qué se enseña igual\",\"question\":\"¿Por qué este curso enseña el ensayo argumentativo aunque el papel no lo ponga?\",\"options\":[\"Porque el descriptor de nivel lo pide, y el First y el ISE II sí lo examinan: un B2 que solo sepa cartas llega cojo\",\"Porque el Practice Paper 1 trae un for-and-against sobre el clima\",\"Porque es más fácil de corregir que un relato\"],\"answer\":0,\"whyWrong\":[null,\"El Practice Paper 1 llama essay a «My earliest childhood memories»: una descripción.\",\"No es más fácil. Es otra habilidad. Se enseña porque es del nivel, no porque sea cómoda.\"],\"itemIds\":[\"enb2m8evaluating\",\"enb2m8theexamdoesnotask\"],\"tip\":\"La misma política que el B1 tomó al revés: allí se enseñaba de más porque la norma era estrecha en gramática; aquí, porque es estrecha en géneros.\"},{\"id\":\"enb2m8l4e3\",\"type\":\"paraphrase\",\"prompt\":\"Quítate del medio: sin «I» ni «opinion»\",\"source\":\"In my opinion, the bike lane is overdue.\",\"forbid\":[\"i\",\"my\",\"opinion\",\"think\",\"believe\"],\"answers\":[\"It could be argued that the lane is overdue\",\"It could be argued that the bike lane is overdue\"],\"translation\":\"En mi opinión, el carril bici llega tarde.\",\"hints\":[\"It could be argued that…\",\"It could be argued that the lane is ...\"],\"itemIds\":[\"enb2m8itcouldbearguedthat\",\"enb2m8natifyouaskme\",\"enb2m8abikelane\"],\"tip\":\"In my opinion es B1 y anuncia que vienes tú. It could be argued that pone la tesis sin el yo. El ensayo lo agradece; el Speaking Part 1, a veces, no: allí sí te preguntan what you think.\"},{\"id\":\"enb2m8l4e4\",\"type\":\"write\",\"prompt\":\"El ensayo, versión corta. 150-180. Tesis, un a favor, concesión + en contra, cierre que no copie la tesis.\",\"scenario\":\"Un boletín del barrio pide un texto de 150-180 palabras: «Should the council replace parking on Valeria's street with a bike lane?» Ensayo a favor y en contra. No es el Writing 2 de LanguageCert, y lo sabes: se escribe igual porque el nivel lo pide. Tesis sin «I think». Una concesión. Una conclusión que pese, no que copie el primer párrafo.\",\"genre\":\"essay\",\"bullets\":[\"Tesis al principio, sin In my opinion si puedes (It could be argued / The question is whether…).\",\"Un párrafo a favor con ejemplo, y uno en contra CON concesión (Admittedly / Granted / It is true that).\",\"Cierre que no copie la tesis: To sum up / All things considered + una reserva.\"],\"checks\":[{\"re\":\"(it could be argued|the question is whether|this essay (considers|examines)|whereas)\",\"label\":\"Hay tesis sin «yo creo» como herramienta principal\"},{\"re\":\"(admittedly|granted|it is true that|nevertheless|all the same|even so|even if)\",\"label\":\"Hay una concesión\"},{\"re\":\"(to sum up|all things considered|on balance|in conclusion)\",\"label\":\"Hay un cierre de ensayo\"}],\"frame\":[\"Tesis: It could be argued that… / The council's plan…\",\"A favor: air, emissions, safety — con un ejemplo de la calle\",\"Concesión + en contra: Admittedly… Nevertheless… the 29, Nora, the stop\",\"Cierre: To sum up, neither side is entirely right. A condition (provided that / as long as…)\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"whereas\",\"admittedly\",\"nevertheless\",\"even if\",\"to sum up\",\"on balance\",\"it is true that\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":180,\"model\":\"It could be argued that the council's bike lane is overdue in terms of air quality, whereas the plan as it stands treats the 29 as if it were just another car. To begin with, emissions at the lights are the worst in the ward, and a lane would cut the school-run traffic that sits there with engines on. Admittedly, the air would improve. Nevertheless, the buses still have to get through: due to the fact that the road is narrow, not only is the corner slower, but it is also less safe if the 29 swings out. Granted, parking is not a human right. All the same, Nora cannot walk to the next stop, and Ben, who drives those buses, is not inventing the timetable. To sum up, neither side is entirely right. The lane is worth building provided that one stop and one passing place stay; once they go, you cannot put them back overnight.\",\"itemIds\":[\"enb2m8itcouldbearguedthat\",\"enb2m8whereas\",\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8granted\",\"enb2m8allthesame\",\"enb2m8tosumup\",\"enb2m8neithernor\",\"enb2m8forandagainst\",\"enb2m8abikelane\",\"enb1m4council\"],\"tip\":\"Cuenta los I think: cero. Cuenta las concesiones: admittedly, granted, all the same. La conclusión no copia la tesis: pone una condición. Eso es evaluar, no listar.\"},{\"id\":\"enb2m8l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa la tesis sin yo\",\"text\":\"It could be ___ that the lane is overdue.\",\"answers\":[\"argued\"],\"translation\":\"Podría argumentarse que el carril llega tarde.\",\"hints\":[\"El participio de argue\",\"argu...\"],\"itemIds\":[\"enb2m8itcouldbearguedthat\"],\"tip\":\"Could be said también vale en la vida; could be argued es el bloque del ensayo. Said es rumor; argued, tesis.\"},{\"id\":\"enb2m8l4e6\",\"type\":\"type\",\"prompt\":\"La sorpresa, en una frase\",\"question\":\"El Writing 2 de LanguageCert no es un ensayo a favor y en contra.\",\"answers\":[\"LanguageCert Writing 2 is not a for-and-against essay\",\"LanguageCert Writing 2 is not a for and against essay\",\"The LanguageCert Writing 2 is not a for-and-against essay\"],\"hints\":[\"El título del examen + is not + el género\",\"LanguageCert Writing 2 is not a for-and-against ...\"],\"itemIds\":[\"enb2m8theexamdoesnotask\",\"enb2m8forandagainst\"],\"tip\":\"Guárdatela para el m12. Llegar al papel escribiendo un for-and-against cuando te piden un recuerdo de infancia es exactamente «off-topic = cero».\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile
