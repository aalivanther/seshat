tic/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tbbd,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. El m1 se llevó el \u003cb\u003eListening Part 1\u003c/b\u003e, el m2 el \u003cb\u003eReading Part 1\u003c/b\u003e, el m3 el \u003cb\u003eListening Part 3\u003c/b\u003e, el m4 el \u003cb\u003eReading Part 4\u003c/b\u003e, el m5 el \u003cb\u003eWriting Part 1\u003c/b\u003e y el m6 el \u003cb\u003eListening Part 2\u003c/b\u003e. Hoy caen \u003cb\u003edos\u003c/b\u003e: el \u003cb\u003eListening Part 4\u003c/b\u003e —que estaba pendiente— y el \u003cb\u003eSpoken Part 3\u003c/b\u003e, que es la parte para la que este módulo entero ha estado entrenando. Y van juntas por un motivo: las dos son \u003cb\u003euna discusión entre dos personas\u003c/b\u003e. En una la oyes y en la otra la sostienes, y lo que hay que saber es lo mismo — quién propone, quién cede, dónde se gira el argumento y cómo se cierra. Primero el Spoken, que es lo que traías entrenado; el laboratorio de escucha va al final de la lección.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl formato, exacto:\u003c/b\u003e el oral dura \u003cb\u003e12 minutos\u003c/b\u003e con un interlocutor de carne y hueso, y son \u003cb\u003ecuatro partes de tres minutos\u003c/b\u003e, todas con el mismo peso. En el Part 3 el examinador te pone delante una \u003cb\u003ehoja con imágenes\u003c/b\u003e —los \u003ci\u003evisual prompts\u003c/i\u003e— y \u003cb\u003eempieza él\u003c/b\u003e: «Our class is presenting a project called… Let's ask and answer questions to help us \u003cb\u003edecide\u003c/b\u003e which… I'll start.»\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí está la frase del handbook que decide la nota:\u003c/b\u003e \u003ci\u003e«an \u003cb\u003eattempt at agreement\u003c/b\u003e after a discussion based on visual prompts is expected»\u003c/i\u003e. Léela otra vez. No dice «describe las imágenes». No dice «da tu opinión». Dice \u003cb\u003edecidir\u003c/b\u003e e \u003cb\u003eintentar acordar\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn A1 y en A2 esta parte era otra cosa\u003c/b\u003e: encontrar diferencias entre dos fotos. Describir. En B1 \u003cb\u003edeja de ser descriptiva y pasa a ser transaccional\u003c/b\u003e, y ese es el salto que pilla a todo el mundo: se puede hacer un Part 3 con un inglés impecable y sacar poca nota \u003cb\u003epor no haber negociado nada\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas cuatro razones por las que se falla:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003ePor describir.\u003c/b\u003e Si te oyes decir «In this picture I can see…», estás haciendo el examen del A2.\u003cbr/\u003e2. \u003cb\u003ePor no reaccionar.\u003c/b\u003e El descriptor pide responder a lo que dice el otro, no soltar tu discurso por turnos. Un \u003ci\u003eThat's a good point\u003c/i\u003e vale más que tres frases tuyas.\u003cbr/\u003e3. \u003cb\u003ePor no cerrar.\u003c/b\u003e Si se acaban los tres minutos y nadie ha dicho \u003ci\u003eso we've agreed…\u003c/i\u003e, falta el movimiento que el examen pide por escrito.\u003cbr/\u003e4. \u003cb\u003ePor acaparar o por desaparecer.\u003c/b\u003e Son \u003cb\u003eturnos\u003c/b\u003e. Hablar tú solo penaliza igual que no hablar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTu partitura, memorizada, para los tres minutos:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eHow about…? → I'm not so sure about that, because… → That's a good point. What if we…? → Right, so we've agreed to…\u003c/i\u003e\u003cbr/\u003eCuatro movimientos. Si los das los cuatro, has hecho la tarea aunque el vocabulario sea sencillo. Si das solo el primero cuatro veces, no.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una cosa que nadie te dice:\u003c/b\u003e \u003cb\u003eno tienes que ganar la discusión\u003c/b\u003e. Ceder puntúa. \u003ci\u003eYou're right, let's do it your way\u003c/i\u003e es un movimiento válido y rápido, y deja tiempo para el cierre."])</script><script>self.__next_f.push([1,"18:T7cd,"])</script><script>self.__next_f.push([1,"Con este laboratorio se cierra el \u003cb\u003eescrito entero\u003c/b\u003e: cuatro partes de Listening, cuatro de Reading y las dos de Writing, todas practicadas por separado. Del oral te quedará una sola, el \u003cb\u003eSpeaking Part 4\u003c/b\u003e, y la harás en el módulo 12, pegada al simulacro.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué es el Part 4.\u003c/b\u003e \u003cb\u003eUna sola discusión entre dos hablantes\u003c/b\u003e, de varios minutos, y \u003cb\u003eseis preguntas de tres opciones\u003c/b\u003e colgando de ella. Seis marks. Se oye \u003cb\u003edos veces\u003c/b\u003e, como todo el Listening.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué es la parte más difícil del Listening,\u003c/b\u003e y no es por el vocabulario: es por la \u003cb\u003eduración\u003c/b\u003e. Tres minutos con seis preguntas repartidas exigen saber \u003cb\u003edónde estás\u003c/b\u003e. Nadie suspende esta parte por no conocer una palabra; se suspende por perder el hilo en el minuto dos y no volver a engancharlo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué te preguntan aquí y en ninguna otra parte:\u003c/b\u003e idea global · el \u003cb\u003eejemplo\u003c/b\u003e con el que alguien apoya lo que dice · \u003cb\u003ehecho frente a opinión\u003c/b\u003e · el \u003cb\u003econtraste\u003c/b\u003e (dónde se gira el argumento) · \u003cb\u003ecausa y efecto\u003c/b\u003e · y la \u003cb\u003eactitud\u003c/b\u003e de quien habla.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos cuatro gestos que lo resuelven:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eLee las seis preguntas antes del play.\u003c/b\u003e Van \u003cb\u003een el orden del audio\u003c/b\u003e, así que son un índice: te dicen por dónde vas.\u003cbr/\u003e2. \u003cb\u003eSubraya la palabra clave de cada pregunta\u003c/b\u003e y ten la mano en el cuaderno. En el examen se puede escribir mientras suena.\u003cbr/\u003e3. \u003cb\u003ePrimera escucha, el mapa. Segunda escucha, el dato.\u003c/b\u003e Si en la primera pasada te pierdes una, márcala y \u003cb\u003esigue\u003c/b\u003e: quedarte peleando con la tres te cuesta la cuatro y la cinco.\u003cbr/\u003e4. \u003cb\u003eLa última pregunta se contesta con la última frase.\u003c/b\u003e Casi siempre. Y casi siempre es de actitud.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una regla de oído, no de gramática:\u003c/b\u003e en una discusión, lo que decide un ítem suele ir detrás de \u003ci\u003eto be fair\u003c/i\u003e, \u003ci\u003ehaving said that\u003c/i\u003e, \u003ci\u003eactually\u003c/i\u003e o \u003ci\u003emind you\u003c/i\u003e. Son las bisagras del argumento — y las tienes todas en este módulo."])</script><script>self.__next_f.push([1,"19:T6cd,"])</script><script>self.__next_f.push([1,"So, the parking permits. Are you for or against?|I'm for. But not for the reason everybody thinks.|Go on.|Everybody talks about the commuters. Park at eight, get the train, come back at seven. And yes, that happens. But if you actually stand there and count, which I did, twice, in March, it's about eleven cars.|Eleven. Out of how many?|About ninety spaces on the three streets. So eleven is real and eleven is not the problem.|Then what is?|Deliveries. There are four small businesses on the corner now and the vans sit there all day because there is nowhere else for them to go. And I'm not blaming them. If I ran a business with no yard, I would park on the street too.|So a permit scheme wouldn't touch that.|It would, actually, because a permit scheme brings a loading bay with it. That's the bit nobody has read. The consultation document has a map on page nine and there is a bay marked outside the bakery.|Page nine.|Page nine of eleven. Two hundred people have signed a petition against a scheme they have never seen the map of.|To be fair, the letter that went round was terrible.|The letter was terrible. Having said that, the map is online and it took me four minutes to find it.|And the sixty pounds a year?|That is the real argument, and it's the one people should be having. Sixty pounds is nothing to me and it is a week's shopping for the woman at number twelve. I am not going to pretend it isn't.|So what would you do?|I'd put the scheme in, and I'd ask for the first permit per household to be free. Not the second. One free, and the second one at full price.|And would the council go for that?|They did in Ballymena. Whether they would do it here depends entirely on whether we ask together or in forty separate emails."])</script><script>self.__next_f.push([1,"1a:T6cd,"])</script><script>self.__next_f.push([1,"So, the parking permits. Are you for or against?|I'm for. But not for the reason everybody thinks.|Go on.|Everybody talks about the commuters. Park at eight, get the train, come back at seven. And yes, that happens. But if you actually stand there and count, which I did, twice, in March, it's about eleven cars.|Eleven. Out of how many?|About ninety spaces on the three streets. So eleven is real and eleven is not the problem.|Then what is?|Deliveries. There are four small businesses on the corner now and the vans sit there all day because there is nowhere else for them to go. And I'm not blaming them. If I ran a business with no yard, I would park on the street too.|So a permit scheme wouldn't touch that.|It would, actually, because a permit scheme brings a loading bay with it. That's the bit nobody has read. The consultation document has a map on page nine and there is a bay marked outside the bakery.|Page nine.|Page nine of eleven. Two hundred people have signed a petition against a scheme they have never seen the map econd. One free, and the second one at full price.|And would the council go for that?|They did in Ballymena. Whether they would do it here depends entirely on whether we ask together or in forty separate emails."])</script><script>self.__next_f.push([1,"1e:T6cd,"])</script><script>self.__next_f.push([1,"So, the parking permits. Are you for or against?|I'm for. But not for the reason everybody thinks.|Go on.|Everybody talks about the commuters. Park at eight, get the train, come back at seven. And yes, that happens. But if you actually stand there and count, which I did, twice, in March, it's about eleven cars.|Eleven. Out of how many?|About ninety spaces on the three streets. So eleven is real and eleven is not the problem.|Then what is?|Deliveries. There are four small businesses on the corner now and the vans sit there all day because there is nowhere else for them to go. And I'm not blaming them. If I ran a business with no yard, I would park on the street too.|So a permit scheme wouldn't touch that.|It would, actually, because a permit scheme brings a loading bay with it. That's the bit nobody has read. The consultation document has a map on page nine and there is a bay marked outside the bakery.|Page nine.|Page nine of eleven. Two hundred people have signed a petition against a scheme they have never seen the map of.|To be fair, the letter that went round was terrible.|The letter was terrible. Having said that, the map is online and it took me four minutes to find it.|And the sixty pounds a year?|That is the real argument, and it's the one people should be having. Sixty pounds is nothing to me and it is a week's shopping for the woman at number twelve. I am not going to pretend it isn't.|So what would you do?|I'd put the scheme in, and I'd ask for the first permit per household to be free. Not the second. One free, and the second one at full price.|And would the council go for that?|They did in Ballymena. Whether they would do it here depends entirely on whether we ask together or in forty separate emails."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l10\",\"phaseId\":\"enb1m11\",\"title\":\"Exam lab: Listening Part 4 y Spoken Part 3\",\"subtitle\":\"La discusión que hay que ESCUCHAR y la discusión que hay que SOSTENER — las dos partes del examen que van de negociar\",\"minutes\":24,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las tres palabras que gobiernan esta parte\",\"itemIds\":[\"enb1m11attemptatagreement\",\"enb1m11visualprompts\",\"enb1m11takingturns\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 3, y por qué se suspende hablando bien\",\"body\":\"$17\",\"table\":[[\"Lo que se espera\",\"Lo que suena\",\"Lo que NO\"],[\"Proponer\",\"How about…? / What if we…?\",\"In this picture I can see…\"],[\"Reaccionar a lo suyo\",\"That's a good point, but…\",\"soltar tu turno sin mirarle\"],[\"Ceder o contraproponer\",\"What if we tried it for…?\",\"repetir tu propuesta más alto\"],[\"Cerrar\",\"Right, so we've agreed to…\",\"quedarse callado al final\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l10e1\",\"type\":\"mc\",\"prompt\":\"La consigna, antes de empezar\",\"question\":\"¿Qué se espera exactamente en el Spoken Part 3 del B1?\",\"options\":[\"Discutir a partir de unas imágenes e intentar llegar a un acuerdo\",\"Describir las imágenes con todo el detalle posible\",\"Dar tu opinión sobre el tema durante tres minutos seguidos\"],\"answer\":0,\"whyWrong\":[null,\"Describir era la tarea en A1 y A2. En B1 las imágenes son solo el punto de partida.\",\"Es una conversación con turnos: hablar tú solo tres minutos penaliza tanto como no hablar.\"],\"itemIds\":[\"enb1m11attemptatagreement\",\"enb1m11visualprompts\"],\"tip\":\"La frase oficial es «an attempt at agreement… is expected». Fíjate en «attempt»: no te exigen acordar de verdad, te exigen INTENTARLO en voz alta. Eso es una frase, y se puede llevar aprendida.\"},{\"id\":\"enb1m11l10e2\",\"type\":\"match\",\"prompt\":\"Empareja cada movimiento con su fórmula\",\"pairs\":[{\"target\":\"How about putting it on the noticeboard?\",\"source\":\"1. Proponer\"},{\"target\":\"I'm not so sure about that, because nobody reads it.\",\"source\":\"2. Objetar, con razón\"},{\"target\":\"That's a good point. What if we tried both?\",\"source\":\"3. Contraproponer\"},{\"target\":\"Right, so we've agreed to try both.\",\"source\":\"4. Cerrar\"}],\"itemIds\":[\"enb1m11howabout\",\"enb1m11natnotsosure\",\"enb1m11whatifwe\",\"enb1m11soweveagreed\"],\"tip\":\"Cuatro movimientos y cuatro fórmulas. No necesitas más para hacer un Part 3 completo: lo que cambia de un examen a otro es el tema, no el esqueleto.\"},{\"id\":\"enb1m11l10e3\",\"type\":\"bucket\",\"prompt\":\"¿Esto es del examen de A2 o del de B1?\",\"categories\":[\"A2: describir\",\"B1: negociar\"],\"items\":[{\"text\":\"In this picture I can see three people in a park.\",\"bucket\":0},{\"text\":\"How about starting with the noticeboard?\",\"bucket\":1},{\"text\":\"The man on the left is wearing a blue coat.\",\"bucket\":0},{\"text\":\"I'm not so sure about that, because nobody reads it.\",\"bucket\":1},{\"text\":\"In the second photo there is a bus stop.\",\"bucket\":0},{\"text\":\"Right, so we've agreed to try the group chat first.\",\"bucket\":1}],\"itemIds\":[\"enb1m11visualprompts\",\"enb1m11howabout\",\"enb1m11natnotsosure\",\"enb1m11soweveagreed\"],\"tip\":\"Todas las de la izquierda son inglés correcto y todas te dejarían el Part 3 a medias. Ese es el aviso entero de esta lección: aquí no se suspende por gramática, se suspende por hacer la tarea que no era.\"},{\"id\":\"enb1m11l10e4\",\"type\":\"order\",\"prompt\":\"Ordena un Part 3 entero: el examinador empieza y tú contestas\",\"sentences\":[\"So, let's decide how the association should tell people about the meetings. I'll start: I think a noticeboard is enough.\",\"I see what you mean, but I'm not so sure a noticeboard is enough, because half the street never walks past it.\",\"That's a good point. What would you suggest instead?\",\"How about a group chat as well, and the noticeboard for the people who aren't on their phones?\",\"Yes, I'd be happy with that.\",\"Right, so we've agreed to use both.\"],\"translation\":\"Bien, vamos a decidir cómo debería avisar la asociación de las reuniones. Empiezo yo: creo que con un tablón de anuncios basta. — Entiendo lo que dices, pero no lo tengo tan claro, porque media calle no pasa por delante. — Ahí tienes razón. ¿Qué propondrías tú? — ¿Y si ponemos también un grupo de mensajes, y el tablón para quien no use el móvil? — Sí, me parece bien. — Vale, entonces quedamos en usar los dos.\",\"itemIds\":[\"enb1m11iseewhatyoumean\",\"enb1m11natnotsosure\",\"enb1m11thatsagoodpoint\",\"enb1m11howabout\",\"enb1m11soweveagreed\"],\"tip\":\"Seis turnos, cincuenta segundos, y la tarea está hecha entera. Fíjate en que el candidato nunca describe nada: pregunta, objeta con motivo, propone y cierra.\"},{\"id\":\"enb1m11l10e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el Part 3 que le ha tocado a Valeria\",\"text\":\"«___ we started with the noticeboard?» «___ about that, because nobody reads it.» «___ point. Let's do both, then.» «___, so we've agreed to try the group chat first.»\",\"answers\":[\"What if\",\"I'm not so sure\",\"That's a good\",\"Right\"],\"bank\":[\"What if\",\"I'm not so sure\",\"That's a good\",\"Right\",\"In order to\",\"To be fair\",\"Having said that\"],\"translation\":\"«¿Y si empezamos por el tablón?» «No lo tengo yo tan claro, porque no lo lee nadie.» «Ahí tienes razón. Hagamos las dos cosas, entonces.» «Vale, entonces quedamos en probar primero el grupo de mensajes.»\",\"itemIds\":[\"enb1m11whatifwe\",\"enb1m11natnotsosure\",\"enb1m11thatsagoodpoint\",\"enb1m11soweveagreed\"],\"tip\":\"Los cuatro huecos son los cuatro movimientos. Si te los sabes de memoria, el Part 3 deja de ser una prueba de vocabulario y pasa a ser una de orden — que es mucho más fácil de preparar.\"},{\"id\":\"enb1m11l10e6\",\"type\":\"mc\",\"prompt\":\"La trampa del reloj\",\"question\":\"Quedan cuarenta segundos y no os habéis puesto de acuerdo. ¿Qué haces?\",\"options\":[\"Cierro con lo que haya: «Right, so we've agreed to try yours first, and see.»\",\"Sigo defendiendo mi propuesta hasta que se acabe el tiempo\",\"Me callo y dejo que el examinador cierre\"],\"answer\":0,\"whyWrong\":[null,\"El examen no puntúa quién tenía razón: puntúa que se intente cerrar. Ganar la discusión y no cerrarla es perder la tarea.\",\"El movimiento de cierre lo tienes que dar tú. Si lo da el examinador, no cuenta como tuyo.\"],\"itemIds\":[\"enb1m11soweveagreed\",\"enb1m11attemptatagreement\"],\"tip\":\"Ceder es un movimiento válido y rapidísimo: «You're right, let's do it your way» y a cerrar. Deja tiempo para la frase que de verdad puntúa y no te cuesta ni un punto.\"},{\"id\":\"enb1m11l10e7\",\"type\":\"build\",\"prompt\":\"Construye el cierre\",\"target\":\"Right so we've agreed to use both\",\"translation\":\"Vale, entonces quedamos en usar los dos\",\"distractors\":[\"using\",\"for\"],\"itemIds\":[\"enb1m11soweveagreed\",\"enb1m11toinfgroup\"],\"tip\":\"«Agree» pide «to», como en la lección 1. Y esta frase, de cinco segundos, es la que separa un Part 3 acabado de uno a medias.\"},{\"id\":\"enb1m11l10e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tu partitura de los cuatro movimientos, seguida y sin parar\",\"text\":\"How about starting with the noticeboard? I'm not so sure about that, because nobody reads it. That's a good point. What if we tried both? Right, so we've agreed to try both.\",\"phonetic\":\"jáu a-báut STÁA-ting uid de NÓUTS-bood · aim not sóu shóo a-báut dat, bi-KÓS̬ NÓU-ba-di ríids it · dats a gud póint · uot if ui tráid buz · ráit, sóu uiv a-GRÍID tu trái buz\",\"translation\":\"¿Y si empezamos por el tablón? No lo tengo yo tan claro, porque no lo lee nadie. Ahí tienes razón. ¿Y si probamos las dos cosas? Vale, entonces quedamos en probar las dos.\",\"itemIds\":[\"enb1m11howabout\",\"enb1m11natnotsosure\",\"enb1m11thatsagoodpoint\",\"enb1m11whatifwe\",\"enb1m11soweveagreed\"],\"tip\":\"Dila entera tres veces hasta que salga sin pensar. No estás memorizando un examen: estás automatizando un esqueleto que después rellenas con el tema que te toque.\"},{\"id\":\"enb1m11l10e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar las palabras prohibidas\",\"source\":\"Right, so we've agreed to try it.\",\"forbid\":[\"agreed\",\"right\"],\"answers\":[\"That's settled, then: we'll try it\",\"So we're going to try it, then\",\"Shall we say we'll try it, then?\"],\"translation\":\"Vale, entonces quedamos en probarlo.\",\"itemIds\":[\"enb1m11soweveagreed\"],\"tip\":\"Tres cierres distintos, por si el interlocutor ya ha usado el tuyo. «That's settled, then» es el más británico de los tres y el que más suena a que la conversación ha terminado bien.\"},{\"id\":\"enb1m11l10e10\",\"type\":\"transform\",\"prompt\":\"Del A2 al B1, en una frase\",\"source\":\"In this picture I can see a noticeboard.\",\"instruction\":\"Conviértelo en un movimiento de negociación con «How about…?»\",\"answers\":[\"How about using the noticeboard?\",\"How about using the noticeboard\",\"How about putting it on the noticeboard?\"],\"translation\":\"¿Y si usamos el tablón de anuncios?\",\"hints\":[\"Deja de describir y propón\",\"How about ... the noticeboard?\"],\"itemIds\":[\"enb1m11howabout\",\"enb1m11visualprompts\"],\"tip\":\"Es literalmente el salto de nivel: la misma imagen deja de ser algo que se describe y pasa a ser algo que se propone. Si haces ese cambio en la primera frase, el resto de la parte se coloca solo.\"},{\"id\":\"enb1m11l10e11\",\"type\":\"audiomc\",\"prompt\":\"CANDIDATO A. Escucha el turno y decide qué le falta. Dos escuchas.\",\"notepad\":true,\"audio\":\"So, in the first picture there is a noticeboard outside a community centre, and I can see two women reading it. In the second picture there is a mobile phone with a group chat on the screen. I think the noticeboard is very traditional and the phone is more modern. In my opinion young people prefer the phone and old people prefer the noticeboard. That is my opinion about the pictures.\",\"question\":\"¿Qué le falta a este turno para ser un Part 3 de B1?\",\"options\":[\"No propone nada ni intenta decidir: solo describe y opina\",\"No usa vocabulario suficiente\",\"Habla demasiado poco tiempo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El vocabulario está bien y la gramática también. No es ahí donde pierde.\",\"El tiempo tampoco es el problema: llena su turno de sobra.\"],\"itemIds\":[\"enb1m11visualprompts\",\"enb1m11attemptatagreement\",\"enb1m11howabout\"],\"tip\":\"Este candidato haría un buen A2. Le sobra descripción y le falta lo único que se pide: proponer, reaccionar y cerrar. Escúchalo otra vez y cuenta cuántas veces se dirige al interlocutor — cero.\"},{\"id\":\"enb1m11l10e12\",\"type\":\"audiomc\",\"prompt\":\"CANDIDATA B. Mismo tema, otro turno. Dos escuchas.\",\"notepad\":true,\"audio\":\"Right, so we have to decide how to tell people. How about the noticeboard to start with? It's cheap and it's already there.|Yes, but not everybody walks past it.|That's a good point. I'm not so sure a group chat would reach everybody either, though, because my neighbour doesn't have a smartphone.|True.|So what if we did both, and put a note through the door for the people who aren't on either? Three things, but only the first week.|That could work.|Right, so we've agreed: noticeboard, group chat, and notes through the door the first week.\",\"question\":\"¿Qué hace bien esta candidata que no hacía el candidato A?\",\"options\":[\"Propone, reacciona a lo que dice el otro y cierra con un acuerdo\",\"Usa palabras más difíciles\",\"Describe las imágenes con más detalle\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El vocabulario es más sencillo que el del candidato A, no más difícil. Lo que cambia es lo que hace con él.\",\"No describe las imágenes en ningún momento: las usa para decidir.\"],\"itemIds\":[\"enb1m11howabout\",\"enb1m11thatsagoodpoint\",\"enb1m11whatifwe\",\"enb1m11soweveagreed\",\"enb1m11takingturns\"],\"tip\":\"Cuenta sus movimientos: propone, escucha, reconoce, objeta con motivo, contrapropone y cierra repitiendo lo acordado. Seis movimientos con vocabulario de A2. Eso es un Part 3 de B1 hecho entero.\"},{\"id\":\"enb1m11l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"Va de turnarse, no de ganar. Vale, entonces quedamos en probarlo.\",\"answers\":[\"It's about taking turns, not winning. Right, so we've agreed to try it\",\"It's about taking turns, not winning. Right, so we've agreed to try it.\",\"It's about taking turns, not winning, Right, so we've agreed to try it\"],\"hints\":[\"La primera mitad empieza por «It's about…»\",\"It's about taking turns, not winning. Right, so ...\"],\"itemIds\":[\"enb1m11takingturns\",\"enb1m11soweveagreed\",\"enlistencarefully\"],\"tip\":\"Once laboratorios hechos: el escrito entero y tres de las cuatro partes del oral. Para el examen final queda uno solo, el Spoken Part 4, y cae en el módulo 12 — pero el Listening Part 4 lo tienes justo aquí abajo, al final de esta misma lección, y va exactamente de lo mismo que acabas de practicar: una discusión entre dos personas.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Y ahora el que faltaba: el Listening Part 4\",\"body\":\"$18\",\"table\":[[\"Tipo de ítem\",\"Cómo suena en el audio\",\"Dónde suele caer\"],[\"Idea global\",\"«I'm for, but not for the reason everybody thinks»\",\"primeros 20 segundos\"],[\"Ejemplo\",\"«if you actually stand there and count…»\",\"primer tercio\"],[\"Hecho vs opinión\",\"«two hundred people have signed… a scheme they've never seen»\",\"medio\"],[\"Concesión\",\"«having said that…», «I'm not going to pretend it isn't»\",\"medio y final\"],[\"Actitud\",\"la última frase, y no repite: remata\",\"final\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l10e14\",\"type\":\"audiomc\",\"prompt\":\"LISTENING PART 4 — el formato exacto: una discusión de tres minutos entre dos personas y SEIS preguntas colgando de ella. Léelas todas antes del play, apunta en el cuaderno y no te pares en la que se te escape. Dos escuchas.\",\"audio\":\"$19\",\"question\":\"¿Cuál es su postura sobre los permisos de aparcamiento?\",\"options\":[\"A favor, pero no por el motivo que da todo el mundo\",\"En contra, aunque entiende a los vecinos\",\"No se moja: dice que depende del precio\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo dice en la segunda frase del audio: «I'm for». Lo que niega es el motivo, no la postura.\",\"Se moja enseguida y además propone una solución concreta al final.\"],\"itemIds\":[\"enb1m11asfarasimconcerned\",\"enb1m11theregulations\"],\"tip\":\"Ítem de idea global, y siempre es el primero. La respuesta cae en los primeros veinte segundos y luego el audio se dedica a matizarla: no la cambies por lo que oigas después.\"},{\"id\":\"enb1m11l10e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: el ejemplo con números.\",\"audio\":\"$1a\",\"question\":\"¿Cuántos coches de gente que va a coger el tren contó?\",\"options\":[\"Once, de unas noventa plazas\",\"Noventa, de unas once calles\",\"Doscientos, en tres calles\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Noventa son las plazas que hay en total; once, las calles no, los coches.\",\"Doscientas son las firmas de la petición. El audio pone las tres cifras a propósito.\"],\"itemIds\":[\"enb1m11apetition\"],\"tip\":\"En el Part 4 hay siempre un ítem de EJEMPLO: alguien apoya una afirmación con un dato. Apunta la cifra Y lo que cuenta, porque el audio suele dar tres números y solo uno responde.\"},{\"id\":\"enb1m11l10e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: causa y efecto.\",\"audio\":\"$1b\",\"question\":\"Según él, ¿cuál es el problema de verdad?\",\"options\":[\"Las furgonetas de los cuatro negocios de la esquina, que no tienen dónde meterse\",\"La gente que aparca para coger el tren\",\"Que el ayuntamiento no ha hecho la consulta\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo desmonta él mismo con su recuento: «eleven is real and eleven is not the problem».\",\"La consulta está hecha: hay un documento de once páginas y un plano en la nueve.\"],\"itemIds\":[\"enb1m11flytipping\",\"enb1m11theentry\",\"enb1m11itisntfairthat\"],\"tip\":\"«And I'm not blaming them» es una concesión, y las concesiones en el examen marcan dónde está el argumento fino. Quien concede algo casi nunca es quien está diciendo la tontería.\"},{\"id\":\"enb1m11l10e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: hecho contra opinión.\",\"audio\":\"$1c\",\"question\":\"¿Qué dice de la petición que han firmado doscientas personas?\",\"options\":[\"Que han firmado en contra de un plan cuyo plano no han visto\",\"Que es la única manera de que el ayuntamiento escuche\",\"Que la ha firmado él también\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo que dice que funciona es pedirlo juntos, y lo dice al final, sin mencionar la petición.\",\"No dice que la haya firmado. Lo que dice es que se ha leído el documento entero, que es lo contrario.\"],\"itemIds\":[\"enb1m11apetition\",\"enb1m11tobefair\"],\"tip\":\"Aquí hay un hecho —doscientas firmas— y una opinión sobre ese hecho, dichas en la misma frase. Separarlas es literalmente lo que el handbook llama «fact vs opinion», y es un ítem fijo de esta parte.\"},{\"id\":\"enb1m11l10e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5: la concesión. Escucha lo que admite en contra de su propia postura.\",\"audio\":\"$1d\",\"question\":\"¿Qué admite sobre las sesenta libras al año?\",\"options\":[\"Que para él no son nada y para su vecina del doce son la compra de una semana\",\"Que son demasiado caras para todo el mundo\",\"Que se pueden pagar en dos plazos\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Para él expresamente no lo son: «sixty pounds is nothing to me».\",\"De plazos no dice nada. Lo que propone es que el primer permiso de cada casa sea gratis.\"],\"itemIds\":[\"enb1m11havingsaidthat\",\"enb1m11unfairon\",\"enb1m11ipartlyagree\"],\"tip\":\"«I'm not going to pretend it isn't» — reconocer el punto flojo de tu propia postura no es perder la discusión: en la rúbrica del oral es lo que sube Task Fulfilment. Y en el Listening es un ítem seguro.\"},{\"id\":\"enb1m11l10e19\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 6, la última y la de actitud. La respuesta es la última frase del audio.\",\"audio\":\"$1e\",\"question\":\"¿De qué depende, según él, que el ayuntamiento acepte su propuesta?\",\"options\":[\"De que los vecinos lo pidan juntos y no en cuarenta correos por separado\",\"De que se junten más de doscientas firmas\",\"De que el precio baje de sesenta libras\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La petición es justo el ejemplo de lo que él critica: mucha firma y ningún plano.\",\"El precio no es lo que discute al final: lo que propone es un permiso gratis por vivienda, no bajar la tarifa.\"],\"itemIds\":[\"enb1m11itsuptothecouncil\",\"enb1m11theonlyfairthing\",\"enb1m11acompromise\"],\"tip\":\"La última pregunta de un Part 4 se contesta casi siempre con la última frase, y la última frase casi nunca repite lo dicho: lo remata. Aguanta despierto hasta el final del audio, que es exactamente lo que esta parte está midiendo.\"}]}],\"resources\":[{\"label\":\"LanguageCert — Qualification Handbook (Speaking)\",\"url\":\"https://www.languagecert.org/-/media/languagecert/product-information/preparation-material/english/languagecert-esol/qualification-handbook-esol-speaking.ashx\",\"note\":\"Busca la tabla del B1 y lee solo la fila del Part 3, que son dos líneas. Fíjate en la palabra «expected»: lo que el examen espera no es que acertéis, es que lo intentéis en voz alta.\"}]}}]\n"])</sc
