b2m4invertedsaid\",\"enb2m4councilsays\",\"enb2m4headlineblamed\",\"enb2m4abylines\",\"enb2m4anarticlepiece\",\"enb2m4theeditor\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Un artículo no es una carta, y el verbo de decir se mueve\",\"body\":\"El género de este módulo es el \u003cb\u003eartículo\u003c/b\u003e. LanguageCert no lo examina como Writing 2 (allí pide carta, relato o descripción), pero el temario lo nombra y Cambridge B2 First sí lo pide. Se enseña, y se le dice al alumno por qué.\u003cbr/\u003e\u003cbr/\u003eTres maneras de citar, B2:\u003cbr/\u003e1. \u003cb\u003eAccording to the report, …\u003c/b\u003e — la más segura. No es according to the advert del B1: aquí la fuente es un informe o un periódico.\u003cbr/\u003e2. \u003cb\u003eVerbo de decir en medio:\u003c/b\u003e \u003ci\u003eThe shop will close in June, the paper said.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eSujeto invertido,\u003c/b\u003e más escrito: \u003ci\u003e«Nobody was consulted,» said a neighbour.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY el presente del verbo de decir para una fuente escrita que sigue valiendo: \u003ci\u003eThe council [[says|dice]] the leak has been fixed.\u003c/i\u003e No said: el papel sigue sobre la mesa.\u003cbr/\u003e\u003cbr/\u003eEl titular británico vive en pasiva sin agente: \u003ci\u003eLEAK BLAMED ON OLD PIPES\u003c/i\u003e. El quién se ha comido a propósito. Who says so? El titular, no.\",\"table\":[[\"Sitio\",\"Molde\",\"Registro\"],[\"apertura\",\"According to the report, …\",\"neutro, de examen\"],[\"medio\",\"…, the paper said.\",\"artículo\"],[\"cierre de cita\",\"«…,» said a neighbour.\",\"más escrito\"],[\"titular\",\"LEAK BLAMED ON OLD PIPES\",\"prensa, sin agente\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l4e1\",\"type\":\"match\",\"prompt\":\"Empareja la cita\",\"pairs\":[{\"target\":\"According to the report, the shop will close.\",\"source\":\"según el informe\"},{\"target\":\"The shop will close in June, the paper said.\",\"source\":\"verbo de decir en medio\"},{\"target\":\"«Nobody was consulted,» said a neighbour.\",\"source\":\"sujeto invertido\"},{\"target\":\"The council says the leak has been fixed.\",\"source\":\"presente: la fuente sigue valiendo\"}],\"itemIds\":[\"enb2m4accordingtothereport\",\"enb2m4midposition\",\"enb2m4invertedsaid\",\"enb2m4councilsays\"]},{\"id\":\"enb2m4l4e2\",\"type\":\"transform\",\"prompt\":\"Pon el verbo de decir en medio\",\"source\":\"The paper said the shop will close in June.\",\"instruction\":\"The shop will close in June, the paper…\",\"answers\":[\"The shop will close in June, the paper said\",\"The shop will close in June, the paper said.\"],\"itemIds\":[\"enb2m4midposition\"]},{\"id\":\"enb2m4l4e3\",\"type\":\"transform\",\"prompt\":\"Invierte el sujeto del verbo de decir\",\"source\":\"A neighbour said, «Nobody was consulted.»\",\"instruction\":\"«Nobody was consulted,» said…\",\"answers\":[\"«Nobody was consulted,» said a neighbour\",\"«Nobody was consulted,» said a neighbour.\",\"\\\"Nobody was consulted,\\\" said a neighbour.\"],\"itemIds\":[\"enb2m4invertedsaid\"]},{\"id\":\"enb2m4l4e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The council said the leak has been fixed.\",\"answers\":[\"The council says the leak has been fixed.\"],\"why\":\"Fuente escrita que sigue sobre la mesa: presente (says), no said. Said la manda al pasado y parece que el ayuntamiento ya no lo sostiene. El B2 cita el papel en presente a propósito.\",\"itemIds\":[\"enb2m4councilsays\"]},{\"id\":\"enb2m4l4e5\",\"type\":\"write\",\"prompt\":\"Un artículo corto, 100-150. Lector: la revista del centro comunitario. Tres puntos, registro directo de artículo (no carta: sin Dear, sin Yours).\",\"scenario\":\"La revista del centro pide un artículo breve sobre el rumor de la tienda de Mr Patel. No es una carta. No es una queja. Es un artículo: titular interno, hechos, una cita, un cierre que no se moja del todo. 100-150 palabras.\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review — call for pieces\",\"text\":\"150 words on a local rumour and how it travelled. Include: (1) what is being said; (2) at least one named source or a careful passive; (3) what has not been confirmed.\"},\"bullets\":[\"Di qué se está diciendo (la tienda, el bus, la fuga: uno basta).\",\"Cita una fuente con nombre o una pasiva cuidadosa.\",\"Di qué no se ha confirmado.\"],\"checks\":[{\"re\":\"(shop|patel|bus|leak|close|cut)\",\"label\":\"Nombras el rumor\"},{\"re\":\"(according to|it is (reported|thought|believed|said)|said a|the paper said|council says)\",\"label\":\"Citas una fuente o usas una pasiva de reporte\"},{\"re\":\"(not (been )?confirm|nobody has|no one has|should be noted|denied)\",\"label\":\"Dices qué no está confirmado\"}],\"frame\":[\"Apertura: According to… / It is reported that…\",\"Hecho + cita: …, the paper said. / «…,» said a neighbour.\",\"Cierre: It should be noted that nobody has confirmed it.\",\"Sin Dear / Yours — esto no es una carta\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"according to\",\"it should be noted\",\"although\",\"on balance\",\"as mentioned\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":150,\"model\":\"According to the neighbourhood group, Mr Patel's shop is closing. It is widely believed on the chat this week, and a front-page story has already been drafted in people's heads. The paper is more careful than the group. The shop will close in June, one post claimed; the council says the leak has been fixed and that nothing else has been decided yet. It should be noted that nobody has confirmed a sale, and Patel has issued a denial in writing. On balance, a rumour is travelling faster than a source, and the passive is doing most of the work on both sides.\",\"itemIds\":[\"enb2m4accordingtothereport\",\"enb2m4itiswidelybelieved\",\"enb2m4councilsays\",\"enb2m4itshouldbenoted\",\"enb2m4onbalance\",\"enb2m4anarticlepiece\"]},{\"id\":\"enb2m4l4e6\",\"type\":\"mc\",\"prompt\":\"El titular sin agente\",\"question\":\"«LEAK BLAMED ON OLD PIPES». ¿Quién culpa?\",\"options\":[\"No se dice: la pasiva se ha comido al agente a propósito.\",\"Mr Patel, porque es su tienda.\",\"El grupo de vecinos, porque el titular lo firma.\"],\"answer\":0,\"whyWrong\":[null,\"El titular no lo nombra. Inventar el agente es lo que hace el chat.\",\"Un titular de periódico no es un chat, y este no lleva byline de grupo.\"],\"itemIds\":[\"enb2m4headlineblamed\",\"enb2m4unstatedagent\"]},{\"id\":\"enb2m4l4e7\",\"type\":\"gapbank\",\"prompt\":\"Completa las citas del artículo\",\"text\":\"___ to the report, the shop will close. The shop will close in June, the paper ___. The council ___ the leak has been fixed. It should be ___ that nobody has confirmed a sale.\",\"answers\":[\"According\",\"said\",\"says\",\"noted\"],\"bank\":[\"According\",\"said\",\"says\",\"noted\",\"told\",\"because\"],\"itemIds\":[\"enb2m4accordingtothereport\",\"enb2m4midposition\",\"enb2m4invertedsaid\",\"enb2m4councilsays\"]},{\"id\":\"enb2m4l4e8\",\"type\":\"cloze\",\"prompt\":\"La firma\",\"text\":\"The article had no ___ : nobody's name sat under the headline.\",\"answers\":[\"byline\"],\"itemIds\":[\"enb2m4abylines\"]},{\"id\":\"enb2m4l4e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Según el informe, la tienda va a cerrar.\",\"answers\":[\"According to the report, the shop will close.\",\"According to the report the shop will close.\"],\"itemIds\":[\"enb2m4accordingtothereport\"]},{\"id\":\"enb2m4l4e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El ayuntamiento dice que la fuga está arreglada.\",\"answers\":[\"The council says the leak has been fixed.\",\"The council says the leak has been fixed\"],\"itemIds\":[\"enb2m4councilsays\"]},{\"id\":\"enb2m4l4e11\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"According to the report, the shop will close.\",\"translation\":\"Según el informe, la tienda va a cerrar.\",\"itemIds\":[\"enb2m4accordingtothereport\"]},{\"id\":\"enb2m4l4e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Nora lee el titular en voz alta. Pregunta antes del play. Dos escuchas.\",\"audio\":\"«LEAK BLAMED ON OLD PIPES.» Blamed by who, though? There's a byline — a young reporter, not the group. And lower down the council says the leak has been fixed. That's two passives and two jobs. The headline convinces. The quote informs. You have to read both.\",\"question\":\"Según Nora, ¿qué hace el titular y qué hace la cita del ayuntamiento?\",\"options\":[\"El titular convence; la cita informa\",\"Los dos informan, porque hay byline\",\"Los dos convencen, porque hay pasiva\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El byline nombra al periodista, no convierte el titular en información neutra.\",\"La pasiva no decide sola: decide para qué se usa. Eso es el módulo.\"],\"itemIds\":[\"enb2m4headlineblamed\",\"enb2m4abylines\",\"enb2m4councilsays\",\"enb2m4informorconvince\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"conten
