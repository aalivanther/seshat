 — [[back to work|de vuelta al trabajo]]!\u003cbr/\u003e5. After work, he sometimes [[watches TV|ve la tele]] and studies Spanish. Yes — Ben studies Spanish!\u003cbr/\u003e6. Then he usually goes to bed at eleven. [[But|pero]] on Friday? On Friday Ben never goes to bed at eleven!\u003cbr/\u003e7. On Saturday and Sunday he doesn't work. He gets up at half past ten — the weekend!\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: coffee = café · lunch = comida del mediodía · watches TV = ve la tele (watch → watches con he) · but = pero\u003c/i\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m4l7e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (línea 1)\",\"question\":\"¿A qué hora se levanta Ben cada día?\",\"options\":[\"A las siete y cuarto\",\"A las siete y media\",\"A las ocho menos cuarto\"],\"answer\":0,\"whyWrong\":[null,\"half past seven sería 7:30 — Ben se levanta at quarter past seven (7:15)\",\"quarter to eight sería 7:45 — relee la línea 1\"],\"itemIds\":[\"enquarterpast\",\"enshegetsup\"]},{\"id\":\"ena1m4l7e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (línea 5)\",\"question\":\"¿Qué hace Ben a veces después del trabajo?\",\"options\":[\"Ve la tele y estudia español\",\"Va al café de Sam\",\"Se acuesta a las once\"],\"answer\":0,\"whyWrong\":[null,\"El café de Sam es por la mañana — y no a veces: always\",\"Eso es usually, y los viernes ¡nunca!\"],\"itemIds\":[\"enafterwork\",\"ensometimes\"]},{\"id\":\"ena1m4l7e3\",\"type\":\"order\",\"prompt\":\"Ordena el día de Ben\",\"sentences\":[\"Ben gets up at quarter past seven.\",\"He has breakfast at eight o'clock.\",\"He goes to work at half past eight.\",\"He has lunch at one o'clock.\",\"After work, he watches TV and studies Spanish.\",\"Then he goes to bed at eleven.\"],\"translation\":\"Ben se levanta a las 7:15. Desayuna a las 8:00. Va al trabajo a las 8:30. Come a la 1:00. Después del trabajo ve la tele y estudia español. Luego se acuesta a las once.\",\"hints\":[\"Las horas llevan el orden solas\",\"7:15 → 8:00 → 8:30 → 1:00 → after work → then\"],\"itemIds\":[\"enshegetsup\",\"enhavebreakfast\",\"engoes\",\"enafterwork\",\"enthen\",\"engotobed\"],\"tip\":\"then y after work son los conectores que convierten frases sueltas en un relato — como pide el oral del examen.\"},{\"id\":\"ena1m4l7e4\",\"type\":\"shadow\",\"prompt\":\"Sombrea la línea 3: pégate al audio\",\"text\":\"He always has a coffee from Sam's café.\",\"phonetic\":\"ji ÓL-ueis̬ jas̬ a KÓ-fi from sams̬ ka-FÉI\",\"translation\":\"Siempre se toma un café del café de Sam.\",\"reps\":2,\"itemIds\":[\"enalways\"],\"tip\":\"Primera pasada lenta, segunda a velocidad real: deja que tu boca copie el ritmo, no letra a letra.\"},{\"id\":\"ena1m4l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa la línea 1 — la -s de la rutina\",\"text\":\"Every day Ben ___ up at quarter past seven. (get)\",\"answers\":[\"gets\"],\"translation\":\"Cada día Ben se levanta a las siete y cuarto.\",\"hints\":[\"Ben = he\",\"get + s\"],\"itemIds\":[\"enshegetsup\",\"enquarterpast\",\"eneveryday\"]},{\"id\":\"ena1m4l7e6\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Ben sale corriendo\",\"book\":\"I've got to go to work.\",\"real\":\"I gotta go to work.\",\"translation\":\"Me tengo que ir al trabajo.\",\"tip\":\"got to se funde en gotta. Reconócelo al vuelo — para producir, quédate con I have to go.\"},{\"id\":\"ena1m4l7e7\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Viernes por la noche\",\"book\":\"I want to go to bed.\",\"real\":\"I wanna go to bed.\",\"translation\":\"Quiero irme a la cama.\",\"tip\":\"wanna = want to fundido. Se dice muchísimo y no se escribe (jamás en el examen).\"},{\"id\":\"ena1m4l7e8\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Ben se levanta a las siete y cuarto y va al trabajo a las ocho y media.\",\"answers\":[\"Ben gets up at quarter past seven and goes to work at half past eight.\",\"Ben gets up at quarter past seven and goes to work at half past eight\",\"He get
