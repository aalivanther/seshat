003cb\u003eem\u003c/b\u003e Wasser\u003c/i\u003e. El español no tiene nada parecido, así que esta forma \u003cb\u003eno sale nunca por transferencia\u003c/b\u003e: hay que producirla a propósito hasta que salga sola.\u003cbr/\u003e\u003cbr/\u003eExcepción amable: en genitivo masculino/neutro el adjetivo lleva \u003cb\u003e-en\u003c/b\u003e (trotz stark\u003cb\u003een\u003c/b\u003e Regens), porque ahí la -s del sustantivo ya marca.\",\"table\":[[\"\",\"masculino\",\"femenino\",\"neutro\",\"plural\"],[\"Nominativ\",\"guter Kaffee\",\"warme Milch\",\"frisches Brot\",\"freie Zimmer\"],[\"Akkusativ\",\"guten Kaffee\",\"warme Milch\",\"frisches Brot\",\"freie Zimmer\"],[\"Dativ\",\"mit gutem Kaffee\",\"mit warmer Milch\",\"mit frischem Brot\",\"mit freien Zimmern\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l3e1\",\"type\":\"match\",\"prompt\":\"Empareja los tipos de alojamiento\",\"pairs\":[{\"target\":\"die Jugendherberge\",\"source\":\"el albergue juvenil\"},{\"target\":\"die Ferienwohnung\",\"source\":\"el apartamento de vacaciones\"},{\"target\":\"die Übernachtung\",\"source\":\"la noche de alojamiento\"},{\"target\":\"ein freies Zimmer\",\"source\":\"una habitación libre\"}],\"itemIds\":[\"b1m9jugendherberge\",\"b1m9ferienwohnung\",\"b1m9uebernachtung\",\"b1m9freieszimmer\"]},{\"id\":\"b1m9l3e2\",\"type\":\"mc\",\"prompt\":\"Sin artículo, ¿quién marca el género?\",\"question\":\"Zum Frühstück gibt es ___ Brot.\",\"options\":[\"frisches\",\"frische\",\"frischen\"],\"answer\":0,\"whyWrong\":[null,\"-e sería femenino: frische Milch\",\"-en sería masculino acusativo: frischen Kaffee\"],\"itemIds\":[\"b1m9frischesbrot\"],\"tip\":\"das Brot → sin artículo, el adjetivo se pone la -s del artículo: frisches Brot.\"},{\"id\":\"b1m9l3e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica el anuncio: ¿con artículo o sin él?\",\"categories\":[\"hay artículo (adjetivo -e/-en)\",\"sin artículo (adjetivo con corona)\"],\"items\":[{\"text\":\"das freie Zimmer\",\"bucket\":0},{\"text\":\"frisches Brot\",\"bucket\":1},{\"text\":\"guter Kaffee\",\"bucket\":1},{\"text\":\"mit dem letzten Zug\",\"bucket\":0},{\"text\":\"warme Milch\",\"bucket\":1},{\"text\":\"eine ruhige Ferienwohnung\",\"bucket\":0},{\"text\":\"mit warmem Wasser\",\"bucket\":1},{\"text\":\"die günstigsten Übernachtungen\",\"bucket\":0}],\"itemIds\":[\"b1m9freieszimmer\",\"b1m9frischesbrot\",\"b1m9ferienwohnung\",\"b1m9uebernachtung\"],\"tip\":\"La pregunta útil no es «¿qué caso?» sino «¿alguien ha marcado ya el caso?». Si no, marca tú con el adjetivo.\"},{\"id\":\"b1m9l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa el anuncio (sin artículo)\",\"text\":\"Ruhige Ferienwohnung mit schön___ Aussicht auf die Berge.\",\"answers\":[\"er\"],\"translation\":\"Apartamento tranquilo con bonitas vistas a las montañas.\",\"hints\":[\"mit + Dativ, y Aussicht es femenina\",\"Dativo femenino: como de-r\"],\"itemIds\":[\"b1m9ferienwohnung\"]},{\"id\":\"b1m9l3e5\",\"type\":\"gapbank\",\"prompt\":\"Rellena el anuncio de la Ferienwohnung\",\"text\":\"___ Ferienwohnung im Zentrum von Innsbruck: zwei ___ Zimmer, Küche mit ___ Wasser. ___ Brot bringt der Bäcker jeden Morgen.\",\"answers\":[\"Ruhige\",\"freie\",\"warmem\",\"Frisches\"],\"bank\":[\"Ruhige\",\"freie\",\"warmem\",\"Frisches\",\"Ruhiges\",\"freien\",\"warmes\",\"Frischer\"],\"translation\":\"Apartamento tranquilo en el centro de Innsbruck: dos habitaciones libres, cocina con agua caliente. El panadero trae pan fresco cada mañana.\",\"hints\":[\"Wohnung es femenina, Wasser es neutro\",\"mit + Dativ neutro → -em\"],\"itemIds\":[\"b1m9ferienwohnung\",\"b1m9freieszimmer\",\"b1m9frischesbrot\"],\"tip\":\"Los anuncios alemanes viven sin artículos: por eso son el mejor gimnasio de la declinación fuerte.\"},{\"id\":\"b1m9l3e6\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del mostrador\",\"target\":\"Haben Sie noch ein freies Zimmer für zwei Nächte\",\"translation\":\"¿Le queda alguna habitación libre para dos noches?\",\"distractors\":[\"freien\",\"einen\"],\"itemIds\":[\"b1m9freieszimmer\",\"b1m9uebernachtung\"]},{\"id\":\"b1m9l3e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco de «me hace ilusión»\",\"wrong\":\"Ich freue mich für die Reise nach Wien.\",\"answers\":[\"Ich freue mich auf die Reise nach Wien.\"],\"why\":\"sich freuen AUF + Akkusativ = ilusión por algo futuro. «für» solo vale para alegrarse POR OTRA PERSONA (Ich freue mich für dich). Y para algo ya pasado: sich freuen ÜBER.\",\"translation\":\"Me hace ilusión el viaje a Viena.\",\"itemIds\":[\"b1m9sichfreuenaufreise\"]},{\"id\":\"b1m9l3e8\",\"type\":\"listen\",\"prompt\":\"Escucha lo que dices en recepción\",\"text\":\"Ich möchte einchecken, ich habe ein Zimmer reserviert\",\"translation\":\"Quiero hacer el check-in, tengo una habitación reservada\",\"hints\":[\"Empieza por Ich möchte …\",\"… ich habe ein Zimmer reserviert\"],\"itemIds\":[\"b1m9einchecken\",\"b1m9freieszimmer\"]},{\"id\":\"b1m9l3e9\",\"type\":\"transform\",\"prompt\":\"Quita el artículo y ajusta el adjetivo\",\"source\":\"Der Kaffee ist gut.\",\"instruction\":\"Dilo sin artículo: «Hier gibt es …»\",\"answers\":[\"Hier gibt es guten Kaffee\",\"Hier gibt es guten Kaffee.\"],\"translation\":\"Aquí hay buen café.\",\"hints\":[\"es gibt + Akkusativ\",\"masculino acusativo sin artículo → como de-n\"],\"itemIds\":[\"b1m9frischesbrot\"],\"tip\":\"«es gibt» pide acusativo: guten Kaffee, frisches Brot, warme Milch. Es la frase que más practica la declinación fuerte.\"},{\"id\":\"b1m9l3e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo con otras palabras (registro de recepción)\",\"source\":\"Ich will ein Zimmer.\",\"forbid\":[\"will\",\"Zimmer\"],\"answers\":[\"Ich hätte gern eine Übernachtung\",\"Ich hätte gern eine Übernachtung für zwei Personen\",\"Ich möchte gern eine Übernachtung\",\"Ich möchte eine Übernachtung\",\"Ich möchte gern eine Übernachtung für zwei Personen\"],\"translation\":\"Quisiera alojarme una noche.\",\"hints\":[\"Cortesía: Ich hätte gern …\",\"Usa «Übernachtung» en vez de «Zimmer»\"],\"itemIds\":[\"b1m9uebernachtung\"],\"tip\":\"«Ich will» en un mostrador suena a exigencia. El nivel B1 se nota justo aquí: mismo contenido, otro registro.\"},{\"id\":\"b1m9l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Tienen todavía una habitación libre para dos noches?\",\"answers\":[\"Haben Sie noch ein freies Zimmer für zwei Nächte?\",\"Haben Sie noch ein freies Zimmer für zwei Nächte\"],\"hints\":[\"ein + neutro sin marca → el adjetivo lleva -es\",\"Haben Sie noch ein frei… Zimmer …\"],\"itemIds\":[\"b1m9freieszimmer\"],\"tip\":\"«freies» con -es: el neutro obliga al adjetivo a marcar. Esa -s es la que separa un A2 de un B1.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m9-2\",\"book\":\"Guten Tag!\",\"real\":\"Grüezi! / Grüezi mitenand!\",\"meaning\":\"Hola (Suiza; «mitenand» = a todos ustedes)\",\"when\":\"En toda la Suiza alemana, de usted, al entrar en una tienda, un hotel o un vagón. En Alemania y en Austria suena a imitación, y en el examen no cuenta como saludo: allí se saluda en estándar.\",\"register\":\"regional\",\"exam\":\"Guten Tag! Im Brief schreibt man: Sehr geehrte Damen und Herren.\",\"note\":\"Viene de «Gott grüez i» (que Dios le salude). En Suiza la respuesta también es Grüezi — nunca Hallo con desconocidos.\",\"sound\":\"GRÜÜ-e-tsi mit-e-NAND\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m9natvgrueezi\"}}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra B1 y busca «Adjektivdeklination»: ejercicios con y sin artículo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7
