correctas: \u003ci\u003enot \u003cb\u003eas\u003c/b\u003e cheap as\u003c/i\u003e y \u003ci\u003enot \u003cb\u003eso\u003c/b\u003e cheap as\u003c/i\u003e. El calco es poner \u003cmark class=\"akk\"\u003elike\u003c/mark\u003e en el segundo hueco: «not so expensive \u003cu\u003elike\u003c/u\u003e» no existe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. the same as\u003c/b\u003e — «igual que». Con \u003cb\u003eas\u003c/b\u003e, no con \u003ci\u003ethat\u003c/i\u003e ni con \u003ci\u003ethan\u003c/i\u003e: \u003ci\u003ethe same amount of water \u003cb\u003eas\u003c/b\u003e last year\u003c/i\u003e. Aquí el español mete «que» y de ahí sale \u003cmark class=\"akk\"\u003ethe same … that\u003c/mark\u003e, que es puro calco.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. twice / three times as much\u003c/b\u003e — «el doble», «el triple». El inglés no tiene una palabra para «el doble» en esta posición: lo dice contando. \u003ci\u003eIt costs \u003cb\u003etwice as much\u003c/b\u003e.\u003c/i\u003e \u003cmark class=\"akk\"\u003eIt costs the double\u003c/mark\u003e es traducción literal y no se entiende.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el «parecer», que en inglés son dos verbos distintos:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003elook like\u003c/b\u003e + \u003cu\u003esustantivo\u003c/u\u003e → parecerse a una cosa. \u003ci\u003eIt looks like paper.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003elook\u003c/b\u003e + \u003cu\u003eadjetivo\u003c/u\u003e, sin «like» → tener pinta de. \u003ci\u003eIt looks new.\u003c/i\u003e\u003cbr/\u003eEl error clásico es meter «like» delante de un adjetivo (\u003cmark class=\"akk\"\u003eit looks like new\u003c/mark\u003e) o traducir «como» por \u003ci\u003eas\u003c/i\u003e (\u003cmark class=\"akk\"\u003eit looks as paper\u003c/mark\u003e).\u003cbr/\u003e\u003cbr/\u003eY una expresión que oirás mucho: \u003cb\u003enothing like\u003c/b\u003e = «no se parece en nada». \u003ci\u003eThe new bins are nothing like the old ones.\u003c/i\u003e"])</ \"enb1m8l3e2\",\"type\":\"mc\",\"prompt\":\"El segundo hueco de «as… as»\",\"question\":\"«No es tan caro como cree la gente» →\",\"options\":[\"It isn't so expensive like people think.\",\"It isn't so expensive as people think.\",\"It isn't so expensive than people think.\"],\"answer\":1,\"whyWrong\":[\"«like» compara cosas, no cierra un «as… as». Este es el calco de «como» más común del nivel.\",null,\"«than» va con comparativos (cheaper than), nunca con «as… as».\"],\"itemIds\":[\"enb1m8notsoexpensiveas\"],\"tip\":\"Regla mecánica: si la frase empieza con «as» o «so», el segundo hueco es «as». Siempre.\"},{\"id\":\"enb1m8l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It isn't so expensive like people think.\",\"answers\":[\"It isn't so expensive as people think.\",\"It isn't as expensive as people think.\"],\"why\":\"El molde es «(not) so/as + adjetivo + AS». «like» no cierra nunca esta construcción: solo compara sustantivos sueltos (it looks like paper).\",\"translation\":\"No es tan caro como cree la gente.\",\"itemIds\":[\"enb1m8notsoexpensiveas\"]},{\"id\":\"enb1m8l3e4\",\"type\":\"errorfix\",\"prompt\":\"El «que» de «igual que»\",\"wrong\":\"We use the same amount of water that last year.\",\"answers\":[\"We use the same amount of water as last year.\"],\"why\":\"«the same … AS», siempre. El «que» del español empuja a poner «that» o «than», y ninguno de los dos cabe aquí.\",\"translation\":\"Gastamos la misma cantidad de agua que el año pasado.\",\"itemIds\":[\"enb1m8thesameamount\",\"enwater\"]},{\"id\":\"enb1m8l3e5\",\"type\":\"errorfix\",\"prompt\":\"El «como» que no es «as»\",\"wrong\":\"It looks as paper, but it's plastic.\",\"answers\":[\"It looks like paper, but it's plastic.\"],\"why\":\"«look like» + sustantivo. «as» aquí significaría «en calidad de», que no es lo que quieres decir. Con adjetivo, en cambio, no hay preposición ninguna: it looks new.\",\"translation\":\"Parece papel, pero es plástico.\",\"itemIds\":[\"enb1m8lookslikepaper\"]},{\"id\":\"enb1m8l3e6\",\"type\":\"transform\",\"prompt\":\"«El doble», contado\",\"source\":\"The green one costs the double.\",\"instruction\":\"Dilo como se dice de verdad en inglés\",\"answers\":[\"The green one costs twice as much\",\"The green one costs twice as much.\",\"The green one costs twice the price\"],\"translation\":\"El verde cuesta el doble.\",\"hints\":[\"El inglés lo cuenta: «dos veces tanto»\",\"The green one costs ... as much\"],\"itemIds\":[\"enb1m8twiceasmuch\",\"entwice\"],\"tip\":\"Aquí se mueven dos piezas, y por eso esto es una transformación y no una corrección: «the double» no se arregla cambiando una palabra, se sustituye entero por «twice as much».\"},{\"id\":\"enb1m8l3e7\",\"type\":\"bucket\",\"prompt\":\"«look» con «like» o sin él\",\"categories\":[\"look LIKE + sustantivo\",\"look + adjetivo, sin like\"],\"items\":[{\"text\":\"It looks ___ paper.\",\"bucket\":0},{\"text\":\"It looks ___ new.\",\"bucket\":1},{\"text\":\"They look ___ the old bins.\",\"bucket\":0},{\"text\":\"The park looks ___ cleaner.\",\"bucket\":1},{\"text\":\"This looks ___ a charity shop.\",\"bucket\":0},{\"text\":\"He looks ___ tired.\",\"bucket\":1}],\"itemIds\":[\"enb1m8lookslikepaper\",\"enb1m8lookthesame\"],\"tip\":\"Truco de bolsillo: si detrás hay algo que puede llevar «a» o «the», va «like». Si es un adjetivo, no va nada.\"},{\"id\":\"enb1m8l3e8\",\"type\":\"cloze\",\"prompt\":\"Completa la comparación de igualdad\",\"text\":\"We use the same amount of water ___ last year.\",\"answers\":[\"as\"],\"translation\":\"Gastamos la misma cantidad de agua que el año pasado.\",\"hints\":[\"No es «that» ni «than»\",\"Dos letras\"],\"itemIds\":[\"enb1m8thesameamount\"],\"tip\":\"«The same as» va siempre junto. Apréndetelo como una sola palabra y te ahorras el calco para siempre.\"},{\"id\":\"enb1m8l3e9\",\"type\":\"build\",\"prompt\":\"Construye la frase de los dos cubos\",\"target\":\"The two bins look the same\",\"translation\":\"Los dos cubos parecen iguales\",\"distractors\":[\"like\",\"as\"],\"itemIds\":[\"enb1m8lookthesame\",\"enb1m8thebin\"],\"tip\":\"«look the same» no lleva nada en medio. Las dos fichas que sobran son las dos que se meten por calco.\"},{\"id\":\"enb1m8l3e10\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje de Amy sobre las dos bolsas\",\"text\":\"I've got two bags here and they look the ___. One is paper and the other one only looks ___ paper — it's plastic inside. The plastic one costs ___ as much, and it isn't ___ good as the paper one.\",\"answers\":[\"same\",\"like\",\"twice\",\"as\"],\"bank\":[\"same\",\"like\",\"twice\",\"as\",\"double\",\"similar\"],\"translation\":\"Tengo aquí dos bolsas y parecen iguales. Una es de papel y la otra solo parece de papel: por dentro es plástico. La de plástico cuesta el doble y no es tan buena como la de papel.\",\"itemIds\":[\"enb1m8lookthesame\",\"enb1m8lookslikepaper\",\"enb1m8twiceasmuch\",\"enb1m8notsoexpensiveas\"],\"tip\":\"Los dos distractores son los dos calcos: «double» donde va «twice as much» y «similar» donde va «the same». Ninguno encaja en el molde.\"},{\"id\":\"enb1m8l3e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «cheaper»\",\"source\":\"The market is cheaper than this shop.\",\"forbid\":[\"cheaper\"],\"answers\":[\"This shop isn't as cheap as the market\",\"This shop is more expensive than the market\",\"This shop isn't so cheap as the market\"],\"translation\":\"El mercado es más barato que esta tienda.\",\"hints\":[\"Dale la vuelta: pon la tienda de sujeto\",\"This shop isn't ... cheap ... the market\"],\"itemIds\":[\"enb1m8notsoexpensiveas\",\"ena2m4ascheapas\",\"enshop\"],\"tip\":\"Dar la vuelta a una comparación es la maniobra más rentable del oral: cuando no te sale una palabra, cambias de sujeto y la frase se salva sola.\"},{\"id\":\"enb1m8l3e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa?\",\"source\":\"The new bins are nothing like the old ones.\",\"answers\":[\"Los cubos nuevos no se parecen en nada a los viejos\",\"Los contenedores nuevos no tienen nada que ver con los viejos\"],\"itemIds\":[\"enb1m8nothinglike\",\"enb1m8thebin\"],\"tip\":\"«nothing like» es un negativo muy fuerte: no es «se parecen poco», es «no tienen nada que ver». Cuidado con confundirlo con «nothing like it», que significa «no hay nada igual» y es un elogio.\"},{\"id\":\"enb1m8l3e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El verde cuesta el doble y no es tan bueno.\",\"answers\":[\"The green one costs twice as much and it isn't as good\",\"The green one costs twice as much and it isn't so good\",\"The green one costs twice as much and it's not as good\"],\"hints\":[\"«El doble» se cuenta: twice as much\",\"The green one costs ... and it isn't ... good\"],\"itemIds\":[\"enb1m8twiceasmuch\",\"enb1m8notsoexpensiveas\",\"ena2m3green\"],\"tip\":\"Dos moldes de la lección en una sola frase. Si te ha salido entera, la lección está hecha.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Sesha
