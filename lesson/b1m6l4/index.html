"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T422,En el examen tienes que contar lo que te dijeron: la asesora, el profesor, el artículo. Hay tres niveles y solo dos hay que producir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Con dass\u003c/b\u003e (el que usarás siempre): \u003ci\u003eEr sagt, \u003cb\u003edass\u003c/b\u003e er einen Kurs \u003cb\u003emacht\u003c/b\u003e.\u003c/i\u003e Verbo al final, como toda subordinada.\u003cbr/\u003e\u003cb\u003e2. Sin dass\u003c/b\u003e (igual de correcto, muy frecuente al hablar): \u003ci\u003eEr sagt, er \u003cb\u003emacht\u003c/b\u003e einen Kurs.\u003c/i\u003e ¡Atención! Sin dass NO hay subordinada: el verbo vuelve a la \u003cu\u003esegunda posición\u003c/u\u003e. Quitar el dass te cambia el orden entero.\u003cbr/\u003e\u003cb\u003e3. Konjunktiv I\u003c/b\u003e (prensa y textos formales, solo para RECONOCER): \u003ci\u003eEr sagte, er \u003cb\u003ehabe\u003c/b\u003e keine Zeit.\u003c/i\u003e · \u003ci\u003eSie meinte, ich \u003cb\u003esolle\u003c/b\u003e mich anmelden.\u003c/i\u003e Ese \u003ci\u003ehabe\u003c/i\u003e/\u003ci\u003esolle\u003c/i\u003e no es un error: marca que la responsabilidad de lo dicho es de otro. Lo verás en el Lesen; tú puedes usar tranquilamente el nivel 1.\u003cbr/\u003e\u003cbr/\u003eY el cambio obligatorio en cualquiera de los tres: \u003cb\u003elas personas se ajustan\u003c/b\u003e. „\u003ci\u003eIch\u003c/i\u003e habe keine Zeit“, sagt Martin → Martin sagt, dass \u003cb\u003eer\u003c/b\u003e keine Zeit \u003cb\u003ehat\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m6l4\",\"phaseId\":\"b1m6\",\"title\":\"Er sagt, dass… / Er sagte, er habe…\",\"subtitle\":\"Contar lo que dijo otro — con dass, sin dass y como la prensa\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tres formas de citar a alguien\",\"itemIds\":[\"b1m6ersagtdass\",\"b1m6ersagteerhabe\",\"b1m6siemeinte\",\"b1m6lautstudie\",\"b1m6beratung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: tres niveles de estilo indirecto\",\"body\":\"$17\",\"table\":[[\"directo\",\"indirecto con dass\",\"indirecto sin dass\"],[\"„Ich mache einen Kurs.“\",\"Er sagt, dass er einen Kurs macht.\",\"Er sagt, er macht einen Kurs.\"],[\"„Ich habe keine Zeit.“\",\"Er sagt, dass er keine Zeit hat.\",\"Er sagt, er hat keine Zeit.\"],[\"„Melden Sie sich an.“\",\"Sie sagt, dass ich mich anmelden soll.\",\"Sie sagt, ich soll mich anmelden.\"],[\"prensa (K I)\",\"Er sagte, er habe keine Zeit.\",\"— (solo reconocer)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l4e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el estilo indirecto de la prensa\",\"question\":\"„Der Minister sagte, er habe keine Zeit für ein Interview.“ ¿Qué significa habe aquí?\",\"options\":[\"Que el ministro no tiene tiempo, según él mismo\",\"Que el ministro tendría tiempo si quisiera\",\"Que el periodista duda del ministro\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería Konjunktiv II (hätte): una hipótesis\",\"El Konjunktiv I no juzga: solo marca que la frase es de otro\"],\"itemIds\":[\"b1m6ersagteerhabe\"],\"tip\":\"habe/sei/solle en un texto = «según él/ella». No hace falta producirlo en B1, pero hay que entenderlo al leer.\"},{\"id\":\"b1m6l4e2\",\"type\":\"mc\",\"prompt\":\"Con dass o sin dass\",\"question\":\"Elige la frase correcta:\",\"options\":[\"Er sagt, er macht einen Kurs.\",\"Er sagt, er einen Kurs macht.\"],\"answer\":0,\"whyWrong\":[null,\"Sin dass no hay subordinada: el verbo vuelve a la 2ª posición. Con dass sí: «dass er einen Kurs macht»\"],\"itemIds\":[\"b1m6ersagtdass\"],\"tip\":\"El dass es lo que manda el verbo al final. Si lo quitas, el verbo vuelve a su sitio de siempre.\"},{\"id\":\"b1m6l4e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica según el orden del verbo\",\"categories\":[\"con dass → verbo al FINAL\",\"sin dass → verbo 2º\"],\"items\":[{\"text\":\"Er sagt, dass er einen Kurs macht.\",\"bucket\":0},{\"text\":\"Er sagt, er macht einen Kurs.\",\"bucket\":1},{\"text\":\"Sie meint, dass die Krippe gut ist.\",\"bucket\":0},{\"text\":\"Sie meint, die Krippe ist gut.\",\"bucket\":1},{\"text\":\"Ich glaube, dass er kommt.\",\"bucket\":0},{\"text\":\"Ich glaube, er kommt.\",\"bucket\":1}],\"itemIds\":[\"b1m6ersagtdass\",\"b1m6krippe\"],\"tip\":\"Las dos columnas son correctas. Lo que no existe es mezclarlas: «*Er sagt, er einen Kurs macht».\"},{\"id\":\"b1m6l4e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Sie sagt, dass sie hat keine Zeit.\",\"answers\":[\"Sie sagt, dass sie keine Zeit hat.\",\"Sie sagt, dass sie keine Zeit hat\"],\"why\":\"Con dass el verbo cierra la subordinada: dass sie keine Zeit hat. El español «dice que no tiene tiempo» deja el verbo delante, y de ahí sale el calco.\",\"translation\":\"Dice que no tiene tiempo.\",\"itemIds\":[\"b1m6ersagtdass\"]},{\"id\":\"b1m6l4e5\",\"type\":\"transform\",\"prompt\":\"Transforma: del estilo directo al indirecto\",\"source\":\"„Ich mache eine Ausbildung“, sagt Martin.\",\"instruction\":\"Cuéntalo con dass\",\"answers\":[\"Martin sagt, dass er eine Ausbildung macht\",\"Martin sagt, dass er eine Ausbildung macht.\"],\"translation\":\"Martin dice que hace una formación profesional.\",\"hints\":[\"Ich → er, y el verbo al final\",\"Martin sagt, dass er eine Ausbildung ...\"],\"itemIds\":[\"b1m6ersagtdass\",\"b1m6ausbildungsplatz\"],\"tip\":\"Dos cambios a la vez: la persona (ich → er) y el orden. Olvidar el primero es tan típico como olvidar el segundo.\"},{\"id\":\"b1m6l4e6\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora un consejo\",\"source\":\"„Melden Sie sich früh an“, sagt die Beraterin.\",\"instruction\":\"Cuéntalo con dass y sollen\",\"answers\":[\"Die Beraterin sagt, dass ich mich früh anmelden soll\",\"Die Beraterin sagt, dass ich mich früh anmelden soll.\"],\"translation\":\"La asesora dice que me apunte pronto.\",\"hints\":[\"El imperativo se cuenta con sollen\",\"Die Beraterin sagt, dass ich mich früh ...\"],\"itemIds\":[\"b1m6beratung\",\"b1m6sichanmeldenfuer\"]},{\"id\":\"b1m6l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula de la prensa\",\"text\":\"___ einer Studie lernen immer mehr Erwachsene eine neue Sprache.\",\"answers\":[\"Laut\"],\"translation\":\"Según un estudio, cada vez más adultos aprenden un idioma nuevo.\",\"hints\":[\"«según» + Dativo, una sola palabra\",\"L...\"],\"itemIds\":[\"b1m6lautstudie\"],\"tip\":\"laut einer Studie / laut dem Bericht: fórmula de oro para citar datos en tu comentario del examen.\"},{\"id\":\"b1m6l4e8\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación con el banco\",\"text\":\"Meine Beraterin sagt, ___ ich mich früh anmelden soll. ___ einer Studie fehlen viele Krippenplätze. ___ melde ich mich schon im Januar an.\",\"answers\":[\"dass\",\"Laut\",\"Deshalb\"],\"bank\":[\"dass\",\"Laut\",\"Deshalb\",\"weil\",\"obwohl\",\"damit\"],\"translation\":\"Mi asesora dice que me apunte pronto. Según un estudio faltan muchas plazas de guardería. Por eso me apunto ya en enero.\",\"itemIds\":[\"b1m6ersagtdass\",\"b1m6lautstudie\",\"b1m6deshalbmeldeich\",\"b1m6krippenplatz\"],\"tip\":\"Deshalb MELDE ich mich: adverbio en posición 1 → verbo pegado detrás. El tercer hueco es la trampa nº1 del nivel.\"},{\"id\":\"b1m6l4e9\",\"type\":\"build\",\"prompt\":\"Construye la cita\",\"target\":\"Meine Mutter sagt, dass ich einen Abschluss brauche\",\"translation\":\"Mi madre dice que necesito un título\",\"distractors\":[\"brauche ich\",\"weil\"],\"itemIds\":[\"b1m6ersagtdass\",\"b1m6abschluss\"]},{\"id\":\"b1m6l4e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la cita\",\"text\":\"Er sagt, dass er einen Kurs macht\",\"translation\":\"Dice que hace un curso\",\"hints\":[\"Con dass → verbo al final\",\"Er sagt, dass er einen Kurs ...\"],\"itemIds\":[\"b1m6ersagtdass\",\"b1m6sprachkurs\"]},{\"id\":\"b1m6l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La asesora dijo que necesito el nivel B1\",\"answers\":[\"Die Beraterin sagte, dass ich das Niveau B1 brauche\",\"Die Beraterin sagte, dass ich das Niveau B1 brauche.\",\"Die Beraterin hat gesagt, dass ich das Niveau B1 brauche\"],\"hints\":[\"sagte + dass + verbo al final\",\"Die Beraterin sagte, dass ich ...\"],\"itemIds\":[\"b1m6beratung\",\"b1m6ersagtdass\"],\"tip\":\"Con esta frase ya puedes reportar cualquier consulta: es lo que pide la Aufgabe 1 del Schreiben cuando cuentas «qué te dijeron».\"}]}],\"resources\":[{\"label\":\"tagesschau — Nachrichten\",\"url\":\"https://www.tagesschau.de/\",\"note\":\"Lee tres titulares y busca los habe/sei/solle: el Konjunktiv I es el sonido de la prensa alemana.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-we
