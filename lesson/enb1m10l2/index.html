3pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6f9,"])</script><script>self.__next_f.push([1,"El español tiene un verbo distinto para cada cosa: \u003ci\u003ellevarse bien\u003c/i\u003e, \u003ci\u003ereñir\u003c/i\u003e, \u003ci\u003ereconciliarse\u003c/i\u003e, \u003ci\u003edistanciarse\u003c/i\u003e. El inglés hace casi todo eso con \u003cb\u003etres o cuatro verbos corrientes y una preposición\u003c/b\u003e, y ahí es donde se le va el nivel a quien traduce palabra por palabra.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eget on (with)\u003c/b\u003e — llevarse bien. Ya lo traes del módulo 1. Lo que se añade hoy es el adverbio, que es lo que le da naturalidad: \u003ci\u003ewe get on \u003cb\u003ereally\u003c/b\u003e well\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003efall out (with)\u003c/b\u003e — pelearse y \u003cb\u003edejar de hablarse\u003c/b\u003e. No es una discusión de una tarde: es una ruptura. \u003ci\u003eI fell out with my brother.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003emake up\u003c/b\u003e — hacer las paces. Es el contrario exacto de \u003ci\u003efall out\u003c/i\u003e, y va sin preposición: \u003ci\u003ewe made up\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003elose touch\u003c/b\u003e / \u003cb\u003eget back in touch\u003c/b\u003e — perder y retomar el contacto. Ojo: \u003cb\u003esin artículo\u003c/b\u003e. \u003ci\u003eWe lost \u003cu\u003ethe\u003c/u\u003e touch\u003c/i\u003e no existe; el español pone «el contacto» y el inglés no pone nada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY un falso amigo que hace daño de verdad:\u003c/b\u003e \u003cb\u003ea close friend\u003c/b\u003e es un amigo íntimo. \u003ci\u003eAn intimate friend\u003c/i\u003e existe, pero en inglés de hoy suena a pareja: no lo uses para tu amiga del colegio. \u003ci\u003eClose\u003c/i\u003e es la palabra normal, y se pronuncia con \u003cb\u003es\u003c/b\u003e, «klóus» — nada que ver con el verbo \u003ci\u003eto close\u003c/i\u003e, que suena «klóus̬».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde entra lo de ayer.\u003c/b\u003e Una pelea siempre tiene un antes, y ese antes es past perfect: \u003ci\u003eThey fell out because he \u003cb\u003ehad told\u003c/b\u003e everybody.\u003c/i\u003e Fíjate en el orden: primero se cuenta la pelea y \u003cb\u003edespués\u003c/b\u003e lo que la causó. En inglés eso es normal y elegante — y solo se sostiene si el \u003ci\u003ehad\u003c/i\u003e está puesto. Sin él, la frase dice que se lo contó a todo el mundo \u003cb\u003edespués\u003c/b\u003e de la pelea, que es otra historia."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l2\",\"phaseId\":\"enb1m10\",\"title\":\"We get on really well\",\"subtitle\":\"El vocabulario de las relaciones que se rompen y se arreglan\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"De «nos llevamos genial» a «llevamos dos años sin hablarnos»\",\"itemIds\":[\"enb1m10getonreallywell\",\"enb1m10falloutwith\",\"enb1m10makeup\",\"enb1m10closefriend\",\"enb1m10haveincommon\",\"enb1m10losttouch\",\"enb1m10getbackintouch\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: en inglés las relaciones se dicen con phrasal verbs\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Cuidado con\"],[\"Nos llevamos genial\",\"We get on really well.\",\"no es «we carry ourselves well»\"],[\"Nos peleamos y dejamos de hablarnos\",\"We fell out.\",\"«fall out» ya incluye el silencio de después\"],[\"Hicimos las paces\",\"We made up.\",\"sin preposición detrás\"],[\"Perdimos el contacto\",\"We lost touch.\",\"sin «the»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l2e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro movimientos de una amistad\",\"pairs\":[{\"target\":\"We get on really well.\",\"source\":\"Nos llevamos genial.\"},{\"target\":\"I fell out with my brother last year.\",\"source\":\"Me peleé con mi hermano el año pasado.\"},{\"target\":\"We made up a week later.\",\"source\":\"Hicimos las paces una semana después.\"},{\"target\":\"We lost touch after school.\",\"source\":\"Perdimos el contacto al acabar el colegio.\"}],\"itemIds\":[\"enb1m10getonreallywell\",\"enb1m10falloutwith\",\"enb1m10makeup\",\"enb1m10losttouch\"],\"tip\":\"Cuatro relaciones enteras en cuatro phrasal verbs. Si te aprendes «fall out» y «make up» como pareja, ya no se te olvida ninguno de los dos.\"},{\"id\":\"enb1m10l2e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo de la lección\",\"question\":\"¿Cómo se dice «una amiga íntima» en inglés normal?\",\"options\":[\"a close friend\",\"an intimate friend\",\"a deep friend\"],\"answer\":0,\"whyWrong\":[null,\"«Intimate» existe, pero hoy se lee como pareja o como algo muy privado. Dicho de una amiga del colegio, cambia la frase entera.\",\"«Deep» sirve para una conversación, no para una persona.\"],\"itemIds\":[\"enb1m10closefriend\"],\"tip\":\"Y ojo a la pronunciación: «close» adjetivo suena «klóus», con s de serpiente. «To close» (cerrar) suena «klóus̬», con la rayita. Misma letra, dos palabras.\"},{\"id\":\"enb1m10l2e3\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál oíste: la del libro o la de la calle?\",\"book\":\"We are very good friends.\",\"real\":\"We get on really well.\",\"translation\":\"Nos llevamos genial.\",\"itemIds\":[\"enb1m10getonreallywell\"],\"tip\":\"Las dos son correctas, pero un británico describe una relación por cómo funciona, no por la etiqueta. «We're good friends» se dice; «we get on really well» se dice el doble.\"},{\"id\":\"enb1m10l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el phrasal verb\",\"text\":\"Sam and Ben fell ___ over something stupid and didn't speak for two years.\",\"answers\":[\"out\"],\"translation\":\"Sam y Ben se pelearon por una tontería y estuvieron dos años sin hablarse.\",\"hints\":[\"Tres letras\",\"Es lo contrario de «in»\"],\"itemIds\":[\"enb1m10falloutwith\"],\"tip\":\"«Over something» es la preposición del motivo en las peleas: fall out OVER money, argue ABOUT money. Las dos valen, pero cada verbo tiene la suya.\"},{\"id\":\"enb1m10l2e5\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Quita UNA palabra.\",\"wrong\":\"We lost the touch after school.\",\"answers\":[\"We lost touch after school.\"],\"why\":\"«Lose touch» va sin artículo: el español pone «el contacto» y el inglés no pone nada. Con «the», la frase suena a que perdisteis un objeto llamado «touch».\",\"translation\":\"Perdimos el contacto al acabar el colegio.\",\"itemIds\":[\"enb1m10losttouch\"]},{\"id\":\"enb1m10l2e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"We have a lot in common\",\"translation\":\"Tenemos mucho en común\",\"distractors\":[\"between\",\"us\"],\"itemIds\":[\"enb1m10haveincommon\"],\"tip\":\"Las dos fichas que sobran son la traducción literal de «entre nosotros». En inglés «in common» ya dice quiénes: no hace falta añadir nada.\"},{\"id\":\"enb1m10l2e7\",\"type\":\"order\",\"prompt\":\"Ordena la historia de Sam y Ben. Ojo: el orden del relato no es el orden de los hechos.\",\"sentences\":[\"Sam and Ben fell out in 2019, and for two years they didn't speak at all.\",\"Nobody could remember what it had been about, not even the two of them.\",\"Then Carol was taken into hospital, and Sam turned up on the ward with a bag of oranges.\",\"They made up in the corridor, without either of them saying the word sorry.\",\"Two years later, they get on exactly as they always did.\"],\"translation\":\"Sam y Ben se pelearon en 2019 y estuvieron dos años sin hablarse. Nadie se acordaba de por qué había sido, ni ellos mismos. Entonces ingresaron a Carol y Sam apareció en la planta con una bolsa de naranjas. Hicieron las paces en el pasillo, sin que ninguno dijera «lo siento». Dos años después se llevan exactamente igual que siempre.\",\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10makeup\",\"enb1m10getonreallywell\"],\"tip\":\"La segunda frase lleva «had been about» y no cuenta nada nuevo: mira hacia atrás, hacia la pelea de la primera. Ese es el trabajo del past perfect dentro de un relato — abrir un paréntesis sin romper la línea.\"},{\"id\":\"enb1m10l2e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen\",\"text\":\"Sam and Ben ___ out over something stupid in 2019. Two years later they ___ up in a hospital corridor. Today they ___ on the same as they always did.\",\"answers\":[\"fell\",\"made\",\"get\"],\"bank\":[\"fell\",\"made\",\"get\",\"lost\",\"took\",\"kept\"],\"translation\":\"Sam y Ben se pelearon por una tontería en 2019. Dos años después hicieron las paces en el pasillo de un hospital. Hoy se llevan igual que siempre.\",\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10makeup\",\"enb1m10getonreallywell\"],\"tip\":\"Fíjate en el último hueco: «today» te obliga a presente. En un examen, la mitad de los huecos se deciden por el adverbio de tiempo, no por el significado del verbo.\"},{\"id\":\"enb1m10l2e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"We are very good friends.\",\"forbid\":[\"friends\",\"good\"],\"answers\":[\"We get on really well\",\"We get on very well\",\"We get on well together\"],\"translation\":\"Nos llevamos genial.\",\"itemIds\":[\"enb1m10getonreallywell\"],\"tip\":\"Esto es exactamente lo que mide el criterio de vocabulario del examen: no saber más palabras, sino tener DOS formas de decir lo mismo y elegir la que suena a inglés.\"},{\"id\":\"enb1m10l2e10\",\"type\":\"transform\",\"prompt\":\"Pon la causa por debajo\",\"source\":\"He told everybody. Then they fell out.\",\"instruction\":\"Cuéntalo al revés: primero la pelea, después la causa con «because»\",\"answers\":[\"They fell out because he had told everybody\",\"They fell out because he had told everybody.\",\"They fell out because he'd told everybody\"],\"translation\":\"Se pelearon porque él se lo había contado a todo el mundo.\",\"hints\":[\"La causa va detrás, y por eso necesita «had»\",\"They fell out because he ... everybody\"],\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10hadalreadyleft\"],\"tip\":\"Sin el «had», «because he told everybody» sonaría a que se lo contó después de la bronca. El past perfect es lo único que impide esa lectura.\"},{\"id\":\"enb1m10l2e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Retomamos el contacto el verano pasado.\",\"answers\":[\"We got back in touch last summer\",\"We got back in touch last summer.\",\"We got in touch again last summer\"],\"hint\":\"El verbo es «get» y el sustantivo va sin artículo\",\"itemIds\":[\"enb1m10getbackintouch\",\"enb1m10losttouch\"],\"tip\":\"«Back» es la palabra del inglés para «de nuevo» dentro de un phrasal verb: get back, call back, write back. Y otra vez sin «the» delante de «touch».\"},{\"id\":\"enb1m10l2e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"I fell out with my brother last year, but we made up at Christmas.\",\"answers\":[\"Me peleé con mi hermano el año pasado, pero hicimos las paces en Navidad\",\"El año pasado me peleé con mi hermano, pero nos reconciliamos en Navidad\",\"Me enfadé con mi hermano el año pasado, pero hicimos las paces en Navidad\"],\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10makeup\"],\"tip\":\"«Fall out» siempre implica que hubo silencio después. Si solo fue una discusión de media hora, lo que se dice es «we had an argument» — y eso es la lección 5.\"},{\"id\":\"enb1m10l2e13\",\"type\":\"shadow\",\"prompt\":\"Repite pegándote al audio: dos pasadas\",\"text\":\"We fell out, we didn't speak for two years, and then we made up.\",\"phonetic\":\"ui fel áut, ui DÍ-dent spíik fo tuu yías̬, and den ui méid ap\",\"translation\":\"Nos peleamos, estuvimos dos años sin hablarnos y luego hicimos las paces.\",\"reps\":2,\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10makeup\"],\"tip\":\"Toda una historia de dos años en once palabras. Es lo que el examen premia en el oral: contar mucho con estructuras cortas y bien encadenadas.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m10-1\",\"book\":\"We are friends.\",\"real\":\"We get on really well.\",\"meaning\":\"Nos llevamos genial\",\"when\":\"Hablando, con cualquiera. Cuando alguien te pregunta por una persona, el británico no contesta con la etiqueta de la relación, contesta con cómo funciona. Para el Writing y el Speaking del examen vale la misma idea, un punto más neutra.\",\"register\":\"neutral\",\"exam\":\"We get on well together.\",\"note\":\"«Really» aquí no es «realmente»: es el intensificador de todos los días, el equivalente de «genial» o «muy bien». Sin él, «we get on well» suena correcto pero tibio.\",\"sound\":\"ui guet on RÍA-li uel\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m10getonreallywell\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",
