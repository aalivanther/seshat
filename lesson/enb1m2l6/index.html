js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T5ef,"])</script><script>self.__next_f.push([1,"El texto de hoy es escocés: un periódico de \u003cb\u003eGlasgow\u003c/b\u003e. El inglés que se lee es el mismo que el de Londres —el escrito casi no cambia—, pero las cifras, los oficios y las instituciones son de allí, y eso es parte del nivel: el B1 deja de hablar solo de tu barrio.\u003cbr/\u003e\u003cbr/\u003eDebajo hay \u003cb\u003ecinco preguntas y dos formas distintas de contestar\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eOpción múltiple\u003c/b\u003e, la de siempre.\u003cbr/\u003e2. \u003cb\u003eRespuesta escrita corta\u003c/b\u003e — tú tecleas la respuesta, en \u003cb\u003etres palabras como mucho\u003c/b\u003e. Esto es nuevo, y no es un capricho: el \u003cb\u003eReading Part 4\u003c/b\u003e del B1 dejó de ser un test. Son \u003cb\u003eocho preguntas abiertas\u003c/b\u003e sobre un texto de unas 400 palabras, y ya no se puede aprobar adivinando.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se contestan las abiertas, que tiene truco:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eCopia del texto\u003c/b\u003e siempre que puedas: el baremo oficial no premia que reformules, premia que aciertes.\u003cbr/\u003e· \u003cb\u003eLo más corto posible.\u003c/b\u003e Si la respuesta es «forty-three», no escribas «She was forty-three years old when she started»: cuantas más palabras, más sitios donde equivocarte.\u003cbr/\u003e· \u003cb\u003eLa ortografía se perdona un poco\u003c/b\u003e (el propio baremo dice «accept any recognisable spelling»), pero la palabra tiene que ser la buena.\u003cbr/\u003e\u003cbr/\u003eY dos de las cinco son de \u003cb\u003einferencia\u003c/b\u003e: la respuesta no está escrita con esas palabras. Hay que juntar dos frases separadas — eso es lo que el temario llama «understand information or purpose which may not be expressed overtly», y es la frontera entre el A2 y el B1."])</script><script>self.__next_f.push([1,"18:Ta02,"])</script><script>self.__next_f.push([1,"Rosa Delgado had worked in the same kitchen in Glasgow for eleven years when the restaurant closed. She was forty-three, and the only [[qualification|título oficial]] she had was a food hygiene certificate from 2011.\u003cbr/\u003e\u003cbr/\u003e\"Everybody told me to find another kitchen,\" she says. \"It was the only thing I knew. But I was earning less than I earned in 2015, and I was still working every weekend to [[make ends meet|llegar a fin de mes]]. There was no way I was going to do that until I was sixty.\"\u003cbr/\u003e\u003cbr/\u003eInstead, Rosa did something that sounded ridiculous to her family: she started an [[apprenticeship|contrato de formación: se trabaja y se estudia a la vez]] as an electrician, at forty-three, alongside four school leavers of eighteen. For two years her income went down, not up. Her sister told everyone she had lost her mind.\u003cbr/\u003e\u003cbr/\u003eShe is now in her third year, and she earns more than she ever did in the kitchen.\u003cbr/\u003e\u003cbr/\u003eRosa is part of a pattern that the people who study the [[labour market|el mercado laboral]] have been arguing about for a while. In Scotland, the number of people over forty who start an apprenticeship has risen every year since 2021. Some see it as good news: proof that nobody is stuck for ever with the job they fell into at twenty. Others are less cheerful. \"People don't retrain because they're bored,\" says a careers adviser at a college in the east of the city. \"They retrain because the job they had stopped paying the rent.\"\u003cbr/\u003e\u003cbr/\u003eThat is the part the good-news version leaves out. A third of the people who left [[hospitality|la hostelería]] in Scotland last year did not move up: they moved sideways, into warehouses and delivery, where the pay is similar, the [[shifts|los turnos]] are worse and zero-hours contracts are normal. And the ones who did retrain were, almost always, the ones who could afford two thin years first.\u003cbr/\u003e\u003cbr/\u003eRosa knows this. Her partner kept his job at the airport the whole time. \"Without his wages it was simply not possible,\" she says. \"That's not the bit anybody wants to print.\"\u003cbr/\u003e\u003cbr/\u003eSo what does she tell the people who ask her? Three things, and none of them is inspiring. Find out what the trade actually pays in your city, not in a video. Ask somebody who is five years ahead of you, not five days. And write down, before you start, the month in which you will run out of money — because that is the date the decision really depends on.\u003cbr/\u003e\u003cbr/\u003e\"Everybody wants to hear that you should follow your dream,\" she says. \"What I'd say is: count first, then follow it.\""])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l6\",\"phaseId\":\"enb1m2\",\"title\":\"Starting again at forty-three\",\"subtitle\":\"Un texto largo de verdad — y dos preguntas de respuesta escrita, como el Reading Part 4\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del texto\",\"itemIds\":[\"enb1m2retrain\",\"enb1m2apprenticeship\",\"enb1m2qualification\",\"enb1m2zerohours\",\"enb1m2makeendsmeet\",\"enb1m2skills\",\"enb1m2endup\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos formas de preguntar, y las dos caen en el examen\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Toca las palabras subrayadas si te bloquean. Ojo: dos preguntas se contestan escribiendo.\",\"title\":\"Starting again at forty-three\",\"source\":\"From a Glasgow evening paper (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m2l6e1q1\",\"q\":\"What made Rosa look for a different trade?\",\"options\":[\"The restaurant closed and she was earning less than in 2015.\",\"Her family suggested she should try something new.\",\"She already had a qualification as an electrician.\"],\"answer\":0,\"why\":\"Dos datos del primer y del segundo párrafo: el restaurante cerró y ella cobraba menos que en 2015. La familia, de hecho, le dijo lo contrario.\"},{\"id\":\"enb1m2l6e1q2\",\"q\":\"How old was Rosa when she started the apprenticeship? (máximo 3 palabras)\",\"accepted\":[\"forty-three\",\"43\",\"forty three\",\"forty-three years old\"],\"why\":\"«she started an apprenticeship as an electrician, at forty-three». Copia el dato tal cual: en el examen, cuantas más palabras escribas, más sitios donde fallar.\"},{\"id\":\"enb1m2l6e1q3\",\"q\":\"What does the careers adviser think the rise in older apprentices shows?\",\"options\":[\"That people are being pushed out of jobs that no longer pay.\",\"That older workers learn faster than school leavers do.\",\"That colleges should offer fewer places to young people.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice con esas palabras. Lo dice al revés, negando la versión bonita: «People don't retrain because they're bored… because the job they had stopped paying the rent». Junta esa frase con la de «Others are less cheerful» y ya tienes la respuesta.\"},{\"id\":\"enb1m2l6e1q4\",\"q\":\"Why does Rosa mention her partner's job at the airport?\",\"options\":[\"To show that retraining needs somebody else's steady wage behind it.\",\"To explain why she wanted to work near the airport.\",\"To say that he retrained at the same time as she did.\"],\"answer\":0,\"inference\":true,\"why\":\"El párrafo anterior ya lo había apuntado —«the ones who could afford two thin years first»— y ella lo confirma sin decirlo: «Without his wages it was simply not possible». Dos frases separadas que, juntas, dan la respuesta.\"},{\"id\":\"enb1m2l6e1q5\",\"q\":\"Where does Rosa say you should NOT look for information about pay? (máximo 3 palabras)\",\"accepted\":[\"in a video\",\"a video\",\"videos\",\"on a video\",\"in videos\"],\"why\":\"«Find out what the trade actually pays in your city, not in a video». La respuesta está literal: cópiala corta.\"}],\"itemIds\":[\"enb1m2qualification\",\"enb1m2apprenticeship\",\"enb1m2retrain\",\"enb1m2makeendsmeet\",\"enb1m2zerohours\"],\"tip\":\"¿Fallaste alguna de inferencia? Normal. Vuelve al párrafo y busca las DOS frases que, juntas, la sostienen: nunca está en una sola.\"},{\"id\":\"enb1m2l6e2\",\"type\":\"mc\",\"prompt\":\"Vocabulario del texto\",\"question\":\"«I was still working every weekend to make ends meet.»\",\"options\":[\"…para llegar a fin de mes\",\"…para acabar el trabajo a tiempo\",\"…para conocer gente\"],\"answer\":0,\"whyWrong\":[null,\"«ends» aquí no son los finales de nada: es el dinero que entra y el que sale, que tienen que «encontrarse».\",\"«meet» sí significa «conocer», pero en esta expresión hecha no: las tres palabras van juntas o no significan nada.\"],\"itemIds\":[\"enb1m2makeendsmeet\"],\"tip\":\"«make ends meet» es de las expresiones que más se oyen en el Reino Unido desde 2022. Va casi siempre con «struggle to»: «people are struggling to make ends meet».\"},{\"id\":\"enb1m2l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra del texto\",\"text\":\"She started an ___ as an electrician: two years of working and studying at the same time.\",\"answers\":[\"apprenticeship\"],\"translation\":\"Empezó un contrato de formación como electricista: dos años trabajando y estudiando a la vez.\",\"hints\":[\"Empieza por appren…\",\"a-ppren-tice-ship\"],\"itemIds\":[\"enb1m2apprenticeship\"],\"tip\":\"«apprenticeship» es un contrato de verdad, con sueldo: no es «hacer prácticas». Las prácticas sin contrato son «work experience» o «an internship».\"},{\"id\":\"enb1m2l6e4\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa? Fíjate en la relativa\",\"source\":\"Nobody is stuck for ever with the job they fell into at twenty.\",\"answers\":[\"Nadie está atrapado para siempre en el trabajo en el que cayó a los veinte\",\"Nadie se queda para siempre con el trabajo en el que cayó a los veinte\",\"Nadie está condenado para siempre al trabajo en el que cayó a los veinte\"],\"itemIds\":[\"enb1m2jobiappliedfor\"],\"tip\":\"«the job they fell into» — relativo omitido y preposición al final, todo en cuatro palabras. Y «fall into a job» es caer en un trabajo sin haberlo elegido: exactamente lo que dice el español.\"},{\"id\":\"enb1m2l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Explícalo con tus palabras — sin decir «zero» ni «hours»\",\"source\":\"a zero-hours contract\",\"forbid\":[\"zero\",\"hours\"],\"answers\":[\"a contract with no guaranteed work\",\"a contract that guarantees nothing\",\"a contract where you never know how much you will work\",\"a contract with no fixed timetable\"],\"translation\":\"un contrato de cero horas\",\"hints\":[\"Lo que falta es la garantía\",\"a contract with no guaranteed ...\"],\"itemIds\":[\"enb1m2zerohours\"],\"tip\":\"En el examen no puedes buscar la palabra: la rodeas. Y fíjate en que las cuatro respuestas usan una relativa o una preposición detrás del sustantivo — es la gramática del módulo trabajando sola.\"},{\"id\":\"enb1m2l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume el texto completando los relativos\",\"text\":\"Rosa started an apprenticeship ___ she was forty-three, in a trade ___ she knew nothing about. The college ___ she studies is in the east of the city, and the adviser ___ she spoke to says most people retrain because they have to.\",\"answers\":[\"when\",\"which\",\"where\",\"who\"],\"bank\":[\"when\",\"which\",\"where\",\"who\",\"whose\",\"why\"],\"translation\":\"Rosa empezó un contrato de formación cuando tenía cuarenta y tres años, en un oficio del que no sabía nada. La universidad donde estudia está en el este de la ciudad, y el orientador con el que habló dice que la mayoría se recicla porque no le queda otra.\",\"itemIds\":[\"enb1m2daywhen\",\"enb1m2placewhereiwork\",\"enb1m2personwho\"],\"tip\":\"Cuatro relativos y cuatro razones distintas: un momento, una cosa, un sitio y una persona. Los dos últimos huecos, además, llevan la preposición colgada al final («studies… in», «spoke to»).\"},{\"id\":\"enb1m2l6e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The college where she studies in it is in the east.\",\"answers\":[\"The college where she studies is in the east.\"],\"why\":\"«where» ya significa «en el que»: el «in it» del final es el pronombre reasumido del español. Es el mismo error de la lección 2, ahora dentro de un texto largo.\",\"translation\":\"La universidad donde estudia está en el este.\",\"itemIds\":[\"enb1m2placewhereiwork\"]},{\"id\":\"enb1m2l6e8\",\"type\":\"transform\",\"prompt\":\"Junta las dos frases del artículo\",\"source\":\"She spoke to an adviser. He works at a college in the east.\",\"instruction\":\"Únelas con «who», sin repetir «he»\",\"answers\":[\"She spoke to an adviser who works at a college in the east\",\"She spoke to an adviser who works at a college in the east.\"],\"translation\":\"Habló con un orientador que trabaja en una universidad del este.\",\"hints\":[\"El segundo «he» desaparece\",\"She spoke to an adviser who ...\"],\"itemIds\":[\"enb1m2personwho\"],\"tip\":\"Si te sale «an adviser who he works», estás repitiendo el sujeto. Tapa «who» y lee: «___ works at a college». Ya tiene sujeto.\"},{\"id\":\"enb1m2l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Decidí reciclarme porque el trabajo que tenía ya no pagaba el alquiler.\",\"answers\":[\"I decided to retrain because the job I had didn't pay the rent any more\",\"I decided to retrain because the job I had no longer paid the rent\",\"I decided to retrain because the job I had didn't pay the rent anymore\"],\"hints\":[\"retrain = reciclarse profesionalmente\",\"I decided to retrain because the job I had ...\"],\"itemIds\":[\"enb1m2retrain\",\"enb1m1afford\"],\"tip\":\"«the job I had» sin relativo: cuatro palabras que un hispanohablante casi nunca escribe, porque en español el «que» no se puede quitar.\"},{\"id\":\"enb1m2l6e10\",\"type\":\"mc\",\"prompt\":\"Estrategia de las preguntas abiertas\",\"question\":\"En el Reading Part 4, la pregunta es «How old was Rosa?». ¿Qué escribes?\",\"options\":[\"Forty-three\",\"She was forty-three years old when she started the course\",\"About forty, more or less\"],\"answer\":0,\"whyWrong\":[null,\"El límite son tres palabras, y cada palabra de más es un sitio donde el corrector puede encontrar un fallo.\",\"«about» y «more or less» cambian el dato: el texto da una cifra exacta.\"],\"itemIds\":[\"enb1m2skills\"],\"tip\":\"Regla del Part 4: copia del texto, lo más corto posible, y no adornes. El baremo perdona la ortografía dudosa, no la palabra equivocada.\"},{\"id\":\"enb1m2l6e11\",\"type\":\"audiomc\",\"prompt\":\"Listening: un boletín de radio local. Aquí lo oyes una sola vez, a propósito: en el examen se oye dos, así que si aguantas con una, el día del examen vas sobrado.\",\"audio\":\"In business news: figures out this morning show that the number of apprenticeships started in Scotland rose by nine per cent last year, with the sharpest rise among people over forty. Colleges say the growth is being driven by adults leaving hospitality and retail. Unions welcomed the figures but warned that almost half of those who begin an apprenticeship after forty do not finish it, and that the main reason given is money rather than the course itself.\",\"question\":\"¿Qué matizan los sindicatos?\",\"options\":[\"Que casi la mitad de los mayores de cuarenta no terminan, y por dinero\",\"Que las cifras de crecimiento están infladas\",\"Que los cursos son demasiado difíciles para los mayores de cuarenta\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Las cifras las dan por buenas: «welcomed the figures».\",\"Justo lo contrario: dicen que el motivo es el dinero, «rather than the course itself».\"],\"itemIds\":[\"enb1m2apprenticeship\",\"enb1m2income\"],\"tip\":\"«welcomed the figures BUT warned that…»: ese «but» es la señal. En el Listening del B1, la opinión que puntúa casi siempre va detrás de un conector de contraste.\"},{\"id\":\"enb1m2l6e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el consejo de Rosa, en tu boca\",\"text\":\"Find out what the trade pays, ask somebody who is five years ahead of you, and write down the month you will run out of money.\",\"phonetic\":\"faind aut uot de tréid péis̬, aask SÁM-ba-di ju is̬ faiv YÍAS̬ a-JÉD ov yu, and rait daun de manz yu uil ran aut ov MÁ-ni\",\"translation\":\"Averigua lo que paga el oficio, pregunta a alguien que te lleve cinco años de ventaja y apunta el mes en que te vas a quedar sin dinero.\",\"itemIds\":[\"enb1m2somebodywho\",\"enb1m2moneyiearn\"],\"tip\":\"Tres imperativos encadenados y dos relativas dentro. Fíjate en el ritmo: FIND, ASK y WRITE llevan el golpe; todo lo demás pasa de puntillas.\"}]}],\"resources\":[{\"label\":\"Apprenticeships.scot — buscador oficial escocés\",\"url\":\"https://www.apprenticeships.scot/\",\"note\":\"Mira dos o tres ofertas reales: el sueldo, las horas y los requisitos. Es el mismo inglés del artículo, sin adaptar, y en diez minutos ves cuánto entiendes ya.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
