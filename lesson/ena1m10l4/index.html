ebo es la voz que dice el lado contrario.\"},{\"id\":\"ena1m10l4e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Sigue recto y gira a la derecha en el banco\",\"answers\":[\"Go straight on and turn right at the bank\",\"Go straight on and turn right at the bank.\"],\"hints\":[\"Dos órdenes unidas por and\",\"Go straight on and turn ...\"],\"itemIds\":[\"engostraighton\",\"enturnright\",\"enbank\"],\"tip\":\"Dos imperativos y un and: ya das direcciones como un londinense.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m10-3\",\"book\":\"It's very near.\",\"real\":\"It's just round the corner.\",\"meaning\":\"Está a la vuelta de la esquina — cerquísima\",\"when\":\"LA respuesta clásica al preguntar el camino en el Reino Unido. Resérvala para el oído; en el examen di It's near / It's not far.\",\"register\":\"neutral\",\"note\":\"round the corner = doblando la esquina: la distancia favorita de los londinenses (aunque luego sean diez minutos)\",\"sound\":\"its yast ráund de KÓO-na\",\"level\":\"a1\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"conte
