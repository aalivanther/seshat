i\u003e), \u003cb\u003enominalizaciones\u003c/b\u003e (\u003ci\u003ebei der Einfahrt\u003c/i\u003e, \u003ci\u003ezur Abfahrt\u003c/i\u003e) y adverbios largos que dan la información clave: \u003cb\u003eplanmäßig\u003c/b\u003e (según lo previsto), \u003cb\u003evoraussichtlich\u003c/b\u003e (previsiblemente), \u003cb\u003eetwa\u003c/b\u003e (aproximadamente).\u003cbr/\u003e\u003cbr/\u003eEstrategia de examen (Hören Teil 1): en un aviso solo hay \u003cb\u003etres datos\u003c/b\u003e que importan — \u003ci\u003equé tren\u003c/i\u003e, \u003ci\u003equé vía\u003c/i\u003e y \u003ci\u003ecuánto retraso\u003c/i\u003e. Todo lo demás es relleno cortés. Escucha esos tres y deja pasar el resto.\u003cbr/\u003e\u003cbr/\u003eFalso amigo peligroso en este contexto: \u003cb\u003eeventuell\u003c/b\u003e no es «eventualmente» ni «finalmente», significa \u003cb\u003equizá\u003c/b\u003e. «Der Anschluss wird eventuell erreicht» = puede que lo alcances, no que lo alcanzarás al final.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 en formato real: la acompañante del grupo resume el día entero. Texto largo, UNA sola pasada y CINCO tareas seguidas (esta y las cuatro siguientes). Lee las cinco antes de darle al play.\",\"audio\":\"$17\",\"question\":\"Von welchem Gleis fährt der Zug heute ab?\",\"options\":[\"Von Gleis 7\",\"Von Gleis 9\",\"Von Gleis 16\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Gleis 7 es donde está el grupo esperando: justo la vía que ya no vale\",null,\"Las 16:40 son la hora del regional, no una vía\"],\"itemIds\":[\"gleis\",\"b1m9planmaessig\"],\"tip\":\"El truco del examen: el aviso empieza nombrando la vía ANTIGUA. El dato bueno llega con «fährt heute von …». Y en el Teil 2 las cinco tareas van EN EL ORDEN del texto: si tu respuesta está antes que la anterior, te has saltado algo.\"},{\"id\":\"b1m9l7e2\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 2 de 5. Mismo texto, misma pasada.\",\"audio\":\"$18\",\"question\":\"¿Qué se dice sobre el enlace en Basilea?\",\"options\":[\"Er wird sicher erreicht\",\"Er wird vielleicht nicht erreicht\",\"Er fällt heute aus\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«eventuell nicht» no promete nada\",null,\"Ausfallen sería que el tren no circula: no se dice\"],\"itemIds\":[\"b1m9eventuell\",\"b1m9voraussichtlich\",\"b1m9anschlussverpassen\"],\"tip\":\"eventuell = quizá. Si lo lees como «eventualmente/finalmente», entiendes lo contrario de lo que dicen.\"},{\"id\":\"b1m9l7e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 3 de 5. Dos billetes distintos en el mismo viaje. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$19\",\"question\":\"Was gilt für die Fahrt mit dem Tram in Zürich?\",\"options\":[\"Man braucht dafür ein eigenes Billett\",\"Die Fahrkarte für den Zug gilt auch im Tram\",\"Das Tram ist für die Gruppe kostenlos\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El billete de larga distancia ya está picado, pero solo vale para el tren\",\"Gratis no es: «ohne gültiges Billett wird es sehr teuer»\"],\"itemIds\":[\"b1m9billett\",\"b1m9tram\",\"b1m9entwerten\"],\"tip\":\"El helvetismo entra sin avisar: «das Billett» aparece una vez, en medio de la frase, y de él depende el ítem. En el examen los austriacismos y helvetismos van con nota al pie; aquí, con la lección entera de Suiza que ya has hecho.\"},{\"id\":\"b1m9l7e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 4 de 5. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Was passiert mit den Koffern vor fünfzehn Uhr?\",\"options\":[\"Sie werden im Hotel abgestellt\",\"Sie bleiben im Zug\",\"Man nimmt sie mit in die Stadt\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"En el tren no se queda nada: el grupo se baja en Zúrich\",\"Justo lo que pide que NO se haga: «schleppen Sie bitte nicht durch die Stadt»\"],\"itemIds\":[\"b1m9einchecken\",\"b1m9uebernachtung\"],\"tip\":\"«Einchecken erst ab fünfzehn Uhr» y aun así se dejan las maletas: en los hoteles alemanes eso es lo normal y el examen lo da por sabido. Cuando el audio te diga una hora, pregúntate qué se puede hacer ANTES de esa hora.\"},{\"id\":\"b1m9l7e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 5 de 5 — la del final, con su «nicht» escondido. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Wo trifft sich die Gruppe am Abend?\",\"options\":[\"In der Hotellobby\",\"Vor dem Bahnhof\",\"An der Haltestelle Central\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«nicht vor dem Bahnhof»: se nombra solo para descartarlo\",\"El Central es para quien quiera volver antes por su cuenta\"],\"itemIds\":[\"b1m9durchsage\",\"b1m9tram\"],\"tip\":\"Dos lugares seguidos y un «nicht» entre ellos. Quien apunta el primer sustantivo que oye, falla — y en el Teil 2 no hay segunda pasada para corregirlo.\"},{\"id\":\"b1m9l7e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 5 de 5 (información a un grupo). Dos escuchas.\",\"audio\":\"So, einmal alle herhören, bitte! Wir treffen uns um Viertel nach fünf wieder hier an diesem Ausgang, nicht am Bus — der steht dann schon auf der anderen Seite. Wer früher zurückwill, nimmt das Tram Nummer zwei bis zum Bahnhof. Und denken Sie bitte an Ihre Fahrkarte: Sie muss entwertet sein, sonst wird es teuer.\",\"question\":\"Der Treffpunkt am Nachmittag ist der Bus.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Dice «hier an diesem Ausgang, nicht am Bus»: la negación va después, y es la que manda\",null],\"itemIds\":[\"b1m9durchsage\",\"b1m9tram\"],\"tip\":\"La trampa clásica del Teil 1: se nombra primero el sitio equivocado y luego llega el «nicht». Quien apunta el primer sustantivo que oye, falla.\"},{\"id\":\"b1m9l7e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 5, segunda tarea. Mismo audio, dos escuchas.\",\"audio\":\"So, einmal alle herhören, bitte! Wir treffen uns um Viertel nach fünf wieder hier an diesem Ausgang, nicht am Bus — der steht dann schon auf der anderen Seite. Wer früher zurückwill, nimmt das Tram Nummer zwei bis zum Bahnhof. Und denken Sie bitte an Ihre Fahrkarte: Sie muss entwertet sein, sonst wird es teuer.\",\"question\":\"¿Qué ocurre si no picas el billete?\",\"options\":[\"Te sale caro\",\"Te devuelven el dinero\",\"No pasa nada: el tranvía es gratis\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Devolver el dinero no se menciona en ningún momento\",\"Nadie dice que el tranvía sea gratis\"],\"itemIds\":[\"b1m9entwerten\",\"b1m9tram\"],\"tip\":\"«Sie muss entwertet sein» es pasiva de estado: el billete tiene que ESTAR picado, no basta con tenerlo. En Alemania, Austria y Suiza esa distinción cuesta unos sesenta euros.\"},{\"id\":\"b1m9l7e3\",\"type\":\"mc\",\"prompt\":\"El falso amigo\",\"question\":\"„Wir kommen eventuell später an.“\",\"options\":[\"Puede que lleguemos más tarde\",\"Finalmente llegamos más tarde\",\"Llegamos siempre más tarde\"],\"answer\":0,\"whyWrong\":[null,\"«finalmente» sería «schließlich»\",\"«siempre» sería «immer»\"],\"itemIds\":[\"b1m9eventuell\"]},{\"id\":\"b1m9l7e4\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el aviso\",\"text\":\"Der Zug fährt heute von Gleis 9 ab\",\"translation\":\"El tren sale hoy de la vía 9\",\"hints\":[\"Verbo separable: fährt … ab\",\"Der Zug fährt heute von …\"],\"itemIds\":[\"gleis\"]},{\"id\":\"b1m9l7e5\",\"type\":\"shadow\",\"prompt\":\"Sombrea el aviso — pégate a la voz del altavoz\",\"text\":\"Bitte einsteigen und Vorsicht bei der Abfahrt!\",\"phonetic\":\"BI-te AIN-shtai-guen unt FOA-zijt bai dea AP-faart\",\"translation\":\"¡Suban, por favor, y cuidado al arrancar!\",\"reps\":2,\"itemIds\":[\"b1m9bitteeinsteigen\"],\"tip\":\"La melodía de la megafonía es plana y lenta: imítala y entenderás mejor las de verdad.\"},{\"id\":\"b1m9l7e6\",\"type\":\"hearreal\",\"prompt\":\"¿Qué oíste en el andén?\",\"book\":\"Der Zug ist schon weg.\",\"real\":\"Der Zug is' schon weg.\",\"translation\":\"El tren ya se ha ido.\",\"ask\":\"which\",\"itemIds\":[\"b1m9verspaetung\"],\"tip\":\"La -t de «ist» desaparece delante de consonante en el habla rápida: «is' schon weg». Es lo que oirás en el andén, no en el libro.\"},{\"id\":\"b1m9l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa el adverbio de la megafonía\",\"text\":\"Der Zug hat ___ zehn Minuten Verspätung. (previsiblemente)\",\"answers\":[\"voraussichtlich\"],\"translation\":\"El tren lleva previsiblemente diez minutos de retraso.\",\"hints\":[\"Palabra larguísima que empieza por vor…\",\"vor-aus-sicht-lich\"],\"itemIds\":[\"b1m9voraussichtlich\"]},{\"id\":\"b1m9l7e8\",\"type\":\"speak\",\"prompt\":\"Pregunta en la ventanilla — en voz alta\",\"text\":\"Entschuldigung, erreiche ich den Anschluss in Basel noch?\",\"phonetic\":\"ent-SHUL-di-gung, ea-RAI-je ij deen AN-shlus in BAA-zel noj\",\"translation\":\"Perdone, ¿todavía alcanzo el enlace en Basilea?\",\"itemIds\":[\"b1m9anschlussverpassen\",\"b1m9sicherkundigennach\"],\"tip\":\"«noch» al final es la palabra clave: «¿todavía llego?». Sin ella la pregunta suena a examen de horarios.\"},{\"id\":\"b1m9l7e9\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el aviso completo\",\"text\":\"Achtung an Gleis 7: Der ICE nach Wien, ___ Abfahrt 14 Uhr 12, hat ___ zwanzig Minuten Verspätung. Der Zug fährt heute von ___ 9 ab. Der ___ in Linz wird eventuell nicht erreicht.\",\"answers\":[\"planmäßige\",\"voraussichtlich\",\"Gleis\",\"Anschluss\"],\"bank\":[\"planmäßige\",\"voraussichtlich\",\"Gleis\",\"Anschluss\",\"planmäßig\",\"voraussichtliche\",\"Gleise\",\"Durchsage\"],\"translation\":\"Atención en la vía 7: el ICE a Viena, salida prevista a las 14:12, lleva previsiblemente veinte minutos de retraso. El tren sale hoy de la vía 9. Puede que no se alcance el enlace en Linz.\",\"hints\":[\"«p-l-a-n-m-ä-ß-i-g-e Abfahrt»: delante del sustantivo, el adjetivo se declina\",\"«v-o-r-a-u-s-s-i-c-h-t-l-i-c-h» aquí es adverbio: sin terminación\"],\"itemIds\":[\"b1m9planmaessig\",\"b1m9voraussichtlich\",\"gleis\",\"b1m9anschlussverpassen\"],\"tip\":\"Mismo lexema, dos formas: planmäßig (adverbio, sin -e) / planmäßige Abfahrt (adjetivo declinado). El oído del examen lo distingue.\"},{\"id\":\"b1m9l7e10\",\"type\":\"transform\",\"prompt\":\"Del aviso a lo que le cuentas a tu amiga\",\"source\":\"Der Zug hat voraussichtlich zwanzig Minuten Verspätung.\",\"instruction\":\"Dilo como se lo dirías a una amiga por WhatsApp (informal, con «wahrscheinlich»)\",\"answers\":[\"Mein Zug kommt wahrscheinlich zwanzig Minuten später\",\"Mein Zug kommt wahrscheinlich zwanzig Minuten später.\",\"Mein Zug hat wahrscheinlich zwanzig Minuten Verspätung\"],\"translation\":\"Mi tren llega probablemente veinte minutos más tarde.\",\"hints\":[\"Empieza por «Mein Zug …»\",\"kommt … später\"],\"itemIds\":[\"b1m9verspaetung\"],\"tip\":\"Cambiar de registro sin cambiar de información es criterio evaluable en el examen (Wortschatz y Erfüllung).\"},{\"id\":\"b1m9l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El tren sale hoy de la vía 9 y lleva veinte minutos de retraso.\",\"answers\":[\"Der Zug fährt heute von Gleis 9 ab und hat zwanzig Minuten Verspätung\",\"Heute fährt der Zug von Gleis 9 ab und hat zwanzig Minuten Verspätung\",\"Der Zug fährt heute von Gleis 9 ab und er hat zwanzig Minuten Verspätung\"],\"hints\":[\"Separable: fährt … ab\",\"… und hat zwanzig Minuten Ver…\"],\"itemIds\":[\"gleis\",\"b1m9verspaetung\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m9-4\",\"book\":\"Weißt du, wann der nächste Zug kommt?\",\"real\":\"Weißte, wann der nächste kommt?\",\"meaning\":\"¿Sabes cuándo viene el próximo (tren)?\",\"when\":\"En el andén, con gente de confianza. A un desconocido, al revisor o en la ventanilla, nunca: «weißte» y comerse el sustantivo suenan a mala educación.\",\"register\":\"amigos\",\"exam\":\"Könnten Sie mir bitte sagen, wann der nächste Zug fährt?\",\"note\":\"«weißt du» se funde en «weißte», y «der nächste» se queda solo porque el tren ya está en el aire. En el examen no se recorta nada: se pregunta con el Konjunktiv II de cortesía de la lección 4.\",\"sound\":\"VAIS-te, van dea NEEJS-te komt\",\"level\":\"b1\",\"produce\":false}}],\"resources\":[{\"label\":\"DW — Langsam gesprochene Nachrichten\",\"url\":\"https://learngerman.dw.com/de/nachrichten/s-33393\",\"note\":\"Noticias leídas despacio: el mismo registro plano de la megafonía, pero con transcripción.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1c:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1c\",\"6\",{}]]\n"])</script></body></html>
