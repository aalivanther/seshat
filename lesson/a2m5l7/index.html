!“\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: neu = nuevo · leer = vacío · überall = por todas partes · hilft = ayuda (helfen) · Stell! = ¡pon! (imperativo de stellen, como Geh!) · sitzt = está sentado/a (sitzen) · lacht = ríe (lachen)\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"a2m5l7\",\"phaseId\":\"a2m5\",\"title\":\"Nicos neues Zimmer\",\"subtitle\":\"Mini-cuento — la mudanza de Nico, del caos a lo acogedor\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Dos piezas nuevas para el cuento\",\"itemIds\":[\"a2m5gemuetlich\",\"a2m5chaos\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Nicos neues Zimmer\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m5l7e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 1)\",\"question\":\"„Nicos neues Zimmer ist klein.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Relee la frase 1: «Sein neues Zimmer ist groß, aber leer»\",null],\"itemIds\":[\"a2m3umgezogen\",\"gross\",\"klein\"]},{\"id\":\"a2m5l7e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 4)\",\"question\":\"¿Dónde pone Anna la lámpara?\",\"options\":[\"Al lado de la cama\",\"Sobre la mesa\",\"En la estantería\"],\"answer\":0,\"whyWrong\":[null,\"La mesa no aparece — relee la frase 4: «neben das Bett»\",\"A la estantería van los libros (frase 7), no la lámpara\"],\"itemIds\":[\"a2m5stellen\",\"lampe\",\"bett\"]},{\"id\":\"a2m5l7e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 10)\",\"question\":\"¿Dónde está el móvil de Nico?\",\"options\":[\"Debajo de un cartón\",\"Sobre la cama\",\"En el sofá\"],\"answer\":0,\"whyWrong\":[null,\"En la cama está Nico (frase 9), no el móvil\",\"En el sofá está sentada Anna (frase 9)\"],\"itemIds\":[\"a2m3handy\",\"a2m5karton\",\"a2m5unter\"],\"tip\":\"El módulo empieza y acaba con la misma pregunta: Wo ist mein Handy? — y ahora entiendes cada respuesta.\"},{\"id\":\"a2m5l7e4\",\"type\":\"cloze\",\"prompt
