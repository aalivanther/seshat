lothes are far cheaper and they last just as long.\u003c/i\u003e\u003cbr/\u003e4. \u003cb\u003eRematas\u003c/b\u003e: \u003ci\u003eSmall changes do make a difference.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOjo con un falso amigo de manual:\u003c/b\u003e \u003ci\u003eTo be honest\u003c/i\u003e no es «para ser honesto» en el sentido español de decir la verdad bajo juramento. Es «la verdad es que…», y sirve para suavizar algo un poco incómodo: \u003ci\u003eTo be honest, I don't do enough.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY una cosa que el examen mira sin decirlo: \u003cb\u003e«I agree» tres veces seguidas es pobreza de vocabulario\u003c/b\u003e. Con estas cuatro fórmulas nunca tienes que repetirlo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l8\",\"phaseId\":\"enb1m8\",\"title\":\"You've got a point\",\"subtitle\":\"Dar la razón a medias es lo que más sube la nota — y la carta a Emma\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas de la concesión\",\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8itakeyourpoint\",\"enb1m8thewayiseeit\",\"enb1m8makeadifference\",\"enb1m8tobehonest\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué conceder un punto puntúa más que tener razón\",\"body\":\"$17\",\"table\":[[\"Fórmula\",\"Registro\",\"Para qué\"],[\"You've got a point.\",\"hablando\",\"conceder rápido y seguir\"],[\"Fair enough.\",\"hablando\",\"aceptar y cerrar el tema\"],[\"I take your point, but…\",\"examen · escrito\",\"conceder y girar\"],[\"The way I see it, …\",\"los dos\",\"abrir tu opinión sin repetir «I think»\"],[\"To be honest, …\",\"los dos\",\"suavizar algo incómodo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las fórmulas con su función\",\"pairs\":[{\"target\":\"You've got a point.\",\"source\":\"Algo de razón tienes.\"},{\"target\":\"I take your point, but the price is the problem.\",\"source\":\"Entiendo lo que dices, pero el problema es el precio.\"},{\"target\":\"The way I see it, we all have to start somewhere.\",\"source\":\"Tal y como yo lo veo, todos tenemos que empezar por algo.\"},{\"target\":\"To be honest, I don't do enough.\",\"source\":\"Si te soy sincera, no hago lo suficiente.\"}],\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8itakeyourpoint\",\"enb1m8thewayiseeit\",\"enb1m8tobehonest\"],\"tip\":\"Las cuatro son fórmulas fijas: se aprenden enteras, no palabra a palabra. En el oral salen solas y te compran dos segundos para pensar lo que viene después.\"},{\"id\":\"enb1m8l8e2\",\"type\":\"mc\",\"prompt\":\"Conceder, no rendirse\",\"question\":\"Alguien te dice: «Second-hand clothes are dirty». ¿Cuál concede y luego gira?\",\"options\":[\"No, you're wrong.\",\"I take your point, but everything in a charity shop is washed first.\",\"Yes, I agree.\"],\"answer\":1,\"whyWrong\":[\"Cierra la conversación en tres palabras y, en el Speaking Part 3, el examinador anota que no hubo negociación.\",null,\"Aquí no estás de acuerdo: estás dándole la razón sin más y perdiendo tu turno.\"],\"itemIds\":[\"enb1m8itakeyourpoint\",\"enb1m8charityshop\"],\"tip\":\"El molde es siempre el mismo: reconoces algo verdadero de lo que dice el otro y después metes tu dato. La palabra bisagra es «but» o «however».\"},{\"id\":\"enb1m8l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula\",\"text\":\"I take your ___, but the price is the problem.\",\"answers\":[\"point\"],\"translation\":\"Entiendo lo que dices, pero el problema es el precio.\",\"hints\":[\"La misma palabra que en «You've got a…»\",\"p...\"],\"itemIds\":[\"enb1m8itakeyourpoint\",\"enb1m8youvegotapoint\"],\"tip\":\"«Point» es la palabra clave del inglés de opinión: you've got a point, I take your point, the point is that, that's a good point. Cinco expresiones por el precio de una palabra.\"},{\"id\":\"enb1m8l8e4\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «agree» y sin «yes»\",\"source\":\"Yes, I agree with you.\",\"forbid\":[\"agree\",\"yes\"],\"answers\":[\"You've got a point\",\"That's a good point\",\"Fair enough\",\"I take your point\"],\"translation\":\"Sí, estoy de acuerdo contigo.\",\"hints\":[\"Cuatro salidas, y todas llevan la misma palabra clave menos una\",\"You've got a ...\"],\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8natfairenough\"],\"tip\":\"Repetir «I agree» es lo que el examen llama vocabulario limitado. Cambiarlo cuesta cuatro palabras y sube un criterio entero.\"},{\"id\":\"enb1m8l8e5\",\"type\":\"order\",\"prompt\":\"Ordena el párrafo de opinión: concesión, giro, razón, remate\",\"sentences\":[\"I take your point that a repair morning is not going to change much.\",\"However, three hundred things a year do not end up in a skip.\",\"And the people who come learn to ask a question they never asked before.\",\"The way I see it, small changes do make a difference.\"],\"translation\":\"«Entiendo lo que dices: una mañana de reparaciones no va a cambiar gran cosa. · Sin embargo, trescientas cosas al año no acaban en un contenedor. · Y la gente que viene aprende a hacerse una pregunta que antes no se hacía. · Tal y como yo lo veo, los cambios pequeños sí que cuentan.»\",\"itemIds\":[\"enb1m8itakeyourpoint\",\"enb1m8however\",\"enb1m8thewayiseeit\",\"enb1m8makeadifference\"],\"tip\":\"Cuatro frases, cuatro trabajos: conceder, girar, sostener, rematar. Ese es el párrafo que el Writing quiere ver, y no hay más misterio.\"},{\"id\":\"enb1m8l8e6\",\"type\":\"transform\",\"prompt\":\"Sube el registro de la concesión\",\"source\":\"You've got a point.\",\"instruction\":\"Dilo como lo escribirías en el examen, y gira con «but»\",\"answers\":[\"I take your point, but the price is the problem\",\"I take your point, but…\",\"I take your point, but the price is still the problem\"],\"translation\":\"Entiendo lo que dices, pero el problema es el precio.\",\"hints\":[\"La versión de examen empieza por «I take…»\",\"I take your point, but ...\"],\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8itakeyourpoint\"],\"tip\":\"«You've got a point» es de conversación; «I take your point» es de examen y de correo de trabajo. Dicen lo mismo y no se pueden intercambiar sin que se note.\"},{\"id\":\"enb1m8l8e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la discusión del intercambio de ropa\",\"text\":\"Ben: Nobody wants clothes that somebody else has worn.\\nValeria: You've got a ___. Some people don't. ___, half the coats there were better than anything I can afford new. And to be ___, most of mine come from a charity shop anyway.\",\"answers\":[\"point\",\"However\",\"honest\"],\"bank\":[\"point\",\"However\",\"honest\",\"reason\",\"Although\",\"true\"],\"translation\":\"Ben: Nadie quiere ropa que ya se ha puesto otro. · Valeria: Algo de razón tienes. Alguna gente no la quiere. Sin embargo, la mitad de los abrigos de allí eran mejores que cualquier cosa que yo pueda pagar nueva. Y si te soy sincera, casi toda la mía viene de una tienda solidaria.\",\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8however\",\"enb1m8tobehonest\",\"enb1m8charityshop\"],\"tip\":\"«You've got a reason» no existe en inglés: se dice «a point». Y «Although» no cabe en el segundo hueco porque va detrás de un punto, que es justo lo que «however» sí admite.\"},{\"id\":\"enb1m8l8e8\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, quiere montar un intercambio de ropa en su trabajo y está a punto de dejarlo. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! We're starting a clothes swap at work and everyone thinks I'm mad. Is it actually worth it? And what am I supposed to do with the stuff nobody takes? Tell me honestly — I don't want to spend three Saturdays on something pointless. Emma\"},\"bullets\":[\"Dile qué te parece la idea, y concede el punto de quien duda.\",\"Compara el intercambio con comprar ropa nueva, con un matizador delante del comparativo.\",\"Contéstale a lo de la ropa que sobra y propón algo concreto.\"],\"checks\":[{\"re\":\"(you'?re not mad|good idea|worth it|you'?ve got a point|fair enough|i take your point)\",\"label\":\"Le dices qué te parece y concedes el punto de quien duda\"},{\"re\":\"(far|much|a lot|way) (cheaper|better|greener)\",\"label\":\"Comparas con un matizador delante del comparativo\"},{\"re\":\"(charity shop|take (it|them) to|why don'?t you|you could|give (it|them) to)\",\"label\":\"Contestas a lo que sobra y propones algo\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea que la tranquilice\",\"La concesión: «Fair enough, three Saturdays is a lot…»\",\"Tu experiencia, en dos frases: dónde, cuándo, qué te llevaste\",\"La comparación con un matizador: «far cheaper», «much better»\",\"Qué hacer con lo que sobra: la tienda solidaria del lunes\",\"Cierre corto y tu nombre a secas. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"even though\",\"though\",\"however\",\"besides\",\"anyway\",\"actually\",\"at least\",\"for instance\",\"while\",\"otherwise\",\"therefore\",\"instead of\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nYou're not mad. Fair enough, three Saturdays is a lot, and the first one is always chaos — I'll give you that.\\nEven though it sounds like hard work, it works. We did one in a church hall last spring and I came home with a coat that would have cost forty pounds new. Second-hand clothes are far cheaper, and they're greener too. Besides, you meet half the building.\\nAnyway, the leftovers are the easy bit. Actually, whatever nobody takes, you take to a charity shop on the Monday. Ours took everything except the shoes.\\nDo it, and send me a photo of the coat you find.\\nValeria\",\"itemIds\":[\"enb1m8natfairenough\",\"enb1m8eventhough\",\"enb1m8farcheaper\",\"enb1m8secondhand\",\"enb1m8charityshop\",\"enb1m3anyway\",\"enb1m3actually\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo — cuatro marcadores distintos (Even though, Besides, Anyway, Actually), un matizador delante del comparativo («far cheaper») y ni un «Yours sincerely». Meter la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro, y es de los errores que más se ven.\"},{\"id\":\"enb1m8l8e9\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"You've got a reason.\",\"answers\":[\"You've got a point.\"],\"why\":\"«Tener razón» no se dice con «reason» en esta fórmula: se dice «have a point» (algo de razón) o «be right» (tener razón del todo). «You've got a reason» significaría «tienes un motivo».\",\"translation\":\"Algo de razón tienes.\",\"itemIds\":[\"enb1m8youvegotapoint\"]},{\"id\":\"enb1m8l8e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Si te soy sincera, no hago lo suficiente.\",\"answers\":[\"To be honest, I don't do enough\",\"To be honest I don't do enough\",\"To be honest, I do not do enough\"],\"hint\":\"Empieza por la fórmula que suaviza lo incómodo\",\"itemIds\":[\"enb1m8tobehonest\"],\"tip\":\"«enough» aquí va detrás del verbo y sin nada delante: «I don't do enough». Es la tercera posición de «enough» y la más fácil de las tres.\"},{\"id\":\"enb1m8l8e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa?\",\"source\":\"The way I see it, small changes do make a difference.\",\"answers\":[\"Tal y como yo lo veo, los cambios pequeños sí que cuentan\",\"Desde mi punto de vista, los cambios pequeños sí marcan la diferencia\"],\"itemIds\":[\"enb1m8thewayiseeit\",\"enb1m8makeadifference\"],\"tip\":\"Ese «do» delante de «make» no es un auxiliar de pregunta: es el «sí que» del español, un refuerzo. «Small changes DO make a difference» = «los cambios pequeños SÍ cuentan».\"},{\"id\":\"enb1m8l8e12\",\"type\":\"speak\",\"prompt\":\"Di el molde entero en voz alta: concesión, giro, razón\",\"text\":\"I take your point, but second-hand clothes are far cheaper, and they last just as long.\",\"phonetic\":\"ai teik yoo póint, bat SÉ-kond-jánd klóudz̬ aa faa CHÍI-pa, and déi laast dchast as̬ long\",\"translation\":\"Entiendo lo que dices, pero la ropa de segunda mano es muchísimo más barata y dura lo mismo.\",\"itemIds\":[\"enb1m8itakeyourpoint\",\"enb1m8secondhand\",\"enb1m8farcheaper\"],\"tip\":\"Fíjate en la pausa después de «point»: es la que hace que la concesión suene sincera. Sin pausa, «I take your point but» suena a una sola palabra y a que no has escuchado.\"},{\"id\":\"enb1m8l8e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Algo de razón tienes, pero los cambios pequeños sí que cuentan.\",\"answers\":[\"You've got a point, but small changes do make a difference\",\"You have got a point, but small changes do make a difference\",\"You've got a point, but small changes make a difference\"],\"hints\":[\"La fórmula de conceder lleva «point», no «reason»\",\"You've got a ..., but small changes ... a difference\"],\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8makeadifference\"],\"tip\":\"Conceder y girar en doce palabras. Guárdatela: es la frase que vas a decir en el Speaking Part 3 hagas el examen que hagas.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m8-4\",\"book\":\"I agree.\",\"real\":\"Fair enough. / You've got a point.\",\"meaning\":\"Vale, tienes razón / algo de razón tienes\",\"when\":\"Hablando, con cualquiera. «Fair enough» acepta y cierra el tema —es lo que dices cuando dejas de discutir sin darle del todo la razón al otro—, y «You've got a point» concede a medias y te deja seguir hablando. En el Writing formal no se escriben: allí va la versión larga, que además suena a que has pensado la respuesta.\",\"register\":\"amigos\",\"exam\":\"I couldn't agree more.\",\"note\":\"«Fair enough» es literalmente «bastante justo», y ahí está todo: no dices que el otro tenga razón, dices que lo que ha dicho es razonable. Por eso sirve para cerrar una discusión sin que nadie pierda. Ojo con no confundirla con «I take your point, but…», que verás más adelante en este mismo módulo: esa concede y GIRA hacia un desacuerdo — no es un sinónimo de acuerdo.\",\"sound\":\"féa i-NÁF / yuv got a póint\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m8natfairenough\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
