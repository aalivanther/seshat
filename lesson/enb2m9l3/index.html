 poner \u003ci\u003eit had been\u003c/i\u003e, que pide un adjetivo (\u003ci\u003eit had been cold\u003c/i\u003e), no un suceso.\u003cbr/\u003e\u003cbr/\u003eY la relativa de frase entera, que no describe un nombre: describe \u003cb\u003etodo lo que acaba de pasar\u003c/b\u003e. Va con coma. [[…, which proved invaluable|…, lo cual resultó inestimable]]. Sin coma, \u003ci\u003ewhich\u003c/i\u003e se come un nombre de detrás y cambia de significado."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l3\",\"phaseId\":\"enb2m9\",\"title\":\"Rather than wait, we hired a car\",\"subtitle\":\"La alternativa, el como si, y el there had been que el B1 no tocó\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tres moldes que el B1 no tenía\",\"itemIds\":[\"enb2m9ratherthanwait\",\"enb2m9ratherthandriving\",\"enb2m9asifnothing\",\"enb2m9asthoughclosed\",\"enb2m9therehadbeen\",\"enb2m9therehadbeenno\",\"enb2m9natwhichproved\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres piezas, tres trabajos distintos\",\"body\":\"$17\",\"table\":[[\"Molde\",\"Qué hace\",\"Lo que no es\"],[\"rather than + wait / waiting\",\"elige B y descarta A\",\"rather than to wait\"],[\"as if / as though + past perfect\",\"compara con lo irreal\",\"as if + presente en un relato\"],[\"there had been + suceso\",\"el suceso ya había ocurrido\",\"it had been a landslide\"],[\", which + evaluación\",\"comenta la FRASE entera\",\"which sin coma (eso describe un nombre)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m9l3e1\",\"type\":\"match\",\"prompt\":\"Empareja cada molde nuevo\",\"pairs\":[{\"target\":\"Rather than wait, we hired a car.\",\"source\":\"En vez de esperar, alquilamos un coche.\"},{\"target\":\"It looked as if nothing had happened.\",\"source\":\"Parecía como si no hubiera pasado nada.\"},{\"target\":\"There had been a landslide on the line.\",\"source\":\"Había habido un desprendimiento en la vía.\"},{\"target\":\"There had
