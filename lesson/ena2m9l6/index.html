neighbourhood is quiet and there's a park near here. I like it a lot, but the rent is expensive.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl vocabulario de la casa compartida que hace falta:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[We share a flat.|Compartimos piso.]]\u003c/b\u003e — con artículo. \u003ci\u003eWe share flat\u003c/i\u003e ❌ es calco directo de «compartimos piso».\u003cbr/\u003e· \u003cb\u003e[[I pay the rent on the first.|Pago el alquiler el día uno.]]\u003c/b\u003e — \u003ci\u003erent\u003c/i\u003e es el alquiler; el verbo \u003ci\u003eto rent\u003c/i\u003e es alquilar.\u003cbr/\u003e· \u003cb\u003e[[Our landlord lives upstairs.|Nuestro casero vive arriba.]]\u003c/b\u003e — \u003ci\u003elandlord\u003c/i\u003e (él) / \u003ci\u003elandlady\u003c/i\u003e (ella). Y \u003ci\u003eupstairs\u003c/i\u003e, \u003ci\u003edownstairs\u003c/i\u003e van solos: \u003ci\u003elives in upstairs\u003c/i\u003e ❌.\u003cbr/\u003e· \u003cb\u003e[[our next-door neighbour|nuestro vecino de al lado]]\u003c/b\u003e — y \u003ci\u003ethe neighbours upstairs\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003e[[A letter came for you.|Te ha llegado una carta.]]\u003c/b\u003e — el correo que llega al piso.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos cosas británicas que conviene saber ya:\u003c/b\u003e\u003cbr/\u003e1. Se dice \u003cb\u003eflat\u003c/b\u003e, no \u003ci\u003eapartment\u003c/i\u003e (eso es americano).\u003cbr/\u003e2. La planta baja es el \u003cb\u003eground floor\u003c/b\u003e, y el \u003cb\u003efirst floor\u003c/b\u003e es lo que en España es el primero. Si quedas con alguien «on the first floor», hay que subir un piso."])</script><script>self.__next_f.push([1,"18:T497,Valeria and Amy share a flat in North London. The building is small — three flats and a shop downstairs — and it has its own rules. Nobody wrote them down. You learn them.\u003cbr/\u003e\u003cbr/\u003eRule one: the [[bins|los cubos de basura]] go out on Tuesday night, not on Wednesday morning. The man from the ground floor puts his out on Monday, and everybody else pretends not to notice.\u003cbr/\u003e\u003cbr/\u003eRule two: the washing machine belongs to their flat, but the [[drying rack|el tendedero]] in the hall belongs to everybody. If you leave your clothes on it for two days, somebody moves them. Nobody says anything to you. They just move them.\u003cbr/\u003e\u003cbr/\u003eRule three: Nora, their neighbour, has a key to their flat. Amy gave it to her three years ago, after she left her own keys inside twice in one month. Nora has never used it, but she waters the plants when they go away and she always tells them who came to the door.\u003cbr/\u003e\u003cbr/\u003eValeria likes these rules. In Bogotá she lived with her family and the rules were her mother's: this is the hour, this is the plate, this is the seat. Here nobody tells her what she has to do, so she has to work it out herself. Most of the time she gets it right."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l6\",\"phaseId\":\"ena2m9\",\"title\":\"Where I live\",\"subtitle\":\"El piso, el alquiler, el casero y los vecinos — segunda pasada\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de una casa compartida\",\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m9ipaytherentonthefirst\",\"ena2m9ourlandlordlivesupstairs\",\"ena2m9nextdoorneighbour\",\"ena2m9alettercameforyou\",\"enflatmate\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Describir dónde vives: el guion de tres bloques\",\"body\":\"$17\",\"table\":[[\"en español\",\"en inglés\",\"el calco a evitar\"],[\"Compartimos piso.\",\"We share a flat.\",\"We share flat.\"],[\"Pago el alquiler el día uno.\",\"I pay the rent on the first.\",\"I pay the rent the first.\"],[\"El casero vive arriba.\",\"Our landlord lives upstairs.\",\"…lives in upstairs.\"],[\"Te ha llegado una carta.\",\"A letter came for you.\",\"It came a letter for you.\"],[\"la planta baja\",\"th ta el último piso\"],\"answer\":0,\"whyWrong\":[null,\"La planta baja es el ground floor. El first floor está ya un piso por encima\",\"Ese sería el top floor\"],\"itemIds\":[\"ena2m9ourlandlordlivesupstairs\"],\"tip\":\"En Estados Unidos el «first floor» sí es la planta baja, y de ahí viene medio lío. El curso enseña británico: ground · first · second.\"},{\"id\":\"ena2m9l6e8\",\"type\":\"gapbank\",\"prompt\":\"El piso de Valeria y Amy — rellena con la palabra del banco\",\"text\":\"Valeria and Amy ___ a flat in North London. They pay the ___ on the first of the month, and their ___ lives upstairs.\",\"answers\":[\"share\",\"rent\",\"landlord\"],\"bank\":[\"share\",\"rent\",\"landlord\",\"neighbour\",\"letter\",\"kitchen\"],\"translation\":\"Valeria y Amy comparten piso en el norte de Londres. Pagan el alquiler el día uno del mes y su casero vive arriba.\",\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m9ipaytherentonthefirst\",\"ena2m9ourlandlordlivesupstairs\"],\"tip\":\"Ojo al segundo hueco: «rent» aquí es sustantivo (el alquiler). Como verbo, «to rent» es alquilar — y va sin the.\"},{\"id\":\"ena2m9l6e9\",\"type\":\"build\",\"prompt\":\"Construye la frase del vecino\",\"target\":\"Our next-door neighbour is very quiet\",\"translation\":\"Nuestro vecino de al lado es muy tranquilo\",\"distractors\":[\"ours\",\"of\"],\"itemIds\":[\"ena2m9nextdoorneighbour\",\"ena2m3quietly\"],\"tip\":\"Sobra «ours» porque delante de un sustantivo va «our», y sobra «of» porque el genitivo inglés no lo usa con personas.\"},{\"id\":\"ena2m9l6e10\",\"type\":\"audiomc\",\"prompt\":\"Un recado del casero — 2 escuchas\",\"audio\":\"Hello, it's your landlord. I'm coming on Friday morning to look at the window in the kitchen. A letter came for you as well, I've left it downstairs.\",\"question\":\"¿Para qué viene el viernes?\",\"options\":[\"Para mirar la ventana de la cocina\",\"Para traer una carta\",\"Para cobrar el alquiler\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La carta ya está  flat?\",\"options\":[\"Because Amy locked her own keys inside twice in one month\",\"Because Nora asked for one when they arrived\",\"Because Nora looks after the shop downstairs\"],\"answer\":0,\"why\":\"«Amy gave it to her three years ago, after she left her own keys inside twice in one month». Las plantas son lo que Nora hace con la llave, no la razón por la que la tiene.\"},{\"id\":\"ena2m9l6e13q4\",\"q\":\"Why does the writer repeat 'They just move them'?\",\"options\":[\"Because in this building people correct each other without talking about it\",\"Because the neighbours are angry with Valeria and Amy\",\"Because the drying rack is always broken\"],\"answer\":0,\"inference\":true,\"why\":\"La frase de al lado es «Nobody says anything to you». Las dos juntas dicen cómo funciona el sitio: se corrige, no se discute.\"},{\"id\":\"ena2m9l6e13q5\",\"q\":\"Why does Valeria like the rules of the building?\",\"options\":[\"Because for the first time she works out for herself how to live\",\"Because they are the same rules she had in Bogotá\",\"Because her mother explained them to her\"],\"answer\":0,\"inference\":true,\"why\":\"El contraste está en el último párrafo: en Bogotá las reglas eran de su madre; aquí «nobody tells her what she has to do». Lo que le gusta no son las reglas, es quién las decide.\"}],\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m9nextdoorneighbour\",\"ena2m9choresgroup\",\"ena2m9itsyourturn\"],\"tip\":\"Tercera lectura larga del nivel, y ya con tres preguntas de inferencia de cinco. En el examen son siete preguntas sobre un texto de este tamaño, y la mitad no están escritas en ninguna línea: se deducen juntando dos frases.\"},{\"id\":\"ena2m9l6e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Compartimos piso y pagamos el alquiler el día uno. Nuestro casero vive arriba.\",\"answers\":[\"We share a flat and we pay the rent on the first. Our landlord lives upstairs.\",\"We share a flat and pay the rent on the first. Our landlord lives upstairs.\",\"We share a flat and we pay the rent on the first of the month. Our landlord lives upstairs.\"],\"hints\":[\"Artículo en «share a flat» y nada delante de «upstairs»\",\"We share a… flat and we pay the r… on the first. Our landlord lives u…\"],\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m9ipaytherentonthefirst\",\"ena2m9ourlandlordlivesupstairs\"],\"tip\":\"Tres frases y las tres trampas del bloque: el artículo, el sustantivo rent y el adverbio upstairs sin preposición.\"}]}],\"resources\":[{\"label\":\"British Council — A2 Speaking: describing where you live\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca la unidad de «my home» y escucha cómo se organiza la respuesta. Cronométrate: un minuto sobre tu casa, con los tres bloques de la nota.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"s
