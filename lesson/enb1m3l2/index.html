\u003e«I'm tired»\u003c/i\u003e → \u003ci\u003ehe said he \u003cb\u003ewas\u003c/b\u003e tired\u003c/i\u003e\u003cbr/\u003e• pasado o present perfect → \u003cb\u003epast perfect\u003c/b\u003e: \u003ci\u003e«I saw him»\u003c/i\u003e / \u003ci\u003e«I've seen him»\u003c/i\u003e → \u003ci\u003eshe said she \u003cb\u003ehad seen\u003c/b\u003e him\u003c/i\u003e\u003cbr/\u003e• \u003ci\u003ewill\u003c/i\u003e → \u003cb\u003ewould\u003c/b\u003e · \u003ci\u003ecan\u003c/i\u003e → \u003cb\u003ecould\u003c/b\u003e · \u003ci\u003emay\u003c/i\u003e → \u003cb\u003emight\u003c/b\u003e · \u003ci\u003emust\u003c/i\u003e → \u003cb\u003ehad to\u003c/b\u003e\u003cbr/\u003e• el past perfect ya no retrocede más: se queda donde está.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY hay un paso más que el español no da\u003c/b\u003e: los \u003cb\u003emarcadores de tiempo y lugar\u003c/b\u003e también se mueven, porque los dices desde otro día y desde otro sitio.\u003cbr/\u003e\u003ci\u003eyesterday\u003c/i\u003e → \u003cb\u003ethe day before\u003c/b\u003e · \u003ci\u003etomorrow\u003c/i\u003e → \u003cb\u003ethe next day\u003c/b\u003e · \u003ci\u003etoday\u003c/i\u003e → \u003cb\u003ethat day\u003c/b\u003e · \u003ci\u003enow\u003c/i\u003e → \u003cb\u003ethen\u003c/b\u003e · \u003ci\u003ehere\u003c/i\u003e → \u003cb\u003ethere\u003c/b\u003e · \u003ci\u003ethis\u003c/i\u003e → \u003cb\u003ethat\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuándo NO hace falta retroceder.\u003c/b\u003e Si lo que se dijo \u003cb\u003esigue siendo verdad\u003c/b\u003e —o si el verbo de decir está en presente (\u003ci\u003ehe says…\u003c/i\u003e)—, puedes dejarlo tal cual: \u003ci\u003eShe said the café \u003cb\u003eopens\u003c/b\u003e at seven\u003c/i\u003e (y sigue abriendo a las siete). Las dos versiones son correctas; retroceder es siempre seguro, y en el examen es lo que se espera."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l2\",\"phaseId\":\"enb1m3\",\"title\":\"One step back\",\"subtitle\":\"El tiempo verbal retrocede un paso — y esto, por una vez, el español ya lo hace\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que dijeron, contado después\",\"itemIds\":[\"enb1m3shesaidshewasliving\",\"enb1m3hesaidhehadseen\",\"enb1m3shesaidshewouldcall\",\"enb1m3thedaybefore\",\"enb1m3thenextday\",\"enb1m3itturnedout\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: un paso atrás, y la buena noticia\",\"body\":\"$17\",\"table\":[[\"Lo que dijo\",\"Contado después\"],[\"«I'm living in Leeds.»\",\"She said she was living in Leeds.\"],[\"«I saw the film.»\",\"He said he had seen the film.\"],[\"«I'll call you back.»\",\"She said she would call me back.\"],[\"«I can come on Friday.»\",\"He said he could come on Friday.\"],[\"«I must go now.»\",\"She said she had to go then.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l2e1\",\"type\":\"mc\",\"prompt\":\"Lo primero, para no aprenderlo del revés\",\"question\":\"¿Por qué en inglés «He said he was tired» va en pasado?\",\"options\":[\"Porque el verbo de decir va en pasado y lo de detrás retrocede un paso — igual que en español.\",\"Porque en inglés no existe el presente después de «said».\",\"Porque el español no concuerda tiempos y el inglés sí.\"],\"answer\":0,\"whyWrong\":[null,\"Sí existe: si lo dicho sigue siendo verdad, «He said he is tired» también es correcto.\",\"Justo al revés de lo que dice la gramática: «dijo que estaba cansado» concuerda igual que el inglés.\"],\"itemIds\":[\"enb1m3hesaidhewastired\"],\"tip\":\"Esto conviene tenerlo claro desde el principio: el desplazamiento NO es tu problema. Tus dos problemas de verdad son «said me» y la inversión de las preguntas referidas, y los dos tienen lección propia.\"},{\"id\":\"enb1m3l2e2\",\"type\":\"bucket\",\"prompt\":\"¿A qué tiempo retrocede cada uno?\",\"categories\":[\"Presente → Pasado\",\"Pasado / perfecto → Past perfect\"],\"items\":[{\"text\":\"«She is tired» → she was tired\",\"bucket\":0},{\"text\":\"«I work at the café» → he worked at the café\",\"bucket\":0},{\"text\":\"«I saw him» → he had seen him\",\"bucket\":1},{\"text\":\"«I've finished» → she had finished\",\"bucket\":1},{\"text\":\"«We are waiting» → they were waiting\",\"bucket\":0},{\"text\":\"«I went home» → he had gone home\",\"bucket\":1},{\"text\":\"«It costs four pounds» → it cost four pounds\",\"bucket\":0},{\"text\":\"«I have never been» → she had never been\",\"bucket\":1}],\"itemIds\":[\"enb1m3hesaidhehadseen\",\"enb1m3shesaidshewasliving\"],\"tip\":\"Fíjate en que el pasado simple y el present perfect acaban en el MISMO sitio: had + participio. Por eso en estilo indirecto se pierde la diferencia entre «I saw him» y «I've seen him»: las dos se cuentan igual.\"},{\"id\":\"enb1m3l2e3\",\"type\":\"transform\",\"prompt\":\"Del estilo directo al indirecto\",\"source\":\"«I'm living in Leeds,» she said.\",\"instruction\":\"Cuéntalo con «She said…»\",\"answers\":[\"She said she was living in Leeds\",\"She said that she was living in Leeds\"],\"translation\":\"Dijo que estaba viviendo en Leeds.\",\"hints\":[\"El presente continuo retrocede un paso\",\"She said she ... in Leeds\"],\"itemIds\":[\"enb1m3shesaidshewasliving\"],\"tip\":\"«am living» → «was living»: el continuo también retrocede, y se queda continuo. Lo que cambia es el auxiliar, no la forma en -ing.\"},{\"id\":\"enb1m3l2e4\",\"type\":\"transform\",\"prompt\":\"Del estilo directo al indirecto\",\"source\":\"«I've seen the film,» he said.\",\"instruction\":\"Cuéntalo con «He said…»\",\"answers\":[\"He said he had seen the film\",\"He said that he had seen the film\",\"He said he'd seen the film\"],\"translation\":\"Dijo que había visto la película.\",\"hints\":[\"El present perfect retrocede al past perfect\",\"He said he ... the film\"],\"itemIds\":[\"enb1m3hesaidhehadseen\"],\"tip\":\"En el habla real casi siempre oirás «he'd seen»: el «had» se reduce a un soplo. Escríbelo entero en el examen y reconócelo reducido al oírlo.\"},{\"id\":\"enb1m3l2e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She said she will call me back.\",\"answers\":[\"She said she would call me back.\"],\"why\":\"El verbo de decir está en pasado, así que «will» retrocede a «would». Con «She says she will call me back» sí valdría el futuro, porque el decir es de ahora.\",\"translation\":\"Dijo que me devolvería la llamada.\",\"itemIds\":[\"enb1m3shesaidshewouldcall\"]},{\"id\":\"enb1m3l2e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She said she has finished the report.\",\"answers\":[\"She said she had finished the report.\"],\"why\":\"El present perfect («has finished») retrocede al past perfect («had finished») cuando el verbo de decir va en pasado. Es el mismo paso atrás, solo que empezando desde el perfecto.\",\"translation\":\"Dijo que había terminado el informe.\",\"itemIds\":[\"enb1m3hesaidhehadseen\"]},{\"id\":\"enb1m3l2e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que contó Amy\",\"text\":\"Amy rang me from the hospital. She said she ___ be late, because a colleague ___ asked her to stay. She also told me she ___ already spoken to Sam, and that she ___ come to the café on Friday if her shift finished early.\",\"answers\":[\"would\",\"had\",\"had\",\"could\"],\"bank\":[\"would\",\"had\",\"could\",\"was\",\"has\",\"did\"],\"translation\":\"Amy me llamó desde el hospital. Dijo que llegaría tarde porque una compañera le había pedido que se quedara. También me dijo que ya había hablado con Sam y que podría pasarse por el café el viernes si su turno terminaba pronto.\",\"itemIds\":[\"enb1m3shesaidshewouldcall\",\"enb1m3hesaidhehadseen\",\"enb1m3askedmetocall\"],\"tip\":\"Cuatro huecos, cuatro pasos atrás: will→would, asked→had asked, has spoken→had spoken, can→could. En cuanto veas «She said…», todo lo de detrás retrocede.\"},{\"id\":\"enb1m3l2e8\",\"type\":\"hearreal\",\"prompt\":\"¿Qué significa lo que oyes? El inglés hablado se traga el auxiliar\",\"book\":\"He said that he would call.\",\"real\":\"He said he'd call.\",\"translation\":\"Dijo que llamaría.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Dijo que llamaría\",\"Dijo que había llamado\",\"Dice que llamará\"],\"itemIds\":[\"enb1m3shesaidshewouldcall\"],\"tip\":\"Ese «'d» puede ser «would» o «had», y aquí es «would» porque detrás va un infinitivo sin «to» («call»). Si detrás fuera un participio («called»), sería «had». Es la única pista, y es fiable.\"},{\"id\":\"enb1m3l2e9\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar\",\"text\":\"He told me he ___ seen the film twice.\",\"answers\":[\"had\",\"'d\"],\"translation\":\"Me dijo que había visto la película dos veces.\",\"hints\":[\"Detrás va un participio («seen»)\",\"El pasado de «have»\"],\"itemIds\":[\"enb1m3hesaidhehadseen\",\"entwice\"]},{\"id\":\"enb1m3l2e10\",\"type\":\"mc\",\"prompt\":\"Los marcadores también se mueven\",\"question\":\"El lunes Sam dijo: «I'll ring you tomorrow.» El miércoles lo cuentas. ¿Cómo?\",\"options\":[\"He said he would ring me the next day.\",\"He said he would ring me tomorrow.\",\"He said he will ring me the day before.\"],\"answer\":0,\"whyWrong\":[null,\"«tomorrow» sigue apuntando a mañana desde HOY, y el martes ya pasó: el oyente entendería otra cosa.\",\"Dos fallos: «will» sin retroceder y «the day before», que apunta hacia atrás.\"],\"itemIds\":[\"enb1m3thenextday\",\"enb1m3thedaybefore\"],\"tip\":\"Lo cuentas desde otro día, así que las palabras del calendario también dan un paso atrás: yesterday→the day before, tomorrow→the next day, today→that day, now→then.\"},{\"id\":\"enb1m3l2e11\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo. (Lo cuenta una semana después.)\",\"wrong\":\"On Monday she told me she would call me tomorrow.\",\"answers\":[\"On Monday she told me she would call me the next day.\"],\"why\":\"«tomorrow» significa «mañana contando desde hoy», y el lunes ya pasó. Contado después, se dice «the next day»: el día siguiente a aquel.\",\"translation\":\"El lunes me dijo que me llamaría al día siguiente.\",\"itemIds\":[\"enb1m3thenextday\"]},{\"id\":\"enb1m3l2e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Resultó que tenía razón.\",\"answers\":[\"It turned out that he was right\",\"It turned out he was right\",\"It turned out that she was right\",\"It turned out she was right\"],\"hint\":\"Empieza por «It turned…»\",\"itemIds\":[\"enb1m3itturnedout\"],\"tip\":\"«It turned out (that)…» es la frase con la que se cierran las historias de rumores, y la vas a usar en la lectura de la lección 6 y en la carta de la 8. Guárdatela.\"},{\"id\":\"enb1m3l2e13\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"She said she would call me back the next day.\",\"translation\":\"Dijo que me devolvería la llamada al día siguiente.\",\"hints\":[\"Empieza por «She said she…»\",\"She said she would ... the next day\"],\"itemIds\":[\"enb1m3shesaidshewouldcall\",\"enb1m3thenextday\"],\"tip\":\"Fíjate en el ritmo: SAID, CALL, BACK y NEXT llevan el golpe; «she», «would» y «the» pasan de puntillas. Si esperas oír «would» fuerte y claro, no lo vas a oír nunca.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\
