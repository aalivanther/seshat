Herkunft einer Zeitung ist keine Dekoration. Wer uns bittet, «allgemeinverständlich» zu schreiben, meint oft: schreibt, wie man in Hamburg schreibt. Das Vorurteil dahinter ist alt: das Österreichische als gemütliche Abweichung, der Berliner Satz als Norm.\n\nDas Klischee vom Wiener, der nur Kaffeehaus kann, hält sich, weil es bequem ist. Es entlastet den Leser in München von der Mühe, eine zweite Norm ernst zu nehmen. Plurizentrisch wäre das Gegenteil: die Stiege stehen lassen und dem Leser die Fußnote zumuten. Wer das für unzumutbar hält, unterschätzt sein Publikum.\n\nIch bin nicht naiv. Im Goethe-Zertifikat B2 würde ich Treppe schreiben. Das ist ein anderer Vertrag: eine Prüfung mit einer Produktionsnorm. Eine Tageszeitung ist kein Exam. Wer beides in denselben Topf wirft, missversteht den Unterschied zwischen Zugehörigkeit und Bewertung.\n\nEin Bub* aus dem 10. Bezirk, der im Spital* liegt, hat ein Recht darauf, in seiner Zeitung die Wörter zu finden, mit denen er die Welt benennt. Das Sackerl* unter der Überschrift ist kein folkloristisches Extra. Es ist der Satz, in dem er sich erkennt. Die Prägung durch diese Wörter ist keine Schwäche des Textes. Sie ist sein Ort.\n\nWas ich der deutschen Redaktion vorwerfe, ist nicht die Fußnote. Es ist die Idee, dass die Fußnote uns entschuldigt. Wir müssen uns nicht entschuldigen. Wir müssen lesbar bleiben und trotzdem wir. Das ist machbar. Es ist nur verhältnismäßig unbequem für den, der eine einzige Norm für den ganzen deutschen Sprachraum halten will.\n\nEine Redewendung wie «das geht sich aus» muss man nicht in Hamburg erklären, um sie in Wien stehen zu lassen. Man muss sie glosieren, wenn der Text die Grenze kreuzt. Das ist Höflichkeit. Es ist nicht die Pflicht, den Satz vorher in Januar und Treppe umzubauen. Wer das verlangt, verwechselt Verständlichkeit mit Vereinheitlichung. Und Vereinheitlichung ist, höflich gesagt, ein Vorurteil mit gutem Gewissen.\n\n*Stiege = Treppe · *Jänner = Januar · *Paradeiser = Tomate · *heuer = dieses Jahr · *Bub = Junge (Süddeutschland, AT, CH) · *Spital = Krankenhaus · *Sackerl = Tüte"])</script><script>self.__next_f.push([1,"18:Tb14,"])</script><script>self.__next_f.push([1,"Eva Pichler hat recht in einem Satz und unrecht in der Folgerung. Ja: die Herkunft darf man hören. Nein: eine Zeitung, die über die Kantonsgrenze hinaus will, schreibt nicht so, als gäbe es nur Wien. In der Schweiz haben wir das an der eigenen Haut. Wir schreiben Strasse* ohne ß, wir fahren Velo*, die Mutter sagt noch Natel*, das RAV* ist nicht die Arbeitsagentur. Das ist unsere Norm. Und trotzdem weiss ich, wann ich Straße schreibe.\n\nDer Vertrag heisst: drinnen die eigene Standardvarietät, nach aussen die Form, die den anderen nicht als Fussnote zumutet, was er nicht bestellt hat. Das ist kein Verrat an der Zugehörigkeit. Es ist Höflichkeit plus Klarheit. Wer in einer Berner Kolumne Ermässigung* schreibt, hat recht. Wer dieselbe Ermässigung in einen Goethe-Forumsbeitrag setzt, hat das Register verfehlt — nicht die Identität.\n\nDas Klischee vom Schweizer, der nur Dialekt kann und kein Hochdeutsch, ist das Gegenstück zum Wiener Kaffeehaus. Beide entlasten den Aussenstehenden. Beide sind falsch. Die Prägung durch Mundart zerstört die Standardsprache nicht. Sie erklärt, warum unser Sprachgefühl woanders tickt. Ableiten kann man trotzdem: wer ver- und ent- kennt, liest auch einen Satz, in dem Rahm* vorkommt, ohne zu stürzen.\n\nPichlers Bub im Spital hat recht auf seine Wörter. Mein Nachbar im Tram* auch. Die Frage ist, vor welchem Publikum. Eine lokale Redaktion, die Stiege stehen lässt, handelt richtig. Eine Prüfung, die eine Produktionsnorm setzt, auch. Beides in denselben Topf zu werfen ist der Fehler, den Pichler den Deutschen vorwirft — nur in die andere Richtung.\n\nIch gehe davon aus, dass wir uns einig sind, sobald die Textsorte klar ist. Kolumne in Bern: Helvetismus, ohne ß, ohne Entschuldigung. Vortrag im Goethe: Standarddeutsch, Straße, Januar, Treppe. Die Wortbildung gilt in beiden. Die Fußnote gilt für den Leser, nicht als Lizenz für den Schreiber, der eine andere Norm unterschrieben hat.\n\nWas sich einbürgern soll, ist nicht die eine Wortliste. Es ist die Fähigkeit, das Register zu wechseln, ohne die Herkunft zu verleugnen. Das ist geläufig, sobald man es übt. Es ist verbreitet unter Leuten, die wirklich über Grenzen schreiben. Und es ist die einzige Haltung, die den Goethe B2 und eine Berner Kolumne gleichzeitig ernst nimmt.\n\nNoch ein Satz zur Tram und zum Rahm, weil sie in diesen Debatten als Souvenir auftauchen: Ich fahre Tram, ich esse Rahm, ich schreibe das hier. Morgen, im Forumsbeitrag, schreibe ich Straßenbahn und Sahne. Nicht weil Bern falsch wäre. Weil der Vertrag ein anderer ist. Wer das als Verrat liest, hat die Textsorte nicht gelesen.\n\n*Strasse = Straße (in der Schweiz gibt es kein ß) · *Velo = Fahrrad · *Natel = Handy · *RAV = schweiz. Arbeitsvermittlung · *Ermässigung = Ermäßigung · *Rahm = Sahne · *Tram = Straßenbahn"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m10l6\",\"phaseId\":\"b2m10\",\"title\":\"Wien sagt, Bern sagt\",\"subtitle\":\"Dos textos, dos normas, una sola producción — y se contradicen\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Identidad, tópico y glosa\",\"itemIds\":[\"b2m10herkunft\",\"b2m10praegung\",\"b2m10vorurteil\",\"b2m10klischee\",\"b2m10zugehoerigkeit\",\"b2m10fussnote\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El plurizentrismo de B2 no es una lista de curiosidades\",\"body\":\"En B1 bastaba glosar cinco palabras al pie. En B2 el nivel pide variación de \u003cb\u003enorma y registro\u003c/b\u003e. Los dos textos de abajo no son un diccionario: son dos posturas. Una vienesa defiende escribir la norma austriaca también hacia fuera. Una suiza defiende marcar la pertenencia en el habla y el estándar alemán en lo que cruza fronteras — y nombra el Goethe por su nombre.\u003cbr/\u003e\u003cbr/\u003eLee las [[Fußnoten|notas al pie]] como las leerías en el examen. Y al escribir la respuesta, \u003cb\u003eestándar alemán\u003c/b\u003e: Januar, Treppe, Straße.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m10l6e1\",\"type\":\"read\",\"prompt\":\"Texto austriaco. Las glosas van al pie, como en el examen. Reconoce; no copies la norma al escrito.\",\"title\":\"Unsere Wörter sind keine Fußnote\",\"source\":\"Mag. Eva Pichler, Kommentar, Wien\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m10l6e1q1\",\"q\":\"Was wirft Pichler deutschen Verlagen vor?\",\"options\":[\"Dass sie zu viele Fußnoten setzen.\",\"Dass sie Wiener Texte glätten und Austriazismen wie Dialekt behandeln.\",\"Dass sie das Goethe-Zertifikat ablehnen.\"],\"answer\":1,\"why\":\"El primer párrafo: la editorial «alisa» y la nota al pie trata el austriacismo como chiste dialectal.\"},{\"id\":\"b2m10l6e1q2\",\"q\":\"Was würde Pichler im Goethe B2 schreiben?\",\"options\":[\"Stiege, um Haltung zu zeigen.\",\"Treppe, weil die Prüfung eine andere Produktionsnorm hat.\",\"Nichts zum Thema Treppe.\"],\"answer\":1,\"why\":\"«Im Goethe-Zertifikat B2 würde ich Treppe schreiben. Das ist ein anderer Vertrag.»\"},{\"id\":\"b2m10l6e1q3\",\"q\":\"Welches Vorurteil benennt der Text?\",\"options\":[\"Dass Wiener nicht schreiben können.\",\"Dass das Österreichische eine gemütliche Abweichung sei und der Berliner Satz die Norm.\",\"Dass die Fußnote verboten gehört.\"],\"answer\":1,\"inference\":true,\"why\":\"No dice «los alemanes son arrogantes»: dice que «allgemeinverständlich» a menudo significa «como en Hamburgo» y que lo austriaco se toma por desviación cómoda.\"},{\"id\":\"b2m10l6e1q4\",\"q\":\"Warum erwähnt Pichler das Spital und das Sackerl?\",\"options\":[\"Als Folklore für deutsche Leser.\",\"Als Wörter, in denen ein Bub aus dem 10. Bezirk sich erkennt.\",\"Als Beispiele für Dialekt, den man meiden soll.\"],\"answer\":1,\"why\":\"«hat ein Recht darauf, in seiner Zeitung die Wörter zu finden, mit denen er die Welt benennt.»\"},{\"id\":\"b2m10l6e1q5\",\"q\":\"Welche Haltung hat der Text zur Fußnote?\",\"options\":[\"Sie soll verschwinden.\",\"Sie ist erträglich; unerträglich ist, dass sie uns «entschuldigt».\",\"Sie ist die Lösung des plurizentrischen Problems.\"],\"answer\":1,\"inference\":true,\"why\":\"«Was ich vorwerfe, ist nicht die Fußnote. Es ist die Idee, dass die Fußnote uns entschuldigt.» Hay que inferir: la glosa vale, la disculpa no.\"}],\"itemIds\":[\"b2m10austriazismus\",\"b2m10zugehoerigkeit\",\"b2m10vorurteil\",\"b2m10fussnote\",\"b2m10produktion\"],\"tip\":\"Pichler no te pide que escribas Stiege en el Goethe. Te pide que no trates Stiege como un error. Son dos operaciones distintas, y el módulo vive de no mezclarlas.\"},{\"id\":\"b2m10l6e2\",\"type\":\"read\",\"prompt\":\"Texto suizo, sin ß. Contrasta con Pichler: misma lengua, otra frontera.\",\"title\":\"Die Norm, die über die Grenze geht\",\"source\":\"Sibylle Graf, Kolumne, Bern\",\"text\":\"$18\",\"questions\":[{\"id\":\"b2m10l6e2q1\",\"q\":\"Worin gibt Graf Pichler recht?\",\"options\":[\"In der Forderung, im Goethe Stiege zu schreiben.\",\"Darin, dass man die Herkunft hören darf.\",\"Darin, dass die Fußnote uns entschuldigt.\"],\"answer\":1,\"why\":\"«Ja: die Herkunft darf man hören. Nein: …»\"},{\"id\":\"b2m10l6e2q2\",\"q\":\"Welche Regel nennt Graf für den Goethe-Forumsbeitrag?\",\"options\":[\"Helvetismus ohne ß, um ehrlich zu bleiben.\",\"Standarddeutsch: Straße, Januar, Treppe.\",\"Amtsdeutsch, weil die Prüfung eine Behörde ist.\"],\"answer\":1,\"why\":\"«Vortrag im Goethe: Standarddeutsch, Straße, Januar, Treppe.» Y antes: poner Ermässigung en el foro es fallar el registro.\"},{\"id\":\"b2m10l6e2q3\",\"q\":\"Was meint Graf mit «drinnen / nach aussen»?\",\"options\":[\"Dialekt zu Hause, Amtsdeutsch im Büro.\",\"En casa la variedad estándar propia; hacia fuera, la forma que no obliga al otro a una nota al pie no pedida.\",\"Solo se escribe alemán de Alemania.\"],\"answer\":1,\"inference\":true,\"why\":\"El contrato que formula en el segundo párrafo: variedad propia hacia adentro, forma común hacia fuera. No es «rendirse», es cortesía más claridad.\"},{\"id\":\"b2m10l6e2q4\",\"q\":\"Warum erwähnt Graf das RAV und das Natel?\",\"options\":[\"Als Beweis, dass Schweizerdeutsch unverständlich ist.\",\"Als Beispiele ihrer Norm, die trotzdem nicht die Produktionsnorm des Goethe sind.\",\"Als Wörter, die man im Exam produzieren soll.\"],\"answer\":1,\"why\":\"Los nombra como «unsere Norm» y acto seguido dice cuándo escribe Straße.\"},{\"id\":\"b2m10l6e2q5\",\"q\":\"Worin widersprechen sich Pichler und Graf am schärfsten?\",\"options\":[\"In der Frage, ob der Goethe eine Produktionsnorm hat.\",\"In der Frage, ob una Zeitung que cruza fronteras debe alisar hacia la norma alemana.\",\"In der Frage, ob es in der Schweiz ein ß gibt.\"],\"answer\":1,\"inference\":true,\"why\":\"Las dos aceptan que el Goethe tiene norma de producción. El choque es el periódico: Pichler quiere dejar Stiege hacia fuera; Graf quiere no imponer una nota al pie a quien no la ha pedido.\"}],\"itemIds\":[\"b2m10helvetismus\",\"b2m10strassech\",\"b2m10natel\",\"b2m10rav\",\"b2m10sicheinbuergern\"],\"tip\":\"Graf no niega a Pichler la pertenencia. Le niega que el periódico y el examen sean el mismo contrato. Si en tu resumen las mezclas, has fallado el resumen-sin-copiar que viene en el m11.\"},{\"id\":\"b2m10l6e3\",\"type\":\"mc\",\"prompt\":\"El dato que las dos comparten\",\"question\":\"Pichler y Graf coinciden en que…\",\"options\":[\"En el Goethe B2 se produce estándar alemán\",\"Una gaceta vienesa debe escribir Januar\",\"El dialecto no existe\"],\"answer\":0,\"whyWrong\":[null,\"Pichler dice lo contrario para el periódico\",\"Nadie dice eso\"],\"itemIds\":[\"b2m10produktion\",\"b2m10standardsprache\"]},{\"id\":\"b2m10l6e4\",\"type\":\"gapbank\",\"prompt\":\"Resume el desacuerdo sin copiar la norma regional\",\"text\":\"Pichler will den ___ in der Zeitung stehen lassen. Graf will nach aussen die ___ nutzen. Die ___ erklärt dem Leser das Wort; sie ist keine Lizenz für den Schreiber.\",\"answers\":[\"Austriazismus\",\"Standardsprache\",\"Fußnote\"],\"bank\":[\"Austriazismus\",\"Standardsprache\",\"Fußnote\",\"Mundart\",\"Kumpel\",\"Jänner\"],\"translation\":\"Pichler quiere dejar los austriacismos en el periódico. Graf quiere usar el estándar hacia fuera. Las dos aceptan en el Goethe el estándar alemán. La nota al pie le explica la palabra al lector; no es licencia para quien escribe.\",\"itemIds\":[\"b2m10standardsprache\",\"b2m10fussnote\",\"b2m10austriazismus\"]},{\"id\":\"b2m10l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin «Zugehörigkeit»\",\"source\":\"Die Herkunft einer Zeitung ist keine Dekoration.\",\"forbid\":[\"Herkunft\",\"Dekoration\"],\"answers\":[\"Wo eine Zeitung herkommt, ist kein Schmuck.\",\"Der Ort einer Zeitung ist kein Extra.\"],\"translation\":\"De dónde sale un periódico no es un adorno.\",\"itemIds\":[\"b2m10herkunft\",\"b2m10zugehoerigkeit\"]},{\"id\":\"b2m10l6e6\",\"type\":\"errorfix\",\"prompt\":\"Al resumir, produces estándar — también si el original era suizo\",\"wrong\":\"Graf schreibt in ihrer Kolumne Strasse und im Exam Strasse.\",\"answers\":[\"Graf schreibt in ihrer Kolumne Strasse und im Exam Straße.\",\"Graf schreibt in der Kolumne Strasse und im Exam Straße\"],\"why\":\"Un solo cambio: la ß del examen. El original suizo se cita como Strasse; tu producción, y la de Graf en el Goethe, es Straße. Si copias las dos iguales, has perdido el punto del módulo.\",\"translation\":\"Graf escribe Strasse en su columna y Straße en el examen.\",\"itemIds\":[\"b2m10strassech\",\"b2m10produktion\"]},{\"id\":\"b2m10l6e7\",\"type\":\"type\",\"prompt\":\"Cierre de las dos lecturas\",\"question\":\"Se produce alemán estándar; los austriacismos se reconocen\",\"answers\":[\"Man schreibt Standardsprache; Austriazismen erkennt man\",\"Man schreibt Standardsprache; Austriazismen erkennt man.\",\"Im Schreiben gilt die Standardsprache; Austriazismen erkennt man\"],\"itemIds\":[\"b2m10produktion\",\"b2m10austriazismus\",\"b2m10standardsprache\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m10-3\",\"book\":\"die Straße\",\"real\":\"die Strasse\",\"meaning\":\"la calle — en Suiza no hay ß\",\"when\":\"Lo lees en cualquier texto suizo (cartel, prensa, web federal). Lo escribes en el Goethe con ß: Straße. Copiar Strasse en el Forumsbeitrag no te hace «más suizo»: te hace descuidado con la norma que has firmado al matricularte.\",\"register\":\"regional\",\"exam\":\"die Straße\",\"note\":\"CANON: en Suiza no existe la ß (Ermässigung, Strasse, gross). Los jóvenes suizos no son un museo: escriben así en su norma, y Handy les sale tan natural como Natel a su madre.\",\"sound\":\"di SHTRAA-se\",\"level\":\"b2\",\"produce\":false,\"itemId\":\"b2m10strassech\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",
