><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l4\",\"phaseId\":\"b1m1\",\"title\":\"Der Vertrag, den ich unterschreibe\",\"subtitle\":\"Relativsätze en Akkusativ — y quién manda el caso de verdad\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El contrato y sus verbos\",\"itemIds\":[\"b1m1mietvertrag\",\"b1m1unterschreiben\",\"b1m1diewohnungdieichsuche\",\"b1m1dervertragdenichunterschreibe\",\"b1m1sichanmelden\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el caso lo manda la oración de DENTRO\",\"body\":\"$17\",\"table\":[[\"frase\",\"función DENTRO\",\"caso\",\"relativo\"],[\"der Vertrag, ___ auf dem Tisch liegt\",\"sujeto (él yace)\",\"Nominativ\",\"der\"],[\"der Vertrag, ___ ich unterschreibe\",\"objeto (yo lo firmo)\",\"Akkusativ\",\"den\"],[\"die Wohnung, ___ ich suche\",\"objeto (yo la busco)\",\"Akkusativ\",\"die (=igual)\"],[\"das Zimmer, ___ ich gesehen habe\",\"objeto (yo lo vi)\",\"Akkusativ\",\"das (=igual)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l4e1\",\"type\":\"mc\",\"prompt\":\"¿Hace o recibe la acción?\",\"question\":\"„Das ist der Vertrag, ___ ich gestern unterschrieben habe.“\",\"options\":[\"der\",\"den\"],\"answer\":1,\"whyWrong\":[\"«der» sería si el contrato hiciera algo; aquí el que firma soy yo\",null],\"itemIds\":[\"b1m1dervertragdenichunterschreibe\",\"b1m1mietvertrag\"],\"tip\":\"Dentro de la relativa el sujeto ya está ocupado por «ich». Al contrato solo le queda ser objeto → den.\"},{\"id\":\"b1m1l4e2\",\"type\":\"mc\",\"prompt\":\"Mismo sustantivo, otra frase\",\"question\":\"„Das ist der Vertrag, ___ auf dem Tisch liegt.“\",\"options\":[\"der\",\"den\"],\"answer\":0,\"whyWrong\":[null,\"«den» es objeto; aquí no hay otro sujeto: el contrato es el que yace\"],\"itemIds\":[\"b1m1mietvertrag\"],\"tip\":\"Mismo antecedente, distinto relativo. Prueba de que el caso NO lo decide el sustantivo de fuera.\"},{\"id\":\"b1m1l4e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿el antecedente hace la acción o la recibe?\",\"categories\":[\"HACE la acción → der\",\"RECIBE la acción → den\"],\"items\":[{\"text\":\"der Nachbar, ___ mir geholfen hat\",\"bucket\":0},{\"text\":\"der Nachbar, ___ ich gefragt habe\",\"bucket\":1},{\"text\":\"der Vermieter, ___ den Vertrag schickt\",\"bucket\":0},{\"text\":\"der Vertrag, ___ der Vermieter schickt\",\"bucket\":1},{\"text\":\"der Mieter, ___ vor mir hier wohnte\",\"bucket\":0},{\"text\":\"der Schlüssel, ___ ich verloren habe\",\"bucket\":1}],\"itemIds\":[\"b1m1vermieter\",\"b1m1mieter\",\"b1m1mietvertrag\"],\"tip\":\"Fíjate en el par 3 y 4: las mismas dos palabras, el orden cambiado, y el relativo cambia con ellas. Solo la forma decide.\"},{\"id\":\"b1m1l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa el relativo\",\"text\":\"Die Wohnung, ___ ich suche, hat zwei Zimmer.\",\"answers\":[\"die\"],\"translation\":\"El piso que busco tiene dos habitaciones.\",\"hints\":[\"d-i-e Wohnung es femenino\",\"En femenino, Nominativ y Akkusativ son iguales\"],\"itemIds\":[\"b1m1diewohnungdieichsuche\",\"wohnung\"],\"tip\":\"Aquí el relativo es objeto (yo busco el piso), pero en femenino la forma no cambia: die. Por eso el masculino es el único examen real.\"},{\"id\":\"b1m1l4e5\",\"type\":\"gapbank\",\"prompt\":\"Completa con der o den\",\"text\":\"Das ist der Vermieter, ___ mir die Wohnung gezeigt hat. Und das ist der Vertrag, ___ ich morgen unterschreibe. Der Schlüssel, ___ er mir gegeben hat, passt nicht.\",\"answers\":[\"der\",\"den\",\"den\"],\"bank\":[\"der\",\"den\",\"die\",\"das\",\"dem\",\"dass\"],\"translation\":\"Ese es el casero que me enseñó el piso. Y ese es el contrato que firmo mañana. La llave que me dio no encaja.\",\"itemIds\":[\"b1m1vermieter\",\"b1m1mietvertrag\",\"b1m1unterschreiben\"],\"tip\":\"Busca el sujeto de cada relativa: si ya hay uno (ich, er), el relativo es objeto → den.\"},{\"id\":\"b1m1l4e6\",\"type\":\"transform\",\"prompt\":\"Une las dos frases\",\"source\":\"Das ist der Mietvertrag. Ich habe den Mietvertrag gestern unterschrieben.\",\"instruction\":\"Únelas con un relativo\",\"answers\":[\"Das ist der Mietvertrag, den ich gestern unterschrieben habe\"],\"translation\":\"Ese es el contrato que firmé ayer.\",\"hints\":[\"«den Mietvertrag» ya está en acusativo: el relativo hereda el caso\",\"..., den ich gestern ... habe\"],\"itemIds\":[\"b1m1mietvertrag\",\"b1m1unterschreiben\"],\"tip\":\"Truco de producción: mira el caso que tenía el sustantivo en la segunda frase y cópialo en el relativo.\"},{\"id\":\"b1m1l4e7\",\"type\":\"build\",\"prompt\":\"Construye con relativo en acusativo\",\"target\":\"Die Wohnung, die ich gesehen habe, war zu teuer\",\"translation\":\"El piso que vi era demasiado caro\",\"distractors\":[\"dass\",\"sehen\"],\"itemIds\":[\"b1m1diewohnungdieichsuche\",\"wohnung\"],\"tip\":\"Ojo a la coma de cierre: la relativa va EN MEDIO y se cierra con coma antes de seguir la principal.\"},{\"id\":\"b1m1l4e8\",\"type\":\"cloze\",\"prompt\":\"Completa el trámite\",\"text\":\"Nach dem Umzug muss ich mich beim Bürgeramt ___.\",\"answers\":[\"anmelden\"],\"translation\":\"Después de la mudanza tengo que empadronarme en el Bürgeramt.\",\"hints\":[\"El verbo del empadronamiento\",\"sich an|melden — el infinitivo va entero al final\"],\"itemIds\":[\"b1m1sichanmelden\",\"a2m5umzug\"],\"tip\":\"Con modal, el separable vuelve a juntarse y se va al final: muss ... anmelden.\"},{\"id\":\"b1m1l4e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Das ist der Vertrag, den ich unterschreibe\",\"translation\":\"Ese es el contrato que firmo\",\"hints\":[\"Masculino y objeto → den\",\"Das ist der Vertrag, ...\"],\"itemIds\":[\"b1m1dervertragdenichunterschreibe\"]},{\"id\":\"b1m1l4e10\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«El vecino al que pregunté no estaba en casa» →\",\"options\":[\"Der Nachbar, der ich gefragt habe, war nicht zu Hause\",\"Der Nachbar, den ich gefragt habe, war nicht zu Hause\"],\"answer\":1,\"whyWrong\":[\"El sujeto de la relativa es «ich»: el vecino recibe la pregunta → den\",null],\"itemIds\":[\"a2m4nachbarin\"],\"tip\":\"Elegir «der» porque el vecino es masculino es EL error del nivel. El género se copia; el caso se calcula dentro.\"},{\"id\":\"b1m1l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El piso que busco tiene que ser barato\",\"answers\":[\"Die Wohnung, die ich suche, muss günstig sein\",\"Die Wohnung, die ich suche, muss billig sein\"],\"hints\":[\"Relativa en medio, entre dos comas\",\"Die Wohnung, die ich suche, muss ...\"],\"itemIds\":[\"b1m1diewohnungdieichsuche\",\"guenstig\"],\"tip\":\"Relativa intercalada + modal al final de la principal: esta frase sola ya vale un punto de Strukturen en el examen.\"},{\"id\":\"b1m1l4e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1, mensaje 4 · tarea 1 de 2. Ojo al orden de los pasos. Dos escuchas.\",\"audio\":\"Frau Marín, hier spricht Kaltenbach. Also, der Mietvertrag ist fertig, den können Sie ab Montag bei mir unterschreiben. Die Kaution — drei Kaltmieten, wie besprochen — überweisen Sie bitte erst, wenn Sie unterschrieben haben, ähm, nicht vorher. Und bringen Sie Ihren Ausweis mit, ohne geht es nicht.\",\"question\":\"„Sofía soll die Kaution vor der Unterschrift überweisen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«erst, wenn Sie unterschrieben haben … nicht vorher»: primero se firma, luego se paga\",null],\"itemIds\":[\"b1m1kaution\",\"b1m1mietvertrag\",\"b1m1unterschreiben\"],\"tip\":\"«erst, wenn …» = no antes de que. Cuando la afirmación juega con el orden de los hechos, escucha «erst», «vorher» y «danach».\"},{\"id\":\"b1m1l4e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Frau Marín, hier spricht Kaltenbach. Also, der Mietvertrag ist fertig, den können Sie ab Montag bei mir unterschreiben. Die Kaution — drei Kaltmieten, wie besprochen — überweisen Sie bitte erst, wenn Sie unterschrieben haben, ähm, nicht vorher. Und bringen Sie Ihren Ausweis mit, ohne geht es nicht.\",\"question\":\"¿Qué tiene que llevar Sofía el lunes?\",\"options\":[\"El documento de identidad\",\"Tres nóminas\",\"El contrato ya firmado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las nóminas no se mencionan\",\"El contrato lo tiene la casera; se firma allí\"],\"itemIds\":[\"b1m1mietvertrag\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m1-2\",\"book\":\"Die Wohnung ist sehr teuer.\",\"real\":\"Die Wohnung ist voll teuer.\",\"meaning\":\"El piso es carísimo\",\"when\":\"Entre amigos y sobre todo entre menores de 35. Con la casera, en un correo o en el examen, «voll» te tira el registro abajo: allí, sehr / ziemlich / extrem — o directamente una fórmula de opinión.\",\"register\":\"jerga\",\"exam\":\"Die Wohnung ist meiner Meinung nach viel zu teuer.\",\"note\":\"«voll» sustituye a «sehr» en el habla juvenil: voll gut, voll nett, voll teuer. Lo oirás cien veces en cualquier WG.\",\"sound\":\"dii VOO-nung ist fol TOI-a\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m1natvollteuer\"}}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (B1)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra por B1 y busca «Relativpronomen»: ejercicios de der/den con corrección automática.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}
