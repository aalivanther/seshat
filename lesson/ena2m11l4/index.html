chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T63e,"])</script><script>self.__next_f.push([1,"Igual que \u003ci\u003ewill\u003c/i\u003e, \u003ci\u003emight\u003c/i\u003e y \u003ci\u003emay\u003c/i\u003e son \u003cb\u003emodales\u003c/b\u003e, así que entran enteros en la regla que traes del módulo 7: \u003cb\u003esin \u003ci\u003edo\u003c/i\u003e, sin \u003ci\u003e-s\u003c/i\u003e y sin \u003ci\u003eto\u003c/i\u003e\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[It might rain.|A lo mejor llueve.]]\u003c/b\u003e — nunca \u003ci\u003eIt might to rain\u003c/i\u003e, nunca \u003ci\u003eIt mights rain\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eNegativa: \u003ci\u003emight not\u003c/i\u003e\u003c/b\u003e, y aquí \u003cb\u003eno hay contracción\u003c/b\u003e que valga: se escribe entero. \u003ci\u003e[[I might not come.|Puede que no vaya.]]\u003c/i\u003e — nunca \u003ci\u003eI don't might come\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003e[[It may be cold later.|Puede que haga frío luego.]]\u003c/b\u003e — \u003ci\u003emay\u003c/i\u003e es el mismo significado un peldaño más formal. En un parte del tiempo o en un aviso escrito verás \u003ci\u003emay\u003c/i\u003e; hablando con Amy dirás \u003ci\u003emight\u003c/i\u003e.\u003cbr/\u003e· Igual para todas las personas: \u003ci\u003eI might · she might · they might\u003c/i\u003e. Ni una \u003ci\u003e-s\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Cuánta duda es «might»?\u003c/b\u003e Piénsalo como una escala, y quédate con los extremos:\u003cbr/\u003e· \u003cb\u003ewill\u003c/b\u003e → lo doy por hecho. \u003ci\u003eIt will rain.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003emight / may\u003c/b\u003e → puede que sí, puede que no. Ni me mojo. \u003ci\u003eIt might rain.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ewon't\u003c/b\u003e → lo descarto. \u003ci\u003eIt won't rain.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUna advertencia práctica:\u003c/b\u003e \u003ci\u003emight\u003c/i\u003e casi nunca se usa para preguntar. \u003ci\u003eMight it rain?\u003c/i\u003e existe, pero suena a novela del siglo XIX. Para preguntar por la posibilidad se usa lo que ya tienes: \u003ci\u003eDo you think it'll rain?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso de frontera sigue en pie:\u003c/b\u003e esto es material de B1 en tu examen. Aquí se presenta para que lo reconozcas y lo produzcas con la frase medio puesta — \u003cb\u003eno entra en el simulacro\u003c/b\u003e."])</script><script>self.__next_f.push([1,"18:T703,"])</script><script>self.__next_f.push([1,"Este es el contraste de la lección, y explica dos errores que parecen distintos y son el mismo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn español, la duda se marca EN EL VERBO.\u003c/b\u003e «Puede que \u003cb\u003ellueva\u003c/b\u003e», «quizá \u003cb\u003evayamos\u003c/b\u003e», «a lo mejor \u003cb\u003evoy\u003c/b\u003e»: el verbo cambia de forma (subjuntivo) o directamente se queda en presente y el adverbio se encarga del resto. La duda vive dentro del verbo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn inglés, la duda va en una PIEZA APARTE\u003c/b\u003e y el verbo no se entera de nada:\u003cbr/\u003e· una pieza que es un \u003cb\u003emodal\u003c/b\u003e: \u003ci\u003eIt \u003cb\u003emight\u003c/b\u003e rain\u003c/i\u003e · \u003ci\u003eWe \u003cb\u003emight\u003c/b\u003e go\u003c/i\u003e;\u003cbr/\u003e· o una pieza que es un \u003cb\u003eadverbio\u003c/b\u003e —\u003ci\u003eprobably\u003c/i\u003e, \u003ci\u003epossibly\u003c/i\u003e, \u003ci\u003eperhaps\u003c/i\u003e— que trabaja con un futuro normal, y eso es la lección 7.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDe ahí sale el error nº 1 de este bloque:\u003c/b\u003e\u003cbr/\u003e· ❌ \u003ci\u003eMaybe we go to the park.\u003c/i\u003e — el alumno pone \u003ci\u003emaybe\u003c/i\u003e y deja el verbo en presente, como en español.\u003cbr/\u003e· ✅ \u003ci\u003eMaybe we\u003cb\u003e'll\u003c/b\u003e go to the park.\u003c/i\u003e · ✅ \u003ci\u003eWe \u003cb\u003emight\u003c/b\u003e go to the park.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLa regla de bolsillo: \u003cb\u003emaybe no es un futuro; solo es un adverbio.\u003c/b\u003e Si detrás no hay \u003ci\u003ewill\u003c/i\u003e o \u003ci\u003emight\u003c/i\u003e, la frase se queda hablando del presente. Y ojo, que \u003ci\u003emaybe\u003c/i\u003e ya lo traías del A1 en [[Maybe another time.|Quizá en otro momento.]] — ahí funcionaba porque no había verbo detrás.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl «may» que ya tenías, y por qué no se pisan.\u003c/b\u003e En el módulo 7 aprendiste \u003cb\u003e[[May I ask a question?|¿Puedo hacer una pregunta?]]\u003c/b\u003e: eso es \u003ci\u003emay\u003c/i\u003e de \u003cb\u003epermiso\u003c/b\u003e. El de hoy es \u003ci\u003emay\u003c/i\u003e de \u003cb\u003eposibilidad\u003c/b\u003e. Es la misma palabra con dos oficios, y no se confunden nunca porque la forma los separa: el de permiso es una \u003cb\u003epregunta\u003c/b\u003e y va con \u003ci\u003eI\u003c/i\u003e o \u003ci\u003ewe\u003c/i\u003e; el de posibilidad es una \u003cb\u003eafirmación\u003c/b\u003e sobre algo que quizá pase."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l4\",\"phaseId\":\"ena2m11\",\"title\":\"It might rain\",\"subtitle\":\"Puede que sí, puede que no — y por qué «a lo mejor voy» no se traduce palabra por palabra\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que quizá pase\",\"itemIds\":[\"ena2m11itmightrain\",\"ena2m11wemightgo\",\"ena2m11imightnotcome\",\"ena2m11itmaybecold\",\"ena2m11itdependsontheweather\"]},{\"kind\":\"note\",\"note\":{\"title\":\"might y may: otro modal, y la forma ya te la sabes\",\"body\":\"$17\",\"table\":[[\"\",\"cómo se dice\",\"el error que hay que matar\"],[\"afirmativa\",\"It might rain.\",\"It might to rain.\"],[\"negativa\",\"I might not come.\",\"I don't might come.\"],[\"más formal\",\"It may be cold later.\",\"It may is cold later.\"],[\"para preguntar\",\"Do you think it'll rain?\",\"Might it rain?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«A lo mejor voy»: LA PROBABILIDAD NO ES UN TIEMPO VERBAL\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l4e1\",\"type\":\"mc\",\"prompt\":\"Cuánta seguridad hay aquí\",\"question\":\"“It might rain on Saturday.”\",\"options\":[\"Puede que llueva: no se moja\",\"Va a llover seguro\",\"No va a llover\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «It will rain» o «It's going to rain»\",\"Eso sería «It won't rain»\"],\"itemIds\":[\"ena2m11itmightrain\"],\"tip\":\"Might es el modal de no mojarse. Si en el oral te preguntan por algo que no sabes, es tu mejor amigo: nadie te puede pedir cuentas.\"},{\"id\":\"ena2m11l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Lo da por hecho, o solo puede ser?\",\"categories\":[\"lo da por hecho: will / won't\",\"puede que sí, puede que no: might / may\"],\"items\":[{\"text\":\"It will rain tomorrow.\",\"bucket\":0},{\"text\":\"It might rain tomorrow.\",\"bucket\":1},{\"text\":\"We might go to the park.\",\"bucket\":1},{\"text\":\"It won't be cold tonight.\",\"bucket\":0},{\"text\":\"It may be cold later.\",\"bucket\":1},{\"text\":\"I'll call you later.\",\"bucket\":0}],\"itemIds\":[\"ena2m11itwillrain\",\"ena2m11itmightrain\",\"ena2m11wemightgo\",\"ena2m11itwontrain\",\"ena2m11itmaybecold\",\"ena2m11illcallyoulater\"],\"tip\":\"Fíjate en que el verbo de detrás es el mismo en los seis: rain, go, be, call. Lo único que cambia es la pieza de delante. Ahí está toda la probabilidad del inglés.\"},{\"id\":\"ena2m11l4e3\",\"type\":\"bucket\",\"prompt\":\"El mismo «may», dos oficios: ¿permiso o posibilidad?\",\"categories\":[\"permiso (módulo 7)\",\"posibilidad (hoy)\"],\"items\":[{\"text\":\"May I ask a question?\",\"bucket\":0},{\"text\":\"It may be cold later.\",\"bucket\":1},{\"text\":\"May I sit here?\",\"bucket\":0},{\"text\":\"The shop may be closed on Sunday.\",\"bucket\":1},{\"text\":\"May we come in?\",\"bucket\":0},{\"text\":\"She may not come tonight.\",\"bucket\":1}],\"itemIds\":[\"ena2m7mayiaskaquestion\",\"ena2m11itmaybecold\",\"ena2m11imightnotcome\"],\"tip\":\"Los de la izquierda son preguntas y llevan I o we; los de la derecha son afirmaciones sobre algo que quizá pase. La forma los separa sola: no hay que recordar nada.\"},{\"id\":\"ena2m11l4e4\",\"type\":\"cloze\",\"prompt\":\"La duda, en una pieza\",\"text\":\"I'm not sure about Sunday — we ___ go to the park.\",\"answers\":[\"might\",\"may\"],\"translation\":\"No estoy segura de lo del domingo: igual vamos al parque.\",\"hints\":[\"El modal de no mojarse\",\"we m… go to the park\"],\"itemIds\":[\"ena2m11wemightgo\"]},{\"id\":\"ena2m11l4e5\",\"type\":\"cloze\",\"prompt\":\"La negativa, que no se contrae\",\"text\":\"Sorry, I ___ not come tonight — it depends on my shift.\",\"answers\":[\"might\",\"may\"],\"translation\":\"Lo siento, puede que no vaya esta noche: depende de mi turno.\",\"hints\":[\"El not va detrás, y entero: nada de «mightn't»\",\"I m… not come tonight\"],\"itemIds\":[\"ena2m11imightnotcome\"],\"tip\":\"«Mightn't» existe en los libros viejos y no lo usa nadie. Escribe «might not» y no te compliques.\"},{\"id\":\"ena2m11l4e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige — sobra una palabra\",\"wrong\":\"It might to rain this afternoon.\",\"answers\":[\"It might rain this afternoon.\"],\"why\":\"Might es un modal, y detrás de un modal el verbo va desnudo: sin to, sin -s y sin -ing. Es la misma regla de «I can swim» y «You must go» que llevas usando desde el módulo 7.\",\"translation\":\"Puede que llueva esta tarde.\",\"itemIds\":[\"ena2m11itmightrain\"]},{\"id\":\"ena2m11l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco: el adverbio no basta\",\"wrong\":\"Maybe we go to the park on Sunday.\",\"answers\":[\"Maybe we'll go to the park on Sunday.\"],\"why\":\"En español «a lo mejor vamos» funciona porque el adverbio se encarga de la duda y el verbo se queda en presente. En inglés no: maybe es solo un adverbio y no marca futuro. Sin un will o un might detrás, la frase habla del presente y no dice lo que querías decir.\",\"translation\":\"A lo mejor el domingo vamos al parque.\",\"itemIds\":[\"ena2m11wemightgo\",\"enanothertime\"],\"tip\":\"Este error es hermano del de la lección 7 con «probably». Los dos salen de lo mismo: creer que un adverbio de duda puede hacer el trabajo de un verbo.\"},{\"id\":\"ena2m11l4e8\",\"type\":\"transform\",\"prompt\":\"Dilo con el modal en vez de con el adverbio\",\"source\":\"Maybe we'll go to the park.\",\"instruction\":\"Dilo con might, sin maybe\",\"answers\":[\"We might go to the park.\",\"We may go to the park.\"],\"translation\":\"Igual vamos al parque.\",\"hints\":[\"El modal ocupa el sitio del will\",\"We m… go to the park.\"],\"itemIds\":[\"ena2m11wemightgo\"],\"tip\":\"Las dos formas dicen lo mismo, así que no hay una mejor. Ten las dos: la del modal es más corta y la del adverbio es más fácil de improvisar.\"},{\"id\":\"ena2m11l4e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Puede que no vaya: depende del tiempo.\",\"answers\":[\"I might not come. It depends on the weather.\",\"I may not come. It depends on the weather.\",\"I might not go. It depends on the weather.\"],\"hint\":\"«depender de» lleva una preposición que no es la del español\",\"itemIds\":[\"ena2m11imightnotcome\",\"ena2m11itdependsontheweather\"],\"tip\":\"«Depends of» es de los errores más pegajosos que hay, porque el español dice «depende DE». En inglés es depend ON, siempre, y no hay excepción.\"},{\"id\":\"ena2m11l4e10\",\"type\":\"audiomc\",\"prompt\":\"El domingo de Amy — pregunta primero, audio después\",\"audio\":\"I'm not sure about Sunday, to be honest. I might work — they haven't told me yet. And if I don't work, we might go to the park, but it depends on the weather. I'll let you know on Saturday.\",\"question\":\"¿Qué sabe Amy con seguridad?\",\"options\":[\"Que te lo dirá el sábado\",\"Que va a trabajar el domingo\",\"Que van a ir al parque\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «I might work»: no lo sabe todavía\",\"También va con might, y encima depende del tiempo\"],\"itemIds\":[\"ena2m11wemightgo\",\"ena2m11itdependsontheweather\",\"ena2m11letmeknow\"],\"tip\":\"Truco de examen: en un audio lleno de might, lo seguro es lo único que va con will. Busca el will y ahí está la respuesta.\"},{\"id\":\"ena2m11l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — sin mojarte\",\"text\":\"It might rain on Sunday, so we might not go. It depends on the weather.\",\"phonetic\":\"it máit RÉIN on SAN-dei, sóu ui máit not GÓU. it di-PENDS̬ on de UÉ-da\",\"translation\":\"Puede que llueva el domingo, así que igual no vamos. Depende del tiempo.\",\"itemIds\":[\"ena2m11itmightrain\",\"ena2m11imightnotcome\",\"ena2m11itdependsontheweather\"],\"tip\":\"La «t» de might casi no suena cuando le sigue una consonante: «máin-not», todo pegado. No la fuerces.\"},{\"id\":\"ena2m11l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Puede que llueva el domingo. Igual vamos al parque: depende del tiempo.\",\"answers\":[\"It might rain on Sunday. We might go to the park. It depends on the weather.\",\"It may rain on Sunday. We may go to the park. It depends on the weather.\",\"It might rain on Sunday. Maybe we'll go to the park. It depends on the weather.\"],\"hints\":[\"El modal delante y el verbo desnudo · depender lleva on\",\"It m… rain on Sunday. We m… go to the park. It depends o… the weather.\"],\"itemIds\":[\"ena2m11itmightrain\",\"ena2m11wemightgo\",\"ena2m11itdependsontheweather\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-4\",\"book\":\"Perhaps. I am not sure.\",\"real\":\"Might do.\",\"meaning\":\"A lo mejor. / Puede.\",\"when\":\"Entre amigos, como respuesta corta a «¿vas a ir?», «¿lo vas a hacer?». Es muy británico y muy hablado: dos palabras y ni un sujeto. En el examen contesta «I might» o «I'm not sure yet»: dicen lo mismo y sí puntúan.\",\"register\":\"amigos\",\"note\":\"El truco está en el «do», que sustituye al verbo entero de la pregunta: «Are you going?» → «Might do».\",\"sound\":\"máit DÚU\",\"level\":\"a2\",\"itemId\":\"ena2m11itmightrain\"}}],\"resources\":[{\"label\":\"British Council — modals of probability\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/modals-possibility\",\"note\":\"Cinco minutos. Lee solo la parte de might y may e ignora todo lo que hable de «must have» o «can't have»: eso es B1 y no lo necesitas todavía.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\
