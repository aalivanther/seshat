b\u003ewould buy\u003c/b\u003e it.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY ahí está la trampa. En español, «si tuviera» no se parece en nada a un presente ni a un pasado: es subjuntivo, una forma propia. El alumno busca en inglés algo que se le parezca, no lo encuentra, y mete el \u003ci\u003ewould\u003c/i\u003e en las dos mitades: \u003cb\u003e«If I would have the money…»\u003c/b\u003e. Eso no existe. Es el error nº 8 de la lista de trampas del nivel, se cobra en Writing y en Speaking, y \u003cb\u003efosiliza\u003c/b\u003e si nadie lo toca.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRegla de bolsillo, y no hace falta más:\u003c/b\u003e el \u003ci\u003ewould\u003c/i\u003e vive \u003cb\u003esiempre\u003c/b\u003e en la mitad que NO lleva \u003ci\u003eif\u003c/i\u003e. Si en tu frase hay un \u003ci\u003ewould\u003c/i\u003e pegado a un \u003ci\u003eif\u003c/i\u003e, bórralo.\u003cbr/\u003e\u003cbr/\u003eDos avisos más:\u003cbr/\u003e· El orden de las mitades \u003cb\u003eda igual\u003c/b\u003e: \u003ci\u003eIf I had the money, I would buy it\u003c/i\u003e = \u003ci\u003eI would buy it if I had the money\u003c/i\u003e. Solo cambia la coma: va cuando el \u003ci\u003eif\u003c/i\u003e abre la frase, y no va cuando cierra.\u003cbr/\u003e· El pasado del \u003ci\u003eif\u003c/i\u003e \u003cb\u003eno habla del pasado\u003c/b\u003e. \u003ci\u003eIf I had the money\u003c/i\u003e es hoy: es la manera que tiene el inglés de decir «esto no es verdad». Por eso a este pasado se le llama \u003cb\u003eirreal\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l1\",\"phaseId\":\"enb1m5\",\"title\":\"If I had the money\",\"subtitle\":\"El segundo condicional: dos mitades, y cada una lleva lo suyo\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El dinero que hay y el que no\",\"itemIds\":[\"enb1m5ifihadthemoney\",\"enb1m5affordto\",\"enb1m5tightbudget\",\"enb1m5saveupfor\",\"enb1m5savedfortwoyears\",\"enb1m5wasteofmoney\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el «would» vive en la mitad SIN if\",\"body\":\"$17\",\"table\":[[\"La mitad del IF\",\"La otra mitad\"],[\"If I had the money,\",\"I would buy it.\"],[\"If she earned more,\",\"she would move out.\"],[\"If we saved up,\",\"we could go in July.\"],[\"Nunca: If I would have…\",\"Siempre: …I would / could / might…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro palabras del dinero\",\"pairs\":[{\"target\":\"I'm on a tight budget.\",\"source\":\"Voy justa de dinero.\"},{\"target\":\"I'm saving up for a laptop.\",\"source\":\"Estoy ahorrando para un portátil.\"},{\"target\":\"It's a waste of money.\",\"source\":\"Es tirar el dinero.\"},{\"target\":\"I can't afford to eat out this month.\",\"source\":\"No me puedo permitir comer fuera este mes.\"}],\"itemIds\":[\"enb1m5tightbudget\",\"enb1m5saveupfor\",\"enb1m5wasteofmoney\",\"enb1m5affordto\"],\"tip\":\"«afford» casi nunca va sola: vive con can/can't. Y detrás admite las dos cosas — un sustantivo («I can't afford the rent») o «to + verbo» («I can't afford to eat out»).\"},{\"id\":\"enb1m5l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — el dinero que ya traes del A1\",\"pairs\":[{\"target\":\"pound (£)\",\"source\":\"la libra\"},{\"target\":\"cheap\",\"source\":\"barato\"},{\"target\":\"expensive\",\"source\":\"caro\"},{\"target\":\"cash\",\"source\":\"el efectivo\"},{\"target\":\"change\",\"source\":\"el cambio / la vuelta\"}],\"targetSeconds\":22,\"itemIds\":[\"enpound\",\"encheap\",\"enexpensive\",\"encash\",\"enchange\"],\"tip\":\"Cinco palabras que sabes desde el A1. Aquí no se trata de recordarlas: se trata de sacarlas sin traducir. El cronómetro solo premia.\"},{\"id\":\"enb1m5l1e3\",\"type\":\"mc\",\"prompt\":\"La trampa del módulo, de entrada\",\"question\":\"«Si tuviera el dinero, lo compraría» →\",\"options\":[\"If I would have the money, I would buy it.\",\"If I had the money, I would buy it.\",\"If I have the money, I would buy it.\"],\"answer\":1,\"whyWrong\":[\"Dos «would» en la misma frase: el de la mitad del if sobra siempre. Es el calco literal de «si tendría».\",null,\"El presente («If I have») dice que es posible de verdad. Aquí estamos hablando de algo que no es el caso.\"],\"itemIds\":[\"enb1m5ifihadthemoney\"],\"tip\":\"En español el subjuntivo («tuviera») marca lo irreal. En inglés esa marca es el PASADO. Suena raro y es así: el pasado del if no habla de ayer, habla de lo que no es.\"},{\"id\":\"enb1m5l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"If I would have the money, I would buy it.\",\"answers\":[\"If I had the money, I would buy it.\"],\"why\":\"El «would» de la mitad del if sobra. Ahí va pasado simple a secas: If I had… El otro «would», el de la mitad de fuera, está bien puesto y se queda.\",\"translation\":\"Si tuviera el dinero, lo compraría.\",\"itemIds\":[\"enb1m5ifihadthemoney\"]},{\"id\":\"enb1m5l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa la mitad del if\",\"text\":\"If I ___ more money, I would travel every summer.\",\"answers\":[\"had\"],\"translation\":\"Si tuviera más dinero, viajaría todos los veranos.\",\"hints\":[\"No es «would have»: es una sola palabra\",\"El pasado simple de «have»\"],\"itemIds\":[\"enb1m5ifihadthemoney\"],\"tip\":\"Una palabra, no dos. Si te salen dos, casi seguro que has escrito «would have» — el calco de siempre.\"},{\"id\":\"enb1m5l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase hipotética\",\"target\":\"If I had the money I would buy it\",\"translation\":\"Si tuviera el dinero, lo compraría\",\"distractors\":[\"have\",\"will\"],\"itemIds\":[\"enb1m5ifihadthemoney\"],\"tip\":\"Las dos fichas que sobran son justo las dos que pone un hispanohablante: «have» (de «would have») y «will».\"},{\"id\":\"enb1m5l1e7\",\"type\":\"transform\",\"prompt\":\"De la realidad a la hipótesis\",\"source\":\"I don't have the money, so I don't buy it.\",\"instruction\":\"Dilo como hipótesis: «si tuviera…»\",\"answers\":[\"If I had the money, I would buy it\",\"If I had the money I would buy it\",\"If I had the money, I'd buy it\",\"I would buy it if I had the money\"],\"translation\":\"Si tuviera el dinero, lo compraría.\",\"hints\":[\"Empieza por «If I…» y sigue con pasado simple\",\"If I had the money, I ...\"],\"itemIds\":[\"enb1m5ifihadthemoney\",\"enb1m5affordto\"],\"tip\":\"Los hechos no cambian: sigue sin tener el dinero. Lo que cambia es que ahora lo cuentas desde el mundo que no existe, y ese mundo se abre con un pasado.\"},{\"id\":\"enb1m5l1e8\",\"type\":\"bucket\",\"prompt\":\"¿Qué mitad del condicional es cada trozo?\",\"categories\":[\"Mitad del IF — pasado simple\",\"Mitad de fuera — would + infinitivo\"],\"items\":[{\"text\":\"If I had more money\",\"bucket\":0},{\"text\":\"I would travel more\",\"bucket\":1},{\"text\":\"If she earned more\",\"bucket\":0},{\"text\":\"she would move out\",\"bucket\":1},{\"text\":\"If we saved up\",\"bucket\":0},{\"text\":\"we would buy a car\",\"bucket\":1}],\"itemIds\":[\"enb1m5ifihadthemoney\",\"enb1m5saveupfor\"],\"tip\":\"Clasificar trozos sueltos parece un juego, pero es la decisión entera del nivel: en cuanto ves un «if», sabes que ahí NO va «would», y en cuanto ves «would», sabes que ahí NO va «if».\"},{\"id\":\"enb1m5l1e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Estoy ahorrando para un portátil.\",\"answers\":[\"I'm saving up for a laptop\",\"I am saving up for a laptop\",\"I'm saving for a laptop\"],\"hint\":\"El verbo lleva pegadas dos piezas: una partícula y una preposición\",\"itemIds\":[\"enb1m5saveupfor\"],\"tip\":\"«save up» = ahorrar con un objetivo. Y el objetivo va con «for», siempre: save up FOR a laptop, save up FOR a trip.\"},{\"id\":\"enb1m5l1e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"It's a waste of money.\",\"answers\":[\"Es tirar el dinero\",\"Es un desperdicio de dinero\",\"Es dinero tirado\"],\"itemIds\":[\"enb1m5wasteofmoney\"],\"tip\":\"Ojo con el verbo: en español «se pierde» el dinero y en inglés se DESPERDICIA — «waste». «Lose money» es otra cosa: perderlo de verdad, que se te caiga o que el negocio vaya mal.\"},{\"id\":\"enb1m5l1e11\",\"type\":\"mc\",\"prompt\":\"El marcador manda — pero mira la frase entera\",\"question\":\"«Estuve dos años ahorrando para comprar este portátil» (ya lo compré) →\",\"options\":[\"I've saved up for two years to buy this laptop.\",\"I saved up for two years to buy this laptop.\",\"I save up for two years to buy this laptop.\"],\"answer\":1,\"whyWrong\":[\"El present perfect diría que sigo ahorrando. Pero el portátil ya está comprado: el periodo se cerró.\",null,\"El presente simple es para lo que hago habitualmente, no para un periodo terminado.\"],\"itemIds\":[\"enb1m5savedfortwoyears\",\"enb1m5saveupfor\"],\"tip\":\"Aquí hay que hilar fino: «for + duración» empuja hacia el present perfect («I've saved up for two years» = sigo ahorrando), pero NO manda solo. Si el periodo terminó, gana el pasado simple. La pregunta de verdad es siempre la misma: ¿esto sigue abierto o ya se cerró?\"},{\"id\":\"enb1m5l1e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"If I had the money, I would buy it.\",\"translation\":\"Si tuviera el dinero, lo compraría.\",\"hints\":[\"Empieza por «If I…»\",\"If I had the money, I ...\"],\"itemIds\":[\"enb1m5ifihadthemoney\"],\"tip\":\"Fíjate en el ritmo: HAD y BUY llevan el golpe; «I», «the» y «would» pasan de puntillas. De hecho «would» se come casi entero y suena «ud» — por eso mucha gente no lo oye y luego no lo escribe.\"},{\"id\":\"enb1m5l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES de darle al play. Dos escuchas.\",\"audio\":\"Are you coming to Priya's thing on Saturday?|I'd love to, but I'm on a really tight budget this month. The council tax went up and I've got the dentist on Thursday.|It's only a tenner.|It's a tenner plus the train plus a round of drinks. If I had the money I'd be there, honestly. Ask me again at the end of the month.\",\"question\":\"¿Por qué no va Valeria el sábado?\",\"options\":[\"Porque va justa de dinero este mes\",\"Porque tiene dentista el sábado\",\"Porque no le apetece\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El dentista es el jueves, y es uno de los gastos, no el motivo de no ir.\",\"Dice justo lo contrario: «I'd love to» y «If I had the money I'd be there».\"],\"itemIds\":[\"enb1m5tightbudget\",\"enb1m5ifihadthemoney\"],\"tip\":\"«If I had the money I'd be there» es una manera educadísima de decir que no: no rechaza la invitación, culpa a la cartera. Guárdatela — sirve para el Speaking Part 2.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m5-1\",\"book\":\"I have no money.\",\"real\":\"I'm skint.\",\"meaning\":\"Estoy sin blanca\",\"when\":\"Con amigos y compañeros, y siempre sobre algo pasajero: llegas justo a fin de mes, no a que seas pobre. Se dice muchísimo en todo el Reino Unido e Irlanda. En un correo de trabajo, en una reclamación o en el examen escrito no cabe: allí el dinero se nombra por lo que puedes o no puedes permitirte.\",\"register\":\"amigos\",\"exam\":\"I can't afford it at the moment.\",\"note\":\"«broke» significa lo mismo y se entiende en todas partes; «skint» es más británico y suena más de barrio. Ojo con «I'm poor»: en inglés eso es una descripción de tu vida, no una queja del día 28.\",\"sound\":\"aim skint\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m5natskint\"}}],\"resources\":[{\"label\":\"MoneyHelper — Budget planner (Reino Unido)\",\"url\":\"https://www.moneyhelper.org.uk/en/everyday-money/budgeting/budget-planner\",\"note\":\"El planificador oficial de presupuesto. Rellénalo una vez en inglés: es el vocabulario de este módulo en su hábitat.\"}]}}]\n"])</scr
