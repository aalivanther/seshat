ildren\":[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L14\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6fa,"])</script><script>self.__next_f.push([1,"Un texto de B1 en el que todo el mundo \u003ci\u003esays\u003c/i\u003e cosas es un texto de A2. El salto de nivel está en \u003cb\u003eelegir el verbo que dice cómo se dijo\u003c/b\u003e: no es lo mismo \u003ci\u003ehe said he had taken the money\u003c/i\u003e que \u003ci\u003ehe \u003cb\u003eadmitted\u003c/b\u003e taking the money\u003c/i\u003e. En el criterio de vocabulario del examen, eso es \u003cb\u003erango\u003c/b\u003e, y se paga.\u003cbr/\u003e\u003cbr/\u003eEl precio es que \u003cb\u003ecada verbo pide su construcción\u003c/b\u003e, y son cuatro grupos. Se aprenden con el ejemplo pegado, nunca en abstracto:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Verbo + \u003ci\u003e-ing\u003c/i\u003e\u003c/b\u003e: \u003ci\u003eadmit\u003c/i\u003e, \u003ci\u003edeny\u003c/i\u003e, \u003ci\u003esuggest\u003c/i\u003e, \u003ci\u003eavoid\u003c/i\u003e, \u003ci\u003emention\u003c/i\u003e.\u003cbr/\u003e\u003ci\u003eHe \u003cb\u003eadmitted taking\u003c/b\u003e it.\u003c/i\u003e · \u003ci\u003eShe \u003cb\u003esuggested going\u003c/b\u003e by bus.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e2. Verbo + \u003ci\u003eto\u003c/i\u003e + infinitivo\u003c/b\u003e: \u003ci\u003epromise\u003c/i\u003e, \u003ci\u003erefuse\u003c/i\u003e, \u003ci\u003eoffer\u003c/i\u003e, \u003ci\u003eagree\u003c/i\u003e, \u003ci\u003ethreaten\u003c/i\u003e.\u003cbr/\u003e\u003ci\u003eShe \u003cb\u003epromised to call\u003c/b\u003e.\u003c/i\u003e · \u003ci\u003eHe \u003cb\u003erefused to answer\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Verbo + persona + \u003ci\u003eto\u003c/i\u003e + infinitivo\u003c/b\u003e: \u003ci\u003eask\u003c/i\u003e, \u003ci\u003etell\u003c/i\u003e, \u003ci\u003ewarn\u003c/i\u003e, \u003ci\u003eremind\u003c/i\u003e, \u003ci\u003eadvise\u003c/i\u003e.\u003cbr/\u003e\u003ci\u003eThey \u003cb\u003ewarned me to check\u003c/b\u003e the times.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e4. Verbo + preposición pegada\u003c/b\u003e, y la preposición \u003cb\u003eno se traduce\u003c/b\u003e:\u003cbr/\u003e\u003ci\u003ecomplain \u003cb\u003eabout\u003c/b\u003e\u003c/i\u003e (no \u003ci\u003efor\u003c/i\u003e) · \u003ci\u003eapologise \u003cb\u003efor\u003c/b\u003e\u003c/i\u003e · \u003ci\u003ewarn \u003cb\u003eabout\u003c/b\u003e\u003c/i\u003e · \u003ci\u003epoint \u003cb\u003eout\u003c/b\u003e\u003c/i\u003e · \u003ci\u003ehear \u003cb\u003efrom\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY detrás de una preposición, si viene un verbo, va en \u003cb\u003e-ing\u003c/b\u003e: \u003ci\u003eShe apologised for \u003cb\u003ebeing\u003c/b\u003e late\u003c/i\u003e, nunca «for be late». Es el mismo caso venenoso de \u003ci\u003elook forward \u003cb\u003eto\u003c/b\u003e seeing you\u003c/i\u003e: parece un infinitivo y es una preposición.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl aviso de siempre:\u003c/b\u003e \u003ci\u003esuggest\u003c/i\u003e, \u003ci\u003emention\u003c/i\u003e, \u003ci\u003eannounce\u003c/i\u003e y \u003ci\u003epoint out\u003c/i\u003e están en la lista de la lección 1 — la persona va con \u003cb\u003eto\u003c/b\u003e: \u003ci\u003eShe suggested it \u003cb\u003eto me\u003c/b\u003e\u003c/i\u003e, nunca «suggested me»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l5\",\"phaseId\":\"enb1m3\",\"title\":\"He admitted, she promised\",\"subtitle\":\"Dejar de contarlo todo con «said» — y la construcción que pide cada verbo\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Diez verbos que valen por veinte «said»\",\"itemIds\":[\"enb1m3admitted\",\"enb1m3promised\",\"enb1m3complainedabout\",\"enb1m3apologisedfor\",\"enb1m3warnedmeabout\",\"enb1m3suggestedgoing\",\"enb1m3refusedto\",\"enb1m3pointedout\",\"enb1m3announced\",\"enb1m3mentioned\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el verbo ya cuenta la mitad de la historia\",\"body\":\"$17\",\"table\":[[\"Verbo\",\"Lo que va detrás\",\"Ejemplo\"],[\"admit / deny / suggest\",\"-ing\",\"He admitted taking the money.\"],[\"promise / refuse / offer\",\"to + infinitivo\",\"She promised to call me.\"],[\"warn / remind / ask / tell\",\"persona + to + infinitivo\",\"They warned me to check.\"],[\"complain / apologise / point\",\"preposición pegada\",\"He complained about the noise.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l5e1\",\"type\":\"match\",\"prompt\":\"Empareja el verbo con lo que significa de verdad\",\"pairs\":[{\"target\":\"He admitted taking the money.\",\"source\":\"Reconoció que lo había hecho él.\"},{\"target\":\"She promised to call me.\",\"source\":\"Se comprometió a hacerlo.\"},{\"target\":\"He refused to answer.\",\"source\":\"Se negó en redondo.\"},{\"target\":\"She pointed out that the price had gone up.\",\"source\":\"Hizo notar algo que los demás no veían.\"},{\"target\":\"They warned me about the strike.\",\"source\":\"Me avisaron de algo malo que venía.\"}],\"itemIds\":[\"enb1m3admitted\",\"enb1m3promised\",\"enb1m3refusedto\",\"enb1m3pointedout\",\"enb1m3warnedmeabout\"],\"tip\":\"Cada verbo lleva dentro una actitud. Por eso sustituir «said» por el verbo exacto ahorra media frase de explicación: es rango de vocabulario, y el examen lo mide.\"},{\"id\":\"enb1m3l5e2\",\"type\":\"bucket\",\"prompt\":\"¿Qué va detrás: -ing o «to» + infinitivo?\",\"categories\":[\"+ -ing\",\"+ to + infinitivo\"],\"items\":[{\"text\":\"admit … taking it\",\"bucket\":0},{\"text\":\"promise … to call\",\"bucket\":1},{\"text\":\"suggest … going by bus\",\"bucket\":0},{\"text\":\"refuse … to answer\",\"bucket\":1},{\"text\":\"deny … knowing him\",\"bucket\":0},{\"text\":\"offer … to help\",\"bucket\":1},{\"text\":\"avoid … saying it\",\"bucket\":0},{\"text\":\"agree … to meet\",\"bucket\":1}],\"itemIds\":[\"enb1m3admitted\",\"enb1m3promised\",\"enb1m3suggestedgoing\",\"enb1m3refusedto\"],\"tip\":\"No hay regla que lo explique: es una lista, y es corta. La de la izquierda —admit, deny, suggest, avoid, mind, enjoy, finish, keep, practise— es la que hay que memorizar; el resto tiende al infinitivo.\"},{\"id\":\"enb1m3l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She suggested to go by bus.\",\"answers\":[\"She suggested going by bus.\"],\"why\":\"«suggest» pide -ing (o «that + frase»). El español da infinitivo para todo («sugirió ir»), y de ahí sale el calco. También vale «She suggested that we should go by bus».\",\"translation\":\"Sugirió ir en autobús.\",\"itemIds\":[\"enb1m3suggestedgoing\",\"enbus\"]},{\"id\":\"enb1m3l5e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"He complained for the noise.\",\"answers\":[\"He complained about the noise.\"],\"why\":\"La preposición no se traduce: se aprende pegada al verbo. «complain about» es una sola unidad léxica, como «depend on» o «worry about».\",\"translation\":\"Se quejó del ruido.\",\"itemIds\":[\"enb1m3complainedabout\",\"enb1m1worryabout\"]},{\"id\":\"enb1m3l5e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She apologised for be late.\",\"answers\":[\"She apologised for being late.\"],\"why\":\"Detrás de una preposición («for») el verbo va en -ing, siempre. Es la misma trampa que «I'm interested in learning» o «before going out».\",\"translation\":\"Pidió perdón por llegar tarde.\",\"itemIds\":[\"enb1m3apologisedfor\"]},{\"id\":\"enb1m3l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el parte de la reunión\",\"text\":\"He ___ for being late. He ___ forgetting the meeting, and he ___ to send us the notes before Friday. Later his boss ___ out that it was the second time this month.\",\"answers\":[\"apologised\",\"admitted\",\"promised\",\"pointed\"],\"bank\":[\"apologised\",\"admitted\",\"promised\",\"pointed\",\"announced\",\"complained\",\"warned\"],\"translation\":\"Pidió perdón por llegar tarde. Reconoció que se le había olvidado la reunión y prometió mandarnos las notas antes del viernes. Después su jefe hizo notar que era la segunda vez este mes.\",\"itemIds\":[\"enb1m3apologisedfor\",\"enb1m3admitted\",\"enb1m3promised\",\"enb1m3pointedout\"],\"tip\":\"Cada hueco lo decide la construcción, no el significado: «___ for being» solo admite apologise; «___ forgetting» solo un verbo de -ing; «___ to send» solo uno de infinitivo; «___ out» solo point. La gramática te da la respuesta antes que el sentido.\"},{\"id\":\"enb1m3l5e7\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"They warned me ___ the strike on Tuesday.\",\"answers\":[\"about\",\"of\"],\"translation\":\"Me avisaron de la huelga del martes.\",\"hints\":[\"La misma que lleva «complain»\",\"warn somebody ... something\"],\"itemIds\":[\"enb1m3warnedmeabout\"],\"tip\":\"«warn somebody about something» es lo normal; «warn somebody of something» existe y suena más formal. Lo que no existe es «warn me for».\"},{\"id\":\"enb1m3l5e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «sorry» y sin «said»\",\"source\":\"He said he was sorry for being late.\",\"forbid\":[\"sorry\",\"said\"],\"answers\":[\"He apologised for being late\",\"He apologised for arriving late\",\"He apologised for the delay\"],\"translation\":\"Pidió perdón por llegar tarde.\",\"hints\":[\"Hay un verbo que ya significa «decir que lo sientes»\",\"He apologised ...\"],\"itemIds\":[\"enb1m3apologisedfor\"],\"tip\":\"Ocho palabras se convierten en cuatro. Esa compresión es exactamente lo que el examen llama rango de vocabulario, y se entrena así: buscando el verbo que se come la explicación.\"},{\"id\":\"enb1m3l5e9\",\"type\":\"mc\",\"prompt\":\"El verbo exacto\",\"question\":\"Sam no quiso decir nada del asunto, ni una palabra. ¿Cómo se cuenta?\",\"options\":[\"Sam refused to talk about it.\",\"Sam denied to talk about it.\",\"Sam refused talking about it.\"],\"answer\":0,\"whyWrong\":[null,\"«deny» es negar que algo sea verdad, y además pide -ing: «he denied taking it».\",\"«refuse» pide infinitivo con «to», no -ing.\"],\"itemIds\":[\"enb1m3refusedto\"],\"tip\":\"Ojo con «deny»: no es «negarse a», es «negar que». «He denied it» = dijo que no era verdad. Negarse a hacer algo es «refuse to».\"},{\"id\":\"enb1m3l5e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Señaló que el precio había subido.\",\"answers\":[\"She pointed out that the price had gone up\",\"He pointed out that the price had gone up\",\"She pointed out the price had gone up\"],\"hint\":\"El verbo lleva una partícula pegada\",\"itemIds\":[\"enb1m3pointedout\",\"enb1m1riseinrents\"],\"tip\":\"«point out» = hacer notar. Nada que ver con señalar con el dedo, que sería «point at». La partícula cambia el verbo entero.\"},{\"id\":\"enb1m3l5e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"She apologised for being late and promised to send the notes.\",\"translation\":\"Pidió perdón por llegar tarde y prometió mandar las notas.\",\"hints\":[\"Empieza por «She apologised…»\",\"She apologised for ... and promised to ...\"],\"itemIds\":[\"enb1m3apologisedfor\",\"enb1m3promised\"],\"tip\":\"Dos construcciones distintas en una frase: «for + -ing» y «to + infinitivo». Si las oyes y las escribes bien, ya no las vas a confundir escribiendo.\"},{\"id\":\"enb1m3l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Se quejó del ruido y me avisó de que el casero no contestaba nunca.\",\"answers\":[\"She complained about the noise and warned me that the landlord never answered\",\"He complained about the noise and warned me that the landlord never answered\",\"She complained about the noise and warned me that the landlord never replied\"],\"hints\":[\"Dos verbos con su preposición o su construcción\",\"... complained about ... and warned me that ...\"],\"itemIds\":[\"enb1m3complainedabout\",\"enb1m3warnedmeabout\",\"enb1m1landlord\"],\"tip\":\"«warn» puede llevar «that + frase» (avisar de un hecho) o «to + infinitivo» (avisar para que hagas algo). Las dos son correctas; lo que no cabe es «warn of that».\"},{\"id\":\"enb1m3l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos vecinos hablan de la reunión de la escalera. Toma notas mientras suena — hay tres opiniones y no todas son del mismo hablante.\",\"notepad\":true,\"audio\":\"Did you go to the residents' meeting in the end?|I did. It was two hours, and I'd say one of them was useful.|Go on, then.|Well, the managing agent admitted that the boiler had been broken since November, which is more than he said last year. He apologised, sort of. Then he promised to send everybody a written plan before Christmas.|And you believe him?|Not really, no. But somebody from the second floor pointed out that we can write to the council if nothing happens by January, and I didn't know that. So that hour was worth it.|Did anybody complain about the lift?|Everybody complained about the lift. Nobody wrote anything down about the lift.\",\"question\":\"¿Qué es lo que el vecino considera útil de la reunión?\",\"options\":[\"Enterarse de que pueden escribir al ayuntamiento\",\"Que el administrador pidiera perdón\",\"Que se hablara del ascensor\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La disculpa la cuenta con desgana: «He apologised, sort of».\",\"Justo lo contrario: del ascensor se quejaron todos y no se apuntó nada.\"],\"itemIds\":[\"enb1m3admitted\",\"enb1m3pointedout\",\"enb1m3complainedabout\"],\"tip\":\"Cinco verbos introductorios en un audio: admitted, apologised, promised, pointed out, complained. En el Listening Part 4 el examen pregunta justo por ellos, porque cada uno dice la ACTITUD del que habla, no solo el contenido.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cu
