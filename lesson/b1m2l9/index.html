 asumir, hacerse cargo · besprechen = hablar de algo, tratar un tema\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T6ad,"])</script><script>self.__next_f.push([1,"Guten Morgen zusammen und herzlich willkommen an Ihrem ersten Tag. Ich bin aus der Personalabteilung, und ich hab jetzt zwanzig Minuten, um Ihnen das zu erzählen, was sonst jeder in der ersten Woche dreimal falsch erklärt bekommt. Fangen wir mit der Arbeitszeit an. Wir haben Gleitzeit, Sie können also zwischen sieben und zehn anfangen. Die Kernzeit — die Zeit, in der wirklich alle da sein müssen — geht von zehn bis fünfzehn Uhr, freitags nur bis dreizehn. Und eins ist wichtig: Die Kernzeit ist keine Empfehlung. Wenn Sie da mal einen Termin haben, sagen Sie vorher Bescheid, ähm, und zwar Ihrem Team, nicht mir. Zweiter Punkt, das Homeoffice, danach fragen sowieso alle. Zwei Tage pro Woche, die Tage können Sie sich aussuchen, aber nicht Montag und nicht Freitag — sonst sitzen wir mittwochs zu dritt im Büro. In der Probezeit, die bei uns sechs Monate dauert, bitten wir Sie, erst mal ganz hier zu sein. Das ist keine Kontrolle, das ist, na ja, damit Sie die Leute überhaupt kennenlernen. Dritter Punkt, die Überstunden. Die schreiben Sie selbst auf, in dem System, das Ihnen Ihr Team zeigt. Ausgezahlt werden sie nicht, die werden abgefeiert. Und ehrlich gesagt: Wenn jemand jeden Monat zwanzig Überstunden hat, dann haben wir ein Problem mit der Planung — und nicht der Kollege eins mit dem Tempo. Letzter Punkt, und den vergessen die meisten: die Weiterbildung. Jeder hat fünf Tage im Jahr, bezahlt. Der Antrag geht an Ihre Teamleitung, mindestens vier Wochen vorher, und er wird, ähm, fast nie abgelehnt. Trotzdem nehmen die wenigsten die Tage. Nehmen Sie sie. So, das war's. Fragen kommen jetzt sowieso keine, das ist am ersten Tag immer so — meine Nummer steht im Intranet."])</script><script>self.__next_f.push([1,"19:T6ad,"])</script><script>self.__next_f.push([1,"Guten Morgen zusammen und herzlich willkomme  tenía clarísimo: dormir más\"],\"itemIds\":[\"b1m2vorstellungsgespraech\",\"a2m10chef\"]},{\"id\":\"b1m2l9e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 6) — inferencia\",\"question\":\"Was bedeutet die Antwort des Chefs?\",\"options\":[\"Er sagt Ja, aber Nico muss etwas dafür geben\",\"Er sagt Nein, aber freundlich\",\"Er will erst mit den Kollegen sprechen\"],\"answer\":0,\"whyWrong\":[null,\"«Wenn Sie um acht kämen, könnten Sie …» es una oferta real, no una negativa\",\"No menciona a nadie más\"],\"itemIds\":[\"b1m2koennte\",\"b1m2muesste\"],\"tip\":\"«Aber dann müssten Sie …» es la clave: el «müssten» pone el precio. Toda la negociación de la historia cabe en dos Konjunktiv II.\"},{\"id\":\"b1m2l9e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 9) — inferencia\",\"question\":\"Wie bewertet Nico am Ende seine Situation?\",\"options\":[\"Er hat seinen Traumjob gefunden\",\"Er ist zufrieden, obwohl es nicht perfekt ist\",\"Er will bald wieder kündigen\"],\"answer\":1,\"whyWrong\":[\"Él mismo dice que NO es el Traumjob\",null,\"Nada en el texto apunta a que quiera irse\"],\"itemIds\":[\"b1m2zufriedenmit\",\"a2m10traumjob\"],\"tip\":\"«Es ist nicht der Traumjob. Aber es ist eine Arbeit, die zu meinem Leben passt.» Esa es la tesis del módulo entero, y da título a la fase.\"},{\"id\":\"b1m2l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Repaso veloz — los dos módulos anteriores\",\"pairs\":[{\"target\":\"der Mietvertrag\",\"source\":\"el contrato de alquiler\"},{\"target\":\"die Hausordnung\",\"source\":\"el reglamento de la comunidad\"},{\"target\":\"der Feierabend\",\"source\":\"el final de la jornada\"},{\"target\":\"der Traumjob\",\"source\":\"el trabajo soñado\"},{\"target\":\"der Kollege\",\"source\":\"el colega del trabajo\"}],\"targetSeconds\":22,\"itemIds\":[\"b1m1mietvertrag\",\"b1m1hausordnung\",\"a2m10feierabend\",\"a2m10traumjob\",\"a2m10kollege\"],\"tip\":\"Todo esto ya lo sabes: aquí solo se entrena la velocidad. Es la hebra que casi nadie practica y la única que rompe el estancamiento.\"},{\"id\":\"b1m2l9e5\",\"type\":\"order\",\"prompt\":\"Ordena la negociación de Nico\",\"sentences\":[\"Nico pendelt jeden Tag zwei Stunden und schläft zu wenig.\",\"Sofía sagt ihm, er solle einfach fragen.\",\"Nico fragt seinen Chef, ob er früher anfangen könnte.\",\"Der Chef bietet ihm die frühe Schicht an, aber mit mehr Verantwortung.\",\"Nico entscheidet sich für die frühe Schicht.\"],\"translation\":\"Nico se desplaza dos horas al día y duerme poco. Sofía le dice que pregunte sin más. Nico pregunta a su jefe si podría empezar antes. El jefe le ofrece el turno de mañana, pero con más responsabilidad. Nico se decide por el turno de mañana.\",\"hints\":[\"Problema → consejo → pregunta → oferta → decisión\",\"La decisión va siempre al final\"],\"itemIds\":[\"b1m2pendeln\",\"b1m2andeinerstelle\",\"b1m2koennte\",\"b1m2verantwortung\",\"b1m2sichentscheidenfuer\"]},{\"id\":\"b1m2l9e6\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich habe mich ___ die frühe Schicht entschieden.\",\"answers\":[\"für\"],\"translation\":\"Me he decidido por el turno de mañana.\",\"hints\":[\"sich entscheiden + preposición fija, con Akkusativ\",\"«die frühe Schicht» está en acusativo: te lo chiva\"],\"itemIds\":[\"b1m2sichentscheidenfuer\",\"b1m2schichtarbeit\"],\"tip\":\"sich entscheiden FÜR + Akkusativ. Otro bloque verbo+preposición para la libreta: en B1 ya llevas seis.\"},{\"id\":\"b1m2l9e7\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich bin ___ meiner Arbeit zufrieden.\",\"answers\":[\"mit\"],\"translation\":\"Estoy contento con mi trabajo.\",\"hints\":[\"zufrieden + preposición fija, con Dativ\",\"«meiner Arbeit» ya está en dativo\"],\"itemIds\":[\"b1m2zufriedenmit\"]},{\"id\":\"b1m2l9e8\",\"type\":\"gapbank\",\"prompt\":\"Completa la negociación en Konjunktiv II\",\"text\":\"Herr Brandt, ___ Sie kurz Zeit? ___ es möglich, dass ich früher anfange? Wenn ich um acht ___, könnte ich um zehn gehen.\",\"answers\":[\"hätten\",\"Wäre\",\"käme\"],\"bank\":[\"hätten\",\"Wäre\",\"käme\",\"kam\",\"hatte\",\"würden\"],\"translation\":\"Sr. Brandt, ¿tendría un momento? ¿Sería posible que empezara antes? Si viniera a las ocho, podría irme a las diez.\",\"itemIds\":[\"b1m2haettensiezeit\",\"b1m2waereesmoeglich\",\"b1m2koennte\"],\"tip\":\"«käme» (kommen) también tiene forma propia, igual que «ginge» (gehen). Los distractores sin Umlaut (kam, hatte) son pasado real: si los eliges, la frase deja de ser una petición.\"},{\"id\":\"b1m2l9e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «zufrieden»\",\"source\":\"Ich bin mit meiner Arbeit zufrieden.\",\"forbid\":[\"zufrieden\"],\"answers\":[\"Meine Arbeit gefällt mir\",\"Ich mag meine Arbeit\",\"Meine Arbeit macht mir Spaß\"],\"translation\":\"Estoy contento con mi trabajo.\",\"hints\":[\"Un verbo de gustar\",\"Meine Arbeit ... mir\"],\"itemIds\":[\"b1m2zufriedenmit\"]},{\"id\":\"b1m2l9e10\",\"type\":\"monologue\",\"prompt\":\"Tres minutos sobre el tema estrella del examen. Planifica, habla, y repite sin las pistas.\",\"topic\":\"Feste oder flexible Arbeitszeiten?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"«Ich möchte heute über feste und flexible Arbeitszeiten sprechen. Zuerst … , dann … , zum Schluss …»\"},{\"title\":\"2. Eigene Erfahrung\",\"hint\":\"Tu horario, ahora o antes: «Ich arbeite seit … / Früher hatte ich feste Zeiten, weil …»\"},{\"title\":\"3. Die Situation in meinem Land\",\"hint\":\"¿Qué es normal donde vives? Da un ejemplo concreto: «In meinem Land … Zum Beispiel …»\"},{\"title\":\"4. Vor- und Nachteile + meine Meinung\",\"hint\":\"«Einerseits … , andererseits … Allerdings … Meiner Meinung nach …»\"},{\"title\":\"5. Abschluss\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit.»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin cortarme del todo\",\"Di un ejemplo propio con un dato concreto (una hora, un año, un lugar)\",\"Usé al menos un Konjunktiv II sintético (hätte / wäre / könnte / müsste)\",\"Usé al menos 3 conectores distintos (deshalb, außerdem, allerdings, trotzdem)\",\"En la 2ª pasada hablé sin mirar las pistas\"],\"model\":\"Diapositiva 4 como modelo (solo una, para que el resto sea tuyo): „Einerseits geben flexible Zeiten mehr Freiheit, andererseits ist die Grenze zwischen Arbeit und Freizeit weg. Allerdings hängt das vom Beruf ab. Meiner Meinung nach bräuchte man eine feste Kernzeit — dann hätten alle etwas davon.“\",\"itemIds\":[\"b1m2festearbeitszeiten\",\"b1m2flexiblearbeitszeiten\",\"b1m2allerdings\",\"b1m2ichhaettezeit\"],\"tip\":\"La segunda pasada siempre sale mejor: no es que hoy hables mejor, es que repetir la tarea libera atención para la forma (Bygate). Hazla aunque la primera te haya salido bien.\"},{\"id\":\"b1m2l9e27\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 1 — «Gemeinsam etwas planen»: 2-3 minutos y 28 de los 100 puntos del oral. Aquí estás solo, así que HABLA LOS DOS PAPELES en voz alta: propones, tu compañera objeta (invéntale la pega) y tú reaccionas, contrapropones y cierras. Sin objeciones no hay negociación, y sin negociación no hay nota.\",\"topic\":\"Gemeinsam etwas planen: Nico will mit Herrn Brandt über die Schicht sprechen. Plant mit Sofía, wie er das Gespräch führt.\",\"slides\":[{\"title\":\"1 · Wann und wie das Gespräch führen?\",\"hint\":\"Vor dem Service, nach der Schicht, montags früh: propón un momento con su motivo, deja que la otra voz lo rechace («Dienstag ist bei uns Chaos») y contrapropón con «Wie wäre es, wenn …?».\"},{\"title\":\"2 · Was genau vorschlagen?\",\"hint\":\"Frühere Schicht, feste Zeiten, zwei Tage: «Er könnte um acht anfangen und müsste um zweiundzwanzig Uhr gehen.» Compara con lo que hace ahora.\"},{\"title\":\"3 · Was bietet Nico dafür an?\",\"hint\":\"Bestellungen übernehmen, un día de prueba, menos Überstunden. Hablar de lo que da a cambio es muy alemán y aquí cumple un Leitpunkt entero.\"},{\"title\":\"4 · Was tun, wenn der Chef Nein sagt?\",\"hint\":\"Plan B: un solo día a prueba, o preguntar por Gleitzeit. «An deiner Stelle würde ich …».\"},{\"title\":\"5 · Punkt offen + Abschluss\",\"hint\":\"Añade una condición propia («Er muss sonntags frei haben, er hat am Montag Frühschicht») y cierra repitiendo el acuerdo: «Dann also Montag um zehn. — Abgemacht!»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"He hecho al menos CUATRO propuestas (Wollen wir…? / Sollen wir…? / Wie wäre es, wenn…? / Ich hätte einen Vorschlag)\",\"He puesto al menos DOS objeciones en boca de la otra voz y las he resuelto con una contrapropuesta\",\"He reaccionado a cada propuesta antes de soltar la mía (Gute Idee, aber… / Einverstanden)\",\"He tratado los cuatro Leitpunkte y he añadido un punto propio\",\"He cerrado repitiendo el acuerdo completo (día, hora, qué se pide, qué se ofrece)\",\"He usado al menos tres palabras del módulo: Schicht, könnte, müsste, feste Arbeitszeiten, Hätten Sie Zeit\"],\"model\":\"— Also, Nico will ja mit Herrn Brandt über die Schicht sprechen. Wollen wir das Gespräch auf Dienstag legen, vor dem Service? — Dienstag ist bei uns Chaos, ehrlich gesagt. — Verstehe. Wie wäre es, wenn er montags um zehn klopft, bevor die Bestellungen kommen? — Einverstanden. Und was schlägt er vor? — Ich hätte einen Vorschlag: Er könnte um acht anfangen und müsste dann um zweiundzwanzig Uhr gehen. Feste Zeiten, aber früher. — Und wenn der Chef sagt, dass dann niemand die Bestellungen übernimmt? — Dann bietet Nico an, dass er die Bestellungen selbst macht. Das müsste er sowieso lernen. — Gute Idee. Und falls Brandt Nein sagt? — Dann fragen wir nach einem einzigen Tag zur Probe. An deiner Stelle würde ich das so machen. — Eins noch: Sonntags muss er frei haben, er hat am Montag Frühschicht. — Kein Problem, das sagen wir gleich am Anfang. — Abgemacht. Montag um zehn, Vorschlag mit der frühen Schicht, Bestellungen als Gegenleistung, und ein Tag zur Probe als Plan B.\",\"itemIds\":[\"b1m2koennte\",\"b1m2muesste\",\"b1m2festearbeitszeiten\",\"b1m2schichtarbeit\",\"b1m2haettensiezeit\",\"b1m2andeinerstelle\"],\"tip\":\"Cuenta cuántas veces reaccionas a la otra voz. Si son cero, estás monologando: en el Teil 1 eso hunde «Interaktion» aunque el alemán sea impecable. Y planifica de verdad, con hora y contraprestación — el examinador puntúa que la planificación llegue a una decisión, no que sea bonita.\"},{\"id\":\"b1m2l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Me he decidido por un trabajo que encaja con mi vida\",\"answers\":[\"Ich habe mich für eine Arbeit entschieden, die zu meinem Leben passt\"],\"hints\":[\"sich entscheiden für + Akkusativ, y luego la relativa del título\",\"Ich habe mich für eine Arbeit entschieden, die ...\"],\"itemIds\":[\"b1m2sichentscheidenfuer\",\"b1m2arbeitdiepasst\"],\"tip\":\"Preposición regida + Perfekt + Relativsatz, todo en once palabras. Y es justo el título del módulo: Arbeit, die passt. Cerrado.\"},{\"id\":\"b1m2l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información a un grupo (el comité de empresa) · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Kurz was vom Betriebsrat, dann könnt ihr essen. Erstens: Die neuen Schichtpläne hängen ab Montag aus, vier Wochen im Voraus statt zwei — das haben wir lange gefordert. Zweitens: Wer die Arbeitszeit reduzieren will, muss das drei Monate vorher schriftlich sagen, ähm, nicht mündlich beim Chef in der Küche. Und drittens: Die Überstunden vom Sommer werden bis Dezember abgebaut.\",\"question\":\"„Wer die Arbeitszeit reduzieren will, kann das mündlich beim Chef sagen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«drei Monate vorher schriftlich …, nicht mündlich beim Chef in der Küche»\",null],\"itemIds\":[\"b1m2arbeitszeit\",\"b1m2teilzeit\"],\"tip\":\"«schriftlich, nicht mündlich» — el contraste va pegado. Quédate con la primera de las dos palabras.\"},{\"id\":\"b1m2l9e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo aviso, segunda tarea. Dos escuchas.\",\"audio\":\"Kurz was vom Betriebsrat, dann könnt ihr essen. Erstens: Die neuen Schichtpläne hängen ab Montag aus, vier Wochen im Voraus statt zwei — das haben wir lange gefordert. Zweitens: Wer die Arbeitszeit reduzieren will, muss das drei Monate vorher schriftlich sagen, ähm, nicht mündlich beim Chef in der Küche. Und drittens: Die Überstunden vom Sommer werden bis Dezember abgebaut.\",\"question\":\"¿Qué cambia en los cuadrantes de turnos?\",\"options\":[\"Se publican con cuatro semanas de antelación en vez de dos\",\"Se publican con dos semanas en vez de cuatro\",\"Desaparecen los turnos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Es al revés: dos era lo de antes\",\"Los turnos siguen; cambia solo el plazo\"],\"itemIds\":[\"b1m2schichtarbeit\",\"b1m2ueberstunden\"]},{\"id\":\"b1m2l9e14\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 2 EN FORMATO REAL · pregunta 1 de 5. Un solo audio de casi tres minutos, cinco preguntas y UNA escucha: así es el Teil 2 del examen, no los clips de treinta segundos. Lee la pregunta y subraya su palabra clave antes de darle al play.\",\"audio\":\"$18\",\"question\":\"¿Qué dice de la Kernzeit?\",\"options\":[\"Que de diez a tres —los viernes hasta la una— hay que estar sí o sí: no es una recomendación\",\"Que es una recomendación que casi todo el mundo sigue\",\"Que se puede llegar a cualquier hora si se avisa a la Personalabteilung\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Lo dice con todas las letras: «Die Kernzeit ist keine Empfehlung»\",\"El aviso va al equipo, no a ella, y no sirve para saltarse la franja\"],\"itemIds\":[\"b1m2kernzeit\",\"b1m2gleitzeit\"],\"tip\":\"El Teil 2 pregunta detalles y los pregunta EN EL ORDEN del audio. Esta es la primera parte de la charla: si oyes ya lo del Homeoffice, se te ha pasado.\"},{\"id\":\"b1m2l9e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 2 de 5. Mismo audio, una escucha.\",\"audio\":\"$19\",\"question\":\"¿Qué limitación tiene el teletrabajo?\",\"options\":[\"Dos días a la semana, y ni lunes ni viernes\",\"Dos días a la semana, a elegir libremente\",\"Tres días a la semana durante el periodo de prueba\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Los días se eligen, pero con dos excepciones que dice justo después\",\"En la Probezeit pide justo lo contrario: estar presencialmente\"],\"itemIds\":[\"b1m2homeoffice\",\"b1m2imhomeoffice\"],\"tip\":\"La opción falsa es la respuesta verdadera A MEDIAS: «die Tage können Sie sich aussuchen» y luego el «aber». En el Teil 2 media frase no basta.\"},{\"id\":\"b1m2l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 3 de 5. Mismo audio, una escucha.\",\"audio\":\"$1a\",\"question\":\"¿Qué se pide durante el periodo de prueba, y por qué?\",\"options\":[\"Estar en la oficina, para conocer a la gente\",\"Estar en la oficina, porque se controla al personal nuevo\",\"Trabajar más horas de las normales\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Ella se adelanta a eso: «Das ist keine Kontrolle»\",\"De más horas no dice nada en este punto\"],\"itemIds\":[\"b1m2probezeit\"],\"tip\":\"«Das ist keine Kontrolle, das ist …» — la fórmula que niega una interpretación y da la buena. La opción mala está calcada de la parte negada.\"},{\"id\":\"b1m2l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 4 de 5. Mismo audio, una escucha.\",\"audio\":\"$1b\",\"question\":\"¿Qué dice sobre quien acumula veinte horas extra al mes?\",\"options\":[\"Que el problema es de planificación de la empresa, no del trabajador\",\"Que trabaja demasiado despacio\",\"Que se le pagarán a final de año\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice exactamente lo contrario: no es un problema «mit dem Tempo»\",\"«Ausgezahlt werden sie nicht»: se compensan con tiempo libre\"],\"itemIds\":[\"b1m2ueberstunden\",\"b1m2arbeitgeber\"],\"tip\":\"«abfeiern» otra vez, y con una postura detrás. En el Teil 2 hay siempre una o dos preguntas que no piden un dato, sino la ACTITUD de quien habla.\"},{\"id\":\"b1m2l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 5 de 5. Mismo audio, una escucha. Esta cae al final, cuando ya estás cansado: exactamente donde la pone el examen.\",\"audio\":\"$1c\",\"question\":\"¿Qué hay que hacer para pedir los días de formación?\",\"options\":[\"Solicitarlos a la jefatura de equipo con cuatro semanas de antelación\",\"Solicitarlos a la Personalabteilung con cuatro semanas de antelación\",\"Nada: se reparten automáticamente\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El escrito va «an Ihre Teamleitung», no a ella\",\"Hay que pedirlos, y por eso casi nadie los usa\"],\"itemIds\":[\"b1m2vereinbaren\"],\"tip\":\"Cinco preguntas de un tirón sobre casi tres minutos de audio. Si has llegado aquí sin desconectar, ya tienes la resistencia que pide el examen; ese era el ejercicio de verdad.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Hören Teil 4: tres voces, ocho afirmaciones\",\"body\":\"El \u003cb\u003eTeil 4\u003c/b\u003e del Hören es una discusión de radio con \u003cb\u003etres voces\u003c/b\u003e —quien modera y dos invitados— y \u003cb\u003eocho afirmaciones\u003c/b\u003e (23-30) que hay que repartir entre a, b y c. \u003cb\u003eDos escuchas.\u003c/b\u003e Nadie dice su nombre ni su cargo antes de hablar: quien presenta a los invitados lo hace una sola vez, al principio.\u003cbr/\u003e\u003cbr/\u003eTres anclas, en este orden:\u003cbr/\u003e· la \u003cb\u003evoz\u003c/b\u003e — decídela en los primeros diez segundos;\u003cbr/\u003e· el \u003cb\u003epapel\u003c/b\u003e: quien modera pregunta, resume y da turnos; el experto trae cifras; el otro invitado trae su propia experiencia;\u003cbr/\u003e· la \u003cb\u003epostura\u003c/b\u003e: normalmente uno está a favor y otro en contra.\u003cbr/\u003e\u003cbr/\u003eY lo importante: las afirmaciones \u003cb\u003eno repiten las palabras del audio\u003c/b\u003e, las resumen. Si buscas la palabra clave, la encuentras en las tres voces y fallas. Fórmulas que sí marcan el turno: \u003ci\u003eDa widerspreche ich Ihnen\u003c/i\u003e · \u003ci\u003eDa stimme ich Ihnen zu\u003c/i\u003e · \u003ci\u003eDas stimmt zwar, aber…\u003c/i\u003e · \u003ci\u003eDa muss ich passen\u003c/i\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l9e19\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la investigadora del trabajo y c) el dueño de la empresa. Nadie dice quién es antes de hablar: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$1d\",\"question\":\"„Seit der Umstellung ist die Belegschaft messbar gesünder.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él presenta a los invitados y reparte turnos; no defiende ninguna postura\",null,\"Él confirma el dato, pero lo suyo es la queja por lo dura que fue la transición\"],\"itemIds\":[\"b1m2arbeitszeit\",\"b1m2festearbeitszeiten\"],\"tip\":\"Ninguna de las ocho afirmaciones aparece literal en el audio. Ella dice «Was sich ändert, sind die Krankmeldungen: Die gehen zurück»; de ahí a «gesünder» hay un paso que tienes que dar tú. Eso es exactamente el Teil 4.\"},{\"id\":\"b1m2l9e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$1e\",\"question\":\"„Der Anfang war viel härter, als es von außen aussieht.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo modera\",\"Ella habla de los resultados, no de lo que costó llegar\",null],\"itemIds\":[\"b1m2abschaffen\",\"b1m2ueberstunden\"],\"tip\":\"«Es war die schlimmste Umstellung meines Lebens» + «drei Leute sind mir gegangen». Dos frases y una postura entera: el que lo ha vivido no habla de porcentajes, habla de personas.\"},{\"id\":\"b1m2l9e21\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$1f\",\"question\":\"„Weniger Stunden funktionieren nur, wenn man auch die Abläufe ändert.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pregunta, no diagnostica\",null,\"Él cuenta lo que le pasó, pero la explicación de por qué pasa la da ella\"],\"itemIds\":[\"b1m2vereinbaren\",\"b1m2sichkonzentrierenauf\"],\"tip\":\"«Man kürzt die Stunden und lässt alles andere, wie es war»: la afirmación resume su diagnóstico, no lo cita. Si buscabas la palabra «Abläufe» en el audio, no está.\"},{\"id\":\"b1m2l9e22\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. En el Teil 4 real siempre hay una o dos afirmaciones del moderador.\",\"audio\":\"$20\",\"question\":\"„Über einen ganzen Teil der Arbeitswelt wird in dieser Debatte nie gesprochen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella reconoce que no tiene respuesta para los turnos, pero quien pone el tema encima de la mesa es él\",\"Él ni menciona las clínicas: su problema es el precio\"],\"itemIds\":[\"b1m2schichtarbeit\",\"b1m2arbeitnehmer\"],\"tip\":\"Descartar al moderador por sistema cuesta dos puntos. Su marca no es el tema: es la forma. Aquí cuela una opinión dentro de una pregunta, y eso es justo lo que puntúa.\"},{\"id\":\"b1m2l9e23\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$21\",\"question\":\"„Für Schichtberufe gibt es bisher keine ehrliche Antwort.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él plantea el problema; admitirlo es otra cosa\",null,\"Él no habla de turnos en ningún momento\"],\"itemIds\":[\"b1m2schichtarbeit\",\"b1m2erreichbar\"],\"tip\":\"«Da muss ich passen» es la fórmula con la que un experto reconoce un límite sin perder la cara. En el Teil 4, admitir algo también es una postura, y se puntúa.\"},{\"id\":\"b1m2l9e24\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$22\",\"question\":\"„Das Modell scheitert an Leuten, die es auf dem Arbeitsmarkt nicht gibt.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no argumenta en este bloque\",\"Ella dice justo lo contrario: a esos negocios les llueven las solicitudes\",null],\"itemIds\":[\"b1m2einstellen\",\"b1m2gehalt\",\"b1m2arbeitgeber\"],\"tip\":\"Ojo al orden: él dice que no encuentra gente y ella responde que sí la encuentran. Las dos afirmaciones van seguidas y la trampa está en asignarlas al revés.\"},{\"id\":\"b1m2l9e25\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8. Dos escuchas.\",\"audio\":\"$23\",\"question\":\"„Betriebe mit diesem Modell finden viel leichter neue Leute.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",null,\"Él dice que no hay gente en el mercado: esta frase es la respuesta a la suya\"],\"itemIds\":[\"b1m2sichbewerbenbei\",\"b1m2vorstellungsgespraech\"],\"tip\":\"«Da widerspreche ich Ihnen» + Dativ marca el cambio de bando. Cuando alguien empieza así, lo que viene detrás es casi siempre un ítem.\"},{\"id\":\"b1m2l9e26\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido — exactamente como en el examen.\",\"audio\":\"$24\",\"question\":\"„Wer nicht mindestens ein Jahr durchhält, sollte gar nicht anfangen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Arbeitsforscherin\",\"der Firmenchef\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él pide el consejo, no lo da\",\"Ella avisa de otra cosa: de creer que es un regalo y no cambiar nada\",null],\"itemIds\":[\"b1m2vorteilnachteil\",\"b1m2zufriedenmit\"],\"tip\":\"La ronda final vale dos o tres ítems y llega cuando ya estás cansado: por eso el Teil 4 se entrena entero y no por trozos.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Sprechen Teil 2)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Las cinco diapositivas del monólogo son SIEMPRE las mismas: solo cambia el tema. Memoriza la plantilla y no improvises la estructura.\"},{\"label\":\"Easy German — Arbeit\",\"url\":\"https://www.youtube.com/@EasyGerman\",\"note\":\"Entrevistas de calle sobre trabajo y horarios, con subtítulos dobles. Escucha primero sin leer.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"25:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"c
