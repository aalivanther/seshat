3eIt was worth every penny.\u003c/b\u003e — mereció la pena hasta el último céntimo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY después, el detalle\u003c/b\u003e, que se cuenta en \u003cb\u003epasado simple\u003c/b\u003e con algún \u003cb\u003epluscuamperfecto\u003c/b\u003e para lo que ya había pasado antes: \u003ci\u003eBy the time we got to Bristol I \u003cb\u003ehad missed\u003c/b\u003e the last train.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa otra mitad de la lección es el Writing Task 2\u003c/b\u003e, que es la carta informal: \u003cb\u003e100-120 palabras\u003c/b\u003e, \u003cb\u003ea un amigo\u003c/b\u003e, con \u003cb\u003edos funciones\u003c/b\u003e que cumplir (contar algo y sugerir, o describir e invitar). Tres cosas que la tumban:\u003cbr/\u003e1. \u003cb\u003eMeter registro formal.\u003c/b\u003e Un \u003ci\u003eYours sincerely\u003c/i\u003e en una carta a una amiga baja el criterio de vocabulario por registro. Se abre con \u003ci\u003eHi Emma,\u003c/i\u003e y se cierra con el nombre a secas.\u003cbr/\u003e2. \u003cb\u003eNo cumplir las dos funciones.\u003c/b\u003e Si te piden contar Y sugerir, contar muy bien y no sugerir nada vale la mitad.\u003cbr/\u003e3. \u003cb\u003eEscribir sin conectores.\u003c/b\u003e La coherencia es un criterio entero de los cuatro. Con tres distintos —\u003ci\u003eonce\u003c/i\u003e, \u003ci\u003ethough\u003c/i\u003e, \u003ci\u003eanyway\u003c/i\u003e— ya se nota.\u003cbr/\u003e\u003cbr/\u003eY un detalle de puntuación que en LanguageCert \u003cb\u003epuntúa dentro de \u003ci\u003eOrganisation\u003c/i\u003e\u003c/b\u003e: los \u003cb\u003epárrafos\u003c/b\u003e. Una carta informal de 110 palabras en un solo bloque pierde puntos aunque el inglés sea impecable. Tres párrafos cortos, uno por idea."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l8\",\"phaseId\":\"enb1m9\",\"title\":\"We just made it\",\"subtitle\":\"Contar un viaje cuando ya ha pasado — y escribirle a una amiga sin sonar a informe\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cómo se resume un viaje\",\"itemIds\":[\"enb1m9madeit\",\"enb1m9smoothly\",\"enb1m9nightmare\",\"enb1m9worthevery\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: contar un viaje es contarlo en dos capas\",\"body\":\"$17\",\"table\":[[\"La conclusión\",\"Qué significa\",\"Cuándo se dice\"],[\"We just made it.\",\"Llegamos por los pelos\",\"Justo al llegar\"],[\"Everything went smoothly.\",\"Todo salió bien\",\"Al resumir\"],[\"It was a nightmare.\",\"Fue una pesadilla\",\"Al resumir lo malo\"],[\"It was worth every penny.\",\"Mereció la pena\",\"Al valorar el gasto\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro conclusiones\",\"pairs\":[{\"target\":\"We just made it.\",\"source\":\"Llegamos por los pelos.\"},{\"target\":\"Everything went smoothly.\",\"source\":\"Todo salió sobre ruedas.\"},{\"target\":\"The journey back was a nightmare.\",\"source\":\"La vuelta fue una pesadilla.\"},{\"target\":\"It was worth every penny.\",\"source\":\"Mereció la pena hasta el último céntimo.\"}],\"itemIds\":[\"enb1m9madeit\",\"enb1m9smoothly\",\"enb1m9nightmare\",\"enb1m9worthevery\"],\"tip\":\"Las cuatro son de tres o cuatro palabras y las cuatro resumen un viaje entero. Empieza por una de ellas cuando te pregunten qué tal, y detrás cuenta lo que quieras: así se abre una conversación en inglés.\"},{\"id\":\"enb1m9l8e2\",\"type\":\"mc\",\"prompt\":\"«Make it» no es hacerlo\",\"question\":\"«We just made it» significa…\",\"options\":[\"Llegamos justo a tiempo\",\"Lo hicimos nosotros mismos\",\"Acabamos de hacerlo\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «we made it ourselves». Aquí «make it» es una expresión entera: conseguir llegar.\",\"«We've just made it» sería eso, con perfecto. En pasado simple y hablando de un viaje, es llegar por los pelos.\"],\"itemIds\":[\"enb1m9madeit\"],\"tip\":\"«Make it» sirve para muchas cosas: llegar a tiempo, poder venir («I can't make it on Friday») y salir adelante. Es de los verbos más rentables del inglés hablado y no se parece en nada a su traducción literal.\"},{\"id\":\"enb1m9l8e3\",\"type\":\"order\",\"prompt\":\"Ordena cómo le contó Valeria el viaje a Amy\",\"sentences\":[\"We just made it: the doors closed about four seconds after we sat down.\",\"The eight-fifteen had been cancelled, so we had run the whole length of the station.\",\"Once we were on the boat, though, everything went smoothly and I slept for two hours.\",\"Belfast was freezing and half empty, which was exactly what we had gone for.\",\"The journey back was a nightmare, but it was worth every penny anyway.\"],\"translation\":\"Llegamos por los pelos: las puertas se cerraron unos cuatro segundos después de que nos sentáramos. Habían cancelado el de las ocho y cuarto, así que habíamos cruzado la estación entera corriendo. Una vez en el barco, eso sí, todo fue sobre ruedas y dormí dos horas. Belfast estaba helado y medio vacío, que era justo a lo que habíamos ido. La vuelta fue una pesadilla, pero mereció la pena de todas formas.\",\"itemIds\":[\"enb1m9madeit\",\"enb1m9cancelled\",\"enb1m9once\",\"enb1m9smoothly\",\"enb1m9nightmare\",\"enb1m9worthevery\"],\"tip\":\"Fíjate en el orden real de una conversación: primero la conclusión («we just made it») y después el porqué. En español se cuenta al revés, en orden cronológico. Contarlo a la inglesa es lo que hace que el que escucha se enganche.\"},{\"id\":\"enb1m9l8e4\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra\",\"wrong\":\"Everything went smooth.\",\"answers\":[\"Everything went smoothly.\"],\"why\":\"«Go» aquí no es un verbo de estado: pide adverbio, no adjetivo. «Everything went smoothly», igual que «it went badly» o «it went well». El español dice «todo fue bien» con la misma forma para las dos cosas y por eso el adverbio se pierde.\",\"translation\":\"Todo salió sobre ruedas.\",\"itemIds\":[\"enb1m9smoothly\"]},{\"id\":\"enb1m9l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa el pluscuamperfecto\",\"text\":\"By the time we got to Bristol, the last train ___ already gone.\",\"answers\":[\"had\"],\"translation\":\"Para cuando llegamos a Bristol, el último tren ya se había ido.\",\"hints\":[\"Es lo que ya había pasado ANTES de llegar\",\"Tres letras, y lleva «gone» detrás\"],\"itemIds\":[\"enb1m9bythetime\",\"enb1m9connection\"],\"tip\":\"Dos momentos en el pasado y dos tiempos distintos: llegamos (pasado simple) y el tren ya se había ido (pluscuamperfecto). Contar una incidencia sin esa capa es contar una lista; con ella, es una historia.\"},{\"id\":\"enb1m9l8e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje que Valeria le mandó a Emma esa noche\",\"text\":\"We just ___ it. The eight-fifteen was cancelled and we ran the whole length of the station. Once we were on the boat everything went ___ , though. Belfast was freezing and half empty, and honestly it was ___ every penny. The journey back was a ___ , but I'd do it again tomorrow.\",\"answers\":[\"made\",\"smoothly\",\"worth\",\"nightmare\"],\"bank\":[\"made\",\"smoothly\",\"worth\",\"nightmare\",\"smooth\",\"cost\",\"dream\"],\"translation\":\"Llegamos por los pelos. Habían cancelado el de las ocho y cuarto y cruzamos la estación entera corriendo. Una vez en el barco todo fue sobre ruedas, eso sí. Belfast estaba helado y medio vacío, y sinceramente mereció la pena hasta el último céntimo. La vuelta fue una pesadilla, pero lo repetiría mañana mismo.\",\"itemIds\":[\"enb1m9madeit\",\"enb1m9smoothly\",\"enb1m9worthevery\",\"enb1m9nightmare\",\"enb1m5though\"],\"tip\":\"«Smooth» está en el banco a propósito: es el adjetivo, y detrás de «went» hace falta el adverbio. Un cambio de letra y dos puntos de gramática.\"},{\"id\":\"enb1m9l8e7\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos, tres párrafos.\",\"scenario\":\"Emma, tu amiga de Mánchester, ha visto tus fotos y quiere saber qué tal fue. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Right, I've seen the photos and I want the whole story. Did you actually miss the train or did you make it? What was Belfast like — worth going in February?? And is it complicated getting down to Dublin, do you need a passport and everything? Asking for a friend. The friend is me.\"},\"bullets\":[\"Cuéntale qué pasó a la ida.\",\"Dile qué tal fue Belfast y lo de Dublín.\",\"Contéstale a lo del pasaporte e invítala a venir.\"],\"checks\":[{\"re\":\"(cancelled|replacement bus|missed my connection|made it)\",\"label\":\"Cuentas qué pasó a la ida\"},{\"re\":\"(belfast|dublin|smoothly|freezing|day trip)\",\"label\":\"Dices qué tal fue Belfast y lo de Dublín\"},{\"re\":\"(passport|photo id|border|come with us|next time)\",\"label\":\"Contestas a lo del documento y la invitas\"}],\"frame\":[\"Saludo: «Hi Emma,» y una primera línea con la conclusión, no con el principio de la historia\",\"Qué pasó a la ida, en pasado simple y en dos frases\",\"Cómo fue una vez allí, con un «Once…» y un «…, though.»\",\"Belfast y Dublín, con un detalle concreto (nada de «it was very nice»)\",\"Lo del pasaporte, como aviso práctico: «Take your passport if you go…»\",\"Cierre con invitación: «Anyway, come with us next time» + tu nombre a secas\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"once\",\"though\",\"anyway\",\"as soon as\",\"in case\",\"as long as\",\"at least\",\"actually\",\"luckily\",\"although\",\"besides\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nWell, we made it, just about. The eight-fifteen was cancelled ten minutes before it left, so we ended up on a replacement bus as far as Preston and I missed my connection by four minutes.\\nOnce we were on the boat, though, everything went smoothly. Belfast was freezing and half empty, which was exactly what we wanted, and we did the day trip to Dublin on the Sunday.\\nTake your passport if you go, by the way: the coach doesn't stop at the border, but the airlines ask for photo ID.\\nAnyway, come with us next time. It's a couple of hours from Manchester.\\nValeria\",\"itemIds\":[\"enb1m9madeit\",\"enb1m9cancelled\",\"enb1m9connection\",\"enb1m9smoothly\",\"enb1m9once\",\"enb1m9bordercontrol\",\"enb1m3anyway\"],\"tip\":\"Cuenta las palabras: 100-120. Y mira el modelo: abre con la conclusión, mete tres conectores distintos sin anunciarlos y cierra invitando. Ni un «Yours sincerely» ni un «I am writing to inform you» — la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m9l8e8\",\"type\":\"transform\",\"prompt\":\"Junta las dos frases en pasado\",\"source\":\"We got to Bristol. The last train had already gone.\",\"instruction\":\"Júntalas con «by the time»\",\"answers\":[\"By the time we got to Bristol, the last train had already gone\",\"By the time we got to Bristol the last train had already gone\",\"By the time we got to Bristol, the last train had already gone.\"],\"translation\":\"Para cuando llegamos a Bristol, el último tren ya se había ido.\",\"hints\":[\"«By the time» abre la frase y lleva pasado simple detrás\",\"By the time we ... to Bristol, the last train had already gone\"],\"itemIds\":[\"enb1m9bythetime\"],\"tip\":\"«By the time» funciona igual en pasado que en futuro: detrás va el tiempo simple, y el otro verbo se va un escalón más atrás. En futuro era «will be»; en pasado es «had gone».\"},{\"id\":\"enb1m9l8e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"La vuelta fue una pesadilla, pero mereció la pena.\",\"answers\":[\"The journey back was a nightmare, but it was worth every penny\",\"The journey back was a nightmare, but it was worth it\",\"The way back was a nightmare, but it was worth every penny\"],\"hint\":\"«La vuelta» de un viaje es «the journey back»\",\"itemIds\":[\"enb1m9nightmare\",\"enb1m9worthevery\"],\"tip\":\"«The journey back» o «the way back», nunca «the return», que en inglés es el billete o el acto de devolver algo. Y «worth» va sin «to»: «it was worth it», «it's worth going».\"},{\"id\":\"enb1m9l8e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te está contando?\",\"source\":\"We ended up on a replacement bus as far as Preston, and I missed my connection by four minutes.\",\"answers\":[\"Acabamos en un autobús sustitutivo hasta Preston y perdí el enlace por cuatro minutos\",\"Terminamos en un autobús sustitutivo hasta Preston y perdí el enlace por cuatro minutos\",\"Acabamos cogiendo un autobús sustitutivo hasta Preston y perdí el enlace por cuatro minutos\"],\"itemIds\":[\"enb1m9replacementbus\",\"enb1m9connection\",\"enb1m2endup\"],\"tip\":\"«End up» es del módulo 2 y significa acabar en un sitio o en una situación que no habías elegido. Encaja perfectamente con un viaje que se tuerce, y por eso aparece aquí sin que nadie lo presente.\"},{\"id\":\"enb1m9l8e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"We just made it.\",\"translation\":\"Llegamos por los pelos.\",\"hints\":[\"Tres palabras y un pronombre\",\"We just ...\"],\"itemIds\":[\"enb1m9madeit\"],\"tip\":\"Cuatro palabras cortísimas y todas átonas menos «made». Si esperas oír cuatro palabras separadas, oyes una mancha: «ui-dchast-MÉID-it». Así suena el inglés hablado a velocidad normal.\"},{\"id\":\"enb1m9l8e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el resumen del viaje en tres frases\",\"text\":\"We just made it. The eight-fifteen was cancelled, but once we were on the boat everything went smoothly.\",\"phonetic\":\"ui dchast méid it · di éit-fif-TÍIN uos̬ KÁN-seld, bat uáns ui uée on de bóut É-vri-zing uént SMÚUD-li\",\"translation\":\"Llegamos por los pelos. Cancelaron el de las ocho y cuarto, pero una vez en el barco todo fue sobre ruedas.\",\"itemIds\":[\"enb1m9madeit\",\"enb1m9cancelled\",\"enb1m9once\",\"enb1m9smoothly\"],\"tip\":\"Tres frases, doce segundos, y ya has contado un viaje entero con conclusión, problema y resolución. Es exactamente la forma que pide el Speaking Part 4 — y cabe en una respuesta del Part 1.\"},{\"id\":\"enb1m9l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Emma llama para que se lo cuenten. Dos escuchas.\",\"audio\":\"So? Was it worth it?|Worth every penny. The getting there was a nightmare, mind you.|Go on.|The eight-fifteen was cancelled about ten minutes before it was supposed to leave. No warning, nothing on the board.|Classic.|We got a replacement bus as far as Preston and I missed the connection by four minutes. Four. I could see it leaving.|Oh, that's cruel.|Once we were on the boat, though, it was fine. Slept the whole way. And Belfast in February is empty, which is the whole point.\",\"question\":\"¿Qué opina Valeria del viaje en conjunto?\",\"options\":[\"Que mereció la pena a pesar de cómo empezó\",\"Que no volvería a hacerlo por lo mal que fue la ida\",\"Que lo mejor fue el trayecto y lo peor la ciudad\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Abre diciendo justo lo contrario: «Worth every penny».\",\"Al revés: el trayecto fue lo malo y de Belfast dice que estar vacío «is the whole point».\"],\"itemIds\":[\"enb1m9worthevery\",\"enb1m9nightmare\",\"enb1m9once\",\"enb1m9smoothly\"],\"tip\":\"«Mind you» es la coletilla que avisa de que viene un matiz, como el «though» del módulo 6 pero al principio. Y fíjate en que Valeria da la valoración ANTES que los hechos: eso es lo que se pregunta en el Listening Part 2 cuando piden actitud.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\
