skra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T93d,"])</script><script>self.__next_f.push([1,"Der Warenkorb ist voll, der Preis steht fest, und dann erscheint der Satz, den heute fast jeder Online-Shop anbietet: „Jetzt bestellen, in dreißig Tagen bezahlen.“ Für die Kundin klingt das nach einem Geschenk. Für die Verbraucherzentralen klingt es nach Arbeit.\u003cbr/\u003e\u003cbr/\u003eDie Idee selbst ist alt — den Kauf auf Rechnung gibt es seit hundert Jahren. Neu ist die Geschwindigkeit. Früher [[dauerte|duraba]] eine Bestellung mehrere Tage; heute genügen zwei Klicks, und zwischen dem Wunsch und der Bezahlung liegen vier Wochen. Genau in diesem Abstand liegt das Problem. Wer im Laden bezahlt, spürt, dass das Geld weg ist. Wer online auf Rechnung kauft, spürt in diesem Moment gar nichts.\u003cbr/\u003e\u003cbr/\u003eDie Zahlen einer Untersuchung aus dem letzten Jahr sind deutlich: Fast jede dritte Person zwischen achtzehn und fünfundzwanzig hat schon einmal eine Rechnung zu spät bezahlt, und jede zehnte hatte deshalb offene Beträge bei mehr als einem Anbieter. Die einzelnen Summen sind meistens klein — dreißig, fünfzig, achtzig Euro. Klein sind auch die [[Mahngebühren|los recargos por impago]]. Zusammen [[ergeben|dan como resultado]] sie trotzdem einen Betrag, der viele überrascht.\u003cbr/\u003e\u003cbr/\u003e„Wir werden in den nächsten Jahren mehr junge Menschen in unseren Beratungsstellen sehen“, sagt eine Schuldnerberaterin aus Graz. „Nicht, weil sie zu viel Geld ausgeben, sondern weil sie den Überblick verlieren. Falls jemand bei sechs Shops offene Rechnungen hat, weiß er am Monatsende nicht mehr, was ihm eigentlich gehört.“\u003cbr/\u003e\u003cbr/\u003eWas hilft? Die Beraterin nennt drei Regeln, und keine davon ist neu. Erstens: eine Liste. Wer aufschreibt, was er bestellt hat, verliert den Überblick nicht. Zweitens: die Frist in den Kalender. Die meisten Mahngebühren entstehen nicht aus Geldmangel, sondern aus Vergesslichkeit. Drittens: das Widerrufsrecht kennen. Innerhalb von vierzehn Tagen darf man die Ware ohne Begründung zurückschicken — dieses Recht gilt in der ganzen Europäischen Union, und viele nutzen es nie.\u003cbr/\u003e\u003cbr/\u003eDie Anbieter selbst sehen wenig Grund zur Sorge. „Unsere Kundinnen und Kunden sind erwachsen“, heißt es aus der Branche. Die Verbraucherschützer antworten mit einer Frage: Warum ist die Ratenzahlung dann im Warenkorb schon [[voreingestellt|preseleccionada]], und warum braucht man drei Klicks, um sie wieder auszuschalten?"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l6\",\"phaseId\":\"b1m8\",\"title\":\"Lesen: jetzt bestellen, später zahlen\",\"subtitle\":\"Texto de prensa — y las preguntas que no están escritas\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis palabras del artículo\",\"itemIds\":[\"b1m8geschulden\",\"b1m8gerate\",\"b1m8geverbraucher\",\"b1m8geausgebenfuer\",\"b1m8gebudget\",\"b1m8geeinkommen\",\"b1m8gekonsum\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: cómo se lee un texto de prensa del Lesen Teil 2\",\"body\":\"En el Teil 2 hay \u003cb\u003edos textos de prensa\u003c/b\u003e y \u003cb\u003etres preguntas por texto\u003c/b\u003e, en 20 minutos. No es una lectura de comprensión general: es una \u003cb\u003ecaza de posturas\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eEstrategia en cuatro pasos:\u003cbr/\u003e1. \u003cb\u003eTitular y primera frase\u003c/b\u003e: te dicen el tema y muchas veces la tesis.\u003cbr/\u003e2. \u003cb\u003eLee las tres preguntas\u003c/b\u003e antes de leer el cuerpo del texto.\u003cbr/\u003e3. \u003cb\u003eMarca quién habla\u003c/b\u003e: en un artículo alemán casi siempre hay dos voces (la del experto y la del sector) y las preguntas suelen ir sobre la diferencia entre ellas.\u003cbr/\u003e4. \u003cb\u003eEl último párrafo\u003c/b\u003e es donde el periodista deja caer su propia opinión, casi siempre en forma de pregunta.\u003cbr/\u003e\u003cbr/\u003eEl texto que viene trae la gramática del módulo puesta a trabajar: Futur I (\u003ci\u003eWir werden mehr junge Menschen sehen\u003c/i\u003e), condicionales con falls, y nominalizaciones por todas partes (\u003ci\u003edie Bezahlung, das Ausgeben, die Ratenzahlung\u003c/i\u003e). Y trae una cifra que te conviene memorizar: \u003cb\u003ecatorce días\u003c/b\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Lee primero las preguntas: en el examen tendrías 20 minutos para dos textos como este.\",\"title\":\"Jetzt bestellen, in dreißig Tagen zahlen\",\"source\":\"Bearbeiteter Artikel aus einem deutschsprachigen Verbrauchermagazin\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m8l6e1q1\",\"q\":\"Was ist am Kauf auf Rechnung neu?\",\"options\":[\"Dass es ihn überhaupt gibt.\",\"Die Geschwindigkeit: zwei Klicks statt mehrerer Tage.\",\"Dass er nur für junge Leute erlaubt ist.\"],\"answer\":1,\"why\":\"«Die Idee selbst ist alt … Neu ist die Geschwindigkeit.»\"},{\"id\":\"b1m8l6e1q2\",\"q\":\"Warum ist der Abstand zwischen Klick und Bezahlung ein Problem?\",\"options\":[\"Weil die Ware in dieser Zeit teurer wird.\",\"Weil man in diesem Moment nicht spürt, dass man Geld ausgibt.\",\"Weil die Post vier Wochen braucht.\"],\"answer\":1,\"inference\":true,\"why\":\"El texto lo dice por contraste, no por definición: «Wer im Laden bezahlt, spürt … Wer online auf Rechnung kauft, spürt in diesem Moment gar nichts.»\"},{\"id\":\"b1m8l6e1q3\",\"q\":\"Was sagt die Schuldnerberaterin über die jungen Kundinnen und Kunden?\",\"options\":[\"Dass sie zu viel Geld ausgeben.\",\"Dass sie den Überblick über ihre Rechnungen verlieren.\",\"Dass sie das Widerrufsrecht zu oft nutzen.\"],\"answer\":1,\"why\":\"«Nicht, weil sie zu viel Geld ausgeben, sondern weil sie den Überblick verlieren.»\"},{\"id\":\"b1m8l6e1q4\",\"q\":\"Wie steht der Text am Ende zu den Anbietern?\",\"options\":[\"Er gibt ihnen recht: die Kunden sind erwachsen.\",\"Er stellt ihr Argument mit einer Gegenfrage in Frage.\",\"Er erwähnt sie gar nicht.\"],\"answer\":1,\"inference\":true,\"why\":\"El último párrafo cita a las empresas y responde con una pregunta sobre la opción preseleccionada: la postura del texto está en la pregunta, no en una afirmación.\"},{\"id\":\"b1m8l6e1q5\",\"q\":\"Welche Überschrift passt am besten zum vorletzten Absatz?\",\"options\":[\"Drei einfache Regeln gegen die Schuldenfalle\",\"Warum Mahngebühren so teuer sind\",\"Das Widerrufsrecht in der Europäischen Union\"],\"answer\":0,\"inference\":true,\"why\":\"El párrafo entero se organiza en «Erstens … Zweitens … Drittens», y las tres cosas son consejos preventivos. Los otros dos títulos cogen un detalle y lo convierten en el tema.\"}],\"itemIds\":[\"b1m8geschulden\",\"b1m8gerate\",\"b1m8geverbraucher\",\"b1m8gewiderruf\",\"b1m8gebetrag\"],\"tip\":\"Fíjate en el Futur I de la asesora («Wir werden … sehen») y en su «Falls jemand …». La gramática de este módulo es la gramática de la prensa real.\"},{\"id\":\"b1m8l6e2\",\"type\":\"mc\",\"prompt\":\"Dato del texto\",\"question\":\"Wie lange darf man die Ware nach dem Widerrufsrecht zurückschicken?\",\"options\":[\"Innerhalb von vierzehn Tagen\",\"Innerhalb von dreißig Tagen\",\"Innerhalb von vier Wochen\"],\"answer\":0,\"whyWrong\":[null,\"Treinta días son el plazo de PAGO del titular, no el de devolución\",\"Cuatro semanas es el plazo de baja de un contrato, otra cosa\"],\"itemIds\":[\"b1m8gewiderruf\"],\"tip\":\"Tres cifras parecidas en un mismo texto: 30 días para pagar, 14 para devolver, 4 semanas para dar de baja. El examen vive de estas confusiones.\"},{\"id\":\"b1m8l6e3\",\"type\":\"match\",\"prompt\":\"Empareja las palabras del consumo\",\"pairs\":[{\"target\":\"die Schulden\",\"source\":\"las deudas\"},{\"target\":\"der Verbraucher\",\"source\":\"el consumidor\"},{\"target\":\"das Einkommen\",\"source\":\"los ingresos\"},{\"target\":\"das Budget\",\"source\":\"el presupuesto personal\"}],\"itemIds\":[\"b1m8geschulden\",\"b1m8geverbraucher\",\"b1m8geeinkommen\",\"b1m8gebudget\"]},{\"id\":\"b1m8l6e4\",\"type\":\"cloze\",\"prompt\":\"La rección del gasto\",\"text\":\"Junge Leute geben viel Geld ___ Kleidung aus.\",\"answers\":[\"für\"],\"translation\":\"Los jóvenes gastan mucho dinero en ropa.\",\"hints\":[\"Geld ausgeben + preposición fija + Akkusativ\",\"Tres letras, con Umlaut\"],\"itemIds\":[\"b1m8geausgebenfuer\"],\"strictUmlaut\":true,\"tip\":\"El español dice «gastar EN» y por eso sale «in». Es für + acusativo, siempre.\"},{\"id\":\"b1m8l6e5\",\"type\":\"mc\",\"prompt\":\"Inferencia — la voz del sector\",\"question\":\"„Unsere Kundinnen und Kunden sind erwachsen“, heißt es aus der Branche. ¿Qué está diciendo el sector en realidad?\",\"options\":[\"Que la responsabilidad es del cliente, no de la tienda\",\"Que solo venden a mayores de edad\",\"Que sus clientes son más viejos que la media\"],\"answer\":0,\"whyWrong\":[null,\"No habla de una norma de edad: responde a la acusación de fomentar deudas\",\"La edad media no aparece en el texto\"],\"itemIds\":[\"b1m8geverbraucher\"],\"tip\":\"En el Lesen Teil 4 hay siete comentarios y una sola pregunta: «¿está a favor?». Nadie lo dice con esas palabras. Esto es exactamente ese ejercicio.\"},{\"id\":\"b1m8l6e6\",\"type\":\"bucket\",\"prompt\":\"¿Quién lo diría?\",\"categories\":[\"die Verbraucherschützer\",\"die Anbieter\"],\"items\":[{\"text\":\"Die Ratenzahlung ist im Warenkorb voreingestellt.\",\"bucket\":0},{\"text\":\"Unsere Kundinnen und Kunden sind erwachsen.\",\"bucket\":1},{\"text\":\"Viele verlieren den Überblick über ihre Rechnungen.\",\"bucket\":0},{\"text\":\"Wir sehen wenig Grund zur Sorge.\",\"bucket\":1},{\"text\":\"Man sollte die Frist in den Kalender schreiben.\",\"bucket\":0},{\"text\":\"Jeder kann selbst entscheiden, wie er bezahlt.\",\"bucket\":1}],\"itemIds\":[\"b1m8geverbraucher\",\"b1m8gerate\"],\"tip\":\"Este es el Hören Teil 4 en versión escrita: «¿quién dice qué?». Entrenar la atribución de posturas vale 8 ítems del examen.\"},{\"id\":\"b1m8l6e7\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el consejo de la asesora\",\"text\":\"___ jemand bei sechs Shops offene Rechnungen hat, verliert er den Überblick. ___ Sie die Frist in den Kalender. Dann ___ Sie keine Mahngebühren bezahlen.\",\"answers\":[\"Falls\",\"Schreiben\",\"werden\"],\"bank\":[\"Falls\",\"Schreiben\",\"werden\",\"Obwohl\",\"Schreib\",\"wurden\"],\"translation\":\"Si alguien tiene facturas abiertas en seis tiendas, pierde la visión de conjunto. Escriba el plazo en el calendario. Entonces no pagará recargos.\",\"itemIds\":[\"b1m6falls\",\"b1m8gefrist\",\"b1m8gewerden\"],\"tip\":\"«Schreib» (du) está entre los distractores a propósito: el texto va de usted de principio a fin.\"},{\"id\":\"b1m8l6e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la rección\",\"wrong\":\"Ich gebe jeden Monat viel Geld in Kleidung aus.\",\"answers\":[\"Ich gebe jeden Monat viel Geld für Kleidung aus.\"],\"why\":\"Geld ausgeben FÜR + acusativo. «in» es calco directo del español «gastar en»; en alemán marcaría un lugar, no un destino del gasto.\",\"translation\":\"Cada mes gasto mucho dinero en ropa.\",\"itemIds\":[\"b1m8geausgebenfuer\"]},{\"id\":\"b1m8l6e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la frase clave\",\"text\":\"Innerhalb von vierzehn Tagen darf man die Ware zurückschicken.\",\"translation\":\"Dentro de catorce días se puede devolver la mercancía.\",\"hints\":[\"Empieza por Innerhalb von vierzehn Tagen ...\",\"darf man die Ware zurückschicken\"],\"itemIds\":[\"b1m8gewiderruf\",\"b1m8gezurueckschicken\"]},{\"id\":\"b1m8l6e10\",\"type\":\"transform\",\"prompt\":\"Nominaliza el titular\",\"source\":\"Junge Leute kaufen immer mehr auf Raten.\",\"instruction\":\"Reescríbelo empezando por «Der Kauf ...»\",\"answers\":[\"Der Kauf auf Raten nimmt bei jungen Leuten zu.\",\"Der Kauf auf Raten wird bei jungen Leuten immer häufiger.\"],\"translation\":\"La compra a plazos aumenta entre los jóvenes.\",\"hints\":[\"kaufen → der Kauf\",\"«aumenta» = nimmt zu / wird immer häufiger\"],\"itemIds\":[\"b1m8gerate\",\"b1m8gekonsum\"],\"tip\":\"Los titulares alemanes están escritos así: sustantivo primero, verbo genérico después. Reconocerlo acelera el barrido del Teil 2.\"},{\"id\":\"b1m8l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción — resume el texto en una frase\",\"question\":\"Muchos consumidores pierden la visión de conjunto de sus facturas\",\"answers\":[\"Viele Verbraucher verlieren den Überblick über ihre Rechnungen\",\"Viele Verbraucher verlieren den Überblick über ihre Rechnungen.\",\"Viele Verbraucher verlieren den Überblick über ihre Rechnungen und Beträge\"],\"hints\":[\"den Überblick verlieren über + acusativo\",\"Viele Verbraucher ...\"],\"itemIds\":[\"b1m8geverbraucher\",\"b1m8gerechnung\"],\"tip\":\"Resumir un texto en una frase propia es la mejor preparación para el Sprechen Teil 3: dar feedback exige exactamente esto.\"}]}],\"resources\":[{\"label\":\"Schuldnerberatung — Materialien (DE/AT)\",\"url\":\"https://www.schuldenberatung.at/\",\"note\":\"Textos austriacos sobre deudas juveniles: mismo registro y mismo tema que el Lesen Teil 2.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en
