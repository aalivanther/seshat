 favor de ello / en contra de ello»: es la respuesta del Lesen Teil 4 y la primera frase de cualquier comentario de opinión.\u003cbr/\u003e\u003cbr/\u003eUso anticipador (nivel alto, pero muy rentable): \u003ci\u003eIch freue mich \u003cb\u003edarauf\u003c/b\u003e, dass du kommst.\u003c/i\u003e El \u003ci\u003edarauf\u003c/i\u003e anuncia la subordinada que viene detrás."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m4l5\",\"phaseId\":\"b1m4\",\"title\":\"Clínica: darauf, worauf\",\"subtitle\":\"Los da-/wo-Komposita — lo que el español no tiene\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas que no existen en español\",\"itemIds\":[\"b1m4ichfreuemichdarauf\",\"b1m4woraufwartestdu\",\"b1m4worandenkstdu\",\"b1m4ichbindafuer\",\"b1m4ichbindagegen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: da-/wo- es para COSAS; con personas, preposición + pronombre\",\"body\":\"$17\",\"table\":[[\"persona\",\"cosa\",\"pregunta\"],[\"Ich warte auf ihn.\",\"Ich warte darauf.\",\"Worauf wartest du?\"],[\"Ich denke an sie.\",\"Ich denke daran.\",\"Woran denkst du?\"],[\"Ich ärgere mich über ihn.\",\"Ich ärgere mich darüber.\",\"Worüber ärgerst du dich?\"],[\"Ich interessiere mich für sie.\",\"Ich interessiere mich dafür.\",\"Wofür interessierst du dich?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Habla de una persona o de una cosa?\",\"categories\":[\"Persona (auf ihn, an sie…)\",\"Cosa (darauf, daran…)\"],\"items\":[{\"text\":\"Ich warte auf ihn.\",\"bucket\":0},{\"text\":\"Ich warte darauf.\",\"bucket\":1},{\"text\":\"Ich denke an sie.\",\"bucket\":0},{\"text\":\"Ich denke daran.\",\"bucket\":1},{\"text\":\"Ich ärgere mich über ihn.\",\"bucket\":0},{\"text\":\"Ich ärgere mich darüber.\",\"bucket\":1},{\"text\":\"Ich interessiere mich für sie.\",\"bucket\":0},{\"text\":\"Ich interessiere mich dafür.\",\"bucket\":1}],\"itemIds\":[\"b1m4wartenauf\  dafür / dagegen» es, literalmente, la pregunta del Lesen Teil 4: «¿esta persona está a favor?».\"},{\"id\":\"b1m4l5e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin la palabra prohibida\",\"source\":\"Ich freue mich auf das Wochenende.\",\"forbid\":[\"freue\",\"freuen\"],\"answers\":[\"Ich kann das Wochenende kaum erwarten\",\"Das Wochenende ist für mich etwas Schönes\"],\"translation\":\"Me hace ilusión el fin de semana.\",\"hints\":[\"Otra manera: casi no puedo esperar\",\"Ich kann das Wochenende kaum ...\"],\"itemIds\":[\"b1m4sichfreuenauf\",\"wochenende\"]},{\"id\":\"b1m4l5e11\",\"type\":\"build\",\"prompt\":\"Construye la pregunta con wo-\",\"target\":\"Worüber sprecht ihr die ganze Zeit\",\"translation\":\"¿De qué habláis todo el rato?\",\"distractors\":[\"Über\",\"was\"],\"itemIds\":[\"b1m4sprechenueber\"],\"tip\":\"wo + r + über = worüber. La -r- aparece porque über empieza por vocal.\"},{\"id\":\"b1m4l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿En qué piensas? — Pienso en ello cada día.\",\"answers\":[\"Woran denkst du? Ich denke jeden Tag daran\",\"Woran denkst du? — Ich denke jeden Tag daran\"],\"hints\":[\"Pregunta: wo + r + an · respuesta: da + r + an\",\"Woran denkst du? Ich denke jeden Tag ...\"],\"itemIds\":[\"b1m4worandenkstdu\",\"b1m4denkenan\"],\"tip\":\"Si te salieron woran y daran seguidos, ya manejas la pieza que el español no tiene. Es de lo que más nivel demuestra.\"},{\"id\":\"b1m4l5e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: anuncio de un programa de radio · tarea 1 de 2. Dos escuchas. Está lleno de da-/wo-, que es lo que acabas de estudiar.\",\"audio\":\"Und heute Abend um acht in unserer Sendung «Abschalten»: Worauf freuen Sie sich eigentlich, wenn das Handy mal aus ist? Zu Gast sind eine Autorin, die sich auf Langeweile freut — daraus entstehe bei ihr alles, sagt sie —, und ein Unternehmer, der genau darauf gut verzichten kann, weil Erreichbarkeit sein Beruf ist. Rufen Sie an oder schreiben Sie uns, ähm, wie Sie möchten. Heute, zwanzig Uhr.\",\"question\":\"„Beide Gäste freuen sich auf die Langeweile.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"El empresario «kann genau darauf gut verzichten»: justo de eso puede prescindir\",null],\"itemIds\":[\"b1m4ichfreuemichdarauf\",\"b1m4sichfreuenauf\"],\"tip\":\"«darauf verzichten» ≠ «sich darauf freuen». Una sílaba de diferencia y la postura es la contraria: ahí se juega la respuesta.\"},{\"id\":\"b1m4l5e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo anuncio, segunda tarea. Dos escuchas.\",\"audio\":\"Und heute Abend um acht in unserer Sendung «Abschalten»: Worauf freuen Sie sich eigentlich, wenn das Handy mal aus ist? Zu Gast sind eine Autorin, die sich auf Langeweile freut — daraus entstehe bei ihr alles, sagt sie —, und ein Unternehmer, der genau darauf gut verzichten kann, weil Erreichbarkeit sein Beruf ist. Rufen Sie an oder schreiben Sie uns, ähm, wie Sie möchten. Heute, zwanzig Uhr.\",\"question\":\"¿Por qué el empresario no echa de menos estar desconectado?\",\"options\":[\"Porque estar localizable es su trabajo\",\"Porque se aburre enseguida\",\"Porque no tiene móvil\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El aburrimiento es lo de la autora\",\"Claro que tiene móvil: vive de estar localizable\"],\"itemIds\":[\"b1m4sichfreuenueber\",\"b1m4worandenkstdu\"]}]}],\"resources\":[{\"label\":\"DW — Grammatik: Präpositionaladverbien\",\"url\":\"https://learngerman.dw.com/de/grammatik/c-56230145\",\"note\":\"Los da-/wo-Komposita explicados con audio y una tabla completa.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/08950
