003eSie müssten sich erst anmelden\u003c/b\u003e · \u003cb\u003eDafür brauchen Sie ein Zeugnis\u003c/b\u003e · \u003cb\u003eDas lohnt sich nur, wenn…\u003c/b\u003e · \u003cb\u003eAn Ihrer Stelle würde ich…\u003c/b\u003e (yo en tu lugar). Todas llevan Konjunktiv II de cortesía: en una oficina alemana, así es como se aconseja.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAviso de formato:\u003c/b\u003e el Teil 3 completo, con sus siete afirmaciones y una sola escucha, lo entrenas en los módulos 3 y 5. Lo que cierra este módulo es el otro monstruo, el \u003cb\u003eTeil 4\u003c/b\u003e: tres minutos de debate a tres voces y ocho afirmaciones que hay que repartir."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m6l7\",\"phaseId\":\"b1m6\",\"title\":\"Beratung an der Volkshochschule\",\"subtitle\":\"Escucha una consulta real y quédate con lo que hay que hacer\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que se dice en una consulta\",\"itemIds\":[\"b1m6beratung\",\"b1m6gebuehr\",\"b1m6zeugnis\",\"b1m6kenntnisse\",\"b1m6nachholen\",\"b1m6sichlohnen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Escuchar una consulta: quédate con la ACCIÓN\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje de la Volkshochschule · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist die Volkshochschule, Sie hatten wegen des Deutschkurses B1 angerufen. Also, direkt anmelden können Sie sich dafür nicht, das geht so nicht. Sie müssten sich erst mal zum Einstufungstest anmelden — der ist jeden ersten Montag im Monat und kostet nichts. Danach bekommen Sie den Kurs, der wirklich zu Ihnen passt. Rufen Sie einfach zurück, dann tragen wir Sie ein.\",\"question\":\"„Der Einstufungstest kostet nichts.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«der ist jeden ersten Montag im Monat und kostet nichts»\"],\"itemIds\":[\"b1m6beratung\",\"b1m6sichanmeldenfuer\"],\"tip\":\"«Da müssten Sie sich erst…» = «primero tendría usted que…». Ese müssten cortés es la señal de que llega la acción obligatoria.\"},{\"id\":\"b1m6l7e12\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist die Volkshochschule, Sie hatten wegen des Deutschkurses B1 angerufen. Also, direkt anmelden können Sie sich dafür nicht, das geht so nicht. Sie müssten sich erst mal zum Einstufungstest anmelden — der ist jeden ersten Montag im Monat und kostet nichts. Danach bekommen Sie den Kurs, der wirklich zu Ihnen passt. Rufen Sie einfach zurück, dann tragen wir Sie ein.\",\"question\":\"¿Qué tiene que hacer primero esta persona?\",\"options\":[\"Pagar la cuota del curso\",\"Apuntarse a la prueba de nivel\",\"Traer un certificado\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"No se menciona ningún pago: la prueba es gratis\",null,\"El Zeugnis no aparece en este mensaje\"],\"itemIds\":[\"b1m6volkshochschule\",\"b1m6sprachkurs\"]},{\"id\":\"b1m6l7e2\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: segundo mensaje de la asesora, sobre el título · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Und noch etwas zu Ihrer zweiten Frage, wegen des Schulabschlusses. Zum Nachholen brauchen Sie mindestens Niveau B1 — das haben Sie ja bald. Lohnen tut sich das aber echt nur, wenn Sie mindestens ein Jahr Zeit haben. Sonst, ähm, würde ich Ihnen erst einen Abendkurs empfehlen und den Abschluss ein Jahr später. Überlegen Sie in Ruhe, der nächste Anmeldeschluss ist sowieso erst im Mai.\",\"question\":\"„Für den Schulabschluss reicht das Niveau A2.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Zum Nachholen brauchen Sie mindestens Niveau B1»\",null],\"itemIds\":[\"b1m6nachholen\",\"b1m6abschluss\"],\"tip\":\"«mindestens» delante de un nivel es una barrera, no una recomendación. Y la asesora nunca dice «nein»: dice «lohnen tut sich das nur, wenn…».\"},{\"id\":\"b1m6l7e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Und noch etwas zu Ihrer zweiten Frage, wegen des Schulabschlusses. Zum Nachholen brauchen Sie mindestens Niveau B1 — das haben Sie ja bald. Lohnen tut sich das aber echt nur, wenn Sie mindestens ein Jahr Zeit haben. Sonst, ähm, würde ich Ihnen erst einen Abendkurs empfehlen und den Abschluss ein Jahr später. Überlegen Sie in Ruhe, der nächste Anmeldeschluss ist sowieso erst im Mai.\",\"question\":\"¿Cuándo merece la pena sacarse el título, según la asesora?\",\"options\":[\"Solo si se dispone de al menos un año\",\"Solo con un curso intensivo\",\"Solo si ya se tiene el B2\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo que recomienda si hay poco tiempo es un curso de tarde, no intensivo\",\"El nivel que nombra es B1, no B2\"],\"itemIds\":[\"b1m6sichlohnen\",\"b1m6gebuehr\"],\"tip\":\"«Das lohnt sich nur, wenn…» — la condición ES la respuesta. En el Hören casi siempre hay un wenn escondido.\"},{\"id\":\"b1m6l7e3\",\"type\":\"match\",\"prompt\":\"Empareja las fórmulas de la consulta\",\"pairs\":[{\"target\":\"Da müssten Sie sich erst anmelden.\",\"source\":\"Primero tendría que apuntarse\"},{\"target\":\"Dafür brauchen Sie ein Zeugnis.\",\"source\":\"Para eso necesita un certificado\"},{\"target\":\"Das lohnt sich.\",\"source\":\"Merece la pena\"},{\"target\":\"An Ihrer Stelle würde ich warten.\",\"source\":\"Yo en su lugar esperaría\"}],\"itemIds\":[\"b1m6beratung\",\"b1m6zeugnis\",\"b1m6sichlohnen\"]},{\"id\":\"b1m6l7e4\",\"type\":\"shadow\",\"prompt\":\"Sombrea la frase de la asesora\",\"text\":\"Da müssten Sie sich erst zum Test anmelden.\",\"translation\":\"Primero tendría que apuntarse a la prueba.\",\"reps\":2,\"itemIds\":[\"b1m6sichanmeldenfuer\",\"b1m6beratung\"],\"tip\":\"Fíjate en la melodía: müssten baja, anmelden cierra. Así suena un consejo educado en una oficina alemana.\"},{\"id\":\"b1m6l7e5\",\"type\":\"hearreal\",\"prompt\":\"Escucha — ¿qué significa?\",\"book\":\"Ich weiß es nicht genau.\",\"real\":\"Da bin ich überfragt.\",\"translation\":\"Eso ya no lo sé / ahí me pillas.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Ahí ya no sé responder\",\"Me han preguntado demasiado\",\"No me interesa la pregunta\"],\"itemIds\":[\"b1m6beratung\"],\"tip\":\"«Da bin ich überfragt» es lo que dice un funcionario amable cuando no sabe algo. Reconocerlo te ahorra un malentendido.\"},{\"id\":\"b1m6l7e6\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta de la consulta\",\"text\":\"Wie hoch ist die ___ für den Kurs?\",\"answers\":[\"Gebühr\"],\"translation\":\"¿De cuánto es la cuota del curso?\",\"hints\":[\"La palabra alemana para «tasa/cuota»\",\"Ge... con ü\"],\"itemIds\":[\"b1m6gebuehr\"],\"strictUmlaut\":true},{\"id\":\"b1m6l7e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la pregunta clave\",\"text\":\"Kann ich den Abschluss auch abends nachholen?\",\"translation\":\"¿Puedo sacarme el título también por las tardes?\",\"hints\":[\"Pregunta con modal: verbo al final\",\"Kann ich den Abschluss auch abends ...?\"],\"itemIds\":[\"b1m6nachholen\",\"b1m6abschluss\"]},{\"id\":\"b1m6l7e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el diálogo con el banco\",\"text\":\"Ich interessiere mich ___ den Abendkurs. — Dafür müssten Sie ___ einem Einstufungstest teilnehmen. — Und wenn ich durchfalle? — ___ wiederholen Sie den Test im nächsten Monat.\",\"answers\":[\"für\",\"an\",\"Dann\"],\"bank\":[\"für\",\"an\",\"Dann\",\"um\",\"auf\",\"von\",\"Deshalb\"],\"translation\":\"Me interesa el curso de tarde. — Para eso tendría que hacer una prueba de nivel. — ¿Y si suspendo? — Entonces repite la prueba el mes que viene.\",\"itemIds\":[\"b1m6sichinteressierenfuer\",\"b1m6teilnehmenan\",\"b1m6durchgefallen\"],\"tip\":\"sich interessieren für + Akk · teilnehmen an + Dat. Y Dann, como todo adverbio de posición 1, se lleva el verbo detrás.\"},{\"id\":\"b1m6l7e9\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto en el correo a la VHS. Arréglalo.\",\"wrong\":\"Ich möchte wissen, ob ich kann den Test wiederholen.\",\"answers\":[\"Ich möchte wissen, ob ich den Test wiederholen kann.\",\"Ich möchte wissen, ob ich den Test wiederholen kann\"],\"why\":\"ob es subordinante como dass: el verbo conjugado (kann) cierra la subordinada, detrás del infinitivo. Es la misma pila de la lección 2.\",\"translation\":\"Quisiera saber si puedo repetir la prueba.\",\"itemIds\":[\"b1m6weilarbeitenmuss\"]},{\"id\":\"b1m6l7e10\",\"type\":\"build\",\"prompt\":\"Construye tu pregunta en la ventanilla\",\"target\":\"Ich möchte mich für den Abendkurs anmelden\",\"translation\":\"Quisiera apuntarme al curso de tarde\",\"distractors\":[\"an\",\"teilnehmen\"],\"itemIds\":[\"b1m6sichanmeldenfuer\",\"b1m6sprachkurs\"]},{\"id\":\"b1m6l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me interesa el curso y quisiera participar en la prueba de nivel\",\"answers\":[\"Ich interessiere mich für den Kurs und möchte am Einstufungstest teilnehmen\",\"Ich interessiere mich für den Kurs und möchte am Einstufungstest teilnehmen.\"],\"hints\":[\"Dos rectiones seguidas: für + Akk y an + Dat (an dem = am)\",\"Ich interessiere mich für den Kurs und möchte am ...\"],\"itemIds\":[\"b1m6sichinteressierenfuer\",\"b1m6teilnehmenan\"],\"tip\":\"Dos verbos con preposición en una frase, sin dudar. Eso es exactamente lo que separa un A2 de un B1 hablando.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m6-2\",\"book\":\"Viel Glück bei der Prüfung!\",\"real\":\"Ich drücke dir die Daumen!\",\"meaning\":\"¡Te deseo suerte! (lit. te aprieto los pulgares)\",\"when\":\"Antes de un examen, una entrevista o una consulta importante, con gente a la que tuteas. Con usted existe «Ich drücke Ihnen die Daumen» y se oye mucho, pero en un mail formal el examinador espera el deseo neutro de la fila de examen. Es el gesto alemán equivalente a cruzar los dedos.\",\"register\":\"neutral\",\"exam\":\"Ich wünsche Ihnen viel Erfolg bei der Prüfung.\",\"note\":\"El pulgar va DENTRO del puño, no cruzado. Si cruzas los dedos ante un alemán, entenderá que estás mintiendo.\",\"sound\":\"ij DRÜ-ke dia di DAU-men\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m6natdaumendruecken\"}}],\"resources\":[{\"label\":\"DW — Deutschtrainer / Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Escenas de oficina y consultas con audio: la lengua de ventanilla que pide el Hören Teil 3.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
