fas]].\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el adjetivo, delante y quieto\u003c/b\u003e, como ya machacaste en el A1: \u003ci\u003elong hair\u003c/i\u003e, no \u003ci\u003ehair long\u003c/i\u003e. Ni plural ni femenino: \u003ci\u003etwo tall women\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eOjo a \u003cb\u003ehair\u003c/b\u003e: en inglés es \u003cb\u003eincontable\u003c/b\u003e y va en singular. «Tiene el pelo largo» es \u003ci\u003elong hair\u003c/i\u003e; \u003ci\u003ehairs\u003c/i\u003e son pelos sueltos, los que aparecen en la sopa.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora las dos preguntas que se confunden todo el rato:\u003c/b\u003e\u003cbr/\u003e· [[What does she look like?|¿Cómo es de aspecto?]] → alta, morena, con gafas. \u003ci\u003elook like\u003c/i\u003e es «tener pinta de».\u003cbr/\u003e· [[What's she like?|¿Cómo es de carácter?]] → simpática, tímida, divertida.\u003cbr/\u003e· \u003ci\u003eHow is she?\u003c/i\u003e es otra cosa: pregunta cómo \u003cb\u003eestá\u003c/b\u003e, de salud o de ánimo.\u003cbr/\u003eLas tres se dicen «¿cómo es?» en español, y por eso sale el clásico \u003ci\u003eHow is she like?\u003c/i\u003e, que no es ninguna de las tres."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l1\",\"phaseId\":\"ena2m3\",\"title\":\"What does she look like?\",\"subtitle\":\"Describir a una persona: lo que se ES y lo que se TIENE\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El retrato, pieza a pieza\",\"itemIds\":[\"ena2m3whatdoesshelooklike\",\"ena2m3whatsshelike\",\"ena2m3longdarkhair\",\"ena2m3shorthair\",\"ena2m3blueeyes\",\"ena2m3glasses\",\"ena2m3abeard\",\"ena2m3hesinhisthirties\",\"entall\",\"enyoung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Módulo 3: del «qué pasó» al «quién» y al «cómo»\",\"body\":\"Los dos módulos anteriores te dieron el pasado: ya puedes contar lo que hiciste y lo que pasó. Pero un relato con verbos y sin gente es un parte meteorológico. Este módulo pone lo que falta:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eDescribir\u003c/b\u003e a las personas y a las cosas — y en el examen esto cae seguro: la Parte 3 del oral es literalmente «mira estas dos fotos y di en qué se parecen y en qué se diferencian».\u003cbr/\u003e2. \u003cb\u003eDecir cómo se hace algo\u003c/b\u003e: despacio, deprisa, bien, mal. Los adverbios en -ly.\u003cbr/\u003e3. \u003cb\u003eDónde se colocan.\u003c/b\u003e Y esto no es un detalle: es \u003cb\u003ela trampa gorda del módulo\u003c/b\u003e. Frases como \u003ci\u003eI like very much this film\u003c/i\u003e o \u003ci\u003eShe speaks very well English\u003c/i\u003e son perfectas en español y no existen en inglés. Van enteras en la lección 6.\u003cbr/\u003e\u003cbr/\u003eDe regalo, dos cosas que se presentan para que las reconozcas y de las que no te vamos a examinar: los adjetivos en \u003cb\u003e-ed / -ing\u003c/b\u003e (lección 7) y el \u003cb\u003epasado continuo\u003c/b\u003e (lección 8).\"}},{\"kind\":\"note\",\"note\":{\"title\":\"Ser y tener, repartidos de otra manera\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"por qué\"],[\"Es alta.\",\"She's tall.\",\"be + adjetivo\"],[\"Tiene 25 años.\",\"She's 25.\",\"la edad va con be, como en el A1\"],[\"Tiene el pelo largo.\",\"She has long hair.\",\"have + sustantivo, y el adjetivo DELANTE\"],[\"Lleva gafas.\",\"She wears glasses.\",\"gafas siempre en plural\"],[\"¿Cómo es? (aspecto)\",\"What does she look like?\",\"look like = tener pinta de\"],[\"¿Cómo es? (carácter)\",\"What's she like?\",\"sin look\"],[\"¿Cómo está?\",\"How is she?\",\"salud o ánimo, no descripción\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l1e1\",\"type\":\"mc\",\"prompt\":\"Las dos preguntas que suenan igual en español\",\"question\":\"Quieres saber si es alta o baja, morena o rubia. ¿Qué preguntas?\",\"options\":[\"What does she look like?\",\"What's she like?\",\"How is she?\"],\"answer\":0,\"whyWrong\":[null,\"Esa pregunta por el carácter: te contestarían «she's very friendly»\",\"Esa pregunta cómo está: te contestarían «she's fine, thanks»\"],\"itemIds\":[\"ena2m3whatdoesshelooklike\",\"ena2m3whatsshelike\"],\"tip\":\"El truco está en look: si aparece, la pregunta es por el aspecto. Sin look, por el carácter.\"},{\"id\":\"ena2m3l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — estos adjetivos ya son tuyos del A1\",\"pairs\":[{\"target\":\"tall\",\"source\":\"alto / alta\"},{\"target\":\"young\",\"source\":\"joven\"},{\"target\":\"nice\",\"source\":\"majo / simpático\"},{\"target\":\"funny\",\"source\":\"gracioso / divertido\"},{\"target\":\"big\",\"source\":\"grande\"}],\"targetSeconds\":25,\"itemIds\":[\"entall\",\"enyoung\",\"ennice\",\"enfunny\",\"enbig\"],\"tip\":\"El A2 no empieza de cero: describir gente es media docena de adjetivos del A1 más el sitio donde ponerlos.\"},{\"id\":\"ena2m3l1e3\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del retrato\",\"pairs\":[{\"target\":\"long dark hair\",\"source\":\"el pelo largo y moreno\"},{\"target\":\"short hair\",\"source\":\"el pelo corto\"},{\"target\":\"big blue eyes\",\"source\":\"unos ojos azules grandes\"},{\"target\":\"a beard\",\"source\":\"barba\"},{\"target\":\"glasses\",\"source\":\"gafas\"}],\"itemIds\":[\"ena2m3longdarkhair\",\"ena2m3shorthair\",\"ena2m3blueeyes\",\"ena2m3glasses\",\"ena2m3abeard\"]},{\"id\":\"ena2m3l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Va con IS o con HAS?\",\"categories\":[\"She IS…\",\"She HAS…\"],\"items\":[{\"text\":\"tall\",\"bucket\":0},{\"text\":\"long hair\",\"bucket\":1},{\"text\":\"25\",\"bucket\":0},{\"text\":\"blue eyes\",\"bucket\":1},{\"text\":\"young\",\"bucket\":0},{\"text\":\"a nice jacket\",\"bucket\":1}],\"itemIds\":[\"ena2m3longdarkhair\",\"ena2m3blueeyes\",\"entall\",\"enyoung\",\"enjacket\"],\"tip\":\"Regla de bolsillo: si detrás hay un ADJETIVO, be. Si detrás hay un SUSTANTIVO, have. La edad es la excepción que ya conoces: va con be aunque sea un número.\"},{\"id\":\"ena2m3l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el verbo que toca\",\"text\":\"Amy ___ long dark hair and green eyes.\",\"answers\":[\"has\"],\"translation\":\"Amy tiene el pelo largo y moreno, y los ojos verdes.\",\"hints\":[\"Detrás viene un sustantivo (hair), no un adjetivo\",\"h…\"],\"itemIds\":[\"ena2m3longdarkhair\",\"ena2m3green\"]},{\"id\":\"ena2m3l1e6\",\"type\":\"cloze\",\"prompt\":\"Y ahora el otro verbo\",\"text\":\"Ben ___ in his thirties and he has a beard.\",\"answers\":[\"is\",\"'s\"],\"translation\":\"Ben tiene treinta y tantos y lleva barba.\",\"hints\":[\"La edad en inglés va con be, como «I'm 25 years old»\",\"i…\"],\"itemIds\":[\"ena2m3hesinhisthirties\",\"ena2m3abeard\"]},{\"id\":\"ena2m3l1e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — este lo escribe todo el mundo\",\"wrong\":\"She has the hair long.\",\"answers\":[\"She has long hair.\"],\"why\":\"El español pone el adjetivo detrás y el artículo delante: «tiene EL pelo LARGO». El inglés hace las dos cosas al revés: el adjetivo va delante del sustantivo y no hay artículo, porque no hablas de un pelo concreto sino de cómo lo tiene. Y hair va en singular: es incontable.\",\"translation\":\"Tiene el pelo largo.\",\"itemIds\":[\"ena2m3longdarkhair\"]},{\"id\":\"ena2m3l1e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «tener» que en inglés es «ser»\",\"wrong\":\"He has thirty.\",\"answers\":[\"He is thirty.\"],\"why\":\"La edad, el hambre, el frío, el miedo y la suerte van en inglés con BE, no con have: I'm 25, I'm hungry, I was lucky. Es una lista cerrada — apréndetela entera y no vuelves a fallarla.\",\"translation\":\"Tiene treinta años.\",\"itemIds\":[\"ena2m3hesinhisthirties\"]},{\"id\":\"ena2m3l1e9\",\"type\":\"build\",\"prompt\":\"Construye la descripción\",\"target\":\"She has short dark hair and glasses\",\"translation\":\"Tiene el pelo corto y moreno, y lleva gafas\",\"distractors\":[\"the\",\"hairs\"],\"itemIds\":[\"ena2m3shorthair\",\"ena2m3glasses\"],\"tip\":\"Ni «the» ni «hairs» tienen sitio: sin artículo y en singular. Las fichas que sobran están ahí a propósito.\"},{\"id\":\"ena2m3l1e10\",\"type\":\"transform\",\"prompt\":\"Añade lo que tiene\",\"source\":\"Ben is tall.\",\"instruction\":\"Añade que tiene barba, enlazando con and\",\"answers\":[\"Ben is tall and he has a beard.\",\"Ben is tall and has a beard.\",\"Ben's tall and he has a beard.\"],\"translation\":\"Ben es alto y lleva barba.\",\"hints\":[\"El segundo verbo no es be: lo que tiene va con have\",\"Ben is tall and he h… a beard.\"],\"itemIds\":[\"ena2m3abeard\",\"entall\"]},{\"id\":\"ena2m3l1e11\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"She has long dark hair and big blue eyes.\",\"translation\":\"Tiene el pelo largo y moreno, y unos ojos azules grandes.\",\"hints\":[\"Empieza por She has…\",\"She has long dark h… and big blue e…\"],\"itemIds\":[\"ena2m3longdarkhair\",\"ena2m3blueeyes\"]},{\"id\":\"ena2m3l1e12\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Tiene el pelo corto y lleva gafas.\",\"answers\":[\"She has short hair and she wears glasses.\",\"She has short hair and wears glasses.\",\"He has short hair and he wears glasses.\"],\"hint\":\"dos verbos distintos: uno para lo que tiene y otro para lo que lleva puesto\",\"itemIds\":[\"ena2m3shorthair\",\"ena2m3glasses\",\"enwear\"]},{\"id\":\"ena2m3l1e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cómo es tu hermana? — Es alta y tiene el pelo largo y moreno.\",\"answers\":[\"What does your sister look like? She's tall and she has long dark hair.\",\"What does your sister look like? She's tall and has long dark hair.\",\"What does your sister look like? She is tall and she has long dark hair.\"],\"hints\":[\"La pregunta del aspecto lleva look\",\"What does your sister l… like? She's tall and she h… long dark hair.\"],\"itemIds\":[\"ena2m3whatdoesshelooklike\",\"ena2m3longdarkhair\",\"ensister\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m3-1\",\"book\":\"She has long dark hair.\",\"real\":\"She's got long dark hair.\",\"meaning\":\"Tiene el pelo largo y moreno\",\"when\":\"En Reino Unido, «have got» es lo NORMAL al hablar de lo que uno tiene: el pelo, un coche, hermanos, dolor de cabeza. «She has» no está mal —y en el examen escrito puntúa igual—, pero suena a libro. En Estados Unidos se prefiere «has» a secas.\",\"register\":\"neutral\",\"note\":\"El got no añade significado: es puro relleno británico. Y al hablar rápido «she's got» se funde en «shis̬-got», una sola pieza.\",\"sound\":\"shis̬ got long daak JÉA\",\"level\":\"a2\",\"itemId\":\"ena2m3longdarkhair\"}}],\"resources\":[{\"label\":\"British Council — A2 Speaking: describing people\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca el vídeo de descripción de personas y apunta cada adjetivo que salga en una columna y cada sustantivo (hair, eyes, beard) en otra. Esa columna decide si va be o have.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-ap
