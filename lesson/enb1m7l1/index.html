ramática\u003c/i\u003e usa. Cuando un escocés dice \u003ci\u003ewee\u003c/i\u003e por \u003ci\u003esmall\u003c/i\u003e, eso no es acento: es dialecto.\u003cbr/\u003e· \u003cb\u003eslang\u003c/b\u003e — lo que la gente dice entre amigos y \u003cb\u003eno escribe nunca\u003c/b\u003e en un examen. Es incontable: \u003ci\u003eslang\u003c/i\u003e, jamás \u003ci\u003eslangs\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora lo importante, dicho sin adornos.\u003c/b\u003e Este módulo \u003cb\u003eno te va a enseñar acentos\u003c/b\u003e. La voz que lee los audios de este curso es una sola y no cambia de país: prometerte «escucha el acento escocés» sería mentirte. Lo que sí vamos a hacer —y es lo que de verdad se cobra en el examen y en la calle— es enseñarte \u003cb\u003elas palabras y las frases\u003c/b\u003e de cada variedad, para que cuando las leas o las oigas \u003cb\u003esepas qué significan\u003c/b\u003e. El día que te toque un hablante de Glasgow, lo que te salvará no será haber oído la melodía: será saber que \u003ci\u003ewee\u003c/i\u003e es \u003ci\u003esmall\u003c/i\u003e y que \u003ci\u003eaye\u003c/i\u003e es \u003ci\u003eyes\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003ePara el acento en sí hay una cosa que funciona y no está en ningún libro: \u003cb\u003eescuchar mucho, de fuentes reales, sin subtítulos y sin entenderlo todo\u003c/b\u003e. Al final de cada lección tienes por dónde empezar."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l1\",\"phaseId\":\"enb1m7\",\"title\":\"Which English?\",\"subtitle\":\"Acento, dialecto y argot — y qué se puede aprender leyendo\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario para hablar de cómo se habla\",\"itemIds\":[\"enb1m7accent\",\"enb1m7dialect\",\"enb1m7variety\",\"enb1m7slang\",\"enb1m7expression\",\"enb1m7pronounce\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es este módulo, y qué NO es\",\"body\":\"$17\",\"table\":[[\"\",\"Qué es\",\"Ejemplo\"],[\"accent\",\"cómo suena\",\"la misma palabra, otra música\"],[\"dialect\",\"qué palabras y qué gramática\",\"wee (Escocia) = small\"],[\"slang\",\"lo de entre amigos, nunca escrito\",\"That's rubbish.\"],[\"variety\",\"el inglés entero de un sitio\",\"Australian English\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro palabras que vas a usar todo el módulo\",\"pairs\":[{\"target\":\"a strong accent\",\"source\":\"un acento marcado\"},{\"target\":\"a dialect\",\"source\":\"un dialecto: otras palabras, otra gramática\"},{\"target\":\"slang\",\"source\":\"argot: lo de entre amigos, nunca escrito\"},{\"target\":\"a local expression\",\"source\":\"una expresión de la zona\"}],\"itemIds\":[\"enb1m7accent\",\"enb1m7dialect\",\"enb1m7slang\",\"enb1m7expression\"],\"tip\":\"Fíjate en que «slang» va sin artículo y sin plural. Es incontable, como «information» o «advice»: se dice «a lot of slang», nunca «many slangs».\"},{\"id\":\"enb1m7l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — esto ya lo tienes del módulo 1\",\"pairs\":[{\"target\":\"the neighbourhood\",\"source\":\"el barrio\"},{\"target\":\"so far\",\"source\":\"hasta ahora\"},{\"target\":\"a shared house\",\"source\":\"una casa compartida\"},{\"target\":\"my home country\",\"source\":\"mi país de origen\"},{\"target\":\"at last\",\"source\":\"por fin\"}],\"targetSeconds\":22,\"itemIds\":[\"enb1m1neighbourhood\",\"enb1m1sofar\",\"enb1m1sharedhouse\",\"enb1m1homecountry\",\"enb1m1atlast\"],\"tip\":\"El cronómetro solo premia. Lo que se entrena aquí no es saber la palabra: es sacarla rápido, que es la diferencia entre entender una conversación y ir siempre una frase por detrás.\"},{\"id\":\"enb1m7l1e3\",\"type\":\"mc\",\"prompt\":\"La distinción que sostiene el módulo entero\",\"question\":\"Un escocés dice «It's a wee kitchen» en vez de «It's a small kitchen». ¿Qué es eso?\",\"options\":[\"Dialecto: ha cambiado la palabra\",\"Acento: suena distinto\",\"Argot: es una palabra de la calle\"],\"answer\":0,\"whyWrong\":[null,\"El acento es cómo suena, no qué palabra elige. Aquí la palabra ES otra: «wee» en lugar de «small».\",\"«wee» no es jerga juvenil ni de barrio: es la palabra normal de una región entera, y sale escrita en la prensa escocesa.\"],\"itemIds\":[\"enb1m7dialect\",\"enb1m7accent\",\"enb1m7slang\"],\"tip\":\"Regla rápida: si puedes escribirlo y sigue siendo otra palabra, es dialecto. Si solo cambia la música, es acento.\"},{\"id\":\"enb1m7l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo\",\"text\":\"How do you ___ this word? I've read it a hundred times and never heard it.\",\"answers\":[\"pronounce\",\"say\"],\"translation\":\"¿Cómo se pronuncia esta palabra? La he leído cien veces y nunca la he oído.\",\"hints\":[\"Es el verbo del sonido, no el de la ortografía\",\"pro...\"],\"itemIds\":[\"enb1m7pronounce\"],\"tip\":\"Ojo a los dos verbos parecidos: «spell» es cómo se ESCRIBE (letra a letra) y «pronounce» es cómo SUENA. En el examen oral te piden lo primero; en la calle necesitas lo segundo.\"},{\"id\":\"enb1m7l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"In Scotland they have a very different accent and slangs.\",\"answers\":[\"In Scotland they have a very different accent and slang.\"],\"why\":\"«slang» es incontable: no tiene plural, igual que «information», «advice» o «furniture». Se dice «a lot of slang» o «some slang», nunca «slangs».\",\"translation\":\"En Escocia tienen un acento muy distinto y su propio argot.\",\"itemIds\":[\"enb1m7slang\"]},{\"id\":\"enb1m7l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"She has a very strong Scottish accent\",\"translation\":\"Tiene un acento escocés muy marcado\",\"distractors\":[\"much\",\"dialect\"],\"itemIds\":[\"enb1m7accent\"],\"tip\":\"En inglés el adjetivo de nacionalidad va SIEMPRE con mayúscula: Scottish, Irish, Australian, Indian. En español no, y ese es el descuido que más se ve en el Writing.\"},{\"id\":\"enb1m7l1e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Hay muchas variedades del inglés y todas son correctas.\",\"answers\":[\"There are many varieties of English and they are all correct\",\"There are a lot of varieties of English and they are all correct\",\"There are many varieties of English and all of them are correct\"],\"hint\":\"El sustantivo del que hablamos hoy, en plural\",\"itemIds\":[\"enb1m7variety\"],\"tip\":\"«variety» hace el plural en «-ies», como «city» o «country»: variety → varieties. Y ojo: «a variety of» + plural también significa «una serie de», que es otro uso distinto.\"},{\"id\":\"enb1m7l1e8\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"En Irlanda usan un montón de expresiones locales.\",\"answers\":[\"In Ireland they use a lot of local expressions\",\"In Ireland they use lots of local expressions\",\"They use a lot of local expressions in Ireland\"],\"hints\":[\"Sujeto impersonal: «they»\",\"In Ireland they use a lot of ...\"],\"itemIds\":[\"enb1m7expression\"],\"tip\":\"El «se» impersonal del español («se usan») en inglés suele salir como «they» o como pasiva. «They use» es lo natural hablando; «are used» es lo que escribirías en un texto formal.\"},{\"id\":\"enb1m7l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen del módulo con las palabras exactas\",\"text\":\"English is not one language with one set of words. An ___ is the way somebody pronounces; a ___ is a whole set of words and grammar; and ___ is what people say to their friends and never write in an exam. None of them is wrong: they are three ___ of the same language.\",\"answers\":[\"accent\",\"dialect\",\"slang\",\"varieties\"],\"bank\":[\"accent\",\"dialect\",\"slang\",\"varieties\",\"expression\",\"grammar\",\"translation\"],\"translation\":\"El inglés no es un idioma con un solo juego de palabras. Un acento es cómo pronuncia alguien; un dialecto es un conjunto entero de palabras y gramática; y el argot es lo que la gente dice a sus amigos y nunca escribe en un examen. Ninguno está mal: son tres variedades del mismo idioma.\",\"itemIds\":[\"enb1m7accent\",\"enb1m7dialect\",\"enb1m7slang\",\"enb1m7variety\"],\"tip\":\"Si te sale el cuarto hueco a la primera, ya tienes la idea del módulo entera: no hay un inglés bueno y varios malos. Hay variedades.\"},{\"id\":\"enb1m7l1e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es la pregunta que más te va a salvar este mes\",\"text\":\"Sorry, how do you pronounce this word?\",\"phonetic\":\"SÓ-ri, jau du yu pro-NÁUNS dis ueed\",\"translation\":\"Perdona, ¿cómo se pronuncia esta palabra?\",\"itemIds\":[\"enb1m7pronounce\",\"ensorry\"],\"tip\":\"Fíjate en el acento de «pronounce»: cae en la SEGUNDA sílaba (pro-NAUNCE). Si lo dices como en español, con el golpe al principio, se entiende igual pero suena a libro.\"},{\"id\":\"enb1m7l1e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"Everyone here has an accent, including you.\",\"translation\":\"Todo el mundo aquí tiene acento, tú incluida.\",\"hints\":[\"Empieza por «Everyone…»\",\"Everyone here has an ...\"],\"itemIds\":[\"enb1m7accent\"],\"tip\":\"Esa es la frase del módulo. No existe «hablar sin acento»: existe hablar con el acento que a ti te parece normal porque es el tuyo.\"},{\"id\":\"enb1m7l1e12\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"My grandmother was from Inverness, and she said wee for small, aye for yes, and messages for the shopping. When I moved down to London at nineteen, people in my first job kept asking me to repeat things, and it wasn't because of the way I sounded. It was those three words.\",\"question\":\"¿Por qué le pedían que repitiera, según ella?\",\"options\":[\"Por las palabras que usaba, no por cómo sonaba\",\"Porque hablaba demasiado deprisa\",\"Porque su abuela le había enseñado mal\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No dice nada de la velocidad. Habla de tres palabras concretas: wee, aye y messages.\",\"Al contrario: presenta esas palabras como lo normal en su familia, no como un error.\"],\"itemIds\":[\"enb1m7dialect\",\"enb1m7accent\"],\"tip\":\"«the messages» = la compra, en Escocia. Es el falso amigo perfecto: entiendes las dos palabras por separado y aun así no entiendes la frase. De eso va todo este módulo.\"},{\"id\":\"enb1m7l1e13\",\"type\":\"mc\",\"prompt\":\"Antes de seguir: qué te va a dar este módulo y qué no\",\"question\":\"¿Qué vas a poder hacer al terminar estas diez lecciones?\",\"options\":[\"Reconocer las palabras de cada variedad al leerlas y al oírlas\",\"Imitar el acento escocés y el australiano\",\"Hablar como un nativo de Dublín\"],\"answer\":0,\"whyWrong\":[null,\"Imitar un acento se aprende oyendo mucho a hablantes reales, no leyendo un curso. Aquí tienes enlaces para eso al final de cada lección.\",\"Nadie te va a pedir eso, y en el examen no puntúa: la rúbrica dice «clearly intelligible even if a foreign accent is sometimes evident».\"],\"itemIds\":[\"enb1m7variety\"],\"tip\":\"El handbook del examen lo dice con todas las letras: el acento extranjero NO baja nota mientras se te entienda. Lo que sí la baja es no entender lo que te dicen.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m7-1\",\"book\":\"Yes, it's a small kitchen.\",\"real\":\"Aye, it's a wee kitchen.\",\"meaning\":\"Sí, es una cocina pequeña.\",\"when\":\"En Escocia y en el norte de Irlanda, en cualquier registro hablado: «aye» y «wee» no son argot juvenil, los dice todo el mundo y salen impresos en la prensa local. Fuera de allí no se usan, y en un examen internacional tampoco.\",\"register\":\"regional\",\"exam\":\"Yes, it's quite a small kitchen.\",\"note\":\"«wee» va delante del sustantivo como cualquier adjetivo («a wee bit», «a wee minute») y suaviza además de empequeñecer: «a wee problem» es «un problemilla». «Aye» es simplemente «yes» — hasta el Parlamento británico vota diciendo «the ayes have it».\",\"sound\":\"ai, its a uíi KÍ-chen\",\"level\":\"b1\",\"produce\":false,\"itemId\":\"enb1m7nataye\"}}],\"resources\":[{\"label\":\"IDEA — International Dialects of English Archive\",\"url\":\"https://www.dialectsarchive.com/\",\"note\":\"Grabaciones reales de hablantes de todo el mundo leyendo el MISMO texto. Escoge Scotland y luego Texas: misma frase, dos mundos. Diez minutos, sin intentar entenderlo todo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
