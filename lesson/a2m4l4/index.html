4\",\"phaseId\":\"a2m4\",\"title\":\"schmeckt mir!\",\"subtitle\":\"Los verbos que te sientan: schmecken, passen, stehen, danken\",\"minutes\":9,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuatro verbos nuevos de la banda dativa\",\"itemIds\":[\"a2m4schmecken\",\"a2m4dasschmecktmir\",\"a2m4diehosepasstmir\",\"a2m4daskleidstehtdir\",\"a2m4danken\",\"a2m4ichdankedir\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la banda del dativo crece\",\"body\":\"Al trío helfen–gefallen–gehören se suman cuatro verbos de comida y ropa: \u003cb\u003eschmecken\u003c/b\u003e (saber rico: \u003ci\u003eDas schmeckt \u003cb\u003emir\u003c/b\u003e!\u003c/i\u003e — para comida, no gefallen), \u003cb\u003epassen\u003c/b\u003e (quedar bien DE TALLA: \u003ci\u003eDie Hose passt \u003cb\u003emir\u003c/b\u003e\u003c/i\u003e — tu chunk del A1, ahora explicado), \u003cb\u003estehen\u003c/b\u003e (sentar bien, favorecer: \u003ci\u003eDas Kleid steht \u003cb\u003edir\u003c/b\u003e!\u003c/i\u003e) y \u003cb\u003edanken\u003c/b\u003e (dar las gracias: \u003ci\u003eIch danke \u003cb\u003edir\u003c/b\u003e!\u003c/i\u003e). El reparto fino que el examen adora: \u003cb\u003egefallen\u003c/b\u003e es para lo que ves u oyes, \u003cb\u003eschmecken\u003c/b\u003e solo para lo que comes o bebes, \u003cb\u003epassen\u003c/b\u003e habla de talla y \u003cb\u003estehen\u003c/b\u003e de estilo. En todos, la persona va en dativo — por eso el camarero pregunta \u003ci\u003eSchmeckt es Ihnen?\u003c/i\u003e\",\"table\":[[\"verbo\",\"chunk\",\"cuándo\"],[\"schmecken\",\"Das schmeckt mir!\",\"comida y bebida\"],[\"gefallen\",\"Das gefällt mir\",\"lo que ves u oyes\"],[\"passen\",\"Die Hose passt mir\",\"la talla\"],[\"stehen\",\"Das Kleid steht dir\",\"el estilo — te favorece\"],[\"danken\",\"Ich danke dir!\",\"las gracias\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m4l4e1\",\"type\":\"match\",\"prompt\":\"Empareja cada verbo con su terreno\",\"pairs\":[{\"target\":\"schmecken\",\"source\":\"saber rico (comida)\"},{\"target\":\"passen\",\"source\":\"quedar bien de talla\"},{\"target\":\"stehen\",\"source\":\"sentar bien, favorecer\"},{\"target\":\"danken\",\"source\":\"dar las gracias\"}],\"itemIds\":[\"a2m4schmecken\",\"passen\",\"a2m4daskleidstehtdir\",\"a2m4danken\"]},{\"id\":\"a2m4l4e2\",\"type\":\"mc\",\"prompt\":\"Elige el verbo justo\",\"question\":\"El pastel está buenísimo. Dices:\",\"options\":[\"Das schmeckt mir!\",\"Das gefällt mir!\",\"Das passt mir!\"],\"answer\":0,\"whyWrong\":[null,\"gefallen es para lo que ves u oyes — con comida, el verbo es schmecken\",\"passen es de tallas: la ropa te queda bien, el pastel no\"],\"itemIds\":[\"a2m4dasschmecktmir\",\"a2m4schmecken\",\"kuchen\"],\"tip\":\"Comida → schmecken, todo lo demás bonito → gefallen. Confundirlos es el despiste favorito del examen A2.\"},{\"id\":\"a2m4l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa el pronombre\",\"text\":\"Schmeckt ___ der Kuchen? (te)\",\"answers\":[\"dir\"],\"translation\":\"¿Te gusta el pastel? (de sabor)\",\"hints\":[\"La persona que saborea va en dativo\",\"d-i-r\"],\"itemIds\":[\"a2m4schmecken\",\"kuchen\"]},{\"id\":\"a2m4l4e4\",\"type\":\"mc\",\"prompt\":\"¿passen o stehen?\",\"question\":\"Die Jacke ist schön, aber zu klein. →\",\"options\":[\"Die Jacke steht mir nicht\",\"Die Jacke passt mir nicht\"],\"answer\":1,\"whyWrong\":[\"stehen habla de estilo (te favorece o no) — aquí el problema es la talla: passen\",null],\"itemIds\":[\"a2m4diehosepasstmir\",\"passen\",\"jacke\"],\"tip\":\"zu klein / zu groß → passen. «No es mi estilo» → stehen. Dos quejas distintas del probador.\"},{\"id\":\"a2m4l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa el cumplido del probador\",\"text\":\"Das Kleid ___ dir sehr gut! (te sienta)\",\"answers\":[\"steht\"],\"translation\":\"¡El vestido te sienta muy bien!\",\"hints\":[\"El verbo del estilo, no el de la talla\",\"st... — se pronuncia scht\"],\"itemIds\":[\"a2m4daskleidstehtdir\",\"kleid\"],\"tip\":\"stehen aquí no es «estar de pie»: Das steht dir = te favorece. El cumplido alemán de probador.\"},{\"id\":\"a2m4l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa — a él no le gusta\",\"text\":\"Der Salat schmeckt ___ nicht. (a él)\",\"answers\":[\"ihm\"],\"translation\":\"La ensalada no le gusta (de sabor).\",\"hints\":[\"El pronombre dativo de er\",\"i-h-m\"],\"itemIds\":[\"a2m4schmecken\",\"a2m4ihm\",\"salat\"]},{\"id\":\"a2m4l4e7\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«Te doy las gracias» →\",\"options\":[\"Ich danke dich\",\"Ich danke dir\"],\"answer\":1,\"whyWrong\":[\"danken es de la banda dativa: dir — «danke dich» no existe en alemán\",null],\"itemIds\":[\"a2m4danken\",\"a2m4ichdankedir\"],\"tip\":\"Por eso en las tiendas oyes «Ich danke Ihnen»: danken + dativo, siempre.\"},{\"id\":\"a2m4l4e8\",\"type\":\"listen\",\"prompt\":\"Escucha el chunk del probador\",\"text\":\"Die Hose passt mir sehr gut\",\"translation\":\"El pantalón me queda muy bien\",\"hints\":[\"Tu chunk del A1, ahora con nombre: dativo\",\"passt con doble s, mir con r\"],\"itemIds\":[\"a2m4diehosepasstmir\",\"passen\",\"hose\"]},{\"id\":\"a2m4l4e9\",\"type\":\"build\",\"prompt\":\"Construye el cumplido\",\"target\":\"Der Rock steht dir sehr gut\",\"translation\":\"La falda te sienta muy bien\",\"distractors\":[\"dich\",\"stehst\"],\"itemIds\":[\"a2m4daskleidstehtdir\",\"rock\"],\"tip\":\"El sujeto es der Rock (3ª persona: steht) y tú recibes el favor en dativo: dir.\"},{\"id\":\"a2m4l4e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El pantalón me queda bien\",\"answers\":[\"Die Hose passt mir\"],\"hints\":[\"passen + la persona en dativo\",\"Die Hose passt ...\"],\"itemIds\":[\"a2m4diehosepasstmir\",\"passen\",\"hose\"],\"tip\":\"Ya lo decías en el A1 de memoria — ahora sabes que ese mir es dativo y puedes fabricar mil frases más.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «Schmeckt es dir?» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":
