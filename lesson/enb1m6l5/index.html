u003eLa excepción que casi nadie sabe:\u003c/b\u003e cuando la frase es \u003cb\u003enegativa\u003c/b\u003e, el adverbio se pone \u003cb\u003eDELANTE\u003c/b\u003e del auxiliar. \u003ci\u003eI \u003cb\u003eprobably won't\u003c/b\u003e go\u003c/i\u003e, no «I won't probably go». Piénsalo así: lo que dudas es \u003cb\u003eque no vayas\u003c/b\u003e, así que la duda va antes de la negación.\u003cbr/\u003e\u003cbr/\u003eY de propina, dos verbos con preposición pegada que son de este campo y que se aprenden juntos:\u003cbr/\u003e· \u003cb\u003eget over\u003c/b\u003e something — quitarse algo de encima: \u003ci\u003eIt takes a week to get over the flu.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003esuffer from\u003c/b\u003e something — tener una enfermedad crónica: \u003ci\u003eShe suffers from asthma.\u003c/i\u003e No sirve para un mal día: nadie «suffers from» un dolor de cabeza de una tarde."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l5\",\"phaseId\":\"enb1m6\",\"title\":\"I'll probably be back on Monday\",\"subtitle\":\"Cuánto de seguro estás de lo que va a pasar — y dónde se coloca el adverbio\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La escala de lo que va a pasar\",\"itemIds\":[\"enb1m6willprobably\",\"enb1m6probablywont\",\"enb1m6definitely\",\"enb1m6unlikely\",\"enb1m6goodchance\",\"enb1m6getover\",\"enb1m6sufferfrom\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el adverbio tiene un sitio, y no es donde lo pone el español\",\"body\":\"$17\",\"table\":[[\"Seguridad\",\"Cómo se dice\",\"Dónde va el adverbio\"],[\"Seguro que sí\",\"I'll definitely be back.\",\"will + adverbio + verbo\"],[\"Casi seguro que sí\",\"I'll probably be back.\",\"will + adverbio + verbo\"],[\"Casi seguro que no\",\"I probably won't be back.\",\"adverbio + won't + verbo\"],[\"Poco probable\",\"It's unlikely to be serious.\",\"no lleva adverbio: lleva adjetivo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l5e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro escalones\",\"pairs\":[{\"target\":\"I'll definitely be back on Monday.\",\"source\":\"Seguro que vuelvo el lunes.\"},{\"target\":\"I probably won't go to work tomorrow.\",\"source\":\"Seguramente mañana no vaya a trabajar.\"},{\"target\":\"It's unlikely to be serious.\",\"source\":\"Es poco probable que sea grave.\"},{\"target\":\"She suffers from asthma.\",\"source\":\"Tiene asma.\"}],\"itemIds\":[\"enb1m6definitely\",\"enb1m6probablywont\",\"enb1m6unlikely\",\"enb1m6sufferfrom\"],\"tip\":\"Fíjate en la segunda: «probably» va DELANTE de «won't». Es la única de las cuatro donde el adverbio se adelanta, y es justo la que se falla.\"},{\"id\":\"enb1m6l5e2\",\"type\":\"mc\",\"prompt\":\"El sitio del adverbio\",\"question\":\"«Seguramente vuelva el lunes» →\",\"options\":[\"I'll probably be back on Monday.\",\"I'll be probably back on Monday.\",\"Probably I'll be back on Monday.\"],\"answer\":0,\"whyWrong\":[null,\"Ahí es donde lo pone el español. En inglés el adverbio va entre el auxiliar y el verbo, nunca detrás del verbo «be».\",\"No está mal del todo, pero suena a titular o a traducción. En una frase normal, «probably» va dentro del grupo verbal.\"],\"itemIds\":[\"enb1m6willprobably\"],\"tip\":\"Regla corta: si hay auxiliar, el adverbio se mete detrás. «I have never been», «I will probably be», «She can hardly walk». Es siempre el mismo hueco.\"},{\"id\":\"enb1m6l5e3\",\"type\":\"bucket\",\"prompt\":\"¿Es probable que pase, o no?\",\"categories\":[\"Probable\",\"Poco probable\"],\"items\":[{\"text\":\"It's definitely getting better.\",\"bucket\":0},{\"text\":\"I'll probably be back on Monday.\",\"bucket\":0},{\"text\":\"It's unlikely to be serious.\",\"bucket\":1},{\"text\":\"There's a good chance it's just a virus.\",\"bucket\":0},{\"text\":\"I probably won't go to work tomorrow.\",\"bucket\":1},{\"text\":\"I doubt it'll take more than a week.\",\"bucket\":1}],\"itemIds\":[\"enb1m6definitely\",\"enb1m6willprobably\",\"enb1m6unlikely\",\"enb1m6goodchance\"],\"tip\":\"«I doubt it'll…» es una negación disfrazada: en inglés se duda en positivo y significa que no. En español haríamos «dudo que vaya a…», con subjuntivo; en inglés no hay subjuntivo que valga.\"},{\"id\":\"enb1m6l5e4\",\"type\":\"errorfix\",\"prompt\":\"Aquí no falta ni sobra nada: algo está en el sitio equivocado.\",\"wrong\":\"I will be probably back on Monday.\",\"answers\":[\"I will probably be back on Monday.\"],\"why\":\"El adverbio de probabilidad va DETRÁS del auxiliar y DELANTE del verbo: will + probably + be. Donde lo has puesto es donde iría en español, y ahí el inglés no lo admite.\",\"translation\":\"Seguramente vuelva el lunes.\",\"itemIds\":[\"enb1m6willprobably\"]},{\"id\":\"enb1m6l5e5\",\"type\":\"errorfix\",\"prompt\":\"Y la excepción: la frase negativa. Mueve una pieza.\",\"wrong\":\"I won't probably go to work tomorrow.\",\"answers\":[\"I probably won't go to work tomorrow.\"],\"why\":\"En negativo el adverbio se adelanta: va DELANTE del auxiliar. Lo que es probable es que no vayas, así que la probabilidad envuelve a la negación entera.\",\"translation\":\"Seguramente mañana no vaya a trabajar.\",\"itemIds\":[\"enb1m6probablywont\"]},{\"id\":\"enb1m6l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa el adjetivo\",\"text\":\"The doctor says it's ___ to be anything serious.\",\"answers\":[\"unlikely\"],\"translation\":\"La médica dice que es poco probable que sea nada grave.\",\"hints\":[\"Es un adjetivo, no un adverbio: no acaba en -ly de modo\",\"Empieza por «un…»\"],\"itemIds\":[\"enb1m6unlikely\"],\"tip\":\"«unlikely» acaba en -ly y NO es un adverbio: es adjetivo. Por eso va con «to be» detrás y no se mete dentro del grupo verbal. «Friendly» y «lonely» hacen lo mismo.\"},{\"id\":\"enb1m6l5e7\",\"type\":\"build\",\"prompt\":\"Construye la frase negativa con el adverbio en su sitio\",\"target\":\"I probably won't need any tablets\",\"translation\":\"Seguramente no me hagan falta ana en quitarse la gripe de encima.\",\"answers\":[\"It takes a week to get over the flu\",\"It takes a week to get over flu\",\"It takes about a week to get over the flu\"],\"hint\":\"El phrasal verb de «quitarse algo de encima» lleva la preposición de «encima»\",\"itemIds\":[\"enb1m6getover\"],\"tip\":\"«Get over» sirve para una gripe, para un susto y para una ruptura. La imagen es siempre la misma: pasar por encima de algo que estaba en medio.\"},{\"id\":\"enb1m6l5e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué significa exactamente?\",\"source\":\"She suffers from asthma.\",\"answers\":[\"Tiene asma\",\"Padece asma\",\"Sufre de asma\"],\"itemIds\":[\"enb1m6sufferfrom\"],\"tip\":\"«Suffer from» es para lo crónico: asma, migrañas, alergias de siempre. Para lo de hoy se dice «I've got a headache», nunca «I suffer from a headache» — eso suena a que lo tienes desde 2015.\"},{\"id\":\"enb1m6l5e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I probably won't be in tomorrow.\",\"translation\":\"Seguramente mañana no vaya.\",\"strictContractions\":true,\"hints\":[\"El adverbio va antes del auxiliar\",\"I probably won't ...\"],\"itemIds\":[\"enb1m6probablywont\"],\"tip\":\"«won't» y «want» se confunden a la primera: «won't» lleva la o de «go» y «want» la de «hot». Si oyes «I probably want be in», es que has oído mal la vocal, no la gramática.\"},{\"id\":\"enb1m6l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria avisa a la biblioteca. Dos escuchas.\",\"audio\":\"Palmer Road Library, good morning.|Morning, it's Valeria. Listen, I'm not going to make it in today — I've come down with something.|Oh no. Is it the thing that's going round?|Probably. The doctor rang me back and she says it's almost certainly viral, so there's a good chance I'll be fine by the weekend.|Right. And Monday?|I'll probably be back on Monday, but I won't know until Sunday. It's unlikely to be more than that.|Don't worry, we'll move the story session to Wednesday. Take it easy.\",\"question\":\"¿Qué dice Valeria del lunes?\",\"options\":[\"Que seguramente vuelva, pero que no lo sabrá hasta el domingo\",\"Que seguro que vuelve\",\"Que seguro que no vuelve hasta el fin de semana siguiente\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «probably», no «definitely»; y añade que no lo sabrá hasta el domingo.\",\"Dice justo lo contrario: «It's unlikely to be more than that».\"],\"itemIds\":[\"enb1m6willprobably\",\"enb1m6goodchance\",\"enb1m6unlikely\"],\"tip\":\"En el Listening Part 2 el examen adora este juego: la respuesta correcta depende de un adverbio, no de un dato. Si oyes «probably» y marcas la opción que dice «seguro», has entendido todas las palabras y has fallado la pregunta.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m6-3\",\"book\":\"I have a doctor's appointment.\",\"real\":\"I've got a GP appointment.\",\"meaning\":\"Tengo cita con el médico de cabecera\",\"when\":\"Avisando en el trabajo o quedando con alguien. En inglés británico lo normal es «I've got», no «I have», y el médico de cabecera es «the GP», no «the doctor», en cuanto hablas de una cita. En el examen escrito, la versión completa y sin siglas.\",\"register\":\"neutral\",\"exam\":\"I have an appointment with my doctor.\",\"note\":\"«have got» no es más informal que «have»: es sencillamente lo que dice el británico. Lo que sí cambia el registro son las siglas — «GP» en una carta formal se explica la primera vez.\",\"sound\":\"aiv got a dchii PÍI a-PÓINT-ment\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m6natgpappointment\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jb
