 tea — £1.50 · coffee — £2 · orange juice — £2.50\u003cbr/\u003e\u003cbr/\u003eLos carteles y menús del Reading T3 son así: palabra + precio, cero frases. Y la pregunta del examen cruza SIEMPRE dos datos: ¿qué? y ¿cuánto? — o ¿hasta qué hora? Lee la línea entera, no solo el número que brilla.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m5l8e1\",\"type\":\"mc\",\"prompt\":\"Lee el menú de Sam\",\"question\":\"¿Hasta qué hora hay desayuno en el café de Sam?\",\"options\":[\"Hasta las 11:30\",\"Hasta las 7:00\",\"Todo el día\"],\"answer\":0,\"whyWrong\":[null,\"A las 7:00 el desayuno EMPIEZA — el rango es 7:00-11:30\",\"El menú da un horario: quien llega a mediodía se queda sin eggs on toast\"],\"itemIds\":[\"enbreakfast\",\"enmenu\"],\"tip\":\"Los paréntesis del menú son información de examen: (7:00-11:30) responde una pregunta entera.\"},{\"id\":\"ena1m5l8e2\",\"type\":\"mc\",\"prompt\":\"El mismo menú — cruza comida y precio\",\"question\":\"¿Cuánto cuesta el sándwich de pollo?\",\"options\":[\"£3.50\",\"£3\",\"£2.50\"],\"answer\":0,\"whyWrong\":[null,\"£3 es el de queso — lee la palabra, no solo el precio\",\"£2.50 es la tarta de chocolate (y el zumo)\"],\"itemIds\":[\"ensandwich\",\"enchicken\"],\"tip\":\"Dos sándwiches, dos precios: el examen pone los dos para ver si lees la línea completa.\"},{\"id\":\"ena1m5l8e3\",\"type\":\"mc\",\"prompt\":\"Elige del menú\",\"question\":\"Quieres desayunar huevos. ¿Qué pides?\",\"options\":[\"Eggs on toast\",\"A cheese sandwich\",\"Chocolate cake\"],\"answer\":0,\"whyWrong\":[null,\"El sándwich de queso no lleva huevos\",\"La tarta es de chocolate — desayuno de campeones, pero sin huevos\"],\"itemIds\":[\"eneggs\",\"entoast\"],\"tip\":\"eggs on toast: huevos SOBRE la tostada — el on de lugar que ya conoces, ahora en el plato.\"},{\"id\":\"ena1m5l8e4\",\"type\":\"match\",\"prompt\":\"Empareja carta y traducción\",\"pairs\":[{\"target\":\"menu\",\"source\":\"la carta\"},{\"target\":\"toast\",\"source\":\"la tostada\"},{\"target\":\"sandwich\",\"source\":\"el sándwich\"},{\"target\":\"orange juice\",\"source\":\"el zumo de naranja\"}],\"itemIds\":[\"enmenu\",\"entoast\",\"ensandwich\",\"enjuice\"]},{\"id\":\"ena1m5l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa el pedido del desayuno\",\"text\":\"Can I have eggs on ___, please?\",\"answers\":[\"toast\"],\"translation\":\"¿Me pones huevos con tostadas, por favor?\",\"hints\":[\"El plato estrella del desayuno de Sam\",\"eggs on t...\"],\"itemIds\":[\"entoast\",\"encanihaveacoffee\"]},{\"id\":\"ena1m5l8e6\",\"type\":\"order\",\"prompt\":\"Ordena la escena completa en la barra\",\"sentences\":[\"Sam: Good morning! What can I get you?\",\"Valeria: Can I have a cheese sandwich and a coffee, please?\",\"Sam: Anything else?\",\"Valeria: No, thank you!\"],\"translation\":\"Sam: ¡Buenos días! ¿Qué te pongo? — Valeria: ¿Me pones un sándwich de queso y un café, por favor? — Sam: ¿Algo más? — Valeria: ¡No, gracias!\",\"hints\":[\"Primero saluda quien atiende\",\"saludo → pedido → ¿algo más? → cierre\"],\"itemIds\":[\"encanihaveacoffee\",\"enanythingelse\",\"ensandwich\"],\"tip\":\"El guion exacto de la situation del examen oral: saludo, pedido, Anything else?, cierre educado.\"},{\"id\":\"ena1m5l8e7\",\"type\":\"listen\",\"prompt\":\"Escucha el precio del menú\",\"text\":\"The cheese sandwich is three pounds.\",\"translation\":\"El sándwich de queso cuesta tres libras.\",\"hints\":[\"Comida + is + precio\",\"The cheese sandwich is ...\"],\"itemIds\":[\"encheese\",\"ensandwich\"]},{\"id\":\"ena1m5l8e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Sam te entrega el pedido\",\"book\":\"Here is your sandwich.\",\"real\":\"There you go!\",\"translation\":\"Aquí tienes (tu sándwich).\",\"itemIds\":[\"ensandwich\"],\"tip\":\"La entrega en la barra casi nunca es de libro: There you go / Here you go. Respondes thank you y a comer.\"},{\"id\":\"ena1m5l8e10\",\"type\":\"read\",\"prompt\":\"Lee la reseña y responde — no hace falta entender cada palabra\",\"title\":\"Sam's café\",\"source\":\"Reseña de Valeria en una web del barrio\",\"text\":\"Sam's café is small, but it's my favourite place in the [[street|calle]].\u003cbr/\u003e\u003cbr/\u003eThere is always good coffee and there are three or four cakes on the [[counter|mostrador]]. The chocolate cake is delicious! There isn't any pizza and there aren't any chips — this is a café, not a [[restaurant|restaurante]].\u003cbr/\u003e\u003cbr/\u003eI have breakfast here on Saturday with my flatmate. We usually have eggs on toast and a cup of tea.\u003cbr/\u003e\u003cbr/\u003eSam is always [[behind|detrás de]] the counter. He knows my name and he knows my coffee. I don't like [[big|grandes]] cafés with twenty people and no names.\",\"questions\":[{\"id\":\"ena1m5l8e10q1\",\"q\":\"¿Qué NO hay en el café de Sam?\",\"options\":[\"Pizza y patatas fritas\",\"Café y té\",\"Tarta de chocolate\"],\"answer\":0,\"why\":\"«There isn't any pizza and there aren't any chips». Lo demás sí está.\"},{\"id\":\"ena1m5l8e10q2\",\"q\":\"¿Qué desayunan los sábados?\",\"options\":[\"Huevos con tostada y una taza de té\",\"Pizza y zumo\",\"Un sándwich de pollo\"],\"answer\":0,\"why\":\"«We usually have eggs on toast and a cup of tea».\"},{\"id\":\"ena1m5l8e10q3\",\"q\":\"¿Por qué escribe «this is a café, not a restaurant»?\",\"options\":[\"Para avisar de que allí se toman cosas ligeras, no comidas completas\",\"Porque el café le parece caro\",\"Porque Sam no sabe cocinar\"],\"answer\":0,\"inference\":true,\"why\":\"Nadie lo explica: la frase justifica la lista de lo que falta. Es una defensa del sitio, no una queja.\"},{\"id\":\"ena1m5l8e10q4\",\"q\":\"Según la última frase, ¿qué es lo que más valora Valeria del café?\",\"options\":[\"Que la conocen por su nombre\",\"Que es un café grande\",\"Que está muy cerca de casa\"],\"answer\":0,\"inference\":true,\"why\":\"Contrapone «He knows my name» con «cafés with twenty people and no names». La conclusión la pones tú.\"}],\"itemIds\":[\"enthereis\",\"enthereare\",\"enfavourite\",\"endelicious\",\"encupoftea\",\"entoast\",\"enchips\"],\"tip\":\"En una reseña, lo que la persona repite es lo que le importa. Aquí se repite «name»: por ahí van las preguntas difíciles.\"},{\"id\":\"ena1m5l8e9\",\"type\":\"write\",\"prompt\":\"Tu writing del módulo: el pedido por mensaje\",\"scenario\":\"El café de Sam acepta pedidos por mensaje. Escríbele tu pedido de desayuno (una sola misión: PEDIR).\",\"bullets\":[\"Saluda a Sam (Hello / Good morning)\",\"Pide DOS cosas del menú con Can I have… please\",\"Pregunta si hay zumo de naranja (Is there any…?)\"],\"checks\":[{\"re\":\"(hello|hi|good morning)\",\"label\":\"el saludo\"},{\"re\":\"can i have .+ and .+please\",\"label\":\"tu pedido de dos cosas\"},{\"re\":\"is there any\",\"label\":\"la pregunta por el zumo\"}],\"minWords\":20,\"maxWords\":30,\"model\":\"Good morning, Sam! Can I have a cheese sandwich and a coffee, please? And is there any orange juice today? Thank you very much! See you at eleven. Valeria\",\"itemIds\":[\"encanihaveacoffee\",\"ensandwich\",\"enjuice\"],\"tip\":\"Una función (pedir), 20-30 palabras y el contador vivo: el formato del Writing del examen, con hambre real.\"}]}],\"resources\":[{\"label\":\"LanguageCert A1 Preliminary — material oficial\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a1-preliminary-2275\",\"note\":\"El Reading T3 son avisos y menús como el de Sam; el Writing pide textos guiados de 30-50 palabras — este es tu entrenamiento a escala.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_nex
