areja transporte y traducción\",\"pairs\":[{\"target\":\"der Zug\",\"source\":\"el tren\"},{\"target\":\"der Bus\",\"source\":\"el autobús\"},{\"target\":\"das Fahrrad\",\"source\":\"la bicicleta\"},{\"target\":\"zu Fuß\",\"source\":\"a pie\"}],\"itemIds\":[\"zug\",\"bus\",\"fahrrad\",\"zufuss\"]},{\"id\":\"f9l1e2\",\"type\":\"mc\",\"prompt\":\"Reconoce el significado\",\"question\":\"„Ich fahre mit der U-Bahn“\",\"options\":[\"Voy en metro\",\"Voy en tren\",\"Voy en coche\",\"Voy a pie\"],\"answer\":0,\"whyWrong\":[null,\"El tren es der Zug — sería «mit dem Zug»\",\"El coche es das Auto — sería «mit dem Auto»\",\"A pie sería «Ich gehe zu Fuß» — con gehen, no fahren\"],\"itemIds\":[\"ubahn\",\"mitdembus\"],\"tip\":\"die U-Bahn es femenina, por eso «mit der U-Bahn». Los demás transportes de hoy llevan «mit dem».\"},{\"id\":\"f9l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el chunk\",\"text\":\"Ich fahre ___ dem Bus in die Stadt.\",\"answers\":[\"mit\"],\"translation\":\"Voy a la ciudad en autobús.\",\"hints\":[\"La preposición del bloque fijo\",\"m-i-t\"],\"itemIds\":[\"mitdembus\",\"bus\",\"stadt\"]},{\"id\":\"f9l1e4\",\"type\":\"mc\",\"prompt\":\"Caza el error de Umlaut\",\"question\":\"«Él va en coche» →\",\"options\":[\"Er fahrt mit dem Auto\",\"Er fährt mit dem Auto\",\"Er fähren mit dem Auto\"],\"answer\":1,\"whyWrong\":[\"«fahrt» sin Umlaut es la forma de ihr — con er la a cambia a ä: fährt\",null,\"«fähren» no existe — el infinitivo es fahren, y er necesita fährt\"],\"itemIds\":[\"fahren\",\"auto\"],\"tip\":\"du fährst, er fährt — el cambio a→ä solo pasa con du y er/sie/es.\"},{\"id\":\"f9l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa (¡con Umlaut!)\",\"text\":\"Du ___ mit dem Fahrrad.\",\"answers\":[\"fährst\"],\"translation\":\"Tú vas en bicicleta.\",\"hints\":[\"fahren conjugado para du\",\"La a toma Umlaut: f-ä-h-r-s-t\"],\"itemIds\":[\"fahren\",\"fahrrad\"],\"strictUmlaut\":true,\"tip\":\"Aquí el Umlaut ES el objetivo: «fahrst» cuenta como error.\"},{
