\":\"El anuncio, dato 2\",\"question\":\"¿Cuánto pagan?\",\"options\":[\"£12 a la hora\",\"£12 al día\",\"£8 a la hora\"],\"answer\":0,\"whyWrong\":[null,\"an hour = a la hora, no al día\",\"8am es la hora de EMPEZAR — el sueldo era £12\"],\"itemIds\":[\"enjob\"],\"tip\":\"Los números del anuncio se reparten los papeles: 8am es hora, £12 es dinero. El examen los cruza a propósito.\"},{\"id\":\"ena1m9l8e3\",\"type\":\"mc\",\"prompt\":\"El cartel de la puerta\",\"question\":\"En la puerta de la tienda: «BACK IN 10 MINUTES» — ¿qué te dice?\",\"options\":[\"Vuelven en 10 minutos\",\"Abren a las 10\",\"Cierran en 10 minutos\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería OPEN AT 10\",\"Eso sería CLOSING IN 10 MINUTES\"],\"itemIds\":[\"enatwork\"],\"tip\":\"back = de vuelta. Los carteles del examen son así: dos palabras y un mundo detrás.\"},{\"id\":\"ena1m9l8e4\",\"type\":\"order\",\"prompt\":\"Ordena el email de Emma\",\"sentences\":[\"Hi Valeria! How is London?\",\"I have a new job at a hospital!\",\"I'm learning Spanish now, like you with English.\",\"Write soon! Best wishes, Emma\"],\"translation\":\"¡Hola, Valeria! ¿Qué tal Londres? ¡Tengo un trabajo nuevo en un hospital! Ahora estoy aprendiendo español, como tú con el inglés. ¡Escribe pronto! Un saludo, Emma\",\"hints\":[\"Saludo → noticia → despedida: el esqueleto de todo email\",\"Best wishes cierra, nunca abre\"],\"itemIds\":[\"enemail\",\"enjob\",\"enbestwishes\"]},{\"id\":\"ena1m9l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa — el ahora con traje de email\",\"text\":\"I'm learning English ___ the moment.\",\"answers\":[\"at\"],\"translation\":\"Estoy aprendiendo inglés en este momento.\",\"hints\":[\"right now, versión elegante\",\"A-T the moment\"],\"itemIds\":[\"enatthemoment\",\"enimlearningenglish\"],\"tip\":\"at the moment = right now con corbata: perfecta para tu Writing del examen.\"},{\"id\":\"ena1m9l8e6\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora escribe Amy\",\"source\":\"I write an email every day.\",\"instruction\":\"Dilo de Amy\",\"answers\":[\"Amy writes an email every day\",\"Amy writes an email every day.\",\"She writes an email every day\",\"She writes an email every day.\"],\"translation\":\"Amy escribe un email cada día.\",\"hints\":[\"La -s de 3ª persona no descansa\",\"Amy writes ...\"],\"itemIds\":[\"enwrite\",\"enemail\"],\"tip\":\"write suena igual que right — la w es muda. Y con Amy: writes, con su -s de siempre.\"},{\"id\":\"ena1m9l8e7\",\"type\":\"build\",\"prompt\":\"Construye tu candidatura\",\"target\":\"I'm a waiter at a coffee shop\",\"translation\":\"Soy camarero en una cafetería\",\"distractors\":[\"work\",\"do\"],\"itemIds\":[\"enwaiter\"],\"tip\":\"be + a + profesión: las fichas work y do sobraban. La a de la profesión, innegociable.\"},{\"id\":\"ena1m9l8e9\",\"type\":\"read\",\"prompt\":\"Lee el texto y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"A card in the window\",\"text\":\"Valeria studies English every morning, so she wants a job in the afternoon. In the window of Mr Patel's shop there's a card: \\\"Shop assistant [[wanted|se busca]]. Monday to Friday, 2pm to 7pm. No [[experience|experiencia]]? No problem.\\\"\u003cbr/\u003e\u003cbr/\u003eValeria writes an email to the shop. \\\"My name is Valeria Soto. I'm a student and I'm learning English at school in the morning. I work well with people.\\\"\u003cbr/\u003e\u003cbr/\u003eTwo days later Mr Patel answers: \\\"Dear Valeria, thank you for your email. Can you come to the shop on Thursday at five? The card is [[still|todavía]] in the window, and you are the first student.\\\"\",\"questions\":[{\"id\":\"ena1m9l8e9q1\",\"q\":\"When does Valeria study English?\",\"options\":[\"In the morning\",\"In the afternoon\",\"At the weekend\"],\"answer\":0,\"why\":\"«Valeria studies English every morning» — y por eso busca trabajo de tarde.\"},{\"id\":\"ena1m9l8e9q2\",\"q\":\"What job is on the card?\",\"options\":[\"Shop assistant\",\"Teacher\",\"Waiter\"],\"answer\":0,\"why\":\"Lo pone la primera línea de la tarjeta.\"},{\"id\":\"ena1m9l8e9q3\",\"q\":\"Why does Valeria want an afternoon job?\",\"options\":[\"Because she is at school in the morning.\",\"Because the shop is closed in the morning.\",\"Because she doesn't like getting up early.\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no dice «because»: encadena «studies every morning» y «wants a job in the afternoon». La causa la pones tú.\"},{\"id\":\"ena1m9l8e9q4\",\"q\":\"What does the end of Mr Patel's email tell us?\",\"options\":[\"Valeria has a good chance: nobody else has answered.\",\"Valeria has the job already.\",\"Mr Patel doesn't want students in his shop.\"],\"answer\":0,\"inference\":true,\"why\":\"«The card is still in the window, and you are the first student»: si el cartel sigue puesto, no hay cola — pero tampoco hay trabajo dado.\"},{\"id\":\"ena1m9l8e9q5\",\"q\":\"When does Mr Patel want to see Valeria?\",\"options\":[\"On Thursday at five.\",\"On Monday at two.\",\"On Friday at seven.\"],\"answer\":0,\"why\":\"«Can you come to the shop on Thursday at five?». Las otras horas son las del horario de la tarjeta.\"}],\"itemIds\":[\"enjob\",\"enshopassistant\",\"enimastudent\",\"enemail\",\"enimlearningenglish\"],\"tip\":\"Un anuncio de trabajo trae siempre tres datos: qué, cuándo y qué piden. Cázalos antes de leer nada más — el examen pregunta por ellos.\"},{\"id\":\"ena1m9l8e8\",\"type\":\"write\",\"prompt\":\"Tu email de examen: dos funciones, 30-40 palabras\",\"scenario\":\"Tu amiga Emma, la de Manchester, te escribe: «What do you do in London?». Contesta su email: cuéntale tu trabajo (qué eres y dónde trabajas) y cuéntale qué estás aprendiendo ahora.\",\"bullets\":[\"Di tu profesión con I'm a/an + trabajo\",\"Di dónde trabajas con work at/in\",\"Cuenta qué estás aprendiendo AHORA con I'm learning\"],\"checks\":[{\"re\":\"i('m| am) an? \\\\w+\",\"label\":\"profesión con a/an\"},{\"re\":\"work (at|in)\",\"label\":\"work at/in + lugar\"},{\"re\":\"('m|am) learning\",\"label\":\"I'm learning\"}],\"minWords\":30,\"maxWords\":40,\"model\":\"Dear Emma, I'm a waiter now! I work at a coffee shop near the station. The boss is nice. And I'm learning English at school every day. My teachers are great. See you soon!\",\"itemIds\":[\"enwaiter\",\"enwork\",\"enimlearningenglish\",\"endearamy\",\"enseeyousoon\"],\"tip\":\"El examen puntúa funciones cumplidas + rango de palabras — no frases perfectas. Di qué eres, dónde y qué aprendes, y cuenta tus palabras.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m9-4\",\"book\":\"Wait a minute, please.\",\"real\":\"Gimme a sec!\",\"meaning\":\"¡Dame un segundo! — gimme = give me, sec = second\",\"when\":\"Mensajes y habla rápida entre amigos o compañeros de trabajo. En tu email del examen: jamás — ahí se escribe todo entero.\",\"register\":\"amigos\",\"note\":\"give me se funde en gimme, de la misma familia que gonna y wanna\",\"sound\":\"GUÍ-mi a SEK\",\"level\":\"a1\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":
