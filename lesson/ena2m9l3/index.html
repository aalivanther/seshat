 persona: \u003ci\u003eI cut myself.\u003c/i\u003e (me corté) · \u003ci\u003eShe looked at herself in the mirror.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e2. El énfasis\u003c/b\u003e — «yo, sin ayuda de nadie»: \u003cb\u003e[[I did it myself.|Lo hice yo sola.]]\u003c/b\u003e · \u003ci\u003eDid you paint the room yourselves?\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Con \u003cu\u003eby\u003c/u\u003e, significa «solo/a»\u003c/b\u003e: \u003cb\u003e[[I live by myself.|Vivo sola.]]\u003c/b\u003e — que es lo mismo que \u003ci\u003eI live on my own\u003c/i\u003e. Ojo al calco: \u003ci\u003eby my own\u003c/i\u003e no existe; o \u003cb\u003eby myself\u003c/b\u003e o \u003cb\u003eon my own\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY una fórmula que vas a oír el primer día en una casa compartida: \u003cb\u003e[[Help yourself!|¡Sírvete!]]\u003c/b\u003e — con el plural \u003ci\u003eHelp yourselves\u003c/i\u003e si sois varios.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOjo con el reflexivo mutuo:\u003c/b\u003e «se ayudan» (el uno al otro) no es \u003ci\u003eThey help themselves\u003c/i\u003e —eso sería que cada uno se sirve a sí mismo— sino \u003cb\u003eThey help each other\u003c/b\u003e.18:T4c2,El español mete \u003cb\u003eme / te / se\u003c/b\u003e en decenas de verbos donde no significa «a mí mismo», sino que forma parte del verbo: \u003ci\u003elevantarse, despertarse, sentirse, acordarse, quejarse, quedarse, irse, moverse, sentarse, ducharse, casarse, caerse, equivocarse…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eDe ahí salen los errores más repetidos del nivel: \u003ci\u003eI feel myself tired\u003c/i\u003e, \u003ci\u003eI woke up myself\u003c/i\u003e, \u003ci\u003eI get up myself at seven\u003c/i\u003e, \u003ci\u003eShe complained herself\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa prueba que lo resuelve todo, y la puedes hacer tú sola:\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Puedes añadir «a mí misma» y la frase sigue significando lo mismo?\u003c/b\u003e\u003cbr/\u003e· «Me corté \u003cu\u003ea mí misma\u003c/u\u003e» → sí, significa lo mismo → en inglés va \u003cb\u003emyself\u003c/b\u003e: \u003ci\u003eI cut myself.\u003c/i\u003e\u003cbr/\u003e· «Me levanté \u003cu\u003ea mí misma\u003c/u\u003e» → no significa nada → en inglés \u003cb\u003eno va nada\u003c/b\u003e: \u003ci\u003eI got up.\u003c/i\u003e\u003cbr/\u003e· «Me siento cansada \u003cu\u003ea mí misma\u003c/u\u003e» → no → \u003cb\u003e[[I feel tired.|Me siento cansada.]]\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eUna prueba contra veinte verbos. No hace falta la lista.\u003cbr/\u003e\u003cbr/\u003eY de regalo, la vacuna para el otro lado: en el módulo 2 ya viste que «me caí» es \u003cb\u003eI fell\u003c/b\u003e y «me fui» es \u003cb\u003eI left\u003c/b\u003e. Es exactamente el mismo fenómeno: el «me» español no viaja."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l3\",\"phaseId\":\"ena2m9\",\"title\":\"I did it myself\",\"subtitle\":\"El reflexivo inglés — y los veinte «me» españoles que hay que tirar\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Sírvete, hazlo tú, vive solo\",\"itemIds\":[\"ena2m9reflexivegroup\",\"ena2m9nonreflexivegroup\",\"ena2m9helpyourself\",\"ena2m9ididitmyself\",\"ena2m9bymyself\",\"ena2m9ifeeltired\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Para qué sirve el reflexivo inglés (y es para poco)\",\"body\":\"$17\",\"table\":[[\"para qué\",\"ejemplo\",\"en español\"],[\"reflexivo de verdad\",\"I cut myself.\",\"Me corté.\"],[\"énfasis: sin ayuda\",\"I did it myself.\",\"Lo hice yo sola.\"],[\"by + reflexivo = solo\",\"I live by myself.\",\"Vivo sola.\"],[\"fórmula de la casa\",\"Help yourself!\",\"¡Sírvete!\"],[\"mutuo (¡otro!)\",\"They help each other.\",\"Se ayudan.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y ahora lo importante: los «me» del español que el inglés tira\",\"body\":\"$18\",\"table\":[[\"en español lleva «me»\",\"en inglés\",\
