poyo: der Anlauf = el intento · vormittags = por la mañana · mir fällt nichts ein = no se me ocurre nada · merken = darse cuenta · der Versuch = el intento · die Traumnote = la nota soñada\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T768,"])</script><script>self.__next_f.push([1,"Willkommen bei «Zur Sache». Unser Thema heute: Studium oder Ausbildung — was lohnt sich eigentlich noch? Bei mir im Studio sitzen eine Bildungsforscherin und ein Handwerksmeister mit, ähm, vierzig Mitarbeitern. Frau Doktor, Sie forschen dazu, fangen wir bei Ihnen an. | Über das ganze Leben gerechnet verdienen Studierte mehr, das ist eindeutig. Für jedes Fach gilt das allerdings nicht, das muss man dazusagen. | Da bin ich ganz anderer Meinung. Meine Leute verdienen mit fünfundzwanzig schon ordentlich, und zwar ohne einen Cent Schulden. Die anderen fangen mit dreißig bei null an. | Bei null nicht, das stimmt so nicht. In einem Punkt haben Sie aber recht: Der Anfang ist für die Studierten schwerer, als die meisten denken. | Und was raten Sie einer Neunzehnjährigen, die sich einfach nicht entscheiden kann? Mir kommt es nämlich so vor, als würde man aus dieser einen Entscheidung heute eine viel zu große Sache machen. | Reinschauen, und zwar in beides. Wer mit neunzehn nichts weiß, weiß mit zwanzig meistens mehr. Ein Jahr ist kein verlorenes Jahr. | Ein Praktikum. Vier Wochen im Betrieb sagen mehr als vierzig Gespräche in der Beratung. | Da stimme ich Ihnen zu. Noch wichtiger finde ich aber was anderes: Man entscheidet sich heute nicht mehr für vierzig Jahre. Fast die Hälfte macht irgendwann eine Weiterbildung oder eine Umschulung. | Und trotzdem tun alle so, als wär mit achtzehn alles gelaufen. Die Eltern sind da ehrlich gesagt oft das größere Problem als die Jugendlichen. Bei uns sitzt inzwischen der Vater im Vorstellungsgespräch mit am Tisch. | Das kennen wir aus den Hochschulen auch. Es gibt dort mittlerweile Elternabende, im Ernst. | Letzte Frage, ganz kurz, und dann bedanke i ull,{\"lesson\":{\"id\":\"b1m6l9\",\"phaseId\":\"b1m6\",\"title\":\"Carmen holt den Abschluss nach\",\"subtitle\":\"La historia larga, la espiral de los módulos anteriores y tu monólogo\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Últimas piezas del módulo\",\"itemIds\":[\"b1m6weiterbildung\",\"b1m6lebenslangeslernen\",\"b1m6fortschritt\",\"b1m6auswendig\",\"b1m6durchgefallen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Carmen Ruiz: der zweite Anlauf\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 3-4)\",\"question\":\"¿Por qué pudo Carmen apuntarse a un curso?\",\"options\":[\"Porque dejó el café\",\"Porque su hija tiene plaza en la guardería\",\"Porque la asesora se lo pagó\"],\"answer\":1,\"whyWrong\":[\"El texto no dice que dejara el trabajo\",null,\"La asesora la animó, pero no pagó nada\"],\"itemIds\":[\"b1m6krippe\",\"b1m6seitdem\"]},{\"id\":\"b1m6l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (frases 5-7)\",\"question\":\"¿Qué le faltaba a Carmen en el primer intento?\",\"options\":[\"Estudiar más gramática\",\"Hablar con gente desconocida\",\"Un profesor mejor\"],\"answer\":1,\"whyWrong\":[\"Reglas ya se sabía de memoria: ese era justo el problema\",null,\"El texto no critica en ningún momento al profesor\"],\"itemIds\":[\"b1m6auswendig\",\"b1m6durchgefallen\"],\"tip\":\"«Ich habe die Regeln auswendig gelernt, aber im Sprechen ist mir nichts eingefallen» = saber ≠ poder usar. Es el plateau, contado en dos líneas.\"},{\"id\":\"b1m6l9e3\",\"type\":\"order\",\"prompt\":\"Ordena el camino de Carmen\",\"sentences\":[\"Carmen hat fünf Jahre im Café gearbeitet.\",\"Sie hat sich für einen Abendkurs angemeldet.\",\"Beim ersten Versuch ist sie durchgefallen.\",\"Nach vier Monaten im Elterncafé hat sie bestanden.\"],\"translation\":\"Carmen trabajó cinco años en el café. Se apuntó a un curso de tarde. En el primer intento suspendió. Tras cuatro meses en el café de padres, aprobó.\",\"hints\":[\"Sigue el orden de la historia\",\"Café → Kurs → durchgefallen → bestanden\"],\"itemIds\":[\"b1m6durchgefallen\",\"b1m6bestanden\",\"b1m6sichanmeldenfuer\"]},{\"id\":\"b1m6l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga: formación que ya conoces del A2 — sin pensar\",\"pairs\":[{\"target\":\"die Ausbildung\",\"source\":\"la formación profesional\"},{\"target\":\"das Praktikum\",\"source\":\"las prácticas\"},{\"target\":\"die Universität\",\"source\":\"la universidad\"},{\"target\":\"der Deutschkurs\",\"source\":\"el curso de alemán\"},{\"target\":\"das Gymnasium\",\"source\":\"el instituto (secundaria)\"}],\"targetSeconds\":22,\"itemIds\":[\"a2m10ausbildung\",\"a2m10praktikum\",\"a2m10universitaet\",\"a2m10deutschkurs\",\"a2m3gymnasium\"],\"tip\":\"Nada nuevo: solo velocidad sobre lo que ya sabes. Esta es la hebra que rompe el estancamiento, y la que casi nadie entrena.\"},{\"id\":\"b1m6l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 3\",\"text\":\"___ ihre Tochter in der Krippe ist, hat Carmen drei Stunden für sich.\",\"answers\":[\"Seitdem\",\"Seit\"],\"translation\":\"Desde que su hija está en la guardería, Carmen tiene tres horas para ella.\",\"hints\":[\"«desde que» + verbo al final\",\"Seit...\"],\"itemIds\":[\"b1m6seitdem\",\"b1m6krippe\"]},{\"id\":\"b1m6l9e6\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 9\",\"text\":\"___ ich sechs Jahre verloren habe, fange ich noch einmal an.\",\"answers\":[\"Obwohl\"],\"translation\":\"Aunque he perdido seis años, empiezo otra vez.\",\"hints\":[\"Subordinante de concesión, con el auxiliar al final\",\"Ob...\"],\"itemIds\":[\"b1m6obwohl\",\"b1m6obwohlgelernthabe\"]},{\"id\":\"b1m6l9e7\",\"type\":\"errorfix\",\"prompt\":\"Un compañero contó la historia así. Arréglalo.\",\"wrong\":\"Danach sie hat einen Abendkurs gemacht.\",\"answers\":[\"Danach hat sie einen Abendkurs gemacht.\",\"Danach hat sie einen Abendkurs gemacht\"],\"why\":\"danach es adverbio en posición 1 → el verbo va detrás y el sujeto después: Danach hat sie… Misma familia que deshalb, trotzdem y außerdem.\",\"translation\":\"Después hizo un curso de tarde.\",\"itemIds\":[\"b1m6danachhabeich\"]},{\"id\":\"b1m6l9e8\",\"type\":\"transform\",\"prompt\":\"Espiral del módulo 5: ponlo en pasiva\",\"source\":\"Man spricht dort den ganzen Tag Deutsch.\",\"instruction\":\"Ponla en Passiv\",\"answers\":[\"Dort wird den ganzen Tag Deutsch gesprochen\",\"Dort wird den ganzen Tag Deutsch gesprochen.\",\"Es wird dort den ganzen Tag Deutsch gesprochen\"],\"translation\":\"Allí se habla alemán todo el día.\",\"hints\":[\"wird + Partizip al final\",\"Dort wird den ganzen Tag Deutsch ... (participio de sprechen)\"],\"itemIds\":[\"b1m5trennen\",\"a2m1denganzentag\"],\"tip\":\"La pasiva del módulo 5 sigue viva: en el B1 nada se cierra, todo se recicla.\"},{\"id\":\"b1m6l9e9\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye la historia con el banco\",\"text\":\"Carmen hat im Café gearbeitet, ___ sie Geld brauchte. ___ ihre Tochter in der Krippe ist, hat sie Zeit zum Lernen. ___ hat sie sich für einen Abendkurs angemeldet. Beim zweiten Versuch hat sie bestanden, ___ sie im ersten Jahr durchgefallen war.\",\"answers\":[\"weil\",\"Seitdem\",\"Deshalb\",\"obwohl\"],\"bank\":[\"weil\",\"Seitdem\",\"Deshalb\",\"obwohl\",\"damit\",\"denn\"],\"translation\":\"Carmen trabajó en el café porque necesitaba dinero. Desde que su hija está en la guardería tiene tiempo para estudiar. Por eso se apuntó a un curso de tarde. En el segundo intento aprobó, aunque el primer año había suspendido.\",\"itemIds\":[\"b1m6seitdem\",\"b1m6deshalbmeldeich\",\"b1m6obwohl\",\"b1m6durchgefallen\"],\"tip\":\"Cuatro huecos, tres familias de conectores. Si los colocaste mirando dónde estaba el verbo, ya lees la sintaxis, no la traducción.\"},{\"id\":\"b1m6l9e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Carmen hat die Prüfung nicht bestanden.\",\"forbid\":[\"nicht\",\"bestanden\"],\"answers\":[\"Carmen ist durch die Prüfung gefallen\",\"Carmen ist durch die Prüfung gefallen.\",\"Carmen ist durchgefallen\",\"Carmen ist durchgefallen.\",\"Carmen ist bei der Prüfung durchgefallen\",\"Carmen ist bei der Prüfung durchgefallen.\"],\"translation\":\"Carmen no aprobó el examen.\",\"hints\":[\"Sin «nicht» y sin «bestanden»: el verbo alemán de suspender\",\"Carmen ist durch...\"],\"itemIds\":[\"b1m6durchgefallen\",\"b1m6bestanden\"]},{\"id\":\"b1m6l9e13\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la investigadora y c) el maestro artesano. Nadie anuncia su papel antes de hablar: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$18\",\"question\":\"„Beim Geld liegen Akademiker am Ende vorn, wenn auch nicht in jedem Studiengang.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él presenta el tema y da el turno; no defiende ninguna postura\",null,\"Él sostiene justo lo contrario: «Da bin ich ganz anderer Meinung»\"],\"itemIds\":[\"b1m6studium\",\"b1m6sichlohnen\"],\"tip\":\"Ninguna de las ocho afirmaciones sale literal del audio. Ella dice «über das ganze Leben gerechnet verdienen Studierte mehr»: hay que llegar de ahí a «Akademiker liegen beim Geld vorn». Eso es el Teil 4.\"},{\"id\":\"b1m6l9e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$19\",\"question\":\"„Wer eine Lehre macht, steht früher auf eigenen Beinen und hat keine Schulden.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no defiende ninguna postura: modera\",\"Ella habla de sueldos a lo largo de toda una vida, no de los primeros años\",null],\"itemIds\":[\"b1m6lehre\",\"b1m6ausbildungsplatz\"],\"tip\":\"«Da bin ich ganz anderer Meinung» y «das muss man dazusagen» son las dos balizas del Teil 4: la primera marca el cambio de bando, la segunda el matiz.\"},{\"id\":\"b1m6l9e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$1a\",\"question\":\"„Der Start ins Berufsleben ist für Studierte härter, als allgemein angenommen wird.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",null,\"Él dice que los otros empiezan de cero con treinta, que es justo lo que ella le corrige\"],\"itemIds\":[\"b1m6studium\"],\"tip\":\"Ella le corrige («Bei null nicht») y le da la razón a medias en la misma frase. Dar la razón NO es cambiar de bando: la afirmación sigue siendo suya.\"},{\"id\":\"b1m6l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. En el Teil 4 real siempre hay una o dos afirmaciones del moderador — y no siempre son preguntas.\",\"audio\":\"$1b\",\"question\":\"„Man redet über diese Entscheidung, als hinge das ganze Leben daran.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella dice algo parecido más adelante, pero con otro argumento: que hoy nadie decide para cuarenta años\",\"Él no relativiza nada: para él la decisión es seria y se toma en un taller\"],\"itemIds\":[\"b1m6beratung\"],\"tip\":\"El moderador cuela su opinión dentro de una pregunta («Mir kommt es nämlich so vor, als…»). Descártalo por defecto, no siempre: quien te la juega es esa frase de más.\"},{\"id\":\"b1m6l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$1c\",\"question\":\"„Ausprobieren hilft mehr als beraten werden.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él ha hecho la pregunta, no da el consejo\",\"Ella también dice que hay que mirar de cerca, pero su consejo es tomarse un año, no meterse en un taller\",null],\"itemIds\":[\"b1m6ausbildungsplatz\",\"b1m6beratung\"],\"tip\":\"Cuatro semanas contra cuarenta conversaciones: la exageración con números es un recurso de debate típico y en el examen se convierte en afirmación — pero abstracta, sin los números.\"},{\"id\":\"b1m6l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$1d\",\"question\":\"„Kaum jemand bleibt heute sein Leben lang im ersten Beruf.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él no argumenta en este bloque\",null,\"Él va justo por el otro lado: se comportan como si con dieciocho estuviera todo decidido\"],\"itemIds\":[\"b1m6weiterbildung\",\"b1m6umschulung\",\"b1m6lebenslangeslernen\"],\"tip\":\"«Da stimme ich Ihnen zu. Noch wichtiger finde ich aber was anderes…»: primero le da la razón y después dice lo suyo. La afirmación que puntúa es SIEMPRE lo que viene tras el «aber».\"},{\"id\":\"b1m6l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8. Dos escuchas.\",\"audio\":\"$1e\",\"question\":\"„Nicht die Jugendlichen stehen sich im Weg, sondern ihre Eltern.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo pide la última respuesta\",\"Ella confirma después con el ejemplo de las universidades, pero la frase es de él\",null],\"itemIds\":[\"b1m6berufstaetig\"],\"tip\":\"Los dos hablan de los padres seguidos: quien lo dice PRIMERO se lleva la afirmación. Por eso las frases van en el orden del debate.\"},{\"id\":\"b1m6l9e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido, exactamente como en el examen.\",\"audio\":\"$1f\",\"question\":\"„In den Schulen wird viel zu wenig über Berufe gesprochen.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Bildungsforscherin\",\"Der Handwerksmeister\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pide una respuesta corta, no la da\",null,\"A él lo que le falta es respeto por el oficio, no horas de orientación\"],\"itemIds\":[\"b1m6beratung\",\"b1m6abschluss\"],\"tip\":\"La ronda final vale dos o tres ítems del Teil 4 y llega cuando ya estás cansado: por eso se entrena la resistencia, no solo el oído. «Ein Meisterbrief ist kein Trostpreis» — un título de maestro artesano no es un premio de consolación.\"},{\"id\":\"b1m6l9e11\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 2 — presenta tu tema en 3 minutos. Prepárate primero con las 5 diapositivas.\",\"topic\":\"Lernen als Erwachsener: Kurs, Ausbildung oder Studium?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"Ich möchte heute über … sprechen. Meine Präsentation hat fünf Teile.\"},{\"title\":\"2. Deine eigene Erfahrung\",\"hint\":\"Ich lerne Deutsch, seitdem … / Ich habe mich für … angemeldet, weil …\"},{\"title\":\"3. Die Situation in deinem Heimatland\",\"hint\":\"In Spanien studieren die meisten …, obwohl … / Eine Ausbildung wie in Deutschland gibt es dort …\"},{\"title\":\"4. Vor- und Nachteile + deine Meinung\",\"hint\":\"Einerseits …, andererseits … Meiner Meinung nach lohnt sich …, weil …\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"Zum Schluss möchte ich sagen, dass … Vielen Dank für eure Aufmerksamkeit.\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas (las 5 = banda A en «Erfüllung»)\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos 3 subordinadas con el verbo al final (weil, obwohl, damit…)\",\"Usé al menos un adverbio con inversión (deshalb / trotzdem / außerdem)\",\"Conté algo que me dijo otra persona (Er sagte, dass…)\"],\"model\":\"Diapositiva 2 (modelo): „Ich lerne Deutsch, seitdem ich vor drei Jahren hierhergekommen bin. Am Anfang habe ich nur mit dem Handy gelernt, weil ich abends arbeiten musste. Deshalb habe ich mich später für einen Abendkurs an der Volkshochschule angemeldet. Meine Lehrerin sagte, dass ich die B1-Prüfung im Sommer machen kann.“\",\"itemIds\":[\"b1m6lebenslangeslernen\",\"b1m6weiterbildung\",\"b1m6sichanmeldenfuer\",\"b1m6obwohl\"],\"tip\":\"La segunda pasada, sin andamio, siempre sale mejor: es repetición de tarea, no memoria. Hazla aunque te dé pereza.\"},{\"id\":\"b1m6l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Aunque he perdido seis años, empiezo otra vez, porque quiero sacarme el título\",\"answers\":[\"Obwohl ich sechs Jahre verloren habe, fange ich noch einmal an, weil ich den Abschluss nachholen will\",\"Obwohl ich sechs Jahre verloren habe, fange ich noch einmal an, weil ich den Abschluss nachholen will.\"],\"hints\":[\"Subordinada delante (habe al final) → inversión (fange ich) → segunda subordinada (will al final)\",\"Obwohl ich sechs Jahre verloren habe, fange ich noch einmal an, weil ich ...\"],\"itemIds\":[\"b1m6obwohl\",\"b1m6nachholen\",\"b1m6abschluss\"],\"tip\":\"Tres bloques, tres verbos, cada uno en su sitio. Esa frase sola vale un B1: módulo cerrado.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m6-3\",\"book\":\"Ich habe es geschafft.\",\"real\":\"Ich hab's gepackt!\",\"meaning\":\"¡Lo he conseguido!\",\"when\":\"Al salir del examen, con amigos y compañeros de curso. En un mail al trabajo, a la Volkshochschule o al Amt, la fila de examen: «bestehen» es el verbo técnico de aprobar, y es el que entiende un tribunal.\",\"register\":\"amigos\",\"exam\":\"Ich habe die Prüfung bestanden.\",\"note\":\"packen otra vez: agarrar el problema. Y el habe se come su -e en el habla: hab's.\",\"sound\":\"ij japs gue-PAKT\",\"level\":\"b1\",\"produce\":true}}],\"resources\":[{\"label\":\"DW — Top-Thema: Bildung\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Un artículo B1 por semana sobre educación y trabajo, con audio: tu canal de volumen del módulo.\"},{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Las 5 diapositivas del Teil 2 no cambian nunca: úsalas como partitura hasta que te salgan solas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"20:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L20\",\"6\",{}]]\n"])</script></body></html>
