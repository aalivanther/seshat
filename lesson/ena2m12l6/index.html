3cb\u003e30-50 es un objetivo, no una trampa\u003c/b\u003e: por debajo de 30 no hay material suficiente para demostrar nada, y por encima de 50 no te penalizan la palabra 51 — lo que pasa es peor, que cada frase de más es una frase más donde equivocarse, y son minutos robados al Reading. Apunta a \u003cb\u003e38-45\u003c/b\u003e: caben las tres respuestas, un saludo y una despedida, y sobra tiempo para releer."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l6\",\"phaseId\":\"ena2m12\",\"title\":\"Writing 1: the informal reply\",\"subtitle\":\"Tres preguntas, tres respuestas, 30-50 palabras\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit del mensaje entre amigos\",\"itemIds\":[\"ena2m12answerallthreequestions\",\"ena2m12thanksforyourmessage\",\"ena2m12sorryforthelatereply\",\"ena2m12lovevaleria\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La Tarea 1: responder, informalmente, a tres cosas\",\"body\":\"$17\",\"table\":[[\"Pieza\",\"Palabras aproximadas\"],[\"Saludo (Hi Emma,)\",\"2\"],[\"Gancho (Thanks for your message!)\",\"5\"],[\"Las tres respuestas\",\"28-34\"],[\"Cierre (Love, Valeria)\",\"2\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l6e1\",\"type\":\"mc\",\"prompt\":\"Lee el enunciado y cuenta\",\"question\":\"«Hi! How are you? I heard you're taking the A2 exam — when is it? Are you nervous? And can I come and stay that weekend? — Emma» ¿Cuántas cosas tienes que contestar?\",\"options\":[\"Tres: cuándo, cómo estás de nervios y si puede venir\",\"Dos: cuándo es y si puede venir\",\"Cuatro, contando el How are you?\"],\"answer\":0,\"whyWrong\":[null,\"Los nervios también son una pregunta directa: Are you nervous?\",\"How are you? es la fórmula de saludo, no uno de los tres puntos de la tarea\"],\"itemIds\":[\"ena2m12answerallthreequestions\"],\"tip\":\"Numera las tres en el enunciado antes de escribir. Es lo único que hace el examen que no falla nunca: siempre son tres.\"},{\"id\":\"ena2m12l6e2\",\"type\":\"order\",\"prompt\":\"Ordena la respuesta modelo — así se organiza sola\",\"sentences\":[\"Hi Emma, thanks for your message!\",\"The exam is on 14th June, in the morning.\",\"I'm a bit nervous, but I'm ready.\",\"And yes, of course you can stay that weekend!\",\"Love, Valeria\"],\"translation\":\"Hola, Emma: ¡gracias por tu mensaje! El examen es el 14 de junio por la mañana. Estoy un poco nerviosa, pero preparada. Y sí, claro que puedes quedarte ese fin de semana. Un beso, Valeria\",\"hints\":[\"Saludo → punto 1 → punto 2 → punto 3 → despedida\",\"Los puntos se contestan EN EL ORDEN en que te los preguntan\"],\"itemIds\":[\"ena2m12thanksforyourmessage\",\"ena2m12lovevaleria\"],\"tip\":\"Contestar en el orden del enunciado organiza el texto sin esfuerzo — y la organización es uno de los cuatro criterios.\"},{\"id\":\"ena2m12l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa el arranque informal\",\"text\":\"Hi Emma, ___ for your message!\",\"answers\":[\"thanks\",\"thank you\"],\"translation\":\"Hola, Emma: ¡gracias por tu mensaje!\",\"hints\":[\"El gancho de todas las respuestas informales\",\"Th…\"],\"itemIds\":[\"ena2m12thanksforyourmessage\"]},{\"id\":\"ena2m12l6e4\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿esto va en la Tarea 1 o en la Tarea 2?\",\"categories\":[\"Tarea 1 (informal)\",\"Tarea 2 (neutro o formal)\"],\"items\":[{\"text\":\"Hi Emma,\",\"bucket\":0},{\"text\":\"Dear Sir or Madam,\",\"bucket\":1},{\"text\":\"Love, Valeria\",\"bucket\":0},{\"text\":\"Yours sincerely,\",\"bucket\":1},{\"text\":\"See you soon!\",\"bucket\":0},{\"text\":\"I am writing to ask about the course.\",\"bucket\":1},{\"text\":\"Thanks for your message!\",\"bucket\":0},{\"text\":\"I would be grateful for any information.\",\"bucket\":1}],\"itemIds\":[\"ena2m12lovevaleria\",\"ena2m12dearsirormadam\",\"ena2m12yourssincerely\",\"ena2m12iamwritingto\"],\"tip\":\"Las dos tareas se distinguen en la primera línea y en la última. Si el saludo y la despedida son los correctos, el registro ya casi está.\"},{\"id\":\"ena2m12l6e5\",\"type\":\"mc\",\"prompt\":\"El rango de palabras\",\"question\":\"Has escrito 62 palabras y contestas las tres preguntas. ¿Qué haces?\",\"options\":[\"Recortar hasta unas 45: cada frase de más es una frase más donde fallar\",\"Dejarlo: escribir más siempre demuestra más nivel\",\"Borrar una de las tres respuestas para bajar de 50\"],\"answer\":0,\"whyWrong\":[null,\"Demuestra más superficie de error, y el tiempo sale del Reading\",\"Jamás: quitar un punto de contenido es lo único que sí te baja la nota de verdad\"],\"itemIds\":[\"encountyourwords\"],\"tip\":\"El rango es un objetivo, no una trampa. Se recorta de las frases de relleno, nunca de los tres puntos.\"},{\"id\":\"ena2m12l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige — la negación española que se cuela\",\"wrong\":\"I no can come on Saturday.\",\"answers\":[\"I can't come on Saturday.\",\"I cannot come on Saturday.\",\"I can't come on Saturday\"],\"why\":\"En español la negación va suelta y delante («no puedo»); en inglés se mete DENTRO del auxiliar: can + not = can't. Es un error que casi nadie comete escribiendo despacio y que reaparece en cuanto hay prisa — o sea, en el examen.\",\"translation\":\"No puedo ir el sábado.\",\"hints\":[\"La negación vive dentro del verbo\",\"I ___ come on Saturday.\"],\"itemIds\":[\"ena2m7imafraidyoucant\"]},{\"id\":\"ena2m12l6e7\",\"type\":\"gapbank\",\"prompt\":\"Monta la plantilla del mensaje informal\",\"text\":\"Hi Emma, ___ for your message! Sorry for the ___ reply — last week was crazy. The exam is on 14th June and yes, of course you can stay! ___ me know what time your train arrives. ___ , Valeria\",\"answers\":[\"thanks\",\"late\",\"Let\",\"Love\"],\"bank\":[\"thanks\",\"late\",\"Let\",\"Love\",\"Dear\",\"Yours\"],\"translation\":\"Hola, Emma: ¡gracias por tu mensaje! Perdona que conteste tan tarde: la semana pasada fue una locura. El examen es el 14 de junio y sí, ¡claro que puedes quedarte! Dime a qué hora llega tu tren. Un beso, Valeria\",\"itemIds\":[\"ena2m12thanksforyourmessage\",\"ena2m12sorryforthelatereply\",\"ena2m12lovevaleria\"],\"tip\":\"Apertura y cierre son puntos regalados: escríbelos ANTES de pensar el contenido y ya llevas la organización medio hecha.\"},{\"id\":\"ena2m12l6e8\",\"type\":\"transform\",\"prompt\":\"Baja el registro: esto va a un amigo, no a una oficina\",\"source\":\"I am writing to inform you that I cannot attend on Saturday.\",\"instruction\":\"Dilo como se lo dirías a Emma\",\"answers\":[\"Sorry, I can't come on Saturday!\",\"Sorry, I can't come on Saturday\",\"I'm really sorry, I can't come on Saturday!\"],\"translation\":\"¡Lo siento, no puedo ir el sábado!\",\"hints\":[\"Fuera I am writing to y fuera attend\",\"Sorry, I can't…\"],\"itemIds\":[\"ena2m12sorryforthelatereply\",\"ena2m6imafraidicant\"],\"tip\":\"En la Tarea 1 el registro formal NO suma: resta. Escribirle a una amiga como a un banco es un fallo de tarea.\"},{\"id\":\"ena2m12l6e9\",\"type\":\"fastmatch\",\"prompt\":\"Fórmulas informales en ráfaga\",\"pairs\":[{\"target\":\"Thanks for your message!\",\"source\":\"¡Gracias por tu mensaje!\"},{\"target\":\"Sorry for the late reply!\",\"source\":\"¡Perdona que conteste tan tarde!\"},{\"target\":\"Love, Valeria\",\"source\":\"Un beso, Valeria\"},{\"target\":\"See you soon!\",\"source\":\"¡Hasta pronto!\"},{\"target\":\"Write back soon!\",\"source\":\"¡Contesta pronto!\"}],\"targetSeconds\":30,\"itemIds\":[\"ena2m12thanksforyourmessage\",\"ena2m12sorryforthelatereply\",\"ena2m12lovevaleria\",\"enseeyousoon\",\"enwriteback\"],\"tip\":\"Cinco fórmulas que se escriben sin pensar valen ocho o diez palabras de las cincuenta. Ese es tiempo que le regalas al contenido.\"},{\"id\":\"ena2m12l6e10\",\"type\":\"write\",\"prompt\":\"Tarea 1 del Writing, en condiciones de examen — 30-50 palabras\",\"scenario\":\"Emma te escribe desde Manchester: «Hi! I heard you're taking the A2 exam — when is it? Are you nervous? And
