igt\u003c/b\u003e: die Tür des Ofens ist verbogen.\u003cbr/\u003e5. Nico ruft den Kundenservice an. Eine Stimme sagt, \u003cb\u003edass seine Beschwerde in Bearbeitung ist, obwohl er noch nichts geschickt hat\u003c/b\u003e.\u003cbr/\u003e6. Am Abend setzt er sich hin und schreibt eine Mail: „Sehr geehrte Damen und Herren, leider ist die gelieferte Ware beschädigt angekommen …“\u003cbr/\u003e7. Anna liest mit. „Schreib auch eine Frist“, sagt sie. „Ohne Frist wirst du nie eine Antwort bekommen.“\u003cbr/\u003e8. Drei Tage später steht in der Antwort: „Falls Sie das Gerät zurückschicken, [[erstatten|reembolsamos]] wir den vollen Betrag innerhalb von vierzehn Tagen.“\u003cbr/\u003e9. Nico schickt den Ofen zurück und wartet. Zehn Tage später wird ihm der volle Betrag überwiesen. Er sagt zu Anna: „Das nächste Mal lese ich das Kleingedruckte vorher.“ Anna antwortet: „Das sagst du jedes Mal.“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l9\",\"phaseId\":\"b1m8\",\"title\":\"Nicos Ofen\",\"subtitle\":\"Historia larga, espiral de los dos módulos anteriores y monólogo\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas del módulo\",\"itemIds\":[\"b1m8gesichlohnen\",\"b1m8geverzichtenauf\",\"b1m8genachdenkenueber\",\"b1m8geueberweisen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Nicos Ofen — eine Bestellung, ein Schaden und ein Vertrag\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l9e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 3)\",\"question\":\"„Nico liest das Kleingedruckte vor der Bestellung.“ (frase 3)\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Relee la frase 3: dice «Ich werde es später lesen» — y nunca lo hace\",null],\"itemIds\":[\"b1m8gekleingedruckte\"]},{\"id\":\"b1m8l9e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 5) — inferencia\",\"question\":\"¿Por qué es absurdo que le digan «Ihre Beschwerde ist in Bearbeitung»?\",\"options\":[\"Porque Nico todavía no ha mandado ninguna reclamación por escrito\",\"Porque la garantía ya ha caducado\",\"Porque el horno no estaba dañado\"],\"answer\":0,\"whyWrong\":[null,\"La garantía es de dos años y el horno acaba de llegar\",\"El horno sí está dañado: la puerta está torcida\"],\"itemIds\":[\"b1m8geinbearbeitung\",\"b1m8gebeschwerde\"],\"tip\":\"«in Bearbeitung» es una frase hecha que a veces no describe nada. Detectarlo es comprensión de intención, no de datos.\"},{\"id\":\"b1m8l9e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 7)\",\"question\":\"¿Por qué insiste Anna en poner un plazo?\",\"options\":[\"Porque sin plazo la empresa no tiene motivos para contestar\",\"Porque el plazo es obligatorio por ley\",\"Porque así el envío es más rápido\"],\"answer\":0,\"whyWrong\":[null,\"Ninguna ley obliga a poner plazo en una reclamación\",\"El plazo no afecta a la velocidad del transporte\"],\"itemIds\":[\"b1m8gefrist\"]},{\"id\":\"b1m8l9e4\",\"type\":\"cloze\",\"prompt\":\"Espiral de b1m7 — el genitivo (frase 4)\",\"text\":\"Die Tür ___ Ofens ist verbogen.\",\"answers\":[\"des\"],\"translation\":\"La puerta del horno está torcida.\",\"hints\":[\"Genitivo masculino: der Ofen\",\"d-e-s, y Ofens con -s\"],\"itemIds\":[\"b1m8geware\"],\"tip\":\"Genitivo puro, el de b1m7. En un mail de reclamación aparece en cada línea: die Tür des Ofens, die Erstattung des Betrags, der Umtausch der Ware.\"},{\"id\":\"b1m8l9e5\",\"type\":\"cloze\",\"prompt\":\"Espiral de b1m7 — el participio como adjetivo (frase 6)\",\"text\":\"Leider ist die ___ Ware beschädigt angekommen. (liefern)\",\"answers\":[\"gelieferte\"],\"translation\":\"Por desgracia la mercancía entregada llegó dañada.\",\"hints\":[\"Partizip II de liefern: geliefert\",\"die + Partizip + terminación de femenino singular\"],\"itemIds\":[\"b1m8geliefern\",\"b1m8geware\"],\"tip\":\"die gelieferte Ware = la mercancía que ha sido entregada. Participio II delante del sustantivo: recibe la acción.\"},{\"id\":\"b1m8l9e6\",\"type\":\"cloze\",\"prompt\":\"Espiral de b1m6 — la subordinada encadenada (frase 5)\",\"text\":\"Die Stimme sagt, dass seine Beschwerde in Bearbeitung ___, obwohl er noch nichts geschickt hat.\",\"answers\":[\"ist\"],\"translation\":\"La voz dice que su reclamación está en tramitación, aunque él todavía no ha enviado nada.\",\"hints\":[\"Dentro de dass, el verbo va al FINAL\",\"3ª persona de sein\"],\"itemIds\":[\"b1m8geinbearbeitung\",\"b1m8gebeschwerde\"],\"tip\":\"Dos subordinadas encadenadas: dass … ist, obwohl … hat. Cada una manda su verbo al final de SU frase, no al final de todo.\"},{\"id\":\"b1m8l9e7\",\"type\":\"order\",\"prompt\":\"Ordena la historia de Nico\",\"sentences\":[\"Nico bestellt einen Ofen im Internet.\",\"Das Paket kommt nach zwei Wochen an.\",\"Die Tür des Ofens ist verbogen.\",\"Nico schreibt eine Mail mit einer Frist.\",\"Die Firma erstattet den vollen Betrag.\"],\"translation\":\"Nico pide un horno por internet · El paquete llega a las dos semanas · La puerta del horno está torcida · Nico escribe un correo con un plazo · La empresa reembolsa el importe entero.\",\"itemIds\":[\"b1m8gebestellung\",\"paket\",\"b1m8gefrist\",\"b1m8geerstatten\"]},{\"id\":\"b1m8l9e8\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de compras — todo esto ya lo sabes del A2\",\"pairs\":[{\"target\":\"der Preis\",\"source\":\"el precio\"},{\"target\":\"der Rabatt\",\"source\":\"el descuento\"},{\"target\":\"im Angebot\",\"source\":\"de oferta\"},{\"target\":\"billiger\",\"source\":\"más barato\"},{\"target\":\"vergleichen\",\"source\":\"comparar\"}],\"targetSeconds\":25,\"itemIds\":[\"preis\",\"a2m7rabatt\",\"a2m7imangebot\",\"a2m7billiger\",\"a2m7vergleichen\"],\"tip\":\"Nada nuevo: solo velocidad sobre material consolidado. Es la hebra que casi ningún curso incluye y la única que rompe el estancamiento.\"},{\"id\":\"b1m8l9e9\",\"type\":\"build\",\"prompt\":\"Construye la frase de Anna (frase 7)\",\"target\":\"Ohne Frist wirst du nie eine Antwort bekommen\",\"translation\":\"Sin plazo nunca vas a recibir respuesta\",\"distractors\":[\"werden\",\"zu bekommen\"],\"itemIds\":[\"b1m8gefrist\",\"b1m8gewerden\"],\"tip\":\"Complemento en posición 1 → wirst en 2ª → bekommen al final. La pinza del futuro con inversión.\"},{\"id\":\"b1m8l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 · charla de una asesora de consumo. UNA sola escucha: lee la pregunta antes. (Fragmento: el Teil 2 real dura casi tres minutos y trae CINCO tareas seguidas.)\",\"audio\":\"Schön, dass Sie da sind. Ich mache das kurz – drei Punkte, dann können Sie fragen. Erstens, das Wichtigste: Beim Kauf im Internet haben Sie vierzehn Tage Widerrufsrecht, ohne Begründung. Zweitens, und da werden viele böse überrascht: Die Rücksendung müssen Sie in manchen Shops selbst bezahlen. Das steht im Kleingedruckten. Und drittens: Garantie und Gewährleistung sind nicht dasselbe. Die Gewährleistung gilt zwei Jahre, und die schuldet Ihnen der Händler – nicht der Hersteller.\",\"question\":\"¿Cuánto dura el derecho de desistimiento en una compra por internet?\",\"options\":[\"Catorce días, y sin dar explicaciones\",\"Dos años\",\"Solo hasta que se abre el paquete\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Los dos años son de la Gewährleistung, que es otra cosa\",\"Abrir el paquete no aparece en la charla\"],\"itemIds\":[\"b1m8gewiderruf\",\"b1m8gegarantie\"],\"tip\":\"Dos plazos en el mismo audio, catorce días y dos años, y cada uno con su nombre. El Teil 2 vive de esto: la respuesta falsa suele ser el otro número, el que también estaba.\"},{\"id\":\"b1m8l9e13\",\"type\":\"audiomc\",\"prompt\":\"Misma charla, segunda pregunta. Una escucha.\",\"audio\":\"Schön, dass Sie da sind. Ich mache das kurz – drei Punkte, dann können Sie fragen. Erstens, das Wichtigste: Beim Kauf im Internet haben Sie vierzehn Tage Widerrufsrecht, ohne Begründung. Zweitens, und da werden viele böse überrascht: Die Rücksendung müssen Sie in manchen Shops selbst bezahlen. Das steht im Kleingedruckten. Und drittens: Garantie und Gewährleistung sind nicht dasselbe. Die Gewährleistung gilt zwei Jahre, und die schuldet Ihnen der Händler – nicht der Hersteller.\",\"question\":\"¿Qué es lo que sorprende a mucha gente?\",\"options\":[\"Que en algunas tiendas la devolución la paga el cliente\",\"Que no exista ninguna garantía\",\"Que el plazo empiece a contar desde el pedido\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Garantía hay: lo que dice es que no es lo mismo que la Gewährleistung\",\"De cuándo empieza a contar el plazo no se habla\"],\"itemIds\":[\"b1m8gekleingedruckte\",\"b1m8gezurueckschicken\"],\"tip\":\"«und da werden viele böse überrascht» es un aviso hablado: lo que viene detrás es lo que el examen pregunta. Cuando alguien anuncia una sorpresa, sube la atención.\"},{\"id\":\"b1m8l9e10\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 2 — presenta tu tema con las cinco diapositivas del examen. Planifica, habla, y en la segunda pasada quita el andamio.\",\"topic\":\"Online einkaufen — bequem oder gefährlich?\",\"slides\":[{\"title\":\"1 · Thema vorstellen\",\"hint\":\"«Ich möchte heute über das Online-Einkaufen sprechen. Zuerst erzähle ich …, danach …, zum Schluss …»\"},{\"title\":\"2 · Meine eigene Erfahrung\",\"hint\":\"Cuenta una compra online tuya: qué pediste, qué salió bien o mal. Perfekt o Präteritum, pero elige uno.\"},{\"title\":\"3 · Die Situation in meinem Herkunftsland\",\"hint\":\"«Bei uns in … bestellen die meisten Leute …». Da una cifra o un ejemplo concreto.\"},{\"title\":\"4 · Vor- und Nachteile + meine Meinung\",\"hint\":\"Einerseits … andererseits …; Meiner Meinung nach …, weil …. Usa una vez «falls» y una vez el Futur I.\"},{\"title\":\"5 · Abschluss und Dank\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit. Haben Sie Fragen?»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos 4 conectores distintos\",\"Di un ejemplo propio en la diapositiva 2\",\"Usé una vez el Futur I y una vez falls o wenn\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Diapositiva 4, ejemplo: „Einerseits spart man Zeit, andererseits gibt man mehr Geld aus, weil man das Bezahlen nicht spürt. Meiner Meinung nach werden wir in zehn Jahren fast alles online kaufen. Falls das so kommt, brauchen wir bessere Regeln für die Ratenzahlung.“\",\"itemIds\":[\"b1m8gewerden\",\"b1m6falls\",\"b1m8gekonsum\",\"b1m8genachdenkenueber\"],\"tip\":\"Erfüllung del Teil 2 se mide por cuántas diapositivas tratas: las 5 = banda A, una sola = banda D. Vale 40 de los 100 puntos del oral.\"},{\"id\":\"b1m8l9e20\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 3 — lo que viene DESPUÉS de la presentación: 1-2 minutos y 16 puntos. Tu compañero acaba de presentar el mismo tema que tú («Online einkaufen / das Kleingedruckte»). Dale feedback, hazle UNA pregunta —es obligatoria—, reacciona a su feedback y contesta a la pregunta de la examinadora. En el examen esto no se prepara: se reacciona.\",\"topic\":\"Nach der Präsentation deines Partners zum Thema «Online einkaufen — bequem oder gefährlich?»: Rückmeldung geben, eine Frage stellen und auf die Frage der Prüferin antworten.\",\"slides\":[{\"title\":\"1 · Rückmeldung: dos frases concretas\",\"hint\":\"«Mir hat besonders gut gefallen, dass …» + «Interessant fand ich vor allem …». Nombra algo que él dijo de verdad — el Kleingedruckte, el Widerruf, una compra suya; un «war sehr gut» no cuenta como feedback.\"},{\"title\":\"2 · Deine Frage — obligatoria\",\"hint\":\"«Ich hätte noch eine Frage: Würdest du heute noch online bestellen, ohne das Kleingedruckte zu lesen?» Abierta, no de sí o no: si no puede contestarla con más de una frase, no te sirve.\"},{\"title\":\"3 · Auf sein Feedback reagieren\",\"hint\":\"«Danke, das freut mich.» · «Du hast recht, dass …» · «Ich kann das verstehen, aber …». Aceptar una crítica en una frase también puntúa.\"},{\"title\":\"4 · Die Frage der Prüferin\",\"hint\":\"«Wie macht man das in Ihrem Heimatland?» → dato + ejemplo concreto + «Meiner Meinung nach …». Es la misma receta de la diapositiva 3 de tu presentación, pero improvisada.\"}],\"planSeconds\":30,\"speakSeconds\":100,\"reps\":2,\"checklist\":[\"He dado DOS frases de feedback, y las dos nombran algo concreto de su presentación\",\"He hecho mi pregunta con «Ich hätte noch eine Frage:» y era abierta\",\"He reaccionado a su feedback con algo más que «danke»\",\"He contestado a la pregunta de la examinadora con dato + ejemplo + opinión\",\"He hablado al menos un minuto seguido, sin leer\"],\"model\":\"Mir hat besonders gut gefallen, dass du das Kleingedruckte mit einem echten Kauf erklärt hast und nicht nur allgemein geredet hast. Interessant fand ich vor allem, dass du das Widerrufsrecht von vierzehn Tagen genannt hast. Ich hätte noch eine Frage: Würdest du heute noch online bestellen, ohne das Kleingedruckte zu lesen? … Danke für dein Feedback. Du hast recht, dass ich am Anfang zu schnell gesprochen habe; beim nächsten Mal fange ich langsamer an. Und zur Frage, wie man das bei uns macht: Bei uns bestellen die meisten Leute online, aber kaum jemand liest die Bedingungen. Meine Schwester hat einmal eine Waschmaschine auf Raten gekauft und erst später gesehen, dass die Rücksendung sie selbst zahlen muss. Meiner Meinung nach sollte man immer das Kleingedruckte lesen — auch wenn es nervt.\",\"itemIds\":[\"b1m8gekleingedruckte\",\"b1m8gewiderruf\",\"b1m8gesichbeschweren\",\"b1m8genachdenkenueber\"],\"tip\":\"El Teil 3 se pierde por callarse: son 16 puntos que se dan por hablar minuto y medio. Llévate las tres frases hechas —feedback, pregunta, reacción— y rellénalas con lo que acabas de oír. Y no corrijas a tu compañero: no puntúa y no es tu papel.\"},{\"id\":\"b1m8l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Si el aparato no llega, rescindiré el contrato y pediré el reembolso del importe\",\"answers\":[\"Falls das Gerät nicht ankommt, werde ich den Vertrag kündigen und um die Erstattung des Betrags bitten\",\"Falls das Gerät nicht ankommt, werde ich den Vertrag kündigen und um die Erstattung des Betrags bitten.\",\"Wenn das Gerät nicht ankommt, werde ich den Vertrag kündigen und um die Erstattung des Betrags bitten\"],\"hints\":[\"Falls + verbo al final, coma, y la principal empieza por werde\",\"bitten um + die Erstattung des Betrags\"],\"itemIds\":[\"b1m6falls\",\"b1m8gewerden\",\"b1m8gekuendigen\",\"b1m8gebittenum\",\"b1m8gebetrag\"],\"tip\":\"Condicional + Futur I + nominalización con genitivo, en una sola frase. Si te salió, el módulo está cerrado.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m8-4\",\"book\":\"Ich bezahle für alle.\",\"real\":\"Das geht auf mich.\",\"meaning\":\"Invito yo. / Va de mi cuenta.\",\"when\":\"En el bar o el restaurante, entre amigos o compañeros, cuando pagas tú la ronda. Ojo: en Alemania lo normal es «getrennt» (cada uno lo suyo), así que decirlo es un gesto que se nota. Si a quien invitas lo tratas de usted — un cliente, un profesor —, la fila de examen.\",\"register\":\"amigos\",\"exam\":\"Die Rechnung übernehme ich.\",\"note\":\"Literalmente «eso va sobre mí». La respuesta esperada es «Danke, das nächste Mal ich!» — porque el gesto se devuelve.\",\"sound\":\"das guet auf mij\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m8gebezahlung\"}}],\"resources\":[{\"label\":\"DW — Top-Thema mit Vokabeln (Wirtschaft)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Artículos B1 con audio sobre consumo, deudas y comercio online: mismo registro que el Lesen Teil 2.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.pus
