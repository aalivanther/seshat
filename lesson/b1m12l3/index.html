.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Td39,"])</script><script>self.__next_f.push([1,"\u003cb\u003eTeil 3 — 10 minutos, 7 ítems (13-19).\u003c/b\u003e Siete situaciones y \u003cb\u003ediez anuncios (A-J)\u003c/b\u003e. Tres reglas duras:\u003cbr/\u003e1) cada anuncio se usa \u003cb\u003euna sola vez\u003c/b\u003e;\u003cbr/\u003e2) el anuncio del ejemplo \u003cb\u003equeda descartado\u003c/b\u003e;\u003cbr/\u003e3) \u003cb\u003epara una de las siete situaciones NO hay anuncio válido\u003c/b\u003e → se escribe \u003cb\u003e0\u003c/b\u003e. Consigna literal: \u003ci\u003e„Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.“\u003c/i\u003e\u003cbr/\u003ePor qué se falla: los diez anuncios comparten campo léxico y solo \u003cb\u003eun detalle\u003c/b\u003e discrimina (el horario, el precio, un requisito). Y como casi nadie se atreve a escribir «0», el que duda fuerza una pareja mala y \u003cb\u003econtamina otras dos respuestas\u003c/b\u003e.\u003cbr/\u003eMétodo: lee la situación y subraya \u003cb\u003elas dos condiciones\u003c/b\u003e que debe cumplir; descarta por la condición más rara; si al final te sobra una situación sin anuncio, esa es tu \u003cb\u003e0\u003c/b\u003e.\u003cbr/\u003e\u003cb\u003eLos diez anuncios de esta lección (A–J), tablón del centro vecinal.\u003c/b\u003e Siete situaciones, diez anuncios: \u003cb\u003etres sobran\u003c/b\u003e y \u003cb\u003euno de los siete es 0\u003c/b\u003e. El ejemplo gasta el anuncio I: ya no vale para las siete que puntúan.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eA — SPRACHCAFÉ.\u003c/b\u003e Jeden Mittwoch ab 19 Uhr sprechen wir Deutsch über Alltagsthemen. Kein Unterricht, keine Hausaufgaben, Eintritt frei. Ab Niveau A2. Keine Anmeldung.\u003cbr/\u003e\u003cb\u003eB — FAHRRADWERKSTATT ZUM SELBERMACHEN.\u003c/b\u003e Samstags 10-14 Uhr. Werkzeug ist da, Ersatzteile zahlen Sie selbst. Nur Fahrräder, keine Haushaltsgeräte. Ohne Termin.\u003cbr/\u003e\u003cb\u003eC — NACHHILFE MATHEMATIK ONLINE.\u003c/b\u003e 20 Euro pro Stunde, auch abends. Für Schülerinnen und Schüler ab Klasse 7. Anmeldung per Mail. Kein Deutschunterricht.\u003cbr/\u003e\u003cb\u003eD — WOHNUNG.\u003c/b\u003e 2 Zimmer, 48 m², ab 1. Oktober, Nähe Bahnhof. Warmmiete 720 Euro. Keine Haustiere.\u003cbr/\u003e\u003cb\u003eE — CHOR «STIMMEN IM KIEZ».\u003c/b\u003e Probe montags 18-20 Uhr. Wir suchen Sängerinnen. Vorkenntnisse von Vorteil, aber keine Pflicht. Unentgeltlich.\u003cbr/\u003e\u003cb\u003eF — SPEISEKAMMER / FOODSHARING.\u003c/b\u003e Freitags 16-18 Uhr gerettete Lebensmittel abholen. Kostenlos. Mitgliedschaft im Verein nötig.\u003cbr/\u003e\u003cb\u003eG — NACHBARSCHAFTSGARTEN.\u003c/b\u003e Im Frühjahr mitpflanzen. Ein Beet pro Haushalt, 15 Euro im Jahr. Hunde müssen draußen bleiben. Treffen sonntags 10 Uhr.\u003cbr/\u003e\u003cb\u003eH — TIERPATENSCHAFT.\u003c/b\u003e Mit 12 Euro im Monat unterstützen Sie eine Katze im Tierheim und dürfen sie besuchen. Mit nach Hause nehmen dürfen Sie das Tier nicht.\u003cbr/\u003e\u003cb\u003eI — HANDY-SPRECHSTUNDE.\u003c/b\u003e Donnerstags 15-17 Uhr erklären Jugendliche Menschen ab 60 Handy und Tablet. Eigenes Gerät mitbringen. Kostenlos. \u003ci\u003eEjemplo resuelto: tienes más de 60 y quieres entender el móvil → I. Gastado.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003eJ — FLOHMARKT IM HOF.\u003c/b\u003e Am 12. Mai, 10-16 Uhr. Ein Tisch kostet 5 Euro, Anmeldung bis 1. Mai. Verkauft werden darf alles außer Lebensmitteln.\u003cbr/\u003e\u003cbr/\u003eSobran G, H y J si haces las siete situaciones de la lección. Si ningún anuncio cumple las dos condiciones, es \u003cb\u003e0\u003c/b\u003e: no hay taller de tostadoras en este tablón.\u003cbr/\u003e\u003cb\u003eTeil 4 — 15 minutos, 7 ítems (20-26).\u003c/b\u003e Siete comentarios de lectores sobre un tema polémico y \u003cb\u003euna sola pregunta para todos\u003c/b\u003e: «¿esta persona está a favor de X?» → \u003cb\u003eJa / Nein\u003c/b\u003e. Nadie escribe «ich bin dafür»: hay que \u003cb\u003einferir la postura\u003c/b\u003e a partir de lo que cuenta. Ojo a los que empiezan cediendo («Natürlich verstehe ich, dass…») y terminan en contra: manda [[der Schluss|el final]]."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m12l3\",\"phaseId\":\"b1m12\",\"title\":\"Lesen Teil 3 y 4\",\"subtitle\":\"El emparejamiento 7↔10 con la trampa del «0» · y siete lectores a favor o en contra\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Anuncios, posturas y cartas de lectores\",\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\",\"b1m4ichbindafuer\",\"b1m4ichbindagegen\",\"b1m12gzleserbrief\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 3: el que más se falla · Teil 4: el que no dice lo que quiere decir\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l3e1\",\"type\":\"mc\",\"prompt\":\"La regla que más puntos cuesta\",\"question\":\"Has emparejado seis situaciones y para la séptima ningún anuncio encaja del todo. ¿Qué haces?\",\"options\":[\"Escribes 0\",\"Repites el anuncio que más se parezca\",\"Dejas la casilla vacía\"],\"answer\":0,\"whyWrong\":[null,\"Cada anuncio se usa UNA sola vez: repetir te tumba también el ítem correcto\",\"Vacío es 0 puntos; el «0» escrito puede ser la respuesta correcta\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"«Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.» Está escrito en la hoja: úsalo.\"},{\"id\":\"b1m12l3e2\",\"type\":\"match\",\"prompt\":\"Teil 3: empareja las siete situaciones con su anuncio\",\"pairs\":[{\"target\":\"A — Sprachcafé, jeden Mittwoch ab 19 Uhr, Eintritt frei\",\"source\":\"Quieres practicar alemán hablando, por la tarde y sin pagar\"},{\"target\":\"B — Fahrradwerkstatt zum Selbermachen, Sa 10-14 Uhr\",\"source\":\"Quieres arreglar tú mismo tu bici el fin de semana\"},{\"target\":\"C — Nachhilfe Mathe, online, 20 Euro pro Stunde\",\"source\":\"Buscas clases particulares de matemáticas desde casa\"},{\"target\":\"D — Wohnung ab 1. Oktober, 2 Zimmer, Nähe Bahnhof\",\"source\":\"Necesitas piso a partir de octubre cerca de la estación\"},{\"target\":\"E — Chor sucht Sängerinnen, Probe montags\",\"source\":\"Quieres cantar en grupo entre semana\"},{\"target\":\"F — Speisekammer / Foodsharing, Fr 16-18 Uhr, kostenlos\",\"source\":\"Quieres recoger comida rescatada el viernes por la tarde, sin pagar\"},{\"target\":\"G — Nachbarschaftsgarten, Beet 15 Euro/Jahr, Treffen sonntags\",\"source\":\"Quieres un huerto vecinal y puedes los domingos por la mañana\"}],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"Cada anuncio tiene DOS datos: qué es y cuándo/cuánto. La condición rara es la que decide. Aquí las siete tienen pareja; en las siete siguientes, una no.\"},{\"id\":\"b1m12l3exs1\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 1 de 7. Los diez anuncios A–J están en la nota de arriba: tres sobran y para una de las siete no hay anuncio (0). El I del ejemplo ya está gastado.\",\"question\":\"Quieres practicar alemán hablando, por la tarde y sin pagar. No quieres deberes ni profesor.\",\"options\":[\"A — Sprachcafé\",\"C — Nachhilfe online\",\"E — Chor\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"C es mates, cuesta 20 € la hora y es clase, no conversación\",\"E es un coro: se canta, no se habla alemán\",\"Sí hay anuncio: el Sprachcafé del miércoles, gratis y sin deberes\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"Dos condiciones: hablar alemán y no pagar. El coro y la Nachhilfe fallan las dos.\"},{\"id\":\"b1m12l3exs2\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 2 de 7. Cada anuncio se usa una sola vez.\",\"question\":\"Quieres arreglar tú mismo tu bici el sábado por la mañana, sin pedir cita.\",\"options\":[\"B — Fahrradwerkstatt\",\"J — Flohmarkt\",\"G — Nachbarschaftsgarten\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"J es un mercadillo: se vende, no se repara\",\"G es un huerto, no un taller\",\"Sí hay anuncio: la Fahrradwerkstatt del sábado, sin cita\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"«Selbermachen» y «ohne Termin» son los dos datos. El mercadillo se parece por el sábado y falla el verbo.\"},{\"id\":\"b1m12l3exs3\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 3 de 7.\",\"question\":\"Buscas clases particulares de matemáticas por internet, también por la noche, y puedes pagar.\",\"options\":[\"C — Nachhilfe online\",\"A — Sprachcafé\",\"I — Handy-Sprechstunde\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"A es conversación gratis, no mates y no es clase\",\"I es para el móvil de mayores de 60, y además es el anuncio del ejemplo: ya está gastado\",\"Sí hay anuncio: Nachhilfe Mathe online, 20 €, también por la noche\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"El I tienta porque «explica» algo, pero el ejemplo lo dejó fuera. En el examen, el anuncio del ejemplo no vuelve.\"},{\"id\":\"b1m12l3exs4\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 4 de 7. Si ninguno encaja del todo, no fuerces pareja.\",\"question\":\"Se te ha estropeado la tostadora y quieres que te ayuden a repararla, no a venderla ni a tirarla.\",\"options\":[\"B — Fahrradwerkstatt\",\"J — Flohmarkt\",\"I — Handy-Sprechstunde\",\"0 — ninguno\"],\"answer\":3,\"whyWrong\":[\"B repara solo bicis: «keine Haushaltsgeräte»\",\"J es un mercadillo: se vende, no se repara\",\"I es para el móvil de mayores de 60, y ya está gastado\",null],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"En este tablón no hay café de reparación de tostadoras. Si ningún anuncio cumple las dos condiciones, se escribe 0. Forzar una pareja mala te contamina las otras.\"},{\"id\":\"b1m12l3exs5\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 5 de 7.\",\"question\":\"Quieres cantar en un grupo entre semana por la tarde. No te importa ser principiante.\",\"options\":[\"E — Chor\",\"A — Sprachcafé\",\"I — Handy-Sprechstunde\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"A se habla, no se canta\",\"I es el móvil, y además ya está gastado en el ejemplo\",\"Sí hay anuncio: el coro, ensayo los lunes, principiantes bienvenidos\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"«Sängerinnen» y «montags» cubren las dos condiciones. El Sprachcafé comparte la tarde y falla el verbo.\"},{\"id\":\"b1m12l3exs6\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 6 de 7.\",\"question\":\"Quieres recoger comida rescatada el viernes por la tarde, sin pagar. Apuntarte al Verein no es problema.\",\"options\":[\"F — Speisekammer / Foodsharing\",\"J — Flohmarkt\",\"H — Patenschaft\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"J prohíbe vender alimentos y la mesa cuesta 5 €\",\"H es apadrinar una gata, no recoger comida\",\"Sí hay anuncio: Speisekammer los viernes, gratis, con membresía\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"J tienta porque es del barrio y hay «alimentos» en el texto, pero justo los prohíbe. La condición rara («kostenlos» + comida) decide.\"},{\"id\":\"b1m12l3exs7\",\"type\":\"mc\",\"prompt\":\"Teil 3 a escala · situación 7 de 7.\",\"question\":\"Necesitas un piso de dos habitaciones a partir de octubre, cerca de la estación. No tienes mascota.\",\"options\":[\"D — Wohnung\",\"J — Flohmarkt\",\"H — Patenschaft\",\"0 — ninguno\"],\"answer\":0,\"whyWrong\":[null,\"J es un mercadillo, no un piso\",\"H es apadrinar un animal, no alquilar\",\"Sí hay anuncio: 2 Zimmer ab 1. Oktober, Nähe Bahnhof, ohne Haustiere\"],\"itemIds\":[\"a2anzeige\",\"b1m12gzzuordnen\"],\"tip\":\"Si trajeras gato, D también fallaría («Keine Haustiere») y sería 0. Aquí las dos condiciones se cumplen: octubre y sin mascota.\"},{\"id\":\"b1m12l3e3\",\"type\":\"mc\",\"prompt\":\"Descarta por el detalle\",\"question\":\"Situación: «Buscas un curso de alemán los sábados por la mañana.» ¿Cuál descartas?\",\"options\":[\"Deutschkurs, Sa 9-12 Uhr, Anmeldung nötig\",\"Deutschkurs, Di und Do 18-20 Uhr\",\"Deutschkurs für Anfänger, Sa 10-13 Uhr\"],\"answer\":1,\"whyWrong\":[\"Sábado por la mañana: encaja\",null,\"Sábado por la mañana: encaja\"],\"itemIds\":[\"a2anzeige\"],\"tip\":\"El día y la hora son los discriminadores favoritos del Teil 3. Subráyalos siempre.\"},{\"id\":\"b1m12l3e4\",\"type\":\"bucket\",\"prompt\":\"Teil 4 a escala: siete Leserbriefe. ¿Está a favor o en contra de prohibir los móviles en clase?\",\"categories\":[\"dafür (Ja)\",\"dagegen (Nein)\"],\"items\":[{\"text\":\"„Ohne Handys ist es im Unterricht endlich wieder ruhig. Ich sehe keinen einzigen Nachteil.“\",\"bucket\":0},{\"text\":\"„Natürlich stören Handys manchmal. Aber ein Verbot löst gar nichts — die Kinder lernen dann nie, damit umzugehen.“\",\"bucket\":1},{\"text\":\"„Meine Tochter hat seit dem Verbot bessere Noten. Für mich ist der Fall klar.“\",\"bucket\":0},{\"text\":\"„Im Notfall muss mein Sohn mich erreichen können. Deshalb halte ich nichts davon.“\",\"bucket\":1},{\"text\":\"„Handys gehören in die Tasche, Punkt. Andere Länder machen das längst so.“\",\"bucket\":0},{\"text\":\"„Verbieten ist immer die einfachste Lösung — und meistens die schlechteste.“\",\"bucket\":1},{\"text\":\"„Klar, im Notfall will man die Kinder erreichen. Aber seit dem Verbot kann meine Klasse endlich wieder fünf Minuten am Stück zuhören. Für mich ist das Argument stark genug.“\",\"bucket\":0}],\"itemIds\":[\"b1m4ichbindafuer\",\"b1m4ichbindagegen\",\"b1m12gzleserbrief\"],\"tip\":\"Ninguno dice «ich bin dafür/dagegen». Se infiere. Lee el FINAL de cada comentario: ahí está la postura.\"},{\"id\":\"b1m12l3e5\",\"type\":\"mc\",\"prompt\":\"La trampa de la concesión\",\"question\":\"„Natürlich verstehe ich die no sobre este tema.\",\"itemIds\":[\"b1m12gzstellungnehmenzu\"]},{\"id\":\"b1m12l3e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 (contestador): DOS escuchas. Lee la afirmación y decide Richtig o Falsch.\",\"audio\":\"Guten Tag, hier ist die Sprachschule am Park, Sie sprechen mit der Anmeldung. Es geht um Ihre Anmeldung zur B1-Prüfung. Ihr Wunschtermin am siebzehnten Juni ist leider voll, wir können Ihnen aber den vierundzwanzigsten anbieten, zur gleichen Uhrzeit. Wichtig: Bringen Sie an dem Tag unbedingt einen gültigen Ausweis mit, ohne Ausweis dürfen wir Sie nicht zur Prüfung zulassen. Rufen Sie bitte bis Freitag zurück.\",\"question\":\"Der gewünschte Prüfungstermin bleibt bestehen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"El 17 de junio está lleno («leider voll»); te ofrecen el 24\",null],\"itemIds\":[\"b1m12gzteilnehmenan\",\"b1m12gzzweimalhoeren\"],\"tip\":\"Descanso de oído entre dos bloques de lectura, y no es un capricho: el Hören se aprueba por separado. Dos datos por texto en el Teil 1 — aquí, la fecha y el documento.\"},{\"id\":\"b1m12l3e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1, segunda tarea del mismo mensaje. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist die Sprachschule am Park, Sie sprechen mit der Anmeldung. Es geht um Ihre Anmeldung zur B1-Prüfung. Ihr Wunschtermin am siebzehnten Juni ist leider voll, wir können Ihnen aber den vierundzwanzigsten anbieten, zur gleichen Uhrzeit. Wichtig: Bringen Sie an dem Tag unbedingt einen gültigen Ausweis mit, ohne Ausweis dürfen wir Sie nicht zur Prüfung zulassen. Rufen Sie bitte bis Freitag zurück.\",\"question\":\"¿Qué pasa si no llevas un documento de identidad válido?\",\"options\":[\"No te dejan hacer el examen\",\"Pagas una tasa\",\"Te dan una fecha posterior\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De dinero no se dice nada en el mensaje\",\"La fecha posterior es lo que te ofrecen por otro motivo: el cupo\"],\"itemIds\":[\"b1m12gzteilnehmenan\"],\"tip\":\"«zulassen» = admitir. «Wir dürfen Sie nicht zur Prüfung zulassen» no es una amenaza: es el reglamento. Documento en la mochila la noche antes.\"},{\"id\":\"b1m12l3e9\",\"type\":\"match\",\"prompt\":\"Empareja los Redemittel de postura\",\"pairs\":[{\"target\":\"Ich bin dafür.\",\"source\":\"Estoy a favor.\"},{\"target\":\"Ich bin dagegen.\",\"source\":\"Estoy en contra.\"},{\"target\":\"Ich halte nichts davon.\",\"source\":\"No me parece nada bien.\"},{\"target\":\"Für mich ist der Fall klar.\",\"source\":\"Para mí está clarísimo.\"}],\"itemIds\":[\"b1m4ichbindafuer\",\"b1m4ichbindagegen\"]},{\"id\":\"b1m12l3e10\",\"type\":\"transform\",\"prompt\":\"Cambia de postura\",\"source\":\"Ich bin dafür, weil ein Verbot Ruhe bringt.\",\"instruction\":\"Ponla en contra manteniendo la estructura\",\"answers\":[\"Ich bin dagegen, weil ein Verbot nichts bringt.\",\"Ich bin dagegen, weil ein Verbot keine Ruhe bringt.\"],\"translation\":\"Estoy en contra, porque una prohibición no trae nada.\",\"hints\":[\"dafür → dagegen\",\"…, weil ein Verbot ___ bringt.\"],\"itemIds\":[\"b1m4ichbindafuer\",\"b1m4ichbindagegen\"]},{\"id\":\"b1m12l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quiero posicionarme sobre este tema: estoy en contra de una prohibición\",\"answers\":[\"Ich möchte zu diesem Thema Stellung nehmen: Ich bin gegen ein Verbot\",\"Ich möchte zu diesem Thema Stellung nehmen: Ich bin gegen ein Verbot.\",\"Ich möchte zu diesem Thema Stellung nehmen. Ich bin gegen ein Verbot\"],\"hints\":[\"zu + Dativ: zu diesem Thema\",\"gegen + Akkusativ: gegen ein Verbot\"],\"itemIds\":[\"b1m12gzstellungnehmenzu\",\"b1m4ichbindagegen\"],\"tip\":\"Esta frase abre perfectamente el Schreiben Aufgabe 2. Guárdala tal cual.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\"
