l\":\"Solo el punto 3: «The written paper is marked out of 150. You pass at 75, a High Pass is 101, and there are no skill minimums — Listening, Reading and Writing add up. What has grown is not the clock. It's what they put inside it: twenty-five minutes of audio, two hours and ten shared between reading and writing, two minutes of monologue with the same thirty seconds I had at B1. Half the problem is the clock. I've started timing the whole paper, not just the bits I like.»\",\"itemIds\":[\"enb2m12twominutes\",\"enb2m12samethirtyseconds\",\"enb2m12theagencyaskedforb2\",\"enb2m12halftheproblemistheclock\",\"enb2m12tosumuptheevidence\",\"enb2m12booktheexam\"]},{\"id\":\"enb2m12l9e5\",\"type\":\"audiomc\",\"prompt\":\"Nadia llama. Pregunta ANTES. Dos escuchas.\",\"plays\":2,\"audio\":\"Valeria? Nadia Kowalczyk. We spoke last year.|I remember. The two posts.|Both still want an accredited B2. I see you've booked June.|I have. Online, from here.|Good. Don't spend the reading hour on the first text. The writing shares the clock. And the long turn is two minutes now, same thirty seconds. People freeze.|I know. Half the problem is the clock.|That's what I rang to say. We'll talk when the result's in.\",\"question\":\"¿Para qué llama Nadia, y qué le recuerda del reloj?\",\"options\":[\"Para confirmar que se ha matriculado, y que el Writing comparte reloj y el Part 4 son dos minutos con treinta segundos.\",\"Para ofrecerle uno de los dos puestos ya, sin certificado.\",\"Para decirle que el oral se ha cancelado.\"],\"answer\":0,\"whyWrong\":[null,\"Los puestos siguen pidiendo el B2. We'll talk when the result's in.\",\"Nadie cancela nada.\"],\"itemIds\":[\"enb2m12theagencyaskedforb2\",\"enb2m12sharedclock\",\"enb2m12twominutes\"]},{\"id\":\"enb2m12l9e6\",\"type\":\"speak\",\"prompt\":\"La reparación, en voz alta, la de examen\",\"text\":\"I beg your pardon, could you repeat the question?\",\"phonetic\":\"ai beg yoo PÁA-don, kud yu ri-PÍIT de KUÉS-chon\",\"translation\":\"Per
