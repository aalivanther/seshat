003e\u003cb\u003eEl error del hispanohablante es partirlo en dos.\u003c/b\u003e «ái-UÍL» suena a dictado, y peor: al oír a otro no reconoces nada, porque tú estás esperando dos golpes y solo llega uno. Practica al revés: di \u003ci\u003eI\u003c/i\u003e y alarga la lengua contra el paladar sin abrir otra vez la boca. Eso es \u003ci\u003eI'll\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el caso más difícil de todos, \u003ci\u003eit'll\u003c/i\u003e:\u003c/b\u003e ahí se juntan una t y una l, que es una combinación que el español no tiene. Lo que sale de una boca inglesa es \u003cb\u003e[[it'll be|Í-tol bi]]\u003c/b\u003e, tres golpes cortitos y pegados. Escúchalo unas cuantas veces: aparece en la mitad de las frases de este módulo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuándo NO se contrae:\u003c/b\u003e en la respuesta corta. \u003ci\u003eYes, it \u003cb\u003ewill\u003c/b\u003e.\u003c/i\u003e — nunca \u003ci\u003eYes, it'll\u003c/i\u003e. Es la misma regla de «Yes, I \u003cb\u003eam\u003c/b\u003e» del A1: la palabra final de una respuesta corta se dice entera, porque es donde cae el peso.18:T5cb,"])</script><script>self.__next_f.push([1,"Este es el par más caro del nivel, y no es exagerado:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ewon't\u003c/b\u003e se dice \u003cb\u003eUÓUNT\u003c/b\u003e — con una \u003cb\u003eo larga que se cierra en u\u003c/b\u003e, como el «óu» de \u003ci\u003ego\u003c/i\u003e y \u003ci\u003ehome\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003ewant\u003c/b\u003e se dice \u003cb\u003eUÓNT\u003c/b\u003e — con una \u003cb\u003eo corta y seca\u003c/b\u003e, la de \u003ci\u003ehot\u003c/i\u003e y \u003ci\u003enot\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eEl español solo tiene una «o», así que los dos te salen igual. Y la frase que sale de ahí es un desastre: \u003ci\u003eI won't help you\u003c/i\u003e (no pienso ayudarte) frente a \u003ci\u003eI want help\u003c/i\u003e (necesito ayuda). Del no rotundo a la petición de socorro.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se arregla en treinta segundos:\u003c/b\u003e para decir \u003ci\u003ewon't\u003c/i\u003e, empieza a decir «go» y córtalo con una n y una t — \u003cb\u003egóu → uóunt\u003c/b\u003e. Para \u003ci\u003ewant\u003c/i\u003e, di «not» y cámbiale la primera letra — \u003cb\u003enot → uónt\u003c/b\u003e. Si notas que la boca se te cierra al final, es \u003ci\u003ewon't\u003c/i\u003e; si se queda abierta, es \u003ci\u003ewant\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una ayuda que no está en los libros:\u003c/b\u003e \u003ci\u003ewon't\u003c/i\u003e casi siempre va \u003cb\u003eacentuado\u003c/b\u003e —es la negación, y la negación se oye— mientras que \u003ci\u003ewant\u003c/i\u003e suele ir seguido de \u003ci\u003eto\u003c/i\u003e y se come parte de sí mismo: \u003ci\u003eI wanna go\u003c/i\u003e. Si oyes algo largo y fuerte, es \u003ci\u003ewon't\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa tercera de hoy es más fácil y da mucho:\u003c/b\u003e \u003cb\u003eprobably\u003c/b\u003e tiene tres sílabas escritas y \u003cb\u003edos habladas\u003c/b\u003e: \u003cb\u003e[[probably|PRO-bli]]\u003c/b\u003e. Nadie dice «pro-BA-ble-mente» a la inglesa. Si lo dices con tres, se te nota el acento en una palabra que vas a usar cada dos frases."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l5\",\"phaseId\":\"ena2m11\",\"title\":\"I won't / I want\",\"subtitle\":\"La clínica: la 'll que no es sílaba y la vocal que separa un no de un quiero\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las cuatro cosas que hay que oír hoy\",\"itemIds\":[\"ena2m11llsound\",\"ena2m11itllbe\",\"ena2m11wontwant\",\"ena2m11probablysound\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La 'll no es una sílaba: se pega y alarga la palabra de delante\",\"body\":\"$17\"}},{\"kind\":\"note\",\"note\":{\"title\":\"won't / want: el par mínimo que cambia un no por un quiero\",\"body\":\"$18\",\"table\":[[\"se escribe\",\"suena\",\"y NO suena\"],[\"I'll\",\"áil\",\"ái-UÍL\"],[\"it'll be\",\"Í-tol bi\",\"it UÍL bi\"],[\"won't\",\"UÓUNT\",\"UÓNT\"],[\"want\",\"UÓNT\",\"UÓUNT\"],[\"probably\",\"PRO-bli\",\"PRO-ba-ble-li\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l5e1\",\"type\":\"mc\",\"prompt\":\"La 'll, en una pregunta\",\"question\":\"¿Cuántas sílabas tiene «I'll» al hablar?\",\"options\":[\"Una: es «áil»\",\"Dos: «ái-uíl»\",\"Depende de la frase\"],\"answer\":0,\"whyWrong\":[null,\"Eso es «I will» separado, que solo se dice para insistir o discutir\",\"No depende: la contracción siempre es una sola sílaba\"],\"itemIds\":[\"ena2m11llsound\"],\"tip\":\"La 'll no añade sílaba: alarga la que ya había. Es exactamente lo que hace la contracción de «I'm» con «am».\"},{\"id\":\"ena2m11l5e2\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál has oído?\",\"book\":\"It will be cold tonight.\",\"real\":\"It'll be cold tonight.\",\"translation\":\"Esta noche hará frío.\",\"itemIds\":[\"ena2m11itllbe\",\"ena2m11willitbecold\"],\"tip\":\"Las dos son correctas y significan lo mismo. La diferencia es que una la vas a leer y la otra la vas a oír: en el habla real, «it'll» gana nueve de cada diez veces.\"},{\"id\":\"ena2m11l5e3\",\"type\":\"hearreal\",\"prompt\":\"Escucha y dime qué significa\",\"book\":\"I will not do it.\",\"real\":\"I won't do it.\",\"translation\":\"No pienso hacerlo.\",\"ask\":\"meaning\",\"meaningOptions\":[\"No pienso hacerlo\",\"Quiero hacerlo\",\"Ya lo hice\"],\"itemIds\":[\"ena2m11wontwant\",\"ena2m11itwontrain\"],\"tip\":\"Con «won't» la negación está dentro de la palabra, no en un «not» aparte. Si no cazas esa vocal larga, te pierdes el «no» entero de la frase.\"},{\"id\":\"ena2m11l5e4\",\"type\":\"bucket\",\"prompt\":\"¿Suena UÓUNT (won't) o UÓNT (want)?\",\"categories\":[\"won't: o larga que se cierra en u\",\"want: o corta y seca\"],\"items\":[{\"text\":\"I won't be long.\",\"bucket\":0},{\"text\":\"I want a coffee.\",\"bucket\":1},{\"text\":\"It won't rain tonight.\",\"bucket\":0},{\"text\":\"Do you want to come?\",\"bucket\":1},{\"text\":\"She won't be here.\",\"bucket\":0},{\"text\":\"They want more time.\",\"bucket\":1}],\"itemIds\":[\"ena2m11wontwant\",\"ena2m11wewontbelong\",\"ena2m11itwontrain\"],\"tip\":\"Lee la lista dos veces en voz alta, alternando. La boca tiene que cerrarse en las de la izquierda y quedarse abierta en las de la derecha.\"},{\"id\":\"ena2m11l5e5\",\"type\":\"audiomc\",\"prompt\":\"Escucha bien la vocal — pregunta primero\",\"audio\":\"I won't go to the park with you.\",\"question\":\"¿Qué está diciendo?\",\"options\":[\"Que no piensa ir al parque\",\"Que quiere ir al parque\",\"Que fue al parque\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso sería «I want to go», con o corta y un «to» detrás\",\"El pasado sería «I went», que es otra vocal distinta\"],\"itemIds\":[\"ena2m11wontwant\"],\"tip\":\"Tres palabras que el oído español mezcla: won't (uóunt), want (uónt) y went (uent). Si distingues esas tres, entiendes la mitad de lo que no entendías.\"},{\"id\":\"ena2m11l5e6\",\"type\":\"shadow\",\"prompt\":\"Repite pegado al audio — la contracción entera\",\"text\":\"It'll be cold, but it won't rain.\",\"phonetic\":\"Í-tol bi KÓULD, bat it UÓUNT réin\",\"translation\":\"Hará frío, pero no lloverá.\",\"reps\":2,\"itemIds\":[\"ena2m11itllbe\",\"ena2m11itwontrain\"],\"tip\":\"Primera pasada lenta, para colocar la lengua en «Í-tol». Segunda a velocidad normal, sin mirar. Si te sale «it uil», para y vuelve a empezar.\"},{\"id\":\"ena2m11l5e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe — con la contracción\",\"text\":\"It'll probably rain tomorrow.\",\"translation\":\"Seguramente llueva mañana.\",\"strictContractions\":true,\"hints\":[\"Empieza con la contracción de «it will»\",\"It'll p… rain tomorrow.\"],\"itemIds\":[\"ena2m11itllbe\",\"ena2m11probablysound\"],\"tip\":\"Aquí sí importa cómo lo escribes: si oíste «Í-tol» y escribes «It will», estás transcribiendo lo que crees que se dijo, no lo que sonó.\"},{\"id\":\"ena2m11l5e8\",\"type\":\"match\",\"prompt\":\"Empareja cada escritura con su sonido\",\"pairs\":[{\"target\":\"I'll\",\"source\":\"áil\"},{\"target\":\"it'll be\",\"source\":\"Í-tol bi\"},{\"target\":\"won't\",\"source\":\"UÓUNT\"},{\"target\":\"probably\",\"source\":\"PRO-bli\"}],\"itemIds\":[\"ena2m11llsound\",\"ena2m11itllbe\",\"ena2m11wontwant\",\"ena2m11probablysound\"]},{\"id\":\"ena2m11l5e9\",\"type\":\"cloze\",\"prompt\":\"La excepción: la respuesta corta no se contrae\",\"text\":\"“Will it be cold?” — “Yes, it ___.”\",\"answers\":[\"will\"],\"translation\":\"«¿Hará frío?» «Sí.»\",\"hints\":[\"En la respuesta corta la palabra final va entera\",\"Yes, it w…\"],\"itemIds\":[\"ena2m11yesitwill\"],\"tip\":\"Es la misma regla de «Yes, I am» del A1: nunca «Yes, I'm». Lo último de una respuesta corta lleva el peso, y lo que lleva el peso no se contrae.\"},{\"id\":\"ena2m11l5e10\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de sonido\",\"pairs\":[{\"target\":\"I'll\",\"source\":\"áil\"},{\"target\":\"we'll\",\"source\":\"uíil\"},{\"target\":\"won't\",\"source\":\"UÓUNT\"},{\"target\":\"want\",\"source\":\"UÓNT\"},{\"target\":\"it'll\",\"source\":\"Í-tol\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m11llsound\",\"ena2m11wontwant\",\"ena2m11itllbe\"],\"tip\":\"El cronómetro solo premia. Lo que te frene aquí es lo que te va a frenar en el Listening.\"},{\"id\":\"ena2m11l5e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres cosas de hoy juntas\",\"text\":\"I'll be there at six. It'll probably rain, but I won't be long.\",\"phonetic\":\"áil bi DÉA at SIKS. Í-tol PRO-bli RÉIN, bat ái UÓUNT bi LONG\",\"translation\":\"Estaré allí a las seis. Seguramente llueva, pero no tardaré.\",\"itemIds\":[\"ena2m11llsound\",\"ena2m11itllbe\",\"ena2m11probablysound\",\"ena2m11wewontbelong\"],\"tip\":\"Tres contracciones y una vocal larga en once palabras. Si esta frase te sale limpia, la clínica está aprobada.\"},{\"id\":\"ena2m11l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción — escríbelo como suena de verdad\",\"question\":\"Seguramente haga frío, pero no lloverá.\",\"answers\":[\"It'll probably be cold, but it won't rain.\",\"It will probably be cold, but it won't rain.\"],\"hints\":[\"El adjetivo pide be · la negativa es una sola palabra\",\"It'll p… be cold, but it w… rain.\"],\"itemIds\":[\"ena2m11itllbe\",\"ena2m11itwontrain\",\"ena2m11probablysound\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-5\",\"book\":\"We will not be long.\",\"real\":\"We won't be a minute.\",\"meaning\":\"No tardamos nada\",\"when\":\"Con amigos y en cualquier tienda o casa ajena, cuando te vas un momento y quieres tranquilizar al otro. Literalmente dice «no seremos un minuto», que es al revés de lo que significa, y aun así es de lo más corriente. En el examen, «We won't be long».\",\"register\":\"neutral\",\"note\":\"Hay un gemelo aún más raro: «I won't be a sec». Se oye, se entiende y no se escribe nunca.\",\"sound\":\"ui uóunt bi a MI-nit\",\"level\":\"a2\",\"itemId\":\"ena2m11wewontbelong\"}}],\"resources\":[{\"label\":\"BBC Learning English — contractions\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/pronunciation\",\"note\":\"Busca cualquier vídeo de «contractions» y pon el subtítulo. Lo interesante no es lo que dicen: es ver escrito «will» y oír solo una l.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"child
