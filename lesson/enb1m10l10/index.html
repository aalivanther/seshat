\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Ta62,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. Ya llevas nueve: Listening 1, 2 y 3, Reading 1, 2, 3 y 4, Writing Part 1 y el Speaking de apertura. Hoy toca el \u003cb\u003eWriting Part 2\u003c/b\u003e, y con él se cierra la parte escrita entera.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl formato, exacto:\u003c/b\u003e una \u003cb\u003ecarta informal a un amigo\u003c/b\u003e sobre un tema personal, de \u003cb\u003e100 a 120 palabras\u003c/b\u003e, con \u003cb\u003eDOS funciones que cumplir\u003c/b\u003e — por ejemplo, invitarle a que venga \u003ci\u003ey\u003c/i\u003e describirle qué haréis. \u003cb\u003e12 marks\u003c/b\u003e, los mismos que el Part 1.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla que tumba a más gente que ninguna otra:\u003c/b\u003e «\u003ci\u003eNo credit for off-topic responses\u003c/i\u003e». Si contestas a una sola de las dos funciones, o si te vas por las ramas y escribes una carta preciosa sobre otra cosa, el criterio de \u003cb\u003eTask fulfilment\u003c/b\u003e se cae entero — y con él, un cuarto de la nota — \u003cb\u003eantes de que nadie mire tu gramática\u003c/b\u003e. Por eso lo primero que se hace, siempre, es \u003cb\u003econtar las funciones con el dedo\u003c/b\u003e sobre la consigna, y volver a contarlas al terminar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos cuatro criterios\u003c/b\u003e, que son los mismos que ya conoces: Task fulfilment · Grammar · Vocabulary · Organisation.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl registro, que aquí sí se juega.\u003c/b\u003e Es una carta a un amigo, y meter fórmulas de carta formal baja el criterio de vocabulario. Fuera, por tanto: \u003ci\u003eDear Sir or Madam\u003c/i\u003e, \u003ci\u003eYours faithfully\u003c/i\u003e, \u003ci\u003eI am writing to inform you\u003c/i\u003e, \u003ci\u003eI would be grateful if you could\u003c/i\u003e. Dentro: \u003cb\u003eHi / Hiya + nombre\u003c/b\u003e, \u003cb\u003eIt was lovely to hear from you\u003c/b\u003e, \u003cb\u003eAnyway\u003c/b\u003e, \u003cb\u003eWrite back soon\u003c/b\u003e, \u003cb\u003eLet me know what you think\u003c/b\u003e, y la firma a secas o con \u003ci\u003eLove,\u003c/i\u003e delante.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa plantilla de cinco líneas\u003c/b\u003e, que cabe en un examen y en la vida:\u003cbr/\u003e1. Saludo + una línea que conecte con lo que te ha escrito («It was lovely to hear from you»).\u003cbr/\u003e2. \u003cb\u003eFunción 1\u003c/b\u003e, en dos o tres frases.\u003cbr/\u003e3. \u003cb\u003eFunción 2\u003c/b\u003e, en dos o tres frases, con un conector delante.\u003cbr/\u003e4. Una línea de cierre que pida respuesta («Let me know what you think»).\u003cbr/\u003e5. Despedida informal + tu nombre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí es donde este módulo entero cobra sentido:\u003c/b\u003e los temas publicados del Part 2 son \u003cb\u003enarrativos o descriptivos\u003c/b\u003e —cuéntame qué pasó, háblame de alguien, describe tu día favorito—. O sea: lo que has estado haciendo durante nueve lecciones. El past perfect, el \u003ci\u003eused to\u003c/i\u003e, los tres tiempos y las descripciones en un solo sintagma \u003cb\u003eno son adorno\u003c/b\u003e: son literalmente lo que se puntúa en esta tarea.\u003cbr/\u003e\u003cbr/\u003eY cuenta las palabras. Ciento veinte son unas doce líneas de las tuyas: mídelo hoy, en tu letra, para no tener que contarlas el día del examen."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l10\",\"phaseId\":\"enb1m10\",\"title\":\"Exam lab: Writing Part 2\",\"subtitle\":\"Cien palabras, dos funciones y un registro que no se puede fingir\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario del laboratorio\",\"itemIds\":[\"enb1m10natmissyouloads\",\"enb1m10offtopic\",\"enb1m10itwaslovelyto\",\"enb1m10letmeknow\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 2, y por qué se suspende escribiendo bien\",\"body\":\"$17\",\"table\":[[\"En una carta informal\",\"En una carta formal\"],[\"Hi Emma,\",\"Dear Sir or Madam,\"],[\"It was lovely to hear from you.\",\"I am writing with regard to your letter.\"],[\"Let me know what you think.\",\"I look forward to hearing from you.\"],[\"Love, Valeria\",\"Yours faithfully, Valeria Soto\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de escribir nada\",\"question\":\"En el Writing Part 2, ¿qué es lo PRIMERO que se hace?\",\"options\":[\"Contar con el dedo cuántas cosas pide la consigna\",\"Escribir el saludo y la primera frase para arrancar\",\"Pensar el vocabulario difícil que vas a meter\"],\"answer\":0,\"whyWrong\":[null,\"Arrancar es fácil; el problema es llegar al final sin haber contestado a una de las dos cosas, y eso no se arregla luego.\",\"El vocabulario es UN criterio de cuatro. La tarea es otro, y sin ella los otros tres valen mucho menos.\"],\"itemIds\":[\"enb1m10offtopic\"],\"tip\":\"Las dos funciones casi nunca están numeradas: van dentro de la frase de la consigna, muchas veces separadas por un simple «and». Subráyalas antes de escribir la primera palabra.\"},{\"id\":\"enb1m10l10e2\",\"type\":\"mc\",\"prompt\":\"La regla dura del baremo\",\"question\":\"Escribes una carta impecable, pero solo contestas a una de las dos cosas que te piden. ¿Qué pasa?\",\"options\":[\"Se cae el criterio de Task fulfilment entero, por buena que sea la gramática\",\"Se baja un poco la nota, pero se compensa con la gramática\",\"No pasa nada mientras llegues a las 100 palabras\"],\"answer\":0,\"whyWrong\":[null,\"Los cuatro criterios se puntúan por separado: la gramática no rescata a la tarea. Y son 12 marks de los que la tarea es una cuarta parte.\",\"Las palabras son un requisito, no la tarea. Se pueden escribir 120 palabras perfectamente fuera de tema.\"],\"itemIds\":[\"enb1m10offtopic\"],\"tip\":\"«No credit for off-topic responses» está escrito con esas palabras en el manual oficial. Es la única frase del baremo que conviene memorizar en inglés.\"},{\"id\":\"enb1m10l10e3\",\"type\":\"bucket\",\"prompt\":\"¿Esta frase es de carta informal o de carta formal?\",\"categories\":[\"Carta informal (a un amigo)\",\"Carta formal (a una institución)\"],\"items\":[{\"text\":\"Hi Emma,\",\"bucket\":0},{\"text\":\"Dear Sir or Madam,\",\"bucket\":1},{\"text\":\"It was lovely to hear from you.\",\"bucket\":0},{\"text\":\"I am writing with regard to your letter.\",\"bucket\":1},{\"text\":\"Let me know what you think.\",\"bucket\":0},{\"text\":\"I look forward to hearing from you.\",\"bucket\":1}],\"itemIds\":[\"enb1m10itwaslovelyto\",\"enb1m10letmeknow\"],\"tip\":\"Fíjate en las dos últimas: dicen lo mismo —contéstame— y no se pueden intercambiar. Meter la de la derecha en una carta a una amiga es el error de registro más común del Part 2.\"},{\"id\":\"enb1m10l10e4\",\"type\":\"order\",\"prompt\":\"Ordena la carta informal según la plantilla de cinco líneas\",\"sentences\":[\"Hi Emma, it was lovely to hear from you and sorry for the silence.\",\"So: the thing with Clara. She had told my mother about the London job before I did, and I found out on the phone.\",\"Anyway, we made up in April and we get on better now than we did before.\",\"And yes to June — come down on the Friday and you can have the sofa.\",\"Let me know what you think. I miss you loads.\"],\"translation\":\"Hola Emma, me ha encantado saber de ti y perdona por el silencio. A ver: lo de Clara. Le había contado a mi madre lo del trabajo de Londres antes que yo, y me enteré por teléfono. En fin, hicimos las paces en abril y ahora nos llevamos mejor que antes. Y sí a junio: bájate el viernes y te quedas en el sofá. Dime qué te parece. Te echo muchísimo de menos.\",\"itemIds\":[\"enb1m10itwaslovelyto\",\"enb1m10letmeknow\",\"enb1m10natmissyouloads\",\"enb1m3anyway\"],\"tip\":\"Cuenta las funciones de esta carta: contar lo de Clara (frases 2 y 3) y contestar a lo de junio (frase 4). Dos, ni una más. Lo demás es envoltorio, y el envoltorio también puntúa, pero en otro criterio.\"},{\"id\":\"enb1m10l10e5\",\"type\":\"errorfix\",\"prompt\":\"Esta carta va dirigida a una amiga. Arregla la despedida.\",\"wrong\":\"It was lovely to hear from you. Yours faithfully, Valeria.\",\"answers\":[\"It was lovely to hear from you. Love, Valeria.\"],\"why\":\"«Yours faithfully» es de carta formal a alguien sin nombre. En una carta a una amiga baja el criterio de vocabulario por registro: ahí va «Love,», «Take care,» o el nombre a secas.\",\"translation\":\"Me ha encantado saber de ti. Un beso, Valeria.\",\"itemIds\":[\"enb1m10itwaslovelyto\"]},{\"id\":\"enb1m10l10e6\",\"type\":\"cloze\",\"prompt\":\"Completa la primera línea de media carta informal británica\",\"text\":\"It was ___ to hear from you — sorry it's taken me a month to answer.\",\"answers\":[\"lovely\",\"great\",\"good\",\"nice\"],\"translation\":\"Me ha encantado saber de ti; perdona que haya tardado un mes en contestar.\",\"hints\":[\"Seis letras y es la más británica de todas\",\"Empieza por «l»\"],\"itemIds\":[\"enb1m10itwaslovelyto\"],\"tip\":\"«Lovely» es la palabra comodín del inglés británico amable: lovely to hear from you, lovely weather, a lovely evening. En una carta informal, gana a «nice» y a «good» sin discusión.\"},{\"id\":\"enb1m10l10e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo con los conectores que ya traes\",\"text\":\"We didn't speak for two months. She was in Bogotá, I was here, and neither of us picked up the phone. ___ , she rang me in April and we made up in four minutes. It wasn't her fault, ___ . It was mine, and ___ we both know that now.\",\"answers\":[\"Anyway\",\"actually\",\"at least\"],\"bank\":[\"Anyway\",\"actually\",\"at least\",\"otherwise\",\"therefore\",\"in spite of\"],\"translation\":\"Estuvimos dos meses sin hablarnos. Ella en Bogotá, yo aquí, y ninguna de las dos cogía el teléfono. En fin, me llamó en abril e hicimos las paces en cuatro minutos. En realidad no fue culpa suya. Fue mía, y al menos ahora lo sabemos las dos.\",\"itemIds\":[\"enb1m3anyway\",\"enb1m3actually\",\"enb1m2atleast\",\"enb1m10makeup\"],\"tip\":\"Los tres son del módulo 3 y los tres hacen cosas distintas: «anyway» vuelve al hilo después de un rodeo, «actually» corrige lo que se acaba de decir, y «at least» rescata lo bueno de algo malo. Tres conectores bien colocados sostienen el criterio de Organisation entero.\"},{\"id\":\"enb1m10l10e8\",\"type\":\"paraphrase\",\"prompt\":\"Baja esta frase de registro: va a una amiga. Sin usar las palabras prohibidas.\",\"source\":\"I would be grateful if you could reply as soon as possible.\",\"forbid\":[\"grateful\",\"reply\",\"possible\"],\"answers\":[\"Let me know what you think\",\"Write back soon\",\"Let me know as soon as you can\"],\"translation\":\"Dime qué te parece.\",\"itemIds\":[\"enb1m10letmeknow\"],\"tip\":\"Las dos frases piden exactamente lo mismo. La diferencia no es de significado, es de a quién se la escribes — y en el Part 2 eso vale puntos.\"},{\"id\":\"enb1m10l10e9\",\"type\":\"write\",\"prompt\":\"Writing Part 2, en formato examen: carta informal a una amiga, 100-120 palabras, DOS funciones. Cuéntalas con el dedo antes de empezar.\",\"scenario\":\"Emma, tu amiga de Mánchester, te escribe. Contéstale cumpliendo LAS DOS funciones que te pide, ni una más ni una menos. Si te dejas una fuera, el criterio de Task fulfilment se cae entero por buena que sea tu gramática.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Valeria! Right. You've been promising me this story since February and I still don't know what actually happened with your sister. Tell me properly this time. And are you around at the end of June? I've got a long weekend owing and I've never seen London when it isn't raining.\"},\"bullets\":[\"Cuéntale qué pasó de verdad con tu hermana, y lo que ya había pasado antes.\",\"Contéstale a lo del fin de semana de junio y propón un plan concreto.\"],\"checks\":[{\"re\":\"(sister|clara|had told|had asked|fell out|argument|my fault)\",\"label\":\"Cuentas qué pasó, con lo que ya había pasado antes\"},{\"re\":\"(june|weekend|come down|why don'?t|we could|you can have|stay)\",\"label\":\"Contestas a lo del fin de semana y propones un plan\"}],\"frame\":[\"Saludo informal + una línea que conecte: «Hi Emma, it was lovely to hear from you…»\",\"Función 1 — el hecho, en pasado simple\",\"Lo que ya estaba antes, con «had»: «She had told my mother before I did…»\",\"Un conector para volver al hilo: «Anyway,…» + cómo acabó\",\"Función 2 — la visita, con un plan concreto y una fecha\",\"Cierre que pida respuesta + despedida informal y tu nombre\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"anyway\",\"actually\",\"at least\",\"in the end\",\"after that\",\"luckily\",\"unfortunately\",\"besides\",\"although\",\"though\",\"apart from\",\"on the other hand\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nIt was lovely to hear from you, and yes, I owe you the story.\\nClara had told my mother about the London job before I did, and I found out on a Tuesday, in the middle of a shift. We didn't speak for two months. Anyway, she rang me in April and we made up in about four minutes, which is annoying after two months of not sleeping. Actually, it was my fault as much as hers, and at least we both know that now.\\nAnd yes to June! Come down on the Friday, you can have the sofa, and we'll go to the park if the weather behaves.\\nI miss you loads.\\nValeria\",\"itemIds\":[\"enb1m10itwaslovelyto\",\"enb1m10hadalreadyleft\",\"enb1m10makeup\",\"enb1m10itwasmyfault\",\"enb1m10natmissyouloads\",\"enb1m3anyway\"],\"tip\":\"Cuenta las palabras antes de comprobar: 100-120. Y cuenta las funciones del modelo: dos, y las dos cerradas. Fíjate además en que solo hay UN past perfect en toda la carta («had told») y basta: el past perfect es una señal de orden, no una decoración que se reparte por el texto.\"},{\"id\":\"enb1m10l10e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Me ha encantado saber de ti. Dime qué te parece.\",\"answers\":[\"It was lovely to hear from you. Let me know what you think\",\"It was lovely to hear from you. Let me know what you think.\",\"It was great to hear from you. Let me know what you think\"],\"hint\":\"Las dos son fórmulas fijas de carta informal: la de apertura y la de cierre\",\"itemIds\":[\"enb1m10itwaslovelyto\",\"enb1m10letmeknow\"],\"tip\":\"Con estas dos frases ya tienes la primera y la penúltima línea de cualquier carta del Part 2. Lo de en medio cambia; el marco, no.\"},{\"id\":\"enb1m10l10e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"No credit for off-topic responses.\",\"answers\":[\"Lo que se sale del tema no puntúa\",\"Las respuestas fuera de tema no reciben puntuación\",\"No se dan puntos por lo que está fuera de tema\"],\"itemIds\":[\"enb1m10offtopic\"],\"tip\":\"Es la frase del manual oficial, y es la razón de que la estrategia empiece contando funciones. Un texto brillante sobre otra cosa vale cero en el criterio que más pesa.\"},{\"id\":\"enb1m10l10e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"It was lovely to hear from you.\",\"translation\":\"Me ha encantado saber de ti.\",\"hints\":[\"Empieza por «It was…»\",\"It was lovely to ... from you\"],\"itemIds\":[\"enb1m10itwaslovelyto\"],\"tip\":\"«Lovely» tiene dos sílabas, LÁV-li, y la o se pronuncia como una a. Es una de esas palabras que se leen mil veces antes de oírlas una, y entonces sorprenden.\"},{\"id\":\"enb1m10l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio y del módulo\",\"question\":\"Cuando llegué, ya se había ido.\",\"answers\":[\"When I got there, she had already left\",\"When I got there, she had already left.\",\"When I got there, she'd already left\",\"When I arrived, she had already left\"],\"hints\":[\"La frase con la que abriste el módulo\",\"When I got there, she ... left\"],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10theorderofevents\"],\"tip\":\"Diez laboratorios hechos: el Reading entero, el Listening menos la discusión larga, las dos tareas de Writing y la apertura del oral. Para el módulo 11 quedan el Listening Part 4 y el Spoken Part 3; el Spoken Part 4 cae ya en el módulo 12, pegado al simulacro. Y esta frase, la primera del módulo, es la que ahora escribes sin pensarla: el past perfect no es un tiempo más, es la palabra que pone las cosas en su sitio.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m10-4\",\"book\":\"I miss you.\",\"real\":\"I miss you loads.\",\"meaning\":\"Te echo muchísimo de menos\",\"when\":\"Por escrito y hablando, con gente de confianza: familia, amigos de verdad, pareja. Es la despedida de una carta informal, no de un correo de trabajo. En el examen, la versión con «very much».\",\"register\":\"amigos\",\"exam\":\"I miss you very much.\",\"note\":\"«Loads» es «un montón», y de tanto usarse ha perdido lo exagerado: hoy es el intensificador normal entre amigos, por delante de «a lot». «Very much» es correcto y suena a carta de otra época.\",\"sound\":\"ai mis yu lóuds̬\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m10natmissyouloads\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Writing)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo el Writing Part 2, con reloj: veinticinco minutos de los ciento treinta. Antes de escribir, subraya las dos funciones de la consigna. Y al terminar, cuenta las palabras a mano: quieres saber hoy cuántas líneas de tu letra son 120 palabras.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A
