 coma: \u003ci\u003eThe email is too long nobody finishes it.\u003c/i\u003e Las dos bajan Organisation, y Organisation es un criterio de cuatro.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. El punto enterrado.\u003c/b\u003e El párrafo español llega al grano en la tercera línea, después de calentar. El inglés lo quiere en la primera. No es grosería: es el contrato de lectura. Si tu petición está en la línea tres, para el lector nativo \u003cb\u003eno está\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. últimamente ≠ ultimately.\u003c/b\u003e Son los falsos amigos cultos del B2: no salen en la conversación, salen en cuanto escribes formal. \u003ci\u003eI've been tired [[lately|últimamente]].\u003c/i\u003e \u003ci\u003e[[Ultimately|en última instancia]], the paragraph has to stand alone.\u003c/i\u003e Quien escribe «I've been tired ultimately» no tiene un error de vocabulario menor: tiene un error que el examinador lee como «no controlas el registro culto», y eso baja la banda.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ethat is to say\u003c/b\u003e y \u003cb\u003ein terms of\u003c/b\u003e son los marcadores de definir y de acotar. El B2 los pide porque un argumento que no define su terreno suena a lista."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l5\",\"phaseId\":\"enb2m1\",\"title\":\"The Spanish paragraph\",\"subtitle\":\"Clínica: el comma splice, últimamente y el punto enterrado\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las trampas que solo salen al escribir formal\",\"itemIds\":[\"enb2m1lately\",\"enb2m1ultimately\",\"enb2m1intermsof\",\"enb2m1thatistosay\",\"enb2m1topicburied\",\"enb2m1runon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres trampas, y ninguna es de gramática de libro\",\"body\":\"$17\",\"table\":[[\"Español\",\"Lo que escribes\",\"Lo que querías\"],[\"Últimamente duermo mal\",\"I've been sleeping badly ultimately\",\"lately\"],[\"En última instancia\",\"Lately, the decision is yours\",\"ultimately\"],[\"Llegué tarde, no había nadie\",\"I arrived late, there was nobody\",\"punto / so / and\"],[\"Lo que pasa es que… (en la línea 3)\",\"After looking at it carefully, the problem is…\",\"The problem is… (línea 1)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l5e1\",\"type\":\"bucket\",\"prompt\":\"¿lately o ultimately?\",\"categories\":[\"lately — últimamente, en el tiempo reciente\",\"ultimately — en última instancia\"],\"items\":[{\"text\":\"I've been sleeping badly lately.\",\"bucket\":0},{\"text\":\"Ultimately, the paragraph has to stand alone.\",\"bucket\":1},{\"text\":\"She has felt tired lately.\",\"bucket\":0},{\"text\":\"Ultimately, the decision is Mrs Beckett's.\",\"bucket\":1},{\"text\":\"The rota has changed a lot lately.\",\"bucket\":0},{\"text\":\"Ultimately, one idea per paragraph is the rule.\",\"bucket\":1}],\"itemIds\":[\"enb2m1lately\",\"enb2m1ultimately\"],\"tip\":\"Prueba: si puedes cambiarlo por «recently», es lately. Si puedes cambiarlo por «in the end / when it comes down to it», es ultimately.\"},{\"id\":\"enb2m1l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I've been sleeping badly ultimately.\",\"answers\":[\"I've been sleeping badly lately.\"],\"why\":\"«Ultimately» es «en última instancia», no «últimamente». El adverbio de tiempo reciente es lately. Es el falso amigo culto número uno del módulo, y solo sale al escribir formal.\",\"translation\":\"Últimamente duermo mal.\",\"itemIds\":[\"enb2m1lately\",\"enb2m1ultimately\"]},{\"id\":\"enb2m1l5e3\",\"type\":\"errorfix\",\"prompt\":\"Un run-on: ni coma ni punto\",\"wrong\":\"The email is too long nobody finishes it.\",\"answers\":[\"The email is too long. Nobody finishes it.\",\"The email is too long, so nobody finishes it.\",\"The email is too long; nobody finishes it.\"],\"why\":\"Dos oraciones pegadas, sin ni siquiera la coma. Es un run-on, el hermano peor del comma splice. El arreglo mínimo es un punto.\",\"translation\":\"El correo es demasiado largo. No lo termina nadie.\",\"itemIds\":[\"enb2m1runon\",\"enb2m1commasplice\"]},{\"id\":\"enb2m1l5e4\",\"type\":\"transform\",\"prompt\":\"Saca el punto de debajo\",\"source\":\"After looking at the rota carefully and speaking to two neighbours, the problem is the Thursday collection.\",\"instruction\":\"Empieza por The problem is… y deja el resto detrás, si hace falta\",\"answers\":[\"The problem is the Thursday collection\",\"The problem is the Thursday collection.\",\"The problem is that the Thursday collection is not clear\",\"The problem is that the Thursday collection is not clear.\"],\"translation\":\"El problema es la recogida del jueves.\",\"itemIds\":[\"enb2m1topicburied\",\"enb2m1theproblemis\"],\"tip\":\"«After looking…» es el calentamiento español. En inglés esa circunstancia, si hace falta, va en el párrafo 2 como detalle. No delante del punto.\"},{\"id\":\"enb2m1l5e5\",\"type\":\"mc\",\"prompt\":\"Definir sin dar rodeos\",\"question\":\"«The paragraph is too long, that is to say it mixes two ideas.» ¿Qué hace «that is to say»?\",\"options\":[\"Define lo que acaba de llamar «too long».\",\"Añade una segunda queja, distinta.\",\"Cierra el texto, como in conclusion.\"],\"answer\":0,\"whyWrong\":[null,\"No es una queja nueva: es la misma, nombrada con precisión.\",\"El cierre va al final del texto, no en mitad de un párrafo.\"],\"itemIds\":[\"enb2m1thatistosay\"]},{\"id\":\"enb2m1l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa la clínica de Amy\",\"text\":\"___ structure, the email is weak: the point is ___ in the third line. The paragraph is too long, ___ it mixes two ideas. ___ , one idea per paragraph is the rule.\",\"answers\":[\"In terms of\",\"buried\",\"that is to say\",\"Ultimately\"],\"bank\":[\"In terms of\",\"buried\",\"that is to say\",\"Ultimately\",\"Lately\",\"namely\",\"because\"],\"translation\":\"En cuanto a la estructura, el correo es flojo: el punto está enterrado en la tercera línea. El párrafo es demasiado largo, es decir, mezcla dos ideas. En última instancia, la regla es una idea por párrafo.\",\"itemIds\":[\"enb2m1intermsof\",\"enb2m1topicburied\",\"enb2m1thatistosay\",\"enb2m1ultimately\"],\"tip\":\"«Lately» está en el banco para que no lo cojas: aquí no hay tiempo reciente, hay un juicio final. Ahí se cobra el falso amigo.\"},{\"id\":\"enb2m1l5e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin «that is to say»\",\"source\":\"The paragraph is too long, that is to say it mixes two ideas.\",\"forbid\":[\"that is to say\",\"that is\"],\"answers\":[\"The paragraph is too long because it mixes two ideas\",\"The paragraph is too long: it mixes two ideas\",\"The paragraph mixes two ideas, so it is too long\",\"The paragraph is too long, namely it mixes two ideas\"],\"translation\":\"El párrafo es demasiado largo, es decir, mezcla dos ideas.\",\"itemIds\":[\"enb2m1thatistosay\",\"enb2m1namely\"]},{\"id\":\"enb2m1l5e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — el adverbio correcto\",\"source\":\"Últimamente duermo mal.\",\"answers\":[\"I've been sleeping badly lately.\",\"I have been sleeping badly lately.\",\"I've been sleeping badly recently.\"],\"hint\":\"lately / recently, nunca ultimately\",\"itemIds\":[\"enb2m1lately\"]},{\"id\":\"enb2m1l5e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Ahora el otro\",\"source\":\"En última instancia, el párrafo tiene que sostenerse solo.\",\"answers\":[\"Ultimately, the paragraph has to stand alone.\",\"Ultimately the paragraph has to stand alone.\"],\"hint\":\"Ultimately, no lately\",\"itemIds\":[\"enb2m1ultimately\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l5e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En cuanto a la estructura, el correo es flojo.\",\"answers\":[\"In terms of structure, the email is weak.\",\"In terms of the structure, the email is weak.\"],\"itemIds\":[\"enb2m1intermsof\"]},{\"id\":\"enb2m1l5e11\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? El mismo cierre, dos alturas\",\"book\":\"In conclusion, the first draft did not work.\",\"real\":\"So yeah, basically.\",\"translation\":\"En conclusión, el primer borrador no funcionó.\",\"itemIds\":[\"enb2m1inconclusion\",\"enb2m1natinconclusion\"]},{\"id\":\"enb2m1l5e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy nombra el error. Pregunta antes del play. Dos escuchas.\",\"audio\":\"See this bit? «I arrived late, there was nobody.» That's a comma splice. Two sentences, one comma, no glue. Put a full stop, or put so. And this — «I've been tired ultimately» — you mean lately. Ultimately is when you get to the real point, not when you talk about last week.\",\"question\":\"¿Qué dos errores señala Amy?\",\"options\":[\"Un comma splice y el falso amigo ultimately / lately\",\"Un present perfect mal usado y una relativa sin coma\",\"Un registro demasiado informal y un phrasal verb\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De tiempos verbales y relativas no habla.\",\"El registro no sale. Sale puntuación y un falso amigo culto.\"],\"itemIds\":[\"enb2m1commasplice\",\"enb2m1lately\",\"enb2m1ultimately\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m1-2\",\"book\":\"However\",\"real\":\"But then again.\",\"meaning\":\"Sin embargo / Aunque, por otra parte…\",\"when\":\"Contraste de charla, cuando le das la vuelta a lo que acabas de conceder. Con amigos. En el Writing, Nevertheless o That said. However —que es A2— sigue valiendo por escrito; But then again, no.\",\"register\":\"amigos\",\"exam\":\"Nevertheless, the first draft was worth rewriting.\",\"note\":\"«Then again» y «but then again» son la misma pieza. El however del libro ya lo tenías; lo nuevo es no usarlo en voz alta como si hablaras con un tribunal.\",\"sound\":\"bat den a-GHÉN\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m1natbutthenagain\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta
