/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T489,\u003cb\u003eLa regla en una línea\u003c/b\u003e: delante de un sustantivo, cualquier adjetivo —y un participio delante de un sustantivo ES un adjetivo— lleva terminación. Si hay artículo definido (der/die/das), la terminación es \u003cb\u003e-e\u003c/b\u003e en singular nominativo, y \u003cb\u003e-en\u003c/b\u003e en casi todo lo demás.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa trampa del español\u003c/b\u003e: en español el adjetivo no sabe nada del caso. Dices «la calle adornada» en cualquier posición de la frase. En alemán, la MISMA calle cambia de terminación según dónde esté:\u003cbr/\u003eDie geschmückt\u003cb\u003ee\u003c/b\u003e Straße ist voll. (sujeto)\u003cbr/\u003eWir gehen durch die geschmückt\u003cb\u003een\u003c/b\u003e Straßen. (acusativo plural)\u003cbr/\u003eWegen der geschmückt\u003cb\u003een\u003c/b\u003e Straßen kommen viele. (genitivo plural)\u003cbr/\u003e\u003cbr/\u003ePor eso en este bloque primero \u003cb\u003einterpretas\u003c/b\u003e (la terminación es el ÚNICO indicio: no hay adverbio ni contexto que te salve) y solo después \u003cb\u003eproduces\u003c/b\u003e. Y guárdate la salida segura para el examen: si en 80 palabras no te sale la terminación, pásalo a predicativo — \u003ci\u003eDie Straße ist geschmückt\u003c/i\u003e — que es correcto y no arriesga nada. Arriesga cuando te sobre atención: el criterio «Spektrum» premia la variedad."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m7l5\",\"phaseId\":\"b1m7\",\"title\":\"Clínica: adjetivos en frases largas\",\"subtitle\":\"Donde se pierden las bandas — producir la terminación en caliente\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuatro verbos con preposición fija para las frases largas\",\"itemIds\":[\"b1m7feteilnehmen\",\"b1m7fesichfreuenauf\",\"b1m7febestehenaus\",\"b1m7feerinnernan\",\"b1m7febedeutung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla mínima y la trampa\",\"body\":\"$17\",\"table\":[[\"\",\"singular\",\"plural\"],[\"Nominativ\",\"die geschmückte Straße\",\"die geschmückten Straßen\"],[\"Akkusativ\",\"durch die geschmückte Straße\",\"durch die geschmückten Straßen\"],[\"Dativ\",\"in der geschmückten Straße\",\"in den geschmückten Straßen\"],[\"Genitiv\",\"wegen der geschmückten Straße\",\"wegen der geschmückten Straßen\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l5e1\",\"type\":\"bucket\",\"prompt\":\"Solo el participio lo dice: ¿está pasando o ya pasó?\",\"categories\":[\"está pasando ahora\",\"ya está hecho / terminado\"],\"items\":[{\"text\":\"die kochende Suppe\",\"bucket\":0},{\"text\":\"die gekochte Suppe\",\"bucket\":1},{\"text\":\"die steigenden Preise\",\"bucket\":0},{\"text\":\"die gestiegenen Preise\",\"bucket\":1},{\"text\":\"die singende Frau\",\"bucket\":0},{\"text\":\"das gesungene Lied\",\"bucket\":1}],\"itemIds\":[\"b1m7festeigend\",\"b1m7fesingend\"],\"tip\":\"Quita el participio y la frase no dice nada: no hay «gerade», ni «schon», ni contexto. La forma es el único indicio — eso es Processing Instruction.\"},{\"id\":\"b1m7l5e2\",\"type\":\"mc\",\"prompt\":\"Interpreta, no traduzcas\",\"question\":\"„Auf dem Tisch stehen die gekochten Kartoffeln.“ — ¿Qué sabemos?\",\"options\":[\"Que ya están cocidas\",\"Que se están cociendo ahora\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «die kochenden Kartoffeln» — Partizip I\"],\"itemIds\":[\"b1m7fegebacken\"]},{\"id\":\"b1m7l5e3\",\"type\":\"mc\",\"prompt\":\"¿Ya pasó o está por venir?\",\"question\":\"„Wir freuen uns auf das kommende Fest.“\",\"options\":[\"La fiesta todavía no ha ocurrido\",\"La fiesta ya ocurrió\"],\"answer\":0,\"whyWrong\":[null,\"«kommend» es Partizip I: activo y no terminado. Si ya hubiera pasado sería «das vergangene Fest»\"],\"itemIds\":[\"b1m7fesichfreuenauf\",\"b1m7fekommend\"],\"tip\":\"sich freuen AUF + acusativo = ilusión por algo que viene. sich freuen ÜBER = alegría por algo que ya pasó.\"},{\"id\":\"b1m7l5e4\",\"type\":\"cloze\",\"prompt\":\"La preposición va pegada al verbo\",\"text\":\"Jedes Jahr nehme ich ___ dem Umzug teil.\",\"answers\":[\"an\"],\"translation\":\"Todos los años participo en el desfile.\",\"hints\":[\"teilnehmen + preposición fija + Dativ\",\"Dos letras\"],\"itemIds\":[\"b1m7feteilnehmen\",\"b1m7feumzug\"],\"tip\":\"teilnehmen an + Dativ. Se aprende en bloque, como una sola palabra: «teilnehmen-an-dem».\"},{\"id\":\"b1m7l5e5\",\"type\":\"cloze\",\"prompt\":\"Otra preposición fija\",\"text\":\"Ich freue mich schon ___ das kommende Fest.\",\"answers\":[\"auf\"],\"translation\":\"Ya me hace ilusión la fiesta que viene.\",\"hints\":[\"sich freuen + preposición + Akkusativ (por eso «das», no «dem»)\",\"a-u-f\"],\"itemIds\":[\"b1m7fesichfreuenauf\",\"b1m7fedaskommendefest\"]},{\"id\":\"b1m7l5e6\",\"type\":\"gapbank\",\"prompt\":\"Cuatro terminaciones dentro de una frase larga\",\"text\":\"Wegen der ___ Straßen kommt der Bus nicht. Die ___ Kinder warten trotzdem. Sie freuen sich auf das ___ Fest und auf die ___ Menge.\",\"answers\":[\"geschmückten\",\"verkleideten\",\"kommende\",\"singende\"],\"bank\":[\"geschmückten\",\"verkleideten\",\"kommende\",\"singende\",\"geschmückte\",\"verkleidete\",\"kommenden\",\"singenden\"],\"translation\":\"Por las calles adornadas el autobús no llega. Los niños disfrazados esperan de todos modos. Les hace ilusión la fiesta que viene y la multitud que canta.\",\"itemIds\":[\"b1m7fegeschmueckt\",\"b1m7feverkleidet\",\"b1m7fekommend\",\"b1m7fesingend\"],\"tip\":\"Wegen + genitivo plural → -en. auf das ... Fest y auf die ... Menge: acusativo singular con artículo definido → -e. La preposición decide la terminación, no el oído.\"},{\"id\":\"b1m7l5e7\",\"type\":\"transform\",\"prompt\":\"Compacta la relativa (output estructurado)\",\"source\":\"die Preise, die jedes Jahr steigen\",\"instruction\":\"Dilo con Partizip I\",\"answers\":[\"die jedes Jahr steigenden Preise\",\"die steigenden Preise\"],\"translation\":\"los precios que suben cada año\",\"hints\":[\"steigen + d + terminación de plural\",\"Lo que estaba entre comas se mete DELANTE del sustantivo\"],\"itemIds\":[\"b1m7festeigend\"]},{\"id\":\"b1m7l5e8\",\"type\":\"transform\",\"prompt\":\"Y ahora deshaz el atajo\",\"source\":\"die gefeierte Tradition\",\"instruction\":\"Dilo con una relativa en pasiva\",\"answers\":[\"die Tradition, die gefeiert wird\",\"die Tradition, die gefeiert wurde\"],\"translation\":\"la tradición que se celebra\",\"hints\":[\"die Tradition, die ...\",\"gefeiert + wird, al final\"],\"itemIds\":[\"b1m7fegefeiert\",\"b1m7fetradition\"],\"tip\":\"Ir y volver entre las dos formas es la mejor red de seguridad: si en el examen te bloquea la terminación, sales por la relativa.\"},{\"id\":\"b1m7l5e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el caso\",\"wrong\":\"Ich freue mich auf dem kommenden Fest.\",\"answers\":[\"Ich freue mich auf das kommende Fest.\"],\"why\":\"sich freuen auf pide ACUSATIVO (algo que viene hacia ti): auf DAS kommendE Fest. Con dativo, «auf dem», la frase se convertiría en una localización física — encima de la fiesta.\",\"translation\":\"Me hace ilusión la fiesta que viene.\",\"itemIds\":[\"b1m7fesichfreuenauf\",\"b1m7fekommend\"]},{\"id\":\"b1m7l5e10\",\"type\":\"build\",\"prompt\":\"Construye la frase larga entera\",\"target\":\"Trotz des schlechten Wetters nehmen viele Menschen an dem Umzug teil\",\"altTargets\":[\"Viele Menschen nehmen trotz des schlechten Wetters an dem Umzug teil\"],\"translation\":\"A pesar del mal tiempo mucha gente participa en el desfile\",\"distractors\":[\"dem Wetter\",\"teilnehmen\"],\"itemIds\":[\"b1m7fetrotz\",\"b1m7feteilnehmen\",\"b1m7feumzug\"],\"tip\":\"Genitivo + adjetivo declinado + verbo separable con preposición fija. Esta única frase toca tres criterios de Strukturen.\"},{\"id\":\"b1m7l5e11\",\"type\":\"paraphrase\",\"prompt\":\"Cierre de producción — dilo de otra manera\",\"source\":\"Die Preise, die jedes Jahr steigen, ärgern viele Gäste.\",\"forbid\":[\"steigen\",\"jedes\"],\"answers\":[\"Die steigenden Preise ärgern viele Gäste.\",\"Die steigenden Preise ärgern viele Gäste\",\"Viele Gäste ärgern sich über die steigenden Preise.\",\"Viele Gäste ärgern sich über die steigenden Preise\",\"Die jährlich steigenden Preise ärgern viele Gäste\"],\"translation\":\"Los precios que suben cada año molestan a muchos invitados.\",\"hints\":[\"Mete la relativa DELANTE del sustantivo\",\"steigen + d + terminación de plural\"],\"itemIds\":[\"b1m7festeigend\"],\"tip\":\"Prohibirte la salida fácil es la única manera de forzar la difícil. Si «steigen» está vetado, solo te queda el participio.\"},{\"id\":\"b1m7l5e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3 · dos amigos hablan del carnaval. UNA sola escucha, y la tarea es la del examen: una afirmación EN ALEMÁN que marcas Richtig o Falsch. (Aquí van dos; en el examen son siete seguidas.)\",\"audio\":\"Sag mal, freust du dich eigentlich auf den Fasching? | Ehrlich? So mittel. Ich hab noch gar keine Verkleidung. | Du hattest doch das Kostüm von letztem Jahr, das rote. | Ja, und das erinnert mich an einen furchtbar langen Abend. Nee, das zieh ich nicht noch mal an. Ich geh als was Einfaches — weißes Hemd, fertig. | Also gar nicht verkleidet. | Doch, schon. Nur eben nicht auffällig.\",\"question\":\"Er geht ohne Verkleidung zum Fasching.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Contesta «Doch, schon. Nur eben nicht auffällig»: va disfrazado, solo que sin llamar la atención\",null],\"itemIds\":[\"b1m7feverkleidung\",\"b1m7fesichfreuenauf\"],\"tip\":\"«Doch» contesta que sí a una frase negativa. Si lo oyes y no lo procesas, te llevas la respuesta contraria: es el monosílabo que más ítems cuesta en el Teil 3, donde la afirmación falsa suele ser exactamente la que tú habrías deducido a medias.\"},{\"id\":\"b1m7l5e13\",\"type\":\"audiomc\",\"prompt\":\"Misma conversación, segunda afirmación. Una escucha.\",\"audio\":\"Sag mal, freust du dich eigentlich auf den Fasching? | Ehrlich? So mittel. Ich hab noch gar keine Verkleidung. | Du hattest doch das Kostüm von letztem Jahr, das rote. | Ja, und das erinnert mich an einen furchtbar langen Abend. Nee, das zieh ich nicht noch mal an. Ich geh als was Einfaches — weißes Hemd, fertig. | Also gar nicht verkleidet. | Doch, schon. Nur eben nicht auffällig.\",\"question\":\"Das rote Kostüm erinnert ihn an einen schönen Abend.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Dice «einen furchtbar langen Abend»: la noche fue cualquier cosa menos bonita\",null],\"itemIds\":[\"b1m7feerinnernan\",\"b1m7fekostuem\",\"b1m7feverkleidet\"],\"tip\":\"«das erinnert mich an einen … Abend»: erinnern an + Akkusativ, dicho a velocidad de calle. La rección que estás produciendo en la clínica es la misma que tienes que reconocer al vuelo.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}
