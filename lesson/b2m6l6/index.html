etapher. Die Belastung ist messbar: Überstunden, ausgefallene Pausen, Nachsorge, die liegen bleibt. Doktor Weber, Hausärztin im selben Kiez, sieht die Folge in der Sprechstunde. Patientinnen schieben die Vorsorgeuntersuchung auf, weil die Wartezeit bei Fachärzten bei drei Monaten liegt. «Es wäre denkbar, dass ein Teil der chronischen Verläufe sich vermeiden ließe, wenn die Prävention früher griffe», sagt sie. Man könnte einwenden, dass die Leute selbst schuld seien. Dagegen ließe sich sagen, dass niemand gern wartet — und dass Warten teurer wird als jede Zuzahlung.\n\nDie Krankenkasse übernimmt die Kosten einer Zweitmeinung, sofern der Eingriff geplant ist. Viele wissen das nicht. Anna hört den Satz «Ich hätt eher hingehen sollen» mehrmals in der Woche. Die Schweigepflicht verbietet ihr, Fälle zu erzählen. Die Berufsethik verbietet ihr, zu schweigen, wenn das System die Spätfolge produziert.\n\nEin Kasten aus Bern, den die Redaktion um Erlaubnis gebeten hat, zeigt, dass der Personalmangel kein deutsches Privileg ist. Im Inselspital* berichtet eine Pflegerin, die Prämie* der Krankenkasse steige, «während auf der Station dieselbe Arbeit von weniger Leuten gemacht wird». Die Strasse* vor dem Spital sei voller Taxis, weil Angehörige nachts selbst fahren, wenn der Rettungsdienst überlastet ist. Die Zahlen unterscheiden sich. Die Sätze nicht: Hätte man vor fünf Jahren ausgebildet, müsste man heute nicht um jede Stelle bitten.\n\nWas wäre zu überlegen? Doktor Weber würde eher dafür plädieren, die Sprechstunde nicht zu kürzen, sondern die Vorsorge verpflichtender zu machen — nicht als Strafe, als Angebot, das man in Anspruch nimmt, bevor der Rücken in die Notaufnahme führt. Die Aufklärung gehöre dazu: niemand könne ein Recht in Anspruch nehmen, von dem er nichts wisse. Anna ist zurückhaltender. «Es wäre zu überlegen, ob wir die Schichten anders schneiden. Ohne Personal lässt sich nichts schönreden.» Sie kennt die Patientenakte, in der drei verschobene Termine stehen, und sie kennt die Nacht, in der beinahe etwas schiefgegangen wäre. Sie tut nicht so, als wäre nichts. Sie tut so, als ließe sich noch etwas retten, sofern die nächste Stelle nicht wieder unbesetzt bleibt. Der Kiez braucht beides: eine Hausärztin, die den Satz «hätte kommen sollen» ohne Anklage sagt — und eine Station, die nicht von der Überlastung lebt.\n\n*Inselspital = Universitätsspital Bern · *Prämie = schweiz. für den Krankenkassenbeitrag · *Strasse ohne ß, wie in der Schweiz üblich · *Spital = schweiz./österr. für „Krankenhaus“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m6l6\",\"phaseId\":\"b2m6\",\"title\":\"Lesen: Pflegenotstand\",\"subtitle\":\"Un reportaje sobre la planta — y un helvetismo a pie de página\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Palabras de sistema sanitario que verás en el texto\",\"itemIds\":[\"b2m6notaufnahme\",\"b2m6wartezeit\",\"b2m6hausarzt\",\"b2m6personalmangel\",\"b2m6zuzahlung\",\"b2m6praevention\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un reportaje que no acusa y sí argumenta\",\"body\":\"El texto de hoy atribuye, hipotetiza y concede. Subraya cada \u003cb\u003ehätte / wäre / ließe sich\u003c/b\u003e: ahí no hay hecho, hay irreal. Las cifras sí son hecho. Separarlos es la pregunta de inferencia.\u003cbr/\u003e\u003cbr/\u003eEl reportaje cita también un hospital de \u003cb\u003eBerna\u003c/b\u003e. Los helvetismos van a pie, como en el examen: \u003ci\u003eSpital\u003c/i\u003e, \u003ci\u003ePrämie\u003c/i\u003e, y en Suiza no hay ß (\u003ci\u003eStrasse\u003c/i\u003e). Anna y Doktor Weber no se mudan: el plurizentrismo va por el texto.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m6l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje. Las preguntas van en alemán.\",\"title\":\"Wenn die Station ohne Reserve arbeitet\",\"source\":\"Gesundheit \u0026 Gesellschaft (Berlin), mit einem Kasten aus Bern\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m6l6e1q1\",\"q\":\"Warum hat Anna drei Nachtschichten hintereinander gemacht?\",\"options\":[\"Weil Kolleginnen fehlen und keine Nachfolge da ist.\",\"Weil sie das Extra-Geld braucht.\",\"Weil Doktor Weber es angeordnet hat.\"],\"answer\":0,\"why\":\"Dos enfermas y una que se ha ido, sin recambio. El dinero y la médica no aparecen como causa.\"},{\"id\":\"b2m6l6e1q2\",\"q\":\"Was übernimmt die Krankenkasse laut Text, sofern der Eingriff geplant ist?\",\"options\":[\"Die Kosten einer Zweitmeinung.\",\"Die Zuzahlung für jedes Medikament.\",\"Die Taxi-Fahrt nach Bern.\"],\"answer\":0,\"why\":\"Párrafo 3, con la condición sofern. El taxi es del recuadro suizo, otra cosa.\"},{\"id\":\"b2m6l6e1q3\",\"q\":\"Welche Haltung nimmt Doktor Weber zur Aussage «die Leute sind selbst schuld» ein?\",\"options\":[\"Sie nennt den Einwand und widerspricht ihm mit den Kosten des Wartens.\",\"Sie stimmt ihm uneingeschränkt zu.\",\"Sie geht nicht darauf ein.\"],\"answer\":0,\"inference\":true,\"why\":\"«Man könnte einwenden… Dagegen ließe sich sagen…» — trae la objeción y la refuta. Inferencia: no culpa al paciente.\"},{\"id\":\"b2m6l6e1q4\",\"q\":\"Wozu dient der Kasten aus Bern in diesem Text?\",\"options\":[\"Er zeigt, dass der Personalmangel kein nur deutsches Problem ist.\",\"Er wirbt für das Inselspital.\",\"Er erklärt, warum Anna nach Bern ziehen will.\"],\"answer\":0,\"inference\":true,\"why\":\"«kein deutsches Privileg» + los mismos sätze. No es publicidad ni un plan de Anna.\"},{\"id\":\"b2m6l6e1q5\",\"q\":\"Worin unterscheiden sich Anna und Doktor Weber am Ende?\",\"options\":[\"Weber will die Vorsorge stärken; Anna will zuerst die Schichten ändern.\",\"Anna will die Sprechstunde kürzen; Weber will sie streichen.\",\"Beide fordern dasselbe, nur in anderem Ton.\"],\"answer\":0,\"inference\":true,\"why\":\"plädieren für Vorsorge vs. Schichten anders schneiden. El tono es parecido; la propuesta no.\"}],\"itemIds\":[\"b2m6pflegenotstand\",\"b2m6personalmangel\",\"b2m6praevention\",\"b2m6notaufnahme\",\"b2m6nachtschicht\"],\"tip\":\"Cada hätte del texto marca un mundo que no ocurrió. Si lo lees como un Perfekt, las preguntas de inferencia se caen.\"},{\"id\":\"b2m6l6e2\",\"type\":\"mc\",\"prompt\":\"Helvetismo del recuadro\",\"question\":\"En Berna lees «die Prämie». ¿Qué es, según la nota?\",\"options\":[\"El equivalente suizo de la cuota de la Krankenkasse\",\"Una prima de seguro de vida\",\"El copago de la farmacia alemana\"],\"answer\":0,\"whyWrong\":[null,\"En este texto no es un seguro de vida\",\"Eso es die Zuzahlung, y es alemana\"],\"itemIds\":[\"b2m6krankenkasse\",\"b2m6zuzahlung\"]},{\"id\":\"b2m6l6e3\",\"type\":\"cloze\",\"prompt\":\"El irreal que sostiene el reportaje\",\"text\":\"Hätte die Station das Personal, ___ gestern niemand allein gewesen.\",\"answers\":[\"wäre\"],\"translation\":\"Si la planta tuviera el personal, ayer nadie habría estado solo.\",\"itemIds\":[\"b2m6personalmangel\",\"b2m6waeregegangen\"]},{\"id\":\"b2m6l6e4\",\"type\":\"paraphrase\",\"prompt\":\"Atribuye sin acusar\",\"source\":\"Die Leute sind selbst schuld.\",\"forbid\":[\"schuld\",\"Leute\"],\"answers\":[\"Man könnte einwenden, dass die Patientinnen zu lange warten.\",\"Man könnte einwenden, dass die Patientinnen zu lange warten\",\"Es wäre zu kurz, die Verantwortung nur den Patientinnen zu geben.\",\"Es wäre zu kurz, die Verantwortung nur den Patientinnen zu geben\"],\"translation\":\"La gente tiene la culpa.\",\"itemIds\":[\"b2m6mankoennteeinwenden\",\"b2m6dagegeneinwenden\"]},{\"id\":\"b2m6l6e5\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario del sistema\",\"pairs\":[{\"target\":\"die Notaufnahme\",\"source\":\"urgencias\"},{\"target\":\"die Wartezeit\",\"source\":\"el tiempo de espera\"},{\"target\":\"die Zuzahlung\",\"source\":\"el copago\"},{\"target\":\"die Nachsorge\",\"source\":\"el seguimiento\"},{\"target\":\"der Hausarzt\",\"source\":\"el médico de cabecera\"}],\"itemIds\":[\"b2m6notaufnahme\",\"b2m6wartezeit\",\"b2m6zuzahlung\",\"b2m6nachsorge\",\"b2m6hausarzt\"]},{\"id\":\"b2m6l6e6\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye la tesis de Weber\",\"text\":\"Es wäre ___, dass ein Teil der Verläufe sich vermeiden ___. Ich würde eher dafür ___, die Vorsorge zu stärken, ___ die Sprechstunde zu kürzen.\",\"answers\":[\"denkbar\",\"ließe\",\"plädieren\",\"anstatt\"],\"bank\":[\"denkbar\",\"ließe\",\"plädieren\",\"anstatt\",\"sicher\",\"kann\",\"sprechen\"],\"translation\":\"Cabría pensar que una parte de los cursos se podría evitar. Yo más bien abogaría por reforzar la prevención, en lugar de recortar la consulta.\",\"itemIds\":[\"b2m6eswaeredenkbar\",\"b2m6lieessesich\",\"b2m6wuerdeplaedieren\",\"b2m6vorsorge\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
