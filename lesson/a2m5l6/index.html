mark class=\\\"akk\\\"\u003eauf den Boden\u003c/mark\u003e, das Bild \u003cmark class=\\\"akk\\\"\u003ean die Wand\u003c/mark\u003e, die Bücher \u003cmark class=\\\"akk\\\"\u003eins Regal\u003c/mark\u003e. El verbo de la mudanza: \u003cb\u003eumziehen\u003c/b\u003e — separable, y en Perfekt con \u003cb\u003esein\u003c/b\u003e, porque te lleva de una casa A otra: Ich \u003cb\u003ebin\u003c/b\u003e letztes Jahr \u003cb\u003eumgezogen\u003c/b\u003e (como zurückgekommen en el módulo 2). Y un regalo del A2M1: legen, stellen y hängen son regulares — la fábrica ge—t te da \u003cb\u003egelegt, gestellt, gehängt\u003c/b\u003e para contar la mudanza en pasado.\",\"table\":[[\"¿Wohin damit?\",\"respuesta (flecha → Akkusativ)\"],[\"das Bett\",\"ins Schlafzimmer\"],[\"der Teppich\",\"auf den Boden\"],[\"das Bild\",\"an die Wand\"],[\"die Bücher\",\"ins Regal\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m5l6e1\",\"type\":\"mc\",\"prompt\":\"La pregunta de la mudanza\",\"question\":\"„Wohin damit?“\",\"options\":[\"¿Dónde lo pongo?\",\"¿De quién es esto?\",\"¿Cuánto cuesta esto?\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Wem gehört das?» — no lo necesitas aún\",\"Eso sería «Was kostet das?» — tu pregunta A1 de compras\"],\"itemIds\":[\"a2m5wohindamit\"],\"tip\":\"Wohin damit? — literal «¿a dónde con esto?». La frase más repetida en toda mudanza alemana.\"},{\"id\":\"a2m5l6e2\",\"type\":\"cloze\",\"prompt\":\"Completa el participio de la mudanza\",\"text\":\"Nico ist am Samstag ___. (mudado)\",\"answers\":[\"umgezogen\"],\"translation\":\"Nico se mudó el sábado.\",\"hints\":[\"umziehen es separable: el ge se cuela en medio\",\"um + ge + zogen\"],\"itemIds\":[\"a2m3umgezogen\",\"a2m1amsamstag\"],\"tip\":\"Como zurückgekommen: separable en Perfekt = prefijo + ge + participio. Y con sein, porque cambias de casa.\"},{\"id\":\"a2m5l6e3\",\"type\":\"mc\",\"prompt\":\"¿haben o sein? (repaso del módulo 2)\",\"question\":\"Ich ___ letztes Jahr umgezogen.\",\"options\":[\"bin\",\"habe\"],\"answer\":0,\"whyWrong\":[null,\"umziehen te lleva de una casa A otra — cambio de lugar → sein, como gefahren y gegangen\"],\"itemIds\":[\"a2m3umgezogen\",\"a2m2letztesjahr\"]},{\"id\":\"a2m5l6e4\",\"type\":\"cloze\",\"prompt\":\"Ráfaga 1: el armario a su sitio\",\"text\":\"Ich stelle den Schrank neben ___ Tür. (movimiento)\",\"answers\":[\"die\"],\"translation\":\"Pongo el armario al lado de la puerta.\",\"hints\":[\"stellen es flecha → Akkusativ\",\"Tür: el femenino no cambia\"],\"itemIds\":[\"a2m5stellen\",\"schrank\",\"a2m5tuer\"]},{\"id\":\"a2m5l6e5\",\"type\":\"cloze\",\"prompt\":\"Ráfaga 2: la alfombra al suelo\",\"text\":\"Ich lege den Teppich auf ___ Boden. (movimiento)\",\"answers\":[\"den\"],\"translation\":\"Pongo la alfombra en el suelo.\",\"hints\":[\"legen es flecha → Akkusativ\",\"der Boden es masculino: der → d-e-n\"],\"itemIds\":[\"a2m5legen\",\"a2m5teppich\",\"a2m5boden\"],\"tip\":\"El masculino es el único que se delata en Akkusativ: der → den. Cázalo siempre.\"},{\"id\":\"a2m5l6e6\",\"type\":\"transform\",\"prompt\":\"Ráfaga 3: de la foto a la acción\",\"source\":\"Das Bild hängt an der Wand.\",\"instruction\":\"Di que lo CUELGAS ahí\",\"answers\":[\"Ich hänge das Bild an die Wand\",\"Ich hänge das Bild an die Wand.\"],\"translation\":\"Cuelgo el cuadro en la pared.\",\"hints\":[\"hängt (está) → hänge (lo cuelgo)\",\"an der (foto) → an die (flecha)\"],\"itemIds\":[\"a2m5haengen\",\"a2m5bild\",\"a2m5wand\"],\"tip\":\"hängen no cambia de forma, pero el caso sí: an der Wand (ya cuelga) → an die Wand (lo cuelgas).\"},{\"id\":\"a2m5l6e7\",\"type\":\"build\",\"prompt\":\"Construye — la cama a su cuarto\",\"target\":\"Wir stellen das Bett ins Schlafzimmer\",\"translation\":\"Ponemos la cama en el dormitorio\",\"distractors\":[\"im\",\"liegt\"],\"itemIds\":[\"a2m5stellen\",\"bett\",\"schlafzimmer\"],\"tip\":\"ins = in das, la flecha. «im Schlafzimmer» sería la foto de después, cuando la cama ya está.\"},{\"id\":\"a2m5l6e8\",\"type\":\"order\",\"prompt\":\"Ordena el día de la mudanza — la secuencia completa\",\"sentences\":[\"Am Samstag ist Nico umgezogen.\",\"Zuerst hat er das Bett ins Schlafzimmer gestellt.\",\"Dann hat er den Teppich auf den Boden gelegt.\",\"Danach hat er das Bild an die Wand gehängt.\",\"Am Abend war alles fertig — und Nico hat gut geschlafen.\"],\"translation\":\"El sábado Nico se mudó. Primero puso la cama en el dormitorio. Luego puso la alfombra en el suelo. Después colgó el cuadro en la pared. Por la noche todo estaba listo — y Nico durmió bien.\",\"hints\":[\"Primero lo grande (la cama), al final el descanso\",\"zuerst → dann → danach ordenan la faena\"],\"itemIds\":[\"a2m3umgezogen\",\"zuerst\",\"a2m5stellen\",\"dann\",\"a2m5teppich\",\"danach\",\"a2m5bild\",\"amabend\",\"fertig\",\"a2m1geschlafen\"],\"tip\":\"gestellt, gelegt, gehängt: la fábrica ge—t del A2M1 sigue funcionando — y la mudanza entera cabe en Perfekt.\"},{\"id\":\"a2m5l6e9\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe lo que oyes\",\"text\":\"Ich stelle die Kartons ins Zimmer\",\"translation\":\"Pongo las cajas en la habitación\",\"hints\":[\"Kartons — tónica al final: kar-TON\",\"ins = in + das\"],\"itemIds\":[\"a2m5karton\",\"a2m5stellen\",\"zimmer\"]},{\"id\":\"a2m5l6e11\",\"type\":\"hearreal\",\"prompt\":\"En plena mudanza preguntan «Wo ist der Schlüssel?» — escucha la respuesta: ¿qué significa?\",\"book\":\"Das weiß ich nicht.\",\"real\":\"Keine Ahnung.\",\"translation\":\"Ni idea / no lo sé.\",\"ask\":\"meaning\",\"meaningOptions\":[\"No lo sé / ni idea\",\"No lo encuentro\",\"No me importa dónde esté\"],\"itemIds\":[\"a2m5natvkeineahnung\"],\"tip\":\"Keine Ahnung y Das weiß ich nicht dicen lo mismo; la primera es la que oirás entre cajas y amigos.\"},{\"id\":\"a2m5l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ponemos el armario al lado de la puerta\",\"answers\":[\"Wir stellen den Schrank neben die Tür\"],\"hints\":[\"El armario queda de pie → stellen\",\"Flecha
