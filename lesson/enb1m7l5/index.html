\u003eOjo\u003c/b\u003e: con sustantivo hace falta el \u003ci\u003eof a\u003c/i\u003e entero. «It's a bit problem» no existe.\u003cbr/\u003e· \u003cb\u003e-ish\u003c/b\u003e — se pega a la hora, a la edad, al color, a casi todo: \u003ci\u003esix-ish\u003c/i\u003e, \u003ci\u003ethirty-ish\u003c/i\u003e, \u003ci\u003eblue-ish\u003c/i\u003e. Es la manera más económica de decir «y pico».\u003cbr/\u003e· \u003cb\u003eyou know\u003c/b\u003e — no pregunta nada. Es un relleno, y como todos los rellenos, en dosis pequeñas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn aviso.\u003c/b\u003e En el \u003cb\u003eWriting\u003c/b\u003e esto no cabe: un correo formal lleno de \u003ci\u003esort of\u003c/i\u003e baja el criterio de registro. Es lengua de \u003cb\u003ehablar\u003c/b\u003e. En el Speaking, en cambio, suma en fluidez, porque enseña que puedes matizar sobre la marcha."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l5\",\"phaseId\":\"enb1m7\",\"title\":\"Sort of, or something\",\"subtitle\":\"Cómo suena un nativo cuando no está seguro — y por qué tú también deberías\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cinco maneras de no comprometerte\",\"itemIds\":[\"enb1m7sortof\",\"enb1m7orsomething\",\"enb1m7abitofa\",\"enb1m7youknow\",\"enb1m7ish\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la precisión no siempre es una virtud\",\"body\":\"$17\",\"table\":[[\"Preciso (y raro)\",\"Vago (y normal)\"],[\"It takes forty-five minutes.\",\"It's about three quarters of an hour.\"],[\"It is expensive.\",\"It's sort of expensive.\"],[\"It is a problem.\",\"It's a bit of a problem.\"],[\"We'll meet at six o'clock.\",\"See you at six-ish.\"],[\"It costs twenty pounds.\",\"Twenty pounds or something like that.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l5e1\",\"type\":\"match\",\"prompt\":\"Empareja las cinco piezas\",\"pairs\":[{\"target\":\"sort of\",\"source\":\"más o menos, en plan\"},{\"target\":\"or something like that\",\"source\":\"o algo así\"},{\"target\":\"It's a bit of a problem.\",\"source\":\"Es un problemilla.\"},{\"target\":\"at six-ish\",\"source\":\"a las seis y pico\"},{\"target\":\"you know\",\"source\":\"¿sabes? (relleno, no pregunta)\"}],\"itemIds\":[\"enb1m7sortof\",\"enb1m7orsomething\",\"enb1m7abitofa\",\"enb1m7ish\",\"enb1m7youknow\"],\"tip\":\"Fíjate en que ninguna añade información. Todas quitan filo. Eso es exactamente lo que hacen en la conversación real.\"},{\"id\":\"enb1m7l5e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — los marcadores que ya traes del módulo 3\",\"pairs\":[{\"target\":\"anyway\",\"source\":\"en fin, bueno\"},{\"target\":\"actually\",\"source\":\"en realidad\"},{\"target\":\"at least\",\"source\":\"al menos\"},{\"target\":\"apparently\",\"source\":\"por lo visto\"},{\"target\":\"as far as I know\",\"source\":\"que yo sepa\"}],\"targetSeconds\":24,\"itemIds\":[\"enb1m3anyway\",\"enb1m3actually\",\"enb1m2atleast\",\"enb1m3apparently\",\"enb1m3asfarasiknow\"],\"tip\":\"«as far as I know» es vague language pura: dice «esto es lo que yo tengo, y no me hago responsable de más». La usarás en el oral todo el rato.\"},{\"id\":\"enb1m7l5e3\",\"type\":\"mc\",\"prompt\":\"Por qué se dice así\",\"question\":\"¿Para qué sirve «It's a bit of a problem» en lugar de «It's a problem»?\",\"options\":[\"Para dar la misma información sin sonar tan tajante\",\"Para decir que el problema es pequeño de verdad\",\"Para indicar que no está seguro de que haya un problema\"],\"answer\":0,\"whyWrong\":[null,\"Puede ser enorme. «a bit of a» no mide el problema: suaviza la manera de contarlo — muy británico.\",\"La duda se marca con «I think» o «maybe», no con «a bit of a».\"],\"itemIds\":[\"enb1m7abitofa\"],\"tip\":\"El understatement británico es esto: decir menos de lo que hay para no imponerlo. «It's a bit of a problem» puede significar «esto es un desastre».\"},{\"id\":\"enb1m7l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa el sufijo que lo vuelve aproximado\",\"text\":\"I'll be there at seven-___, if the traffic isn't awful.\",\"answers\":[\"ish\"],\"translation\":\"Estaré allí a las siete y pico, si el tráfico no está imposible.\",\"hints\":[\"Tres letras, pegadas con guion a la hora\",\"i...\"],\"itemIds\":[\"enb1m7ish\"],\"tip\":\"«-ish» se pega a casi todo: sixish, thirty-ish, blue-ish, tired-ish. Y sola, contestando, también vale: «— Are you ready? — Ish.»\"},{\"id\":\"enb1m7l5e5\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «about»\",\"source\":\"It costs about twenty pounds.\",\"forbid\":[\"about\"],\"answers\":[\"It costs twenty pounds or something like that\",\"It costs around twenty pounds\",\"It costs twenty pounds-ish\"],\"translation\":\"Cuesta unas veinte libras.\",\"hints\":[\"La coletilla que va al final y cierra el dato\",\"It costs twenty pounds or ...\"],\"itemIds\":[\"enb1m7orsomething\",\"enb1m7ish\"],\"tip\":\"Tres maneras de decir «unas veinte libras» y ninguna necesita «about». Tener tres es justo lo que el nivel llama «rodear la palabra que no te sale».\"},{\"id\":\"enb1m7l5e6\",\"type\":\"transform\",\"prompt\":\"Suavízalo: que no suene a factura\",\"source\":\"It costs twenty pounds.\",\"instruction\":\"Hazlo aproximado\",\"answers\":[\"It costs about twenty pounds.\",\"It costs twenty pounds or something like that.\",\"It costs twenty pounds-ish.\",\"It costs around twenty pounds.\"],\"translation\":\"Cuesta unas veinte libras.\",\"hints\":[\"Una sola palabra delante del número basta\",\"It costs a... twenty pounds.\"],\"itemIds\":[\"enb1m7orsomething\"],\"tip\":\"En una conversación, dar una cifra exacta que no lo es suena peor que dar una aproximada. El inglés hablado prefiere el margen.\"},{\"id\":\"enb1m7l5e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It's a bit difficult problem.\",\"answers\":[\"It's a bit of a difficult problem.\"],\"why\":\"«a bit» solo se pega directamente a un adjetivo («a bit difficult»). En cuanto detrás hay un SUSTANTIVO, hace falta el bloque entero: a bit OF A + sustantivo.\",\"translation\":\"Es un problema un poco complicado.\",\"itemIds\":[\"enb1m7abitofa\"]},{\"id\":\"enb1m7l5e8\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"It's sort of a long story\",\"translation\":\"Es una historia un poco larga, en plan\",\"distractors\":[\"kind\",\"about\"],\"itemIds\":[\"enb1m7sortof\"],\"tip\":\"«sort of» y «kind of» son intercambiables al cien por cien. La única diferencia es geográfica: «kind of» se oye más en América, «sort of» más aquí.\"},{\"id\":\"enb1m7l5e9\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación con lo vago\",\"text\":\"— Is it far? — It's ___ of a walk, but you'll manage. — And is it dear? — It's expensive-___, yes. Ten pounds or ___ , I think. — Right. Let's meet at six-ish, then.\",\"answers\":[\"a bit\",\"ish\",\"something like that\"],\"bank\":[\"a bit\",\"ish\",\"something like that\",\"a lot\",\"sort of\",\"in other words\"],\"translation\":\"— ¿Está lejos? — Se anda un poco, pero llegas. — ¿Y es caro? — Carillo, sí. Diez libras o así, creo. — Vale, pues quedamos a las seis y pico.\",\"itemIds\":[\"enb1m7abitofa\",\"enb1m7ish\",\"enb1m7orsomething\"],\"tip\":\"Cuatro matices en cuatro líneas y ni un solo dato exacto. Así se contesta de verdad a «¿está lejos?» y a «¿es caro?».\"},{\"id\":\"enb1m7l5e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Está a veinte minutos andando, o algo así.\",\"answers\":[\"It's twenty minutes on foot, or something like that\",\"It's a twenty-minute walk, or something like that\",\"It's about twenty minutes on foot\"],\"hint\":\"La coletilla aproximada va al final del todo\",\"itemIds\":[\"enb1m7orsomething\",\"enonfoot\"],\"tip\":\"«or something like that» va SIEMPRE al final. No se puede meter en medio como el «o algo así» del español, que a veces flota.\"},{\"id\":\"enb1m7l5e11\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"Es un poco caro, pero merece la pena.\",\"answers\":[\"It's sort of expensive, but it's worth it\",\"It's a bit expensive, but it's worth it\",\"It's kind of expensive, but it's worth it\"],\"hints\":[\"Detrás del hueco hay un adjetivo, no un sustantivo\",\"It's s... of expensive, but ...\"],\"itemIds\":[\"enb1m7sortof\",\"enexpensive\"],\"tip\":\"Con adjetivo: «a bit expensive» o «sort of expensive», sin más. El «of a» solo aparece cuando detrás viene un sustantivo.\"},{\"id\":\"enb1m7l5e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — y no corras: los rellenos son para ir despacio\",\"text\":\"It's sort of expensive, you know, twenty pounds or something like that. See you at six-ish.\",\"phonetic\":\"its sóot ov iks-PÉN-siv, yu nóu, TUÉN-ti páunds̬ oo SÁM-zing laik dat · sii yu at SIKS-ish\",\"translation\":\"Es un poco caro, ¿sabes?, veinte libras o algo así. Nos vemos a las seis y pico.\",\"itemIds\":[\"enb1m7sortof\",\"enb1m7youknow\",\"enb1m7orsomething\",\"enb1m7ish\"],\"tip\":\"Cuenta cuántas palabras de esa frase dan información: cuatro. El resto es amortiguación, y es lo que hace que suene a persona y no a folleto.\"},{\"id\":\"enb1m7l5e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"So how was it? Well, it was sort of what I expected, you know? The people were lovely, the food was a bit of a disaster, and it rained for, I don't know, four days out of five or something like that. Would I go back? Probably. In the summer, mind.\",\"question\":\"¿Qué opinión tiene, en conjunto?\",\"options\":[\"Mixta: le gustó a medias y volvería en otra época\",\"Le encantó y quiere volver ya\",\"Fue horrible y no piensa volver\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«sort of what I expected» y «probably» no son entusiasmo: son un sí con reservas.\",\"Dice que la gente era encantadora y que probablemente volvería. No es un rechazo.\"],\"itemIds\":[\"enb1m7sortof\",\"enb1m7abitofa\",\"enb1m7orsomething\"],\"tip\":\"La opinión no está en ninguna palabra: está en el conjunto de matices. Eso es exactamente lo que mide el Listening Part 2, que separa hecho de actitud.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m7-2\",\"book\":\"How are things?\",\"real\":\"What's the craic?\",\"meaning\":\"¿Qué tal? ¿Qué se cuenta?\",\"when\":\"En Irlanda, entre gente que ya se conoce: es el saludo informal por defecto, no una pregunta sobre nada en concreto. Fuera de Irlanda casi nadie lo dice, y en un examen no cabe: allí se saluda con la fórmula neutra.\",\"register\":\"regional\",\"exam\":\"How's everything going?\",\"note\":\"«craic» se pronuncia igual que «crack» y significa el ambiente, la conversación, lo que se cuenta. «It was great craic» = «estuvo genial». Se escribe con esa ortografía irlandesa, y verla escrita de otra manera suele ser señal de que quien lo escribe no es de allí.\",\"sound\":\"uots de krak\",\"level\":\"b1\",\"produce\":false,\"itemId\":\"enb1m7natcraic\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\
