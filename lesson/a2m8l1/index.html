ce: „Ich ärgere mich!“\",\"options\":[\"Está enfadado\",\"Está alegre\",\"Está cansado\"],\"answer\":0,\"whyWrong\":[null,\"Alegrarse es sich freuen — freuen y ärgern son polos opuestos\",\"Eso sería «Ich bin müde» — sin espejo\"],\"itemIds\":[\"a2m8sichaergern\"],\"tip\":\"sich ärgern = enfadarse, fastidiarse. Con ä — viene de arg (malo), como Erkältung viene de kalt.\"},{\"id\":\"a2m8l1e7\",\"type\":\"listen\",\"prompt\":\"Escucha la pregunta del ánimo\",\"text\":\"Wie fühlst du dich?\",\"translation\":\"¿Cómo te sientes?\",\"hints\":[\"Empieza como Wie geht es dir?\",\"fühlst con ü larga, dich al final\"],\"itemIds\":[\"a2m8wiefuehlstdudich\"]},{\"id\":\"a2m8l1e8\",\"type\":\"build\",\"prompt\":\"Construye la respuesta sincera\",\"target\":\"Ich fühle mich nicht gut\",\"translation\":\"No me siento bien\",\"distractors\":[\"mir\",\"bin\"],\"itemIds\":[\"a2m8ichfuehlemichschlecht\",\"a2m8sichfuehlen\"],\"tip\":\"El espejo de fühlen es mich, no mir: el dativo de a2m4 aquí no pinta nada — este verbo refleja en acusativo.\"},{\"id\":\"a2m8l1e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡Me alegro!\",\"answers\":[\"Ich freue mich\",\"Ich freue mich!\"],\"hints\":[\"freuen + el espejo de ich\",\"Ich freue ...\"],\"itemIds\":[\"a2m8ichfreuemich\",\"a2m8sichfreuen\"],\"tip\":\"Si el mich te salió solo, el espejo ya empieza a funcionar. La tabla completa te espera en la próxima lección.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-a2m8-1\",\"book\":\"Wirklich?\",\"real\":\"Echt?\",\"meaning\":\"¿En serio? / ¿de verdad?\",\"when\":\"Reacción a cualquier noticia: «Ich fühle mich schlecht» — «Echt?». Universal al hablar; en un texto formal, wirklich.\",\"register\":\"neutral\",\"note\":\"echt = auténtico. Sola y con tono de pregunta, es LA reacción alemana — muestra que escuchas y pide más detalles.\",\"sound\":\"¿ejt? (ch suave de «ich»)\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"Nicos Weg — busca «Gefühle» (A2)\",\"url\":\"https://l
