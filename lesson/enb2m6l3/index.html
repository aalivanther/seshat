et."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m6l3\",\"phaseId\":\"enb2m6\",\"title\":\"I wish I had\",\"subtitle\":\"Ojalá + past perfect, conceder con must admit, y hacer que otro lo haga\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Desear hacia atrás, conceder, encargar\",\"itemIds\":[\"enb2m6wishihadtoldher\",\"enb2m6ifonlyihadknown\",\"enb2m6imustadmit\",\"enb2m6youmustadmit\",\"enb2m6ihaditfixed\",\"enb2m6igothimtohelp\",\"enb2m6hadmyhaircut\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres máquinas que el B1 no produjo: wish hacia atrás, must admit, y el causativo\",\"body\":\"$17\",\"table\":[[\"Fórmula\",\"Quién hace la acción\",\"Ejemplo\"],[\"have + cosa + participio\",\"un profesional, por encargo\",\"I had it fixed.\"],[\"get + persona + to + inf.\",\"alguien a quien convenciste\",\"I got him to help.\"],[\"get + cosa + participio\",\"lo mismo, más de calle\",\"I got it done.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l3e1\",\"type\":\"mc\",\"prompt\":\"Wish: ahora o entonces\",\"question\":\"«Ojalá se lo hubiera dicho» (entonces, y no lo hice) →\",\"options\":[\"I wish I had told her.\",\"I wish I had more money.\",\"I wish I would have told her.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es el wish del B1: ahora irreal. Hoy el arrepentimiento mira hacia atrás.\",\"Would no entra en el wish de arrepentimiento. Es el mismo calco del if.\"],\"itemIds\":[\"enb2m6wishihadtoldher\",\"enb1m5iwish\"],\"tip\":\"Atajo: si el ojalá es de algo que YA no se puede cambiar, past perfect. Si todavía podrías tenerlo, pasado simple.\"},{\"id\":\"enb2m6l3e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I wish I would have told her.\",\"answers\":[\"I wish I had told her.\"],\"why\":\"Would no entra detrás de wish cuando te arrepientes. El español «ojalá hubiera» empuja a would have; el inglés quiere had + participio, igual que la mitad del if del tercer condicional.\",\"translation\":\"Ojalá se lo hubiera dicho.\",\"itemIds\":[\"enb2m6wishihadtoldher\"]},{\"id\":\"enb2m6l3e3\",\"type\":\"transform\",\"prompt\":\"Del segundo wish al tercero\",\"source\":\"I wish I had more money.\",\"instruction\":\"Cámbialo a un arrepentimiento de ayer: «ojalá se lo hubiera dicho»\",\"answers\":[\"I wish I had told her\",\"I wish I had told him\",\"If only I had told her\"],\"translation\":\"Ojalá se lo hubiera dicho.\",\"hints\":[\"Sigue siendo wish + had, pero had ya no es «tener»\",\"I wish I had ... her\"],\"itemIds\":[\"enb2m6wishihadtoldher\",\"enb1m5iwish\",\"enb2m6ifonlyihadknown\"],\"tip\":\"La forma se parece y por eso se confunde: «I wish I had» de B1 es tener; «I wish I had told» de B2 es el auxiliar del perfecto. El participio detrás es lo que decide.\"},{\"id\":\"enb2m6l3e4\",\"type\":\"mc\",\"prompt\":\"El causativo: ¿quién cortó el pelo?\",\"question\":\"«I had my hair cut» significa…\",\"options\":[\"Que te lo cortaron en la peluquería (o alguien a quien se lo encargaste)\",\"Que te lo cortaste tú, en casa\",\"Que tenías el pelo corto de siempre\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «I cut my hair». El causativo saca al sujeto de la acción.\",\"El past simple de have aquí no es posesión: es encargo.\"],\"itemIds\":[\"enb2m6hadmyhaircut\",\"enb2m6ihaditfixed\"],\"tip\":\"En español «me corté el pelo» cubre las dos. En inglés no. Si fuiste a la peluquería, had it cut. Si cogiste las tijeras, cut it.\"},{\"id\":\"enb2m6l3e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I got him help.\",\"answers\":[\"I got him to help.\"],\"why\":\"Get + persona pide to + infinitivo: got him TO help. Sin to, «help» parece un nombre («le conseguí ayuda») y ya es otra frase.\",\"translation\":\"Conseguí que me ayudara.\",\"itemIds\":[\"enb2m6igothimtohelp\"]},{\"id\":\"enb2m6l3e6\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que Valeria le cuenta a Amy\",\"text\":\"I wish I ___ told her. I must ___ I was wrong. I had the wording ___ by Sam, and I got him ___ read it, and I still pressed send.\",\"answers\":[\"had\",\"admit\",\"checked\",\"to\"],\"bank\":[\"had\",\"admit\",\"checked\",\"to\",\"have\",\"accept\",\"rewritten\",\"for\"],\"translation\":\"Ojalá se lo hubiera dicho. He de admitir que me equivoqué. Le hice revisar la redacción a Sam, conseguí que se la leyera, y aun así pulsé enviar.\",\"itemIds\":[\"enb2m6wishihadtoldher\",\"enb2m6imustadmit\",\"enb2m6ihaditfixed\",\"enb2m6igothimtohelp\",\"enb2m6thewording\"],\"tip\":\"Cuatro máquinas del módulo en cuatro huecos: wish + past perfect, must admit, have + participio, get + to. Eso ya no es B1.\"},{\"id\":\"enb2m6l3e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — causativo\",\"source\":\"Lo hice arreglar.\",\"answers\":[\"I had it fixed\",\"I got it fixed\"],\"hint\":\"Have o get + objeto + participio\",\"itemIds\":[\"enb2m6ihaditfixed\",\"enb2m6igotitdone\"],\"tip\":\"«I repaired it» es que lo arreglaste tú. El causativo existe precisamente para cuando no.\"},{\"id\":\"enb2m6l3e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — conceder\",\"text\":\"I must admit I was wrong. You must admit it sounded harsh.\",\"phonetic\":\"ai mast ad-MÍT ai uos̬ rong. yu mast ad-MÍT it SÁUN-did jaash\",\"translation\":\"He de admitir que me equivoqué. Reconoce que sonó duro.\",\"itemIds\":[\"enb2m6imustadmit\",\"enb2m6youmustadmit\",\"enb2m6aharsh\"],\"tip\":\"El golpe va en AD-mit y WRONG / HARSH. «Must» aquí es suave: no es una orden. Si lo dices como un must de obligación, suena a bronca.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/sesh
