es al entrar?\",\"options\":[\"Gute Nacht!\",\"Guten Abend!\",\"Guten Morgen!\"],\"answer\":1,\"whyWrong\":[\"Gute Nacht es SOLO de despedida, para ir a dormir\",null,\"Guten Morgen es hasta media mañana\"],\"itemIds\":[\"gutenabend\",\"gutenacht\"],\"tip\":\"Al llegar: Guten Abend. Al irte a la cama: Gute Nacht. Nunca al revés.\"},{\"id\":\"f2l2be3\",\"type\":\"cloze\",\"prompt\":\"Completa (miércoles)\",\"text\":\"Heute ist ___.\",\"answers\":[\"Mittwoch\"],\"translation\":\"Hoy es miércoles.\",\"hints\":[\"El día que no termina en -tag\",\"Mitte + Woche = M-i-t-t-w-o-c-h\"],\"itemIds\":[\"mittwoch\",\"heute\"]},{\"id\":\"f2l2be4\",\"type\":\"cloze\",\"prompt\":\"Completa (hoy → mañana)\",\"text\":\"Heute ist Samstag, ___ ist Sonntag.\",\"answers\":[\"morgen\"],\"translation\":\"Hoy es sábado, mañana es domingo.\",\"hints\":[\"El día siguiente\",\"m-o-r-g-e-n, con minúscula (no es la parte del día)\"],\"itemIds\":[\"morgenadv\",\"samstag\",\"sonntag\"]},{\"id\":\"f2l2be5\",\"type\":\"cloze\",\"prompt\":\"Completa la despedida nocturna\",\"text\":\"Um 23 Uhr sagst du: Gute ___!\",\"answers\":[\"Nacht\"],\"translation\":\"A las 23h dices: ¡buenas noches!\",\"hints\":[\"die N-a-c-h-t — femenina, por eso «Gute» sin -n\",\"N-a-c-h-t, con mayúscula\"],\"itemIds\":[\"gutenacht\",\"nacht\"]},{\"id\":\"f2l2be6\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe lo que oyes\",\"text\":\"Heute ist Freitag\",\"translation\":\"Hoy es viernes\",\"hints\":[\"heute: eu suena «oi», h aspirada\",\"Frei + tag\"],\"itemIds\":[\"heute\",\"freitag\"]},{\"id\":\"f2l2be7\",\"type\":\"type\",\"prompt\":\"Traduce al alemán\",\"question\":\"Hoy es lunes\",\"answers\":[\"Heute ist Montag\"],\"hints\":[\"hoy = heute\",\"Montag con mayúscula\"],\"itemIds\":[\"heute\",\"montag\"]},{\"id\":\"f2l2be8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡Buenos días! (por la mañana)\",\"answers\":[\"Guten Morgen!\",\"Guten Morgen\"],\"hints\":[\"El saludo de la mañana, con -n en
