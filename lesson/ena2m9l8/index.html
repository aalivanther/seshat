next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T720,"])</script><script>self.__next_f.push([1,"Esto no es gramática: es \u003cb\u003epragmática\u003c/b\u003e, y se puntúa en el criterio de \u003ci\u003eTask Fulfilment and Coherence\u003c/i\u003e del oral. Un candidato con gramática correcta que entra a saco y se despide de golpe suena peor que uno con más errores y estas seis fórmulas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eABRIR — pedir el turno antes de tomarlo\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[Have you got a minute?|¿Tienes un momento?]]\u003c/b\u003e — la más usada en Reino Unido.\u003cbr/\u003e· \u003ci\u003eCan I ask you something?\u003c/i\u003e · \u003ci\u003eSorry, are you busy?\u003c/i\u003e\u003cbr/\u003eY para arrancar con alguien conocido: \u003ci\u003eListen…\u003c/i\u003e · \u003ci\u003eBy the way…\u003c/i\u003e (por cierto).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eINTERRUMPIR — y aquí está el contraste\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[Sorry to interrupt, but…|Perdona que te interrumpa, pero…]]\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eSorry, can I just say something?\u003c/i\u003e · \u003ci\u003eCan I stop you there?\u003c/i\u003e\u003cbr/\u003eEn español se interrumpe subiendo un poco la voz y siguiendo: no hace falta anunciarlo y no se lee como grosería. \u003cb\u003eEn inglés hay que ANUNCIAR la interrupción con una fórmula.\u003c/b\u003e Cortar sin fórmula, aunque tengas razón y aunque sea urgente, se lee como maleducado — y en el oral del examen, como falta de cooperación.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCERRAR — y esto es una secuencia, no una palabra\u003c/b\u003e\u003cbr/\u003eUna conversación inglesa se cierra en tres pasos, siempre en este orden:\u003cbr/\u003e1. \u003cb\u003eLa señal\u003c/b\u003e: \u003ci\u003eAnyway…\u003c/i\u003e · \u003ci\u003eRight…\u003c/i\u003e · \u003ci\u003eWell…\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eLa razón\u003c/b\u003e: \u003cb\u003e[[Anyway, I'd better go.|Bueno, me voy yendo.]]\u003c/b\u003e · \u003ci\u003eI've got to get back to work.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eLa despedida\u003c/b\u003e: \u003cb\u003e[[It was nice talking to you.|Me ha alegrado hablar contigo.]]\u003c/b\u003e · \u003ci\u003eSee you later.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eSaltarse el paso 1 es lo que hace que un «Bye» suene a colgar el teléfono a media frase. Esa palabrita —\u003ci\u003eanyway\u003c/i\u003e, \u003ci\u003eright\u003c/i\u003e— es el aviso de que la conversación se acaba, y el otro la está esperando."])</script><script>self.__next_f.push([1,"18:T7ac,"])</script><script>self.__next_f.push([1,"\u003ci\u003eEsto \u003cb\u003eno\u003c/b\u003e es material de frontera, aunque en algún sitio lo hayas leído así: la tabla de gramática del A2 Access incluye las \u003cb\u003ecoletillas simples\u003c/b\u003e en su columna. Se reconocen, se dicen y te las pueden pedir. Van aquí las cuatro de manual; las rebuscadas —«Let's go, shall we?», «Pass me that, will you?»— esas sí son de B1.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl español tiene \u003cb\u003euna\u003c/b\u003e coletilla y no cambia nunca: «¿no?», «¿verdad?». \u003ci\u003eHace frío aquí, \u003cu\u003e¿no?\u003c/u\u003e\u003c/i\u003e · \u003ci\u003eTú eres la compañera de Amy, \u003cu\u003e¿verdad?\u003c/u\u003e\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl inglés cambia la coletilla \u003cb\u003een cada frase\u003c/b\u003e, y lo hace con dos reglas:\u003cbr/\u003e1. Frase \u003cb\u003eafirmativa\u003c/b\u003e → coletilla \u003cb\u003enegativa\u003c/b\u003e. Frase negativa → coletilla afirmativa.\u003cbr/\u003e2. La coletilla repite el \u003cb\u003eAUXILIAR\u003c/b\u003e de la frase (is, are, was, do, did, can, have), nunca el verbo principal. Y si la frase no tiene auxiliar, el auxiliar es \u003cb\u003edo / does / did\u003c/b\u003e: \u003ci\u003eYou live upstairs, \u003cb\u003edon't you\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[It's cold in here, isn't it?|Hace frío aquí, ¿no?]]\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eYou're Amy's flatmate, \u003cb\u003earen't you\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eYou didn't pay the rent, \u003cb\u003edid you\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eShe can cook, \u003cb\u003ecan't she\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl calco a evitar es el más natural del mundo para nosotros: \u003ci\u003eIt's cold in here, no?\u003c/i\u003e — se entiende, pero suena a extranjero al instante. Y el segundo error, casi peor: repetir el signo de la frase. «\u003ci\u003eYou didn't pay the rent, \u003cs\u003edidn't you?\u003c/s\u003e\u003c/i\u003e» no existe; si la frase va en negativo, la coletilla va en afirmativo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el atajo honesto, para cuando hables:\u003c/b\u003e mientras no te salga sola, usa \u003cb\u003eright?\u003c/b\u003e, que es invariable y perfectamente correcto en registro informal: \u003ci\u003eIt's cold in here, right?\u003c/i\u003e Sirve para todas las frases y no se equivoca nunca. Ojo: es un salvavidas para el oral, no una excusa para no aprenderte el mecanismo, porque en el Reading y en el Listening las coletillas de verdad te van a salir igual."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l8\",\"phaseId\":\"ena2m9\",\"title\":\"Have you got a minute?\",\"subtitle\":\"Abrir, interrumpir y cerrar una conversación sin quedar mal\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas que abren y cierran\",\"itemIds\":[\"ena2m9haveyougotaminute\",\"ena2m9sorrytointerrupt\",\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\",\"ena2m9questiontags\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Una conversación inglesa no empieza ni acaba de golpe\",\"body\":\"$17\",\"table\":[[\"para qué\",\"lo que se dice\",\"en español\"],[\"abrir\",\"Have you got a minute?\",\"¿Tienes un momento?\"],[\"interrumpir\",\"Sorry to interrupt, but…\",\"Perdona que te corte, pero…\"],[\"señal de cierre\",\"Anyway…\",\"Bueno…\"],[\"la razón\",\"I'd better go.\",\"Me voy yendo.\"],[\"la despedida\",\"It was nice talking to you.\",\"Me ha alegrado hablar contigo.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Las coletillas: «…, isn't it?» — y sí, entran en el examen\",\"body\":\"$18\",\"table\":[[\"la frase\",\"la coletilla\",\"por qué\"],[\"It's cold in here,\",\"isn't it?\",\"afirmativa → negativa; auxiliar «is»\"],[\"You're Amy's flatmate,\",\"aren't you?\",\"afirmativa → negativa; auxiliar «are»\"],[\"You didn't pay the rent,\",\"did you?\",\"negativa → afirmativa; auxiliar «did»\"],[\"She can cook,\",\"can't she?\",\"afirmativa → negativa; auxiliar «can»\"],[\"You live upstairs,\",\"don't you?\",\"la frase no tiene auxiliar → lo pone «do»\"],[\"cualquiera de ellas,\",\"right?\",\"el atajo del oral, mientras no salga solo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l8e1\",\"type\":\"bucket\",\"prompt\":\"¿Abre la conversación o la cierra?\",\"categories\":[\"abre\",\"cierra\"],\"items\":[{\"text\":\"Have you got a minute?\",\"bucket\":0},{\"text\":\"Anyway, I'd better go.\",\"bucket\":1},{\"text\":\"Can I ask you something?\",\"bucket\":0},{\"text\":\"It was nice talking to you.\",\"bucket\":1},{\"text\":\"Sorry, are you busy?\",\"bucket\":0},{\"text\":\"Right, I'll let you get on.\",\"bucket\":1}],\"itemIds\":[\"ena2m9haveyougotaminute\",\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\",\"enimbusy\"],\"tip\":\"Las de cerrar empiezan casi todas por una señal: Anyway, Right, Well. Esa palabra suelta es el aviso de que se acaba.\"},{\"id\":\"ena2m9l8e2\",\"type\":\"mc\",\"prompt\":\"El contraste pragmático del módulo\",\"question\":\"Tu compañera está hablando y tienes que decirle algo urgente. ¿Qué haces en inglés?\",\"options\":[\"Anuncio la interrupción: «Sorry to interrupt, but…»\",\"Subo un poco la voz y sigo, como en español\",\"Espero en silencio hasta que termine, aunque sea urgente\"],\"answer\":0,\"whyWrong\":[null,\"Eso en español no es grosero y en inglés sí: cortar sin fórmula se lee como maleducado\",\"Tampoco hace falta: la fórmula existe justo para poder interrumpir sin quedar mal\"],\"itemIds\":[\"ena2m9sorrytointerrupt\"],\"tip\":\"La fórmula no es adorno: es el permiso. Con ella puedes cortar a quien sea; sin ella, no.\"},{\"id\":\"ena2m9l8e3\",\"type\":\"order\",\"prompt\":\"Ordena la conversación entera, de la apertura al cierre\",\"sentences\":[\"Amy, have you got a minute?\",\"Sorry to interrupt, but the landlord phoned about the window.\",\"He's coming on Friday morning, so somebody has to be at home.\",\"Anyway, I'd better go — I'm late for work.\",\"It was nice talking to you. See you tonight!\"],\"translation\":\"Amy, ¿tienes un momento? Perdona que te interrumpa, pero ha llamado el casero por lo de la ventana. Viene el viernes por la mañana, así que alguien tiene que estar en casa. Bueno, me voy yendo, que llego tarde al trabajo. Me ha alegrado hablar contigo. ¡Hasta esta noche!\",\"itemIds\":[\"ena2m9haveyougotaminute\",\"ena2m9sorrytointerrupt\",\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\",\"enimlate\"],\"tip\":\"Esa es la forma completa: pedir el turno, anunciar el corte, el contenido, la señal de cierre y la despedida. Cinco frases y ninguna es difícil.\"},{\"id\":\"ena2m9l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa la señal de cierre\",\"text\":\"___, I'd better go. It was nice talking to you!\",\"answers\":[\"Anyway\",\"Right\",\"Well\"],\"translation\":\"Bueno, me voy yendo. ¡Me ha alegrado hablar contigo!\",\"hints\":[\"Es la palabra que avisa de que la conversación se acaba\",\"A… / R… / W…\"],\"itemIds\":[\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\"]},{\"id\":\"ena2m9l8e5\",\"type\":\"audiomc\",\"prompt\":\"¿Qué está pasando aquí? — 2 escuchas\",\"audio\":\"Right, I'd better let you get on. It was really nice talking to you. See you at the weekend!\",\"question\":\"¿Qué está haciendo quien habla?\",\"options\":[\"Cerrando la conversación\",\"Empezando a contar algo\",\"Interrumpiendo a la otra persona\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«Right» al principio y «See you» al final: eso es un cierre de manual\",\"Para interrumpir se dice «Sorry to interrupt», y aquí no aparece\"],\"itemIds\":[\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\",\"enatweekend\"],\"tip\":\"En la Parte 2 del Listening te dan un enunciado y tienes que elegir la mejor réplica. Reconocer si te están abriendo o cerrando la conversación decide la respuesta.\"},{\"id\":\"ena2m9l8e6\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La despedida que se comprime\",\"book\":\"It was nice talking to you.\",\"real\":\"Nice talking to you.\",\"translation\":\"Me ha alegrado hablar contigo.\",\"itemIds\":[\"ena2m9itwasnicetalkingtoyou\"],\"tip\":\"En la calle se cae el «It was» entero, igual que se caen los pronombres flojos de la lección 5. Escrito, la fórmula completa.\"},{\"id\":\"ena2m9l8e7\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con su coletilla\",\"pairs\":[{\"target\":\"It's cold in here,\",\"source\":\"isn't it?\"},{\"target\":\"You're Amy's flatmate,\",\"source\":\"aren't you?\"},{\"target\":\"You didn't pay the rent,\",\"source\":\"did you?\"},{\"target\":\"She can cook,\",\"source\":\"can't she?\"}],\"itemIds\":[\"ena2m9questiontags\"],\"tip\":\"Fíjate en el mecanismo, que es siempre el mismo: la coletilla coge el auxiliar de la frase y le da la vuelta. Frase afirmativa, coletilla negativa.\"},{\"id\":\"ena2m9l8e8\",\"type\":\"mc\",\"prompt\":\"El calco de la coletilla\",\"question\":\"«Hace frío aquí, ¿no?» — ¿cuál suena a inglés?\",\"options\":[\"It's cold in here, isn't it?\",\"It's cold in here, no?\",\"It's cold in here, is it?\"],\"answer\":0,\"whyWrong\":[null,\"Ese «no?» es el calco directo del español. Se entiende, pero te delata en la primera frase\",\"La frase es afirmativa, así que la coletilla tiene que ser negativa: isn't it\"],\"itemIds\":[\"ena2m9questiontags\"],\"tip\":\"Mientras no te salga sola, di «right?»: es invariable, es correcta y nunca se equivoca de auxiliar. Pero apúntate el mecanismo, porque esto sí puede caer.\"},{\"id\":\"ena2m9l8e9\",\"type\":\"audiomc\",\"prompt\":\"La coletilla, al oído — 2 escuchas\",\"audio\":\"You're Amy's flatmate, aren't you? I've seen you in the hall.\",\"question\":\"¿Qué está haciendo quien habla?\",\"options\":[\"Confirmando algo que ya cree saber\",\"Preguntando por primera vez\",\"Presentándose\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Una pregunta de verdad sería «Are you Amy's flatmate?». La coletilla dice que ya lo daba por hecho\",\"No dice su nombre en ningún momento\"],\"itemIds\":[\"ena2m9questiontags\",\"ena2m9amysflat\"],\"tip\":\"Ese es todo el trabajo de una coletilla: no pregunta, confirma. Por eso en el Listening cambia el sentido de la respuesta que se espera.\"},{\"id\":\"ena2m9l8e13\",\"type\":\"cloze\",\"prompt\":\"Completa la coletilla — la frase va en negativo\",\"text\":\"You didn't pay the rent, ___ you?\",\"answers\":[\"did\"],\"translation\":\"No pagaste el alquiler, ¿verdad?\",\"hints\":[\"Frase negativa → coletilla afirmativa\",\"El auxiliar de la frase es «didn't»: quítale el not\"],\"itemIds\":[\"ena2m9questiontags\"],\"tip\":\"El error número uno es repetir el signo: «didn't you?» detrás de una frase negativa no existe. Una de las dos mitades va en negativo, nunca las dos.\"},{\"id\":\"ena2m9l8e14\",\"type\":\"transform\",\"prompt\":\"Pide confirmación — añade la coletilla\",\"source\":\"You're Amy's flatmate.\",\"instruction\":\"Conviértelo en una frase que pide confirmación, con su coletilla\",\"answers\":[\"You're Amy's flatmate, aren't you?\"],\"translation\":\"Tú eres la compañera de piso de Amy, ¿verdad?\",\"itemIds\":[\"ena2m9questiontags\",\"ena2m9amysflat\"],\"tip\":\"El auxiliar de la frase es «'re» (are), así que la coletilla es «aren't you?». Con «I am» hay una rareza que conviene saber: la coletilla es «aren't I?», no «amn't I?».\"},{\"id\":\"ena2m9l8e10\",\"type\":\"build\",\"prompt\":\"Construye la apertura\",\"target\":\"Amy have you got a minute\",\"translation\":\"Amy, ¿tienes un momento?\",\"distractors\":[\"do\",\"one\"],\"itemIds\":[\"ena2m9haveyougotaminute\"],\"tip\":\"En inglés británico esta pregunta se hace con «have you got», no con «do you have». Las dos existen, pero la de got es la que se oye en la calle.\"},{\"id\":\"ena2m9l8e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el cierre entero, sin cortar de golpe\",\"text\":\"Anyway, I'd better go. It was nice talking to you. See you tomorrow!\",\"phonetic\":\"E-ni-uei, áid BE-ta GÓU. it uos̬ NÁIS TÓO-king tu yu. sii yu tu-MÓ-rou\",\"translation\":\"Bueno, me voy yendo. Me ha alegrado hablar contigo. ¡Hasta mañana!\",\"itemIds\":[\"ena2m9anywayidbettergo\",\"ena2m9itwasnicetalkingtoyou\",\"enseeyoutomorrow\"],\"tip\":\"Tres frases y un cierre completo. Si te quedas solo con la tercera, suena a que te vas enfadada.\"},{\"id\":\"ena2m9l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Perdona que te interrumpa, pero ¿tienes un momento?\",\"answers\":[\"Sorry to interrupt, but have you got a minute?\",\"Sorry to interrupt, but have you got a moment?\",\"Sorry to interrupt you, but have you got a minute?\"],\"hints\":[\"Fórmula de interrupción + but + fórmula de apertura\",\"Sorry to i…, but have you g… a minute?\"],\"itemIds\":[\"ena2m9sorrytointerrupt\",\"ena2m9haveyougotaminute\",\"enbut\"],\"tip\":\"Las dos fórmulas juntas: la de cortar y la de pedir el turno. Con esa frase puedes entrar en cualquier conversación en inglés sin quedar mal.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-8\",\"book\":\"I have to go now. Goodbye.\",\"real\":\"Right, I'll let you get on.\",\"meaning\":\"Bueno, te dejo, que sigas con lo tuyo.\",\"when\":\"Para cerrar una conversación en persona o por teléfono sin que parezca que huyes: pones la excusa en el otro («que sigas con lo tuyo») en vez de en ti. Es de lo más británico que hay. En el examen escrito, «I have to go now».\",\"register\":\"amigos\",\"note\":\"«Get on» aquí es «seguir con lo que estabas haciendo». Y el «Right» del principio es la señal de cierre: sin ella, la frase suena a que te están echando.\",\"sound\":\"ráit, áil let yu guet ON\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Starting and ending conversations\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca las unidades de «starting a conversation» y «saying goodbye». Escucha una vez y apunta la señal de cierre que usa cada persona: siempre hay una.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-ti
