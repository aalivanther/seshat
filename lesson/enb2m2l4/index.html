03eI look forward to hearing from you. Yours sincerely,\u003c/i\u003e (si usaste el nombre) / \u003ci\u003eYours faithfully,\u003c/i\u003e (si usaste Sir or Madam).\u003cbr/\u003e\u003cbr/\u003e«I'm after that job» es la calle. «I am writing to apply for» es lo que puntúa."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m2l4\",\"phaseId\":\"enb2m2\",\"title\":\"I am writing to apply\",\"subtitle\":\"El género del módulo: la carta formal de 100-150, que ES la Writing Part 1\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas que puntúan\",\"itemIds\":[\"enb2m2iamwritingtoapply\",\"enb2m2iwouldbegrateful\",\"enb1m5contentpoints\",\"enb2m2offtopic\",\"enb2m2specifiedreader\",\"enb2m2iwouldwelcome\",\"enb2m2pleasefindattached\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La Writing 1, desmontada\",\"body\":\"$17\",\"table\":[[\"Si empiezas por…\",\"Cierras con…\"],[\"Dear Mrs Kowalczyk,\",\"Yours sincerely,\"],[\"Dear Sir or Madam,\",\"Yours faithfully,\"],[\"Hi Nadia,\",\"nada de Yours: te has ido de registro\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l4e1\",\"type\":\"match\",\"prompt\":\"Empareja la fórmula con su trabajo\",\"pairs\":[{\"target\":\"I am writing to apply for the afternoon post.\",\"source\":\"apertura: de qué va la carta\"},{\"target\":\"I would be grateful if you could confirm the hours.\",\"source\":\"pedir información, altura de examen\"},{\"target\":\"Please find attached my CV.\",\"source\":\"adjuntar, sin «I send you»\"},{\"target\":\"Yours sincerely\",\"source\":\"cierre cuando has usado el nombre\"}],\"itemIds\":[\"enb2m2iamwritingtoapply\",\"enb2m2iwouldbegrateful\",\"enb2m2pleasefindattached\",\"ena2m12yourssincerely\"]},{\"id\":\"enb2m2l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Sincerely o faithfully?\",\"categories\":[\"Yours sincerely — usaste el nombre\",\"Yours faithfully — Dear Sir or Madam\"],\"items\":[{\"text\":\"Dear Mrs Kowalczyk,\",\"bucket\":0},{\"text\":\"Dear Sir or Madam,\",\"bucket\":1},{\"text\":\"Dear Mr Patel,\",\"bucket\":0},{\"text\":\"Dear Sir or Madam, (no name on the advert)\",\"bucket\":1},{\"text\":\"Dear Nadia Kowalczyk,\",\"bucket\":0},{\"text\":\"To whom it may concern,\",\"bucket\":1}],\"itemIds\":[\"ena2m12yourssincerely\",\"enb1m5yoursfaithfully\"],\"tip\":\"La regla es británica y se cobra: sincerely con nombre, faithfully sin él. Mezclarlos es el detalle por el que un nativo dice que el material está hecho a medias.\"},{\"id\":\"enb2m2l4e3\",\"type\":\"mc\",\"prompt\":\"La regla dura\",\"question\":\"Si en una Writing 1 te dejas un punto de contenido, ¿qué pasa?\",\"options\":[\"Task fulfilment puede caer a cero: fuera de tema no tiene crédito.\",\"Te quitan media nota de vocabulario, y ya está.\",\"Nada, si la gramática es de B2.\"],\"answer\":0,\"whyWrong\":[null,\"No es vocabulario: es cumplimiento. Y no es media nota: puede ser cero.\",\"La gramática ni se mira si la tarea no se ha hecho.\"],\"itemIds\":[\"enb2m2offtopic\",\"enb2m2taskfulfilment\",\"enb1m5contentpoints\"]},{\"id\":\"enb2m2l4e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I send attached my CV.\",\"answers\":[\"Please find attached my CV.\"],\"why\":\"«I send you» es el calco de «te mando». La fórmula de examen es Please find attached… o I have attached… Un presente simple de envío suena a que el currículum viaja ahora mismo, a pie.\",\"translation\":\"Adjunto mi currículum.\",\"itemIds\":[\"enb2m2pleasefindattached\"]},{\"id\":\"enb2m2l4e5\",\"type\":\"gapbank\",\"prompt\":\"Completa la plantilla de apertura y petición\",\"text\":\"Dear Mrs Kowalczyk, I am writing to ___ for the afternoon post. Please find ___ my CV. I would be ___ if you could confirm the hours. I would ___ the opportunity to discuss this. Yours ___,\",\"answers\":[\"apply\",\"attached\",\"grateful\",\"welcome\",\"sincerely\"],\"bank\":[\"apply\",\"attached\",\"grateful\",\"welcome\",\"sincerely\",\"faithfully\",\"send\"],\"translation\":\"Estimada Sra. Kowalczyk: le escribo para solicitar el puesto de las tardes. Adjunto mi currículum. Le agradecería que me confirmara el horario. Agradecería la oportunidad de tratarlo. Atentamente,\",\"itemIds\":[\"enb2m2iamwritingtoapply\",\"enb2m2pleasefindattached\",\"enb2m2iwouldbegrateful\",\"enb2m2iwouldwelcome\",\"ena2m12yourssincerely\"],\"tip\":\"«Faithfully» está en el banco para que no lo cojas: has empezado por Dear Mrs Kowalczyk, así que toca sincerely.\"},{\"id\":\"enb2m2l4e6\",\"type\":\"write\",\"prompt\":\"Writing Part 1, de entrenamiento: 100-150, tres puntos, lector especificado.\",\"scenario\":\"Nadia Kowalczyk te ha escrito desde la agencia. El mostrador de asesoría confirma las dos tardes y pide que contestes por escrito, a ella, tratando LOS TRES puntos del recado. 100-150 palabras. Fuera de tema = cero.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Nadia Kowalczyk, East London Recruitment\",\"text\":\"The advice desk can offer you Tuesday and Thursday afternoons, 14:00–18:00, starting next Monday. Please write to confirm: (1) that you can do both afternoons, (2) whether you can stay until 18:30 on Thursdays in December, (3) the date you can start. Reply to me, not to the desk.\"},\"bullets\":[\"Confirma las dos tardes (martes y jueves).\",\"Contesta a lo de las 18:30 de los jueves de diciembre.\",\"Da una fecha de comienzo.\"],\"checks\":[{\"re\":\"(tuesday|thursday|both afternoons|two afternoons)\",\"label\":\"Confirmas las tardes\"},{\"re\":\"(18:30|half past six|december|stay until)\",\"label\":\"Contestas a las 18:30 de diciembre\"},{\"re\":\"(monday|start|available from|next week)\",\"label\":\"Das una fecha de comienzo\"}],\"frame\":[\"Dear Mrs Kowalczyk,\",\"I am writing to confirm the afternoon hours at the advice desk.\",\"Punto 1: I can do Tuesday and Thursday afternoons.\",\"Punto 2: In view of my café shifts, I would be grateful if… / I can stay until 18:30 provided that…\",\"Punto 3: I am available from next Monday.\",\"I look forward to hearing from you. Yours sincerely, Valeria Soto\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"in view of\",\"provided that\",\"with regard to\",\"as a result\",\"further to\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":150,\"model\":\"Dear Mrs Kowalczyk,\\nI am writing to confirm the afternoon hours at the advice desk. I can do both Tuesday and Thursday afternoons from 14:00 to 18:00, as set out in the job description.\\nWith regard to Thursdays in December, I can stay until 18:30 provided that the café does not need me that week. I would be grateful if you could confirm this as soon as the December rota is out, rather than leaving the hours unclear.\\nIn view of the start date, I am available from next Monday. I look forward to hearing from you.\\nYours sincerely,\\nValeria Soto\",\"itemIds\":[\"enb2m2iamwritingtoapply\",\"enb2m2iwouldbegrateful\",\"enb2m2providedthat\",\"enb2m2inviewof\",\"enb2m2withregardto\",\"ena2m12yourssincerely\"],\"tip\":\"Cuenta las palabras: 100-150. Tres viñetas, tres. El modelo no pide nada con I want, y cierra Yours sincerely porque el estímulo trae nombre.\"},{\"id\":\"enb2m2l4e7\",\"type\":\"mc\",\"prompt\":\"El lector especificado\",\"question\":\"Nadia dice «Reply to me, not to the desk.» Si escribes al mostrador, ¿qué has hecho?\",\"options\":[\"Has fallado al specified reader: la tarea decía a quién.\",\"Nada: el mostrador y Nadia son lo mismo.\",\"Has mejorado el registro, porque el mostrador es más formal.\"],\"answer\":0,\"whyWrong\":[null,\"El estímulo lo separa a propósito. El examen también: te dice el lector.\",\"El registro no se arregla escribiendo a otra persona.\"],\"itemIds\":[\"enb2m2specifiedreader\"]},{\"id\":\"enb2m2l4e8\",\"type\":\"transform\",\"prompt\":\"De la calle al examen\",\"source\":\"Any chance you could tell me the hours?\",\"instruction\":\"Dilo con I would be grateful if you could…\",\"answers\":[\"I would be grateful if you could tell me the hours\",\"I would be grateful if you could tell me the hours.\",\"I would be grateful if you could confirm the hours\"],\"translation\":\"Le agradecería que me dijera el horario.\",\"itemIds\":[\"enb2m2natanychance\",\"enb2m2iwouldbegrateful\"]},{\"id\":\"enb2m2l4e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — la apertura de examen\",\"source\":\"Le escribo para solicitar el puesto de las tardes.\",\"answers\":[\"I am writing to apply for the afternoon post.\",\"I am writing to apply for the afternoon post\",\"I am writing to apply for the afternoon position.\"],\"hint\":\"I am writing to apply for…\",\"itemIds\":[\"enb2m2iamwritingtoapply\"]},{\"id\":\"enb2m2l4e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Agradecería la oportunidad de tratarlo.\",\"answers\":[\"I would welcome the opportunity to discuss this.\",\"I would welcome the opportunity to discuss it.\"],\"itemIds\":[\"enb2m2iwouldwelcome\"]},{\"id\":\"enb2m2l4e11\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Pedir las horas, dos alturas\",\"book\":\"I would be grateful if you could confirm the hours.\",\"real\":\"Any chance you could tell me the hours?\",\"translation\":\"¿Me podrías confirmar el horario?\",\"itemIds\":[\"enb2m2iwouldbegrateful\",\"enb2m2natanychance\"]},{\"id\":\"enb2m2l4e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Nadia recibe la carta. Pregunta antes del play. Dos escuchas.\",\"audio\":\"Got Valeria's email. Clear, three points, all of them. She can do both afternoons, she can stay until half six in December provided the café doesn't need her, and she can start Monday. That's a Writing 1, that is. Tell the desk she's in.\",\"question\":\"¿Qué ha hecho bien Valeria, según Nadia?\",\"options\":[\"Los tres puntos de contenido, todos, con claridad\",\"Pedir un sueldo más alto en el mismo correo\",\"Escribirle al mostrador en vez de a ella\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De sueldo no habla esta carta: no era un punto de contenido.\",\"Nadia había dicho que le escribiera a ELLA. Y lo ha hecho.\"],\"itemIds\":[\"enb1m5contentpoints\",\"enb2m2specifiedreader\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m2-1\",\"book\":\"I would like to apply for\",\"real\":\"I'm after that job.\",\"meaning\":\"Quiero ese puesto / Voy a por ese trabajo\",\"when\":\"Con Sam, con Amy, con Ben, cuando el puesto es una noticia de café. En la Writing 1, I am writing to apply for. «I'm after that job» en una carta a Nadia tumba el registro; «I am writing to apply» en el pub suena a otra persona.\",\"register\":\"amigos\",\"exam\":\"I am writing to apply for the afternoon post.\",\"note\":\"«After» aquí no es «después»: es «a por». La pieza se oye mucho en británico hablado y no se escribe en un informe.\",\"sound\":\"aim AAF-ta dat dchob\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m2natafterthatjob\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\
