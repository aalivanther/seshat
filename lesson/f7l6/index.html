03e2. Am Samstag geht er in ein Geschäft.\u003cbr/\u003e3. Die Verkäuferin sagt: „Hallo! Welche Größe haben Sie?“ — „Größe M“, sagt Nico.\u003cbr/\u003e4. Er probiert eine Jacke an. Sie ist schön, aber sie passt nicht.\u003cbr/\u003e5. Dann probiert er eine Jacke in Größe M an. Sie passt sehr gut, aber sie ist zu teuer — achtzig Euro!\u003cbr/\u003e6. Nico ist traurig, denn er will keine achtzig Euro bezahlen.\u003cbr/\u003e7. Die Verkäuferin sagt: „Einen Moment! Diese Jacke kostet heute dreißig Euro.“\u003cbr/\u003e8. „Perfekt!“, sagt Nico. „Diese Jacke nehme ich!“ Er bezahlt und ist glücklich.\u003cbr/\u003e9. Zu Hause sagt sein Bruder: „Ich habe diese Jacke auch!“ — Nico sagt: „Perfekt, wir sind eine Familie!“\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: denn = porque; a diferencia de weil no cambia el orden · Einen Moment! = ¡un momento!\u003c/i\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f7l6e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 7)\",\"question\":\"„Nico bezahlt achtzig Euro für die Jacke.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Relee la frase 7: hoy la chaqueta cuesta treinta euros\",null],\"itemIds\":[\"bezahlen\",\"jacke\",\"kosten\"],\"tip\":\"El giro de la historia: la chaqueta cara resulta estar de oferta.\"},{\"id\":\"f7l6e2\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frases 4-5)\",\"question\":\"„Die Jacke in Größe M passt sehr gut.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"whyWrong\":[null,\"Frase 5: sie passt sehr gut — la que no le quedaba era la primera\"],\"itemIds\":[\"passen\",\"groesse\"]},{\"id\":\"f7l6e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 6)\",\"question\":\"¿Por qué está triste Nico?\",\"options\":[\"La chaqueta es fea\",\"No quiere pagar ochenta euros\",\"No hay chaquetas en la tienda\"],\"answer\":1,\"whyWrong\":[\"Al contrario: sie ist schön y le queda bien\",null,\"La tienda tiene chaquetas de sobra\"],\"itemIds\":[\"zuteuer\",\"bezahlen\"]},{\"id\":\"f7l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 1 de la historia\",\"text\":\"Nico braucht eine Jacke, ___ der Winter kommt. (porque)\",\"answers\":[\"denn\"],\"translation\":\"Nico necesita una chaqueta, porque llega el invierno.\",\"hints\":[\"Conector de causa que NO mueve el verbo\",\"Coma + d-e-n-n\"],\"itemIds\":[\"denn\",\"brauchen\",\"jacke\",\"winter\"],\"tip\":\"Coma SIEMPRE antes de denn. Y tras denn el orden es normal: denn der Winter kommt.\"},{\"id\":\"f7l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 3\",\"text\":\"Die Verkäuferin sagt: „Welche ___ haben Sie?“\",\"answers\":[\"Größe\"],\"translation\":\"La vendedora dice: «¿Qué talla tiene usted?»\",\"hints\":[\"La pregunta clave de la lección 2\",\"Con ö y ß\"],\"itemIds\":[\"sagen\",\"welchegroesse\",\"verkaeufer\"]},{\"id\":\"f7l6e6\",\"type\":\"build\",\"prompt\":\"Construye la frase 8 de la historia\",\"target\":\"Diese Jacke nehme ich\",\"translation\":\"Me llevo esta chaqueta\",\"distractors\":[\"Dieser\",\"nehmen\"],\"itemIds\":[\"diese\",\"ichnehme\",\"jacke\"],\"tip\":\"El chunk de compradora decidida: demostrativo primero, verbo 2º, ich después.\"},{\"id\":\"f7l6e7\",\"type\":\"listen\",\"prompt\":\"Escucha la frase 5 (parte final)\",\"text\":\"Sie passt sehr gut, aber sie ist zu teuer\",\"translation\":\"Queda muy bien, pero es demasiado cara\",\"hints\":[\"Dos frases unidas por aber (con coma)\",\"passt ... zu teuer\"],\"itemIds\":[\"passen\",\"zuteuer\"]},{\"id\":\"f7l6e8\",\"type\":\"cloze\",\"prompt\":\"Completa el final feliz\",\"text\":\"„Perfekt!“, sagt Nico. ___ hat er eine Jacke. (por fin)\",\"answers\":[\"Endlich\"],\"translation\":\"«¡Perfecto!», dice Nico. Por fin tiene una chaqueta.\",\"hints\":[\"Empieza por E y termina en -lich\",\"End + lich\"],\"itemIds\":[\"endlich\",\"perfekt\",\"sagen\"],\"tip\":\"Endlich abre la frase → el verbo va 2º: Endlich hat er... (tu V2 de siempre).\"},{\"id\":\"f7l6e9\",\"type\":\"type\",\"prompt\":\"Di la frase del comprador decidido\",\"question\":\"¡Perfecto! Me llevo esta falda\",\"answers\":[\"Perfekt! Diesen Rock nehme ich\",\"Perfekt! Ich nehme diesen Rock\"],\"hints\":[\"der Rock en acusativo → diesen\"],\"itemIds\":[\"perfekt\",\"diesen\",\"rock\"]},{\"id\":\"f7l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡Por fin Nico tiene una chaqueta!\",\"answers\":[\"Endlich hat Nico eine Jacke!\",\"Endlich hat Nico eine Jacke\"],\"hints\":[\"Endlich primero → verbo 2º\",\"Endlich hat Nico ...\"],\"itemIds\":[\"endlich\",\"jacke\"],\"tip\":\"Como en la historia: Endlich + verbo + sujeto. Si te salió sola, la fase es tuya.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — el Nico original\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca los capítulos de compras y ropa: verás al Nico de DW viviendo escenas como esta.\"},{\"label\":\"lingua.com — lecturas A1\",\"url\":\"https://lingua.com/german/reading/\",\"note\":\"Textos cortos A1 con preguntas de comprensión — perfecto después de este mini-cuento.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app
