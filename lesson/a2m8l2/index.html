bo conjugado: Ich ruhe \u003cb\u003emich\u003c/b\u003e aus — con los separables, el espejo va en medio y la partícula cierra. Dos verbos nuevos para practicarla: \u003cb\u003esich ausruhen\u003c/b\u003e (descansar) y \u003cb\u003esich beeilen\u003c/b\u003e (darse prisa — \u003ci\u003eBeeil dich!\u003c/i\u003e es el grito alemán de las mañanas). Un detalle fino para cuando hay inversión: con sujeto pronombre, el espejo va detrás del sujeto — heute \u003cb\u003efühle ich mich\u003c/b\u003e gut; con sujeto nombre, el espejo se adelanta — heute \u003cb\u003efühlt sich Nico\u003c/b\u003e gut.\",\"table\":[[\"Nominativ\",\"espejo (reflexivo)\"],[\"ich\",\"mich\"],[\"du\",\"dich\"],[\"er/sie/es\",\"sich\"],[\"wir\",\"uns\"],[\"ihr (vosotros)\",\"euch\"],[\"sie/Sie\",\"sich\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m8l2e1\",\"type\":\"match\",\"prompt\":\"Empareja cada espejo con su persona\",\"pairs\":[{\"target\":\"mich\",\"source\":\"me (yo)\"},{\"target\":\"dich\",\"source\":\"te (tú)\"},{\"target\":\"sich\",\"source\":\"se (él, ella, usted)\"},{\"target\":\"euch\",\"source\":\"os (vosotros)\"}],\"itemIds\":[\"a2m8sichfuehlen\",\"a2m8sichfreuen\"]},{\"id\":\"a2m8l2e2\",\"type\":\"mc\",\"prompt\":\"Elige el espejo\",\"question\":\"Wir freuen ___!\",\"options\":[\"uns\",\"sich\",\"euch\"],\"answer\":0,\"whyWrong\":[null,\"sich es solo de la 3ª persona — con wir el espejo es uns, como «NOS alegramos»\",\"euch es el espejo de ihr (vosotros)\"],\"itemIds\":[\"a2m8sichfreuen\"],\"tip\":\"wir → uns, exactamente como el español «nos». El único espejo raro es sich — todo lo demás es calcado.\"},{\"id\":\"a2m8l2e3\",\"type\":\"transform\",\"prompt\":\"Transforma: cambia la persona\",\"source\":\"Ich freue mich.\",\"instruction\":\"Ahora lo dice Nico: empieza con Er\",\"answers\":[\"Er freut sich\",\"Er freut sich.\"],\"translation\":\"Él se alegra.\",\"hints\":[\"ich → er cambia DOS cosas\",\"el verbo (freut) y el espejo (sich)\"],\"itemIds\":[\"a2m8sichfreuen\",\"a2m8ichfreuemich\"],\"tip\":\"Al cambiar de persona, el espejo cambia con ella: mich → sich. Verbo y espejo van siempre en pareja.\"},{\"id\":\"a2m8l2e4\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora al revés\",\"source\":\"Er fühlt sich schlecht.\",\"instruction\":\"Ahora lo dices tú: empieza con Ich\",\"answers\":[\"Ich fühle mich schlecht\",\"Ich fühle mich schlecht.\"],\"translation\":\"Me siento mal.\",\"hints\":[\"er → ich: verbo y espejo cambian juntos\",\"fühle ... mich\"],\"itemIds\":[\"a2m8sichfuehlen\",\"a2m8ichfuehlemichschlecht\"],\"tip\":\"sich → mich al pasar a ich. Si haces este cambio sin pensar, la tabla ya vive en tu oído.\"},{\"id\":\"a2m8l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa el espejo de vosotros\",\"text\":\"Ihr ruht ___ am Sonntag aus. (os)\",\"answers\":[\"euch\"],\"translation\":\"Vosotros descansáis el domingo.\",\"hints\":[\"ihr → su espejo\",\"e-u-c-h — el mismo de a2m4\"],\"itemIds\":[\"a2m8sichausruhen\",\"sonntag\"],\"tip\":\"ausruhen es separable Y reflexivo: el espejo (euch) va tras el verbo, la partícula (aus) cierra la frase.\"},{\"id\":\"a2m8l2e6\",\"type\":\"build\",\"prompt\":\"Construye el plan del domingo\",\"target\":\"Ich ruhe mich am Sonntag aus\",\"translation\":\"El domingo descanso\",\"altTargets\":[\"Am Sonntag ruhe ich mich aus\"],\"distractors\":[\"mir\",\"ausruhen\"],\"itemIds\":[\"a2m8sichausruhen\",\"sonntag\"],\"tip\":\"La pinza de siempre, ahora con espejo dentro: ruhe 2º ... aus al final, y el mich pegado al verbo.\"},{\"id\":\"a2m8l2e7\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«Se alegra» →\",\"options\":[\"Er freut mich\",\"Er freut sich\"],\"answer\":1,\"whyWrong\":[\"mich es el espejo de ich — con er el espejo es sich: cada persona refleja al suyo\",null],\"itemIds\":[\"a2m8sichfreuen\"],\"tip\":\"«Er freut mich» significaría otra cosa (él me alegra A MÍ). El espejo equivocado cambia el sentido entero.\"},{\"id\":\"a2m8l2e8\",\"type\":\"cloze\",\"prompt\":\"Completa el grito de las mañanas\",\"text\":\"Beeil ___! (¡date prisa!)\",\"answers\":[\"dich\"],\"translation\":\"¡Date prisa!\",\"hints\":[\"La orden va a du → su espejo\",\"d-i-c-h\"],\"itemIds\":[\"a2m8sichbeeilen\"],\"tip\":\"En la orden a du el verbo pierde la terminación pero el espejo se queda: Beeil dich! — dos palabras, prisa instantánea.\"},{\"id\":\"a2m8l2e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Wir freuen uns sehr\",\"translation\":\"Nos alegramos mucho\",\"hints\":[\"wir + su espejo\",\"uns — con s zumbada final\"],\"itemIds\":[\"a2m8sichfreuen\"]},{\"id\":\"a2m8l2e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Nico se alegra\",\"answers\":[\"Nico freut sich\",\"Er freut sich\"],\"hints\":[\"3ª persona → el espejo universal\",\"Nico freut ...\"],\"itemIds\":[\"a2m8sichfreuen\"],\"tip\":\"sich para él, ella, ellos y usted: un solo espejo para toda la 3ª persona. La parte fácil de la tabla.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — Reflexivpronomen (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Reflexivpronomen» en el A2: mich/dich/sich en diálogos con actores.\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra por A2 y busca «reflexive Verben»: más práctica de la tabla del espejo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"
