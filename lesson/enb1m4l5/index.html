/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T647,"])</script><script>self.__next_f.push([1,"El inglés de las redes es casi todo pasiva —\u003ci\u003eit was posted, it was shared, it was taken down\u003c/i\u003e— porque en internet \u003cb\u003enunca se sabe quién\u003c/b\u003e. Eso ya lo tienes. Lo que hay que fijar hoy son tres detalles pequeños que se cobran caros:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. comment ON.\u003c/b\u003e \u003ci\u003eEveryone commented \u003cb\u003eon\u003c/b\u003e the photo\u003c/i\u003e, nunca «commented the photo». Es rección: el verbo y su preposición se aprenden juntos, como una sola palabra. Igual que \u003ci\u003edepend on\u003c/i\u003e y \u003ci\u003eworry about\u003c/i\u003e del módulo 1.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. «media» es plural.\u003c/b\u003e \u003ci\u003eSocial media\u003c/i\u003e viene de \u003ci\u003emedium → media\u003c/i\u003e, así que en inglés cuidado se escribe \u003ci\u003ethe media \u003cb\u003eare\u003c/b\u003e\u003c/i\u003e… En la práctica, \u003ci\u003esocial media\u003c/i\u003e funciona como un bloque y casi todo el mundo dice \u003ci\u003esocial media \u003cb\u003eis\u003c/b\u003e\u003c/i\u003e. Ninguna de las dos te va a tumbar; lo que sí te tumba es escribir «socials medias».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. post, share, screenshot: sustantivo y verbo a la vez.\u003c/b\u003e \u003ci\u003ea post\u003c/i\u003e / \u003ci\u003eto post\u003c/i\u003e · \u003ci\u003ea share\u003c/i\u003e / \u003ci\u003eto share\u003c/i\u003e · \u003ci\u003ea screenshot\u003c/i\u003e / \u003ci\u003eto screenshot\u003c/i\u003e. El inglés convierte sustantivos en verbos con total naturalidad y no avisa. Cuando veas una palabra conocida en un sitio raro de la frase, prueba a leerla como verbo antes de darla por nueva.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una nota de contenido, no de idioma:\u003c/b\u003e las tres preguntas que este módulo quiere que te hagas delante de cualquier cosa que leas —\u003ci\u003e¿quién lo dice? ¿de cuándo es? ¿de dónde sale la foto?\u003c/i\u003e— son exactamente lo que el examen llama \u003ci\u003edistinguishing fact from opinion\u003c/i\u003e en el Listening Part 4. Se entrena leyendo, no memorizando."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l5\",\"phaseId\":\"enb1m4\",\"title\":\"It was shared two thousand times\",\"subtitle\":\"El inglés de las redes — y tu carta informal a Emma\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de la pantalla\",\"itemIds\":[\"enb1m4socialmedia\",\"enb1m4apost\",\"enb1m4wasshared\",\"enb1m4wentviral\",\"enb1m4screenshot\",\"enb1m4commentedon\",\"enb1m4wasposted\",\"enb1m4wasredesigned\",\"enb1m4natsawitonline\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos preposiciones y un plural que engaña\",\"body\":\"$17\",\"table\":[[\"Sustantivo\",\"Verbo\",\"En pasiva\"],[\"a post\",\"to post something\",\"It was posted on Friday.\"],[\"a share\",\"to share something\",\"It was shared two thousand times.\"],[\"a screenshot\",\"to screenshot something\",\"A screenshot was sent to the paper.\"],[\"a comment\",\"to comment ON something\",\"The photo was commented on all day.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l5e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de la pantalla\",\"pairs\":[{\"target\":\"social media\",\"source\":\"las redes sociales\"},{\"target\":\"a post\",\"source\":\"una publicación\"},{\"target\":\"a screenshot\",\"source\":\"una captura de pantalla\"},{\"target\":\"The video went viral.\",\"source\":\"El vídeo se hizo viral.\"}],\"itemIds\":[\"enb1m4socialmedia\",\"enb1m4apost\",\"enb1m4screenshot\",\"enb1m4wentviral\"],\"tip\":\"«go viral» va con «go», como «go wrong» o «go quiet»: es un cambio de estado. «Be viral» no se dice.\"},{\"id\":\"enb1m4l5e2\",\"type\":\"mc\",\"prompt\":\"La preposición pegada al verbo\",\"question\":\"«Todo el mundo comentó la foto» →\",\"options\":[\"Everyone commented the photo.\",\"Everyone commented on the photo.\",\"Everyone commented about the photo.\"],\"answer\":1,\"whyWrong\":[\"Es el calco directo del español, donde «comentar» lleva objeto sin preposición. En inglés no.\",null,\"«about» va con «talk» y con «worry», no con «comment». La preposición no se elige: viene con el verbo.\"],\"itemIds\":[\"enb1m4commentedon\"],\"tip\":\"Guárdalo como una sola palabra: «comment-on». Igual que «depend-on» y «worry-about» del módulo 1, que ya te salen solos.\"},{\"id\":\"enb1m4l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Everyone commented the photo.\",\"answers\":[\"Everyone commented on the photo.\"],\"why\":\"Falta la preposición: «comment» siempre lleva «on» delante de lo comentado. Es rección pura, no hay regla que deducirla.\",\"translation\":\"Todo el mundo comentó la foto.\",\"itemIds\":[\"enb1m4commentedon\"]},{\"id\":\"enb1m4l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar\",\"text\":\"It ___ shared two thousand times before anybody checked the date.\",\"answers\":[\"was\"],\"translation\":\"Se compartió dos mil veces antes de que nadie mirara la fecha.\",\"hints\":[\"Pasado, y el sujeto es «it»\",\"Tres letras\"],\"itemIds\":[\"enb1m4wasshared\"],\"tip\":\"«It was shared» no dice quién lo compartió, y ahí está el problema entero de internet contado en tres palabras.\"},{\"id\":\"enb1m4l5e5\",\"type\":\"transform\",\"prompt\":\"De activa a pasiva\",\"source\":\"Two thousand people shared it.\",\"instruction\":\"Ponla en pasiva, con las veces al final\",\"answers\":[\"It was shared two thousand times\",\"It was shared two thousand times.\"],\"translation\":\"Se compartió dos mil veces.\",\"hints\":[\"Empieza por «It…»\",\"It was ... two thousand times\"],\"itemIds\":[\"enb1m4wasshared\"],\"tip\":\"Fíjate en el cambio: «two thousand people» eran los que compartían; «two thousand times» son las veces. La pasiva reordena la frase y el dato cambia de papel.\"},{\"id\":\"enb1m4l5e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «they» y sin «took»\",\"source\":\"They took the post down.\",\"forbid\":[\"they\",\"took\"],\"answers\":[\"The post was taken down\",\"The post got taken down\",\"The post was taken down.\"],\"translation\":\"Retiraron la publicación.\",\"hints\":[\"El sujeto nuevo es lo que sufrió la acción\",\"The post was ... down\"],\"itemIds\":[\"enb1m4takendown\"],\"tip\":\"Quitar el «they» es exactamente el ejercicio del módulo: cuando el sujeto no aporta nada, la pasiva se lo lleva y la frase mejora.\"},{\"id\":\"enb1m4l5e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la historia de la publicación — cuatro huecos\",\"text\":\"The post ___ put up at three in the morning by an account with no name. By lunchtime it had ___ shared two thousand times, ___ nobody could say where the photo came from. It was finally taken down ___ Friday.\",\"answers\":[\"was\",\"been\",\"although\",\"on\"],\"bank\":[\"was\",\"been\",\"although\",\"on\",\"were\",\"at\",\"unless\"],\"translation\":\"La publicación se subió a las tres de la madrugada desde una cuenta sin nombre. A mediodía se había compartido dos mil veces, aunque nadie sabía decir de dónde salía la foto. El viernes acabaron retirándola.\",\"itemIds\":[\"enb1m4wasposted\",\"enb1m4wasshared\",\"enb1m4takendown\",\"enb1m1although\"],\"tip\":\"Cuatro huecos y ninguno es de vocabulario: auxiliar, participio, conector y preposición. Ese es el reparto exacto del Reading Part 1 del examen.\"},{\"id\":\"enb1m4l5e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Se publicó a las tres de la madrugada.\",\"answers\":[\"It was posted at three in the morning\",\"It was posted at three in the morning.\",\"It was published at three in the morning\"],\"hint\":\"La hora de la madrugada en inglés no tiene palabra propia\",\"itemIds\":[\"enb1m4wasposted\"],\"tip\":\"«madrugada» no existe en inglés: son «three in the morning» o «three a.m.» y ya está. Cuando una palabra no tiene equivalente, se dice con las que hay — eso es circunloquio, y el examen lo premia.\"},{\"id\":\"enb1m4l5e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"The library website was redesigned recently.\",\"answers\":[\"La web de la biblioteca se rediseñó hace poco\",\"Rediseñaron la web de la biblioteca hace poco\",\"La página de la biblioteca se rediseñó hace poco\"],\"itemIds\":[\"enb1m4wasredesigned\"],\"tip\":\"«recently» aquí va con pasado simple y está perfecto: en inglés británico convive con los dos tiempos. No todo adverbio que suena a «hace poco» arrastra present perfect.\"},{\"id\":\"enb1m4l5e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, ha visto en una red social que la biblioteca donde trabajas cierra. Contéstale tratando LAS TRES cosas, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Val!! Somebody in my group shared a post saying your library is closing in March — there was a photo of the doors with a chain on them. Is it true?? You never said anything. Are you going to lose the job?\"},\"bullets\":[\"Cuéntale qué era esa publicación y qué se hizo con ella (en pasiva).\",\"Dile qué se ha decidido de verdad y qué no (perfecto en pasiva).\",\"Pídele que no la comparta y propón algo concreto.\"],\"checks\":[{\"re\":\"(was|were) (posted|shared|put|taken)\",\"label\":\"Cuentas lo de la publicación en pasiva\"},{\"re\":\"(has|have) been\",\"label\":\"Dices lo que se ha decidido, en perfecto pasivo\"},{\"re\":\"(don'?t share|do not share|not to share)\",\"label\":\"Le pides que no la comparta\"}],\"frame\":[\"Saludo corto y tranquilízala en una línea: «Hi Emma, don't worry — …»\",\"Punto 1 — la publicación: «That story was posted on… and it was shared…»\",\"Punto 2 — lo real: «Nothing has been decided yet, although…»\",\"Punto 3 — la petición y el plan: «Please don't share… Come down in…»\",\"Cierre corto y tu nombre. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"though\",\"in addition\",\"on the other hand\",\"besides\",\"therefore\",\"otherwise\",\"at least\",\"apart from\",\"of course\",\"while\",\"since\",\"for instance\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nThanks for your message. Don't worry — the library isn't closing. That story was posted on a local page on Friday night and it was shared two thousand times before anyone checked it. In addition, the photo wasn't even ours: it was taken in Leeds in 2019. Nothing has been decided yet, although our evening hours have been cut. On the other hand, the campaign has been good for us: forty people came to the meeting on Saturday. Please don't share the post, though — these things only travel because we pass them on. Come down in November and I'll show you the place.\\nValeria\",\"itemIds\":[\"enb1m4wasposted\",\"enb1m4wasshared\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m1although\"],\"tip\":\"Cuenta las palabras antes de comprobar: 100-120. Y mira el modelo — cuatro conectores distintos, cinco pasivas y ni una despedida formal. Meter «Yours sincerely» en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m4l5e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"It was posted at three in the morning and it was shared two thousand times.\",\"phonetic\":\"it uos̬ PÓUS-tid at zríi in de MÓO-ning and it uos̬ shéad tuu Z̬ÁU-s̬and taims̬\",\"translation\":\"Se publicó a las tres de la madrugada y se compartió dos mil veces.\",\"itemIds\":[\"enb1m4wasposted\",\"enb1m4wasshared\"],\"tip\":\"Dos pasivas seguidas, y en las dos el «was» pasa de puntillas: el golpe cae en POSted y en SHARED. Si marcas los auxiliares, suenas a libro leído en voz alta.\"},{\"id\":\"enb1m4l5e12\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen. Dos escuchas, y usa el cuaderno.\",\"audio\":\"Have you seen this? Someone's put up a photo of the library with a chain on the doors.|Let me look. Hang on — that's not our door. Ours is green.|It's been shared about two thousand times.|Then somebody should say something. Take a screenshot before it gets taken down, because once it's gone nobody can check what it actually said.\",\"question\":\"¿Por qué pide la segunda voz una captura de pantalla?\",\"options\":[\"Para poder comprobar después lo que decía si la retiran\",\"Para compartirla con más gente\",\"Para enseñársela a la casera\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Justo lo contrario: quiere que alguien lo desmienta, no que circule más.\",\"La casera no aparece en la conversación.\"],\"itemIds\":[\"enb1m4screenshot\",\"enb1m4takendown\",\"enb1m4wasshared\"],\"tip\":\"«before it gets taken down» — get-passive dentro de una subordinada de tiempo, que es donde más aparece. Y fíjate en el detalle que desmonta la foto: la puerta es verde. Un dato pequeño vale más que mil compartidos.\"},{\"id\":\"enb1m4l5e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lo vi en internet, pero la foto se hizo en Leeds en 2019.\",\"answers\":[\"I saw it online, but the photo was taken in Leeds in 2019\",\"I saw it online but the photo was taken in Leeds in 2019\",\"I saw it online, but the picture was taken in Leeds in 2019\"],\"hints\":[\"Empieza por «I saw it…»\",\"I saw it online, but the photo was ... in Leeds in 2019\"],\"itemIds\":[\"enb1m4natsawitonline\",\"enb1m4wasposted\"],\"tip\":\"«take a photo» en pasiva es «the photo was taken». Y esa frase —dónde y cuándo se hizo la foto— es la que desmonta la mitad de los bulos que vas a ver.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m4-2\",\"book\":\"I read it on the internet.\",\"real\":\"I saw it online.\",\"meaning\":\"Lo vi en internet\",\"when\":\"Hablando, siempre. «On the internet» suena a manual de 2005; lo que se dice es «online», sin artículo y sin preposición delante. En un texto escrito de examen conviene decir además DE DÓNDE salía, que es lo que puntúa.\",\"register\":\"neutral\",\"exam\":\"According to an article I read, the pool is closing.\",\"note\":\"El salto de banda no está en «online»: está en citar la fuente. «I saw it online» no informa a nadie; «according to an article I read» convierte el rumor en dato y sube el criterio de vocabulario.\",\"sound\":\"ai soo it on-LÁIN\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m4natsawitonline\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cua
