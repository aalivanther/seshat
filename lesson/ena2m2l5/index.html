tatic/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T585,El módulo pasado te dio la clínica más rentable del curso: la \u003cb\u003e-ed\u003c/b\u003e y sus tres sonidos. Esa sigue en pie y se cobra cada día. Los irregulares traen otras tres, y conviene saber que \u003cb\u003eson solo tres\u003c/b\u003e: no hay que aprender el sonido de cada verbo por separado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. La familia «-oot».\u003c/b\u003e [[bought|compró]], [[thought|pensó]], [[caught|pilló]], [[taught|enseñó]], brought. Se escriben con -ought / -aught y todas suenan igual: una \u003cb\u003eo larga\u003c/b\u003e y nada más. La gh \u003cb\u003eno suena\u003c/b\u003e: no es «bou-gt» ni «cauj». Es \u003cb\u003eboot\u003c/b\u003e, \u003cb\u003ezoot\u003c/b\u003e, \u003cb\u003ekoot\u003c/b\u003e, \u003cb\u003etoot\u003c/b\u003e, \u003cb\u003ebroot\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Las que se leen a la española y salen mal.\u003c/b\u003e Son tres, y las tres son altísimas de frecuencia:\u003cbr/\u003e· \u003cb\u003esaid\u003c/b\u003e → «sed». No «séid».\u003cbr/\u003e· \u003cb\u003eread\u003c/b\u003e (pasado) → «red». Se escribe igual que el presente y suena distinto.\u003cbr/\u003e· \u003cb\u003eheard\u003c/b\u003e → «jéed», una sola vocal larga. No «jíard».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. Los homófonos.\u003c/b\u003e \u003cb\u003eate\u003c/b\u003e (comí) y \u003cb\u003eeight\u003c/b\u003e (ocho) suenan exactamente igual: «éit». No hay forma de distinguirlos al oído — \u003cb\u003elos distingue la frase\u003c/b\u003e, no el sonido. \u003ci\u003eI ate at eight\u003c/i\u003e es una frase perfectamente normal y suena «ái ÉIT at ÉIT».\u003cbr/\u003e\u003cbr/\u003eY algo que ya sabes hacer: \u003cb\u003eslept, kept, felt, left\u003c/b\u003e acaban en el mismo grupo consonántico que trabajaste con worked y helped. Esa /t/ final ya la tienes entrenada — aprovéchala."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l5\",\"phaseId\":\"ena2m2\",\"title\":\"Clínica de sonido: bought, said, read\",\"subtitle\":\"Los irregulares tienen tres trampas de sonido, y solo tres\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de la clínica\",\"itemIds\":[\"ena2m2readred\",\"ena2m2ateeight\",\"ena2m2heard\",\"ena2m2paid\",\"ena2m2wore\",\"ena2m2boughtgroup\",\"ena2m2caughtgroup\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres trampas, y ninguna más\",\"body\":\"$17\",\"table\":[[\"se escribe\",\"suena\",\"el error típico\"],[\"bought / thought / caught\",\"boot · zoot · koot\",\"«bou-gat», «cauj»\"],[\"said\",\"sed\",\"«séid»\"],[\"read (pasado)\",\"red\",\"«riid»\"],[\"heard\",\"jéed\",\"«jíard»\"],[\"ate\",\"éit — igual que eight\",\"«áte»\"],[\"paid\",\"péid\",\"«páid»\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué esta clínica importa más de lo que parece\",\"body\":\"Podrías pensar que pronunciar mal \u003ci\u003esaid\u003c/i\u003e es un detalle. No lo es, por dos motivos muy concretos:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eEn el Listening no vas a reconocer lo que no sabes pronunciar.\u003c/b\u003e Si tienes \u003ci\u003esaid\u003c/i\u003e guardado en la cabeza como «séid», cuando el audio diga «sed» tú no oirás la palabra: oirás un ruido. Es el mecanismo por el que se falla la comprensión sin fallar el vocabulario.\u003cbr/\u003e· \u003cb\u003eread es el único verbo del inglés que cambia de tiempo sin cambiar de letras.\u003c/b\u003e \u003ci\u003eI read the message\u003c/i\u003e puede ser presente o pasado, y \u003cb\u003esolo la voz lo dice\u003c/b\u003e (riid o red). Al escribir, ponle un marcador — \u003ci\u003elast night\u003c/i\u003e, \u003ci\u003eyesterday\u003c/i\u003e — o quien te lea no lo sabrá.\u003cbr/\u003e\u003cbr/\u003eLa regla general de la clínica: \u003cb\u003eel irregular hay que aprenderlo con su sonido pegado\u003c/b\u003e, no solo con su ortografía. Cuando repases la lista, dila en voz alta. Una lista leída en silencio se aprende a medias.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Suena con la «oo» larga o no?\",\"categories\":[\"suena «-oot» (o larga)\",\"no\"],\"items\":[{\"text\":\"bought\",\"bucket\":0},{\"text\":\"thought\",\"bucket\":0},{\"text\":\"caught\",\"bucket\":0},{\"text\":\"took\",\"bucket\":1},{\"text\":\"taught\",\"bucket\":0},{\"text\":\"broke\",\"bucket\":1},{\"text\":\"spoke\",\"bucket\":1},{\"text\":\"put\",\"bucket\":1}],\"itemIds\":[\"ena2m2boughtgroup\",\"ena2m2caughtgroup\",\"ena2m2wokegroup\",\"ena2m2putgroup\"],\"tip\":\"Toda la familia -ought/-aught suena igual. Es la única vez que el inglés te da cinco verbos por el precio de un sonido.\"},{\"id\":\"ena2m2l5e2\",\"type\":\"mc\",\"prompt\":\"La palabra más frecuente mal dicha del nivel\",\"question\":\"said suena…\",\"options\":[\"sed\",\"séid\",\"sa-íd\"],\"answer\":0,\"whyWrong\":[null,\"Se escribe con -ai- pero no se dice así: rima con bed\",\"Dos sílabas, ninguna: said es de una sola\"],\"itemIds\":[\"ena2m2shesaidsorry\"],\"tip\":\"said rima con bed, red y head. Dilo diez veces así y no volverás a la versión española.\"},{\"id\":\"ena2m2l5e3\",\"type\":\"mc\",\"prompt\":\"El verbo que cambia sin cambiar\",\"question\":\"«I read the message last night» — ¿cómo suena read aquí?\",\"options\":[\"red\",\"riid\",\"de las dos formas\"],\"answer\":0,\"whyWrong\":[null,\"«riid» es el presente; aquí last night dice que es pasado\",\"Al oído solo hay una: el pasado es red y punto\"],\"itemIds\":[\"ena2m2readred\",\"enlastnight\",\"enmessage\"],\"tip\":\"Se escribe read y suena red. Es el único verbo del idioma donde la voz es la única marca de tiempo.\"},{\"id\":\"ena2m2l5e4\",\"type\":\"audiomc\",\"prompt\":\"Dos palabras que suenan igual — 2 escuchas\",\"audio\":\"I paid for the tickets and we ate at eight.\",\"question\":\"¿A qué hora comieron?\",\"options\":[\"A las ocho\",\"A las siete\",\"No lo dice\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las siete no suena en ningún momento\",\"Sí lo dice: la segunda de las dos palabras iguales es la hora\"],\"itemIds\":[\"ena2m2ateeight\",\"ena2m2paid\"],\"tip\":\"«ate at eight» suena «éit at ÉIT». No hay forma de separarlas por el sonido: lo hace la posición en la frase, y eso es lo que entrenas aquí.\"},{\"id\":\"ena2m2l5e5\",\"type\":\"shadow\",\"prompt\":\"Sombrea la familia «-oot» — primero lento, luego a velocidad normal\",\"text\":\"I bought it, I thought about it and I brought it home.\",\"phonetic\":\"ái BOOT it, ái ZOOT a-BÁUT it and ái BROOT it jóum\",\"translation\":\"Lo compré, lo pensé y me lo traje a casa.\",\"reps\":2,\"itemIds\":[\"ena2m2boughtgroup\"],\"tip\":\"Tres «-oot» en una frase. Si te sale corrida, la familia entera está resuelta para siempre.\"},{\"id\":\"ena2m2l5e6\",\"type\":\"speak\",\"prompt\":\"Los homófonos, en voz alta\",\"text\":\"I ate at eight and I paid for everything.\",\"phonetic\":\"ái ÉIT at ÉIT and ái PÉID foo ÉV-ri-zing\",\"translation\":\"Comí a las ocho y lo pagué todo.\",\"itemIds\":[\"ena2m2ateeight\",\"ena2m2paid\"],\"tip\":\"Las dos primeras suenan idénticas y eso está bien. El inglés está lleno de pares así y nadie se pierde: lo resuelve la frase.\"},{\"id\":\"ena2m2l5e7\",\"type\":\"listen\",\"prompt\":\"Dictado — dos vocales largas\",\"text\":\"She paid and we left at eight.\",\"translation\":\"Pagó y nos fuimos a las ocho.\",\"hints\":[\"pay → p… · leave → l…\",\"She p… and we l… at eight.\"],\"itemIds\":[\"ena2m2paid\",\"ena2m2sleptgroup\",\"ena2m2ateeight\"],\"tip\":\"left acaba en el mismo grupo /ft/ que ya trabajaste con la -ed de m1. La consonante final lleva gramática: si se te cae, se cae el pasado.\"},{\"id\":\"ena2m2l5e8\",\"type\":\"match\",\"prompt\":\"Empareja cada palabra con cómo suena\",\"pairs\":[{\"target\":\"said\",\"source\":\"sed\"},{\"target\":\"read (pasado)\",\"source\":\"red\"},{\"target\":\"heard\",\"source\":\"jéed\"},{\"target\":\"ate\",\"source\":\"éit\"},{\"target\":\"paid\",\"source\":\"péid\"}],\"itemIds\":[\"ena2m2shesaidsorry\",\"ena2m2readred\",\"ena2m2heard\",\"ena2m2ateeight\",\"ena2m2paid\"],\"tip\":\"Las tres primeras son las que se leen a la española y salen mal. Las otras dos van de propina porque se escriben con -ai- y suenan «éi».\"},{\"id\":\"ena2m2l5e9\",\"type\":\"mc\",\"prompt\":\"El par que no se puede separar\",\"question\":\"ate y eight…\",\"options\":[\"suenan exactamente igual: «éit»\",\"suenan parecido pero se distinguen\",\"son la misma palabra\"],\"answer\":0,\"whyWrong\":[null,\"No hay ninguna diferencia de sonido: son homófonos perfectos\",\"Una es «comí» y la otra «ocho»: nada que ver\"],\"itemIds\":[\"ena2m2ateeight\"],\"tip\":\"En el examen, si oyes «éit» mira lo que hay alrededor: detrás de «at» es la hora; detrás de un sujeto es el verbo.\"},{\"id\":\"ena2m2l5e10\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de sonidos difíciles\",\"pairs\":[{\"target\":\"heard\",\"source\":\"oí\"},{\"target\":\"paid\",\"source\":\"pagué\"},{\"target\":\"wore\",\"source\":\"llevaba puesto\"},{\"target\":\"ate\",\"source\":\"comí\"},{\"target\":\"read\",\"source\":\"leí\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m2heard\",\"ena2m2paid\",\"ena2m2wore\",\"ena2m2ateeight\",\"ena2m2readred\"]},{\"id\":\"ena2m2l5e11\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿este pasado es de los de -ed o de los rebeldes?\",\"categories\":[\"-ed (los del módulo 1)\",\"irregular (los de este)\"],\"items\":[{\"text\":\"worked\",\"bucket\":0},{\"text\":\"went\",\"bucket\":1},{\"text\":\"watched\",\"bucket\":0},{\"text\":\"bought\",\"bucket\":1},{\"text\":\"stayed\",\"bucket\":0},{\"text\":\"slept\",\"bucket\":1}],\"itemIds\":[\"ena2m1iworked\",\"ena2m2iwenttothecinema\",\"ena2m1shewatchedafilm\",\"ena2m2boughtgroup\",\"ena2m1istayedathome\",\"ena2m2sleptgroup\"],\"tip\":\"Cuidado con slept: acaba en -t y parece una -ed disfrazada, pero es irregular. La -ed se escribe -ed siempre, aunque suene /t/.\"},{\"id\":\"ena2m2l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Comí a las ocho, pagué y me fui.\",\"answers\":[\"I ate at eight, I paid and I left.\",\"I ate at eight, paid and left.\",\"I ate at eight, I paid and left.\"],\"hints\":[\"Tres irregulares: eat, pay, leave\",\"I a… at eight, I p… and I l…\"],\"itemIds\":[\"ena2m2ateeight\",\"ena2m2paid\",\"ena2m2sleptgroup\"],\"tip\":\"Escríbelo y dilo. Los irregulares que solo se leen se olvidan; los que se dicen en voz alta se quedan.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m2-3\",\"book\":\"It cost a lot of money.\",\"real\":\"It cost a fortune.\",\"meaning\":\"Me costó un dineral / un riñón\",\"when\":\"Con amigos, contando una compra o un viaje. Es exageración amable y se usa muchísimo. En el Writing del examen vale también, pero para un texto neutro la versión del libro (it was very expensive) va más segura.\",\"register\":\"amigos\",\"note\":\"Ojo al verbo: cost no cambia en pasado. «It cost a fortune» ya es pasado — lo dice el contexto, no el verbo.\",\"sound\":\"it kost a FÓO-chun\",\"level\":\"a2\",\"itemId\":\"ena2m2putgroup\"}}],\"resources\":[{\"label\":\"BBC Learning English — pronunciación\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/pronunciation\",\"note\":\"Busca los vídeos de vocales largas y mira el de /ɔː/ (bought, thought, caught). Cinco minutos de boca valen por media hora de lista.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script>
