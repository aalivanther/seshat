es que no lo sepas: es que aún no es automático, y eso se arregla con kilometraje.\u003cbr/\u003e\u003cbr/\u003eTres colocaciones para el monólogo, que valen para cualquier tema: \u003cb\u003ekeep up with the news\u003c/b\u003e (estar al día), \u003cb\u003emake up your own mind\u003c/b\u003e (formarte tu opinión) y \u003cb\u003edouble-check\u003c/b\u003e (comprobar dos veces)."])</script><script>self.__next_f.push([1,"18:T610,"])</script><script>self.__next_f.push([1,"Have you seen the thing about the swimming pool?|The one that's being closed? It was all over my feed last night.|That's the point. It isn't being closed. What was published on Monday is that the council has been asked to look at the running costs.|Somebody put up a photo of a padlock on the gate.|The photo is real. It was taken in February, when the boiler broke, and it was posted again on Sunday with no date on it. Nine thousand shares by Monday morning.|How do you know when it was taken?|Because I'm nosy and it took me four minutes. The same photo was used by the local paper in February, with a caption. The article is still online.|Right, so somebody is making it up.|I wouldn't go that far. I think somebody was worried, found an old picture and didn't check. That is not the same as inventing it.|It has the same effect, though.|It does. And here's the bit that annoys me. The council was asked for a comment and said, and I am reading it out, 'no decision has been taken at this stage'. That sentence is designed to sound like nothing.|It does sound like nothing.|It's a passive with no agent. Who has been asked? Who would take the decision? Neither of those is written down anywhere.|So they are hiding something.|Or they haven't decided. And that's what I mean about facts and opinions. 'No decision has been taken' is a fact. 'They're closing the pool' is an opinion. 'They're hiding something' is a third thing, and that one is a suspicion.|You have been reading too many newspapers.|I work in a library. It' ebruary, with a caption. The article is still online.|Right, so somebody is making it up.|I wouldn't go that far. I think somebody was worried, found an old picture and didn't check. That is not the same as inventing it.|It has the same effect, though.|It does. And here's the bit that annoys me. The council was asked for a comment and said, and I am reading it out, 'no decision has been taken at this stage'. That sentence is designed to sound like nothing.|It does sound like nothing.|It's a passive with no agent. Who has been asked? Who would take the decision? Neither of those is written down anywhere.|So they are hiding something.|Or they haven't decided. And that's what I mean about facts and opinions. 'No decision has been taken' is a fact. 'They're closing the pool' is an opinion. 'They're hiding something' is a third thing, and that one is a suspicion.|You have been reading too many newspapers.|I work in a library. It's an occupational hazard."])</script><script>self.__next_f.push([1,"1c:T610,"])</script><script>self.__next_f.push([1,"Have you seen the thing about the swimming pool?|The one that's being closed? It was all over my feed last night.|That's the point. It isn't being closed. What was published on Monday is that the council has been asked to look at the running costs.|Somebody put up a photo of a padlock on the gate.|The photo is real. It was taken in February, when the boiler broke, and it was posted again on Sunday with no date on it. Nine thousand shares by Monday morning.|How do you know when it was taken?|Because I'm nosy and it took me four minutes. The same photo was used by the local paper in February, with a caption. The article is still online.|Right, so somebody is making it up.|I wouldn't go that far. I think somebody was worried, found an old picture and didn't check. That is not the same as inventing it.|It has the same effect, though.|It does. And here's the bit that annoys me. The council was asked for a comment and said, and I am reading it out, 'no decision has been taken at this stage'. That sentence is designed to sound like nothing.|It does sound like nothing.|It's a passive with no agent. Who has been asked? Who would take the decision? Neither of those is written down anywhere.|So they are hiding something.|Or they haven't decided. And that's what I mean about facts and opinions. 'No decision has been taken' is a fact. 'They're closing the pool' is an opinion. 'They're hiding something' is a third thing, and that one is a suspicion.|You have been reading too many newspapers.|I work in a library. It's an occupational hazard."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l9\",\"phaseId\":\"enb1m4\",\"title\":\"All in all\",\"subtitle\":\"La espiral del nivel y tu monólogo de minuto y medio\",\"minutes\":24,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas del cierre\",\"itemIds\":[\"enb1m4allinall\",\"enb1m4keepupwith\",\"enb1m4makeupyourmind\",\"enb1m4doublecheck\",\"enb1m4thewholestory\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se cierra un monólogo de B1 (y por qué el cierre puntúa)\",\"body\":\"$17\",\"table\":[[\"Movimiento\",\"Fórmula\",\"Qué puntúa\"],[\"1. Anuncia\",\"I'd like to talk about… I'll say three things.\",\"estructura visible\"],[\"2. Los hechos\",\"It was posted in March and shared two thousand times.\",\"concreción\"],[\"3. El contraste\",\"At first… On the other hand…\",\"cohesión\"],[\"4. El cierre\",\"All in all, … / To sum up, …\",\"cerrar, no apagarse\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l9e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del cierre\",\"pairs\":[{\"target\":\"All in all, it was a fair article.\",\"source\":\"En conjunto, era un artículo justo.\"},{\"target\":\"I keep up with the news online.\",\"source\":\"Me mantengo al día de las noticias por internet.\"},{\"target\":\"You have to make up your own mind.\",\"source\":\"Tienes que formarte tu propia opinión.\"},{\"target\":\"That's not the whole story.\",\"source\":\"Eso no es toda la historia.\"}],\"itemIds\":[\"enb1m4allinall\",\"enb1m4keepupwith\",\"enb1m4makeupyourmind\",\"enb1m4thewholestory\"],\"tip\":\"«All in all» y «to sum up» son intercambiables al cerrar. La primera suena más hablada; la segunda, más de presentación. Las dos avisan al examinador de que vas a terminar.\"},{\"id\":\"enb1m4l9e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — todo esto es de los módulos 1 y 2\",\"pairs\":[{\"target\":\"It depends on the landlord.\",\"source\":\"Depende del casero.\"},{\"target\":\"the job I applied for\",\"source\":\"el trabajo al que me presenté\"},{\"target\":\"I'm good at dealing with people.\",\"source\":\"Se me da bien tratar con la gente.\"},{\"target\":\"so far\",\"source\":\"hasta ahora\"},{\"target\":\"At least the hours suit me.\",\"source\":\"Al menos el horario me viene bien.\"}],\"targetSeconds\":26,\"itemIds\":[\"enb1m1dependon\",\"enb1m2jobiappliedfor\",\"enb1m2goodat\",\"enb1m1sofar\",\"enb1m2atleast\"],\"tip\":\"Rección, relativo omitido, colocación y conector, todo en veintiséis segundos. Si sale rápido es que ya es tuyo; si tropiezas, ahí tienes el repaso de esta semana.\"},{\"id\":\"enb1m4l9e3\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"I keep up ___ the news online, but I don't read a paper.\",\"answers\":[\"with\"],\"translation\":\"Me mantengo al día de las noticias por internet, pero no leo periódico.\",\"hints\":[\"Cuatro letras\",\"keep up + ...\"],\"itemIds\":[\"enb1m4keepupwith\"],\"tip\":\"«keep up with» son tres piezas que van juntas: mantenerse a la altura de algo que avanza — las noticias, un amigo que anda rápido, el temario.\"},{\"id\":\"enb1m4l9e4\",\"type\":\"errorfix\",\"prompt\":\"Espiral del módulo 1 — arréglalo.\",\"wrong\":\"I work at the library since May.\",\"answers\":[\"I have worked at the library since May.\"],\"why\":\"«since» abre un periodo que llega hasta hoy y eso pide present perfect. El presente inglés significa «en general», no «desde entonces».\",\"translation\":\"Trabajo en la biblioteca desde mayo.\",\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1beenworking\"]},{\"id\":\"enb1m4l9e5\",\"type\":\"transform\",\"prompt\":\"Espiral del módulo 2 — mete la información en una relativa\",\"source\":\"The photo was taken in Leeds. It was shared two thousand times.\",\"instruction\":\"Únelas con una relativa explicativa (con comas)\",\"answers\":[\"The photo, which was taken in Leeds, was shared two thousand times\",\"The photo, which was taken in Leeds, was shared two thousand times.\"],\"translation\":\"La foto, que estaba hecha en Leeds, se compartió dos mil veces.\",\"hints\":[\"La explicativa va entre comas y con «which»\",\"The photo, which was ... in Leeds, was shared ...\"],\"itemIds\":[\"enb1m2cafewhichopened\",\"enb1m4wasshared\"],\"tip\":\"Relativa explicativa + pasiva dentro: dos estructuras del nivel en una frase. Eso es «range of grammar» y es un criterio entero del Writing.\"},{\"id\":\"enb1m4l9e6\",\"type\":\"gapbank\",\"prompt\":\"Espiral — cuatro huecos de los tres módulos\",\"text\":\"I've been working at the library ___ May, and the story I heard yesterday ___ come from a screenshot, like most of them. Last week a photo ___ shared two thousand times before anybody checked ___ it came from.\",\"answers\":[\"since\",\"has\",\"was\",\"where\"],\"bank\":[\"since\",\"has\",\"was\",\"where\",\"for\",\"have\",\"when\"],\"translation\":\"Llevo trabajando en la biblioteca desde mayo, y la historia que oí ayer viene de una captura de pantalla, como casi todas. La semana pasada una foto se compartió dos mil veces antes de que nadie comprobara de dónde salía.\",\"itemIds\":[\"enb1m1beenworking\",\"enb1m4wasshared\",\"enb1m1havelivedhere\",\"enb1m4doublecheck\"],\"tip\":\"For/since, present perfect, pasiva y una interrogativa indirecta metida al final: los cuatro huecos son de cuatro módulos distintos. Así se mide de verdad si el nivel está asentado.\"},{\"id\":\"enb1m4l9e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «all in all»\",\"source\":\"All in all, it was a fair article.\",\"forbid\":[\"all\"],\"answers\":[\"To sum up, it was a fair article\",\"On the whole, it was a fair article\",\"To sum up, it was a fair article.\"],\"translation\":\"En conjunto, era un artículo justo.\",\"hints\":[\"Dos palabras que anuncian un resumen\",\"To sum ..., it was a fair article\"],\"itemIds\":[\"enb1m4allinall\"],\"tip\":\"Ten dos cierres preparados y usa el que te salga primero. Lo que puntúa no es cuál elijas: es que haya cierre.\"},{\"id\":\"enb1m4l9e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu frase de cierre del monólogo\",\"text\":\"All in all, I keep up with the news online, but I always double-check before I share anything.\",\"phonetic\":\"ool in ool, ai kiip ap uid de niúus̬ on-LÁIN, bat ai ÓOL-ueis̬ DA-bol-CHEK bi-FÓO ai shéa É-ni-zing\",\"translation\":\"En conjunto, me mantengo al día por internet, pero siempre compruebo dos veces antes de compartir nada.\",\"itemIds\":[\"enb1m4allinall\",\"enb1m4keepupwith\",\"enb1m4doublecheck\"],\"tip\":\"Fíjate en «before I share», presente. Después de «before» el inglés no pone futuro nunca, y el español sí: «antes de que lo comparta». Es la trampa 11 del nivel, y aquí cae de rebote.\"},{\"id\":\"enb1m4l9e9\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"Something I read or saw online that turned out not to be true\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about a story I saw online. I'll say three things.»\"},{\"title\":\"2. What it said\",\"hint\":\"Cuenta la historia en pasiva, con un dato concreto: «It was posted in… It was shared… The photo was taken in…»\"},{\"title\":\"3. How you found out\",\"hint\":\"Di cómo se supo: «Then it was shown that… On the other hand, nobody…»\"},{\"title\":\"4. Close\",\"hint\":\"Cierra con una valoración: «All in all, … / To sum up, I always double-check before…»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Di un dato concreto: una fecha, una cifra o un sitio\",\"Usé al menos cuatro pasivas (was posted / was shared / has been decided…)\",\"Usé al menos dos conectores distintos (in addition, on the other hand, although)\",\"Cerré con «All in all» o «To sum up» y no me apagué a media idea\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «Last March a photo of my library was posted on a local page at three in the morning. It was shared two thousand times in one day, and it was said that the building would close. In fact the photo was taken in another city in 2019, and nothing had been decided at all.»\",\"itemIds\":[\"enb1m4wasposted\",\"enb1m4wasshared\",\"enb1m4itissaidthat\",\"enb1m4allinall\",\"enb1m4ontheotherhand\"],\"tip\":\"Treinta segundos de planificación no son para escribir el discurso: son para decidir el ORDEN. Y con este tema tienes ventaja — la pasiva sale sola, porque en internet nunca se sabe quién.\"},{\"id\":\"enb1m4l9e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Tienes que formarte tu propia opinión.\",\"answers\":[\"You have to make up your own mind\",\"You have to make up your own mind.\",\"You've got to make up your own mind\"],\"hint\":\"«opinión» aquí no se dice con «opinion»: es una expresión con «mind»\",\"itemIds\":[\"enb1m4makeupyourmind\"],\"tip\":\"«make up your mind» es decidirse; con «own» dentro es formarte tu propio juicio. Y ojo: «make up» también es inventarse algo. La partícula manda más que el verbo.\"},{\"id\":\"enb1m4l9e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"That's not the whole story, and it never is.\",\"answers\":[\"Eso no es toda la historia, y nunca lo es\",\"Esa no es toda la historia, y nunca lo es\"],\"itemIds\":[\"enb1m4thewholestory\"],\"tip\":\"«the whole story» es la historia completa, con lo que falta. Es lo que dices cuando algo es verdad pero se ha quedado corto — hermana mayor de «misleading».\"},{\"id\":\"enb1m4l9e12\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen. Dos escuchas.\",\"audio\":\"How's the library going?|Good, actually. I've been there since May and I've just been given the Saturday desk on my own.|That's a promotion in everything but name.|Hardly. But the correction was printed last week, so the whole thing is over, and about forty people came to the meeting because of it. All in all, it's been a strange month.\",\"question\":\"¿Qué le ha pasado a Valeria en la biblioteca?\",\"options\":[\"Le han dado el mostrador de los sábados\",\"Le han subido el sueldo\",\"La han cambiado de biblioteca\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La otra voz lo llama ascenso «en todo menos en el nombre», y ella lo niega: de dinero no se habla.\",\"No se dice nada de cambiar de sitio: sigue en la misma.\"],\"itemIds\":[\"enb1m4allinall\",\"enb1m1beenworking\",\"enb1m4hasjustbeenpublished\"],\"tip\":\"«I've just been given…» es perfecto en pasiva con la persona de sujeto, que es la forma más frecuente en el habla y la que menos se practica. Y el cierre, «all in all», te lo acabas de aprender.\"},{\"id\":\"enb1m4l9e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En conjunto, se ha compartido demasiado y se ha comprobado demasiado poco.\",\"answers\":[\"All in all, too much has been shared and too little has been checked\",\"All in all, too much has been shared and too little checked\",\"To sum up, too much has been shared and too little has been checked\"],\"hints\":[\"Empieza por el cierre y sigue con dos perfectos en pasiva\",\"All in all, too much has been ... and too little has been ...\"],\"itemIds\":[\"enb1m4allinall\",\"enb1m4wasshared\",\"enb1m4doublecheck\"],\"tip\":\"Dos perfectos en pasiva y un cierre, en una frase. Si te ha salido, el módulo está hecho: eso es exactamente lo que venía a enseñarte.\"},{\"id\":\"enb1m4l9e14\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, cinco preguntas. Léelas TODAS antes del play y usa el cuaderno. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Qué se publicó el lunes en realidad?\",\"options\":[\"Que se ha pedido al ayuntamiento que revise los costes de mantenimiento\",\"Que la piscina se cierra\",\"Que la caldera se rompió en febrero\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Eso es lo que circula por las redes. La frase del audio es tajante: «It isn't being closed».\",\"Lo de la caldera es de febrero y explica la foto, no la noticia del lunes.\"],\"itemIds\":[\"enb1m4waspublished\",\"enb1m4council\",\"enb1m4hasbeenclosed\"],\"tip\":\"Fíjate en la forma verbal: «has been ASKED to look at the running costs». Pedir que se estudie algo y decidirlo son dos cosas distintas, y toda la confusión del audio cabe en esa diferencia.\"},{\"id\":\"enb1m4l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: qué pasa con la foto.\",\"audio\":\"$19\",\"question\":\"¿Qué problema tiene la foto del candado?\",\"options\":[\"Es auténtica, pero es de febrero y se volvió a publicar sin fecha\",\"Es un montaje hecho con el móvil\",\"La hizo el periódico local el domingo\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice literalmente «the photo is real». El problema no es la foto: es cuándo se hizo.\",\"El periódico la usó en febrero, con pie de foto. Quien la volvió a publicar el domingo fue otra persona.\"],\"itemIds\":[\"enb1m4wasposted\",\"enb1m4screenshot\",\"enb1m4doublecheck\"],\"tip\":\"Una foto auténtica fuera de fecha engaña más que una falsa, porque aguanta cualquier comprobación menos la única que importa. En el examen esto se llama «distinguir hecho de opinión»; en la calle se llama mirar el pie de foto.\"},{\"id\":\"enb1m4l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: el dato que había que apuntar.\",\"audio\":\"$1a\",\"question\":\"¿Cuántas veces se había compartido el lunes por la mañana?\",\"options\":[\"Nueve mil\",\"Cuatro mil\",\"Diecinueve mil\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Cuatro son los MINUTOS que tardó en comprobarlo. El audio pone dos cifras seguidas para ver si las separas.\",\"«Nine thousand» y «nineteen thousand» se diferencian en la sílaba acentuada, no en el final.\"],\"itemIds\":[\"enb1m4wasshared\",\"enb1m4wentviral\"],\"tip\":\"Un audio de examen mete siempre más números de los que pregunta. Apúntalos todos con una palabra al lado —«minutos», «compartidos»— y no tendrás que elegir de memoria.\"},{\"id\":\"enb1m4l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: la frase del ayuntamiento.\",\"audio\":\"$1b\",\"question\":\"¿Qué le reprocha a la frase «no decision has been taken at this stage»?\",\"options\":[\"Que es una pasiva sin agente: no dice quién\",\"Que es mentira\",\"Que la escribió el periódico local\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"No dice que sea mentira: dice que puede ser verdad y aun así no informar de nada.\",\"La frase es del ayuntamiento, en respuesta a una petición de comentario.\"],\"itemIds\":[\"enb1m4nobodyknows\",\"enb1m4itissaidthat\",\"enb1m4misleading\"],\"tip\":\"Aquí está el módulo entero en una frase: la pasiva sin agente no es un adorno de estilo, es una decisión sobre qué información NO se da. Y en el Reading Part 4 a veces te preguntan justamente por lo que la pasiva ha borrado.\"},{\"id\":\"enb1m4l9e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5, y no se contesta con una palabra oída.\",\"audio\":\"$1c\",\"question\":\"¿Qué tres cosas distingue al final?\",\"options\":[\"Un hecho, una opinión y una sospecha\",\"El periódico local y las redes sociales\",\"Lo que el ayuntamiento dice y lo que el ayuntamiento hace\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Los dos aparecen, pero la clasificación del final no va de soportes: va de tres frases y del estatus de cada una.\",\"Del ayuntamiento se dice justamente que no se sabe qué va a hacer: esa es la sospecha, no la conclusión.\"],\"itemIds\":[\"enb1m4factoropinion\",\"enb1m4evidence\",\"enb1m4makeupyourmind\"],\"tip\":\"Hecho, opinión y sospecha son tres cosas y en español las decimos casi igual. Separarlas es lo que el Listening Part 4 mide con nombre propio: «distinguishing fact from opinion».\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1d\",\"6\",{}]]\n"])</script></body></html>
