ote\":{\"title\":\"El Part 3 de B2 es la novedad más grande del oral\",\"body\":\"En B1 el apoyo eran \u003cb\u003eimágenes\u003c/b\u003e y el objetivo era «un intento de acuerdo». En B2 el apoyo es un [[written prompt|enunciado escrito]], el interlocutor te da \u003cb\u003eveinte segundos\u003c/b\u003e («Take twenty seconds to think») y dice: [[I have some different ideas|Yo tengo otras ideas]]. El desacuerdo está diseñado. El objetivo sube a [[a plan or arrangement|un plan o un acuerdo]]. Si conversas bien y no cierras, has hecho un B1 largo.\u003cbr/\u003e\u003cbr/\u003eEl Listening Part 2 es el gemelo receptivo: \u003cb\u003etres conversaciones\u003c/b\u003e, dos preguntas de test cada una — tema, propósito, roles, actitudes, opiniones. Todo se oye dos veces. La pregunta se lee ANTES. Lo que se entrena aquí es oír la postura, no la palabra.\",\"table\":[[\"\",\"B1\",\"B2\"],[\"Apoyo\",\"fotos\",\"texto escrito\"],[\"Preparación\",\"ninguna\",\"20 segundos\"],[\"Objetivo\",\"intento de acuerdo\",\"plan o acuerdo\"],[\"El interlocutor\",\"comenta\",\"«I have some different ideas»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m11l10e1\",\"type\":\"mc\",\"prompt\":\"El cambio de naturaleza\",\"question\":\"En el Speaking Part 3 del B2, lo que cambia de verdad respecto al B1 es…\",\"options\":[\"El apoyo es un texto, hay 20 segundos, y hay que salir con un plan.\",\"Dura el doble y se hace en pareja, como Cambridge.\",\"Ya no hay que hablar con el interlocutor: se graba un monólogo.\"],\"answer\":0,\"whyWrong\":[null,\"Sigue siendo individual, 3 minutos. Cambridge es otra pareja.\",\"El Part 4 es el monólogo. El 3 es negociación.\"],\"itemIds\":[\"enb2m11awrittenprompt\",\"enb2m11aplanorarrangement\",\"enb2m11twentysecondstothink\"]},{\"id\":\"enb2m11l10e2\",\"type\":\"mc\",\"prompt\":\"El desacuerdo diseñado\",\"question\":\"El interlocutor dice «I have some different ideas.» Eso significa…\",\"options\":[\"Que tienes que rechazar o ceder con alternativa, no sonreír y decir yes a todo.\",\"Que te has equivocado de tema y hay que empezar otra vez.\",\"Que la parte se acaba y pasas al Part 4.\"],\"answer\":0,\"whyWrong\":[null,\"Es el diseño de la tarea, no un error tuyo.\",\"El Part 3 dura sus tres minutos. El desacuerdo es el material.\"],\"itemIds\":[\"enb2m11ihavesomedifferentideas\",\"enb2m11rejectwithanalternative\"]},{\"id\":\"enb2m11l10e3\",\"type\":\"order\",\"prompt\":\"Los cuatro movimientos del Part 3, con el reloj\",\"sentences\":[\"Tomas veinte segundos y lees el prompt: marcas dos ideas tuyas y una que vas a ceder.\",\"Propones. El interlocutor dice que tiene otras.\",\"Rechazas CON alternativa: I'd rather we didn't… What if we…?\",\"Cierras: Shall we agree on…? y nombras el plan en una frase.\"],\"itemIds\":[\"enb2m11twentysecondstothink\",\"enb2m11shallweagreeon\",\"enb2m11rejectwithanalternative\"]},{\"id\":\"enb2m11l10e4\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 2, conversación 1. Actitud. Pregunta ANTES. Dos escuchas.\",\"plays\":2,\"audio\":\"We could put it all on the lift.|I see it rather differently. Nora would love that, but the boiler dies every January.|So you want the boring thing.|I want the thing that keeps the garden from freezing. What if we split it?|Fine. Boring and split. Let's call it.\",\"question\":\"¿Qué actitud tiene el segundo hablante hacia «gastarlo todo en el ascensor»?\",\"options\":[\"Lo rechaza con una razón y ofrece partir.\",\"Lo acepta para no discutir.\",\"No ha entendido la propuesta.\"],\"answer\":0,\"whyWrong\":[null,\"Fine. Boring and split cierra el SPLIT, no el lift entero.\",\"What if we split it es entenderlo y desviarlo.\"],\"itemIds\":[\"enb2m11iseeitratherdifferently\",\"enb2m11whatifwesplits\"]},{\"id\":\"enb2m11l10e5\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 2, conversación 2. Relación entre hablantes. Pregunta ANTES.\",\"plays\":2,\"audio\":\"Tomasz, you're minuting this, not deciding it.|I'm minuting that the boiler failed twice.|That's a decision dressed as a fact.|It's a fact dressed as a sentence. Shall we agree on a date for the lift, at least?|Put the date in. Then I can live with the boiler.\",\"question\":\"¿Qué relación hay entre los dos, y en qué quedan?\",\"options\":[\"Colegas de junta; discrepan del rol, y quedan en una fecha para el ascensor más la caldera.\",\"Jefe y empleado: Tomasz obedece.\",\"Desconocidos que se acaban de conocer en el portal.\"],\"answer\":0,\"whyWrong\":[null,\"You're minuting this, not deciding it es igual a igual, no jerarquía.\",\"Se tratan por el nombre y por el acta: son vecinos de junta.\"],\"itemIds\":[\"enb2m11shallweagreeon\",\"enb2m11theresidentsmeeting\"]},{\"id\":\"enb2m11l10e6\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 2, conversación 3. Propósito. Pregunta ANTES.\",\"plays\":2,\"audio\":\"I'm your new neighbour. I start: hello, I've just moved in, is there a residents' meeting?|There is. Friday. Bring ideas, they fight.|I wanted to ask about the garden. It's locked.|It's locked because of the boiler. It's also locked because nobody has agreed. Come on Friday. We might actually agree on something this time.\",\"question\":\"¿Para qué llama el primero, y qué le contesta el segundo de verdad?\",\"options\":[\"Para informarse de la junta y del jardín; el segundo le avisa de que el tema es un desacuerdo, no una llave.\",\"Para alquilar el trastero de las bicis.\",\"Para quejarse de Tomasz en concreto.\"],\"answer\":0,\"whyWrong\":[null,\"No menciona las bicis.\",\"Tomasz no sale. Sale nobody has agreed.\"],\"itemIds\":[\"enb2m11thecommunalgarden\",\"enb2m11theresidentsmeeting\"]},{\"id\":\"enb2m11l10e7\",\"type\":\"gapbank\",\"prompt\":\"El mapa del Part 3, para el día D\",\"text\":\"You get a written ___ and twenty seconds to think. The examiner has some different ___. Reject with an ___, then leave with a plan or ___.\",\"answers\":[\"prompt\",\"ideas\",\"alternative\",\"arrangement\"],\"bank\":[\"prompt\",\"ideas\",\"alternative\",\"arrangement\",\"photos\",\"grades\",\"complaint\",\"essay\"],\"itemIds\":[\"enb2m11awrittenprompt\",\"enb2m11ihavesomedifferentideas\",\"enb2m11rejectwithanalternative\",\"enb2m11aplanorarrangement\"]},{\"id\":\"enb2m11l10e8\",\"type\":\"mc\",\"prompt\":\"Si se acaba el tiempo y no has cerrado\",\"question\":\"El Part 3 se acaba y no habéis dicho el plan. ¿Qué ha pasado?\",\"options\":[\"Has hecho un B1: conversar. El B2 cobra el cierre. Practica la frase de Shall we agree on… hasta que salga sola.\",\"No pasa nada: el interlocutor cierra por ti y no cuenta.\",\"Te bajan pronunciación, que es el criterio de los silencios.\"],\"answer\":0,\"whyWrong\":[null,\"El interlocutor no te regala el acuerdo. Es tu tarea.\",\"El silencio largo toca fluidez, pero aquí el agujero es de tarea: no hay plan.\"],\"itemIds\":[\"enb2m11shallweagreeon\",\"enb2m11aplanorarrangement\"]}]}],\"resources\":[{\"label\":\"LanguageCert — B2 Communicator, Spoken Practice Paper 1\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b2-communicator-1288\",\"note\":\"Lee solo el Part 3: el texto escrito, los veinte segundos, y la frase I have some different ideas. Cronometra una negociación de tres minutos con esa hoja. Si al sonar el tiempo no hay plan, repite.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idio
