003ewas\u003c/b\u003e mich stört\u003c/i\u003e · \u003ci\u003ealles, \u003cb\u003ewas\u003c/b\u003e …\u003c/i\u003e. No das.\u003cbr/\u003e4. \u003cb\u003ewo(r)- + preposición\u003c/b\u003e cuando el antecedente es una cosa o una frase: \u003ci\u003ewofür ich mich interessiere\u003c/i\u003e. Con persona, preposición + dem/der.\",\"table\":[[\"antecedente\",\"relativo\"],[\"der Kollege + mit\",\"mit dem\"],[\"der Student (m) + cuyo\",\"dessen\"],[\"die Studentin / plural + cuyo\",\"deren\"],[\"das / alles / algo dicho + que\",\"was\"],[\"cosa + für\",\"wofür\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m4l4e1\",\"type\":\"cloze\",\"prompt\":\"Preposición + relativo\",\"text\":\"Das ist der Kollege, mit ___ ich die Hausarbeit schreibe.\",\"answers\":[\"dem\"],\"translation\":\"Ese es el compañero con el que escribo el trabajo.\",\"itemIds\":[\"b2m4mitdem\",\"b2m4hausarbeit\",\"a2m10kollege\"]},{\"id\":\"b2m4l4e2\",\"type\":\"bucket\",\"prompt\":\"dessen o deren\",\"categories\":[\"dessen (m / nt)\",\"deren (f / pl)\"],\"items\":[{\"text\":\"der Student, ___ Hausarbeit ich lese\",\"bucket\":0},{\"text\":\"die Studentin, ___ Referat überzeugt\",\"bucket\":1},{\"text\":\"das Seminar, ___ Teilnehmer fehlen\",\"bucket\":0},{\"text\":\"die Kollegen, ___ Fristen enden\",\"bucket\":1},{\"text\":\"der Professor, ___ Sprechstunde voll ist\",\"bucket\":0},{\"text\":\"die Ordnung, ___ Regeln gelten\",\"bucket\":1}],\"itemIds\":[\"b2m4dessen\",\"b2m4deren\"]},{\"id\":\"b2m4l4e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"das Problem, das was mich stört\",\"answers\":[\"das Problem, das mich stört\",\"das, was mich stört\"],\"why\":\"O bien hay un sustantivo (das Problem, das …) o bien un pronombre (das, was …). Las dos juntas son el calco de «lo que que».\",\"itemIds\":[\"b2m4daswas\"]},{\"id\":\"b2m4l4e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"der Student, dass
