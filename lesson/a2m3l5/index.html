c/i\u003e. \u003cb\u003evor + tiempo\u003c/b\u003e = hace: \u003ci\u003evor zehn Jahren\u003c/i\u003e = hace diez años. Y \u003cb\u003edamals\u003c/b\u003e = entonces, en aquella época — el comodín nostálgico: \u003ci\u003eDamals hatten wir kein Auto.\u003c/i\u003e Los hitos que van con ellas usan sein, porque todos son movimiento o cambio de estado: \u003ci\u003eIch \u003cb\u003ebin\u003c/b\u003e in Guadalajara \u003cb\u003egeboren\u003c/b\u003e\u003c/i\u003e (nacido), \u003ci\u003eMit sechs Jahren \u003cb\u003ebin\u003c/b\u003e ich in die Schule \u003cb\u003egekommen\u003c/b\u003e\u003c/i\u003e (empecé el colegio), \u003ci\u003eVor zehn Jahren \u003cb\u003ebin\u003c/b\u003e ich nach Berlin \u003cb\u003eumgezogen\u003c/b\u003e\u003c/i\u003e (umziehen = mudarse, separable). Y como siempre: la marca abre la frase → el verbo 2º, el sujeto 3º.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m3l5e1\",\"type\":\"match\",\"prompt\":\"Empareja las marcas del tiempo\",\"pairs\":[{\"target\":\"mit sechs Jahren\",\"source\":\"a los seis años\"},{\"target\":\"vor zehn Jahren\",\"source\":\"hace diez años\"},{\"target\":\"damals\",\"source\":\"entonces / en aquella época\"},{\"target\":\"letztes Jahr\",\"source\":\"el año pasado\"}],\"itemIds\":[\"a2m3mitsechsjahren\",\"a2m3vorzehnjahren\",\"a2m3damals\",\"a2m2letztesjahr\"]},{\"id\":\"a2m3l5e2\",\"type\":\"mc\",\"prompt\":\"Caza el calco del español\",\"question\":\"«A los seis años» →\",\"options\":[\"mit sechs Jahren\",\"in sechs Jahren\",\"vor sechs Jahren\"],\"answer\":0,\"whyWrong\":[null,\"in sechs Jahren = DENTRO de seis años (futuro)\",\"vor sechs Jahren = HACE seis años\"],\"itemIds\":[\"a2m3mitsechsjahren\"],\"tip\":\"El alemán dice la edad CON: mit sechs Jahren. mit/vor/in cambian el sentido por completo — elige bien la puerta.\"},{\"id\":\"a2m3l5e3\",\"type\":\"cloze\",\"prompt\":\"Completa el primer hito de toda biografía\",\"text\":\"Ich bin in Guadalajara ___. (nacido)\",\"answers\":[\"geboren\"],\"translation\":\"Nací en Guadalajara.\",\"hints\":[\"Con sein, como todo cambio de estado\",\"ge-boren\"],\"itemIds\":[\"a2m3geboren\"],\"tip\":\"Ich bin ... geboren — el chunk se aprende entero. Nacer es EL cambio de estado por excelencia.\"},{\"id\":\"a2m3l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa la marca del «hace»\",\"text\":\"___ zehn Jahren bin ich nach Berlin umgezogen. (hace)\",\"answers\":[\"Vor\"],\"translation\":\"Hace diez años me mudé a Berlín.\",\"hints\":[\"La preposición del «hace» alemán\",\"V-o-r, con mayúscula: abre la frase\"],\"itemIds\":[\"a2m3vorzehnjahren\",\"a2m3umgezogen\"]},{\"id\":\"a2m3l5e5\",\"type\":\"mc\",\"prompt\":\"¿haben o sein?\",\"question\":\"Wir ___ vor zwei Jahren umgezogen.\",\"options\":[\"haben\",\"sind\"],\"answer\":1,\"whyWrong\":[\"Mudarse te lleva de una casa a otra — cambio de lugar y de vida: sein\",null],\"itemIds\":[\"a2m3umgezogen\",\"a2m3vorzehnjahren\"],\"tip\":\"umziehen va con sein, como fahren y kommen. Y es separable: um-ge-zogen en el participio.\"},{\"id\":\"a2m3l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa el comodín nostálgico\",\"text\":\"___ hatten wir kein Auto. (entonces)\",\"answers\":[\"Damals\"],\"translation\":\"Entonces no teníamos coche.\",\"hints\":[\"La palabra de los abuelos para «en aquella época»\",\"Da-mals, con mayúscula: abre la frase\"],\"itemIds\":[\"a2m3damals\",\"auto\",\"ichhattekeinezeit\"],\"tip\":\"damals + hatten: la fórmula de todo recuerdo. Fíjate: hatten 2º, wir 3º — la inversión no descansa.\"},{\"id\":\"a2m3l5e7\",\"type\":\"build\",\"prompt\":\"Construye el hito escolar — las dos posiciones valen\",\"target\":\"Mit sechs Jahren bin ich in die Schule gekommen\",\"translation\":\"A los seis años empecé el colegio\",\"altTargets\":[\"Ich bin mit sechs Jahren in die Schule gekommen\"],\"distractors\":[\"habe\",\"komme\"],\"itemIds\":[\"a2m3binschulegekommen\",\"a2m3mitsechsjahren\",\"a2m3schule\",\"gekommen\"],\"tip\":\"in die Schule kommen = empezar el colegio (lit. «llegar a la escuela»). Movimiento → sein.\"},{\"id\":\"a2m3l5e8\",\"type\":\"order\",\"prompt\":\"Ordena la biografía completa — las marcas mandan\",\"sentences\":[\"Ich bin in Guadalajara geboren.\",\"Mit sechs Jahren bin ich in die Grundschule gekommen.\",\"Mit zwölf Jahren bin ich aufs Gymnasium gekommen.\",\"Vor zehn Jahren bin ich nach Berlin umgezogen.\",\"Jetzt lerne ich Deutsch.\"],\"translation\":\"Nací en Guadalajara. A los seis años empecé la primaria. A los doce pasé al instituto. Hace diez años me mudé a Berlín. Ahora estudio alemán.\",\"hints\":[\"Primero se nace — y las edades ordenan el resto: 6 → 12 → hace diez años → ahora\",\"jetzt cierra la historia en el presente\"],\"itemIds\":[\"a2m3geboren\",\"a2m3mitsechsjahren\",\"a2m3grundschule\",\"a2m3gymnasium\",\"a2m3vorzehnjahren\",\"a2m3umgezogen\",\"jetzt\"],\"tip\":\"Cinco frases, cinco marcas — y una vida entera contada. Esta es la biografía-molde del examen A2.\"},{\"id\":\"a2m3l5e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el hito de la mudanza\",\"text\":\"Vor zehn Jahren bin ich nach Berlin umgezogen\",\"translation\":\"Hace diez años me mudé a Berlín\",\"hints\":[\"Vor ... Jahren abre → bin 2º\",\"um-ge-zogen, todo junto al final\"],\"itemIds\":[\"a2m3vorzehnjahren\",\"a2m3umgezogen\"]},{\"id\":\"a2m3l5e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Hace diez años me mudé a Berlín\",\"answers\":[\"Vor zehn Jahren bin ich nach Berlin umgezogen\",\"Ich bin vor zehn Jahren nach Berlin umgezogen\"],\"hints\":[\"vor = hace · umziehen con sein\",\"Vor zehn Jahren bin ich ... umgezogen\"],\"itemIds\":[\"a2m3vorzehnjahren\",\"a2m3umgezogen\"],\"tip\":\"Marca + sein + umgezogen: el hito adulto de tu biografía. Ya tienes nacimiento, escuela y mudanza — casi toda tu historia.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «Lebenslauf» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Los personajes cuentan su vida con estas marcas exactas — mit, vor y
