sa, viven juntos.\"},{\"id\":\"ena2m12l3e3\",\"type\":\"audiomc\",\"prompt\":\"Parte 3: la actitud (esto es nuevo del A2) — 2 escuchas\",\"audio\":\"I waited forty minutes and nobody came to the table. In the end we left. | Forty minutes? | Forty. And the place was half empty.\",\"question\":\"¿Cómo se siente el primer hablante?\",\"options\":[\"Molesto\",\"Sorprendido\",\"Encantado\"],\"answer\":0,\"whyWrong\":[null,\"El sorprendido es el segundo hablante, el que repite «Forty minutes?»\",\"Nadie que se marcha de un sitio está encantado con él\"],\"itemIds\":[\"ena2m5excusemethisiscold\",\"ena2m2unfortunately\"],\"tip\":\"La actitud no se dice, se enseña: repetir un dato con incredulidad, marcharse, «in the end». Busca el gesto, no el adjetivo.\"},{\"id\":\"ena2m12l3e4\",\"type\":\"audiomc\",\"prompt\":\"Parte 3: el propósito — 2 escuchas\",\"audio\":\"Hi, it's about Saturday. I'm really sorry, but I can't come — I have to work. | Oh no! | I know. Can we do it next weekend instead?\",\"question\":\"¿Para qué llama?\",\"options\":[\"Para cancelar y proponer otro día\",\"Para invitar a alguien por primera vez\",\"Para quejarse del trabajo\"],\"answer\":0,\"whyWrong\":[null,\"La cita ya existía: por eso se disculpa\",\"El trabajo es la excusa, no el tema: el tema es el sábado\"],\"itemIds\":[\"ena2m6imafraidicant\",\"ena2m6nextweekend\"],\"tip\":\"Propósito = el VERBO de la llamada: cancelar, invitar, avisar, pedir. Resúmelo en un verbo y ya está.\"},{\"id\":\"ena2m12l3e5\",\"type\":\"audiomc\",\"prompt\":\"Parte 4: el mensaje de voz — usa el cuaderno mientras suena\",\"audio\":\"Hello, this is Mr Patel from the shop. It's about the table booking for Friday. I'm afraid I have to change the time: we can't do eight o'clock, but seven is fine. My number is oh two oh, seven nine four six, oh nine five eight. Could you call me back before six? Thank you.\",\"question\":\"¿Qué cambia Mr Patel?\",\"options\":[\"La hora de la reserva\",\"El día de la reserva\",\"El número de personas\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"El viernes sigue igual: lo que se mueve son las ocho\",\"Nadie menciona cuántos son\"],\"itemIds\":[\"ena2m6thebooking\",\"ena2m12themessagepad\"],\"tip\":\"Usa el cuaderno DURANTE la primera escucha, no después: seis datos no caben en la cabeza, y el examen lo sabe (por eso te da papel).\"},{\"id\":\"ena2m12l3e6\",\"type\":\"gapbank\",\"prompt\":\"Parte 4, en papel: lee el recado y rellena la ficha\",\"text\":\"«Hello, this is Mr Patel from the shop. It's about the table booking for Friday. My number is 020 7946 0958. Could you call me back before six? Thank you.» → MESSAGE PAD · Caller: Mr ___ · Phone: 020 7946 ___ · About: the ___ for Friday · Call back before: ___ o'clock\",\"answers\":[\"Patel\",\"0958\",\"booking\",\"six\"],\"bank\":[\"Patel\",\"0958\",\"booking\",\"six\",\"Wright\",\"eight\"],\"translation\":\"«Hola, soy el señor Patel, de la tienda. Es por la reserva de mesa del viernes. Mi número es el 020 7946 0958. ¿Me puede devolver la llamada antes de las seis? Gracias.» → HOJA DE RECADOS · Quien llama: Sr. Patel · Teléfono: 020 7946 0958 · Asunto: la reserva del viernes · Devolver la llamada antes de: las seis\",\"itemIds\":[\"ena2m12themessagepad\",\"ena2m6thebooking\",\"ena2m12thereferencenumber\"],\"tip\":\"Cada encabezado admite UNA palabra o UN número. Si escribes una frase, pierdes tiempo y no ganas ni un punto.\"},{\"id\":\"ena2m12l3e7\",\"type\":\"mc\",\"prompt\":\"Estrategia de la Parte 4\",\"question\":\"Antes de que suene el monólogo, ¿qué haces con los seis encabezados?\",\"options\":[\"Leerlos y decidir qué tipo de dato pide cada uno\",\"Copiarlos en el cuaderno para no perderlos\",\"Nada: se leen mientras suena, así se gana tiempo\"],\"answer\":0,\"whyWrong\":[null,\"Copiarlos gasta el tiempo que necesitas para pensar qué cazas\",\"Leer y escuchar a la vez es justo lo que no se puede hacer en A2\"],\"itemIds\":[\"ena2m12theheading\",\"ena2m12readthequestionsfirst\"
