ipal (verbo 1º tras la coma)\"],[\"Wenn ich Zeit habe,\",\"lerne ich Deutsch\"],[\"Wenn das Wetter gut ist,\",\"spiele ich Fußball\"],[\"Wenn du willst,\",\"helfe ich dir\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m10l4e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la condición\",\"question\":\"„Wenn ich Zeit habe, lerne ich Deutsch.“\",\"options\":[\"Si tengo tiempo, estudio alemán\",\"Cuando tenía tiempo, estudiaba alemán\",\"Quiero tener tiempo para estudiar alemán\"],\"answer\":0,\"whyWrong\":[null,\"habe y lerne son presente — la frase habla de una condición real de ahora, no del pasado\",\"No hay möchte ni wollen: es una condición (si...), no un deseo\"],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\"],\"tip\":\"wenn abre una condición real: si pasa A, hago B. El plan queda colgando de la condición.\"},{\"id\":\"a2m10l4e2\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra de la condición\",\"text\":\"___ ich Zeit habe, lerne ich Deutsch. (si)\",\"answers\":[\"Wenn\"],\"translation\":\"Si tengo tiempo, estudio alemán.\",\"hints\":[\"Abre la frase, con mayúscula\",\"W-e-n-n — con doble n\"],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\",\"zeit\"]},{\"id\":\"a2m10l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa — ¿dónde está el verbo?\",\"text\":\"Wenn ich Zeit ___, lerne ich Deutsch.\",\"answers\":[\"habe\"],\"translation\":\"Si tengo tiempo, estudio alemán.\",\"hints\":[\"Dentro de la frase wenn, el verbo espera al final\",\"haben con ich\"],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\",\"zeit\"],\"tip\":\"wenn empuja el verbo al final de su frase: Wenn ich Zeit habe. Esa patada al verbo es la firma de wenn.\"},{\"id\":\"a2m10l4e4\",\"type\":\"mc\",\"prompt\":\"Caza el calco\",\"question\":\"«Si tengo dinero, compro un coche» →\",\"options\":[\"Wenn ich Geld habe, kaufe ich ein Auto\",\"Wenn ich habe Geld, kaufe ich ein Auto\"],\"answer\":0,\"whyWrong\":[null,\"El calco del español: dentro de la frase wenn el verbo va al FINAL — Wenn ich Geld habe\"],\"itemIds\":[\"geld\",\"auto\"],\"tip\":\"En español el verbo va donde siempre («si TENGO dinero»); en alemán, wenn lo manda al final. Vigila ese reflejo.\"},{\"id\":\"a2m10l4e5\",\"type\":\"transform\",\"prompt\":\"Transforma: une las dos frases\",\"source\":\"Ich habe Zeit. Ich lerne Deutsch.\",\"instruction\":\"Únelas con wenn (empieza por la condición)\",\"answers\":[\"Wenn ich Zeit habe, lerne ich Deutsch\",\"Wenn ich Zeit habe, lerne ich Deutsch.\",\"Wenn ich Zeit habe, dann lerne ich Deutsch\",\"Wenn ich Zeit habe, dann lerne ich Deutsch.\"],\"translation\":\"Si tengo tiempo, estudio alemán.\",\"hints\":[\"wenn manda habe al final de su frase\",\"Tras la coma, lerne va inmediatamente: ...habe, lerne ich...\"],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\",\"zeit\",\"lernen\"],\"tip\":\"Dos frases sueltas → una condición: wenn empuja su verbo al final y la coma dispara la inversión. Los dos verbos chocan en la coma.\"},{\"id\":\"a2m10l4e6\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿plan seguro o condición?\",\"categories\":[\"Plan seguro (Präsens)\",\"Condición (wenn...)\"],\"items\":[{\"text\":\"Ich lerne heute Deutsch.\",\"bucket\":0},{\"text\":\"Wenn ich Zeit habe, lerne ich Deutsch.\",\"bucket\":1},{\"text\":\"Ich mache um zwölf Uhr eine Pause.\",\"bucket\":0},{\"text\":\"Wenn das Wetter gut ist, spiele ich Fußball.\",\"bucket\":1},{\"text\":\"Ich arbeite morgen.\",\"bucket\":0},{\"text\":\"Wenn ich Geld habe, kaufe ich ein Auto.\",\"bucket\":1}],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\",\"a2m10wenndaswettergutist\",\"a2m10pausemachen\",\"morgenadv\",\"geld\",\"wetter\"],\"tip\":\"El wenn inicial delata la condición — y dentro de ella, el verbo siempre al final. Sin wenn, el plan va en Präsens normal.\"},{\"id\":\"a2m10l4e7\",\"type\":\"listen\",\"prompt\":\"Escucha la condición completa\",\"text\":\"Wenn ich Zeit habe, lerne ich Deutsch\",\"translation\":\"Si tengo tiempo, estudio alemán\",\"hints\":[\"Dos verbos que chocan en la coma\",\"...habe, lerne...\"],\"itemIds\":[\"a2m10wennichzeithabelerneichdeutsch\"]},{\"id\":\"a2m10l4e8\",\"type\":\"mc\",\"prompt\":\"La inversión tras la coma\",\"question\":\"Wenn du willst, ___ ich dir.\",\"options\":[\"helfe\",\"ich helfe\",\"hilfst\"],\"answer\":0,\"whyWrong\":[null,\"Tras la coma el verbo va INMEDIATAMENTE — el sujeto ich espera detrás: helfe ich\",\"El que ayuda soy yo (ich), no tú: helfe\"],\"itemIds\":[\"a2m10wennduwillst\",\"a2m4ichhelfedir\"],\"tip\":\"La frase wenn ocupa la posición 1 entera → el verbo principal va 2º, pegado a la coma. Tu inversión de siempre, a lo grande.\"},{\"id\":\"a2m10l4e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Si quieres, te ayudo\",\"answers\":[\"Wenn du willst, helfe ich dir\",\"Wenn du willst, helfe ich dir.\",\"Wenn du willst, dann helfe ich dir\",\"Wenn du willst, dann helfe ich dir.\"],\"hints\":[\"wenn manda willst al final; tras la coma, helfe inmediatamente\",\"Wenn du willst, helfe ich ...\"],\"itemIds\":[\"a2m10wennduwillst\",\"a2m4ichhelfedir\"],\"tip\":\"Condición + dativo de a2m4 en una frase amable. Si los dos verbos chocaron en tu coma, wenn ya es tuyo.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — busca «wenn» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Condiciones reales en diálogos nativos: escucha el choque de verbos en la coma.\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «Nebensätze mit wenn»: el verbo al final es puntuación segura en el examen.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/se
