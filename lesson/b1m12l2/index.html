6xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T7a5,"])</script><script>self.__next_f.push([1,"Liebe Sofía,\u003cbr/\u003e\u003cbr/\u003eendlich komme ich dazu, dir richtig zu schreiben — seit dem Umzug nach Bern habe ich das Gefühl, dass mir jemand jeden Tag zwei Stunden [[klaut|roba]].\u003cbr/\u003e\u003cbr/\u003eDie Wohnung ist klein, aber hell, und sie liegt fünf Minuten vom Bahnhof entfernt; im Keller gibt es sogar einen Platz für mein [[Velo|la bici (helvetismo)]]. Ich hatte mit viel höheren Preisen gerechnet. Am Ende habe ich einfach Glück gehabt: Eine Kollegin ist ausgezogen und hat mir ihr Zimmer angeboten, bevor die Anzeige überhaupt online war. Ohne sie würde ich vermutlich immer noch suchen.\u003cbr/\u003e\u003cbr/\u003eDie Arbeit gefällt mir. Was mich am Anfang fertiggemacht hat, war nicht das Fachliche, sondern die Sprache: In der Kantine sprechen alle Schweizerdeutsch, und das ist wirklich eine andere Welt. Nach drei Wochen habe ich meine Kolleginnen gebeten, mit mir Hochdeutsch zu sprechen. Das war mir zuerst [[peinlich|embarazoso]], aber seitdem verstehe ich fast alles — und komischerweise verstehe ich inzwischen sogar den Dialekt ein bisschen besser.\u003cbr/\u003e\u003cbr/\u003eZum Deutschkurs: Ich habe mich für den Abendkurs angemeldet, zweimal pro Woche. Die Prüfung im Juni mache ich trotzdem noch nicht. Meine Lehrerin sagt, ich solle erst das Schreiben üben; sie hat recht, meine Texte sind zu kurz und ich verliere regelmäßig einen der Inhaltspunkte. Also: nächstes Jahr.\u003cbr/\u003e\u003cbr/\u003eWas ich dir eigentlich schreiben wollte: Im Oktober habe ich zwei Wochen frei. Hättest du Lust auf Besuch? Ich würde am liebsten am 10. anreisen und bis zum 20. bleiben. Sag mir bitte bis Ende August Bescheid, dann buche ich die Flüge — später werden sie doppelt so teuer.\u003cbr/\u003e\u003cbr/\u003eUnd bring mir bitte nichts mit, wenn du mich irgendwann besuchst. Letztes Mal hast du meinen halben Koffer gefüllt und ich habe mich wochenlang schlecht gefühlt.\u003cbr/\u003e\u003cbr/\u003eIch freue mich auf deine Antwort!\u003cbr/\u003e\u003cbr/\u003eLiebe Grüße\u003cbr/\u003eMarta\u003cbr/\u003e\u003cbr/\u003e*das Velo = schweiz. Standard für „Fahrrad“."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m12l2\",\"phaseId\":\"b1m12\",\"title\":\"Lesen Teil 1 y 2\",\"subtitle\":\"Richtig/Falsch sobre un texto personal · dos textos de prensa con MC de 3\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario de la estrategia lectora\",\"itemIds\":[\"b1m12gzueberfliegen\",\"b1m12gzschluesselwort\",\"b1m12gzbehaupten\",\"b1m12gzstellungnehmenzu\",\"b1m12gzjedoch\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 1 y Teil 2: dos tareas, dos relojes\",\"body\":\"\u003cb\u003eTeil 1 — 10 minutos, 6 ítems (1-6), Richtig/Falsch.\u003c/b\u003e Un texto personal largo (blog, correo, relato) de unas 300-350 palabras + 6 afirmaciones \u003cb\u003een el orden del texto\u003c/b\u003e. Estrategia: lee el texto entero primero; luego cada afirmación y busca su párrafo. Si la afirmación dice algo que el texto \u003cb\u003eno\u003c/b\u003e dice, es \u003ci\u003eFalsch\u003c/i\u003e — no vale «podría ser».\u003cbr/\u003e\u003cb\u003eTeil 2 — 20 minutos, 6 ítems (7-12), MC de 3 opciones.\u003c/b\u003e \u003cb\u003eDos\u003c/b\u003e textos de prensa, \u003cb\u003e3 preguntas cada uno\u003c/b\u003e. Aquí la trampa es distinta: las tres opciones suelen aparecer todas en el texto, pero solo una responde a la \u003cb\u003epregunta\u003c/b\u003e. Subraya el verbo de la pregunta antes de mirar las opciones.\u003cbr/\u003eRegla de reloj: 10 + 20 minutos. Quien se atasca en el Teil 2 llega sin tiempo al Teil 5. Y ojo: \u003cb\u003elos ~5 minutos para pasar las respuestas al Antwortbogen están DENTRO\u003c/b\u003e de los 65 minutos, no son un regalo.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l2e1\",\"type\":\"read\",\"prompt\":\"Lesen Teil 1 en formato real: lee el texto entero y luego decide Richtig o Falsch. Tienes 10 minutos. (Marta escribe desde Berna, pero es española y aprendió a escribir en Alemania: por eso usa ß. Una suiza escribiría Grüsse y regelmässig.)\",\"title\":\"Brief aus Bern\",\"source\":\"Persönlicher Brief (Lesen Teil 1, Modellformat)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m12l2e1q1\",\"q\":\"Marta hat lange nach einer Wohnung gesucht.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"inference\":true,\"why\":\"El piso se lo ofreció una compañera antes incluso de publicarse el anuncio, y ella dice «ohne sie würde ich vermutlich immer noch suchen»: sin esa suerte seguiría buscando, es decir, no buscó mucho.\"},{\"id\":\"b1m12l2e1q2\",\"q\":\"Am Anfang war für Marta die Sprache schwieriger als die Arbeit selbst.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"why\":\"«Was mich am Anfang fertiggemacht hat, war nicht das Fachliche, sondern die Sprache.»\"},{\"id\":\"b1m12l2e1q3\",\"q\":\"Marta bereut es, dass sie um Hochdeutsch gebeten hat.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"inference\":true,\"why\":\"Le dio vergüenza al principio («zuerst»), pero desde entonces entiende casi todo e incluso el dialecto mejor. El balance es positivo.\"},{\"id\":\"b1m12l2e1q4\",\"q\":\"Marta wird im Juni die Prüfung machen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"why\":\"«Die Prüfung im Juni mache ich trotzdem noch nicht. … Also: nächstes Jahr.»\"},{\"id\":\"b1m12l2e1q5\",\"q\":\"Marta möchte bis Ende August eine Antwort haben.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"why\":\"«Sag mir bitte bis Ende August Bescheid, dann buche ich die Flüge.»\"},{\"id\":\"b1m12l2e1q6\",\"q\":\"Marta freut sich über Geschenke von Sofía.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"inference\":true,\"why\":\"«bring mir bitte nichts mit … ich habe mich wochenlang schlecht gefühlt»: los regalos la incomodan.\"}],\"itemIds\":[\"b1m12gzueberfliegen\",\"b1m12gzinhaltspunkt\",\"a2anzeige\"],\"tip\":\"Las 6 afirmaciones van EN EL ORDEN del texto. Si estás en la 4 y buscas en el primer párrafo, algo va mal.\"},{\"id\":\"b1m12l2e2\",\"type\":\"mc\",\"prompt\":\"Estrategia del Teil 1\",\"question\":\"Una afirmación dice algo razonable que el texto no menciona en ningún sitio. ¿Qué marcas?\",\"options\":[\"Richtig, porque es plausible\",\"Falsch, porque solo cuenta lo que el texto dice\",\"La dejas en blanco\"],\"answer\":1,\"whyWrong\":[\"Lo plausible no puntúa: puntúa lo que está en el texto\",null,\"En blanco es 0 seguro; marcando tienes un 50 % en R/F\"],\"itemIds\":[\"b1m12gzbehaupten\"],\"tip\":\"En Richtig/Falsch nunca se deja nada en blanco: no hay penalización por fallar.\"},{\"id\":\"b1m12l2e3\",\"type\":\"mc\",\"prompt\":\"Estrategia del Teil 2 (los dos textos de prensa)\",\"question\":\"Las tres opciones de una pregunta aparecen todas en el texto. ¿Qué haces?\",\"options\":[\"Eliges la primera que reconozcas\",\"Vuelves a la pregunta y miras qué te pide exactamente\",\"Eliges la opción más larga\"],\"answer\":1,\"whyWrong\":[\"Reconocer palabras es justo la trampa del Teil 2\",null,\"La longitud no dice nada\"],\"itemIds\":[\"b1m12gzschluesselwort\"],\"tip\":\"En el Teil 2 la información está toda; lo que se evalúa es si entiendes la PREGUNTA.\"},{\"id\":\"b1m12l2e4\",\"type\":\"match\",\"prompt\":\"Empareja Teil y tarea\",\"pairs\":[{\"target\":\"Lesen Teil 1\",\"source\":\"un texto personal largo + 6 afirmaciones Richtig/Falsch\"},{\"target\":\"Lesen Teil 2\",\"source\":\"dos textos de prensa, 3 preguntas de opción múltiple cada uno\"},{\"target\":\"10 Minuten\",\"source\":\"el tiempo previsto para el Teil 1\"},{\"target\":\"20 Minuten\",\"source\":\"el tiempo previsto para el Teil 2\"}],\"itemIds\":[\"b ext ist lang, jedoch ist er einfach\"],\"why\":\"«jedoch» NO manda el verbo al final: no es una conjunción subordinante como weil u obwohl. Funciona como adverbio en posición 1 y el verbo va justo detrás: jedoch IST er. (En registro muy formal también se lee en posición 0, como «aber»: «…, jedoch er ist einfach». Correcto, pero rarísimo — la que verás en los textos del examen y la que te conviene producir es la inversión.)\",\"translation\":\"El texto es largo, sin embargo es fácil.\",\"itemIds\":[\"b1m12gzjedoch\"]},{\"id\":\"b1m12l2e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la consigna del examen\",\"text\":\"Lesen Sie den Text und die Aufgaben eins bis sechs.\",\"translation\":\"Lea el texto y las tareas 1 a 6.\",\"hints\":[\"Lesen Sie …\",\"…die Aufgaben eins bis sechs\"],\"itemIds\":[\"b1m12gzueberfliegen\"]},{\"id\":\"b1m12l2e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera (así se reformulan las afirmaciones del Teil 1)\",\"source\":\"Marta hat sich für einen Abendkurs angemeldet.\",\"forbid\":[\"angemeldet\",\"Abendkurs\"],\"answers\":[\"Marta besucht zweimal pro Woche einen Kurs am Abend.\",\"Marta nimmt an einem Kurs am Abend teil.\"],\"translation\":\"Marta se ha apuntado a un curso de tarde.\",\"hints\":[\"besuchen / teilnehmen an\",\"…einen Kurs am Abend\"],\"itemIds\":[\"b1m12gzteilnehmenan\"],\"tip\":\"El examen NUNCA repite las palabras del texto en las afirmaciones: las reformula. Entrena tú el mismo movimiento.\"},{\"id\":\"b1m12l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Primero leo el texto por encima y luego busco la palabra clave\",\"answers\":[\"Zuerst überfliege ich den Text und dann suche ich das Schlüsselwort\",\"Zuerst überfliege ich den Text und dann suche ich das Schlüsselwort.\",\"Zuerst überfliege ich den Text, und dann suche ich das Schlüsselwort\"],\"hints\":[\"Zuerst abre → verbo en 2ª posición: überfliege ich\",\"…und dann suche ich…\"],\"itemIds\":[\"b1m12gzueberfliegen
