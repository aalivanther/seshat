\u003e: (1) \u003cb\u003ewird/werden + Partizip\u003c/b\u003e y (2) la preposición \u003cb\u003evon\u003c/b\u003e, que arrastra al que actúa.\u003cbr/\u003e\u003cbr/\u003ePor eso esta lección usa frases \u003cb\u003ereversibles\u003c/b\u003e: médica↔paciente, entrenador↔deportista. En «Der Brief wird geschrieben» el sentido común te salva (una carta no escribe). Con dos personas, no hay sentido común que valga: \u003cu\u003eo lees la forma, o fallas\u003c/u\u003e. Eso es exactamente lo que mide el examen.\u003cbr/\u003e\u003cbr/\u003eY el agente: \u003cb\u003evon\u003c/b\u003e + persona/institución (\u003ci\u003evon der Ärztin\u003c/i\u003e, \u003ci\u003evon der Krankenkasse\u003c/i\u003e), \u003cb\u003edurch\u003c/b\u003e + medio/causa (\u003ci\u003edurch Sport\u003c/i\u003e, \u003ci\u003edurch Stress\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m3l5\",\"phaseId\":\"b1m3\",\"title\":\"Clínica: quién le hace qué a quién\",\"subtitle\":\"El principio del primer sustantivo — y cómo desactivarlo\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los protagonistas de la clínica\",\"itemIds\":[\"b1m3dieaerztin\",\"b1m3dertrainer\",\"b1m3dersportler\",\"b1m3untersuchen\",\"b1m3behandeln\",\"b1m3vonderaerztinuntersucht\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué tu cerebro entiende la pasiva al revés\",\"body\":\"$17\",\"table\":[[\"frase\",\"¿quién actúa?\"],[\"Die Ärztin untersucht den Patienten.\",\"die Ärztin (activa)\"],[\"Die Ärztin wird vom Patienten angerufen.\",\"der Patient (¡tras von!)\"],[\"Der Trainer fragt den Sportler.\",\"der Trainer (activa)\"],[\"Der Trainer wird vom Sportler gefragt.\",\"der Sportler (¡tras von!)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m3l5e1\",\"type\":\"mc\",\"prompt\":\"Solo la forma lo dice\",\"question\":\"„Der Sportler wird vom Trainer untersucht.“ ¿Quién examina?\",\"options\":[\"Der Trainer\",\"Der Sportler\"],\"answer\":0,\"whyWrong\":[null,\"Der Sportler abre la frase, pero es quien RECIBE la acción. Quien actúa va tras von\"],\"itemIds\":[\"b1m3dersportler\",\"b1m3dertrainer\",\"b1m3untersuchen\"]},{\"id\":\"b1m3l5e2\",\"type\":\"mc\",\"prompt\":\"Solo la forma lo dice\",\"question\":\"„Die Ärztin behandelt die Sportlerin.“ ¿Quién recibe el tratamiento?\",\"options\":[\"Die Sportlerin\",\"Die Ärztin\"],\"answer\":0,\"whyWrong\":[null,\"Aquí NO hay pasiva: sin wird + Partizip, el primer nombre sí es quien actúa\"],\"itemIds\":[\"b1m3dieaerztin\",\"b1m3behandeln\"],\"tip\":\"Mismos dos personajes, forma distinta, sentido opuesto. Por eso hay que leer la forma antes que el contenido.\"},{\"id\":\"b1m3l5e3\",\"type\":\"mc\",\"prompt\":\"Solo la forma lo dice\",\"question\":\"„Die Patientin wird von der Ärztin behandelt.“ ¿Quién trata a quién?\",\"options\":[\"La médica trata a la paciente\",\"La paciente trata a la médica\"],\"answer\":0,\"whyWrong\":[null,\"von der Ärztin marca a quien actúa; die Patientin es el sujeto gramatical, no el agente\"],\"itemIds\":[\"b1m3dieaerztin\",\"b1m3behandeln\",\"patient\"]},{\"id\":\"b1m3l5e4\",\"type\":\"bucket\",\"prompt\":\"¿El primer nombre HACE o RECIBE?\",\"categories\":[\"El primer nombre HACE\",\"El primer nombre RECIBE\"],\"items\":[{\"text\":\"Der Trainer fragt den Sportler.\",\"bucket\":0},{\"text\":\"Der Trainer wird vom Sportler gefragt.\",\"bucket\":1},{\"text\":\"Die Ärztin untersucht den Patienten.\",\"bucket\":0},{\"text\":\"Die Ärztin wird vom Patienten angerufen.\",\"bucket\":1},{\"text\":\"Der Patient wird behandelt.\",\"bucket\":1},{\"text\":\"Der Patient nimmt die Tablette.\",\"bucket\":0},{\"text\":\"Die Sportlerin wird vom Trainer gelobt.\",\"bucket\":1},{\"text\":\"Die Sportlerin lobt den Trainer.\",\"bucket\":0}],\"itemIds\":[\"b1m3dertrainer\",\"b1m3dersportler\",\"b1m3dieaerztin\",\"b1m3untersuchen\",\"b1m3behandeln\",\"patient\"],\"tip\":\"Si no ves wird/werden + Partizip, el primer nombre actúa. Si lo ves, el primer nombre recibe.\"},{\"id\":\"b1m3l5e5\",\"type\":\"mc\",\"prompt\":\"von o durch\",\"question\":\"«El paciente es tratado por el estrés» — ¿cómo se dice «por el estrés» aquí, si el estrés es la CAUSA de sus molestias?\",\"options\":[\"Die Beschwerden werden durch Stress verursacht\",\"Die Beschwerden werden von Stress verursacht\",\"Die Beschwerden werden mit Stress verursacht\"],\"answer\":0,\"whyWrong\":[null,\"von marca al agente que actúa por voluntad propia; el estrés es una causa, no un actor\",\"mit es el instrumento («con un martillo»), no la causa\"],\"itemIds\":[\"b1m3beschwerden\",\"a2m10stress\"],\"tip\":\"von = quién · durch = por medio de qué / a causa de qué. El «por» español no distingue: hay que decidirlo tú.\"},{\"id\":\"b1m3l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el parte médico\",\"text\":\"Der Patient ___ von der Ärztin untersucht. Die Beschwerden ___ durch den Bewegungsmangel verursacht. Er ___ mit Bewegung behandelt.\",\"answers\":[\"wird\",\"werden\",\"wird\"],\"bank\":[\"wird\",\"werden\",\"ist\",\"von\",\"durch\"],\"translation\":\"Al paciente lo examina la médica. Las molestias las causa el sedentarismo. Se le trata con ejercicio.\",\"itemIds\":[\"b1m3vonderaerztinuntersucht\",\"b1m3beschwerden\",\"b1m3derbewegungsmangel\",\"b1m3behandeln\"],\"tip\":\"Die Beschwerden es plural → werden. El resto, singular → wird.\"},{\"id\":\"b1m3l5e7\",\"type\":\"transform\",\"prompt\":\"Transforma: activa → pasiva (con agente)\",\"source\":\"Die Ärztin untersucht den Sportler.\",\"instruction\":\"Ponla en Passiv con von\",\"answers\":[\"Der Sportler wird von der Ärztin untersucht\"],\"translation\":\"Al deportista lo examina la médica.\",\"hints\":[\"El objeto (den Sportler) pasa a sujeto: der Sportler\",\"Der Sportler wird von der Ärztin ...\"],\"itemIds\":[\"b1m3vonderaerztinuntersucht\",\"b1m3dieaerztin\",\"b1m3dersportler\"],\"tip\":\"Fíjate en el doble cambio: den → der (Akkusativ a Nominativ) y die Ärztin → von der Ärztin (Dativ).\"},{\"id\":\"b1m3l5e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige: la pasiva no es un estado\",\"wrong\":\"Der Patient ist von der Ärztin untersucht.\",\"answers\":[\"Der Patient wird von der Ärztin untersucht.\"],\"why\":\"Con agente (von + persona) la pasiva describe una ACCIÓN: wird untersucht. «ist untersucht» sería un estado y con von suena directamente mal en alemán.\",\"translation\":\"Al paciente lo examina la médica.\",\"itemIds\":[\"b1m3vonderaerztinuntersucht\"]},{\"id\":\"b1m3l5e9\",\"type\":\"build\",\"prompt\":\"Construye la pasiva con agente\",\"target\":\"Der Trainer wird vom Sportler gefragt\",\"translation\":\"Al entrenador le pregunta el deportista\",\"distractors\":[\"fragt\",\"ist\"],\"itemIds\":[\"b1m3dertrainer\",\"b1m3dersportler\"],\"tip\":\"vom = von + dem. Quien pregunta es el deportista, aunque aparezca el último.\"},{\"id\":\"b1m3l5e10\",\"type\":\"gapbank\",\"prompt\":\"Completa con la preposición del agente\",\"text\":\"Die Untersuchung wird ___ einer Ärztin gemacht. Das Risiko wird ___ Bewegung gesenkt. Der Termin wird ___ der Praxis bestätigt.\",\"answers\":[\"von\",\"durch\",\"von\"],\"bank\":[\"von\",\"durch\",\"gegen\",\"für\",\"ohne\"],\"translation\":\"El reconocimiento lo hace una médica. El riesgo se reduce mediante el ejercicio. La cita la confirma la consulta.\",\"itemIds\":[\"b1m3dieuntersuchung\",\"b1m3dasrisiko\",\"b1m3diebewegung\",\"praxis\"],\"tip\":\"Personas e instituciones → von. Medios y causas → durch. Es la pareja que hay que decidir en cada frase.\"},{\"id\":\"b1m3l5e11\",\"type\":\"transform\",\"prompt\":\"Cierre de producción: activa → pasiva\",\"source\":\"Der Trainer behandelt die Sportlerin.\",\"instruction\":\"Ponla en Passiv con von\",\"answers\":[\"Die Sportlerin wird vom Trainer behandelt\",\"Die Sportlerin wird von dem Trainer behandelt\"],\"translation\":\"A la deportista la trata el entrenador.\",\"hints\":[\"Sujeto nuevo: die Sportlerin\",\"Die Sportlerin wird vom Trainer ...\"],\"itemIds\":[\"b1m3dertrainer\",\"b1m3dersportler\",\"b1m3behandeln\"],\"tip\":\"Si el orden te salió solo y von cayó donde tocaba, el principio del primer sustantivo ya no te engaña.\"},{\"id\":\"b1m3l5e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: aviso en la sala de espera · tarea 1 de 2. Dos escuchas. Todo el texto va en pasiva: eso es lo que se entrena aquí.\",\"audio\":\"Eine Information für unsere Patientinnen und Patienten im Wartezimmer: Sie werden heute nicht in der Reihenfolge der Termine aufgerufen, sondern, ähm, nach Dringlichkeit. Zuerst werden Sie von einer Kollegin kurz untersucht, danach entscheidet Frau Doktor Weber, wer sofort drankommt. Wer heute schon Blut abgegeben hat, wird gebeten, sich noch einmal an der Anmeldung zu melden. Danke für Ihre Geduld.\",\"question\":\"„Die Patienten werden in der Reihenfolge ihrer Termine aufgerufen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«nicht in der Reihenfolge der Termine, sondern nach Dringlichkeit»\",null],\"itemIds\":[\"b1m3vonderaerztinuntersucht\",\"b1m3untersuchen\"],\"tip\":\"De oído la pasiva es más traicionera que por escrito: no puedes releer. Ancla el «von» — quien va detrás es quien actúa.\"},{\"id\":\"b1m3l5e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo aviso, segunda tarea. Dos escuchas.\",\"audio\":\"Eine Information für unsere Patientinnen und Patienten im Wartezimmer: Sie werden heute nicht in der Reihenfolge der Termine aufgerufen, sondern, ähm, nach Dringlichkeit. Zuerst werden Sie von einer Kollegin kurz untersucht, danach entscheidet Frau Doktor Weber, wer sofort drankommt. Wer heute schon Blut abgegeben hat, wird gebeten, sich noch einmal an der Anmeldung zu melden. Danke für Ihre Geduld.\",\"question\":\"¿Quién hace el primer reconocimiento?\",\"options\":[\"Una compañera de la doctora\",\"La propia doctora Weber\",\"El personal de la recepción\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella decide después quién pasa primero\",\"La recepción solo atiende a quien ya ha dado sangre\"],\"itemIds\":[\"b1m3dieaerztin\",\"b1m3dieuntersuchung\"],\"tip\":\"«Sie werden von einer Kollegin untersucht» — la primera palabra NO es quien actúa. Ese es el truco de toda la lección.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Lesen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"En los textos de prensa del Teil 2 hay pasiva en casi cada párrafo: cázala.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
