.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l3\",\"phaseId\":\"b1m8\",\"title\":\"Falls das Paket nicht ankommt\",\"subtitle\":\"wenn y falls: la condición que dispara el futuro\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Condición + consecuencia\",\"itemIds\":[\"b1m6falls\",\"b1m8gesobald\",\"b1m8gefallsdieware\",\"b1m8gesichbeschweren\",\"b1m8gebeschwerde\"]},{\"kind\":\"note\",\"note\":{\"title\":\"wenn · falls · sobald: tres subordinantes y una sola regla de orden\",\"body\":\"$17\",\"table\":[[\"conector\",\"matiz\",\"ejemplo\"],[\"wenn\",\"condición normal o rutina\",\"Wenn ich Zeit habe, vergleiche ich die Preise.\"],[\"falls\",\"posibilidad, poco probable\",\"Falls die Ware beschädigt ist, schicke ich sie zurück.\"],[\"sobald\",\"en cuanto (tiempo)\",\"Sobald das Geld da ist, liefern wir.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l3e1\",\"type\":\"mc\",\"prompt\":\"Elige el matiz\",\"question\":\"¿Cuál usarías en las condiciones de una tienda para algo que casi nunca pasa?\",\"options\":[\"Falls die Ware beschädigt ist ...\",\"Wenn ich Zeit habe ...\",\"Sobald das Geld da ist ...\"],\"answer\":0,\"whyWrong\":[null,\"«wenn ich Zeit habe» es una rutina personal, no una cláusula de contrato\",\"«sobald» es temporal: en cuanto pase algo, no por si pasa\"],\"itemIds\":[\"b1m6falls\",\"b1m8geware\"],\"tip\":\"falls = por si acaso. En contratos, seguros y reclamaciones es la palabra por defecto.\"},{\"id\":\"b1m8l3e2\",\"type\":\"cloze\",\"prompt\":\"Completa la condición\",\"text\":\"___ die Ware nicht ankommt, werde ich mich beschweren.\",\"answers\":[\"Falls\",\"falls\",\"Wenn\",\"wenn\"],\"translation\":\"Si la mercancía no llega, reclamaré.\",\"hints\":[\"Se trata de algo posible pero no seguro\",\"F-a-l-l-s (también valdría wenn)\"],\"itemIds\":[\"b1m6falls\",\"b1m8gefallsdieware\"]},{\"id\":\"b1m8l3e3\",\"type\":\"errorfix\",\"prompt\":\"El calco de orden más marcado del B1\",\"wrong\":\"Falls das Paket nicht ankommt, ich werde mich beschweren.\",\"answers\":[\"Falls das Paket nicht ankommt, werde ich mich beschweren.\"],\"why\":\"La subordinada antepuesta ocupa entera la posición 1, así que la principal tiene que empezar por el VERBO: ..., werde ich ... El español no invierte nada («Si no llega, yo reclamaré») y por eso el calco sale solo.\",\"translation\":\"Si el paquete no llega, reclamaré.\",\"itemIds\":[\"b1m6falls\",\"b1m8gesichbeschweren\"]},{\"id\":\"b1m8l3e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la posición del verbo dentro de la subordinada\",\"wrong\":\"Falls die Ware kommt nicht an, schicke ich eine Beschwerde.\",\"answers\":[\"Falls die Ware nicht ankommt, schicke ich eine Beschwerde.\"],\"why\":\"Dentro de una subordinada el verbo separable se vuelve a juntar y va entero al final: ankommt. El «nicht» se queda delante.\",\"translation\":\"Si la mercancía no llega, mando una reclamación.\",\"itemIds\":[\"b1m8gebeschwerde\",\"b1m8geware\"]},{\"id\":\"b1m8l3e5\",\"type\":\"bucket\",\"prompt\":\"¿Verbo al final o inversión?\",\"categories\":[\"verbo al FINAL (subordinante)\",\"INVERSIÓN (adverbio en posición 1)\"],\"items\":[{\"text\":\"falls\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"sobald\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"wenn\",\"bucket\":0},{\"text\":\"dann\",\"bucket\":1}],\"itemIds\":[\"b1m6falls\",\"b1m8gesobald\"],\"tip\":\"falls, sobald y wenn son conjunciones. dann, deshalb y trotzdem son adverbios: ocupan la posición 1 y empujan el verbo a la 2ª.\"},{\"id\":\"b1m8l3e6\",\"type\":\"gapbank\",\"prompt\":\"Completa las condiciones de la tienda\",\"text\":\"___ Sie die Ware zurückschicken möchten, benutzen Sie bitte das beiliegende Etikett. ___ das Paket bei uns eingetroffen ist, erstatten wir den Betrag. Wir hoffen, ___ Sie mit unserem Service zufrieden sind.\",\"answers\":[\"Falls\",\"Sobald\",\"dass\"],\"bank\":[\"Falls\",\"Sobald\",\"dass\",\"Obwohl\",\"Deshalb\",\"Trotzdem\"],\"translation\":\"Si desea devolver la mercancía, use la etiqueta adjunta. En cuanto el paquete nos llegue, le reembolsamos el importe. Esperamos que esté satisfecho con nuestro servicio.\",\"itemIds\":[\"b1m6falls\",\"b1m8gesobald\",\"b1m8gezurueckschicken\",\"b1m8geerstatten\"],\"tip\":\"Los tres son subordinantes y los tres mandan el verbo al final. En los dos primeros la subordinada va delante, así que la principal empieza por el verbo: benutzen, erstatten.\"},{\"id\":\"b1m8l3e7\",\"type\":\"build\",\"prompt\":\"Construye la condición completa\",\"target\":\"Falls die Lieferung zu spät kommt, werde ich den Vertrag kündigen\",\"translation\":\"Si la entrega llega demasiado tarde, rescindiré el contrato\",\"distractors\":[\"ich werde\",\"zu kündigen\"],\"itemIds\":[\"b1m6falls\",\"b1m8gelieferung\",\"b1m8gekuendigen\"],\"tip\":\"Subordinada + coma + verbo. Y dentro de la principal, la pinza del futuro: werde ... kündigen.\"},{\"id\":\"b1m8l3e8\",\"type\":\"transform\",\"prompt\":\"Une las dos frases\",\"source\":\"Das Geld kommt an. Wir liefern die Ware.\",\"instruction\":\"Únelas con sobald, empezando por la subordinada\",\"answers\":[\"Sobald das Geld ankommt, liefern wir die Ware.\",\"Sobald das Geld angekommen ist, liefern wir die Ware.\"],\"translation\":\"En cuanto llegue el dinero, entregamos la mercancía.\",\"hints\":[\"Sobald das Geld ...\",\"La principal empieza por el verbo: liefern wir\"],\"itemIds\":[\"b1m8gesobald\",\"b1m8geliefern\"]},{\"id\":\"b1m8l3e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Falls die Ware beschädigt ist, schicken Sie sie bitte zurück.\",\"translation\":\"Si la mercancía está dañada, devuélvala por favor.\",\"hints\":[\"Empieza por Falls die Ware ...\",\"schicken Sie sie bitte zurück\"],\"itemIds\":[\"b1m6falls\",\"b1m8gezurueckschicken\"]},{\"id\":\"b1m8l3e10\",\"type\":\"cloze\",\"prompt\":\"La preposición fija de la reclamación\",\"text\":\"Ich möchte mich ___ die späte Lieferung beschweren.\",\"answers\":[\"über\"],\"translation\":\"Quiero quejarme de la entrega tardía.\",\"hints\":[\"sich beschweren + preposición fija + Akkusativ\",\"Cinco letras, con Umlaut\"],\"itemIds\":[\"b1m8gesichbeschweren\",\"b1m8gelieferung\"],\"strictUmlaut\":true,\"tip\":\"sich beschweren ÜBER + acusativo. El español dice «quejarse DE» y por eso sale «von»: es el error de rección más repetido del módulo.\"},{\"id\":\"b1m8l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Si la mercancía no llega, reclamaré\",\"answers\":[\"Falls die Ware nicht ankommt, werde ich mich beschweren\",\"Falls die Ware nicht ankommt, werde ich mich beschweren.\",\"Wenn die Ware nicht ankommt, werde ich mich beschweren\"],\"hints\":[\"Falls + verbo al final: ankommt\",\"Luego la coma y el verbo: werde ich ...\"],\"itemIds\":[\"b1m8gefallsdieware\",\"b1m8gesichbeschweren\"],\"tip\":\"Condición + futuro en una sola frase: esta es la estructura que vas a usar tres veces en el mail de reclamación de la lección 8.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",
