egundos.\u003c/b\u003e No se escribe el discurso: no da tiempo y leer se nota. Se escriben \u003cb\u003etres palabras clave, no frases\u003c/b\u003e, y se decide \u003cb\u003eel ORDEN\u003c/b\u003e. Con el orden decidido, la fluidez viene sola.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se reparte el minuto y medio:\u003c/b\u003e 10 segundos para anunciar de qué vas a hablar y en cuántos puntos · 30 para el primer punto, con un dato concreto · 30 para el segundo, con un contraste · 20 para cerrar. Y entre punto y punto, \u003cb\u003ela partitura de conectores\u003c/b\u003e: \u003ci\u003eFirst of all… Another reason is… On the other hand… All in all…\u003c/i\u003e El descriptor del B1 repite dos veces la misma expresión —\u003ci\u003e«a linear sequence of points»\u003c/i\u003e—: este nivel no premia la frase complicada, \u003cb\u003epremia encadenar\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una trampa que cae justo aquí:\u003c/b\u003e al negociar salen hipótesis, y con ellas el \u003ci\u003ewould\u003c/i\u003e de más. \u003ci\u003eIf I would have more time…\u003c/i\u003e es el calco de «si tendría», vivísimo en el habla e imposible en inglés: \u003cb\u003eel «would» va en UNA sola mitad\u003c/b\u003e, la de la consecuencia."])</script><script>self.__next_f.push([1,"18:Ta48,"])</script><script>self.__next_f.push([1,"Con este se cierra el cuadro. El m1 se llevó el \u003cb\u003eListening Part 1\u003c/b\u003e, el m2 el \u003cb\u003eReading Part 1\u003c/b\u003e, el m3 el \u003cb\u003eListening Part 3\u003c/b\u003e, el m4 el \u003cb\u003eReading Part 4\u003c/b\u003e, el m5 el \u003cb\u003eWriting Part 1\u003c/b\u003e, el m6 el \u003cb\u003eListening Part 2\u003c/b\u003e, el m7 el \u003cb\u003eSpeaking Parts 1 y 2\u003c/b\u003e, el m8 el \u003cb\u003eReading Part 2\u003c/b\u003e, el m9 el \u003cb\u003eReading Part 3\u003c/b\u003e, el m10 el \u003cb\u003eWriting Part 2\u003c/b\u003e y el m11 el \u003cb\u003eListening Part 4\u003c/b\u003e y el \u003cb\u003eSpeaking Part 3\u003c/b\u003e. Hoy, el que faltaba: el \u003cb\u003eSpeaking Part 4\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué es, exactamente.\u003c/b\u003e Tres minutos de los doce. El interlocutor te \u003cb\u003eofrece tres temas y elige uno él\u003c/b\u003e —\u003cb\u003eno eliges tú\u003c/b\u003e, así que no sirve llevar un tema preparado de casa—. Te da \u003cb\u003etreinta segundos con papel y lápiz\u003c/b\u003e y aparta la mirada. Luego hablas \u003cb\u003ehasta un minuto y medio seguido\u003c/b\u003e. Y después te hace \u003cb\u003ecuatro preguntas de seguimiento\u003c/b\u003e sobre lo que acabas de decir, que \u003cb\u003eentran en los mismos tres minutos y puntúan igual\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl tema es siempre de tu vida, no de actualidad.\u003c/b\u003e Los del Practice Paper oficial: \u003ci\u003eun acontecimiento deportivo al que te gustaría ir\u003c/i\u003e · \u003ci\u003etu sitio favorito de vacaciones\u003c/i\u003e · \u003ci\u003etu vida antes de empezar el colegio\u003c/i\u003e. Nadie te va a pedir que opines sobre la economía.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos treinta segundos: qué se hace y qué no.\u003c/b\u003e No se escribe el discurso —no da tiempo, y si lo escribes lo lees, y leer se oye—. Se escriben \u003cb\u003etres palabras sueltas\u003c/b\u003e y se decide \u003cb\u003eel ORDEN\u003c/b\u003e. Con el orden decidido, la fluidez sale sola.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se reparte el minuto y medio:\u003c/b\u003e 10 segundos para anunciar de qué vas a hablar y en cuántos puntos · 30 para el primer punto, con \u003cb\u003eun dato concreto\u003c/b\u003e (una fecha, una cifra, un nombre) · 30 para el segundo, con \u003cb\u003eun contraste\u003c/b\u003e · 20 para cerrar. Entre punto y punto, la partitura: \u003ci\u003eFirst of all… Another reason is… On the other hand… All in all…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error que más puntos cuesta, y no es de gramática:\u003c/b\u003e \u003cb\u003eno cerrar\u003c/b\u003e. Un monólogo que se apaga —«…and it was really, really good. Yes.»— suena a que se te acabó el idioma, aunque no se te haya acabado. \u003ci\u003eAll in all\u003c/i\u003e más una frase y ya está: eso es \u003ci\u003eTask Fulfilment and Coherence\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY las cuatro preguntas de seguimiento.\u003c/b\u003e Son la mitad del tiempo y casi nadie las prepara. No son un examen sorpresa: salen \u003cb\u003ede lo que tú acabas de contar\u003c/b\u003e, así que si en el monólogo mencionas un sitio, una persona y una fecha, ya sabes por dónde van a venir. Contéstalas con la misma fórmula del Part 1 —\u003cb\u003eopinión + porque + ejemplo\u003c/b\u003e— y nunca con una sola palabra."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l9\",\"phaseId\":\"enb1m12\",\"title\":\"Speaking: agreeing, and your ninety seconds\",\"subtitle\":\"La discusión que tiene que terminar en acuerdo, el monólogo con treinta segundos de preparación — y el último laboratorio del curso: el Speaking Part 4\",\"minutes\":26,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La partitura del oral\",\"itemIds\":[\"enb1m12shallwesaythen\",\"enb1m12sowereagreed\",\"enb1m12iseeyourpoint\",\"enb1m12anotherreasonis\",\"enb1m12threekeywords\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Las dos partes que deciden el aprobado del oral\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l9e1\",\"type\":\"match\",\"prompt\":\"Empareja la partitura\",\"pairs\":[{\"target\":\"I see your point, but…\",\"source\":\"Entiendo lo que dices, pero…\"},{\"target\":\"Another reason is that it's cheaper.\",\"source\":\"Otra razón es que sale más barato.\"},{\"target\":\"Shall we say the first one, then?\",\"source\":\"¿Nos quedamos con el primero, entonces?\"},{\"target\":\"So we're agreed.\",\"source\":\"Entonces estamos de acuerdo.\"}],\"itemIds\":[\"enb1m12iseeyourpoint\",\"enb1m12anotherreasonis\",\"enb1m12shallwesaythen\",\"enb1m12sowereagreed\"],\"tip\":\"Fíjate en el orden en que van: reconocer al otro, dar tu motivo, proponer el cierre, sellarlo. Esos cuatro pasos son literalmente la Parte 3 entera.\"},{\"id\":\"enb1m12l9e2\",\"type\":\"mc\",\"prompt\":\"Qué se espera de la Parte 3\",\"question\":\"Habéis discutido tres minutos y cada uno ha dicho lo suyo, pero no habéis decidido nada. ¿Qué ha pasado?\",\"options\":[\"Falta lo que el handbook pide: intentar llegar a un acuerdo.\",\"Nada: la Parte 3 es solo un intercambio de opiniones.\",\"Nada, siempre que los dos hayáis hablado el mismo tiempo.\"],\"answer\":0,\"whyWrong\":[null,\"En A2 lo era. En B1 el handbook escribe «an attempt at agreement… is expected»: el intento de acuerdo forma parte de la tarea.\",\"El reparto del tiempo importa, pero no es la tarea. La tarea es negociar hasta algo.\"],\"itemIds\":[\"enb1m12shallwesaythen\",\"enb1m12sowereagreed\"],\"tip\":\"Ten preparado el cierre y suéltalo cuando veas que el tiempo se acaba: «Shall we say the first one, then?» → «So we're agreed.» Treinta segundos de negociación explícita valen más que dos minutos de opiniones sueltas.\"},{\"id\":\"enb1m12l9e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige la hipótesis\",\"wrong\":\"If I would have more time, I would practise every day.\",\"answers\":[\"If I had more time, I would practise every day.\"],\"why\":\"El \u003ci\u003ewould\u003c/i\u003e traduce el «-ría» del español, y como en español decimos «si tuviera» —que no se parece a un presente—, el alumno pone \u003ci\u003ewould\u003c/i\u003e en las dos mitades. En inglés \u003cb\u003eel «would» va solo en la consecuencia\u003c/b\u003e; la mitad del «if» lleva \u003cb\u003epasado simple\u003c/b\u003e: \u003ci\u003eIf I had…, I would…\u003c/i\u003e Es exactamente el «si tendría» que en español tampoco es normativo, pero que se oye por todas partes.\",\"translation\":\"Si tuviera más tiempo, practicaría todos los días.\",\"itemIds\":[\"enb1m5ifiwereyou\"]},{\"id\":\"enb1m12l9e4\",\"type\":\"build\",\"prompt\":\"Construye la hipótesis de la negociación\",\"target\":\"If we chose the first option we would save money\",\"translation\":\"Si eligiéramos la primera opción, ahorraríamos dinero\",\"distractors\":[\"will\",\"would choose\"],\"itemIds\":[\"enb1m5whatwouldyoudo\"],\"tip\":\"Las dos fichas que sobran son las dos salidas falsas: «will» en la mitad del «if», y «would choose» en la misma mitad. El «would» solo vive en la mitad de la consecuencia.\"},{\"id\":\"enb1m12l9e5\",\"type\":\"speak\",\"prompt\":\"Parte 3: discrepa sin romper la conversación\",\"text\":\"I see your point, but I'd rather go for the second one, to be honest.\",\"phonetic\":\"ai sii yoo point, bat aid RÁA-da góu fo de SÉ-kond uan, tu bi Ó-nist\",\"translation\":\"Entiendo lo que dices, pero yo preferiría el segundo, la verdad.\",\"itemIds\":[\"enb1m12iseeyourpoint\",\"enb1m2wouldrather\"],\"tip\":\"Reconocer al otro antes de discrepar no es cortesía decorativa: es lo que permite que la conversación siga y que haya negociación que puntuar. Decir «no» a secas mata el turno y con él los tres minutos.\"},{\"id\":\"enb1m12l9e6\",\"type\":\"gapbank\",\"prompt\":\"Monta la partitura del monólogo: los cuatro engarces, en orden\",\"text\":\"___ , I'd like to say why I chose this topic. ___ is that it changed the way I work. ___ , it wasn't easy at the beginning. ___ , I'm glad I did it.\",\"answers\":[\"First of all\",\"Another reason\",\"On the other hand\",\"All in all\"],\"bank\":[\"First of all\",\"Another reason\",\"On the other hand\",\"All in all\",\"Besides\",\"For instance\"],\"translation\":\"Lo primero de todo, me gustaría decir por qué elegí este tema. Otra razón es que me cambió la manera de trabajar. Por otro lado, al principio no fue fácil. En conjunto, me alegro de haberlo hecho.\",\"itemIds\":[\"ena2m2firstofall\",\"enb1m12anotherreasonis\",\"enb1m4ontheotherhand\",\"enb1m4allinall\"],\"tip\":\"Cuatro engarces y un monólogo montado. Los dos distractores son legítimos en otro sitio pero no aquí: «Besides» añade y no abre, y «For instance» pide un ejemplo detrás, no una conclusión.\"},{\"id\":\"enb1m12l9e7\",\"type\":\"mc\",\"prompt\":\"Los treinta segundos de preparación\",\"question\":\"Tienes papel, lápiz y medio minuto antes de hablar minuto y medio. ¿Qué escribes?\",\"options\":[\"Tres palabras clave y el orden en que vas a decirlas.\",\"Las dos primeras frases, palabra por palabra.\",\"Nada: mejor pensar y no perder tiempo escribiendo.\"],\"answer\":0,\"whyWrong\":[null,\"Escribir frases enteras no cabe en treinta segundos, y luego se leen — y leer se oye en la grabación.\",\"El papel te lo dan precisamente para que lo uses. Sin nada delante, a los cuarenta segundos se te va el hilo y ahí empieza el silencio.\"],\"itemIds\":[\"enb1m12threekeywords\"],\"tip\":\"Tres palabras: una por punto. Si sabes por dónde vas, la fluidez viene sola — y la fluidez es uno de los cuatro criterios del oral, con el mismo peso que la gramática.\"},{\"id\":\"enb1m12l9e8\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4 en condiciones: treinta segundos de notas (tres palabras sueltas, no frases) y minuto y medio hablando. Y repite: la segunda pasada sale mejor.\",\"topic\":\"An exciting experience: the day I decided to take this exam\",\"slides\":[{\"title\":\"1. Anuncia\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «First of all, I'd like to talk about… I'll say three things.»\"},{\"title\":\"2. El primer punto, con un dato\",\"hint\":\"Una fecha, una cifra o un nombre: «I booked it in March, and the exam is on the sixth of June.»\"},{\"title\":\"3. El contraste\",\"hint\":\"Un pero, con conector: «Another reason is… On the other hand, at the beginning I…»\"},{\"title\":\"4. Cierra\",\"hint\":\"Una valoración y punto final: «All in all, … and that's why I'm glad I did it.»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin quedarme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Di un dato concreto: una fecha, una cifra o un nombre\",\"Usé los cuatro engarces de la partitura (First of all / Another reason / On the other hand / All in all)\",\"Cerré con una frase de cierre y no me apagué a media idea\",\"Cuando me atasqué, pedí tiempo EN INGLÉS y no me quedé callado\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «I booked the exam in March, and it's on the sixth of June. I'd already done two mock papers by then, and the second one went a lot better than the first. Another reason is that my flatmate booked hers at the same time, so neither of us could back out.»\",\"itemIds\":[\"enb1m12threekeywords\",\"enb1m12anotherreasonis\",\"ena2m2firstofall\",\"enb1m4allinall\",\"enb1m12writtenexam\"],\"tip\":\"Cronométralo de verdad. Un minuto y medio hablando solo se hace larguísimo la primera vez y corto la tercera — y esa diferencia es todo lo que separa un aprobado de un High Pass en fluidez.\"},{\"id\":\"enb1m12l9e9\",\"type\":\"paraphrase\",\"prompt\":\"Devuélvele lo que ha dicho — sin «saying» y sin «say»\",\"source\":\"So you're saying we should meet at six?\",\"forbid\":[\"saying\",\"say\"],\"answers\":[\"Do you mean we should meet at six?\",\"If I understand you correctly, six o'clock?\",\"So, six o'clock, then?\"],\"translation\":\"O sea, que dices que quedemos a las seis, ¿no?\",\"hints\":[\"Hay un verbo que significa «querer decir»\",\"Do you m___ we should meet at six?\"],\"itemIds\":[\"enb1m3sowhatyouresaying\",\"enb1m3doyoumeanthat\"],\"tip\":\"Esta técnica está literalmente en el descriptor CEFR del nivel: «repeat back part of what someone has said to confirm mutual understanding». No es un truco: es lo que el examen dice que un B1 hace.\"},{\"id\":\"enb1m12l9e10\",\"type\":\"audiomc\",\"prompt\":\"Parte 3: el interlocutor abre. Dos escuchas.\",\"audio\":\"Our class is putting together a project called 'Learning as an adult'. Here are four pictures: an evening class, a phone app, a private teacher and a study group in a library. Let's ask and answer questions to decide which two work best for people who have a full-time job. I'll start. I'd say the app, because you can use it on the bus.\",\"question\":\"¿Qué te está pidiendo que hagáis?\",\"options\":[\"Decidir entre los dos que mejor funcionan, preguntando y respondiendo.\",\"Describir las cuatro imágenes una por una.\",\"Elegir tú una y defenderla durante tres minutos.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Describir fotos era el A1 y el A2. En B1 las imágenes son solo el apoyo: lo que se mide es la negociación.\",\"«Let's ask and answer questions» — es cosa de dos. Un monólogo aquí te tumba el criterio de interacción.\"],\"itemIds\":[\"enb1m12shallwesaythen\"],\"tip\":\"Fíjate en que él empieza dando su opinión con motivo: «the app, because you can use it on the bus». Ese es el patrón que tienes que devolver — opinión + motivo — y luego negociar hacia el acuerdo.\"},{\"id\":\"enb1m12l9e11\",\"type\":\"cloze\",\"prompt\":\"Completa el cierre de la Parte 3\",\"text\":\"So we're ___ , then: the evening class and the study group.\",\"answers\":[\"agreed\"],\"translation\":\"Entonces estamos de acuerdo: la clase nocturna y el grupo de estudio.\",\"hints\":[\"Del verbo «to agree»\",\"a-greed\"],\"itemIds\":[\"enb1m12sowereagreed\"],\"tip\":\"«We're agreed» con «to be», no «we agree». Las dos existen, pero «we're agreed» es la fórmula de cerrar una negociación: suena a acta, y eso es justo lo que el examinador está esperando oír.\"},{\"id\":\"enb1m12l9e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Entiendo lo que dices, pero otra razón es que sale más barato.\",\"answers\":[\"I see your point, but another reason is that it's cheaper\",\"I see your point, but another reason is that it is cheaper\",\"I take your point, but another reason is that it's cheaper\"],\"hint\":\"Son las dos fórmulas de la partitura, unidas por «but»\",\"itemIds\":[\"enb1m12iseeyourpoint\",\"enb1m12anotherreasonis\"],\"tip\":\"Cuidado con el final: «that IT'S cheaper». En español decimos «que sale más barato» sin sujeto, y el calco «that is cheaper» deja la frase coja. El inglés exige sujeto siempre — y esa es la trampa 6, que volvemos a ver en la última lección.\"},{\"id\":\"enb1m12l9e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Tres palabras clave, no frases: en treinta segundos decides el orden, no el discurso.\",\"answers\":[\"Three key words, not sentences: in thirty seconds you decide the order, not the speech\",\"Three key words, not sentences. In thirty seconds you decide the order, not the speech\",\"Write three key words, not sentences: in thirty seconds you decide the order, not the speech\"],\"hints\":[\"La primera mitad es la frase del módulo, tal cual\",\"Three key words, not sentences: in thirty seconds you…\"],\"itemIds\":[\"enb1m12threekeywords\"],\"tip\":\"Ensáyalo con un reloj de verdad: pon treinta segundos, escribe tres palabras sobre «tu día favorito del año» y habla noventa. Hazlo dos veces. La segunda es la que te enseña de qué eres capaz.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Exam lab: Speaking Part 4 — el último de los doce\",\"body\":\"$18\",\"table\":[[\"Los 3 minutos\",\"Qué haces\",\"Qué NO haces\"],[\"0:00 – 0:30\",\"tres palabras sueltas y el orden\",\"escribir frases que luego leerás\"],[\"0:30 – 2:00\",\"anuncia · punto 1 con un dato · punto 2 con un contraste · cierra\",\"irte por las ramas y quedarte sin final\"],[\"2:00 – 3:00\",\"cuatro preguntas sobre lo que has contado\",\"contestar con una palabra\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l9e14\",\"type\":\"mc\",\"prompt\":\"Lo primero, porque se cuenta mal por ahí\",\"question\":\"En el Speaking Part 4, ¿quién elige el tema?\",\"options\":[\"El interlocutor: te ofrece tres y elige uno\",\"Tú: te ofrece tres y eliges el que prefieras\",\"Se sortea entre los tres al empezar\"],\"answer\":0,\"whyWrong\":[null,\"Es lo que casi todo el mundo cree, y es justo lo que hace que la gente se prepare un tema en casa y llegue con él aprendido. El handbook es claro: los ofrece y elige él.\",\"No hay sorteo. Hay un interlocutor con una hoja delante.\"],\"itemIds\":[\"enb1m12threekeywords\"],\"tip\":\"Que elija él cambia toda la preparación: no se prepara UN tema, se prepara UNA estructura que sirva para cualquiera. Por eso la partitura de conectores vale más que cualquier vocabulario que memorices.\"},{\"id\":\"enb1m12l9e15\",\"type\":\"audiomc\",\"prompt\":\"Escucha cuarenta segundos de una candidata en el Part 4 y decide qué le falta. Dos escuchas.\",\"audio\":\"I'd like to talk about an exciting experience. Last summer I went to Edinburgh with two friends. We stayed in a very small flat and the weather was terrible, but the city was full of shows and we saw four of them in one day. My favourite was a comedian from Glasgow. I understood about half of what he said, but the whole room was laughing so much that it didn't really matter. It was very good. It was really, really good. Yes.\",\"question\":\"Le falta una cosa, y es la que más puntos cuesta. ¿Cuál?\",\"options\":[\"El cierre: se apaga repitiendo «it was really good» en vez de rematar\",\"Vocabulario: todo lo que dice es demasiado sencillo\",\"Un dato concreto: no cuenta nada que se pueda comprobar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El vocabulario es correcto y de nivel: shows, comedian, the whole room was laughing. El B1 no premia la palabra rara.\",\"Datos concretos da tres: el verano pasado, Edimburgo, cuatro espectáculos en un día. Eso está bien hecho.\"],\"itemIds\":[\"enb1m12natthatsaboutit\",\"enb1m12anotherreasonis\"],\"tip\":\"Un «All in all, it was the best three days of the summer» habría cerrado eso en cuatro segundos. Cerrar no es cortesía: es el criterio Task Fulfilment and Coherence, y se nota tanto que el examinador lo apunta.\"},{\"id\":\"enb1m12l9e16\",\"type\":\"bucket\",\"prompt\":\"Los treinta segundos de preparación: ¿esto se hace o no se hace?\",\"categories\":[\"SÍ, en los 30 segundos\",\"NO: te va a costar puntos\"],\"items\":[{\"text\":\"Escribir tres palabras sueltas\",\"bucket\":0},{\"text\":\"Decidir en qué orden vas a contarlas\",\"bucket\":0},{\"text\":\"Elegir un dato concreto: una fecha, una cifra, un nombre\",\"bucket\":0},{\"text\":\"Escribir la primera frase entera para no trabarte\",\"bucket\":1},{\"text\":\"Escribir el monólogo y leerlo\",\"bucket\":1},{\"text\":\"Cambiar de tema porque el que te ha tocado no te gusta\",\"bucket\":1}],\"itemIds\":[\"enb1m12threekeywords\"],\"tip\":\"Lo de la primera frase parece inofensivo y es la trampa fina: en cuanto hay una frase escrita, la lees, y en cuanto lees una, lees la segunda. La entonación de lectura se oye a un metro y baja Pronunciation, Intonation and Fluency.\"},{\"id\":\"enb1m12l9e17\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4 en condiciones, segunda pasada del curso y con otro tema: el interlocutor ha elegido por ti. Treinta segundos de notas —tres palabras sueltas, ni una frase— y minuto y medio hablando. Grábate.\",\"topic\":\"A place you would go back to\",\"slides\":[{\"title\":\"Anuncia\",\"hint\":\"I'd like to talk about… I'll say three things about it.\"},{\"title\":\"Punto 1, con un dato\",\"hint\":\"Cuándo fuiste, con quién, cuánto duró. Una fecha o una cifra: First of all…\"},{\"title\":\"Punto 2, con un contraste\",\"hint\":\"Algo que no salió bien, o algo que te esperabas y no era: Although… / On the other hand…\"},{\"title\":\"Cierra\",\"hint\":\"All in all, that's why I'd go back.\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He anunciado de qué iba a hablar en la primera frase\",\"He dado al menos un dato concreto: una fecha, una cifra o un nombre\",\"He usado tres conectores distintos de la partitura\",\"He cerrado con «All in all…» y no me he apagado\",\"He hablado más de un minuto sin leer nada\"],\"itemIds\":[\"enb1m12anotherreasonis\",\"enb1m12threekeywords\",\"enb1m12natthatsaboutit\"],\"model\":\"I'd like to talk about a place I would go back to, and I'll say three things about it. First of all, the place is Whitby, on the coast in Yorkshire, and I went there for four days in October with my flatmate. We chose it because the train was cheap, which is not a very romantic reason. Another thing is the weather. It rained for three of the four days, and on the second morning we gave up and sat in a café for two hours watching the harbour, and that turned out to be the best part of the trip. On the other hand, I would not go back in October. Half of the town was closed and we ate in the same place three nights running. All in all, I'd go back tomorrow, but in June, and I'd stay a week instead of four days.\",\"tip\":\"Es la segunda vez que haces un Part 4 en este módulo, y con otro tema a propósito: la repetición de tarea no sirve si repites el mismo contenido. Compara las dos grabaciones — la de hoy va a tener menos silencios, y no es porque hoy sepas más inglés.\"},{\"id\":\"enb1m12l9e18\",\"type\":\"speak\",\"prompt\":\"Las preguntas de seguimiento: contesta en voz alta con la fórmula entera, nunca con una palabra\",\"text\":\"Personally, I think it's better in June, because the town is open and the harbour is full. For instance, when we went in October half of the cafés were shut.\",\"phonetic\":\"PÉE-so-na-li ai zink its BÉ-ta in dchuun, bi-KÓS̬ de taun is̬ ÓU-pen and de JÁA-ba is̬ ful · fo INS-tans, uen ui uent in ok-TÓU-ba jaaf ov de KÁ-feis̬ ueer shat\",\"translation\":\"Personalmente creo que es mejor en junio, porque el pueblo está abierto y el puerto está lleno. Por ejemplo, cuando fuimos en octubre la mitad de las cafeterías estaban cerradas.\",\"itemIds\":[\"enb1m12personallyithink\",\"enb1m12anotherreasonis\"],\"tip\":\"Opinión + porque + ejemplo: quince segundos y tres criterios tocados. Y ojo, que las cuatro preguntas de seguimiento salen de lo que TÚ has contado — si en el monólogo has dicho «octubre» y «cuatro días», ya sabes por dónde van a venir.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m12-3\",\"book\":\"You mean…?\",\"real\":\"So you're saying…?\",\"meaning\":\"O sea, que dices que… ¿no?\",\"when\":\"En la Parte 3, cuando quieres confirmar lo que ha propuesto el otro antes de aceptar o discrepar. Vale con cualquiera y en cualquier registro. Lo que NO hace es rellenar: si lo usas cada dos frases, suena a que no te enteras de nada.\",\"register\":\"neutral\",\"exam\":\"So, if I understand correctly, you're saying that…\",\"note\":\"Esta fórmula está en el descriptor oficial del B1 —«can repeat back part of what someone has said to confirm mutual understanding»—, así que no es un truco de examen: es el nivel. Y de propina te compra dos segundos de pensar mientras la dices.\",\"sound\":\"sóu yoo SÉI-ing\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m12natsoyouresaying\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{
