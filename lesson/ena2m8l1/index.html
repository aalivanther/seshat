posesivo\u003c/b\u003e. El español dice «me rompí \u003cu\u003eel\u003c/u\u003e brazo» porque el «me» ya avisa de quién es; el inglés no tiene ese «me», así que lo dice con \u003cb\u003emy\u003c/b\u003e: [[I broke my arm.|Me rompí el brazo.]] · \u003ci\u003eI cut my finger.\u003c/i\u003e · \u003ci\u003eShe hurt her back.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003eI broke the arm\u003c/i\u003e suena a que rompiste el brazo de otro, o el de una silla.\u003cbr/\u003e\u003cbr/\u003eTres plurales que no llevan -s y que son justo los del cuerpo: \u003cb\u003ea foot → feet\u003c/b\u003e, \u003cb\u003ea tooth → teeth\u003c/b\u003e, \u003cb\u003ea hand → hands\u003c/b\u003e (esta sí, tranquilo)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l1\",\"phaseId\":\"ena2m8\",\"title\":\"My head hurts\",\"subtitle\":\"Decir qué te duele — y por qué «I have pain in my head» no lo dice nadie\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El cuerpo y el dolor\",\"itemIds\":[\"ena2m8wheredoesithurt\",\"ena2m8myheadhurts\",\"ena2m8ihaveaheadache\",\"ena2m8achegroup\",\"ena2m8bodypartsgroup\",\"ena2m8handsfeetteeth\",\"ena2m8ibrokemyarm\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«Me duele la cabeza» tiene dos traducciones — y ninguna es la que te sale\",\"body\":\"$17\",\"table\":[[\"en español\",\"en inglés, bien\",\"en inglés, mal\"],[\"Me duele la cabeza.\",\"My head hurts. / I have a headache.\",\"I have pain in my head.\"],[\"Me duele la espalda.\",\"My back hurts. / I have backache.\",\"I have pain in the back.\"],[\"Me duelen los pies.\",\"My feet hurt.\",\"My foots hurts.\"],[\"Me rompí el brazo.\",\"I broke my arm.\",\"I broke the arm.\"],[\"Me corté el dedo.\",\"I cut my finger.\",\"I cut the finger.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las partes del cuerpo\",\"pairs\":[{\"target\":\"the head\",\"source\":\"la cabeza\"},{\"target\":\"the throa
