/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T70a,"])</script><script>self.__next_f.push([1,"Contar que a alguien le ha pasado algo es una de las cosas que el B1 pide por escrito, y tiene una estructura fija. \u003cb\u003eCuatro movimientos\u003c/b\u003e:\u003cbr/\u003e1. \u003cb\u003eQuita el miedo primero.\u003c/b\u003e Si empiezas por «Nora had a fall» sin más, quien lee se asusta hasta el final. Los ingleses abren con el resultado: \u003ci\u003eeverything's fine now\u003c/i\u003e.\u003cbr/\u003e2. \u003cb\u003eCuenta qué pasó\u003c/b\u003e, en pasado simple.\u003cbr/\u003e3. \u003cb\u003eCuenta qué dijeron\u003c/b\u003e — y aquí vuelve el estilo indirecto del módulo 3, sin anunciarse: \u003ci\u003eThe paramedic said she had been very lucky.\u003c/i\u003e\u003cbr/\u003e4. \u003cb\u003eDi cómo está ahora\u003c/b\u003e y cierra con un plan.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres cosas de vocabulario que no se traducen:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ehave a fall\u003c/b\u003e — así se cuenta la caída de una persona mayor. \u003ci\u003eNora fell\u003c/i\u003e es correcto; \u003ci\u003eNora had a fall\u003c/i\u003e es lo que se dice, y suena menos brusco.\u003cbr/\u003e· \u003cb\u003ebe shaken up\u003c/b\u003e — llevarse un susto. Habla del ánimo, no del cuerpo.\u003cbr/\u003e· \u003cb\u003e111\u003c/b\u003e — el número al que se llama cuando no es una emergencia pero no puede esperar. El 999 es la ambulancia de verdad. Confundirlos es de las cosas que hay que saber viviendo allí.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY los conectores de hoy\u003c/b\u003e, que son los que puntúan en el criterio de coherencia:\u003cbr/\u003e· \u003cb\u003eLuckily,\u003c/b\u003e — por suerte. Abre frase y va con coma.\u003cbr/\u003e· \u003cb\u003e…, though.\u003c/b\u003e — eso sí. Cierra frase.\u003cbr/\u003e· \u003cb\u003eIn addition,\u003c/b\u003e — además. Abre frase, con coma, y es más de escribir que de hablar.\u003cbr/\u003e· \u003cb\u003eOn the other hand,\u003c/b\u003e — por otro lado. Abre la parte que va en dirección contraria a lo que acabas de decir.\u003cbr/\u003e\u003cbr/\u003eOjo con el último: \u003cb\u003e«on the other hand» pide que antes haya una mano\u003c/b\u003e. Si no has dicho nada que contraste, no se puede usar. Es el fallo típico de quien mete conectores por meterlos: el examinador nota enseguida que el conector no une nada."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l8\",\"phaseId\":\"enb1m6\",\"title\":\"Nora had a fall\",\"subtitle\":\"Contar un susto por escrito: luckily, though, in addition, on the other hand\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del susto\",\"itemIds\":[\"enb1m6hadafall\",\"enb1m6calledanambulance\",\"enb1m6luckily\",\"enb1m6shakenup\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m6keepyouposted\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: un susto se cuenta en cuatro movimientos\",\"body\":\"$17\",\"table\":[[\"Movimiento\",\"Frase tipo\"],[\"1. Quitar el miedo\",\"Everything's fine now, but…\"],[\"2. Qué pasó\",\"Nora had a fall on the stairs on Sunday.\"],[\"3. Qué dijeron\",\"The paramedic said she had been very lucky.\"],[\"4. Cómo está y qué toca\",\"She's a bit shaken up, though. I'll keep you posted.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del relato\",\"pairs\":[{\"target\":\"Nora had a fall on the stairs.\",\"source\":\"Nora se cayó en la escalera.\"},{\"target\":\"She was a bit shaken up.\",\"source\":\"Se llevó un buen susto.\"},{\"target\":\"Luckily, nothing was broken.\",\"source\":\"Por suerte no se rompió nada.\"},{\"target\":\"I'll keep you posted.\",\"source\":\"Te voy contando.\"}],\"itemIds\":[\"enb1m6hadafall\",\"enb1m6shakenup\",\"enb1m6luckily\",\"enb1m6keepyouposted\"],\"tip\":\"«Had a fall» y no «fell»: el inglés convierte la caída en un sustantivo y así suena menos aparatoso. Es el mismo mecanismo de «have a look» o «have a think».\"},{\"id\":\"enb1m6l8e2\",\"type\":\"mc\",\"prompt\":\"El número al que se llama\",\"question\":\"Nora se ha caído, está consciente y le duele la cadera. ¿A quién llamas?\",\"options\":[\"Al 111, que es lo urgente que no es emergencia\",\"Al 999 siempre que haya una caída\",\"Al centro de salud, y esperas al día siguiente\"],\"answer\":0,\"whyWrong\":[null,\"El 999 es para emergencias graves: pérdida de consciencia, sangrado fuerte, dificultad para respirar. Para el resto está el 111, que además puede mandar una ambulancia si hace falta.\",\"Una caída con dolor no espera a mañana. El centro de salud fuera de horario te manda al out-of-hours de todas formas.\"],\"itemIds\":[\"enb1m6calledanambulance\",\"enb1m6outofhours\"],\"tip\":\"Este dato no es cultura general: es de los que cambian lo que le pasa a alguien. Y en el examen aparece igual, porque el Reading del B1 mete folletos de servicios públicos.\"},{\"id\":\"enb1m6l8e3\",\"type\":\"order\",\"prompt\":\"Ordena lo que pasó el domingo\",\"sentences\":[\"Valeria heard something on the stairs at about nine on Sunday morning.\",\"Nora was sitting on the bottom step, more embarrassed than hurt.\",\"Valeria rang 111 and they sent somebody out within the hour.\",\"The paramedic checked her over and said she had been very lucky.\",\"By the evening Nora was back in her chair, complaining about the fuss.\"],\"translation\":\"Valeria oyó algo en la escalera hacia las nueve del domingo. Nora estaba sentada en el último escalón, más avergonzada que herida. Valeria llamó al 111 y mandaron a alguien en menos de una hora. La paramédica la revisó y dijo que había tenido mucha suerte. Por la tarde Nora ya estaba en su sillón, quejándose del jaleo.\",\"itemIds\":[\"enb1m6hadafall\",\"enb1m6calledanambulance\",\"enb1m3toldmethat\"],\"tip\":\"Fíjate en la cuarta: «said she HAD BEEN very lucky». Es el estilo indirecto del módulo 3 funcionando dentro de un relato normal. Nadie lo anuncia y ahí está.\"},{\"id\":\"enb1m6l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa el adverbio que abre la frase\",\"text\":\"___ , nothing was broken.\",\"answers\":[\"Luckily\",\"luckily\"],\"translation\":\"Por suerte no se rompió nada.\",\"hints\":[\"Es el adverbio de «suerte»\",\"Empieza por «Luck…» y acaba en -ly\"],\"itemIds\":[\"enb1m6luckily\"],\"tip\":\"«Luckily» y «Fortunately» valen igual. Lo que no vale es «Luckly» ni «Lucky»: el adverbio necesita la -i- («lucky» → «luckily»), y la ortografía puntúa dentro del criterio de vocabulario.\"},{\"id\":\"enb1m6l8e5\",\"type\":\"transform\",\"prompt\":\"Mueve el contraste al final\",\"source\":\"Although she's a bit shaken up, she's fine.\",\"instruction\":\"Dilo en dos frases, con «though» al final\",\"answers\":[\"She's fine. She's a bit shaken up, though\",\"She's fine. She's a bit shaken up, though.\"],\"translation\":\"Está bien. Se llevó un buen susto, eso sí.\",\"hints\":[\"Empieza por lo tranquilizador\",\"She's fine. She's a bit shaken up, ...\"],\"itemIds\":[\"enb1m5though\",\"enb1m6shakenup\"],\"tip\":\"El orden importa: primero lo que tranquiliza, después el matiz. Al revés, quien lee se queda con el susto — y en una carta informal eso es no cumplir la función.\"},{\"id\":\"enb1m6l8e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen para Emma\",\"text\":\"Nora had a fall on Sunday. ___ , nothing was broken. She's a bit shaken up, ___ . ___ , the council are coming to fit a rail on the stairs.\",\"answers\":[\"Luckily\",\"though\",\"In addition\"],\"bank\":[\"Luckily\",\"though\",\"In addition\",\"Unfortunately\",\"otherwise\",\"for instance\"],\"translation\":\"Nora se cayó el domingo. Por suerte no se rompió nada. Se llevó un buen susto, eso sí. Además, el ayuntamiento va a ponerle un pasamanos en la escalera.\",\"itemIds\":[\"enb1m6luckily\",\"enb1m5though\",\"enb1m4inaddition\",\"enb1m6hadafall\"],\"tip\":\"Tres conectores y tres posiciones: uno abre con coma, otro cierra con coma delante y el tercero abre un párrafo nuevo. Colocarlos bien es la mitad del criterio de Organisation, que además incluye la puntuación.\"},{\"id\":\"enb1m6l8e7\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, ha visto tu mensaje de anoche y está preocupada. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Valeria!! I've just seen your message about Nora and an ambulance and then nothing for twelve hours. What actually happened? Is she all right? And do you need me to come down — I've got days off owing.\"},\"bullets\":[\"Cuéntale qué pasó el domingo, y qué dijo la paramédica.\",\"Dile cómo está Nora ahora.\",\"Contéstale a lo de venir y propón un plan.\"],\"checks\":[{\"re\":\"(fall|fell|stairs|ambulance|111|paramedic)\",\"label\":\"Cuentas qué pasó el domingo\"},{\"re\":\"(said|told|nothing was broken|shaken|she'?s (fine|all right|ok|better))\",\"label\":\"Dices cómo está ahora, contando lo que dijeron\"},{\"re\":\"(don'?t have to|no need|come down|weekend|we could|why don'?t)\",\"label\":\"Contestas a lo de venir y propones un plan\"}],\"frame\":[\"Saludo: «Hi Emma,» y una primera línea que quite el miedo\",\"Qué pasó, en dos frases y en pasado simple\",\"Qué dijeron: «The paramedic said (that)…» en estilo indirecto\",\"Cómo está ahora, con un «…, though.» o un «Luckily,…»\",\"Un dato más con «In addition,…»\",\"Lo de venir, con «On the other hand,…» + un plan concreto, y tu nombre a secas\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"though\",\"in addition\",\"on the other hand\",\"luckily\",\"although\",\"anyway\",\"at least\",\"actually\",\"besides\",\"apart from\",\"in spite of\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nSorry for the dramatic message last night — everything is fine now. Nora had a fall on the stairs on Sunday morning, and I found her sitting on the bottom step, more embarrassed than hurt. I rang 111 and they sent somebody out. The paramedic said she had been very lucky, and that nothing was broken.\\nShe's a bit shaken up, though, and the GP wants to see her about her tablets. In addition, the council are coming to fit a rail on the stairs.\\nHonestly, you don't have to come down. On the other hand, if you fancy a weekend in June, we would both love it. I'll keep you posted.\\nValeria\",\"itemIds\":[\"enb1m6hadafall\",\"enb1m6shakenup\",\"enb1m5though\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\",\"enb1m6keepyouposted\",\"enb1m3toldmethat\"],\"tip\":\"Cuenta las palabras: 100-120. Y mira el modelo: abre quitando el miedo, mete el estilo indirecto sin anunciarlo («The paramedic said she had been…») y cierra con un plan. Tres conectores distintos y ni un «Yours sincerely» — meter la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m6l8e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Se llevó un buen susto, eso sí.\",\"answers\":[\"She was a bit shaken up, though\",\"She was a bit shaken up, though.\",\"She's a bit shaken up, though\"],\"hint\":\"El contraste va al final, detrás de una coma\",\"itemIds\":[\"enb1m6shakenup\",\"enb1m5though\"],\"tip\":\"«A bit» no es «un poco» en el sentido de poca cosa: es el understatement británico otra vez. «A bit shaken up» puede significar que se pasó el día temblando.\"},{\"id\":\"enb1m6l8e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué te está diciendo?\",\"source\":\"On the other hand, you don't have to come down.\",\"answers\":[\"Por otro lado, no hace falta que vengas\",\"Por otra parte, no tienes que venir\",\"Por otro lado, no hace falta que bajes\"],\"itemIds\":[\"enb1m4ontheotherhand\",\"enb1m6donthaveto\"],\"tip\":\"«Come down» de Mánchester a Londres es «bajar» en el mapa, igual que en español. Y fíjate en el «don't have to»: no es una prohibición, es un permiso para no molestarse.\"},{\"id\":\"enb1m6l8e10\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"Luckily, nothing was broken.\",\"translation\":\"Por suerte no se rompió nada.\",\"hints\":[\"Empieza por el adverbio de suerte, con coma detrás\",\"Luckily, nothing ...\"],\"itemIds\":[\"enb1m6luckily\"],\"tip\":\"Escribe la coma: en el criterio de Organisation la puntuación cuenta, y un adverbio de frase sin coma detrás es un error de puntuación en toda regla.\"},{\"id\":\"enb1m6l8e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — los cuatro movimientos, en veinte segundos\",\"text\":\"Everything's fine now. Nora had a fall on Sunday. Luckily, nothing was broken. She's a bit shaken up, though.\",\"phonetic\":\"É-vri-zing s̬ fáin nau · NÓO-ra jad a fool on SÁN-dei · LÁ-ki-li, NÁ-zing uos̬ BRÓU-ken · shis a bit SHÉI-ken ap, dóu\",\"translation\":\"Ya está todo bien. Nora se cayó el domingo. Por suerte no se rompió nada. Se llevó un buen susto, eso sí.\",\"itemIds\":[\"enb1m6hadafall\",\"enb1m6luckily\",\"enb1m6shakenup\",\"enb1m5though\"],\"tip\":\"El «though» final baja de tono y se dice casi sin fuerza: es una coletilla, no una palabra importante. Si la dices con énfasis suena a que llevas la contraria.\"},{\"id\":\"enb1m6l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Además, el ayuntamiento va a ponerle un pasamanos en la escalera. Te voy contando.\",\"answers\":[\"In addition, the council are going to fit a rail on the stairs. I'll keep you posted\",\"In addition, the council are going to put a rail on the stairs. I'll keep you posted\",\"In addition, the council is going to fit a rail on the stairs. I'll keep you posted\"],\"hints\":[\"Empieza por el conector de «además», con coma\",\"In addition, the council ... a rail on the stairs. I'll keep you posted\"],\"itemIds\":[\"enb1m4inaddition\",\"enb1m6keepyouposted\"],\"tip\":\"«The council are» con verbo en plural es normal en inglés británico: los colectivos (the council, the team, the government) se tratan como grupo de personas. En americano irían en singular. Aquí valen las dos.\"},{\"id\":\"enb1m6l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy vuelve del turno y pregunta. Dos escuchas.\",\"audio\":\"Any news about Nora?|She's all right. The GP rang this morning — she wants to see her about the tablets she's on.|Ah. That'll be the blood pressure ones. They can make you dizzy when you stand up.|That's exactly what the paramedic said on Sunday. She asked me straight away what Nora was taking.|Good. That's the right question. And has anybody done anything about that carpet on the top step?|The council are coming Thursday, apparently. Rail on the stairs as well.|Right, well, that's something. She'll be all over that stairlift catalogue by Friday, mind.\",\"question\":\"¿Por qué quiere verla la médica de cabecera?\",\"options\":[\"Por las pastillas que está tomando\",\"Por la moqueta del último escalón\",\"Por la cita del ayuntamiento del jueves\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De la moqueta habla Amy, y no tiene nada que ver con la cita médica.\",\"El ayuntamiento va a poner el pasamanos: eso no lo decide el GP.\"],\"itemIds\":[\"ena2m8takeonetabletthreetimesaday\",\"enb1m6gp\",\"enb1m3toldmethat\"],\"tip\":\"Fíjate en cómo confirma Valeria: «That's exactly what the paramedic said». En el Listening Part 2 esa clase de frase es oro — te dice que dos personas coinciden, y las preguntas de actitud se contestan justo ahí.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
