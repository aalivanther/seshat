03cbr/\u003e\u003cbr/\u003eEsto ya es \u003cb\u003eterreno B2\u003c/b\u003e y el temario oficial de LanguageCert lo coloca ahí; te lo damos porque lo vas a leer en el propio examen y porque, en cuanto empieces a contar un lío de dinero, lo vas a necesitar. Con \u003cb\u003ereconocerlo y usar la fórmula entera\u003c/b\u003e te sobra: nadie te va a pedir que lo conjugues por escrito.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres frases de cierre para no quedarte ahí\u003c/b\u003e, que son las que dice un adulto y no un culebrón: \u003ci\u003eIt's my own fault.\u003c/i\u003e · \u003ci\u003eThere's no point in worrying about it.\u003c/i\u003e · \u003ci\u003eI've learnt my lesson.\u003c/i\u003e Fíjate en la última: detrás de \u003ci\u003eno point \u003cb\u003ein\u003c/b\u003e\u003c/i\u003e va -ing, como detrás de cualquier preposición."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l5\",\"phaseId\":\"enb1m5\",\"title\":\"I wish I hadn't\",\"subtitle\":\"Desear lo que no es y lamentar lo que fue — wish, if only y should have\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que te gustaría y lo que ya no tiene arreglo\",\"itemIds\":[\"enb1m5iwish\",\"enb1m5ifonly\",\"enb1m5shouldhavekept\",\"enb1m5shouldnthavebought\",\"enb1m5myownfault\",\"enb1m5nopointin\",\"enb1m5learntmylesson\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el mismo pasado irreal, ahora para desear\",\"body\":\"$17\",\"table\":[[\"Ahora\",\"Ya pasó\"],[\"I wish I had more money.\",\"I should have kept the receipt.\"],[\"If only it were cheaper!\",\"I shouldn't have bought it.\"],[\"wish / if only + PASADO\",\"should (not) have + PARTICIPIO\"],[\"Nunca: I wish I have…\",\"Nunca: I should have keep…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l5e1\",\"type\":\"match\",\"prompt\":\"Empareja las cinco frases del arrepentimiento\",\"pairs\":[{\"target\":\"I wish I had more money.\",\"source\":\"Ojalá tuviera más dinero.\"},{\"target\":\"If only it were cheaper!\",\"source\":\"¡Ojalá fuera más barato!\"},{\"target\":\"I should have kept the receipt.\",\"source\":\"Debería haber guardado el tique.\"},{\"target\":\"It's my own fault.\",\"source\":\"La culpa es mía.\"},{\"target\":\"There's no point in worrying about it.\",\"source\":\"No sirve de nada darle vueltas.\"}],\"itemIds\":[\"enb1m5iwish\",\"enb1m5ifonly\",\"enb1m5shouldhavekept\",\"enb1m5myownfault\",\"enb1m5nopointin\"],\"tip\":\"Las dos primeras hablan de ahora, la tercera de lo que ya pasó y las dos últimas cierran el tema. Ese es el guion entero de cualquier historia de dinero mal gastado.\"},{\"id\":\"enb1m5l5e2\",\"type\":\"mc\",\"prompt\":\"El calco del «ojalá»\",\"question\":\"«Ojalá tuviera más dinero» →\",\"options\":[\"I wish I have more money.\",\"I wish I had more money.\",\"I wish I would have more money.\"],\"answer\":1,\"whyWrong\":[\"Detrás de «wish» no va presente jamás, aunque estemos hablando de ahora mismo.\",null,\"«would have» otra vez: la misma pieza que sobraba en la mitad del if.\"],\"itemIds\":[\"enb1m5iwish\"],\"tip\":\"El pasado detrás de «wish» no habla de ayer: dice «esto no es verdad». Es exactamente el mismo pasado irreal del condicional, con otro sombrero.\"},{\"id\":\"enb1m5l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I wish I have more money.\",\"answers\":[\"I wish I had more money.\"],\"why\":\"Detrás de «wish» va pasado, siempre. El presente lo pone el español, porque «ojalá tenga» habla del presente; el inglés marca lo irreal con el pasado.\",\"translation\":\"Ojalá tuviera más dinero.\",\"itemIds\":[\"enb1m5iwish\"]},{\"id\":\"enb1m5l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa el deseo\",\"text\":\"I wish I ___ more time to compare prices.\",\"answers\":[\"had\"],\"translation\":\"Ojalá tuviera más tiempo para comparar precios.\",\"hints\":[\"Detrás de «wish» nunca va presente\",\"El pasado simple de «have»\"],\"itemIds\":[\"enb1m5iwish\"],\"tip\":\"Una sola palabra. Si te salen dos, has escrito «would have» — y ese es el calco del módulo entero.\"},{\"id\":\"enb1m5l5e5\",\"type\":\"transform\",\"prompt\":\"Del lamento suelto a la fórmula\",\"source\":\"I'm sorry I bought it.\",\"instruction\":\"Dilo con «should»\",\"answers\":[\"I shouldn't have bought it\",\"I should not have bought it\"],\"translation\":\"No debería haberlo comprado.\",\"hints\":[\"should + not + have + participio\",\"I shouldn't have ... it\"],\"itemIds\":[\"enb1m5shouldnthavebought\"],\"tip\":\"«I'm sorry I bought it» está bien, pero es lo que diría un A2. La versión de nivel es «I shouldn't have bought it», y es una fórmula: apréndetela entera y cámbiale solo el participio.\"},{\"id\":\"enb1m5l5e6\",\"type\":\"bucket\",\"prompt\":\"¿Habla de AHORA o de lo que ya pasó?\",\"categories\":[\"Deseo sobre AHORA — wish / if only + pasado\",\"Arrepentimiento del PASADO — should have + participio\"],\"items\":[{\"text\":\"I wish I had more money.\",\"bucket\":0},{\"text\":\"If only it were cheaper!\",\"bucket\":0},{\"text\":\"I wish the shop were nearer.\",\"bucket\":0},{\"text\":\"I should have kept the receipt.\",\"bucket\":1},{\"text\":\"I shouldn't have bought it.\",\"bucket\":1},{\"text\":\"We should have asked the price first.\",\"bucket\":1}],\"itemIds\":[\"enb1m5iwish\",\"enb1m5ifonly\",\"enb1m5shouldhavekept\",\"enb1m5shouldnthavebought\"],\"tip\":\"Lo que decide es si todavía se puede cambiar algo. Si el mundo puede ser distinto mañana, «wish». Si ya está hecho y no hay vuelta, «should have».\"},{\"id\":\"enb1m5l5e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje que Valeria le manda a Clara\",\"text\":\"I've been going over it all week. I wish I ___ kept the receipt, and if only the shop ___ nearer, because I'd have taken it back the same day. It's my own ___, though: I knew it was too cheap. There's no ___ in worrying about it now.\",\"answers\":[\"had\",\"were\",\"fault\",\"point\"],\"bank\":[\"had\",\"were\",\"fault\",\"point\",\"have\",\"was\",\"faulty\",\"pointless\"],\"translation\":\"Llevo toda la semana dándole vueltas. Ojalá hubiera guardado el tique, y ojalá la tienda estuviera más cerca, porque lo habría devuelto el mismo día. Pero la culpa es mía: sabía que era demasiado barato. Ya no sirve de nada darle vueltas.\",\"itemIds\":[\"enb1m5iwish\",\"enb1m5ifonly\",\"enb1m5myownfault\",\"enb1m5nopointin\"],\"tip\":\"Cuatro huecos y ni un «would» en toda la nota. El arrepentimiento en inglés se cuenta con pasados, no con condicionales.\"},{\"id\":\"enb1m5l5e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¡Ojalá fuera más barato!\",\"answers\":[\"If only it were cheaper\",\"If only it were cheaper!\",\"If only it was cheaper!\",\"I wish it were cheaper\"],\"hint\":\"Dos palabras para abrir, y detrás el pasado de «be»\",\"itemIds\":[\"enb1m5ifonly\",\"encheap\"],\"tip\":\"«If only» va casi siempre sola, sin segunda mitad. No es una frase a medias: es una queja completa.\"},{\"id\":\"enb1m5l5e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «should» y sin «bought»\",\"source\":\"I shouldn't have bought it.\",\"forbid\":[\"should\",\"bought\"],\"answers\":[\"I regret buying it\",\"Buying it was a mistake\",\"It was a mistake to buy it\"],\"translation\":\"No debería haberlo comprado.\",\"hints\":[\"Hay un verbo que significa «arrepentirse» y pide -ing detrás\",\"I regret ... it\"],\"itemIds\":[\"enb1m5shouldnthavebought\",\"ena2m2imadeamistake\"],\"tip\":\"«regret» pide -ing: «I regret buying it». Con infinitivo («I regret to tell you…») significa otra cosa: es la fórmula con la que se dan malas noticias por escrito.\"},{\"id\":\"enb1m5l5e10\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I should have keep the receipt.\",\"answers\":[\"I should have kept the receipt.\"],\"why\":\"Detrás de «have» va participio, no infinitivo: kept, no keep. El español dice «haber guardado» y el infinitivo se cuela por ahí.\",\"translation\":\"Debería haber guardado el tique.\",\"itemIds\":[\"enb1m5shouldhavekept\",\"ena2m7thereceipt\"]},{\"id\":\"enb1m5l5e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"There's no point in worrying about it.\",\"translation\":\"No sirve de nada darle vueltas.\",\"strictContractions\":true,\"hints\":[\"Empieza por «There's…»\",\"There's no point in ... about it\"],\"itemIds\":[\"enb1m5nopointin\",\"enb1m1worryabout\"],\"tip\":\"Dos preposiciones seguidas y cada una con lo suyo: «point IN worrying» y «worry ABOUT it». Se aprenden en bloque, como una palabra larga.\"},{\"id\":\"enb1m5l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La culpa es mía y ya he escarmentado.\",\"answers\":[\"It's my own fault and I've learnt my lesson\",\"It's my own fault and I have learnt my lesson\",\"It's my own fault and I've learned my lesson\"],\"hints\":[\"«La culpa es mía» son cuatro palabras en inglés\",\"It's my own ... and I've ... my lesson\"],\"itemIds\":[\"enb1m5myownfault\",\"enb1m5learntmylesson\"],\"tip\":\"«learnt» y «learned» valen las dos; en el Reino Unido se escribe más «learnt». Y ojo con «fault»: es la culpa de un fallo, no la culpa moral — esa sería «guilt», y no se usa así.\"},{\"id\":\"enb1m5l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Ben, después de una compra que salió mal. Toma notas mientras suena. Dos escuchas.\",\"notepad\":true,\"audio\":\"Eighty pounds, Ben. Eighty. And it's been in the cupboard since March.|Well, you used it once.|Twice. I wish I'd waited for the sales, honestly. If only I'd asked somebody first — Amy's got one and she'd have lent me hers.|Have you thought about selling it? People buy that sort of thing.|I've thought about it. I'd get thirty for it, maybe. Then I'd have spent fifty pounds on using a machine twice.|Or you keep it and use it. That works too.|It does. Anyway, it's my own fault and there's no point going on about it. I've learnt my lesson: I'm not buying anything over fifty pounds without sleeping on it first.\",\"question\":\"¿Qué ha decidido Valeria al final?\",\"options\":[\"No comprar nada de más de cincuenta libras sin pensárselo un día\",\"Vender el aparato por treinta libras\",\"Pedirle el suyo a Amy la próxima vez\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo calcula en voz alta y lo descarta: le saldría peor.\",\"Es lo que debería haber hecho antes, no lo que decide ahora.\"],\"itemIds\":[\"enb1m5iwish\",\"enb1m5ifonly\",\"enb1m5myownfault\",\"enb1m5learntmylesson\"],\"tip\":\"«sleep on it» es consultarlo con la almohada. Y fíjate en el cierre: «Anyway, it's my own fault and there's no point going on about it» — anuncia que cambia de tema y cierra. En el Speaking eso vale puntos de Task Fulfilment.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"hr
