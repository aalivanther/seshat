:[\"enb2m10fortyyears\",\"enb2m10headvisedmenotto\",\"enb2m10wehadbeenwalking\",\"enb2m10murmurednora\"]},{\"id\":\"enb2m10l9e2\",\"type\":\"audiomc\",\"prompt\":\"Nora y Valeria, en la acera, después. Pregunta ANTES. Dos escuchas.\",\"plays\":2,\"audio\":\"You all right?|Yeah. I will be.|You were in there a long time.|I'd been looking for that platform. Not the picture — the platform.|Ade said the name's in the catalogue.|I don't need the catalogue. I had a ticket. I still have it.|He was like, don't go, my sister's husband, 1984. So I didn't.|And today?|Today I went. That's the story underneath, love. Not the photograph.\",\"question\":\"¿Qué era, para Nora, «lo de debajo»?\",\"options\":[\"Que un cuñado le dijo que no fuera, y por eso no había entrado en cuarenta años.\",\"Que quería comprar la fotografía y Ade no se la vendía.\",\"Que el catálogo costaba doce libras y le pareció un robo.\"],\"answer\":0,\"whyWrong\":[null,\"No habla de comprar. Habla del billete y del cuñado.\",\"Ade menciona el catálogo; Nora lo descarta. No es el tema.\"],\"itemIds\":[\"enb2m10fortyyears\",\"enb2m10nattoldnottogo\",\"enb2m10thestoryunderneath\"]},{\"id\":\"enb2m10l9e3\",\"type\":\"transform\",\"prompt\":\"Invierte: never before + had I\",\"source\":\"I had never seen her like that before.\",\"instruction\":\"Never before had I…\",\"answers\":[\"Never before had I seen her like that.\",\"Never before had I seen her like that before.\"],\"translation\":\"Nunca la había visto así.\",\"itemIds\":[\"enb2m10neverbeforehadiseen\"]},{\"id\":\"enb2m10l9e4\",\"type\":\"paraphrase\",\"prompt\":\"La de Nora, en examen, sin like\",\"source\":\"He was like, don't go.\",\"forbid\":[\"like\",\"don't\",\"Don't\"],\"answers\":[\"He advised me not to go.\",\"He told me not to go.\",\"He warned me not to go.\"],\"translation\":\"Me aconsejó que no fuera.\",\"itemIds\":[\"enb2m10headvisedmenotto\"]},{\"id\":\"enb2m10l9e5\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4, reloj de B2: 30 segundos y DOS MINUTOS. Repite.\",\"topic\":\"A place that meant more than it seemed — and the story underneath\",\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"slides\":[{\"title\":\"1. Anuncia\",\"hint\":\"«I'd like to talk about a gallery I went to with Nora. I'll say what we saw, what had been going on underneath, and why it stayed with me.»\"},{\"title\":\"2. La noticia\",\"hint\":\"The small room, the photograph, Ade. Pasado simple. Poco.\"},{\"title\":\"3. El fondo\",\"hint\":\"who had been waiting / she hadn't been inside in forty years / he had advised her not to go / we'd been walking when…\"},{\"title\":\"4. La evaluación y el cierre\",\"hint\":\"I found it profoundly moving. Looking back… Never before had I… And that's what I wanted to say.\"}],\"checklist\":[\"Hablé al menos 1:45\",\"Anuncié de cuántas cosas iba a hablar\",\"Puse al menos DOS fondos en past perfect / relativa\",\"Evalué con I found it… o looking back…, no con very nice\",\"No mezclé el presente narrativo en las doce frases\",\"En la segunda pasada no miré las pistas\"],\"model\":\"Solo el punto 3: «Nora, who had not been inside a gallery in forty years, took my arm in the doorway. A brother-in-law had advised her not to go, in 1984, and in the years that followed she didn't. We'd been walking around the chairs and the still lifes when Ade opened the small room. That's the story underneath. The photograph was just the door.»\",\"itemIds\":[\"enb2m10fortyyears\",\"enb2m10headvisedmenotto\",\"enb2m10thestoryunderneath\",\"enb2m10profoundlymoving\"]},{\"id\":\"enb2m10l9e6\",\"type\":\"speak\",\"prompt\":\"La inversión, en voz alta\",\"text\":\"Never before had I seen anything like it.\",\"phonetic\":\"né-va bi-FÓO jad ai siin É-ni-zing laik it\",\"translation\":\"Nunca había visto nada igual.\",\"itemIds\":[\"enb2m10neverbeforehadiseen\"]},{\"id\":\"enb2m10l9e7\",\"type\":\"listen\",\"prompt\":\"Dictado: la cita de Nora\",\"text\":\"Forty years, murmured Nora.\",\"translation\":\"Cuarenta años, murmuró Nora.\",\"itemIds\":[\"enb2m10murmurednora\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m10-3\",\"book\":\"I had never seen it before.\",\"real\":\"Never seen it before, me.\",\"meaning\":\"Yo no lo había visto nunca.\",\"when\":\"La elipsis con me al final es de conversación, de andén, de salida de la galería. En el Writing y en el monólogo, la inversión: Never before had I seen…, que sí es B2. I had never seen it before también vale, y es la de B1: correcta, y es evitación si ya sabes la otra.\",\"register\":\"amigos\",\"exam\":\"Never before had I seen it.\",\"note\":\"El me al final no es un complemento: es un sello de «hablo yo». En el papel no se pone.\",\"sound\":\"né-va siin it bi-FÓO, mi\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m10neverbeforehadiseen\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256
