 chat, un desmentido), la concesión (el grupo tiene razón en que nadie fue consultado), el cierre (la pasiva hace un trabajo; hay que mirar cuál).\u003cbr/\u003e\u003cbr/\u003eTreinta segundos, cinco palabras: leak · paper · group · Patel · who.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l9e1\",\"type\":\"order\",\"prompt\":\"Ordena cómo viajó el rumor\",\"sentences\":[\"Water appeared in the hallway of 14 Palmer Road on Monday.\",\"The Gazette reported that a leak was being investigated and that a cause had not been confirmed.\",\"The neighbourhood group wrote that the shop was being closed on purpose, without naming a source.\",\"Mr Patel denied the sale; Ben saw him with a delivery the next morning.\",\"Valeria read both passives and asked who said so.\"],\"itemIds\":[\"enb2m4neighbourgroup\",\"enb2m4theseclaimshavebeendenied\",\"enb2m4whosaysso\"]},{\"id\":\"enb2m4l9e2\",\"type\":\"gapbank\",\"prompt\":\"Espiral del módulo\",\"text\":\"It is widely ___ that the shop will close. He is said to ___ sold the flat. These claims have been ___. The meeting ___ cancelled — that's the street. ___ says so?\",\"answers\":[\"believed\",\"have\",\"denied\",\"got\",\"Who\"],\"bank\":[\"believed\",\"have\",\"denied\",\"got\",\"Who\",\"they\",\"People\"],\"itemIds\":[\"enb2m4itiswidelybelieved\",\"enb2m4issaidtohave\",\"enb2m4theseclaimshavebeendenied\",\"enb2m4itgotcancelled\",\"enb2m4whosaysso\"]},{\"id\":\"enb2m4l9e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"People say that it is widely believed that the shop will close.\",\"answers\":[\"It is widely believed that the shop will close.\",\"People say the shop will close.\"],\"why\":\"Las dos fórmulas juntas son un rodeo de rodeo. Elige una altura: people say (calle) o it is widely believed (examen). Las dos a la vez son el circunloquio que el m2 ya mató.\",\"itemIds\":[\"enb2m4itiswidelybelieved\"]},{\"id\":\"enb2m4l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad: las impersonales del módulo\",\"pairs\":[{\"target\":\"It is widely believed that\",\"source\":\"se cree ampliamente que\"},{\"target\":\"He is said to have\",\"source\":\"se dice que ha…\"},{\"target\":\"These claims have been denied\",\"source\":\"estas afirmaciones han sido desmentidas\"},{\"target\":\"According to the report\",\"source\":\"según el informe\"},{\"target\":\"It should be noted that\",\"source\":\"cabe señalar que\"}],\"targetSeconds\":22,\"itemIds\":[\"enb2m4itiswidelybelieved\",\"enb2m4issaidtohave\",\"enb2m4theseclaimshavebeendenied\",\"enb2m4accordingtothereport\",\"enb2m4itshouldbenoted\"]},{\"id\":\"enb2m4l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin apparently — examen\",\"source\":\"Apparently the shop is closing.\",\"forbid\":[\"apparently\"],\"answers\":[\"It is widely believed that the shop will close\",\"It is widely believed that the shop is closing\",\"It is reported that the shop will close\",\"The shop is said to be closing\"],\"itemIds\":[\"enb2m4apparently\",\"enb2m4itiswidelybelieved\"]},{\"id\":\"enb2m4l9e6\",\"type\":\"cloze\",\"prompt\":\"El título\",\"text\":\"Two sources, two ___. Who says so?\",\"answers\":[\"passives\"],\"itemIds\":[\"enb2m4twosources\"]},{\"id\":\"enb2m4l9e7\",\"type\":\"speak\",\"prompt\":\"La frase de cierre del monólogo\",\"text\":\"On balance, the leak is real and the sale is not. Who says so? The paper names the council. The group names itself too late.\",\"phonetic\":\"on BÁ-lans, de liik is̬ ríal and de seil is̬ not. juu seis sóu\",\"translation\":\"En balance, la fuga es real y la venta no. ¿Quién lo dice? El periódico nombra al ayuntamiento. El grupo se nombra demasiado tarde.\",\"itemIds\":[\"enb2m4onbalance\",\"enb2m4whosaysso\"]},{\"id\":\"enb2m4l9e8\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: treinta segundos, dos minutos. La segunda pasada sale mejor.\",\"topic\":\"A rumour in your area — what was said, who said it, and what was never confirmed\",\"slides\":[{\"ti
