ci\u003eused to\u003c/i\u003e, y es por eso por lo que aparece tanto en textos de examen.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePero tiene un límite, y es duro:\u003c/b\u003e \u003cb\u003e\u003ci\u003ewould\u003c/i\u003e solo vale para ACCIONES que se repiten. Con estados, no.\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eI \u003cb\u003eused to\u003c/b\u003e know her quite well.\u003c/i\u003e ✔ · \u003ci\u003e\u003cs\u003eI would know her quite well.\u003c/s\u003e\u003c/i\u003e ✘\u003cbr/\u003e· \u003ci\u003eWe \u003cb\u003eused to\u003c/b\u003e have a car.\u003c/i\u003e ✔ · \u003ci\u003e\u003cs\u003eWe would have a car.\u003c/s\u003e\u003c/i\u003e ✘\u003cbr/\u003e· \u003ci\u003eShe \u003cb\u003eused to\u003c/b\u003e live in Sheffield.\u003c/i\u003e ✔ · \u003ci\u003e\u003cs\u003eShe would live in Sheffield.\u003c/s\u003e\u003c/i\u003e ✘\u003cbr/\u003e\u003cbr/\u003eLos estados son los sospechosos de siempre: \u003cb\u003ebe, have, know, live, like, want, believe, understand\u003c/b\u003e. Si el verbo no es algo que se «haga», \u003ci\u003ewould\u003c/i\u003e no entra. Y en el otro sentido no hay problema: \u003cb\u003edonde cabe \u003ci\u003ewould\u003c/i\u003e, cabe siempre \u003ci\u003eused to\u003c/i\u003e\u003c/b\u003e. Si dudas, \u003ci\u003eused to\u003c/i\u003e nunca falla.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa otra condición, que se olvida:\u003c/b\u003e \u003ci\u003ewould\u003c/i\u003e \u003cb\u003eno puede abrir el relato\u003c/b\u003e. Necesita que el pasado ya esté puesto. \u003ci\u003eEvery summer we would go to my grandmother's\u003c/i\u003e funciona porque «every summer» ya te ha situado; empezar una historia con \u003ci\u003eI would go to my grandmother's\u003c/i\u003e deja al oyente esperando un «si…».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí vuelve el aviso de la lección 1:\u003c/b\u003e \u003ci\u003eShe'\u003cb\u003ed\u003c/b\u003e sing\u003c/i\u003e es \u003ci\u003ewould\u003c/i\u003e (infinitivo detrás) y \u003ci\u003eShe'\u003cb\u003ed\u003c/b\u003e sung\u003c/i\u003e es \u003ci\u003ehad\u003c/i\u003e (participio detrás). En este módulo tienes las dos, y el oído no las distingue: \u003cb\u003elas distingue lo que va detrás\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY dos palabras de la infancia que se dicen mal casi siempre:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003egrow up\u003c/b\u003e — criarse. \u003ci\u003eI grew \u003cb\u003eup\u003c/b\u003e in a small town.\u003c/i\u003e Sin el \u003ci\u003eup\u003c/i\u003e, \u003ci\u003eI grew in a small town\u003c/i\u003e dice que creciste de tamaño allí, como una planta.\u003cbr/\u003e· \u003cb\u003etake after\u003c/b\u003e — salir a alguien, parecerse en el CARÁCTER. \u003ci\u003eShe takes after her mother.\u003c/i\u003e Para la cara está \u003ci\u003elook like\u003c/i\u003e, que ya traes del A2: \u003ci\u003eHe looks like his dad\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l4\",\"phaseId\":\"enb1m10\",\"title\":\"Every summer she would sing\",\"subtitle\":\"El otro pasado repetido — y el único sitio donde «would» no sirve\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La infancia, contada con verbos\",\"itemIds\":[\"enb1m10hewouldalways\",\"enb1m10iusedtoknow\",\"enb1m10growup\",\"enb1m10takeafter\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: «would» repite acciones, «used to» abarca también los estados\",\"body\":\"$17\",\"table\":[[\"Frase\",\"would\",\"used to\",\"Por qué\"],[\"cantar todos los veranos\",\"✔\",\"✔\",\"es una acción que se repite\"],[\"conocer bien a alguien\",\"✘\",\"✔\",\"«know» es un estado\"],[\"tener coche\",\"✘\",\"✔\",\"«have» aquí es un estado\"],[\"traer algo cada semana\",\"✔\",\"✔\",\"acción repetida otra vez\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro frases de la infancia\",\"pairs\":[{\"target\":\"He would always bring something for the kids.\",\"source\":\"Siempre traía algo para los niños.\"},{\"target\":\"I used to know her quite well.\",\"source\":\"La conocía bastante bien.\"},{\"target\":\"I grew up in a small town.\",\"source\":\"Me crié en un pueblo pequeño.\"},{\"target\":\"She takes after her mother.\",\"source\":\"Ha salido a su madre.\"}],\"itemIds\":[\"enb1m10hewouldalways\",\"enb1m10iusedtoknow\",\"enb1m10growup\",\"enb1m10takeafter\"],\"tip\":\"Las dos primeras se parecen mucho y no son intercambiables: la de «traer» es una acción, la de «conocer» es un estado. Esa es toda la diferencia.\"},{\"id\":\"enb1m10l4e2\",\"type\":\"mc\",\"prompt\":\"El límite de «would»\",\"question\":\"«Antes teníamos coche.» →\",\"options\":[\"We used to have a car.\",\"We would have a car.\",\"We would had a car.\"],\"answer\":0,\"whyWrong\":[null,\"«Have» aquí es un estado, no una acción repetida. «We would have a car» suena a condicional a medias: el oyente espera un «if…».\",\"Detrás de un modal va siempre el infinitivo pelado, nunca un pasado. Ese fallo es de A2 y se cobra igual en B1.\"],\"itemIds\":[\"enb1m10iusedtoknow\",\"enb1m10hewouldalways\"],\"tip\":\"Regla de bolsillo: si dudas, «used to». Donde cabe «would» cabe siempre «used to», y al revés no.\"},{\"id\":\"enb1m10l4e3\",\"type\":\"bucket\",\"prompt\":\"¿Esta frase admite «would», o solo «used to»?\",\"categories\":[\"Admite las dos\",\"Solo «used to»\"],\"items\":[{\"text\":\"Every summer she sang in the kitchen.\",\"bucket\":0},{\"text\":\"I knew her quite well.\",\"bucket\":1},{\"text\":\"He brought something for the kids every week.\",\"bucket\":0},{\"text\":\"They had a car.\",\"bucket\":1},{\"text\":\"We walked to school together.\",\"bucket\":0},{\"text\":\"She lived in Sheffield.\",\"bucket\":1}],\"itemIds\":[\"enb1m10hewouldalways\",\"enb1m10iusedtoknow\"],\"tip\":\"Mira la columna de la derecha: know, have, live. Los tres son estados, y ninguno se «hace». Si el verbo no cabe en la frase «estuve haciéndolo toda la tarde», es un estado.\"},{\"id\":\"enb1m10l4e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la frase: el verbo es un estado.\",\"wrong\":\"I would know her quite well.\",\"answers\":[\"I used to know her quite well.\"],\"why\":\"«Would» solo repite acciones. «Know» es un estado —no es algo que uno haga una y otra vez—, así que aquí la única forma es «used to». Con «would» la frase se lee como el principio de un condicional.\",\"translation\":\"La conocía bastante bien.\",\"itemIds\":[\"enb1m10iusedtoknow\"]},{\"id\":\"enb1m10l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa el phrasal verb de criarse\",\"text\":\"I grew ___ in a small town about an hour from Bogotá.\",\"answers\":[\"up\"],\"translation\":\"Me crié en un pueblo pequeño a una hora de Bogotá.\",\"hints\":[\"Dos letras\",\"Sin ella, la frase dice que creciste de tamaño\"],\"itemIds\":[\"enb1m10growup\"],\"tip\":\"«Grow up» es una de esas parejas donde la partícula lo cambia todo. Y de propina: «Grow up!» dicho a una persona es «¡madura!».\"},{\"id\":\"enb1m10l4e6\",\"type\":\"build\",\"prompt\":\"Construye la frase del recuerdo\",\"target\":\"He would always bring something for the kids\",\"translation\":\"Siempre traía algo para los niños\",\"distractors\":[\"brought\",\"used\"],\"itemIds\":[\"enb1m10hewouldalways\"],\"tip\":\"«Brought» sobra porque detrás de un modal va el infinitivo pelado. Y «used» sobra porque «used to would» no existe: o una estructura o la otra, nunca las dos.\"},{\"id\":\"enb1m10l4e7\",\"type\":\"transform\",\"prompt\":\"Del pasado simple al recuerdo\",\"source\":\"Every summer she sang in the kitchen.\",\"instruction\":\"Dilo con «would», que es la voz del recuerdo\",\"answers\":[\"Every summer she would sing in the kitchen\",\"Every summer she would sing in the kitchen.\",\"Every summer she'd sing in the kitchen\"],\"translation\":\"Todos los veranos cantaba en la cocina.\",\"hints\":[\"Detrás del modal, el verbo va desnudo\",\"Every summer she ... in the kitchen\"],\"itemIds\":[\"enb1m10hewouldalways\"],\"tip\":\"Las dos frases significan lo mismo. La de «would» añade una capa: dice que quien habla lo está recordando, no solo informando. En el Speaking eso se nota.\"},{\"id\":\"enb1m10l4e8\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que cuenta Valeria de su madre\",\"text\":\"Everybody says I ___ after her. She ___ up in a small town in the north, and every summer she ___ send us there for a fortnight.\",\"answers\":[\"take\",\"grew\",\"would\"],\"bank\":[\"take\",\"grew\",\"would\",\"made\",\"went\",\"kept\"],\"translation\":\"Todo el mundo dice que he salido a ella. Se crió en un pueblo del norte y todos los veranos nos mandaba allí quince días.\",\"itemIds\":[\"enb1m10takeafter\",\"enb1m10growup\",\"enb1m10hewouldalways\"],\"tip\":\"«A fortnight» son dos semanas, y es una palabra que los británicos usan a diario y los libros de texto casi nunca enseñan. En un anuncio o en una carta la vas a ver antes que «two weeks».\"},{\"id\":\"enb1m10l4e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"She takes after her mother.\",\"forbid\":[\"takes\",\"after\"],\"answers\":[\"She is very like her mother\",\"She is a lot like her mother\",\"She has got her mother's character\"],\"translation\":\"Ha salido a su madre.\",\"itemIds\":[\"enb1m10takeafter\",\"ena2m3helookslikehisdad\"],\"tip\":\"Cuidado con «look like»: eso es la cara. «Take after» es el carácter, y por eso la reformulación buena habla de cómo es, no de a quién se parece de vista.\"},{\"id\":\"enb1m10l4e10\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál oíste: la del libro o la de la calle?\",\"book\":\"She would always bring something.\",\"real\":\"She'd always bring something.\",\"translation\":\"Siempre traía algo.\",\"itemIds\":[\"enb1m10hewouldalways\"],\"tip\":\"Esa «'d» pegada al pronombre es la razón de que el past perfect y el «would» de hábito se confundan al oírlos. Lo que los separa está DETRÁS: infinitivo («bring») es would; participio («brought») sería had.\"},{\"id\":\"enb1m10l4e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Me crié en un pueblo pequeño y todo el mundo se conocía.\",\"answers\":[\"I grew up in a small town and everybody knew each other\",\"I grew up in a small town where everybody knew each other\",\"I grew up in a small town and everyone knew each other\"],\"hint\":\"El verbo de criarse lleva partícula, y el de conocerse es recíproco\",\"itemIds\":[\"enb1m10growup\",\"enb1m10eachother\"],\"tip\":\"«Everybody knew each other» es la fórmula fija: nunca «everybody knew themselves», que diría que cada uno se conocía a sí mismo. La lección 7 va entera sobre esa diferencia.\"},{\"id\":\"enb1m10l4e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"He would always bring something for the kids, and my mother would always tell him off for it.\",\"answers\":[\"Siempre traía algo para los niños, y mi madre siempre le reñía por ello\",\"Siempre traía algo para los críos y mi madre siempre le echaba la bronca\",\"Siempre les traía algo a los niños y mi madre siempre le regañaba\"],\"itemIds\":[\"enb1m10hewouldalways\"],\"tip\":\"Dos «would» seguidos: en español los dos se vuelven imperfecto («traía», «reñía»). El imperfecto español y el «would» inglés hacen el mismo trabajo, y por eso hay que recordarse de ponerlo.\"},{\"id\":\"enb1m10l4e13\",\"type\":\"order\",\"prompt\":\"Ordena el recuerdo de Nora, de la infancia al presente\",\"sentences\":[\"Nora grew up in a house with six children and one bathroom.\",\"Every Sunday her father would walk them all to the park, whatever the weather.\",\"She used to know every family in the street by name.\",\"By the time she was thirty, most of them had moved away.\",\"She still lives in the same house, and she still knows the postman.\"],\"translation\":\"Nora se crió en una casa con seis niños y un solo baño. Todos los domingos su padre los llevaba a todos andando al parque, hiciera el tiempo que hiciera. Se sabía el nombre de todas las familias de la calle. Cuando cumplió los treinta, casi todas se habían ido. Sigue viviendo en la misma casa, y sigue conociendo al cartero.\",\"itemIds\":[\"enb1m10growup\",\"enb1m10hewouldalways\",\"enb1m10iusedtoknow\",\"enb1m10bythetime\"],\"tip\":\"Fíjate en los cuatro motores seguidos: pasado simple para los hechos, «would» para lo que se repetía, «used to» para el estado, y past perfect para lo que ya había ocurrido antes de los treinta. Ese párrafo es el módulo entero en cinco frases.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
