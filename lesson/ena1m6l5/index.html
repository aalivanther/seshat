 fija de la tarjeta\",\"b-y card — en bloque\"],\"itemIds\":[\"encanipaybycard\"],\"tip\":\"Fórmulas fijas: by card, in cash. No se traducen palabra a palabra — se memorizan en bloque.\"},{\"id\":\"ena1m6l5e3\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La pregunta de la caja\",\"book\":\"Do you want a bag?\",\"real\":\"D'you wanna bag?\",\"translation\":\"¿Quieres una bolsa?\",\"itemIds\":[\"enshop\"],\"tip\":\"La misma fusión que en el café (d'you wanna): te la dirán en TODAS las cajas de Londres. Respuesta: «Yes, please» o «No, thanks».\"},{\"id\":\"ena1m6l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa la protesta\",\"text\":\"This jacket is ___ expensive.\",\"answers\":[\"too\"],\"translation\":\"Esta chaqueta es demasiado cara.\",\"hints\":[\"No es «muy» (very): es una protesta\",\"t-o-o + adjetivo\"],\"itemIds\":[\"entooexpensive\",\"enjacket\"]},{\"id\":\"ena1m6l5e5\",\"type\":\"transform\",\"prompt\":\"Transforma: di lo contrario\",\"source\":\"This jacket is cheap.\",\"instruction\":\"Di lo contrario\",\"answers\":[\"This jacket is expensive.\",\"This jacket is expensive\"],\"translation\":\"Esta chaqueta es cara.\",\"hints\":[\"barato ↔ caro\",\"cheap ↔ expensive\"],\"itemIds\":[\"encheap\",\"enexpensive\",\"enjacket\"]},{\"id\":\"ena1m6l5e6\",\"type\":\"listen\",\"prompt\":\"Escucha lo que te devuelven\",\"text\":\"Here's your change.\",\"translation\":\"Aquí tiene su cambio.\",\"hints\":[\"Lo que te dan tras pagar en efectivo\",\"Here's your ...\"],\"itemIds\":[\"enheresyourchange\",\"enchange\"]},{\"id\":\"ena1m6l5e7\",\"type\":\"speak\",\"prompt\":\"Pregunta en voz alta\",\"text\":\"Can I pay by card, please?\",\"phonetic\":\"kan ái péi bai KAAD, plíis̬\",\"translation\":\"¿Puedo pagar con tarjeta, por favor?\",\"itemIds\":[\"encanipaybycard\"]},{\"id\":\"ena1m6l5e9\",\"type\":\"audiomc\",\"prompt\":\"Pregunta primero, escucha después — diálogo\",\"audio\":\"How much is this jacket? | It's fifty pounds. | Fifty?! That's too expensive!\",\"quest anipaybycard\"],\"tip\":\"La compra entera en cuatro piezas: protesto, comparo, decido y pago. Es literalmente la parte 3 del oral.\"},{\"id\":\"ena1m6l5e12\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — hay UN solo error\",\"wrong\":\"This jacket is too much expensive.\",\"answers\":[\"This jacket is too expensive.\"],\"why\":\"Delante de un adjetivo basta con too: too expensive, too small. El much sobra — es el «demasiado» del español pidiendo sitio dos veces.\",\"translation\":\"Esta chaqueta es demasiado cara.\",\"hints\":[\"Sobra una palabra\",\"too + adjetivo, y punto\"],\"itemIds\":[\"entooexpensive\",\"enexpensive\",\"enjacket\"],\"tip\":\"too much sí existe, pero para cantidades: too much sugar, too much money. Con adjetivo, nunca.\"},{\"id\":\"ena1m6l5e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Puedo pagar con tarjeta?\",\"answers\":[\"Can I pay by card?\",\"Can I pay by card\",\"Can I pay by card, please?\"],\"hints\":[\"El chunk completo\",\"Can I pay ...\"],\"itemIds\":[\"encanipaybycard\"],\"tip\":\"Can I have… para pedir, Can I pay… para pagar: con dos chunks Can I sobrevives a cualquier tienda.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m6-3\",\"book\":\"That is three pounds fifty.\",\"real\":\"That'll be three fifty.\",\"meaning\":\"«Son 3,50» — como lo dice de verdad quien te cobra.\",\"when\":\"Lo dice el tendero o el camarero al cantarte el total: That'll be… — y muchas veces sin pounds: «three fifty». Tú solo necesitas cazar el número; para responder te basta pagar y decir thank you.\",\"register\":\"neutral\",\"note\":\"that will se funde en that'll; los nativos ahorran hasta el pounds.\",\"sound\":\"DHA-tl bi zríi FIF-ti\",\"level\":\"a1\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content
