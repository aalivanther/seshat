,\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T52f,\u003cb\u003eParte 1\u003c/b\u003e: te presentas. Apellido \u003cb\u003edeletreado\u003c/b\u003e, país de origen y hasta cinco preguntas que —esto es nuevo del A2— vienen agrupadas \u003cb\u003ebajo cinco temas\u003c/b\u003e (trabajo, casa, tiempo libre…). Contesta con una frase y un detalle, nunca con una palabra suelta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 2\u003c/b\u003e: dos o más situaciones. En una \u003cb\u003erespondes\u003c/b\u003e… y en otra \u003cb\u003ela empiezas tú\u003c/b\u003e. Esto es lo que casi nadie prepara: te dan una tarjeta del tipo «estás en una tienda y quieres cambiar una chaqueta» y el examinador espera \u003cb\u003ea que hables\u003c/b\u003e. Ten dos arranques listos: \u003ci\u003eExcuse me, could you help me?\u003c/i\u003e y \u003ci\u003eHello, I'd like to…\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 3\u003c/b\u003e: dos imágenes. Preguntas y dices \u003cb\u003esemejanzas y diferencias\u003c/b\u003e. Tu módulo 4 entero cabe aquí: \u003ci\u003eIn both pictures…\u003c/i\u003e, \u003ci\u003eIn the first picture… in the second one…\u003c/i\u003e, \u003ci\u003eThe difference is that…\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 4\u003c/b\u003e: te dan un tema, papel y lápiz, \u003cb\u003e30 segundos\u003c/b\u003e para prepararlo y \u003cb\u003eun minuto\u003c/b\u003e para hablar solo. Después, preguntas de seguimiento.\u003cbr/\u003e\u003cbr/\u003eDos datos que ordenan todo lo demás: las cuatro partes \u003cb\u003epesan igual\u003c/b\u003e (así que no hay ninguna que puedas regalar), y el oral \u003cb\u003ese graba\u003c/b\u003e: quien te puntúa no estuvo en la sala, no vio tus gestos y no sabe que ese día estabas fatal. Habla claro y termina las frases.18:T5fd,"])</script><script>self.__next_f.push([1,"Once módulos, once clínicas de sonido. Hoy pasan todas seguidas, y no por nostalgia: de los cuatro criterios del oral, uno entero es \u003cb\u003ePronunciation, Intonation and Fluency\u003c/b\u003e, y los cuatro pesan igual. Traducido: \u003cb\u003ela pronunciación es la cuarta parte de tu nota del oral\u003c/b\u003e, tanto como la gramática. Y en el Listening no es una cuarta parte, es casi todo — lo que no reconoces al oído no lo contestas por mucho que te lo sepas escrito.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY lo único de hoy que no viste en su módulo: el ritmo.\u003c/b\u003e El español reparte el tiempo por sílabas: todas duran más o menos lo mismo, y por eso un español lee una frase inglesa como quien pica piedra. El inglés reparte el tiempo por \u003cb\u003egolpes de voz\u003c/b\u003e: las palabras con contenido (verbos, sustantivos, adjetivos, números) llevan golpe y suenan enteras, y todo lo que hay entre golpe y golpe —artículos, preposiciones, auxiliares, pronombres— se comprime para que quepa.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eI \u003cb\u003eWORKED\u003c/b\u003e on \u003cb\u003eSA\u003c/b\u003eturday and I \u003cb\u003eMUST\u003c/b\u003en't for\u003cb\u003eGET\u003c/b\u003e the \u003cb\u003eTI\u003c/b\u003eckets.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eAhí hay cinco golpes, y da igual cuántas palabritas haya en medio: el hueco entre golpe y golpe dura lo mismo, así que las palabritas se aplastan. \u003cb\u003ePor eso el audio del examen «va rapidísimo»: no va rápido, va desigual.\u003c/b\u003e Cuando te suene desigual y no rápido, lo estás oyendo bien.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se usa esta batería:\u003c/b\u003e no busques hacerlo bonito, busca ir a la misma velocidad que el audio. La velocidad es la que funde las sílabas — el esfuerzo, no."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l8\",\"phaseId\":\"ena2m12\",\"title\":\"Spoken: your nine minutes\",\"subtitle\":\"Cuatro partes que pesan igual, 30 segundos de papel, un minuto de reloj — y las once clínicas de sonido en batería\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit del oral\",\"itemIds\":[\"ena2m12thepreparationtime\",\"ena2m12iagreewithyou\",\"ena2m12itdependsonthetopic\",\"ena2m12sorryidontunderstandthequestion\",\"ena2m12thatsallthankyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Los nueve minutos, parte por parte\",\"body\":\"$17\",\"table\":[[\"Parte\",\"Lo que se entrena poco y cae seguro\"],[\"1\",\"deletrear tu apellido sin dudar\"],[\"2\",\"INICIAR una situación, no solo responder\"],[\"3\",\"decir en qué se PARECEN, no solo en qué se diferencian\"],[\"4\",\"usar los 30 segundos en escribir tres palabras, no frases\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l8e1\",\"type\":\"mc\",\"prompt\":\"Los 30 segundos de preparación\",\"question\":\"Te dan el tema y 30 segundos con papel. ¿Qué escribes?\",\"options\":[\"Tres o cuatro palabras sueltas: el guion de por dónde vas a ir\",\"Las primeras frases completas, para no atascarme al empezar\",\"Nada: mejor pensarlo y no perder tiempo escribiendo\"],\"answer\":0,\"whyWrong\":[null,\"Escribir frases se come los 30 segundos y luego se leen, y leer suena fatal en una grabación\",\"Sin guion, el minuto se va en el primer tema y no llegas a los otros dos\"],\"itemIds\":[\"ena2m12thepreparationtime\",\"enthirtyseconds\"],\"tip\":\"Tres palabras = tres bloques de veinte segundos. Es el reparto que hace que el minuto no se acabe antes que tú.\"},{\"id\":\"ena2m12l8e2\",\"type\":\"speak\",\"prompt\":\"Parte 1: tu apellido y tu país, sin dudar\",\"text\":\"My surname is Soto: S-O-T-O. I'm from Bogotá, in Colombia.\",\"phonetic\":\"mai SÉE-neim is̬ SÓU-tou: es-óu-tii-óu. áim from bo-go-TÁ, in ko-LAM-bia\",\"translation\":\"Mi apellido es Soto: S-O-T-O. Soy de Bogotá, en Colombia.\",\"itemIds\":[\"enhowdoyouspellit\",\"endouble\"],\"tip\":\"Deletrea despacio y con la voz alta al final de cada letra. Es lo primero que se oye en la grabación: que suene seguro.\"},{\"id\":\"ena2m12l8e3\",\"type\":\"mc\",\"prompt\":\"Parte 2: la situación que empiezas tú\",\"question\":\"La tarjeta dice: «You are in a shop. You bought a jacket yesterday and it is too small.» El examinador te mira y no dice nada. ¿Qué haces?\",\"options\":[\"Empiezo yo: «Excuse me, I bought this jacket yesterday and it's too small.»\",\"Espero a que me pregunte algo\",\"Le explico en español lo que quiero decir\"],\"answer\":0,\"whyWrong\":[null,\"En esta situación el turno es tuyo: si esperas, se pierden segundos de una parte que pesa un cuarto de la nota\",\"El examinador no puede puntuar nada dicho en español\"],\"itemIds\":[\"ena2m7imsorrytobotheryou\",\"ena2m4tooshoessmall\"],\"tip\":\"Ten dos arranques memorizados: «Excuse me, could you help me?» y «Hello, I'd like to…». Con eso ya no hay silencio inicial.\"},{\"id\":\"ena2m12l8e4\",\"type\":\"build\",\"prompt\":\"Parte 2: monta tu arranque\",\"target\":\"Excuse me, could you help me, please?\",\"translation\":\"Perdone, ¿me puede ayudar, por favor?\",\"distractors\":[\"want\",\"the\"],\"hints\":[\"Empieza pidiendo permiso para hablar\",\"Excuse me, could you…\"],\"itemIds\":[\"ena2m7couldyousound\",\"ena2m7imsorrytobotheryou\"],\"tip\":\"Seis palabras que sirven en una tienda, en una estación y en el examen. Que salgan solas.\"},{\"id\":\"ena2m12l8e5\",\"type\":\"match\",\"prompt\":\"Parte 1: los cinco temas y sus preguntas\",\"pairs\":[{\"target\":\"What do you do?\",\"source\":\"trabajo y estudios\"},{\"target\":\"Who do you live with?\",\"source\":\"casa y familia\"},{\"target\":\"What do you do at the weekend?\",\"source\":\"tiempo libre\"},{\"target\":\"How do you come here?\",\"source\":\"transporte y rutina\"},{\"target\":\"What are you going to do this summer?\",\"source\":\"planes\"}],\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m6whatareyougoingtodo\",\"ena2m1lastweekend\"],\"tip\":\"Cinco temas, cinco respuestas de dos frases preparadas de casa. La Parte 1 es la única del examen que se puede ensayar entera.\"},{\"id\":\"ena2m12l8e6\",\"type\":\"speak\",\"prompt\":\"Parte 3: compara las dos imágenes en voz alta\",\"text\":\"In both pictures I can see a family, but in the first one they're at home and in the second one they're in a park.\",\"phonetic\":\"in bóuz PIK-chas̬ ái kan sii a FÁ-mi-li, bat in de FÉEST uan déia at JÓUM and in de SÉ-kond uan déia in a PAAK\",\"translation\":\"En las dos fotos veo una familia, pero en la primera están en casa y en la segunda están en un parque.\",\"itemIds\":[\"ena2m4inbothpictures\",\"ena2m4inthefirstpicture\",\"ena2m4theyreverysimilar\"],\"tip\":\"Semejanza PRIMERO, diferencia después: In both… but… Con esa sola estructura ya cumples la tarea de la Parte 3.\"},{\"id\":\"ena2m12l8e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige — la bandera del hispanohablante\",\"wrong\":\"I am agree with you about that.\",\"answers\":[\"I agree with you about that.\",\"I agree with you about that\"],\"why\":\"En español «estar de acuerdo» es estar + complemento, así que suena a be + adjetivo. En inglés agree es un VERBO normal, como work: I agree, I don't agree, Do you agree? Y ojo a la negación, que es donde más recae: I don't agree, nunca I'm not agree.\",\"translation\":\"Estoy de acuerdo contigo en eso.\",\"hints\":[\"agree no es un adjetivo\",\"I ___ with you about that.\"],\"itemIds\":[\"ena2m12iagreewithyou\"]},{\"id\":\"ena2m12l8e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige — la preposición que el español cambia\",\"wrong\":\"It depends of the topic.\",\"answers\":[\"It depends on the topic.\",\"It depends on the topic\"],\"why\":\"«Depender DE» en inglés es depend ON, sin excepción. Es una de esas parejas que hay que aprender juntas, como listen TO, wait FOR o look AT: la preposición no se traduce, se memoriza pegada al verbo.\",\"translation\":\"Depende del tema.\",\"hints\":[\"No es of\",\"It depends ___ the topic.\"],\"itemIds\":[\"ena2m12itdependsonthetopic\",\"entopic\"]},{\"id\":\"ena2m12l8e9\",\"type\":\"mc\",\"prompt\":\"El reparto del minuto\",\"question\":\"Un minuto de monólogo y tres cosas que contar. ¿Cómo lo repartes?\",\"options\":[\"Unos veinte segundos por bloque, y cierro con «That's all, thank you.»\",\"Todo lo que sepa del primer punto, y si sobra tiempo, los otros\",\"Hablo despacio para llenar el minuto con el primer punto\"],\"answer\":0,\"whyWrong\":[null,\"Es lo que más se hace y lo que peor puntúa: la tarea pide cubrir el tema, no agotarlo\",\"Rellenar no es hablar: el criterio de fluidez mira que digas cosas, no que ocupes el tiempo\"],\"itemIds\":[\"ena2m12thatsallthankyou\",\"ena2m12tosumup\"],\"tip\":\"Cerrar con una frase hecha avisa al examinador de que has terminado. Sin cierre, el final suena a que te quedaste en blanco.\"},{\"id\":\"ena2m12l8e10\",\"type\":\"monologue\",\"prompt\":\"La Parte 4, con el reloj real: 30 segundos de papel y 1 minuto de reloj\",\"topic\":\"A person who is important to you\",\"slides\":[{\"title\":\"1. Quién es y de qué la conoces\",\"hint\":\"Una frase y un detalle: This is my flatmate Amy. She's a nurse and we met three years ago.\"},{\"title\":\"2. Cómo es\",\"hint\":\"Módulo 3: She's quite tall, she has short dark hair, and she's very friendly.\"},{\"title\":\"3. Algo que hicisteis juntos\",\"hint\":\"Módulo 1 y 2, en pasado: Last summer we went to Brighton and we had a great time.\"},{\"title\":\"4. Por qué es importante\",\"hint\":\"Una razón con because: She's important to me because she helped me when I arrived in London.\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He usado los 30 segundos para escribir palabras sueltas, no frases\",\"He cubierto los cuatro bloques, ninguno se ha quedado fuera\",\"He dicho al menos tres verbos en pasado\",\"He dado una razón con because\",\"He cerrado con «That's all, thank you.» y no con un silencio\"],\"model\":\"I'm going to talk about my flatmate Amy. She's a nurse and we met three years ago, when I arrived in London. She's quite tall and she has short dark hair, and she's very friendly. Last summer we went to Brighton together. It rained all day, but we had a great time. She's important to me because she helped me a lot in my first year here, and because she never says no when I ask her for help. That's all, thank you.\",\"itemIds\":[\"ena2m12thepreparationtime\",\"ena2m12thatsallthankyou\",\"ena2m3quitetall\",\"ena2m2becauseimissedthebus\",\"ena2m1lastweekend\"],\"tip\":\"Grábate las dos veces y escucha la primera con la lista delante. La segunda pasada siempre sale mejor: esa es la que te llevas a junio.\"},{\"id\":\"ena2m12l8e11\",\"type\":\"paraphrase\",\"prompt\":\"Cuando no te sale la palabra: dilo de otra manera\",\"source\":\"The exam is very difficult.\",\"forbid\":[\"difficult\"],\"answers\":[\"The exam isn't easy.\",\"The exam is very hard.\",\"The exam is not easy at all.\"],\"translation\":\"El examen es muy difícil.\",\"hints\":[\"Con el contrario y una negación\",\"The exam isn't…\"],\"itemIds\":[\"ena2m3difficult\",\"ena2m12itdependsonthetopic\"],\"tip\":\"En el oral no hay diccionario: hay rodeos. Quien sabe rodear una palabra no se queda callado nunca, y el silencio sí puntúa.\"},{\"id\":\"ena2m12l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Perdona, no entiendo la pregunta. — Ya está, gracias.\",\"answers\":[\"Sorry, I don't understand the question. That's all, thank you.\",\"Sorry, I don't understand the question. That's all, thank you\"],\"hints\":[\"Sorry, I don't understand…\",\"That's all, thank…\"],\"itemIds\":[\"ena2m12sorryidontunderstandthequestion\",\"ena2m12thatsallthankyou\",\"encanyousaythatagain\"],\"tip\":\"Pedir que te repitan la pregunta NO resta: quedarse callado, sí. Son dos frases y las dos te compran tiempo.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Clínica integral: las once clínicas del A2, de una sentada\",\"body\":\"$18\",\"table\":[[\"Mód.\",\"Lo que se entrenó\",\"La prueba de un segundo\"],[\"1\",\"la -ed y sus tres sonidos\",\"worked es UNA sílaba: uéekt\"],[\"2\",\"las vocales del pasado irregular\",\"bought · thought · brought riman: boot · zoot · broot\"],[\"3\",\"el acento de las palabras largas\",\"comfortable son tres sílabas: KAM-fta-bol\"],[\"4\",\"la -er floja, el than átono y el par 13/30\",\"thirteen golpea al final; thirty, al principio\"],[\"5\",\"la consonante que enlaza con la vocal\",\"a bit of → a BÍ-tov\"],[\"6\",\"going to y el to débil\",\"GA-na · going to take → GÓU-in ta téik\"],[\"7\",\"la t que desaparece\",\"mustn't → MA-sent · have to → JAF-ta\"],[\"8\",\"la vocal larga que no tiene r\",\"nurse · worse · first → nées · uées · féest\"],[\"9\",\"la h átona que se cae\",\"tell him → TE-lim · ask her → AAS-ka\"],[\"10\",\"el have que se encoge\",\"I have → áiv · he has → jis̬\"],[\"11\",\"'ll y won't\",\"it'll be → Í-tol bi · won't con «óu» larga\"],[\"12\",\"el ritmo: golpes de voz, no sílabas\",\"entre golpe y golpe cabe lo que sea, aplastado\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l8e13\",\"type\":\"bucket\",\"prompt\":\"Clínica 1 — la -ed: ¿añade sílaba o no?\",\"categories\":[\"Añade sílaba (/ɪd/)\",\"NO añade sílaba (/t/ o /d/)\"],\"items\":[{\"text\":\"wanted\",\"bucket\":0},{\"text\":\"decided\",\"bucket\":0},{\"text\":\"started\",\"bucket\":0},{\"text\":\"worked\",\"bucket\":1},{\"text\":\"helped\",\"bucket\":1},{\"text\":\"listened\",\"bucket\":1},{\"text\":\"phoned\",\"bucket\":1},{\"text\":\"watched\",\"bucket\":1}],\"itemIds\":[\"ena2m1wanted\",\"ena2m1decided\",\"ena2m1helped\",\"ena2m1listened\",\"ena2m1phoned\"],\"tip\":\"La regla cabe en una línea: la -ed solo añade sílaba detrás de t o de d (want-ed, decid-ed, start-ed). Todo lo demás cierra en seco. Cinco de estos ocho son de una sílaba, y ahí es donde se pierde el pasado.\"},{\"id\":\"ena2m12l8e14\",\"type\":\"match\",\"prompt\":\"Clínicas 2 y 3 — empareja cada palabra con lo que suena de verdad\",\"pairs\":[{\"target\":\"read (en pasado)\",\"source\":\"RED — igual que el color\"},{\"target\":\"bought · thought · brought\",\"source\":\"boot · zoot · broot — las tres riman\"},{\"target\":\"comfortable\",\"source\":\"KAM-fta-bol — tres sílabas, no cuatro\"},{\"target\":\"important\",\"source\":\"im-PÓO-tant — el golpe en medio\"},{\"target\":\"helped\",\"source\":\"jelpt — una sílaba y cierre en t\"}],\"itemIds\":[\"ena2m2readred\",\"ena2m2boughtgroup\",\"ena2m3comfortable\",\"ena2m3important\",\"ena2m1helped\"],\"tip\":\"Las dos trampas del nivel juntas: los irregulares mienten con la vista (read se lee «red») y las palabras largas mienten con el golpe. En el oral, una palabra larga con el acento mal puesto no se entiende aunque los sonidos sean correctos.\"},{\"id\":\"ena2m12l8e15\",\"type\":\"fastmatch\",\"prompt\":\"Clínicas 6, 7, 9 y 10 — las formas débiles, en ráfaga\",\"pairs\":[{\"target\":\"going to\",\"source\":\"GA-na\"},{\"target\":\"have to\",\"source\":\"JAF-ta\"},{\"target\":\"mustn't\",\"source\":\"MA-sent\"},{\"target\":\"tell him\",\"source\":\"TE-lim\"},{\"target\":\"I have\",\"source\":\"áiv\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m6gonnasound\",\"ena2m7haftahasta\",\"ena2m7mustntsound\",\"ena2m9weakhim\",\"ena2m10iveweak\"],\"tip\":\"Ninguna de estas cinco se escribe así jamás — y las cinco se oyen así siempre. Ese desfase entre lo que se escribe y lo que suena es, entero, el Listening del examen.\"},{\"id\":\"ena2m12l8e16\",\"type\":\"audiomc\",\"prompt\":\"Clínica 4 — el par que cuesta dinero — 2 escuchas\",\"audio\":\"That comes to thirty pounds fifty, please.\",\"question\":\"¿Cuánto hay que pagar?\",\"options\":[\"30,50 £\",\"13,50 £\",\"35 £\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"thirteen golpea al FINAL (zee-TÍIN) y se alarga; thirty golpea al principio (ZÉE-ti) y se acaba en una i corta\",\"Fifty es el segundo número de la frase: los peniques\"],\"itemIds\":[\"ena2m4thirteenpounds\",\"ena2m4thirtydegrees\"],\"tip\":\"En la Parte 1 del Listening cada ítem trae DOS datos y uno de los dos suele ser un número. Este par es el que más caro sale de todo el inglés: pregunta siempre «one three or three zero?» si tienes ocasión.\"},{\"id\":\"ena2m12l8e17\",\"type\":\"shadow\",\"prompt\":\"Ritmo — cinco golpes de voz, y lo de en medio aplastado\",\"text\":\"I worked on Saturday, so I'm gonna have a rest.\",\"phonetic\":\"ái UÉEKT on SÁ-ta-dei, sou áim GA-na jav a REST\",\"translation\":\"Trabajé el sábado, así que voy a descansar.\",\"reps\":2,\"itemIds\":[\"ena2m1iworked\",\"ena2m6gonnasound\"],\"tip\":\"Golpea WORKED, SA-, GO- y REST, y deja que el resto se caiga. Si te sale a la misma velocidad que el audio, tienes el ritmo inglés — que es lo que el criterio llama fluency.\"},{\"id\":\"ena2m12l8e18\",\"type\":\"shadow\",\"prompt\":\"Clínicas 4 y 11 — la -er floja, el than átono y la 'll\",\"text\":\"It'll be cheaper than the other one.\",\"phonetic\":\"Í-tol bi CHÍI-pa dan di A-da uán\",\"translation\":\"Va a salir más barato que el otro.\",\"reps\":2,\"itemIds\":[\"ena2m4schwaer\",\"ena2m4thanweak\",\"ena2m11itllbe\"],\"tip\":\"Cuatro «a» flojas seguidas: cheap-A, dAn, di A-dA. Ninguna lleva golpe y ninguna suena a la vocal que ves escrita. Esa vocal floja es el sonido más frecuente del inglés.\"},{\"id\":\"ena2m12l8e19\",\"type\":\"speak\",\"prompt\":\"Clínicas 5, 8 y 9 — tres en siete palabras\",\"text\":\"The nurse asked her for a bottle of water.\",\"phonetic\":\"de NÉES AAS-ka for a BO-tol ov UÓ-ta\",\"translation\":\"La enfermera le pidió una botella de agua.\",\"itemIds\":[\"ena2m8hurtgroup\",\"ena2m9weakher\",\"ena2m5abottleofwater\",\"ena2m1asked\"],\"tip\":\"Nurse sin r y con la boca casi cerrada; «ask her» sin la hache y pegado (AAS-ka); y «bottle of» en una sola pieza (BO-tol-ov). Dilo tres veces y grábate: la tercera ya no es la misma frase.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m12-7\",\"book\":\"Sorry, I don't understand the question.\",\"real\":\"Sorry, come again?\",\"meaning\":\"Perdona, ¿cómo dices? — pedir que repitan sin decir que no entiendes\",\"when\":\"En cualquier conversación. En el examen puedes usar la corta una vez; si necesitas más, di la larga, que además enseña al examinador que sabes construirla.\",\"register\":\"amigos\",\"note\":\"come again? es «repite» en tres sílabas; la versión de examen es la completa, y no cuesta puntos usarla.\",\"sound\":\"SO-ri, kam a-GUÉN?\",\"level\":\"a2\",\"itemId\":\"ena2m12sorryidontunderstandthequestion\"}}],\"resources\":[{\"label\":\"LanguageCert — International ESOL Speaking (guía del examen)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol\",\"note\":\"Mira un vídeo de examen oral de nivel A2 entero, con el reloj a la vista, y cronometra tú la Parte 4: verás que un minuto es mucho más de lo que parece.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{
