38,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8f3,"])</script><script>self.__next_f.push([1,"Esta es \u003cb\u003ela trampa más cara del módulo\u003c/b\u003e y una de las tres más caras del nivel entero, porque el español la construye igual de bien y con otro tiempo verbal.\u003cbr/\u003e\u003cbr/\u003eEspañol: «\u003cb\u003eEn cuanto llegue\u003c/b\u003e, te escribo». Ese «llegue» es subjuntivo.\u003cbr/\u003eInglés: «\u003cb\u003eAs soon as I get there\u003c/b\u003e, I'll text you». Ese \u003ci\u003eget\u003c/i\u003e es \u003cb\u003epresente simple\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eEl inglés no tiene subjuntivo que ofrecer, así que hace otra cosa: \u003cb\u003een la oración temporal usa el presente, y guarda el \u003ci\u003ewill\u003c/i\u003e para la otra mitad\u003c/b\u003e. Un futuro por frase, y va en la principal.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas conjunciones que activan la regla:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ewhen\u003c/b\u003e — \u003ci\u003eI'll ring you when I get in.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eas soon as\u003c/b\u003e — \u003ci\u003eAs soon as I get there, I'll text you.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003euntil\u003c/b\u003e — \u003ci\u003eWait here until they call the flight.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eby the time\u003c/b\u003e — \u003ci\u003eBy the time we get to the station, the coach will be full.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eonce\u003c/b\u003e — \u003ci\u003eOnce we're through security, we can relax.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ebefore\u003c/b\u003e y \u003cb\u003eafter\u003c/b\u003e — \u003ci\u003eBefore we leave, I'm going to check the tickets.\u003c/i\u003e (esas dos ya las traes del A2)\u003cbr/\u003e\u003cbr/\u003eY todas hacen lo mismo: \u003cb\u003edetrás de ellas, jamás «will»\u003c/b\u003e. \u003ci\u003eAs soon as I will get there\u003c/i\u003e no es raro: \u003cb\u003eno existe\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl escalón de más, que separa un B1 de un A2 largo:\u003c/b\u003e si quieres dejar claro que una cosa \u003cu\u003etermina antes\u003c/u\u003e que la otra, en la temporal va \u003cb\u003epresent perfect\u003c/b\u003e: \u003ci\u003eI'll let you know \u003cb\u003ewhen I've landed\u003c/b\u003e\u003c/i\u003e — primero aterrizo, luego aviso. Con \u003ci\u003ewhen I land\u003c/i\u003e también se entiende; con \u003ci\u003ewhen I've landed\u003c/i\u003e se entiende mejor y suena de nivel.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuidado con dos que se parecen y no son lo mismo:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003euntil\u003c/b\u003e = hasta que (un momento en el que algo para). \u003ci\u003eWait until they call the flight.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eby the time\u003c/b\u003e = para cuando (algo ya habrá pasado). \u003ci\u003eBy the time we get there, it'll be dark.\u003c/i\u003e\u003cbr/\u003eFíjate en que \u003ci\u003eby the time\u003c/i\u003e casi siempre lleva \u003cb\u003ewill\u003c/b\u003e en la otra mitad: es su marca de fábrica.\u003cbr/\u003e\u003cbr/\u003eY un aviso que no es de gramática: \u003cb\u003e«when» tiene dos vidas\u003c/b\u003e. Cuando pregunta —\u003ci\u003eWhen will you get in?\u003c/i\u003e— \u003cb\u003esí lleva futuro\u003c/b\u003e, porque no es una temporal, es una pregunta. La regla solo vale cuando \u003ci\u003ewhen\u003c/i\u003e une dos frases."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l3\",\"phaseId\":\"enb1m9\",\"title\":\"As soon as I get there\",\"subtitle\":\"«En cuanto llegue» no lleva futuro en inglés — y ahí se cae medio nivel\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las seis temporales que hay que saber de memoria\",\"itemIds\":[\"enb1m9assoonasiget\",\"enb1m9untilthey\",\"enb1m9bythetime\",\"enb1m9once\",\"enb1m9illletyouknowwhen\",\"enb1m9setofffor\",\"enb1m9getin\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la mitad de la frase pierde el futuro\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Lo que NO se dice\"],[\"En cuanto llegue, te escribo\",\"As soon as I get there, I'll text you.\",\"As soon as I will get there…\"],[\"Espera hasta que llamen\",\"Wait until they call the flight.\",\"…until they will call…\"],[\"Para cuando lleguemos, estará lleno\",\"By the time we get there, it'll be full.\",\"By the time we will get there…\"],[\"¿Cuándo llegas?\",\"When will you get in?\",\"— (aquí el futuro SÍ va)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro temporales\",\"pairs\":[{\"target\":\"As soon as I get to the airport, I'll text you.\",\"source\":\"En cuanto llegue al aeropuerto, te escribo.\"},{\"target\":\"Wait here until they call the flight.\",\"source\":\"Espera aquí hasta que llamen al vuelo.\"},{\"target\":\"Once we're through security, we can relax.\",\"source\":\"Una vez pasado el control, ya nos relajamos.\"},{\"target\":\"What time does your flight get in?\",\"source\":\"¿A qué hora te llega el vuelo?\"}],\"itemIds\":[\"enb1m9assoonasiget\",\"enb1m9untilthey\",\"enb1m9once\",\"enb1m9getin\"],\"tip\":\"Lee solo la parte inglesa de las tres primeras y busca el «will». Está una sola vez, y en la mitad que no lleva la conjunción. Esa es la regla entera, dicha en dos segundos.\"},{\"id\":\"enb1m9l3e2\",\"type\":\"mc\",\"prompt\":\"La trampa del módulo\",\"question\":\"«En cuanto llegue al aeropuerto, te escribo.» →\",\"options\":[\"As soon as I get to the airport, I'll text you.\",\"As soon as I will get to the airport, I'll text you.\",\"As soon as I'm getting to the airport, I'll text you.\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de «as soon as» no va «will» nunca. No es que suene raro: es que no existe en inglés.\",\"El presente continuo habla de planes con hora puesta, y llegar al aeropuerto no es un plan: es el momento en que pasa algo.\"],\"itemIds\":[\"enb1m9assoonasiget\"],\"tip\":\"Si dudas, cuenta los futuros: en una frase con temporal solo puede haber uno, y va en la mitad que NO lleva la conjunción.\"},{\"id\":\"enb1m9l3e3\",\"type\":\"errorfix\",\"prompt\":\"El calco número uno del módulo. Sobra UNA palabra.\",\"wrong\":\"I'll text you as soon as I will arrive.\",\"answers\":[\"I'll text you as soon as I arrive.\"],\"why\":\"«As soon as» ya coloca la frase en el futuro; el verbo que va detrás se queda en presente. En español el futuro se marca con subjuntivo («en cuanto llegue») y al traducir se busca una marca de futuro que en inglés no hace falta.\",\"translation\":\"Te escribo en cuanto llegue.\",\"itemIds\":[\"enb1m9assoonasiget\"]},{\"id\":\"enb1m9l3e4\",\"type\":\"errorfix\",\"prompt\":\"Otra vez lo mismo, con otra conjunción. Sobra UNA palabra.\",\"wrong\":\"Wait here until they will call the flight.\",\"answers\":[\"Wait here until they call the flight.\"],\"why\":\"«Until» es de la misma familia que «as soon as», «when», «once» y «by the time»: todas prohíben el «will» detrás. Una regla, cinco conjunciones.\",\"translation\":\"Espera aquí hasta que llamen al vuelo.\",\"itemIds\":[\"enb1m9untilthey\"]},{\"id\":\"enb1m9l3e5\",\"type\":\"bucket\",\"prompt\":\"¿Dónde va el «will» y dónde no?\",\"categories\":[\"Aquí SÍ va will\",\"Aquí NO va will\"],\"items\":[{\"text\":\"When ___ you get in?\",\"bucket\":0},{\"text\":\"I'll ring you when I ___ in.\",\"bucket\":1},{\"text\":\"By the time we get there, it ___ be dark.\",\"bucket\":0},{\"text\":\"Wait until they ___ the flight.\",\"bucket\":1},{\"text\":\"Once we ___ through security, we can relax.\",\"bucket\":1},{\"text\":\"Don't worry, I ___ be there.\",\"bucket\":0}],\"itemIds\":[\"enb1m9untilthey\",\"enb1m9bythetime\",\"enb1m9once\",\"enb1m9getin\"],\"tip\":\"Mira solo la palabra que abre cada hueco. Si delante hay una conjunción de tiempo (when, until, once, by the time), el «will» se va a la otra mitad. Si no la hay, o si es una pregunta, se queda.\"},{\"id\":\"enb1m9l3e6\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de la temporal\",\"text\":\"By the time we ___ to the station, the coach will be full.\",\"answers\":[\"get\",\"arrive\"],\"translation\":\"Para cuando lleguemos a la estación, el autocar estará lleno.\",\"hints\":[\"Presente simple, sin «will»\",\"Tres letras y significa «llegar» en el inglés de todos los días\"],\"itemIds\":[\"enb1m9bythetime\"],\"tip\":\"Fíjate en la otra mitad: ahí sí hay «will be full». Un futuro por frase, y nunca detrás de «by the time».\"},{\"id\":\"enb1m9l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa los mensajes de Valeria desde el andén\",\"text\":\"Text me as soon as you ___ on the train. And don't stand at the barrier until they ___ the platform, go and sit down. By the time you ___ here it'll be dark anyway.\",\"answers\":[\"are\",\"announce\",\"arrive\"],\"bank\":[\"are\",\"announce\",\"arrive\",\"will be\",\"will announce\",\"will arrive\"],\"translation\":\"Escríbeme en cuanto estés en el tren. Y no te quedes en el torno hasta que anuncien el andén: vete a sentarte. Para cuando llegues aquí será de noche de todas formas.\",\"itemIds\":[\"enb1m9assoonasiget\",\"enb1m9untilthey\",\"enb1m9bythetime\"],\"tip\":\"El banco te ofrece las tres versiones con «will» a propósito: son exactamente las tres que escribe un hispanohablante. Ninguna cabe, y el único «will» de todo el mensaje está en «it'll be dark», que es la mitad principal.\"},{\"id\":\"enb1m9l3e8\",\"type\":\"transform\",\"prompt\":\"Junta las dos frases\",\"source\":\"I'll ring you. First I'll get to the hotel.\",\"instruction\":\"Júntalas con «when», y quítale el futuro a la temporal\",\"answers\":[\"I'll ring you when I get to the hotel\",\"I'll ring you when I get to the hotel.\",\"When I get to the hotel, I'll ring you\"],\"translation\":\"Te llamo cuando llegue al hotel.\",\"hints\":[\"Un solo «will» en toda la frase\",\"I'll ring you when I ... to the hotel\"],\"itemIds\":[\"enb1m9illletyouknowwhen\"],\"tip\":\"Al juntarlas desaparece un «will». Ese es el trabajo entero: el inglés reparte un futuro por frase y lo pone en la mitad que manda.\"},{\"id\":\"enb1m9l3e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «as soon as» y sin «arrive»\",\"source\":\"As soon as we arrive, I'll send you a photo.\",\"forbid\":[\"as soon as\",\"arrive\"],\"answers\":[\"Once we get there, I'll send you a photo\",\"The minute we get there, I'll send you a photo\",\"I'll send you a photo the moment we get there\",\"When we get there, I'll send you a photo\"],\"translation\":\"En cuanto lleguemos, te mando una foto.\",\"hints\":[\"Hay una conjunción de la lección que significa «una vez que»\",\"Once we ... there, I'll send you a photo\"],\"itemIds\":[\"enb1m9once\",\"enb1m9assoonasiget\"],\"tip\":\"«The minute» y «the moment» funcionan igual que «as soon as», con presente detrás, y suben el registro percibido sin esfuerzo. Tener tres formas de decir lo mismo es literalmente el criterio de rango del examen.\"},{\"id\":\"enb1m9l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Ya te digo algo cuando haya aterrizado.\",\"answers\":[\"I'll let you know when I've landed\",\"I'll let you know when I have landed\",\"I'll let you know once I've landed\"],\"hint\":\"La temporal lleva perfecto, no futuro\",\"itemIds\":[\"enb1m9illletyouknowwhen\"],\"tip\":\"«When I've landed» deja clarísimo el orden: primero aterrizo y después aviso. Con «when I land» también se entiende, pero el perfecto es lo que hace que el examinador vea un B1 y no un A2 con suerte.\"},{\"id\":\"enb1m9l3e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te está diciendo?\",\"source\":\"We set off for the airport at five, so by the time you wake up we'll be through security.\",\"answers\":[\"Salimos hacia el aeropuerto a las cinco, así que para cuando te despiertes ya habremos pasado el control\",\"Salimos para el aeropuerto a las cinco, así que cuando te despiertes ya habremos pasado el control\",\"Salimos hacia el aeropuerto a las cinco, así que para cuando te levantes habremos pasado el control\"],\"itemIds\":[\"enb1m9setofffor\",\"enb1m9bythetime\",\"enb1m9once\"],\"tip\":\"«Set off FOR a place» — la preposición va pegada al verbo, como «depend on» o «wait for». Y fíjate en dónde cae el futuro: en la mitad que no lleva «by the time».\"},{\"id\":\"enb1m9l3e12\",\"type\":\"shadow\",\"prompt\":\"Sombrea la frase del módulo — dos pasadas\",\"text\":\"I'll text you as soon as I get there. Don't wait up.\",\"phonetic\":\"ail tekst yu as̬ suun as̬ ai guet dée · dóunt uéit ap\",\"translation\":\"Te escribo en cuanto llegue. No me esperes despierta.\",\"reps\":2,\"itemIds\":[\"enb1m9assoonasiget\"],\"tip\":\"«As soon as» se dice de un tirón y las dos eses se comen la boca: «as̬-SUUN-as̬», con el acento en el medio. Si la dices palabra a palabra, se nota que la estás construyendo mientras hablas.\"},{\"id\":\"enb1m9l3e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Amy antes de salir. Dos escuchas.\",\"audio\":\"Have you got everything?|I think so. I'll text you as soon as I get there.|Don't text me at four in the morning.|I'll let you know when I've landed, then, and you can read it whenever.|Fair enough. And listen, don't hang about at the barrier. Once you're through security there's a café that's open all night.|Right.|We'd better get a move on, actually. By the time we find the car park it'll be quarter past.\",\"question\":\"¿Qué han acordado sobre el aviso?\",\"options\":[\"Que Valeria escriba al aterrizar y Amy lo lea cuando pueda\",\"Que Valeria llame en cuanto pase el control\",\"Que no se avisen hasta el día siguiente\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del control se habla, pero para decirle dónde hay un café abierto, no para avisar de nada.\",\"Se avisan esa misma noche: lo que se negocia es la hora, no el día.\"],\"itemIds\":[\"enb1m9assoonasiget\",\"enb1m9illletyouknowwhen\",\"enb1m9once\"],\"tip\":\"Cuenta las temporales de este audio: «as soon as I get», «when I've landed», «once you're through», «by the time we find». Cuatro, y ni un «will» detrás de ninguna. Así habla la gente cuando queda para algo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m9-2\",\"book\":\"Hurry up!\",\"real\":\"We'd better get a move on.\",\"meaning\":\"Habría que ir moviéndose\",\"when\":\"Hablando, con gente de confianza y también con compañeros de trabajo. «Hurry up!» es una orden y solo se le dice a un niño o a alguien con quien tienes mucha confianza; el adulto británico mete prisa incluyéndose («we») y en condicional («we'd better»). En el Speaking del examen, la versión neutra.\",\"register\":\"amigos\",\"exam\":\"We should hurry.\",\"note\":\"Fíjate en el «we»: aunque el lento seas tú, quien lo dice se mete dentro. Es la misma cortesía que hace que un jefe británico diga «shall we make a start?» en vez de «start».\",\"sound\":\"uid BÉ-ta guet a múuv on\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m9natgetamoveon\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.p
