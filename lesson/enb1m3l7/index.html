.\u003cbr/\u003e· \u003cb\u003eSorry?\u003c/b\u003e — la más usada del Reino Unido. Una palabra, sube al final, y no queda mal con nadie.\u003cbr/\u003e· \u003cb\u003eSorry, I didn't catch that.\u003c/b\u003e — neutra y perfecta en un mostrador.\u003cbr/\u003e· \u003cb\u003eCould you repeat that, please?\u003c/b\u003e / \u003cb\u003eWould you mind repeating that?\u003c/b\u003e — la de examen.\u003cbr/\u003e· \u003ci\u003eI beg your pardon?\u003c/i\u003e — muy formal, y cuidado: dicho con otra entonación significa «¿perdona? ¿cómo te atreves?».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY confirmar lo entendido\u003c/b\u003e, que es la técnica que puntúa:\u003cbr/\u003e\u003ci\u003e\u003cb\u003eSo you're saying\u003c/b\u003e the room has changed?\u003c/i\u003e · \u003ci\u003e\u003cb\u003eDo you mean\u003c/b\u003e the one on Friday?\u003c/i\u003e · \u003ci\u003e\u003cb\u003eSo that's\u003c/b\u003e Thursday at six, is it?\u003c/i\u003e\u003cbr/\u003eOjo: \u003cb\u003e«do you mean»\u003c/b\u003e, no «do you refer to». \u003ci\u003eRefer to\u003c/i\u003e existe, pero es de artículo académico; en una conversación suena a robot.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la otra mitad de la lección: la puntuación de la cita.\u003c/b\u003e En LanguageCert la puntuación no es estética — vive dentro del criterio \u003cb\u003eOrganisation\u003c/b\u003e, uno de los cuatro. Tres reglas y ya:\u003cbr/\u003e1. \u003cb\u003eSpeech marks\u003c/b\u003e (comillas) para la cita literal, y la coma o el punto van \u003cb\u003edentro\u003c/b\u003e: \u003ci\u003e'I'm tired,' he said.\u003c/i\u003e · \u003ci\u003eHe said, 'I'm tired.'\u003c/i\u003e\u003cbr/\u003e2. La \u003cb\u003eraya\u003c/b\u003e (\u003ci\u003edash\u003c/i\u003e) mete un inciso, como los paréntesis pero más hablado: \u003ci\u003eThe manager — who had never been here before — apologised.\u003c/i\u003e\u003cbr/\u003e3. Los \u003cb\u003eparéntesis\u003c/b\u003e (\u003ci\u003ebrackets\u003c/i\u003e) meten un dato secundario: \u003ci\u003eThe meeting (two hours) was useful.\u003c/i\u003e\u003cbr/\u003eEn estilo \u003cb\u003eindirecto no hay comillas\u003c/b\u003e: \u003ci\u003eHe said he was tired.\u003c/i\u003e Poner comillas ahí es el error clásico."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l7\",\"phaseId\":\"enb1m3\",\"title\":\"Sorry, I didn't catch that\",\"subtitle\":\"Pedir que te repitan sin quedar mal, confirmar lo entendido — y puntuar una cita\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las frases que salvan una conversación\",\"itemIds\":[\"enb1m3didntcatch\",\"enb1m3sowhatyouresaying\",\"enb1m3doyoumeanthat\",\"enb1m3speechmarks\",\"enb1m3inbrackets\",\"enb1m3adash\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: pedir que te repitan es una técnica, no una derrota\",\"body\":\"$17\",\"table\":[[\"Situación\",\"Lo que dices\"],[\"No has oído, con un amigo\",\"Sorry? / Say that again?\"],[\"No has oído, en un mostrador\",\"Sorry, I didn't catch that.\"],[\"No has oído, en el examen\",\"Could you repeat that, please?\"],[\"Quieres confirmar\",\"So you're saying the room has changed?\"],[\"Quieres precisar cuál\",\"Do you mean the one on Friday?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l7e1\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con su función\",\"pairs\":[{\"target\":\"Sorry, I didn't catch that.\",\"source\":\"no he oído: que me lo repitan\"},{\"target\":\"So you're saying the room has changed?\",\"source\":\"confirmar lo que he entendido\"},{\"target\":\"Do you mean the one on Friday?\",\"source\":\"precisar a cuál se refiere\"},{\"target\":\"Would you mind repeating that?\",\"source\":\"pedir repetición en registro alto\"}],\"itemIds\":[\"enb1m3didntcatch\",\"enb1m3sowhatyouresaying\",\"enb1m3doyoumeanthat\",\"enb1m3wouldyoumind\"],\"tip\":\"Las cuatro son fórmulas fijas. En el oral del examen no se improvisan: se sueltan enteras, y por eso hay que decirlas veinte veces hasta que salgan sin pensar.\"},{\"id\":\"enb1m3l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Con quién puedes usarlo?\",\"categories\":[\"Amigos y confianza\",\"Mostrador, trabajo y examen\"],\"items\":[{\"text\":\"Sorry?\",\"bucket\":0},{\"text\":\"Could you repeat that, please?\",\"bucket\":1},{\"text\":\"Say that again?\",\"bucket\":0},{\"text\":\"Sorry, I didn't catch that.\",\"bucket\":1},{\"text\":\"Eh?\",\"bucket\":0},{\"text\":\"Would you mind repeating that?\",\"bucket\":1},{\"text\":\"What?\",\"bucket\":0},{\"text\":\"I beg your pardon?\",\"bucket\":1}],\"itemIds\":[\"enb1m3didntcatch\",\"enb1m3wouldyoumind\",\"encanyourepeat\"],\"tip\":\"«Sorry?» está a caballo: vale para casi todo el mundo, y es lo que oirás cien veces al día en Londres. «What?» a secas, en cambio, entre desconocidos suena a mala cara.\"},{\"id\":\"enb1m3l7e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Do you refer to the one on Friday?\",\"answers\":[\"Do you mean the one on Friday?\"],\"why\":\"«referirse a» en una conversación es «mean». «refer to» existe, pero es de texto académico o de reglamento: dicho de viva voz suena a manual de instrucciones.\",\"translation\":\"¿Te refieres al del viernes?\",\"itemIds\":[\"enb1m3doyoumeanthat\"]},{\"id\":\"enb1m3l7e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Sorry, I didn't listen you.\",\"answers\":[\"Sorry, I didn't hear you.\"],\"why\":\"«listen» es escuchar a propósito (y pide «to»); «hear» es oír. Si no te ha llegado el sonido, es «hear»: «I didn't hear you» o «I didn't catch that».\",\"translation\":\"Perdona, no te he oído.\",\"itemIds\":[\"enb1m3didntcatch\",\"enb1m1listento\"]},{\"id\":\"enb1m3l7e5\",\"type\":\"mc\",\"prompt\":\"La puntuación de la cita (esto son puntos de Organisation)\",\"question\":\"¿Cuál está bien puntuada?\",\"options\":[\"'I'm tired,' he said.\",\"'I'm tired'. he said.\",\"'I'm tired' he said.\"],\"answer\":0,\"whyWrong\":[null,\"El punto cierra la frase entera, no la cita: aquí la cita sigue («he said»), así que va coma, y dentro de las comillas.\",\"Falta la coma: la cita y el «he said» no pueden ir pegados sin nada.\"],\"itemIds\":[\"enb1m3speechmarks\"],\"tip\":\"Regla británica: la coma o el punto van DENTRO de las comillas. Y si el «he said» va delante, la coma va antes de abrir: «He said, 'I'm tired.'»\"},{\"id\":\"enb1m3l7e6\",\"type\":\"mc\",\"prompt\":\"La raya y el paréntesis\",\"question\":\"«The manager — who had never been here before — apologised.» ¿Qué hacen las rayas?\",\"options\":[\"Meter un inciso, como los paréntesis pero con más énfasis\",\"Separar dos frases independientes\",\"Marcar que eso es una cita literal\"],\"answer\":0,\"whyWrong\":[null,\"Para eso está el punto o el punto y coma; las rayas van SIEMPRE en pareja y lo de dentro se puede quitar.\",\"La cita literal se marca con comillas, no con rayas.\"],\"itemIds\":[\"enb1m3adash\",\"enb1m3inbrackets\"],\"tip\":\"Prueba de bolsillo: si quitas lo que va entre las dos rayas y la frase sigue funcionando, están bien puestas. Los paréntesis hacen lo mismo pero bajando la voz; la raya la sube.\"},{\"id\":\"enb1m3l7e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación en el mostrador\",\"text\":\"«___ , I didn't catch that. Could you ___ that again?» «I said the class ___ been moved to Thursday.» «___ you're saying the room has changed too?»\",\"answers\":[\"Sorry\",\"say\",\"has\",\"So\"],\"bank\":[\"Sorry\",\"say\",\"had\",\"So\",\"tell\",\"has\",\"But\"],\"translation\":\"«Perdona, no te he pillado. ¿Puedes repetirlo?» «He dicho que la clase se ha movido al jueves.» «O sea, que la sala también ha cambiado, ¿no?»\",\"itemIds\":[\"enb1m3didntcatch\",\"enb1m3sowhatyouresaying\",\"encanyousaythatagain\"],\"tip\":\"«say that again» y no «tell that again»: «tell» exige persona, y aquí no hay ninguna. Es la regla de la lección 1 asomando en mitad de una conversación real: el cambio de clase sigue siendo verdad AHORA, así que no hace falta retroceder el tiempo — «has been moved», no «had been moved». Fíjate que la frase siguiente hace lo mismo con «has changed».\"},{\"id\":\"enb1m3l7e8\",\"type\":\"transform\",\"prompt\":\"Confirma lo que has entendido\",\"source\":\"The class has been moved to Thursday.\",\"instruction\":\"Confírmalo con «So you're saying…»\",\"answers\":[\"So you're saying the class has been moved to Thursday?\",\"So you're saying the class is on Thursday?\"],\"translation\":\"O sea, que la clase se ha movido al jueves, ¿no?\",\"hints\":[\"Empieza por la fórmula de confirmar\",\"So you're saying the class ...?\"],\"itemIds\":[\"enb1m3sowhatyouresaying\"],\"tip\":\"Esto es literalmente un descriptor del B1: «repeat back part of what someone has said». Te da tiempo para pensar, demuestra que sigues la conversación y en el Speaking Part 3 puntúa. Tres cosas por una frase.\"},{\"id\":\"enb1m3l7e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Perdona, no te he pillado. ¿Me lo repites?\",\"answers\":[\"Sorry, I didn't catch that. Could you repeat that?\",\"Sorry, I didn't catch that. Can you say that again?\",\"Sorry, I didn't catch that. Could you say that again?\"],\"hint\":\"La primera mitad lleva el verbo de «pillar/coger al vuelo»\",\"itemIds\":[\"enb1m3didntcatch\",\"encanyourepeat\"],\"tip\":\"«catch» aquí no es «coger» con la mano: es coger al vuelo lo que ha dicho el otro. «I didn't catch your name» es lo que dirás en el noventa por ciento de las presentaciones.\"},{\"id\":\"enb1m3l7e10\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? El inglés hablado funde las palabras\",\"book\":\"What did you say?\",\"real\":\"Whaddya say?\",\"translation\":\"¿Qué has dicho?\",\"itemIds\":[\"enb1m3didntcatch\"],\"tip\":\"«What did you» se funde en un solo golpe: «uódiya». No es dejadez, es el ritmo acentual del inglés — lo que no lleva acento se comprime. Si esperas oír las tres palabras separadas, no las vas a oír nunca.\"},{\"id\":\"enb1m3l7e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la escalera entera, de la calle al examen\",\"text\":\"Sorry? Sorry, I didn't catch that. Could you repeat that, please?\",\"phonetic\":\"SÓ-ri · SÓ-ri, ai DÍ-dent kach dat · kud yu ri-PÍIT dat, plíis̬\",\"translation\":\"¿Cómo? · Perdona, no te he pillado. · ¿Podría repetirlo, por favor?\",\"itemIds\":[\"enb1m3didntcatch\",\"encanyourepeat\"],\"tip\":\"Las tres suben al final. Si las dices con entonación descendente, «Sorry» deja de ser «¿cómo?» y pasa a ser «lo siento», que es otra cosa — y el otro no te repite nada.\"},{\"id\":\"enb1m3l7e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"So you're saying the room has changed?\",\"translation\":\"O sea, que la sala ha cambiado, ¿no?\",\"strictContractions\":true,\"hints\":[\"Empieza por «So you're…»\",\"So you're saying the room ...?\"],\"itemIds\":[\"enb1m3sowhatyouresaying\"],\"tip\":\"«you're» suena «yoo», casi sin la «r». Escríbela con apóstrofo: «you are saying» es correcto pero suena a lectura, no a conversación.\"},{\"id\":\"enb1m3l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: por teléfono con la centralita del centro. Dos escuchas.\",\"audio\":\"Good morning, Palmer Road Library, how can I help?|Hello, I'm ringing about the English class on Tuesday. Sorry — is it at six or at half past?|Half past six, and it's in room fourteen this term, not eleven.|Sorry, I didn't catch that. Room what?|Fourteen. Four-teen. Downstairs, past the lift.|Right. So you're saying it's half past six, room fourteen, downstairs.|That's it. And bring some identification the first day, if you would.\",\"question\":\"¿Qué le confirman al final?\",\"options\":[\"Las seis y media, sala catorce, abajo\",\"Las seis en punto, sala once, arriba\",\"Las seis y media, sala once, abajo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La once es la del trimestre pasado: «room fourteen this term, not eleven».\",\"La sala es la catorce; la once ya no.\"],\"itemIds\":[\"enb1m3sowhatyouresaying\",\"enb1m3didntcatch\",\"ensixteen60\"],\"tip\":\"Fíjate en lo que hace quien llama: pide que se lo repitan («Room what?») y al final repite los tres datos juntos. Eso es exactamente lo que el examen espera del B1 — y de paso, así no se apunta mal la sala.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m3-4\",\"book\":\"What did you say?\",\"real\":\"Sorry? Say that again?\",\"meaning\":\"¿Cómo? ¿Me lo repites?\",\"when\":\"En cualquier sitio y con casi cualquiera: «Sorry?» es LA forma británica de pedir que te repitan. Con amigos también «Say that again?». Lo que NO se dice a un desconocido es «What?» a secas — la traducción literal de «¿qué?» suena a mala gana.\",\"register\":\"neutral\",\"exam\":\"I beg your pardon? Could you repeat that, please?\",\"note\":\"«Sorry?» con entonación ASCENDENTE es «¿cómo?»; con entonación descendente es «lo siento». La misma palabra, dos actos de habla, y lo único que los separa es la melodía. Es el mejor ejemplo de por qué el B1 trabaja el oído.\",\"sound\":\"SÓ-ri · sei dat a-GUÉN\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m3natsaythatagain\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A
