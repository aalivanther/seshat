ar sequence of points»\u003c/b\u003e, y lo repite dos veces. Traducido: \u003cb\u003eel B1 oral no premia la frase complicada, premia encadenar\u003c/b\u003e. Una partitura de cuatro tiempos y no te sales de ella:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Anuncia\u003c/b\u003e — «I'd like to talk about… I'll say three things.»\u003cbr/\u003e\u003cb\u003e2. Cuenta\u003c/b\u003e — un hecho concreto tuyo, con una fecha o una cifra. Aquí es donde entra el present perfect: «I've been here for…», «I've already…».\u003cbr/\u003e\u003cb\u003e3. Compara o valora\u003c/b\u003e — «Although… , the best part has been…»\u003cbr/\u003e\u003cb\u003e4. Cierra\u003c/b\u003e — «So, all in all, …» Cerrar vale puntos: un monólogo que se apaga sin final suena a que se te acabó el idioma.\u003cbr/\u003e\u003cbr/\u003eEn los treinta segundos de notas \u003cb\u003eno escribas frases\u003c/b\u003e: escribe cinco palabras sueltas, una por punto. Si escribes frases las vas a leer, y leer se nota y baja la fluidez.\u003cbr/\u003e\u003cbr/\u003eY la segunda pasada \u003cb\u003esiempre\u003c/b\u003e sale mejor que la primera. No es que hoy hables mejor: es que repetir la tarea libera atención para la forma. Está medido."])</script><script>self.__next_f.push([1,"18:T667,"])</script><script>self.__next_f.push([1,"So, two years this month. Does it feel like two years?|Some days it feels like ten. Honestly, Ben, when I look back at my first month here I don't recognise that person. I'd been in London three weeks and I still hadn't opened a bank account.|You'd only just arrived. Nobody sorts that out in three weeks.|My cousin did. She's been in Madrid since January and she's already got a flat, a phone contract and a job.|Madrid isn't London. How many places have you lived in since you got here?|Four. And the last one was the worst. The landlord kept the deposit for six weeks and then sent me half of it with no explanation at all.|Did you get the rest in the end?|I did, but only because Amy told me to put it in writing. I'd been ringing him for a month and getting nowhere. The email took ten minutes and the money arrived on the Friday.|That's the bit nobody tells you when you move here. In this country, if it isn't in writing it didn't happen.|I've learnt that the hard way. Anyway, this flat is different. The rent hasn't gone up yet, Amy pays her share on time, and the boiler has been working since October, which for this street is a record.|So you're staying.|I'm staying. I've just signed for another year, actually. And I've put a shelf up.|A shelf.|You can laugh. I lived out of boxes for eighteen months, Ben. Putting a shelf up means I've stopped waiting to leave.|Fair enough. And the English?|Better than I say it is. I've been reading the local paper on the bus every morning since the spring, and last week I understood an argument between two men about parking. Every word of it.|That's not English. That's an achievement."])</script><script>self.__next_f.push([1,"19:T667,"])</script><script>self.__next_f.push([1,"So, two years this month. Does it feel like two years?|Some days it feels like ten. Honestly, Ben, when I look back at my first month here I don't recognise that person. I'd been in London three weeks and I still hadn't opened a bank account.|You'd only just arrived. Nobody sorts that out in three weeks.|My cousin did. She's been in Madrid since January and she's already got a flat, a phone contract and a job.|Madrid isn't London. How many places have you lived in since you got here?|Four. And the last one was the worst. The landlord kept the deposit for six weeks and then sent me half of it with no explanation at all.|Did you get the rest in the end?|I did, but only because Amy told me to put it in writing. I'd been ringing him for a month and getting nowhere. The email took ten minutes and the money arrived on the Friday.|That's the bit nobody tells you when you move here. In this country, if it isn't in writing it didn't happen.|I've learnt that title\":\"Valeria's two years\",\"subtitle\":\"La historia del módulo, el repaso y tu primer monólogo del nivel\",\"minutes\":25,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas\",\"itemIds\":[\"enb1m1lookback\",\"enb1m1proudof\",\"enb1m1madeprogress\",\"enb1m1atlast\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se monta un monólogo de minuto y medio\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la historia de los dos años de Valeria\",\"sentences\":[\"Valeria arrived in London in 2023 with two suitcases and a month's rent.\",\"For the first six months she shared a room with a stranger in Walthamstow.\",\"Then Amy offered her the second bedroom in her flat, and she moved in.\",\"She has been working at Sam's café since March, and studying in the evenings.\",\"Now she has just signed a two-year contract, and she is staying.\"],\"translation\":\"Valeria llegó a Londres en 2023 con dos maletas y un mes de alquiler. Los primeros seis meses compartió habitación con una desconocida en Walthamstow. Luego Amy le ofreció el segundo dormitorio de su piso y se mudó. Trabaja en el café de Sam desde marzo y estudia por las tardes. Ahora acaba de firmar un contrato de dos años y se queda.\",\"itemIds\":[\"enb1m1arrivedin\",\"enb1m1beenworking\",\"enb1m1just\",\"enb1m1movedin\"],\"tip\":\"Fíjate en el hilo de tiempos: pasado simple para lo cerrado, perfecto continuo para lo que sigue, «has just» para lo de hace un momento. Un relato de B1 mezcla los tres y no se lía.\"},{\"id\":\"enb1m1l9e2\",\"type\":\"gapbank\",\"prompt\":\"Espiral del módulo — completa el resumen\",\"text\":\"Valeria has lived in London ___ two years. She arrived ___ 2023 and moved into Amy's flat ___ year. She has ___ signed a new contract, and she isn't planning to move.\",\"answers\":[\"for\",\"in\",\"last\",\"just\"],\"bank\":[\"for\",\"in\",\"last\",\"just\",\"since\",\"yet\",\"ago\"],\"translation\":\"Valeria lleva dos años viviendo en Londres. Llegó en 2023 y se mudó al piso de Amy el año pasado. Acaba de firmar un contrato nuevo y no piensa mudarse.\",\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1arrivedin\",\"enb1m1lastyear\",\"enb1m1just\"],\"tip\":\"Cuatro huecos, cuatro lecciones de este módulo: duración, fecha, periodo cerrado y adverbio de perfecto. Si te salen los cuatro, el módulo está.\"},{\"id\":\"enb1m1l9e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I've done a lot of progress this year.\",\"answers\":[\"I've made a lot of progress this year.\"],\"why\":\"«hacer» es un verbo en español y dos en inglés, y el reparto es arbitrario: se hace («make») progreso, un error, una decisión; y se hace («do») los deberes, un curso, la compra. No hay regla: hay colocación.\",\"translation\":\"He avanzado mucho este año.\",\"itemIds\":[\"enb1m1madeprogress\"]},{\"id\":\"enb1m1l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo que ya sabes — make o do\",\"pairs\":[{\"target\":\"make a mistake\",\"source\":\"cometer un error\"},{\"target\":\"make a decision\",\"source\":\"tomar una decisión\"},{\"target\":\"do the shopping\",\"source\":\"hacer la compra\"},{\"target\":\"do the homework\",\"source\":\"hacer los deberes\"},{\"target\":\"make progress\",\"source\":\"avanzar\"}],\"targetSeconds\":25,\"itemIds\":[\"enb1m1madeprogress\",\"enhomework\"],\"tip\":\"Estas cinco no se deducen: se memorizan como bloques. El cronómetro solo premia — si tardas, no pasa nada.\"},{\"id\":\"enb1m1l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"I'm proud ___ what I've done in two years.\",\"answers\":[\"of\"],\"translation\":\"Estoy orgullosa de lo que he hecho en dos años.\",\"hints\":[\"Adjetivo con preposición fija\",\"proud ... something\"],\"itemIds\":[\"enb1m1proudof\"],\"tip\":\"Los adjetivos también tienen su preposición pegada: proud OF, interested IN, good AT, worried ABOUT. Misma mecánica que los verbos.\"},{\"id\":\"enb1m1l9e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «proud»\",\"source\":\"I'm proud of what I've done.\",\"forbid\":[\"proud\"],\"answers\":[\"I'm happy with what I've done\",\"I feel good about what I've done\",\"I'm pleased with what I've done\"],\"translation\":\"Estoy orgullosa de lo que he hecho.\",\"hints\":[\"Con «happy» y otra preposición\",\"I'm happy ... what I've done\"],\"itemIds\":[\"enb1m1proudof\"],\"tip\":\"Cuidado: al cambiar el adjetivo cambia la preposición. proud OF, pero happy WITH y pleased WITH. Van en bloque, siempre.\"},{\"id\":\"enb1m1l9e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Cuando echo la vista atrás, no me lo creo.\",\"answers\":[\"When I look back, I can't believe it\",\"When I look back, I can hardly believe it\"],\"hint\":\"Empieza por la subordinada de tiempo, con coma\",\"itemIds\":[\"enb1m1lookback\"],\"tip\":\"«look back» es la frase con la que arranca cualquier balance en inglés. Guárdatela para el monólogo: sirve de arranque en el 90 % de los temas del Part 4.\"},{\"id\":\"enb1m1l9e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu frase de cierre del monólogo\",\"text\":\"So, all in all, it's been a good two years, and I'm staying.\",\"phonetic\":\"sóu, ool in ool, its bin a gud tuu YÍAS̬, and aim STÉI-ing\",\"translation\":\"Así que, en conjunto, han sido dos años buenos, y me quedo.\",\"itemIds\":[\"enb1m1atlast\",\"enb1m1havelivedhere\"],\"tip\":\"«all in all» = «en conjunto». Es la señal de que vas a cerrar, y el examinador la reconoce. Cerrar bien es un punto de Task Fulfilment que mucha gente regala.\"},{\"id\":\"enb1m1l9e9\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"An exciting experience: my first two years in a new place\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about my first two years in… I'll say three things.»\"},{\"title\":\"2. The facts\",\"hint\":\"Un hecho concreto con fecha o cifra, en present perfect: «I've been here for… I moved in… I've already…»\"},{\"title\":\"3. What changed\",\"hint\":\"Contrasta el antes y el ahora con un conector: «At first… Although it was hard, now I…»\"},{\"title\":\"4. Close\",\"hint\":\"Cierra con una valoración: «So, all in all, … and I'm proud of…»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Di un dato concreto: una fecha, una cifra o un nombre\",\"Usé al menos tres present perfect (I've been / I've already / I haven't… yet)\",\"Usé al menos dos conectores distintos (although, since, therefore, besides)\",\"Cerré con una frase de cierre y no me apagué a media idea\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «I moved to London in 2023, so I've been here for two years now. At first I shared a room with a stranger, and I've lived in three different flats since then. I've already passed my English course, although I'm still working at the same café.»\",\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1already\",\"enb1m1still\",\"enb1m1proudof\",\"enb1m1although\"],\"tip\":\"Treinta segundos de planificación no son para escribir el discurso: son para decidir el ORDEN. Si sabes por dónde vas, la fluidez viene sola.\"},{\"id\":\"enb1m1l9e10\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre: escribe la frase que oyes\",\"text\":\"I've made a lot of progress since March.\",\"translation\":\"He avanzado mucho desde marzo.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I have»\",\"I've made a lot of ...\"],\"itemIds\":[\"enb1m1madeprogress\",\"enb1m1sincemarch\"],\"tip\":\"«made» y no «done», y «since» y no «for», porque March es un momento. Dos decisiones del módulo en siete palabras.\"},{\"id\":\"enb1m1l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Llevo dos años aquí y estoy orgullosa de lo que he hecho.\",\"answers\":[\"I've been here for two years and I'm proud of what I've done\",\"I have been here for two years and I am proud of what I have done\",\"I've lived here for two years and I'm proud of what I've done\"],\"hints\":[\"Perfecto + for para la duración\",\"proud + su preposición\"],\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1proudof\"],\"tip\":\"Present perfect con «for», adjetivo con su preposición y una relativa sin antecedente («what I've done»), todo en trece palabras. Módulo cerrado: ya escribes B1.\"},{\"id\":\"enb1m1l9e12\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 4 en formato real: una discusión entre dos personas. Aquí, una sola escucha — el examen te dará dos. Toma notas: hay varias opiniones y no todas son del mismo hablante.\",\"notepad\":true,\"audio\":\"So they've announced another three hundred flats down by the canal. Good news, I'd say.|Is it, though? I mean, three hundred flats, and how many of them will anybody round here be able to afford?|Well, some of them have to be affordable housing. That's the law.|A percentage. And developers have been getting out of that percentage for years — they argue the site doesn't make enough money, and the council lets them.|You're very cynical.|I'm not cynical, I'm just old. I've watched this happen three times on this street since the nineties. Every time we're told the new flats will bring the rents down, and every time they go up.|All right, but what's the alternative? If nobody builds anything, the rents go up too. At least this way there are more homes.|More homes for who, though? That's the bit nobody answers.\",\"question\":\"¿En qué están de acuerdo los dos hablantes?\",\"options\":[\"En que hacen falta más viviendas en el barrio\",\"En que los pisos nuevos bajarán los alquileres\",\"En que el ayuntamiento hace bien su trabajo\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"La segunda voz dice justo lo contrario: «every time they go up».\",\"La segunda voz acusa al ayuntamiento de dejar hacer a las promotoras.\"],\"itemIds\":[\"enb1m1housingcrisis\",\"enb1m1afford\",\"enb1m1riseinrents\"],\"tip\":\"El acuerdo casi nunca se dice: se deduce. Aquí sale de «At least this way there are more homes» y de que la otra voz no lo niega — solo pregunta para quién. Eso es exactamente lo que el Part 4 llama «hecho frente a opinión».\"},{\"id\":\"enb1m1l9e13\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, cinco preguntas. Léelas TODAS antes de darle al play y usa el cuaderno: van en el orden de la conversación. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Qué dice Valeria de la persona que era en su primer mes?\",\"options\":[\"Que no se reconoce en ella\",\"Que lo tenía todo resuelto en tres semanas\",\"Que estaba más contenta que ahora\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Justo lo contrario: a las tres semanas todavía no tenía ni cuenta en el banco.\",\"De estar contenta no dice nada. Dice que algunos días se le hicieron diez años.\"],\"itemIds\":[\"enb1m1lookback\",\"enb1m1arrivedin\",\"enb1m1notyet\"],\"tip\":\"Primera pregunta, primer minuto: las preguntas van SIEMPRE en el orden del audio. Si la uno te cae en el segundo veinte, la dos no está antes.\"},{\"id\":\"enb1m1l9e14\",\"type\":\"audiomc\",\"prompt\":\"Misma conversación, pregunta 2. No vuelvas a darle al play todavía: contesta las cinco y luego escucha otra vez.\",\"audio\":\"$19\",\"question\":\"¿Para qué saca Valeria el tema de su prima de Madrid?\",\"options\":[\"Para comparar su ritmo con el de alguien que lo tuvo más fácil\",\"Para decir que se quiere ir a vivir a España\",\"Para explicar por qué tardó en abrir la cuenta\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"En ningún momento dice que quiera irse. Está contando por qué se siente lenta.\",\"La cuenta del banco es el ejemplo anterior; la prima aparece después y sirve para otra cosa.\"],\"itemIds\":[\"enb1m1already\",\"enb1m1sincemarch\"],\"tip\":\"«Madrid isn't London», contesta Ben. Cuando alguien responde a un ejemplo desmontándolo, ese ejemplo era una COMPARACIÓN. Ahí tienes el propósito, y el propósito es media Parte 4.\"},{\"id\":\"enb1m1l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: el dato que hay que haber apuntado.\",\"audio\":\"$1a\",\"question\":\"¿En cuántos sitios ha vivido desde que llegó?\",\"options\":[\"En cuatro\",\"En tres\",\"En seis\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Tres son las SEMANAS que llevaba aquí cuando aún no tenía cuenta en el banco. El audio está lleno de números y solo uno contesta.\",\"No aparece ese número. Seis son las semanas que el casero se quedó la fianza.\"],\"itemIds\":[\"enb1m1movedin\",\"enb1m1landlord\"],\"tip\":\"Por esto existe el cuaderno. En tres minutos oyes dos años, tres semanas, cuatro pisos, seis semanas, dieciocho meses y diez minutos: de cabeza no se sostiene, y no medir memoria es justamente el motivo de que en el examen se pueda escribir.\"},{\"id\":\"enb1m1l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: causa y efecto.\",\"audio\":\"$1b\",\"question\":\"¿Qué consiguió que le devolvieran el resto de la fianza?\",\"options\":[\"Ponerlo por escrito en un correo\",\"Llamar al casero durante un mes\",\"Que Amy hablara con el casero\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Llamó un mes entero y no consiguió nada: eso es lo que el audio marca como lo que NO funcionó.\",\"Amy le dio el consejo; la que escribió el correo fue Valeria.\"],\"itemIds\":[\"enb1m1deposit\",\"enb1m1landlord\",\"enb1m1toldmeabout\"],\"tip\":\"«If it isn't in writing it didn't happen» no es una frase bonita: es el consejo práctico del módulo entero y vuelve en el m5 con las reclamaciones.\"},{\"id\":\"enb1m1l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5, y es de las que no se contestan con una palabra oída.\",\"audio\":\"$1c\",\"question\":\"¿Qué quiere decir Valeria cuando cuenta que ha puesto una estantería?\",\"options\":[\"Que ha dejado de vivir como si fuera a marcharse\",\"Que el piso venía sin muebles\",\"Que necesitaba sitio para los libros del curso\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"De los muebles del piso no se habla. Ben se ríe justo porque una estantería, en sí, no es noticia.\",\"Los libros no salen. Lo que sale son dieciocho meses viviendo entre cajas.\"],\"itemIds\":[\"enb1m1settlein\",\"enb1m1just\",\"enb1m1proudof\"],\"tip\":\"Esta es la pregunta de actitud, y en el examen hay una por audio. Se contesta con lo que la persona QUIERE DECIR, no con lo que dice. La pista está en la frase de después: «I lived out of boxes for eighteen months».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m1-4\",\"book\":\"I have to go now.\",\"real\":\"I'd better be off.\",\"meaning\":\"Me tengo que ir yendo\",\"when\":\"Para despedirte sin brusquedad de una conversación que ya se alarga: en casa de alguien, en el pub, al final de una visita al piso. Es la fórmula educada de la calle. En un correo o en el Speaking de examen no cabe: allí se avisa con una frase entera.\",\"register\":\"neutral\",\"exam\":\"I'm afraid I have to go now.\",\"note\":\"«had better» siempre se contrae en «'d better», y muchísimos hablantes se comen hasta eso: «Better be off». Ojo — detrás va infinitivo SIN «to»: «I'd better go», nunca «I'd better to go».\",\"sound\":\"aid BÉ-ta bi of\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m1natbetterbeoff\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Spoken (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Mira el Part 4: los tres temas que ofrece el interlocutor —y de los que elige uno él—, los treinta segundos de notas y el minuto y medio. Cronométrate en casa con el reloj del móvil.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1d\",\"6\",{}]]\n"])</script></body></html>
