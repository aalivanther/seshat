iagnóstico: tres errores que se repiten\",\"body\":\"\u003cb\u003e1. Quién hace qué.\u003c/b\u003e El cerebro asigna el papel de agente al PRIMER sustantivo. Por eso \u003ci\u003eDer Dieb wurde von der Polizei gefangen\u003c/i\u003e se lee mal («el ladrón atrapó…»). Con \u003cb\u003ewird/wurde + Partizip\u003c/b\u003e, el primer sustantivo \u003cu\u003erecibe\u003c/u\u003e la acción, no la hace.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. wird ≠ ist.\u003c/b\u003e \u003ci\u003eDie Tür wird geöffnet\u003c/i\u003e (la están abriendo) ≠ \u003ci\u003eDie Tür ist geöffnet\u003c/i\u003e (está abierta). Proceso contra estado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. La preposición va pegada al verbo\u003c/b\u003e y no se traduce: \u003cb\u003esich kümmern \u003cu\u003eum\u003c/u\u003e\u003c/b\u003e + Akk, \u003cb\u003eachten \u003cu\u003eauf\u003c/u\u003e\u003c/b\u003e + Akk, \u003cb\u003eabhängen \u003cu\u003evon\u003c/u\u003e\u003c/b\u003e + Dat, \u003cb\u003everzichten \u003cu\u003eauf\u003c/u\u003e\u003c/b\u003e + Akk, \u003cb\u003ebeitragen \u003cu\u003ezu\u003c/u\u003e\u003c/b\u003e + Dat. Se aprenden en bloque, como una sola palabra. Y para referirte a una COSA no repites la preposición: usas \u003cb\u003eda(r)-\u003c/b\u003e: \u003ci\u003eIch kümmere mich \u003cb\u003edarum\u003c/b\u003e\u003c/i\u003e · \u003ci\u003eIch verzichte \u003cb\u003edarauf\u003c/b\u003e\u003c/i\u003e. Para preguntar: \u003cb\u003eWorum\u003c/b\u003e kümmerst du dich? · \u003cb\u003eWorauf\u003c/b\u003e achtest du?\",\"table\":[[\"verbo + preposición\",\"caso\",\"ejemplo\"],[\"sich kümmern um\",\"Akkusativ\",\"Wir kümmern uns um die Umwelt.\"],[\"achten auf\",\"Akkusativ\",\"Ich achte auf meinen Verbrauch.\"],[\"abhängen von\",\"Dativ\",\"Das hängt von der Politik ab.\"],[\"verzichten auf\",\"Akkusativ\",\"Ich verzichte auf das Auto.\"],[\"beitragen zu\",\"Dativ\",\"Jeder trägt zu einer besseren Luft bei.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m5l5e1\",\"type\":\"mc\",\"prompt\":\"¿Quién hace la acción?\",\"question\":\"„Der Dieb wurde von der Polizei gefangen.“ ¿Quién atrapa a quién?\",\"options\":[\"La policía atrapa al ladrón\",\"El ladrón atrapa a la policía\"],\"answer\":0,\"whyWrong\":[null,\"El primer sustantivo de una pasiva NO es quien actúa: es quien recibe. El agente va tras von\"],\"itemIds\":[\"b1m5vonderstadt\"],\"tip\":\"Regla de supervivencia: con wurde + Partizip, busca el von — ahí está quien manda.\"},{\"id\":\"b1m5l5e2\",\"type\":\"mc\",\"prompt\":\"¿Quién hace la acción?\",\"question\":\"„Die Bürgerin wurde von der Politikerin informiert.“ ¿Quién informa?\",\"options\":[\"La ciudadana\",\"La política\"],\"answer\":1,\"whyWrong\":[\"La ciudadana está la primera, pero es quien RECIBE la información\",null],\"itemIds\":[\"b1m5vonderstadt\"],\"tip\":\"Frase reversible: las dos podrían informar. Solo la forma (wurde … von) decide. Eso es procesar la gramática, no adivinar.\"},{\"id\":\"b1m5l5e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿está pasando o ya está hecho?\",\"categories\":[\"está pasando (wird)\",\"ya está hecho (ist)\"],\"items\":[{\"text\":\"Die Tür wird geöffnet.\",\"bucket\":0},{\"text\":\"Die Tür ist geöffnet.\",\"bucket\":1},{\"text\":\"Der Container wird geleert.\",\"bucket\":0},{\"text\":\"Der Container ist geleert.\",\"bucket\":1},{\"text\":\"Das Fenster wird geschlossen.\",\"bucket\":0},{\"text\":\"Das Fenster ist geschlossen.\",\"bucket\":1}],\"itemIds\":[\"b1m5muelltonne\",\"b1m5trennen\"],\"tip\":\"Solo cambia el auxiliar, y cambia todo el significado. El español «está abierto/se abre» no te avisa: la forma sí.\"},{\"id\":\"b1m5l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Wir kümmern uns ___ die Umwelt.\",\"answers\":[\"um\"],\"translation\":\"Nos ocupamos del medio ambiente.\",\"hints\":[\"No se traduce «de»: se aprende con el verbo\",\"sich kümmern + ...\"],\"itemIds\":[\"b1m5sichkuemmernum\",\"b1m5umwelt\"],\"tip\":\"sich kümmern um + Akkusativ. En bloque, como una palabra: kümmern-um.\"},{\"id\":\"b1m5l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Das hängt ___ der Politik ab.\",\"answers\":[\"von\"],\"translation\":\"Eso depende de la política.\",\"hints\":[\"abhängen pide siempre la misma preposición + Dativo\",\"v...\"],\"itemIds\":[\"b1m5abhaengenvon\"]},{\"id\":\"b1m5l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa con el banco de preposiciones\",\"text\":\"Ich achte ___ meinen Verbrauch. Ich verzichte ___ das Auto. Jeder trägt ___ einer besseren Luft bei.\",\"answers\":[\"auf\",\"auf\",\"zu\"],\"bank\":[\"auf\",\"zu\",\"um\",\"von\",\"für\",\"über\",\"an\"],\"translation\":\"Cuido mi consumo. Renuncio al coche. Cada uno contribuye a un aire mejor.\",\"itemIds\":[\"b1m5achtenauf\",\"b1m5verzichtenauf\",\"b1m5beitragenzu\"],\"tip\":\"Dos verbos distintos pueden compartir preposición (achten auf, verzichten auf) — pero eso no se adivina: se memoriza.\"},{\"id\":\"b1m5l5e7\",\"type\":\"type\",\"prompt\":\"Pregunta por una COSA, no por una persona\",\"question\":\"«¿A qué prestas atención?» con achten auf\",\"answers\":[\"Worauf achtest du?\",\"Worauf achten Sie?\"],\"hints\":[\"Para cosas: wo + preposición (con -r- si empieza por vocal)\",\"Wo + r + auf ...\"],\"itemIds\":[\"b1m5achtenauf\"],\"tip\":\"Personas: Auf wen achtest du? · Cosas: Worauf achtest du? El español no tiene esta distinción; el alemán la exige.\"},{\"id\":\"b1m5l5e8\",\"type\":\"transform\",\"prompt\":\"Transforma: quítale el man\",\"source\":\"Man verbietet das Rauchen im Park.\",\"instruction\":\"Ponla en Passiv\",\"answers\":[\"Das Rauchen wird im Park verboten\",\"Das Rauchen wird im Park verboten.\",\"Im Park wird das Rauchen verboten\"],\"translation\":\"Se prohíbe fumar en el parque.\",\"hints\":[\"El objeto sube a sujeto\",\"Das Rauchen wird ...\"],\"itemIds\":[\"b1m5verboten\"]},{\"id\":\"b1m5l5e9\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora al revés\",\"source\":\"Der Müll wird jeden Freitag abgeholt.\",\"instruction\":\"Dilo con man\",\"answers\":[\"Man holt den Müll jeden Freitag ab\",\"Man holt den Müll jeden Freitag ab.\",\"Jeden Freitag holt man den Müll ab\"],\"translation\":\"La basura se recoge todos los viernes.\",\"hints\":[\"man + verbo conjugado + objeto en Akkusativ\",\"Man holt den Müll ...\"],\"itemIds\":[\"b1m5muell\",\"b1m5abholung\"],\"tip\":\"Saber ir y volver entre man y Passiv es lo que te deja elegir el foco: man deja a alguien detrás de la acción, la pasiva lo borra. Las dos se escriben.\"},{\"id\":\"b1m5l5e10\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"In meiner Meinung ist das Tempolimit gut.\",\"answers\":[\"Meiner Meinung nach ist das Tempolimit gut.\",\"Meiner Meinung nach ist das Tempolimit gut\"],\"why\":\"«en mi opinión» no se calca: el alemán usa Meiner Meinung nach (con nach DETRÁS) o Ich bin der Meinung, dass… Es la fórmula que abre casi todos los comentarios del examen.\",\"translation\":\"En mi opinión el límite de velocidad es bueno.\",\"itemIds\":[\"b1m1meinermeinungnach\"]},{\"id\":\"b1m5l5e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Das Auto ist schlecht für die Umwelt.\",\"forbid\":[\"schlecht\",\"Auto\"],\"answers\":[\"Der Verkehr schadet der Umwelt.\",\"Der Verkehr belastet die Umwelt.\",\"Der Verkehr ist nicht umweltfreundlich.\",\"Der Verkehr schadet dem Klima.\",\"Der Verkehr ist umweltschädlich.\",\"Autos schaden der Umwelt.\"],\"translation\":\"El coche es malo para el medio ambiente.\",\"hints\":[\"Sin «schlecht» y sin «Auto»: usa Verkehr y schaden o umweltfreundlich\",\"Der Verkehr ...\"],\"itemIds\":[\"b1m5umwelt\",\"b1m5umweltfreundlich\"],\"tip\":\"Rodear lo que no puedes decir ES el descriptor de B1. Cada rodeo suma en «Wortschatz».\"},{\"id\":\"b1m5l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Nos ocupamos del medio ambiente\",\"answers\":[\"Wir kümmern uns um die Umwelt\",\"Wir kümmern uns um die Umwelt.\"],\"hints\":[\"sich kümmern um + Akkusativ\",\"Wir kümmern uns ...\"],\"itemIds\":[\"b1m5sichkuemmernum\",\"b1m5umwelt\"],\"tip\":\"Verbo, reflexivo y preposición salieron juntos: así se guarda un bloque léxico de B1.\"},{\"id\":\"b1m5l5e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · mensaje 1 de 2 · tarea 1 de 2. Lee la afirmación, dale al play y marca Richtig o Falsch. El Teil 1 se oye DOS veces.\",\"audio\":\"Guten Tag, hier ist die Stadtreinigung, Abteilung Sperrmüll. Es geht um Ihre Anmeldung von letzter Woche. Also, der Termin am Freitag – der klappt leider nicht, unser Wagen ist in der Werkstatt. Wir kommen dafür am Montag, schon um sieben Uhr früh. Und ganz wichtig: Die Möbel dürfen erst am Montagmorgen rausgestellt werden, nicht schon am Wochenende. Sonst wird das der ganzen Hausgemeinschaft in Rechnung gestellt.\",\"question\":\"„Die Abholung bleibt am Freitag.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«der Termin am Freitag – der klappt leider nicht»; vienen el lunes a las siete\",null],\"itemIds\":[\"b1m5sperrmuell\",\"b1m5abholung\"],\"tip\":\"En el Teil 1 el dato que decide llega casi siempre tras un «leider» o un «aber». Anota día y hora en cuanto suenen.\"},{\"id\":\"b1m5l5e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas (así es el Teil 1: dos tareas por mensaje, R/F y luego tres opciones).\",\"audio\":\"Guten Tag, hier ist die Stadtreinigung, Abteilung Sperrmüll. Es geht um Ihre Anmeldung von letzter Woche. Also, der Termin am Freitag – der klappt leider nicht, unser Wagen ist in der Werkstatt. Wir kommen dafür am Montag, schon um sieben Uhr früh. Und ganz wichtig: Die Möbel dürfen erst am Montagmorgen rausgestellt werden, nicht schon am Wochenende. Sonst wird das der ganzen Hausgemeinschaft in Rechnung gestellt.\",\"question\":\"¿Cuándo se pueden sacar los muebles a la calle?\",\"options\":[\"Solo el lunes por la mañana\",\"Ya el fin de semana\",\"El viernes por la noche\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«nicht schon am Wochenende» — y quien se adelanta le cuesta dinero a todo el edificio\",\"El viernes se cayó del calendario al principio del mensaje\"],\"itemIds\":[\"b1m5verboten\",\"b1m5massnahme\"],\"tip\":\"«dürfen erst … werden» es la pasiva con modal de esta lección, hablada por un funcionario. Aquí «erst» no es «primero», sino «no antes de».\"}]}],\"resources\":[{\"label\":\"Libreta B1 — Verbos con preposición\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"La lista con caso es la fuente de tus repasos de rección: revísala una vez por semana, en voz alta.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
