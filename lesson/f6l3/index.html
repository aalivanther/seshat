na,\",\"Liebe Anna,\",\"Hallo Frau Anna,\"],\"answer\":1,\"whyWrong\":[\"Lieber es para hombre: Lieber Paul\",null,\"Frau va con apellido y en registro formal — Anna es tu amiga\"],\"itemIds\":[\"liebeanna\"],\"tip\":\"Liebe + nombre de mujer, Lieber + nombre de hombre. La -r marca el masculino.\"},{\"id\":\"f6l3e2\",\"type\":\"match\",\"prompt\":\"Empareja el kit del email\",\"pairs\":[{\"target\":\"Liebe Anna, ...\",\"source\":\"Querida Anna (saludo)\"},{\"target\":\"Viele Grüße\",\"source\":\"Muchos saludos (despedida)\"},{\"target\":\"das Formular\",\"source\":\"el formulario\"},{\"target\":\"die Antwort\",\"source\":\"la respuesta\"}],\"itemIds\":[\"liebeanna\",\"vielegruesse\",\"formular\",\"antwort\"]},{\"id\":\"f6l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa la nota tipo examen\",\"text\":\"___ Anna, ich komme am Samstag. Viele Grüße, Leo\",\"answers\":[\"Liebe\"],\"translation\":\"Querida Anna, voy el sábado. Muchos saludos, Leo\",\"hints\":[\"Anna es mujer\",\"L-i-e-b-e, sin -r\"],\"itemIds\":[\"liebeanna\",\"vielegruesse\"]},{\"id\":\"f6l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa la despedida (¡Umlaut y ß!)\",\"text\":\"Viele ___, Sofía\",\"answers\":[\"Grüße\"],\"translation\":\"Muchos saludos, Sofía\",\"hints\":[\"Viene de der Gruß\",\"G-r-ü-ß-e: con ü y con ß\"],\"itemIds\":[\"vielegruesse\"],\"tip\":\"«Grusse» sin Umlaut es exactamente el tipo de error que te descuenta en Schreiben.\"},{\"id\":\"f6l3e5\",\"type\":\"cloze\",\"prompt\":\"Lesen tipo examen: completa el mini-texto\",\"text\":\"Liebe Marta, ich ___ am Samstag leider nicht kommen. Ich muss arbeiten. Viele Grüße, Paul\",\"answers\":[\"kann\"],\"translation\":\"Querida Marta, lamentablemente no puedo ir el sábado. Tengo que trabajar. Muchos saludos, Paul\",\"hints\":[\"El modal de poder, con ich\",\"La pinza: k-a-n-n ... kommen\"],\"itemIds\":[\"satz\",\"liebeanna\"],\"tip\":\"¿Ves? El email del examen es EXACTAMENTE tu diálogo de invitación de la fase 5.\"},{\"id\":\"f6l3e6\",\"type\":
