, y te ahorran el error que más lejos llega — hay gente con nivel C2 que sigue diciendo \u003ci\u003e*the informations\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003epeople · news · information · advice · furniture · luggage · homework · money · hair · bread\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eNinguna lleva \u003cb\u003e-s\u003c/b\u003e. Ninguna lleva \u003cb\u003ea / an\u003c/b\u003e. Y todas llevan el verbo \u003cb\u003een singular\u003c/b\u003e… menos una: [[People are very friendly.|La gente es muy maja.]] \u003cb\u003epeople es plural\u003c/b\u003e (uno es \u003ci\u003ea person\u003c/i\u003e), así que va con \u003ci\u003eare\u003c/i\u003e, con \u003ci\u003emany\u003c/i\u003e y con \u003ci\u003ea lot of\u003c/i\u003e. Es la rara de la lista, y por eso va la primera.\u003cbr/\u003e\u003cbr/\u003eDos que dan especial guerra:\u003cbr/\u003e· \u003cb\u003enews\u003c/b\u003e acaba en -s y aun así es singular: [[The news is good.|Las noticias son buenas.]]\u003cbr/\u003e· \u003cb\u003ehair\u003c/b\u003e es todo el pelo de la cabeza a la vez: [[My hair is very long and dark.|Tengo el pelo muy largo y moreno.]] \u003ci\u003e*My hairs\u003c/i\u003e significaría pelos sueltos, uno a uno, y da bastante grima.\u003cbr/\u003e\u003cbr/\u003e¿Y si necesitas contarlas? Se cuentan por porciones —\u003ci\u003ea piece of advice\u003c/i\u003e, \u003ci\u003etwo pieces of luggage\u003c/i\u003e— y eso es la lección 5 entera."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l2\",\"phaseId\":\"ena2m5\",\"title\":\"People are very friendly\",\"subtitle\":\"Diez palabras que el español cuenta y el inglés no — se aprenden enteras\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La lista y sus concordancias\",\"itemIds\":[\"ena2m5uncountablegroup\",\"ena2m5peoplearefriendly\",\"ena2m5somegoodadvice\",\"ena2m5thenewsisgood\",\"ena2m5myhairisverylong\",\"ena2m5money\",\"enpeople\",\"enhomework\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Las diez: apréndetelas como una lista, no como una regla\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"verbo\"],[\"la gente es maja\",\"people are friendly\",\"are (¡plural!)\"],[\"las noticias son buenas\",\"the news is good\",\"is\"],[\"necesito información\",\"I need information\",\"is\"],[\"me dio dos consejos\",\"she gave me some advice\",\"is\"],[\"tengo muchos deberes\",\"I have a lot of homework\",\"is\"],[\"tengo el pelo largo\",\"my hair is long\",\"is\"],[\"¿cuánto dinero?\",\"how much money?\",\"is\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l2e1\",\"type\":\"bucket\",\"prompt\":\"¿Con is o con are?\",\"categories\":[\"… is\",\"… are\"],\"items\":[{\"text\":\"The news\",\"bucket\":0},{\"text\":\"People\",\"bucket\":1},{\"text\":\"The information\",\"bucket\":0},{\"text\":\"My hair\",\"bucket\":0},{\"text\":\"The vegetables\",\"bucket\":1},{\"text\":\"The furniture\",\"bucket\":0},{\"text\":\"The eggs\",\"bucket\":1},{\"text\":\"My luggage\",\"bucket\":0}],\"itemIds\":[\"ena2m5uncountablegroup\",\"ena2m5thenewsisgood\",\"ena2m5peoplearefriendly\",\"ena2m5myhairisverylong\",\"ena2m5vegetables\"],\"tip\":\"De la lista de diez, solo people se va a la columna de la derecha. Las otras nueve, todas is. Con eso ya tienes el 90 % resuelto.\"},{\"id\":\"ena2m5l2e2\",\"type\":\"errorfix\",\"prompt\":\"El error nº 1 del hispanohablante — corrígelo\",\"wrong\":\"People is very friendly in London.\",\"answers\":[\"People are very friendly in London.\"],\"why\":\"people no es «la gente» en singular: es el plural de person. Uno es a person, dos son two people. Y si el sujeto es plural, el verbo también: people ARE. Este fallo se oye en alumnos de nivel avanzado, así que mátalo hoy.\",\"translation\":\"La gente es muy maja en Londres.\",\"itemIds\":[\"ena2m5peoplearefriendly\",\"enpeople\"]},{\"id\":\"ena2m5l2e3\",\"type\":\"errorfix\",\"prompt\":\"Otro de la lista\",\"wrong\":\"I need some advices about the exam.\",\"answers\":[\"I need some advice about the exam.\"],\"why\":\"advice no tiene plural. «Dos consejos» es two pieces of advice, y «un consejo» es a piece of advice. La palabra advice nunca lleva -s ni «an» delante.\",\"translation\":\"Necesito que me aconsejen sobre el examen.\",\"itemIds\":[\"ena2m5somegoodadvice\"]},{\"id\":\"ena2m5l2e4\",\"type\":\"errorfix\",\"prompt\":\"Y el del pelo, que da grima\",\"wrong\":\"My hairs are very long and dark.\",\"answers\":[\"My hair is very long and dark.\"],\"why\":\"hair es todo el pelo a la vez, así que va en singular. En plural, hairs son pelos sueltos: los que encuentras en la sopa. Es el mismo reparto que people o information: el español los cuenta y el inglés no.\",\"translation\":\"Tengo el pelo muy largo y moreno.\",\"itemIds\":[\"ena2m5myhairisverylong\"]},{\"id\":\"ena2m5l2e5\",\"type\":\"mc\",\"prompt\":\"La que acaba en -s y no es plural\",\"question\":\"«Las noticias son buenas»\",\"options\":[\"The news is good.\",\"The news are good.\",\"The new is good.\"],\"answer\":0,\"whyWrong\":[null,\"news acaba en -s pero es singular: is\",\"«new» es el adjetivo «nuevo», no la noticia\"],\"itemIds\":[\"ena2m5thenewsisgood\"],\"tip\":\"El truco: news se comporta como information. Si dudas, cámbiala mentalmente por information y verás que nadie diría «the information are».\"},{\"id\":\"ena2m5l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa con el verbo\",\"text\":\"There ___ a lot of people in the café today.\",\"answers\":[\"are\"],\"translation\":\"Hay mucha gente hoy en el café.\",\"hints\":[\"people cuenta como plural\",\"There a…\"],\"itemIds\":[\"ena2m5peoplearefriendly\",\"ena2m1therewere\",\"enpeople\"],\"tip\":\"Es la misma trampa de «There were a lot of people» del módulo 1. En español «había» y «hay» no se mueven; en inglés, con people, siempre plural.\"},{\"id\":\"ena2m5l2e7\",\"type\":\"cloze\",\"prompt\":\"Completa — ojo al plural que no existe\",\"text\":\"I have a lot of ___ tonight, so I can't come.\",\"answers\":[\"homework\"],\"translation\":\"Tengo muchos deberes esta noche, así que no puedo ir.\",\"hints\":[\"Es una de las diez de la lista\",\"home…\"],\"itemIds\":[\"enhomework\",\"ena2m5uncountablegroup\"]},{\"id\":\"ena2m5l2e8\",\"type\":\"match\",\"prompt\":\"Empareja cada incontable con su equivalente español en plural\",\"pairs\":[{\"target\":\"information\",\"source\":\"las informaciones, los datos\"},{\"target\":\"advice\",\"source\":\"los consejos\"},{\"target\":\"furniture\",\"source\":\"los muebles\"},{\"target\":\"luggage\",\"source\":\"las maletas, el equipaje\"}],\"itemIds\":[\"ena2m5uncountablegroup\",\"ena2m5somegoodadvice\"],\"tip\":\"Míralo así: el español pluraliza las cuatro y el inglés ninguna. Esa asimetría es toda la lección; el resto es repetirla hasta que salga sola.\"},{\"id\":\"ena2m5l2e9\",\"type\":\"gapbank\",\"prompt\":\"El primer mes de Valeria en Londres: rellena con la ficha que toca\",\"text\":\"London is expensive, but ___ are very friendly here. Amy gave me some good ___ about the buses, and now I never miss one. I haven't got much ___ , so I always walk to work.\",\"answers\":[\"people\",\"advice\",\"money\"],\"bank\":[\"people\",\"advice\",\"money\",\"persons\",\"informations\",\"luggage\"],\"translation\":\"Londres es cara, pero la gente de aquí es muy maja. Amy me dio unos buenos consejos sobre los autobuses y ya no pierdo ninguno. No tengo mucho dinero, así que voy siempre andando al trabajo.\",\"itemIds\":[\"ena2m5peoplearefriendly\",\"ena2m5somegoodadvice\",\"ena2m5money\",\"ena2m1missedthebus\"],\"tip\":\"Las tres fichas que sobran son las tres que escribiría un hispanohablante sin pensar: persons, informations y una palabra suelta de la lista. Ninguna cabe.\"},{\"id\":\"ena2m5l2e10\",\"type\":\"listen\",\"prompt\":\"Dictado — dos de la lista en una frase\",\"text\":\"The news is good and people are happy.\",\"translation\":\"Las noticias son buenas y la gente está contenta.\",\"hints\":[\"news → singular · people → plural\",\"The news i… good and people a… happy.\"],\"itemIds\":[\"ena2m5thenewsisgood\",\"ena2m5peoplearefriendly\"],\"tip\":\"Una frase, dos incontables y dos verbos distintos. Si te sale al oído, la lista ya está entrando.\"},{\"id\":\"ena2m5l2e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"La gente es muy maja aquí y me dieron unos buenos consejos.\",\"answers\":[\"People are very friendly here and they gave me some good advice.\",\"People are very friendly here and gave me some good advice.\",\"People are very friendly here and they gave me good advice.\"],\"hint\":\"dos de las diez palabras de la lista, y ninguna lleva -s\",\"itemIds\":[\"ena2m5peoplearefriendly\",\"ena2m5somegoodadvice\"]},{\"id\":\"ena2m5l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No tengo mucho dinero, pero la gente aquí es muy maja.\",\"answers\":[\"I don't have much money, but people are very friendly here.\",\"I haven't got much money, but people are very friendly here.\",\"I don't have much money, but people here are very friendly.\"],\"hints\":[\"money → much · people → are\",\"I don't have m… money, but people a… very friendly here.\"],\"itemIds\":[\"ena2m5money\",\"ena2m5peoplearefriendly\"],\"tip\":\"Ahí están las dos mitades de la lección: la palabra que no se cuenta pide much, y la única plural de la lista pide are.\"}]}],\"resources\":[{\"label\":\"British Council — Countable and uncountable nouns\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/countable-uncountable-nouns\",\"note\":\"Baja hasta la lista de incontables «raros» y compárala con las diez de esta lección. Lo que te sorprenda, apúntalo: la sorpresa es exactamente el error que ibas a cometer.\"},{\"label\":\"BBC Learning English\",\"url\":\"https://www.bbc.co.uk/learningenglish\",\"note\":\"Escucha cualquier boletín corto y cuenta cuántas veces dicen «the news is». Oírlo tres veces vale más que leerlo diez.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
