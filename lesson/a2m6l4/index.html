},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m6l4e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la condición\",\"question\":\"„Wenn es regnet, bleibe ich zu Hause“\",\"options\":[\"Si llueve, me quedo en casa\",\"Cuando llovió, me quedé en casa\",\"Llueve porque me quedo en casa\"],\"answer\":0,\"whyWrong\":[null,\"Eso está en pasado — wenn + presente habla de condiciones y rutinas de ahora\",\"Eso sería un weil al revés — wenn no da razones, pone condiciones\"],\"itemIds\":[\"a2m6wennesregnet\",\"a2m6wenn\",\"esregnet\"]},{\"id\":\"a2m6l4e2\",\"type\":\"cloze\",\"prompt\":\"Completa el conector\",\"text\":\"___ es regnet, bleibe ich zu Hause. (si)\",\"answers\":[\"Wenn\"],\"translation\":\"Si llueve, me quedo en casa.\",\"hints\":[\"Abre la frase, con mayúscula\",\"W-e-n-n, con doble n\"],\"itemIds\":[\"a2m6wenn\",\"a2m6wennesregnet\"],\"tip\":\"wenn con doble n = si/cuando. No lo confundas con wann (¿cuándo?, solo pregunta) — pareja traicionera del examen.\"},{\"id\":\"a2m6l4e3\",\"type\":\"mc\",\"prompt\":\"La inversión tras la coma\",\"question\":\"Wenn ich Zeit habe, ___\",\"options\":[\"ich koche\",\"koche ich\"],\"answer\":1,\"whyWrong\":[\"Tras la coma el verbo va PRIMERO: la parte con wenn ya ocupó la posición 1 de la oración — el verbo principal debe quedar 2º, pegado a la coma\",null],\"itemIds\":[\"a2m6wennichzeithabe\",\"a2m6wenn\",\"zeit\",\"kochen\"],\"tip\":\"Es tu inversión del A1 («Am Montag arbeite ich») con la subordinada entera haciendo de «Am Montag».\"},{\"id\":\"a2m6l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡ojo con la ü!\",\"text\":\"Wenn ich ___ bin, gehe ich ins Bett. (cansado)\",\"answers\":[\"müde\"],\"translation\":\"Cuando estoy cansado, me voy a la cama.\",\"hints\":[\"Tu adjetivo del A1, dentro de la subordinada\",\"m-ü-d-e, con ü\"],\"itemIds\":[\"a2m6wenn\",\"muede\",\"bett\"],\"strictUmlaut\":true,\"tip\":\"müde conserva su ü también dentro de la subordinada — «mude» es el despiste que el corrector no perdona.\"},{\"id\":\"a2m6l4e5\",\"type\":\"build\",\"prompt\":\"Construye la frase del mal tiempo\",\"target\":\"Wenn es regnet, bleibe ich zu Hause\",\"translation\":\"Si llueve, me quedo en casa\",\"altTargets\":[\"Ich bleibe zu Hause, wenn es regnet\"],\"distractors\":[\"weil\",\"bleibt\"],\"itemIds\":[\"a2m6wennesregnet\",\"a2m6wenn\",\"esregnet\",\"bleiben\"],\"tip\":\"regnet cierra la subordinada, bleibe abre la principal: verbo, coma, verbo — la mano dada.\"},{\"id\":\"a2m6l4e6\",\"type\":\"transform\",\"prompt\":\"Transforma: une las dos frases\",\"source\":\"Es regnet. Ich bleibe zu Hause.\",\"instruction\":\"Únelas en una sola frase: empieza con Wenn\",\"answers\":[\"Wenn es regnet, bleibe ich zu Hause\",\"Wenn es regnet, bleibe ich zu Hause.\"],\"translation\":\"Si llueve, me quedo en casa.\",\"hints\":[\"Wenn + la condición con el verbo al final\",\"Tras la coma: bleibe ich — verbo primero\"],\"itemIds\":[\"a2m6wenn\",\"a2m6wennesregnet\",\"esregnet\",\"bleiben\"],\"tip\":\"Dos movimientos en uno: regnet a la cola de su frase, y bleibe adelantado a la coma. El tándem completo de wenn.\"},{\"id\":\"a2m6l4e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la rutina\",\"text\":\"Wenn ich Zeit habe, koche ich\",\"translation\":\"Cuando tengo tiempo, cocino\",\"hints\":[\"Cuatro palabras, coma, dos palabras\",\"Wenn ich Zeit ...\"],\"itemIds\":[\"a2m6wennichzeithabe\",\"a2m6wenn\",\"zeit\",\"kochen\"]},{\"id\":\"a2m6l4e8\",\"type\":\"mc\",\"prompt\":\"Elige el conector justo\",\"question\":\"«SI llueve, me quedo en casa» — ¿qué conector?\",\"options\":[\"wenn\",\"weil\",\"dass\"],\"answer\":0,\"whyWrong\":[null,\"weil da la razón (porque...) — aquí no hay razón sino condición: si...\",\"dass abre opiniones tras denken/glauben — aquí nadie opina\"],\"itemIds\":[\"a2m6wenn\",\"a2m6weil\",\"a2m6dass\"],\"tip\":\"Los tres mandan el verbo al final — se distinguen por lo que hacen: weil razona, dass opina, wenn condiciona.\"},{\"id\":\"a2m6l4e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Si llueve, me quedo en casa\",\"answers\":[\"Wenn es regnet, bleibe ich zu Hause\",\"Ich bleibe zu Hause, wenn es regnet\"],\"hints\":[\"Wenn abre, la coma parte, el verbo principal pega la vuelta\",\"Wenn es regnet, bleibe ...\"],\"itemIds\":[\"a2m6wennesregnet\",\"a2m6wenn\",\"esregnet\",\"bleiben\"],\"tip\":\"Si escribiste «bleibe ich» y no «ich bleibe», la inversión ya es tuya — el detalle que separa el A1 del A2.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «wenn»-Sätze (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Condiciones y rutinas con wenn en diálogos — fíjate en el verbo pegado a la coma.\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «wenn»: el Goethe machaca la inversión tras la coma en sus ejercicios A2.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"hre
