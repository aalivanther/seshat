\u003e\u003cb\u003eEl protocolo, en cuatro pasos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eNo pares.\u003c/b\u003e Llega al final del párrafo. Nueve de cada diez veces, la frase siguiente te la explica.\u003cbr/\u003e2. \u003cb\u003eMira qué clase de palabra es.\u003c/b\u003e ¿Lleva \u003ci\u003ea\u003c/i\u003e delante? Sustantivo. ¿Acaba en \u003ci\u003e-ed\u003c/i\u003e? Verbo. Con eso ya puedes seguir aunque no sepas cuál es.\u003cbr/\u003e3. \u003cb\u003e¿Vuelve a aparecer?\u003c/b\u003e Si sale tres veces, es importante: búscala. Si sale una vez y nunca más, \u003cb\u003eno importaba\u003c/b\u003e.\u003cbr/\u003e4. \u003cb\u003eSi te la dicen a la cara, pregunta.\u003c/b\u003e \u003ci\u003e«Sorry, what does that mean?»\u003c/i\u003e no ha ofendido a nadie en la historia del idioma.\u003cbr/\u003e\u003cbr/\u003eLas palabras subrayadas del texto están glosadas: tócalas y suenan. Las que no lo están, dedúcelas — eso es \u003cb\u003ework it out\u003c/b\u003e, y es la habilidad del nivel.\u003cbr/\u003e\u003cbr/\u003eOjo a un verbo del texto que te va a servir para siempre: \u003cb\u003emake sense of\u003c/b\u003e + algo = «sacarle sentido a algo». Va con \u003ci\u003eof\u003c/i\u003e pegado, como \u003ci\u003edepend on\u003c/i\u003e o \u003ci\u003eworry about\u003c/i\u003e. Y su primo \u003cb\u003ework out\u003c/b\u003e es separable: \u003ci\u003eI worked \u003cb\u003eit\u003c/b\u003e out\u003c/i\u003e, nunca \u003ci\u003eI worked out it\u003c/i\u003e."])</script><script>self.__next_f.push([1,"18:Tb09,"])</script><script>self.__next_f.push([1,"Nisha Menon had been teaching English for six years when she moved from Kochi to Newcastle, two hours up the coast from Sydney. On her second morning a man in the queue at the bakery said something to her that she wrote down that evening, because she had understood almost none of it: \"Ow ya goin? Reckon it'll be a warm arvo, but.\"\u003cbr/\u003e\u003cbr/\u003e\"I got 'warm',\" she says. \"Six years teaching the language, and I got one word.\"\u003cbr/\u003e\u003cbr/\u003eNothing in that sentence is difficult English. [[arvo|tarde — «afternoon», en Australia]] is afternoon. \"How are you going?\" is how are you. And the \"but\" at the end is not a mistake: in this part of the country it can close a sentence instead of opening one, more or less the way \"though\" does elsewhere.\u003cbr/\u003e\u003cbr/\u003eWhat had happened to Nisha happens to almost every teacher who arrives here. She had learned the language. She had not learned the [[habits|costumbres]] of the people who speak it.\u003cbr/\u003e\u003cbr/\u003eAustralians shorten words, and they shorten them the same way almost every time. Breakfast becomes brekkie, afternoon becomes arvo, a service station becomes a servo, the University of Newcastle becomes Newy. Researchers at that university counted more than four thousand of these forms in Australian newspapers alone. \"It isn't laziness,\" says Dr Alison Reid, who [[runs|dirige]] the study. \"It's a social signal. If I shorten a word with you, I'm saying we're not strangers. Somebody who never shortens anything sounds like they're keeping their distance.\"\u003cbr/\u003e\u003cbr/\u003eThat last point matters more than the vocabulary itself. Nisha's students are adults, most of them new to the country, and they often tell her the same thing: that they can pass an exam and still feel outside the conversation. \"They know the word 'afternoon',\" she says. \"What they don't know is that saying the whole word, all day, every day, marks you out.\"\u003cbr/\u003e\u003cbr/\u003eShe now spends the first ten minutes of every class on what she calls \"the words nobody teaches\". Her rule is short: understand them, use two or three of them, and don't try to use them all. \"A student who says 'no worries' sounds friendly,\" she says. \"A student who says 'g'day mate, howya goin' sounds like an advertisement.\"\u003cbr/\u003e\u003cbr/\u003eAnd she is careful about one thing. She does not correct the way her own students speak. Half of them spoke English at home before they ever came here, in Manila, in Lagos, in Mumbai, in ways that are perfectly correct and simply not Australian. \"There are more people speaking English in India than in Britain and Australia put together,\" she says. \"So who exactly is the [[odd one out|la excepción, el raro]] here?\"\u003cbr/\u003e\u003cbr/\u003eThe man at the bakery, by the way, is still there. Nisha says good morning to him in whole words and he answers in half ones, and in two years neither of them has ever had a problem."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l6\",\"phaseId\":\"enb1m7\",\"title\":\"Half a word is enough\",\"subtitle\":\"Un texto australiano entero — y qué hacer con las palabras que no vienen en tu libro\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del texto\",\"itemIds\":[\"enb1m7shorteneverything\",\"enb1m7nickname\",\"enb1m7nativespeaker\",\"enb1m7makesenseof\",\"enb1m7workitout\",\"enb1m7pickup\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto lleno de palabras que no te enseñaron\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Toca las palabras subrayadas si te bloquean; las demás, dedúcelas.\",\"title\":\"Half a word is enough\",\"source\":\"From a community paper in Newcastle, New South Wales (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m7l6e1q1\",\"q\":\"Which word did Nisha understand? (Máximo 3 palabras)\",\"accepted\":[\"warm\",\"the word warm\",\"only warm\"],\"why\":\"«I got 'warm',» she says. Es el único dato literal de todo el primer bloque, y basta con la palabra suelta: copiar la frase entera resta.\"},{\"id\":\"enb1m7l6e1q2\",\"q\":\"What does Dr Reid suggest about somebody who never shortens a word?\",\"options\":[\"That they may seem distant without meaning to.\",\"That they have simply not studied enough Australian English.\",\"That they are always easier to understand.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice así. Hay que juntar dos frases suyas: «It's a social signal» y «sounds like they're keeping their distance». El verbo es «sounds», o sea, cómo se percibe — no dice que la persona quiera ser distante.\"},{\"id\":\"enb1m7l6e1q3\",\"q\":\"Why does Nisha tell her students not to use all the short forms?\",\"options\":[\"Because using too many sounds false instead of friendly.\",\"Because most of those words are considered rude.\",\"Because they are not accepted in the exam.\"],\"answer\":0,\"inference\":true,\"why\":\"Se deduce del contraste que ella misma monta: «no worries» suena amistoso, y la ristra entera «suena a anuncio». Nunca dice que sean groseras ni habla del examen ahí.\"},{\"id\":\"enb1m7l6e1q4\",\"q\":\"How many of these short forms did the study count in newspapers? (Máximo 3 palabras)\",\"accepted\":[\"more than four thousand\",\"four thousand\",\"over four thousand\",\"more than 4000\",\"4000\"],\"why\":\"«counted more than four thousand of these forms in Australian newspapers alone». En este formato vale la cifra en letra o en número.\"},{\"id\":\"enb1m7l6e1q5\",\"q\":\"Why does the article end with the man at the bakery?\",\"options\":[\"To show that the two ways of speaking get along without a problem.\",\"To show that Nisha has finally learned to speak like an Australian.\",\"To show that the man had been rude to her at the beginning.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que leer el final contra el principio: ella sigue hablando en palabras enteras, él en medias, y «neither of them has ever had a problem». Si hubiera aprendido a hablar como él, la frase no tendría gracia.\"}],\"itemIds\":[\"enb1m7shorteneverything\",\"enb1m7nativespeaker\",\"enb1m7variety\",\"enb1m7expression\",\"enb1m7accent\"],\"tip\":\"Cuenta cuántas palabras del texto no sabías y cuántas preguntas has fallado por eso. Casi seguro: bastantes de las primeras, ninguna de las segundas. De eso iba el protocolo.\"},{\"id\":\"enb1m7l6e2\",\"type\":\"mc\",\"prompt\":\"Vocabulario del texto\",\"question\":\"«Australians shorten words» significa…\",\"options\":[\"Los australianos acortan las palabras\",\"Los australianos hablan en voz baja\",\"Los australianos hablan poco\"],\"answer\":0,\"whyWrong\":[null,\"«short» es corto de longitud, no de volumen. El volumen sería «quietly».\",\"Eso sería «they don't talk much». Aquí lo corto son las palabras, no la conversación.\"],\"itemIds\":[\"enb1m7shorteneverything\"],\"tip\":\"«shorten» = short + -en: convertir en corto. El sufijo -en fabrica verbos a partir de adjetivos: shorten, widen, darken, strengthen.\"},{\"id\":\"enb1m7l6e3\",\"type\":\"mc\",\"prompt\":\"La idea que sostiene el texto\",\"question\":\"Según Dr Reid, ¿por qué acortan las palabras?\",\"options\":[\"Porque es una señal social de cercanía\",\"Porque así se habla más deprisa\",\"Porque las palabras largas les parecen mal educadas\"],\"answer\":0,\"whyWrong\":[null,\"La velocidad no aparece en ninguna parte. Ella lo llama expresamente «a social signal».\",\"Nadie dice que sean mal educadas: dice que quien nunca acorta «sounds like they're keeping their distance», que es otra cosa.\"],\"itemIds\":[\"enb1m7shorteneverything\",\"enb1m7nickname\"],\"tip\":\"«brekkie», «arvo», «servo» funcionan como apodos de las palabras. Y un apodo, en cualquier idioma, dice sobre todo una cosa: que hay confianza.\"},{\"id\":\"enb1m7l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición pegada al verbo\",\"text\":\"The first week I couldn't make sense ___ anything anybody said to me.\",\"answers\":[\"of\"],\"translation\":\"La primera semana no conseguía entender nada de lo que me decían.\",\"hints\":[\"Va pegada a «make sense», siempre la misma\",\"make sense ...\"],\"itemIds\":[\"enb1m7makesenseof\"],\"tip\":\"«make sense of» es una unidad: entenderle el sentido a algo. Sin el «of» la frase cambia — «it makes sense» (sin of) significa «tiene lógica», que es otra cosa.\"},{\"id\":\"enb1m7l6e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I worked out it from the context.\",\"answers\":[\"I worked it out from the context.\"],\"why\":\"«work out» es un verbo separable, y cuando el complemento es un pronombre corto («it», «them», «him») el pronombre va SIEMPRE en medio: worked it out. Con un sustantivo largo puede ir detrás: «I worked out the meaning».\",\"translation\":\"Lo deduje por el contexto.\",\"itemIds\":[\"enb1m7workitout\"]},{\"id\":\"enb1m7l6e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «sense» ni «make»\",\"source\":\"I couldn't make sense of it.\",\"forbid\":[\"sense\",\"make\"],\"answers\":[\"I couldn't understand it\",\"I couldn't work it out\",\"I had no idea what it meant\"],\"translation\":\"No conseguía entenderlo.\",\"hints\":[\"El verbo separable de la lección, con el pronombre en medio\",\"I couldn't w... it o...\"],\"itemIds\":[\"enb1m7makesenseof\",\"enb1m7workitout\"],\"tip\":\"Tener dos o tres maneras de decir «no lo entiendo» es lo que te salva en el oral: si la primera no sale, sale la segunda y nadie nota el hueco.\"},{\"id\":\"enb1m7l6e7\",\"type\":\"gapbank\",\"prompt\":\"El protocolo de lectura, en cuatro huecos\",\"text\":\"When you meet a word you don't know, don't stop. Read to the end of the paragraph and try to ___ it out from what comes next. If it comes back three times, look it up; if it never comes back, it didn't ___ . And if somebody says it to your face, just ask what it ___ — nobody has ever been offended by that ___ .\",\"answers\":[\"work\",\"matter\",\"means\",\"question\"],\"bank\":[\"work\",\"matter\",\"means\",\"question\",\"sound\",\"translate\",\"spell\"],\"translation\":\"Cuando te encuentres una palabra que no sabes, no pares. Lee hasta el final del párrafo e intenta deducirla por lo que viene después. Si vuelve a aparecer tres veces, búscala; si no vuelve nunca, no importaba. Y si te la dicen a la cara, pregunta qué significa: esa pregunta no ha ofendido a nadie jamás.\",\"itemIds\":[\"enb1m7workitout\",\"enb1m7whatdoesthatmean\"],\"tip\":\"Ese es el protocolo entero y cabe en cuatro líneas. Lo difícil no es saberlo: es no parar en la primera palabra rara.\"},{\"id\":\"enb1m7l6e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Traduce al español\",\"source\":\"I picked up a few words without ever studying them.\",\"answers\":[\"Se me pegaron unas cuantas palabras sin estudiarlas nunca\",\"Cogí unas cuantas palabras sin haberlas estudiado nunca\",\"Aprendí unas cuantas palabras sin estudiarlas nunca\"],\"hint\":\"El verbo lleva partícula y significa aprender sin querer\",\"itemIds\":[\"enb1m7pickup\"],\"tip\":\"«pick up» aplicado a un idioma es aprender por contacto, no por estudio. Es lo que te ha pasado con la mitad de tu inglés de la calle y no te habías dado cuenta.\"},{\"id\":\"enb1m7l6e9\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"No es hablante nativo, pero lo entiende todo.\",\"answers\":[\"He isn't a native speaker, but he understands everything\",\"She isn't a native speaker, but she understands everything\",\"He is not a native speaker, but he understands everything\"],\"hints\":[\"El sustantivo lleva artículo en inglés\",\"He isn't a n... s..., but ...\"],\"itemIds\":[\"enb1m7nativespeaker\"],\"tip\":\"En inglés las profesiones y las categorías llevan artículo: «a nurse», «a student», «a native speaker». El español lo quita y ese es un despiste caro en el Writing.\"},{\"id\":\"enb1m7l6e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la frase de emergencia del módulo\",\"text\":\"Sorry, I couldn't make sense of that. Could you say it again?\",\"phonetic\":\"SÓ-ri, ai KÚ-dent meik sens ov dat. kud yu sei it a-GUÉN\",\"translation\":\"Perdona, no te he pillado. ¿Puedes repetirlo?\",\"itemIds\":[\"enb1m7makesenseof\",\"encanyousaythatagain\"],\"tip\":\"Fíjate en «again»: aquí se dice a-GUÉN, no a-GUÉIN. Las dos existen, pero la primera es la británica de todos los días.\"},{\"id\":\"enb1m7l6e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"Australians shorten everything, and they do it the same way every time.\",\"translation\":\"Los australianos lo acortan todo, y lo hacen siempre igual.\",\"hints\":[\"Empieza por el gentilicio, con mayúscula\",\"Australians s... everything, and ...\"],\"itemIds\":[\"enb1m7shorteneverything\"],\"tip\":\"Los gentilicios van con mayúscula en inglés SIEMPRE: Australians, Spanish, Colombian. Es una falta de ortografía como cualquier otra y se ve en cada corrección.\"},{\"id\":\"enb1m7l6e12\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas, y toma notas.\",\"notepad\":true,\"audio\":\"My first job here was in a warehouse in Perth, and on day one the foreman said: see you this arvo, and bring your own brekkie, the servo up the road is shut. I nodded. I had understood the word road. By the end of that month I could follow him, and I'd never opened a book — you just pick it up, because you hear the same twenty things over and over. What I never picked up was the confidence to ask. That took a year, and it was the thing that would have saved me the first eleven months.\",\"question\":\"¿Qué dice que le costó más?\",\"options\":[\"Atreverse a preguntar cuando no entendía\",\"Aprender las palabras cortas australianas\",\"Encontrar un trabajo al llegar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso dice que lo cogió en un mes y sin libros: «you just pick it up».\",\"El trabajo lo tenía desde el primer día. No es de lo que habla.\"],\"itemIds\":[\"enb1m7pickup\",\"enb1m7shorteneverything\"],\"tip\":\"Fíjate en la última frase: «the thing that would have saved me the first eleven months». Esa es la moraleja del audio, y en el examen la moraleja casi siempre está en la última frase.\"},{\"id\":\"enb1m7l6e13\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre los verbos con partícula que ya tienes del módulo 1\",\"pairs\":[{\"target\":\"settle in\",\"source\":\"adaptarse a un sitio nuevo\"},{\"target\":\"put up with\",\"source\":\"aguantar\"},{\"target\":\"get used to\",\"source\":\"acostumbrarse a\"},{\"target\":\"get on with\",\"source\":\"llevarse bien con\"},{\"target\":\"look forward to\",\"source\":\"tener ganas de\"}],\"targetSeconds\":25,\"itemIds\":[\"enb1m1settlein\",\"enb1m1putupwith\",\"enb1m1getusedto\",\"enb1m1getonwith\",\"enb1m1lookforwardto\"],\"tip\":\"Estos cinco son de bloque: verbo y preposición viajan juntos y no se piensan por separado. Sacarlos rápido es exactamente lo que entrena este cronómetro.\"}]}],\"resources\":[{\"label\":\"IDEA — grabaciones de Australia\",\"url\":\"https://www.dialectsarchive.com/\",\"note\":\"Entra en Australia y escucha dos hablantes distintos leyendo el mismo texto. No intentes entenderlo todo: solo acostumbra el oído diez minutos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
