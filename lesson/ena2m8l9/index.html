003ewhy don't you\u003c/i\u003e.\u003cbr/\u003e· [[You should see a doctor.|Deberías ir al médico.]]\u003cbr/\u003e· [[You shouldn't go to work.|No deberías ir a trabajar.]]\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se comporta:\u003c/b\u003e es un modal, como \u003ci\u003emust\u003c/i\u003e y \u003ci\u003ecan\u003c/i\u003e. Así que:\u003cbr/\u003e· detrás va el \u003cb\u003everbo desnudo\u003c/b\u003e, sin to — \u003ci\u003eYou should rest\u003c/i\u003e, nunca \u003ci\u003eYou should to rest\u003c/i\u003e;\u003cbr/\u003e· no cambia con la persona — \u003ci\u003ehe should\u003c/i\u003e, no «he shoulds»;\u003cbr/\u003e· el negativo es \u003cb\u003eshouldn't\u003c/b\u003e, y la l no suena: «shud», «SHU-dent».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY lo que sigue siendo tuyo hoy:\u003c/b\u003e cuando quieras dar un consejo, tira de las cuatro del módulo. Son igual de correctas, las usa un nativo todo el rato, y ninguna te va a salir mal por un \u003ci\u003eto\u003c/i\u003e de más:\u003cbr/\u003e\u003ci\u003eYou need to see a doctor.\u003c/i\u003e · \u003ci\u003eWhy don't you see a doctor?\u003c/i\u003e · \u003ci\u003eGo and see a doctor.\u003c/i\u003e · \u003ci\u003eYou have to see a doctor.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l9\",\"phaseId\":\"ena2m8\",\"title\":\"How are you feeling?\",\"subtitle\":\"La consulta entera, de la puerta a la despedida — y una ventana al B1\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preguntar por alguien y despedirse\",\"itemIds\":[\"ena2m8howareyoufeeling\",\"ena2m8imuchbetterthanks\",\"ena2m8getwellsoon\",\"ena2m8shouldfrontier\",\"ena2m8itsnothingserious\",\"enhowareyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«How are you?» y «How are you feeling?» no son la misma pregunta\",\"body\":\"Del A1 traes [[How are you?|¿Qué tal?]], que en inglés es \u003cb\u003eun saludo\u003c/b\u003e: se contesta «Fine, thanks» aunque tengas cuarenta de fiebre, y nadie espera un informe médico.\u003cbr/\u003e\u003cbr/\u003eCuando alguien sabe que estás malo, la pregunta cambia: [[How are you feeling?|¿Cómo te encuentras?]] Esta sí pregunta de verdad, y se contesta de verdad:\u003cbr/\u003e· [[I'm much better, thanks.|Estoy mucho mejor, gracias.]]\u003cbr/\u003e· \u003ci\u003eA bit better.\u003c/i\u003e · \u003ci\u003eNot great, to be honest.\u003c/i\u003e · \u003ci\u003eThe same.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eOjo con \u003cb\u003emuch better\u003c/b\u003e: es el «mucho mejor» del módulo 4, y va con \u003cb\u003emuch\u003c/b\u003e, nunca con \u003ci\u003emore\u003c/i\u003e. \u003ci\u003eMore better\u003c/i\u003e no existe en ningún inglés.\u003cbr/\u003e\u003cbr/\u003eY para despedirte de quien está malo, la fórmula fija: [[Get well soon!|¡Que te mejores!]] Se dice, se escribe en las tarjetas y se pone al final de los mensajes. Un imperativo más que no es ninguna orden.\",\"table\":[[\"situación\",\"pregunta\",\"respuesta típica\"],[\"te cruzas con alguien\",\"How are you?\",\"Fine, thanks. And you?\"],[\"sabes que está malo\",\"How are you feeling?\",\"I'm much better, thanks.\"],[\"te despides de alguien malo\",\"Get well soon!\",\"Thanks!\"],[\"lo que NO se dice\",\"I'm more better.\",\"much better, siempre\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — las cuatro fórmulas del consejo\",\"pairs\":[{\"target\":\"You must rest.\",\"source\":\"orden: no hay elección\"},{\"target\":\"You have to rest.\",\"source\":\"obligación de la situación\"},{\"target\":\"You need to rest.\",\"source\":\"consejo firme\"},{\"target\":\"Why don't you rest?\",\"source\":\"sugerencia suave\"},{\"target\":\"Go to bed and rest.\",\"source\":\"consejo en imperativo\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m8advicescale\",\"ena2m8youneedtoseeadoctor\",\"ena2m8whydontyougohome\",\"ena2m8gotobedandrest\"],\"tip\":\"El cronómetro solo premia. Si las cinco salen sin pensar, tienes el consejo del A2 entero — y sin una sola palabra prestada del B1.\"},{\"id\":\"ena2m8l9e2\",\"type\":\"mc\",\"prompt\":\"Amy sabe que llevas dos días con fiebre y te llama\",\"question\":\"¿Qué te pregunta?\",\"options\":[\"How are you feeling?\",\"How are you?\",\"How do you do?\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el saludo de siempre: se contesta «Fine, thanks» y ya\",\"How do you do? es de presentarse, y hoy suena antiguo\"],\"itemIds\":[\"ena2m8howareyoufeeling\",\"enhowareyou\"],\"tip\":\"La diferencia es real: How are you? es cortesía, How are you feeling? es interés. Confundirlas no rompe nada, pero contestar «fine, thanks» a la segunda deja la conversación coja.\"},{\"id\":\"ena2m8l9e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el comparativo\",\"wrong\":\"I'm more better today, thanks.\",\"answers\":[\"I'm much better today, thanks.\"],\"why\":\"better ya es el comparativo de good: no admite «more» delante. Y para reforzarlo se usa much, el mismo del módulo 4 (much cheaper, much bigger). «More better» no existe ni en inglés hablado.\",\"translation\":\"Hoy estoy mucho mejor, gracias.\",\"itemIds\":[\"ena2m8imuchbetterthanks\",\"ena2m4goodbetterbest\",\"ena2m4muchcheaper\"]},{\"id\":\"ena2m8l9e4\",\"type\":\"gapbank\",\"prompt\":\"La semana de Valeria, entera: rellena con la ficha que toca\",\"text\":\"Last week I ___ off my bike and cut my ___. It ___ a lot, so I went to the surgery. Dr Ellis gave me a ___ for some painkillers.\",\"answers\":[\"fell\",\"hand\",\"hurt\",\"prescription\"],\"bank\":[\"fell\",\"hand\",\"hurt\",\"prescription\",\"recipe\",\"broke\",\"bruise\"],\"translation\":\"La semana pasada me caí de la bici y me corté la mano. Me dolía mucho, así que fui al ambulatorio. La doctora Ellis me dio una receta para unos analgésicos.\",\"itemIds\":[\"ena2m8icutmyfinger\",\"ena2m8ihurtmyback\",\"ena2m8thesurgery\",\"ena2m8aprescription\",\"ena2m8somepainkillers\"],\"tip\":\"Dos fichas están ahí para cazarte: «recipe» (la receta de la tortilla) y «broke» (que pediría un hueso, no un corte). El resto lo decide el sentido.\"},{\"id\":\"ena2m8l9e5\",\"type\":\"order\",\"prompt\":\"Ordena el mensaje de voz que le dejas a Ben\",\"sentences\":[\"Hi Ben, it's Valeria. Sorry, I can't come tonight.\",\"I fell off my bike on Tuesday and I hurt my knee.\",\"I went to the surgery and the doctor said it was nothing serious.\",\"But I have to rest for a few days.\",\"How are you? See you next week!\"],\"translation\":\"Hola, Ben, soy Valeria. Perdona, no puedo ir esta noche. Me caí de la bici el martes y me hice daño en la rodilla. Fui al ambulatorio y la médica dijo que no era nada grave. Pero tengo que descansar unos días. ¿Qué tal tú? ¡Nos vemos la semana que viene!\",\"itemIds\":[\"ena2m8ihurtmyback\",\"ena2m8thesurgery\",\"ena2m8itsnothingserious\",\"ena2m8youhavetostayinbed\",\"ena2m5afewfriends\"],\"tip\":\"Ese es el orden de cualquier excusa en inglés: disculpa, qué pasó, qué dijo el médico, qué te toca ahora. Y al final, devolver la pregunta.\"},{\"id\":\"ena2m8l9e6\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"¿Cómo te encuentras? — Mucho mejor, gracias.\",\"answers\":[\"How are you feeling? I'm much better, thanks.\",\"How are you feeling? Much better, thanks.\",\"How are you feeling? I feel much better, thanks.\"],\"hint\":\"la pregunta del que sabe que estabas malo, y el refuerzo del módulo 4\",\"itemIds\":[\"ena2m8howareyoufeeling\",\"ena2m8imuchbetterthanks\"]},{\"id\":\"ena2m8l9e7\",\"type\":\"listen\",\"prompt\":\"Dictado — la despedida\",\"text\":\"Get well soon!\",\"translation\":\"¡Que te mejores!\",\"hints\":[\"Empieza por Get w…\",\"…soon!\"],\"itemIds\":[\"ena2m8getwellsoon\"],\"tip\":\"Tres palabras y un imperativo que nadie toma por una orden. Es lo que se escribe en las tarjetas y al final de los mensajes.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"FRONTERA con el B1: «should», que hoy solo hay que reconocer\",\"body\":\"$17\",\"table\":[[\"lo que oirás (B1)\",\"lo que dices tú (A2)\"],[\"You should see a doctor.\",\"You need to see a doctor.\"],[\"You should rest.\",\"Why don't you rest?\"],[\"You shouldn't go to work.\",\"Don't go to work.\"],[\"You should stay in bed.\",\"You have to stay in bed.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l9e8\",\"type\":\"mc\",\"prompt\":\"Frontera — solo reconocer\",\"question\":\"El médico te dice: «You shouldn't go to work this week». ¿Qué significa?\",\"options\":[\"No deberías ir a trabajar esta semana\",\"No puedes ir a trabajar esta semana\",\"No vas a ir a trabajar esta semana\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «You can't go to work»: una prohibición, más fuerte\",\"Eso sería el futuro; should es un consejo, no un plan\"],\"itemIds\":[\"ena2m8shouldfrontier\"],\"tip\":\"Con reconocerlo basta. Para decirlo tú, el módulo ya te ha dado cuatro maneras que no fallan.\"},{\"id\":\"ena2m8l9e9\",\"type\":\"bucket\",\"prompt\":\"¿Ya lo produces tú, o hoy solo hay que entenderlo?\",\"categories\":[\"lo digo yo, hoy mismo\",\"solo lo reconozco (llega en B1)\"],\"items\":[{\"text\":\"You need to see a doctor.\",\"bucket\":0},{\"text\":\"You should see a doctor.\",\"bucket\":1},{\"text\":\"Why don't you go home?\",\"bucket\":0},{\"text\":\"You shouldn't go to work.\",\"bucket\":1},{\"text\":\"Go to bed and rest.\",\"bucket\":0},{\"text\":\"You have to stay in bed.\",\"bucket\":0}],\"itemIds\":[\"ena2m8shouldfrontier\",\"ena2m8youneedtoseeadoctor\",\"ena2m8whydontyougohome\",\"ena2m8gotobedandrest\",\"ena2m8youhavetostayinbed\"],\"tip\":\"Las cuatro de la izquierda te cubren cualquier consejo que necesites dar en el examen. Las de la derecha las vas a oír mucho antes de tener que decirlas.\"},{\"id\":\"ena2m8l9e10\",\"type\":\"translate\",\"prompt\":\"Traduce al español — frontera, solo comprensión\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"You should stay at home and you shouldn't go to work tomorrow.\",\"answers\":[\"Deberías quedarte en casa y no deberías ir a trabajar mañana.\",\"Deberías quedarte en casa y mañana no deberías ir a trabajar.\",\"Tendrías que quedarte en casa y no tendrías que ir a trabajar mañana.\"],\"hint\":\"es un consejo, no una orden ni una prohibición\",\"itemIds\":[\"ena2m8shouldfrontier\"]},{\"id\":\"ena2m8l9e11\",\"type\":\"audiomc\",\"prompt\":\"La doctora Ellis se despide — 2 escuchas\",\"audio\":\"It's nothing serious, but you should rest. Take one tablet three times a day and drink lots of water. Come back on Friday if it gets worse. Get well soon!\",\"question\":\"¿Cuándo tiene que volver Valeria?\",\"options\":[\"El viernes, si va a peor\",\"Mañana por la mañana\",\"Dentro de tres días, en todo caso\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No dice nada de mañana\",\"Las tres veces al día son de las pastillas, no de las visitas\"],\"notepad\":true,\"itemIds\":[\"ena2m8itsnothingserious\",\"ena2m8takeonetabletthreetimesaday\",\"ena2m8itsgettingworse\",\"ena2m8getwellsoon\"],\"tip\":\"Ahí va un «should» suelto, y lo has entendido sin pensar. Esa es exactamente la frontera: entra por el oído mucho antes que por la boca.\"},{\"id\":\"ena2m8l9e12\",\"type\":\"monologue\",\"prompt\":\"La misión del módulo: cuenta tu síntoma y pide consejo, en voz alta\",\"topic\":\"Una consulta entera: qué te pasa, desde cuándo, qué te dijeron y qué consejo darías tú\",\"slides\":[{\"title\":\"1. Qué te pasa\",\"hint\":\"I don't feel very well. My back hurts and I have a temperature.\"},{\"title\":\"2. Desde cuándo y qué pasó\",\"hint\":\"It started two days ago. I fell off my bike and I hurt my knee.\"},{\"title\":\"3. Qué te dijeron en la consulta\",\"hint\":\"The doctor said it was nothing serious. I have to rest and take one tablet three times a day.\"},{\"title\":\"4. El consejo que le darías tú a alguien igual\",\"hint\":\"Why don't you go to the surgery? You need to rest. And don't go to work!\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He nombrado al menos dos partes del cuerpo, cada una con su posesivo (my back, my knee)\",\"He dicho el síntoma sin «I have pain in…» y sin «I feel myself»\",\"He dicho desde cuándo con un marcador del módulo 1 (two days ago, last week)\",\"He dado dos consejos con dos fórmulas distintas: Why don't you…? y You need to…\",\"No he usado «should» ni una vez — y aun así he aconsejado\"],\"model\":\"I don't feel very well. My throat hurts and I have a temperature. It started two days ago, on Monday. On Sunday I fell off my bike in the park and I cut my hand, but that's better now. Yesterday I phoned the surgery and I made an appointment with Dr Ellis. She said it was nothing serious: I have to rest for three days and take one tablet three times a day. So if you feel like this, why don't you phone the surgery? You need to rest, and don't go to work — it only gets worse.\",\"itemIds\":[\"ena2m8idontfeelwell\",\"ena2m8ihaveasorethroat\",\"ena2m8ihaveatemperature\",\"ena2m8idliketomakeanappointment\",\"ena2m8itsnothingserious\",\"ena2m8whydontyougohome\",\"ena2m8youneedtoseeadoctor\",\"ena2m8takeonetabletthreetimesaday\"],\"tip\":\"La misión de verdad es fuera de la app: cuéntale a alguien un síntoma real y pídele consejo en inglés, hasta que la conversación se resuelva. Lo que te llevas no es una nota: es la consulta resuelta. Grábate las dos pasadas y quédate con la segunda.\"},{\"id\":\"ena2m8l9e13\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — todo en tres frases\",\"question\":\"No me encuentro bien: me duele la garganta y tengo fiebre. ¿Por qué no vas al médico?\",\"answers\":[\"I don't feel well: my throat hurts and I have a temperature. Why don't you go to the doctor?\",\"I don't feel very well: my throat hurts and I have a temperature. Why don't you go to the doctor?\",\"I don't feel well: I have a sore throat and a temperature. Why don't you go to the doctor?\"],\"hints\":[\"Sin myself, la garganta como sujeto, y el consejo con el auxiliar delante\",\"I don't feel well: my throat h… and I have a t… Why d… you go to the doctor?\"],\"itemIds\":[\"ena2m8idontfeelwell\",\"ena2m8ihaveasorethroat\",\"ena2m8ihaveatemperature\",\"ena2m8whydontyougohome\"],\"tip\":\"Ahí está el módulo entero: el síntoma sin reflexivo, el dolor con la parte del cuerpo de sujeto y el consejo envuelto en pregunta. Con esto se resuelve una consulta médica en inglés de principio a fin.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m8-6\",\"book\":\"I'm much better, thanks.\",\"real\":\"I'm on the mend.\",\"meaning\":\"Ya voy mejorando\",\"when\":\"Con amigos, vecinos y compañeros, cuando ya has pasado lo peor pero no estás del todo. Muy común en Reino Unido, sobre todo entre gente mayor. En el examen, la del libro: «much better» es la que enseña el comparativo que puntúan.\",\"register\":\"amigos\",\"note\":\"mend es «arreglar, remendar»: estar «on the mend» es estar en proceso de arreglo, como un jersey en el costurero.\",\"sound\":\"áim on de MEND\",\"level\":\"a2\",\"itemId\":\"ena2m8imuchbetterthanks\"}}],\"resources\":[{\"label\":\"British Council — should (para cuando llegues al B1)\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/modals-advice\",\"note\":\"Léelo solo por encima, cinco minutos, y sin hacer los ejercicios: hoy basta con reconocer «should» al oírlo. Cuando llegues al B1 lo vas a producir sin esfuerzo.\"},{\"label\":\"British Council — A2 Speaking (health)\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca un diálogo de consulta médica y hazlo tú en voz alta las dos partes: primero la del paciente, luego la del médico. La segunda es la que nunca se practica y la que más se oye.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
