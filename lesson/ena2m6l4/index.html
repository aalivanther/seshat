ing to find the hotel.\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eI'm going to text you [[as soon as|en cuanto]] I get on the train.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas palabras que abren esa mitad\u003c/b\u003e son cuatro y con estas te sobra: \u003cb\u003ewhen\u003c/b\u003e (cuando), \u003cb\u003ebefore\u003c/b\u003e (antes de que), \u003cb\u003eafter\u003c/b\u003e (después de que), \u003cb\u003eas soon as\u003c/b\u003e (en cuanto).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa coma:\u003c/b\u003e si la subordinada va \u003cb\u003edelante\u003c/b\u003e, lleva coma detrás. Si va \u003cb\u003edetrás\u003c/b\u003e, no lleva nada. \u003ci\u003eWhen I get there, I'm going to call you.\u003c/i\u003e = \u003ci\u003eI'm going to call you when I get there.\u003c/i\u003e Las dos son correctas y significan lo mismo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l4\",\"phaseId\":\"ena2m6\",\"title\":\"When I get there, I'm going to call you\",\"subtitle\":\"«Cuando llegue»: el subjuntivo español no existe, y el futuro tampoco se repite\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Enganchar dos cosas que aún no han pasado\",\"itemIds\":[\"ena2m6whenigetthere\",\"ena2m6beforeweleave\",\"ena2m6afterwearrive\",\"ena2m6assoonas\",\"ena2m6imgoingtotextyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Una frase, una marca de futuro — y va en la principal\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"por qué\"],[\"cuando llegue…\",\"when I get there…\",\"presente: el futuro ya está en la otra mitad\"],[\"antes de salir…\",\"before we leave…\",\"presente, y con sujeto (el inglés no usa infinitivo aquí)\"],[\"en cuanto llegue a casa…\",\"as soon as I get home…\",\"presente\"],[\"…te llamo / te voy a llamar\",\"…I'm going to call you\",\"AQUÍ va la marca de futuro\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Dos avisos pequeños que ahorran dos errores\",\"body\":\"\u003cb\u003e1. Before y after piden sujeto.\u003c/b\u003e En español dices «antes de \u003ci\u003esalir\u003c/i\u003e» y «después de \u003ci\u003ellegar\u003c/i\u003e», con el verbo suelto. En inglés, detrás de \u003ci\u003ebefore\u003c/i\u003e y \u003ci\u003eafter\u003c/i\u003e va una frase entera: \u003cb\u003ebefore \u003cu\u003ewe\u003c/u\u003e leave\u003c/b\u003e, \u003cb\u003eafter \u003cu\u003ewe\u003c/u\u003e arrive\u003c/b\u003e. Si te olvidas del sujeto, la frase se queda en el aire.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. When no siempre es «cuando».\u003c/b\u003e En pregunta, \u003ci\u003ewhen\u003c/i\u003e sigue siendo la palabra de siempre —\u003ci\u003e[[When is your birthday?|¿Cuándo es tu cumpleaños?]]\u003c/i\u003e—, y ahí sí puede haber futuro detrás, porque no es una subordinada de tiempo, es la pregunta entera. La regla del presente vale para la mitad que \u003cb\u003eengancha\u003c/b\u003e con otra: \u003ci\u003ewhen I get there\u003c/i\u003e, \u003ci\u003ewhen the train arrives\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY una cosa que quita miedo: si en la subordinada pones \u003ci\u003egoing to\u003c/i\u003e por error en vez de presente, se te entiende igual. Lo que \u003cb\u003erompe\u003c/b\u003e de verdad, y lo que el corrector marca, es el \u003ci\u003ewill\u003c/i\u003e: \u003ci\u003ewhen I will get there\u003c/i\u003e. Ese es el que hay que borrar de la cabeza.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m6l4e1\",\"type\":\"mc\",\"prompt\":\"Elige la buena\",\"question\":\"«Cuando llegue a Brighton, te llamo.»\",\"options\":[\"When I get to Brighton, I'm going to call you.\",\"When I will get to Brighton, I'm going to call you.\",\"When I get to Brighton, I get to call you.\"],\"answer\":0,\"whyWrong\":[null,\"El futuro ya está en la segunda mitad: repetirlo en la primera sobra\",\"Sin marca de futuro en ninguna de las dos mitades, la frase se lee como rutina\"],\"itemIds\":[\"ena2m6whenigetthere\"],\"tip\":\"Una frase, una marca de futuro. Localiza primero cuál es la mitad principal: ahí es donde va.\"},{\"id\":\"ena2m6l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Dónde va la marca de futuro?\",\"categories\":[\"aquí SÍ: es la principal\",\"aquí NO: va en presente\"],\"items\":[{\"text\":\"…I'm going to call you\",\"bucket\":0},{\"text\":\"when I get there…\",\"bucket\":1},{\"text\":\"before we leave…\",\"bucket\":1},{\"text\":\"…we're going to find the hotel\",\"bucket\":0},{\"text\":\"as soon as I get home…\",\"bucket\":1},{\"text\":\"…I'm going to text you\",\"bucket\":0}],\"itemIds\":[\"ena2m6whenigetthere\",\"ena2m6beforeweleave\",\"ena2m6afterwearrive\",\"ena2m6assoonas\",\"ena2m6imgoingtotextyou\"],\"tip\":\"Las de la derecha empiezan todas por una palabra de enganche: when, before, after, as soon as. Ese es el cartel de «aquí no».\"},{\"id\":\"ena2m6l4e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error nº 1 del módulo\",\"wrong\":\"When I will arrive, I'm going to call you.\",\"answers\":[\"When I arrive, I'm going to call you.\"],\"why\":\"El español pone subjuntivo («cuando llegue») y al traducir sale un futuro. Pero el inglés ya ha dicho que esto es futuro en la otra mitad —I'm going to call you— y no lo repite. Detrás de when va presente, y se lee como futuro sin ningún problema.\",\"translation\":\"Cuando llegue, te llamo.\",\"itemIds\":[\"ena2m6whenigetthere\",\"ena2m1arrived\"]},{\"id\":\"ena2m6l4e4\",\"type\":\"errorfix\",\"prompt\":\"El mismo error, con «before»\",\"wrong\":\"Before we will leave, I'm going to check the tickets.\",\"answers\":[\"Before we leave, I'm going to check the tickets.\"],\"why\":\"Before, after, when y as soon as abren la mitad que NO lleva la marca de futuro. La lleva la otra: I'm going to check.\",\"translation\":\"Antes de salir voy a mirar los billetes.\",\"itemIds\":[\"ena2m6beforeweleave\",\"enticket\"]},{\"id\":\"ena2m6l4e5\",\"type\":\"errorfix\",\"prompt\":\"Y ahora falta algo, no sobra\",\"wrong\":\"After arrive, we're going to find the hotel.\",\"answers\":[\"After we arrive, we're going to find the hotel.\"],\"why\":\"En español «después de llegar» se dice con el verbo suelto. En inglés, detrás de after va una frase con su sujeto: after WE arrive. Lo mismo con before: before WE leave.\",\"translation\":\"Cuando lleguemos, buscamos el hotel.\",\"itemIds\":[\"ena2m6afterwearrive\"]},{\"id\":\"ena2m6l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa la subordinada\",\"text\":\"I'm going to text you when I ___ (get) on the train.\",\"answers\":[\"get\"],\"translation\":\"Te escribo cuando me suba al tren.\",\"hints\":[\"Detrás de when, presente — y aquí el sujeto es I\",\"when I g… on the train\"],\"itemIds\":[\"ena2m6imgoingtotextyou\"]},{\"id\":\"ena2m6l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa la principal\",\"text\":\"As soon as I get home, I ___ going to have a shower.\",\"answers\":[\"'m\",\"am\"],\"translation\":\"En cuanto llegue a casa, me voy a dar una ducha.\",\"hints\":[\"La marca de futuro va aquí: be + going to\",\"I … going to have a shower.\"],\"itemIds\":[\"ena2m6assoonas\",\"enhome\"]},{\"id\":\"ena2m6l4e8\",\"type\":\"transform\",\"prompt\":\"Dale la vuelta a la frase\",\"source\":\"When I get there, I'm going to call you.\",\"instruction\":\"Pon la mitad de «when» al final\",\"answers\":[\"I'm going to call you when I get there.\"],\"translation\":\"Te llamo cuando llegue.\",\"hints\":[\"Las dos mitades se intercambian; al final, la coma desaparece\",\"I'm going to call you w… I get there.\"],\"itemIds\":[\"ena2m6whenigetthere\"],\"tip\":\"La coma solo aparece cuando la subordinada va delante. Si va detrás, nada: es lo mismo que en español.\"},{\"id\":\"ena2m6l4e9\",\"type\":\"build\",\"prompt\":\"Construye la frase entera\",\"target\":\"Before we leave I'm going to check the tickets\",\"translation\":\"Antes de salir voy a mirar los billetes\",\"distractors\":[\"will\",\"leaving\"],\"itemIds\":[\"ena2m6beforeweleave\"],\"tip\":\"La ficha «will» está ahí a propósito y sobra siempre. No la vas a necesitar hasta el módulo 11.\"},{\"id\":\"ena2m6l4e10\",\"type\":\"gapbank\",\"prompt\":\"El plan de Valeria, hueco a hueco\",\"text\":\"Before we ___, I'm going to check the booking. When we ___ in Brighton, we're going to find the hotel. As soon as I ___ my bag in the room, I'm going to the beach.\",\"answers\":[\"leave\",\"arrive\",\"put\"],\"bank\":[\"leave\",\"arrive\",\"put\",\"left\",\"stayed\",\"checked\"],\"translation\":\"Antes de salir voy a mirar la reserva. Cuando lleguemos a Brighton buscamos el hotel. En cuanto deje la bolsa en la habitación, me voy a la playa.\",\"itemIds\":[\"ena2m6beforeweleave\",\"ena2m6afterwearrive\",\"ena2m6thebooking\",\"ena2m2putgroup\"],\"tip\":\"Los tres huecos van en presente aunque los tres hablen del futuro. Los pasados del banco están ahí para ver si te fías de la regla.\"},{\"id\":\"ena2m6l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — con la pausa de la coma\",\"text\":\"When I get there, I'm going to call you. As soon as I get home, I'm going to text Amy.\",\"phonetic\":\"uen ái guet DÉA, áim GÓU-in ta KOOL yu. as̬ SÚUN as̬ ái guet JÓUM, áim GÓU-in ta TEKST ÉI-mi\",\"translation\":\"Cuando llegue, te llamo. En cuanto llegue a casa, le escribo a Amy.\",\"itemIds\":[\"ena2m6whenigetthere\",\"ena2m6assoonas\"],\"tip\":\"Marca la pausa donde está la coma: es lo que hace que se entienda dónde acaba una mitad y empieza la otra.\"},{\"id\":\"ena2m6l4e12\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés — y vigila el subjuntivo\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Cuando lleguemos a Brighton, vamos a buscar el hotel.\",\"answers\":[\"When we arrive in Brighton, we're going to find the hotel.\",\"When we get to Brighton, we're going to find the hotel.\",\"When we arrive in Brighton, we are going to find the hotel.\"],\"hint\":\"la mitad que empieza por «cuando» no lleva marca de futuro\",\"itemIds\":[\"ena2m6afterwearrive\",\"ena2m1arrived\"],\"tip\":\"Y de paso, la preposición de arrive que ya viste en el módulo 1: con ciudades, arrive IN.\"},{\"id\":\"ena2m6l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Antes de salir voy a mirar los billetes. Cuando llegue, te llamo.\",\"answers\":[\"Before we leave, I'm going to check the tickets. When I get there, I'm going to call you.\",\"Before we leave I'm going to check the tickets. When I get there I'm going to call you.\"],\"hints\":[\"Dos frases, dos marcas de futuro: una en cada principal\",\"Before we l…, I'm going to check the tickets. When I g… there, I'm going to call you.\"],\"itemIds\":[\"ena2m6beforeweleave\",\"ena2m6whenigetthere\"],\"tip\":\"Cuéntalos: dos «going to» y ni un «will». Si te ha salido así, la trampa del subjuntivo está desactivada.\"}]}],\"resources\":[{\"label\":\"British Council — Talking about the future\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/talking-about-the-future\",\"note\":\"Busca el apartado de las oraciones de tiempo (when, before, after, as soon as) y quédate solo con los ejemplos: verás que ni uno lleva will detrás de when.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"conte
