e, Nora cannot walk to the next stop.\",\"To sum up, build the lane provided that one stop stays.\"],\"translation\":\"Podría argumentarse que el carril llega tarde en cuanto al aire. · Para empezar, las emisiones en el semáforo son las peores del distrito. · Cierto es que el aire mejoraría. No obstante, el 29 sigue teniendo que girar. · Concedido: aparcar no es un derecho humano. Aun así, Nora no puede ir andando hasta la siguiente parada. · En resumen, hágase el carril siempre que se quede una parada.\",\"itemIds\":[\"enb2m8itcouldbearguedthat\",\"enb2m8tobeginwith\",\"enb2m8admittedly\",\"enb2m8granted\",\"enb2m8tosumup\",\"enb1m9providedthat\"],\"tip\":\"Cinco frases, el esqueleto entero. Si en el monólogo te saltas la 3, has listado.\"},{\"id\":\"enb2m8l9e2\",\"type\":\"fastmatch\",\"prompt\":\"Los moldes, sin pensar\",\"pairs\":[{\"target\":\"It could be argued that the lane is overdue.\",\"source\":\"Podría argumentarse que el carril llega tarde.\"},{\"target\":\"Admittedly, the air would improve.\",\"source\":\"Cierto es que el aire mejoraría.\"},{\"target\":\"Nevertheless, the buses still have to get through.\",\"source\":\"No obstante, los autobuses siguen teniendo que pasar.\"},{\"target\":\"To sum up, neither side is entirely right.\",\"source\":\"En resumen, ninguno de los dos tiene del todo razón.\"},{\"target\":\"both the buses and the bikes\",\"source\":\"tanto los autobuses como las bicis\"}],\"targetSeconds\":30,\"itemIds\":[\"enb2m8itcouldbearguedthat\",\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8tosumup\",\"enb2m8bothand\"],\"tip\":\"Cinco moldes. Si uno se traba, es el que vas a evitar en los dos minutos. Míralo ahora.\"},{\"id\":\"enb2m8l9e3\",\"type\":\"errorfix\",\"prompt\":\"Repaso espiral: even though + but, que no se ha ido\",\"wrong\":\"Even though it costs more, but I buy the local one.\",\"answers\":[\"Even though it costs more, I buy the local one.\"],\"why\":\"Even though ya es el contraste: el but sobra. Es el mismo error que whereas + but de la L1. Se caza, no se reabre.\",\"translation\":\"Aunque cuesta más, compro el de aquí.\",\"itemIds\":[\"enb1m8eventhough\"]},{\"id\":\"enb2m8l9e4\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: la calle, los dos lados, una concesión. Treinta segundos, dos minutos, dos pasadas. Golpes en las content words.\",\"topic\":\"A change in my street that some people want and others don't — both sides, and a concession\",\"slides\":[{\"title\":\"1. Thesis\",\"hint\":\"It could be argued that… / in terms of… Sin In my opinion como herramienta.\"},{\"title\":\"2. In favour, with an example\",\"hint\":\"To begin with + un dato (aire, cole, emisiones). Un ejemplo de la calle, no un eslogan.\"},{\"title\":\"3. Concession + against\",\"hint\":\"Admittedly / Granted… Nevertheless / All the same… El 29, Nora, the corner. Stress the content words.\"},{\"title\":\"4. Close with a condition\",\"hint\":\"To sum up, neither side is entirely right. Provided that / as long as / once… No copies the thesis.\"}],\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"checklist\":[\"Hablé al menos 1:45 sin pararme en seco\",\"Puse una tesis sin «I think» / «In my opinion» como herramienta principal\",\"Usé una concesión (admittedly, granted, it is true that, fair enough)\",\"Di un ejemplo concreto de la calle (un bus, una parada, un semáforo, una persona)\",\"Cerré con una condición o con neither side, no con la tesis copiada\",\"Noté los golpes en las content words al menos en una frase larga\"],\"model\":\"Solo el punto 3: «Admittedly, the air would improve. Nevertheless, the 29 still has to turn at that corner, and not only is it slower, but it is also less safe if there is no passing place. Granted, parking is not a human right. All the same, Nora cannot walk to the next stop.»\",\"itemIds\":[\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8granted\",\"enb2m8allthesame\",\"enb2m8itcouldbearguedthat\",\"enb2m8tosumup\",\"enb2m8asubsidiarypoint\"],\"tip\":\"Si llegas al final sin haberte oído un admittedly o un granted, has listado. La concesión es el punto. Los dos minutos están para ella.\"},{\"id\":\"enb2m8l9e5\",\"type\":\"audiomc\",\"prompt\":\"La cocina, Valeria y Ben. Una sola escucha. Toma notas: hay hechos y opiniones, y no son del mismo hablante.\",\"notepad\":true,\"plays\":1,\"audio\":\"They're putting the lane in in May.|They're consulting. That's not the same.|Admittedly the air is grim. I drive it. Nevertheless I still have to turn. If you ask me they haven't counted the 29s.|If you ask me is not a count, Ben. The paper said the model is weaker on buses. That's a fact. Your 'they haven't counted' is an opinion until May.|Fair enough. All the same, Nora cannot do the next stop. That's a fact. I see her from the cab.|Then we want the same sentence: the lane, and a stop. To sum up, neither of us is entirely right, and the drawing isn't either.\",\"question\":\"¿En qué coinciden al final, y qué distingue Amy entre hecho y opinión?\",\"options\":[\"Quieren el carril y una parada; el modelo débil en autobuses es hecho, «no han contado los 29» es opinión hasta mayo\",\"Quieren cancelar el carril; todo lo que dice Ben es hecho\",\"Quieren quitar a Nora; el aire es opinión\"],\"answer\":0,\"whyWrong\":[null,\"El cierre es the lane, and a stop. No cancelan.\",\"Nora es el punto subsidiario, no el enemigo. El aire, en las dos lecturas, es un hecho.\"],\"itemIds\":[\"enb2m8admittedly\",\"enb2m8natifyouaskme\",\"enb2m8factvsopinion\",\"enb2m8natfairenoughbut\",\"enb2m8allthesame\",\"enb2m8tosumup\",\"enb2m4thegist\"],\"tip\":\"Esto es el Listening Part 4 en la cocina: gist (the lane and a stop), hecho frente a opinión (weaker on buses vs haven't counted), actitud (fair enough), causa (Nora cannot walk). Mañana, el laboratorio.\"},{\"id\":\"enb2m8l9e6\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"En resumen, ninguno de los dos tiene del todo razón.\",\"answers\":[\"To sum up, neither of us is entirely right\",\"To sum up, neither side is entirely right\",\"To sum up neither of us is entirely right\"],\"hints\":[\"To sum up + neither\",\"To sum up, neither ... is entirely right\"],\"itemIds\":[\"enb2m8tosumup\",\"enb2m8neithernor\"],\"tip\":\"Neither of us: Valeria y Ben. Neither side: el ayuntamiento y la calle. Las dos cierran. Copiar la tesis, no.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
