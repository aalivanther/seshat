 ist. (que)\",\"answers\":[\"dass\"],\"translation\":\"Creo que él está enfermo.\",\"hints\":[\"La conjunción del club del verbo al final\",\"d-a-s-s, con doble s\"],\"itemIds\":[\"a2m6dass\",\"a2m6glauben\",\"krank\"],\"tip\":\"dass con doble s = la conjunción. das con una = el artículo o «eso». Suenan igual; se distinguen al escribir.\"},{\"id\":\"a2m6l3e4\",\"type\":\"mc\",\"prompt\":\"¿das o dass?\",\"question\":\"Ich denke, ___ Berlin schön ist.\",\"options\":[\"das\",\"dass\"],\"answer\":1,\"whyWrong\":[\"das con una s es el artículo (das Buch) o «eso» — la que abre la subordinada de opinión es dass, con doble s\",null],\"itemIds\":[\"a2m6dass\",\"a2m6denken\",\"schoen\"],\"tip\":\"Truco: si detrás viene una frase entera con el verbo al final, es dass con doble s.\"},{\"id\":\"a2m6l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa — el verbo cierra la opinión\",\"text\":\"Ich denke, dass Deutsch wichtig ___. (es)\",\"answers\":[\"ist\"],\"translation\":\"Pienso que el alemán es importante.\",\"hints\":[\"dass es del club de weil: verbo al final\",\"is-t, cerrando\"],\"itemIds\":[\"a2m6ichdenkedass\",\"a2m6dass\",\"a2m6wichtig\"],\"tip\":\"En español dices «que ES importante» con el verbo en medio; el dass alemán lo aparca al final: wichtig ist.\"},{\"id\":\"a2m6l3e6\",\"type\":\"build\",\"prompt\":\"Construye la sospecha\",\"target\":\"Ich glaube, dass er krank ist\",\"translation\":\"Creo que él está enfermo\",\"distractors\":[\"weil\",\"hat\"],\"itemIds\":[\"a2m6glauben\",\"a2m6dass\",\"krank\"],\"tip\":\"glaube arranca, dass abre la puerta, ist cierra. El molde de todas tus opiniones desde hoy.\"},{\"id\":\"a2m6l3e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la valoración\",\"text\":\"Ich finde, dass Berlin schön ist\",\"translation\":\"Me parece que Berlín es bonita\",\"hints\":[\"El finden de valorar\",\"Ich finde, dass ...\"],\"itemIds\":[\"a2m6finden\",\"a2m6dass\",\"schoen\"]},{\"id\":\"a2m6l3e10\",\"type\":\"hearreal\",\"prompt\":\"Le explican la razón a alguien y responde — escucha: ¿qué significa?\",\"book\":\"Ah, ich verstehe.\",\"real\":\"Ach so!\",\"translation\":\"¡Ah, claro! / ahora lo entiendo.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Ah, claro — ahora lo entiendo\",\"No estoy de acuerdo contigo\",\"¿Puedes repetirlo, por favor?\"],\"tip\":\"Ach so! es el clic del entendimiento — la respuesta natural cuando un weil o un dass te aclara algo.\"},{\"id\":\"a2m6l3e8\",\"type\":\"mc\",\"prompt\":\"Pide una opinión\",\"question\":\"„Was meinst du?“\",\"options\":[\"¿Tú qué opinas?\",\"¿Qué quieres?\",\"¿Qué haces?\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Was willst du?»\",\"Eso sería «Was machst du?»\"],\"itemIds\":[\"a2m6meinen\"],\"tip\":\"Was meinst du? invita a opinar — y la respuesta natural arranca con Ich denke/glaube/finde, dass...\"},{\"id\":\"a2m6l3e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Creo que el alemán es importante\",\"answers\":[\"Ich glaube, dass Deutsch wichtig ist\",\"Ich denke, dass Deutsch wichtig ist\"],\"hints\":[\"Arranque + coma + dass + verbo al final\",\"Ich glaube, dass Deutsch ...\"],\"itemIds\":[\"a2m6glauben\",\"a2m6dass\",\"a2m6wichtig\",\"a2m6ichdenkedass\"],\"tip\":\"Opinar con dass es oro en el examen oral A2: cada «¿qué opinas de...?» se responde con este molde.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «dass»-Sätze (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Personajes opinando con Ich denke/glaube, dass... — imita sus arranques en voz alta.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks
