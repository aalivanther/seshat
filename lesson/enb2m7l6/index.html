; after it, you do not serve the milk. Best before is a quality date; after it, the yoghurt is often still yoghurt. A generous portion of the waste in the sample was the third kind. Staff had not looked carefully at the label. They had put the whole tray in the bin because the date had turned red on the sticker, and the sticker did not say which kind of date it was.\u003cbr/\u003e\u003cbr/\u003eYear-round availability makes the pile worse, not better. Strawberries in December travel. They arrive looking like strawberries and tasting like a rumour of strawberries, and they go off faster because they have already had a long week. Food miles are not a slogan here; they are a number on a lorry, and the lorry is why the fruit does not last until Sunday. Cafés that source locally on two mornings a week throw less away, not because they are more virtuous, but because the produce has had less time to die in a crate.\u003cbr/\u003e\u003cbr/\u003eThe report is careful with recommendations. It does not tell anyone to go plant-based. It does say that batch cooking on a Monday, with a freezer that does not take up the whole kitchen, turns leftovers into Tuesday's soup. It freezes well, the soup, if you do not put cream in it until the bowl. A diet of specials that change every day looks lively on a board and fills the bin on a Thursday. A shorter menu, seasonal, with one plant-based dish that is not bland, fills plates instead.\u003cbr/\u003e\u003cbr/\u003eNone of this is new to a cook. What is new is the permission to write it down as a process, not as a feeling. The cafés in the sample that kept a notebook by the bin for four weeks cut their waste to a great extent — not to zero, and not by magic. They made an effort with the dates, they had a look at the portions, and they stopped ordering the fruit that looked honest in the catalogue and arrived tired. The bin, which has no opinions, already knew.\u003cbr/\u003e\u003cbr/\u003eA last figure, because owners ask for one. Cafés that cut one special and one imported fruit from the board saved, on average, the price of a week's milk. That is not a fortune. It is also not nothing, and it is the kind of finding that survives a second count. Significantly higher waste tracked with year-round boards, not with busy Saturdays. Busy Saturdays filled plates. Tired fruit filled bins. The distinction is the whole briefing, and it fits in a notebook. Owners who want a single slogan will not find one. The briefing's last line is a process, not a virtue: look at the label, look at the portion, look at the crate, write it down. That is as close to a method as a Tuesday night bin will give you."])</script><script>self.__next_f.push([1,"18:Tc5f,"])</script><script>self.__next_f.push([1,"I am tired of menus that say organic as if the word were a flavour. I have cooked organic carrots that tasted of the bag they came in, and I have cooked a conventionally grown leek from a field I can walk to that made people put down their forks. The second one is the one I want on the board. The first one is the one that photographs well.\u003cbr/\u003e\u003cbr/\u003eYear-round availability is the other word that has been doing too much work. If your tomato has had more food miles than your last holiday, it is not a tomato in any sense that matters to a mouth. It is a delivery. I am not against imports: I am against pretending that a December strawberry is a season. It is a lorry. The lorry is allowed. The pretence is what fills the bin, because tired fruit goes off before the weekend, and then we say we care about waste.\u003cbr/\u003e\u003cbr/\u003eSource locally is better, and it is also harder, which is why it does not always make it onto the sticker. A café that buys at a market on two mornings has to make a decision every Tuesday about what the lunch consists of. That decision will sometimes be soup. Soup is not a failure. A board that changes because the field changed is the opposite of bland: it is the point. I would rather eat leftovers of that soup on Wednesday than a plant-based special that arrived in a box labelled sustainable and tasted of nothing.\u003cbr/\u003e\u003cbr/\u003eI must admit I have used organic on a menu when a supplier asked me to. In hindsight I ought to have written the name of the farm. Names do more work than adjectives. If I had put the farm on the board, people could have pointed at it and asked a question I could answer. Organic is a question I cannot always answer, because the certificate and the flavour are not the same document.\u003cbr/\u003e\u003cbr/\u003eNone of this is an argument against eating plants, or against eating well. It is an argument against letting the word do the cooking. Have a look at the label, yes. Then have a look at the thing. If the thing is soggy, no certificate will crisp it. If the thing is outstanding, you will not need the word. That, to me, is the only review that counts, and it does not fit on a sticker.\u003cbr/\u003e\u003cbr/\u003eI will add, because columns that only scold are another kind of packaging, a thing I do on Tuesdays. I walk to the stall. I point at what looks honest. I make a decision in ten minutes, and the lunch consists of that decision. Some Tuesdays the decision is leeks. Some Tuesdays it is not. I do not call it a diet and I do not call it organic. I call it cooking, and the leftovers go home in a bag, and the bag is the review I am actually willing to sign. If a café in Kentish Town is doing the same work without the sticker, I will take the bus. If it is doing the sticker without the work, I will eat at home. That is not virtue. That is taste. I have no certificate for it, and I do not want one. A café that can point at a stall, name a farm, and send leftovers home has already written the only review I trust. The rest is packaging, and packaging is what we were supposed to be throwing less of. If that sounds like a lecture, it is not: it is Tuesday, and the stall is open, and the leeks are there or they are not."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m7l6\",\"phaseId\":\"enb2m7\",\"title\":\"Year-round, and a word called organic\",\"subtitle\":\"Dos lecturas: los números del desperdicio, y la opinión de que ecológico es un eslogan\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Temporada, caducidad, kilómetros\",\"itemIds\":[\"enb2m7yearround\",\"enb2m7seasonal\",\"enb2m7imported\",\"enb2m7leftovers\",\"enb2m7bestbefore\",\"enb2m7useby\",\"enb2m7plantbased\",\"enb2m7foodmiles\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: un informe de datos, y una columna que no se cree el adjetivo\",\"body\":\"Dos textos, el mismo plato. \u003cb\u003eLa A informa:\u003c/b\u003e cifras de food waste en cafeterías británicas, best before frente a use by, leftovers. \u003cb\u003eLa B convence:\u003c/b\u003e un cocinero de Cardiff sostiene que \u003ci\u003eorganic\u003c/i\u003e es una palabra de escaparate y que source locally no se imprime en el envase.\u003cbr/\u003e\u003cbr/\u003eBest before = consumo preferente (después sigue siendo comida). Use by = caducidad (después, no). El hispanohablante las funde porque «caducidad» le vale para las dos. El texto A las separa, y una pregunta de inferencia vive ahí.\u003cbr/\u003e\u003cbr/\u003eToca las glosas. Sintetiza: qué dato comparte y qué hace cada uno con él.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m7l6e1\",\"type\":\"read\",\"prompt\":\"Lectura A — informa. Cifras, fechas, y lo que se tira.\",\"title\":\"What the bin already knows\",\"source\":\"From a WRAP-style briefing for small cafés, adapted from a UK food-waste report\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m7l6e1q1\",\"q\":\"What are the three piles of waste in the briefing?\",\"options\":[\"Plate leftovers, food that has gone off, and food thrown away because of a best-before date\",\"Plastic, glass and food\",\"Breakfast, lunch and dinner\"],\"answer\":0,\"why\":\"«namely: leftovers from plates, food that has gone off, and food that has passed a best-before date and been thrown away out of fear.»\"},{\"id\":\"enb2m7l6e1q2\",\"q\":\"Why does the third pile surprise people?\",\"options\":[\"Because best before is a quality date, not a safety date, and a lot of that food was still food.\",\"Because use by means the opposite of what staff thought.\",\"Because strawberries in December never go off.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que juntar «Best before is not use by» con «a generous portion of the waste… was the third kind».\"},{\"id\":\"enb2m7l6e1q3\",\"q\":\"Why do cafés that source locally two mornings a week throw less away?\",\"options\":[\"Because the produce has had less time to die in a crate — not because they are more virtuous.\",\"Because local food is organic by definition.\",\"Because they have larger freezers.\"],\"answer\":0,\"why\":\"El texto lo dice con esas palabras, y se adelanta al elogio moral.\"},{\"id\":\"enb2m7l6e1q4\",\"q\":\"What is the notebook by the bin doing in the last paragraph?\",\"options\":[\"It turns waste from a feeling into a process you can count, and that count cuts what goes in.\",\"It is a way of shaming staff.\",\"It replaces the need to look at labels.\"],\"answer\":0,\"inference\":true,\"why\":\"«permission to write it down as a process, not as a feeling» + «kept a notebook… cut their waste». El cuaderno es el método, no la virtud.\"}],\"itemIds\":[\"enb2m7leftovers\",\"enb2m7goofffood\",\"enb2m7bestbefore\",\"enb2m7useby\",\"enb2m7yearround\",\"enb2m7foodmiles\",\"enb2m7sourcelocally\",\"enb2m7batchcooking\",\"enb2m7freezewell\",\"enb2m7lookedcarefullyat\"],\"tip\":\"Cuenta las colocaciones: make a decision, gone off, looked carefully at, make an effort, have a look, year-round, source locally. El texto A es el módulo puesto a informar.\"},{\"id\":\"enb2m7l6e2\",\"type\":\"read\",\"prompt\":\"Lectura B — convence. El mismo desperdicio, otra lectura del adjetivo organic.\",\"title\":\"Organic is a word, not a virtue\",\"source\":\"Column by a cook in a Cardiff neighbourhood paper (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m7l6e2q1\",\"q\":\"What contrast is the writer drawing with the carrots and the leek?\",\"options\":[\"A certified organic product that tasted of the bag versus a local conventional one that tasted of itself.\",\"Two organic vegetables, one from Cardiff and one from Spain.\",\"A raw carrot and a cooked leek.\"],\"answer\":0,\"why\":\"«organic carrots that tasted of the bag» frente a «a conventionally grown leek from a field I can walk to».\"},{\"id\":\"enb2m7l6e2q2\",\"q\":\"Why, according to the writer, does year-round fruit fill the bin?\",\"options\":[\"Because tired fruit from a long journey goes off before the weekend, while we say we care about waste.\",\"Because strawberries are illegal in December.\",\"Because local markets refuse to sell them.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que unir «a lorry» + «tired fruit goes off before the weekend» + «then we say we care about waste».\"},{\"id\":\"enb2m7l6e2q3\",\"q\":\"What does he wish he had put on the board instead of organic?\",\"options\":[\"The name of the farm, which answers a question organic cannot.\",\"The price, in large letters.\",\"The word outstanding.\"],\"answer\":0,\"why\":\"«In hindsight I ought to have written the name of the farm. Names do more work than adjectives.»\"},{\"id\":\"enb2m7l6e2q4\",\"q\":\"How does this column sit against the briefing in A?\",\"options\":[\"It wants the same bin to get lighter, and it refuses to let a label do the work that cooking and looking should do.\",\"It rejects notebooks and batch cooking as middle-class hobbies.\",\"It argues that waste does not matter if the food is organic.\"],\"answer\":0,\"inference\":true,\"why\":\"Las dos quieren menos cubo. A lo convierte en proceso; B, en no mentir con el adjetivo. Mismo resultado, dos puertas, como en el m6.\"}],\"itemIds\":[\"enb2m7organicproduce\",\"enb2m7yearround\",\"enb2m7foodmiles\",\"enb2m7sourcelocally\",\"enb2m7consistof\",\"enb2m7bland\",\"enb2m7leftovers\",\"enb2m7plantbased\",\"enb2m7soggy\",\"enb2m7outstanding\",\"enb2m7havealook\"],\"tip\":\"La B está llena de bloques del módulo y de should have / if I had del m6. Sintetizar es firmar lo que las dos firmarían: el cubo, no el eslogan.\"},{\"id\":\"enb2m7l6e3\",\"type\":\"mc\",\"prompt\":\"Sintetizar\",\"question\":\"¿Qué dato o idea está en las dos lecturas?\",\"options\":[\"Que la fruta que viaja mucho se pone mala antes, y que abastecerse cerca reduce lo que acaba en el cubo\",\"Que lo ecológico es siempre un fraude\",\"Que Sam debería cerrar los jueves\"],\"answer\":0,\"whyWrong\":[null,\"La B discute el adjetivo, no niega todo el cultivo ecológico. La A ni lo discute.\",\"Sam no sale por nombre en ninguno de los dos como dato.\"],\"itemIds\":[\"enb2m7foodmiles\",\"enb2m7sourcelocally\",\"enb2m7goofffood\"],\"tip\":\"El dato compartido es el viaje y el cubo. La A lo cuenta con una muestra; la B, con un tomate de diciembre.\"},{\"id\":\"enb2m7l6e4\",\"type\":\"paraphrase\",\"prompt\":\"Sin «organic» ni «good»: di lo que el cocinero quiere en la pizarra\",\"source\":\"Put organic on the menu because it sounds good.\",\"forbid\":[\"organic\",\"good\",\"sounds\"],\"answers\":[\"Write the name of the farm\",\"Put the name of the farm on the board\",\"Source locally and name the farm\"],\"translation\":\"Pon «ecológico» en la carta porque queda bien.\",\"hints\":[\"Lo que él dice que hace más trabajo que el adjetivo\",\"Write the name of the ...\"],\"itemIds\":[\"enb2m7organicproduce\",\"enb2m7sourcelocally\"],\"tip\":\"Names do more work than adjectives. Es la frase de la B, y es una colocación de ideas, no de palabras: granja, no sello.\"},{\"id\":\"enb2m7l6e5\",\"type\":\"gapbank\",\"prompt\":\"Separa las dos fechas\",\"text\":\"___ by is a safety date; best ___ is a quality date.\",\"answers\":[\"Use\",\"before\"],\"bank\":[\"Use\",\"before\",\"Best\",\"after\"],\"translation\":\"La fecha de caducidad es de seguridad; el consumo preferente, de calidad.\",\"itemIds\":[\"enb2m7useby\",\"enb2m7bestbefore\"],\"tip\":\"Si las fundes, tiras comida que todavía es comida. El texto A dice que esa pila es la que sorprende.\"},{\"id\":\"enb2m7l6e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Las sobras van a casa en una bolsa.\",\"answers\":[\"The leftovers go home in a bag\",\"Leftovers go home in a bag\",\"The leftovers go home in a bag he gives you\"],\"hint\":\"Leftovers, siempre plural\",\"itemIds\":[\"enb2m7leftovers\"],\"tip\":\"A leftover en singular es posible («a leftover potato») y no es el bloque. El bloque de la reseña es leftovers.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-
