s pasos y todos hablan alemán: 1) \u003cb\u003evergleichen\u003c/b\u003e — \u003ci\u003eIch vergleiche die Preise\u003c/i\u003e; 2) argumentar con lo que ya sabes: \u003ci\u003eDer Pulli ist billiger \u003cb\u003eals\u003c/b\u003e die Jacke und die Qualität ist \u003cb\u003egenauso gut\u003c/b\u003e\u003c/i\u003e; 3) decidir con razón. Para dar la razón, tu viejo amigo \u003cb\u003edenn\u003c/b\u003e del A1: \u003ci\u003eIch nehme den Pulli, \u003cb\u003edenn\u003c/b\u003e er ist billiger\u003c/i\u003e — denn no mueve el verbo. En la calle oirás también \u003cb\u003eweil\u003c/b\u003e: \u003ci\u003eIch nehme den Pulli, weil er billiger \u003cb\u003eist\u003c/b\u003e\u003c/i\u003e — fíjate cómo weil catapulta el verbo al final. Es un adelanto del módulo de las subordinadas: entiéndelo si lo oyes, pero tu herramienta de hoy es denn. Y el premio de todo el proceso tiene nombre: \u003cb\u003edas beste Angebot\u003c/b\u003e — tu am besten vestido de etiqueta.\",\"table\":[[\"\",\"Pulli A\",\"Pulli B\"],[\"der Preis\",\"20 Euro\",\"35 Euro\"],[\"die Qualität\",\"gut\",\"gut\"],[\"das Urteil (veredicto)\",\"genauso gut wie B, aber billiger → das beste Angebot!\",\"teurer, aber nicht besser\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m7l6e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas de la decisión\",\"pairs\":[{\"target\":\"der Preis\",\"source\":\"el precio\"},{\"target\":\"die Qualität\",\"source\":\"la calidad\"},{\"target\":\"vergleichen\",\"source\":\"comparar\"},{\"target\":\"das beste Angebot\",\"source\":\"la mejor oferta\"}],\"itemIds\":[\"preis\",\"a2m7qualitaet\",\"a2m7vergleichen\",\"a2m7besteangebot\"]},{\"id\":\"a2m7l6e2\",\"type\":\"mc\",\"prompt\":\"Lee los precios y compara\",\"question\":\"T-Shirt A kostet 8 Euro, T-Shirt B kostet 12 Euro. →\",\"options\":[\"T-Shirt A ist billiger als T-Shirt B\",\"T-Shirt B ist billiger als T-Shirt A\",\"T-Shirt A ist genauso teuer wie T-Shirt B\"],\"answer\":0,\"whyWrong\":[null,\"12 Euro son más que 8 — B es teurer, no billiger\",\"8 ≠ 12: aquí no hay empate — genauso wie es solo para precios iguales\"],\"itemIds\":[\"a2m7billiger\",\"a2m7als\",\"tshirt\",\"euro\",\"kosten\"]},{\"id\":\"a2m7l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa el primer paso del comprador listo\",\"text\":\"Ich ___ die Preise. (comparo)\",\"answers\":[\"vergleiche\"],\"translation\":\"Comparo los precios.\",\"hints\":[\"vergleichen con ich\",\"vergleich + e\"],\"itemIds\":[\"a2m7vergleichen\",\"preis\"],\"tip\":\"vergleichen empieza por ver- → en Perfekt no llevará ge-: Ich habe verglichen. Tu regla de a2m1 sigue viva.\"},{\"id\":\"a2m7l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa el veredicto del regateo\",\"text\":\"Zwanzig Euro? Das ist ein guter ___! (precio)\",\"answers\":[\"Preis\"],\"translation\":\"¿Veinte euros? ¡Es un buen precio!\",\"hints\":[\"Con mayúscula: es sustantivo\",\"P-r-e-i-s\"],\"itemIds\":[\"preis\",\"euro\"]},{\"id\":\"a2m7l6e5\",\"type\":\"mc\",\"prompt\":\"Decide con criterio\",\"question\":\"Der Pulli für 20 Euro hat genauso gute Qualität wie der Pulli für 35 Euro. ¿Qué dices?\",\"options\":[\"Ich nehme den Pulli für 20 Euro, denn die Qualität ist genauso gut\",\"Ich nehme den Pulli für 35 Euro, denn teurer ist immer besser\"],\"answer\":0,\"whyWrong\":[null,\"teurer NO siempre es besser — misma calidad por menos dinero ES el mejor Angebot\"],\"itemIds\":[\"a2m7qualitaet\",\"a2m7genausowie\",\"a2m7pulli\",\"denn\"],\"tip\":\"La lógica del comprador listo cabe en una comparación: genauso gut + billiger = das beste Angebot.\"},{\"id\":\"a2m7l6e6\",\"type\":\"order\",\"prompt\":\"Ordena la secuencia de una compra bien hecha\",\"sentences\":[\"Zuerst vergleiche ich die Preise.\",\"Dann probiere ich die Hose an.\",\"Sie passt mir und sie ist im Angebot!\",\"Danach bezahle ich nur zwanzig Euro.\",\"Das war das beste Angebot!\"],\"translation\":\"Primero comparo los precios. Luego me pruebo el pantalón. ¡Me queda bien y está de oferta! Después pago solo vei
