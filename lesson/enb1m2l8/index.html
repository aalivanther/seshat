03c/b\u003e the pay is good, the hours are terrible.\u003c/i\u003e (También significa «mientras», y el contexto lo separa.)\u003cbr/\u003e· \u003cb\u003esince\u003c/b\u003e + \u003cb\u003efrase entera\u003c/b\u003e, causal: \u003ci\u003e\u003cb\u003eSince\u003c/b\u003e I speak Spanish, they took me on.\u003c/i\u003e Es el «como» del principio de frase. Ojo: \u003ci\u003esince\u003c/i\u003e también es «desde», y es la misma palabra.\u003cbr/\u003e· \u003cb\u003eotherwise\u003c/b\u003e — la consecuencia de NO hacerlo: \u003ci\u003eSend your CV today, \u003cb\u003eotherwise\u003c/b\u003e you'll miss it.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003edue to\u003c/b\u003e + \u003cb\u003esustantivo\u003c/b\u003e, nunca una frase: \u003ci\u003eI left \u003cb\u003edue to\u003c/b\u003e the hours.\u003c/i\u003e ✓ · \u003ci\u003edue to the hours were bad\u003c/i\u003e ✗\u003cbr/\u003e· \u003cb\u003eat least\u003c/b\u003e — lo bueno que queda dentro de lo malo: \u003ci\u003e\u003cb\u003eAt least\u003c/b\u003e the hours suit me.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eapart from\u003c/b\u003e + \u003cb\u003esustantivo\u003c/b\u003e — «aparte de», «salvo»: \u003ci\u003e\u003cb\u003eApart from\u003c/b\u003e the pay, everything is fine.\u003c/i\u003e\u003cbr/\u003e· y de regalo, \u003cb\u003eaccording to\u003c/b\u003e + fuente: \u003ci\u003e\u003cb\u003eaccording to\u003c/b\u003e the advert\u003c/i\u003e — nunca «according to me», que no existe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos avisos de nivel que te ahorran tiempo:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ehowever\u003c/b\u003e ya lo sabes: es de \u003cb\u003eA2\u003c/b\u003e, no una novedad del B1. Úsalo, pero con punto y coma o punto delante y coma detrás.\u003cbr/\u003e· \u003cb\u003ewhereas, moreover, furthermore, as a result, in conclusion\u003c/b\u003e son de \u003cb\u003eB2\u003c/b\u003e. Meterlos en un texto de B1 no sube la nota: sube el riesgo de usarlos mal.\u003cbr/\u003e\u003cbr/\u003eY el calco eterno: \u003cb\u003e«Although… but…»\u003c/b\u003e. En español decimos «aunque el sueldo es bueno, pero el horario es malo». En inglés, \u003cb\u003euno de los dos sobra\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l8\",\"phaseId\":\"enb1m2\",\"title\":\"While, since, otherwise\",\"subtitle\":\"Seis conectores más — y la carta informal de 100-120 palabras\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los seis nuevos\",\"itemIds\":[\"enb1m2while\",\"enb1m2sincecausal\",\"enb1m2otherwise\",\"enb1m2dueto\",\"enb1m2atleast\",\"enb1m2accordingto\",\"enb1m2apartfrom\",\"enb1m2advert\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: qué va detrás de cada uno\",\"body\":\"$17\",\"table\":[[\"Conector\",\"Qué va detrás\",\"Ejemplo\"],[\"while\",\"una frase entera\",\"While the pay is good, the hours are terrible.\"],[\"since (causal)\",\"una frase entera\",\"Since I speak Spanish, they took me on.\"],[\"due to\",\"un sustantivo\",\"I left due to the hours.\"],[\"apart from\",\"un sustantivo\",\"Apart from the pay, everything is fine.\"],[\"otherwise\",\"la frase de la consecuencia\",\"Send it today, otherwise you'll miss it.\"],[\"according to\",\"la fuente\",\"according to the advert\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l8e1\",\"type\":\"match\",\"prompt\":\"Empareja los conectores nuevos\",\"pairs\":[{\"target\":\"While the pay is good, the hours are terrible.\",\"source\":\"Si bien el sueldo es bueno, el horario es terrible.\"},{\"target\":\"Since I speak Spanish, they took me on.\",\"source\":\"Como hablo español, me contrataron.\"},{\"target\":\"At least the hours suit me.\",\"source\":\"Al menos el horario me viene bien.\"},{\"target\":\"according to the advert\",\"source\":\"según el anuncio\"},{\"target\":\"Apart from the pay, everything is fine.\",\"source\":\"Aparte del sueldo, todo va bien.\"}],\"itemIds\":[\"enb1m2while\",\"enb1m2sincecausal\",\"enb1m2atleast\",\"enb1m2accordingto\",\"enb1m2apartfrom\"],\"tip\":\"«according to» nunca se usa contigo mismo: «according to me» no existe. Para tu opinión, «in my view» o «I think».\"},{\"id\":\"enb1m2l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Contraste o causa/consecuencia?\",\"categories\":[\"CONTRASTE — dos cosas que chocan\",\"CAUSA o CONSECUENCIA\"],\"items\":[{\"text\":\"while\",\"bucket\":0},{\"text\":\"although\",\"bucket\":0},{\"text\":\"in spite of\",\"bucket\":0},{\"text\":\"apart from\",\"bucket\":0},{\"text\":\"since\",\"bucket\":1},{\"text\":\"due to\",\"bucket\":1},{\"text\":\"therefore\",\"bucket\":1},{\"text\":\"because of\",\"bucket\":1}],\"itemIds\":[\"enb1m2while\",\"enb1m2apartfrom\",\"enb1m2sincecausal\",\"enb1m2dueto\",\"enb1m1although\",\"enb1m1therefore\"],\"tip\":\"Los de la izquierda enfrentan dos ideas; los de la derecha las encadenan. En el Writing hace falta al menos uno de cada grupo: es literalmente lo que mide el criterio de Organisation.\"},{\"id\":\"enb1m2l8e3\",\"type\":\"gapbank\",\"prompt\":\"Completa la carta con los conectores del banco\",\"text\":\"___ the pay at the café is fine, the hours are terrible. ___ I speak Spanish, the library asked me to come in. I have to answer today, ___ they'll give it to somebody else. ___ the money, everything about the new job is better.\",\"answers\":[\"While\",\"Since\",\"otherwise\",\"Apart from\"],\"bank\":[\"While\",\"Since\",\"Apart from\",\"otherwise\",\"due to\",\"at least\"],\"translation\":\"Si bien el sueldo del café está bien, el horario es terrible. Como hablo español, la biblioteca me pidió que fuera. Tengo que contestar hoy; si no, se lo darán a otra persona. Aparte del dinero, todo en el trabajo nuevo es mejor.\",\"itemIds\":[\"enb1m2while\",\"enb1m2sincecausal\",\"enb1m2otherwise\",\"enb1m2apartfrom\"],\"tip\":\"Los dos distractores no son casuales: «due to» pide un sustantivo (y detrás de los huecos hay frases enteras) y «at least» no encaja en ninguno. Descartarlos por lo que va DETRÁS es la técnica del Reading Part 1.\"},{\"id\":\"enb1m2l8e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Although the pay is good, but the hours are bad.\",\"answers\":[\"Although the pay is good, the hours are bad.\"],\"why\":\"En español decimos «aunque… pero…» y suena bien. En inglés uno de los dos sobra: o «Although…, …» o «…, but…», nunca los dos.\",\"translation\":\"Aunque el sueldo es bueno, el horario es malo.\",\"itemIds\":[\"enb1m1although\",\"enb1m2while\"]},{\"id\":\"enb1m2l8e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I left due to the hours were terrible.\",\"answers\":[\"I left due to the hours.\"],\"why\":\"«due to» pide un sustantivo, no una frase con verbo. Si quieres la frase entera, el conector es «because»: «I left because the hours were terrible».\",\"translation\":\"Me fui por el horario.\",\"itemIds\":[\"enb1m2dueto\"]},{\"id\":\"enb1m2l8e6\",\"type\":\"mc\",\"prompt\":\"La palabra que hace dos cosas\",\"question\":\"«Since I speak Spanish, they took me on.» Aquí «since» significa…\",\"options\":[\"«como», da la razón\",\"«desde», marca el punto de arranque\",\"«aunque», marca contraste\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el otro «since», el del módulo 1 («since March»). Ahí detrás va una fecha; aquí va una frase entera en presente.\",\"El contraste sería «although» o «while». «Since» nunca contrasta.\"],\"itemIds\":[\"enb1m2sincecausal\",\"enb1m1sincemarch\"],\"tip\":\"Cómo distinguirlos en un texto: si detrás hay una fecha o un momento, es «desde». Si hay una frase que explica el porqué, es «como».\"},{\"id\":\"enb1m2l8e7\",\"type\":\"transform\",\"prompt\":\"Sube el registro del contraste\",\"source\":\"The pay is good, but the hours are terrible.\",\"instruction\":\"Dilo empezando por «While…»\",\"answers\":[\"While the pay is good, the hours are terrible\",\"While the pay is good, the hours are terrible.\",\"While the pay is good the hours are terrible\"],\"translation\":\"Si bien el sueldo es bueno, el horario es terrible.\",\"hints\":[\"El «but» desaparece\",\"While the pay is good, ...\"],\"itemIds\":[\"enb1m2while\"],\"tip\":\"Un «but» al principio de un texto de 110 palabras es normal; tres seguidos, no. Cambiar uno por «While…» o «Although…» sube el criterio de coherencia sin añadir ni una idea nueva.\"},{\"id\":\"enb1m2l8e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Manda el currículum hoy; si no, se te pasa.\",\"answers\":[\"Send your CV today, otherwise you'll miss it\",\"Send your CV today, otherwise you will miss it\",\"Send your CV today; otherwise, you'll miss it\"],\"hint\":\"El «si no» de una sola palabra\",\"itemIds\":[\"enb1m2otherwise\",\"enb1m2cv\"],\"tip\":\"«otherwise» lleva dentro toda la condición negativa: equivale a «if you don't». Una palabra en vez de tres, y suena mejor.\"},{\"id\":\"enb1m2l8e9\",\"type\":\"type\",\"prompt\":\"Producción con conector\",\"question\":\"Aparte del sueldo, todo va bien.\",\"answers\":[\"Apart from the pay, everything is fine\",\"Apart from the salary, everything is fine\",\"Apart from the money, everything is fine\"],\"hints\":[\"Empieza por «Apart…»\",\"Apart ... the pay, everything is fine\"],\"itemIds\":[\"enb1m2apartfrom\"],\"tip\":\"«Apart from» + sustantivo. Si detrás quieres un verbo, va en -ing: «Apart from working weekends, it's perfect».\"},{\"id\":\"enb1m2l8e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, te escribe. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! You said you were fed up with the café — did anything come of that job you told me about? What's it actually like, and who are the people? I'm down in London in November, so tell me when I can come and see you.\"},\"bullets\":[\"Cuéntale que has dejado el café y a qué puesto te has presentado.\",\"Describe el trabajo y a la gente con al menos una relativa.\",\"Invítala a pasarse cuando venga y di qué día te va bien.\"],\"checks\":[{\"re\":\"(handed in|notice|left the café|quit)\",\"label\":\"Le cuentas que dejas el café\"},{\"re\":\"\\\\b(who|which|whose|that)\\\\b\",\"label\":\"Describes el puesto o a la gente con una relativa\"},{\"re\":\"(come|visit|see the place|when you)\",\"label\":\"La invitas y le das un día concreto\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea de reacción a su mensaje\",\"Punto 1 — la noticia: «I've finally handed in my notice. The job I applied for is…»\",\"Punto 2 — la gente y el puesto, con relativa: «My new boss, who…, says…» / «…, which means…»\",\"Punto 3 — la visita: «Since you're coming down in November, come and see the place» + un día concreto\",\"Cierre corto y tu nombre. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"though\",\"since\",\"besides\",\"therefore\",\"otherwise\",\"at least\",\"apart from\",\"due to\",\"for instance\",\"of course\",\"anyway\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nThanks for your message! You were right about the café: I've finally handed in my notice. The job I applied for is at the community library, twenty hours a week, and they took me on last Friday.\\nThe best part is the people. My new boss, who used to be a teacher, says I can do a course in the spring, which means real prospects at last. Of course the pay is a bit lower, although the shifts suit me much better.\\nSince you're coming down in November, come and see the place. I finish at six on Fridays, so any evening is fine.\\nValeria\",\"itemIds\":[\"enb1m2handinnotice\",\"enb1m2jobiappliedfor\",\"enb1m2whichmeans\",\"enb1m2prospects\",\"enb1m2suitme\",\"enb1m2sincecausal\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo: tres conectores distintos (of course, although, since), dos relativas («who used to be a teacher», «which means») y ni un «Yours sincerely». La despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m2l8e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"At least the hours suit me.\",\"translation\":\"Al menos el horario me viene bien.\",\"hints\":[\"Empieza por «At…»\",\"At ... the hours suit me.\"],\"itemIds\":[\"enb1m2atleast\",\"enb1m2suitme\"],\"tip\":\"«At least» se pega y suena «a-tlíist». Y ojo: «suit me», no «suit TO me» — el español mete un «a» que aquí no existe.\"},{\"id\":\"enb1m2l8e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el balance del cambio\",\"text\":\"While the pay is lower, the shifts suit me, and at least there are prospects.\",\"phonetic\":\"uáil de péi is̬ LÓU-a, de shifts siúut mi, and at LÍIST déa aa PRÓS-pekts\",\"translation\":\"Si bien el sueldo es más bajo, los turnos me vienen bien y al menos hay perspectivas.\",\"itemIds\":[\"enb1m2while\",\"enb1m2suitme\",\"enb1m2atleast\",\"enb1m2prospects\"],\"tip\":\"Tres conectores en una frase de quince palabras, y ninguno repetido. Es exactamente la partitura que pide el Speaking: encadenar, no complicar.\"},{\"id\":\"enb1m2l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos personas discuten sobre el cambio. Toma notas. Aquí, una sola escucha — el examen te dará dos.\",\"notepad\":true,\"audio\":\"So you're taking it? Two pounds an hour less?|Two pounds less, yes. But there's a course after six months, and the café was never going to give me that.|I know, but two pounds an hour over a year is a lot of money.|It is. Although if I stay where I am, in five years I'm still on the till, only older. At least this way something changes.|Fair enough. I'd probably have stayed, mind you.|You would. And you'd have been fine. I wouldn't.\",\"question\":\"¿En qué están de acuerdo los dos?\",\"options\":[\"En que el nuevo trabajo paga menos\",\"En que el curso no compensa la bajada de sueldo\",\"En que el café tenía futuro\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Eso lo dice solo la segunda voz, y la primera lo discute.\",\"La primera voz dice justo lo contrario: «the café was never going to give me that».\"],\"itemIds\":[\"enb1m2while\",\"enb1m2atleast\",\"enb1m2prospects\"],\"tip\":\"«mind you» y «fair enough» son concesiones de calle: significan «bueno, todo hay que decirlo» y «vale, lo acepto». Cuando las oigas, la persona está cediendo terreno sin darte la razón del todo.\"}]}],\"resources\":[{\"label\":\"Cambridge English — B1 Preliminary, Writing sample answers\",\"url\":\"https://www.cambridgeenglish.org/exams-and-tests/qualifications/preliminary/preparation/\",\"note\":\"Busca los «sample answers with examiner comments» del Writing. Lee un texto de banda alta y otro de banda baja y cuenta los conectores de cada uno: la diferencia salta a la vista.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gra
