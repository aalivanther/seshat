hl», la concesión que el examen premia\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Trabajar desde casa\",\"itemIds\":[\"b1m2homeoffice\",\"b1m2imhomeoffice\",\"b1m2pendeln\",\"b1m2obwohl\",\"b1m2vereinbaren\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: obwohl manda el verbo al final; trotzdem provoca inversión\",\"body\":\"$17\",\"table\":[[\"conector\",\"familia\",\"orden\"],[\"obwohl\",\"subordinante\",\"…, obwohl ich müde bin\"],[\"weil\",\"subordinante\",\"…, weil ich müde bin\"],[\"trotzdem\",\"adverbio\",\"Trotzdem bin ich müde\"],[\"deshalb\",\"adverbio\",\"Deshalb bin ich müde\"],[\"aber\",\"coordinante\",\"…, aber ich bin müde\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l2e1\",\"type\":\"bucket\",\"prompt\":\"¿Verbo al final o inversión?\",\"categories\":[\"verbo AL FINAL (…, obwohl ich müde bin)\",\"INVERSIÓN (trotzdem bin ich müde)\"],\"items\":[{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"weil\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"damit\",\"bucket\":0},{\"text\":\"außerdem\",\"bucket\":1}],\"itemIds\":[\"b1m2obwohl\",\"b1m2damit\",\"a2m6weil\",\"a2m6deshalb\"],\"tip\":\"Si el conector se puede sustituir por «por eso / además / aun así», hay inversión. Si equivale a «porque / aunque / para que», el verbo se va al final.\"},{\"id\":\"b1m2l2e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich arbeite weiter, obwohl ich bin müde.\",\"answers\":[\"Ich arbeite weiter, obwohl ich müde bin.\"],\"why\":\"obwohl es subordinante: manda el verbo conjugado al FINAL de su frase, igual que weil. El español «aunque estoy cansado» no mueve nada y de ahí sale el calco.\",\"translation\":\"Sigo trabajando aunque estoy cansado.\",\"itemIds\":[\"b1m2obwohl\"]},{\"id\":\"b1m2l2e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Trotzdem ich arbeite gern im Homeoffice.\",\"answers\":[\"Trotzdem arbeite ich gern im Homeoffice.\"],\"why\":\"trotzdem es un adverbio en posición 1: el verbo tiene que ir inmediatamente detrás y el sujeto pasa al tercer lugar.\",\"translation\":\"Aun así me gusta trabajar desde casa.\",\"itemIds\":[\"b1m2homeoffice\"]},{\"id\":\"b1m2l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el conector\",\"text\":\"Ich gehe ins Büro, ___ ich zu Hause arbeiten könnte.\",\"answers\":[\"obwohl\"],\"translation\":\"Voy a la oficina aunque podría trabajar en casa.\",\"hints\":[\"El verbo «könnte» está al final → conector subordinante\",\"ob-wohl\"],\"itemIds\":[\"b1m2obwohl\",\"b1m2homeoffice\"],\"tip\":\"Pista de detective: si el verbo ya está al final, el hueco solo admite un subordinante. La forma te dice qué palabra falta.\"},{\"id\":\"b1m2l2e5\",\"type\":\"transform\",\"prompt\":\"Cambia de conector sin cambiar la idea\",\"source\":\"Ich bin müde. Trotzdem arbeite ich weiter.\",\"instruction\":\"Dilo con «obwohl» en una sola frase\",\"answers\":[\"Ich arbeite weiter, obwohl ich müde bin\",\"Obwohl ich müde bin, arbeite ich weiter\"],\"translation\":\"Sigo trabajando aunque estoy cansado.\",\"hints\":[\"obwohl manda el verbo al final\",\"Ich arbeite weiter, obwohl ich müde ...\"],\"itemIds\":[\"b1m2obwohl\"],\"tip\":\"Las dos versiones valen: subordinada detrás o delante. Si la pones delante, la principal empieza con el verbo — «Obwohl ich müde bin, ARBEITE ich».\"},{\"id\":\"b1m2l2e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el testimonio con los conectores\",\"text\":\"Ich arbeite gern im Homeoffice, ___ mir die Kollegen manchmal fehlen. Früher habe ich jeden Tag eine Stunde gependelt. ___ bin ich jetzt viel entspannter. Ich spare auch viel Geld, ___ ich nicht mehr mit dem Zug fahre.\",\"answers\":[\"obwohl\",\"Deshalb\",\"weil\"],\"bank\":[\"obwohl\",\"Deshalb\",\"weil\",\"damit\",\"aber\",\"denn\"],\"translation\":\"Me gusta teletrabajar, aunque a veces echo de menos a los compañeros. Antes me desplazaba una hora al día. Por eso ahora estoy mucho más relajado. También ahorro mucho dinero, porque ya no voy en tren.\",\"itemIds\":[\"b1m2obwohl\",\"b1m2homeoffice\",\"b1m2pendeln\",\"a2m6deshalb\"],\"tip\":\"Mira el orden de palabras y luego el sentido: en el 1º y el 3º el verbo está al final (subordinante), en el 2º viene inmediatamente detrás del hueco (adverbio). Y entre obwohl y weil decide el significado: concesión o causa.\"},{\"id\":\"b1m2l2e7\",\"type\":\"mc\",\"prompt\":\"Vocabulario del trayecto\",\"question\":\"„Ich pendle jeden Tag nach München.“\",\"options\":[\"Me desplazo cada día a Múnich por trabajo\",\"Me mudo a Múnich\",\"Viajo a Múnich de vacaciones\"],\"answer\":0,\"whyWrong\":[null,\"«mudarse» sería umziehen\",\"«ir de vacaciones» sería in den Urlaub fahren\"],\"itemIds\":[\"b1m2pendeln\",\"b1m2imhomeoffice\"],\"tip\":\"pendeln viene de «das Pendel» (el péndulo): ir y volver, ir y volver. La imagen lo explica todo.\"},{\"id\":\"b1m2l2e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich arbeite zwei Tage im Homeoffice\",\"translation\":\"Teletrabajo dos días\",\"hints\":[\"im Homeoffice, con «im»\",\"Ich arbeite zwei Tage ...\"],\"itemIds\":[\"b1m2imhomeoffice\"]},{\"id\":\"b1m2l2e9\",\"type\":\"build\",\"prompt\":\"Construye la fórmula del debate\",\"target\":\"So kann man Familie und Beruf besser vereinbaren\",\"translation\":\"Así se pueden conciliar mejor familia y trabajo\",\"distractors\":[\"vereinbart\",\"wird\"],\"itemIds\":[\"b1m2vereinbaren\"],\"tip\":\"«Familie und Beruf vereinbaren» es una colocación fija: aparece en casi todos los textos de este tema. Apréndela entera.\"},{\"id\":\"b1m2l2e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «obwohl»\",\"source\":\"Obwohl das Homeoffice bequem ist, fehlen mir die Kollegen.\",\"forbid\":[\"obwohl\"],\"answers\":[\"Das Homeoffice ist bequem, aber mir fehlen die Kollegen\",\"Das Homeoffice ist bequem, aber die Kollegen fehlen mir\",\"Das Homeoffice ist zwar bequem, aber mir fehlen die Kollegen\",\"Das Homeoffice ist bequem. Trotzdem fehlen mir die Kollegen\"],\"translation\":\"Aunque el teletrabajo es cómodo, echo de menos a los compañeros.\",\"hints\":[\"Dos frases con «aber», o dos frases con «trotzdem»\",\"Das Homeoffice ist bequem, aber ...\"],\"itemIds\":[\"b1m2obwohl\",\"b1m2homeoffice\"],\"tip\":\"Tener tres maneras de conceder (obwohl / trotzdem / zwar…aber) es exactamente lo que mide el criterio Wortschatz: Spektrum.\"},{\"id\":\"b1m2l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Voy a la oficina aunque podría trabajar en casa\",\"answers\":[\"Ich gehe ins Büro, obwohl ich zu Hause arbeiten könnte\",\"Obwohl ich zu Hause arbeiten könnte, gehe ich ins Büro\"],\"hints\":[\"obwohl + verbo conjugado al final: ... arbeiten könnte\",\"Ich gehe ins Büro, obwohl ich ...\"],\"itemIds\":[\"b1m2obwohl\",\"b1m2koennte\"],\"tip\":\"Fíjate en el final: «arbeiten könnte» — el modal conjugado va DETRÁS del infinitivo. Ese orden es puro B1.\"},{\"id\":\"b1m2l2e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: un consejo en la radio · tarea 1 de 2. Dos escuchas.\",\"audio\":\"… und deshalb sagen wir immer: Homeoffice ist kein Geschenk, Homeoffice ist Organisation. Wer zu Hause arbeitet, spart sich zwar das Pendeln — in Berlin sind das im Schnitt fast eine Stunde am Tag —, aber er verliert die kurzen Gespräche im Flur. Und genau da entstehen, ähm, die meisten guten Ideen. Mein Rat ist deshalb: zwei Tage zu Hause, drei im Büro.\",\"question\":\"„Wer im Homeoffice arbeitet, spart sich in Berlin im Schnitt fast eine Stunde am Tag.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo dice entre guiones: «in Berlin sind das im Schnitt fast eine Stunde am Tag»\"],\"itemIds\":[\"b1m2homeoffice\",\"b1m2pendeln\"],\"tip\":\"El dato viaja dentro de un inciso, con la voz más baja. En el Teil 1 los incisos son justo donde se esconde la cifra.\"},{\"id\":\"b1m2l2e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo audio, segunda tarea. Dos escuchas.\",\"audio\":\"… und deshalb sagen wir immer: Homeoffice ist kein Geschenk, Homeoffice ist Organisation. Wer zu Hause arbeitet, spart sich zwar das Pendeln — in Berlin sind das im Schnitt fast eine Stunde am Tag —, aber er verliert die kurzen Gespräche im Flur. Und genau da entstehen, ähm, die meisten guten Ideen. Mein Rat ist deshalb: zwei Tage zu Hause, drei im Büro.\",\"question\":\"¿Qué recomienda el ponente?\",\"options\":[\"Dos días en casa y tres en la oficina\",\"Teletrabajar todos los días\",\"Volver del todo a la oficina\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Avisa justo de lo que se pierde trabajando siempre en casa\",\"No pide volver: pide mezclar\"],\"itemIds\":[\"b1m2imhomeoffice\"],\"tip\":\"La recomendación llega al final, tras «mein Rat» o «deshalb». Si te pierdes al principio, no cierres el oído.\"}]}],\"resources\":[{\"label\":\"Nachrichtenleicht — Arbeit\",\"url\":\"https://www.nachrichtenleicht.de/\",\"note\":\"Noticias en lenguaje sencillo sobre el mundo laboral: obwohl y trotzdem en textos reales.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-a
