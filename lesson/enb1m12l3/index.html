u003e, ya sabes que la respuesta es una hora; si pone \u003ci\u003e«Number of language teachers»\u003c/i\u003e, es un número. \u003cb\u003eLee los siete rótulos antes de que empiece el audio\u003c/b\u003e y sabrás, hueco por hueco, qué forma tiene la respuesta que estás esperando.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa otra mitad del regalo: los huecos van EN ORDEN.\u003c/b\u003e El monólogo los da uno detrás de otro. Si has perdido el tres, el cuatro llega después — no vuelvas atrás, sigue adelante y recupéralo en la segunda escucha.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la regla que más puntos regala: no escribas de más.\u003c/b\u003e Si el rótulo dice \u003ci\u003e«Best place to meet teachers»\u003c/i\u003e, la respuesta es \u003ci\u003e«(at) reception»\u003c/i\u003e, no \u003ci\u003e«the best place is at reception»\u003c/i\u003e. El baremo oficial acepta variantes de la misma respuesta —\u003ci\u003e«(at) reception»\u003c/i\u003e, \u003ci\u003e«16 / sixteen»\u003c/i\u003e, \u003ci\u003e«second / 2nd»\u003c/i\u003e—, pero lo que no perdona es la frase entera: \u003cb\u003esi te pasas del máximo, vale cero aunque el dato esté ahí dentro\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 4 — la discusión (6 puntos).\u003c/b\u003e Dos personas hablan de un tema y te preguntan por \u003cb\u003eideas clave, ejemplos, causa y efecto, contraste, y sobre todo por hecho frente a opinión y por la actitud de cada uno\u003c/b\u003e. La pista casi nunca es una palabra: es \u003cb\u003ecómo\u003c/b\u003e se dice. «It's fine, I suppose» y «It's fine!» son la misma palabra y la actitud contraria."])</script><script>self.__next_f.push([1,"18:T657,"])</script><script>self.__next_f.push([1,"Can I ask you honestly? Is it worth the money?|It depends what you want it for. And that isn't me dodging the question. It genuinely depends.|A hundred and something pounds is a lot.|It is a lot. So: is somebody actually asking you for it? A university, an employer, a vis t it. Nothing on the paper says you have to do them in order.|Nobody told me that.|Nobody tells anybody that. It isn't a trick. It's just that the paper is printed in one order and everybody assumes the order is a rule."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l3\",\"phaseId\":\"enb1m12\",\"title\":\"Listening: the note sheet\",\"subtitle\":\"Siete huecos que se escriben al dictado, y una discusión de la que hay que separar el hecho de la opinión\",\"minutes\":23,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de la ficha de notas\",\"itemIds\":[\"enb1m12thenotesheet\",\"enb1m12onetothreewords\",\"enb1m12spellingcounts\",\"enb1m12factnotopinion\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El único sitio del examen donde escribes al dictado\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l3e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de la ficha\",\"pairs\":[{\"target\":\"the note sheet\",\"source\":\"la ficha de notas, siete huecos\"},{\"target\":\"one to three words\",\"source\":\"lo que cabe en cada hueco\"},{\"target\":\"Spelling counts.\",\"source\":\"La ortografía puntúa.\"},{\"target\":\"a fact, not an opinion\",\"source\":\"un hecho, no una opinión\"}],\"itemIds\":[\"enb1m12thenotesheet\",\"enb1m12onetothreewords\",\"enb1m12spellingcounts\",\"enb1m12factnotopinion\"],\"tip\":\"«Spelling counts» es literal del baremo. Es la única parte del examen donde una letra de más te cuesta un punto entero.\"},{\"id\":\"enb1m12l3e2\",\"type\":\"mc\",\"prompt\":\"El tamaño de la respuesta\",\"question\":\"¿Cuánto puedes escribir en cada hueco de la Parte 3?\",\"options\":[\"De una a tres palabras.\",\"Una frase corta, siempre que quepa en la línea.\",\"Una sola palabra, nunca más.\"],\"answer\":0,\"whyWrong\":[null,\"La línea es larga a propósito: es una trampa visual. El máximo lo pone la instrucción, no el papel.\",\"Tres sí valen: «at the reception desk» es una respuesta perfectamente aceptable.\"],\"itemIds\":[\"enb1m12onetothreewords\",\"enb1m3nomorethanthree\"],\"tip\":\"Regla práctica: escribe lo mínimo que responda al rótulo. Si dudas entre dos y cinco palabras, quédate con dos — no hay premio por explicar.\"},{\"id\":\"enb1m12l3e3\",\"type\":\"listen\",\"prompt\":\"Dictado tipo Parte 3: escribe lo que suena, tal cual\",\"text\":\"The talk starts at half past six.\",\"translation\":\"La charla empieza a las seis y media.\",\"hints\":[\"Empieza por «The talk…»\",\"… starts at half past ___\"],\"itemIds\":[\"enb1m12thenotesheet\"],\"tip\":\"En la ficha real solo escribirías «half past six» o «6.30»: las dos valen. Aquí escribes la frase entera para entrenar el oído, pero el día D solo va el dato.\"},{\"id\":\"enb1m12l3e4\",\"type\":\"listen\",\"prompt\":\"Dictado tipo Parte 3: un nombre y un sitio\",\"text\":\"Ask for Mrs Beckett at reception.\",\"translation\":\"Pregunta por Mrs Beckett en recepción.\",\"hints\":[\"Empieza por «Ask for…»\",\"Ask for Mrs Beckett at ___\"],\"itemIds\":[\"enb1m12spellingcounts\"],\"tip\":\"«reception» con c, no con s. El baremo oficial acepta «(at) reception» con el «at» o sin él — pero no acepta «recepcion». Ahí es donde «Spelling counts» se vuelve dinero.\"},{\"id\":\"enb1m12l3e5\",\"type\":\"audiomc\",\"prompt\":\"Parte 3: monólogo largo. Usa el cuaderno MIENTRAS suena — en el examen se puede. Dos escuchas.\",\"audio\":\"Good evening, and welcome to the centre. A few practical things before we start. The library is open from nine until half past seven, Monday to Friday, and until one on Saturdays. If you want to book a computer, you do that at reception, not online — the online system was taken down in March. There are fourteen language teachers here at the moment, and the art exhibition on the first floor this month is about the canals. Lunch is served on the second floor.\",\"question\":\"¿Dónde se reservan los ordenadores?\",\"options\":[\"En recepción\",\"Por internet\",\"En la primera planta\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Justo lo contrario: «not online — the online system was taken down in March».\",\"La primera planta es la exposición, no las reservas.\"],\"itemIds\":[\"enb1m12thenotesheet\",\"enb1m3makenotes\"],\"tip\":\"Este audio es el patrón exacto de la Parte 3: siete datos sueltos, en orden, y una negación en medio para castigar a quien caza palabras sueltas. Escribe mientras suena: retener siete datos de cabeza no mide comprensión, mide memoria.\"},{\"id\":\"enb1m12l3e6\",\"type\":\"audiomc\",\"prompt\":\"Parte 4: una discusión. La pregunta va por la ACTITUD. Dos escuchas.\",\"audio\":\"«Have you seen they're putting the exam fee up again?» «I know. Mind you, it hasn't gone up since 2019, so it was going to happen sooner or later.» «That's true, I suppose. It's still eighty pounds, though.» «It is. But I'd rather pay eighty once than sixty twice.»\",\"question\":\"¿Qué actitud tiene la segunda persona ante la subida?\",\"options\":[\"La entiende, aunque no le guste.\",\"Está indignada y piensa protestar.\",\"Le da exactamente igual.\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"No hay ni una palabra de queja: «it was going to happen sooner or later» es lo contrario de indignarse.\",\"Sí le importa: por eso argumenta. A quien le da igual no le busca explicación a nada.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m6notwhattheysay\"],\"tip\":\"«Mind you» es la señal de que viene un matiz que corrige lo anterior. En la Parte 4 esas piezas —mind you, I suppose, though, to be fair— son literalmente la respuesta: marcan la actitud sin nombrarla.\"},{\"id\":\"enb1m12l3e7\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿hecho u opinión? (es media Parte 4)\",\"categories\":[\"Un hecho: se puede comprobar\",\"Una opinión: es de quien habla\"],\"items\":[{\"text\":\"The fee went up in March.\",\"bucket\":0},{\"text\":\"The fee is far too high.\",\"bucket\":1},{\"text\":\"There are fourteen teachers here.\",\"bucket\":0},{\"text\":\"There aren't nearly enough teachers.\",\"bucket\":1},{\"text\":\"The library closes at half past seven.\",\"bucket\":0},{\"text\":\"The library should stay open later.\",\"bucket\":1}],\"itemIds\":[\"enb1m12factnotopinion\",\"enb1m4factoropinion\"],\"tip\":\"Las opiniones llevan casi siempre una marca: un comparativo (too high, not enough), un modal (should) o un adverbio de valoración (unfortunately, luckily). Los hechos llevan números y fechas.\"},{\"id\":\"enb1m12l3e8\",\"type\":\"mc\",\"prompt\":\"La regla que más puntos regala\",\"question\":\"El rótulo del hueco dice «Best place to meet teachers». Oyes: «If you want to see a teacher, the best place is at reception, in the mornings.» ¿Qué escribes?\",\"options\":[\"at reception\",\"the best place is at reception\",\"at reception in the mornings, if you want to see a teacher\"],\"answer\":0,\"whyWrong\":[null,\"Repite el rótulo, que ya está impreso, y se come el máximo de tres palabras.\",\"Once palabras donde caben dos. Vale cero aunque el dato correcto esté ahí dentro.\"],\"itemIds\":[\"enb1m12afourwordanswer\",\"enb1m12thenotesheet\"],\"tip\":\"El rótulo ya contiene medio dato: no lo copies, complétalo. Lee los siete rótulos antes de que empiece el audio y sabrás si esperas una hora, un número, un sitio o un nombre.\"},{\"id\":\"enb1m12l3e9\",\"type\":\"cloze\",\"prompt\":\"Completa la instrucción de la ficha\",\"text\":\"Write ___ to three words in each gap.\",\"answers\":[\"one\"],\"translation\":\"Escribe de una a tres palabras en cada hueco.\",\"hints\":[\"Es el número más pequeño posible\",\"o-n-e\"],\"itemIds\":[\"enb1m12onetothreewords\"],\"tip\":\"Ojo, porque en el papel real esto aparece como «NO MORE THAN THREE WORDS», en mayúsculas. Es la misma instrucción con otro traje.\"},{\"id\":\"enb1m12l3e10\",\"type\":\"gapbank\",\"prompt\":\"Rellena la ficha de notas con lo que se ha dicho en el audio de arriba\",\"text\":\"Where to book computers: at ___ · Number of language teachers: ___ · Topic of art exhibition: the ___ · Floor for lunch: the ___ floor\",\"answers\":[\"reception\",\"fourteen\",\"canals\",\"second\"],\"bank\":[\"reception\",\"fourteen\",\"canals\",\"second\",\"forty\",\"first\"],\"translation\":\"Dónde reservar ordenadores: en recepción · Número de profesores de idiomas: catorce · Tema de la exposición: los canales · Planta del comedor: la segunda\",\"itemIds\":[\"enb1m12thenotesheet\",\"enb1m12spellingcounts\"],\"tip\":\"Los dos distractores son los dos errores clásicos de la Parte 3: «forty» por «fourteen» (el golpe cambia de sitio: FÓO-ti frente a foo-TÍIN) y «first» por «second» (la exposición estaba en la primera; la comida, en la segunda).\"},{\"id\":\"enb1m12l3e11\",\"type\":\"errorfix\",\"prompt\":\"Corrige el contable que se ha colado\",\"wrong\":\"How many time do you need for the notes?\",\"answers\":[\"How much time do you need for the notes?\"],\"why\":\"«time» en el sentido de tiempo es \u003cb\u003eincontable\u003c/b\u003e: va con \u003ci\u003emuch\u003c/i\u003e, no con \u003ci\u003emany\u003c/i\u003e. En español «cuánto» sirve para todo, así que el reparto hay que aprenderlo palabra a palabra: \u003ci\u003emuch time, much money, much advice, much information\u003c/i\u003e frente a \u003ci\u003emany hours, many pounds, many questions\u003c/i\u003e. Y ojo, porque «time» sí es contable cuando significa «vez»: \u003ci\u003ehow many times\u003c/i\u003e = cuántas veces.\",\"translation\":\"¿Cuánto tiempo necesitas para las notas?\",\"itemIds\":[\"enb1m12thenotesheet\"]},{\"id\":\"enb1m12l3e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"La ortografía puntúa: una palabra mal escrita vale cero.\",\"answers\":[\"Spelling counts: a misspelt word scores zero\",\"Spelling counts: a word with a spelling mistake scores zero\",\"Spelling counts. A misspelled word scores zero\"],\"hint\":\"La primera mitad son dos palabras\",\"itemIds\":[\"enb1m12spellingcounts\"],\"tip\":\"Y solo en esta parte. En el Reading Part 4, donde también escribes, el baremo es más blando con la ortografía porque copias del texto. Aquí no hay texto de dónde copiar: hay oído.\"},{\"id\":\"enb1m12l3e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lee los siete rótulos antes de escuchar: cada uno te dice qué tipo de respuesta esperas.\",\"answers\":[\"Read the seven headings before you listen: each one tells you what kind of answer to expect\",\"Read the seven headings before you listen. Each one tells you what kind of answer to expect\",\"Read the seven headings before listening: each one tells you what sort of answer to expect\"],\"hints\":[\"«rótulo» aquí es heading\",\"Read the seven headings before you listen: each one…\"],\"itemIds\":[\"enb1m12thenotesheet\"],\"tip\":\"Fíjate otra vez: «before you LISTEN», presente. Detrás de «before» no va futuro nunca, aunque estés hablando del sábado que viene.\"},{\"id\":\"enb1m12l3e14\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, cinco preguntas. Es el formato exacto del Listening Part 4: léelas TODAS antes del play y usa el cuaderno. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿De qué dice ella que depende que el examen merezca la pena?\",\"options\":[\"De si alguien te lo va a pedir: una universidad, una empresa, una oficina de visados\",\"De cuánto cuesta la tasa ese año\",\"De si te ves capaz de aprobarlo\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La tasa aparece después, y como razón para no aplazarlo, no como criterio.\",\"La probabilidad de aprobar la trata al final, y dice que el riesgo no es ese.\"],\"itemIds\":[\"enb1m12writtenexam\",\"enb1m12spokenexam\"],\"tip\":\"Ítem de idea global: cae en los primeros veinte segundos y el resto del audio lo desarrolla. Si lo tienes, no lo cambies por nada de lo que oigas después.\"},{\"id\":\"enb1m12l3e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: las dos razones para no aplazarlo.\",\"audio\":\"$19\",\"question\":\"¿Por qué le aconseja presentarse ahora y no dentro de un año?\",\"options\":[\"Porque la tasa sube casi todos los años y su inglés tampoco espera: acabaría haciendo el examen equivocado\",\"Porque en un año cambia el formato del examen\",\"Porque las plazas del centro se agotan\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Del formato no se dice nada. Lo que cambia en ocho meses es el nivel del candidato.\",\"De plazas no se habla en este audio.\"],\"itemIds\":[\"enb1m12twohoursforty\",\"enb1m12stamina\"],\"tip\":\"Dos razones anunciadas —«for two reasons»— y las dos cuentan. Cuando alguien numera en voz alta, prepárate: el examen pregunta por las dos o por la que no esperabas.\"},{\"id\":\"enb1m12l3e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: qué pasa si suspendes.\",\"audio\":\"$1a\",\"question\":\"¿Qué le dice sobre suspender?\",\"options\":[\"Que puede repetirlo sin límite y que el certificado no dice cuántas veces lo hiciste\",\"Que solo se puede repetir una vez al año\",\"Que si suspendes te devuelven media tasa\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice «there's no limit»: ni una vez al año ni ninguna otra restricción.\",\"De devoluciones no se habla en ningún momento.\"],\"itemIds\":[\"enb1m12eachparttwice\",\"enb1m12writtenexam\"],\"tip\":\"Dato administrativo puro, y de los que tranquilizan. En el Part 4 casi siempre hay uno: apúntalo aunque parezca de relleno, porque suele haber pregunta.\"},{\"id\":\"enb1m12l3e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: hecho contra opinión, y ojo con la trampa.\",\"audio\":\"$1b\",\"question\":\"¿Cuál dice que es el riesgo real para este candidato?\",\"options\":[\"Quedarse sin tiempo\",\"Suspender por nivel de inglés\",\"Equivocarse de examen y hacer el B2\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo descarta expresamente: «failing is not the risk».\",\"Eso es lo que les pasó a otros dos alumnos suyos, y sería el riesgo si aplazara un año.\"],\"itemIds\":[\"enb1m12stamina\",\"enb1m12twohoursforty\",\"enb1m12factnotopinion\"],\"tip\":\"«Failing is not the risk. Running out of time is.» Dos frases cortas, una niega y la otra afirma, y la segunda se come el verbo. El inglés hablado remata así, y en el examen esa figura suele contener la respuesta.\"},{\"id\":\"enb1m12l3e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5: la estrategia con la que cierra.\",\"audio\":\"$1c\",\"question\":\"¿Qué le recomienda hacer con las dos tareas de Writing?\",\"options\":[\"Escribir primero la segunda, que es la más larga y vale lo mismo\",\"Escribir las dos en orden pero más deprisa\",\"Dejar la segunda a medias si no da tiempo\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La velocidad no es su consejo: su consejo es cambiar el ORDEN.\",\"No lo dice nadie, y además la Tarea 2 vale doce puntos igual que la Tarea 1: dejarla a medias es tirar la mitad.\"],\"itemIds\":[\"enb1m12thetwofunctions\",\"enb1m12coverallthreepoints\"],\"tip\":\"Y esto no es un truco de academia: en la hoja del examen no hay ninguna instrucción que obligue a hacerlas en orden. Lo comprobamos en el Practice Paper. Protege la tarea larga y escribe la corta con lo que sobre.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1d\",\"6\",{}]]\n"])</script></body></html>
