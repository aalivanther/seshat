push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"a2examl1\",\"phaseId\":\"a2exam\",\"title\":\"El examen por dentro\",\"subtitle\":\"El mapa del Goethe-Zertifikat A2 — y en qué cambia respecto al A1\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El metalenguaje nuevo del examen A2\",\"itemIds\":[\"a2waehlensie\",\"a2loesung\",\"a2antwortbogen\",\"a2zuzweit\",\"a2bestehen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El Goethe-Zertifikat A2, por dentro\",\"body\":\"$17\",\"table\":[[\"Destreza\",\"Tiempo\",\"Qué haces\"],[\"Hören\",\"~30 min\",\"4 Teile · 20 ítems: escuchar y marcar\"],[\"Lesen\",\"30 min\",\"4 Teile · 20 ítems: leer y marcar\"],[\"Schreiben\",\"30 min\",\"2 Teile: SMS (~20-30 palabras) + correo (~30-40)\"],[\"Sprechen\",\"~15 min\",\"3 Teile, EN PAREJA: preguntas, tu vida, un plan\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Qué cambia respecto al A1 que ya pasaste\",\"body\":\"Tres diferencias clave. 1) El oral es \u003cb\u003ezu zweit\u003c/b\u003e: trabajas EN PAREJA con otro candidato, no solo con el examinador — haréis preguntas el uno al otro y planearéis algo juntos. 2) Los textos son más largos y hay más Teile (4 en Hören y en Lesen, no 3), pero la mecánica es la misma que ya dominas: Beispiel primero, dato concreto después. 3) Ya no hay \u003cb\u003ebuchstabieren\u003c/b\u003e: en el A2 nadie te pide deletrear — se espera que hables en frases. La buena noticia: todo lo que entrenaste para el Start Deutsch 1 sigue valiendo; el A2 solo sube un escalón.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl1e1\",\"type\":\"mc\",\"prompt\":\"Conoce tu examen\",\"question\":\"¿Cuánto necesitas para aprobar el Goethe-Zertifikat A2?\",\"options\":[\"El 100% de una destreza\",\"El 60% del total\",\"El 90% del total\"],\"answer\":1,\"whyWrong\":[\"Ninguna destreza pide el pleno, pero sí hay suelo: 45 en el escrito y 15 en el oral\",null,\"Con el 60% ya tienes el certificado — no pidas el 90 a tus nervios\"],\"itemIds\": ype\":\"mc\",\"prompt\":\"Estrategia de examen\",\"question\":\"Marcaste todas las respuestas en el cuadernillo, pero no en el Antwortbogen. ¿Qué pasa?\",\"options\":[\"No pasa nada, lo corrigen igual\",\"Solo puntúa lo que está en el Antwortbogen\",\"Te dan 5 minutos extra siempre\"],\"answer\":1,\"whyWrong\":[\"El cuadernillo no se corrige — es tu borrador\",null,\"No cuentes con tiempo extra: pasa tus respuestas sobre la marcha\"],\"itemIds\":[\"a2antwortbogen\"],\"tip\":\"Reserva un par de minutos por bloque para pasar respuestas al Antwortbogen. Es el despiste más caro del examen.\"},{\"id\":\"a2examl1e7\",\"type\":\"build\",\"prompt\":\"Construye tu objetivo\",\"target\":\"Ich will die Prüfung bestehen\",\"translation\":\"Quiero aprobar el examen\",\"distractors\":[\"bestanden\",\"gemacht\"],\"itemIds\":[\"a2bestehen\",\"pruefung\"],\"tip\":\"will en 2ª posición, bestehen cerrando la frase: la Satzklammer de siempre, ahora con tu meta dentro.\"},{\"id\":\"a2examl1e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quiero aprobar el examen\",\"answers\":[\"Ich will die Prüfung bestehen\",\"Ich möchte die Prüfung bestehen\"],\"hints\":[\"Modal will + infinitivo al final\",\"bestehen = aprobar; die Prüfung ya la conoces del A1\"],\"itemIds\":[\"a2bestehen\",\"pruefung\"],\"tip\":\"bestehen empieza por be-, como besuchen: en Perfekt tampoco llevará ge-. Lo verás en la última lección.\"}]}],\"resources\":[{\"label\":\"Goethe — materiales de práctica A2\",\"url\":\"https://www.goethe.de/ins/us/en/spr/prf/ueb/pa2.html\",\"note\":\"Descarga el examen modelo (Modellsatz) del Goethe-Zertifikat A2 y SOLO hojéalo hoy: localiza los 4 Teile de Hören y Lesen, los 2 de Schreiben y el Antwortbogen. Aún no lo resuelvas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme
