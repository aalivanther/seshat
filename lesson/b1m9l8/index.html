→ \u003cb\u003einversión\u003c/b\u003e (Allerdings \u003cb\u003ekostet er\u003c/b\u003e Zeit). \u003cb\u003eweil\u003c/b\u003e es subordinante → verbo al final. La trampa §6.3 se cobra aquí.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l8e1\",\"type\":\"match\",\"prompt\":\"Empareja la pieza del esqueleto con su Redemittel\",\"pairs\":[{\"target\":\"Meiner Meinung nach …\",\"source\":\"tesis: mi opinión\"},{\"target\":\"…, weil ich Angst vor dem Fliegen habe\",\"source\":\"razón\"},{\"target\":\"Letzten Sommer bin ich …\",\"source\":\"ejemplo propio\"},{\"target\":\"Natürlich ist der Flug billiger, allerdings …\",\"source\":\"concesión\"}],\"itemIds\":[\"b1m7feallerdings\",\"b1m9kurzstreckenflug\"]},{\"id\":\"b1m9l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Adverbio (inversión) o subordinante (verbo al final)?\",\"categories\":[\"adverbio → inversión\",\"subordinante → verbo al final\"],\"items\":[{\"text\":\"allerdings\",\"bucket\":0},{\"text\":\"weil\",\"bucket\":1},{\"text\":\"trotzdem\",\"bucket\":0},{\"text\":\"obwohl\",\"bucket\":1},{\"text\":\"außerdem\",\"bucket\":0},{\"text\":\"da\",\"bucket\":1},{\"text\":\"deshalb\",\"bucket\":0},{\"text\":\"sobald\",\"bucket\":1}],\"itemIds\":[\"b1m7feallerdings\",\"b1m8gesobald\"],\"tip\":\"En español «por eso» y «aunque» no cambian nada. En alemán deciden dónde va el verbo: es la trampa nº1 del B1 escrito.\"},{\"id\":\"b1m9l8e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige la inversión\",\"wrong\":\"Allerdings der Flug ist billiger als der Nachtzug.\",\"answers\":[\"Allerdings ist der Flug billiger als der Nachtzug.\"],\"why\":\"allerdings es un adverbio en posición 1: el verbo conjugado tiene que ir inmediatamente detrás (posición 2) y el sujeto se va al 3er lugar. El español «sin embargo el vuelo es…» no obliga a nada.\",\"translation\":\"Eso sí, el vuelo es más barato que el tren nocturno.\",\"itemIds\":[\"b1m7feallerdings\",\"b1m9nachtzug\",\"b1m9kurzstreckenflug\"]},{\"id\":\"b1m9l8e4a\",\"type\":\"cloze\",\"prompt\":\"Rellena el comentario — la razón\",\"text\":\"Ich fliege oft, ___ ich wenig Zeit habe. Natürlich ist ein Kurzstreckenflug billiger als der Nachtzug. Allerdings verliere ich am Flughafen zwei Stunden. Deshalb nehme ich für kurze Strecken lieber den Zug.\",\"answers\":[\"weil\"],\"translation\":\"Vuelo a menudo porque tengo poco tiempo. Claro que un vuelo corto es más barato que el tren nocturno. Eso sí, pierdo dos horas en el aeropuerto. Por eso, para trayectos cortos prefiero el tren.\",\"hints\":[\"Tras la coma con verbo al final → w-e-i-l\"],\"itemIds\":[\"b1m9kurzstreckenflug\"],\"tip\":\"«weil» manda «habe» al final de su frase. Los tres huecos que siguen son adverbios distintos: ahí el verbo va justo detrás, no al final.\"},{\"id\":\"b1m9l8e4b\",\"type\":\"cloze\",\"prompt\":\"Rellena el comentario — lo obvio\",\"text\":\"Ich fliege oft, weil ich wenig Zeit habe. ___ ist ein Kurzstreckenflug billiger als der Nachtzug. Allerdings verliere ich am Flughafen zwei Stunden. Deshalb nehme ich für kurze Strecken lieber den Zug.\",\"answers\":[\"Natürlich\"],\"translation\":\"Vuelo a menudo porque tengo poco tiempo. Claro que un vuelo corto es más barato que el tren nocturno. Eso sí, pierdo dos horas en el aeropuerto. Por eso, para trayectos cortos prefiero el tren.\",\"hints\":[\"Adverbio de «claro, obviamente», verbo justo detrás\",\"N... — lo esperable, sin sorpresa\"],\"itemIds\":[\"b1m9nachtzug\"],\"tip\":\"«Natürlich» presenta algo evidente antes de matizarlo con «Allerdings». Adverbio en posición 1: el verbo va justo detrás.\"},{\"id\":\"b1m9l8e4c\",\"type\":\"cloze\",\"prompt\":\"Rellena el comentario — el pero\",\"text\":\"Ich fliege oft, weil ich wenig Zeit habe. Natürlich ist ein Kurzstreckenflug billiger als der Nachtzug. ___ verliere ich am Flughafen zwei Stunden. Deshalb nehme ich für kurze Strecken lieber den Zug.\",\"answers\":[\"Allerdings\"],\"translation\":\"Vuelo a menudo porque tengo poco tiempo. Claro que un vuelo corto es más barato que el tren nocturno. Eso sí, pierdo dos horas en el aeropuerto. Por eso, para trayectos cortos prefiero el tren.\",\"hints\":[\"Adverbio de matiz, verbo justo detrás\",\"A... — introduce el pero\"],\"itemIds\":[\"b1m7feallerdings\"],\"tip\":\"«Allerdings» frena lo dicho antes: el vuelo es más barato, PERO se pierden dos horas. Sin este matiz, el texto sonaría a que volar no tiene ningún coste.\"},{\"id\":\"b1m9l8e4d\",\"type\":\"cloze\",\"prompt\":\"Rellena el comentario — la consecuencia\",\"text\":\"Ich fliege oft, weil ich wenig Zeit habe. Natürlich ist ein Kurzstreckenflug billiger als der Nachtzug. Allerdings verliere ich am Flughafen zwei Stunden. ___ nehme ich für kurze Strecken lieber den Zug.\",\"answers\":[\"Deshalb\"],\"translation\":\"Vuelo a menudo porque tengo poco tiempo. Claro que un vuelo corto es más barato que el tren nocturno. Eso sí, pierdo dos horas en el aeropuerto. Por eso, para trayectos cortos prefiero el tren.\",\"hints\":[\"Adverbio de consecuencia, verbo justo detrás\",\"D... — encadena una consecuencia\"],\"itemIds\":[],\"tip\":\"Las dos horas perdidas en el aeropuerto son la razón por la que, para trayectos cortos, prefiere el tren: «Deshalb» encadena esa consecuencia.\"},{\"id\":\"b1m9l8e5\",\"type\":\"build\",\"prompt\":\"Construye la concesión completa\",\"target\":\"Natürlich ist der Flug billiger, allerdings kostet er viel Zeit\",\"translation\":\"Claro que el vuelo es más barato, eso sí cuesta mucho tiempo\",\"distractors\":[\"er kostet\",\"weil\"],\"itemIds\":[\"b1m7feallerdings\",\"b1m9kurzstreckenflug\"],\"tip\":\"Dos inversiones en una frase: «Natürlich ist …» y «allerdings kostet …». Es el patrón que da puntos en Kohärenz.\"},{\"id\":\"b1m9l8e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 4 de 5 (el tiempo en la radio). Dos escuchas.\",\"audio\":\"Und zum Schluss das Wetter für morgen. Im Norden bleibt es den ganzen Tag grau, dazu weht ein kräftiger Wind von der See. Im Süden lockert es am Nachmittag auf, in den Alpen wird es sogar sonnig. Achtung für alle, die früh unterwegs sind: Auf den Straßen im Osten kann es morgens glatt sein. Die Höchstwerte liegen zwischen vier und elf Grad.\",\"question\":\"Im Norden scheint morgen am Nachmittag die Sonne.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"En el norte se queda gris todo el día; quien se despeja por la tarde es el sur\",null],\"itemIds\":[\"b1m9unterwegssein\"],\"tip\":\"El parte meteorológico es el texto más rápido del Teil 1 y va siempre por regiones: Norden, Süden, Osten, Westen. Coloca mentalmente el mapa antes de darle al play.\"},{\"id\":\"b1m9l8e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 4, segunda tarea. Mismo audio, dos escuchas.\",\"audio\":\"Und zum Schluss das Wetter für morgen. Im Norden bleibt es den ganzen Tag grau, dazu weht ein kräftiger Wind von der See. Im Süden lockert es am Nachmittag auf, in den Alpen wird es sogar sonnig. Achtung für alle, die früh unterwegs sind: Auf den Straßen im Osten kann es morgens glatt sein. Die Höchstwerte liegen zwischen vier und elf Grad.\",\"question\":\"¿De qué se avisa a quien salga temprano?\",\"options\":[\"De que puede haber hielo en las carreteras del este\",\"De lluvia fuerte en los Alpes\",\"De viento del sur\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"En los Alpes dice que hasta hará sol\",\"El viento sopla del mar, en el norte\"],\"itemIds\":[\"b1m9unterwegssein\"],\"tip\":\"Un dato para tu comentario de foro: el tren nocturno no depende del hielo de la carretera ni de la niebla del aeropuerto. Es un argumento real y concreto, de los que puntúan.\"},{\"id\":\"b1m9l8e6\",\"type\":\"paraphrase\",\"prompt\":\"Reformula la tesis sin repetir al otro\",\"source\":\"Der Nachtzug ist zu teuer.\",\"forbid\":[\"teuer\",\"Nachtzug\"],\"answers\":[\"Eine Fahrt im Schlafwagen kostet leider zu viel Geld\",\"Eine Fahrt im Schlafwagen kostet viel Geld\",\"Eine Fahrt im Schlafwagen kostet zu viel Geld\",\"Eine Fahrt im ,{\"id\":\"b1m9l8e10\",\"type\":\"write\",\"prompt\":\"Escribe tu comentario en el foro de la revista de viajes\",\"genre\":\"forum\",\"scenario\":\"En el foro de una revista de viajes, un lector ha publicado su opinión sobre los trenes nocturnos. Reacciona a su comentario con el tuyo (unas 80 palabras). Trátale de tú, como es normal en un foro.\",\"stimulus\":{\"author\":\"Jonas, 29 (Leserforum «Unterwegs»)\",\"text\":\"Nachtzüge sind ein schönes Märchen. Sie sind langsam, teuer und man schläft sowieso schlecht. Für 39 Euro fliege ich in einer Stunde nach Wien — warum sollte ich zwölf Stunden im Zug sitzen?\"},\"register\":\"du\",\"frame\":[\"Reacción: «Lieber Jonas, du schreibst, dass …»\",\"Tesis: «Meiner Meinung nach …»\",\"Razón + ejemplo propio: «…, weil …» / «Ich bin im Sommer …»\",\"Concesión: «Natürlich ist …, aber / allerdings …»\",\"Cierre: «Deshalb …»\"],\"bullets\":[\"Di tu opinión con «Meiner Meinung nach» o «Ich bin der Meinung, dass»\",\"Justifícala con una razón (weil / denn) y un ejemplo tuyo\",\"Reconoce el punto del otro con una concesión (natürlich / zwar … aber)\"],\"checks\":[{\"re\":\"(meiner meinung nach|ich bin der meinung)\",\"label\":\"tesis marcada\"},{\"re\":\"(weil|denn)\",\"label\":\"razón\"},{\"re\":\"(nat(ü|ue)rlich|zwar)[^.!?]{0,90}aber\",\"label\":\"concesión\"}],\"requireConnectors\":{\"min\":3,\"bank\":[\"außerdem\",\"trotzdem\",\"deshalb\",\"allerdings\",\"weil\",\"denn\",\"zwar\",\"aber\",\"einerseits\",\"andererseits\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Lieber Jonas, du schreibst, dass der Nachtzug zu teuer ist. Meiner Meinung nach lohnt sich die Fahrt trotzdem. Ich bin im Sommer von Wien nach Zürich gefahren, weil ich Angst vor dem Fliegen habe. Der Zug war zwar langsamer, aber ich habe gut geschlafen und morgens direkt im Zentrum gefrühstückt. Außerdem reise ich so umweltfreundlicher. Natürlich ist ein Kurzstreckenflug billiger, allerdings kostet er Zeit am Flughafen. Für solche Strecken nehme ich deshalb immer den Nachtzug.\",\"itemIds\":[\"b1m9nachtzug\",\"b1m9kurzstreckenflug\",\"b1m9umweltfreundlichreisen\",\"b1m7feallerdings\",\"b1m3eslohntsich\"],\"tip\":\"Dos cosas distintas: dejarte un punto de contenido te BAJA la banda de Erfüllung (cada punto vale su parte de la nota); quedarte por debajo del 50 % de las palabras pedidas o irte del tema es lo único que tumba la tarea entera a 0. Cuenta los puntos primero y las palabras después.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
