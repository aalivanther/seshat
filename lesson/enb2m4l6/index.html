ours told this paper they had not seen it. «Nobody was consulted,» said one resident, who asked not to be named. The claim has not been independently verified.\u003cbr/\u003e\u003cbr/\u003eIt is reported that a similar leak last winter led to a partial closure of the street. That closure was lifted after three days. The present leak is not expected to require a closure, the spokesperson said, provided that the water can be shut off overnight. The plan should be reviewed, a local councillor argued, because two warnings in a hallway are not the same as a conversation.\u003cbr/\u003e\u003cbr/\u003eMr Patel, whose shop sits on the corner, was offered a quote in this paper and declined. These claims — that the shop is closing, that the lease has been sold — have been denied. It is widely believed on a neighbourhood chat that the shop will shut if the leak is not fixed. It is understood that talks with the landlord are ongoing. The rumour cannot be proved, and this paper will not print it as fact.\u003cbr/\u003e\u003cbr/\u003eA front-page treatment has been avoided on purpose. The leak is real. The cause is not yet known. Attribution, in this case, stops at the council and at residents who would go on the record. Unnamed sources on a chat are not a substitute. The evidence suggests a leak, not a conspiracy, and not yet a sale.\u003cbr/\u003e\u003cbr/\u003eOn balance, the story is smaller than the chat. Water in a hallway is a failure of maintenance. It is not, on the information available yesterday, a reason to close a shop that was taking deliveries this morning. Further updates will be published when a cause has been confirmed. Until then, the leak must not be ignored, and the sale need not be invented.\u003cbr/\u003e\u003cbr/\u003eA note on method, because readers have asked how this paper decides what to print. A claim that cannot be attributed is not run as fact. A claim that can be attributed to the council, or to a resident willing to go on the record, is run with that name attached. It is widely believed on the chat that this standard is a form of cowardice. It can be argued that it is the only standard that still distinguishes a newspaper from a mood. The editor, who has a byline on this page, will answer letters. Unnamed sources on a group are invited to become named ones, in writing, by Friday. A second leak, if it comes, will be treated the same way: reported, attributed, and not dressed as a sale until a sale exists. That is slower than a chat. It is also still the job. Readers who prefer speed are not the enemy of this page. They are the reason the page has to be slower on purpose. A hallway can flood in an hour. A sale, if it is real, will still be real on Monday, when a name can be put under it. Who says so? Anyone this paper can print."])</script><script>self.__next_f.push([1,"18:Tc84,"])</script><script>self.__next_f.push([1,"It is widely believed on this street that the shop is being closed on purpose. A leak was «found» on Monday. Residents had been «warned», they say. Nobody saw a letter. The leak was allowed to run because it suits someone. Who? The landlord is a notorious name on this road. The shop is said to have been sold already. Patel was offered a quiet exit and took it. That is what is being said, and if the Gazette will not print it, we will.\u003cbr/\u003e\u003cbr/\u003eA front-page story should have been written yesterday. Instead we got pipes. LEAK BLAMED ON OLD PIPES — blamed by who? An unstated agent, a council quote, a denial. Of course the claims have been denied. They are always denied. Denial is not evidence. The evidence is the water in the hall and the van that was seen at the back of the shop at six in the morning, which nobody from the paper has asked about.\u003cbr/\u003e\u003cbr/\u003eIt is reported, if you believe the Gazette, that talks are ongoing. Talks with who? It is understood that the lease is gone. Apparently the night bus is being cut the same month, which is not a coincidence. Word is the whole corner is being emptied for something else. They cancelled a residents' meeting last night. It got cancelled, they said, because of the leak. The leak is the excuse. The meeting is what they did not want.\u003cbr/\u003e\u003cbr/\u003ePeople who defend the paper will tell you it is being careful. Careful is a word that covers people. The group is not paid to be careful. The group is here. We were not consulted. We were not offered a meeting that survived until morning. We were told to wait. Waiting is how this street loses shops.\u003cbr/\u003e\u003cbr/\u003eShare this. Ask the editor why a byline was more important than a van. Ask Patel, if he is still here, why the deliveries looked like emptying. The rumour cannot be proved, they will say. Neither can the pipes, until someone names the person who decided to let the water run. Who says so? We do. On the record, without a suit.\u003cbr/\u003e\u003cbr/\u003eAnd if the Gazette wants a named source, here is one. This street has lived with a notorious delay on the rising main for two winters. Notices in a hallway are not consultation. A letter said to have been sent in March is not a conversation. We were told to wait. We were not offered a date that survived until morning. Careful, as a word, has covered this corner long enough. The passive will not cover it any more. Print the van. Print the meeting that got cancelled. Print who decided. If that is not journalism, it is at least a record. We are done hiding the agent. Print the date of the letter that nobody saw. Print the name on the van. Print whether the night bus is being cut in the same month, and by whom. Apparently is not a source. Word is not a source. A street that has been told to wait is a source, if someone will listen without first asking for a password. We have been careful for two winters. Careful did not fix the main. Careful did not keep the meeting. Careful is the word the paper uses when it has decided not to name the person who benefits. Name them. If they have not sold the shop, they can say so on the record, like Patel, and we will print that too. Until then, the unstated agent is the whole story on this street."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m4l6\",\"phaseId\":\"enb2m4\",\"title\":\"Two passives, one leak\",\"subtitle\":\"El periódico se cubre; el grupo acusa. Las dos usan la pasiva.\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de las dos fuentes\",\"itemIds\":[\"enb2m4neighbourgroup\",\"enb2m4adenial\",\"enb2m4attribution\",\"enb2m4unstatedagent\",\"enb2m4informorconvince\",\"enb2m4thepaperhedged\",\"enb2m4thegroupchat\",\"enb2m4frontpagestory\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La misma fuga, dos dueños escondidos\",\"body\":\"Dos textos sobre Palmer Road. El primero es un artículo del periódico local: pasivas de reporte, according to, un desmentido. El segundo es un mensaje del [[neighbourhood group|grupo de vecinos]]: pasivas de acusación, sin fuente, un they que no existe. \u003cb\u003eLas dos esconden el agente.\u003c/b\u003e Una para no mojarse. La otra para acusar sin firmar. Eso es informar o convencer, y la gramática es la misma. La postura, no.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo. Toca las glosas si te bloquean.\",\"title\":\"Leak on Palmer Road — council says pipes, not vandalism\",\"source\":\"From the Hackney Gazette (adapted)\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m4l6e1q1\",\"q\":\"What is the article mainly doing?\",\"options\":[\"Reporting a leak, recording what is unconfirmed, and refusing to print the shop-sale rumour as fact.\",\"Proving that Mr Patel has sold the shop.\",\"Accusing unnamed vandals of flooding the hallway.\"],\"answer\":0,\"inference\":true,\"why\":\"El cierre lo dice: the story is smaller than the chat; will not print it as fact. La B es lo que el artículo niega. La C: vandalism has not been ruled out, not assumed.\"},{\"id\":\"enb2m4l6e1q2\",\"q\":\"What have residents been told, according to the council?\",\"options\":[\"That they had been warned twice, by notice, about overdue work.\",\"That the shop is closing in June.\",\"That vandalism has been proved.\"],\"answer\":0,\"why\":\"«residents had been warned twice, by notice». El artículo también registra que varios vecinos dicen no haber visto la carta.\"},{\"id\":\"enb2m4l6e1q3\",\"q\":\"How does the paper treat the rumour that the shop will close?\",\"options\":[\"It records that the chat believes it, notes that Patel has denied a sale, and will not print it as fact.\",\"It leads with the rumour as a confirmed headline.\",\"It ignores the chat completely.\"],\"answer\":0,\"why\":\"«These claims have been denied… The rumour cannot be proved, and this paper will not print it as fact.» Tampoco lo ignora: lo nombra para no dejarlo solo.\"},{\"id\":\"enb2m4l6e1q4\",\"q\":\"Why has a front-page treatment been avoided?\",\"options\":[\"On purpose: the leak is real, the cause is not yet known, and unnamed chat sources are not a substitute.\",\"Because there was no space.\",\"Because Mr Patel paid the paper not to print it.\"],\"answer\":0,\"why\":\"«A front-page treatment has been avoided on purpose.» Las otras dos no están en el texto.\"},{\"id\":\"enb2m4l6e1q5\",\"q\":\"When the article uses «it is thought that» and «it should be noted that» in the first paragraph, what is the difference?\",\"options\":[\"The first reports without committing; the second lets the paper evaluate: nobody has confirmed a cause.\",\"They are synonyms and could be swapped.\",\"Both accuse Patel without naming him.\"],\"answer\":0,\"inference\":true,\"why\":\"It is thought that = reporte. It should be noted that = el periódico se asoma. Si no ves la diferencia, la L1 no ha cuajado.\"}],\"itemIds\":[\"enb2m4itisthoughtthat\",\"enb2m4itshouldbenoted\",\"enb2m4hadbeenwarned\",\"enb2m4theseclaimshavebeendenied\",\"enb2m4frontpagestory\",\"enb2m4theevidencesuggests\"]},{\"id\":\"enb2m4l6e2\",\"type\":\"read\",\"prompt\":\"Ahora el grupo. Misma fuga, otra pasiva.\",\"title\":\"They're covering it up — share this\",\"source\":\"From the Palmer Road neighbourhood group (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m4l6e2q1\",\"q\":\"What does the group want readers to believe?\",\"options\":[\"That the leak is being used to empty the corner, that the shop has been sold, and that the paper is covering it.\",\"That old pipes are the confirmed cause.\",\"That the council has already fixed the leak.\"],\"answer\":0,\"why\":\"El primer párrafo y el tercero lo dicen sin rodeos: closed on purpose, sold already, not a coincidence, the leak is the excuse.\"},{\"id\":\"enb2m4l6e2q2\",\"q\":\"How does the group treat the paper's denial of the sale?\",\"options\":[\"As expected and worthless: «Of course the claims have been denied. Denial is not evidence.»\",\"As proof that Patel is staying.\",\"As a quote they accept and reprint in full.\"],\"answer\":0,\"why\":\"El segundo párrafo convierte el desmentido en prueba de culpabilidad. Eso es convencer, no informar.\"},{\"id\":\"enb2m4l6e2q3\",\"q\":\"What is the van at six in the morning doing in this text?\",\"options\":[\"Standing in as evidence the paper has not asked about — a detail that accuses without naming what was in the van.\",\"Proving that Patel takes deliveries, as Ben saw.\",\"Showing that the emergency services arrived.\"],\"answer\":0,\"inference\":true,\"why\":\"El grupo no dice qué había en la furgoneta. La pone para que el lector rellene. Inferencia: es un detalle que convence, no un hecho cerrado.\"},{\"id\":\"enb2m4l6e2q4\",\"q\":\"When the group writes «It got cancelled, they said, because of the leak», what job is the get-passive doing?\",\"options\":[\"Street voice, plus a they that has no name: the cancellation is made to sound like a trick.\",\"Exam register: get is what LanguageCert wants in an article.\",\"A correction: the meeting actually happened.\"],\"answer\":0,\"why\":\"Get-passive + they said, sin agente. El grupo usa la calle para acusar. El examen querría was cancelled y una fuente.\"},{\"id\":\"enb2m4l6e2q5\",\"q\":\"Who, at the end, answers «Who says so?»\",\"options\":[\"The group itself: «We do. On the record, without a suit.» — they drop the unstated agent at the last moment.\",\"The editor of the Gazette.\",\"Mr Patel, in a quoted denial.\"],\"answer\":0,\"inference\":true,\"why\":\"Todo el texto esconde el agente y el último párrafo lo reclama. Esa vuelta es la postura: no éramos un they. Éramos nosotros. Hay que inferirla contra las pasivas de arriba.\"}],\"itemIds\":[\"enb2m4itiswidelybelieved\",\"enb2m4notorious\",\"enb2m4unstatedagent\",\"enb2m4itgotcancelled\",\"enb2m4thegroupchat\",\"enb2m4whosaysso\"]},{\"id\":\"enb2m4l6e3\",\"type\":\"mc\",\"prompt\":\"Las dos posturas, la misma gramática\",\"question\":\"¿En qué se distinguen de verdad los dos textos?\",\"options\":[\"Los dos usan pasiva; el periódico para no mojarse y marcar lo no confirmado, el grupo para acusar sin nombrar y luego firmar al final.\",\"El periódico no usa pasiva y el grupo sí.\",\"El periódico habla de Palmer Road y el grupo, de otra calle.\"],\"answer\":0,\"whyWrong\":[null,\"El periódico está lleno de pasivas: is being investigated, had been warned, have been denied.\",\"Los dos están en Palmer Road, a veces en el 14.\"],\"itemIds\":[\"enb2m4informorconvince\",\"enb2m4thepaperhedged\",\"enb2m4unstatedagent\"]},{\"id\":\"enb2m4l6e4\",\"type\":\"cloze\",\"prompt\":\"La pregunta del módulo, otra vez\",\"text\":\"A passive without a name still has a job. ___ says so?\",\"answers\":[\"Who\"],\"itemIds\":[\"enb2m4whosaysso\",\"enb2m4unstatedagent\"]},{\"id\":\"enb2m4l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin «they cancelled» — examen\",\"source\":\"They cancelled the meeting.\",\"forbid\":[\"they\"],\"answers\":[\"The meeting was cancelled\",\"The meeting was cancelled.\",\"The meeting got cancelled\",\"It was cancelled\"],\"itemIds\":[\"enb2m4theycancelledit\",\"enb2m4itwascancelled\",\"enb2m4itgotcancelled\"]},{\"id\":\"enb2m4l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume los dos textos sin mezclarles la postura\",\"text\":\"The paper ___ : it will not print the sale as fact. The group ___ without naming, then answers «Who says so?» with we. One text informs. The other ___. ___ balance, the leak is real and the sale is not.\",\"answers\":[\"hedged\",\"accused\",\"convinces\",\"On\"],\"bank\":[\"hedged\",\"accused\",\"convinces\",\"On\",\"lied\",\"Moreover\",\"In\"],\"itemIds\":[\"enb2m4thepaperhedged\",\"enb2m4thegroupchat\",\"enb2m4informorconvince\",\"enb2m4onbalance\"]},{\"id\":\"enb2m4l6e7\",\"type\":\"errorfix\",\"prompt\":\"Después de leer, un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"The evidences suggest a leak.\",\"answers\":[\"The evidence suggests a leak.\"],\"why\":\"Evidence es incontable: sin plural, con suggests. El B1 ya lo cazó; aquí vuelve porque el artículo lo usa, y el calco culta «las evidencias» se cuela al resumir.\",\"itemIds\":[\"enb2m4theevidencesuggests\"]},{\"id\":\"enb2m4l6e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"La frase del grupo\",\"source\":\"An unstated agent, a council quote, a denial.\",\"answers\":[\"Un agente no declarado, una cita del ayuntamiento, un desmentido\",\"Un agente sin declarar, una cita del consejo, un desmentido\",\"Un agente no nombrado, una cita del ayuntamiento y un desmentido\"],\"itemIds\":[\"enb2m4unstatedagent\",\"enb2m4adenial\"]},{\"id\":\"enb2m4l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Este texto informa o convence?\",\"answers\":[\"Does this text inform or convince?\",\"Does this text inform or convince\"],\"itemIds\":[\"enb2m4informorconvince\"]},{\"id\":\"enb2m4l6e10\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria, las dos pestañas abiertas. Pregunta antes del play. Una sola escucha.\",\"audio\":\"Same leak. Two passives. The paper won't print the sale. The group already has Patel packed. Who says so? The paper names the council. The group names itself at the end, after hiding for four paragraphs. That's the stance. I'm not sharing the group one. I might share the paper, with a note.\",\"question\":\"¿Qué va a compartir Valeria, si comparte algo?\",\"options\":[\"El del periódico, con una nota; el del grupo, no\",\"Los dos, porque las dos pasivas son iguales\",\"Solo el del grupo, porque está «on the record»\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Ella acaba de decir que la gramática es la misma y la postura no.\",\"On the record llega al final, después de esconderse. Ella no pica.\"],\"itemIds\":[\"enb2m4twosources\",\"enb2m4informorconvince\",\"enb2m4whosaysso\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\
