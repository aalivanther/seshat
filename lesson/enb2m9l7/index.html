eritage site|Patrimonio de la Humanidad]], [[protecting open spaces|proteger los espacios abiertos]], [[the local flora and fauna|la flora y la fauna locales]], [[a regional geographical feature|un rasgo geográfico de la zona]]. Ya no hablas de tu maleta: hablas de un valle.\u003cbr/\u003e\u003cbr/\u003eTres colocaciones que el hispanohablante calca mal:\u003cbr/\u003e· \u003cb\u003econgestion\u003c/b\u003e es incontable. No hay \u003ci\u003econgestions\u003c/i\u003e. Hay congestion, o a traffic jam (eso sí, del A2).\u003cbr/\u003e· \u003cb\u003eright of way\u003c/b\u003e no es «derecho de paso» calçado sobre una acera: en Inglaterra y Gales es un camino público que cruza un campo privado, y está en el mapa.\u003cbr/\u003e· \u003cb\u003eThe service was suspended\u003c/b\u003e es lo que escribe National Rail. \u003ci\u003eIt was cancelled\u003c/i\u003e también vale; \u003ci\u003eit got binned\u003c/i\u003e es la calle, y no se escribe en una reclamación.\u003cbr/\u003e\u003cbr/\u003eEl satnav, en la calle, es una sola palabra. En un informe, satellite navigation. Las dos son la misma tarjeta, dos alturas."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l7\",\"phaseId\":\"enb2m9\",\"title\":\"Satnav, green travel, the scenic route\",\"subtitle\":\"Las palabras con las que un B2 habla de moverse por el país, no de coger un vuelo\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Doce bloques, no doce palabras sueltas\",\"itemIds\":[\"enb2m9satnav\",\"enb2m9greentravel\",\"enb2m9trafficcontrol\",\"enb2m8congestion\",\"enb2m9floraandfauna\",\"enb2m9aregionalfeature\",\"enb2m9aparkandride\",\"enb2m9thebypass\",\"enb2m9publicrightofway\",\"enb2m9lowemissionzone\",\"enb2m9scenicroute\",\"enb2m9natsuspended\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El B2 de viajar no es el aeropuerto: es el territorio\",\"body\":\"$17\",\"table\":[[\"Informe / examen\",\"Calle\",\"Lo que no es\"],[\"satellite navigation\",\"the satnav\",\"the GPS (americano, y se entiende)\"],[\"The service was suspended\",\"It got binned\",\"It was late (otra cosa)\"],[\"congestion\",\"the traffic's a nightmare\",\"congestions, en plural\"],[\"a park-and-ride\",\"leave the car and get the bus\",\"a parking (eso es el recinto, en francés)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m9l7e1\",\"type\":\"match\",\"prompt\":\"Empareja el bloque con lo que nombra\",\"pairs\":[{\"target\":\"satellite navigation\",\"source\":\"el navegador por satélite\"},{\"target\":\"green travel\",\"source\":\"moverse con poca huella\"},{\"target\":\"a park-and-ride\",\"source\":\"aparcas y sigues en bus\"},{\"target\":\"a public right of way\",\"source\":\"camino público que cruza el campo\"},{\"target\":\"a low-emission zone\",\"source\":\"zona de bajas emisiones\"},{\"target\":\"the scenic route\",\"source\":\"la ruta panorámica\"}],\"itemIds\":[\"enb2m9satnav\",\"enb2m9greentravel\",\"enb2m9aparkandride\",\"enb2m9publicrightofway\",\"enb2m9lowemissionzone\",\"enb2m9scenicroute\"]},{\"id\":\"enb2m9l7e2\",\"type\":\"errorfix\",\"prompt\":\"Un solo error: el incontable en plural\",\"wrong\":\"There was heavy congestions on the approach road.\",\"answers\":[\"There was heavy congestion on the approach road.\"],\"why\":\"Congestion no se cuenta. El plural es el calco. Heavy congestion, en singular.\",\"translation\":\"Había mucha congestión en la vía de acceso.\",\"itemIds\":[\"enb2m8congestion\"]},{\"id\":\"enb2m9l7e3\",\"type\":\"cloze\",\"prompt\":\"Lo que escribe National Rail, no lo que se dice en el andén\",\"text\":\"The 9.15 to Aberystwyth ___ suspended due to a landslide.\",\"answers\":[\"was\",\"has been\"],\"translation\":\"El 9.15 a Aberystwyth ha quedado suspendido por un desprendimiento.\",\"itemIds\":[\"enb2m9natsuspended\",\"enb2m9therehadbeen\"]},{\"id\":\"enb2m9l7e4\",\"type\":\"bucket\",\"prompt\":\"¿Registro de informe o de andén?\",\"categories\":[\"Informe / examen\",\"Calle / mensaje\"],\"items\":[{\"text\":\"The service was suspended.\",\"bucket\":0},{\"text\":\"It got binned.\",\"bucket\":1},{\"text\":\"satellite navigation\",\"bucket\":0},{\"text\":\"the satnav sent us down a farm track\",\"bucket\":1},{\"text\":\"a low-emission zone\",\"bucket\":0},{\"text\":\"the scenic route\",\"bucket\":1}],\"itemIds\":[\"enb2m9natsuspended\",\"enb2m9satnav\",\"enb2m9scenicroute\"],\"tip\":\"The scenic route es de los dos: se oye y se escribe. La he puesto en calle porque en un informe dirías the coastal route via… con el número de la carretera.\"},{\"id\":\"enb2m9l7e5\",\"type\":\"audiomc\",\"prompt\":\"Listening largo: pregunta ANTES. Cuaderno permitido — la respuesta llega tarde.\",\"notepad\":true,\"plays\":2,\"audio\":\"Right, so if you're driving, ignore the satnav at the church.|It still sends people down the farm track.|We put a sign there last month and they still go.|What do you want them to do, then?|Park-and-ride, north of the village. Shuttle every twenty minutes.|That's twelve minutes extra.|It is. It's also the only way we don't put a car park on the lapwing field.|And if the 9.15's suspended again?|Then they get the coach from Carmarthen and walk the last mile on the coast path.|Green travel with muddy shoes. I can live with that.\",\"question\":\"¿Qué les dice Gwen a los que llegan en coche, y qué pasa si el tren se suspende?\",\"options\":[\"Que ignoren el satnav en la iglesia y usen el park-and-ride; si el tren no corre, el autocar y el sendero.\",\"Que aparquen en el campo de los avefrías, que es lo más cerca.\",\"Que no vengan en coche bajo ningún concepto, ni con el lanzadera.\"],\"answer\":0,\"whyWrong\":[null,\"El campo de los avefrías es exactamente lo que no quieren asfaltar.\",\"El park-and-ride ES venir en coche, aparcar fuera y seguir. No es una prohibición.\"],\"itemIds\":[\"enb2m9satnav\",\"enb2m9aparkandride\",\"enb2m9natsuspended\",\"enb2m9greentravel\"],\"tip\":\"En B2 la respuesta está más lejos: primero el satnav, luego el park-and-ride, luego el tren suspendido. Si no apuntas, al final solo recuerdas el chiste de las botas.\"},{\"id\":\"enb2m9l7e6\",\"type\":\"gapbank\",\"prompt\":\"El párrafo de un informe, con el léxico de hoy\",\"text\":\"___ travel to the priory is possible if visitors use the ___ and leave the car north of the village. The ___ road cannot take more traffic, and the estuary is a sensitive ___ for the local flora and ___.\",\"answers\":[\"Green\",\"park-and-ride\",\"approach\",\"habitat\",\"fauna\"],\"bank\":[\"Green\",\"park-and-ride\",\"approach\",\"habitat\",\"fauna\",\"Fast\",\"bypass\",\"station\",\"garden\",\"customs\"],\"translation\":\"Llegar al priorato con poca huella es posible si los visitantes usan el aparcamiento disuasorio y dejan el coche al norte del pueblo. La vía de acceso no aguanta más tráfico, y el estuario es un hábitat sensible para la flora y la fauna locales.\",\"itemIds\":[\"enb2m9greentravel\",\"enb2m9aparkandride\",\"enb2m9theapproachroad\",\"enb2m9asensitivehabitat\",\"enb2m9floraandfauna\"]},{\"id\":\"enb2m9l7e7\",\"type\":\"type\",\"prompt\":\"Escribe la colocación: el camino público que cruza el campo\",\"question\":\"En Inglaterra y Gales, el sendero que cruza un campo privado y está en el mapa se llama a public ___ of ___.\",\"answers\":[\"right of way\",\"right-of-way\"],\"itemIds\":[\"enb2m9publicrightofway\"]},{\"id\":\"enb2m9l7e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Al inglés, con la palabra de informe\",\"source\":\"El servicio quedó suspendido.\",\"answers\":[\"The service was suspended.\",\"The service has been suspended.\"],\"hint\":\"suspended, no cancelled (también valdría, pero hoy se pide esta)\",\"itemIds\":[\"enb2m9natsuspended\"]},{\"id\":\"enb2m9l7e9\",\"type\":\"shadow\",\"prompt\":\"Sombrea: el ritmo de la frase de National Rail\",\"text\":\"The service was suspended.\",\"phonetic\":\"de SÉE-vis uos̬ sa-SPÉN-did\",\"translation\":\"El servicio quedó suspendido.\",\"reps\":2,\"itemIds\":[\"enb2m9natsuspended\"]},{\"id\":\"enb2m9l7e10\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de precisión: bloques de hoy\",\"pairs\":[{\"target\":\"the bypass\",\"source\":\"la variante / la ronda\"},{\"target\":\"traffic control\",\"source\":\"la regulación del tráfico\"},{\"target\":\"the local flora and fauna\",\"source\":\"la flora y la fauna del sitio\"},{\"target\":\"a regional geographical feature\",\"source\":\"un rasgo geográfico de la zona\"},{\"target\":\"congestion\",\"source\":\"la congestión (incontable)\"}],\"targetSeconds\":24,\"itemIds\":[\"enb2m9thebypass\",\"enb2m9trafficcontrol\",\"enb2m9floraandfauna\",\"enb2m9aregionalfeature\",\"enb2m8congestion\"]},{\"id\":\"enb2m9l7ext2\",\"type\":\"transform\",\"prompt\":\"Relativa con la preposición al final\",\"source\":\"That's the flat. I told you about it.\",\"instruction\":\"Una sola frase: the flat I told you about\",\"answers\":[\"That's the flat I told you about.\",\"That's the flat that I told you about.\",\"That is the flat I told you about.\"],\"translation\":\"Ese es el piso del que te hablé.\",\"itemIds\":[\"enb2m9nattoldyouabout\"],\"tip\":\"About which I told you también es inglés, y suena a traducción. Al final es lo que un nativo escribe.\"},{\"id\":\"enb2m9l7exw2\",\"type\":\"write\",\"prompt\":\"Artículo de 140-180. Describe el sábado en el priorato, no una propuesta al condado.\",\"scenario\":\"La revista del centro pide un artículo: un sábado fuera de Londres, tren suspendido, park-and-ride, Gwen Pryce en el priorato. 140-180 palabras. Describe el viaje. No recomiendes un bypass: eso es la propuesta de la L8 y, aquí, vale cero.\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review — call for pieces\",\"text\":\"140–180 words on a day out of London that did not go to plan. Stay on the journey and the site. Off-topic scores nothing.\"},\"bullets\":[\"Parte de un hecho del viaje (tren suspendido, satnav, coach o park-and-ride).\",\"Nombra el priorato o a Gwen, y un rasgo del territorio (estuario, sendero, Patrimonio).\",\"Empaqueta al menos una circunstancia (given that / after having / rather than).\"],\"checks\":[{\"re\":\"(suspended|satnav|park-and-ride|coach|cancellation)\",\"label\":\"Names a fact of the journey\"},{\"re\":\"(priory|gwen|heritage|coast path|estuary)\",\"label\":\"Names the site or the land\"},{\"re\":\"(given that|after having|rather than)\",\"label\":\"Packs a circumstance instead of lining up two sentences\"}],\"frame\":[\"Párrafo 1 — el andén / el tren suspendido / el satnav\",\"Párrafo 2 — given that… el priorato, el park-and-ride\",\"Párrafo 3 — after having / rather than… el sendero, Gwen\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"given that\",\"rather than\",\"even so\",\"after having\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Valeria and Amy left London before six, hoping to catch the earlier train to Carmarthen. Standing on the platform, they heard the cancellation. There had been a landslide on the coast line, and the service was suspended. Gwen Pryce had warned them: ignore the satnav at the church.\\nThey took the coach instead. On the way, the scenic route opened the estuary, which was a relief after the queue on the approach road. Given that the priory is a World Heritage site, the village cannot take more cars. A park-and-ride sits north of the houses; the shuttle runs every twenty minutes. Green travel, in this valley, means muddy shoes and a walk on the public right of way.\\nAfter having checked the tide, they walked the coast path rather than wait for a second tour. The site was closed when they arrived. Even so, it was the best of the day: lapwings on the field, the listed building from the ridge, and Gwen on a bench with a flask. Nobody needed a thesis. The place did the work.\",\"itemIds\":[\"enb2m9giventhat\",\"enb2m9aparkandride\",\"enb2m9afterhavingchecked\",\"enb2m9greentravel\",\"enb2m9thepriory\",\"enb2m9scenicroute\",\"enb2m9natsuspended\"],\"tip\":\"Si el cierre pide al comité que sitúe un bypass, has cambiado de género. Vuelve al banco de Gwen.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m9-4\",\"book\":\"It was cancelled.\",\"real\":\"It got binned.\",\"meaning\":\"Lo han cancelado / lo han tirado a la basura (el servicio, el plan, el tren).\",\"when\":\"Got binned es de andén y de grupo de WhatsApp, y se dice del tren, del concierto y del plan de las ocho. En una reclamación, en un Writing y en el Speaking del examen, The service was suspended o The service has been cancelled. Binnear un tren en el papel te baja el registro de golpe.\",\"register\":\"jerga\",\"exam\":\"The service was suspended.\",\"note\":\"Get-passive es la pasiva de la calle. El B2 la reconoce; no la escribe en una propuesta.\",\"sound\":\"it got bind\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m9natsuspended\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\
