lizado \u003cb\u003enecesita artículo y mayúscula\u003c/b\u003e: \u003ci\u003enach dem Bezahlen\u003c/i\u003e. Sin las dos cosas, no es un sustantivo.\u003cbr/\u003e\u003cbr/\u003eY guárdate esta cifra: el \u003cb\u003eWiderrufsrecht\u003c/b\u003e te da \u003cb\u003e14 días\u003c/b\u003e para devolver cualquier compra online en la UE, sin dar explicaciones. Aparece en todo [[Kleingedruckte|letra pequeña]] alemán."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l4\",\"phaseId\":\"b1m8\",\"title\":\"Das Kleingedruckte\",\"subtitle\":\"Contratos, plazos y la fábrica de sustantivos\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del contrato\",\"itemIds\":[\"b1m8gevertrag\",\"b1m8gekuendigen\",\"b1m8gekuendigung\",\"b1m8gefrist\",\"b1m8geumtausch\",\"b1m8geumtauschen\",\"b1m8gebezahlung\",\"b1m8gezurueckschicken\",\"b1m8gewiderruf\",\"b1m8gegarantie\",\"b1m8gekleingedruckte\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Nominalisierung: por qué los documentos alemanes suenan así\",\"body\":\"$17\",\"table\":[[\"verbo\",\"sustantivo\",\"artículo\"],[\"bezahlen\",\"die Bezahlung\",\"die (-ung)\"],[\"kündigen\",\"die Kündigung\",\"die (-ung)\"],[\"umtauschen\",\"der Umtausch\",\"der (raíz)\"],[\"kaufen\",\"der Kauf\",\"der (raíz)\"],[\"einkaufen\",\"das Einkaufen\",\"das (infinitivo)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l4e1\",\"type\":\"mc\",\"prompt\":\"Lee la letra pequeña\",\"question\":\"„Das Widerrufsrecht gilt vierzehn Tage.“\",\"options\":[\"Tienes catorce días para devolver sin dar motivos\",\"La garantía dura catorce días\",\"El envío tarda catorce días\"],\"answer\":0,\"whyWrong\":[null,\"La garantía es die Garantie y dura años, no días\",\"El envío sería die Lieferung\"],\"itemIds\":[\"b1m8gewiderruf\"],\"tip\":\"Widerruf = revocación. Es un derecho europeo: no depende de la buena voluntad de la tienda.\"},{\"id\":\"b1m8l4e2\",\"type\":\"match\",\"prompt\":\"Verbo ↔ su
