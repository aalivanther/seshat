culpó a sí mismo.\u003cbr/\u003e· \u003cb\u003eeach other\u003c/b\u003e — \u003cb\u003eel uno al otro\u003c/b\u003e, ida y vuelta entre dos o más. \u003ci\u003eThey blamed \u003cb\u003eeach other\u003c/b\u003e\u003c/i\u003e = uno al otro.\u003cbr/\u003e· \u003cb\u003eone another\u003c/b\u003e — lo mismo que \u003ci\u003eeach other\u003c/i\u003e, un punto más formal y más de escribir que de hablar. Se oye sobre todo cuando son muchos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco que hay que matar hoy:\u003c/b\u003e el español pone el pronombre de objeto («nos conocemos», «nos vemos») y el hispanohablante lo traduce por \u003ci\u003eus\u003c/i\u003e. \u003cb\u003e\u003cs\u003eWe've known us for years\u003c/s\u003e\u003c/b\u003e no existe. Va \u003cb\u003eeach other\u003c/b\u003e, y punto: \u003ci\u003eWe've known each other for years.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY hay un tercer grupo, que ya traes del A2 y que es el más grande:\u003c/b\u003e los verbos que en español llevan «se» y en inglés \u003cb\u003eno llevan nada\u003c/b\u003e. \u003ci\u003eget up\u003c/i\u003e, \u003ci\u003ewake up\u003c/i\u003e, \u003ci\u003efeel\u003c/i\u003e, \u003ci\u003eremember\u003c/i\u003e, \u003ci\u003ecomplain\u003c/i\u003e, \u003ci\u003estay\u003c/i\u003e. \u003ci\u003eI get up at seven\u003c/i\u003e, nunca \u003ci\u003eI get up myself\u003c/i\u003e. Así que el «se» español tiene \u003cb\u003etres destinos\u003c/b\u003e distintos en inglés, y el más frecuente de los tres es \u003cb\u003eninguno\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl posesivo recíproco\u003c/b\u003e, que queda muy bien y casi nadie usa: \u003ci\u003eWe know \u003cb\u003eeach other's\u003c/b\u003e families.\u003c/i\u003e El apóstrofo va detrás de \u003ci\u003eother\u003c/i\u003e, en singular, aunque sean dos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY un verbo que exige compañía siempre: \u003ci\u003eenjoy\u003c/i\u003e.\u003c/b\u003e \u003ci\u003eEnjoy\u003c/i\u003e nunca va solo. O lleva un objeto (\u003ci\u003eI enjoyed the film\u003c/i\u003e) o lleva un reflexivo (\u003ci\u003ewe really enjoyed ourselves\u003c/i\u003e = nos lo pasamos genial). \u003ci\u003e\u003cs\u003eWe really enjoyed\u003c/s\u003e\u003c/i\u003e deja la frase colgando, y es un error que se oye muchísimo.\u003cbr/\u003e\u003cbr/\u003eY de propina, una que también se calca: \u003cb\u003econocer a alguien por primera vez es \u003ci\u003emeet\u003c/i\u003e\u003c/b\u003e, no \u003ci\u003eknow\u003c/i\u003e. \u003ci\u003eWe \u003cb\u003emet\u003c/b\u003e through a friend\u003c/i\u003e = nos conocimos. \u003ci\u003eWe \u003cb\u003eknow\u003c/b\u003e each other\u003c/i\u003e = nos conocemos, ya de antes."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l7\",\"phaseId\":\"enb1m10\",\"title\":\"Each other\",\"subtitle\":\"El «se» español se parte en dos al cruzar el Canal\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que hacemos el uno al otro\",\"itemIds\":[\"enb1m10eachother\",\"enb1m10oneanother\",\"enb1m10metthrough\",\"enb1m10enjoyedourselves\",\"enb1m10blameeachother\",\"enb1m10talktoeachother\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el español dice «se» y el inglés pregunta cuál de los dos\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Qué significa exactamente\"],[\"Se echaron la culpa (uno al otro)\",\"They blamed each other.\",\"ida y vuelta\"],[\"Se echaron la culpa (a sí mismos)\",\"They blamed themselves.\",\"cada uno a sí mismo\"],[\"Nos conocemos desde hace años\",\"We've known each other for years.\",\"nunca «we've known us»\"],[\"Me levanto a las siete\",\"I get up at seven.\",\"aquí el inglés no pone nada\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l7e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro frases recíprocas\",\"pairs\":[{\"target\":\"We've known each other for years.\",\"source\":\"Nos conocemos desde hace años.\"},{\"target\":\"We met through a friend.\",\"source\":\"Nos conocimos por un amigo.\"},{\"target\":\"They blamed each other for everything.\",\"source\":\"Se echaban la culpa el uno al otro de todo.\"},{\"target\":\"They don't talk to each other any more.\",\"source\":\"Ya no se hablan.\"}],\"itemIds\":[\"enb1m10eachother\",\"enb1m10metthrough\",\"enb1m10blameeachother\",\"enb1m10talktoeachother\"],\"tip\":\"Las cuatro llevan «se» en español y ninguna lleva «us» en inglés. Si te fijas en eso hoy, mañana no lo escribes mal.\"},{\"id\":\"enb1m10l7e2\",\"type\":\"mc\",\"prompt\":\"El «se» que cambia el sentido\",\"question\":\"«Se echaron la culpa el uno al otro.» →\",\"options\":[\"They blamed each other.\",\"They blamed themselves.\",\"They blamed them.\"],\"answer\":0,\"whyWrong\":[null,\"Eso dice que cada uno se culpó A SÍ MISMO. Es otra historia, y bastante más triste.\",\"«Them» son otras personas distintas de ellos: culparon a un tercer grupo.\"],\"itemIds\":[\"enb1m10blameeachother\"],\"tip\":\"Tres frases con el mismo verbo y tres significados distintos. En español las tres primeras caben en «se echaron la culpa», y por eso hay que decidir en inglés lo que en español se deja abierto.\"},{\"id\":\"enb1m10l7e3\",\"type\":\"bucket\",\"prompt\":\"¿Es «cada uno a sí mismo» o «el uno al otro»?\",\"categories\":[\"-self / -selves (a sí mismo)\",\"each other (el uno al otro)\"],\"items\":[{\"text\":\"They looked at themselves in the mirror.\",\"bucket\":0},{\"text\":\"They looked at each other and said nothing.\",\"bucket\":1},{\"text\":\"We really enjoyed ourselves.\",\"bucket\":0},{\"text\":\"We write to each other every month.\",\"bucket\":1},{\"text\":\"She cut herself on the tin.\",\"bucket\":0},{\"text\":\"They helped one another with the boxes.\",\"bucket\":1}],\"itemIds\":[\"enb1m10eachother\",\"enb1m10oneanother\",\"enb1m10enjoyedourselves\",\"ena2m9reflexivegroup\"],\"tip\":\"Fíjate en la primera pareja: «looked at themselves» es un espejo y «looked at each other» es una escena entera. Una palabra distinta y la película cambia.\"},{\"id\":\"enb1m10l7e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante tradujo «nos conocemos». Arréglalo.\",\"wrong\":\"We've known us for years.\",\"answers\":[\"We've known each other for years.\"],\"why\":\"El «nos» del español es recíproco: uno al otro. En inglés eso es «each other», nunca el pronombre de objeto. «We've known us» daría a entender que os conocéis a vosotros mismos, que no significa nada.\",\"translation\":\"Nos conocemos desde hace años.\",\"itemIds\":[\"enb1m10eachother\"]},{\"id\":\"enb1m10l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa el recíproco\",\"text\":\"Amy and I have known each ___ since our first week in the flat.\",\"answers\":[\"other\"],\"translation\":\"Amy y yo nos conocemos desde nuestra primera semana en el piso.\",\"hints\":[\"Cinco letras\",\"Va siempre pegada a «each», nunca sola\"],\"itemIds\":[\"enb1m10eachother\",\"ena2m9weshareaflat\"],\"tip\":\"«Each other» es una sola unidad de significado, aunque se escriba en dos palabras. Apréndela así y no la partirás nunca.\"},{\"id\":\"enb1m10l7e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"We really enjoyed ourselves\",\"translation\":\"Nos lo pasamos genial\",\"distractors\":[\"us\",\"much\"],\"itemIds\":[\"enb1m10enjoyedourselves\"],\"tip\":\"«Enjoy» nunca va solo: o lleva un objeto o lleva el reflexivo. Y ojo con la ficha «us»: en inglés no puede recibir la acción del mismo sujeto que la hace.\"},{\"id\":\"enb1m10l7e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que cuenta Valeria del piso\",\"text\":\"Amy and I have known ___ other for six years. We don't always agree, but we've never blamed ___ other for anything. And when the boiler broke, we fixed it ___ .\",\"answers\":[\"each\",\"each\",\"ourselves\"],\"bank\":[\"each\",\"ourselves\",\"one\",\"themselves\",\"myself\",\"us\"],\"translation\":\"Amy y yo nos conocemos desde hace seis años. No siempre estamos de acuerdo, pero nunca nos hemos echado la culpa de nada. Y cuando se rompió la caldera, la arreglamos nosotras mismas.\",\"itemIds\":[\"enb1m10eachother\",\"enb1m10blameeachother\",\"ena2m9ididitmyself\"],\"tip\":\"El último hueco no es recíproco: nadie se arregla a nadie. Ahí «ourselves» significa «nosotras solas, sin llamar a nadie», que es el mismo uso de «I did it myself» del A2.\"},{\"id\":\"enb1m10l7e8\",\"type\":\"transform\",\"prompt\":\"Del pronombre suelto al recíproco\",\"source\":\"I write to Emma and Emma writes to me.\",\"instruction\":\"Dilo en una frase, con el recíproco\",\"answers\":[\"We write to each other\",\"We write to each other.\",\"Emma and I write to each other\",\"We write to one another\"],\"translation\":\"Nos escribimos.\",\"hints\":[\"Junta a las dos en un solo sujeto\",\"We write to ...\"],\"itemIds\":[\"enb1m10eachother\",\"enb1m3intouch\"],\"tip\":\"Fíjate en que la preposición no se pierde: «write TO each other». Si el verbo pedía «to» con una persona, lo sigue pidiendo con el recíproco.\"},{\"id\":\"enb1m10l7e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"They stopped speaking to each other in 2019.\",\"forbid\":[\"stopped\",\"speaking\"],\"answers\":[\"They don't talk to each other any more\",\"They fell out in 2019\",\"They haven't talked to each other since 2019\"],\"translation\":\"Dejaron de hablarse en 2019.\",\"itemIds\":[\"enb1m10talktoeachother\",\"enb1m10falloutwith\"],\"tip\":\"La segunda respuesta es la más inglesa de las tres: «fall out» comprime la pelea y el silencio de después en dos palabras. Ese tipo de compresión es la que sube la banda de vocabulario.\"},{\"id\":\"enb1m10l7e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Nos conocimos por una amiga y desde entonces nos vemos todas las semanas.\",\"answers\":[\"We met through a friend and we've seen each other every week since then\",\"We met through a friend and we see each other every week\",\"We met through a friend and since then we see each other every week\"],\"hint\":\"El primer verbo es el de conocerse por primera vez; el segundo es recíproco\",\"itemIds\":[\"enb1m10metthrough\",\"enb1m10eachother\"],\"tip\":\"«Conocer» tiene dos verbos en inglés y aquí salen los dos: «meet» es la primera vez, «know» es el estado de después. Si dices «we knew through a friend», suena a que os enterasteis de algo.\"},{\"id\":\"enb1m10l7e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"They blamed themselves for years, and then they started blaming each other.\",\"answers\":[\"Se estuvieron culpando a sí mismos durante años, y luego empezaron a echarse la culpa el uno al otro\",\"Durante años se culparon a sí mismos, y después empezaron a culparse mutuamente\",\"Se echaron la culpa a sí mismos durante años y luego empezaron a echársela el uno al otro\"],\"itemIds\":[\"enb1m10blameeachother\"],\"tip\":\"En español hace falta añadir «a sí mismos» y «el uno al otro» para que se entienda; en inglés la diferencia ya va en el pronombre. Aquí el inglés es el preciso y el español el ambiguo, que no pasa tantas veces.\"},{\"id\":\"enb1m10l7e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"They don't talk to each other any more.\",\"translation\":\"Ya no se hablan.\",\"strictContractions\":true,\"hints\":[\"Empieza por «They don't…»\",\"They don't talk to ... any more\"],\"itemIds\":[\"enb1m10talktoeachother\",\"enb1m10notanymore\"],\"tip\":\"«Each other» suena pegado: «íich-Á-da», con la ch del primero enganchada. En el audio parece una sola palabra, y eso ayuda: memorízala como una.\"},{\"id\":\"enb1m10l7e13\",\"type\":\"shadow\",\"prompt\":\"Repite pegándote al audio: dos pasadas\",\"text\":\"We met through a friend, and we've known each other ever since.\",\"phonetic\":\"ui met zrúu a frend, and uiv nóun íich Á-da É-va sins\",\"
