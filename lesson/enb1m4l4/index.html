br/\u003e· \u003cb\u003eEs informal.\u003c/b\u003e Se dice, no se escribe. En una carta al periódico, \u003ci\u003egot stolen\u003c/i\u003e baja el registro.\u003cbr/\u003e· \u003cb\u003eEs repentino y suele ser malo.\u003c/b\u003e \u003ci\u003eget stolen, get hurt, get caught, get lost, get broken, get sacked\u003c/i\u003e. Las cosas buenas casi nunca van con \u003ci\u003eget\u003c/i\u003e: nadie dice «I got given a prize» en un informe.\u003cbr/\u003e· \u003cb\u003eNo admite «by» con comodidad.\u003c/b\u003e \u003ci\u003eThe window was broken by the storm\u003c/i\u003e ✔ · \u003ci\u003eThe window got broken by the storm\u003c/i\u003e suena forzado. Cuando quieras nombrar al culpable, vuelve a \u003ci\u003ebe\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí está el trabajo de hoy, que es de oído, no de mano:\u003c/b\u003e esta forma hay que \u003cb\u003ereconocerla\u003c/b\u003e —sale en el Listening constantemente— y saber que en el Writing formal se cambia por \u003ci\u003ebe\u003c/i\u003e. Eso es exactamente lo que hacen las tarjetas Nativo: te dan las dos versiones y te dicen dónde va cada una.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn calco que hay que cortar de raíz:\u003c/b\u003e «Me robaron la bici» \u003cb\u003eno\u003c/b\u003e es «They stole me my bike». En inglés \u003ci\u003esteal\u003c/i\u003e no lleva ese «me» de dativo: o \u003cb\u003eThey stole my bike\u003c/b\u003e, o —mucho más natural— \u003cb\u003eMy bike got stolen\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l4\",\"phaseId\":\"enb1m4\",\"title\":\"It got nicked\",\"subtitle\":\"La pasiva de la calle: get + participio, y cuándo NO escribirla\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cosas que te pasan sin que las busques\",\"itemIds\":[\"enb1m4gotstolen\",\"enb1m4gothurt\",\"enb1m4gotcaught\",\"enb1m4takendown\",\"enb1m4gotlost\",\"enb1m4natnicked\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el mismo significado, otro registro\",\"body\":\"$17\",\"table\":[[\"Hablando (get)\",\"Escribiendo (be)\",\"Español\"],[\"My phone got nicked.\",\"My phone was stolen.\",\"Me han robado el móvil.\"],[\"Ben got hurt at work.\",\"Ben was injured at work.\",\"Ben se hizo daño en el trabajo.\"],[\"The post got taken down.\",\"The post was removed.\",\"Retiraron la publicación.\"],[\"I got lost.\",\"I lost my way.\",\"Me perdí.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro cosas que pasan solas\",\"pairs\":[{\"target\":\"My bike got stolen last week.\",\"source\":\"Me robaron la bici la semana pasada.\"},{\"target\":\"Ben got hurt at work.\",\"source\":\"Ben se hizo daño en el trabajo.\"},{\"target\":\"The thief got caught on camera.\",\"source\":\"Al ladrón lo pillaron con una cámara.\"},{\"target\":\"The letter got lost in the post.\",\"source\":\"La carta se perdió por el camino.\"}],\"itemIds\":[\"enb1m4gotstolen\",\"enb1m4gothurt\",\"enb1m4gotcaught\",\"enb1m4gotlost\"],\"tip\":\"Las cuatro son malas noticias, y no es casualidad: el get-passive vive de lo que sale mal. Es la forma en que el inglés cuenta una desgracia sin dramatizarla.\"},{\"id\":\"enb1m4l4e2\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído?\",\"book\":\"My phone was stolen.\",\"real\":\"My phone got nicked.\",\"translation\":\"Me han robado el móvil.\",\"itemIds\":[\"enb1m4natnicked\",\"enb1m4gotstolen\"],\"tip\":\"«nick» es robar en británico coloquial, y de ahí «nicked». Ojo: «nick» también es la comisaría. Es la palabra que oirás en cualquier serie policial de la BBC.\"},{\"id\":\"enb1m4l4e3\",\"type\":\"mc\",\"prompt\":\"El calco del dativo español\",\"question\":\"«Me robaron la bici la semana pasada» →\",\"options\":[\"They stole me my bike last week.\",\"My bike got stolen last week.\",\"I was stolen my bike last week.\"],\"answer\":1,\"whyWrong\":[\"«steal» no admite ese «me»: es el dativo español colado. Se roba algo A alguien, y ese «a alguien» en inglés va con «from».\",null,\"En inglés lo que se roba es la bici, no tú. El sujeto de la pasiva tiene que ser la cosa robada.\"],\"itemIds\":[\"enb1m4gotstolen\"],\"tip\":\"Si quieres nombrar a la víctima: «They stole my bike from me». Pero lo que dice un británico nueve de cada diez veces es «my bike got nicked».\"},{\"id\":\"enb1m4l4e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"My bike got stole last week.\",\"answers\":[\"My bike got stolen last week.\"],\"why\":\"Detrás de «got» va el PARTICIPIO (stolen), no el pasado (stole). Es el mismo fallo que con «be»: steal → stole → stolen, y aquí toca el tercero.\",\"translation\":\"Me robaron la bici la semana pasada.\",\"itemIds\":[\"enb1m4gotstolen\"]},{\"id\":\"enb1m4l4e5\",\"type\":\"transform\",\"prompt\":\"De lo que se escribe a lo que se dice\",\"source\":\"Somebody stole my bike last week.\",\"instruction\":\"Dilo con «get» (sin nombrar a nadie)\",\"answers\":[\"My bike got stolen last week\",\"My bike got stolen last week.\"],\"translation\":\"Me robaron la bici la semana pasada.\",\"hints\":[\"El objeto sube a sujeto y «somebody» desaparece\",\"My bike got ... last week\"],\"itemIds\":[\"enb1m4gotstolen\"],\"tip\":\"«Somebody» en la frase activa es la señal de que sobra: si el sujeto no aporta nada, la pasiva se lo lleva por delante.\"},{\"id\":\"enb1m4l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de la calle\",\"text\":\"Ben ___ hurt at work and he was off for a week.\",\"answers\":[\"got\"],\"translation\":\"Ben se hizo daño en el trabajo y estuvo una semana de baja.\",\"hints\":[\"No es «was»: es el otro auxiliar de la pasiva\",\"Tres letras, pasado\"],\"itemIds\":[\"enb1m4gothurt\"],\"tip\":\"«hurt» no cambia nunca: hurt, hurt, hurt. Así que aquí el único que te dice que es pasado es «got».\"},{\"id\":\"enb1m4l4e7\",\"type\":\"bucket\",\"prompt\":\"¿Dónde cabe cada frase: en una charla o en un informe?\",\"categories\":[\"Se DICE (get, informal)\",\"Se ESCRIBE (be, formal)\"],\"items\":[{\"text\":\"My phone got nicked.\",\"bucket\":0},{\"text\":\"The post got taken down.\",\"bucket\":0},{\"text\":\"Ben got hurt at work.\",\"bucket\":0},{\"text\":\"I got lost on the way.\",\"bucket\":0},{\"text\":\"The phone was stolen from the desk.\",\"bucket\":1},{\"text\":\"The post was removed by the newspaper.\",\"bucket\":1},{\"text\":\"Two members of staff were injured.\",\"bucket\":1},{\"text\":\"The letter was lost in the post.\",\"bucket\":1}],\"itemIds\":[\"enb1m4natnicked\",\"enb1m4takendown\",\"enb1m4gothurt\",\"enb1m4gotlost\"],\"tip\":\"Las ocho son correctas. Lo que decide no es la gramática: es dónde va a leerse la frase. Eso es «appropriacy», y en el Writing puntúa dentro del criterio de vocabulario.\"},{\"id\":\"enb1m4l4e8\",\"type\":\"gapbank\",\"prompt\":\"Completa la historia de la bici — cuatro huecos\",\"text\":\"I left my bike outside the library ___ ten minutes and it got nicked. The camera by the door had stopped working, so nothing was caught ___ film. The police ___ told, but the bike never turned up — and nothing ___ been done about the camera since March.\",\"answers\":[\"for\",\"on\",\"were\",\"has\"],\"bank\":[\"for\",\"on\",\"were\",\"has\",\"since\",\"at\",\"have\"],\"translation\":\"Dejé la bici fuera de la biblioteca diez minutos y me la mangaron. La cámara de la puerta llevaba tiempo estropeada, así que no se grabó nada. Se avisó a la policía, pero la bici no apareció — y de la cámara no se ha hecho nada desde marzo.\",\"itemIds\":[\"enb1m4natnicked\",\"enb1m1havelivedhere\",\"enb1m4hasbeenclosed\"],\"tip\":\"«The police» es plural en inglés británico: «the police were told», nunca «the police was». Y «nothing has been done» es el perfecto en pasiva de la lección anterior, colado aquí a propósito.\"},{\"id\":\"enb1m4l4e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés, en versión hablada\",\"source\":\"Retiraron la publicación el viernes.\",\"answers\":[\"The post was taken down on Friday\",\"The post got taken down on Friday\",\"The post was taken down on Friday.\"],\"hint\":\"El verbo lleva su partícula pegada: take + …\",\"itemIds\":[\"enb1m4takendown\"],\"tip\":\"«take down» es una unidad: quitar algo que estaba puesto — un cartel, una foto, una publicación. En pasiva la partícula se queda pegada al participio: «taken down».\"},{\"id\":\"enb1m4l4e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"The thief got caught on camera.\",\"answers\":[\"Al ladrón lo pillaron con una cámara\",\"Al ladrón lo grabó una cámara\",\"Al ladrón lo cogieron con una cámara\"],\"itemIds\":[\"enb1m4gotcaught\"],\"tip\":\"«on camera» es la fórmula: grabado por una cámara. «In camera» existe, pero significa a puerta cerrada, en un juicio. Una preposición y otro mundo.\"},{\"id\":\"enb1m4l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — primero la versión hablada, luego la escrita\",\"text\":\"My phone got nicked. My phone was stolen.\",\"phonetic\":\"mai fóun got nikt · mai fóun uos̬ STÓU-lon\",\"translation\":\"Me han mangado el móvil. · Me han robado el móvil.\",\"itemIds\":[\"enb1m4natnicked\",\"enb1m4gotstolen\"],\"tip\":\"Dilas seguidas hasta que suenen a dos personas distintas. Ese par —la de la calle y la del examen— es lo que tienes que llevar en la cabeza de cada fórmula de este módulo.\"},{\"id\":\"enb1m4l4e12\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen. Dos escuchas.\",\"audio\":\"You're limping — what happened?|Nothing dramatic. I got hurt at work on Tuesday, moving the boxes of new stock. Nothing was broken, they just sent me home.|And your bike? Amy said something about your bike.|Oh, that. That got nicked outside the library the same week. Honestly, I've had better fortnights.\",\"question\":\"¿Qué le pasó a esta persona el martes?\",\"options\":[\"Le robaron la bici\",\"Se hizo daño en el trabajo\",\"Se perdió una carta\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La bici se la robaron esa misma semana, sí, pero no el martes: el martes es lo del trabajo.\",null,\"De cartas no se habla en ningún momento.\"],\"itemIds\":[\"enb1m4gothurt\",\"enb1m4natnicked\"],\"tip\":\"Dos get-passives en veinte segundos, que es la proporción real del inglés hablado. Y fíjate en la trampa del ítem: las dos desgracias son verdad, pero solo una es del martes.\"},{\"id\":\"enb1m4l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Se me perdió la carta por el camino y nunca apareció.\",\"answers\":[\"The letter got lost in the post and it never turned up\",\"The letter was lost in the post and it never turned up\",\"The letter got lost in the post and never turned up\"],\"hints\":[\"El sujeto es la carta, no tú\",\"The letter got ... in the post and ...\"],\"itemIds\":[\"enb1m4gotlost\"],\"tip\":\"El «se me» español desaparece entero: en inglés no hay manera de meterte en la frase, y eso es exactamente lo que hay que dejar de intentar.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m4-1\",\"book\":\"Someone stole my phone.\",\"real\":\"My phone got nicked.\",\"meaning\":\"Me han robado el móvil\",\"when\":\"Contándoselo a alguien, en cualquier conversación. «nick» es robar en británico coloquial y se oye a todas horas. En una denuncia, en un correo al seguro o en el Writing del examen, NO: allí va «My phone was stolen».\",\"register\":\"jerga\",\"exam\":\"My phone was stolen.\",\"note\":\"«got» en vez de «was» es lo que baja el registro; «nicked» en vez de «stolen» lo baja del todo. Son dos escalones, y puedes usar solo uno: «my phone got stolen» es el punto medio.\",\"sound\":\"mai fóun got nikt\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m4natnicked\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
