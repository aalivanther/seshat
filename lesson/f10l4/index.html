es a nadie\",null,\"Bis später es informal y presencial — con la funcionaria del banco no\"],\"itemIds\":[\"aufwiederhoeren\",\"aufwiedersehen\"],\"tip\":\"hören = oír. Al teléfono solo os volveréis a OÍR: Auf Wiederhören.\"},{\"id\":\"f10l4e2\",\"type\":\"match\",\"prompt\":\"Empareja el guion de la llamada\",\"pairs\":[{\"target\":\"Hier ist Nico\",\"source\":\"Aquí (habla) Nico\"},{\"target\":\"Einen Moment, bitte\",\"source\":\"Un momento, por favor\"},{\"target\":\"Auf Wiederhören!\",\"source\":\"¡Adiós! (por teléfono)\"},{\"target\":\"die Handynummer\",\"source\":\"el número de móvil\"},{\"target\":\"die E-Mail\",\"source\":\"el correo electrónico\"}],\"itemIds\":[\"hierist\",\"einenmoment\",\"aufwiederhoeren\",\"handynummer\",\"email\"]},{\"id\":\"f10l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la petición\",\"text\":\"Kann ich mit Frau Müller ___?\",\"answers\":[\"sprechen\"],\"translation\":\"¿Puedo hablar con la señora Müller?\",\"hints\":[\"La pinza de können: infinitivo al final\",\"sp-r-e-ch-en\"],\"itemIds\":[\"kannichsprechen\",\"sprechen\"]},{\"id\":\"f10l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa el separable\",\"text\":\"Ich rufe dich morgen ___.\",\"answers\":[\"an\"],\"translation\":\"Te llamo mañana.\",\"hints\":[\"El prefijo de anrufen, al final\",\"a-n\"],\"itemIds\":[\"anrufen\",\"morgenadv\"]},{\"id\":\"f10l4e5\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe lo que oyes\",\"text\":\"Einen Moment, bitte\",\"translation\":\"Un momento, por favor\",\"hints\":[\"Lo que oyes mientras te pasan la llamada\",\"Einen con -en\"],\"itemIds\":[\"einenmoment\"]},{\"id\":\"f10l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta\",\"text\":\"Wie ist deine ___? — 0176 34 56 78.\",\"answers\":[\"Handynummer\"],\"translation\":\"¿Cuál es tu número de móvil? — 0176 34 56 78.\",\"hints\":[\"Handy (móvil) + Nummer\",\"Todo junto y con mayúscula\"],\"itemIds\":[\"handynummer\"]},{\"id\":\"f10l4e7\",\"type\":\"mc\",\"prompt\":\"La petición nueva
