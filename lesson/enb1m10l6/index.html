xt/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8d3,"])</script><script>self.__next_f.push([1,"El texto de hoy viene de un boletín vecinal de \u003cb\u003eSheffield\u003c/b\u003e, y el sitio no es decorado: el \u003cb\u003edato\u003c/b\u003e que lo sostiene es real y sorprende a casi todo el mundo. En \u003cb\u003e2018 el Reino Unido nombró a un miembro del gobierno con la soledad en el título del cargo\u003c/b\u003e —el primero del mundo, y Japón hizo lo mismo tres años después—. La soledad dejó de ser un asunto privado y pasó a ser política pública. Una de las respuestas que más ha crecido desde entonces es la red de \u003cb\u003eMen's Sheds\u003c/b\u003e: talleres de barrio, unos seiscientos en Gran Bretaña, donde se arreglan cosas y, de paso, se habla.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí no hay dialecto.\u003c/b\u003e Los acentos y las variedades del inglés son el módulo 7 entero. Hoy Sheffield aporta el dato y la escena, no el vocabulario.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos palabras que el español junta y el inglés separa, y hay que separarlas hoy:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ealone\u003c/b\u003e / \u003cb\u003eon your own\u003c/b\u003e = \u003cb\u003esolo\u003c/b\u003e, sin nadie al lado. Es un dato, y puede ser estupendo: \u003ci\u003eI live on my own and I love it\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003elonely\u003c/b\u003e = \u003cb\u003esolo y dolido por estarlo\u003c/b\u003e. Es un sentimiento. \u003ci\u003eHe had been lonely for years.\u003c/i\u003e\u003cbr/\u003e· Y el sustantivo: \u003cb\u003eloneliness\u003c/b\u003e es la soledad que pesa; la que se elige y se disfruta es \u003cb\u003esolitude\u003c/b\u003e.\u003cbr/\u003eDecir \u003ci\u003eI am alone\u003c/i\u003e cuando querías decir \u003ci\u003eI am lonely\u003c/i\u003e cambia una confesión por un parte meteorológico.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eESTRATEGIA DE LECTURA — la de siempre y una nueva que es de este módulo:\u003c/b\u003e\u003cbr/\u003e1. El título primero, y sin pararse en cada palabra. Las difíciles van glosadas: tócalas y suenan.\u003cbr/\u003e2. \u003cb\u003eSigue los «had».\u003c/b\u003e En un texto narrativo, cada \u003ci\u003ehad\u003c/i\u003e + participio es un cartel que dice «esto es anterior». Cuando un párrafo se llena de ellos, no está avanzando: está explicando cómo se llegó hasta ahí. Saberlo te ahorra releer.\u003cbr/\u003e3. Y lo de siempre: que alguien lo diga no lo convierte en verdad. Aquí hay dos personas citadas y las dos opinan — y una de ellas se contradice un poco a sí misma al final, que es donde está la mejor pregunta.\u003cbr/\u003e\u003cbr/\u003eDos preguntas son de \u003cb\u003erespuesta escrita, con un máximo de tres palabras\u003c/b\u003e, que es el formato del Reading Part 4. Tres son de inferencia: no están escritas en ninguna línea, se sacan juntando dos."])</script><script>self.__next_f.push([1,"18:Tab7,"])</script><script>self.__next_f.push([1,"On a Tuesday morning at the end of Cromwell Street there are eleven men, two kettles and a radio that nobody is listening to. The building used to be a council storeroom. Now it is a [[shed|taller de barrio]] — one of about six hundred in Britain — and the sign on the door says, in letters somebody cut out by hand, MEN'S SHED: COME IN.\u003cbr/\u003e\u003cbr/\u003eThe idea came from Australia in the nineties and reached this country slowly. Then, in 2018, something happened that made everybody look at it again: the government appointed a minister with [[loneliness|la soledad que pesa]] in the job title, the first anywhere in the world. Being alone too much had stopped being a private matter and become a public one.\u003cbr/\u003e\u003cbr/\u003e\"I'd been on my own for four years before I came here,\" says Derek Fairhurst, who is seventy-one and mends clocks. \"My wife had died, the children had moved to Leeds, and I'd got into the habit of not answering the door. I didn't think of myself as lonely. I thought of myself as somebody who kept himself to himself.\"\u003cbr/\u003e\u003cbr/\u003eHe was brought in by a neighbour who refused to take no for an answer. \"She'd asked me four times,\" he says. \"The fifth time she just stood on the step until I put my coat on.\"\u003cbr/\u003e\u003cbr/\u003eWhat happens in the shed is, on paper, not very much. People repair things: lamps, bicycles, a chair from the primary school. There is a waiting list for the [[lathe|torno]]. Nobody organises a conversation, and nobody is asked how they are feeling.\u003cbr/\u003e\u003cbr/\u003eThat, according to Yvonne Adesina, who runs the project, is the entire point. \"Men of that generation didn't use to talk about anything at a table with a cup of tea in front of them. But they will talk for two hours side by side, with their hands busy. Shoulder to shoulder, not face to face. We didn't invent that. We just stopped fighting it.\"\u003cbr/\u003e\u003cbr/\u003eShe is careful with the word itself. \"Nobody walks in here and says it. They say they are bored, or that the house has been quiet since the dog died. If you wait for somebody to use the word, you will wait for ever.\"\u003cbr/\u003e\u003cbr/\u003eNot everything works. Two of the first members fell out over a set of tools in the opening year, and one of them never came back. The [[lease|el contrato del local]] runs out in 2027 and nobody knows what happens then. And the shed is, by a long way, the oldest and the least mixed room in a young and very mixed part of the city — something Yvonne says out loud before anybody else can.\u003cbr/\u003e\u003cbr/\u003eDerek is not sentimental about any of it. \"It's a shed. I come on Tuesdays, I mend clocks that aren't mine, and I go home.\" Then, after a moment: \"I'd forgotten what it was like to be expected somewhere. That's the thing nobody tells you. Not the company. Being expected.\""])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l6\",\"phaseId\":\"enb1m10\",\"title\":\"The shed at the end of the street\",\"subtitle\":\"Un texto de Sheffield, un dato que no te esperas y el past perfect leído, no escrito\",\"minutes\":19,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del texto\",\"itemIds\":[\"enb1m10lonely\",\"enb1m10onhisown\",\"enb1m10loneliness\",\"enb1m10sidebyside\",\"enb1m10keptmyselftomyself\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto que cuenta una vida\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Toca las palabras subrayadas si te bloquean.\",\"title\":\"The shed at the end of Cromwell Street\",\"source\":\"From a community newsletter in Sheffield (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m10l6e1q1\",\"q\":\"In which year did the government appoint a minister with loneliness in the job title? (Máximo 3 palabras)\",\"accepted\":[\"2018\",\"in 2018\",\"in two thousand and eighteen\"],\"why\":\"«Then, in 2018, something happened…». Un año se copia tal cual: cuatro cifras cuentan como una palabra y no hace falta nada más.\"},{\"id\":\"enb1m10l6e1q2\",\"q\":\"What did the building use to be? (Máximo 3 palabras)\",\"accepted\":[\"a council storeroom\",\"council storeroom\",\"a storeroom\",\"storeroom\"],\"why\":\"«The building used to be a council storeroom». Con tres palabras vas justo y bien; una frase entera copiada del texto puntuaría cero aunque el contenido fuera correcto.\"},{\"id\":\"enb1m10l6e1q3\",\"q\":\"Why didn't Derek think of himself as lonely?\",\"options\":[\"Because not answering the door had turned into who he was, not into a problem.\",\"Because he actually had a busy social life.\",\"Because his children rang him every day from Leeds.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que juntar dos frases suyas: «I'd got into the habit of not answering the door» y «I thought of myself as somebody who kept himself to himself». La costumbre se le había vuelto identidad, y eso es justo lo que impide llamarlo por su nombre.\"},{\"id\":\"enb1m10l6e1q4\",\"q\":\"Why does Yvonne avoid the word?\",\"options\":[\"Because nobody uses it about themselves, so waiting for somebody to say it means waiting for ever.\",\"Because she finds the word offensive.\",\"Because feelings are not allowed to be talked about in the workshop.\"],\"answer\":0,\"inference\":true,\"why\":\"Lo dice sin decirlo: «Nobody walks in here and says it… If you wait for somebody to use the word, you will wait for ever». No es que la palabra ofenda: es que no sirve para encontrar a nadie.\"},{\"id\":\"enb1m10l6e1q5\",\"q\":\"What does Derek's last line show about what he values most?\",\"options\":[\"That what he missed was not the company but being expected.\",\"That what he likes most is mending clocks.\",\"That he would rather the workshop opened more often.\"],\"answer\":0,\"inference\":true,\"why\":\"«Not the company. Being expected.» Y fíjate en que se contradice con lo que acaba de decir dos líneas antes («It's a shed, I come, I go home»): esa contradicción ES la respuesta.\"}],\"itemIds\":[\"enb1m10lonely\",\"enb1m10onhisown\",\"enb1m10loneliness\",\"enb1m10sidebyside\",\"enb1m10keptmyselftomyself\",\"enb1m10falloutwith\"],\"tip\":\"Vuelve al tercer párrafo y cuenta los «had»: had been, had died, had moved, had got. Cuatro seguidos, y ninguno avanza la historia: los cuatro explican cómo llegó Derek hasta la puerta. Eso es leer el past perfect, que es lo que se te va a pedir mucho antes que escribirlo.\"},{\"id\":\"enb1m10l6e2\",\"type\":\"mc\",\"prompt\":\"La pareja que el español junta\",\"question\":\"«I live alone and I love it.» ¿Qué NO puedes decir aquí en lugar de «alone»?\",\"options\":[\"lonely\",\"on my own\",\"by myself\"],\"answer\":0,\"whyWrong\":[null,\"«On my own» es exactamente lo mismo que «alone»: el dato, sin juicio.\",\"«By myself» también sirve, y ya lo traes del A2.\"],\"itemIds\":[\"enb1m10lonely\",\"enb1m10onhisown\",\"ena2m9bymyself\"],\"tip\":\"«I live lonely and I love it» es una contradicción: «lonely» ya lleva dentro que lo pasas mal. Es el error de vocabulario que más cambia el sentido de una frase entera.\"},{\"id\":\"enb1m10l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa con la palabra del sentimiento\",\"text\":\"He had been ___ for years before somebody knocked on his door.\",\"answers\":[\"lonely\"],\"translation\":\"Llevaba años sintiéndose solo antes de que alguien llamara a su puerta.\",\"hints\":[\"Seis letras, y no es «alone»\",\"Es la que duele\"],\"itemIds\":[\"enb1m10lonely\"],\"tip\":\"Fíjate en el tiempo: «had been… before somebody knocked». El «had» abarca todos esos años y los coloca antes del golpe en la puerta. Sin él, la frase se queda sin historia.\"},{\"id\":\"enb1m10l6e4\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra: aquí se habla de un sentimiento.\",\"wrong\":\"After his wife died he was very alone.\",\"answers\":[\"After his wife died he was very lonely.\"],\"why\":\"«Alone» es el dato de que no hay nadie más; «lonely» es lo que se siente por ello. Con «alone», la frase solo informa de cuánta gente vive en la casa.\",\"translation\":\"Después de morir su mujer se sentía muy solo.\",\"itemIds\":[\"enb1m10lonely\",\"enb1m10onhisown\"]},{\"id\":\"enb1m10l6e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen del texto\",\"text\":\"Derek had been on his ___ for four years. He never used the word ___ about himself: he said he was somebody who kept himself to ___ .\",\"answers\":[\"own\",\"lonely\",\"himself\"],\"bank\":[\"own\",\"lonely\",\"himself\",\"herself\",\"bored\",\"door\"],\"translation\":\"Derek llevaba cuatro años viviendo solo. Nunca usaba la palabra «solo» hablando de sí mismo: decía que era de los que van a lo suyo.\",\"itemIds\":[\"enb1m10onhisown\",\"enb1m10lonely\",\"enb1m10keptmyselftomyself\"],\"tip\":\"«Bored» está en el banco a propósito: es la palabra que Yvonne dice que sí usa la gente. Que aparezca en el texto no la convierte en la respuesta — es la trampa número uno del Reading.\"},{\"id\":\"enb1m10l6e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"He lived alone and he was very unhappy about it.\",\"forbid\":[\"alone\",\"unhappy\"],\"answers\":[\"He lived on his own and he was very lonely\",\"He lived by himself and he was very lonely\",\"He was living on his own and he felt very lonely\"],\"translation\":\"Vivía solo y lo llevaba muy mal.\",\"itemIds\":[\"enb1m10onhisown\",\"enb1m10lonely\"],\"tip\":\"Fíjate en lo que hace «lonely»: se come dos ideas —vivir solo y pasarlo mal— en una sola palabra. Ese ahorro es exactamente lo que el examen llama rango de vocabulario.\"},{\"id\":\"enb1m10l6e7\",\"type\":\"build\",\"prompt\":\"Construye la frase del taller\",\"target\":\"They talk side by side, not face to face\",\"translation\":\"Hablan hombro con hombro, no cara a cara\",\"distractors\":[\"together\",\"each\"],\"itemIds\":[\"enb1m10sidebyside\"],\"tip\":\"«Side by side» y «face to face» son fórmulas fijas: no llevan artículo ni plural y no se tocan. Se aprenden enteras, como «little by little».\"},{\"id\":\"enb1m10l6e8\",\"type\":\"transform\",\"prompt\":\"Pon la historia debajo del momento\",\"source\":\"He was on his own for four years. Then he came to the shed.\",\"instruction\":\"Júntalas empezando por «He had…»\",\"answers\":[\"He had been on his own for four years before he came to the shed\",\"He had been on his own for four years before he came to the shed.\",\"He'd been on his own for four years before he came to the shed\"],\"translation\":\"Llevaba cuatro años viviendo solo cuando llegó al taller.\",\"hints\":[\"«Before» te da el orden y el «had» te da la duración\",\"He had been on his own for four years ...\"],\"itemIds\":[\"enb1m10onhisown\",\"enb1m10hadalreadyleft\"],\"tip\":\"«Had been… for four years» es el past perfect midiendo duración, igual que el presente perfecto del módulo 1 medía «I've lived here for two years». Mismo mecanismo, un piso más abajo.\"},{\"id\":\"enb1m10l6e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Iba a lo mío y no me relacionaba con los vecinos.\",\"answers\":[\"I kept myself to myself and I didn't talk to the neighbours\",\"I kept myself to myself and I didn't speak to the neighbours\",\"I kept myself to myself and I never talked to the neighbours\"],\"hint\":\"La primera mitad es una fórmula fija con dos reflexivos iguales\",\"itemIds\":[\"enb1m10keptmyselftomyself\",\"ena2m9nextdoorneighbour\"],\"tip\":\"«Keep yourself to yourself» no es presumir de independencia: en boca de un británico suele ser una explicación un poco triste, y así hay que leerla.\"},{\"id\":\"enb1m10l6e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"I'd forgotten what it was like to be expected somewhere.\",\"answers\":[\"Se me había olvidado lo que era que te esperaran en algún sitio\",\"Había olvidado lo que se siente cuando alguien te espera en algún sitio\",\"Se me había olvidado lo que era tener a alguien esperándote\"],\"itemIds\":[\"enb1m10hadntrealised\"],\"tip\":\"«I'd forgotten» es past perfect, y aquí hace algo muy fino: coloca el olvido antes del momento en que se da cuenta. Es la frase más importante del texto y la que menos ruido hace.\"},{\"id\":\"enb1m10l6e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"He had been lonely for years.\",\"translation\":\"Llevaba años sintiéndose solo.\",\"hints\":[\"Empieza por «He had…»\",\"He had been ... for years\"],\"itemIds\":[\"enb1m10lonely\"],\"tip\":\"«Had been» suena casi como una sola palabra: «jad-bin», con la segunda muy floja. Es el grupo que más se come el inglés hablado, y por eso el past perfect se oye tan poco y se escribe tanto.\"},{\"id\":\"enb1m10l6e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres frases del texto que más se repiten en la vida real\",\"text\":\"I live on my own. I keep myself to myself. It's not the same as being lonely.\",\"phonetic\":\"ai liv on mai óun · ai kiip mai-SÉLF tu mai-SÉLF · its not de séim as̬ BÍ-ing LÓUN-li\",\"translation\":\"Vivo solo. Voy a lo mío. No es lo mismo que sentirse solo.\",\"itemIds\":[\"enb1m10onhisown\",\"enb1m10keptmyselftomyself\",\"enb1m10lonely\"],\"tip\":\"Tres frases que dicen tres cosas distintas y que en español caben todas en «estoy solo». Dilas seguidas hasta que suenen distintas también en tu cabeza.\"},{\"id\":\"enb1m10l6e13\",\"type\":\"type\",\"prompt\":\"Cierre de la lección\",\"question\":\"La soledad no es lo mismo que estar solo.\",\"answers\":[\"Loneliness is not the same as being alone\",\"Loneliness isn't the same as being alone\",\"Loneliness is not the same as being on your own\"],\"hints\":[\"Empieza por el sustantivo del sentimiento\",\"Loneliness is not the same as ...\"],\"itemIds\":[\"enb1m10loneliness\",\"enb1m10onhisown\"],\"tip\":\"El sustantivo es «loneliness», con esa doble terminación que cuesta escribir: -li- + -ness. La otra soledad, la buena, es «solitude», y esa casi nunca aparece en prensa.\"}]}],\"resources\":[{\"label\":\"UK Men's Sheds Association\",\"url\":\"https://menssheds.org.uk/\",\"note\":\"Entra en «Find a Shed» y lee la descripción de dos o tres talleres distintos. Son textos cortos, escritos por vecinos y no por periodistas: es el inglés más real que vas a leer hoy, y está lleno de «used to» y de «we would».\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
