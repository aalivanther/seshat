3cb\u003esind/«siend»\u003c/b\u003e aparecen revueltos en los mismos ejercicios. La evidencia sobre práctica intercalada dice que mezclar estructuras confundibles obliga al cerebro a DISCRIMINAR entre ellas — pero solo funciona después de dominarlas por separado, y tú ya lo hiciste. Si fallas alguna, es oro: acabas de encontrar tu hueco antes que el examen. Cuando termines: Ich bin \u003cb\u003efertig\u003c/b\u003e. Y para el examen: \u003cb\u003eViel Erfolg!\u003c/b\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f6l5e1\",\"type\":\"mc\",\"prompt\":\"Caza el error clásico\",\"question\":\"«Estamos listos» →\",\"options\":[\"Wir siend fertig\",\"Wir sind fertig\",\"Wir sind fertich\"],\"answer\":1,\"whyWrong\":[\"«siend» no existe — el error cazado desde la fase 0\",null,\"fertig se escribe con -ig aunque suene «-ij»\"],\"itemIds\":[\"fertig\"],\"tip\":\"sind: s-i-n-d, sin e. Si esta ya no te la cuelan, estás listo.\"},{\"id\":\"f6l5e2\",\"type\":\"mc\",\"prompt\":\"kein o nicht — decide rápido\",\"question\":\"¿Cuál de las dos es correcta?\",\"options\":[\"Ich habe nicht Auto — Ich bin kein müde\",\"Ich habe kein Auto — Ich bin nicht müde\"],\"answer\":1,\"whyWrong\":[\"Al revés: kein niega sustantivos, nicht niega adjetivos y verbos\",null],\"itemIds\":[\"auto\",\"muede\"],\"tip\":\"Sustantivo → kein. Adjetivo/verbo → nicht. En el examen esta decisión aparece seguro.\"},{\"id\":\"f6l5e3\",\"type\":\"cloze\",\"prompt\":\"du o Sie — completa para el examinador\",\"text\":\"Wie heiß___ Sie?\",\"answers\":[\"en\"],\"translation\":\"¿Cómo se llama usted? — al examinador SIEMPRE así\",\"hints\":[\"Con Sie, como el infinitivo\"],\"itemIds\":[\"stellensiesichvor\"],\"tip\":\"En el oral, tutear al examinador es EL error de registro. Sie + verbo en -en, siempre.\"},{\"id\":\"f6l5e4\",\"type\":\"cloze\",\"prompt\":\"mögen o gern — con VERBO\",\"text\":\"Ich esse ___ Pizza. (me gusta comer)\",\"answers\":[\"gern\",\"gerne\"],\"translation\":\"Me gusta comer pizza.\",\"hints\":[\"Aquí ya hay un verbo (esse) — no cabe otro\",\"verbo + g-e-r-n; mögen sería «Ich mag Pizza» sin esse\"],\"itemIds\":[\"amliebstenesse\"],\"tip\":\"¿Hay verbo de acción? → gern. ¿Solo sustantivo? → mögen. Nunca «Ich mag essen Pizza» para esto.\"},{\"id\":\"f6l5e5\",\"type\":\"cloze\",\"prompt\":\"einen o ein — el acusativo decide\",\"text\":\"Ich habe ___ Hund und ein Pferd.\",\"answers\":[\"einen\"],\"translation\":\"Tengo un perro y un caballo.\",\"hints\":[\"der Hund es masculino; das Pferd es neutro\",\"Masculino en acusativo: ein → e-i-n-e-n\"],\"itemIds\":[\"hund\",\"pferd\"],\"tip\":\"Solo el masculino cambia en acusativo (einen/keinen). das Pferd se queda en ein.\"},{\"id\":\"f6l5e6\",\"type\":\"build\",\"prompt\":\"Hunde o Hunden — construye\",\"target\":\"Ich habe keinen Hund, aber ich mag Hunde\",\"translation\":\"No tengo perro pero me gustan los perros\",\"distractors\":[\"Hunden\",\"nicht\"],\"itemIds\":[\"hund\"],\"tip\":\"Plural acusativo: Hunde. «Hunden» es otra forma (dativo) que estudiarás en A2 — el plural normal es Hunde.\"},{\"id\":\"f6l5e7\",\"type\":\"listen\",\"prompt\":\"Dictado integrador\",\"text\":\"Wir sind fertig und wir können jetzt Deutsch\",\"translation\":\"Estamos listos y ya sabemos alemán\",\"hints\":[\"sind sin e; fertig con -ig\",\"können con Umlaut\"],\"itemIds\":[\"fertig\",\"vielerfolg\"]},{\"id\":\"f6l5e8\",\"type\":\"cloze\",\"prompt\":\"El deseo para el gran día\",\"text\":\"Viel ___! (¡mucho éxito!)\",\"answers\":[\"Erfolg\"],\"translation\":\"¡Mucho éxito!\",\"hints\":[\"Er + folg\",\"Con mayúscula: es sustantivo\"],\"itemIds\":[\"vielerfolg\"]},{\"id\":\"f6l5e9\",\"type\":\"type\",\"prompt\":\"Producción libre 1 — kein + plural correcto\",\"question\":\"No tengo gato pero me gustan los gatos\",\"answers\":[\"Ich habe keine Katze, aber ich mag Katzen\"],\"hints\":[\"die Katze (femenino) → keine\",\"Plural: Katzen\"],\"itemIds\":[\"katze\"]},{\"id\":\"f6l5e10\",\"type\":\"type\",\"prompt\":\"Producción libre 2 — registro formal + Satzklammer\",\"question\":\"¿Sabe usted cocinar? (formal)\",\"answers\":[\"Können Sie kochen?\",\"Können Sie kochen\"],\"hints\":[\"Formal: Sie con el modal en -en\",\"kochen cierra la pinza\"],\"itemIds\":[\"koennen\",\"kochen\"]},{\"id\":\"f6l5e11\",\"type\":\"type\",\"prompt\":\"Producción libre 3 — tu frase de graduación\",\"question\":\"Me llamo Sofía, me gusta cocinar y quiero aprender alemán\",\"answers\":[\"Ich heiße Sofía, ich koche gern und ich will Deutsch lernen\",\"Ich heiße Sofía, ich koche gern und will Deutsch lernen\",\"Ich heiße Sofía, ich koche gerne und ich will Deutsch lernen\",\"Ich heiße Sofía, ich koche gerne und will Deutsch lernen\"],\"hints\":[\"Tres bloques: heißen + kochen gern + will ... lernen\",\"gern tras el verbo; lernen al final de su frase\",\"Ich heiße ..., ich koche gern und ich will Deutsch lernen\"],\"itemIds\":[\"ichheisse\",\"kochen\",\"ichwilldeutsch\"],\"tip\":\"Presentación de fase 0 + gern de fase 5 + Satzklammer modal: todo el curso en una frase. Viel Erfolg!\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz completo (PDF)\",\"url\":\"https://www.goethe.de/pro/relaunch/prf/materialien/A1_sd1/sd_1_modellsatz.pdf\",\"note\":\"AHORA sí: haz el examen modelo ENTERO con reloj (Hören 20 + Lesen 25 + Schreiben 20). Corrige con las soluciones y anota tus fallos.\"},{\"label\":\"Goethe — Trainer interactivo con autocorrección\",\"url\":\"https://bfu.goethe.de/a1_sd1/\",\"note\":\"Segunda pasada online autocorregida de lo que fallaste en papel. Si superas el 60%, estás en zona de aprobado.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0by
