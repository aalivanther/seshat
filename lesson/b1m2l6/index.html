señales que delatan la postura de quien escribe:\u003cbr/\u003e1. \u003cb\u003eLa concesión\u003c/b\u003e: «Natürlich hat … Vorteile, aber …». Lo que va DESPUÉS del «aber» es su opinión de verdad.\u003cbr/\u003e2. \u003cb\u003eLos conectores de matiz\u003c/b\u003e: [[allerdings|ahora bien, sin embargo]], jedoch, trotzdem. Marcan el giro.\u003cbr/\u003e3. \u003cb\u003eLa última frase\u003c/b\u003e. En este género, casi siempre está ahí la tesis.\u003cbr/\u003e\u003cbr/\u003eNota plurizéntrica: el texto es suizo y verás \u003cb\u003edas [[Znüni|la pausa/almuerzo de media mañana — palabra suiza; en Alemania: die Pause am Vormittag]]\u003c/b\u003e, la pausa de media mañana. Y fíjate en una cosa que no lleva nota al pie porque no hace falta entenderla, solo reconocerla: \u003cb\u003een Suiza no se escribe ß\u003c/b\u003e — \u003ci\u003eweiss\u003c/i\u003e, \u003ci\u003ezusammensassen\u003c/i\u003e, \u003ci\u003eStrasse\u003c/i\u003e. El examen incluye textos de Austria y Suiza tal cual.18:T85a,"])</script><script>self.__next_f.push([1,"Seit drei Jahren darf in unserem Betrieb jeder selbst entscheiden, wann er anfängt. Die einen kommen um sieben, die anderen um zehn. Die Chefin nennt das modern. Ich sage: Es ist bequem — aber vor allem für die, die sowieso schon Glück haben. Denn wer entscheiden darf, wann er anfängt, muss auch entscheiden, wann er aufhört. Und genau das fällt vielen von uns schwer.\n\nNatürlich hat die Gleitzeit Vorteile, und ich will sie nicht kleinreden. Wer Kinder hat, kann sie in die Schule bringen, ohne jeden Morgen in Panik zu geraten. Wer abends besser denkt, arbeitet abends. Und der Arbeitsweg wird kürzer, weil man nicht mehr im [[Stau|atasco]] steht. Meine Kollegin Sandra sagt, ohne flexible Zeiten hätte sie ihren Job längst aufgegeben.\n\nAllerdings hat die Sache eine zweite Seite. Wer immer erreichbar ist, hört nie richtig auf zu arbeiten. Das [[Znüni|la pausa de media mañana — palabra suiza; en Alemania: „die Pause am Vormittag“]] um neun, bei dem früher alle zusammensassen, gibt es nicht mehr: Jeder isst allein vor dem Bildschirm. Und wenn niemand weiss, wann die anderen da sind, dauert jede [[Absprache|acuerdo, coordinación]] drei Tage. Eine Kollegin aus der [[Buchhaltung|contabilidad]] hat mir erzählt, dass sie inzwischen um sechs Uhr morgens die ersten Mails beantwortet — nicht weil jemand es verlangt, sondern weil sonst der Tag nicht reicht.\n\nDazu kommt etwas, worüber selten jemand spricht. Flexible Zeiten sind ein Geschenk für Menschen, die allein wohnen oder deren Partner zu Hause ist. Für eine Verkäuferin, die um sechs im Laden stehen muss, ändert sich gar nichts. Auch der Busfahrer, die Pflegerin und der Koch arbeiten weiter nach einem festen Plan. Die Freiheit, über die alle reden, gilt nur für einen Teil der Arbeitnehmer.\n\nIch würde die Gleitzeit trotzdem nicht abschaffen. Aber ich hätte gern Regeln. Eine feste Kernzeit von zehn bis drei, in der alle da sind. Keine Mails nach acht Uhr abends. Und einmal pro Woche ein Tag, an dem das ganze Team zusammen im Büro sitzt.\n\nFreiheit ohne Regeln ist am Ende keine Freiheit, sondern nur Stress, den man sich selbst macht."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m2l6\",\"phaseId\":\"b1m2\",\"title\":\"Gleitzeit für alle?\",\"subtitle\":\"Lectura larga — un artículo de opinión desde Suiza\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del debate\",\"itemIds\":[\"b1m2arbeitgeber\",\"b1m2arbeitnehmer\",\"b1m2erreichbar\",\"b1m2znueni\",\"b1m2vorteilnachteil\",\"b1m2abschaffen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: qué es un artículo de OPINIÓN y por qué se lee distinto\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo de opinión. Antes de responder, decide una cosa: ¿está a favor o en contra?\",\"title\":\"Gleitzeit für alle? Ein Zwischenruf\",\"source\":\"Meinungsbeitrag aus einer Schweizer Wochenzeitung (bearbeitet)\",\"text\":\"$18\",\"questions\":[{\"id\":\"b1m2l6e1q1\",\"q\":\"Welche Haltung hat der Autor zur Gleitzeit?\",\"options\":[\"Er ist dagegen und will sie abschaffen.\",\"Er ist dafür, will aber klare Regeln.\",\"Ihm ist die Frage egal.\"],\"answer\":1,\"inference\":true,\"why\":\"„Ich würde die Gleitzeit trotzdem nicht abschaffen. Aber ich hätte gern Regeln.“ Ni rechazo ni entusiasmo: apoyo con condiciones.\"},{\"id\":\"b1m2l6e1q2\",\"q\":\"Was ist mit dem Znüni passiert?\",\"options\":[\"Es findet jetzt später statt.\",\"Es gibt es nicht mehr gemeinsam.\",\"Es dauert heute länger.\"],\"answer\":1,\"why\":\"„…gibt es nicht mehr: Jeder isst allein vor dem Bildschirm.“ La pausa sigue existiendo; lo que se ha perdido es hacerla juntos.\"},{\"id\":\"b1m2l6e1q3\",\"q\":\"Warum nennt der Autor das Beispiel der Verkäuferin?\",\"options\":[\"Weil Verkäuferinnen zu wenig verdienen.\",\"Weil die Gleitzeit nicht für alle Berufe gilt.\",\"Weil sie gern früher anfangen möchte.\"],\"answer\":1,\"inference\":true,\"why\":\"El ejemplo sirve para su tesis del cuarto párrafo: la libertad de la que todos hablan solo vale para una parte de los trabajadores.\"},{\"id\":\"b1m2l6e1q4\",\"q\":\"Was meint der Autor mit „Stress, den man sich selbst macht“?\",\"options\":[\"Ohne Grenzen hört die Arbeit nie auf.\",\"Die Kollegen machen im Büro zu viel Lärm.\",\"Die Chefin verlangt zu viele Überstunden.\"],\"answer\":0,\"inference\":true,\"why\":\"Enlaza con „Wer immer erreichbar ist, hört nie richtig auf zu arbeiten“: sin reglas, el propio trabajador se queda sin frontera.\"},{\"id\":\"b1m2l6e1q5\",\"q\":\"Was schlägt der Autor konkret vor?\",\"options\":[\"Eine feste Kernzeit von zehn bis drei.\",\"Homeoffice für alle Mitarbeiter.\",\"Weniger Gehalt für flexible Zeiten.\"],\"answer\":0,\"why\":\"„Eine feste Kernzeit von zehn bis drei, in der alle da sind“ — junto a la prohibición de correos después de las ocho y un día de equipo.\"}],\"itemIds\":[\"b1m2gleitzeit\",\"b1m2kernzeit\",\"b1m2erreichbar\",\"b1m2znueni\",\"b1m2abschaffen\",\"b1m2arbeitnehmer\"],\"tip\":\"Guarda este texto: es a la vez modelo de lectura (Lesen Teil 2 y 4) y modelo de escritura — la estructura tesis → concesión → objeción → propuesta → cierre es la que vas a usar en la lección 8.\"},{\"id\":\"b1m2l6e2\",\"type\":\"mc\",\"prompt\":\"La señal de la concesión\",\"question\":\"„Natürlich hat die Gleitzeit Vorteile, und ich will sie nicht kleinreden.“ ¿Qué anuncia esta frase?\",\"options\":[\"Que a continuación viene una objeción\",\"Que el autor está totalmente a favor\",\"Que el autor cambia de tema\"],\"answer\":0,\"whyWrong\":[null,\"Si estuviera del todo a favor no necesitaría conceder nada\",\"El tema sigue siendo el mismo en todo el texto\"],\"itemIds\":[\"b1m2vorteilnachteil\",\"b1m2gleitzeit\"],\"tip\":\"«Natürlich ..., aber ...» es la maniobra clásica: reconozco lo tuyo para que escuches lo mío. Úsala tú también: sube el criterio Kohärenz.\"},{\"id\":\"b1m2l6e3\",\"type\":\"match\",\"prompt\":\"Empareja los dos lados del contrato\",\"pairs\":[{\"target\":\"der Arbeitgeber\",\"source\":\"quien da el trabajo: la empresa\"},{\"target\":\"der Arbeitnehmer\",\"source\":\"quien toma el trabajo: el empleado\"},{\"target\":\"die Kernzeit\",\"source\":\"la franja en la que todos están\"},{\"target\":\"die Probezeit\",\"source\":\"el periodo de prueba\"}],\"itemIds\":[\"b1m2arbeitgeber\",\"b1m2arbeitnehmer\",\"b1m2kernzeit\",\"b1m2probezeit\"],\"tip\":\"Arbeit-GEBER da el trabajo, Arbeit-NEHMER lo toma. La palabra lleva la lógica dentro: en alemán, casi siempre.\"},{\"id\":\"b1m2l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra del texto\",\"text\":\"Wer ständig ___ ist, hört nie richtig auf zu arbeiten.\",\"answers\":[\"erreichbar\"],\"translation\":\"Quien está siempre localizable no deja nunca de trabajar del todo.\",\"hints\":[\"erreichen (alcanzar) + -bar (que se puede)\",\"e-r-r-e-i-c-h-b-a-r\"],\"itemIds\":[\"b1m2erreichbar\"],\"tip\":\"El sufijo -bar es tu amigo: bezahlbar (que se puede pagar), machbar (factible), erreichbar (localizable). Multiplica vocabulario gratis.\"},{\"id\":\"b1m2l6e5\",\"type\":\"gapbank\",\"prompt\":\"Resume el artículo con los conectores correctos\",\"text\":\"Der Autor findet die Gleitzeit gut, ___ sie nicht für alle Berufe funktioniert. ___ muss es klare Regeln geben. Er will die Gleitzeit nicht abschaffen, ___ sie vielen Familien hilft.\",\"answers\":[\"obwohl\",\"Deshalb\",\"weil\"],\"bank\":[\"obwohl\",\"Deshalb\",\"weil\",\"damit\",\"falls\",\"denn\"],\"translation\":\"El autor considera buena la Gleitzeit aunque no funcione para todas las profesiones. Por eso tiene que haber reglas claras. No quiere eliminarla porque ayuda a muchas familias.\",\"itemIds\":[\"b1m2obwohl\",\"b1m2abschaffen\",\"a2m6deshalb\"],\"tip\":\"Primero mira el orden del verbo (al final = subordinante; detrás del hueco = adverbio) y luego el sentido: el hueco 1 concede (obwohl) y el 3 da la causa (weil).\"},{\"id\":\"b1m2l6e6\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Allerdings man muss diszipliniert sein.\",\"answers\":[\"Allerdings muss man diszipliniert sein.\"],\"why\":\"«allerdings» es adverbio en posición 1 → inversión: el verbo va inmediatamente detrás y «man» pasa al tercer lugar.\",\"translation\":\"Ahora bien, hay que ser disciplinado.\",\"itemIds\":[\"b1m2allerdings\"]},{\"id\":\"b1m2l6e7\",\"type\":\"mc\",\"prompt\":\"El helvetismo del texto\",\"question\":\"„das Znüni“ — ¿qué palabra usaría un alemán?\",\"options\":[\"die Pause am Vormittag\",\"das Abendessen\",\"der Feierabend\"],\"answer\":0,\"whyWrong\":[null,\"das Abendessen es la cena\",\"der Feierabend es el final de la jornada\"],\"itemIds\":[\"b1m2znueni\",\"a2m10pause\",\"a2m10feierabend\"],\"tip\":\"«Znüni» viene de «zu neun» (a las nueve) — por eso en el texto la pausa es «um neun». Suiza tiene también «Zvieri», de «zu vier», la de las cuatro. El examen glosa estas palabras: no pierdas tiempo con ellas.\"},{\"id\":\"b1m2l6e8\",\"type\":\"transform\",\"prompt\":\"Cambia la postura\",\"source\":\"Ich würde die Gleitzeit nicht abschaffen.\",\"instruction\":\"Dilo al revés: que SÍ la eliminarías\",\"answers\":[\"Ich würde die Gleitzeit abschaffen\"],\"translation\":\"Yo eliminaría el horario flexible.\",\"hints\":[\"Quita la negación y deja el resto igual\",\"Ich würde die Gleitzeit ...\"],\"itemIds\":[\"b1m2abschaffen\",\"b1m2gleitzeit\"],\"tip\":\"abschaffen sí va con würde: no está en el grupo cerrado. Cada vez que dudes, pregúntate si es hätte/wäre/könnte/müsste/sollte/dürfte/wüsste.\"},{\"id\":\"b1m2l6e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «Vorteile»\",\"source\":\"Die Gleitzeit hat viele Vorteile.\",\"forbid\":[\"Vorteile\",\"Vorteil\"],\"answers\":[\"Die Gleitzeit ist für viele Menschen sehr praktisch\",\"Die Gleitzeit ist in vielen Situationen gut\"],\"translation\":\"El horario flexible tiene muchas ventajas.\",\"hints\":[\"Dilo con un adjetivo en vez de con un sustantivo\",\"Die Gleitzeit ist ... praktisch\"],\"itemIds\":[\"b1m2gleitzeit\",\"b1m2vorteilnachteil\"],\"tip\":\"Sustantivo → adjetivo es el rodeo más barato que existe. En el oral te saca de todos los atascos.\"},{\"id\":\"b1m2l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ahora bien, hay que tener reglas claras\",\"answers\":[\"Allerdings muss man klare Regeln haben\",\"Allerdings braucht man klare Regeln\"],\"hints\":[\"Allerdings abre → inversión inmediata\",\"Allerdings muss man ...\"],\"itemIds\":[\"b1m2allerdings\"],\"tip\":\"«Allerdings» + inversión: el conector de matiz que más sube la nota de Kohärenz, porque casi nadie lo usa bien.\"},{\"id\":\"b1m2l6e11\",\"type\":\"audiomc\",\"prompt\":\"Del texto al oído: el mismo tema, ahora en una visita guiada. Hören Teil 1 · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Herzlich willkommen im neuen Gebäude. Kurz zur Orientierung: Im Erdgeschoss ist die Kantine, geöffnet von halb zwölf bis vierzehn Uhr. Erster Stock: Ruhezone, da wird nicht telefoniert — wirklich nicht, auch nicht kurz. Zweiter Stock: die Teamräume. Und, ähm, eine Änderung noch: Die Kernzeit ist jetzt kürzer, von zehn bis vierzehn statt bis fünfzehn Uhr.\",\"question\":\"„Im ersten Stock darf man kurz telefonieren.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«da wird nicht telefoniert — wirklich nicht, auch nicht kurz»: lo repite para cerrar esa puerta\",null],\"itemIds\":[\"b1m2kernzeit\"],\"tip\":\"Cuando el hablante repite y añade «auch nicht kurz», está cerrando justo la excepción que tú ibas a marcar.\"},{\"id\":\"b1m2l6e12\",\"type\":\"audiomc\",\"prompt\":\"Misma visita, segunda tarea. Dos escuchas.\",\"audio\":\"Herzlich willkommen im neuen Gebäude. Kurz zur Orientierung: Im Erdgeschoss ist die Kantine, geöffnet von halb zwölf bis vierzehn Uhr. Erster Stock: Ruhezone, da wird nicht telefoniert — wirklich nicht, auch nicht kurz. Zweiter Stock: die Teamräume. Und, ähm, eine Änderung noch: Die Kernzeit ist jetzt kürzer, von zehn bis vierzehn statt bis fünfzehn Uhr.\",\"question\":\"¿Qué ha cambiado?\",\"options\":[\"La franja obligatoria termina ahora a las dos\",\"La cantina abre una hora más\",\"Se ha suprimido el horario flexible\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De la cantina solo se dan los horarios, sin comparar\",\"La Gleitzeit sigue: lo que se acorta es la Kernzeit\"],\"itemIds\":[\"b1m2gleitzeit\"],\"tip\":\"«statt bis fünfzehn» — el «statt» marca lo viejo. Lo nuevo va siempre delante.\"}]}],\"resources\":[{\"label\":\"NZZ — Wirtschaft\",\"url\":\"https://www.nzz.ch/\",\"note\":\"Prensa suiza: un artículo de opinión al día, aunque solo leas el primer y el último párrafo.\"},{\"label\":\"Goethe — Modellsatz B1 (Lesen Teil 4)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Siete comentarios y una pregunta: «¿está a favor?». Es exactamente lo que acabas de entrenar.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
