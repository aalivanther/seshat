,\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T44c,\u003ci\u003eMaterial de frontera con el B1: hoy se presenta y se \u003cb\u003ereconoce\u003c/b\u003e. No hace falta producirlo, y no entra en el examen del A2. Pero sí aparece en cuanto lees un texto largo, así que el trabajo de hoy es de \u003cb\u003ecomprensión\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl español usa \u003cb\u003eque\u003c/b\u003e para todo: «la chica \u003cu\u003eque\u003c/u\u003e vive arriba», «el piso \u003cu\u003eque\u003c/u\u003e vimos ayer», «el coche \u003cu\u003eque\u003c/u\u003e está fuera». El inglés reparte:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ewho\u003c/b\u003e → personas: \u003cb\u003e[[the girl who lives upstairs|la chica que vive arriba]]\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ewhich\u003c/b\u003e → cosas: \u003ci\u003ethe flat which we saw yesterday\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ethat\u003c/b\u003e → sirve para las dos, y es lo que más se oye: \u003ci\u003ethe girl that lives upstairs\u003c/i\u003e · \u003ci\u003ethe flat that we saw\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ewhose\u003c/b\u003e → «cuyo», el posesivo: \u003cb\u003e[[the man whose car is outside|el hombre cuyo coche está fuera]]\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco que hay que matar\u003c/b\u003e es el de \u003ci\u003ewhose\u003c/i\u003e: en español coloquial decimos «el hombre \u003cu\u003eque su\u003c/u\u003e coche está fuera», y de ahí sale \u003ci\u003ethe man who his car is outside\u003c/i\u003e ❌. En inglés esas dos palabras se funden en una: \u003cb\u003ewhose\u003c/b\u003e.18:T5ed,"])</script><script>self.__next_f.push([1,"Esta es la razón por la que un texto inglés se te atasca de repente sin que sepas por qué.\u003cbr/\u003e\u003cbr/\u003eLee esto: \u003cb\u003eThe girls we saw looked happy.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eSi tu cabeza ha tropezado, es normal: hay dos sujetos pegados —\u003ci\u003ethe girls\u003c/i\u003e y \u003ci\u003ewe\u003c/i\u003e— y ni un «que» entre ellos. En español eso \u003cb\u003ees imposible\u003c/b\u003e: «las chicas vimos parecían contentas» no existe. Por eso el ojo no sabe dónde parar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que ha pasado:\u003c/b\u003e el inglés puede \u003cb\u003eborrar\u003c/b\u003e el relativo cuando es el \u003cb\u003eobjeto\u003c/b\u003e de la frase de dentro.\u003cbr/\u003e· \u003ci\u003eThe flat \u003cb\u003ethat\u003c/b\u003e we saw yesterday\u003c/i\u003e → \u003cb\u003e[[the flat we saw yesterday|el piso que vimos ayer]]\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eThe girls \u003cb\u003ethat\u003c/b\u003e we saw\u003c/i\u003e → \u003cb\u003eThe girls we saw\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eThe letter \u003cb\u003ethat\u003c/b\u003e you sent me\u003c/i\u003e → \u003cb\u003eThe letter you sent me\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuándo NO se puede borrar:\u003c/b\u003e cuando el relativo es el \u003cb\u003esujeto\u003c/b\u003e. \u003ci\u003eThe girl who lives upstairs\u003c/i\u003e no puede quedarse en \u003ci\u003ethe girl lives upstairs\u003c/i\u003e, porque eso ya es otra frase entera.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl reflejo de lectura que hay que instalar\u003c/b\u003e, y es todo lo que se te pide hoy:\u003cbr/\u003e· Detrás del sustantivo hay un \u003cb\u003eSUJETO\u003c/b\u003e (I, we, she, Ben, my flatmate…) → \u003cb\u003ese ha borrado un «that»\u003c/b\u003e. Ponlo mentalmente y sigue leyendo.\u003cbr/\u003e· Detrás del sustantivo hay un \u003cb\u003eVERBO\u003c/b\u003e (lives, works, came…) → el relativo era el sujeto y no se ha borrado nada.\u003cbr/\u003e\u003cbr/\u003eCon ese reflejo, la Parte 4 del Reading —que es un texto continuo y va lleno de estas— deja de ser un muro."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l9\",\"phaseId\":\"ena2m9\",\"title\":\"The girl who lives upstairs\",\"subtitle\":\"Frontera: el «que» inglés — y el que desaparece\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tres relativas para reconocer, no para producir\",\"itemIds\":[\"ena2m9thegirlwholivesupstairs\",\"ena2m9themanwhosecar\",\"ena2m9theflatwesaw\"]},{\"kind\":\"note\",\"note\":{\"title\":\"FRONTERA — el «que» español se reparte en tres palabras\",\"body\":\"$17\",\"table\":[[\"en español\",\"en inglés\",\"qué es\"],[\"la chica que vive arriba\",\"the girl who lives upstairs\",\"persona → who\"],[\"el piso que vimos ayer\",\"the flat which we saw\",\"cosa → which\"],[\"cualquiera de las dos\",\"…that…\",\"that vale para todo\"],[\"el hombre cuyo coche…\",\"the man whose car…\",\"posesivo → whose\"],[\"el hombre que su coche…\",\"the man who his car…\",\"el calco ❌\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y la de verdad importante: el «que» que desaparece\",\"body\":\"$18\",\"table\":[[\"lo que lees\",\"lo que hay debajo\",\"¿se puede borrar?\"],[\"the flat we saw yesterday\",\"the flat THAT we saw yesterday\",\"sí: el que es objeto\"],[\"the letter you sent me\",\"the letter THAT you sent me\",\"sí: el que es objeto\"],[\"the girl who lives upstairs\",\"—\",\"no: el que es sujeto\"],[\"the neighbour we met\",\"the neighbour THAT we met\",\"sí: el que es objeto\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l9e1\",\"type\":\"gapbank\",\"prompt\":\"FRONTERA — rellena con el relativo que toca\",\"text\":\"The girl ___ lives upstairs is a nurse. The flat ___ we saw yesterday was too small. And the man ___ car is always outside the door is our landlord.\",\"answers\":[\"who\",\"which\",\"whose\"],\"bank\":[\"who\",\"which\",\"whose\",\"where\",\"when\",\"why\"],\"translation\":\"La chica que vive arriba es enfermera. El piso que vimos ayer era demasiado pequeño. Y el hombre cuyo coche está siempre delante de la puerta es nuestro casero.\",\"itemIds\":[\"ena2m9thegirlwholivesupstairs\",\"ena2m9theflatwesaw\",\"ena2m9themanwhosecar\",\"ennurse\"],\"tip\":\"Persona → who · cosa → which · posesión → whose. Y en los tres huecos «that» también valdría, menos en el último: «that his car» no existe.\"},{\"id\":\"ena2m9l9e2\",\"type\":\"mc\",\"prompt\":\"FRONTERA — la frase que te hace tropezar\",\"question\":\"«The girls we saw looked happy.» ¿Qué significa?\",\"options\":[\"Las chicas que vimos parecían contentas\",\"Vimos que las chicas parecían contentas\",\"Las chicas nos vieron y parecían contentas\"],\"answer\":0,\"whyWrong\":[null,\"El verbo principal es «looked», no «saw». Entre «girls» y «we» falta un «that» borrado\",\"«we saw» dice quién vio a quién: nosotros a ellas\"],\"itemIds\":[\"ena2m9theflatwesaw\"],\"tip\":\"Regla de lectura: si detrás del sustantivo viene un SUJETO (we, I, she…), pon un «that» invisible ahí. La frase se ordena sola.\"},{\"id\":\"ena2m9l9e3\",\"type\":\"bucket\",\"prompt\":\"FRONTERA — ¿se puede borrar el «that» o no?\",\"categories\":[\"se puede borrar\",\"no se puede borrar\"],\"items\":[{\"text\":\"the flat that we saw yesterday\",\"bucket\":0},{\"text\":\"the girl that lives upstairs\",\"bucket\":1},{\"text\":\"the letter that you sent me\",\"bucket\":0},{\"text\":\"the man that works in the shop\",\"bucket\":1},{\"text\":\"the keys that I found in the kitchen\",\"bucket\":0},{\"text\":\"the bus that goes to the station\",\"bucket\":1}],\"itemIds\":[\"ena2m9theflatwesaw\",\"ena2m9thegirlwholivesupstairs\"],\"tip\":\"Mira qué viene justo detrás del «that»: si es un sujeto (we, you, I), se puede borrar; si es un verbo (lives, works, goes), no.\"},{\"id\":\"ena2m9l9e4\",\"type\":\"errorfix\",\"prompt\":\"FRONTERA — corrige el calco de «cuyo»\",\"wrong\":\"the man who his car is outside\",\"answers\":[\"the man whose car is outside\"],\"why\":\"«El hombre que su coche…» es lo que decimos en español coloquial, y el inglés no lo admite: «que su» se funde en una sola palabra, whose. Es la misma palabra de «Whose is this?», usada dentro de la frase en vez de al principio.\",\"translation\":\"el hombre cuyo coche está fuera\",\"itemIds\":[\"ena2m9themanwhosecar\",\"ena2m9whoseisthis\"]},{\"id\":\"ena2m9l9e5\",\"type\":\"audiomc\",\"prompt\":\"FRONTERA — el relativo borrado, al oído — 2 escuchas\",\"audio\":\"The flat we saw on Saturday was cheaper, but the one Amy found is much bigger.\",\"question\":\"¿Qué piso es más grande?\",\"options\":[\"El que encontró Amy\",\"El que vieron el sábado\",\"Los dos igual\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ese era más barato, no más grande\",\"El audio los compara: uno es más barato y el otro, más grande\"],\"itemIds\":[\"ena2m9theflatwesaw\",\"ena2m4thebiggestroom\"],\"tip\":\"Dos relativas borradas en una frase: «the flat (that) we saw» y «the one (that) Amy found». Al oído es peor que al leerlo, porque no hay coma que te ayude.\"},{\"id\":\"ena2m9l9e6\",\"type\":\"match\",\"prompt\":\"FRONTERA — empareja cada relativa con lo que describe\",\"pairs\":[{\"target\":\"the girl who lives upstairs\",\"source\":\"una persona, y ella es la que vive\"},{\"target\":\"the man whose car is outside\",\"source\":\"una persona, y el coche es suyo\"},{\"target\":\"the flat we saw yesterday\",\"source\":\"una cosa, y nosotros la vimos\"},{\"target\":\"the bus which goes to the station\",\"source\":\"una cosa, y ella es la que va\"}],\"itemIds\":[\"ena2m9thegirlwholivesupstairs\",\"ena2m9themanwhosecar\",\"ena2m9theflatwesaw\"]},{\"id\":\"ena2m9l9e7\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — el módulo entero, sin pensar\",\"pairs\":[{\"target\":\"It's mine.\",\"source\":\"Es mío.\"},{\"target\":\"Whose is this?\",\"source\":\"¿De quién es esto?\"},{\"target\":\"Help yourself!\",\"source\":\"¡Sírvete!\"},{\"target\":\"It's your turn.\",\"source\":\"Te toca.\"},{\"target\":\"How often…?\",\"source\":\"¿Cada cuánto…?\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m9possessivegroup\",\"ena2m9whoseisthis\",\"ena2m9helpyourself\",\"ena2m9itsyourturn\",\"ena2m9howoftendoyouclean\"],\"tip\":\"Cinco piezas del módulo y ninguna es larga. El cronómetro solo premia: si sale sin pensar, está consolidado.\"},{\"id\":\"ena2m9l9e8\",\"type\":\"translate\",\"prompt\":\"Espiral — traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Se lo expliqué a ella, pero no le dije nada a él.\",\"answers\":[\"I explained it to her, but I didn't tell him anything.\",\"I explained it to her but I didn't tell him anything.\",\"I explained it to her, but I said nothing to him.\"],\"hint\":\"un verbo de cada montón, y los dos pronombres detrás de lo que les corresponde\",\"itemIds\":[\"ena2m9explaintogroup\",\"ena2m9tellmegroup\",\"ena2m9objectgroup\"],\"tip\":\"El cubo entero en una frase: explain pide «to her» y tell lleva «him» pegado. Si te sale sola, la lección 2 ya es tuya.\"},{\"id\":\"ena2m9l9e9\",\"type\":\"translate\",\"prompt\":\"Espiral — traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"The letter you sent me came on Monday, but I couldn't find it.\",\"answers\":[\"La carta que me mandaste llegó el lunes, pero no la encontré.\",\"La carta que me enviaste llegó el lunes, pero no la pude encontrar.\"],\"itemIds\":[\"ena2m9theflatwesaw\",\"ena2m9alettercameforyou\",\"ena2m9icantfindit\"],\"tip\":\"Fíjate en lo que el español OBLIGA a poner y el inglés no: el «que» de «la carta que me mandaste». En inglés se había borrado.\"},{\"id\":\"ena2m9l9e10\",\"type\":\"errorfix\",\"prompt\":\"Espiral — corrige el reflexivo\",\"wrong\":\"I woke up myself and I felt myself terrible.\",\"answers\":[\"I woke up and I felt terrible.\"],\"why\":\"Ni «wake up» ni «feel» son reflexivos en inglés. La prueba de la lección 3: «me desperté a mí misma» y «me sentí fatal a mí misma» no significan nada, así que fuera los dos myself.\",\"translation\":\"Me desperté y me encontraba fatal.\",\"itemIds\":[\"ena2m9nonreflexivegroup\",\"ena2m9ifeeltired\"]},{\"id\":\"ena2m9l9e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"This coat isn't mine.\",\"forbid\":[\"mine\",\"my\"],\"answers\":[\"This coat belongs to somebody else.\",\"This coat belongs to another person.\"],\"translation\":\"Este abrigo no es mío.\",\"itemIds\":[\"ena2m9itsnotminesits\",\"ena2m3acoat\"],\"tip\":\"Con «mine» y «my» prohibidos, la única salida es «belong to»: el verbo que dice posesión sin usar ningún posesivo. En el oral es exactamente lo que te salva cuando no te sale la palabra.\"},{\"id\":\"ena2m9l9e12\",\"type\":\"monologue\",\"prompt\":\"Tu minuto: tu casa, tu gente y quién hace qué\",\"topic\":\"Dónde vives, con quién y cómo os repartís la casa\",\"slides\":[{\"title\":\"1. Dónde vives y con quién\",\"hint\":\"I live in a flat in… · I share it with… · There are two bedrooms, a kitchen and…\"},{\"title\":\"2. La gente de alrededor\",\"hint\":\"Our landlord… · Our next-door neighbour… · The girl who lives upstairs…\"},{\"title\":\"3. Quién hace qué, y cada cuánto\",\"hint\":\"I do the washing-up… · How often…? Once a week · It's her turn to…\"},{\"title\":\"4. Qué te parece\",\"hint\":\"I like it a lot because… · The rent is expensive, but…\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He usado al menos dos posesivos (mine, yours, hers, ours, o un genitivo con 's)\",\"He usado al menos dos pronombres de objeto (him, her, it, us, them)\",\"He dicho una frecuencia (once a week, twice a month, every day)\",\"He nombrado al menos dos tareas de la casa\",\"No he metido ni un «myself» donde el inglés no lo lleva\"],\"model\":\"I live in a small flat in North London and I share it with Amy, my flatmate. There are two bedrooms: the big one is hers and the small one is mine. Our landlord lives upstairs, so he hears everything, and our next-door neighbour is a friend of mine now. We take turns with the jobs: I do the washing-up on Monday and Wednesday, and Amy takes out the rubbish. We hoover the flat once a week, usually on Sundays. I like it a lot because the neighbourhood is quiet, but the rent is very expensive.\",\"itemIds\":[\"ena2m9weshareaflat\",\"ena2m9possessivegroup\",\"ena2m9choresgroup\",\"ena2m9onceaweek\",\"ena2m9nextdoorneighbour\"],\"tip\":\"Grábate las dos veces. La lista no mide si suena bonito: mide si has metido las piezas del módulo. Cuenta los posesivos y los pronombres con el dedo al escucharte.\"},{\"id\":\"ena2m9l9e13\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — todo junto en dos frases\",\"question\":\"Estas llaves no son mías, son de Amy. ¿Puedes dárselas? Vive arriba.\",\"answers\":[\"These keys aren't mine, they're Amy's. Can you give them to her? She lives upstairs.\",\"These keys are not mine, they're Amy's. Can you give them to her? She lives upstairs.\",\"These keys aren't mine, they're Amy's. Could you give them to her? She lives upstairs.\"],\"hints\":[\"Posesivo solo + genitivo con 's + dos pronombres de objeto\",\"These keys aren't m…, they're Amy…. Can you give t… to h…? She lives u…\"],\"itemIds\":[\"ena2m9possessivegroup\",\"ena2m9amysflat\",\"ena2m9objectgroup\",\"ena2m9ourlandlordlivesupstairs\"],\"tip\":\"Ahí está el módulo entero: mine, Amy's, them, her y upstairs sin preposición. Y una cosa más — «give them to her» es el montón A usado con «to», que es legal porque la cosa va primero. Si has llegado hasta aquí sin dudar, la precisión ya la tienes.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-9\",\"book\":\"The woman who lives next door is a nurse.\",\"real\":\"The woman next door's a nurse.\",\"meaning\":\"La vecina de al lado es enfermera.\",\"when\":\"Al hablar de vecinos: «the woman next door» es un sitio («de al lado»), no una relativa recortada. Lo que sí se come el habla es el is: door's = door is. En el examen escrito, la frase entera con «who lives».\",\"register\":\"amigos\",\"note\":\"Ojo a ese «door's», que es «door is» y no un genitivo, aunque se escriba igual. Es el par de la lección 5 otra vez: la ortografía no distingue lo que la gramática sí.\",\"sound\":\"de UÚ-man nekst DÓOS̬ a NEES̬\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Relative clauses: defining relative clauses\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/relative-clauses-defining-relative-clauses\",\"note\":\"Léelo entero aunque sea de B1: hoy solo tienes que reconocerlas. Fíjate en la sección de cuándo se puede omitir el relativo — es lo único que te hace falta para leer.\"},{\"label\":\"LanguageCert — ESOL A2 Access (papers de práctica)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Descarga un Reading de práctica y busca en la Parte 4 las relativas sin «that». Vas a encontrar tres o cuatro por texto: ahora ya sabes qué falta ahí.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\"
