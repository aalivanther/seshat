43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T58b,"])</script><script>self.__next_f.push([1,"El español mete el «me» donde quiera: \u003ci\u003eme dijo, me explicó, me sugirió, me recomendó\u003c/i\u003e. El inglés reparte sus verbos en \u003cb\u003edos grupos\u003c/b\u003e, y no hay lógica que valga: hay que sabérselos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eGRUPO 1 — persona pegada al verbo\u003c/b\u003e (\u003ci\u003etell me, give me, show me, send me, buy me, offer me\u003c/i\u003e):\u003cbr/\u003e\u003cb\u003eShe told me the news.\u003c/b\u003e · \u003cb\u003eShow me the contract.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eGRUPO 2 — la persona necesita «to»\u003c/b\u003e (\u003ci\u003esay, explain, describe, suggest, recommend, mention, repeat\u003c/i\u003e):\u003cbr/\u003e\u003cb\u003eShe said to me that…\u003c/b\u003e · \u003cb\u003ePlease explain the contract to me.\u003c/b\u003e · \u003cb\u003eShe suggested a cheaper area to me.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eY dentro del grupo 2 hay una preferencia más: con \u003ci\u003esuggest\u003c/i\u003e y \u003ci\u003erecommend\u003c/i\u003e, lo normal es \u003cb\u003equitar a la persona del todo\u003c/b\u003e. \u003ci\u003eShe suggested a cheaper area\u003c/i\u003e — ya se entiende que te lo sugirió a ti.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003esay frente a tell, en una línea:\u003c/b\u003e \u003cb\u003etell\u003c/b\u003e lleva persona (\u003ci\u003etell me\u003c/i\u003e, \u003ci\u003etell her\u003c/i\u003e); \u003cb\u003esay\u003c/b\u003e lleva lo dicho (\u003ci\u003esay that…\u003c/i\u003e). Si quieres la persona con \u003ci\u003esay\u003c/i\u003e, va con \u003ci\u003eto\u003c/i\u003e. «He said me» no existe en ningún registro, ni siquiera en el habla más descuidada — y eso lo hace especialmente visible.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué esto puntúa:\u003c/b\u003e son verbos que aparecen en todas las respuestas de opinión del oral y en el Writing. Un «explain me» cada tres frases baja el criterio de gramática por frecuencia, no por gravedad."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l5\",\"phaseId\":\"enb1m1\",\"title\":\"Say, tell, explain\",\"subtitle\":\"El «me» del español que en inglés no cabe en todos los verbos\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los verbos de decir, cada uno con su forma\",\"itemIds\":[\"enb1m1tellme\",\"enb1m1toldmeabout\",\"enb1m1saidthat\",\"enb1m1saytome\",\"enb1m1explainto\",\"enb1m1suggest\",\"enb1m1recommend\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos listas cerradas, y son cortas\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés — mal\",\"Inglés — bien\"],[\"Me dijo que…\",\"He said me that…\",\"He told me that… / He said to me that…\"],[\"Explícame el contrato\",\"Explain me the contract\",\"Explain the contract to me\"],[\"Me sugirió otra zona\",\"She suggested me another area\",\"She suggested another area\"],[\"Me recomendó esta calle\",\"He recommended me this street\",\"He recommended this street to me\"],[\"Cuéntame qué ha pasado\",\"Say me what happened\",\"Tell me what happened\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Persona pegada al verbo, o persona con «to»?\",\"categories\":[\"… me (directo)\",\"… to me (con to)\"],\"items\":[{\"text\":\"tell\",\"bucket\":0},{\"text\":\"give\",\"bucket\":0},{\"text\":\"show\",\"bucket\":0},{\"text\":\"send\",\"bucket\":0},{\"text\":\"explain\",\"bucket\":1},{\"text\":\"say\",\"bucket\":1},{\"text\":\"describe\",\"bucket\":1},{\"text\":\"recommend\",\"bucket\":1}],\"itemIds\":[\"enb1m1tellme\",\"enb1m1explainto\",\"enb1m1saytome\",\"enb1m1recommend\"],\"tip\":\"No hay regla: hay lista. Y es corta. Memoriza el grupo 2 (say, explain, describe, suggest, recommend, mention) y asume que todo lo demás va directo.\"},{\"id\":\"enb1m1l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"He said me that the flat was damp.\",\"answers\":[\"He told me that the flat was damp.\",\"He said to me that the flat was damp.\"],\"why\":\"«say» no admite la persona pegada. O cambias el verbo por «tell», que sí la lleva, o le pones «to». Las dos son correctas; «told me» es lo que dice todo el mundo.\",\"translation\":\"Me dijo que el piso tenía humedad.\",\"itemIds\":[\"enb1m1saytome\",\"enb1m1saidthat\"]},{\"id\":\"enb1m1l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Please explain me the contract.\",\"answers\":[\"Please explain the contract to me.\"],\"why\":\"«explain» pertenece al grupo del «to»: primero la cosa, después la persona. El calco viene del clítico español, que se pega a cualquier verbo de decir.\",\"translation\":\"Explícame el contrato, por favor.\",\"itemIds\":[\"enb1m1explainto\"]},{\"id\":\"enb1m1l5e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The estate agent recommended me this street.\",\"answers\":[\"The estate agent recommended this street to me.\",\"The estate agent recommended this street.\"],\"why\":\"«recommend» va con «to» o directamente sin persona. Con «suggest» pasa exactamente lo mismo: «She suggested me a flat» no existe.\",\"translation\":\"El agente inmobiliario me recomendó esta calle.\",\"itemIds\":[\"enb1m1recommend\",\"enb1m1estateagent\"]},{\"id\":\"enb1m1l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa con say o tell (en pasado)\",\"text\":\"She ___ me about the flat before I signed anything.\",\"answers\":[\"told\"],\"translation\":\"Me habló del piso antes de que yo firmara nada.\",\"hints\":[\"Detrás viene una persona: «me»\",\"El verbo que lleva persona pegada\"],\"itemIds\":[\"enb1m1toldmeabout\"],\"tip\":\"Regla de bolsillo: mira lo que hay JUSTO detrás del hueco. Si es una persona, «tell». Si es «that…», «say».\"},{\"id\":\"enb1m1l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación con Amy\",\"text\":\"Amy ___ me about a room in Palmer Road. She ___ that the rent was reasonable, and she ___ a viewing on Thursday. I asked the agent to ___ the contract to me, but he hasn't answered.\",\"answers\":[\"told\",\"said\",\"suggested\",\"explain\"],\"bank\":[\"told\",\"said\",\"suggested\",\"explain\",\"asked\",\"spoke\",\"described\"],\"translation\":\"Amy me habló de una habitación en Palmer Road. Dijo que el alquiler era razonable y sugirió una visita el jueves. Le pedí al agente que me explicara el contrato, pero no ha contestado.\",\"itemIds\":[\"enb1m1toldmeabout\",\"enb1m1saidthat\",\"enb1m1suggest\",\"enb1m1explainto\"],\"tip\":\"Cuatro verbos de decir en cuatro líneas, cada uno con su forma. Es exactamente lo que hay en cualquier correo real sobre un piso.\"},{\"id\":\"enb1m1l5e7\",\"type\":\"transform\",\"prompt\":\"Cambia el verbo, cambia la estructura\",\"source\":\"She told me that the rent was too high.\",\"instruction\":\"Dilo con «say»\",\"answers\":[\"She said that the rent was too high\",\"She said the rent was too high\",\"She said to me that the rent was too high\"],\"translation\":\"Dijo que el alquiler era demasiado alto.\",\"hints\":[\"«say» no lleva la persona pegada\",\"O la quitas, o la pones con «to»\"],\"itemIds\":[\"enb1m1saidthat\",\"enb1m1toldmeabout\"],\"tip\":\"Poder decir lo mismo con los dos verbos es criterio de vocabulario en el examen: repetir «said» diez veces baja de banda aunque esté bien escrito.\"},{\"id\":\"enb1m1l5e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «said»\",\"source\":\"He said to me that the flat was damp.\",\"forbid\":[\"said\",\"say\"],\"answers\":[\"He told me that the flat was damp\",\"He told me the flat was damp\",\"He warned me about the damp\"],\"translation\":\"Me dijo que el piso tenía humedad.\",\"hints\":[\"El verbo que sí lleva la persona pegada\",\"He t... me that ...\"],\"itemIds\":[\"enb1m1saytome\",\"enb1m1toldmeabout\",\"enb1m1damp\"],\"tip\":\"Rodear la palabra que no te sale es LA habilidad del B1: el descriptor del nivel habla literalmente de «circunloquios».\"},{\"id\":\"enb1m1l5e9\",\"type\":\"mc\",\"prompt\":\"El matiz que separa los dos verbos\",\"question\":\"¿Cuál de estas NO existe en inglés?\",\"options\":[\"She said hello.\",\"She told me hello.\",\"She told me a story.\"],\"answer\":1,\"whyWrong\":[\"Existe: «say hello / say goodbye» son fijas.\",null,\"Existe: «tell a story», «tell a joke», «tell the truth», «tell the time».\"],\"itemIds\":[\"enb1m1tellme\",\"enb1m1saidthat\"],\"tip\":\"«tell» va con lo que se cuenta: story, joke, truth, time, lie, secret. Fuera de esa lista, con cosas sueltas, el verbo es «say».\"},{\"id\":\"enb1m1l5e10\",\"type\":\"build\",\"prompt\":\"Construye la petición\",\"target\":\"Please explain the contract to me\",\"translation\":\"Explícame el contrato, por favor\",\"distractors\":[\"say\",\"for\"],\"itemIds\":[\"enb1m1explainto\"],\"tip\":\"Primero la cosa, después la persona con «to». El orden es la regla entera.\"},{\"id\":\"enb1m1l5e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Me sugirió una zona más barata.\",\"answers\":[\"She suggested a cheaper area\",\"She suggested a cheaper area to me\",\"He suggested a cheaper area\"],\"hint\":\"Con este verbo, lo natural es quitar del todo a la persona\",\"itemIds\":[\"enb1m1suggest\"],\"tip\":\"«She suggested me…» es de los errores que más veces aparecen en los ejemplos de hispanohablantes del English Grammar Profile. No es raro: es el error medio del nivel.\"},{\"id\":\"enb1m1l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Cuéntame qué ha pasado y explícamelo despacio.\",\"answers\":[\"Tell me what happened and explain it to me slowly\",\"Tell me what has happened and explain it to me slowly\"],\"hints\":[\"Los dos verbos de la lección, uno de cada grupo\",\"Tell me ... and explain it to me ...\"],\"itemIds\":[\"enb1m1tellme\",\"enb1m1explainto\"],\"tip\":\"Un verbo de cada grupo en la misma frase, y el «me» en dos sitios distintos. Si te sale, la lista ya la tienes.\"},{\"id\":\"enb1m1l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria le cuenta a Ben lo que le dijo la agencia. Dos escuchas.\",\"audio\":\"So what did they say?|Well, the woman told me the room was still free, which was a relief. But she said the landlady wants a guarantor, and I haven't got one.|Hm. Did she explain what happens if you can't find one?|Not really. She just suggested paying six months up front, which, honestly, I can't afford.\",\"question\":\"¿Qué le propuso la agencia?\",\"options\":[\"Pagar seis meses por adelantado\",\"Buscar un avalista en el trabajo\",\"Esperar a que la casera cambie de idea\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El avalista es lo que la casera pide, no lo que la agencia propone como salida.\",\"Nadie dice eso en el audio.\"],\"itemIds\":[\"enb1m1suggest\",\"enb1m1toldmeabout\",\"enb1m1afford\"],\"tip\":\"Fíjate en el reparto: «told me» con persona, «said» con lo dicho, «suggested» sin persona. Los tres correctos, en veinte segundos de conversación normal.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/ch
