e somewhere — acabar en un sitio sin haberlo planeado\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eVocabulario que hay que decir bien o no te entienden:\u003c/b\u003e en el Reino Unido el currículum es un \u003cb\u003eCV\u003c/b\u003e (se deletrea: síi-VÍI), nunca «resume»; la carta que lo acompaña es una \u003cb\u003ecovering letter\u003c/b\u003e; y una \u003cb\u003ereference\u003c/b\u003e es lo que escribe tu jefe anterior — te la piden casi siempre."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l5\",\"phaseId\":\"enb1m2\",\"title\":\"Applying\",\"subtitle\":\"CV, referencias y entrevista — y la preposición que viene pegada al verbo\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El papeleo\",\"itemIds\":[\"enb1m2cv\",\"enb1m2coveringletter\",\"enb1m2reference\",\"enb1m2jobinterview\",\"enb1m2fillinform\",\"enb1m2handinnotice\",\"enb1m2turndown\"]},{\"kind\":\"phrases\",\"title\":\"El verbo y su preposición\",\"itemIds\":[\"enb1m2applyfor\",\"enb1m2goodat\",\"enb1m2responsiblefor\",\"enb1m2dealwith\",\"enb1m2takeon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: se aprenden en bloque o no se aprenden\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés — mal\",\"Inglés — bien\"],[\"presentarse a un trabajo\",\"apply to a job\",\"apply for a job\"],[\"se me da bien tratar con gente\",\"I'm good in dealing with people\",\"I'm good at dealing with people\"],[\"soy responsable de la caja\",\"I'm responsible of the till\",\"I'm responsible for the till\"],[\"rellenar el formulario\",\"fill the form\",\"fill in the form\"],[\"presentar la dimisión\",\"present my dimission\",\"hand in my notice\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l5e1\",\"type\":\"match\",\"prompt\":\"Empareja el papeleo\",\"pairs\":[{\"target\":\"a CV\",\"source\":\"un currículum\"},{\"target\":\"a covering letter\",\"source\":\"una carta de presentación\"},{\"target\":\"a reference\",\"source\":\"una referencia de un jefe anterior\"},{\"target\":\"a job interview\",\"source\":\"una entrevista de trabajo\"},{\"target\":\"a vacancy\",\"source\":\"una vacante\"}],\"itemIds\":[\"enb1m2cv\",\"enb1m2coveringletter\",\"enb1m2reference\",\"enb1m2jobinterview\",\"enb1m2vacancy\"],\"tip\":\"«CV» se deletrea siempre, letra a letra: síi-VÍI. Y en el Reino Unido nunca digas «resume»: aquí eso es un verbo, «reanudar».\"},{\"id\":\"enb1m2l5e2\",\"type\":\"mc\",\"prompt\":\"El papel que acompaña al currículum\",\"question\":\"«una carta de presentación» en inglés británico →\",\"options\":[\"a covering letter\",\"a presentation letter\",\"a reference\"],\"answer\":0,\"whyWrong\":[null,\"Calco directo del español. «Presentation» en inglés es una charla con diapositivas.\",\"Una «reference» la escribe OTRA persona sobre ti; la covering letter la escribes tú.\"],\"itemIds\":[\"enb1m2coveringletter\",\"enb1m2reference\"],\"tip\":\"En EE. UU. es «cover letter»; en el Reino Unido, «covering letter». Es el mismo papel con dos nombres, y este curso enseña el británico.\"},{\"id\":\"enb1m2l5e3\",\"type\":\"cloze\",\"prompt\":\"Completa el phrasal verb del papeleo\",\"text\":\"I ___ in the form and sent it with my CV.\",\"answers\":[\"filled\"],\"translation\":\"Rellené el formulario y lo mandé con el currículum.\",\"hints\":[\"El verbo de «rellenar», en pasado\",\"f____ in\"],\"itemIds\":[\"enb1m2fillinform\",\"enb1m2cv\"],\"tip\":\"«fill in» pide un papel: fill in a form, fill in an application. Sin el «in», «fill the form» suena a llenarlo de agua.\"},{\"id\":\"enb1m2l5e4\",\"type\":\"gapbank\",\"prompt\":\"Completa las preposiciones — cada una viene pegada a su verbo\",\"text\":\"I applied ___ a job at the library. I'm good ___ dealing with people, and at the café I'm responsible ___ the till, so I deal ___ customers all day.\",\"answers\":[\"for\",\"at\",\"for\",\"with\"],\"bank\":[\"for\",\"at\",\"with\",\"to\",\"in\",\"on\"],\"translation\":\"Me presenté a un trabajo en la biblioteca. Se me da bien tratar con la gente y en el café soy responsable de la caja, así que trato con clientes todo el día.\",\"itemIds\":[\"enb1m2applyfor\",\"enb1m2goodat\",\"enb1m2responsiblefor\",\"enb1m2dealwith\"],\"tip\":\"Los tres distractores son los tres calcos: «apply TO», «good IN», «responsible OF». Están ahí a propósito, y si has dudado, ya sabes cuál repasar.\"},{\"id\":\"enb1m2l5e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I'm responsible of the till.\",\"answers\":[\"I'm responsible for the till.\"],\"why\":\"«responsable DE» en español, «responsible FOR» en inglés. La preposición no se traduce: viene con la palabra, y se aprende con ella.\",\"translation\":\"Soy responsable de la caja.\",\"itemIds\":[\"enb1m2responsiblefor\"]},{\"id\":\"enb1m2l5e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I'm good in dealing with people.\",\"answers\":[\"I'm good at dealing with people.\"],\"why\":\"«good AT» siempre: good at maths, good at cooking, good at dealing with people. El «in» viene de «bueno EN algo» y no existe en inglés.\",\"translation\":\"Se me da bien tratar con la gente.\",\"itemIds\":[\"enb1m2goodat\"]},{\"id\":\"enb1m2l5e7\",\"type\":\"bucket\",\"prompt\":\"¿Este phrasal verb te mete en el trabajo o te saca?\",\"categories\":[\"ENTRAR — pedir, entregar, contratar\",\"SALIR — rechazar, dejar, acabar en otro sitio\"],\"items\":[{\"text\":\"fill in the form\",\"bucket\":0},{\"text\":\"apply for a job\",\"bucket\":0},{\"text\":\"take on new staff\",\"bucket\":0},{\"text\":\"hand in your notice\",\"bucket\":1},{\"text\":\"turn down an offer\",\"bucket\":1},{\"text\":\"end up in another job\",\"bucket\":1}],\"itemIds\":[\"enb1m2fillinform\",\"enb1m2applyfor\",\"enb1m2takeon\",\"enb1m2handinnotice\",\"enb1m2turndown\",\"enb1m2endup\"],\"tip\":\"«hand in your notice» descoloca: parece que entregas algo (y lo haces), pero lo que entregas es tu marcha. «Notice» aquí es el preaviso, normalmente de un mes.\"},{\"id\":\"enb1m2l5e8\",\"type\":\"transform\",\"prompt\":\"De la queja a la acción\",\"source\":\"I don't want to work here any more.\",\"instruction\":\"Dilo con el phrasal de dimitir, en pasado\",\"answers\":[\"I handed in my notice\",\"I handed in my notice.\",\"I have handed in my notice\",\"I've handed in my notice\"],\"translation\":\"Presenté mi dimisión.\",\"hints\":[\"hand + preposición + my notice\",\"I handed ... my notice\"],\"itemIds\":[\"enb1m2handinnotice\"],\"tip\":\"«I quit» también existe y es más brusco. «Hand in your notice» es lo que se escribe en un correo y lo que dirías en una entrevista.\"},{\"id\":\"enb1m2l5e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Rechazaron mi solicitud.\",\"answers\":[\"They turned down my application\",\"They turned my application down\",\"My application was turned down\"],\"hint\":\"Un phrasal verb con «turn»\",\"itemIds\":[\"enb1m2turndown\"],\"tip\":\"«turn down my application» y «turn my application down» son las dos correctas. Con un pronombre, en cambio, solo hay un sitio: «they turned it down», nunca «turned down it».\"},{\"id\":\"enb1m2l5e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «turned» ni «down»\",\"source\":\"They turned down my application.\",\"forbid\":[\"turned\",\"down\"],\"answers\":[\"They rejected my application\",\"They said no to my application\",\"They didn't give me the job\",\"I wasn't successful\"],\"translation\":\"Rechazaron mi solicitud.\",\"hints\":[\"Hay un verbo latino que sirve: rej…\",\"They r______ my application\"],\"itemIds\":[\"enb1m2turndown\"],\"tip\":\"«reject» es correcto y más formal; «turn down» es lo que se dice. Tener las dos formas para lo mismo es exactamente lo que el examen llama «range of vocabulary».\"},{\"id\":\"enb1m2l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me presenté a tres trabajos el mes pasado y me rechazaron dos.\",\"answers\":[\"I applied for three jobs last month and they turned down two\",\"I applied for three jobs last month and two were turned down\",\"I applied for three jobs last month and they turned two down\"],\"hints\":[\"apply + su preposición\",\"I applied ... three jobs last month and ...\"],\"itemIds\":[\"enb1m2applyfor\",\"enb1m2turndown\"],\"tip\":\"«last month» cierra el periodo, así que va pasado simple, no perfecto. Esa decisión es la reina del módulo 1 y sigue cayendo aquí.\"},{\"id\":\"enb1m2l5e12\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"I'm good at dealing with people.\",\"translation\":\"Se me da bien tratar con la gente.\",\"strictContractions\":true,\"hints\":[\"Empieza con la contracción de «I am»\",\"I'm good ... dealing with people.\"],\"itemIds\":[\"enb1m2goodat\"],\"tip\":\"«good at» se pega y suena «gu-dat», una sola pieza. Justo por eso la preposición se pierde de oído — y luego se escribe la que sugiere el español.\"},{\"id\":\"enb1m2l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: la entrevista de verdad. Toma notas. Dos escuchas.\",\"notepad\":true,\"audio\":\"So, tell me about your current job.|I've been at a café for two years. I'm responsible for the till and for the orders, and I deal with about two hundred customers a day.|And why the library?|Honestly? The café pays the bills, but there's nothing after it. Here there's a qualification I could do, and I'd rather learn something than earn twenty pounds more.|That's fair. One thing — the hours are evenings and Saturdays. Does that work?|Apart from Tuesday, yes. And I could swap Tuesdays if I had notice.\",\"question\":\"¿Qué valora ella por encima del dinero?\",\"options\":[\"Poder formarse\",\"Tener los sábados libres\",\"Trabajar con menos clientes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo lo contrario: acepta trabajar los sábados.\",\"Menciona los doscientos clientes como mérito, no como queja.\"],\"itemIds\":[\"enb1m2qualification\",\"enb1m2wouldrather\",\"enb1m2natpaysthebills\"],\"tip\":\"«I'd rather learn something than earn twenty pounds more» — «I'd rather» + infinitivo SIN «to», y el segundo término con «than». Es una estructura del temario oficial de B1 y da mucha nota en el oral.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m2-3\",\"book\":\"He was dismissed.\",\"real\":\"He got the sack.\",\"meaning\":\"Lo echaron del trabajo\",\"when\":\"Hablando, entre conocidos, y siempre de otra persona o de uno mismo en tono resignado. En un correo, en un formulario o en el Writing, jamás: allí se dice «he was dismissed» o —si fue por recorte de plantilla y no por culpa suya— «he was made redundant», que es otra cosa y conviene no confundir.\",\"register\":\"amigos\",\"exam\":\"He was dismissed.\",\"note\":\"«The sack» es literalmente «el saco»: la imagen es la de recoger tus herramientas y llevártelas. También se oye «he got sacked» y «they sacked him». Ojo con la diferencia legal: «sacked» es por algo que hiciste; «made redundant» es porque el puesto desapareció.\",\"sound\":\"ji got de sak\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m2natgotthesack\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\
