ung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Se cayó el andamio del B1 — y la app no puntúa lo que dices\",\"body\":\"El Teil 1 del B1 eran cinco diapositivas fijas. El del B2 es un \u003cb\u003eVortrag de ~4 minutos\u003c/b\u003e sobre uno de dos temas, con \u003cb\u003eestructura propia\u003c/b\u003e (entrada, cuerpo, cierre). Después preguntan el otro candidato y un examinador: esas preguntas valen \u003cb\u003e12 de los 44 puntos\u003c/b\u003e del Teil. El \u003ci\u003eEinführungsgespräch\u003c/i\u003e inicial (~1 min) \u003cb\u003eno puntúa\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eTienes 15 minutos de preparación a solas, con papel sellado; las notas esquemáticas se pueden usar. \u003cb\u003eEsta app entrena y cronometra la partitura; no puntúa lo que dices.\u003c/b\u003e Y el oral real se hace \u003cb\u003een pareja\u003c/b\u003e: sin compañero de conversación no estás examinándote, estás ensayando.\",\"table\":[[\"Vortrag\",\"~4 min · 44 pts (8+8+8+8+12 preguntas)\"],[\"Vorbereitung\",\"15 min a solas\"],[\"Einführungsgespräch\",\"~1 min, no puntúa\"],[\"Aussprache\",\"16 pts, transversal\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m12l8e1\",\"type\":\"mc\",\"prompt\":\"Qué ha desaparecido\",\"question\":\"En el Vortrag B2, ¿qué ya no está?\",\"options\":[\"La obligación de argumentar\",\"Las cinco diapositivas fijas de siempre\",\"Los 15 minutos de preparación\"],\"answer\":1,\"whyWrong\":[\"Argumentar sigue siendo el núcleo\",null,\"Los 15 minutos se mantienen\"],\"itemIds\":[\"b2m12struktur\",\"b2m12vortraghalten\"]},{\"id\":\"b2m12l8e2\",\"type\":\"mc\",\"prompt\":\"Cuánto valen las preguntas\",\"question\":\"Tras tu Vortrag preguntan. ¿Cuánto pesa esa ronda dentro del Teil 1?\",\"options\":[\"Nada: solo era cortesía\",\"12 de 44 puntos\",\"Los 44 enteros\"],\"answer\":1,\"whyWrong\":[\"No es cortesía: está en la hoja de evaluación\",null,\"El Vortrag mismo también puntúa\"],\"itemIds\":[\"b2m12fragenantworten\"]},{\"id\":\"b2m12l8e3\",\"type\":\"match\",\"prompt\":\"Fórmula y momento\",\"pairs\":[{\"target\":\"Meine Damen und Herren, ich möchte Ihnen heute … näherbringen.\",\"source\":\"apertura\"},{\"target\":\"Zuerst die Daten, dann die Grenze, zuletzt ein Vorschlag.\",\"source\":\"estructura\"},{\"target\":\"Ich stehe Ihnen für Fragen zur Verfügung.\",\"source\":\"cierre / ronda\"},{\"target\":\"Vielen Dank für Ihre Aufmerksamkeit.\",\"source\":\"agradecimiento de Sie\"}],\"itemIds\":[\"b2m12meinedamen\",\"b2m12stehefragen\",\"b2m12aufmerksamkeitihre\"]},{\"id\":\"b2m12l8e4\",\"type\":\"monologue\",\"prompt\":\"Vortrag de 4 minutos. Planifica, habla, repite. La app no puntúa la voz.\",\"topic\":\"Zwei Tage Homeoffice: Wahl oder Pflicht?\",\"slides\":[{\"title\":\"Einstieg\",\"hint\":\"Meine Damen und Herren … näherbringen. Eigene Struktur ansagen.\"},{\"title\":\"Daten / Vorteil\",\"hint\":\"Nahverkehr, Konzentration. Laut … / im Vergleich zu …\"},{\"title\":\"Grenze\",\"hint\":\"Küche, Pflege, Wohnheim. Worauf stützt sich das nicht?\"},{\"title\":\"Vorschlag\",\"hint\":\"Wahl im Büro, Ausnahme im Betrieb.\"},{\"title\":\"Schluss\",\"hint\":\"Zusammenfassend … Ich stehe Ihnen für Fragen zur Verfügung.\"}],\"planSeconds\":180,\"speakSeconds\":240,\"reps\":2,\"checklist\":[\"Abrí de Sie, con tema y estructura propia (no las 5 diapositivas del B1)\",\"Di una ventaja con dato o ejemplo\",\"Di una frontera (quién no puede) y una propuesta\",\"Cerré ofreciendo preguntas con la fórmula de examen\",\"Hablé cerca de 4 minutos en las dos pasadas — sabiendo que la app no puntúa la voz\"],\"model\":\"Einstieg (modelo): „Meine Damen und Herren, ich möchte Ihnen heute das Thema Wahlfreiheit im Homeoffice näherbringen. Zuerst der Vorteil, dann die Grenze, zuletzt ein Vorschlag. Zwei Tage entlasten die Bahn. Pflicht spaltet, weil Küche und Pflege kein Schreibtisch sind. Wahl im Büro, Ausnahme im Betrieb. Ich stehe Ihnen nun für Fragen zur Verfügung.“\",\"itemIds\":[\"b2m12meinedamen\",\"b2m12stehefragen\",\"
