atic/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m4l1\",\"phaseId\":\"b1m4\",\"title\":\"Immer online\",\"subtitle\":\"Bildschirmzeit, scrollen y la distracción que no se ve\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario de la pantalla\",\"itemIds\":[\"b1m4dassozialenetzwerk\",\"b1m4diebildschirmzeit\",\"b1m4derbildschirm\",\"b1m4scrollen\",\"b1m4dieablenkung\",\"b1m4dasgeraet\",\"b1m4ausschalten\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El tema, y las dos palabras que lo dominan\",\"body\":\"Este módulo entra en el segundo gran tema de opinión del examen: la vida online. Dos palabras se repiten en todos los textos:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003edie Bildschirmzeit\u003c/b\u003e — el tiempo de pantalla. Es el dato con el que discute todo el mundo: \u003ci\u003eMeine Bildschirmzeit liegt bei vier Stunden pro Tag.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003edie Ablenkung\u003c/b\u003e — la distracción. No es «la distracción» de pasarlo bien, sino lo que te [[ablenkt|distrae]] de lo que estabas haciendo.\u003cbr/\u003e\u003cbr/\u003eY tres verbos que vas a usar sin parar: \u003cb\u003escrollen\u003c/b\u003e (deslizar), \u003cb\u003eausschalten\u003c/b\u003e (apagar, separable: \u003ci\u003eIch schalte das Handy \u003cu\u003eaus\u003c/u\u003e\u003c/i\u003e) y \u003cb\u003estummschalten\u003c/b\u003e (silenciar, también separable).\u003cbr/\u003e\u003cbr/\u003eUn aviso de género: \u003cb\u003edas Handy\u003c/b\u003e es neutro y \u003cb\u003edas Gerät\u003c/b\u003e también; pero \u003cb\u003eder Bildschirm\u003c/b\u003e es masculino (der Schirm = la pantalla, la sombrilla). En Suiza, además, el móvil no es \u003ci\u003eHandy\u003c/i\u003e: es \u003cb\u003edas Natel\u003c/b\u003e.\",\"table\":[[\"alemán\",\"español\",\"ojo\"],[\"die Bildschirmzeit\",\"el tiempo de pantalla\",\"Bild + Schirm + Zeit\"],[\"die Ablenkung\",\"la distracción\",\"de ablenken (distraer)\"],[\"scrollen\",\"hacer scroll / deslizar\",\"verbo regular: ich scrolle\"],[\"ausschalten\",\"apagar\",\"separable: ich schalte … aus\"],[\"stummschalten\",\"silenciar\",\"separable: ich schalte … stumm\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l1e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de la pantalla\",\"pairs\":[{\"target\":\"die Bildschirmzeit\",\"source\":\"el tiempo de pantalla\"},{\"target\":\"die Ablenkung\",\"source\":\"la distracción\"},{\"target\":\"das Gerät\",\"source\":\"el aparato / dispositivo\"},{\"target\":\"scrollen\",\"source\":\"hacer scroll / deslizar\"}],\"itemIds\":[\"b1m4diebildschirmzeit\",\"b1m4dieablenkung\",\"b1m4dasgeraet\",\"b1m4scrollen\"]},{\"id\":\"b1m4l1e2\",\"type\":\"mc\",\"prompt\":\"Reconoce la frase del debate\",\"question\":\"„Meine Bildschirmzeit liegt bei vier Stunden pro Tag.“\",\"options\":[\"Mi tiempo de pantalla es de unas cuatro horas al día\",\"Mi pantalla mide cuatro pulgadas\",\"Trabajo cuatro horas al día con el ordenador\"],\"answer\":0,\"whyWrong\":[null,\"Bildschirmzeit es tiempo, no tamaño\",\"No habla de trabajo: cuenta TODO el tiempo de pantalla\"],\"itemIds\":[\"b1m4diebildschirmzeit\"],\"tip\":\"«liegt bei» es la fórmula alemana para dar una cifra aproximada. Cópiala: suena mucho más nativa que «ist».\"},{\"id\":\"b1m4l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo separable\",\"text\":\"Abends schalte ich mein Handy ___.\",\"answers\":[\"aus\"],\"translation\":\"Por la noche apago el móvil.\",\"hints\":[\"El prefijo se va al final de la frase\",\"ausschalten → ich schalte ... ___\"],\"itemIds\":[\"b1m4ausschalten\",\"a2m3handy\"],\"tip\":\"Separable = el prefijo cierra la frase. Es la misma pinza que ya usas con einkaufen o aufstehen.\"},{\"id\":\"b1m4l1e4\",\"type\":\"mc\",\"prompt\":\"Desmonta la palabra compuesta\",\"question\":\"„die Bildschirmzeit“ está formada por ...\",\"options\":[\"Bildschirm (pantalla) + Zeit (tiempo)\",\"Bild (imagen) + Schirmzeit (hora de sombrilla)\",\"Bildschirm (pantalla) + Zeitung (periódico)\"],\"answer\":0,\"whyWrong\":[null,\"El corte va tras Bildschirm, que ya es una palabra hecha\",\"Zeit y Zeitung no son lo mismo: die Zeitung es el periódico\"],\"itemIds\":[\"b1m4diebildschirmzeit\",\"b1m4derbildschirm\",\"zeit\"]},{\"id\":\"b1m4l1e5\",\"type\":\"build\",\"prompt\":\"Construye la confesión más común\",\"target\":\"Abends scrolle ich zu lange am Handy\",\"altTargets\":[\"Ich scrolle abends zu lange am Handy\"],\"translation\":\"Por las noches deslizo demasiado rato en el móvil\",\"distractors\":[\"scrollen\",\"bin\"],\"itemIds\":[\"b1m4scrollen\",\"a2m3handy\",\"a2m3lange\"],\"tip\":\"Abends abre la frase → verbo 2º, sujeto 3º. La inversión del A2 sigue viva en cada frase B1.\"},{\"id\":\"b1m4l1e6\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Das Handy ist die größte Ablenkung\",\"translation\":\"El móvil es la mayor distracción\",\"hints\":[\"Superlativo atributivo: die größte ...\",\"Das Handy ist die größte ...\"],\"itemIds\":[\"b1m4dieablenkung\",\"a2m3handy\"]},{\"id\":\"b1m4l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa con el verbo del silencio\",\"text\":\"Im Kino schalte ich mein Handy ___.\",\"answers\":[\"stumm\"],\"translation\":\"En el cine silencio el móvil.\",\"hints\":[\"También es separable\",\"stummschalten → ich schalte ... ___\"],\"itemIds\":[\"b1m4stummschalten\",\"kino\"]},{\"id\":\"b1m4l1e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta: tu diagnóstico digital\",\"text\":\"Meine Bildschirmzeit liegt bei vier Stunden pro Tag.\",\"phonetic\":\"MAI-ne BILT-shirm-tsait liikt bai fiia SHTUN-den pro taak\",\"translation\":\"Mi tiempo de pantalla es de unas cuatro horas al día.\",\"itemIds\":[\"b1m4diebildschirmzeit\",\"stunde\"]},{\"id\":\"b1m4l1e9\",\"type\":\"mc\",\"prompt\":\"Infiere la intención\",\"question\":\"Un amigo dice: „Ich schalte mein Handy abends aus — sonst scrolle ich bis eins.“ ¿Qué quiere decir?\",\"options\":[\"Que no confía en su propia fuerza de voluntad\",\"Que su móvil se estropea por la noche\",\"Que trabaja hasta la una de la madrugada\"],\"answer\":0,\"whyWrong\":[null,\"Nada en la frase habla de una avería\",\"«bis eins» se refiere a lo que haría scrolleando, no trabajando\"],\"itemIds\":[\"b1m4ausschalten\",\"b1m4scrollen\"],\"tip\":\"«sonst» (si no, de lo contrario) es una palabra clave de inferencia: introduce lo que pasaría SIN la medida.\"},{\"id\":\"b1m4l1e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Por la noche apago el móvil.\",\"answers\":[\"Abends schalte ich mein Handy aus\",\"Ich schalte mein Handy abends aus\"],\"hints\":[\"Separable: el aus cierra la frase\",\"Abends schalte ich mein Handy ...\"],\"itemIds\":[\"b1m4ausschalten\",\"a2m3handy\"]},{\"id\":\"b1m4l1e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: una noticia de radio · tarea 1 de 2. Lee la afirmación, dale al play y marca Richtig o Falsch. El Teil 1 se oye DOS veces.\",\"audio\":\"Und jetzt zu einer Meldung, die viele Eltern interessieren dürfte. Eine Zahl, wie viel Bildschirmzeit für alle Kinder gesund ist, gibt es nach Angaben der Kinderärzte nicht. Entscheidend sei vielmehr, was durch die Zeit am Handy wegfällt: Schlaf, Bewegung, Freunde. Wer trotzdem eine feste Regel möchte, ähm, solle sie mit dem Kind gemeinsam festlegen — verordnete Grenzen halten selten länger als eine Woche.\",\"question\":\"„Die Kinderärzte nennen eine feste Stundenzahl für alle Kinder.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Eine Zahl …, die für alle Kinder gesund ist, gibt es … nicht»\",null],\"itemIds\":[\"b1m4diebildschirmzeit\"],\"tip\":\"Los textos del Teil 1 son cortos porque son informativos: un aviso, un mensaje, una noticia. Los debates a tres voces del examen duran tres minutos — el tuyo está al final del módulo.\"},{\"id\":\"b1m4l1e12\",\"type\":\"audiomc\",\"prompt\":\"Misma noticia, segunda tarea. Dos escuchas.\",\"audio\":\"Und jetzt zu einer Meldung, die viele Eltern interessieren dürfte. Eine Zahl, wie viel Bildschirmzeit für alle Kinder gesund ist, gibt es nach Angaben der Kinderärzte nicht. Entscheidend sei vielmehr, was durch die Zeit am Handy wegfällt: Schlaf, Bewegung, Freunde. Wer trotzdem eine feste Regel möchte, ähm, solle sie mit dem Kind gemeinsam festlegen — verordnete Grenzen halten selten länger als eine Woche.\",\"question\":\"¿Qué es lo decisivo, según los pediatras?\",\"options\":[\"Lo que se deja de hacer por estar en el móvil: dormir, moverse, ver a los amigos\",\"El número de horas de pantalla al día\",\"La edad a la que se recibe el primer móvil\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo eso es lo que dicen que no se puede fijar igual para todos\",\"De la edad del primer móvil no se habla\"],\"itemIds\":[\"b1m4dieablenkung\"],\"tip\":\"«Entscheidend sei …» — Konjunktiv I: la radio cita a los médicos sin comprometerse. Cuando lo oigas, sabes que lo que viene es la opinión de un tercero.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m4-1\",\"book\":\"Ich beschäftige mich kurz mit dem Handy.\",\"real\":\"Ich daddel nur kurz.\",\"meaning\":\"Solo juego / trasteo un ratito con el móvil\",\"when\":\"Entre amigos y en familia. En un texto de examen o con el jefe, jamás: «daddeln» solo vive en la calle y además suena a que estás matando el rato.\",\"register\":\"amigos\",\"exam\":\"Ich schaue nur kurz auf mein Handy.\",\"note\":\"«daddeln» es trastear sin objetivo, casi siempre con el móvil en la mano. Suena a autoironía, no a orgullo.\",\"sound\":\"ij DA-del nua kurts\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m4natdaddeln\"}}],\"resources\":[{\"label\":\"DW — Top-Thema (B1)\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Busca los artículos sobre «Digitalisierung» y «Soziale Medien»: el tema exacto de este módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
