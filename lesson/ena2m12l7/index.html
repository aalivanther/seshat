o.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l7\",\"phaseId\":\"ena2m12\",\"title\":\"Writing 2: the formal text\",\"subtitle\":\"Tres contenidos obligados, y un registro que no es el tuyo de siempre\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de la carta que se toma en serio\",\"itemIds\":[\"ena2m12dearsirormadam\",\"ena2m12yourssincerely\",\"ena2m12iamwritingto\",\"ena2m12iwouldbegrateful\",\"ena2m12ilookforwardtoyourreply\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La Tarea 2: neutro o formal, y tres contenidos que no se negocian\",\"body\":\"Escribes a un lector concreto —una oficina, una escuela, un casero, [[the exam centre|el centro de examen]]— y el enunciado te da \u003cb\u003etres elementos de contenido\u003c/b\u003e que tienen que aparecer. Mismo rango, 30-50 palabras; mismas 12 marcas.\u003cbr/\u003e\u003cbr/\u003eEl registro es \u003cb\u003elo nuevo del nivel\u003c/b\u003e. El inglés no tiene un «usted»: no puedes cambiar de pronombre y quedar bien. La cortesía vive en \u003cb\u003ela forma de la petición\u003c/b\u003e. \u003ci\u003eSend me the price\u003c/i\u003e y \u003ci\u003eCould you tell me the price, please?\u003c/i\u003e dicen lo mismo y no suenan igual — la primera es una orden. Regla práctica: en la Tarea 2, \u003cb\u003eningún imperativo pelado\u003c/b\u003e, y nada de \u003ci\u003eI want\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY la pareja de saludo y despedida, que es media nota de organización: si empiezas con \u003cb\u003eDear Sir or Madam\u003c/b\u003e (no sabes el nombre), cierras con \u003cb\u003eYours faithfully\u003c/b\u003e; si empiezas con \u003cb\u003eDear Mr Patel\u003c/b\u003e (sabes el nombre), cierras con \u003cb\u003eYours sincerely\u003c/b\u003e. No se mezclan.\",\"table\":[[\"Suena a orden\",\"Suena a persona educada\"],[\"I want information about the exam.\",\"I would be grateful for any information.\"],[\"Send me the dates.\",\"Could you send me the dates, please?\"],[\"Tell me the price.\",\"I would like to know the price.\"],[\"Answer soon.\",\"I look forward to your reply.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l7e1\",\"type\":\"mc\",\"prompt\":\"La pareja que no se mezcla\",\"question\":\"Has empezado con «Dear Mr Patel,». ¿Cómo cierras?\",\"options\":[\"Yours sincerely,\",\"Yours faithfully,\",\"Love,\"],\"answer\":0,\"whyWrong\":[null,\"faithfully es para cuando NO sabes el nombre: va con Dear Sir or Madam\",\"Love es para tu hermana, no para el tendero\"],\"itemIds\":[\"ena2m12yourssincerely\",\"ena2m12dearsirormadam\"],\"tip\":\"Regla de memoria: si en el saludo hay un apellido, en la despedida hay sincerely. Sin apellido, faithfully.\"},{\"id\":\"ena2m12l7e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿orden o petición educada?\",\"categories\":[\"Suena a orden (no lo escribas)\",\"Suena a persona educada\"],\"items\":[{\"text\":\"Send me the information.\",\"bucket\":0},{\"text\":\"Could you send me the information, please?\",\"bucket\":1},{\"text\":\"I want a place in the June exam.\",\"bucket\":0},{\"text\":\"I would like a place in the June exam.\",\"bucket\":1},{\"text\":\"Tell me the price.\",\"bucket\":0},{\"text\":\"Could you tell me the price, please?\",\"bucket\":1},{\"text\":\"Answer soon.\",\"bucket\":0},{\"text\":\"I look forward to your reply.\",\"bucket\":1}],\"itemIds\":[\"ena2m12iwouldbegrateful\",\"ena2m12ilookforwardtoyourreply\",\"ena2m7couldihaveastamp\"],\"tip\":\"Fíjate en que la columna de la izquierda no tiene ni un error de gramática. El registro no es corrección: es otra cosa, y se puntúa igual.\"},{\"id\":\"ena2m12l7e3\",\"type\":\"transform\",\"prompt\":\"Sube el registro sin cambiar el mensaje\",\"source\":\"Send me the exam dates.\",\"instruction\":\"Dilo como se lo escribirías al centro de examen\",\"answers\":[\"Could you send me the exam dates, please?\",\"Could you send me the exam dates please?\",\"I would be grateful if you could send me the exam dates.\"],\"translation\":\"¿Podría enviarme las fechas de examen, por favor?\",\"hints\":[\"Empieza por Could you…\",\"…, please?\"],\"itemIds\":[\"ena2m12theexamcentre\",\"ena2m7couldyousound\"],\"tip\":\"Could you + please convierte cualquier orden en una petición. Son tres palabras y cambian el criterio de registro entero.\"},{\"id\":\"ena2m12l7e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige — el arranque de la carta formal\",\"wrong\":\"I write you to ask about the exam.\",\"answers\":[\"I am writing to ask about the exam.\",\"I'm writing to ask about the exam.\"],\"why\":\"Dos cosas a la vez, y las dos son calco: en inglés la carta se abre con present continuous (I am writing, porque estás escribiéndola ahora mismo), y write no lleva objeto de persona directo — o es write TO you, o no va nadie, que es lo normal en una carta formal.\",\"translation\":\"Le escribo para preguntar por el examen.\",\"hints\":[\"El presente simple no abre cartas en inglés\",\"I ___ ___ to ask about the exam.\"],\"itemIds\":[\"ena2m12iamwritingto\"]},{\"id\":\"ena2m12l7e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige — el incontable más caro del examen\",\"wrong\":\"I would be grateful for any informations.\",\"answers\":[\"I would be grateful for any information.\",\"I would be grateful for any information\"],\"why\":\"information no tiene plural en inglés, igual que advice, news, furniture, luggage o homework. El español los cuenta («informaciones», «consejos») y en el Writing cada plural inventado se cuenta como error de léxico.\",\"translation\":\"Le agradecería cualquier información.\",\"hints\":[\"¿Se puede decir «una información»?\",\"…for any informa___.\"],\"itemIds\":[\"ena2m12iwouldbegrateful\",\"ena2m5somegoodadvice\"]},{\"id\":\"ena2m12l7e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige — la despedida que casi todo el mundo escribe mal\",\"wrong\":\"I look forward to hear from you.\",\"answers\":[\"I look forward to hearing from you.\",\"I look forward to hearing from you\"],\"why\":\"En look forward TO, ese to no es el del infinitivo: es una preposición, y detrás de preposición el verbo inglés va en -ing. Por eso es to hearing, igual que I'm interested in working o I'm good at cooking.\",\"translation\":\"Quedo a la espera de su respuesta.\",\"hints\":[\"Detrás de preposición, verbo en -ing\",\"…to hear___ from you.\"],\"itemIds\":[\"ena2m12ilookforwardtoyourreply\",\"ena2m3iminterestedin\"]},{\"id\":\"ena2m12l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa la despedida que toca\",\"text\":\"Dear Mr Patel, … Yours ___ , Valeria Soto\",\"answers\":[\"sincerely\"],\"translation\":\"Estimado señor Patel: … Atentamente, Valeria Soto\",\"hints\":[\"Sabes el apellido del destinatario\",\"Yours sin…\"],\"itemIds\":[\"ena2m12yourssincerely\"]},{\"id\":\"ena2m12l7e8\",\"type\":\"gapbank\",\"prompt\":\"Monta la plantilla de la carta formal\",\"text\":\"___ Sir or Madam, I am ___ to ask about the A2 exam in June. Could you tell me how much it ___ ? I would be ___ for any information about the documents I need. Yours faithfully, Valeria Soto\",\"answers\":[\"Dear\",\"writing\",\"costs\",\"grateful\"],\"bank\":[\"Dear\",\"writing\",\"costs\",\"grateful\",\"Hi\",\"thanks\"],\"translation\":\"Estimados señores: les escribo para preguntar por el examen de A2 de junio. ¿Podrían decirme cuánto cuesta? Les agradecería cualquier información sobre la documentación que hace falta. Atentamente, Valeria Soto\",\"itemIds\":[\"ena2m12dearsirormadam\",\"ena2m12iamwritingto\",\"ena2m12iwouldbegrateful\",\"ena2m12theexamcentre\"],\"tip\":\"Esta plantilla son 20 de tus 50 palabras
