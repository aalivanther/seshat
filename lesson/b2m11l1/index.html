mittlung\u003c/b\u003e: no hay un Teil de «pásalo al español». Mediar, aquí, no es el nombre de una tarea. Es la operación que el Lesen y el Schreiben sí cobran: resumir sin copiar y contrastar dos fuentes. Otros formatos examinan la Sprachmittlung como papel con nombre; el Goethe B2 de 2019, no.\u003cbr/\u003e\u003cbr/\u003eLas muletillas no son adorno: señalan el cambio de operación. \u003ci\u003eZusammenfassend lässt sich sagen, dass…\u003c/i\u003e avisa al lector de que ya no está en el original. \u003ci\u003eIm Wesentlichen\u003c/i\u003e avisa de que se ha cortado. \u003ci\u003eDas heißt\u003c/i\u003e avisa de que se reformula. Si pegas tres frases del original una detrás de otra, no has resumido: has hecho un collage, y es el error de la clínica."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m11l1\",\"phaseId\":\"b2m11\",\"title\":\"Kurz gesagt, ohne mich\",\"subtitle\":\"El resumen: presente, sin detalle, sin tu opinión\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las muletillas que abren un resumen\",\"itemIds\":[\"b2m11zusammenfassend\",\"b2m11mitanderenworten\",\"b2m11dasheisst\",\"b2m11kurzgesagt\",\"b2m11imwesentlichen\",\"b2m3zusammenfassung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Resumir no es acortar: es cambiar de operación\",\"body\":\"$17\",\"table\":[[\"zusammenfassend\",\"abre el resumen, verbo detrás\"],[\"im Wesentlichen\",\"marca que se ha cortado lo accesorio\"],[\"mit anderen Worten / das heißt\",\"reformula, no añade\"],[\"das Fazit\",\"el balance, no el último detalle\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m11l1e1\",\"type\":\"match\",\"prompt\":\"Muletilla y oficio\",\"pairs\":[{\"target\":\"zusammenfassend\",\"source\":\"abre el resumen\"},{\"target\":\"im Wesentlichen\",\"source\":\"marca que se ha cortado\"},{\"target\":\"mit anderen Worten\",\"source\":\"reformula\"},{\"target\":\"das heißt\",\"source\":\"explica lo mismo más claro\"},{\"target\":\"d
