número uno de las relativas\",\"question\":\"«la persona que trabaja conmigo» →\",\"options\":[\"the person who works with me\",\"the person who she works with me\",\"the person which works with me\"],\"answer\":0,\"whyWrong\":[null,\"El «she» sobra: «who» YA es el sujeto de «works». En español se repite («la persona que ella trabaja»), en inglés jamás.\",\"«which» es para cosas y sitios. Para personas, «who» o «that».\"],\"itemIds\":[\"enb1m2personwho\"],\"tip\":\"Prueba de bolsillo: tapa el relativo. Si lo que queda («___ works with me») ya tiene sujeto, el pronombre extra sobra.\"},{\"id\":\"enb1m2l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I've got a colleague who she works nights.\",\"answers\":[\"I've got a colleague who works nights.\"],\"why\":\"El pronombre reasumido: «who» hace de sujeto de «works», así que «she» está de más. El español lo admite en el habla («tengo una compañera que ella trabaja de noche»); el inglés lo da por incorrecto siempre.\",\"translation\":\"Tengo una compañera que trabaja de noche.\",\"itemIds\":[\"enb1m2personwho\",\"enb1m2nightshift\"]},{\"id\":\"enb1m2l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el relativo\",\"text\":\"This is the man ___ gave me the job.\",\"answers\":[\"who\",\"that\"],\"translation\":\"Este es el hombre que me dio el trabajo.\",\"hints\":[\"Es una persona\",\"Empieza por w… (o vale también «that»)\"],\"itemIds\":[\"enb1m2personwho\"],\"tip\":\"Con personas valen «who» y «that». En el escrito de examen, «who» queda mejor: se lee más formal y no deja dudas.\"},{\"id\":\"enb1m2l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase del módulo\",\"target\":\"I want a job that pays well\",\"translation\":\"Quiero un trabajo que pague bien\",\"distractors\":[\"who\",\"it\"],\"itemIds\":[\"enb1m2jobthatpays\"],\"tip\":\"Las dos fichas que sobran son las dos que pone un hispanohablante: «who» (que aquí es para personas) e «it» (el pronombre reasumido).\"},{\"id\":\"enb1m2l1e7\",\"type\":\"transform\",\"prompt\":\"Dos frases cortas → una de B1\",\"source\":\"I work with a person. She speaks four languages.\",\"instruction\":\"Únelas con «who» en una sola frase\",\"answers\":[\"I work with a person who speaks four languages\",\"I work with a person who speaks four languages.\",\"I work with somebody who speaks four languages\"],\"translation\":\"Trabajo con una persona que habla cuatro idiomas.\",\"hints\":[\"El segundo «she» desaparece: lo sustituye «who»\",\"I work with a person who ...\"],\"itemIds\":[\"enb1m2personwho\",\"enb1m2somebodywho\"],\"tip\":\"Esto es literalmente lo que sube de banda en el criterio de gramática: dos frases de A2 convertidas en una de B1 sin añadir ni una palabra nueva.\"},{\"id\":\"enb1m2l1e8\",\"type\":\"bucket\",\"prompt\":\"¿who o which? Clasifica según a QUÉ se refiere el hueco\",\"categories\":[\"who — personas\",\"which — cosas, sitios, empresas\"],\"items\":[{\"text\":\"the barista ___ makes the coffee\",\"bucket\":0},{\"text\":\"the shift ___ nobody wants\",\"bucket\":1},{\"text\":\"the colleague ___ sits next to me\",\"bucket\":0},{\"text\":\"the café ___ opened in 2019\",\"bucket\":1},{\"text\":\"the manager ___ signed my contract\",\"bucket\":0},{\"text\":\"the form ___ arrived yesterday\",\"bucket\":1},{\"text\":\"the nurse ___ works nights\",\"bucket\":0},{\"text\":\"the wage ___ they offered me\",\"bucket\":1}],\"itemIds\":[\"enb1m2personwho\",\"enb1m2shiftnobodywants\",\"enb1m2colleague\"],\"tip\":\"«that» valdría en los ocho, y por eso no está en el ejercicio: aquí se entrena la decisión que el examen sí pregunta.\"},{\"id\":\"enb1m2l1e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Buscan a alguien que hable español.\",\"answers\":[\"They're looking for somebody who speaks Spanish\",\"They are looking for somebody who speaks Spanish\",\"They're looking for someone who speaks Spanish\",\"They are looking for someone who speaks Spanish\"],\"hint\":\"El subjuntivo español («hable») en inglés es presente normal\",\"itemIds\":[\"enb1m2somebodywho\"],\"tip\":\"Dos trampas en cinco palabras: el inglés no tiene subjuntivo aquí (speaks, no «speak»), y esa -s es de tercera persona porque «somebody» es singular.\"},{\"id\":\"enb1m2l1e10\",\"type\":\"gapbank\",\"prompt\":\"Completa el retrato del café — un relativo por hueco\",\"text\":\"Valeria works with a barista ___ never stops talking, in a café ___ opens at six. The manager ___ signed her contract works upstairs, and the shift ___ nobody wants starts at half past five.\",\"answers\":[\"who\",\"which\",\"who\",\"which\"],\"bank\":[\"who\",\"which\",\"whose\",\"where\",\"what\"],\"translation\":\"Valeria trabaja con un barista que no para de hablar, en un café que abre a las seis. La encargada que firmó su contrato trabaja arriba, y el turno que nadie quiere empieza a las cinco y media.\",\"itemIds\":[\"enb1m2personwho\",\"enb1m2shiftnobodywants\",\"enb1m2colleague\"],\"tip\":\"Persona → who. Cosa o sitio → which. Y ojo con el último: el sujeto de «wants» es «nobody», no el turno; el turno es el objeto, y aun así el relativo va igual.\"},{\"id\":\"enb1m2l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"I want a job that pays well.\",\"translation\":\"Quiero un trabajo que pague bien.\",\"hints\":[\"Empieza por «I want…»\",\"I want a job ...\"],\"itemIds\":[\"enb1m2jobthatpays\"],\"tip\":\"«that» en el habla rápida se queda en «dat», casi sin vocal. Si no lo oyes, no es que no esté: es que no pesa.\"},{\"id\":\"enb1m2l1e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu frase de partida\",\"text\":\"I want a career, not just a job, and a boss who listens.\",\"phonetic\":\"ai uont a ka-RÍA, not dchast a dchob, and a bos ju LÍ-sens\",\"translation\":\"Quiero una trayectoria profesional, no solo un empleo, y un jefe que escuche.\",\"itemIds\":[\"enb1m2careernotjob\",\"enb1m2personwho\"],\"tip\":\"Ojo con «career»: NO es la carrera universitaria (eso es «a degree»). Es la vida profesional entera. «I finished my career» le suena a un inglés a que te has jubilado.\"},{\"id\":\"enb1m2l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES de darle al play. Dos escuchas.\",\"audio\":\"Sam, can I ask you something? If a job came up somewhere else, would you mind?|Course not. You've been on that early shift for a year and a half.|It's not the shift, honestly. It's that there's nowhere to go from here. Priya's not leaving, and there's nothing above her.|Then go. Look, I'd rather lose you to something with a future than keep you and watch you go quiet on me.\",\"question\":\"¿Cuál es el verdadero motivo de Valeria?\",\"options\":[\"Que en ese trabajo no hay ningún futuro\",\"Que el turno de la mañana es muy duro\",\"Que se lleva mal con la encargada\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella misma lo descarta: «It's not the shift, honestly».\",\"De la encargada solo dice que no se va, no que se lleven mal.\"],\"itemIds\":[\"enb1m2prospects\",\"enb1m2careernotjob\"],\"tip\":\"«There's nowhere to go from here» es la manera inglesa de decir «esto no tiene futuro». En el examen, la respuesta buena casi nunca repite las palabras del audio: las resume.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m2-1\",\"book\":\"I'm looking for a job.\",\"real\":\"I'm on the job hunt.\",\"meaning\":\"Estoy buscando trabajo\",\"when\":\"Hablando, con amigos y compañeros: es lo que se dice de verdad, y suena activo, no lastimero. En una carta de presentación o en el Writing NO: allí queda coloquial y baja el criterio de vocabulario por registro.\",\"register\":\"neutral\",\"exam\":\"I am currently looking for work.\",\"note\":\"«Hunt» es «caza», y la imagen es esa: no estás esperando, estás persiguiendo. Se dice «on the job hunt» o «job-hunting», nunca «in the job hunt».\",\"sound\":\"aim on de dchob jant\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m2natjobhunt\"}}],\"resources\":[{\"label\":\"National Careers Service (Reino Unido)\",\"url\":\"https://nationalcareers.service.gov.uk/explore-careers\",\"note\":\"Elige un oficio cualquiera y lee su ficha: «What you'll do», «What it takes», «What you'll earn». Es inglés B1 auténtico y está lleno de relativas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
