eshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T5d6,"])</script><script>self.__next_f.push([1,"Este módulo y el siguiente son distintos a los nueve anteriores, y lo justo es decírtelo en la primera línea.\u003cbr/\u003e\u003cbr/\u003eEl \u003cb\u003epresent perfect\u003c/b\u003e —eso de \u003ci\u003eI have worked\u003c/i\u003e, \u003ci\u003eshe has gone\u003c/i\u003e— \u003cb\u003eno está en el temario de A2 de tu examen\u003c/b\u003e. El temario oficial de LanguageCert lo pone en la columna del \u003cb\u003eB1\u003c/b\u003e, junto con \u003ci\u003esince\u003c/i\u003e, \u003ci\u003efor\u003c/i\u003e, \u003ci\u003eever\u003c/i\u003e, \u003ci\u003enever\u003c/i\u003e, \u003ci\u003eyet\u003c/i\u003e, \u003ci\u003ealready\u003c/i\u003e y \u003ci\u003ejust\u003c/i\u003e. Tu nivel, el Access A2, llega al pasado simple con sus marcadores y al futuro con \u003ci\u003egoing to\u003c/i\u003e, y ahí se para.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEntonces, ¿por qué está aquí?\u003c/b\u003e Por tres razones que no son un capricho:\u003cbr/\u003e1. \u003cb\u003eCambridge sí lo evalúa en A2.\u003c/b\u003e Si algún día haces el A2 Key en vez del LanguageCert, te lo van a pedir.\u003cbr/\u003e2. \u003cb\u003eLo vas a oír.\u003c/b\u003e En Londres nadie espera a tener el B1 para decir \u003ci\u003eI've just arrived\u003c/i\u003e. Entender no cuesta lo mismo que producir, y esto se cobra entero en el Listening.\u003cbr/\u003e3. \u003cb\u003ePorque te protege el pasado simple.\u003c/b\u003e La confusión entre los dos tiempos es \u003cb\u003eel error que más puntos le cuesta a un hispanohablante\u003c/b\u003e, y no se arregla ignorando uno de los dos: se arregla viéndolos juntos. Ese es el trabajo de la lección 6.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el compromiso, por escrito: nada de este módulo entra en el simulacro de examen.\u003c/b\u003e Lo que se te va a exigir producir en la prueba sigue siendo el pasado simple de \u003ci\u003eena2m1\u003c/i\u003e y \u003ci\u003eena2m2\u003c/i\u003e. Aquí se presenta, se reconoce y se produce con ayuda. Sin agobios y sin prisa."])</script><script>self.__next_f.push([1,"18:T5f4,"])</script><script>self.__next_f.push([1,"Se construye con \u003cb\u003edos piezas\u003c/b\u003e y ninguna es nueva del todo:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ehave / has\u003c/b\u003e + \u003cb\u003eparticipio\u003c/b\u003e (la «tercera forma» del verbo)\u003cbr/\u003e\u003cbr/\u003e· \u003ci\u003eI \u003cb\u003ehave worked\u003c/b\u003e…\u003c/i\u003e · \u003ci\u003eShe \u003cb\u003ehas worked\u003c/b\u003e…\u003c/i\u003e · \u003ci\u003eThey \u003cb\u003ehave worked\u003c/b\u003e…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eSolo cambia en tercera persona del singular (\u003cb\u003ehe / she / it → has\u003c/b\u003e), exactamente igual que el \u003ci\u003edo/does\u003c/i\u003e del A1. Y en la calle se contrae siempre: \u003cb\u003eI've\u003c/b\u003e, \u003cb\u003eyou've\u003c/b\u003e, \u003cb\u003eshe's\u003c/b\u003e, \u003cb\u003ethey've\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Para qué sirve?\u003c/b\u003e Para hablar de tu \u003cb\u003eexperiencia hasta hoy\u003c/b\u003e, sin decir cuándo. Es la diferencia entre estas dos preguntas:\u003cbr/\u003e· [[Have you ever worked in a restaurant?|¿Has trabajado alguna vez en un restaurante?]] → toda tu vida, hasta este momento.\u003cbr/\u003e· \u003ci\u003eDid you work in the restaurant on Saturday?\u003c/i\u003e → un día concreto, cerrado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eever\u003c/b\u003e = «alguna vez», y vive \u003cb\u003een las preguntas\u003c/b\u003e. \u003cb\u003enever\u003c/b\u003e = «nunca», y vive \u003cb\u003een las afirmativas\u003c/b\u003e (never ya es la negación: no se le pone \u003ci\u003enot\u003c/i\u003e encima).\u003cbr/\u003e\u003cbr/\u003e· \u003ci\u003eHave you \u003cb\u003eever\u003c/b\u003e been to a concert?\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eI've \u003cb\u003enever\u003c/b\u003e been to a concert.\u003c/i\u003e — nunca \u003ci\u003eI haven't never\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY el sitio de ever/never es fijo: \u003cb\u003eentre have y el participio\u003c/b\u003e. \u003ci\u003eHave you \u003cb\u003eever\u003c/b\u003e worked…?\u003c/i\u003e · \u003ci\u003eI've \u003cb\u003enever\u003c/b\u003e tried…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLa respuesta corta repite \u003cb\u003eel auxiliar\u003c/b\u003e, como toda la vida: [[Yes, I have.|Sí.]] / [[No, I haven't.|No.]] — nunca \u003ci\u003eYes, I did\u003c/i\u003e, que contestaría a otra pregunta."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l1\",\"phaseId\":\"ena2m10\",\"title\":\"Have you ever…?\",\"subtitle\":\"Preguntar por toda una vida sin poner fecha a nada\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preguntar y contar experiencias\",\"itemIds\":[\"ena2m10haveyouever\",\"ena2m10yesihave\",\"ena2m10ivenevertried\",\"ena2m10shesworkedin\",\"ena2m10experience\",\"ena2m10onceortwice\",\"ennever\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Léelo antes de empezar: esto es FRONTERA\",\"body\":\"$17\",\"table\":[[\"\",\"Tu examen (LanguageCert A2)\",\"Este módulo\"],[\"Pasado simple\",\"se te exige producirlo\",\"se usa y se contrasta\"],[\"Present perfect\",\"NO entra\",\"se presenta y se reconoce\"],[\"En el simulacro\",\"sí\",\"no aparece\"],[\"En la calle de Londres\",\"todo el rato\",\"todo el rato\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"La forma: have (o has) + la tercera forma del verbo\",\"body\":\"$18\",\"table\":[[\"persona\",\"afirmativa\",\"negativa\",\"pregunta\"],[\"I / you / we / they\",\"I've worked.\",\"I haven't worked.\",\"Have you worked?\"],[\"he / she / it\",\"She's worked.\",\"She hasn't worked.\",\"Has she worked?\"],[\"respuesta corta\",\"Yes, I have.\",\"No, I haven't.\",\"—\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"alguna vez, en algún punto\",\"pastExample\":\"I've worked in a restaurant.\",\"nowLabel\":\"hoy\",\"nowExample\":\"I work in a café.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la pregunta de experiencia\",\"question\":\"“Have you ever worked in a restaurant?”\",\"options\":[\"¿Has trabajado alguna vez en un restaurante?\",\"¿Trabajaste ayer en el restaurante?\",\"¿Vas a trabajar en un restaurante?\"],\"answer\":0,\"whyWrong\":[null,\"Eso pediría un día concreto: «Did you work at the restaurant yesterday?»\",\"El futuro con going to es del módulo 6; aquí se pregunta por toda tu vida hasta hoy\"],\"itemIds\":[\"ena2m10haveyouever\"],\"tip\":\"La marca de «alguna vez» es ever, y va metida entre have y el verbo. Sin ever, la pregunta sigue siendo de experiencia, pero suena menos abierta.\"},{\"id\":\"ena2m10l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — todo esto ya es tuyo\",\"pairs\":[{\"target\":\"never\",\"source\":\"nunca\"},{\"target\":\"twice\",\"source\":\"dos veces\"},{\"target\":\"the exam\",\"source\":\"el examen\"},{\"target\":\"homework\",\"source\":\"los deberes\"},{\"target\":\"university\",\"source\":\"la universidad\"}],\"targetSeconds\":25,\"itemIds\":[\"ennever\",\"entwice\",\"enexam\",\"enhomework\",\"enuniversity\"],\"tip\":\"never lo traes del módulo 4 del A1, donde era «nunca» de frecuencia. Aquí hace otro trabajo, pero es la misma palabra: no hay nada que reaprender.\"},{\"id\":\"ena2m10l1e3\",\"type\":\"match\",\"prompt\":\"Empareja la persona con su auxiliar\",\"pairs\":[{\"target\":\"I have worked\",\"source\":\"he trabajado\"},{\"target\":\"she has worked\",\"source\":\"ha trabajado (ella)\"},{\"target\":\"we have worked\",\"source\":\"hemos trabajado\"},{\"target\":\"they have worked\",\"source\":\"han trabajado\"}],\"itemIds\":[\"ena2m10haveyouever\",\"ena2m10shesworkedin\"],\"tip\":\"Una sola excepción en toda la tabla: he/she/it llevan has. Es el mismo bulto que la -s del presente, en otro sitio.\"},{\"id\":\"ena2m10l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Pregunta por una experiencia (sin cuándo) o por un momento concreto?\",\"categories\":[\"experiencia: have / has\",\"momento concreto: pasado simple\"],\"items\":[{\"text\":\"Have you ever been to a concert?\",\"bucket\":0},{\"text\":\"Did you go to the concert on Sunday?\",\"bucket\":1},{\"text\":\"I've never worked at night.\",\"bucket\":0},{\"text\":\"I worked at night last summer.\",\"bucket\":1},{\"text\":\"She has never tried sushi.\",\"bucket\":0},{\"text\":\"She tried sushi in Tokyo in 2019.\",\"bucket\":1}],\"itemIds\":[\"ena2m10haveyouever\",\"ena2m10ivenevertried\"],\"tip\":\"Fíjate en lo que decide: si en la frase hay una FECHA o un día, es pasado simple. Si no la hay, cabe la experiencia. Esa idea vuelve entera en la lección 6.\"},{\"id\":\"ena2m10l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar\",\"text\":\"___ you ever worked in a café?\",\"answers\":[\"Have\"],\"translation\":\"¿Has trabajado alguna vez en un café?\",\"hints\":[\"El auxiliar del perfecto, para you\",\"H…\"],\"itemIds\":[\"ena2m10haveyouever\"]},{\"id\":\"ena2m10l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar — ojo a la persona\",\"text\":\"Amy ___ never tried Colombian coffee.\",\"answers\":[\"has\"],\"translation\":\"Amy no ha probado nunca el café colombiano.\",\"hints\":[\"Amy es «ella»: el auxiliar cambia\",\"h…\"],\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10shesworkedin\"]},{\"id\":\"ena2m10l1e7\",\"type\":\"mc\",\"prompt\":\"La respuesta corta\",\"question\":\"“Have you ever been to a football match?” — Contestas que sí:\",\"options\":[\"Yes, I have.\",\"Yes, I did.\",\"Yes, I am.\"],\"answer\":0,\"whyWrong\":[null,\"Ese did contestaría a «Did you go…?», que pregunta por un día concreto\",\"am es del verbo be; aquí el auxiliar de la pregunta era have\"],\"itemIds\":[\"ena2m10yesihave\"],\"tip\":\"Norma de oro de las respuestas cortas en inglés: se devuelve el auxiliar que trajo la pregunta. Have → have. Did → did. Are → am.\"},{\"id\":\"ena2m10l1e8\",\"type\":\"transform\",\"prompt\":\"Conviértelo en pregunta de experiencia\",\"source\":\"You work in a restaurant.\",\"instruction\":\"Pregúntale si lo ha hecho alguna vez\",\"answers\":[\"Have you ever worked in a restaurant?\",\"Have you ever worked in a restaurant\"],\"translation\":\"¿Has trabajado alguna vez en un restaurante?\",\"hints\":[\"Auxiliar delante, ever en medio y el verbo en su tercera forma\",\"H… you ever work… in a restaurant?\"],\"itemIds\":[\"ena2m10haveyouever\"]},{\"id\":\"ena2m10l1e9\",\"type\":\"build\",\"prompt\":\"Construye la negativa — y fíjate en que no hay dos negaciones\",\"target\":\"I have never worked in a hospital\",\"translation\":\"No he trabajado nunca en un hospital\",\"distractors\":[\"ever\",\"has\"],\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10shesworkedin\"],\"tip\":\"never ya niega él solo. En español apilamos dos («no… nunca»); en inglés, una y basta.\"},{\"id\":\"ena2m10l1e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige el sitio de ever\",\"wrong\":\"I have ever been to Ireland.\",\"answers\":[\"I have been to Ireland.\",\"I've been to Ireland.\"],\"why\":\"ever no significa «alguna vez» en una afirmativa: solo vive en preguntas («Have you ever…?») y detrás de superlativos («the best I've ever had»). Si quieres decir que sí has estado, va a pelo: I've been to Ireland. Y si quieres decir que no, es never: I've never been to Ireland.\",\"translation\":\"He estado en Irlanda.\",\"itemIds\":[\"ena2m10ivenevertried\"]},{\"id\":\"ena2m10l1e11\",\"type\":\"listen\",\"prompt\":\"Dictado — escríbelo entero, sin contraer\",\"text\":\"She has never worked in a school.\",\"translation\":\"No ha trabajado nunca en un colegio.\",\"strictContractions\":true,\"hints\":[\"Empieza por She ha…\",\"She ha… never work… in a school.\"],\"itemIds\":[\"ena2m10shesworkedin\",\"enschool\"],\"tip\":\"Aquí se te pide la forma larga a propósito: si no distingues «She has» de «She's» al escribirlo, en el examen escrito la vas a perder.\"},{\"id\":\"ena2m10l1e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la pregunta y tu respuesta\",\"text\":\"Have you ever worked in a restaurant? No, I haven't. I've never tried it.\",\"phonetic\":\"jav yu É-va UÉEKT in a RES-tront? nóu ái JÁ-vent. áiv NÉ-va tráid it\",\"translation\":\"¿Has trabajado alguna vez en un restaurante? No. Nunca lo he probado.\",\"itemIds\":[\"ena2m10haveyouever\",\"ena2m10yesihave\",\"ena2m10ivenevertried\"],\"tip\":\"El have de la pregunta casi no suena («av-yu»); el haven't de la respuesta suena fuerte. Ese desnivel es el ritmo inglés, y lo trabajamos entero en la lección 5.\"},{\"id\":\"ena2m10l1e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ha trabajado en tres países, pero no ha probado nunca el sushi.\",\"answers\":[\"She's worked in three countries, but she's never tried sushi.\",\"She has worked in three countries, but she has never tried sushi.\",\"She's worked in three countries but she's never tried sushi.\",\"She has worked in three countries, but she's never tried sushi.\"],\"hints\":[\"has + tercera forma, dos veces; y never entre las dos piezas\",\"She h… worked in three countries, but she h… never tried sushi.\"],\"itemIds\":[\"ena2m10shesworkedin\",\"ena2m10ivenevertried\"],\"tip\":\"Dos perfectos en una frase y ni una fecha. Eso es exactamente lo que hace este tiempo verbal: cuenta lo que llevas hecho, no cuándo lo hiciste.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m10-1\",\"book\":\"Have you ever tried it?\",\"real\":\"Ever tried it?\",\"meaning\":\"¿Lo has probado alguna vez?\",\"when\":\"Entre amigos, hablando de comida, de una serie o de un sitio. Se cae el «Have you» entero y arranca por ever. En el examen escribe y di la pregunta completa: el recorte es de conversación, no de papel.\",\"register\":\"amigos\",\"note\":\"El inglés hablado se come el principio de las preguntas cuando el contexto ya lo dice: «Been there?», «Seen it?», «Got a minute?».\",\"sound\":\"É-va TRÁID it\",\"level\":\"a2\",\"itemId\":\"ena2m10haveyouever\"}}],\"resources\":[{\"label\":\"British Council — Present perfect\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/present-perfect\",\"note\":\"Lee solo el primer apartado, el de experiencias (5 min). No sigas al de for/since todavía: eso es la lección 7 y aquí solo estorbaría.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
