mwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6ab,"])</script><script>self.__next_f.push([1,"El texto de hoy viene de \u003cb\u003eCardiff\u003c/b\u003e, no de Londres, y eso es a propósito: el B1 lee inglés de todas partes. Verás \u003cb\u003etidy\u003c/b\u003e usado de una manera que no te esperas — en el sur de Gales \u003ci\u003etidy\u003c/i\u003e significa \u003cb\u003ebien, estupendo\u003c/b\u003e, y se dice cada dos frases: \u003ci\u003ethat's tidy, that is\u003c/i\u003e. Fuera de Gales, \u003ci\u003etidy\u003c/i\u003e es solo «ordenado».\u003cbr/\u003e\u003cbr/\u003eY antes de entrar, la clínica del módulo, que este texto usa en cada párrafo:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl español tiene UN verbo, «prestar», y el inglés tiene DOS.\u003c/b\u003e No se eligen por educación ni por registro: se eligen por \u003cb\u003equién se lleva la cosa\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003eborrow\u003c/b\u003e = quedarse con algo prestado. Se lleva \u003cb\u003efrom\u003c/b\u003e: \u003ci\u003eI borrowed a drill \u003cb\u003efrom\u003c/b\u003e the library.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003elend\u003c/b\u003e = dar algo prestado. Se lleva \u003cb\u003eto\u003c/b\u003e, o va sin preposición con la persona pegada: \u003ci\u003eShe lent it \u003cb\u003eto\u003c/b\u003e her neighbour\u003c/i\u003e / \u003ci\u003eCould you \u003cb\u003elend me\u003c/b\u003e twenty pounds?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl calco es siempre el mismo y suena fatal: ❌ \u003ci\u003eCould you \u003cb\u003eborrow\u003c/b\u003e me twenty pounds?\u003c/i\u003e Estás pidiéndole al otro que se lleve TU dinero.\u003cbr/\u003eRegla de bolsillo: si la cosa \u003cb\u003eviene hacia ti\u003c/b\u003e, borrow. Si \u003cb\u003esale de ti\u003c/b\u003e, lend.\u003cbr/\u003e\u003cbr/\u003eY el tercero del grupo: \u003cb\u003eowe\u003c/b\u003e = deber dinero. La persona va pegada, sin «to»: \u003ci\u003eI owe Amy fifty pounds\u003c/i\u003e, nunca «I owe to Amy».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se lee el texto:\u003c/b\u003e título primero, no pararse en cada palabra, glosas tocables para lo que bloquee. De las cinco preguntas, \u003cb\u003etres son de inferencia\u003c/b\u003e —la respuesta no está escrita con esas palabras— y \u003cb\u003edos son de respuesta escrita con un máximo de tres palabras\u003c/b\u003e, que es el formato del Reading Part 4 del examen. Copiar de más también resta."])</script><script>self.__next_f.push([1,"18:Ta6c,"])</script><script>self.__next_f.push([1,"There is a shop on Clifton Street in Cardiff with a window full of things that nobody can buy. A wallpaper steamer. Three sewing machines. A carpet cleaner, two gazebos and, at the back, a [[cement mixer|hormigonera]] that has been out eleven times since January.\u003cbr/\u003e\u003cbr/\u003eIt is called the Library of Things, and it works exactly like the other kind of library. You pay a [[membership fee|cuota de socio]] of twelve pounds a year, you borrow what you need, and you bring it back within a week. If you keep it longer there is a small fine, which is the only money anyone here ever argues about.\u003cbr/\u003e\u003cbr/\u003e\"People come in expecting a catch,\" says Ffion Davies, who has run the place since it opened. \"There isn't one. The first question is always what it costs, and when I say twelve pounds a year they look at the drill, and then at me, and they say: that's [[tidy|estupendo, muy bien — así se usa en el sur de Gales]], that is.\"\u003cbr/\u003e\u003cbr/\u003eThe idea came from a conversation in a queue. \"A neighbour of mine had bought a wallpaper steamer for sixty pounds, used it for one afternoon in 2019, and it had been in her shed ever since. I said, if I had known, I would have borrowed it. And she said, well, why didn't you ask? And I thought: because there is no way of asking. That is the whole problem.\"\u003cbr/\u003e\u003cbr/\u003eTwo years on, the shop has four hundred members and a waiting list for the pressure washer. Ffion keeps the borrowing figures on a whiteboard because they surprise people. The drill goes out twice a week. The sewing machines go out almost every day. The [[fondue set|el aparato de fondue]], donated by a man who admitted he had used it once, has gone out three times in two years and is now a running joke.\u003cbr/\u003e\u003cbr/\u003eNot everything has worked. An early rule allowed members to borrow two items at once; that had to change after somebody took a ladder and a carpet cleaner to a house move and returned neither of them for a month. And the shop does not lend anything that cannot be cleaned properly, which is why there are no camping stoves.\u003cbr/\u003e\u003cbr/\u003e\"The thing I did not expect,\" Ffion says, \"is how much of this is not about money. Plenty of our members could afford a drill. What they haven't got is anywhere to keep one. If you live in a flat with no shed, owning things is a problem, not a luxury.\"\u003cbr/\u003e\u003cbr/\u003eDoes she worry about people breaking the [[stock|las existencias, lo que hay en la tienda]]? \"Things break. That is what the fee is for. In two years we have had one item come back in pieces, and the lad who did it told me before I noticed. Honestly, if I had to guess, I would say people look after our drill better than they look after their own.\""])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l6\",\"phaseId\":\"enb1m5\",\"title\":\"The shop where nothing is for sale\",\"subtitle\":\"Tu texto largo del módulo — y un inglés que no es el de Londres: el de Cardiff\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del texto\",\"itemIds\":[\"enb1m5borrowfrom\",\"enb1m5couldyoulendme\",\"enb1m5lentitto\",\"enb1m5owemoney\",\"enb1m5membershipfee\",\"enb1m5worthit\",\"enb1m5runoutof\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: «prestar» son DOS verbos, y el texto es galés\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje y responde. Toca las palabras subrayadas si te bloquean.\",\"title\":\"The shop where nothing is for sale\",\"source\":\"From a community magazine in Cardiff (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m5l6e1q1\",\"q\":\"How much does a year's membership cost? (Máximo 3 palabras)\",\"accepted\":[\"twelve pounds\",\"£12\",\"12 pounds\",\"twelve\",\"twelve pounds a year\"],\"why\":\"«You pay a membership fee of twelve pounds a year». En el Reading Part 4 basta con el dato: «twelve pounds» vale, y no hace falta copiar la frase entera.\"},{\"id\":\"enb1m5l6e1q2\",\"q\":\"Why does the article mention the fondue set?\",\"options\":[\"Because it shows that some things are hardly borrowed at all.\",\"Because it was the most expensive item anyone donated.\",\"Because it is the item members ask for most often.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice con esas palabras. Hay que juntar dos datos: el taladro sale dos veces por semana y las máquinas de coser casi a diario, mientras que el aparato de fondue ha salido tres veces en dos años. Por eso es el chiste de la casa.\"},{\"id\":\"enb1m5l6e1q3\",\"q\":\"What does \\\"tidy\\\" mean in south Wales? (Máximo 3 palabras)\",\"accepted\":[\"good\",\"great\",\"very good\",\"nice\",\"excellent\"],\"why\":\"La glosa lo dice y el contexto lo confirma: la gente mira el taladro, luego a Ffion, y dice «that's tidy, that is». Fuera de Gales, «tidy» solo significa «ordenado».\"},{\"id\":\"enb1m5l6e1q4\",\"q\":\"What did the conversation in the queue make Ffion realise?\",\"options\":[\"That people were willing to share things but had no way of arranging it.\",\"That her neighbour had wasted sixty pounds on purpose.\",\"That wallpaper steamers were far too expensive to buy.\"],\"answer\":0,\"inference\":true,\"why\":\"Está en la última línea de la cita, y hay que leerla contra la anterior: la vecina le habría prestado el aparato («why didn't you ask?»), pero no existía ninguna manera de pedirlo («there is no way of asking»). Eso es lo que ella llama «the whole problem».\"},{\"id\":\"enb1m5l6e1q5\",\"q\":\"What point is Ffion making about members who live in flats?\",\"options\":[\"That for some of them the problem is where to keep things, not the price.\",\"That people who live in flats do fewer repairs than other members.\",\"That members who live in flats break the equipment more often.\"],\"answer\":0,\"inference\":true,\"why\":\"«Plenty of our members could afford a drill. What they haven't got is anywhere to keep one.» Ella nunca dice la palabra «espacio»: lo deduces tú de esas dos frases seguidas.\"}],\"itemIds\":[\"enb1m5borrowfrom\",\"enb1m5lentitto\",\"enb1m5membershipfee\",\"enb1m5worthit\",\"enb1m1afford\"],\"tip\":\"¿Fallaste alguna de inferencia? Vuelve al párrafo y busca las DOS frases que, juntas, la sostienen. Y en las de respuesta escrita: tres palabras como máximo, sin frase entera.\"},{\"id\":\"enb1m5l6e2\",\"type\":\"mc\",\"prompt\":\"Inglés de Cardiff: la palabra del texto con otro sentido\",\"question\":\"En el sur de Gales, «that's tidy» significa…\",\"options\":[\"eso está muy bien\",\"eso está muy ordenado\",\"eso está muy caro\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el sentido que tiene «tidy» en el resto del mundo anglófono, y es justo lo que despista.\",\"«tidy» no tiene nada que ver con el precio.\"],\"itemIds\":[\"enb1m5membershipfee\"],\"tip\":\"Un galés te dirá «tidy» de una comida, de un trabajo bien hecho o de un precio justo. Es un recordatorio útil de que «inglés» no es una sola cosa — y de que los audios del examen usan voces de fuera de Londres.\"},{\"id\":\"enb1m5l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra de la cuota\",\"text\":\"You pay a ___ fee of twelve pounds a year and you can borrow anything in the shop.\",\"answers\":[\"membership\"],\"translation\":\"Pagas una cuota de socio de doce libras al año y puedes coger prestado lo que quieras de la tienda.\",\"hints\":[\"De «member» (socio, miembro)\",\"member...\"],\"itemIds\":[\"enb1m5membershipfee\"],\"tip\":\"«fee» es la cuota o la tarifa de un servicio: membership fee, entry fee, late fee. No es «bill» (la factura) ni «fare» (el billete del transporte).\"},{\"id\":\"enb1m5l6e4\",\"type\":\"mc\",\"prompt\":\"Los dos verbos que el español junta en uno\",\"question\":\"«¿Me prestas veinte libras?» →\",\"options\":[\"Could you borrow me twenty pounds?\",\"Could you lend me twenty pounds?\",\"Could you lend from me twenty pounds?\"],\"answer\":1,\"whyWrong\":[\"Le estás pidiendo que se lleve tu dinero: «borrow» es quedarse con algo prestado.\",null,\"«lend» no lleva «from»: eso es de «borrow».\"],\"itemIds\":[\"enb1m5couldyoulendme\",\"enb1m5borrowfrom\"],\"tip\":\"Si la cosa VIENE hacia ti, borrow (from). Si SALE de ti, lend (to). Y con la persona pegada, lend no lleva preposición: «lend me», «lend her».\"},{\"id\":\"enb1m5l6e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Could you borrow me twenty pounds?\",\"answers\":[\"Could you lend me twenty pounds?\"],\"why\":\"«borrow» es quedarse con algo prestado; el que da es «lend». Como en español los dos son «prestar», el verbo sale al revés y la frase significa lo contrario de lo que quieres.\",\"translation\":\"¿Me prestas veinte libras?\",\"itemIds\":[\"enb1m5couldyoulendme\"]},{\"id\":\"enb1m5l6e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It doesn't worth it.\",\"answers\":[\"It isn't worth it.\"],\"why\":\"«worth» no es un verbo: es un adjetivo, y por eso lleva «be» delante. «It doesn't worth it» sale de traducir «no vale la pena» con «valer» como verbo.\",\"translation\":\"No merece la pena.\",\"itemIds\":[\"enb1m5worthit\"]},{\"id\":\"enb1m5l6e7\",\"type\":\"gapbank\",\"prompt\":\"Resume el texto completando los huecos\",\"text\":\"The Library of Things in Cardiff lends tools instead of selling them. Members pay a ___ fee of twelve pounds a year and ___ what they need for a week. Ffion says the surprise is that plenty of members could ___ a drill: what they haven't got is anywhere to keep it. She doesn't ___ about breakages, because that is what the fee is for.\",\"answers\":[\"membership\",\"borrow\",\"afford\",\"worry\"],\"bank\":[\"membership\",\"borrow\",\"afford\",\"worry\",\"member\",\"lend\",\"pay\",\"complain\"],\"translation\":\"La Biblioteca de las Cosas de Cardiff presta herramientas en vez de venderlas. Los socios pagan una cuota de doce libras al año y cogen prestado lo que necesitan durante una semana. Ffion dice que lo que sorprende es que muchos socios podrían permitirse un taladro: lo que no tienen es dónde guardarlo. No le preocupan las roturas, porque para eso está la cuota.\",\"itemIds\":[\"enb1m5membershipfee\",\"enb1m5borrowfrom\",\"enb1m1afford\",\"enb1m1worryabout\"],\"tip\":\"El segundo hueco es la decisión del módulo: los socios se llevan las cosas, así que «borrow». «Lend» lo hace la tienda. El banco trae los dos a propósito.\"},{\"id\":\"enb1m5l6e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «worth»\",\"source\":\"It isn't worth it.\",\"forbid\":[\"worth\"],\"answers\":[\"It's a waste of money\",\"It's not a good idea\",\"I wouldn't bother\"],\"translation\":\"No merece la pena.\",\"hints\":[\"Hay una expresión con «waste» que dice justo eso\",\"It's a ... of money\"],\"itemIds\":[\"enb1m5worthit\",\"enb1m5wasteofmoney\"],\"tip\":\"«I wouldn't bother» es la que dice un británico de verdad: «yo no me molestaría». Suena a consejo y no a sentencia, que es justo el tono del módulo.\"},{\"id\":\"enb1m5l6e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa? Cuidado con el phrasal\",\"source\":\"I've run out of money three days before payday.\",\"answers\":[\"Me he quedado sin dinero tres días antes de cobrar\",\"Me he quedado sin blanca tres días antes de cobrar\",\"Se me ha acabado el dinero tres días antes de cobrar\"],\"itemIds\":[\"enb1m5runoutof\",\"enb1m5natskint\"],\"tip\":\"«run out of» = quedarse sin algo, y siempre con «of»: run out of money, of milk, of time. Y «payday» es el día de cobro: en el Reino Unido suele ser el último viernes del mes.\"},{\"id\":\"enb1m5l6e10\",\"type\":\"build\",\"prompt\":\"Construye la frase del que presta\",\"target\":\"She lent it to her neighbour\",\"translation\":\"Se lo prestó a su vecina\",\"distractors\":[\"borrowed\",\"from\"],\"itemIds\":[\"enb1m5lentitto\"],\"tip\":\"Las dos fichas que sobran forman la frase del revés: «She borrowed it from her neighbour», que también existe y significa lo contrario. Ahí está toda la lección.\"},{\"id\":\"enb1m5l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Le debo cincuenta libras a Amy y se las devuelvo el viernes.\",\"answers\":[\"I owe Amy fifty pounds and I'll pay her back on Friday\",\"I owe Amy fifty pounds and I will pay her back on Friday\",\"I owe Amy fifty pounds and I'm paying her back on Friday\"],\"hints\":[\"«Deber dinero a alguien» va sin preposición\",\"I owe Amy fifty pounds and I'll pay her ... on Friday\"],\"itemIds\":[\"enb1m5owemoney\",\"enb1m5illpayyouback\"],\"tip\":\"«I owe Amy fifty pounds», con la persona pegada al verbo. «I owe to Amy» es calco de «le debo a Amy» y no existe.\"},{\"id\":\"enb1m5l6e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — los tres verbos del dinero seguidos\",\"text\":\"I borrowed it from Amy, she lent it to me for a week, and I still owe her twenty pounds.\",\"phonetic\":\"ai BÓ-roud it from ÉI-mi, shi lent it tu mi fo a uiik, and ai stil óu jee TUÉN-ti páunds̬\",\"translation\":\"Se lo cogí prestado a Amy, me lo prestó una semana y todavía le debo veinte libras.\",\"itemIds\":[\"enb1m5borrowfrom\",\"enb1m5lentitto\",\"enb1m5owemoney\"],\"tip\":\"La misma escena contada desde los dos lados y con el saldo al final. Si te sale sin pensarla, esta trampa ya no te la cobran.\"},{\"id\":\"enb1m5l6e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: la responsable de la Library of Things. Aquí lo oyes una sola vez, a propósito: en el examen se oye dos, así que si aguantas con una, el día del examen vas sobrado. Toma notas.\",\"notepad\":true,\"audio\":\"The question we get most is whether it's worth twelve pounds if you only come twice a year.|And is it?|Depends what you borrow, doesn't it. Two visits and one of them's the pressure washer, you've saved yourself the best part of a hundred quid. Two visits for a screwdriver and no, honestly, it isn't. I'd rather tell people that than have them join and feel daft.|Do many people not renew?|About one in five. Which sounds bad until you hear why. Half of them say the same thing: they borrowed the drill, they did the job, and now the job's done. That's not a complaint. That's the system working.\",\"question\":\"¿Qué dice sobre los socios que no renuevan?\",\"options\":[\"Que la mayoría se va porque ya ha terminado lo que quería hacer\",\"Que se van porque la cuota les parece cara\",\"Que se van porque nunca encuentran lo que buscan\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Del precio habla al principio, y para decir que depende de lo que cojas prestado.\",\"De la disponibilidad no dice nada en todo el audio.\"],\"itemIds\":[\"enb1m5worthit\",\"enb1m5membershipfee\",\"enb1m5borrowfrom\"],\"tip\":\"«a hundred quid» son cien libras: «quid» es la palabra de la calle, invariable (nunca «quids»). Y «daft» es «tonto» en boca británica. Dos palabras que no salen en el libro y salen en la vida.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m5-3\",\"book\":\"It's very cheap.\",\"real\":\"It's a bargain.\",\"meaning\":\"Es una ganga\",\"when\":\"Al enseñarle a alguien lo que has comprado, en el mercadillo, en las rebajas. Se dice con orgullo: quien lo dice está presumiendo un poco. También existe «It's a steal», más enfática y más informal. En una carta de reclamación o en un informe no cabe: allí un precio se comenta con «good value for money».\",\"register\":\"neutral\",\"exam\":\"It's very good value for money.\",\"note\":\"Ojo con «cheap» a secas: en inglés arrastra la idea de «malo, de mala calidad» («cheap shoes»). Por eso el nativo dice «a bargain» —barato PARA lo que es— y en el examen se escribe «good value for money», que dice exactamente eso sin sonar a mercadillo.\",\"sound\":\"its a BAA-guin\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m5natbargain\"}}],\"resources\":[{\"label\":\"Library of Things — cómo funciona\",\"url\":\"https://www.libraryofthings.co.uk/\",\"note\":\"La red británica de bibliotecas de objetos. Lee «How it works» y busca membership, borrow, late fee y deposit: es el texto auténtico de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
