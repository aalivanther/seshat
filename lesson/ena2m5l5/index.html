/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T44e,Si \u003ci\u003ebread\u003c/i\u003e no tiene plural, ¿cómo pides dos? Cuentas el \u003cb\u003eenvase o la porción\u003c/b\u003e, y el sustantivo se queda quieto detrás de \u003ci\u003eof\u003c/i\u003e:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ea bottle of\u003c/b\u003e water, wine, milk — una botella\u003cbr/\u003e· \u003cb\u003ea glass of\u003c/b\u003e water, wine — un vaso, una copa\u003cbr/\u003e· \u003cb\u003ea cup of\u003c/b\u003e tea, coffee — una taza (ya la traías del A1)\u003cbr/\u003e· \u003cb\u003ea slice of\u003c/b\u003e cake, bread, cheese — una rodaja, un trozo de lo que se corta\u003cbr/\u003e· \u003cb\u003ea piece of\u003c/b\u003e cake, cheese — un trozo, en general\u003cbr/\u003e· \u003cb\u003ea bit of\u003c/b\u003e sugar, milk — un poquito\u003cbr/\u003e· \u003cb\u003ea loaf of\u003c/b\u003e bread — una barra, un pan entero\u003cbr/\u003e\u003cbr/\u003eY ahora \u003cb\u003ela joya\u003c/b\u003e, que es lo que rescata a las diez de la lección 2: \u003ci\u003epiece\u003c/i\u003e y \u003ci\u003ebit\u003c/i\u003e valen también para lo abstracto. [[a piece of advice|un consejo]] · \u003ci\u003etwo pieces of luggage\u003c/i\u003e · \u003ci\u003ea piece of furniture\u003c/i\u003e · \u003ci\u003ea bit of homework\u003c/i\u003e. Ahí tienes cómo decir «dos consejos» sin escribir jamás \u003ci\u003eadvices\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY el plural va en el \u003cb\u003eenvase\u003c/b\u003e, nunca en lo de dentro: \u003ci\u003etwo bottles of water\u003c/i\u003e, \u003ci\u003ethree slices of cake\u003c/i\u003e, \u003ci\u003etwo pieces of advice\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l5\",\"phaseId\":\"ena2m5\",\"title\":\"Clínica de sonido: a bottle of water\",\"subtitle\":\"Las palabras se enlazan — y así es como se cuenta lo que no se cuenta\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Envases y porciones\",\"itemIds\":[\"ena2m5abottleofwater\",\"ena2m5aglassofwine\",\"ena2m5asliceofcake\",\"ena2m5apieceofadvice\",\"ena2m5abitofsugar\",\"ena2m5aloafofbread\",\"encupoftea\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El envase cuenta lo que la palabra no puede contar\",\"body\":\"$17\",\"table\":[[\"lo que no se cuenta\",\"cómo se cuenta\"],[\"bread\",\"a loaf of bread · two slices of bread\"],[\"water\",\"a bottle of water · a glass of water\"],[\"cake\",\"a slice of cake · two slices of cake\"],[\"advice\",\"a piece of advice · two pieces of advice\"],[\"luggage\",\"two pieces of luggage\"],[\"sugar\",\"a bit of sugar\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Clínica: la última consonante se pega a la vocal siguiente\",\"body\":\"Todas las frases de arriba tienen la misma juntura: una palabra que acaba en consonante y un \u003ci\u003eof\u003c/i\u003e que empieza por vocal. Y el inglés hablado \u003cb\u003eno las separa\u003c/b\u003e: las pega.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ea lot of\u003c/b\u003e → «a-LÓ-tov» · \u003cb\u003ea bit of\u003c/b\u003e → «a-BÍ-tov» · \u003cb\u003ea glass of wine\u003c/b\u003e → «a-GLAA-sov-uáin» · \u003cb\u003ea slice of cake\u003c/b\u003e → «a-SLÁI-sov-kéik» · \u003cb\u003epick it up\u003c/b\u003e → «pi-ki-TAP»\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY esto es de las cosas que te salen gratis\u003c/b\u003e, porque el español ya lo hace: tú no dices «los / amigos», dices «lo-sa-mi-gos»; ni «el / agua», sino «e-la-gua». Es exactamente el mismo mecanismo. Lo único que hay que quitar es la costumbre de leer palabra por palabra, que es lo que hace la escuela.\u003cbr/\u003e\u003cbr/\u003ePor qué importa: \u003cb\u003een el Listening no vas a oír palabras, vas a oír bloques.\u003c/b\u003e Quien busca «a», «lot», «of» por separado no encuentra ninguna de las tres. Quien sabe que existe «a-LÓ-tov» lo caza a la primera.\",\"table\":[[\"se escribe\",\"suena\",\"lo mismo en español\"],[\"a lot of\",\"a-LÓ-tov\",\"los amigos → lo-sa-mi-gos\"],[\"a bit of\",\"a-BÍ-tov\",\"el agua → e-la-gua\"],[\"a glass of wine\",\"a-GLAA-sov-uáin\",\"más o menos → má-so-me-nos\"],[\"pick it up\",\"pi-ki-TAP\",\"un abrazo → u-na-bra-zo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l5e1\",\"type\":\"match\",\"prompt\":\"Empareja cada porción con lo suyo\",\"pairs\":[{\"target\":\"a bottle of…\",\"source\":\"…water — una botella\"},{\"target\":\"a slice of…\",\"source\":\"…cake — una porción de lo que se corta\"},{\"target\":\"a loaf of…\",\"source\":\"…bread — una barra entera\"},{\"target\":\"a piece of…\",\"source\":\"…advice — un consejo\"}],\"itemIds\":[\"ena2m5abottleofwater\",\"ena2m5asliceofcake\",\"ena2m5aloafofbread\",\"ena2m5apieceofadvice\"]},{\"id\":\"ena2m5l5e2\",\"type\":\"speak\",\"prompt\":\"Clínica 1 — pega la consonante a la vocal\",\"text\":\"A bottle of water and a glass of wine.\",\"phonetic\":\"a BO-tol-ov UÓ-ta and a GLAA-sov UÁIN\",\"translation\":\"Una botella de agua y una copa de vino.\",\"itemIds\":[\"ena2m5abottleofwater\",\"ena2m5aglassofwine\"],\"tip\":\"No pares entre «bottle» y «of»: la l se pega a la o. Si te sale «bótol-ov», lo has hecho bien; si te sale «bo-tol · of», estás leyendo, no hablando.\"},{\"id\":\"ena2m5l5e3\",\"type\":\"shadow\",\"prompt\":\"Sombrea el bloque entero — primero lento, luego a velocidad normal\",\"text\":\"A bit of sugar and a slice of cake, please.\",\"phonetic\":\"a BÍ-tov SHU-ga and a SLÁI-sov kéik, plíis̬\",\"translation\":\"Un poquito de azúcar y un trozo de tarta, por favor.\",\"reps\":2,\"itemIds\":[\"ena2m5abitofsugar\",\"ena2m5asliceofcake\"],\"tip\":\"Persigue el audio sin adelantarte. Lo que estás copiando no son las palabras: son las junturas.\"},{\"id\":\"ena2m5l5e4\",\"type\":\"listen\",\"prompt\":\"Dictado — separa lo que suena pegado\",\"text\":\"Can I have a slice of cake?\",\"translation\":\"¿Me pones un trozo de tarta?\",\"hints\":[\"«slice of» suena «SLÁI-sov», pero son dos palabras\",\"Can I have a sl… of cake?\"],\"itemIds\":[\"ena2m5asliceofcake\",\"encake\",\"encanihaveacoffee\"],\"tip\":\"Este es el ejercicio de la clínica: oír un bloque y escribirlo separado. En el examen te van a pedir exactamente esto.\"},{\"id\":\"ena2m5l5e5\",\"type\":\"mc\",\"prompt\":\"Cómo se cuenta lo que no se cuenta\",\"question\":\"«Me dio dos consejos»\",\"options\":[\"She gave me two pieces of advice.\",\"She gave me two advices.\",\"She gave me two advice.\"],\"answer\":0,\"whyWrong\":[null,\"advice no tiene plural: el plural va en el envase, pieces\",\"sin envase no hay manera de contarlo\"],\"itemIds\":[\"ena2m5apieceofadvice\",\"ena2m5somegoodadvice\"],\"tip\":\"Fíjate en dónde cae la -s: en pieces, no en advice. Esa es la regla entera de los envases.\"},{\"id\":\"ena2m5l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa con el envase\",\"text\":\"I bought a ___ of bread at the shop.\",\"answers\":[\"loaf\"],\"translation\":\"Compré una barra de pan en la tienda.\",\"hints\":[\"Un pan entero, no una rodaja\",\"l…\"],\"itemIds\":[\"ena2m5aloafofbread\",\"enbread\",\"enshop\"]},{\"id\":\"ena2m5l5e7\",\"type\":\"bucket\",\"prompt\":\"¿El plural va en el envase o en lo de dentro?\",\"categories\":[\"two bottles of water\",\"two waters\"],\"items\":[{\"text\":\"two slices of cake\",\"bucket\":0},{\"text\":\"two cakes\",\"bucket\":1},{\"text\":\"two pieces of advice\",\"bucket\":0},{\"text\":\"two coffees (en la barra)\",\"bucket\":1},{\"text\":\"two loaves of bread\",\"bucket\":0},{\"text\":\"two sandwiches\",\"bucket\":1}],\"itemIds\":[\"ena2m5asliceofcake\",\"ena2m5apieceofadvice\",\"ena2m5aloafofbread\",\"ena2m5twocoffeesplease\"],\"tip\":\"A la derecha van las que se cuentan solas. A la izquierda, las que necesitan envase. Y «two coffees» está a la derecha porque ahí ya son tazas.\"},{\"id\":\"ena2m5l5e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el plural\",\"wrong\":\"Can I have two breads, please?\",\"answers\":[\"Can I have two loaves of bread, please?\"],\"why\":\"bread no se pluraliza: lo que se cuenta es la barra. Two loaves of bread si quieres dos barras, two slices of bread si quieres dos rebanadas. La -s va siempre en el envase.\",\"translation\":\"¿Me pone dos barras de pan, por favor?\",\"itemIds\":[\"ena2m5aloafofbread\",\"enbread\"]},{\"id\":\"ena2m5l5e9\",\"type\":\"build\",\"prompt\":\"Construye el pedido de la mesa\",\"target\":\"A bottle of water and two glasses of wine\",\"translation\":\"Una botella de agua y dos copas de vino\",\"distractors\":[\"waters\",\"wines\"],\"itemIds\":[\"ena2m5abottleofwater\",\"ena2m5aglassofwine\"],\"tip\":\"Las dos fichas que sobran son el error entero: en inglés se pluralizan las copas, no el vino.\"},{\"id\":\"ena2m5l5e10\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Lo que le pasa a «a lot of» a velocidad normal\",\"book\":\"There's a lot of sugar in it.\",\"real\":\"There's alotta sugar in it.\",\"translation\":\"Lleva mucho azúcar.\",\"itemIds\":[\"ena2m5alotof\",\"ensugar\"],\"tip\":\"Se escribe «a lot of» y se dice «alota». No lo copies al escribir: solo tienes que reconocerlo cuando pase a toda velocidad.\"},{\"id\":\"ena2m5l5e11\",\"type\":\"speak\",\"prompt\":\"Clínica 2 — la juntura fuera de la mesa\",\"text\":\"Pick it up and put it on the table.\",\"phonetic\":\"pi-ki-TAP and pu-ti-ton de TÉI-bol\",\"translation\":\"Cógelo y ponlo en la mesa.\",\"itemIds\":[\"entable\"],\"tip\":\"Seis palabras y ni una pausa: dos bloques. Esto es lo que oyes cuando un británico habla y te parece que va rapidísimo — no va rápido, va pegado.\"},{\"id\":\"ena2m5l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Me pone una botella de agua y un trozo de tarta, por favor?\",\"answers\":[\"Can I have a bottle of water and a slice of c
