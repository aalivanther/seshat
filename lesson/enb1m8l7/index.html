mplemente \u003ci\u003ealthough\u003c/i\u003e con el volumen más alto. Y el calco a matar: \u003cmark class=\"akk\"\u003eAlthough…, but…\u003c/mark\u003e. En inglés va uno de los dos, nunca los dos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Los que llevan SUSTANTIVO o -ING detrás:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003edespite\u003c/i\u003e · \u003ci\u003ein spite of\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eDespite\u003c/b\u003e the rain…\u003c/i\u003e · \u003ci\u003e\u003cb\u003eDespite living\u003c/b\u003e in a city…\u003c/i\u003e · \u003ci\u003e\u003cb\u003eDespite the fact that\u003c/b\u003e we live in a city…\u003c/i\u003e\u003cbr/\u003eNunca \u003cmark class=\"akk\"\u003edespite we live\u003c/mark\u003e. Si quieres frase entera detrás, o cambias a \u003ci\u003ealthough\u003c/i\u003e, o metes \u003ci\u003ethe fact that\u003c/i\u003e. Y ojo: \u003ci\u003edespite\u003c/i\u003e va sin \u003ci\u003eof\u003c/i\u003e; \u003ci\u003ein spite of\u003c/i\u003e, con él.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. Los que van SOLOS, entre punto y punto:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003ehowever\u003c/i\u003e · \u003ci\u003eon the other hand\u003c/i\u003e · \u003ci\u003ethen again\u003c/i\u003e\u003cbr/\u003e\u003ci\u003eThe bins are new. \u003cb\u003eHowever\u003c/b\u003e, nobody uses them.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003eHowever no es «aunque»\u003c/b\u003e: no puede unir dos frases en una. Va detrás de un punto (o de un punto y coma) y con coma después. El calco es usarlo como \u003ci\u003ealthough\u003c/i\u003e: \u003cmark class=\"akk\"\u003eHowever the bins are new, nobody uses them\u003c/mark\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e4. Y lo que solo hay que RECONOCER, no producir.\u003c/b\u003e Estos son de nivel B2 y van a salirte en los textos del examen, así que hay que entenderlos — pero no hacen falta para escribir un B1 sobresaliente: \u003cb\u003ewhereas\u003c/b\u003e (= \u003ci\u003ewhile\u003c/i\u003e, para contrastar dos cosas: \u003ci\u003eCardiff recycles a lot, \u003cb\u003ewhereas\u003c/b\u003e London recycles less\u003c/i\u003e), \u003cb\u003enevertheless\u003c/b\u003e, \u003cb\u003emoreover\u003c/b\u003e, \u003cb\u003efurthermore\u003c/b\u003e, \u003cb\u003eas a result\u003c/b\u003e. \u003cb\u003e[[Whereas|conector B2: contrasta dos cosas paralelas — «mientras que»]]\u003c/b\u003e es el que más aparece en lectura.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una cosa más, pequeña y muy útil:\u003c/b\u003e \u003ci\u003e\u003cb\u003einstead of\u003c/b\u003e + -ing\u003c/i\u003e = «en vez de + infinitivo». \u003ci\u003eI walk \u003cb\u003einstead of taking\u003c/b\u003e the bus.\u003c/i\u003e Detrás de \u003ci\u003eof\u003c/i\u003e siempre va -ing, nunca infinitivo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l7\",\"phaseId\":\"enb1m8\",\"title\":\"Even though, however, despite\",\"subtitle\":\"Los conectores que convierten frases sueltas en un argumento — y la carta al ayuntamiento\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo nuevo del bloque de contraste\",\"itemIds\":[\"enb1m8however\",\"enb1m8eventhough\",\"enb1m8despiteliving\",\"enb1m8insteadof\",\"enb1m8concernedabout\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El mapa completo del contraste — y qué es tuyo y qué solo hay que reconocer\",\"body\":\"$17\",\"table\":[[\"Conector\",\"Qué lleva detrás\",\"Nivel\"],[\"although / though / even though\",\"frase (sujeto + verbo)\",\"B1 — para producir\"],[\"while\",\"frase (sujeto + verbo)\",\"B1 — para producir\"],[\"despite / in spite of\",\"sustantivo o -ing\",\"B1 — para producir\"],[\"however\",\"punto delante, coma detrás\",\"A2 — gratis, ya está por debajo\"],[\"whereas / nevertheless / moreover\",\"—\",\"B2 — solo reconocer\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l7e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — los conectores que ya son tuyos de los módulos 1 y 2\",\"pairs\":[{\"target\":\"Although the flat is small, it's very bright.\",\"source\":\"Aunque el piso es pequeño, es muy luminoso.\"},{\"target\":\"Despite the high rent, I took the flat.\",\"source\":\"A pesar del alquiler alto, cogí el piso.\"},{\"target\":\"While the pay is good, the hours are terrible.\",\"source\":\"Si bien el sueldo es bueno, el horario es terrible.\"},{\"target\":\"Since I speak Spanish, they took me on.\",\"source\":\"Como hablo español, me contrataron.\"},{\"target\":\"I left due to the hours.\",\"source\":\"Me fui por el horario.\"}],\"targetSeconds\":28,\"itemIds\":[\"enb1m1although\",\"enb1m1despite\",\"enb1m2while\",\"enb1m2sincecausal\",\"enb1m2dueto\"],\"tip\":\"Cinco conectores que ya viajaron contigo dos módulos. Hoy no se aprenden: se colocan bien. Y colocarlos bien es lo que puntúa en Organisation.\"},{\"id\":\"enb1m8l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Qué le va detrás a cada conector?\",\"categories\":[\"FRASE detrás (sujeto + verbo)\",\"SUSTANTIVO o -ING detrás\"],\"items\":[{\"text\":\"although\",\"bucket\":0},{\"text\":\"despite\",\"bucket\":1},{\"text\":\"even though\",\"bucket\":0},{\"text\":\"in spite of\",\"bucket\":1},{\"text\":\"while\",\"bucket\":0},{\"text\":\"instead of\",\"bucket\":1}],\"itemIds\":[\"enb1m8eventhough\",\"enb1m8despiteliving\",\"enb1m8insteadof\",\"enb1m1although\"],\"tip\":\"Esta clasificación es el 80 % de los fallos de conectores del nivel. No es cuestión de significado —«although» y «despite» dicen lo mismo—, es cuestión de qué pieza cabe detrás.\"},{\"id\":\"enb1m8l7e3\",\"type\":\"mc\",\"prompt\":\"El calco del «aunque… pero»\",\"question\":\"«Aunque cuesta más, compro el de aquí» →\",\"options\":[\"Even though it costs more, but I buy the local one.\",\"Even though it costs more, I buy the local one.\",\"Even though it costs more, however I buy the local one.\"],\"answer\":1,\"whyWrong\":[\"El «but» sobra: «even though» ya hace el contraste él solo. En español decimos «aunque… , pero…» y en inglés no.\",null,\"«however» tampoco cabe aquí: es de los que van detrás de un punto, no dentro de la misma frase.\"],\"itemIds\":[\"enb1m8eventhough\"],\"tip\":\"Regla de una línea: un contraste, un conector. Si ya has puesto «although» o «even though», la segunda mitad va limpia.\"},{\"id\":\"enb1m8l7e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Even though it costs more, but I buy the local one.\",\"answers\":[\"Even though it costs more, I buy the local one.\"],\"why\":\"«even though» ya marca el contraste: el «but» lo repite. En inglés se usa uno de los dos, jamás los dos en la misma frase.\",\"translation\":\"Aunque cuesta más, compro el de aquí.\",\"itemIds\":[\"enb1m8eventhough\"]},{\"id\":\"enb1m8l7e5\",\"type\":\"errorfix\",\"prompt\":\"Lo que «despite» no admite detrás\",\"wrong\":\"Despite we live in a city, we grow our own vegetables.\",\"answers\":[\"Despite living in a city, we grow our own vegetables.\",\"Although we live in a city, we grow our own vegetables.\"],\"why\":\"«despite» pide sustantivo o -ing, nunca sujeto + verbo. Dos salidas: «despite living» o cambiar el conector a «although we live».\",\"translation\":\"A pesar de vivir en la ciudad, cultivamos nuestras propias verduras.\",\"itemIds\":[\"enb1m8despiteliving\",\"encity\"]},{\"id\":\"enb1m8l7e6\",\"type\":\"errorfix\",\"prompt\":\"«However» donde no cabe\",\"wrong\":\"However the bins are new, nobody uses them.\",\"answers\":[\"Although the bins are new, nobody uses them.\"],\"why\":\"«however» no une dos frases en una: va detrás de un punto y con coma («The bins are new. However, nobody uses them»). Para unirlas dentro de la misma frase hace falta «although».\",\"translation\":\"Aunque los cubos son nuevos, no los usa nadie.\",\"itemIds\":[\"enb1m8however\",\"enb1m1although\",\"enb1m8thebin\"]},{\"id\":\"enb1m8l7e7\",\"type\":\"errorfix\",\"prompt\":\"Lo que va detrás de «of»\",\"wrong\":\"I walk instead of take the bus.\",\"answers\":[\"I walk instead of taking the bus.\"],\"why\":\"Detrás de cualquier preposición —y «of» lo es— va -ing, no infinitivo. Igual que en «I'm looking forward to seeing you».\",\"translation\":\"Voy andando en vez de coger el autobús.\",\"itemIds\":[\"enb1m8insteadof\",\"enwalk\",\"enbus\"]},{\"id\":\"enb1m8l7e8\",\"type\":\"transform\",\"prompt\":\"El mismo contraste, con la otra pieza\",\"source\":\"Although it rained, we walked to the market.\",\"instruction\":\"Dilo con «Despite» (ojo: detrás va sustantivo o -ing)\",\"answers\":[\"Despite the rain, we walked to the market\",\"Despite the rain we walked to the market\",\"In spite of the rain, we walked to the market\"],\"translation\":\"A pesar de la lluvia, fuimos andando al mercado.\",\"hints\":[\"«It rained» se convierte en un sustantivo\",\"Despite the ..., we walked to the market\"],\"itemIds\":[\"enb1m1despite\",\"enb1m8despiteliving\",\"enwalk\"],\"tip\":\"Saber pasar de «although + frase» a «despite + sustantivo» es lo que te salva cuando el examen te pide reformular. Y en el Writing, alternar los dos moldes sube el criterio de estructuras.\"},{\"id\":\"enb1m8l7e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de dos caras\",\"text\":\"___ the new bins are bigger, half the street still leaves bags on the pavement. ___ of complaining, three neighbours went to the council office last week. The council was polite. ___, nothing has changed yet.\",\"answers\":[\"Although\",\"Instead\",\"However\"],\"bank\":[\"Although\",\"Instead\",\"However\",\"Because\",\"Despite\",\"Unless\"],\"translation\":\"Aunque los cubos nuevos son más grandes, media calle sigue dejando bolsas en la acera. En vez de quejarse, tres vecinos fueron la semana pasada a la oficina del ayuntamiento. En el ayuntamiento fueron amables. Sin embargo, aún no ha cambiado nada.\",\"itemIds\":[\"enb1m1although\",\"enb1m8insteadof\",\"enb1m8however\"],\"tip\":\"«Despite» está en el banco a propósito y no cabe en ninguno de los tres: el primer hueco lleva frase detrás, el segundo pide «instead of» y el tercero va detrás de un punto. Ese es todo el examen de esta lección.\"},{\"id\":\"enb1m8l7e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el folleto, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"El ayuntamiento ha repartido este folleto por Palmer Road, donde vive Valeria. Escribe a la Recycling Team. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Folleto del ayuntamiento, buzoneado en Palmer Road\",\"text\":\"NEW FOOD WASTE COLLECTION — from 1 March, food waste will be collected on Tuesdays. Each street will receive two new food bins. Tell us what you think: write to the Recycling Team, Town Hall.\"},\"bullets\":[\"Di dónde vives y de qué escribes.\",\"Concede un punto a favor del ayuntamiento y luego expón el problema, con un conector de concesión.\",\"Propón una solución concreta y pide que te contesten.\"],\"checks\":[{\"re\":\"(i am writing|i'm writing|palmer road)\",\"label\":\"Dices quién eres y de qué escribes\"},{\"re\":\"(although|even though|though|despite|in spite of|while)\",\"label\":\"Concedes un punto con un conector de concesión\"},{\"re\":\"(could you|would it be possible|i would like to know|look forward to hearing|please could)\",\"label\":\"Propones y pides respuesta\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — sin nombre, porque el folleto no lo da\",\"Por qué escribes: «I am writing about the new food waste collection on…»\",\"La concesión + el problema: «Although the new bins are…, there are only…»\",\"Un dato concreto que sostenga la queja: una cifra, un día, una calle\",\"Tu propuesta: «Could you tell me whether…?» / «One bin at each end of the street would…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"even though\",\"though\",\"despite\",\"in spite of\",\"while\",\"however\",\"since\",\"therefore\",\"otherwise\",\"besides\",\"for instance\",\"due to\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the new food waste collection on Palmer Road, where I have lived for two years.\\nAlthough the new food bins are a good idea, there are only two of them for a street of forty flats, and they are far too small. Since the collection changed to Tuesdays, bags have been left on the pavement for days.\\nCould you tell me whether more bins can be added? For instance, one at each end of the street would help.\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m1although\",\"enb1m2sincecausal\",\"enb1m1forinstance\",\"enb1m8foodwaste\",\"enb1m8notenoughbins\",\"enb1m8thebin\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y fíjate en el modelo: la queja empieza CONCEDIENDO («Although the new food bins are a good idea»). Eso no es cortesía vacía — es lo que hace que la segunda mitad suene a argumento y no a rabieta, y el examen lo puntúa en Organisation.\"},{\"id\":\"enb1m8l7e11\",\"type\":\"mc\",\"prompt\":\"Reconocimiento: el conector B2 que vas a leer, no a escribir\",\"question\":\"«Cardiff recycles a lot, whereas London recycles much less.» ¿Qué hace «whereas»?\",\"options\":[\"Contrasta dos cosas paralelas: mientras que\",\"Da una causa: porque\",\"Añade información: además\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «because» o «since». «Whereas» no explica por qué, señala una diferencia.\",\"Eso sería «besides» o «moreover». «Whereas» nunca añade: opone.\"],\"itemIds\":[\"enb1m2while\",\"enb1m8however\"],\"tip\":\"«Whereas» es B2, y por eso aquí solo lo reconoces. Cuando lo necesites al escribir, usa «while», que es B1 y hace exactamente lo mismo: «Cardiff recycles a lot, while London recycles much less».\"},{\"id\":\"enb1m8l7e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"A mucha gente le preocupa el clima.\",\"answers\":[\"A lot of people are concerned about the climate\",\"Lots of people are concerned about the climate\",\"Many people are concerned about the climate\",\"A lot of people are worried about the climate\"],\"hint\":\"El adjetivo lleva su preposición pegada\",\"itemIds\":[\"enb1m8concernedabout\",\"ena2m5alotof\"],\"tip\":\"«concerned ABOUT», como «worried about». En español decimos «preocupado POR» y de ahí sale «concerned for», que existe pero significa otra cosa: temer por la seguridad de alguien.\"},{\"id\":\"enb1m8l7e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción — dos conectores en una frase\",\"question\":\"Aunque cuesta más, compro el de aquí en vez de pedirlo por internet.\",\"answers\":[\"Even though it costs more, I buy the local one instead of ordering it online\",\"Although it costs more, I buy the local one instead of ordering it online\",\"Even though it costs more, I buy the local one instead of buying it online\"],\"hints\":[\"El primero lleva frase detrás; el segundo, -ing\",\"Even though it costs more, I buy the local one instead of ...\"],\"itemIds\":[\"enb1m8eventhough\",\"enb1m8insteadof\"],\"tip\":\"Concesión más alternativa en catorce palabras. Esa es exactamente la densidad que el examen llama «rango de estructuras», y hoy ya la tienes.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m8-3\",\"book\":\"It isn't very good.\",\"real\":\"It's not great, is it?\",\"meaning\":\"No es gran cosa, ¿verdad?\",\"when\":\"Hablando, con cualquiera. Es el understatement británico: se dice mucho menos de lo que se piensa y se espera que el otro entienda el resto. «It's not great» casi nunca significa «es regular»: significa «es malo». Y la coletilla «is it?», con la voz BAJANDO, no pregunta — invita a que estés de acuerdo. En el Writing esto no se escribe: allí hay que decir el nivel de crítica que de verdad quieres decir.\",\"register\":\"neutral\",\"exam\":\"It leaves something to be desired.\",\"note\":\"La escala completa, de peor a mejor, para que no te la juegues: «it's not great» (malo) \u003c «it's not bad» (bastante bueno) \u003c «it's quite good» (bueno) \u003c «it's not bad at all» (muy bueno). El inglés británico dice las cosas malas hacia arriba y las buenas hacia abajo.\",\"sound\":\"its not gréit, is̬ it\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m8natnotgreat\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Writing)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Mira solo la Tarea 1 del Writing y cuenta los conectores del texto modelo. Suelen ser tres o cuatro, no diez.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5
