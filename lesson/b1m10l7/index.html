b\u003ediskutieren\u003c/b\u003e = debatir con calma (pelearse es \u003ci\u003esich streiten\u003c/i\u003e) y \u003cb\u003esensibel\u003c/b\u003e = sensible, delicado — NO «sensato», que es \u003ci\u003evernünftig\u003c/i\u003e. Decirle a alguien «Du bist sehr sensibel» no es un elogio a su cabeza: es un comentario sobre su piel fina.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3 en formato de examen: la conversación entera de Sofía y Anna, UNA sola pasada y SIETE afirmaciones en alemán que se marcan Richtig o Falsch. En el examen tienes 60 segundos para leerlas todas antes del audio: úsalos aquí también. Afirmación 1 de 7.\",\"audio\":\"$17\",\"question\":\"Anna hat die Sprachnachricht nur einmal gehört.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Dice «Die hab ich mir dreimal angehört»: tres veces, no una\",null],\"itemIds\":[\"b1m10sichmeldenfreund\",\"b1m10esteutmirleiddass\"],\"tip\":\"Las siete afirmaciones van EN EL ORDEN de la conversación. Si estás en la cuarta y oyes algo que responde a la segunda, es que te has quedado atrás: sáltala y engánchate a la siguiente.\"},{\"id\":\"b1m10l7e2\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 2 de 7. Misma conversación, misma pasada.\",\"audio\":\"$18\",\"question\":\"Sofía hat wegen des Streits schlecht geschlafen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich hab drei Nächte schlecht geschlafen» — y antes, «hat mich die ganze Sache mehr beschäftigt, als ich zugeben wollte»\"],\"itemIds\":[\"b1m10ehrlichgesagt\",\"b1m10sichaergernueber\"],\"tip\":\"«Ehrlich gesagt» abre casi siempre una confesión incómoda. En el Teil 3 es una señal de que lo que viene detrás se va a preguntar.\"},{\"id\":\"b1m10l7e13\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 3 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$19\",\"question\":\"Sofía sagt ausdrücklich, dass sie Anna keinen Vorwurf machen will.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Lo dice Sofía, y con todas las letras: «Das ist kein Vorwurf, ich sag es nur, damit du’s weißt». Anna es quien contesta «Das versteh ich, und du hast ja recht»\"],\"itemIds\":[\"b1m10keinvorwurf\",\"b1m10damitzweck\"],\"tip\":\"Ojo a quién habla: el primer turno («Danke, dass du gekommen bist, Anna») lo dice Sofía, y a partir de ahí se van alternando —Sofía, Anna, Sofía, Anna—, sin excepción. Quien marca la intención antes de la crítica —«Das ist kein Vorwurf»— es Sofía. Ese aviso es justo lo que evita que la otra persona se cierre.\"},{\"id\":\"b1m10l7e14\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 4 de 7. Aquí hay que oír el motivo, no el hecho. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Anna hat mit Nico gesprochen, weil sie Angst hatte, Sofía anzurufen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich hab ihn angerufen, weil ich Angst hatte, dich anzurufen» — lo dice Anna, contestando al reproche de Sofía. El hecho ya lo sabías; lo que se pregunta es el porqué\"],\"itemIds\":[\"b1m10sichmeldenfreund\",\"b1m10zuhoerenrichtig\"],\"tip\":\"El Teil 3 pregunta por causas y por acuerdos, no por datos sueltos. Aquí hay dos nombres y dos direcciones: Sofía se queja de que la otra habló con Nico, y Anna responde que lo llamó por miedo. Oye las conjunciones —weil, damit, bevor— y quién dice cada una.\"},{\"id\":\"b1m10l7e15\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 5 de 7 — la que casi todo el mundo falla. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Die beiden nehmen sich vor, sich in Zukunft sofort zu melden, wenn sie sich ärgern.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"El acuerdo es dentro de DOS DÍAS, y de paso descartan el «sofort»: «Nicht sofort — wenn man wütend ist, bringt das eh nichts»\",null],\"itemIds\":[\"b1m10konfliktloesen\",\"b1m10klareabmachung\"],\"tip\":\"La afirmación es casi verdadera, y ese «casi» es lo que se puntúa. Una sola palabra —sofort en vez de innerhalb von zwei Tagen— convierte un Richtig en un Falsch.\"},{\"id\":\"b1m10l7e16\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 6 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1c\",\"question\":\"Anna kann am Sonntag erst am Abend zu Nico kommen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«da hab ich bis sechs Dienst. Danach gern» — y quedan a las seis y media\"],\"itemIds\":[\"b1m10zusammenlebenwg\",\"b1m10sichverstehenmit\"],\"tip\":\"Anna es enfermera y trabaja por turnos: cuando el audio da una hora y una profesión, el examen suele preguntar por lo que se puede hacer DESPUÉS.\"},{\"id\":\"b1m10l7e17\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 7 de 7 — la última, y hay que inferirla. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1d\",\"question\":\"Nico hat Anna persönlich zum Essen eingeladen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"La invitación le llegó a Sofía («Nico hat mich gefragt, ob wir am Sonntag zu ihm kommen»), y por eso Sofía cierra diciendo que la próxima vez la invite él mismo\",null],\"itemIds\":[\"b1m10aufeinanderzugehen\",\"b1m10sichverstehenmit\"],\"tip\":\"Nadie dice «Nico hat Anna nicht gefragt». Se deduce de dos frases separadas por diez segundos: la invitación llega a través de Sofía, y ella promete que la próxima vez será directa. Así son las dos últimas afirmaciones del Teil 3.\"},{\"id\":\"b1m10l7e3\",\"type\":\"mc\",\"prompt\":\"El falso amigo\",\"question\":\"„Sie ist ein sehr sensibler Mensch.“\",\"options\":[\"Es una persona muy sensible\",\"Es una persona muy sensata\",\"Es una persona muy razonable\"],\"answer\":0,\"whyWrong\":[null,\"«sensato» es vernünftig\",\"«razonable» también es vernünftig\"],\"itemIds\":[\"b1m10sensibel\"]},{\"id\":\"b1m10l7e4\",\"type\":\"hearreal\",\"prompt\":\"¿Cómo suena de verdad la disculpa?\",\"book\":\"Es tut mir leid.\",\"real\":\"Tut mir echt leid.\",\"translation\":\"Lo siento de verdad.\",\"ask\":\"which\",\"itemIds\":[\"b1m10esteutmirleiddass\"],\"tip\":\"En el habla real el «Es» inicial desaparece y entra «echt» como refuerzo. En un correo, en cambio, se escribe la frase entera.\"},{\"id\":\"b1m10l7e5\",\"type\":\"shadow\",\"prompt\":\"Sombrea la frase que desactiva conflictos\",\"text\":\"Ich kann verstehen, dass du sauer bist.\",\"phonetic\":\"ij kan fea-SHTEE-en, das du ZAU-a bist\",\"translation\":\"Entiendo que estés enfadado.\",\"reps\":2,\"itemIds\":[\"b1m10ichkanndasverstehen\",\"b1m10sauersein\"],\"tip\":\"Dilo despacio y con la voz baja: la melodía importa tanto como las palabras. Con prisa suena a sarcasmo.\"},{\"id\":\"b1m10l7e6\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Das ist kein Vorwurf\",\"translation\":\"No es un reproche\",\"hints\":[\"Cuatro palabras\",\"Das ist kein …\"],\"itemIds\":[\"b1m10keinvorwurf\"]},{\"id\":\"b1m10l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula de apertura\",\"text\":\"___ gesagt hat mich das ziemlich geärgert.\",\"answers\":[\"Ehrlich\"],\"translation\":\"Sinceramente, eso me molestó bastante.\",\"hints\":[\"«sinceramente» + gesagt\",\"Eh…\"],\"itemIds\":[\"b1m10ehrlichgesagt\"]},{\"id\":\"b1m10l7e8\",\"type\":\"gapbank\",\"prompt\":\"Rellena la respuesta que no enciende la mecha\",\"text\":\"Ich kann ___, dass du sauer bist. ___ gesagt hat mich die Sache auch geärgert. Das ist ___ Vorwurf — ich sage es nur, ___ wir es endlich klären.\",\"answers\":[\"verstehen\",\"Ehrlich\",\"kein\",\"damit\"],\"bank\":[\"verstehen\",\"Ehrlich\",\"kein\",\"damit\",\"verstanden\",\"Ehrliches\",\"keinen\",\"um\"],\"translation\":\"Entiendo que estés enfadado. Sinceramente, a mí el asunto también me molestó. No es un reproche: lo digo solo para que lo aclaremos de una vez.\",\"hints\":[\"Tras «kann» va infinitivo\",\"El sujeto cambia («wir») → d-a-m-i-t\"],\"itemIds\":[\"b1m10ichkanndasverstehen\",\"b1m10ehrlichgesagt\",\"b1m10keinvorwurf\",\"b1m10damitzweck\"]},{\"id\":\"b1m10l7e9\",\"type\":\"speak\",\"prompt\":\"Ensaya en voz alta los tres movimientos\",\"text\":\"Ich kann verstehen, dass du sauer bist. Ehrlich gesagt hat mich das auch geärgert. Können wir uns in Ruhe aussprechen?\",\"phonetic\":\"ij kan fea-SHTEE-en das du ZAU-a bist · EEA-lij gue-ZAAKT jat mij das auj gue-ÉA-guet · KÖ-nen via uns in RUU-e AUS-shpre-jen\",\"translation\":\"Entiendo que estés enfadado. Sinceramente, a mí también me molestó. ¿Podemos hablarlo con calma?\",\"itemIds\":[\"b1m10ichkanndasverstehen\",\"b1m10ehrlichgesagt\",\"b1m10sichaussprechen\"],\"tip\":\"Reconocer → decir lo tuyo → proponer. Memoriza el orden: en el Sprechen Teil 1 es exactamente lo que se puntúa como «Interaktion».\"},{\"id\":\"b1m10l7e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige el falso amigo\",\"wrong\":\"Gestern haben wir zwei Stunden diskutiert und danach hat sie geweint.\",\"answers\":[\"Gestern haben wir uns zwei Stunden gestritten und danach hat sie geweint.\"],\"why\":\"Si acabó en llanto, no fue un «diskutieren» (debate tranquilo) sino un «sich streiten». El calco del español «discutir» cambia por completo lo que el otro entiende de tu historia.\",\"translation\":\"Ayer estuvimos dos horas discutiendo y después ella lloró.\",\"itemIds\":[\"b1m10diskutieren\",\"b1m10sichstreitenmit\"]},{\"id\":\"b1m10l7e11\",\"type\":\"paraphrase\",\"prompt\":\"Reformula la acusación\",\"source\":\"Du hörst mir überhaupt nicht zu!\",\"forbid\":[\"überhaupt\",\"Du\"],\"answers\":[\"Ich habe manchmal das Gefühl, dass mir niemand richtig zuhört\",\"Manchmal habe ich das Gefühl, dass mir niemand richtig zuhört\"],\"translation\":\"A veces tengo la sensación de que nadie me escucha de verdad.\",\"hints\":[\"Empieza por «Ich habe manchmal das Gefühl, dass …»\",\"richtig zuhören\"],\"itemIds\":[\"b1m10zuhoerenrichtig\"],\"tip\":\"«Ich habe das Gefühl, dass…» convierte una acusación en una observación. Es la fórmula más rentable de todo el módulo.\"},{\"id\":\"b1m10l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Entiendo que estés enfadado; no es un reproche.\",\"answers\":[\"Ich kann verstehen, dass du sauer bist. Das ist kein Vorwurf\",\"Ich kann verstehen, dass du sauer bist. Das ist kein Vorwurf.\",\"Ich kann verstehen, dass du sauer bist, das ist kein Vorwurf\"],\"hints\":[\"Ich kann verstehen, dass … (verbo al final)\",\"Das ist kein …\"],\"itemIds\":[\"b1m10ichkanndasverstehen\",\"b1m10sauersein\",\"b1m10keinvorwurf\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m10-3\",\"book\":\"Es tut mir leid, das war mein Fehler.\",\"real\":\"Sorry, mein Fehler.\",\"meaning\":\"Perdona, culpa mía\",\"when\":\"Entre compañeros de piso, de trabajo o amigos, para cosas pequeñas y del día. Para algo que ha dolido de verdad, no basta: ahí hace falta la frase completa con «dass».\",\"register\":\"amigos\",\"exam\":\"Entschuldigen Sie bitte, das war mein Fehler.\",\"note\":\"«Sorry» está totalmente integrado en el alemán joven y urbano — pero en la Schreiben Aufgabe 3 (correo formal) es justo lo que baja la banda de registro.\",\"sound\":\"SO-ri, main FEE-la\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m10natvmeinfehler\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1e:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\
