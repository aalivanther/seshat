 [[You have to stay in bed.|Tienes que quedarte en la cama.]] Es la que se usa de verdad al hablar.\u003cbr/\u003e\u003cb\u003e3. You need to rest.\u003c/b\u003e — \u003cb\u003eel peldaño del consejo firme\u003c/b\u003e, y probablemente la fórmula más útil de todo el módulo: [[You need to see a doctor.|Tienes que ir al médico.]] Dice «esto te hace falta», no «esto te lo mando».\u003cbr/\u003e\u003cb\u003e4. Why don't you rest?\u003c/b\u003e — lo más suave, el de la lección anterior. Sugerencia pura.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDetrás de need y de have va TO; detrás de must, no.\u003c/b\u003e Es la trampa del hispanohablante número ocho, la de «tengo \u003cu\u003eque\u003c/u\u003e ir»:\u003cbr/\u003e· \u003ci\u003eYou must \u003cb\u003estay\u003c/b\u003e in bed.\u003c/i\u003e ✓ — \u003ci\u003eYou must to stay in bed.\u003c/i\u003e ✗\u003cbr/\u003e· \u003ci\u003eYou need \u003cb\u003eto\u003c/b\u003e stay in bed.\u003c/i\u003e ✓ — \u003ci\u003eYou need stay in bed.\u003c/i\u003e ✗\u003cbr/\u003e\u003cbr/\u003eY una ventaja gorda de \u003cb\u003eneed to\u003c/b\u003e: como no es un modal de verdad, hace preguntas y negativas \u003cb\u003econ do\u003c/b\u003e, igual que cualquier verbo normal del A1:\u003cbr/\u003e· [[Do I need to see a doctor?|¿Tengo que ir al médico?]]\u003cbr/\u003e· \u003ci\u003eYou don't need to stay in bed.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eSi solo te llevas una cosa de esta lección: \u003cb\u003eYou need to…\u003c/b\u003e sirve para el 90 % de los consejos que vas a dar en tu vida en inglés, y no necesita «should» para nada."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l7\",\"phaseId\":\"ena2m8\",\"title\":\"You need to see a doctor\",\"subtitle\":\"De la orden al consejo: los cuatro peldaños, de un vistazo\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuatro maneras de decir lo mismo, con cuatro pesos distintos\",\"itemIds\":[\"ena2m8advicescale\",\"ena2m8y ,\"You have to stay in bed.\"],\"translation\":\"Tienes que quedarte en la cama.\",\"itemIds\":[\"ena2m8youhavetostayinbed\",\"ena2m8advicescale\"],\"tip\":\"Las dos salidas dicen lo mismo con menos autoridad. Y las dos añaden el to que must no llevaba: ese es el precio de bajar de peldaño.\"},{\"id\":\"ena2m8l7e7\",\"type\":\"transform\",\"prompt\":\"De la afirmación a la pregunta\",\"source\":\"You need to see a doctor.\",\"instruction\":\"Pregúntalo de ti: «¿tengo que ir al médico?»\",\"answers\":[\"Do I need to see a doctor?\"],\"translation\":\"¿Tengo que ir al médico?\",\"hints\":[\"need no es modal: pregunta con do, como cualquier verbo del A1\",\"D… I need to see a doctor?\"],\"itemIds\":[\"ena2m8doineedtoseeadoctor\",\"ena2m8youneedtoseeadoctor\"],\"tip\":\"Ahí se ve que need to es un verbo normal: nadie dice «Need I…?» en el día a día. Con do delante, siempre.\"},{\"id\":\"ena2m8l7e8\",\"type\":\"cloze\",\"prompt\":\"Completa con el peldaño que toca\",\"text\":\"It's nothing serious, but you ___ to rest for two or three days.\",\"answers\":[\"need\"],\"translation\":\"No es nada grave, pero tienes que descansar dos o tres días.\",\"hints\":[\"El consejo firme del médico, el de en medio de la escala\",\"n…\"],\"itemIds\":[\"ena2m8youneedtoseeadoctor\",\"ena2m8itsnothingserious\"]},{\"id\":\"ena2m8l7e9\",\"type\":\"audiomc\",\"prompt\":\"La doctora Ellis, al final de la consulta — 2 escuchas\",\"audio\":\"Well, it's nothing serious. You don't need to take antibiotics, but you need to rest. Why don't you stay at home for a couple of days? And drink lots of water.\",\"question\":\"¿Qué le dice la doctora?\",\"options\":[\"Que descanse en casa un par de días\",\"Que tome antibióticos\",\"Que vaya al hospital\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice justo lo contrario: «you DON'T need to take antibiotics»\",\"No nombra el hospital en ningún momento\"],\"notepad\":true,\"itemIds\":[\"ena2m8itsnothingserious\",\"ena2m8youneedtoseeadoctor\",\"ena2m8whydontyougohome\",\"ena2m8drinklotsofwater\"],\"tip\":\"Ojo al don't del principio: la opción falsa está construida con la palabra que SÍ suena. En el examen, la trampa es siempre esa.\"},{\"id\":\"ena2m8l7e10\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con su fuerza\",\"pairs\":[{\"target\":\"You must rest.\",\"source\":\"orden: no hay elección\"},{\"target\":\"You have to rest.\",\"source\":\"obligación: te obliga la situación\"},{\"target\":\"You need to rest.\",\"source\":\"consejo firme: te hace falta\"},{\"target\":\"Why don't you rest?\",\"source\":\"sugerencia: tú verás\"}],\"itemIds\":[\"ena2m8advicescale\"],\"tip\":\"En español las cuatro caben en «tienes que descansar» o «descansa». El inglés reparte esa idea en cuatro pesos, y elegir mal el peso es un error de registro, no de gramática.\"},{\"id\":\"ena2m8l7e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"No es nada grave, pero tienes que ir al médico.\",\"answers\":[\"It's nothing serious, but you need to see a doctor.\",\"It isn't anything serious, but you need to see a doctor.\",\"It's nothing serious, but you have to see a doctor.\"],\"hint\":\"el peldaño de en medio, el del consejo firme\",\"itemIds\":[\"ena2m8itsnothingserious\",\"ena2m8youneedtoseeadoctor\"]},{\"id\":\"ena2m8l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Tienes que quedarte en la cama. ¿Por qué no llamas al ambulatorio?\",\"answers\":[\"You need to stay in bed. Why don't you phone the surgery?\",\"You have to stay in bed. Why don't you phone the surgery?\",\"You need to stay in bed. Why don't you call the surgery?\"],\"hints\":[\"Un peldaño con to + el consejo envuelto de la lección 6\",\"You n… to stay in bed. Why d… you phone the surgery?\"],\"itemIds\":[\"ena2m8youhavetostayinbed\",\"ena2m8whydontyougohome\",\"ena2m8thesurgery\"],\"tip\":\"Dos consejos seguidos y de distinta fuerza: primero el firme, luego el suave. A
