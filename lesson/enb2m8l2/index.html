3e + pasado = como si. Prima de hipótesis. \u003cb\u003eIn order that\u003c/b\u003e + frase = para que (más formal que in order to + infinitivo). \u003cb\u003eDue to the fact that\u003c/b\u003e + frase: el due to de causa, ahora con cláusula. ❌ due to the road is narrow.\u003cbr/\u003e\u003cbr/\u003eY unless / as long as / provided that se reciclan: ya eran tuyos. Hoy se ponen a trabajar en la misma oración que whereas.\",\"table\":[[\"Molde\",\"Énfasis\",\"Trampa\"],[\"both X and Y\",\"las dos cuentan\",\"both X or Y\"],[\"neither X nor Y\",\"ninguna de las dos\",\"neither X or Y\"],[\"Not only is it…, but it is also…\",\"inversión B2\",\"Not only it is…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l2e1\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The plan is neither cheap or quick.\",\"answers\":[\"The plan is neither cheap nor quick.\"],\"why\":\"Neither lleva nor, no or. Es el calco de «ni barato o rápido», y es un solo error.\",\"translation\":\"El plan no es ni barato ni rápido.\",\"itemIds\":[\"enb2m8neithernor\"]},{\"id\":\"enb2m8l2e2\",\"type\":\"mc\",\"prompt\":\"La inversión que sí es B2\",\"question\":\"«No solo es más lento, sino que además es menos seguro» →\",\"options\":[\"Not only is it slower, but it is also less safe at the corner.\",\"Not only it is slower, but it is also less safe at the corner.\",\"Not only did it slower, but it is also less safe.\"],\"answer\":0,\"whyWrong\":[null,\"Falta la inversión: detrás de not only, el verbo (is) se adelanta.\",\"Did sería la inversión con do, que es C1. Hoy, present simple: is it.\"],\"itemIds\":[\"enb2m8notonlybutalso\"],\"tip\":\"Tres inversiones de B2, y solo tres: never, no sooner, not only. El resto es terreno de arriba. Esta es una de las tres.\"},{\"id\":\"enb2m8l2e3\",\"type\":\"gapbank\",\"prompt\":\"Completa — neither/nor y both/and no son intercambiables, así que no compiten\",\"text\":\"The street has to serve ___ the buses and the bikes, ___ cheap nor quick if we pretend one can vanish. Not only ___ it slower at the corner, but it is also less safe, due to the ___ that the road is narrow.\",\"answers\":[\"both\",\"neither\",\"is\",\"fact\"],\"bank\":[\"both\",\"neither\",\"is\",\"fact\",\"all\",\"either\",\"does\",\"reason\"],\"translation\":\"La calle tiene que servir tanto a los autobuses como a las bicis, y no es ni barato ni rápido si fingimos que uno puede desaparecer. No solo es más lento en la esquina, sino que además es menos seguro, debido a que la calzada es estrecha.\",\"itemIds\":[\"enb2m8bothand\",\"enb2m8neithernor\",\"enb2m8notonlybutalso\",\"enb2m8duetothefactthat\"],\"tip\":\"Either está de distractor para neither. Does, para la inversión con do que no pedimos. Reason, para fact: due to the fact that es el bloque.\"},{\"id\":\"enb2m8l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el «como si»\",\"text\":\"They talk as ___ the street belonged to cars.\",\"answers\":[\"if\",\"though\"],\"translation\":\"Hablan como si la calle fuera de los coches.\",\"hints\":[\"As i-f o as though\",\"i... / th...\"],\"itemIds\":[\"enb2m8asif\",\"enb2m8asthough\"],\"tip\":\"As if y as though valen las dos. Detrás, pasado: belonged, no belongs. Es el pasado irreal otra vez.\"},{\"id\":\"enb2m8l2e5\",\"type\":\"build\",\"prompt\":\"Construye el «para que» de informe\",\"target\":\"in order that buses can keep to the timetable\",\"translation\":\"para que los autobuses puedan cumplir el horario\",\"distractors\":[\"for\",\"keeping\"],\"itemIds\":[\"enb2m8inorderthat\"],\"tip\":\"In order TO + infinitivo ya lo puedes tener. In order THAT + frase es el de B2, y es el que cabe cuando hay un sujeto nuevo (buses).\"},{\"id\":\"enb2m8l2e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — énfasis\",\"source\":\"tanto los autobuses como las bicis\",\"answers\":[\"both the buses and the bikes\",\"both buses and bikes\"],\"hint\":\"Both…and\",\"itemIds\":[\"enb2m8bothand\"],\"tip\":\"Both of the buses and the bikes no. Both the buses and the bikes. El of sobra cuando van los dos nombres.\"},{\"id\":\"enb2m8l2e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Due to the road is narrow, the buses swing out.\",\"answers\":[\"Due to the fact that the road is narrow, the buses swing out.\",\"Due to the narrow road, the buses swing out.\"],\"why\":\"Due to no traga una frase pelada. O le pones the fact that, o un nombre (the narrow road). Es el mismo patrón que despite de la L8 del m6.\",\"translation\":\"Debido a que la calzada es estrecha, los autobuses se abren.\",\"itemIds\":[\"enb2m8duetothefactthat\",\"enb1m2dueto\"]},{\"id\":\"enb2m8l2e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la inversión\",\"text\":\"Not only is it slower, but it is also less safe at the corner.\",\"phonetic\":\"not ÓUN-li is̬ it SLÓU-a, bat it is̬ ÓOL-sou les seif at de KÓO-na\",\"translation\":\"No solo es más lento, sino que además es menos seguro en la esquina.\",\"itemIds\":[\"enb2m8notonlybutalso\"],\"tip\":\"El golpe va en ON-ly, SLOW-er, SAFE, COR-ner. Is it se come. Si no inviertes al hablar, el oído británico oye un not only suelto y espera el giro que no llega.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno inter
