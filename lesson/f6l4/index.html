ice \u003cb\u003e«Stellen Sie sich vor»\u003c/b\u003e y tú sueltas tu guion: Name, Alter, Land, Wohnort, Beruf, Hobby — unas 6 frases que llevas dominando desde la fase 0. Después te pide \u003cb\u003ebuchstabieren\u003c/b\u003e (deletrear tu nombre) y tu \u003cb\u003eTelefonnummer\u003c/b\u003e cifra a cifra. Si no entiendes algo, pedir ayuda EN ALEMÁN suma, no resta: \u003cb\u003eWie bitte?\u003c/b\u003e · \u003cb\u003eKönnen Sie das bitte wiederholen?\u003c/b\u003e · \u003cb\u003eEtwas langsamer, bitte\u003c/b\u003e. Nota la Satzklammer de la fase 5: Können Sie ... \u003cb\u003ewiederholen\u003c/b\u003e?\"}},{\"kind\":\"note\",\"note\":{\"title\":\"El alfabeto alemán — tu munición para el buchstabieren\",\"body\":\"Así se NOMBRA cada letra (no cómo suena dentro de una palabra). Memoriza las traicioneras para un hispanohablante: \u003cb\u003eE\u003c/b\u003e se dice «e» pero \u003cb\u003eI\u003c/b\u003e es «i» (no las cruces como en inglés), \u003cb\u003eV\u003c/b\u003e es «fau», \u003cb\u003eW\u003c/b\u003e es «ve», \u003cb\u003eJ\u003c/b\u003e es «yot», \u003cb\u003eG\u003c/b\u003e es «gue», \u003cb\u003eH\u003c/b\u003e es «ja», \u003cb\u003eY\u003c/b\u003e es «ípsilon», \u003cb\u003eZ\u003c/b\u003e es «tset». Los Umlauts se nombran con su sonido: ä, ö, ü. La \u003cb\u003eß\u003c/b\u003e se llama «estsét» (Eszett). Deletrea tu nombre en voz alta una vez al día hasta el examen.\",\"table\":[[\"letra\",\"se dice\",\"letra\",\"se dice\"],[\"A\",\"a\",\"P\",\"pe\"],[\"B\",\"be\",\"Q\",\"ku\"],[\"C\",\"tse\",\"R\",\"er\"],[\"D\",\"de\",\"S\",\"es\"],[\"E\",\"e\",\"T\",\"te\"],[\"F\",\"ef\",\"U\",\"u\"],[\"G\",\"gue\",\"V\",\"fau\"],[\"H\",\"ja\",\"W\",\"ve\"],[\"I\",\"i\",\"X\",\"iks\"],[\"J\",\"yot\",\"Y\",\"ípsilon\"],[\"K\",\"ka\",\"Z\",\"tset\"],[\"L\",\"el\",\"Ä\",\"a-umlaut (ä)\"],[\"M\",\"em\",\"Ö\",\"o-umlaut (ö)\"],[\"N\",\"en\",\"Ü\",\"u-umlaut (ü)\"],[\"O\",\"o\",\"ß\",\"estsét\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f6l4e1\",\"type\":\"mc\",\"prompt\":\"Conoce el oral\",\"question\":\"En Sprechen Teil 1 tienes que...\",\"options\":[\"leer un texto en voz alta\",\"presentarte, deletrear tu nombre y decir tu número\",\"describir una foto\"],\"answer\":1,\"whyWrong\":[\"Eso no aparece en el A1\",null,\"Eso es de exámenes de niveles superiores\"],\"itemIds\":[\"stellensiesichvor\",\"buchstabieren\"],\"tip\":\"Guion fijo = puntos casi regalados si lo llevas ensayado.\"},{\"id\":\"f6l4e2\",\"type\":\"match\",\"prompt\":\"Empareja las frases de rescate\",\"pairs\":[{\"target\":\"Wie bitte?\",\"source\":\"¿Cómo dice?\"},{\"target\":\"Ich verstehe nicht\",\"source\":\"No entiendo\"},{\"target\":\"Können Sie das bitte wiederholen?\",\"source\":\"¿Puede repetirlo, por favor?\"},{\"target\":\"Etwas langsamer, bitte\",\"source\":\"Un poco más despacio, por favor\"}],\"itemIds\":[\"wiebitte\",\"ichverstehenicht\",\"wiederholen\",\"etwaslangsamer\"]},{\"id\":\"f6l4e3\",\"type\":\"speak\",\"prompt\":\"TU presentación de examen — léela en voz alta hasta que salga sola\",\"text\":\"Hallo! Ich heiße Sofía. Ich komme aus Mexiko und ich wohne in Berlin. Ich bin 30 Jahre alt. Ich bin Programmiererin von Beruf. Ich spiele gern Fußball.\",\"phonetic\":\"ja-ló! ij JÁI-se so-FÍ-a. ij KÓ-me aus MÉ-xi-ko unt ij VÓO-ne in bea-LÍN. ij bin DRÁI-sij YÁA-re alt. ij bin pro-gra-MÍ-re-rin fon be-RÚUF. ij SHPÍI-le guern FÚUS-bal.\",\"translation\":\"¡Hola! Me llamo Sofía. Vengo de México y vivo en Berlín. Tengo 30 años. Soy programadora de profesión. Me gusta jugar al fútbol.\",\"itemIds\":[\"stellensiesichvor\",\"ichspielegern\"],\"tip\":\"Estas 6 frases son literalmente Teil 1 del oral. Repítelas hasta poder decirlas mirando al techo.\"},{\"id\":\"f6l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa la frase de rescate\",\"text\":\"Ich ___ nicht. Können Sie das bitte wiederholen?\",\"answers\":[\"verstehe\"],\"translation\":\"No entiendo. ¿Puede repetirlo, por favor?\",\"hints\":[\"Verbo verstehen (entender) con ich\",\"Termina en -e\"],\"itemIds\":[\"ichverstehenicht\",\"wiederholen\"]},{\"id\":\"f6l4e5\",\"type\":\"build\",\"prompt\":\"Construye la petición formal\",\"target\":\"Können Sie das bitte wiederholen?\",\"translation\":\"¿Puede repetirlo, por favor?\",\"distractors\":[\"Kannst\",\"wiederholst\"],\"itemIds\":[\"wiederholen\"],\"tip\":\"Al examinador siempre Sie. Y mira la pinza: Können ... wiederholen — ¡la Satzklammer de la fase 5!\"},{\"id\":\"f6l4e6\",\"type\":\"speak\",\"prompt\":\"Di tu número como en el examen (cifra a cifra)\",\"text\":\"Meine Telefonnummer ist null eins fünf drei\",\"phonetic\":\"MÁI-ne te-le-FÓON-nu-ma ist nul - ains - fünf - drai\",\"translation\":\"Mi número de teléfono es cero uno cinco tres\",\"itemIds\":[\"telnummer\"]},{\"id\":\"f6l4e7\",\"type\":\"listen\",\"prompt\":\"Escucha la instrucción del examinador\",\"text\":\"Buchstabieren Sie bitte Ihren Namen\",\"translation\":\"Deletree su nombre, por favor\",\"hints\":[\"Empieza con Buchstabieren...\",\"ch gutural tras u; st suena «sht»\"],\"itemIds\":[\"buchstabieren\"]},{\"id\":\"f6l4e10\",\"type\":\"listen\",\"prompt\":\"Escucha el deletreo y escribe las letras que oyes\",\"text\":\"A N N A\",\"translation\":\"A-N-N-A: el nombre Anna, deletreado\",\"hints\":[\"Son cuatro letras, sueltas y con pausa\",\"Escríbelas separadas por espacios, tal como suenan\"],\"itemIds\":[\"buchstabieren\"],\"tip\":\"En el examen el deletreo va así: letra a letra, con calma. La N se dice «en», la A se dice «a».\"},{\"id\":\"f6l4e11\",\"type\":\"speak\",\"prompt\":\"Deletrea TU nombre en voz alta, como en el examen\",\"text\":\"S-O-F-I-A\",\"phonetic\":\"es — o — ef — i — a\",\"translation\":\"Sofía, deletreado letra a letra (en alemán se deletrea sin acento)\",\"itemIds\":[\"buchstabieren\",\"stellensiesichvor\"],\"tip\":\"La F es la trampa: se dice «ef», no «efe». Y ojo: en alemán deletreas Sofia sin acento — el acento de la í se queda en el papel. Practícalo hasta que salga sin pensar — cae seguro en Sprechen Teil 1.\"},{\"id\":\"f6l4e12\",\"type\":\"cloze\",\"prompt\":\"Completa la frase de rescate\",\"text\":\"Etwas ___, bitte.\",\"answers\":[\"langsamer\"],\"translation\":\"Un poco más despacio, por favor.\",\"hints\":[\"langsam (lento) + la terminación de «más»\",\"langsam + er\"],\"itemIds\":[\"etwaslangsamer\"],\"tip\":\"El -er final convierte langsam en «más lento» — la misma mecánica de besser.\"},{\"id\":\"f6l4e13\",\"type\":\"build\",\"prompt\":\"Construye la frase honesta del examen\",\"target\":\"Ich verstehe nicht\",\"translation\":\"No entiendo\",\"distractors\":[\"verstehen\",\"kein\"],\"itemIds\":[\"ichverstehenicht\"],\"tip\":\"Decirlo EN ALEMÁN suma puntos: demuestra que puedes gestionar la conversación.\"},{\"id\":\"f6l4e8\",\"type\":\"type\",\"prompt\":\"Traduce la reacción rápida\",\"question\":\"¿Cómo dice? / ¿Perdón?\",\"answers\":[\"Wie bitte?\",\"Wie bitte\"],\"hints\":[\"Dos palabras\",\"Wie + la palabra mágica\"],\"itemIds\":[\"wiebitte\"]},{\"id\":\"f6l4e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Puede repetirlo, por favor? (formal)\",\"answers\":[\"Können Sie das bitte wiederholen?\",\"Können Sie das bitte wiederholen\",\"Können Sie das wiederholen, bitte?\"],\"hints\":[\"Modal formal primero: Können Sie...\",\"wiederholen cierra la frase — Satzklammer\"],\"itemIds\":[\"wiederholen\"]}]}],\"resources\":[{\"label\":\"Goethe — práctica A1 (página oficial)\",\"url\":\"https://www.goethe.de/ins/us/en/spr/prf/ueb/pa1.html\",\"note\":\"Mira el video de ejemplo del examen oral: fíjate en cómo los candidatos se presentan y deletrean — es tu guion de esta lección.\"},{\"label\":\"Easy German — presentaciones reales\",\"url\":\"https://www.youtube.com/@EasyGerman\",\"note\":\"Busca «introduce yourself in German»: contrasta tu presentación con las de la calle.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width
