x9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8e9,"])</script><script>self.__next_f.push([1,"Wer heuer* in Wien eine Wohnung sucht, landet fast [[zwangsläufig|casi obligatoriamente]] in einer WG. Zusammenleben ist billiger — und anstrengender, als die meisten glauben. Wir haben drei Wohngemeinschaften gefragt, worüber sie streiten und wie sie wieder herauskommen.\u003cbr/\u003e\u003cbr/\u003eWG eins, vier Studierende in Ottakring, streitet ums Putzen. „Wir hatten einen Plan an der Küchentür“, erzählt Miriam, 23. „Aber ein Plan hilft nichts, wenn niemand ihn liest.“ Nach einem halben Jahr ohne saubere Küche setzten sie sich an einem Sonntag zusammen, mit Kaffee und einer Jause*, und sprachen zwei Stunden lang. Das Ergebnis war kein neuer Plan, sondern eine Regel: Wen etwas stört, der sagt es innerhalb von drei Tagen. „Seitdem gibt es weniger Ärger, weil sich nichts mehr [[ansammelt|se acumula]].“\u003cbr/\u003e\u003cbr/\u003eIn WG zwei war der Lärm das Problem. Ein Mitbewohner spielte bis Mitternacht Gitarre, die anderen [[trauten sich|se atrevían]] nichts zu sagen. Erst als eine Nachbarin sich beschwerte, kam alles heraus. „Ich hätte nie gedacht, dass es sie so stört“, sagt der Gitarrist heute. „Sie hätten einfach klopfen sollen.“ Die Lösung war ein Kompromiss, den beide Seiten nicht ganz schön finden: Musik bis 21 Uhr, danach Kopfhörer. Genau das ist ein Kompromiss — niemand bekommt alles.\u003cbr/\u003e\u003cbr/\u003eWG drei hat es nicht geschafft. Zwei Freundinnen, seit der Schule [[unzertrennlich|inseparables]], zogen zusammen und redeten drei Monate lang nicht über das Geld. Als eine von beiden die Miete zweimal zu spät zahlte, [[platzte|estalló]] der Streit, und dabei ging es plötzlich um viel ältere Dinge. Heute wohnen sie getrennt und schreiben sich wieder. „Wir hätten früher reden sollen“, sagt eine von ihnen. „Nicht über die Miete. Über alles andere.“\u003cbr/\u003e\u003cbr/\u003eWas die drei Geschichten verbindet, ist nicht das Thema, sondern der Zeitpunkt. Gestritten wird selten über das, was gerade passiert ist; gestritten wird über das, was monatelang niemand gesagt hat. Wer früh redet, streitet über eine schmutzige Pfanne. Wer wartet, streitet über den Charakter des anderen.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003e* heuer = österr. für „dieses Jahr“ · die Jause = österr. für „die Brotzeit“ (merienda) · die Stiege = österr. für „die Treppe“\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m10l6\",\"phaseId\":\"b1m10\",\"title\":\"Lesen: Streiten will gelernt sein\",\"subtitle\":\"Lectura larga — revista austriaca, con nota al pie de austriacismos\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Convivencia, conflicto y acuerdo\",\"itemIds\":[\"b1m10zusammenlebenwg\",\"b1m10konfliktloesen\",\"b1m10derkompromiss\",\"b1m7feheuer\",\"b1m10jause\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: austriacismos con nota al pie\",\"body\":\"En el examen real los textos vienen de todo el espacio germanófono, y los \u003ci\u003eaustriacismos\u003c/i\u003e se explican a pie de página igual que aquí: \u003cb\u003eheuer\u003c/b\u003e* (= dieses Jahr), \u003cb\u003edie Jause\u003c/b\u003e* (= die Brotzeit / la merienda), \u003cb\u003eder Jänner\u003c/b\u003e* (= Januar), \u003cb\u003edie Stiege\u003c/b\u003e* (= die Treppe).\u003cbr/\u003e\u003cbr/\u003eLo que se te pide en las preguntas de \u003cb\u003einferencia\u003c/b\u003e no está escrito en ninguna línea: hay que deducir la \u003ci\u003epostura\u003c/i\u003e de quien habla. Pista de oro: fíjate en los verbos de opinión escondidos (\u003ci\u003ezugeben, [[behaupten|afirmar]], zugeben müssen\u003c/i\u003e) y en las concesiones («Natürlich…, aber…»), que casi siempre anuncian la opinión real justo después.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje y responde. Las palabras subrayadas suenan y se traducen al tocarlas.\",\"title\":\"Streiten will gelernt sein: drei WGs, drei Wege aus dem Konflikt\",\"source\":\"Reportage aus einem österreichischen Stadtmagazin\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m10l6e1q1\",\"q\":\"Worüber streitet die erste WG?\",\"options\":[\"Über die Miete\",\"Über das Putzen\",\"Über den Lärm\"],\"answer\":1,\"why\":\"«WG eins … streitet ums Putzen.»\"},{\"id\":\"b1m10l6e1q2\",\"q\":\"Warum funktioniert der Putzplan an der Küchentür nicht?\",\"options\":[\"Weil niemand ihn liest\",\"Weil er zu kompliziert ist\",\"Weil die Küche zu klein ist\"],\"answer\":0,\"why\":\"«Aber ein Plan hilft nichts, wenn niemand ihn liest.»\"},{\"id\":\"b1m10l6e1q3\",\"q\":\"Was denkt der Gitarrist heute über seine Mitbewohner?\",\"options\":[\"Dass sie früher etwas hätten sagen sollen\",\"Dass sie zu empfindlich waren\",\"Dass die Nachbarin schuld war\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice con esas palabras: se deduce de «Ich hätte nie gedacht, dass es sie so stört» y de «Sie hätten einfach klopfen sollen». El Konjunktiv II del pasado señala el reproche suave.\"},{\"id\":\"b1m10l6e1q4\",\"q\":\"Was ist laut Text ein echter Kompromiss?\",\"options\":[\"Eine Lösung, die beiden Seiten nicht ganz gefällt\",\"Eine Lösung, bei der einer nachgibt\",\"Eine Lösung, die alle glücklich macht\"],\"answer\":0,\"inference\":true,\"why\":\"«…, den beide Seiten nicht ganz schön finden … niemand bekommt alles». La definición está entre líneas, no en una definición explícita.\"},{\"id\":\"b1m10l6e1q5\",\"q\":\"Was ist die Hauptaussage des letzten Absatzes?\",\"options\":[\"Der Zeitpunkt ist wichtiger als das Thema\",\"Über Geld sollte man nie sprechen\",\"WGs funktionieren nur mit klaren Plänen\"],\"answer\":0,\"inference\":true,\"why\":\"«Was die drei Geschichten verbindet, ist nicht das Thema, sondern der Zeitpunkt.» y el cierre sobre la sartén y el carácter.\"}],\"itemIds\":[\"b1m10zusammenlebenwg\",\"b1m10konfliktloesen\",\"b1m10derkompromiss\",\"b1m7feheuer\",\"b1m10jause\"],\"tip\":\"Fíjate en cuántas veces aparece el Konjunktiv II del pasado («hätten reden sollen», «hätte nie gedacht»): en un texto de conflictos es la forma estrella, porque todo el mundo mira atrás.\"},{\"id\":\"b1m10l6e2\",\"type\":\"match\",\"prompt\":\"Empareja el austriacismo con el alemán estándar\",\"pairs\":[{\"target\":\"heuer\",\"source\":\"dieses Jahr\"},{\"target\":\"die Jause\",\"source\":\"die Brotzeit\"},{\"target\":\"die Stiege\",\"source\":\"die Treppe\"},{\"target\":\"der Jänner\",\"source\":\"der Januar\"}],\"itemIds\":[\"b1m7feheuer\",\"b1m10jause\"],\"tip\":\"En el examen no hace falta saberlos: hay que leer la nota al pie sin perder el hilo. Practica justamente eso.\"},{\"id\":\"b1m10l6e3\",\"type\":\"mc\",\"prompt\":\"Comprensión global\",\"question\":\"Welcher Titel passt zum Text?\",\"options\":[\"Nicht das Thema entscheidet, sondern wann man redet\",\"WGs sind billiger als eine eigene Wohnung\",\"Warum Putzpläne immer funktionieren\"],\"answer\":0,\"whyWrong\":[null,\"El precio solo se menciona en la primera línea\",\"El texto dice justo lo contrario del plan de limpieza\"],\"itemIds\":[\"b1m10zusammenlebenwg\"]},{\"id\":\"b1m10l6e4\",\"type\":\"mc\",\"prompt\":\"El falso amigo del texto\",\"question\":\"„Sie haben einen Kompromiss gefunden.“\",\"options\":[\"Han llegado a un acuerdo\",\"Han adquirido un compromiso formal\",\"Se han comprometido\"],\"answer\":0,\"whyWrong\":[null,\"«compromiso/obligación» es «die Verpflichtung»\",\"Prometerse en matrimonio es «sich verloben»\"],\"itemIds\":[\"b1m10derkompromiss\"]},{\"id\":\"b1m10l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa con la palabra del texto\",\"text\":\"Wer früh redet, streitet über eine schmutzige Pfanne. Wer wartet, streitet über den ___ des anderen.\",\"answers\":[\"Charakter\"],\"translation\":\"Quien habla pronto discute por una sartén sucia. Quien espera, discute por el carácter del otro.\",\"hints\":[\"La palabra que cierra el reportaje\",\"Char…\"],\"itemIds\":[\"b1m10konfliktloesen\"]},{\"id\":\"b1m10l6e6\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye la lección de la WG dos\",\"text\":\"Der Gitarrist sagt heute: „Ich ___ nie gedacht, dass es sie so stört. Sie ___ einfach klopfen sollen.“ Die Lösung war ein ___, ___ beide Seiten nicht ganz schön finden.\",\"answers\":[\"hätte\",\"hätten\",\"Kompromiss\",\"den\"],\"bank\":[\"hätte\",\"hätten\",\"Kompromiss\",\"den\",\"hättest\",\"wäre\",\"Konflikt\",\"der\"],\"translation\":\"El guitarrista dice hoy: «Nunca habría pensado que les molestara tanto. Simplemente tendrían que haber llamado a la puerta». La solución fue un acuerdo que a ninguna de las dos partes le gusta del todo.\",\"hints\":[\"denken y sollen forman el pasado con haben, así que aquí va h-ä-t-t-e / h-ä-t-t-e-n (no wäre)\",\"Relativa de acusativo masculino: d__\"],\"itemIds\":[\"b1m10haettesagensollen\",\"b1m10derkompromiss\"],\"tip\":\"«den beide Seiten … finden»: el relativo lleva acusativo porque dentro de la relativa es el objeto. Espiral del b1m1.\"},{\"id\":\"b1m10l6e7\",\"type\":\"bucket\",\"prompt\":\"¿Habló a tiempo o esperó demasiado? (inferir postura)\",\"categories\":[\"habló a tiempo\",\"esperó demasiado\"],\"items\":[{\"text\":\"„Wen etwas stört, der sagt es innerhalb von drei Tagen.“\",\"bucket\":0},{\"text\":\"„Wir haben drei Monate lang nicht über das Geld geredet.“\",\"bucket\":1},{\"text\":\"„Die anderen trauten sich nichts zu sagen.“\",\"bucket\":1},{\"text\":\"„Wir setzten uns an einem Sonntag zusammen und sprachen zwei Stunden.“\",\"bucket\":0},{\"text\":\"„Erst als eine Nachbarin sich beschwerte, kam alles heraus.“\",\"bucket\":1},{\"text\":\"„Seitdem sammelt sich nichts mehr an.“\",\"bucket\":0}],\"itemIds\":[\"b1m10zusammenlebenwg\",\"b1m10konfliktloesen\"],\"tip\":\"Ninguna frase dice «demasiado tarde»: la postura se infiere. Es la operación del Lesen Teil 4.\"},{\"id\":\"b1m10l6e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3: dos compañeros de piso, y uno de ellos es vienés — se le nota al final. UNA sola escucha, afirmación en alemán y Richtig/Falsch, como en el examen.\",\"audio\":\"Sag mal, hast du gestern wieder das Geschirr stehen lassen? | Ich? Nein, ich war den ganzen Abend bei meiner Schwester. | Entschuldige. Ich ärger mich seit Tagen drüber, und dann sag ich's ausgerechnet der Falschen. | Halb so wild. Aber ehrlich: Statt euch einzeln zu ärgern, hängt endlich einen Putzplan auf. In meiner alten WG hing einer an der Tür, und seitdem hat keiner mehr gestritten. | Gute Idee. Bring am Sonntag was für die Jause mit, dann reden wir in Ruhe drüber.\",\"question\":\"Der Vorwurf trifft die falsche Person.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich? Nein, ich war den ganzen Abend bei meiner Schwester» — y el otro lo reconoce: «dann sag ich’s ausgerechnet der Falschen»\"],\"itemIds\":[\"b1m10streitumsputzen\",\"b1m10sichaergernueber\",\"b1m10mitbewohner\"],\"tip\":\"En el Teil 3 la información que decide llega casi siempre en una reacción corta: «Ich? Nein, ich war den ganzen Abend bei meiner Schwester». Dos segundos, y la respuesta ya está dada.\"},{\"id\":\"b1m10l6e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3, segunda tarea del mismo diálogo. Una escucha.\",\"audio\":\"Sag mal, hast du gestern wieder das Geschirr stehen lassen? | Ich? Nein, ich war den ganzen Abend bei meiner Schwester. | Entschuldige. Ich ärger mich seit Tagen drüber, und dann sag ich's ausgerechnet der Falschen. | Halb so wild. Aber ehrlich: Statt euch einzeln zu ärgern, hängt endlich einen Putzplan auf. In meiner alten WG hing einer an der Tür, und seitdem hat keiner mehr gestritten. | Gute Idee. Bring am Sonntag was für die Jause mit, dann reden wir in Ruhe drüber.\",\"question\":\"Am Sonntag wollen sie über das Thema nicht mehr sprechen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Quedan justo para eso: «Bring am Sonntag was für die Jause mit, dann reden wir in Ruhe drüber»\",null],\"itemIds\":[\"b1m10konfliktloesen\",\"b1m10jause\"],\"tip\":\"«Halb so wild» y «die Jause» son las dos piezas de calle de este audio: la primera desactiva el conflicto, la segunda es la merienda austriaca. Ninguna de las dos aparecerá escrita en la pregunta.\"},{\"id\":\"b1m10l6e8\",\"type\":\"transform\",\"prompt\":\"Del reproche directo al Konjunktiv II\",\"source\":\"Ihr habt nichts gesagt!\",\"instruction\":\"Dilo como reproche suave con «hätten … sollen»\",\"answers\":[\"Ihr hättet etwas sagen sollen\",\"Ihr hättet etwas sagen sollen.\",\"Ihr hättet einfach etwas sagen sollen\"],\"translation\":\"Tendríais que haber dicho algo.\",\"hints\":[\"hättet + infinitivo + sollen\",\"Ihr hättet etwas …\"],\"itemIds\":[\"b1m10haettesagensollen\"],\"tip\":\"El irreal del pasado convierte el grito en reproche civilizado. Por eso llena el texto entero.\"},{\"id\":\"b1m10l6e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden del irreal del pasado\",\"wrong\":\"Wir hätten früher reden gesollt.\",\"answers\":[\"Wir hätten früher reden sollen.\"],\"why\":\"Con un modal, el irreal del pasado usa el doble infinitivo: hätten + infinitivo + sollen (nunca el participio «gesollt»). El modal va el último y en infinitivo.\",\"translation\":\"Tendríamos que haber hablado antes.\",\"itemIds\":[\"b1m10haettesagensollen\"]},{\"id\":\"b1m10l6e10\",\"type\":\"paraphrase\",\"prompt\":\"Resume la tesis del texto con tus palabras\",\"source\":\"Gestritten wird über das, was monatelang niemand gesagt hat.\",\"forbid\":[\"monatelang\",\"gestritten\"],\"answers\":[\"Der Streit kommt aus allem, was man lange verschwiegen hat\",\"Die Konflikte entstehen aus dem, was man lange nicht angesprochen hat\"],\"translation\":\"El conflicto sale de todo lo que se ha callado durante mucho tiempo.\",\"hints\":[\"Empieza por «Der Streit kommt aus …»\",\"verschweigen = callar algo\"],\"itemIds\":[\"b1m10konfliktloesen\",\"b1m10zusammenlebenwg\"]},{\"id\":\"b1m10l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Encontramos un acuerdo para resolver el conflicto.\",\"answers\":[\"Wir haben einen Kompromiss gefunden, um den Konflikt zu lösen\",\"Wir haben einen Kompromiss gefunden, um den Konflikt zu lösen.\"],\"hints\":[\"Mismo sujeto en las dos mitades → um … zu\",\"… um den Konflikt zu lösen\"],\"itemIds\":[\"b1m10derkompromiss\",\"b1m10konfliktloesen\",\"b1m10umzuzweck\"],\"tip\":\"Mismo sujeto (nosotros encontramos, nosotros resolvemos) → um … zu. La clínica de la lección 5, ya en uso libre.\"}]}],\"resources\":[{\"label\":\"DER STANDARD — Familie \u0026 Zusammenleben\",\"url\":\"https://www.derstandard.at/\",\"note\":\"Prensa austriaca: busca reportajes de WG y verás heuer, Jänner y Jause en su hábitat.\"},{\"label\":\"DW — Top-Thema mit Vokabeln (B1)\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Artículos B1 glosados: el mismo formato que este `read`.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-
