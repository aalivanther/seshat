static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Ta48,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. El módulo 1 se llevó el \u003cb\u003eListening Part 1\u003c/b\u003e, el 2 el \u003cb\u003eReading Part 1\u003c/b\u003e, el 3 el \u003cb\u003eListening Part 3\u003c/b\u003e, el 4 el \u003cb\u003eReading Part 4\u003c/b\u003e y el 6 el \u003cb\u003eListening Part 2\u003c/b\u003e. Hoy toca el \u003cb\u003eReading Part 3\u003c/b\u003e, que es el más raro de todos porque \u003cb\u003eno se lee: se busca\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl formato, exacto:\u003c/b\u003e \u003cb\u003ecuatro textos cortos\u003c/b\u003e —de 70 a 90 palabras cada uno— sobre \u003cb\u003eel mismo tema\u003c/b\u003e pero con \u003cb\u003epropósitos distintos\u003c/b\u003e: un correo de un amigo, un reglamento, un artículo, una confirmación de reserva. Y \u003cb\u003esiete preguntas\u003c/b\u003e del tipo \u003ci\u003e¿en qué texto se dice esto?\u003c/i\u003e. Siete ítems, siete marks. En el Practice Paper oficial los cuatro textos son sobre \u003cb\u003eun hotel\u003c/b\u003e: las normas, una encuesta, la carta de un amigo y la confirmación de la reserva.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué es distinto de los otros Readings:\u003c/b\u003e aquí \u003cb\u003eno hay que entender los cuatro textos enteros\u003c/b\u003e. Hay que saber \u003cb\u003ede qué va cada uno\u003c/b\u003e y luego \u003cb\u003ebuscar\u003c/b\u003e. Leer los cuatro con cuidado antes de mirar las preguntas es la manera más rápida de quedarse sin tiempo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa estrategia, en cuatro pasos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eMira los cuatro títulos o encabezados y decide QUÉ ES cada texto\u003c/b\u003e: quién lo escribe y para qué. Personal, normativo, informativo, administrativo. Treinta segundos.\u003cbr/\u003e2. \u003cb\u003eLee las siete preguntas antes que los textos.\u003c/b\u003e Cada pregunta te dice qué clase de información buscas — un precio, una hora, un consejo, una prohibición— y eso ya apunta a uno o dos textos.\u003cbr/\u003e3. \u003cb\u003ePredice antes de buscar.\u003c/b\u003e Si la pregunta es sobre qué pasa si llegas tarde, va a estar en el reglamento, no en el correo del amigo. Aciertas la mitad solo con eso.\u003cbr/\u003e4. \u003cb\u003eBusca el dato, no la palabra.\u003c/b\u003e Y aquí está la trampa entera de esta parte: \u003cb\u003ela misma palabra aparece en tres textos\u003c/b\u003e. «Passport» sale en el correo, en el artículo y en el reglamento; solo uno de los tres contesta la pregunta. Si cazas palabras, fallas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso de nivel:\u003c/b\u003e las preguntas \u003cb\u003eno van en el orden de los textos\u003c/b\u003e. Un texto puede contestar tres preguntas y otro ninguna. No des por hecho que hay reparto.\u003cbr/\u003e\u003cbr/\u003eHoy vas a hacer \u003cb\u003eseis\u003c/b\u003e preguntas, no siete, y los cuatro textos giran alrededor de un trayecto real: \u003cb\u003eBelfast a Dublín\u003c/b\u003e. El dato que hay detrás es de este módulo y es cierto: entre el Reino Unido e Irlanda \u003cb\u003eno hay control de fronteras por carretera\u003c/b\u003e —hay \u003ci\u003eCommon Travel Area\u003c/i\u003e— pero las compañías aéreas sí piden documento con foto, y el dinero pasa de libras a euros sin que nadie te avise."])</script><script>self.__next_f.push([1,"18:T90d,"])</script><script>self.__next_f.push([1,"\u003cb\u003eTEXT A — a message from Amy\u003c/b\u003e\u003cbr/\u003eHi! Yes, do it. We went in February and it was the best weekend we'd had in ages. Don't bother with the early coach: it leaves before the cafés open and you sit in the dark for two hours. Take the eleven o'clock one instead and have breakfast when you get there. And take your passport, even though nobody will look at it on the road. Ours never came out of the bag going down to Dublin, but the airline wanted photo ID on the way home and we nearly missed the flight arguing about it.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT B — conditions of travel\u003c/b\u003e\u003cbr/\u003eCONDITIONS OF TRAVEL. Passengers must be at the departure point fifteen minutes before the advertised time. One suitcase per passenger is carried free of charge, provided that it fits in the [[luggage gauge|medidor de equipaje]] at the door; anything larger is charged by the driver. Tickets are valid on the service shown and on no other. If your service is cancelled, keep your ticket: you may claim a full refund online within twenty-eight days. The company does not accept responsibility for connections missed because of traffic or weather.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT C — from a Belfast newspaper\u003c/b\u003e\u003cbr/\u003eThe Belfast to Dublin route has never been busier. Nine trains a day run in each direction, and the coach that shadows them leaves every hour. Yet the crossing itself is invisible: there is no [[border control|control de fronteras]], no queue and no sign, and most passengers only notice because the phone in their pocket changes network. What does change is the money. Prices north of the border are in pounds and south of it in euros, and the ticket machines at the Dublin end take euros only. Nobody warns you; you find out at the machine.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT D — your booking confirmation\u003c/b\u003e\u003cbr/\u003eThank you for booking with us. Your reference is XR4 812. Belfast Europa to Dublin Busáras, Saturday 14 March, departing 09:00, arriving 11:15. Seats 22A and 22B. This booking is a return; the inbound service leaves Dublin at 18:30 on Sunday 15 March. You may change the date once, free of charge, as long as you do so at least twelve hours before departure. Changes made after that, or after the service has left, are not possible and the fare is not [[refundable|reembolsable]]. Please show this email or your reference at the door."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l10\",\"phaseId\":\"enb1m9\",\"title\":\"Exam lab: Reading Part 3\",\"subtitle\":\"Cuatro textos sobre lo mismo, escritos por cuatro motivos distintos — y siete preguntas que no se contestan leyendo entero\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las tres frases que gobiernan esta parte\",\"itemIds\":[\"enb1m9whichtexttellsyou\",\"enb1m9samewordwrongtext\",\"enb1m9readthequestionsfirst\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 3, y por qué se falla sabiendo leer\",\"body\":\"$17\",\"table\":[[\"Tipo de texto\",\"Para qué está escrito\",\"Qué preguntas contesta\"],[\"Un mensaje de un amigo\",\"aconsejar y contar\",\"qué merece la pena, qué no hacer\"],[\"Un reglamento\",\"obligar y permitir\",\"qué pasa si…, qué está prohibido\"],[\"Un artículo\",\"informar\",\"cuántos, cuándo, por qué\"],[\"Una confirmación\",\"dejar constancia\",\"fechas, referencias, plazos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Reading Part 3, ¿qué es lo primero que se hace?\",\"options\":[\"Decidir qué ES cada texto y leer después las preguntas\",\"Leer los cuatro textos enteros y con cuidado\",\"Buscar en los textos las palabras que salen en las preguntas\"],\"answer\":0,\"whyWrong\":[null,\"Es lo que hace todo el mundo y es lo que agota el reloj. Aquí no se pide comprender cuatro textos: se pide localizar siete datos.\",\"Esa es exactamente la trampa de esta parte: la misma palabra aparece en tres textos y solo uno contesta.\"],\"itemIds\":[\"enb1m9readthequestionsfirst\",\"enb1m4skimthetext\"],\"tip\":\"Treinta segundos decidiendo qué es cada texto te ahorran tres minutos de búsqueda. Un reglamento contesta unas preguntas y un mensaje de un amigo contesta otras, y eso se sabe sin leerlos.\"},{\"id\":\"enb1m9l10e2\",\"type\":\"mc\",\"prompt\":\"La trampa número uno de esta parte\",\"question\":\"La palabra «passport» aparece en tres de los cuatro textos. ¿Qué significa eso?\",\"options\":[\"Que hay que leer qué DICE cada uno sobre el pasaporte, no dónde aparece\",\"Que la respuesta está en el texto donde aparece más veces\",\"Que la pregunta sobre el pasaporte no tiene respuesta clara\"],\"answer\":0,\"whyWrong\":[null,\"Contar apariciones no es leer. El examen construye los distractores precisamente repitiendo la palabra clave en los textos que no contestan.\",\"Siempre hay una respuesta y solo una. Lo que no hay es una palabra que la señale.\"],\"itemIds\":[\"enb1m9samewordwrongtext\"],\"tip\":\"Es la misma lógica que en el Listening Part 2: la opción que repite la palabra suele ser el distractor. Aquí, el texto que repite la palabra suele ser el que no contesta.\"},{\"id\":\"enb1m9l10e3\",\"type\":\"read\",\"prompt\":\"Reading Part 3. Mira primero QUÉ ES cada texto, luego lee las preguntas y solo entonces busca. Toca las palabras subrayadas si te bloquean.\",\"title\":\"Belfast to Dublin — four texts, four reasons for writing\",\"source\":\"Adapted from a message, an operator's conditions of travel, a Belfast newspaper and a booking confirmation\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m9l10e3q1\",\"q\":\"Which text tells you how many trains cross the border every day?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":2,\"why\":\"«Nine trains a day run in each direction». Es un dato, y los datos están en el artículo: es el único de los cuatro textos escrito para informar.\"},{\"id\":\"enb1m9l10e3q2\",\"q\":\"Which text tells you what to do if your service is cancelled?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":1,\"why\":\"«If your service is cancelled, keep your ticket: you may claim a full refund online within twenty-eight days». Lo que pasa cuando algo falla está siempre en el reglamento, no en la confirmación.\"},{\"id\":\"enb1m9l10e3q3\",\"q\":\"Which text tells you until when you can change the date of your journey?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":3,\"why\":\"«You may change the date once, free of charge, as long as you do so at least twelve hours before departure». La confirmación es la que trae los plazos de TU reserva; el reglamento habla de billetes en general.\"},{\"id\":\"enb1m9l10e3q4\",\"q\":\"Which text warns you that you may need identification even though nobody checks it at the border?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que juntar dos frases de Amy: «take your passport, even though nobody will look at it on the road» y «the airline wanted photo ID on the way home». El artículo dice que no hay control de fronteras, pero no dice en ningún momento que vayas a necesitar el documento — y ahí está el distractor.\"},{\"id\":\"enb1m9l10e3q5\",\"q\":\"Which text explains why a passenger might suddenly need euros?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":2,\"inference\":true,\"why\":\"El texto no dice «necesitarás euros»: dice que al sur de la frontera los precios son en euros y que las máquinas de Dublín solo aceptan euros. Hay que unir las dos cosas para llegar a la pregunta.\"},{\"id\":\"enb1m9l10e3q6\",\"q\":\"Which text advises against the first departure of the day, for a reason that has nothing to do with money?\",\"options\":[\"Texto A — el mensaje de Amy\",\"Texto B — las condiciones de viaje\",\"Texto C — el artículo de Belfast\",\"Texto D — la confirmación de la reserva\"],\"answer\":0,\"inference\":true,\"why\":\"«Don't bother with the early coach: it leaves before the cafés open and you sit in the dark for two hours». Es un consejo, y los consejos solo pueden venir de una persona: por eso está en el mensaje y no podía estar en ningún otro de los cuatro.\"}],\"itemIds\":[\"enb1m9bordercontrol\",\"enb1m9aslongas\",\"enb1m9providedthat\",\"enb1m9cancelled\",\"enb1m9luggageallowance\",\"enb1m9whichtexttellsyou\"],\"tip\":\"¿Fallaste alguna? Vuelve a mirar QUÉ ES cada texto antes que dónde está la palabra. Los datos van en el artículo, las normas en el reglamento, los plazos de tu viaje en la confirmación y los consejos en el mensaje del amigo. Con ese mapa, cuatro de las seis se contestan sin releer nada.\"},{\"id\":\"enb1m9l10e4\",\"type\":\"match\",\"prompt\":\"Empareja cada texto con el motivo por el que está escrito\",\"pairs\":[{\"target\":\"a message from a friend\",\"source\":\"aconsejar y contar lo que vivió\"},{\"target\":\"conditions of travel\",\"source\":\"obligar, permitir y cubrirse las espaldas\"},{\"target\":\"a newspaper article\",\"source\":\"informar con datos\"},{\"target\":\"a booking confirmation\",\"source\":\"dejar constancia de fechas y plazos\"}],\"itemIds\":[\"enb1m9whichtexttellsyou\",\"ena2m12thepurposeofthetext\"],\"tip\":\"Esta tabla es el laboratorio entero. Si al ver los cuatro textos sabes cuál es cuál, ya has descartado dos textos por pregunta antes de leer una sola línea.\"},{\"id\":\"enb1m9l10e5\",\"type\":\"mc\",\"prompt\":\"Predecir antes de buscar\",\"question\":\"«En qué texto se dice qué pasa si tu maleta es demasiado grande.» Antes de leer nada, ¿dónde lo buscas?\",\"options\":[\"En el reglamento\",\"En el mensaje del amigo\",\"En el artículo del periódico\"],\"answer\":0,\"whyWrong\":[null,\"Un amigo te cuenta lo que le pasó a él, no lo que cobra la empresa.\",\"Un artículo informa del contexto: cuántos trenes hay, cuánta gente viaja. No de las tarifas de equipaje.\"],\"itemIds\":[\"enb1m9luggageallowance\",\"enb1m9whichtexttellsyou\"],\"tip\":\"Predecir no es adivinar: es usar lo que ya sabes del género. Las consecuencias («qué pasa si…») están siempre en el texto que impone reglas, y las reglas siempre las escribe quien cobra.\"},{\"id\":\"enb1m9l10e6\",\"type\":\"bucket\",\"prompt\":\"¿Dónde iría cada pregunta?\",\"categories\":[\"Reglamento o confirmación\",\"Mensaje de un amigo o artículo\"],\"items\":[{\"text\":\"What happens if the service is cancelled?\",\"bucket\":0},{\"text\":\"How long before departure can you change the date?\",\"bucket\":0},{\"text\":\"Which departure is not worth taking, and why?\",\"bucket\":1},{\"text\":\"How many trains run every day?\",\"bucket\":1},{\"text\":\"How much luggage is included in the fare?\",\"bucket\":0},{\"text\":\"What do most passengers notice at the border?\",\"bucket\":1}],\"itemIds\":[\"enb1m9whichtexttellsyou\",\"enb1m9luggageallowance\",\"enb1m9cancelled\"],\"tip\":\"Fíjate en el verbo de cada pregunta. «What happens if…», «how long before…», «how much is included…» son de texto normativo. «Is it worth…», «what do people notice…» son de persona. El género de la pregunta te lleva al género del texto.\"},{\"id\":\"enb1m9l10e7\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta tal y como viene en el examen\",\"text\":\"Which text ___ you what to do if your service is cancelled?\",\"answers\":[\"tells\"],\"translation\":\"¿En qué texto se dice qué hay que hacer si le cancelan el servicio?\",\"hints\":[\"Tercera persona del singular\",\"Cinco letras y lleva «you» detrás\"],\"itemIds\":[\"enb1m9whichtexttellsyou\"],\"tip\":\"«Which text tells you…?» es la fórmula literal del enunciado. Reconocerla te ahorra medio segundo por pregunta y siete medios segundos son un ítem entero al final del Reading.\"},{\"id\":\"enb1m9l10e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen de lo que es esta parte del examen\",\"text\":\"In Part 3 you get four short texts on the same ___ but with four different ___ . One informs, one gives you ___ about what to take, one sets out the ___ you have to follow, and one confirms something you have already booked.\",\"answers\":[\"topic\",\"purposes\",\"advice\",\"rules\"],\"bank\":[\"topic\",\"purposes\",\"advice\",\"rules\",\"sentences\",\"words\",\"numbers\"],\"translation\":\"En el Part 3 te dan cuatro textos cortos sobre el mismo tema pero con cuatro propósitos distintos. Uno informa, otro te aconseja qué llevar, otro expone las normas que tienes que cumplir y otro te confirma algo que ya has reservado.\",\"itemIds\":[\"enb1m9whichtexttellsyou\",\"enb1m9readthequestionsfirst\"],\"tip\":\"Ese «mismo tema, distinto propósito» es la definición oficial del Part 3, y es lo único que hay que memorizar. Todo lo demás sale de ahí.\"},{\"id\":\"enb1m9l10e9\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra\",\"wrong\":\"Which text tell you the price?\",\"answers\":[\"Which text tells you the price?\"],\"why\":\"«Which text» es tercera persona del singular, así que el verbo lleva -s: «tells». Es un error de los que no cambian el significado y sí cuestan un punto de gramática en el Writing.\",\"translation\":\"¿En qué texto se dice el precio?\",\"itemIds\":[\"enb1m9whichtexttellsyou\"]},{\"id\":\"enb1m9l10e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Primero las preguntas, luego los textos.\",\"answers\":[\"Read the questions first, then the texts\",\"Read the questions first and then the texts\",\"First the questions, then the texts\"],\"hint\":\"Empieza por el verbo de leer, en imperativo\",\"itemIds\":[\"enb1m9readthequestionsfirst\"],\"tip\":\"Es la instrucción que hay que darse a uno mismo antes de cada Reading Part 3. Escríbetela en el borde del papel el día del examen: treinta segundos de orden valen más que tres minutos de leer deprisa.\"},{\"id\":\"enb1m9l10e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te está permitiendo el texto D?\",\"source\":\"You may change the date once, free of charge, as long as you do so at least twelve hours before departure.\",\"answers\":[\"Puede cambiar la fecha una vez, sin coste, siempre que lo haga al menos doce horas antes de la salida\",\"Puedes cambiar la fecha una vez, gratis, siempre que lo hagas al menos doce horas antes de la salida\",\"Se puede cambiar la fecha una vez, sin cargo, siempre y cuando se haga al menos doce horas antes de la salida\"],\"itemIds\":[\"enb1m9aslongas\",\"enb1m9providedthat\"],\"tip\":\"Tres condiciones en una sola frase: una vez, gratis y con doce horas de margen. En el Part 3 las preguntas se construyen justo sobre ese tipo de letra pequeña, porque es donde se distingue quién ha leído de quién ha buscado la palabra.\"},{\"id\":\"enb1m9l10e12\",\"type\":\"listen\",\"prompt\":\"Dictado: la instrucción que resume esta parte del examen\",\"text\":\"Read the questions first, then the texts.\",\"translation\":\"Primero las preguntas, luego los textos.\",\"hints\":[\"Empieza por «Read the questions…»\",\"Read the questions first, then the ...\"],\"itemIds\":[\"enb1m9readthequestionsfirst\"],\"tip\":\"Dilo en voz alta mientras lo escribes. Es la única parte del examen donde el orden en que haces las cosas vale más que lo que sabes de inglés.\"},{\"id\":\"enb1m9l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"¿En qué texto se dice qué hay que hacer si cancelan el servicio?\",\"answers\":[\"Which text tells you what to do if the service is cancelled?\",\"Which text tells you what to do if your service is cancelled?\",\"Which text tells you what to do if they cancel the service?\"],\"hints\":[\"Empieza por la fórmula del examen\",\"Which text tells you what to do if ...?\"],\"itemIds\":[\"enb1m9whichtexttellsyou\",\"enb1m9cancelled\"],\"tip\":\"Seis laboratorios hechos: Listening 1 (m1), Reading 1 (m2), Listening 3 (m3), Reading 4 (m4), Listening 2 (m6) y Reading 3 (hoy). Del Listening ya solo queda el Part 4, la discusión larga — y para eso te va a servir todo lo que has hecho con las actitudes y las opiniones.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Reading \u0026 Writing)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo el Reading Part 3 con el papel oficial: cuatro textos sobre un hotel y siete preguntas. Antes de leer nada, escribe al lado de cada texto una palabra que diga qué es (normas, encuesta, carta, confirmación). Luego cronométrate: si tardas más de seis minutos, es que estás leyendo en vez de buscando.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-ca
