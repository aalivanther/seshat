.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T5c3,"])</script><script>self.__next_f.push([1,"El tema del medio ambiente tiene una trampa en el oral: es facilísimo caer en el discurso de folleto —«we must save the planet»— y decir cinco frases sin contar nada. El examinador lo nota inmediatamente, y el criterio que baja es el de \u003cb\u003eTask Fulfilment\u003c/b\u003e: te han pedido tu experiencia y has dado un eslogan.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla para hoy: cada afirmación general, con un ejemplo concreto detrás.\u003c/b\u003e\u003cbr/\u003e· General: \u003ci\u003eI've cut down on single-use plastic.\u003c/i\u003e\u003cbr/\u003e· Concreto: \u003ci\u003eI bought a bottle in March and I've refilled it at work ever since.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY funciona en las dos direcciones: si te falta la palabra exacta, cuentas la escena y el examinador la deduce. Eso es exactamente lo que mide el nivel.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres piezas para el cierre:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ein everyday life\u003c/b\u003e — «en el día a día». Sitúa lo que dices en tu vida real, no en el mundo de las ideas.\u003cbr/\u003e· \u003cb\u003eIt's a small step, but it's a start.\u003c/b\u003e — concede lo pequeño que es y lo defiendes igual. Es el molde de la lección 8 en una sola frase.\u003cbr/\u003e· \u003cb\u003eIt's up to all of us.\u003c/b\u003e — «depende de todos nosotros». Cierra bien, pero \u003cb\u003esolo una vez\u003c/b\u003e: dicha dos veces ya es folleto.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY no te olvides del understatement.\u003c/b\u003e Después de todo lo que hayas contado, un \u003ci\u003e«It's not much, is it?»\u003c/i\u003e dicho con la voz bajando suena a persona real. Un «I am doing everything I can for the planet» suena a texto memorizado, y bajará la nota justamente por eso."])</script><script>self.__next_f.push([1,"18:T68d,"])</script><script>self.__next_f.push([1,"So how did the bottle thing go? The deposit scheme.|Better than I expected and worse than the leaflet said, which is about normal.|Go on.|The machine takes the bottle, gives you twenty pence back and prints a voucher for the shop. In three weeks the street has put back about four thousand bottles.|That sounds like a lot.|It is a lot. It's also nothing like the amount that goes into the black bin every week, so let's not get carried away.|You are very cheerful today.|I'm not being negative. I'm saying two things at the same time, which people don't like. The scheme works AND it is small. Both of those are true.|Fair enough. So what's the worse-than-the-leaflet part?|The machine only takes plastic and cans. Not glass. And the leaflet had a picture of a glass bottle on the front, so half the street turned up with jam jars.|Oh, that is brilliant.|The woman from the council was there on the Saturday and she was far more patient than I would have been. She said the glass machine costs three times as much and there wasn't enough money for both of them.|So it isn't that nobody thought of it.|No, and that's the bit that gets lost. People assume the council is stupid. Usually the council is poor.|Would you rather they had waited and done it properly?|Honestly? No. If they had waited for the money for the glass machine we would still be waiting in five years. This way there is something in the street that works, and it is much easier to argue for the second one when the first one is full every Friday.|That's a good point, actually.|Even so, I would still like the glass one. My recycling box is nothing but jam jars.|And whose fault is that?|Mine. Entirely mine."])</script><script>self.__next_f.push([1,"19:T68d,"])</script s there on the Saturday and she was far more patient than I would have been. She said the glass machine costs three times as much and there wasn't enough money for both of them.|So it isn't that nobody thought of it.|No, and that's the bit that gets lost. People assume the council is stupid. Usually the council is poor.|Would you rather they had waited and done it properly?|Honestly? No. If they had waited for the money for the glass machine we would still be waiting in five years. This way there is something in the street that works, and it is much easier to argue for the second one when the first one is full every Friday.|That's a good point, actually.|Even so, I would still like the glass one. My recycling box is nothing but jam jars.|And whose fault is that?|Mine. Entirely mine."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l9\",\"phaseId\":\"enb1m8\",\"title\":\"Green enough?\",\"subtitle\":\"Lo que haces de verdad, dicho en minuto y medio — y el repaso del módulo\",\"minutes\":26,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas del cierre\",\"itemIds\":[\"enb1m8ineverydaylife\",\"enb1m8itsuptoallofus\",\"enb1m8bringback\",\"enb1m8swapfor\",\"enb1m8asmallstep\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Hablar de esto sin dar un mitin\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Repaso veloz del módulo — todo esto ya es tuyo\",\"pairs\":[{\"target\":\"far cheaper\",\"source\":\"muchísimo más barato\"},{\"target\":\"twice as much\",\"source\":\"el doble\"},{\"target\":\"cheap enough for us\",\"source\":\"lo bastante barato para nosotros\"},{\"target\":\"most of the packaging\",\"source\":\"la mayor parte del embalaje\"},{\"target\":\"neither shop\",\"source\":\"ninguna de las dos tiendas\"}],\"targetSeconds\":26,\"itemIds\":[\"enb1m8farcheaper\",\"enb1m8twiceasmuch\",\"enb1m8cheapenoughforus\",\"enb1m8mostofthe\",\"enb1m8neither\"],\"tip\":\"Cinco moldes del módulo en veintiséis segundos. Si salen sin pensar, el monólogo de abajo se hace solo.\"},{\"id\":\"enb1m8l9e2\",\"type\":\"errorfix\",\"prompt\":\"El pronombre del phrasal verb, otra vez\",\"wrong\":\"You bring back them and you get your money back.\",\"answers\":[\"You bring them back and you get your money back.\"],\"why\":\"Con «bring back», igual que con «throw away»: si el objeto es un pronombre (them, it), va OBLIGATORIAMENTE en medio. «Bring back them» está mal siempre.\",\"translation\":\"Las devuelves y te devuelven el dinero.\",\"itemIds\":[\"enb1m8bringback\",\"enb1m8throwaway\"]},{\"id\":\"enb1m8l9e3\",\"type\":\"errorfix\",\"prompt\":\"La preposición del intercambio\",\"wrong\":\"She swapped her coat by a jumper.\",\"answers\":[\"She swapped her coat for a jumper.\"],\"why\":\"«swap A FOR B». El «por» del español empuja a «by», que en inglés indica quién hace la acción, no a cambio de qué.\",\"translation\":\"Cambió su abrigo por un jersey.\",\"itemIds\":[\"enb1m8swapfor\",\"enjacket\"]},{\"id\":\"enb1m8l9e4\",\"type\":\"bucket\",\"prompt\":\"Repaso de moldes: ¿bien o mal?\",\"categories\":[\"BIEN\",\"MAL\"],\"items\":[{\"text\":\"much cheaper\",\"bucket\":0},{\"text\":\"very cheaper\",\"bucket\":1},{\"text\":\"cheap enough\",\"bucket\":0},{\"text\":\"enough cheap\",\"bucket\":1},{\"text\":\"too expensive\",\"bucket\":0},{\"text\":\"too much expensive\",\"bucket\":1}],\"itemIds\":[\"enb1m8farcheaper\",\"enb1m8cheapenoughforus\",\"enb1m8tooexpensivetobuy\"],\"tip\":\"Los tres calcos del módulo, en fila. Si los tres te salen a la primera, la gramática del módulo está cerrada.\"},{\"id\":\"enb1m8l9e5\",\"type\":\"gapbank\",\"prompt\":\"Completa la explicación del sistema de envases\",\"text\":\"In Scotland you pay twenty pence extra for the bottle. You drink it, you bring the bottle ___, and you get your money ___. It works: ___ than nine out of ten bottles come back.\",\"answers\":[\"back\",\"back\",\"more\"],\"bank\":[\"back\",\"more\",\"away\",\"less\",\"off\"],\"translation\":\"En Escocia pagas veinte peniques de más por la botella. Te la bebes, devuelves la botella y te devuelven el dinero. Y funciona: vuelven más de nueve de cada diez botellas.\",\"itemIds\":[\"enb1m8bringback\",\"enb1m8depositscheme\",\"ena2m4morethantenpounds\"],\"tip\":\"Dos huecos con la misma respuesta a propósito: «bring it back» y «get your money back» son la pareja que define el sistema entero. Y en el tercero, «more than» con números — nunca «more of».\"},{\"id\":\"enb1m8l9e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «buy» y sin «new»\",\"source\":\"I don't buy new clothes.\",\"forbid\":[\"buy\",\"new\"],\"answers\":[\"I get all my clothes second-hand\",\"All my clothes come from charity shops\",\"Everything I wear is second-hand\"],\"translation\":\"No compro ropa nueva.\",\"hints\":[\"Di de dónde viene la ropa, no lo que no haces\",\"All my clothes come from ...\"],\"itemIds\":[\"enb1m8secondhand\",\"enb1m8charityshop\"],\"tip\":\"Decir lo mismo en positivo es la maniobra más útil del oral: en vez de negar lo que no haces, cuentas lo que sí. Y de paso suena mucho mejor.\"},{\"id\":\"enb1m8l9e7\",\"type\":\"transform\",\"prompt\":\"Del general al concreto (que es lo que pide el examen)\",\"source\":\"I care about the environment.\",\"instruction\":\"Dilo con un dato concreto de tu día a día, usando «instead of»\",\"answers\":[\"I walk to work instead of taking the bus\",\"I walk instead of taking the bus\",\"I take the bus instead of driving\"],\"translation\":\"Voy andando al trabajo en vez de coger el autobús.\",\"hints\":[\"Detrás de «instead of» va -ing\",\"I walk to work instead of ... the bus\"],\"itemIds\":[\"enb1m8insteadof\",\"enb1m8theenvironment\",\"enwalk\"],\"tip\":\"«I care about the environment» no dice nada: lo dice todo el mundo. «I walk to work instead of taking the bus» dice lo mismo y además demuestra que es verdad. En el examen, la segunda puntúa el doble.\"},{\"id\":\"enb1m8l9e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Es un paso pequeño, pero es un principio.\",\"answers\":[\"It's a small step, but it's a start\",\"It is a small step, but it is a start\",\"It's a small step but it's a start\"],\"hint\":\"Concedes lo pequeño y lo defiendes igual\",\"itemIds\":[\"enb1m8asmallstep\",\"enb1m8makeadifference\"],\"tip\":\"Es el molde de la concesión reducido a nueve palabras. Guárdala para el final del monólogo: cierra sin exagerar y sin disculparse.\"},{\"id\":\"enb1m8l9e9\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"Green enough? What I actually do in everyday life — and what I don't\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about what I actually do… I'll say three things, and one of them isn't good.»\"},{\"title\":\"2. What you do — with a concrete example\",\"hint\":\"Una afirmación general y un ejemplo detrás: «I've cut down on single-use plastic. I bought a bottle in March and I've refilled it at work ever since.»\"},{\"title\":\"3. Compare — with a modifier\",\"hint\":\"Mete un matizador: «Second-hand clothes are far cheaper», «The bus is much greener than the car», «It costs twice as much».\"},{\"title\":\"4. Concede what you don't do\",\"hint\":\"Aquí sube la nota: «To be honest, I don't do enough. Even though I know the bus is greener, I still take a taxi when it rains.»\"},{\"title\":\"5. Close\",\"hint\":\"Cierra sin mitin: «It's a small step, but it's a start» o «It's not much, is it?». Y «It's up to all of us», SOLO una vez.\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Detrás de cada afirmación general puse un ejemplo concreto (un mes, un sitio, un precio)\",\"Usé al menos dos matizadores del comparativo (far, much, a lot, a bit, slightly, twice as much)\",\"Concedí al menos una cosa que NO hago, con un conector de concesión (although, even though, despite)\",\"No dije ni un «very cheaper» ni un «too much expensive»\",\"Cerré con «It's a small step, but it's a start» o con un understatement, no con un eslogan\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 4, para que el resto sea tuyo: «To be honest, I don't do enough. I've cut down on plastic bottles and I take the bus instead of a taxi, but I still order things online because it's cheaper, and I know the packaging goes straight in the bin. Even though I know that, I keep doing it. It's not great, is it?»\",\"itemIds\":[\"enb1m8ineverydaylife\",\"enb1m8tobehonest\",\"enb1m6cutdownon\",\"enb1m8eventhough\",\"enb1m8asmallstep\",\"enb1m8natnotgreat\"],\"tip\":\"El punto 4 es el que separa un B1 de un A2 largo: reconocer lo que NO haces demuestra que puedes matizar, y matizar es literalmente el título de este módulo. Nadie te está examinando de ecología.\"},{\"id\":\"enb1m8l9e10\",\"type\":\"order\",\"prompt\":\"Ordena el monólogo de Valeria\",\"sentences\":[\"I'd like to talk about what I actually do, and I'll be honest about one thing I don't.\",\"I've cut down on single-use plastic: I bought a bottle in March and I've refilled it at work ever since.\",\"I get most of my clothes second-hand, and they're far cheaper than anything in the shops.\",\"Even though I know the bus is greener, I still take a taxi when it rains.\",\"It's a small step, but it's a start.\"],\"translation\":\"«Me gustaría hablar de lo que hago de verdad, y voy a ser sincera sobre una cosa que no hago. · He reducido el plástico de un solo uso: compré una botella en marzo y desde entonces la relleno en el trabajo. · Casi toda mi ropa es de segunda mano, y sale muchísimo más barata que cualquier cosa de las tiendas. · Aunque sé que el autobús contamina menos, sigo cogiendo un taxi cuando llueve. · Es un paso pequeño, pero es un principio.»\",\"itemIds\":[\"enb1m6cutdownon\",\"enb1m8secondhand\",\"enb1m8eventhough\",\"enb1m8asmallstep\"],\"tip\":\"Anunciar, dos cosas que haces con ejemplo, una que no haces, y cerrar. Cinco frases: ese es el esqueleto de cualquier monólogo de B1, cambie el tema que cambie.\"},{\"id\":\"enb1m8l9e11\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES de darle al play. Dos escuchas, y usa el cuaderno.\",\"notepad\":true,\"audio\":\"So, my flatmate and I had this argument about the food shop. She says the supermarket is far cheaper and I take her point, it is, on paper. But we throw away about a third of what we buy there, because it comes in packs of six and there are two of us. At the market I buy three tomatoes, not a tray of nine. Even though the price per kilo is higher, the bill at the end of the week is lower. It's not a green argument at all, really. It's just arithmetic.\",\"question\":\"¿Por qué prefiere ella el mercado?\",\"options\":[\"Porque las cosas cuestan menos por kilo\",\"Porque compra la cantidad que va a usar y tira menos\",\"Porque le preocupa el medio ambiente\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Dice justo lo contrario: «the price per kilo is higher».\",null,\"Lo descarta ella misma al final: «It's not a green argument at all, really».\"],\"itemIds\":[\"enb1m8farcheaper\",\"enb1m8throwaway\",\"enb1m8eventhough\",\"ensupermarket\"],\"tip\":\"Tres pistas de este módulo en un audio de cuarenta segundos: «I take her point» concede, «Even though» gira y «It's not a green argument at all» descarta. Si sigues los conectores, sigues el argumento.\"},{\"id\":\"enb1m8l9e12\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre\",\"text\":\"It's a small step, but it's a start.\",\"translation\":\"Es un paso pequeño, pero es un principio.\",\"strictContractions\":true,\"hints\":[\"Dos contracciones de «it is»\",\"It's a small step, but ...\"],\"itemIds\":[\"enb1m8asmallstep\"],\"tip\":\"Las dos contracciones se comen la vocal: «its» pegado, no «it is». Escribirlo entero no está mal, pero no es lo que sonó — y el dictado se corrige por lo que sonó.\"},{\"id\":\"enb1m8l9e13\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Aunque el autobús contamina menos, sigo cogiendo un taxi cuando llueve.\",\"answers\":[\"Even though the bus is greener, I still take a taxi when it rains\",\"Although the bus is greener, I still take a taxi when it rains\",\"Even though the bus is greener I still take a taxi when it rains\"],\"hints\":[\"Concesión con frase entera detrás\",\"Even though the bus is ..., I still take a taxi when it rains\"],\"itemIds\":[\"enb1m8eventhough\",\"enb1m8greener\",\"enbus\"],\"tip\":\"Concesión, comparativo y presente de costumbre en una sola frase. Y fíjate en «when it rains»: presente, aunque hables de algo que aún no ha pasado. Esa es la regla del módulo 9.\"},{\"id\":\"enb1m8l9e14\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, SEIS preguntas. Léelas TODAS antes del play y usa el cuaderno: van en el orden de la conversación. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Cuántas botellas ha devuelto la calle en tres semanas?\",\"options\":[\"Unas cuatro mil\",\"Unas cuarenta mil\",\"Unas cuatrocientas\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"«Four thousand» y «forty thousand» se separan por la primera sílaba. Si dudas, apunta las dos y decídelo en la segunda pasada.\",\"Cuatrocientas no se dice. La cifra aparece una sola vez y va con «about».\"],\"itemIds\":[\"enb1m8depositscheme\",\"enb1m8bringback\"],\"tip\":\"Primera pregunta, primer minuto. Y fíjate en el «about»: el examen acepta la cifra aproximada porque el audio la da aproximada.\"},{\"id\":\"enb1m8l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: qué valoración hace, exactamente.\",\"audio\":\"$19\",\"question\":\"¿Qué opina del sistema de devolución?\",\"options\":[\"Que funciona y a la vez es pequeño, y las dos cosas son verdad\",\"Que no sirve para nada\",\"Que es la solución al problema del barrio\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice literalmente «I'm not being negative» y defiende el sistema en la segunda mitad del audio.\",\"Justo lo que evita decir: lo compara con lo que va al cubo negro cada semana para que nadie se emocione.\"],\"itemIds\":[\"enb1m8makeadifference\",\"enb1m8asmallstep\",\"enb1m8tobehonest\"],\"tip\":\"«Two things at the same time, which people don't like» es la definición de una opinión matizada, y es exactamente lo que puntúa en el B1: no elegir bando, sostener los dos lados con un conector.\"},{\"id\":\"enb1m8l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: causa y efecto.\",\"audio\":\"$1a\",\"question\":\"¿Por qué apareció media calle con tarros de cristal?\",\"options\":[\"Porque el folleto llevaba una botella de vidrio en la portada\",\"Porque la máquina aceptaba vidrio al principio\",\"Porque el ayuntamiento lo anunció mal por escrito en la máquina\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La máquina no ha aceptado vidrio en ningún momento: solo plástico y latas.\",\"El error está en el folleto, y en la foto, no en un cartel de la máquina.\"],\"itemIds\":[\"enb1m8thebin\",\"enb1m8recycle\",\"enb1m8singleuse\"],\"tip\":\"Una foto mal elegida vale más que un párrafo bien escrito, y aquí vale por media calle. Es el mismo mecanismo del m4: la imagen viaja y el texto se queda.\"},{\"id\":\"enb1m8l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: el dato que da la mujer del ayuntamiento.\",\"audio\":\"$1b\",\"question\":\"¿Por qué no hay máquina de vidrio?\",\"options\":[\"Porque cuesta el triple y no había dinero para las dos\",\"Porque el vidrio no se recicla en esa ciudad\",\"Porque nadie del barrio la pidió\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Eso no lo dice nadie. Lo que se dice es que la máquina de vidrio existe y cuesta más.\",\"La quieren: la que habla termina diciendo que su caja está llena de tarros.\"],\"itemIds\":[\"enb1m8twiceasmuch\",\"enb1m8energybill\"],\"tip\":\"«Three times as much» — el inglés cuenta las veces donde el español dice «el triple». Repásalo, porque «it costs the triple» es calco puro y se cae en el oral.\"},{\"id\":\"enb1m8l9e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5: concesión. Ojo, que la respuesta llega DESPUÉS del «honestly».\",\"audio\":\"$1c\",\"question\":\"¿Habría preferido que esperaran a hacerlo del todo bien?\",\"options\":[\"No: cree que si hubieran esperado seguirían esperando dentro de cinco años\",\"Sí, porque a medias no sirve\",\"Le da igual, porque el vidrio no le afecta\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo contrario de lo que argumenta: dice que con algo que funciona en la calle es más fácil pedir lo segundo.\",\"Le afecta directamente: su caja de reciclaje son todo tarros, y lo dice al final.\"],\"itemIds\":[\"enb1m8eventhough\",\"enb1m8however\",\"enb1m8insteadof\"],\"tip\":\"«Honestly? No.» — cuando alguien empieza a contestar con «honestly», lo que viene es la opinión de verdad y suele ser la contraria a la que esperabas. En el examen ese arranque es una señal.\"},{\"id\":\"enb1m8l9e19\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 6, la de actitud: qué le molesta que se pierda.\",\"audio\":\"$1d\",\"question\":\"¿Qué idea dice que se pierde siempre en estas discusiones?\",\"options\":[\"Que la gente cree que el ayuntamiento es tonto cuando lo que es, es pobre\",\"Que a nadie le importa el reciclaje de verdad\",\"Que los folletos los escribe gente que no vive en el barrio\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"El audio cuenta lo contrario: cuatro mil botellas en tres semanas y media calle presentándose con tarros.\",\"De quién escribe el folleto no se dice nada.\"],\"itemIds\":[\"enb1m8youvegotapoint\",\"enb1m8itakeyourpoint\",\"enb1m8thewayiseeit\"],\"tip\":\"Dos frases cortas y paralelas —«People assume the council is stupid. Usually the council is poor»— son la forma inglesa de rematar un argumento. Róbasela para el Writing: contraste sin conector, por puro paralelismo.\"}]}],\"resources\":[{\"label\":\"BBC News — Environment\",\"url\":\"https://www.bbc.co.uk/news/science_and_environment\",\"note\":\"Lee UN titular al día durante una semana y apunta los conectores de contraste que encuentres. Cinco minutos diarios, y el oído para argumentar se hace solo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1e:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1e\",\"6\",{}]]\n"])</script></body></html>
