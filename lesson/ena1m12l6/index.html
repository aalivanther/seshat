3cb\u003eParte 1\u003c/b\u003e: presentación — nombre y DELETREO, origen y ~5 preguntas personales: tu guion del módulo 1 (My name is… I'm from… I'm 25 — edad con BE). \u003cb\u003eParte 2\u003c/b\u003e: situaciones cortas — respondes E inicias tú («pide un café», «invita al cine»): tus chunks de siempre con please. \u003cb\u003eParte 3\u003c/b\u003e: fotos — comparas y haces preguntas (There is… / Is there…?). \u003cb\u003eParte 4\u003c/b\u003e: el mini-tema — 30 segundos para pensar y ~1 minuto hablando (tu día favorito, tu comida…): 5-6 frases del curso encadenadas bastan. Dos salvavidas que SUMAN puntos: \u003cb\u003eCan you say that again, please?\u003c/b\u003e si no entiendes, y \u003cb\u003eLet me think…\u003c/b\u003e para comprar tiempo sin silencio.\",\"table\":[[\"Parte\",\"Qué haces\",\"Tu arma\"],[\"1\",\"presentarte y deletrear\",\"el guion del módulo 1\"],[\"2\",\"responder E iniciar situaciones\",\"Can I have…, please?\"],[\"3\",\"hablar de fotos\",\"There is… / Is there…?\"],[\"4\",\"30 s prep + 1 min de tema\",\"Let me think… + 5-6 frases\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m12l6e1\",\"type\":\"mc\",\"prompt\":\"La Parte 4, sin miedo\",\"question\":\"Te dan el mini-tema y entonces…\",\"options\":[\"Tienes 30 segundos para pensar y ~1 minuto para hablar\",\"Escribes 50 palabras sobre el tema\",\"El examinador habla y tú escuchas\"],\"answer\":0,\"whyWrong\":[null,\"El oral no se escribe: se habla\",\"El minuto es TUYO — el examinador escucha y luego pregunta\"],\"itemIds\":[\"enletmethink\"],\"tip\":\"En los 30 segundos monta 5-6 frases del curso. No inventes inglés nuevo en el examen.\"},{\"id\":\"ena1m12l6e2\",\"type\":\"speak\",\"prompt\":\"Parte 1: tu presentación — léela como si fuera la tuya\",\"text\":\"My name is Valeria. I'm from Colombia and I live in London. I'm twenty-five years old.\",\"phonetic\":\"mai néim is̬ va-LE-ria · aim from ko-LOM-bia and ai liv in LAN-don · aim TUÉN-ti-faiv yías̬ óuld\",\"translation\":\"Me llamo Valeria. Soy de Colombia y vivo en Londres. Tengo veinticinco años.\",\"itemIds\":[\"enexam\"],\"tip\":\"I'm twenty-five: edad con BE. Ensaya el guion con TUS datos hasta que salga solo.\"},{\"id\":\"ena1m12l6e3\",\"type\":\"speak\",\"prompt\":\"Parte 1: deletrea el apellido de Amy en voz alta\",\"text\":\"W, R, I, G, H, T\",\"phonetic\":\"DÁ-bol-yu, aa, ái, dyíi, éich, tíi\",\"translation\":\"W-R-I-G-H-T (Wright, el apellido de Amy)\",\"itemIds\":[\"endouble\"],\"tip\":\"Las traicioneras: I=«ái», G=«dyíi», H=«éich». Deletrea TU nombre una vez al día hasta el examen.\"},{\"id\":\"ena1m12l6e4\",\"type\":\"mc\",\"prompt\":\"Parte 2, tal cual: inicia tú la situación\",\"question\":\"Situación: estás en un café. Inicia tú — pide un té.\",\"options\":[\"Can I have a tea, please?\",\"Give me a tea.\",\"I am a tea.\"],\"answer\":0,\"whyWrong\":[null,\"Sin please suena a orden — en el examen, siempre Can I…, please?\",\"¡Eso es SER un té! Para pedir: Can I have…?\"],\"itemIds\":[\"encanyousaythatagain\"],\"tip\":\"Iniciar puntúa doble: Can I have… / Excuse me… / Do you want… — sal tú primero.\"},{\"id\":\"ena1m12l6e5\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? El examinador, en versión rápida\",\"book\":\"And what do you do?\",\"real\":\"And whaddya do?\",\"translation\":\"¿Y tú a qué te dedicas?\",\"itemIds\":[\"encanyousaythatagain\"],\"tip\":\"whaddya = what do you fundido — ya lo cazaste en el módulo 9; en el oral reaparece seguro. Responde tu trabajo: I'm a… / I work in… Y si no lo pillas: Can you say that again, please?\"},{\"id\":\"ena1m12l6e6\",\"type\":\"shadow\",\"prompt\":\"Parte 4: sombrea el arranque del mini-tema\",\"text\":\"Let me think… My favourite day is Saturday. I play football and I watch films.\",\"phonetic\":\"let mi zink… mai FÉI-vrit déi is̬ SÁ-ta-dei\",\"translation\":\"Déjame pensar… Mi día favorito es el sábado. Juego al fútbol y veo películas.\",\"reps\":2,\"itemIds\":[\"enletmethink\"],\"tip\":\"Let me think… compra 3 segundo
