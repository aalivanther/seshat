"ensupermarket\"]},{\"id\":\"ena1m7l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa — cuenta las ventanas\",\"text\":\"There ___ two big windows in the living room.\",\"answers\":[\"are\"],\"translation\":\"Hay dos ventanas grandes en el salón.\",\"hints\":[\"two = más de una\",\"there A-R-E\"],\"itemIds\":[\"enwindow\",\"enlivingroom\"]},{\"id\":\"ena1m7l8e6\",\"type\":\"transform\",\"prompt\":\"Transforma: pregúntalo\",\"source\":\"There's a garden behind the house.\",\"instruction\":\"No estás seguro — pregunta si lo hay\",\"answers\":[\"Is there a garden behind the house?\",\"Is there a garden behind the house\"],\"translation\":\"¿Hay un jardín detrás de la casa?\",\"hints\":[\"there is dado la vuelta\",\"Is there ...?\"],\"itemIds\":[\"engarden\",\"enhouse\"]},{\"id\":\"ena1m7l8e7\",\"type\":\"build\",\"prompt\":\"Construye — sitúa la puerta\",\"target\":\"The door is next to the window\",\"translation\":\"La puerta está al lado de la ventana\",\"distractors\":[\"under\",\"behind\"],\"itemIds\":[\"endoor\",\"enwindow\",\"ennexttothesofa\"]},{\"id\":\"ena1m7l8e9\",\"type\":\"read\",\"prompt\":\"Lee el texto y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Two homes in London\",\"text\":\"Valeria has a new flat in London. It's small, but she loves it. There's one bedroom, a small kitchen and a living room with two big windows. There isn't a garden, but the park is very near: five minutes from her door.\u003cbr/\u003e\u003cbr/\u003eHer friend Ben lives in a house. There are three bedrooms, a big kitchen and a garden behind the house. Ben's house is big and [[quiet|tranquila]], but it isn't in the [[centre|centro]] of London: every morning he needs an [[hour|hora]] to go to work.\u003cbr/\u003e\u003cbr/\u003e\\\"Your house is lovely,\\\" says Valeria. \\\"Yes,\\\" says Ben. \\\"But you are at home in ten minutes. I am not.\\\"\",\"questions\":[{\"id\":\"ena1m7l8e9q1\",\"q\":\"How many bedrooms are there in Valeria's flat?\",\"options\":
