cabe \u003ci\u003edespite\u003c/i\u003e; si detrás hay un sustantivo, no cabe \u003ci\u003ealthough\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 2 — un texto con seis frases extraídas y siete para elegir (6 puntos).\u003c/b\u003e \u003cb\u003eUna sobra siempre.\u003c/b\u003e Lo que se mide aquí es si reconoces la función de cada frase: la que abre el tema, la que desarrolla, la que contrasta, la que da un ejemplo, la que resume. Y la pista casi siempre es \u003cb\u003euna palabra que ata\u003c/b\u003e: un pronombre (\u003ci\u003eit, they, this, that\u003c/i\u003e), un posesivo, un conector, un artículo determinado que remite a algo ya nombrado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePregúntate siempre: ¿a qué se refiere ese «it»?\u003c/b\u003e Si la frase candidata empieza por \u003ci\u003e«They were furious about it»\u003c/i\u003e, el hueco tiene que ir detrás de algo en plural y de algo que enfade. Eso descarta cuatro de las siete sin leer nada más.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí caen dos de tus tres trampas reinas.\u003c/b\u003e Los \u003cb\u003econectores\u003c/b\u003e, porque el examen los usa como cierre de cada hueco; y las \u003cb\u003erelativas\u003c/b\u003e, porque el inglés escrito cose frases largas con \u003ci\u003ewho, which, whose, where\u003c/i\u003e — y porque el inglés \u003cb\u003epuede quitar el relativo\u003c/b\u003e (\u003ci\u003ethe job I applied for\u003c/i\u003e) mientras que el «que» español no se puede quitar jamás. Si no reconoces esa costura, el texto te parece que le falta una palabra."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l4\",\"phaseId\":\"enb1m12\",\"title\":\"Reading: what holds the text together\",\"subtitle\":\"Cinco huecos de cohesión y seis frases extraídas — y la frase que sobra\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de la costura\",\"itemIds\":[\"enb1m12thegap\",\"enb1m12onesentenceisnotneeded\",\"enb1m12thelinkingword\",\"enb1m12whatdoesitreferto\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Las dos primeras partes del Reading no van de vocabulario\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las palabras de la costura\",\"pairs\":[{\"target\":\"the gap\",\"source\":\"el hueco\"},{\"target\":\"the linking word\",\"source\":\"la palabra que ata dos frases\"},{\"target\":\"One sentence is not needed.\",\"source\":\"Una frase sobra.\"},{\"target\":\"What does 'it' refer to?\",\"source\":\"¿A qué se refiere ese «it»?\"}],\"itemIds\":[\"enb1m12thegap\",\"enb1m12thelinkingword\",\"enb1m12onesentenceisnotneeded\",\"enb1m12whatdoesitreferto\"],\"tip\":\"«refer to» lleva su preposición pegada, como «depend on» o «look forward to». Es una unidad léxica: se aprende entera o no se aprende.\"},{\"id\":\"enb1m12l4e2\",\"type\":\"mc\",\"prompt\":\"Qué se prueba en la Parte 1 del Reading\",\"question\":\"Los cinco huecos de la Parte 1 suelen pedir…\",\"options\":[\"la pieza que cose el texto: un conector, un pronombre, una preposición.\",\"una palabra de vocabulario difícil de nivel B1.\",\"el verbo principal de la frase.\"],\"answer\":0,\"whyWrong\":[null,\"El vocabulario raro se mide en la Parte 4. Aquí lo que se mide es si entiendes cómo encaja un texto.\",\"El verbo suele estar dado: si te lo quitaran, la frase no se sostendría lo bastante para elegir nada.\"],\"itemIds\":[\"enb1m12thegap\",\"enb1m12thelinkingword\"],\"tip\":\"Buena noticia: eso significa que no hace falta saber más palabras, hace falta reconocer estructuras. Y las estructuras son una lista corta.\"},{\"id\":\"enb1m12l4e3\",\"type\":\"gapbank\",\"prompt\":\"Parte 1 en su formato real: elige la pieza de cada hueco\",\"text\":\"___ the course is free, you have to pay the exam fee yourself. The centre can lend you a past paper, but the recordings are missing from it, and ___ we advise you to buy the official one, which comes with the audio. Book early: ___ you book before the end of the month, there may be no places left.\",\"answers\":[\"Although\",\"therefore\",\"unless\"],\"bank\":[\"Although\",\"therefore\",\"unless\",\"despite\",\"otherwise\",\"so that\"],\"translation\":\"Aunque el curso es gratis, la tasa de examen la pagas tú. El centro te puede prestar un examen antiguo, pero le faltan las grabaciones, y por eso te aconsejamos comprar el oficial, que viene con el audio. Reserva pronto: si no reservas antes de fin de mes, puede que no queden plazas.\",\"itemIds\":[\"enb1m1although\",\"enb1m1therefore\",\"enb1m1unless\"],\"tip\":\"Los tres distractores son los tres errores clásicos: «despite» pide sustantivo y detrás hay frase entera; «otherwise» apunta a la consecuencia de no hacerlo, no a la condición; y «so that» introduce finalidad, que aquí no hay.\"},{\"id\":\"enb1m12l4e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige: el conector duplicado\",\"wrong\":\"Although the course is free, but you pay the exam fee.\",\"answers\":[\"Although the course is free, you pay the exam fee.\"],\"why\":\"En español decimos «aunque el curso es gratis, \u003cb\u003epero\u003c/b\u003e la tasa la pagas tú» y no chirría. En inglés, \u003cb\u003eun contraste se marca UNA vez\u003c/b\u003e: o \u003ci\u003ealthough\u003c/i\u003e al principio, o \u003ci\u003ebut\u003c/i\u003e en medio, nunca los dos. Lo mismo con \u003ci\u003ebecause… so…\u003c/i\u003e y con \u003ci\u003eeven though… however…\u003c/i\u003e: en cuanto pones dos, la segunda sobra.\",\"translation\":\"Aunque el curso es gratis, la tasa de examen la pagas tú.\",\"itemIds\":[\"enb1m1although\"]},{\"id\":\"enb1m12l4e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la relativa\",\"wrong\":\"The teacher that I saw her yesterday works here.\",\"answers\":[\"The teacher that I saw yesterday works here.\",\"The teacher I saw yesterday works here.\"],\"why\":\"El español coloquial repite el pronombre —«la profesora que la vi ayer»— y en inglés eso es un error duro: \u003cb\u003eel relativo YA es el objeto\u003c/b\u003e, así que «her» sobra. Se llama pronombre reasumido y es de los que fosilizan si nadie interviene. Y de paso, fíjate en la otra mitad de la trampa: en inglés el relativo de objeto \u003cb\u003ese puede quitar\u003c/b\u003e («The teacher I saw yesterday»), cosa que el «que» español no permite nunca.\",\"translation\":\"La profesora que vi ayer trabaja aquí.\"},{\"id\":\"enb1m12l4e6\",\"type\":\"mc\",\"prompt\":\"El relativo que desaparece\",\"question\":\"«El trabajo al que me presenté era en la biblioteca.» ¿Cuál es correcta?\",\"options\":[\"The job I applied for was at the library.\",\"The job that I applied for it was at the library.\",\"The job which I applied was at the library.\"],\"answer\":0,\"whyWrong\":[null,\"«it» sobra: el relativo ya hace de objeto de «applied for».\",\"Falta la preposición. «apply» va siempre con «for», y en la relativa la preposición se queda al final: «the job which I applied FOR».\"],\"itemIds\":[\"enb1m2applyfor\"],\"tip\":\"Que la preposición se quede colgando al final es normalísimo y correcto en inglés: «the person I work with», «the flat we moved into». Al hispanohablante le suena a frase sin terminar, y por eso la evita — y por eso su inglés escrito suena más pobre de lo que es.\"},{\"id\":\"enb1m12l4e7\",\"type\":\"order\",\"prompt\":\"Parte 2: reconstruye el párrafo. Fíjate en los pronombres y los conectores, no en el sentido general.\",\"sentences\":[\"Most people prepare for the exam on their own.\",\"That is cheaper, of course, and it fits around a job.\",\"The problem is that nobody ever times them.\",\"As a result, they arrive on the day having never written under pressure.\",\"For that reason the centre now runs two full mock papers before every session.\"],\"translation\":\"La mayoría se prepara por su cuenta. Sale más barato, claro, y encaja con el trabajo. El problema es que nadie les cronometra. Por eso llegan al día del examen sin haber escrito nunca a contrarreloj. Por eso mismo el centro hace ahora dos simulacros completos antes de cada convocatoria.\",\"tip\":\"Cada frase se ata a la anterior con una pieza: «That» remite a prepararse solo, «them» a esas personas, «As a result» a lo del cronómetro. Si sigues la cadena de pronombres, el orden sale solo aunque no entiendas el tema.\"},{\"id\":\"enb1m12l4e8\",\"type\":\"mc\",\"prompt\":\"Parte 2: cómo se descarta la frase que sobra\",\"question\":\"El hueco va detrás de «The centre entered nine hundred candidates last year.» ¿Cuál encaja?\",\"options\":[\"Most of them had never sat a formal exam before.\",\"It costs eighty pounds and lasts two hours and forty minutes.\",\"She has been running the centre since 2011.\"],\"answer\":0,\"whyWrong\":[null,\"«It» tendría que remitir a algo en singular ya nombrado. Lo último nombrado son novecientos candidatos: no encaja.\",\"«She» no tiene antecedente: en la frase anterior no hay ninguna mujer. La frase es correcta, pero no cuelga de aquí.\"],\"itemIds\":[\"enb1m12whatdoesitreferto\",\"enb1m12onesentenceisnotneeded\"],\"tip\":\"Este es el método entero de la Parte 2: por cada frase candidata, busca su primera palabra que remita a algo (it, they, them, this, she) y comprueba si eso existe justo antes del hueco. Descartas cuatro sin entender el texto.\"},{\"id\":\"enb1m12l4e9\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿qué le pones detrás a cada conector?\",\"categories\":[\"+ frase entera (sujeto y verbo)\",\"+ sustantivo o -ing\"],\"items\":[{\"text\":\"although\",\"bucket\":0},{\"text\":\"in spite of\",\"bucket\":1},{\"text\":\"because\",\"bucket\":0},{\"text\":\"because of\",\"bucket\":1},{\"text\":\"while\",\"bucket\":0},{\"text\":\"despite\",\"bucket\":1}],\"itemIds\":[\"enb1m1although\",\"enb1m1despite\",\"enb1m2while\"],\"tip\":\"Esta es media Parte 1 del Reading. Cuando veas el hueco, mira PRIMERO qué hay detrás: si hay sujeto y verbo, la mitad de las opciones se caen solas sin pensar en el significado.\"},{\"id\":\"enb1m12l4e10\",\"type\":\"cloze\",\"prompt\":\"Completa la instrucción de la Parte 2\",\"text\":\"There are seven sentences for six gaps: one sentence is not ___.\",\"answers\":[\"needed\"],\"translation\":\"Hay siete frases para seis huecos: una frase sobra.\",\"hints\":[\"Del verbo «to need»\",\"nee-ded\"],\"itemIds\":[\"enb1m12onesentenceisnotneeded\"],\"tip\":\"Y aprovéchalo: si al final te sobran dos frases y te falta un hueco, es que has colocado una mal. La frase de más es una herramienta de control, no un castigo.\"},{\"id\":\"enb1m12l4e11\",\"type\":\"gapbank\",\"prompt\":\"Completa las relativas del folleto del centro\",\"text\":\"The woman ___ runs the centre is from Leeds. The room ___ we take the exam is on the ground floor. That is the reason ___ the class moved downstairs.\",\"answers\":[\"who\",\"where\",\"why\"],\"bank\":[\"who\",\"where\",\"why\",\"whose\",\"when\",\"which\"],\"translation\":\"La mujer que dirige el centro es de Leeds. La sala en la que hacemos el examen está en la planta baja. Esa es la razón por la que la clase se mudó abajo.\",\"tip\":\"El relativo lo elige lo que va DELANTE, no lo que va detrás: persona → who · sitio → where · momento → when · razón → why · posesión → whose. Es una lista de cinco y no tiene excepciones útiles a este nivel.\"},{\"id\":\"enb1m12l4e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Aunque el texto es largo, la frase que sobra siempre se nota.\",\"answers\":[\"Although the text is long, the extra sentence is always noticeable\",\"Although the text is long, you can always spot the sentence that is not needed\",\"Although the text is long, the sentence that is not needed always stands out\"],\"hint\":\"Empieza por el conector de contraste que va con frase entera\",\"itemIds\":[\"enb1m1although\",\"enb1m12onesentenceisnotneeded\"],\"tip\":\"Fíjate en que «la frase que sobra» se dice con relativa: «the sentence that is not needed». Aquí el relativo es SUJETO, así que no se puede quitar. Solo se quita el de objeto.\"},{\"id\":\"enb1m12l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lee a los dos lados del hueco y pregúntate a qué se refiere ese «it».\",\"answers\":[\"Read both sides of the gap and ask yourself what 'it' refers to\",\"Read on both sides of the gap and ask yourself what 'it' refers to\",\"Read before and after the gap and ask yourself what 'it' refers to\"],\"hints\":[\"Dos imperativos unidos por «and»\",\"Read both sides of the gap and ask yourself what…\"],\"itemIds\":[\"enb1m12thegap\",\"enb1m12whatdoesitreferto\"],\"tip\":\"Esa pregunta —«¿a qué se refiere ese it?»— es la que resuelve la Parte 1, la Parte 2 y media Parte 4. Si te la haces en voz baja mientras lees, ya estás leyendo como un B1.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"si
