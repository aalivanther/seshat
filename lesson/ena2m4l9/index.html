eza por lo que comparten, que además te da tiempo para pensar. \u003ci\u003eIn both pictures I can see a shop. They're very similar.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e2. Las diferencias.\u003c/b\u003e Aquí van los comparativos, que es lo que se puntúa. \u003ci\u003eThe first one is bigger than the second one, but the second one is cheaper.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Tu preferencia.\u003c/b\u003e \u003ci\u003eI prefer the second one.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e4. La razón.\u003c/b\u003e Nunca la dejes fuera: el descriptor del A2 pide opiniones \u003cb\u003econ razón\u003c/b\u003e. \u003ci\u003e…because it's cheaper and it isn't as busy.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eDos avisos de examinador:\u003cbr/\u003e• \u003cb\u003eNo describas cada foto por separado y en orden.\u003c/b\u003e Eso es la Parte 2. Aquí hay que \u003cb\u003ecruzar\u003c/b\u003e las dos, y el cruce se hace con \u003ci\u003ethan\u003c/i\u003e, con \u003ci\u003eboth\u003c/i\u003e y con \u003ci\u003ebut\u003c/i\u003e.\u003cbr/\u003e• \u003cb\u003eSi no sabes cómo se llama algo, no te calles.\u003c/b\u003e Compáralo igual: \u003ci\u003ethe thing in the first picture is bigger\u003c/i\u003e. Se puntúa el idioma que produces, no tu vocabulario de objetos."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l9\",\"phaseId\":\"ena2m4\",\"title\":\"Two pictures, one minute\",\"subtitle\":\"La Parte 3 del oral, montada de principio a fin con lo de este módulo\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas que abren y cierran la Parte 3\",\"itemIds\":[\"ena2m4inbothpictures\",\"ena2m4inthefirstpicture\",\"ena2m4theyreverysimilar\",\"ena2m4iprefertheseconone\",\"ena2m4thedifferenceisthat\",\"ena2m1howaboutyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La Parte 3 no se improvisa: son cuatro bloques y siempre los mismos\",\"body\":\"$17\",\"table\":[[\"bloque\",\"fórmula\",\"qué demuestras\"],[\"1. semejanzas\",\"In both pictures… They're very similar.\",\"que has entendido la tarea\"],[\"2. diferencias\",\"The first one is bigger than…\",\"comparativos (lo que puntúa)\"],[\"3. preferencia\",\"I prefer the second one.\",\"opinión\"],[\"4. razón\",\"…because it's cheaper.\",\"opinión CON razón: el descriptor A2\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — esto ya es tuyo\",\"pairs\":[{\"target\":\"cheaper than\",\"source\":\"más barato que\"},{\"target\":\"the most expensive\",\"source\":\"el más caro\"},{\"target\":\"better\",\"source\":\"mejor\"},{\"target\":\"the worst\",\"source\":\"el peor\"},{\"target\":\"much bigger\",\"source\":\"mucho más grande\"}],\"targetSeconds\":30,\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4themostexpensive\",\"ena2m4goodbetterbest\",\"ena2m4theworstday\",\"ena2m4muchcheaper\"],\"tip\":\"Cinco fórmulas, y con ellas se contesta cualquier Parte 3. La velocidad importa: en el examen no hay tiempo de reconstruirlas.\"},{\"id\":\"ena2m4l9e2\",\"type\":\"order\",\"prompt\":\"Ordena la respuesta de la Parte 3\",\"sentences\":[\"In both pictures I can see a kitchen, so they're very similar.\",\"But the first kitchen is much bigger than the second one.\",\"The second one is smaller, and it hasn't got enough room for a table.\",\"I prefer the first one because it's the biggest and it has a window.\"],\"translation\":\"En las dos fotos veo una cocina, así que se parecen mucho. Pero la primera cocina es mucho más grande que la segunda. La segunda es más pequeña y no tiene sitio suficiente para una mesa. Prefiero la primera porque es la más grande y tiene ventana.\",\"itemIds\":[\"ena2m4inbothpictures\",\"ena2m4theyreverysimilar\",\"ena2m4muchcheaper\",\"ena2m4enoughroom\",\"ena2m4iprefertheseconone\",\"enkitchen\",\"enwindow\"],\"tip\":\"Semejanza, diferencia, detalle, preferencia con razón. Los cuatro bloques, en ese orden. Apréndete el orden y ya solo tienes que rellenarlo.\"},{\"id\":\"ena2m4l9e3\",\"type\":\"mc\",\"prompt\":\"Cómo se empieza\",\"question\":\"Te ponen dos fotos y te piden compararlas. ¿Cuál es la mejor primera frase?\",\"options\":[\"In both pictures I can see a shop.\",\"In the first picture there is a shop. It is red. It has a door.\",\"I like the first picture.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es describir una foto (Parte 2). Aquí te piden cruzar las dos desde el principio\",\"La preferencia va al final, y sin razón no puntúa como opinión de A2\"],\"itemIds\":[\"ena2m4inbothpictures\"],\"tip\":\"Empezar por lo que comparten tiene dos ventajas: demuestra que has entendido la tarea y te regala cinco segundos para pensar la diferencia.\"},{\"id\":\"ena2m4l9e4\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula de la semejanza\",\"text\":\"In ___ pictures I can see a kitchen.\",\"answers\":[\"both\"],\"translation\":\"En las dos fotos veo una cocina.\",\"hints\":[\"Es la palabra inglesa para «las dos», y no lleva the delante\",\"b…\"],\"itemIds\":[\"ena2m4inbothpictures\",\"enkitchen\"]},{\"id\":\"ena2m4l9e5\",\"type\":\"bucket\",\"prompt\":\"¿Esta frase dice una semejanza o una diferencia?\",\"categories\":[\"semejanza\",\"diferencia\"],\"items\":[{\"text\":\"They're very similar.\",\"bucket\":0},{\"text\":\"The first one is bigger than the second one.\",\"bucket\":1},{\"text\":\"In both pictures I can see a shop.\",\"bucket\":0},{\"text\":\"It's the same as the other one.\",\"bucket\":0},{\"text\":\"The second one is much cheaper.\",\"bucket\":1},{\"text\":\"The difference is that this one has a garden.\",\"bucket\":1}],\"itemIds\":[\"ena2m4theyreverysimilar\",\"ena2m4inbothpictures\",\"ena2m4thesameasmine\",\"ena2m4thedifferenceisthat\",\"engarden\"],\"tip\":\"El examinador pide las dos cosas. Si solo dices diferencias, has hecho media tarea aunque el inglés sea impecable.\"},{\"id\":\"ena2m4l9e6\",\"type\":\"errorfix\",\"prompt\":\"Espiral — corrige el doble comparativo\",\"wrong\":\"The first shop is more cheaper than the second one.\",\"answers\":[\"The first shop is cheaper than the second one.\"],\"why\":\"cheaper ya lleva el «más» dentro. En la Parte 3 este error sale mucho porque hablas rápido y traduces «más barato» pieza a pieza. Elige una marca: -er o more, nunca las dos.\",\"translation\":\"La primera tienda es más barata que la segunda.\",\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4inthefirstpicture\"]},{\"id\":\"ena2m4l9e7\",\"type\":\"errorfix\",\"prompt\":\"Espiral — corrige el «que» y verás que aquí SÍ era that\",\"wrong\":\"The difference is than this one is bigger.\",\"answers\":[\"The difference is that this one is bigger.\"],\"why\":\"Aquí no hay comparación entre «difference» y nada: lo que viene detrás es una subordinada, y las subordinadas van con THAT. El than se guarda para cuando hay un comparativo justo delante (bigger than, better than). Fíjate en que en la misma frase conviven las dos: «is THAT this one is BIGGER».\",\"translation\":\"La diferencia es que este es más grande.\",\"itemIds\":[\"ena2m4thedifferenceisthat\",\"ena2m4than\"],\"tip\":\"Esta frase es el mejor resumen del módulo: lleva un that de subordinada y un comparativo, y demuestra que ya sabes cuál va dónde.\"},{\"id\":\"ena2m4l9e8\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"Prefiero la segunda porque es más barata y no está tan llena.\",\"answers\":[\"I prefer the second one because it's cheaper and it isn't as busy.\",\"I prefer the second one because it's cheaper and it isn't so busy.\"],\"hint\":\"empieza por el verbo de la preferencia\",\"itemIds\":[\"ena2m4iprefertheseconone\",\"ena2m4ascheapas\",\"enbusy\"],\"tip\":\"«I prefer», no «I prefer more»: prefer ya lleva la comparación dentro, como better.\"},{\"id\":\"ena2m4l9e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"It's cheaper than the other one.\",\"forbid\":[\"cheaper\",\"than\"],\"answers\":[\"The other one is more expensive.\",\"It isn't as expensive as the other one.\"],\"translation\":\"Es más barato que el otro.\",\"itemIds\":[\"ena2m4moreexpensive\",\"ena2m4ascheapas\"],\"tip\":\"En el oral, cuando una palabra no te sale, dale la vuelta a la frase. Un examinador valora más el rodeo que el silencio.\"},{\"id\":\"ena2m4l9e10\",\"type\":\"write\",\"prompt\":\"Escribe la comparación — 30-50 palabras\",\"scenario\":\"Emma, tu amiga de Manchester, te pregunta por email cuál de los dos pisos que has visto vas a coger. Contéstale comparándolos.\",\"bullets\":[\"Compara los dos pisos con una frase con than\",\"Di cuál es el máximo de algo, con un superlativo (the … est / the most …)\",\"Di cuál prefieres\"],\"checks\":[{\"re\":\"\\\\b\\\\w+er than\\\\b|\\\\bmore \\\\w+ than\\\\b\",\"label\":\"una comparación con than\"},{\"re\":\"\\\\bthe (\\\\w+est|most \\\\w+)\\\\b\",\"label\":\"un superlativo con the\"},{\"re\":\"\\\\bi prefer\\\\b|\\\\bi'd prefer\\\\b|\\\\bi like .{0,20}better\\\\b\",\"label\":\"cuál prefieres\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"direct\",\"requireConnectors\":{\"min\":2,\"bank\":[\"but\",\"because\",\"and\",\"so\"]},\"model\":\"Hi Emma! I saw two flats yesterday. The one in Church Street is bigger than the other one, but it's the most expensive flat in the street. The second one is smaller and much cheaper. I prefer the second one because it's near the station. Valeria\",\"itemIds\":[\"ena2m4biggerthanmine\",\"ena2m4themostexpensive\",\"ena2m4iprefertheseconone\",\"ena2m4muchcheaper\",\"enflat\"],\"tip\":\"El corrector busca primero los tres contenidos y solo después la gramática. Comparación, superlativo y preferencia: si están los tres, ya tienes el aprobado del ejercicio.\"},{\"id\":\"ena2m4l9e11\",\"type\":\"monologue\",\"prompt\":\"El minuto de verdad: compara dos sitios que conozcas\",\"topic\":\"Dos tiendas o dos cafés de tu barrio\",\"slides\":[{\"title\":\"1. Lo que tienen en común\",\"hint\":\"Empieza por ahí: They're very similar. Both of them are near my house. / In both places you can…\"},{\"title\":\"2. Las diferencias\",\"hint\":\"Aquí van los comparativos: The first one is bigger / cheaper / better than… · The second one is more expensive…\"},{\"title\":\"3. El máximo\",\"hint\":\"Un superlativo, con su preposición: It's the cheapest shop in my street. / It's the best coffee in the neighbourhood.\"},{\"title\":\"4. Cuál prefieres y por qué\",\"hint\":\"I prefer the first one because… No dejes fuera la razón: es lo que pide el descriptor de A2.\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He empezado por una semejanza, no por una diferencia\",\"He usado al menos tres comparativos con than\",\"He usado un superlativo con the y con la preposición correcta (in)\",\"He dicho cuál prefiero\",\"He dado la razón con because\"],\"model\":\"There are two shops near my house and they're very similar: both of them open at eight and both of them sell bread and milk. But the first one is much bigger than the second one, and it's cheaper too. The second one is smaller and more expensive, but it's nicer inside and the woman there is very friendly. The first one is the cheapest shop in my street, and it's the best for a big shopping list. In the end I prefer the second one, because it's nearer and because I know the people. And the bread is better!\",\"itemIds\":[\"ena2m4theyreverysimilar\",\"ena2m4muchcheaper\",\"ena2m4thecheapestinthe\",\"ena2m4iprefertheseconone\",\"ena2m4thebestcoffee\"],\"tip\":\"Grábate las dos veces. La segunda pasada siempre sale más suelta y con menos silencios: esa es la que se parece al examen. Y cuéntalas: tres comparativos y un superlativo son la nota.\"},{\"id\":\"ena2m4l9e12\",\"type\":\"speak\",\"prompt\":\"La respuesta modelo, en voz alta\",\"text\":\"In both pictures I can see a shop. They're very similar, but the first one is bigger and the second one is much cheaper.\",\"phonetic\":\"in bóuz PÍK-chas̬ ái kan sii
