js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Td14,"])</script><script>self.__next_f.push([1,"Herr Vogel, 74, dritter Stock, Prenzlauer Berg, hat den Brief in der Küche an den Kühlschrank gehängt, neben den Mietspiegel. Der Vermieter kündigt wegen Eigenbedarfs. Die Tochter, heißt es, brauche die Wohnung. Angesichts der Begründung, die auf einem einzigen Satz besteht, hat Vogel Widerspruch eingelegt. Hinsichtlich der Miete liegt er unter dem Spiegel, nicht darüber. Anhand der Zahlen, die das Bezirksamt im März veröffentlicht hat, wäre eine Erhöhung von acht Prozent das Höchste gewesen — keine Kündigung.\n\nBezüglich des Eigenbedarfs verlangt das Mietrecht Papiere. Seitens der Hausverwaltung kam ein Anruf, kein Schreiben. Mangels gültiger Dokumente, schreibt Vogel in seiner Stellungnahme, sei der Bedarf nicht nachgewiesen. «Der hat nix in der Hand», sagt er, und dann, weil Sofía Marín am Tisch sitzt, die Übersetzung: «Mangels Unterlagen.» Im Zuge der Anmeldung, vor zwölf Jahren, hat er jede Bescheinigung abgegeben, die das Bürgeramt wollte. Der Sachbearbeiter, dessen Aktenzeichen jetzt auf dem Bescheid steht, hat ihm damals die Hand geschüttelt.\n\nDie Verdrängung aus dem Kiez ist keine Metapher. Der Wohnraum, der in den neunziger Jahren noch bezahlbar war, wird anhand von Inseraten teurer, nicht anhand von Löhnen. Infolge von Modernisierungen, die niemand bestellt hat, steigen die Nebenkosten. Zugunsten der Eigentümer legt jede Unschärfe im Gesetz den Zweifel nach oben aus. Die Gemeinde, zuständig für den Bebauungsplan, tritt mit Beschlüssen in Kraft, die auf dem Papier Schutz versprechen. Ob sie ihn halten, sieht man an den Umzugswagen.\n\nEin Kasten aus Wien, Ottakring, zeigt eine andere Schraube und dieselbe Bewegung. Die Gemeindewohnung*, die der Bezirk noch besitzt, wird «im Jänner* neu vergeben», schreibt die Bezirkszeitung. Anhand der Warteliste, die auf der Stiege* des Amtes hängt, dauert es drei Jahre. Wer keine Gemeindewohnung bekommt, sucht auf dem freien Markt — und findet, hinsichtlich der Preise, Berlin. Der Konsumentenschutz hilft bei Verträgen. Bei Eigenbedarf hilft er nicht. Da hilft der Widerspruch, oder er hilft nicht.\n\nDer Mieterverein, den Vogel seit den achtziger Jahren kennt, rät zur Schlichtungsstelle, bevor man klagt. Die Hausverwaltung kennt das Spiel. Der Eigentümer auch. Anhand der Wohnfläche und der Nebenkostenabrechnung, die Vogel in einem Einschreiben nachgereicht hat, wäre eine Staffelmiete das Äußerste gewesen — keine Kündigung. Milieuschutz und Zweckentfremdung stehen im Bezirk auf dem Papier. Ob sie den dritten Stock halten, ist eine andere Akte.\n\nWas wäre zu überlegen? Sofía würde eher dafür plädieren, den Eigenbedarf an echte Nachweise zu binden, nicht an einen Satz. Herr Vogel ist konkreter. «Hiermit lege ich Widerspruch ein. Das hab ich schon. Jetzt soll die Behörde die Akte lesen, bevor der Bescheid rechtskräftig wird.» Die Widerspruchsfrist läuft in acht Tagen ab. Nachdem der Brief, den niemand persönlich erklärt hat, in Kraft zu treten droht, geht er donnerstags ins Amt. Junges Volk, sagt er, geht nicht mehr hin. Er schon. Wer einen Wohnberechtigungsschein hat, sucht trotzdem. Die ortsübliche Vergleichsmiete steigt schneller als jede Meldebescheinigung.\n\n*Gemeindewohnung = österr. für eine kommunale Sozialwohnung · *Jänner = österr. für Januar · *Stiege = österr. für Treppe"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m8l6\",\"phaseId\":\"b2m8\",\"title\":\"Lesen: wem gehört die Wohnung?\",\"subtitle\":\"Eigenbedarf, Mietspiegel y una Gemeindewohnung vienesa\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Palabras de ciudad que verás en el texto\",\"itemIds\":[\"b2m8sozialwohnung\",\"b2m8gemeindewohnung\",\"b2m8verdrangung\",\"b2m8wohnraum\",\"buergeramt\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto que apila genitivos\",\"body\":\"Subraya cada \u003cb\u003eangesichts / hinsichtlich / mangels / anhand\u003c/b\u003e: detrás va un genitivo, y ahí suele estar la clave. Las relativas largas se deshacen: busca el sustantivo de delante y el verbo de detrás.\u003cbr/\u003e\u003cbr/\u003eEl recuadro es de Viena: \u003ci\u003eGemeindewohnung\u003c/i\u003e en lugar de Sozialwohnung, \u003ci\u003eJänner\u003c/i\u003e, \u003ci\u003eGrätzl\u003c/i\u003e ya lo viste. Notas a pie.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m8l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje. Las preguntas van en alemán.\",\"title\":\"Eigenbedarf — und der Mietspiegel darunter\",\"source\":\"Stadtleben (Berlin), mit einem Kasten aus Wien\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m8l6e1q1\",\"q\":\"Warum hat Herr Vogel Widerspruch eingelegt?\",\"options\":[\"Wegen einer Eigenbedarfskündigung, deren Begründung aus einem Satz besteht.\",\"Weil die Miete über dem Mietspiegel liegt.\",\"Weil das Bürgeramt die Anmeldung verweigert hat.\"],\"answer\":0,\"why\":\"Eigenbedarf, un solo Satz. La Miete está por debajo del Spiegel, no por encima.\"},{\"id\":\"b2m8l6e1q2\",\"q\":\"Was kam seitens der Hausverwaltung?\",\"options\":[\"Ein Anruf, kein Schreiben.\",\"Ein Einschreiben mit Unterlagen.\",\"Nichts, nicht einmal ein Anruf.\"],\"answer\":0,\"why\":\"«Seitens der Hausverwaltung kam ein Anruf, kein Schreiben.»\"},{\"id\":\"b2m8l6e1q3\",\"q\":\"Welche Rolle spielt der Mietspiegel in Vogels Argument?\",\"options\":[\"Er zeigt, dass eine Kündigung überzogen ist: die Miete liegt darunter.\",\"Er begründet den Eigenbedarf der Tochter.\",\"Er ersetzt den Widerspruch.\"],\"answer\":0,\"inference\":true,\"why\":\"Anhand der Zahlen… Erhöhung, keine Kündigung. Hay que unir Mietspiegel y Eigenbedarf.\"},{\"id\":\"b2m8l6e1q4\",\"q\":\"Wozu dient der Wiener Kasten?\",\"options\":[\"Er zeigt dieselbe Verdrängung unter anderem Namen: Gemeindewohnung statt Sozialwohnung.\",\"Er rät Vogel, nach Ottakring zu ziehen.\",\"Er erklärt die Stiege als deutsches Wort.\"],\"answer\":0,\"inference\":true,\"why\":\"Misma presión, otro léxico. Stiege está glosada; no es el tema.\"},{\"id\":\"b2m8l6e1q5\",\"q\":\"Was fordert Vogel am Ende konkret?\",\"options\":[\"Dass die Behörde die Akte liest, bevor der Bescheid rechtskräftig wird.\",\"Dass Sofía die Miete übernimmt.\",\"Dass der Bebauungsplan gestrichen wird.\"],\"answer\":0,\"inference\":true,\"why\":\"Cita directa al final. El plan urbanístico aparece antes, no como su petición.\"}],\"itemIds\":[\"b2m8eigenbedarf\",\"b2m8mietspiegel\",\"b2m8verdrangung\",\"b2m8gemeindewohnung\",\"b2m8kuendigungsschutz\"]},{\"id\":\"b2m8l6e2\",\"type\":\"mc\",\"prompt\":\"Austriacismo\",\"question\":\"«Gemeindewohnung» en Viena es…\",\"options\":[\"El equivalente a una Sozialwohnung comunal\",\"Un piso de estudiantes\",\"El Bürgeramt vienés\"],\"answer\":0,\"whyWrong\":[null,\"No es una residencia de estudiantes\",\"El Amt es otra cosa; la nota lo glosa como vivienda\"],\"itemIds\":[\"b2m8gemeindewohnung\",\"b2m8sozialwohnung\"]},{\"id\":\"b2m8l6e3\",\"type\":\"cloze\",\"prompt\":\"El genitivo que sostiene el recurso\",\"text\":\"Mangels gültiger ___ sei der Bedarf nicht nachgewiesen.\",\"answers\":[\"Dokumente\",\"Unterlagen\"],\"translation\":\"A falta de documentos válidos, la necesidad no estaría acreditada.\",\"itemIds\":[\"b2m8mangels\"]},{\"id\":\"b2m8l6e4\",\"type\":\"match\",\"prompt\":\"Empareja ciudad y papel\",\"pairs\":[{\"target\":\"die Sozialwohnung\",\"source\":\"vivienda protegida (DE)\"},{\"target\":\"die Gemeindewohnung\",\"source\":\"vivienda municipal (AT)\"},{\"target\":\"die Verdrängung\",\"source\":\"la expulsión del barrio\"},{\"target\"
