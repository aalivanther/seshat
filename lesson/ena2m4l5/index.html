unks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T481,Coge la frase del módulo: \u003cb\u003echeaper than mine\u003c/b\u003e. Escrita tiene tres palabras; dicha por un británico tiene \u003cb\u003edos golpes de voz\u003c/b\u003e y suena «\u003cb\u003eCHÍI-pa-dan máin\u003c/b\u003e». Ahí dentro están las dos trampas del nivel.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. La -er final NO suena «er».\u003c/b\u003e Es la vocal más frecuente del inglés y la más floja de todas: una «a» sin fuerza, casi un gruñido. bigger = \u003cb\u003eBÍ-ga\u003c/b\u003e. cheaper = \u003cb\u003eCHÍI-pa\u003c/b\u003e. better = \u003cb\u003eBÉ-ta\u003c/b\u003e. older = \u003cb\u003eÓUL-da\u003c/b\u003e. Si dices «bí-guer», estás leyendo la palabra en español y la R que pronuncias ahí \u003cb\u003eno existe\u003c/b\u003e en inglés británico.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. «than» es átono.\u003c/b\u003e Nunca lleva el golpe de voz, se pega a la palabra de delante y se reduce a «dan». Y eso tiene una consecuencia práctica que te va a servir en el Listening: \u003cb\u003esi oyes un «dan» flojito, es que acaba de haber una comparación\u003c/b\u003e. Es una pista gratis.\u003cbr/\u003e\u003cbr/\u003eLa ventaja es que esto \u003cb\u003eno hay que estudiarlo, hay que dejarlo caer\u003c/b\u003e. El error del hispanohablante aquí es pronunciar de más, no de menos: dar a cada sílaba su peso, como en español. En inglés unas sílabas pesan y otras casi no existen.18:T43d,Este ya lo viste en el A1 con los números sueltos. Aquí vuelve donde importa: \u003cb\u003eprecios, pesos, alturas y temperaturas\u003c/b\u003e, que es justo donde confundirse tiene consecuencias.\u003cbr/\u003e\u003cbr/\u003eLa diferencia \u003cb\u003eno está en la vocal\u003c/b\u003e, está en \u003cb\u003edónde cae el golpe de voz\u003c/b\u003e:\u003cbr/\u003e• \u003cb\u003ethir-TEEN\u003c/b\u003e, four-TEEN, fif-TEEN, six-TEEN → el golpe \u003cb\u003eal final\u003c/b\u003e, y la palabra acaba en un «-tíin» largo.\u003cbr/\u003e• \u003cb\u003eTHIR-ty\u003c/b\u003e, FOR-ty, FIF-ty, SIX-ty → el golpe \u003cb\u003eal principio\u003c/b\u003e, y acaba en una «i» corta y floja.\u003cbr/\u003e\u003cbr/\u003eAsí que \u003ci\u003ethirteen pounds\u003c/i\u003e es «zee-TÍIN páunds̬» y \u003ci\u003ethirty pounds\u003c/i\u003e es «ZÉE-ti páunds̬». La diferencia entre 13 £ y 30 £ es dónde pones la fuerza.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el truco que usan los nativos entre ellos:\u003c/b\u003e cuando hay dudas de verdad —por teléfono, en una tienda ruidosa— se dice el número dos veces de otra forma: «\u003ci\u003eThirty. Three-zero.\u003c/i\u003e». No es de mala educación: es lo que hace todo el mundo. En el examen oral, si no estás seguro de haber oído bien, preguntar «\u003ci\u003eOne-three or three-zero?\u003c/i\u003e» no te resta nada."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l5\",\"phaseId\":\"ena2m4\",\"title\":\"Clínica de sonido: CHÍI-pa dan máin\",\"subtitle\":\"La -er que no suena a -er, el than que casi no suena, y el par que cuesta dinero\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de la clínica\",\"itemIds\":[\"ena2m4schwaer\",\"ena2m4thanweak\",\"ena2m4thirtydegrees\",\"ena2m4thirteenpounds\",\"enthirteen30\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos trampas de ritmo, y las dos están en la misma frase\",\"body\":\"$17\",\"table\":[[\"se escribe\",\"suena\",\"y NO\"],[\"bigger\",\"BÍ-ga\",\"bí-guer\"],[\"cheaper\",\"CHÍI-pa\",\"chí-per\"],[\"better\",\"BÉ-ta\",\"bé-ter\"],[\"cheaper than mine\",\"CHÍI-pa dan máin\",\"chíper zan máin\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"13 y 30: el par que cuesta dinero de verdad\",\"body\":\"$18\",\"table\":[[\"número\",\"cómo suena\",\"dónde cae el golpe\"],[\"13\",\"zee-TÍIN\",\"al final\"],[\"30\",\"ZÉE-ti\",\"al principio\"],[\"15\",\"fif-TÍIN\",\"al final\"],[\"50\",\"FÍF-ti\",\"al principio\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l5e1\",\"type\":\"mc\",\"prompt\":\"La -er del final\",\"question\":\"«bigger» suena…\",\"options\":[\"BÍ-ga\",\"bí-guer\",\"bi-GUER\"],\"answer\":0,\"whyWrong\":[null,\"Esa R final no se pronuncia en inglés británico: la -er es una «a» floja\",\"Además del error de la R, el golpe de voz va al principio, no al final\"],\"itemIds\":[\"ena2m4schwaer\"]},{\"id\":\"ena2m4l5e2\",\"type\":\"bucket\",\"prompt\":\"¿El golpe de voz va al principio o al final?\",\"categories\":[\"al principio (30, 40, 50…)\",\"al final (13, 14, 15…)\"],\"items\":[{\"text\":\"thirteen\",\"bucket\":1},{\"text\":\"thirty\",\"bucket\":0},{\"text\":\"fourteen\",\"bucket\":1},{\"text\":\"forty\",\"bucket\":0},{\"text\":\"fifteen\",\"bucket\":1},{\"text\":\"fifty\",\"bucket\":0},{\"text\":\"sixteen\",\"bucket\":1},{\"text\":\"sixty\",\"bucket\":0}],\"itemIds\":[\"ena2m4thirteenpounds\",\"ena2m4thirtydegrees\",\"enthirteen30\",\"enfourteen40\",\"enfifteen50\",\"ensixteen60\"],\"tip\":\"Los «-teen» tiran del golpe hacia el final; los «-ty» lo dejan al principio. Es la única diferencia, y es suficiente.\"},{\"id\":\"ena2m4l5e3\",\"type\":\"audiomc\",\"prompt\":\"Cazar el precio — 2 escuchas, como en el examen\",\"audio\":\"The small jacket is thirteen pounds and the big one is thirty. It's four degrees outside, so you need it today.\",\"question\":\"¿Cuánto cuesta la chaqueta pequeña?\",\"options\":[\"13 £\",\"30 £\",\"4 £\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Esos son los 30 £ de la grande: fíjate en dónde cae el golpe de voz\",\"Los cuatro son los grados de la calle, no un precio\"],\"itemIds\":[\"ena2m4thirteenpounds\",\"ena2m4thirtydegrees\",\"enjacket\",\"enpound\"],\"tip\":\"En
