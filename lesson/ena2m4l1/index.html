 para el «que» hay una palabra propia, [[than|que — solo en comparaciones]]: \u003cb\u003eThis one is cheaper than that one.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDe aquí sale el error más caro del módulo.\u003c/b\u003e Como el español dice \u003ci\u003emás\u003c/i\u003e por separado, la mano lo traduce por separado y sale \u003ci\u003emore big\u003c/i\u003e, \u003ci\u003emore cheap\u003c/i\u003e, \u003ci\u003emore old\u003c/i\u003e. No existen. Si el adjetivo es corto, \u003cb\u003ela -er le basta\u003c/b\u003e, y poner \u003ci\u003emore\u003c/i\u003e delante es como escribir «más grandeer». Elige una: o la -er, o el \u003ci\u003emore\u003c/i\u003e del que hablaremos mañana. Las dos a la vez, jamás.\u003cbr/\u003e\u003cbr/\u003eDos detalles que te ahorran vergüenza:\u003cbr/\u003e• \u003cb\u003ethan me\u003c/b\u003e, no \u003ci\u003ethan I\u003c/i\u003e. El libro antiguo dirá que lo correcto es \u003ci\u003ethan I am\u003c/i\u003e; en la calle y en el examen oral se dice \u003cb\u003ethan me\u003c/b\u003e y nadie parpadea.\u003cbr/\u003e• «\u003cb\u003emucho\u003c/b\u003e más barato» es \u003cb\u003emuch cheaper\u003c/b\u003e. \u003ci\u003eVery cheaper\u003c/i\u003e no existe: \u003ci\u003every\u003c/i\u003e solo acompaña a adjetivos sin comparar (\u003ci\u003every cheap\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l1\",\"phaseId\":\"ena2m4\",\"title\":\"Cheaper than that one\",\"subtitle\":\"Una letra al final y una palabra en medio: ya estás comparando\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Comparar dos cosas, en una frase\",\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4than\",\"ena2m4biggerthanmine\",\"ena2m4olderthanme\",\"ena2m4muchcheaper\",\"ena2m4easierbiggerhotter\",\"encheap\",\"enbig\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«más barato que» son tres palabras en español y DOS en inglés\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"lo que sale mal\"],[\"más barato que\",\"cheaper than\",\"more cheap than\"],[\"más grande que\",\"bigger than\",\"more big than\"],[\"mayor que yo\",\"older than me\",\"more old than I\"],[\"mucho más barato\",\"much cheaper\",\"very cheaper\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se escribe la -er (y ya te la sabes del pasado)\",\"body\":\"Los retoques son \u003cb\u003elos mismos tres\u003c/b\u003e que aprendiste para la \u003cb\u003e-ed\u003c/b\u003e del pasado en \u003ci\u003eena2m1\u003c/i\u003e. No hay nada nuevo que memorizar:\u003cbr/\u003e\u003cbr/\u003e1. El adjetivo acaba en \u003cb\u003e-e\u003c/b\u003e → solo se añade la -r: nice → [[nicer|más bonito]], large → larger.\u003cbr/\u003e2. Acaba en \u003cb\u003econsonante + -y\u003c/b\u003e → la y se vuelve \u003cb\u003e-ier\u003c/b\u003e: easy → [[easier|más fácil]], happy → happier, busy → busier. Igual que study → studied.\u003cbr/\u003e3. Acaba en \u003cb\u003euna vocal + una consonante\u003c/b\u003e → se dobla la consonante: big → [[bigger|más grande]], hot → hotter, thin → thinner. Igual que stop → stopped.\u003cbr/\u003e\u003cbr/\u003eTodo lo demás: \u003cb\u003e+ -er\u003c/b\u003e y a otra cosa. cheap → cheaper, cold → colder, young → younger, small → smaller.\",\"table\":[[\"si el adjetivo acaba en…\",\"qué haces\",\"ejemplo\"],[\"-e\",\"solo añades -r\",\"nice → nicer\"],[\"consonante + -y\",\"-y se vuelve -ier\",\"easy → easier\"],[\"vocal + consonante\",\"doblas la consonante\",\"big → bigger\"],[\"cualquier otra cosa\",\"+ -er\",\"cheap → cheaper\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l1e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — estos adjetivos ya son tuyos del A1\",\"pairs\":[{\"target\":\"cheap\",\"source\":\"barato\"},{\"target\":\"expensive\",\"source\":\"caro\"},{\"target\":\"big\",\"source\":\"grande\"},{\"target\":\"small\",\"source\":\"pequeño\"},{\"target\":\"new\",\"source\":\"nuevo\"}],\"targetSeconds\":25,\"itemIds\":[\"encheap\",\"enexpensive\",\"enbig\",\"ensizesmall\",\"ennew\"],\"tip\":\"Todo el módulo se construye sobre cinco adjetivos que ya tenías. Comparar no es aprender palabras nuevas: es aprender a estirar las viejas.\"},{\"id\":\"ena2m4l1e2\",\"type\":\"match\",\"prompt\":\"Empareja cada adjetivo con su comparativo\",\"pairs\":[{\"target\":\"cheaper\",\"source\":\"más barato\"},{\"target\":\"bigger\",\"source\":\"más grande\"},{\"target\":\"older\",\"source\":\"mayor / más viejo\"},{\"target\":\"colder\",\"source\":\"más frío\"}],\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4biggerthanmine\",\"ena2m4olderthanme\",\"encold\"],\"tip\":\"Fíjate en que la terminación es siempre la misma. Lo único que cambia entre bigger y cheaper es que uno dobla la consonante.\"},{\"id\":\"ena2m4l1e3\",\"type\":\"mc\",\"prompt\":\"«Este es más barato que ese»\",\"question\":\"¿Cuál es la frase inglesa?\",\"options\":[\"This one is cheaper than that one.\",\"This one is more cheap than that one.\",\"This one is more cheaper that that one.\"],\"answer\":0,\"whyWrong\":[null,\"cheap es corto: le basta la -er. El more sobra\",\"Dos errores en cuatro palabras: el doble comparativo y el that en lugar de than\"],\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4than\"],\"tip\":\"Memoriza la frase entera, no la regla. «This one is cheaper than that one» es la frase que más vas a decir en la Parte 3 del oral.\"},{\"id\":\"ena2m4l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Este adjetivo dobla la última letra antes de la -er?\",\"categories\":[\"se dobla la consonante\",\"se le pega -er y ya\"],\"items\":[{\"text\":\"big\",\"bucket\":0},{\"text\":\"cheap\",\"bucket\":1},{\"text\":\"hot\",\"bucket\":0},{\"text\":\"small\",\"bucket\":1},{\"text\":\"thin\",\"bucket\":0},{\"text\":\"new\",\"bucket\":1},{\"text\":\"young\",\"bucket\":1},{\"text\":\"old\",\"bucket\":1}],\"itemIds\":[\"ena2m4easierbiggerhotter\",\"ena2m4biggerthanmine\"],\"tip\":\"Se dobla solo cuando delante de la consonante final hay UNA vocal sola: bi-g, ho-t, thi-n. En cheap hay dos vocales (ea) y en small hay dos eles: no se toca nada.\"},{\"id\":\"ena2m4l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el comparativo del adjetivo entre paréntesis\",\"text\":\"This jacket is ___ (cheap) than the one in the shop.\",\"answers\":[\"cheaper\"],\"translation\":\"Esta chaqueta es más barata que la de la tienda.\",\"hints\":[\"El adjetivo es corto: no necesita ninguna palabra delante\",\"cheap + …\"],\"itemIds\":[\"ena2m4cheaperthan\",\"enjacket\"]},{\"id\":\"ena2m4l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa — ojo a la ortografía\",\"text\":\"My flat is ___ (big) than yours.\",\"answers\":[\"bigger\"],\"translation\":\"Mi piso es más grande que el tuyo.\",\"hints\":[\"Vocal + consonante: pasa lo mismo que en stop → stopped\",\"big + …\"],\"itemIds\":[\"ena2m4biggerthanmine\",\"enflat\"]},{\"id\":\"ena2m4l1e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el doble comparativo — el calco nº 1 del módulo\",\"wrong\":\"My flat is more big than yours.\",\"answers\":[\"My flat is bigger than yours.\"],\"why\":\"En español «más» es una palabra suelta y en inglés no: con los adjetivos cortos el «más» ES la terminación -er. O pones more, o pones -er, pero nunca los dos ni ninguno. Y big es cortísimo, así que le toca la -er.\",\"translation\":\"Mi piso es más grande que el tuyo.\",\"itemIds\":[\"ena2m4biggerthanmine\"],\"tip\":\"Regla mecánica para el examen: si escribes «more» delante de una palabra de una sola sílaba, párate. Casi seguro que sobra.\"},{\"id\":\"ena2m4l1e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la palabra cruzada — este error se ve en el papel, no en el oído\",\"wrong\":\"This one is cheaper that the other one.\",\"answers\":[\"This one is cheaper than the other one.\"],\"why\":\"En español «que» hace dos trabajos: compara («más barato QUE») y encabeza subordinadas («creo QUE sí»). El inglés los reparte: comparar es THAN, lo otro es THAT. Suenan casi igual, pero se escriben distinto y el corrector del examen lo ve.\",\"translation\":\"Este es más barato que el otro.\",\"itemIds\":[\"ena2m4than\",\"ena2m4cheaperthan\"],\"tip\":\"Truco: than lleva una N, como compariso-N. That lleva una T, como... that. Suena tonto, y funciona.\"},{\"id\":\"ena2m4l1e9\",\"type\":\"transform\",\"prompt\":\"Convierte la descripción en comparación\",\"source\":\"This shop is cheap.\",\"instruction\":\"Compárala con el mercadillo, usando than\",\"answers\":[\"This shop is cheaper than the street market.\",\"This shop is cheaper than the market.\"],\"translation\":\"Esta tienda es más barata que el mercadillo.\",\"hints\":[\"cheap se convierte en cheaper y después va la palabra de la comparación\",\"This shop is cheap… th… the street market.\"],\"itemIds\":[\"ena2m4cheaperthan\",\"enshop\",\"ena2m1streetmarket\"]},{\"id\":\"ena2m4l1e10\",\"type\":\"build\",\"prompt\":\"Construye la comparación\",\"target\":\"She's older than me\",\"translation\":\"Es mayor que yo\",\"distractors\":[\"more\",\"old\",\"that\"],\"itemIds\":[\"ena2m4olderthanme\"],\"tip\":\"Las tres fichas que sobran son los tres errores de siempre: more, el adjetivo sin comparar y el that. Si las dejas fuera, tienes la frase.\"},{\"id\":\"ena2m4l1e11\",\"type\":\"mc\",\"prompt\":\"«Mucho más barato»\",\"question\":\"¿Cómo se dice «mucho más barato»?\",\"options\":[\"much cheaper\",\"very cheaper\",\"more cheaper\"],\"answer\":0,\"whyWrong\":[null,\"very solo acompaña a adjetivos SIN comparar: very cheap sí, very cheaper no\",\"Doble comparativo otra vez: cheaper ya lleva el «más» dentro\"],\"itemIds\":[\"ena2m4muchcheaper\"],\"tip\":\"La familia entera: much cheaper, a lot cheaper, a bit cheaper. Todas delante del comparativo. very se queda fuera de este club.\"},{\"id\":\"ena2m4l1e12\",\"type\":\"listen\",\"prompt\":\"Dictado — una comparación con el tiempo\",\"text\":\"It's colder than yesterday.\",\"translation\":\"Hace más frío que ayer.\",\"hints\":[\"cold + la terminación del comparativo\",\"It's cold… th… yesterday.\"],\"itemIds\":[\"encold\",\"ena2m4than\",\"enyesterday\"]},{\"id\":\"ena2m4l1e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tu primera comparación entera\",\"text\":\"This jacket is cheaper than that one, and it's much nicer.\",\"phonetic\":\"dis DCHA-kit is̬ CHÍI-pa dan DAT uan, and its mach NÁI-sa\",\"translation\":\"Esta chaqueta es más barata que esa, y es mucho más bonita.\",\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4muchcheaper\",\"enjacket\",\"ennice\"],\"tip\":\"Fíjate en que «cheaper than» sale casi como una sola palabra: CHÍI-pa-dan. Lo trabajamos entero en la lección 5.\"},{\"id\":\"ena2m4l1e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Mi piso es más grande que el tuyo, pero el tuyo es mucho más barato.\",\"answers\":[\"My flat is bigger than yours, but yours is much cheaper.\",\"My flat is bigger than yours but yours is much cheaper.\",\"My flat is bigger than your flat, but yours is much cheaper.\"],\"hints\":[\"Dos comparativos con -er y un much delante del segundo\",\"My flat is big… th… yours, but yours is m… cheaper.\"],\"itemIds\":[\"ena2m4biggerthanmine\",\"ena2m4muchcheaper\",\"enflat\"],\"tip\":\"Dos comparaciones en una frase y ni un «more» a la vista. Eso ya es lenguaje de Parte 3.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m4-1\",\"book\":\"It's very cheap.\",\"real\":\"It's a bargain.\",\"meaning\":\"Es una ganga / está tirado de precio\",\"when\":\"En tiendas, mercadillos y rebajas, con amigos o con el dependiente. Es palabra de todos los días, no jerga. En el Writing del examen también vale, aunque la del libro (it's very cheap, it's good value) es la que nunca falla.\",\"register\":\"neutral\",\"note\":\"En las rebajas verás carteles con «bargains» a secas: son las gangas. Y ojo, bargain también es «regatear» cuando es verbo.\",\"sound\":\"its a BAA-guin\",\"level\":\"a2\",\"itemId\":\"ena2m4muchcheaper\"}}],\"resources\":[{\"label\":\"British Council — Comparative adjectives\",\"url\":\"https://learnengl
