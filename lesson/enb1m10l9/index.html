/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T86f,"])</script><script>self.__next_f.push([1,"Hay \u003cb\u003etres escalones\u003c/b\u003e de disculpa, y usar el que no toca es lo que hace que una frase suene rara aunque esté bien construida:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eSorry.\u003c/b\u003e / \u003cb\u003eSorry about that.\u003c/b\u003e — el de todos los días. Un pisotón, un retraso de cinco minutos, un malentendido pequeño. Se dice constantemente y no compromete a nada.\u003cbr/\u003e2. \u003cb\u003eI'm really sorry — it was my fault.\u003c/b\u003e — cuando la cosa importa. Aquí ya se asume la culpa.\u003cbr/\u003e3. \u003cb\u003eI owe you an apology.\u003c/b\u003e — el escalón alto, y es el que suena adulto. Se usa cuando ha pasado tiempo y sabes que te has portado mal.\u003cbr/\u003eY por escrito, en registro formal: \u003cb\u003eI would like to apologise for…\u003c/b\u003e Eso es lo que puntúa en el Writing Part 1.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que casi nunca se dice:\u003c/b\u003e \u003ci\u003eI forgive you\u003c/i\u003e. Existe, es correcto y en la vida real suena solemne, casi bíblico. El inglés perdona con otras frases: \u003ci\u003eDon't worry about it\u003c/i\u003e, \u003ci\u003eThese things happen\u003c/i\u003e, \u003ci\u003eIt's fine, honestly\u003c/i\u003e. Reconocer \u003ci\u003eI've forgiven her\u003c/i\u003e por escrito sí hace falta; producir \u003ci\u003eI forgive you\u003c/i\u003e en una conversación, casi nunca.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres verbos que el español calca mal:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eforgive somebody\u003c/b\u003e — sin preposición. \u003ci\u003eI've forgiven \u003cb\u003eher\u003c/b\u003e\u003c/i\u003e, nunca \u003ci\u003eforgiven to her\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003etrust somebody\u003c/b\u003e — también sin preposición. El español dice «confío \u003cb\u003een\u003c/b\u003e ella» y de ahí sale \u003ci\u003e\u003cs\u003eI trust in her\u003c/s\u003e\u003c/i\u003e, que existe pero suena a fe religiosa. En inglés de todos los días: \u003ci\u003eI trust her\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003erely on somebody\u003c/b\u003e — este sí lleva preposición, y lleva \u003cb\u003eon\u003c/b\u003e. \u003ci\u003eYou can rely \u003cb\u003eon\u003c/b\u003e Amy.\u003c/i\u003e Su gemelo idéntico es \u003ci\u003ecount on\u003c/i\u003e.\u003cbr/\u003eFíjate en la trampa: el que en español lleva preposición no la lleva en inglés, y el que no la lleva en español sí la lleva en inglés. Están cruzados.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY dos formas de decir que la fastidiaste:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003elet somebody down\u003c/b\u003e — fallarle a alguien que contaba contigo. Es el contrario exacto de \u003ci\u003erely on\u003c/i\u003e: uno confía, el otro falla.\u003cbr/\u003e· \u003cb\u003eI've regretted it ever since\u003c/b\u003e — arrepentimiento largo, del que dura. \u003ci\u003eEver since\u003c/i\u003e cierra la frase sin repetir la fecha."])</script><script>self.__next_f.push([1,"18:T5b3,"])</script><script>self.__next_f.push([1,"Can I tell you something stupid? I fell out with my sister for two years over a chair.|A chair.|A chair. When our grandmother died there was a chair, and Clara took it, and I found out because I saw it in a photograph she had put online.|She hadn't asked you.|She hadn't asked me. And I hadn't asked her either, because I had assumed. That's the bit I got wrong.|What did you say to her?|Nothing, for four days. And then I wrote a message at one in the morning that I still can't read without wanting to be sick.|Ah.|And she replied with one line. 'I asked Mum and Mum said yes.' Which was true. She had asked. She had asked the week before the funeral, and Mum had forgotten to tell me.|So it was a misunderstanding.|It was, and it should have taken ten minutes to sort out, and it took two years, because by the time we knew that, we had both said other things.|Who rang first?|Neither of us. That's the ridiculous part. Her son was born, and my mother rang me and said 'you are going, and you are taking something for the baby'. So I went.|And?|And she opened the door and said 'you look terrible', and I said 'so do you', and that was it. Two years, and it took four seconds.|Did you talk about the chair?|Never. Not once. I have been in that house eleven times since and the chair is in the front room and neither of us has ever mentioned it.|Does that bother you?|It used to. Now I think some things get closed and some things get put in the front room."])</script><script>self.__next_f.push([1,"19:T5b3,"])</script><script>self.__next_f.push([1,"Can I tell you something stupid? I fell out with my sister for two years over a chair.|A chair.|A chair. When our grandmother died there was a chair, and Clara took it, and I found out because I saw it in a photograph she had put online.|She hadn't asked you.|She hadn't asked me. And I hadn't asked her either, because I had assumed. That's the bit I got wrong.|What did you say to her?|Nothing, for four days. And then I wrote a message at one in the morning that I still can't read without wanting to be sick.|Ah.|And she replied with one line. 'I asked Mum and Mum said yes.' Which was true. She had asked. She had asked the week before the funeral, and Mum had forgotten to tell me.|So it was a misunderstanding.|It was, and it should have taken ten minutes to sort out, and it took two years, because by the time we knew that, we had both said other things.|Who rang first?|Neither of us. That's the ridiculous part. Her son was born, and my mother rang me and said 'you are going, and you are taking something for the baby'. So I went.|And?|And she opened the door and said 'you look terrible', and I said 'so do you', and art. Her son was born, and my mother rang me and said 'you are going, and you are taking something for the baby'. So I went.|And?|And she opened the door and said 'you look terrible', and I said 'so do you', and that was it. Two years, and it took four seconds.|Did you talk about the chair?|Never. Not once. I have been in that house eleven times since and the chair is in the front room and neither of us has ever mentioned it.|Does that bother you?|It used to. Now I think some things get closed and some things get put in the front room."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l9\",\"phaseId\":\"enb1m10\",\"title\":\"Sorry about that\",\"subtitle\":\"Disculparse sin sobreactuar, perdonar sin decirlo y saber de quién te fías\",\"minutes\":25,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del arreglo\",\"itemIds\":[\"enb1m10natsorryaboutthat\",\"enb1m10forgive\",\"enb1m10relyon\",\"enb1m10trust\",\"enb1m10oweyouanapology\",\"enb1m10regretteditever\",\"enb1m10letherdown\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el británico se disculpa mucho y perdona sin decirlo\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Nunca\"],[\"La he perdonado\",\"I've forgiven her.\",\"I've forgiven to her.\"],[\"Me fío de ella\",\"I trust her.\",\"I trust in her.\"],[\"Puedes contar con Amy\",\"You can rely on Amy.\",\"You can rely Amy.\"],[\"Le fallé\",\"I let her down.\",\"I failed to her.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l9e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del arreglo\",\"pairs\":[{\"target\":\"I owe you an apology.\",\"source\":\"Te debo una disculpa.\"},{\"target\":\"I've forgiven her.\",\"source\":\"La he perdonado.\"},{\"target\":\"You can rely on Amy.\",\"source\":\"Puedes contar con Amy.\"},{\"target\":\"I let her down.\",\"source\":\"Le fallé.\"}],\"itemIds\":[\"enb1m10oweyouanapology\",\"enb1m10forgive\",\"enb1m10relyon\",\"enb1m10letherdown\"],\"tip\":\"«Rely on» y «let down» son las dos caras de la misma moneda: una persona confía y la otra falla. Si te aprendes la pareja, no se te olvida ninguna.\"},{\"id\":\"enb1m10l9e2\",\"type\":\"mc\",\"prompt\":\"El escalón de disculpa\",\"question\":\"Llevas seis meses sin llamar a tu hermana y por fin la llamas. ¿Con cuál empiezas?\",\"options\":[\"I owe you an apology.\",\"Sorry about that.\",\"I would like to apologise for the delay.\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el de un pisotón o un retraso de cinco minutos. Después de seis meses suena a que no te importa.\",\"Ese es el de una carta formal. A tu hermana le sonaría a burla.\"],\"itemIds\":[\"enb1m10oweyouanapology\",\"enb1m10natsorryaboutthat\"],\"tip\":\"El error de registro perdona menos que el gramatical: una disculpa demasiado pequeña ofende más que una frase mal construida. En el Speaking Part 2 esto se mide directamente.\"},{\"id\":\"enb1m10l9e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante tradujo «me fío de ella». Quita UNA palabra.\",\"wrong\":\"I trust in her completely.\",\"answers\":[\"I trust her completely.\"],\"why\":\"«Confiar EN» lleva preposición en español y «trust» no la lleva en inglés: el complemento va directo. «Trust in» existe, pero suena a fe, no a fiarse de una amiga.\",\"translation\":\"Me fío de ella del todo.\",\"itemIds\":[\"enb1m10trust\"]},{\"id\":\"enb1m10l9e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"If you need anything at all, you can rely ___ me.\",\"answers\":[\"on\",\"upon\"],\"translation\":\"Si necesitas cualquier cosa, puedes contar conmigo.\",\"hints\":[\"Dos letras\",\"La misma que lleva «count»\"],\"itemIds\":[\"enb1m10relyon\"],\"tip\":\"Este sí lleva preposición, y es «on». Es el cruce del día: «trust» no la lleva y en español sí, y «rely» la lleva y en español es «con».\"},{\"id\":\"enb1m10l9e5\",\"type\":\"build\",\"prompt\":\"Construye la disculpa alta\",\"target\":\"I owe you an apology\",\"translation\":\"Te debo una disculpa\",\"distractors\":[\"sorry\",\"to\"],\"itemIds\":[\"enb1m10oweyouanapology\"],\"tip\":\"Las dos fichas que sobran son las dos tentaciones: meter «sorry» dentro (que ya está dicho con «apology») y colar un «to» delante de «you» (que este verbo no pide).\"},{\"id\":\"enb1m10l9e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje que Valeria le manda a su hermana\",\"text\":\"I owe you an ___ . I knew about it in January and I said nothing, and I've ___ it ever since. You can still ___ on me, I promise.\",\"answers\":[\"apology\",\"regretted\",\"rely\"],\"bank\":[\"apology\",\"regretted\",\"rely\",\"forgive\",\"sorry\",\"blame\"],\"translation\":\"Te debo una disculpa. Lo sabía desde enero y no dije nada, y me he arrepentido desde entonces. Puedes seguir contando conmigo, te lo prometo.\",\"itemIds\":[\"enb1m10oweyouanapology\",\"enb1m10regretteditever\",\"enb1m10relyon\"],\"tip\":\"Fíjate en el orden del mensaje: primero la disculpa, después el hecho, después el arrepentimiento y al final la promesa. Ese orden es el que hace que suene sincero, en inglés y en español.\"},{\"id\":\"enb1m10l9e7\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál oíste: la del libro o la de la calle?\",\"book\":\"I am sorry about that.\",\"real\":\"Sorry about that.\",\"translation\":\"Perdona, lo siento.\",\"itemIds\":[\"enb1m10natsorryaboutthat\"],\"tip\":\"En la calle el sujeto y el verbo desaparecen: «Sorry about that» a secas. Y no es descuido, es la forma normal — «I am sorry about that», dicho entero, suena a que la cosa es grave.\"},{\"id\":\"enb1m10l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"You can always trust Amy to do what she said she would do.\",\"forbid\":[\"trust\",\"always\"],\"answers\":[\"You can rely on Amy\",\"You can rely on Amy to do what she promised\",\"You can count on Amy\"],\"translation\":\"Con Amy puedes contar: hace lo que dice que va a hacer.\",\"itemIds\":[\"enb1m10relyon\",\"enb1m10trust\",\"enb1m3promised\"],\"tip\":\"«Trust» y «rely on» dicen casi lo mismo, pero no se construyen igual: uno va directo y el otro lleva «on». Cambiar de uno a otro sin equivocarse de preposición es exactamente lo que mide el criterio de gramática.\"},{\"id\":\"enb1m10l9e9\",\"type\":\"transform\",\"prompt\":\"Del hecho al arrepentimiento\",\"source\":\"I didn't tell her, and I still think about it.\",\"instruction\":\"Dilo con «ever since»\",\"answers\":[\"I didn't tell her, and I've regretted it ever since\",\"I didn't tell her and I've regretted it ever since\",\"I didn't tell her, and I've regretted it ever since.\"],\"translation\":\"No se lo conté, y me he arrepentido desde entonces.\",\"hints\":[\"El arrepentimiento va en presente perfecto: empezó entonces y sigue\",\"I didn't tell her, and I've ... ever since\"],\"itemIds\":[\"enb1m10regretteditever\",\"enb1m1havelivedhere\"],\"tip\":\"«Ever since» cierra la frase sin repetir la fecha, y arrastra el presente perfecto del módulo 1: algo que empezó en el pasado y todavía dura. Es una fórmula de dos palabras que hace mucho trabajo.\"},{\"id\":\"enb1m10l9e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Le fallé, y creo que todavía no me ha perdonado.\",\"answers\":[\"I let her down, and I don't think she's forgiven me yet\",\"I let her down and I don't think she has forgiven me yet\",\"I let him down, and I don't think he's forgiven me yet\"],\"hint\":\"El segundo verbo va sin preposición delante de la persona\",\"itemIds\":[\"enb1m10letherdown\",\"enb1m10forgive\",\"enb1m1notyet\"],\"tip\":\"«She's forgiven me», no «she's forgiven to me». Y fíjate en el «yet» al final: es el mismo del módulo 1, el que dice «de momento no, pero puede que sí».\"},{\"id\":\"enb1m10l9e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"She never said she'd forgiven me. She just started ringing again on Sundays.\",\"answers\":[\"Nunca dijo que me hubiera perdonado. Simplemente volvió a llamar los domingos\",\"Nunca me dijo que me había perdonado. Sencillamente empezó a llamar otra vez los domingos\",\"No dijo nunca que me hubiera perdonado: volvió a llamarme los domingos y ya\"],\"itemIds\":[\"enb1m10forgive\",\"enb1m10hadalreadyleft\"],\"tip\":\"Esas dos frases son el módulo entero en miniatura: un «'d forgiven» que mira hacia atrás, y un pasado simple que cuenta lo que pasó. Y la manera muy británica de perdonar sin decirlo.\"},{\"id\":\"enb1m10l9e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I owe you an apology.\",\"translation\":\"Te debo una disculpa.\",\"hints\":[\"Empieza por «I owe…»\",\"I owe you an ...\"],\"itemIds\":[\"enb1m10oweyouanapology\"],\"tip\":\"«Owe» suena «óu», exactamente igual que «oh»: la w no se pronuncia. Y «apology» lleva el acento en la segunda sílaba, a-PÓ-lo-dchi, no en la primera como en español.\"},{\"id\":\"enb1m10l9e13\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"Somebody I get on with, and a time when we fell out\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de quién vas a hablar y en cuántos puntos: «I'd like to talk about my sister. I'll say three things.»\"},{\"title\":\"2. Who they are\",\"hint\":\"Descríbela en UNA pieza, sin encadenar «she is»: «She's a tall woman in her thirties with short dark hair, and she's the most stubborn person I know.»\"},{\"title\":\"3. The time we fell out\",\"hint\":\"Un caso concreto, con los tres tiempos: «We were living together when… It all started because she had told my mother…»\"},{\"title\":\"4. Where we are now\",\"hint\":\"Cierra con el antes y el ahora: «We used to argue about everything. Now we get on really well. It was my fault, and I owe her an apology.»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Describí a la persona en UNA sola pieza, sin repetir «she is» tres veces\",\"Usé al menos un past perfect para contar lo que ya estaba antes\",\"Usé «used to» o «would» al menos una vez para el pasado repetido\",\"Usé al menos un recíproco (each other / one another)\",\"No dije ni un «I use to» en presente ni un «we know us»\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 3, para que el resto sea tuyo: «We were sharing a flat in Bogotá when it happened. My mother rang me on a Tuesday and she already knew about the job in London, and I hadn't told anybody. Clara had told her the week before, because she thought somebody had to. We didn't talk for two months. Looking back, it was my fault as much as hers: I had asked her to keep a secret I wasn't keeping myself.»\",\"itemIds\":[\"enb1m10getonreallywell\",\"enb1m10falloutwith\",\"enb1m10atallwomaninherforties\",\"enb1m10itwasmyfault\",\"enb1m10oweyouanapology\",\"enb1m10usedtolive\"],\"tip\":\"Las relaciones son el mejor tema posible para este módulo porque no se pueden contar en orden: siempre hay un antes. Si te bloqueas, «It all started when…» te arranca la frase y te da tiempo a pensar el resto.\"},{\"id\":\"enb1m10l9e14\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, SEIS preguntas. Léelas TODAS antes del play y usa el cuaderno: aquí lo que se lía es el ORDEN de lo que pasó. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Cuánto tiempo estuvieron sin hablarse las hermanas?\",\"options\":[\"Dos años\",\"Cuatro días\",\"Once meses\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Cuatro días es lo que tardó en escribir el mensaje de la una de la madrugada.\",\"Once son las veces que ha estado en esa casa desde que hicieron las paces.\"],\"itemIds\":[\"enb1m10falloutwith\",\"enb1m10losttouch\"],\"tip\":\"Tres cifras en tres minutos y las tres son de tiempo. Apunta cada una con su etiqueta —«sin hablarse», «tardó en escribir», «visitas»— o en la segunda escucha no sabrás cuál es cuál.\"},{\"id\":\"enb1m10l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: cómo se enteró.\",\"audio\":\"$19\",\"question\":\"¿Cómo se enteró de que su hermana se había quedado la silla?\",\"options\":[\"Vio una foto que Clara había publicado\",\"Se lo contó su madre por teléfono\",\"Lo vio al ir a casa de su abuela\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Su madre aparece dos años después, y para mandarla al bautizo del sobrino.\",\"A casa de la abuela no va nadie en este relato.\"],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10theorderofevents\"],\"tip\":\"«A photograph she HAD PUT online» — el past perfect marca que la foto es anterior a que ella la viera. En un relato inglés el orden real de los hechos se lee en los tiempos verbales, no en el orden de las frases.\"},{\"id\":\"enb1m10l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: qué había pasado en realidad.\",\"audio\":\"$1a\",\"question\":\"¿Qué había ocurrido de verdad con la silla?\",\"options\":[\"Clara sí había pedido permiso a su madre, y su madre olvidó decírselo\",\"Clara se la llevó sin decir nada a nadie\",\"La silla se la había dejado la abuela a Clara en un papel\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Ella misma reconoce que era verdad: «She had asked. She had asked the week before the funeral».\",\"De ningún papel ni testamento se habla.\"],\"itemIds\":[\"enb1m10hadntrealised\",\"enb1m10bythetime\"],\"tip\":\"Toda la información que deshace el lío va en past perfect: had asked, had forgotten. Ese tiempo verbal es el que ordena el relato, y por eso este módulo lo trae antes del Writing Part 2.\"},{\"id\":\"enb1m10l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4, y esta hay que deducirla.\",\"audio\":\"$1b\",\"question\":\"¿Por qué dice que ella también se equivocó?\",\"options\":[\"Porque dio por supuesto que la silla sería suya y tampoco preguntó\",\"Porque publicó la foto sin permiso\",\"Porque no fue al entierro de su abuela\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La foto la publicó Clara. Ella solo la vio.\",\"Del entierro dice que Clara preguntó la semana anterior; que ella no fuera no lo dice nadie.\"],\"itemIds\":[\"enb1m10itwasmyfault\",\"enb1m10regretteditever\"],\"tip\":\"«I had assumed» son dos palabras y contienen la respuesta entera. En el examen, cuando alguien admite algo sobre sí mismo, suele ser justo lo que te van a preguntar.\"},{\"id\":\"enb1m10l9e18\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5: quién dio el primer paso.\",\"audio\":\"$1c\",\"question\":\"¿Quién dio el primer paso para hacer las paces?\",\"options\":[\"Ninguna de las dos: fue la madre\",\"Clara, cuando nació su hijo\",\"Ella, con un mensaje de madrugada\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"El nacimiento del niño es la ocasión, pero quien descuelga el teléfono es la madre.\",\"Ese mensaje es del principio del enfado y es justamente el que empeoró las cosas.\"],\"itemIds\":[\"enb1m10makeup\",\"enb1m10getbackintouch\",\"enb1m10forgive\"],\"tip\":\"«Neither of us» abre la respuesta y la niega a la vez: en inglés esa palabra sola ya contesta «ninguno de los dos». Cuidado con oír solo el «us» y marcar a una de las dos.\"},{\"id\":\"enb1m10l9e19\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 6, la de actitud. La respuesta es la última frase del audio.\",\"audio\":\"$1d\",\"question\":\"¿Qué siente hoy por no haber hablado nunca de la silla?\",\"options\":[\"Que hay cosas que se cierran y otras que se quedan en el salón\",\"Que sigue doliéndole igual que el primer día\",\"Que piensa sacar el tema la próxima vez\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice «it used to» —le molestaba— en pasado, y precisamente para marcar que ya no.\",\"No lo dice en ningún momento. Lleva once visitas sin mencionarlo.\"],\"itemIds\":[\"enb1m10notanymore\",\"enb1m10usedtolive\",\"enb1m10trust\"],\"tip\":\"«It used to» a secas, sin verbo detrás, es inglés hablado puro: el verbo se sobreentiende de la pregunta anterior. Y el cierre —una imagen en vez de una conclusión— es exactamente lo que el Part 4 pregunta con «what does she mean by…?».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m10-3\",\"book\":\"I am sorry.\",\"real\":\"Sorry about that.\",\"meaning\":\"Perdona, lo siento (por algo pequeño y ya pasado)\",\"when\":\"Hablando, con cualquiera, y para cosas pequeñas: un retraso, un despiste, un pisotón. Para algo serio hace falta subir de escalón. Y en una carta formal del examen, la fórmula entera.\",\"register\":\"neutral\",\"exam\":\"I would like to apologise for the delay.\",\"note\":\"El sujeto y el verbo se caen enteros: nadie dice «I am sorry about that» en una situación menor. Dicho completo, suena a que la cosa fue grave.\",\"sound\":\"SO-ri a-báut dat\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m10natsorryaboutthat\"}}],\"resources\":[{\"label\":\"BBC Radio 4 — The Listening Project\",\"url\":\"https://www.bbc.co.uk/programmes/b01cqx3b\",\"note\":\"Conversaciones reales de dos personas que se conocen, de unos cinco minutos. Escucha una entera sin transcripción y cuenta cuántas veces oyes «used to» y «we'd». Es el inglés de este módulo, sin guion.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1e:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\
