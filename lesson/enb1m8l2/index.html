03e + comparativo + sujeto + verbo\u003cb\u003e,\u003c/b\u003e \u003cb\u003ethe\u003c/b\u003e + comparativo + sujeto + verbo.\u003cbr/\u003e· \u003ci\u003eThe more you recycle, the less you throw away.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eThe sooner we start, the easier it will be.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eThe cheaper it is, the more people buy it.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY hay una versión corta, sin verbos, que se oye a todas horas: \u003cb\u003eThe more, the better.\u003c/b\u003e «Cuantos más, mejor».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOjo con el tiempo verbal:\u003c/b\u003e en la primera mitad se usa \u003cb\u003epresente\u003c/b\u003e, aunque hables del futuro — \u003ci\u003ethe sooner we \u003cu\u003estart\u003c/u\u003e\u003c/i\u003e, no «we will start». Es la misma regla que ya has visto con \u003ci\u003ewhen\u003c/i\u003e y \u003ci\u003eif\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora los dos phrasal verbs de manual del módulo.\u003c/b\u003e Van juntos porque cada uno enseña una cosa distinta:\u003cbr/\u003e· \u003cb\u003ecut down on\u003c/b\u003e + algo = reducirlo, no eliminarlo. La preposición \u003cb\u003eon\u003c/b\u003e es obligatoria y no se cae nunca: \u003ci\u003ecut down \u003cu\u003eon\u003c/u\u003e plastic\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003ethrow away\u003c/b\u003e = tirar. Este es \u003cb\u003eseparable\u003c/b\u003e: \u003ci\u003ethrow the bottle away\u003c/i\u003e o \u003ci\u003ethrow away the bottle\u003c/i\u003e, las dos valen. \u003cb\u003ePero si el objeto es un pronombre, va OBLIGATORIAMENTE en medio\u003c/b\u003e: \u003ci\u003ethrow \u003cu\u003eit\u003c/u\u003e away\u003c/i\u003e. \u003cmark class=\"akk\"\u003eThrow away it\u003c/mark\u003e está mal, siempre."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l2\",\"phaseId\":\"enb1m8\",\"title\":\"The more you recycle…\",\"subtitle\":\"Dos comparativos en la misma frase, y los dos verbos con preposición pegada\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuanto más, y qué se hace con lo que sobra\",\"itemIds\":[\"enb1m8themorethebetter\",\"enb1m8thesooner\",\"enb1m8throwaway\",\"enb1m6cutdownon\",\"enb1m8singleuse\",\"enb1m8packaging\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«Cuanto más…, más…» — y por qué lleva dos «the»\",\"body\":\"$17\",\"table\":[[\"Molde\",\"Ejemplo\",\"Español\"],[\"The + comp., the + comp.\",\"The more you recycle, the less you throw away.\",\"Cuanto más reciclas, menos tiras\"],[\"Versión corta\",\"The more, the better.\",\"Cuantos más, mejor\"],[\"cut down ON\",\"Cut down on plastic.\",\"Reduce el plástico\"],[\"throw it AWAY\",\"Don't throw it away.\",\"No lo tires\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l2e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas nuevas\",\"pairs\":[{\"target\":\"single-use\",\"source\":\"de un solo uso\"},{\"target\":\"food waste\",\"source\":\"la comida que acaba en la basura\"},{\"target\":\"There is too much packaging.\",\"source\":\"Hay demasiado embalaje.\"},{\"target\":\"Don't throw it away.\",\"source\":\"No lo tires.\"}],\"itemIds\":[\"enb1m8singleuse\",\"enb1m8foodwaste\",\"enb1m8packaging\",\"enb1m8throwaway\"],\"tip\":\"«Packaging» y «food waste» son incontables: nunca llevan -s ni «a». Se dice «too much packaging», jamás «too many packagings».\"},{\"id\":\"enb1m8l2e2\",\"type\":\"mc\",\"prompt\":\"El molde del comparativo doble\",\"question\":\"«Cuanto más reciclas, menos tiras» →\",\"options\":[\"More you recycle, less you throw away.\",\"The more you recycle, the less you throw away.\",\"The more you recycle, the less you throw it away.\"],\"answer\":1,\"whyWrong\":[\"Faltan los dos «the». Sin ellos la construcción no existe en inglés.\",null,\"El «it» sobra: no hay un objeto concreto del que hablar, es una regla general.\"],\"itemIds\":[\"enb1m8themorethebetter\"],\"tip\":\"Los dos «the» no se traducen por nada. Piénsalos como los dos ganchos que sujetan la frase: si quitas uno, se cae.\"},{\"id\":\"enb1m8l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"More you recycle, less you throw away.\",\"answers\":[\"The more you recycle, the less you throw away.\"],\"why\":\"El comparativo doble inglés exige «the» delante de cada uno de los dos comparativos: The more…, the less… Sin ellos la frase suena a titular de periódico, no a inglés.\",\"translation\":\"Cuanto más reciclas, menos tiras.\",\"itemIds\":[\"enb1m8themorethebetter\"]},{\"id\":\"enb1m8l2e4\",\"type\":\"errorfix\",\"prompt\":\"El futuro que no se escribe\",\"wrong\":\"The sooner we will start, the easier it will be.\",\"answers\":[\"The sooner we start, the easier it will be.\"],\"why\":\"En la PRIMERA mitad va presente, aunque hables del futuro: «The sooner we start». El «will» solo aparece en la segunda mitad. Es la misma regla de «when I get there», no «when I will get there».\",\"translation\":\"Cuanto antes empecemos, más fácil será.\",\"itemIds\":[\"enb1m8thesooner\"]},{\"id\":\"enb1m8l2e5\",\"type\":\"errorfix\",\"prompt\":\"El pronombre del phrasal verb\",\"wrong\":\"Don't throw away it.\",\"answers\":[\"Don't throw it away.\"],\"why\":\"«throw away» es separable, y con un pronombre (it, them, him) el pronombre va OBLIGATORIAMENTE en medio: throw it away, throw them away. Con un sustantivo sí valen las dos posiciones.\",\"translation\":\"No lo tires.\",\"itemIds\":[\"enb1m8throwaway\"]},{\"id\":\"enb1m8l2e6\",\"type\":\"errorfix\",\"prompt\":\"La preposición que no se cae\",\"wrong\":\"We should cut down the single-use plastic.\",\"answers\":[\"We should cut down on single-use plastic.\"],\"why\":\"«cut down» a secas es talar un árbol. Reducir algo es «cut down ON». La preposición forma parte del verbo y no se pierde nunca.\",\"translation\":\"Deberíamos reducir el plástico de un solo uso.\",\"itemIds\":[\"enb1m6cutdownon\",\"enb1m8singleuse\"]},{\"id\":\"enb1m8l2e7\",\"type\":\"bucket\",\"prompt\":\"¿Dónde cae el pronombre? Clasifica las frases\",\"categories\":[\"BIEN\",\"MAL\"],\"items\":[{\"text\":\"Throw it away.\",\"bucket\":0},{\"text\":\"Throw away it.\",\"bucket\":1},{\"text\":\"Throw the bottle away.\",\"bucket\":0},{\"text\":\"Throw away the bottle.\",\"bucket\":0},{\"text\":\"Cut down on plastic.\",\"bucket\":0},{\"text\":\"Cut down plastic.\",\"bucket\":1}],\"itemIds\":[\"enb1m8throwaway\",\"enb1m6cutdownon\"],\"tip\":\"Tres de las cuatro primeras están bien: con sustantivo, el orden es libre. La única prohibida es la del pronombre al final. Y abajo, la preposición de «cut down on» no es opcional.\"},{\"id\":\"enb1m8l2e8\",\"type\":\"cloze\",\"prompt\":\"Completa el comparativo doble\",\"text\":\"___ sooner we start, the easier it will be.\",\"answers\":[\"The\"],\"translation\":\"Cuanto antes empecemos, más fácil será.\",\"hints\":[\"No se traduce por nada\",\"Tres letras\"],\"itemIds\":[\"enb1m8thesooner\"],\"tip\":\"Un artículo que no significa «el». Si te cuesta, aprende la frase entera de memoria y el molde vendrá solo.\"},{\"id\":\"enb1m8l2e9\",\"type\":\"build\",\"prompt\":\"Construye el comparativo doble\",\"target\":\"The more you recycle the less you throw away\",\"translation\":\"Cuanto más reciclas, menos tiras\",\"distractors\":[\"it\",\"will\"],\"itemIds\":[\"enb1m8themorethebetter\",\"enb1m8recycle\"],\"tip\":\"Dos «the», dos comparativos y ningún «it». Las fichas que sobran son las dos que se cuelan: el pronombre y el futuro.\"},{\"id\":\"enb1m8l2e10\",\"type\":\"transform\",\"prompt\":\"Del consejo suelto al comparativo doble\",\"source\":\"If we start early, it will be easy.\",\"instruction\":\"Dilo con «The sooner…, the easier…»\",\"answers\":[\"The sooner we start, the easier it will be\",\"The sooner we start the easier it will be\"],\"translation\":\"Cuanto antes empecemos, más fácil será.\",\"hints\":[\"Empieza por «The sooner»\",\"The sooner we start, the ... it will be\"],\"itemIds\":[\"enb1m8thesooner\"],\"tip\":\"Misma idea, dos registros: la de «if» es la de clase; la del comparativo doble es la que escribe alguien que argumenta. En el Writing, la segunda sube el criterio de estructuras.\"},{\"id\":\"enb1m8l2e11\",\"type\":\"gapbank\",\"prompt\":\"Completa la nota del tablón de la biblioteca\",\"text\":\"Please help us cut ___ on waste. Do not throw ___ paper that can still be used. ___ more you reuse, the less we have to buy.\",\"answers\":[\"down\",\"away\",\"The\"],\"bank\":[\"down\",\"away\",\"The\",\"off\",\"up\",\"A\"],\"translation\":\"Ayúdanos a reducir los residuos. No tires papel que aún se pueda usar. Cuanto más reutilices, menos tendremos que comprar.\",\"itemIds\":[\"enb1m6cutdownon\",\"enb1m8throwaway\",\"enb1m8themorethebetter\"],\"tip\":\"Aquí lo que se elige es la partícula, que es la mitad del verbo: «cut down on» y «throw away». Con otra partícula el verbo cambia de significado o directamente no existe. Y «A more you reuse» no se dice nunca.\"},{\"id\":\"enb1m8l2e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Deberíamos reducir el plástico de un solo uso.\",\"answers\":[\"We should cut down on single-use plastic\",\"We should cut down on single use plastic\",\"We ought to cut down on single-use plastic\"],\"hint\":\"El verbo lleva su preposición pegada\",\"itemIds\":[\"enb1m6cutdownon\",\"enb1m8singleuse\"],\"tip\":\"«Should» y «ought to» dicen lo mismo aquí. Lo que no cambia es el «on»: sin él, la frase habla de talar plástico.\"},{\"id\":\"enb1m8l2e13\",\"type\":\"shadow\",\"prompt\":\"Sombrea el eslogan — es la frase entera del módulo en diez palabras\",\"text\":\"The more you recycle, the less you throw away.\",\"phonetic\":\"de moo yu rii-SÁI-kol, de les yu zróu a-UÉI\",\"translation\":\"Cuanto más reciclas, menos tiras.\",\"reps\":2,\"itemIds\":[\"enb1m8themorethebetter\",\"enb1m8throwaway\"],\"tip\":\"Pégate al audio sin pensar. Los dos «the» apenas suenan («da»), y ese es justo el motivo por el que se olvidan al escribir.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
