s/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T73c,"])</script><script>self.__next_f.push([1,"El hispanohablante tiene un reflejo con los phrasal verbs: \u003cb\u003elos evita\u003c/b\u003e. Como el español no tiene esa categoría, tira del latinismo —\u003ci\u003epostpone\u003c/i\u003e en vez de \u003ci\u003eput off\u003c/i\u003e, \u003ci\u003eabandon\u003c/i\u003e en vez de \u003ci\u003egive up\u003c/i\u003e—, y le suena más culto. En inglés pasa justo lo contrario: \u003cb\u003esuena más formal de la cuenta\u003c/b\u003e, como quien escribe una instancia para decir que tiene tos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos siete de hoy, con su lógica:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eget over\u003c/b\u003e something — quitarse algo de encima (una gripe, un susto).\u003cbr/\u003e· \u003cb\u003ecome down with\u003c/b\u003e something — empezar a caer malo. Ya la traes de la lección 3.\u003cbr/\u003e· \u003cb\u003elook after\u003c/b\u003e somebody — cuidar de alguien.\u003cbr/\u003e· \u003cb\u003eput off\u003c/b\u003e something — aplazar.\u003cbr/\u003e· \u003cb\u003erun out of\u003c/b\u003e something — quedarse sin.\u003cbr/\u003e· \u003cb\u003egive up\u003c/b\u003e something — dejar algo definitivamente (fumar, el azúcar).\u003cbr/\u003e· \u003cb\u003eturn up\u003c/b\u003e — presentarse, aparecer. Y \u003cb\u003ecarry on\u003c/b\u003e — seguir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde va el objeto\u003c/b\u003e, que es la otra mitad de la batalla:\u003cbr/\u003e1. Algunos \u003cb\u003ese pueden partir\u003c/b\u003e: \u003ci\u003eput the appointment off\u003c/i\u003e = \u003ci\u003eput off the appointment\u003c/i\u003e. Los dos valen.\u003cbr/\u003e2. Pero si el objeto es un \u003cb\u003epronombre\u003c/b\u003e, va SIEMPRE en medio: \u003cb\u003e\u003ci\u003eput it off\u003c/i\u003e\u003c/b\u003e, jamás «put off it». Este es el error de la trampa nº10 y se cobra en el Writing.\u003cbr/\u003e3. Y otros \u003cb\u003eno se parten nunca\u003c/b\u003e, porque llevan preposición de verdad: \u003ci\u003elook after her\u003c/i\u003e (nunca «look her after»), \u003ci\u003eget over it\u003c/i\u003e, \u003ci\u003erun out of them\u003c/i\u003e, \u003ci\u003ecut down on it\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eLa regla práctica: \u003cb\u003esi detrás hay dos palabritas (out of, down on), no se parte\u003c/b\u003e. Si hay una sola y el objeto es un pronombre, se mete en medio.\u003cbr/\u003e\u003cbr/\u003eY un aviso de vocabulario que ahorra un susto: \u003cb\u003e\u003ci\u003ea tablet\u003c/i\u003e es una pastilla\u003c/b\u003e antes que un aparato. En una consulta, «I take three tablets a day» no habla de electrónica."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l7\",\"phaseId\":\"enb1m6\",\"title\":\"Getting over it\",\"subtitle\":\"Siete phrasal verbs de salud — y dónde va el objeto cuando lo hay\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los siete de hoy\",\"itemIds\":[\"enb1m6lookafter\",\"enb1m6putoff\",\"enb1m5runoutof\",\"enb1m6giveup\",\"enb1m6turnup\",\"enb1m6carryon\",\"ena2m8takeonetabletthreetimesaday\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el latinismo te delata\",\"body\":\"$17\",\"table\":[[\"Phrasal verb\",\"Significado\",\"¿Se parte?\"],[\"put off\",\"aplazar\",\"sí — put it off\"],[\"give up\",\"dejar del todo\",\"sí — give it up\"],[\"look after\",\"cuidar de\",\"no — look after her\"],[\"get over\",\"quitarse de encima\",\"no — get over it\"],[\"run out of\",\"quedarse sin\",\"no — run out of them\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l7e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro phrasal verbs\",\"pairs\":[{\"target\":\"look after\",\"source\":\"cuidar de alguien\"},{\"target\":\"put off\",\"source\":\"aplazar\"},{\"target\":\"run out of\",\"source\":\"quedarse sin\"},{\"target\":\"give up\",\"source\":\"dejar del todo\"}],\"itemIds\":[\"enb1m6lookafter\",\"enb1m6putoff\",\"enb1m5runoutof\",\"enb1m6giveup\"],\"tip\":\"Los cuatro tienen un latinismo equivalente (care for, postpone, exhaust, abandon) y ninguno de los cuatro es lo que diría un británico en la cocina. Aprende el phrasal y guarda el latinismo para los informes.\"},{\"id\":\"enb1m6l7e2\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre los phrasal verbs que ya traes\",\"pairs\":[{\"target\":\"put up with the noise\",\"source\":\"aguantar el ruido\"},{\"target\":\"I've got used to the noise.\",\"source\":\"Me he acostumbrado al ruido.\"},{\"target\":\"It depends on the landlord.\",\"source\":\"Depende del casero.\"},{\"target\":\"She ended up working nights.\",\"source\":\"Acabó trabajando de noche.\"},{\"target\":\"I deal with customers all day.\",\"source\":\"Trato con clientes todo el día.\"}],\"targetSeconds\":28,\"itemIds\":[\"enb1m1putupwith\",\"enb1m1getusedto\",\"enb1m1dependon\",\"enb1m2endup\",\"enb1m2dealwith\"],\"tip\":\"Cinco de módulos anteriores, cero nuevos. Fíjate en cuántos llevan dos partículas: esos son los que nunca se parten.\"},{\"id\":\"enb1m6l7e3\",\"type\":\"mc\",\"prompt\":\"El sitio del pronombre\",\"question\":\"«No lo aplaces más» →\",\"options\":[\"Don't put it off any longer.\",\"Don't put off it any longer.\",\"Don't put off any longer it.\"],\"answer\":0,\"whyWrong\":[null,\"Con pronombre no hay elección: va SIEMPRE en medio. «Put off it» no existe en ningún registro.\",\"El objeto no puede irse al final de la frase: se queda pegado al verbo.\"],\"itemIds\":[\"enb1m6putoff\"],\"tip\":\"Con sustantivo tienes las dos: «put the appointment off» y «put off the appointment». Con pronombre, una sola. Es la regla que más veces se rompe en el Writing del B1.\"},{\"id\":\"enb1m6l7e4\",\"type\":\"bucket\",\"prompt\":\"¿Se puede meter el objeto en medio o no?\",\"categories\":[\"El objeto puede ir en medio\",\"El objeto va siempre detrás\"],\"items\":[{\"text\":\"put the appointment off\",\"bucket\":0},{\"text\":\"give smoking up\",\"bucket\":0},{\"text\":\"look after my neighbour\",\"bucket\":1},{\"text\":\"get over the flu\",\"bucket\":1},{\"text\":\"cut down on salt\",\"bucket\":1},{\"text\":\"run out of tablets\",\"bucket\":1}],\"itemIds\":[\"enb1m6putoff\",\"enb1m6giveup\",\"enb1m6lookafter\",\"enb1m6getover\",\"enb1m6cutdownon\",\"enb1m5runoutof\"],\"tip\":\"Cuenta las palabritas del final: los de la derecha llevan una preposición de verdad (after, over, on, of) y por eso no se parten. Los de la izquierda llevan un adverbio (off, up), que sí se mueve.\"},{\"id\":\"enb1m6l7e5\",\"type\":\"errorfix\",\"prompt\":\"El calco del infinitivo español. Arréglalo.\",\"wrong\":\"He gave up to smoke two years ago.\",\"answers\":[\"He gave up smoking two years ago.\"],\"why\":\"Detrás de un phrasal verb va -ing, no infinitivo con «to». En español decimos «dejó DE FUMAR», con infinitivo, y de ahí sale el «to». La regla es la misma que con «try»: «give up smoking», «carry on working».\",\"translation\":\"Dejó de fumar hace dos años.\",\"itemIds\":[\"enb1m6giveup\"]},{\"id\":\"enb1m6l7e6\",\"type\":\"cloze\",\"prompt\":\"Completa la partícula\",\"text\":\"I've run ___ of tablets and the chemist's is shut.\",\"answers\":[\"out\"],\"translation\":\"Me he quedado sin pastillas y la farmacia está cerrada.\",\"hints\":[\"Es la partícula de «fuera»\",\"Tres letras\"],\"itemIds\":[\"enb1m5runoutof\",\"ena2m8takeonetabletthreetimesaday\"],\"tip\":\"«Run out of» lleva SIEMPRE el «of» cuando dices de qué te has quedado sin. Sin objeto se queda en «run out»: «the milk has run out».\"},{\"id\":\"enb1m6l7e7\",\"type\":\"build\",\"prompt\":\"Construye la frase con el pronombre en su sitio\",\"target\":\"Don't put it off any longer\",\"translation\":\"No lo aplaces más\",\"distractors\":[\"postpone\",\"more\"],\"itemIds\":[\"enb1m6putoff\"],\"tip\":\"Sobran los dos reflejos: el latinismo «postpone» y el «more» de quien traduce «más» sin pensar. Con negación y tiempo se dice «any longer», no «more».\"},{\"id\":\"enb1m6l7e8\",\"type\":\"transform\",\"prompt\":\"Cambia el sustantivo por un pronombre\",\"source\":\"Don't put the appointment off.\",\"instruction\":\"Sustituye «the appointment» por «it»\",\"answers\":[\"Don't put it off\",\"Don't put it off.\",\"Do not put it off\"],\"translation\":\"No la aplaces.\",\"hints\":[\"El pronombre se mete entre el verbo y la partícula\",\"Don't put ... off\"],\"itemIds\":[\"enb1m6putoff\"],\"tip\":\"Es un ejercicio de dos segundos y arregla un error que dura años. En cuanto entra un pronombre, el phrasal se parte obligatoriamente.\"},{\"id\":\"enb1m6l7e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje de Amy\",\"text\":\"I've run ___ of tablets and the chemist's is shut. Don't put it ___ any longer — ring them tomorrow. And who's looking ___ Nora while you're at work?\",\"answers\":[\"out\",\"off\",\"after\"],\"bank\":[\"out\",\"off\",\"after\",\"down\",\"on\",\"over\"],\"translation\":\"Me he quedado sin pastillas y la farmacia está cerrada. No lo aplaces más: llámales mañana. Y ¿quién cuida de Nora mientras estás trabajando?\",\"itemIds\":[\"enb1m5runoutof\",\"enb1m6putoff\",\"enb1m6lookafter\"],\"tip\":\"Tres partículas, tres verbos distintos y ninguna se puede adivinar por lógica: se aprenden pegadas al verbo. Por eso las tarjetas de este módulo llevan la frase entera y no la palabra suelta.\"},{\"id\":\"enb1m6l7e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Esta semana estoy cuidando de mi vecina.\",\"answers\":[\"I'm looking after my neighbour this week\",\"I am looking after my neighbour this week\",\"This week I'm looking after my neighbour\"],\"hint\":\"El phrasal verb de cuidar lleva la partícula de «después»\",\"itemIds\":[\"enb1m6lookafter\",\"enb1m1neighbourhood\"],\"tip\":\"«Look after» no se parte nunca: «look after her», jamás «look her after». Y ojo con «neighbour», que se escribe con -our en británico.\"},{\"id\":\"enb1m6l7e11\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? El inglés hablado se come los auxiliares\",\"book\":\"Have you been to the doctor?\",\"real\":\"You been to the doctor?\",\"translation\":\"¿Has ido al médico?\",\"itemIds\":[\"endoctor\"],\"tip\":\"El «Have» inicial desaparece del todo en pregunta informal, y lo único que queda del perfecto es el «been». Si esperas oír el auxiliar para saber que es un perfecto, en la calle no lo vas a oír nunca. En el examen escrito, en cambio, se escribe entero.\"},{\"id\":\"enb1m6l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No puedes seguir así: deberías dejar de trabajar dobles turnos.\",\"answers\":[\"You can't carry on like this: you should give up working double shifts\",\"You can't carry on like this. You should give up working double shifts\",\"You can't carry on like this: you should stop working double shifts\"],\"hints\":[\"«seguir así» es un phrasal verb con «on»\",\"You can't carry on like this: you should ...\"],\"itemIds\":[\"enb1m6carryon\",\"enb1m6giveup\",\"enb1m2nightshift\"],\"tip\":\"Dos phrasal verbs y un consejo en una sola frase. Fíjate en que los dos piden -ing detrás cuando llevan verbo: «carry on working», «give up working».\"},{\"id\":\"enb1m6l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Mr Patel en la tienda. Dos escuchas.\",\"audio\":\"Morning. You look like you're getting over it, anyway.|Just about. I've still got the cough.|My wife had the same thing in February. Took her three weeks to shake it off.|Three weeks? I'm supposed to be back on Monday.|Don't put it off if it's still there on Sunday — ring them. And you want to be looking after yourself, not carrying on as if nothing's happened. That's how people end up back at the doctor's.|You sound like Amy.|Well, Amy's a nurse, isn't she.\",\"question\":\"¿Qué le aconseja Mr Patel?\",\"options\":[\"Que se cuide y que llame al médico si sigue igual el domingo\",\"Que vuelva al trabajo el lunes de todas formas\",\"Que vaya a urgencias esta misma tarde\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Le dice justo lo contrario: «not carrying on as if nothing's happened».\",\"De urgencias no dice nada; habla de llamar al centro de salud.\"],\"itemIds\":[\"enb1m6getover\",\"enb1m6putoff\",\"enb1m6lookafter\",\"enb1m6carryon\"],\"tip\":\"Cuatro phrasal verbs en veinte segundos —getting over, put off, looking after, carrying on— y ni un latinismo. Así habla la gente. Si tu inglés no los usa, no es que sea peor: es que suena a otra cosa.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m6-4\",\"book\":\"It isn't serious.\",\"real\":\"It's nothing to worry about.\",\"meaning\":\"No es nada preocupante\",\"when\":\"Es lo que dice un médico, una enfermera o un amigo para tranquilizar. «It isn't serious» es correcto pero suena a informe; la versión real mira a la persona, no al diagnóstico. En el Writing formal, la corta y neutra.\",\"register\":\"neutral\",\"exam\":\"It's not serious.\",\"note\":\"Fíjate en que el inglés tranquiliza en negativo y con un sustantivo vacío: «nothing to worry about». En español haríamos «no te preocupes», con imperativo — y el imperativo inglés ahí sonaría a orden.\",\"sound\":\"its NÁ-zing tu UÓ-ri a-báut\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m6natnothingtoworry\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/c
