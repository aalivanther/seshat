l orden inverso al de la principal — allí «Ich \u003cb\u003emuss\u003c/b\u003e arbeiten», aquí «weil ich arbeiten \u003cb\u003emuss\u003c/b\u003e»: la pinza verbal se pliega y el auxiliar salta a la última posición. Y un truco de nativo con tu war/hatte de a2m2: en la subordinada, para estados pasados suena mucho mejor el pasado directo — \u003cb\u003eweil ich krank war\u003c/b\u003e, no «weil ich krank gewesen bin». Más corto, más natural, y es lo que el examen quiere leer.\",\"table\":[[\"principal\",\"subordinada — la cola de verbos\"],[\"Ich muss arbeiten.\",\"..., weil ich arbeiten muss\"],[\"Ich habe schlecht geschlafen.\",\"..., weil ich schlecht geschlafen habe\"],[\"Ich war krank.\",\"..., weil ich krank war\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m6l5e1\",\"type\":\"mc\",\"prompt\":\"Caza el orden de la cola\",\"question\":\"«No voy porque tengo que trabajar» →\",\"options\":[\"Ich komme nicht, weil ich muss arbeiten\",\"Ich komme nicht, weil ich arbeiten muss\"],\"answer\":1,\"whyWrong\":[\"Con dos verbos en la subordinada, el conjugado (muss) va EL ÚLTIMO — detrás incluso del infinitivo\",null],\"itemIds\":[\"a2m6weilicharbeitenmuss\",\"a2m6weil\",\"muessen\"],\"tip\":\"En la principal el modal va 2º (Ich muss arbeiten); tras weil, la fila se invierte: arbeiten muss.\"},{\"id\":\"a2m6l5e2\",\"type\":\"cloze\",\"prompt\":\"Completa la cola\",\"text\":\"Ich komme nicht, weil ich arbeiten ___. (tengo que)\",\"answers\":[\"muss\"],\"translation\":\"No voy porque tengo que trabajar.\",\"hints\":[\"El modal conjugado cierra la subordinada\",\"m-u-s-s, en última posición\"],\"itemIds\":[\"a2m6weilicharbeitenmuss\",\"muessen\"]},{\"id\":\"a2m6l5e3\",\"type\":\"mc\",\"prompt\":\"Ahora con Perfekt\",\"question\":\"Ich bin satt, ... (estoy lleno) — ¿cómo sigue?\",\"options\":[\"weil ich Pizza habe gegessen\",\"weil ich Pizza gegessen habe\"],\"answer\":1,\"whyWrong\":[\"El auxiliar conjugado cierra la frase: primero el participio (gegessen), después habe\",null],\"itemIds\":[\"a2m6weil\",\"gegessen\"],\"tip\":\"Participio primero, auxiliar al final: gegessen habe. La cola siempre termina en el verbo conjugado.\"},{\"id\":\"a2m6l5e4\",\"type\":\"transform\",\"prompt\":\"Transforma: une con weil (modal)\",\"source\":\"Ich komme nicht. Ich muss arbeiten.\",\"instruction\":\"Únelas con weil\",\"answers\":[\"Ich komme nicht, weil ich arbeiten muss\",\"Ich komme nicht, weil ich arbeiten muss.\"],\"translation\":\"No voy porque tengo que trabajar.\",\"hints\":[\"muss abandona la 2ª posición\",\"..., weil ich arbeiten muss\"],\"itemIds\":[\"a2m6weilicharbeitenmuss\",\"a2m6weil\",\"muessen\"],\"tip\":\"«Ich muss arbeiten» se pliega a «weil ich arbeiten muss»: los dos verbos a la cola, el conjugado el último.\"},{\"id\":\"a2m6l5e5\",\"type\":\"transform\",\"prompt\":\"Transforma: une con weil (Perfekt)\",\"source\":\"Ich bin glücklich. Ich habe meine Tasche gefunden.\",\"instruction\":\"Únelas con weil\",\"answers\":[\"Ich bin glücklich, weil ich meine Tasche gefunden habe\",\"Ich bin glücklich, weil ich meine Tasche gefunden habe.\"],\"translation\":\"Estoy contento porque encontré mi bolso.\",\"hints\":[\"El participio primero, el auxiliar cerrando\",\"..., weil ich meine Tasche gefunden habe\"],\"itemIds\":[\"a2m6weil\",\"a2m1gefunden\",\"a2m4tasche\",\"gluecklich\"],\"tip\":\"Tu pinza de a2m1 (habe ... gefunden) se pliega tras weil: gefunden habe. Misma pieza, nueva postura.\"},{\"id\":\"a2m6l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa — el truco de nativo\",\"text\":\"Ich war gestern nicht im Kurs, weil ich krank ___. (estaba)\",\"answers\":[\"war\"],\"translation\":\"Ayer no fui al curso porque estaba enfermo.\",\"hints\":[\"Estado pasado en la subordinada: pasado directo\",\"w-a-r, al final\"],\"itemIds\":[\"a2m6weilichkrankwar\",\"krank\",\"gestern\"],\"tip\":\"weil ich krank war suena a nativo; «weil ich krank gewesen bin» es correcto pero pesado — el alemán real elige war.\"},{\"id\":\"a2m6l5e7\",\"type\":\"mc\",\"prompt\":\"Espiral con tu biografía (a2m3)\",\"question\":\"«..., porque de niño no sabía nadar» →\",\"options\":[\"weil ich als Kind nicht schwimmen konnte\",\"weil ich als Kind nicht konnte schwimmen\"],\"answer\":0,\"whyWrong\":[null,\"konnte es el verbo conjugado: cierra la cola — detrás del infinitivo schwimmen\"],\"itemIds\":[\"a2m6weil\",\"a2m3konnte\",\"a2m3alskind\",\"schwimmen\"],\"tip\":\"También los modales en Präteritum obedecen: schwimmen konnte — infinitivo y luego el conjugado, siempre el último.\"},{\"id\":\"a2m6l5e8\",\"type\":\"build\",\"prompt\":\"Construye la excusa de Sofía\",\"target\":\"Sofia bleibt zu Hause, weil sie Fieber hat\",\"translation\":\"Sofía se queda en casa porque tiene fiebre\",\"altTargets\":[\"Weil sie Fieber hat, bleibt Sofia zu Hause\"],\"distractors\":[\"ist\",\"haben\"],\"itemIds\":[\"a2m6weil\",\"bleiben\",\"fieber\"],\"tip\":\"hat cierra la subordinada — y concuerda con sie: la cola de verbos no te libra de conjugar bien.\"},{\"id\":\"a2m6l5e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la excusa\",\"text\":\"Ich komme nicht, weil ich arbeiten muss\",\"translation\":\"No voy porque tengo que trabajar\",\"hints\":[\"Dos verbos al final, en fila\",\"... weil ich arbeiten muss\"],\"itemIds\":[\"a2m6weilicharbeitenmuss\",\"muessen\"]},{\"id\":\"a2m6l5e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No voy al cine porque tengo que trabajar\",\"answers\":[\"Ich gehe nicht ins Kino, weil ich arbeiten muss\",\"Ich komme nicht ins Kino, weil ich arbeiten muss\"],\"hints\":[\"ins Kino en la principal, la cola de verbos en la subordinada\",\"Ich gehe nicht ins Kino, weil ich ...\"],\"itemIds\":[\"a2m6weilicharbeitenmuss\",\"kino\",\"muessen\",\"gehen\"],\"tip\":\"La excusa perfecta existe y acaba en muss. Con la cola de verbos dominada, ninguna subordinada te queda grande. (denn también existe — el porque con el orden intacto — pero aquí entrena weil.)\"}]}],\"resources\":[{\"label\":
