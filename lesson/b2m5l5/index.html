e.\u003cbr/\u003e\u003cbr/\u003eEn un texto de examen, la tesis sin [[Begründung|fundamentación]] no puntúa, y un [[Gegenargument|contraargumento]] sin refutación deja el párrafo a medias. La fórmula de cierre culto: \u003cb\u003eDas mag zutreffen; dennoch …\u003c/b\u003e\",\"table\":[[\"pieza\",\"¿verbo al final?\",\"ejemplo\"],[\"allerdings / jedoch / hingegen\",\"no: inversión\",\"Allerdings bin ich dagegen.\"],[\"dennoch\",\"no: inversión\",\"Dennoch bleibe ich dabei.\"],[\"zwar\",\"no\",\"Die Straße ist zwar laut, aber …\"],[\"wobei / zumal / indem\",\"sí\",\"…, wobei die Lieferungen bleiben können.\"],[\"je … desto\",\"sí SOLO en je\",\"Je klarer die Regel ist, desto weniger …\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m5l5e1\",\"type\":\"errorfix\",\"prompt\":\"El calco número uno de esta clínica. Arréglalo.\",\"wrong\":\"Allerdings ich bin gegen die Spielstraße.\",\"answers\":[\"Allerdings bin ich gegen die Spielstraße.\",\"Allerdings bin ich gegen die Spielstraße\"],\"why\":\"allerdings es adverbio en posición 1 → el verbo se le pega detrás y el sujeto va después. Es la misma trampa de deshalb, con un conector que parece más culto.\",\"translation\":\"Ahora bien, estoy en contra de la calle de juego.\",\"itemIds\":[\"b1m7feallerdings\",\"b2m5hingegen\"]},{\"id\":\"b2m5l5e2\",\"type\":\"mc\",\"prompt\":\"zwar o wobei\",\"question\":\"¿Qué frase está bien?\",\"options\":[\"Die Umfrage zeigt zwar eine Mehrheit, aber die Minderheit hat auch Stimme.\",\"Die Umfrage zeigt wobei eine Mehrheit, aber die Minderheit hat auch Stimme.\"],\"answer\":0,\"whyWrong\":[null,\"wobei no se cuela detrás del verbo como zwar: o abre una subordinada, o no está\"],\"itemIds\":[\"b2m5zwaraber\",\"b2m5wobei\",\"b2m5minderheit\"]},{\"id\":\"b2m5l5e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica el efecto en el verbo\",\"categories\":[\"inversión (verbo 2º)\",\"verbo al FINAL\"],\"items\":[{\"text\":\"Allerdings …\",\"bucket\":0},{\"text\":\"wobei …\",\"bucket\":1},{\"tex ":\"(Mit freundlichen Grüßen|Freundliche Grüße)\",\"label\":\"hay Gruß\"}],\"frame\":[\"Anrede Sie\",\"motivo\",\"petición + plazo\",\"Gruß + nombre\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"weil\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":120,\"model\":\"Sehr geehrte Frau Reuter,\\nzwar brauchen die Kinder die Lindenstraße am Nachmittag, allerdings muss der Lieferverkehr den Bäcker am Vormittag erreichen. Deshalb bitte ich Sie, ein Zeitfenster von 7 bis 11 Uhr zu lassen und die Spielstraße danach zu sperren. Außerdem sollten Anwohner mit Ausweis durchfahren dürfen, weil sonst die Pflege nicht vor die Tür kommt. Allerdings wäre eine Totalsperre ohne Ersatz ein Schaden für die Läden, nicht ein Gewinn für die Kinder. Ich stehe für Rückfragen gern zur Verfügung. Eine kurze schriftliche Bestätigung reicht.\\nMit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[],\"tip\":\"Menos de 50 palabras o tema equivocado: 0. Ni un du.\"},{\"id\":\"b2m5l5ex82\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag. Off-topic = 0.\",\"scenario\":\"Foro de radio: alguien dice que Ehrenamt debería ser obligatorio para ciertos trámites. Concede, rebati, propuesta. Off-topic = 0.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Tim S.\",\"text\":\"Wer vom Bezirk etwas will, soll vorher Ehrenamt nachweisen. Sonst reden alle von Gemeinschaft und niemand packt an.\"},\"bullets\":[\"Concede un punto a Tim S. y marca el desacuerdo.\",\"Una ventaja y un inconveniente, con ejemplo.\",\"Una propuesta concreta y un cierre.\"],\"checks\":[{\"re\":\"(zwar|allerdings|jedoch)\",\"label\":\"concedes antes de rebatir\"},{\"re\":\"(Vorteil|Nachteil|einerseits|andererseits)\",\"label\":\"ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|schlage vor|Vorschlag)\",\"label\":\"hay propuesta\"}],\"frame\":[\"Apertura\",\"concesión\",\"pro/contra\",\"propuesta\",\"cierre\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Tim S. möchte ich Folgendes sagen: Zwar stimmt, dass der Bezirk ohne Freiwillige den Takt nicht hält. Allerdings darf ein Amt keinen Dienst erzwingen, nur weil jemand einen Antrag stellt. Ein Vorteil des Ehrenamts ist, dass man den Kiez kennt, bevor man über ihn entscheidet. Ein Nachteil ist, dass Schichtpersonal den Samstag nicht opfern kann. Deshalb sollte das Amt Stunden anrechnen, nicht vorschreiben. Außerdem müsste es eine Alternative geben: eine Gebühr, eine Wartezeit, aber kein Zwang. Ich plädiere dafür, zu werben und zu erleichtern, weil Pflicht aus dem Ehrenamt einen Stempel macht. Trotzdem bleibt die Idee hörbar: wer hilft, sollte nicht hinten in der Schlange stehen. Nur so bleibt die Sache nachvollziehbar. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll.\",\"itemIds\":[],\"tip\":\"150 palabras: intro, concesión, dos argumentos, propuesta, cierre. Off-topic = 0.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m5-4\",\"book\":\"Das stimmt, aber …\",\"real\":\"Ja schon, aber …\",\"meaning\":\"Ya, vale, pero … (concedes y dejas caer lo que de verdad piensas).\",\"when\":\"En una discusión hablada, para no empezar con un no. Por escrito y en el examen, la concesión culta no usa schon: usa mag zutreffen y dennoch.\",\"register\":\"amigos\",\"exam\":\"Das mag zutreffen; dennoch …\",\"note\":\"Ja schon no afirma: aparca. Lo que puntúa es lo que viene detrás, igual que tras aber. El examen cambia de estrategia, no de cortesía.\",\"sound\":\"ya shoon, A-ba\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"b2m5natjaschonaber\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",
