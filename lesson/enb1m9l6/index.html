3ecalls at\u003c/i\u003e. Y detrás va la lista entera de estaciones, seguida y sin pausas.\u003cbr/\u003e· \u003cb\u003eWe'll be boarding in about ten minutes.\u003c/b\u003e — aquí está el \u003cb\u003efuture continuous\u003c/b\u003e, y lo tienes que \u003cu\u003ereconocer\u003c/u\u003e, no producir. \u003ci\u003ewill be + -ing\u003c/i\u003e se usa para lo que va a estar pasando dentro de un rato, sin que nadie lo decida en ese momento. Es \u003cb\u003eel tiempo de la megafonía y de la azafata\u003c/b\u003e: \u003ci\u003ewe'll be landing shortly\u003c/i\u003e, \u003ci\u003ewe'll be coming round with drinks\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eMind the gap.\u003c/b\u003e — el aviso más famoso del metro de Londres: cuidado con el hueco entre el tren y el andén.\u003cbr/\u003e· \u003cb\u003eStand clear of the doors.\u003c/b\u003e — apártense de las puertas. \u003ci\u003eClear of\u003c/i\u003e, no «clear from».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos palabras que no se pueden confundir:\u003c/b\u003e \u003cb\u003e\u003ci\u003eplatform\u003c/i\u003e\u003c/b\u003e es del tren (el andén) y \u003cb\u003e\u003ci\u003egate\u003c/i\u003e\u003c/b\u003e es del avión (la puerta de embarque). En un aeropuerto nadie dice \u003ci\u003eplatform\u003c/i\u003e y en una estación nadie dice \u003ci\u003egate\u003c/i\u003e. Confundirlas en el Listening cuesta el ítem entero, porque las dos van seguidas de un número y las dos suenan igual de plausibles.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la estrategia, que es la mitad del asunto:\u003c/b\u003e un aviso británico \u003cb\u003edice el dato una vez y en medio\u003c/b\u003e. La estructura es siempre igual: \u003ci\u003edisculpa → servicio → dato → instrucción\u003c/i\u003e. Si te pierdes en la disculpa (\u003ci\u003ewe are sorry to announce that…\u003c/i\u003e), te pierdes el dato. Sáltate el principio con la oreja y espera al número.\u003cbr/\u003e\u003cbr/\u003eUn aviso de fonética que vale puntos: en el habla rápida \u003cb\u003elos avisos se comen el principio de la frase\u003c/b\u003e. \u003ci\u003eThe next station is Oxford Circus\u003c/i\u003e sale como \u003cb\u003e«Next station, Oxford Circus»\u003c/b\u003e. No es que hablen mal: es que en un aviso la primera parte se puede predecir, y por eso desaparece."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l6\",\"phaseId\":\"enb1m9\",\"title\":\"This train calls at…\",\"subtitle\":\"El inglés de los altavoces: se dice rápido, se dice una vez y no se repite\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que suena por los altavoces\",\"itemIds\":[\"enb1m9thegate\",\"enb1m9willbeboarding\",\"enb1m9thistraincallsat\",\"enb1m9mindthegap\",\"enb1m9thedepartureboard\",\"enb1m9standclear\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: los altavoces hablan en un inglés propio\",\"body\":\"$17\",\"table\":[[\"Dónde\",\"Palabra del número\",\"Verbo típico\"],[\"Estación de tren\",\"platform four\",\"This train calls at…\"],[\"Aeropuerto\",\"gate twelve\",\"We'll be boarding…\"],[\"Estación de autobuses\",\"stand C\",\"The service will depart from…\"],[\"Metro de Londres\",\"—\",\"Mind the gap.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l6e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro avisos\",\"pairs\":[{\"target\":\"This train calls at Reading and Slough.\",\"source\":\"Este tren efectúa parada en Reading y Slough.\"},{\"target\":\"We'll be boarding in about ten minutes.\",\"source\":\"Empezaremos a embarcar dentro de unos diez minutos.\"},{\"target\":\"Mind the gap.\",\"source\":\"Cuidado con el hueco entre el tren y el andén.\"},{\"target\":\"Stand clear of the doors.\",\"source\":\"Apártense de las puertas.\"}],\"itemIds\":[\"enb1m9thistraincallsat\",\"enb1m9willbeboarding\",\"enb1m9mindthegap\",\"enb1m9standclear\"],\"tip\":\"Los cuatro son moldes fijos: se dicen siempre con las mismas palabras. Apréndetelos enteros, como si fueran una sola pieza, y lo único que tendrás que escuchar es el nombre y el número que van dentro.\"},{\"id\":\"enb1m9l6e2\",\"type\":\"mc\",\"prompt\":\"Andén o puerta\",\"question\":\"Estás en Heathrow y por megafonía dicen tu apellido. ¿Adónde te mandan?\",\"options\":[\"To gate twelve\",\"To platform twelve\",\"To stand twelve\"],\"answer\":0,\"whyWrong\":[null,\"«Platform» es el andén de un tren. En un aeropuerto no existe.\",\"«Stand» es la dársena de una estación de autocares. Tampoco es de aeropuerto.\"],\"itemIds\":[\"enb1m9thegate\",\"ena2m6platformfour\"],\"tip\":\"Tres palabras, tres sitios: platform (tren), gate (avión), stand (autocar). Las tres van seguidas de un número y las tres suenan plausibles en un examen — por eso la palabra, no el número, es lo que hay que oír.\"},{\"id\":\"enb1m9l6e3\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? La megafonía se come el principio\",\"book\":\"The next station is Oxford Circus.\",\"real\":\"Next station, Oxford Circus.\",\"translation\":\"Próxima estación, Oxford Circus.\",\"itemIds\":[\"enb1m9thistraincallsat\"],\"tip\":\"En un aviso, la parte previsible desaparece: si todo el mundo sabe que van a decir cuál es la próxima estación, «the next station is» sobra. Lo que queda es el dato. En el Listening del examen pasa lo mismo con las horas y los precios.\"},{\"id\":\"enb1m9l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de las paradas\",\"text\":\"This is the 14:52 to Manchester Piccadilly. This train ___ at Stockport and Macclesfield.\",\"answers\":[\"calls\",\"stops\"],\"translation\":\"Este es el de las 14:52 a Manchester Piccadilly. Efectúa parada en Stockport y Macclesfield.\",\"hints\":[\"Es el verbo oficial de las paradas de un tren\",\"Cinco letras y lleva «at» detrás\"],\"itemIds\":[\"enb1m9thistraincallsat\"],\"tip\":\"«Call at» es una de esas preposiciones que van pegadas al verbo y no se traducen: se aprende el bloque entero. Y ojo, «call at» solo lo hacen los trenes y los barcos; una persona «calls at» una casa cuando pasa a verte un momento.\"},{\"id\":\"enb1m9l6e5\",\"type\":\"errorfix\",\"prompt\":\"Sobra UNA palabra\",\"wrong\":\"Excuse me, which way is the gate twelve?\",\"answers\":[\"Excuse me, which way is gate twelve?\"],\"why\":\"«Gate», «platform» y «stand» funcionan como un nombre propio cuando llevan número detrás: van sin artículo. Igual que «platform four» o «room 12». El español pone artículo («la puerta doce») y de ahí sale el «the».\",\"translation\":\"Perdone, ¿por dónde se va a la puerta doce?\",\"itemIds\":[\"enb1m9thegate\",\"enb1m9natwhichwaysgate\"]},{\"id\":\"enb1m9l6e6\",\"type\":\"gapbank\",\"prompt\":\"Completa los avisos de una estación cualquiera\",\"text\":\"The 14:52 to Manchester Piccadilly is now standing at ___ 3. This train ___ at Stockport and Macclesfield. Please stand ___ of the doors, and mind the ___ between the train and the platform.\",\"answers\":[\"platform\",\"calls\",\"clear\",\"gap\"],\"bank\":[\"platform\",\"calls\",\"clear\",\"gap\",\"gate\",\"leaves\",\"boarding\"],\"translation\":\"El de las 14:52 a Manchester Piccadilly se encuentra estacionado en el andén 3. Efectúa parada en Stockport y Macclesfield. Rogamos se aparten de las puertas y tengan cuidado con el hueco entre el tren y el andén.\",\"itemIds\":[\"ena2m6platformfour\",\"enb1m9thistraincallsat\",\"enb1m9standclear\",\"enb1m9mindthegap\"],\"tip\":\"«Gate» está en el banco de propósito: cabe en el primer hueco por gramática y no cabe por sitio, porque el texto dice «This train». Esa es la clase de descarte que se hace en el Listening — no por la palabra, por dónde estás.\"},{\"id\":\"enb1m9l6e7\",\"type\":\"bucket\",\"prompt\":\"¿Estación de tren o aeropuerto?\",\"categories\":[\"Estación de tren\",\"Aeropuerto\"],\"items\":[{\"text\":\"This train calls at Stockport.\",\"bucket\":0},{\"text\":\"We'll be boarding at gate twelve.\",\"bucket\":1},{\"text\":\"Mind the gap between the train and the platform.\",\"bucket\":0},{\"text\":\"Please have your boarding pass ready.\",\"bucket\":1},{\"text\":\"The service will depart from platform 3.\",\"bucket\":0},{\"text\":\"Passengers travelling to Dublin, please proceed to passport control.\",\"bucket\":1}],\"itemIds\":[\"enb1m9thistraincallsat\",\"enb1m9willbeboarding\",\"enb1m9mindthegap\",\"enb1m9boardingpass\",\"enb1m9thegate\"],\"tip\":\"Ninguna de las seis dice dónde estás: lo dice el vocabulario. Y eso es exactamente lo que pregunta el Listening Part 2 cuando pide «context» — no dónde lo dice el audio, sino de qué palabras se deduce.\"},{\"id\":\"enb1m9l6e8\",\"type\":\"build\",\"prompt\":\"Construye el aviso del avión\",\"target\":\"We will be boarding in about ten minutes\",\"translation\":\"Empezaremos a embarcar dentro de unos diez minutos\",\"distractors\":[\"board\",\"going\"],\"itemIds\":[\"enb1m9willbeboarding\"],\"tip\":\"«will be + -ing» es el futuro continuo, y es la voz de la megafonía. No hace falta que lo produzcas: hace falta que al oírlo sepas que habla de dentro de un rato y no de ahora mismo.\"},{\"id\":\"enb1m9l6e9\",\"type\":\"transform\",\"prompt\":\"Sube el registro de la pregunta\",\"source\":\"Which way's gate twelve?\",\"instruction\":\"Pregúntalo como en el examen, con «Could you tell me…»\",\"answers\":[\"Excuse me, could you tell me where gate twelve is?\",\"Could you tell me where gate twelve is?\",\"Excuse me, could you tell me where gate 12 is?\"],\"translation\":\"Perdone, ¿me podría decir dónde está la puerta doce?\",\"hints\":[\"La pregunta indirecta del módulo 3: sin inversión y sin «is» delante\",\"Could you tell me where gate twelve ...?\"],\"itemIds\":[\"enb1m9natwhichwaysgate\",\"enb1m3couldyoutellme\",\"enb1m9thegate\"],\"tip\":\"Fíjate en el orden: «where gate twelve IS», no «where is gate twelve». Dentro de una pregunta indirecta el verbo vuelve al final, como en una frase normal. Es del módulo 3 y es lo que más sube el registro percibido por una sola fórmula.\"},{\"id\":\"enb1m9l6e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Mira el panel de salidas: todavía no han puesto la puerta.\",\"answers\":[\"Look at the departure board: they haven't put the gate up yet\",\"Look at the departure board, they haven't put the gate up yet\",\"Check the departure board: the gate isn't up yet\"],\"hint\":\"«Todavía no» va al final de la frase, en dos palabras separadas\",\"itemIds\":[\"enb1m9thedepartureboard\",\"enb1m9thegate\",\"enb1m1notyet\"],\"tip\":\"«The gate isn't up yet» es como se dice de verdad: la puerta «sube» al panel. Y ese «yet» al final es del módulo 1, viajando dentro de una frase de aeropuerto sin que nadie lo anuncie.\"},{\"id\":\"enb1m9l6e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué acaban de anunciar?\",\"source\":\"We are sorry to announce that the 19:06 to Cardiff Central is delayed by approximately twenty minutes.\",\"answers\":[\"Lamentamos comunicar que el de las 19:06 a Cardiff Central lleva unos veinte minutos de retraso\",\"Sentimos comunicar que el de las 19:06 a Cardiff Central lleva aproximadamente veinte minutos de retraso\",\"Lamentamos anunciar que el de las 19:06 a Cardiff Central sufre un retraso de unos veinte minutos\"],\"itemIds\":[\"enb1m9adelay\",\"ena2m12theannouncement\"],\"tip\":\"Fíjate en dónde está el dato: al final, después de doce palabras de fórmula. Si te agotas escuchando la disculpa, llegas al número sin oreja. En la megafonía el principio se puede ignorar entero.\"},{\"id\":\"enb1m9l6e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe el aviso que oyes\",\"text\":\"This train calls at Reading and Slough.\",\"translation\":\"Este tren efectúa parada en Reading y Slough.\",\"hints\":[\"Empieza por «This train…»\",\"This train calls at ... and Slough\"],\"itemIds\":[\"enb1m9thistraincallsat\"],\"tip\":\"«Slough» se pronuncia «sláu», rimando con «now», y no tiene nada que ver con cómo se escribe. Los topónimos británicos son así: si te suenan raro al oírlos, es que los estás oyendo bien.\"},{\"id\":\"enb1m9l6e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: cuatro avisos seguidos, como en una sala de embarque. Dos escuchas.\",\"notepad\":true,\"audio\":\"This is a customer announcement. The 18:22 service to Brighton is delayed by approximately fifteen minutes. We are sorry for the delay.|Passengers travelling on the 18:40 to Bristol: this service has been cancelled. A replacement bus will depart from stand C.|Would passengers for flight EI 233 to Dublin please proceed to gate twelve. We'll be boarding in about ten minutes.|The 19:06 to Cardiff Central is now standing at platform 3. This train calls at Reading, Swindon and Newport.\",\"question\":\"¿Cuál de los cuatro servicios NO va a salir?\",\"options\":[\"El de las 18:40 a Bristol\",\"El de las 18:22 a Brighton\",\"El de las 19:06 a Cardiff\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ese lleva retraso, que no es lo mismo: «delayed by approximately fifteen minutes». Sale, pero tarde.\",\"Ese está ya en el andén 3 y con la lista de paradas anunciada.\"],\"itemIds\":[\"enb1m9cancelled\",\"enb1m9adelay\",\"enb1m9willbeboarding\",\"enb1m9thistraincallsat\"],\"tip\":\"Cuatro avisos, cuatro verbos distintos: delayed, cancelled, boarding, standing. Con esos cuatro y un número entiendes cualquier estación británica. Apúntalos en el cuaderno mientras suena: aquí sí sirve de algo, porque son datos.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m9-3\",\"book\":\"Where is gate 12?\",\"real\":\"Which way's gate twelve?\",\"meaning\":\"¿Por dónde se va a la doce?\",\"when\":\"Hablando, a alguien de uniforme o a otro pasajero, cuando lo que quieres no es la ubicación exacta sino la dirección. Se usa muchísimo en aeropuertos y estaciones grandes. En el Speaking del examen, la pregunta indirecta completa: es la que sube la banda de gramática.\",\"register\":\"neutral\",\"exam\":\"Excuse me, could you tell me where gate 12 is?\",\"note\":\"«Which way» pregunta por la dirección, no por el sitio: la respuesta que espera es «left at the end» o «keep going». Y fíjate en el número dicho en letra, «twelve»: en los avisos y hablando, las puertas y los andenes se dicen, no se deletrean.\",\"sound\":\"uich uéis̬ guéit tuélv\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m9natwhichwaysgate\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
