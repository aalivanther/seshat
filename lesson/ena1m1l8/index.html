ntera en inglés\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de cartel\",\"itemIds\":[\"enmrmrs\",\"enhaveaniceday\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Lee como en el examen: carteles, placas y tarjetas\",\"body\":\"En el Reading del examen leerás textos de pocas palabras: busca el DATO, no cada palabra. Tres textos de tu primera semana en Londres:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1 · La placa de la recepción:\u003c/b\u003e «Reception — \u003cb\u003eMr\u003c/b\u003e Tom King · \u003cb\u003eMrs\u003c/b\u003e Rosa King»\u003cbr/\u003e\u003cb\u003e2 · La tarjeta en tu mesa:\u003c/b\u003e «Hi Valeria! Welcome to London! My name is Amy. See you later!»\u003cbr/\u003e\u003cb\u003e3 · El cartel al salir de la tienda:\u003c/b\u003e «Goodbye! [[Have a nice day!|¡Que tengas un buen día!]]»\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMr\u003c/b\u003e (señor) y \u003cb\u003eMrs\u003c/b\u003e (señora) van SIEMPRE con el apellido: Mr Patel, Mrs King — nunca «Mr Ravi». Y el \u003cb\u003eHave a nice day!\u003c/b\u003e es la despedida oficial de todas las tiendas del mundo inglés.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m1l8e1\",\"type\":\"mc\",\"prompt\":\"La placa, dato 1\",\"question\":\"En la placa de recepción lees: «Mrs Rosa King». ¿Quién es?\",\"options\":[\"Una señora — Mrs\",\"Un señor — Mr\",\"Una niña\"],\"answer\":0,\"whyWrong\":[null,\"El señor de la placa es Mr Tom King\",\"Mrs es tratamiento de adulta — y siempre con apellido\"],\"itemIds\":[\"enmrmrs\"],\"tip\":\"Mr = señor, Mrs = señora. En el Reading del examen, la abreviatura ES el dato.\"},{\"id\":\"ena1m1l8e2\",\"type\":\"mc\",\"prompt\":\"La tarjeta, dato 2\",\"question\":\"«Hi Valeria! Welcome to London! My name is Amy. See you later!» — ¿Quién escribe la tarjeta?\",\"options\":[\"Amy\",\"Valeria\",\"Mrs King\"],\"answer\":0,\"whyWrong\":[null,\"Valeria la RECIBE — la firma está en My name is Amy\",\"Mrs King es la placa de recepción — no firma tarjetas\"],\"itemIds\":[\"enmynameis\",\"enseeyou\"],\"tip\":\"El nombre que va tras «Hi» es quien RECIBE; el de «My name is», quien escribe. No los cruces.\"},{\"id\":\"ena1m1l8e3\",\"type\":\"mc\",\"prompt\":\"El cartel, dato 3\",\"question\":\"El cartel al salir dice: «Goodbye! Have a nice day!» — ¿Qué te desea?\",\"options\":[\"Un buen día\",\"Que vuelvas mañana\",\"Que esperes un momento\"],\"answer\":0,\"whyWrong\":[null,\"tomorrow (mañana) no aparece por ningún lado\",\"El cartel se despide — no te pide nada\"],\"itemIds\":[\"enhaveaniceday\",\"engoodbye\"],\"tip\":\"Carteles del examen: tres palabras y una idea. goodbye + nice day = despedida amable.\"},{\"id\":\"ena1m1l8e4\",\"type\":\"match\",\"prompt\":\"Empareja cartel y significado\",\"pairs\":[{\"target\":\"Mr Patel\",\"source\":\"el señor Patel\"},{\"target\":\"Mrs King\",\"source\":\"la señora King\"},{\"target\":\"Have a nice day!\",\"source\":\"¡Que tengas un buen día!\"},{\"target\":\"Welcome to London!\",\"source\":\"¡Bienvenida a Londres!\"}],\"itemIds\":[\"enmrmrs\",\"enhaveaniceday\",\"enwelcometolondon\"]},{\"id\":\"ena1m1l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa el cartel\",\"text\":\"Goodbye! Have a ___ day!\",\"answers\":[\"nice\"],\"translation\":\"¡Adiós! ¡Que tengas un buen día!\",\"hints\":[\"El mismo adjetivo de N-i-c-e to meet you\",\"n-i-c-e\"],\"itemIds\":[\"enhaveaniceday\"]},{\"id\":\"ena1m1l8e6\",\"type\":\"order\",\"prompt\":\"Ordena la tarjeta de Amy\",\"sentences\":[\"Hi Valeria!\",\"Welcome to London!\",\"My name is Amy.\",\"See you later!\"],\"translation\":\"¡Hola, Valeria! ¡Bienvenida a Londres! Me llamo Amy. ¡Hasta luego!\",\"hints\":[\"El saludo abre la tarjeta\",\"La despedida la cierra\"],\"itemIds\":[\"enhi\",\"enwelcometolondon\",\"enmynameis\",\"enseeyou\"],\"tip\":\"Saludo → bienvenida → quién soy → despedida: el esqueleto de TODA nota inglesa. Guárdatelo.\"},{\"id\":\"ena1m1l8e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la despedida de la tienda\",\"text\":\"Have a nice day, Mrs Soto!\",\"translation\":\"¡Que tenga un buen día, señora Soto!\",\"hints\":[\"La despedida de cartel + el tratamiento\",\"Have a nice day, Mrs ...\"],\"itemIds\":[\"enhaveaniceday\",\"enmrmrs\"]},{\"id\":\"ena1m1l8e10\",\"type\":\"read\",\"prompt\":\"Lee la nota de Amy y responde — no hace falta entender cada palabra\",\"title\":\"Welcome to London!\",\"source\":\"Nota en la puerta de la nevera\",\"text\":\"Hi Valeria!\u003cbr/\u003e\u003cbr/\u003eWelcome to London! My name is Amy. I'm your [[flatmate|compañera de piso]]. I'm from Manchester, but now I'm in London too.\u003cbr/\u003e\u003cbr/\u003eThis is my note for your first day. In the morning, say “Good morning!” to Mr Patel in the shop. He's very nice. His shop is [[open|abierto]] from seven.\u003cbr/\u003e\u003cbr/\u003eIn the afternoon, Nora is in the [[garden|jardín]]. She's my [[neighbour|vecina]] — say “Good afternoon, Nora!” and she is happy all day.\u003cbr/\u003e\u003cbr/\u003eAnd at night, before bed: “Good night!” Not “Good evening!”\u003cbr/\u003e\u003cbr/\u003eSee you later!\u003cbr/\u003eAmy\",\"questions\":[{\"id\":\"ena1m1l8e10q1\",\"q\":\"¿Quién escribe la nota?\",\"options\":[\"Amy\",\"Valeria\",\"Nora\"],\"answer\":0,\"why\":\"La firma la delata: My name is Amy… y al final, Amy.\"},{\"id\":\"ena1m1l8e10q2\",\"q\":\"¿A quién saluda Valeria por la tarde?\",\"options\":[\"A Nora\",\"A Mr Patel\",\"A Amy\"],\"answer\":0,\"why\":\"In the afternoon, Nora is in the garden.\"},{\"id\":\"ena1m1l8e10q3\",\"q\":\"Valeria entra en la tienda a las nueve de la mañana. ¿Qué dice?\",\"options\":[\"Good morning!\",\"Good evening!\",\"Good night!\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no dice «a las nueve»: dice in the morning, y las nueve caen ahí. Hay que aplicar la regla, no copiarla.\"},{\"id\":\"ena1m1l8e10q4\",\"q\":\"¿Por qué Amy escribe «Not “Good evening!”» al final?\",\"options\":[\"Porque para irse a dormir se dice Good night, no Good evening\",\"Porque Good evening no existe en inglés\",\"Porque Nora no saluda por la noche\"],\"answer\":0,\"inference\":true,\"why\":\"Amy no lo explica: solo lo tacha. La razón la pones tú — good night es DESPEDIDA.\"}],\"itemIds\":[\"engoodmorning\",\"engoodafternoon\",\"engoodnight\",\"enwelcometolondon\",\"enseeyou\"],\"tip\":\"Así se lee en el examen: primero de un tirón por el sentido, y solo después vuelves a buscar el dato de cada pregunta.\"},{\"id\":\"ena1m1l8e8\",\"type\":\"type\",\"prompt\":\"Pre-escritura: escribe la tarjeta entera\",\"question\":\"¡Hola, Amy! Me llamo Valeria. ¡Encantada! ¡Hasta luego!\",\"answers\":[\"Hi Amy! My name is Valeria. Nice to meet you! See you later!\",\"Hi, Amy! My name is Valeria. Nice to meet you! See you later!\",\"Hello Amy! My name is Valeria. Nice to meet you! See you later!\",\"Hi Amy! My name is Valeria. Nice to meet you. See you later!\"],\"hints\":[\"Cuatro frases que ya son tuyas, en el orden de la tarjeta\",\"Hi Amy! My name is ... Nice ... See you ...\"],\"itemIds\":[\"enhi\",\"enmynameis\",\"ennicetomeetyou\",\"enseeyou\"],\"tip\":\"Tu primera NOTA completa en inglés. En el módulo 3 este músculo se convierte en el writing del examen.\"},{\"id\":\"ena1m1l8e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡Adiós, Mr Patel! ¡Muchas gracias! ¡Que tenga un buen día!\",\"answers\":[\"Goodbye, Mr Patel! Thank you very much! Have a nice day!\",\"Goodbye Mr Patel! Thank you very much! Have a nice day!\",\"Bye, Mr Patel! Thank you very much! Have a nice day!\"],\"hints\":[\"Despedida + agradecimiento grande + el deseo de cartel\",\"Goodbye, Mr ...! Thank you ...! Have a ...!\"],\"itemIds\":[\"engoodbye\",\"enthankyouverymuch\",\"enhaveaniceday\",\"enmrmrs\"],\"tip\":\"Tres frases de cortesía seguidas: así se sale de una tienda británica con matrícula de honor.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m1-4\",\"book\":\"Have a nice day!\",\"real\":\"Have a good one!\",\"meaning\":\"¡que tengas u
