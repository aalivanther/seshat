",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T42b,Esta la tienes medio hecha. En el A1 aprendiste \u003cb\u003ethere is\u003c/b\u003e (hay, uno) y \u003cb\u003ethere are\u003c/b\u003e (hay, varios). El pasado es exactamente lo mismo con el verbo cambiado:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ethere was\u003c/b\u003e = había (uno) · \u003cb\u003ethere were\u003c/b\u003e = había (varios)\u003cbr/\u003e\u003cbr/\u003eY aquí está la trampa gorda del español: nuestro «había» \u003cb\u003eno cambia\u003c/b\u003e aunque haya cien cosas («había mucha gente», «había tres autobuses»). El inglés SÍ cambia, y lo decide lo que viene detrás. Por eso [[There were a lot of people.|Había mucha gente.]] va en plural: \u003cb\u003epeople es plural en inglés\u003c/b\u003e (uno es \u003ci\u003ea person\u003c/i\u003e). Nunca «there was a lot of people».\u003cbr/\u003e\u003cbr/\u003eLa otra trampa es más sencilla de matar: «había» viene de \u003ci\u003ehaber\u003c/i\u003e, y la mano se va sola a escribir \u003ci\u003ethere had\u003c/i\u003e. \u003cb\u003eNo existe.\u003c/b\u003e El verbo de there is / there are / there was / there were es siempre \u003cb\u003ebe\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eNegativa y pregunta funcionan como en A1: \u003cb\u003eThere wasn't any music.\u003c/b\u003e · \u003cb\u003eWas there a lift?\u003c/b\u003e — y la respuesta corta repite el verbo: \u003ci\u003eYes, there was. / No, there wasn't.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m1l3\",\"phaseId\":\"ena2m1\",\"title\":\"There was a party\",\"subtitle\":\"«Había»: el there is/are del A1, movido al pasado\",\"minutes\":9,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Decir qué había\",\"itemIds\":[\"ena2m1therewas\",\"ena2m1therewere\",\"ena2m1therewasnt\",\"ena2m1wastherealift\",\"ena2m1concert\",\"enthereis\",\"enthereare\"]},{\"kind\":\"note\",\"note\":{\"title\":\"there is / there are → there was / there were\",\"body\":\"$17\",\"table\":[[\"ahora\",\"antes\"],[\"There is a café.\",\"There was a café.\"],[\"There are two buses.\",\"There were two buses.\"],[\"Is there a lift?\",\"Was there a lift?\"],[\"There isn't any milk.\",\"There wasn't any milk.\"],[\"There are a lot of people.\",\"There were a lot of people.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l3e1\",\"type\":\"mc\",\"prompt\":\"«Había una fiesta en casa de Amy»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"There was a party at Amy's.\",\"There had a party at Amy's.\",\"It had a party at Amy's.\"],\"answer\":0,\"whyWrong\":[null,\"«Había» viene de haber, pero el inglés usa BE: there was\",\"It had no señala existencia; there was sí\"],\"itemIds\":[\"ena2m1therewas\"],\"tip\":\"Grábatelo como bloque: there was / there were. El verbo have no entra nunca aquí.\"},{\"id\":\"ena2m1l3e2\",\"type\":\"bucket\",\"prompt\":\"¿was o were? Lo decide lo que viene DETRÁS\",\"categories\":[\"There was…\",\"There were…\"],\"items\":[{\"text\":\"a concert in the park\",\"bucket\":0},{\"text\":\"a lot of people\",\"bucket\":1},{\"text\":\"two buses at the bus stop\",\"bucket\":1},{\"text\":\"a big cake\",\"bucket\":0},{\"text\":\"no tickets\",\"bucket\":1},{\"text\":\"a lift in the building\",\"bucket\":0}],\"itemIds\":[\"ena2m1therewas\",\"ena2m1therewere\",\"ena2m1concert\",\"enpeople\"],\"tip\":\"En español «había» no se mueve. En inglés mira lo que sigue: uno → was, varios → were. Y people cuenta como varios.\"},{\"id\":\"ena2m1l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa\",\"text\":\"There ___ a lot of people at the concert.\",\"answers\":[\"were\"],\"translation\":\"Había mucha gente en el concierto.\",\"hints\":[\"people es PLURAL en inglés\",\"There w…\"],\"itemIds\":[\"ena2m1therewere\",\"enpeople\"]},{\"id\":\"ena2m1l3e4\",\"type\":\"transform\",\"prompt\":\"Del presente al pasado\",\"source\":\"There is a café next to the park.\",\"instruction\":\"Ponla en pasado\",\"answers\":[\"There was a café next to the park.\"],\"translation\":\"Había un café al lado del parque.\",\"hints\":[\"Solo cambia el verbo\",\"There w… a café…\"],\"itemIds\":[\"ena2m1therewas\",\"enthereis\",\"enpark\"]},{\"id\":\"ena2m1l3e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la concordancia\",\"wrong\":\"There was a lot of people at the party.\",\"answers\":[\"There were a lot of people at the party.\"],\"why\":\"people es plural en inglés: uno es «a person», varios son «people». Y si el sujeto es plural, el verbo también: there WERE. Es el mismo fallo que «the informations» o «my hairs»: palabras que en español y en inglés no se cuentan igual.\",\"translation\":\"Había mucha gente en la fiesta.\",\"itemIds\":[\"ena2m1therewere\",\"enpeople\"]},{\"id\":\"ena2m1l3e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el verbo\",\"wrong\":\"There had a concert in the park on Sunday.\",\"answers\":[\"There was a concert in the park on Sunday.\"],\"why\":\"El «había» español viene de haber y arrastra la mano hacia have. Pero la estructura inglesa es there + BE, en todos los tiempos: there is, there are, there was, there were.\",\"translation\":\"Había un concierto en el parque el domingo.\",\"itemIds\":[\"ena2m1therewas\",\"ena2m1concert\"]},{\"id\":\"ena2m1l3e7\",\"type\":\"build\",\"prompt\":\"Construye la negativa\",\"target\":\"There wasn't any music at the party\",\"translation\":\"No había música en la fiesta\",\"distractors\":[\"weren't\",\"some\"],\"itemIds\":[\"ena2m1therewasnt\",\"ena2m1therewas\"],\"tip\":\"En negativa se usa any, igual que en A1: There wasn't ANY music. some se guarda para las afirmativas.\"},{\"id\":\"ena2m1l3e8\",\"type\":\"mc\",\"prompt\":\"La respuesta corta\",\"question\":\"“Was there a lift in the building?”\",\"options\":[\"Yes, there was.\",\"Yes, there is.\",\"Yes, it had.\"],\"answer\":0,\"whyWrong\":[null,\"La pregunta va en pasado: la respuesta también\",\"La respuesta corta repite el verbo de la pregunta, que era was\"],\"itemIds\":[\"ena2m1wastherealift\"]},{\"id\":\"ena2m1l3e9\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"There were a lot of people at the concert.\",\"translation\":\"Había mucha gente en el concierto.\",\"hints\":[\"Empieza por There w…\",\"…a lot of people at the concert.\"],\"itemIds\":[\"ena2m1therewere\",\"ena2m1concert\"]},{\"id\":\"ena2m1l3e10\",\"type\":\"audiomc\",\"prompt\":\"Escucha dos veces, como en el examen\",\"audio\":\"There wasn't any coffee in the café, but there was tea.\",\"question\":\"¿Qué había?\",\"options\":[\"Té\",\"Café\",\"Ni té ni café\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"coffee suena, pero con wasn't delante: eso es lo que NO había\",\"El but del final trae lo que sí había\"],\"itemIds\":[\"ena2m1therewasnt\",\"ena2m1therewas\"],\"tip\":\"La palabra que suena no es la respuesta. Lo que decide es la negación que va delante — y el but que la corrige.\"},{\"id\":\"ena2m1l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Había un concierto en el parque y había mucha gente.\",\"answers\":[\"There was a concert in the park and there were a lot of people.\",\"There was a concert in the park and there were lots of people.\",\"There was a concert in the park, and there were a lot of people.\"],\"hints\":[\"Uno → was · varios → were\",\"There w… a concert… and there w… a lot of people.\"],\"itemIds\":[\"ena2m1therewas\",\"ena2m1therewere\",\"ena2m1concert\",\"enpark\"],\"tip\":\"Las dos mitades de la frase con el mismo «había» español y dos verbos ingleses distintos. Esa es toda la lección.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m1-2\",\"book\":\"There were a lot of people.\",\"real\":\"It was packed.\",\"meaning\":\"Estaba a tope / hasta arriba\",\"when\":\"Hablando de un bar, un concierto, el metro o una tienda en rebajas. Es informal pero no vulgar: lo dice todo el mundo. En el Writing del examen escribe la del libro (There were a lot of people), que es la que enseña la gramática que te puntúan.\",\"register\":\"amigos\",\"note\":\"packed es «empaquetado»: tan lleno que no cabe nadie más. Su gemelo es «It was dead» — vacío, sin ambiente.\",\"sound\":\"it uos̬ PAKT\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — There is / there are\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/there-is-there-are\",\"note\":\"Repasa el presente (10 min) y luego di en voz alta cada ejemplo en pasado. Es la manera más rápida de instalar there was/were.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
