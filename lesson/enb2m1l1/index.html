",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T598,"])</script><script>self.__next_f.push([1,"Entras en B2. La gramática gorda —pasiva, relativas, condicionales, estilo indirecto— \u003cb\u003eya la tienes\u003c/b\u003e del B1. Lo que sube no es «más tiempos»: es \u003cb\u003epericia discursiva\u003c/b\u003e. El descriptor lo dice sin rodeos: en B1 el circunloquio está permitido; en B2 \u003cb\u003ese penaliza\u003c/b\u003e. Y el criterio de \u003ci\u003eOrganisation\u003c/i\u003e del Writing mete la puntuación dentro de la nota.\u003cbr/\u003e\u003cbr/\u003eHoy, la herramienta de la que viven los once módulos siguientes: \u003cb\u003eel párrafo inglés\u003c/b\u003e. Una idea. Frase-tema al principio. Desarrollo. Cierre. El español trenza dos o tres ideas en el mismo bloque y el punto llega cuando se acaba el aliento. El inglés no. Si mezclas dos ideas, el lector nativo no «se esfuerza un poco»: \u003cb\u003edeja de entenderte\u003c/b\u003e, y te lo dice sin maldad, como Amy esta tarde.\u003cbr/\u003e\u003cbr/\u003eValeria ha empezado dos tardes a la semana en el mostrador de asesoría del centro comunitario. Le piden que redacte, en inglés, el correo que un vecino no sabe escribir. Lo escribe como escribiría en español. Amy lo lee y dice: «It isn't [[clear|claro]] what you mean.» No es vocabulario. Es el párrafo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eThe thing is / The problem is / The reason (that)…\u003c/b\u003e son el foco del B2: un sintagma nominal genérico al principio. No son las hendidas de manual (\u003ci\u003eWhat I need is…\u003c/i\u003e es C1; \u003ci\u003eIt was Ben who…\u003c/i\u003e es C2). Son más útiles, y son las que un hispanohablante calca torcidas desde «Lo que pasa es que…»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l1\",\"phaseId\":\"enb2m1\",\"title\":\"One idea, then stop\",\"subtitle\":\"El párrafo inglés no se trenza: se planta y se sostiene\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas del párrafo\",\"itemIds\":[\"enb2m1topicsentence\",\"enb2m1oneidea\",\"enb2m1theproblemis\",\"enb2m1thereasonthat\",\"enb2m1firstdraft\",\"enb2m1notclear\",\"enb2m1standsalone\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué cambia ahora (y por qué el tuyo se entiende peor)\",\"body\":\"$17\",\"table\":[[\"Español (lo que haces)\",\"Inglés (lo que puntúa)\"],[\"Párrafo largo, ideas trenzadas\",\"Un párrafo = una idea\"],[\"El punto al final del aliento\",\"Frase-tema al principio\"],[\"«Lo que pasa es que…»\",\"The problem is that… / The reason is…\"],[\"Coma para unir dos oraciones\",\"Punto, punto y coma, o conjunción\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del párrafo\",\"pairs\":[{\"target\":\"a topic sentence\",\"source\":\"la frase-tema, la primera\"},{\"target\":\"One paragraph, one idea.\",\"source\":\"un párrafo, una idea\"},{\"target\":\"a first draft\",\"source\":\"un primer borrador\"},{\"target\":\"It isn't clear what you mean.\",\"source\":\"no está claro qué quieres decir\"}],\"itemIds\":[\"enb2m1topicsentence\",\"enb2m1oneidea\",\"enb2m1firstdraft\",\"enb2m1notclear\"],\"tip\":\"«Topic sentence» no es «oración temática» de instituto: es la primera frase, y si no dice de qué va el párrafo, el resto sobra.\"},{\"id\":\"enb2m1l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — conectores que ya son tuyos del B1\",\"pairs\":[{\"target\":\"Although the flat is small, it's very bright.\",\"source\":\"Aunque el piso es pequeño, es luminoso.\"},{\"target\":\"Despite the high rent, I took the flat.\",\"source\":\"A pesar del alquiler alto, cogí el piso.\"},{\"target\":\"The rent went up. Therefore, I moved out.\",\"source\":\"El alquiler subió. Por eso me fui.\"},{\"target\":\"Besides, the neighbourhood is quiet.\",\"source\":\"Además, el barrio es tranquilo.\"},{\"target\":\"In addition, the photo was taken down.\",\"source\":\"Además, la foto se retiró.\"}],\"targetSeconds\":24,\"itemIds\":[\"enb1m1although\",\"enb1m1despite\",\"enb1m1therefore\",\"enb1m1besides\",\"enb1m4inaddition\"],\"tip\":\"El B2 no se gana olvidando el B1: se gana sacando más rápido lo que ya tienes, para que lo nuevo quepa encima.\"},{\"id\":\"enb2m1l1e3\",\"type\":\"mc\",\"prompt\":\"Qué es una frase-tema\",\"question\":\"¿Cuál de estas es una frase-tema que un párrafo inglés acepta?\",\"options\":[\"The advice desk needs a clearer email template.\",\"Well, so, there are several things I wanted to mention about the emails and also the rota.\",\"Because of the fact that, as I was saying, it is important.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es el arranque español: avisa de que vas a trenzar. El inglés ya se ha perdido.\",\"No dice de qué va el párrafo. Es ruido educado.\"],\"itemIds\":[\"enb2m1topicsentence\",\"enb2m1oneidea\"],\"tip\":\"La frase-tema se puede subrayar y enseñar a alguien que no ha leído el resto. Si no puedes, no es frase-tema.\"},{\"id\":\"enb2m1l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Frase-tema o detalle que sostiene?\",\"categories\":[\"frase-tema — de qué va el párrafo\",\"detalle — sostiene, no abre\"],\"items\":[{\"text\":\"The first draft buried the request.\",\"bucket\":0},{\"text\":\"Valeria mentioned the bins in the third line.\",\"bucket\":1},{\"text\":\"Each paragraph has to stand alone.\",\"bucket\":0},{\"text\":\"Amy put a tick next to the second sentence.\",\"bucket\":1},{\"text\":\"The problem is that nobody finishes it.\",\"bucket\":0},{\"text\":\"The neighbour had already missed one collection.\",\"bucket\":1}],\"itemIds\":[\"enb2m1topicsentence\",\"enb2m1supportingdetail\",\"enb2m1theproblemis\",\"enb2m1standsalone\"],\"tip\":\"El detalle no es inferior: es lo que hace que la frase-tema no sea un eslogan. Lo que no puede es ir primero.\"},{\"id\":\"enb2m1l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The email is too long, nobody finishes it.\",\"answers\":[\"The email is too long, so nobody finishes it.\",\"The email is too long. Nobody finishes it.\",\"The email is too long; nobody finishes it.\"],\"why\":\"Eso es un comma splice: dos oraciones unidas solo con coma. El español lo hace a todas horas; el inglés lo cuenta como error de Organisation, y Organisation es un criterio entero de cuatro.\",\"translation\":\"El correo es demasiado largo, así que no lo termina nadie.\",\"itemIds\":[\"enb2m1commasplice\",\"enb2m1theproblemis\"]},{\"id\":\"enb2m1l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa el foco nominal\",\"text\":\"The ___ is that nobody finishes the email.\",\"answers\":[\"problem\"],\"translation\":\"El problema es que no termina nadie el correo.\",\"hints\":[\"The … is that\",\"pro-blem\"],\"itemIds\":[\"enb2m1theproblemis\"],\"tip\":\"«The problem is that…» es B2. «What the problem is is that…» no: esa hendida se deja para el C1.\"},{\"id\":\"enb2m1l1e7\",\"type\":\"transform\",\"prompt\":\"Saca el punto a la primera línea\",\"source\":\"I have looked at the rota and spoken to two neighbours, and the bins went out on the wrong day.\",\"instruction\":\"Empieza por The problem is that… y deja un solo punto\",\"answers\":[\"The problem is that the bins went out on the wrong day\",\"The problem is that the bins went out on the wrong day.\"],\"translation\":\"El problema es que los cubos salieron el día que no era.\",\"hints\":[\"Frase-tema primero\",\"The problem is that the bins…\"],\"itemIds\":[\"enb2m1theproblemis\",\"enb2m1topicburied\"],\"tip\":\"Las dos primeras cláusulas eran el camino español hacia el punto. En inglés el camino se corta: el punto va primero y el resto, si hace falta, detrás.\"},{\"id\":\"enb2m1l1e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — con el foco nominal\",\"source\":\"La razón por la que lo reescribí es la primera línea.\",\"answers\":[\"The reason I rewrote it is the first line.\",\"The reason I rewrote it is the first line\",\"The reason that I rewrote it is the first line.\"],\"hint\":\"The reason (that) I… is…\",\"itemIds\":[\"enb2m1thereasonthat\"],\"tip\":\"«The reason why» también existe, pero el B2 que puntúa es «The reason (that) I… is…». Menos palabras, más nota.\"},{\"id\":\"enb2m1l1e9\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es la frase con la que Amy nombra el problema\",\"text\":\"It isn't clear what you mean, and each paragraph has to stand alone.\",\"phonetic\":\"it Í-s̬ent klía uot yu miin, and iich PÁ-ra-graaf jas tu stand a-LÓUN\",\"translation\":\"No está claro qué quieres decir, y cada párrafo tiene que sostenerse solo.\",\"itemIds\":[\"enb2m1notclear\",\"enb2m1standsalone\"],\"tip\":\"«What you mean», no «what do you mean»: detrás de «clear» la pregunta pierde la inversión. Esa batalla es del B1 y aquí se cobra.\"},{\"id\":\"enb2m1l1e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «thing»\",\"source\":\"The thing is that the request comes too late.\",\"forbid\":[\"thing\"],\"answers\":[\"The problem is that the request comes too late\",\"The problem is that the request comes too late.\",\"The issue is that the request comes too late\",\"The request comes too late\"],\"translation\":\"La cuestión es que la petición llega demasiado tarde.\",\"itemIds\":[\"enb2m1thethingisthat\",\"enb2m1theproblemis\"],\"tip\":\"En B2 el paraphrase trabaja al revés que en B1: se prohíbe el rodeo para forzar la palabra. Aquí se prohíbe «thing» para que salga «problem».\"},{\"id\":\"enb2m1l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Un párrafo, una idea. Cada uno tiene que sostenerse solo.\",\"answers\":[\"One paragraph, one idea. Each paragraph has to stand alone.\",\"One paragraph, one idea. Each one has to stand alone.\",\"One paragraph one idea. Each paragraph has to stand alone.\"],\"hints\":[\"La consigna del módulo, en dos frases\",\"One paragraph, one idea\"],\"itemIds\":[\"enb2m1oneidea\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l1e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy lee el primer borrador. Lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"Valeria, I've read it. Look, I'm not being unkind — the English is fine. The thing is, I get to the third sentence and I still don't know what you want the council to do. Put the request in the first line, then give me one reason. That's a paragraph. What you've written is a conversation.\",\"question\":\"¿Qué le pide Amy que haga?\",\"options\":[\"Poner la petición en la primera línea y una sola razón detrás\",\"Corregir los errores de gramática de la tercera frase\",\"Convertir el correo en una conversación más natural\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Amy dice que el inglés está bien. El fallo no es gramatical.\",\"Dice justo lo contrario: lo que ha escrito YA es una conversación, y eso es el problema.\"],\"itemIds\":[\"enb2m1thethingisthat\",\"enb2m1gettothepoint\",\"enb2m1notclear\"],\"tip\":\"«The thing is» en boca de Amy es el foco hablado. En el Writing de examen esa misma idea se escribe «The problem is that…» o «The reason for this is that…».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m1-1\",\"book\":\"In conclusion\",\"real\":\"So yeah, basically.\",\"meaning\":\"En conclusión / Bueno, total, que…\",\"when\":\"El cierre hablado de una explicación, con amigos o con Amy en la cocina. En un Writing de examen no se escribe jamás: allí el cierre es In conclusion o All things considered. Al revés tampoco: nadie dice «in conclusion» al levantarse del sofá.\",\"register\":\"amigos\",\"exam\":\"In conclusion, the first draft did not work.\",\"note\":\"«Basically» no significa «básicamente» de manual: significa «te lo resumo». Quien lo escribe en un informe suena a que no ha terminado de pensar.\",\"sound\":\"sóu yeah, BÉI-si-kli\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m1natinconclusion\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
