rases\",\"title\":\"Lo que vas a reconocer, con su pareja estándar\",\"itemIds\":[\"b2m10austriazismus\",\"b2m10helvetismus\",\"b2m10bub\",\"b2m10natel\",\"b2m10spital\",\"b2m10paradeiser\",\"b2m10strassech\",\"b2m10rav\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La glosa al pie es parte del examen, no un adorno del curso\",\"body\":\"El Goethe B2, como el B1, es \u003cb\u003epluricéntrico en la lectura\u003c/b\u003e: puede salir un texto de Viena o de Berna. Los regionalismos van en \u003cb\u003eFußnote\u003c/b\u003e, exactamente igual que aquí. Tu trabajo es no frenarte.\u003cbr/\u003e\u003cbr/\u003eAustria (estándar, no dialecto): [[der Jänner|enero]], [[die Stiege|escalera]], [[das Sackerl|bolsa]], [[heuer|este año]], [[der Paradeiser|tomate]], [[das Spital|hospital]], [[die Jause|tentempié]].\u003cbr/\u003eSuiza: no hay \u003cb\u003eß\u003c/b\u003e (\u003ci\u003eStrasse, gross, Ermässigung\u003c/i\u003e), [[das Velo|bici]], [[das Natel|móvil]], [[die Tram|tranvía]], [[der Rahm|nata]], [[das RAV|oficina de empleo]]. En Suiza la escalera es \u003ci\u003eTreppe\u003c/i\u003e, no Stiege.\u003cbr/\u003eSur (también AT/CH): [[der Bub|chico]] — no es «solo Austria y Suiza».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eProducción: estándar alemán.\u003c/b\u003e Januar, Treppe, Straße, Fahrrad, Handy, Krankenhaus, Tomate, Junge, Sahne, Arbeitsagentur. El único examen que trata las tres normas como equivalentes es el ÖSD, y no es el norte de este curso.\",\"table\":[[\"AT\",\"Jänner, Stiege, Sackerl, Paradeiser, Spital\"],[\"CH\",\"Strasse (sin ß), Velo, Natel, Tram, RAV, Rahm\"],[\"Sur\",\"Bub, heuer, Stiege (también Baviera)\"],[\"Goethe, escribes\",\"Januar, Treppe, Straße, Fahrrad, Handy, Junge\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m10l4e1\",\"type\":\"match\",\"prompt\":\"Regional → estándar que producirás\",\"pairs\":[{\"target\":\"der Jänner\",\"source\":\"der Januar\"},{\"target\":\"die Stiege\",\"source\":\"die Treppe\"},{\"target\":\"das Velo\",\"source\":\"das Fahrrad\"},{\"target\":\"der Paradeiser\",\"source\":\"die Tomate\"},{\"target\":\"das Spital\",\"source\":\"das Krankenhaus\"}],\"itemIds\":[\"b1m7fejaenner\",\"b1m7festiege\",\"b1m7fevelo\",\"b2m10paradeiser\",\"b2m10spital\"]},{\"id\":\"b2m10l4e2\",\"type\":\"mc\",\"prompt\":\"La trampa de la ß\",\"question\":\"En un texto de Berna lees «Strasse» y «Ermässigung». ¿Qué haces en tu escrito?\",\"options\":[\"Copias la grafía suiza para ser fiel al texto\",\"Escribes Straße y Ermäßigung: en el Goethe la producción es alemana\",\"Evitas las dos palabras\"],\"answer\":1,\"whyWrong\":[\"Fidelidad mal entendida: la consigna no pide imitar la norma del estímulo\",null,\"Huir no puntúa\"],\"itemIds\":[\"b2m10strassech\",\"b2m10ermaessigung\",\"b2m10produktion\"]},{\"id\":\"b2m10l4e3\",\"type\":\"bucket\",\"prompt\":\"¿De dónde es, si no hay glosa?\",\"categories\":[\"Austria (o sur)\",\"Suiza\"],\"items\":[{\"text\":\"Jänner\",\"bucket\":0},{\"text\":\"Paradeiser\",\"bucket\":0},{\"text\":\"Natel\",\"bucket\":1},{\"text\":\"RAV\",\"bucket\":1},{\"text\":\"Velo\",\"bucket\":1},{\"text\":\"Rahm\",\"bucket\":1},{\"text\":\"Tram (CH)\",\"bucket\":1}],\"itemIds\":[\"b2m10austriazismus\",\"b2m10helvetismus\",\"b2m10natel\",\"b2m10rav\",\"b2m10rahm\",\"b1m9tram\"],\"tip\":\"Bub y heuer son del sur entero, no solo de Austria. Stiege también. La tabla de CANON está para no repetir el error.\"},{\"id\":\"b2m10l4e4\",\"type\":\"errorfix\",\"prompt\":\"Producir el estándar, no el recuerdo del texto\",\"wrong\":\"Im Jänner fahre ich nach Wien die Stiege hoch.\",\"answers\":[\"Im Januar fahre ich nach Wien die Treppe hoch.\",\"Im Januar fahre ich nach Wien die Treppe hoch\"],\"why\":\"El texto de origen puede ir en Jänner y Stiege. Tu frase, en el Goethe, va en Januar y Treppe. Reconocer no es copiar.\",\"translation\":\"En enero subo las escaleras en Viena.\",\"itemIds\":[\"b1m7fejaenner\",\"b1m7festiege\",\"b2m10produktion\"]},{\"id\":\"b2m10l4e5\",\"type\":\"cloze\",\"prompt\":\"El helvetismo que los jóvenes ya no usan tanto\",\"text\":\"Die Mutter sagt noch ___; die Tochter sagt Handy.\",\"answers\":[\"Natel\"],\"translation\":\"La madre aún dice Natel; la hija dice Handy.\",\"itemIds\":[\"b2m10natel\"],\"tip\":\"Natel es helvetismo real, no de postal. Y los suizos jóvenes dicen Handy con normalidad: no conviertas Suiza en un museo.\"},{\"id\":\"b2m10l4e6\",\"type\":\"gapbank\",\"prompt\":\"Tres normas, tres huecos, una producción\",\"text\":\"In Wien sagt man ___, in Bern fährt man mit dem ___, und im Goethe schreibst du ___.\",\"answers\":[\"Stiege\",\"Velo\",\"Treppe\"],\"bank\":[\"Stiege\",\"Velo\",\"Treppe\",\"Jänner\",\"Natel\",\"Straße\"],\"translation\":\"En Viena se dice Stiege, en Berna se va en Velo, y en el Goethe escribes Treppe.\",\"itemIds\":[\"b1m7festiege\",\"b1m7fevelo\",\"b2m10produktion\"]},{\"id\":\"b2m10l4e7\",\"type\":\"mc\",\"prompt\":\"El RAV no es la Arbeitsagentur\",\"question\":\"En un anuncio de Zúrich lees «melden Sie sich beim RAV». ¿Qué es?\",\"options\":[\"La policía\",\"La oficina suiza de empleo\",\"Una mutua sanitaria\"],\"answer\":1,\"whyWrong\":[\"No es la policía\",null,\"El hospital sería Spital\"],\"itemIds\":[\"b2m10rav\"]},{\"id\":\"b2m10l4e8\",\"type\":\"type\",\"prompt\":\"Cierre: la pareja que vas a producir\",\"question\":\"En Austria lees Jänner; tú escribes enero en alemán estándar\",\"answers\":[\"In Österreich liest du Jänner; du schreibst Januar\",\"In Österreich liest du Jänner; du schreibst Januar.\",\"In Österreich steht Jänner; du schreibst Januar\"],\"itemIds\":[\"b1m7fejaenner\",\"b2m10produktion\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m10-2\",\"book\":\"die Treppe\",\"real\":\"die Stiege\",\"meaning\":\"la escalera — Austria y el sur de Alemania (en Suiza: Treppe)\",\"when\":\"La lees en Viena y en Múnich. En Berna no: allí es Treppe. En el Goethe escribes Treppe siempre. Stiege no es «el austriaco de postal»: es estándar austriaco, y aun así no es tu producción.\",\"register\":\"regional\",\"exam\":\"die Treppe\",\"note\":\"CANON lo deja escrito: Stiege no es solo Austria y Suiza. El sur de Alemania la usa. La producción de este curso, aun así, es Treppe.\",\"sound\":\"di SHTII-gue\",\"level\":\"b2\",\"produce\":false,\"itemId\":\"b1m7festiege\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
