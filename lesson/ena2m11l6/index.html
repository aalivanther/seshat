3c/b\u003e Donde ponías \u003ci\u003ewhen\u003c/i\u003e, pones \u003ci\u003eif\u003c/i\u003e. Donde ponías \u003ci\u003egoing to\u003c/i\u003e, puedes poner \u003ci\u003ewill\u003c/i\u003e. Ni una regla nueva:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eIF + presente ‖ will + verbo desnudo\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[If it rains, we'll stay in.|Si llueve, nos quedamos en casa.]]\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[If it's nice, we'll have a picnic.|Si hace bueno, hacemos un picnic.]]\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[If I have time, I'll call you.|Si tengo tiempo, te llamo.]]\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa diferencia entre when y if, en una línea:\u003c/b\u003e \u003ci\u003ewhen\u003c/i\u003e es para lo que va a pasar seguro (llegaré, es cuestión de cuándo); \u003ci\u003eif\u003c/i\u003e es para lo que no se sabe (a lo mejor llueve, a lo mejor no).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl orden se puede dar la vuelta\u003c/b\u003e, y las dos formas son igual de correctas:\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eIf it rains\u003c/b\u003e, we'll stay in.\u003c/i\u003e — con coma, porque la condición va delante.\u003cbr/\u003e· \u003ci\u003eWe'll stay in \u003cb\u003eif it rains\u003c/b\u003e.\u003c/i\u003e — sin coma, porque va detrás.\u003cbr/\u003eRegla de puntuación de un segundo: \u003cb\u003esi la frase empieza por «if», hay coma en medio. Si no, no hay coma.\u003c/b\u003e"])</script><script>self.__next_f.push([1,"18:T7b2,"])</script><script>self.__next_f.push([1,"\u003cb\u003eERROR 1: \u003ci\u003eIf it will rain…\u003c/i\u003e\u003c/b\u003e\u003cbr/\u003eEn español la condición va en \u003cb\u003esubjuntivo\u003c/b\u003e —«si llueve», «cuando llueva»— y el subjuntivo inglés no existe donde ponerlo, así que el aprendiz tira de futuro: \u003ci\u003eIf it \u003cb\u003ewill\u003c/b\u003e rain…\u003c/i\u003e. Es el mismo error que ya cazaste con \u003ci\u003ewhen\u003c/i\u003e, y la vacuna es la misma frase: \u003cb\u003ela mitad del «if» NUNCA lleva will.\u003c/b\u003e El futuro ya está dicho en la otra mitad, y el inglés no lo repite.\u003cbr/\u003e\u003cbr/\u003eUn truco de revisión que funciona: antes de dar por buena una frase con \u003ci\u003eif\u003c/i\u003e, cuenta los \u003ci\u003ewill\u003c/i\u003e. \u003cb\u003eSi hay dos, sobra uno, y el que sobra es el del «if».\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eERROR 2: \u003ci\u003eIf I would have time…\u003c/i\u003e\u003c/b\u003e\u003cbr/\u003eEste es más interesante, porque son \u003cb\u003edos interferencias a la vez\u003c/b\u003e. Por un lado, el español estándar dice «si \u003cb\u003etuviera\u003c/b\u003e tiempo» y muchos aprendices traducen ese hueco con \u003ci\u003ewould\u003c/i\u003e, que es la palabra que más se parece a un condicional. Por otro, en el \u003cb\u003enorte de España\u003c/b\u003e se oye «si \u003cb\u003etendría\u003c/b\u003e tiempo» con toda naturalidad — y quien lo diga así en español tiene el error ya montado antes de empezar en inglés.\u003cbr/\u003e\u003cbr/\u003eSea cual sea tu caso, la regla de hoy es la misma y es tajante: \u003cb\u003edetrás de «if» no va ni \u003ci\u003ewill\u003c/i\u003e ni \u003ci\u003ewould\u003c/i\u003e.\u003c/b\u003e Va un presente, y punto.\u003cbr/\u003e\u003cbr/\u003e· ❌ \u003ci\u003eIf I would have time, I'll call you.\u003c/i\u003e\u003cbr/\u003e· ✅ \u003ci\u003eIf I \u003cb\u003ehave\u003c/b\u003e time, I'll call you.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una nota honesta:\u003c/b\u003e el \u003ci\u003ewould\u003c/i\u003e tiene su sitio en inglés —hay una segunda condicional, para lo imposible y lo imaginario— pero \u003cb\u003eeso es B1 entero\u003c/b\u003e y no lo vamos a abrir aquí. Lo único que te hace falta hoy es reconocer el error y no cometerlo: si la frase habla de algo que puede pasar de verdad mañana, la primera condicional te sirve y el \u003ci\u003ewould\u003c/i\u003e sobra.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRecuerda dónde estás:\u003c/b\u003e esto es frontera con el B1. Se presenta, se reconoce y se produce con la frase medio puesta. \u003cb\u003eNo entra en el simulacro.\u003c/b\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l6\",\"phaseId\":\"ena2m11\",\"title\":\"If it rains, we'll stay in\",\"subtitle\":\"La condición y su consecuencia — y la mitad de la frase que nunca lleva futuro\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Si pasa esto, pasará aquello\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11ifitsnice\",\"ena2m11ifihavetime\",\"ena2m11ifyoudonttakeacoat\",\"ena2m11whatwillyoudoif\",\"ena2m11wellseehowitgoes\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Esto ya lo sabes hacer: es «when I arrive» con otra conjunción\",\"body\":\"$17\",\"table\":[[\"la mitad del IF\",\"la mitad principal\",\"en español\"],[\"If it rains,\",\"we'll stay in.\",\"Si llueve, nos quedamos.\"],[\"If it's nice,\",\"we'll have a picnic.\",\"Si hace bueno, hacemos un picnic.\"],[\"If I have time,\",\"I'll call you.\",\"Si tengo tiempo, te llamo.\"],[\"presente — NUNCA will\",\"will + verbo desnudo\",\"\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Los dos errores de esta lección, y los dos los pone el español\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l6e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la condición\",\"question\":\"“If it rains, we'll stay in.”\",\"options\":[\"Si llueve, nos quedamos en casa\",\"Cuando llueva nos quedaremos en casa, seguro\",\"Llovió y nos quedamos en casa\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «When it rains…»: con when la cosa se da por segura\",\"El pasado sería «It rained and we stayed in»\"],\"itemIds\":[\"ena2m11ifitrains\"],\"tip\":\"If deja la puerta abierta a las dos posibilidades. When la cierra: ya sabes que va a pasar y solo falta el cuándo.\"},{\"id\":\"ena2m11l6e2\",\"type\":\"bucket\",\"prompt\":\"¿Qué mitad de la frase es? Mira si lleva futuro dentro\",\"categories\":[\"la mitad del IF: presente, sin will\",\"la mitad principal: con will\"],\"items\":[{\"text\":\"If it rains…\",\"bucket\":0},{\"text\":\"…we'll stay in.\",\"bucket\":1},{\"text\":\"If I have time…\",\"bucket\":0},{\"text\":\"…I'll call you.\",\"bucket\":1},{\"text\":\"If you don't take a coat…\",\"bucket\":0},{\"text\":\"…you'll be cold.\",\"bucket\":1},{\"text\":\"If it's nice…\",\"bucket\":0},{\"text\":\"…we'll have a picnic.\",\"bucket\":1}],\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11ifihavetime\",\"ena2m11ifyoudonttakeacoat\",\"ena2m11ifitsnice\"],\"tip\":\"Ocho mitades y ni un solo will a la izquierda. Esa es la foto de la regla: el futuro vive en una sola mitad de la frase.\"},{\"id\":\"ena2m11l6e3\",\"type\":\"cloze\",\"prompt\":\"La mitad de la condición\",\"text\":\"If it ___ tomorrow, we'll stay at home.\",\"answers\":[\"rains\"],\"translation\":\"Si llueve mañana, nos quedamos en casa.\",\"hints\":[\"Presente, aunque hables de mañana — y lleva la -s de tercera persona\",\"If it r… tomorrow\"],\"itemIds\":[\"ena2m11ifitrains\"],\"tip\":\"Fíjate en la -s: «it rains». La mitad del if va en presente de verdad, con todas sus reglas, no en un presente a medias.\"},{\"id\":\"ena2m11l6e4\",\"type\":\"cloze\",\"prompt\":\"La mitad principal\",\"text\":\"If I have time, I ___ call you tonight.\",\"answers\":[\"'ll\",\"will\"],\"translation\":\"Si tengo tiempo, te llamo esta noche.\",\"hints\":[\"Aquí sí va el futuro: es la otra mitad\",\"I … call you tonight.\"],\"itemIds\":[\"ena2m11ifihavetime\"]},{\"id\":\"ena2m11l6e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error nº 1 del módulo\",\"wrong\":\"If it will rain, we'll stay in.\",\"answers\":[\"If it rains, we'll stay in.\"],\"why\":\"El español pone subjuntivo en la condición —«si llueve»— y al traducir sale un futuro. El inglés ya ha dicho que esto es futuro en la otra mitad («we'll stay in») y no lo repite: detrás de if va presente. Es la misma regla que ya usabas con when, before y after.\",\"translation\":\"Si llueve, nos quedamos en casa.\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m6whenigetthere\"],\"tip\":\"Cuenta los will de la frase antes de darla por buena. Si hay dos, sobra el del if.\"},{\"id\":\"ena2m11l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «si tendría»\",\"wrong\":\"If I would have time, I'll call you.\",\"answers\":[\"If I have time, I'll call you.\"],\"why\":\"Detrás de if no va ni will ni would: va un presente. El «would» sale de traducir «si tuviera» —o «si tendría», que se oye en el norte de España— con la palabra inglesa que más se le parece. Aquí no hace falta ninguna: si la cosa puede pasar de verdad mañana, basta con el presente.\",\"translation\":\"Si tengo tiempo, te llamo.\",\"itemIds\":[\"ena2m11ifihavetime\"]},{\"id\":\"ena2m11l6e7\",\"type\":\"transform\",\"prompt\":\"Dale la vuelta a la frase\",\"source\":\"If it rains, we'll stay in.\",\"instruction\":\"Empieza por la mitad principal\",\"answers\":[\"We'll stay in if it rains.\",\"We will stay in if it rains.\"],\"translation\":\"Nos quedamos en casa si llueve.\",\"hints\":[\"Si el «if» no va delante, la coma desaparece\",\"We'll stay in i… it rains.\"],\"itemIds\":[\"ena2m11ifitrains\"],\"tip\":\"Las dos versiones son igual de correctas y significan lo mismo. Lo único que cambia es la coma, y la coma solo aparece cuando la frase arranca con if.\"},{\"id\":\"ena2m11l6e8\",\"type\":\"build\",\"prompt\":\"Construye la condicional\",\"target\":\"If it rains we'll stay in\",\"translation\":\"Si llueve, nos quedamos en casa\",\"distractors\":[\"will\",\"would\"],\"itemIds\":[\"ena2m11ifitrains\"],\"tip\":\"Las dos fichas que sobran son justo las dos que no pueden entrar en la mitad del if. Están ahí a propósito.\"},{\"id\":\"ena2m11l6e9\",\"type\":\"gapbank\",\"prompt\":\"El domingo de Valeria y Amy, con condiciones\",\"text\":\"If it ___ tomorrow, we'll stay at home. If it's nice, we ___ have a picnic in the park. And if you ___ time on Saturday, we can buy the food together.\",\"answers\":[\"rains\",\"will\",\"have\"],\"bank\":[\"rains\",\"will\",\"have\",\"will rain\",\"would be\",\"has\"],\"translation\":\"Si mañana llueve, nos quedamos en casa. Si hace bueno, hacemos un picnic en el parque. Y si el sábado tienes tiempo, compramos la comida juntas.\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11ifitsnice\",\"ena2m11ifihavetime\",\"enpicnic\"],\"tip\":\"«Will rain» y «would be» están en el banco a propósito: son los dos errores de la nota puestos en fila. Ninguno entra en un hueco que venga detrás de if.\"},{\"id\":\"ena2m11l6e10\",\"type\":\"order\",\"prompt\":\"Ordena la conversación de Valeria y Amy\",\"sentences\":[\"What will you do if it rains on Sunday?\",\"If it rains, we'll stay in and watch a film.\",\"And if it's nice?\",\"If it's nice, we'll have a picnic in the park.\",\"Perfect. We'll see how it goes.\"],\"translation\":\"—¿Qué haréis si el domingo llueve? —Si llueve, nos quedamos en casa viendo una peli. —¿Y si hace bueno? —Si hace bueno, hacemos un picnic en el parque. —Perfecto. Ya veremos cómo va la cosa.\",\"itemIds\":[\"ena2m11whatwillyoudoif\",\"ena2m11ifitrains\",\"ena2m11ifitsnice\",\"ena2m11wellseehowitgoes\",\"enwatchafilm\"],\"tip\":\"Ese es el arco entero de un plan con plan B: pregunta, plan malo, pregunta, plan bueno, cierre. Cinco frases y ya sabes negociar un domingo.\"},{\"id\":\"ena2m11l6e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Si no coges abrigo, vas a pasar frío.\",\"answers\":[\"If you don't take a coat, you'll be cold.\",\"If you don't take a coat, you will be cold.\",\"You'll be cold if you don't take a coat.\"],\"hint\":\"la mitad de la condición va en presente, negativa incluida\",\"itemIds\":[\"ena2m11ifyoudonttakeacoat\"],\"tip\":\"Ojo a la negativa: «if you don't take», no «if you won't take». La mitad del if se niega como cualquier presente, con don't.\"},{\"id\":\"ena2m11l6e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el plan y su plan B\",\"text\":\"If it rains, we'll stay in. If it's nice, we'll have a picnic.\",\"phonetic\":\"if it RÉINS̬, uíil stéi IN. if its NÁIS, uíil jav a PIK-nik\",\"translation\":\"Si llueve, nos quedamos en casa. Si hace bueno, hacemos un picnic.\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11ifitsnice\"],\"tip\":\"La voz sube al final de la mitad del if y baja en la principal. Marcarlo hace que se entienda dónde acaba la condición sin que haga falta la coma.\"},{\"id\":\"ena2m11l6e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Qué harás si llueve? Si llueve, nos quedamos en casa. Ya veremos cómo va.\",\"answers\":[\"What will you do if it rains? If it rains, we'll stay in. We'll see how it goes.\",\"What will you do if it rains? If it rains, we will stay in. We'll see how it goes.\"],\"hints\":[\"La mitad del if va en presente las dos veces\",\"What will you do if it r…? If it r…, we'll stay in.\"],\"itemIds\":[\"ena2m11whatwillyoudoif\",\"ena2m11ifitrains\",\"ena2m11wellseehowitgoes\"],\"tip\":\"Fíjate en que en la pregunta también manda la regla: «if it rains», no «if it will rain». La pregunta no cambia nada.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-6\",\"book\":\"If it rains, we will stay at home.\",\"real\":\"If it rains, we'll just stay in.\",\"meaning\":\"Si llueve, nos quedamos en casa y ya está\",\"when\":\"Con amigos y en casa. «Stay in» es quedarse en casa, y es lo que dice todo el mundo; «stay at home» suena a redacción. Y ese «just» no significa «solo»: es el «y ya está» que quita hierro al plan B. En el examen, «stay at home» o «stay in», las dos valen.\",\"register\":\"amigos\",\"note\":\"El par es stay in / go out, y funciona igual que quedarse y salir.\",\"sound\":\"if it RÉINS̬, uíil dchast stéi IN\",\"level\":\"a2\",\"itemId\":\"ena2m11ifitrains\"}}],\"resources\":[{\"label\":\"British Council — conditionals 1\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/conditionals-1\",\"note\":\"Lee solo el primer bloque, el de la primera condicional (4 min). En cuanto la página empiece a hablar de «second conditional», ciérrala: eso es B1 y hoy solo te haría ruido.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
