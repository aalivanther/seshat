 las mismas seis pantallas, y cada una tiene su palabra:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eder Warenkorb\u003c/b\u003e — el carrito. Ahí está \u003cb\u003edie Ware\u003c/b\u003e, la mercancía.\u003cbr/\u003e2. \u003cb\u003edie Versandkosten\u003c/b\u003e — los gastos de envío. Siempre en \u003cb\u003eplural\u003c/b\u003e: «Die Versandkosten \u003cb\u003ebetragen\u003c/b\u003e 4,90 €».\u003cbr/\u003e3. \u003cb\u003edie Bestellung\u003c/b\u003e — el pedido, una vez confirmado. Verbo: bestellen.\u003cbr/\u003e4. \u003cb\u003edie Lieferung\u003c/b\u003e — la entrega. Verbo: liefern. «Die Lieferung dauert drei bis fünf Werktage.»\u003cbr/\u003e5. \u003cb\u003edas Paket\u003c/b\u003e — el paquete que llega.\u003cbr/\u003e6. \u003cb\u003edie Rechnung\u003c/b\u003e — la factura, que puede llegar antes, con o después.\u003cbr/\u003e\u003cbr/\u003eFíjate en algo que se repite: \u003cb\u003ebestellen → die Bestellung\u003c/b\u003e, \u003cb\u003eliefern → die Lieferung\u003c/b\u003e, \u003cb\u003ebezahlen → die Bezahlung\u003c/b\u003e. El alemán escrito convierte verbos en sustantivos todo el rato, y eso se llama [[Nominalisierung|nominalización]]. Lo trabajarás a fondo en la lección 4: es la marca del registro formal, y es lo que separa «Ich habe bezahlt» de «Nach Eingang der Bezahlung».\",\"table\":[[\"verbo\",\"sustantivo\",\"español\"],[\"bestellen\",\"die Bestellung\",\"pedir → el pedido\"],[\"liefern\",\"die Lieferung\",\"entregar → la entrega\"],[\"bezahlen\",\"die Bezahlung\",\"pagar → el pago\"],[\"umtauschen\",\"der Umtausch\",\"cambiar → el cambio\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l1e1\",\"type\":\"mc\",\"prompt\":\"Lee la pantalla de la tienda\",\"question\":\"„Die Versandkosten betragen 4,90 €.“\",\"options\":[\"Los gastos de envío son 4,90 €\",\"El artículo cuesta 4,90 €\",\"El descuento es de 4,90 €\"],\"answer\":0,\"whyWrong\":[null,\"El precio del artículo sería der Preis der Ware\",\"El descuento sería der Rabatt\"],\"itemIds\":[\"b1m8geversandkosten\"],\"tip\":\"Versandkosten es plural obligatorio, como «los gastos» en español. Nunca «*die Versandkost».\"},{\"id\":\"b1m8l1e2\",\"type\":\"match\",\"prompt\":\"Empareja cada pantalla con su palabra\",\"pairs\":[{\"target\":\"der Warenkorb\",\"source\":\"el carrito de la compra\"},{\"target\":\"die Bestellung\",\"source\":\"el pedido confirmado\"},{\"target\":\"die Lieferung\",\"source\":\"la entrega\"},{\"target\":\"die Rechnung\",\"source\":\"la factura\"}],\"itemIds\":[\"b1m8gewarenkorb\",\"b1m8gebestellung\",\"b1m8gelieferung\",\"b1m8gerechnung\"]},{\"id\":\"b1m8l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el aviso de la web\",\"text\":\"Die ___ dauert drei bis fünf Werktage.\",\"answers\":[\"Lieferung\"],\"translation\":\"La entrega tarda de tres a cinco días laborables.\",\"hints\":[\"Sustantivo de liefern\",\"L-i-e-f-e-r-u-n-g, con die\"],\"itemIds\":[\"b1m8gelieferung\"]},{\"id\":\"b1m8l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Verbo o sustantivo?\",\"categories\":[\"Verb\",\"Nomen\"],\"items\":[{\"text\":\"bestellen\",\"bucket\":0},{\"text\":\"die Bestellung\",\"bucket\":1},{\"text\":\"liefern\",\"bucket\":0},{\"text\":\"die Lieferung\",\"bucket\":1},{\"text\":\"bezahlen\",\"bucket\":0},{\"text\":\"die Bezahlung\",\"bucket\":1}],\"itemIds\":[\"b1m8gebestellung\",\"b1m8gelieferung\",\"b1m8gebezahlung\"],\"tip\":\"-ung convierte casi cualquier verbo en un sustantivo femenino. Es la fábrica de nominalizaciones más productiva del alemán.\"},{\"id\":\"b1m8l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el correo de la tienda\",\"text\":\"Vielen Dank für Ihre ___! Ihr Paket ist unterwegs.\",\"answers\":[\"Bestellung\"],\"translation\":\"¡Muchas gracias por su pedido! Su paquete está en camino.\",\"hints\":[\"Sustantivo de bestellen\",\"Ihre ___ — femenino\"],\"itemIds\":[\"b1m8gebestellung\",\"paket\"]},{\"id\":\"b1m8l1e6\",\"type\":\"mc\",\"prompt\":\"Falso amigo de nivel medio\",\"question\":\"„Ich habe gestern ein Paket bekommen.“\",\"options\":[\"Ayer recibí un paquete\",\"Ayer llegué a ser un paquete\",\"Ayer envié un paquete\"],\"answer\":0,\"whyWrong\":[null,\"«llegar a ser» es werden — bekommen NO es «llegar a ser»\",\"«enviar» es schicken o senden\"],\"itemIds\":[\"paket\"],\"tip\":\"bekommen = recibir. Es uno de los falsos amigos más caros del B1: se parece a «become» y a «llegar a ser», y no es ninguno de los dos.\"},{\"id\":\"b1m8l1e7\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el correo de confirmación\",\"text\":\"Ihre ___ ist bei uns eingegangen. Die ___ erfolgt in drei Werktagen. Die ___ finden Sie im Anhang.\",\"answers\":[\"Bestellung\",\"Lieferung\",\"Rechnung\"],\"bank\":[\"Bestellung\",\"Lieferung\",\"Rechnung\",\"Beschwerde\",\"Kündigung\",\"Garantie\"],\"translation\":\"Su pedido nos ha llegado. La entrega se realiza en tres días laborables. La factura la encontrará en el archivo adjunto.\",\"itemIds\":[\"b1m8gebestellung\",\"b1m8gelieferung\",\"b1m8gerechnung\"],\"tip\":\"«erfolgen» y «eingehen» son los verbos del alemán administrativo. No hace falta producirlos: hace falta reconocerlos sin frenar.\"},{\"id\":\"b1m8l1e8\",\"type\":\"build\",\"prompt\":\"Construye la frase del carrito\",\"target\":\"Die Ware liegt schon im Warenkorb\",\"translation\":\"La mercancía ya está en el carrito\",\"distractors\":[\"Waren\",\"in den\"],\"itemIds\":[\"b1m8geware\",\"b1m8gewarenkorb\"],\"tip\":\"liegen + im (dativo): posición, no movimiento. Si dijeras «in den Warenkorb» estarías metiéndola ahora mismo.\"},{\"id\":\"b1m8l1e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Die Lieferung dauert drei bis fünf Werktage.\",\"translation\":\"La entrega tarda de tres a cinco días laborables.\",\"hints\":[\"Empieza por Die Lieferung ...\",\"drei bis fünf Werktage\"],\"itemIds\":[\"b1m8gelieferung\"]},{\"id\":\"b1m8l1e10\",\"type\":\"transform\",\"prompt\":\"Nominaliza (el registro escrito)\",\"source\":\"Wir haben die Ware geliefert.\",\"instruction\":\"Dilo con un sustantivo: «Die Lieferung ...»\",\"answers\":[\"Die Lieferung der Ware ist erfolgt.\",\"Die Lieferung der Ware ist erfolgt\"],\"translation\":\"La entrega de la mercancía se ha realizado.\",\"hints\":[\"liefern → die Lieferung\",\"El complemento pasa a genitivo: der Ware\"],\"itemIds\":[\"b1m8gelieferung\",\"b1m8geware\"],\"tip\":\"Verbo + objeto se convierte en sustantivo + genitivo. Ese es el mecanismo que hace que un texto suene a documento y no a chat.\"},{\"id\":\"b1m8l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Muchas gracias por su pedido: el paquete está en camino\",\"answers\":[\"Vielen Dank für Ihre Bestellung, das Paket ist unterwegs\",\"Vielen Dank für Ihre Bestellung, das Paket ist unterwegs.\",\"Vielen Dank für Ihre Bestellung. Das Paket ist unterwegs\"],\"hints\":[\"Vielen Dank für + acusativo: für Ihre Bestellung\",\"das Paket ist unterwegs\"],\"itemIds\":[\"b1m8gebestellung\",\"paket\"],\"tip\":\"«Ihre» con mayúscula = de usted. Con minúscula, «ihre», sería de ella o de ellos. En un correo formal esa mayúscula es parte del registro.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m8-1\",\"book\":\"Das war sehr günstig.\",\"real\":\"Das war ein Schnäppchen!\",\"meaning\":\"¡Fue un chollo!\",\"when\":\"Entre amigos y en la publicidad, cuando algo salió mucho más barato de lo esperado. En un mail al vendedor o en una reclamación, no: ahí «günstig» o «preiswert» a secas.\",\"register\":\"amigos\",\"exam\":\"Das war ein sehr günstiges Angebot.\",\"note\":\"«schnappen» es «atrapar de un mordisco»: un Schnäppchen es literalmente una gangolita que pillaste al vuelo.\",\"sound\":\"das var ain SHNEP-jen\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m8geware\"}}],\"resources\":[{\"label\":\"Verbraucherzentrale — Online-Handel\",\"url\":\"https://www.verbraucherzentrale.de/\",\"note\":\"Textos reales de asociaciones de consumidores alemanas: el mismo registro que el Lesen Teil 5.\"}]}}]\n"])</script><script>self.__next_
