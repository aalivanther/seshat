i\u003enot\u003c/i\u003e se mete detrás de be. \u003ci\u003eI'\u003cb\u003em not\u003c/b\u003e going to drive.\u003c/i\u003e · \u003ci\u003eShe \u003cb\u003eisn't\u003c/b\u003e going to come.\u003c/i\u003e · \u003ci\u003eWe \u003cb\u003earen't\u003c/b\u003e going to stay.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ePregunta\u003c/b\u003e: be salta delante del sujeto. \u003ci\u003e\u003cb\u003eAre you\u003c/b\u003e going to take the train?\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIs she\u003c/b\u003e going to come?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eRespuesta corta\u003c/b\u003e: se repite \u003cb\u003ebe\u003c/b\u003e, nunca do ni going. \u003ci\u003eYes, I \u003cb\u003eam\u003c/b\u003e. / No, I'\u003cb\u003em not\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error que hay que matar hoy\u003c/b\u003e es meter \u003ci\u003edo\u003c/i\u003e donde no toca: \u003ci\u003eDo you going to take the train?\u003c/i\u003e Sale de que en el A1 casi todas las preguntas llevaban do/does, y de que en el módulo 2 casi todas llevaban did. Pero \u003cb\u003edo y be nunca aparecen juntos\u003c/b\u003e: si la frase ya tiene be —y going to siempre lo tiene—, be hace de auxiliar y do sobra.\u003cbr/\u003e\u003cbr/\u003eTruco de un segundo: \u003cb\u003e¿hay un am / is / are en la frase? Entonces no hay do.\u003c/b\u003e\",\"table\":[[\"\",\"con be (going to)\",\"con do (presente simple)\"],[\"afirmativa\",\"I'm going to drive.\",\"I drive to work.\"],[\"negativa\",\"I'm not going to drive.\",\"I don't drive to work.\"],[\"pregunta\",\"Are you going to drive?\",\"Do you drive to work?\"],[\"respuesta corta\",\"Yes, I am.\",\"Yes, I do.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"El otro going to: lo que se ve venir\",\"body\":\"Going to hace dos trabajos, y el segundo es igual de útil que el primero. Ya tienes la \u003cb\u003eintención\u003c/b\u003e («lo tengo decidido»). El segundo es la \u003cb\u003epredicción con pruebas delante\u003c/b\u003e: algo que va a pasar y se nota \u003cb\u003eahora mismo\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[It's going to rain.|Va a llover.]]\u003c/b\u003e — y lo dices porque estás mirando [[the clouds|las nubes]].\u003cbr/\u003e· \u003cb\u003e[[We're going to be late!|¡Vamos a llegar tarde!]]\u003c/b\u003e — y lo dices porque son y veinte y el tren sale y media.\u003cbr/\u003e· \u003ci\u003eLook at that bus — it's going to stop.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLo que une los dos usos es que \u003cb\u003ela causa ya existe\u003c/b\u003e cuando hablas: o la decisión ya está tomada, o las señales ya están ahí. Going to nunca es una suposición sacada de la nada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOjo con «be».\u003c/b\u003e «Vamos a llegar tarde» lleva un verbo en inglés que el español se salta: \u003ci\u003eWe're going to \u003cb\u003ebe\u003c/b\u003e late\u003c/i\u003e, porque tarde se \u003cb\u003eestá\u003c/b\u003e, como en \u003ci\u003eI'm late\u003c/i\u003e del A1. \u003ci\u003eWe're going to late\u003c/i\u003e deja la frase sin verbo principal.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m6l2e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la negativa\",\"question\":\"“I'm not going to drive — the traffic is terrible.”\",\"options\":[\"No voy a conducir\",\"No conduzco nunca\",\"No sé conducir\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «I don't drive» — rutina, no plan\",\"Eso sería «I can't drive»\"],\"itemIds\":[\"ena2m6imnotgoingtodrive\"]},{\"id\":\"ena2m6l2e2\",\"type\":\"bucket\",\"prompt\":\"¿Lo tiene decidido, o se ve venir?\",\"categories\":[\"decisión ya tomada\",\"se ve venir (hay señales)\"],\"items\":[{\"text\":\"I'm going to book a hotel.\",\"bucket\":0},{\"text\":\"It's going to rain.\",\"bucket\":1},{\"text\":\"We're going to be late!\",\"bucket\":1},{\"text\":\"She's going to study Italian.\",\"bucket\":0},{\"text\":\"I'm not going to drive.\",\"bucket\":0},{\"text\":\"Look at that bus — it's going to stop.\",\"bucket\":1}],\"itemIds\":[\"ena2m6itsgoingtorain\",\"ena2m6weregoingtobelate\",\"ena2m6imnotgoingtodrive\",\"ena2m6imgoingtobook\"],\"tip\":\"Los dos usos comparten lo esencial: la causa ya está ahí antes de que hables. Por eso son la misma estructura y no dos.\"},{\"id\":\"ena2m6l2e3\",\"type\":\"transform\",\"prompt\":\"Ponla en negativa\",\"source\":\"I'm going to drive to Brighton.\",\"instruction\":\"Niégala\",\"answers\":[\"I'm not going to drive to Brighton.\",\"I am not going to drive to Brighton.\"],\"translation\":\"No voy a conducir hasta Brighton.\",\"hints\":[\"El not se mete justo detrás del be\",\"I'm n… going to drive to Brighton.\"],\"itemIds\":[\"ena2m6imnotgoingtodrive\"]},{\"id\":\"ena2m6l2e4\",\"type\":\"transform\",\"prompt\":\"Ponla en pregunta\",\"source\":\"You're going to take the train.\",\"instruction\":\"Conviértela en pregunta\",\"answers\":[\"Are you going to take the train?\"],\"translation\":\"¿Vas a coger el tren?\",\"hints\":[\"El be salta delante del sujeto; nada de do\",\"A… you going to take the train?\"],\"itemIds\":[\"ena2m6areyougoingtotakethetrain\"]},{\"id\":\"ena2m6l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta\",\"text\":\"___ Amy going to come with us?\",\"answers\":[\"Is\"],\"translation\":\"¿Amy va a venir con nosotras?\",\"hints\":[\"Amy es «she»: el be de tercera persona, y va delante\",\"… Amy going to come with us?\"],\"itemIds\":[\"ena2m6areyougoingtotakethetrain\",\"endoyouwanttocome\"]},{\"id\":\"ena2m6l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa la negativa\",\"text\":\"We aren't going to ___ a taxi — it's too expensive.\",\"answers\":[\"take\",\"get\"],\"translation\":\"No vamos a coger un taxi: es demasiado caro.\",\"hints\":[\"Detrás de going to, el verbo desnudo\",\"aren't going to t… a taxi\"],\"itemIds\":[\"entaxi\",\"entooexpensive\"]},{\"id\":\"ena2m6l2e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige — hay un auxiliar de más\",\"wrong\":\"Do you going to take the train?\",\"answers\":[\"Are you going to take the train?\"],\"why\":\"Si la frase ya lleva be (am / is / are), be es el auxiliar y hace él la pregunta. Do y be nunca conviven: «Do you are…?» tampoco existe. La pista está a la vista — en cuanto veas un going to, busca el be y dale la vuelta.\",\"translation\":\"¿Vas a coger el tren?\",\"itemIds\":[\"ena2m6areyougoingtotakethetrain\"]},{\"id\":\"ena2m6l2e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la terminación\",\"wrong\":\"It's going to rains tomorrow.\",\"answers\":[\"It's going to rain tomorrow.\"],\"why\":\"Detrás de going to, el verbo va desnudo: sin -s, sin -ed y sin -ing. La -s de tercera persona ya la lleva el «is» de delante, y una frase no marca la persona dos veces.\",\"translation\":\"Mañana va a llover.\",\"itemIds\":[\"ena2m6itsgoingtorain\"]},{\"id\":\"ena2m6l2e9\",\"type\":\"mc\",\"prompt\":\"La respuesta corta\",\"question\":\"“Are you going to come on Saturday?” — ¿cómo se contesta que sí?\",\"options\":[\"Yes, I am.\",\"Yes, I do.\",\"Yes, I going.\"],\"answer\":0,\"whyWrong\":[null,\"Do contesta a preguntas con do: «Do you like it?» → «Yes, I do»\",\"La respuesta corta repite el auxiliar, y el auxiliar aquí es am\"],\"itemIds\":[\"ena2m6areyougoingtotakethetrain\"],\"tip\":\"Regla de oro de las respuestas cortas: se devuelve el auxiliar que traía la pregunta. Are you…? → I am. Did you…? → I did.\"},{\"id\":\"ena2m6l2e10\",\"type\":\"audiomc\",\"prompt\":\"Escucha el plan de Amy — pregunta primero, audio después\",\"audio\":\"I'm not going to work next week. I have a week off, so I'm going to visit my mum. I'm not going to drive — I'm going to get the coach.\",\"question\":\"¿Cómo va a viajar Amy?\",\"options\":[\"En autocar\",\"En coche\",\"En tren\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice justo lo contrario: «I'm not going to drive»\",\"El tren no suena en ningún momento\"],\"itemIds\":[\"ena2m6aweekoff\",\"ena2m6imnotgoingtodrive\",\"ena2m6thecoach\"],\"tip\":\"En el examen, la opción que suena literalmente en el audio suele ser la trampa: aquí «drive» aparece, pero con un not delante. Escucha la frase entera, no la palabra.\"},{\"id\":\"ena2m6l2e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — mirando por la ventana\",\"text\":\"Look at the clouds! It's going to rain. We're going to be late.\",\"phonetic\":\"luk at de KLÁUDS̬! its GÓU-in ta RÉIN. uía GÓU-in ta bi LÉIT\",\"translation\":\"¡Mira las nubes! Va a llover. Vamos a llegar tarde.\",\"itemIds\":[\"ena2m6clouds\",\"ena2m6itsgoingtorain\",\"ena2m6weregoingtobelate\"],\"tip\":\"Fíjate en el «be» de la última: sin él la frase se queda coja. Es el mismo be de «I'm late» que traes del A1.\"},{\"id\":\"ena2m6l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Vas a coger el tren? No, no voy a conducir: voy a coger el autocar.\",\"answers\":[\"Are you going to take the train? No, I'm not going to drive: I'm going to take the coach.\",\"Are you going to take the train? No, I'm not going to drive. I'm going to take the coach.\",\"Are you going to get the train? No, I'm not going to drive. I'm going to get the coach.\"],\"hints\":[\"La pregunta con be delante · la negativa con not detrás del be\",\"A… you going to take the train? No, I'm n… going to drive…\"],\"itemIds\":[\"ena2m6areyougoingtotakethetrain\",\"ena2m6imnotgoingtodrive\",\"ena2m6thecoach\"]}]}],\"resources\":[{\"label\":\"British Council — A2 Listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Busca cualquier audio con «plans» en el título y escúchalo dos veces: la primera por el sentido, la segunda contando cuántos going to caen.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/
