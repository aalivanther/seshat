seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T994,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e. El módulo 1 se llevó el \u003cb\u003eListening Part 1\u003c/b\u003e, el 2 el \u003cb\u003eReading Part 1\u003c/b\u003e y el 3 el \u003cb\u003eListening Part 3\u003c/b\u003e. Hoy toca el \u003cb\u003ePart 2\u003c/b\u003e, que es el que más se falla de todo el Listening — y no por vocabulario.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl formato, exacto:\u003c/b\u003e \u003cb\u003etres conversaciones cortas a dos voces\u003c/b\u003e, y \u003cb\u003edos preguntas de tres opciones por conversación\u003c/b\u003e. Seis ítems, seis marks. Todo se oye \u003cb\u003edos veces\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué se pregunta, según el propio handbook:\u003c/b\u003e \u003ci\u003etopic, purpose, context, speakers, gist, relationship, roles, functions, \u003cb\u003eattitudes, feelings and opinions\u003c/b\u003e\u003c/i\u003e. Lee esa lista otra vez y fíjate en lo que NO está: \u003cb\u003eno hay datos\u003c/b\u003e. No te van a preguntar a qué hora ni cuánto cuesta. Te van a preguntar \u003cb\u003equiénes son esos dos\u003c/b\u003e, \u003cb\u003epara qué habla el que habla\u003c/b\u003e y \u003cb\u003ecómo se siente\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor eso este módulo termina aquí\u003c/b\u003e: contestar eso es deducir. \u003ci\u003eHe must be her boss\u003c/i\u003e, \u003ci\u003eshe can't be very happy about it\u003c/i\u003e, \u003ci\u003ethey might not have decided yet\u003c/i\u003e. La gramática de la lección 1 es literalmente la herramienta de esta parte del examen.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas cuatro razones por las que se falla:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003ePor cazar palabras.\u003c/b\u003e Si en el audio suena \u003ci\u003ehospital\u003c/i\u003e y una opción dice «hospital», el 70 % de la gente la marca. Casi siempre es la trampa: la opción correcta suele estar dicha \u003cb\u003econ otras palabras\u003c/b\u003e.\u003cbr/\u003e2. \u003cb\u003ePor no leer las dos preguntas antes.\u003c/b\u003e Son dos por conversación y suelen ir en orden: la primera se contesta al principio del audio y la segunda al final. Saberlo te dice \u003cb\u003ecuándo\u003c/b\u003e escuchar.\u003cbr/\u003e3. \u003cb\u003ePor ignorar el tono.\u003c/b\u003e Un «Mmm» o un «I suppose» valen más que la frase entera: dicen que quien habla no está convencido.\u003cbr/\u003e4. \u003cb\u003ePor confundir hecho con opinión.\u003c/b\u003e Si la pregunta dice \u003ci\u003eWhat does she think…?\u003c/i\u003e, la respuesta no puede ser algo que simplemente ocurrió.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas señales que marcan actitud\u003c/b\u003e, y conviene tenerlas fichadas: \u003ci\u003eI suppose\u003c/i\u003e y \u003ci\u003eI must say\u003c/i\u003e (reservas), \u003ci\u003eto be honest\u003c/i\u003e (viene la verdad incómoda), \u003ci\u003eMmm\u003c/i\u003e y los silencios (desacuerdo educado), \u003ci\u003eat least\u003c/i\u003e (busca lo bueno), \u003ci\u003ethough\u003c/i\u003e al final (cambia la conclusión), y \u003ci\u003eWell…\u003c/i\u003e al principio de una respuesta (casi siempre significa «no del todo»).\u003cbr/\u003e\u003cbr/\u003eHoy vas a hacer las tres conversaciones enteras con sus seis preguntas, como en el examen."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l10\",\"phaseId\":\"enb1m6\",\"title\":\"Exam lab: Listening Part 2\",\"subtitle\":\"Tres conversaciones cortas, dos preguntas por conversación — y ninguna se contesta con un dato\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos palabras que gobiernan esta parte\",\"itemIds\":[\"enb1m6attitude\",\"enb1m6howdoesshefeel\",\"enb1m6notwhattheysay\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 2, y por qué se falla sabiendo todas las palabras\",\"body\":\"$17\",\"table\":[[\"Señal\",\"Lo que de verdad significa\"],[\"Well…\",\"No del todo / voy a matizar\"],[\"I suppose\",\"Lo acepto sin ganas\"],[\"To be honest\",\"Ahora viene lo que pienso de verdad\"],[\"Mmm\",\"No estoy de acuerdo, pero no lo digo\"],[\"…, though.\",\"Y esto le da la vuelta a lo anterior\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Part 2, ¿qué es lo primero que se hace?\",\"options\":[\"Leer las DOS preguntas de la conversación y decidir qué busca cada una\",\"Escuchar entera la primera vez sin mirar nada\",\"Apuntar todos los datos que suenen y elegir después\"],\"answer\":0,\"whyWrong\":[null,\"Con dos escuchas puedes permitírtelo, pero pierdes la primera entera: sin saber qué buscas, oyes palabras sueltas.\",\"En esta parte no se pregunta por datos. Apuntar cifras aquí es apuntar justo lo que no sirve.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m3makenotes\"],\"tip\":\"Las dos preguntas suelen ir en orden: la primera mira al principio del audio y la segunda al final. Eso solo ya te reparte la atención.\"},{\"id\":\"enb1m6l10e2\",\"type\":\"mc\",\"prompt\":\"La trampa número uno de esta parte\",\"question\":\"En el audio suena la palabra «hospital» y una de las tres opciones dice «hospital». ¿Qué haces?\",\"options\":[\"Desconfío: la opción que repite una palabra del audio suele ser el distractor\",\"La marco: si suena, es que es\",\"Espero a la segunda escucha y si vuelve a sonar, la marco\"],\"answer\":0,\"whyWrong\":[null,\"Eso es cazar palabras, y el examen lo sabe. Las opciones falsas se construyen precisamente con palabras que sí suenan.\",\"Va a volver a sonar, claro: está en el audio. Que suene no dice nada sobre si contesta la pregunta.\"],\"itemIds\":[\"enb1m6notwhattheysay\"],\"tip\":\"La opción correcta del Part 2 suele estar dicha con OTRAS palabras que las del audio. Es una prueba de comprensión, no de reconocimiento auditivo — para eso ya está el Part 3.\"},{\"id\":\"enb1m6l10e3\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 1 · pregunta 1 de 2. Lee la pregunta antes del play. Dos escuchas.\",\"notepad\":true,\"audio\":\"Morning. I'm here about the blood test — I got a text saying Wednesday, but the letter says Friday.|Let me have a look. Right. The text is the one to go by.|Are you sure? The letter looks very official.|They all do. The letters go out a fortnight ahead and half of them are wrong by the time they land on the mat. The text comes out of the system that morning.|So, Wednesday.|Wednesday, quarter past eight, and nothing to eat after midnight.|Nothing at all?|Water's fine. Tea isn't, before you ask. Everybody asks.\",\"question\":\"¿Para qué ha ido Valeria al mostrador?\",\"options\":[\"Para aclarar qué día tiene el análisis\",\"Para pedir cita con el médico\",\"Para recoger un resultado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No pide ninguna cita: ya la tiene, y lo que no sabe es el día.\",\"De resultados no se habla en ningún momento.\"],\"itemIds\":[\"enb1m6receptionist\",\"enb1m6bookanappointment\"],\"tip\":\"El propósito casi siempre está en la PRIMERA frase de quien llega: «I'm here about…». En el Part 2, si te pierdes el arranque, te pierdes la mitad de las respuestas.\"},{\"id\":\"enb1m6l10e4\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 1 · pregunta 2 de 2. Mismo audio.\",\"notepad\":true,\"audio\":\"Morning. I'm here about the blood test — I got a text saying Wednesday, but the letter says Friday.|Let me have a look. Right. The text is the one to go by.|Are you sure? The letter looks very official.|They all do. The letters go out a fortnight ahead and half of them are wrong by the time they land on the mat. The text comes out of the system that morning.|So, Wednesday.|Wednesday, quarter past eight, and nothing to eat after midnight.|Nothing at all?|Water's fine. Tea isn't, before you ask. Everybody asks.\",\"question\":\"¿Qué opina la recepcionista de las cartas?\",\"options\":[\"Que no son de fiar porque se mandan con mucha antelación\",\"Que son más fiables que los mensajes\",\"Que ya no se mandan nunca\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice lo contrario: «The text is the one to go by».\",\"Sí se mandan: explica cuándo salen y por qué llegan desfasadas.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m6howdoesshefeel\"],\"tip\":\"«Half of them are wrong by the time they land» es una opinión disfrazada de dato. Y fíjate en «They all do»: contesta a «looks very official» quitándole valor. La actitud casi nunca se dice, se deja caer.\"},{\"id\":\"enb1m6l10e5\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 2 · pregunta 1 de 2. Dos escuchas.\",\"notepad\":true,\"audio\":\"I went in the end.|And?|Physio. Six weeks of exercises and no lifting. She said that if it's the same in six weeks they'll scan it.|That's something, isn't it? At least there's a plan.|I suppose.|You don't sound very pleased.|Well. I was half hoping she'd sign me off for a fortnight, if I'm honest. Exercises at half six in the morning before a shift — I know myself.|You asked her and she told you, Ben. Do the exercises.|All right, all right.\",\"question\":\"¿Qué le han dicho a Ben que haga?\",\"options\":[\"Ejercicios de fisioterapia durante seis semanas\",\"Quedarse dos semanas de baja\",\"Hacerse una prueba esta misma semana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es lo que él esperaba, no lo que le han dicho: «I was half hoping she'd sign me off for a fortnight».\",\"La prueba es una posibilidad futura y condicionada: «if it's the same in six weeks».\"],\"itemIds\":[\"enb1m6advisedmeto\",\"enb1m6referral\"],\"tip\":\"Aquí está la trampa de manual: «a fortnight» suena en el audio y aparece en una opción, pero pertenece a lo que Ben DESEABA, no a lo que le mandaron. Cazar la palabra te lleva directo al error.\"},{\"id\":\"enb1m6l10e6\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 2 · pregunta 2 de 2. Mismo audio.\",\"notepad\":true,\"audio\":\"I went in the end.|And?|Physio. Six weeks of exercises and no lifting. She said that if it's the same in six weeks they'll scan it.|That's something, isn't it? At least there's a plan.|I suppose.|You don't sound very pleased.|Well. I was half hoping she'd sign me off for a fortnight, if I'm honest. Exercises at half six in the morning before a shift — I know myself.|You asked her and she told you, Ben. Do the exercises.|All right, all right.\",\"question\":\"¿Cómo se siente Ben con lo que le han dicho?\",\"options\":[\"Desanimado: esperaba algo más cómodo y duda de sí mismo\",\"Aliviado: es justo lo que quería oír\",\"Enfadado con la fisioterapeuta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«I suppose» y «You don't sound very pleased» dicen lo contrario de aliviado.\",\"No hay ni un reproche hacia ella: el problema es con el madrugón y consigo mismo («I know myself»).\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m6howdoesshefeel\",\"enb1m6notwhattheysay\"],\"tip\":\"Tres señales seguidas: «I suppose» (acepta sin ganas), «Well.» (viene un matiz) y «if I'm honest» (ahora sí, la verdad). Ninguna es vocabulario difícil y las tres son la respuesta.\"},{\"id\":\"enb1m6l10e7\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 3 · pregunta 1 de 2. Dos escuchas.\",\"notepad\":true,\"audio\":\"I've brought you the leaflet from the falls team. They come to the house, they don't charge anything, and they have a look at the stairs and the lighting.|Mmm.|Nora.|I'm not having strangers going round my house measuring things.|They're not strangers, they're the council. And last time we had this conversation you said you'd think about it.|I did think about it.|And?|And I've thought about it. Leave the leaflet on the table.|That's not a no, then.|It isn't a yes either. Put the kettle on.\",\"question\":\"¿Qué está haciendo Amy?\",\"options\":[\"Convencer a Nora de que acepte una visita del ayuntamiento\",\"Venderle un servicio privado\",\"Pedirle a Nora que vaya al centro de salud\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Se dice expresamente que no cobran y que son del ayuntamiento: «they don't charge anything», «they're the council».\",\"Nadie habla de ir a ningún sitio: el servicio va a casa.\"],\"itemIds\":[\"enb1m6lookafter\",\"enb1m6hadafall\"],\"tip\":\"«Roles y relación» es una de las cosas que pregunta esta parte. Aquí se deduce por cómo se hablan: Amy insiste y Nora corta. Son de confianza, y no es una llamada comercial.\"},{\"id\":\"enb1m6l10e8\",\"type\":\"audiomc\",\"prompt\":\"CONVERSACIÓN 3 · pregunta 2 de 2. Mismo audio.\",\"notepad\":true,\"audio\":\"I've brought you the leaflet from the falls team. They come to the house, they don't charge anything, and they have a look at the stairs and the lighting.|Mmm.|Nora.|I'm not having strangers going round my house measuring things.|They're not strangers, they're the council. And last time we had this conversation you said you'd think about it.|I did think about it.|And?|And I've thought about it. Leave the leaflet on the table.|That's not a no, then.|It isn't a yes either. Put the kettle on.\",\"question\":\"¿Cuál es la actitud de Nora al final?\",\"options\":[\"No dice que sí, pero deja la puerta abierta\",\"Se niega en redondo y zanja el tema\",\"Acepta encantada\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Si se negara, no dejaría el folleto en la mesa — y lo dice ella misma: «It isn't a yes either».\",\"«Mmm», «I'm not having strangers…» y «Put the kettle on» no son entusiasmo por ningún lado.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m6notwhattheysay\"],\"tip\":\"«Leave the leaflet on the table» es la respuesta entera, y no lleva ni un adjetivo de sentimiento. En inglés la actitud se hace, no se declara: si te esperas un «I'm not sure», no llega nunca.\"},{\"id\":\"enb1m6l10e9\",\"type\":\"mc\",\"prompt\":\"La señal más pequeña del examen\",\"question\":\"En una respuesta, ¿qué suele anunciar un «Well…» inicial?\",\"options\":[\"Que lo que viene matiza o contradice a medias lo anterior\",\"Que quien habla está de acuerdo del todo\",\"Que no ha entendido la pregunta\"],\"answer\":0,\"whyWrong\":[null,\"Para estar de acuerdo del todo no hace falta ningún preámbulo: se contesta y ya.\",\"Para eso está «Sorry?» o «I didn't catch that», que ya traes del módulo 3.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m3didntcatch\"],\"tip\":\"«Well» es la palabra más traicionera del inglés hablado: no significa «bien», significa «espera, que hay matiz». En el Part 2 es la pista que separa un sí de un sí a medias.\"},{\"id\":\"enb1m6l10e10\",\"type\":\"bucket\",\"prompt\":\"¿Hecho u opinión? El Part 2 pregunta por las dos, y no de la misma manera\",\"categories\":[\"Hecho\",\"Opinión\"],\"items\":[{\"text\":\"The letters go out a fortnight ahead.\",\"bucket\":0},{\"text\":\"Half of them are wrong by the time they land.\",\"bucket\":1},{\"text\":\"She said they'd scan it in six weeks.\",\"bucket\":0},{\"text\":\"That's something, isn't it?\",\"bucket\":1},{\"text\":\"The falls team don't charge anything.\",\"bucket\":0},{\"text\":\"I'm not having strangers going round my house.\",\"bucket\":1}],\"itemIds\":[\"enb1m6attitude\",\"enb1m6howdoesshefeel\"],\"tip\":\"Regla práctica: si la frase se puede comprobar mirando un papel, es hecho. Si depende de quién la diga, es opinión. Cuando la pregunta empieza por «What does she think…», la respuesta está siempre en la segunda columna.\"},{\"id\":\"enb1m6l10e11\",\"type\":\"mc\",\"prompt\":\"La pregunta que decide dónde escuchar\",\"question\":\"Las dos preguntas de una misma conversación, ¿en qué orden se contestan?\",\"options\":[\"Casi siempre en orden: la primera al principio del audio, la segunda al final\",\"En cualquier orden: hay que oírlo todo dos veces sin más\",\"Al revés: la segunda pregunta se contesta antes\"],\"answer\":0,\"whyWrong\":[null,\"Eso es lo que hace quien no ha leído las preguntas. Con dos escuchas se puede, pero se llega justo.\",\"El examen no juega a eso: sigue el orden del audio.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m3makenotes\"],\"tip\":\"Es una regla del formato, no una casualidad: la pregunta de propósito o de contexto mira al arranque, y la de actitud u opinión mira al cierre — que es donde la gente dice lo que piensa de verdad.\"},{\"id\":\"enb1m6l10e12\",\"type\":\"listen\",\"prompt\":\"Dictado: la frase que resume esta parte del examen\",\"text\":\"It's not what they say, it's how they say it.\",\"translation\":\"No es lo que dicen, es cómo lo dicen.\",\"strictContractions\":true,\"hints\":[\"Empieza por «It's not what…»\",\"It's not what they say, it's ...\"],\"itemIds\":[\"enb1m6notwhattheysay\"],\"tip\":\"Escríbela con las dos contracciones: en el Listening lo que se corrige es lo que sonó, y ahí sonaron dos «it's», no dos «it is».\"},{\"id\":\"enb1m6l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"¿Qué le parece? Escucha la actitud, no las palabras.\",\"answers\":[\"How does she feel about it? Listen to the attitude, not the words\",\"How does she feel about it? Listen to the attitude, not to the words\",\"How does she feel about it? Listen to the attitude, not the words.\"],\"hints\":[\"La primera mitad es la pregunta típica del Part 2\",\"How does she feel about it? Listen to the ...\"],\"itemIds\":[\"enb1m6howdoesshefeel\",\"enb1m6attitude\",\"enlistencarefully\"],\"tip\":\"Cuatro laboratorios hechos: Listening Part 1 (m1), Reading Part 1 (m2), Listening Part 3 (m3) y Listening Part 2 (hoy). Del Listening ya solo queda el Part 4, que es la discusión larga — y para eso te vendrá bien todo lo que has hecho hoy.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Listening)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo el Part 2 con el audio oficial: tres conversaciones, dos preguntas cada una, dos escuchas. Antes de darle al play, subraya en cada pregunta si te piden un propósito, una relación o una actitud.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
