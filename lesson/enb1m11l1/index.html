u003ci\u003eto\u003c/i\u003e, y si buscas la lógica que los separa, la vas a buscar toda la vida.\u003cbr/\u003e\u003cbr/\u003eEs \u003cb\u003ereparto léxico puro\u003c/b\u003e, como el género de los sustantivos en español: nadie sabe por qué «la mano» es femenina; se aprende. Así que este módulo no te explica el gerundio: \u003cb\u003ete da dos montones y te los hace repartir\u003c/b\u003e. Es la misma operación que hiciste en el A2 con los diez incontables ([[people, news, advice…|los que el español pluraliza y el inglés no]]) y con los dos montones de \u003ci\u003etell me\u003c/i\u003e / \u003ci\u003eexplain to me\u003c/i\u003e. Funcionó allí y funciona aquí.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMONTÓN A — detrás va \u003cu\u003e-ing\u003c/u\u003e:\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eenjoy · avoid · mind · finish · keep · practise · imagine · risk\u003c/b\u003e (y también \u003ci\u003egive up, end up, can't stand, suggest, involve\u003c/i\u003e)\u003cbr/\u003e→ \u003ci\u003eI enjoy \u003cb\u003eliving\u003c/b\u003e here.\u003c/i\u003e · \u003ci\u003eI don't mind \u003cb\u003ewaiting\u003c/b\u003e.\u003c/i\u003e · \u003ci\u003eThey keep \u003cb\u003eputting\u003c/b\u003e bags in the hallway.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMONTÓN B — detrás va \u003cu\u003eto\u003c/u\u003e + infinitivo:\u003c/b\u003e\u003cbr/\u003e\u003cb\u003edecide · agree · offer · refuse · manage · promise · afford · hope\u003c/b\u003e (y también \u003ci\u003ewant, need, plan, expect, seem, learn\u003c/i\u003e)\u003cbr/\u003e→ \u003ci\u003eThey agreed \u003cb\u003eto look\u003c/b\u003e into it.\u003c/i\u003e · \u003ci\u003eHe refused \u003cb\u003eto pay\u003c/b\u003e the fine.\u003c/i\u003e · \u003ci\u003eI can't afford \u003cb\u003eto move\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una cosa que SÍ es una regla, y de las buenas:\u003c/b\u003e detrás de \u003cb\u003epreposición\u003c/b\u003e siempre va \u003cb\u003e-ing\u003c/b\u003e. Siempre, sin excepciones y sin listas: \u003ci\u003ewithout \u003cb\u003easking\u003c/b\u003e\u003c/i\u003e, \u003ci\u003ebefore \u003cb\u003esigning\u003c/b\u003e\u003c/i\u003e, \u003ci\u003ehow about \u003cb\u003emeeting\u003c/b\u003e?\u003c/i\u003e, \u003ci\u003ethere's no point in \u003cb\u003ecomplaining\u003c/b\u003e\u003c/i\u003e, \u003ci\u003eI'm used to \u003cb\u003eliving\u003c/b\u003e here\u003c/i\u003e. Si delante hay una preposición, no te lo pienses.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl truco del examen:\u003c/b\u003e cuando no te acuerdes de en qué montón está un verbo, \u003cb\u003ecambia de verbo\u003c/b\u003e. Si dudas de \u003ci\u003e«I've finished to write»\u003c/i\u003e, di \u003ci\u003e«I've written it»\u003c/i\u003e y sigue. Vale más una frase segura que una arriesgada mal puesta — y el criterio de \u003ci\u003eAccuracy\u003c/i\u003e puntúa lo que escribes, no lo que intentaste."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l1\",\"phaseId\":\"enb1m11\",\"title\":\"I enjoy living here\",\"subtitle\":\"Dos montones de verbos: detrás de unos va -ing y detrás de otros, to. Y no hay regla\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los dos montones, y cuatro frases para probarlos\",\"itemIds\":[\"enb1m11geringroup\",\"enb1m11toinfgroup\",\"enb1m11ienjoyliving\",\"enb1m11idontmind\",\"enb1m11agreedto\",\"enb1m11keepputting\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Aquí no hay nada que entender: hay que clasificar\",\"body\":\"$17\",\"table\":[[\"Montón A (+ -ing)\",\"Montón B (+ to)\",\"Y el error clásico\"],[\"I enjoy living here.\",\"I decided to complain.\",\"I enjoy to live here.\"],[\"I don't mind waiting.\",\"They agreed to look into it.\",\"I don't mind to wait.\"],[\"They keep putting bags there.\",\"He refused to pay.\",\"He refused paying.\"],[\"without asking (preposición)\",\"I hope to hear from you.\",\"without to ask\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro frases de arranque\",\"pairs\":[{\"target\":\"I enjoy living here.\",\"source\":\"Me gusta vivir aquí.\"},{\"target\":\"I don't mind waiting.\",\"source\":\"No me importa esperar.\"},{\"target\":\"They agreed to look into it.\",\"source\":\"Aceptaron mirárselo.\"},{\"target\":\"They keep putting bags in the hallway.\",\"source\":\"No paran de dejar bolsas en el portal.\"}],\"itemIds\":[\"enb1m11ienjoyliving\",\"enb1m11idontmind\",\"enb1m11agreedto\",\"enb1m11keepputting\"],\"tip\":\"Fíjate en que las tres primeras no se diferencian en nada del sentido: lo único que decide es QUÉ VERBO va delante. Por eso se clasifica y no se razona.\"},{\"id\":\"enb1m11l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — el barrio, que ya lo traes puesto\",\"pairs\":[{\"target\":\"the neighbourhood\",\"source\":\"el barrio\"},{\"target\":\"the council\",\"source\":\"el ayuntamiento\"},{\"target\":\"a volunteer\",\"source\":\"un voluntario, una voluntaria\"},{\"target\":\"put up with\",\"source\":\"aguantar, soportar\"},{\"target\":\"deal with\",\"source\":\"ocuparse de, tratar con\"}],\"targetSeconds\":22,\"itemIds\":[\"enb1m1neighbourhood\",\"enb1m4council\",\"enb1m4volunteer\",\"enb1m1putupwith\",\"enb1m2dealwith\"],\"tip\":\"Cinco piezas que ya son tuyas de los módulos 1, 2 y 4. Este módulo no te las cambia: te las mete en frases más largas y con opinión dentro.\"},{\"id\":\"enb1m11l1e3\",\"type\":\"bucket\",\"prompt\":\"EL EJERCICIO DEL MÓDULO. Reparte los verbos en su montón — no lo pienses, clasifícalo\",\"categories\":[\"+ -ing (enjoy doing)\",\"+ to (decide to do)\"],\"items\":[{\"text\":\"enjoy\",\"bucket\":0},{\"text\":\"decide\",\"bucket\":1},{\"text\":\"avoid\",\"bucket\":0},{\"text\":\"agree\",\"bucket\":1},{\"text\":\"keep\",\"bucket\":0},{\"text\":\"refuse\",\"bucket\":1},{\"text\":\"mind\",\"bucket\":0},{\"text\":\"promise\",\"bucket\":1}],\"itemIds\":[\"enb1m11geringroup\",\"enb1m11toinfgroup\"],\"tip\":\"Ocho verbos, cuatro y cuatro. Si has dudado en alguno, no busques el porqué: no lo hay. Vuelve a la lista y léela en voz alta dos veces — así es como se aprende un reparto léxico.\"},{\"id\":\"enb1m11l1e4\",\"type\":\"mc\",\"prompt\":\"La pregunta que cierra el debate\",\"question\":\"¿Qué decide si detrás va «-ing» o «to»?\",\"options\":[\"El verbo de delante, y nada más: hay que sabérselo de memoria\",\"Si la acción dura en el tiempo o es puntual\",\"Si la frase está en presente o en pasado\"],\"answer\":0,\"whyWrong\":[null,\"Es la explicación que dan muchos manuales y es falsa: «hope» es tan duradera como «enjoy» y va con «to».\",\"El tiempo verbal no toca nada: «I enjoyed living there» y «I enjoy living here» llevan «-ing» las dos.\"],\"itemIds\":[\"enb1m11geringroup\",\"enb1m11toinfgroup\"],\"tip\":\"Aceptar esto de entrada es media batalla. Quien sigue buscando la lógica sigue fallando; quien se aprende las dos listas deja de fallar en una semana.\"},{\"id\":\"enb1m11l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Cambia UNA cosa.\",\"wrong\":\"I enjoy to live in this neighbourhood.\",\"answers\":[\"I enjoy living in this neighbourhood.\"],\"why\":\"«enjoy» está en el montón A: detrás va «-ing» y punto. No hay contexto ni matiz que cambie eso. El español dice «disfruto viviendo» y «me gusta vivir», y por eso la mano se va al infinitivo.\",\"translation\":\"Me gusta vivir en este barrio.\",\"itemIds\":[\"enb1m11ienjoyliving\",\"enb1m1neighbourhood\"]},{\"id\":\"enb1m11l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa con la forma del verbo entre paréntesis\",\"text\":\"They keep ___ (put) bags in the hallway.\",\"answers\":[\"putting\"],\"translation\":\"No paran de dejar bolsas en el portal.\",\"hints\":[\"«keep» está en el montón A\",\"Con doble t: ke-ep pu___\"],\"itemIds\":[\"enb1m11keepputting\"],\"tip\":\"«keep + -ing» es «no parar de»: no es que lo guarden, es que lo repiten. Y ojo con la ortografía: put → putting, con la t doblada.\"},{\"id\":\"enb1m11l1e7\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"They agreed to look into it\",\"translation\":\"Aceptaron mirárselo\",\"distractors\":[\"looking\",\"for\"],\"itemIds\":[\"enb1m11agreedto\",\"enb1m11lookinto\"],\"tip\":\"Las dos fichas que sobran son las dos tentaciones: «looking» por el montón equivocado y «for» por el calco de «para».\"},{\"id\":\"enb1m11l1e8\",\"type\":\"transform\",\"prompt\":\"Del montón B al montón A\",\"source\":\"He refused to pay the fine.\",\"instruction\":\"Dilo con «avoid», que está en el otro montón\",\"answers\":[\"He avoided paying the fine\",\"He avoided paying the fine.\"],\"translation\":\"Se libró de pagar la multa.\",\"hints\":[\"«avoid» está en el montón A\",\"He avoided ... the fine\"],\"itemIds\":[\"enb1m11geringroup\",\"enb1m11toinfgroup\",\"enb1m11gaveherafine\"],\"tip\":\"Mismo sujeto, mismo objeto, misma idea: lo único que cambia es el montón del verbo, y con él la forma de lo que va detrás. Ese es exactamente el mecanismo.\"},{\"id\":\"enb1m11l1e9\",\"type\":\"bucket\",\"prompt\":\"Segunda pasada, con los que no salieron antes\",\"categories\":[\"+ -ing (enjoy doing)\",\"+ to (decide to do)\"],\"items\":[{\"text\":\"finish\",\"bucket\":0},{\"text\":\"manage\",\"bucket\":1},{\"text\":\"practise\",\"bucket\":0},{\"text\":\"offer\",\"bucket\":1},{\"text\":\"imagine\",\"bucket\":0},{\"text\":\"afford\",\"bucket\":1},{\"text\":\"risk\",\"bucket\":0},{\"text\":\"hope\",\"bucket\":1}],\"itemIds\":[\"enb1m11geringroup\",\"enb1m11toinfgroup\"],\"tip\":\"«afford» ya lo tenías del módulo 1 («I can't afford the rent»): cuando lleva verbo detrás, lleva «to» — «I can't afford to move». Y «practise» con s es la ortografía británica del verbo.\"},{\"id\":\"enb1m11l1e10\",\"type\":\"gapbank\",\"prompt\":\"Completa la nota de Mrs Beckett en la puerta de Palmer Road\",\"text\":\"Mrs Beckett doesn't mind us ___ the bins out early, but she has decided ___ a note on the door. Two people keep ___ cardboard beside them, and the lorry refuses ___ it.\",\"answers\":[\"putting\",\"to write\",\"putting\",\"to take\"],\"bank\":[\"putting\",\"to write\",\"to take\",\"to complain\",\"hearing\",\"to afford\"],\"translation\":\"A Mrs Beckett no le importa que saquemos los cubos pronto, pero ha decidido poner una nota en la puerta. Dos personas no paran de poner cartón al lado, y el camión se niega a llevárselo.\",\"itemIds\":[\"enb1m11idontmind\",\"enb1m11keepputting\",\"enb1m11geringroup\",\"enb1m11toinfgroup\"],\"tip\":\"Cuatro huecos y cuatro verbos de delante: mind, decide, keep, refuse. Dos de un montón y dos del otro. Si has ido mirando el verbo de la izquierda antes de elegir, lo estás haciendo bien.\"},{\"id\":\"enb1m11l1e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"No me importa esperar, pero han decidido no contestar.\",\"answers\":[\"I don't mind waiting, but they have decided not to answer\",\"I don't mind waiting, but they've decided not to answer\",\"I don't mind waiting, but they have decided not to reply\",\"I don't mind waiting, but they've decided not to reply\"],\"hint\":\"La negación del infinitivo va delante del «to», no detrás\",\"itemIds\":[\"enb1m11idontmind\",\"enb1m11toinfgroup\"],\"tip\":\"«not to answer», nunca «to not answer» ni «don't answer». La negación se pega delante del «to» entero, y esa pieza cae en el examen escrito con una frecuencia que asusta.\"},{\"id\":\"enb1m11l1e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"They keep putting bags in the hallway.\",\"answers\":[\"No paran de dejar bolsas en el portal\",\"Siguen dejando bolsas en el portal\",\"No dejan de poner bolsas en el portal\"],\"itemIds\":[\"enb1m11keepputting\"],\"tip\":\"«keep + -ing» no es «guardar»: es «seguir haciendo algo», casi siempre con fastidio de por medio. Es una de las formas más útiles del inglés hablado y casi ningún manual la pone donde toca.\"},{\"id\":\"enb1m11l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"Have you seen the note downstairs?|The one about the cardboard? I put the bins out this morning and there it was.|She's furious. Well — furious for Mrs Beckett. Two lines and a full stop.|To be fair, the lorry did refuse to take it last week. I watched them drive off.|So what do we do?|Nothing. I don't mind putting the cardboard in the car and taking it round myself. It's ten minutes.|You shouldn't have to.|No. But I'd rather do that than spend a month arguing about whose it is.\",\"question\":\"¿Qué ha decidido hacer Valeria?\",\"options\":[\"Llevar ella misma el cartón, aunque no le toque\",\"Escribirle a Mrs Beckett para quejarse de la nota\",\"Esperar a que el camión vuelva a pasar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No habla de contestar a la nota: habla de resolver el cartón por su cuenta.\",\"Dice lo contrario: no quiere pasarse un mes discutiendo, así que actúa ya.\"],\"itemIds\":[\"enb1m11idontmind\",\"enb1m11tobefair\",\"enb1m11toinfgroup\"],\"tip\":\"Cuenta los montones que suenan en veinte segundos: «refuse TO take», «I don't mind PUTTING», «decided TO…». En el habla real van seguidos y nadie se para a pensarlos: por eso se aprenden como listas y no como reglas.\"}]}],\"resources\":[{\"label\":\"Cambridge Dictionary — «Verb patterns: verb + -ing or infinitive»\",\"url\":\"https://dictionary.cambridge.org/grammar/british-grammar/verb-patterns-verb-infinitive-or-verb-ing\",\"note\":\"No la leas entera: baja a las dos listas y cópialas a mano en tu cuaderno, en dos columnas. Copiarlas a mano es la mitad del trabajo — es exactamente el gesto que hace que un reparto léxico se quede.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"wid
