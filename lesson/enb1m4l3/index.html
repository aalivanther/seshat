BRARY SAVED AFTER PROTEST\u003c/b\u003e = The library \u003ci\u003ewas\u003c/i\u003e saved after a protest.\u003cbr/\u003e· \u003cb\u003ePOOL TO CLOSE IN MARCH\u003c/b\u003e = The pool \u003ci\u003eis going to\u003c/i\u003e close in March. (El \u003cb\u003eto +\u003c/b\u003e infinitivo del titular es \u003cb\u003efuturo\u003c/b\u003e.)\u003cbr/\u003e· \u003cb\u003eROAD TO BE REPAIRED\u003c/b\u003e = The road \u003ci\u003eis going to be\u003c/i\u003e repaired.\u003cbr/\u003e\u003cbr/\u003eEsto hay que \u003cb\u003ereconocerlo, no imitarlo\u003c/b\u003e: en tu Writing, una frase sin verbo cuenta como error de gramática. Pero saber desplegar un titular vale puntos en el Reading Part 3, donde hay que emparejar textos por su propósito y el titular es la primera pista de todas."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l3\",\"phaseId\":\"enb1m4\",\"title\":\"Has been published\",\"subtitle\":\"El perfecto en pasiva, y por qué los titulares no tienen verbo\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que ya se ha hecho, sin decir quién\",\"itemIds\":[\"enb1m4hasjustbeenpublished\",\"enb1m4hasbeenclosed\",\"enb1m4havebeensold\",\"enb1m4frontpage\",\"enb1m4localpaper\",\"enb1m4headlinesaved\",\"enb1m4copiesareprinted\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: has been + participio, y el titular que se come el auxiliar\",\"body\":\"$17\",\"table\":[[\"Titular\",\"La frase entera\",\"Qué borró\"],[\"LIBRARY SAVED\",\"The library was saved.\",\"el artículo y «was»\"],[\"TWO SCHOOLS MERGED\",\"Two schools were merged.\",\"«were»\"],[\"POOL TO CLOSE\",\"The pool is going to close.\",\"«is going to» → «to»\"],[\"ROAD TO BE REPAIRED\",\"The road is going to be repaired.\",\"«is going»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del periódico\",\"pairs\":[{\"target\":\"the front page\",\"source\":\"la portada\"},{\"target\":\"the local paper\",\"source\":\"el periódico local\"},{\"target\":\"Ten thousand copies are printed every week.\",\"source\":\"Se imprimen diez mil ejemplares a la semana.\"},{\"target\":\"LIBRARY SAVED AFTER PROTEST\",\"source\":\"BIBLIOTECA SALVADA TRAS LAS PROTESTAS\"}],\"itemIds\":[\"enb1m4frontpage\",\"enb1m4localpaper\",\"enb1m4copiesareprinted\",\"enb1m4headlinesaved\"],\"tip\":\"«paper» a secas es el periódico: «I read it in the paper». Y también es el papel. El contexto lo resuelve siempre, así que no te pares ahí.\"},{\"id\":\"enb1m4l3e2\",\"type\":\"mc\",\"prompt\":\"El perfecto, ahora en pasiva\",\"question\":\"«Se han vendido doscientas entradas» →\",\"options\":[\"Two hundred tickets have been sold.\",\"Two hundred tickets have sold.\",\"Two hundred tickets are been sold.\"],\"answer\":0,\"whyWrong\":[null,\"Sin «been», las entradas son las que venden algo. Falta la pieza que convierte el perfecto en pasiva.\",\"«are been» no existe: el auxiliar del perfecto es «have/has», no «are».\"],\"itemIds\":[\"enb1m4havebeensold\"],\"tip\":\"La receta entera: have/has + BEEN + participio. Esa palabra del medio es la que se olvida siempre, y sin ella la frase dice lo contrario.\"},{\"id\":\"enb1m4l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pieza que falta\",\"text\":\"The road has ___ closed since Monday.\",\"answers\":[\"been\"],\"translation\":\"La carretera está cortada desde el lunes.\",\"hints\":[\"Es la palabra del medio de la receta\",\"have/has + ??? + participio\"],\"itemIds\":[\"enb1m4hasbeenclosed\"],\"tip\":\"«been» no se traduce por nada en español, y por eso se cae. Piensa en ella como el pegamento entre el perfecto y la pasiva.\"},{\"id\":\"enb1m4l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The road is closed since Monday.\",\"answers\":[\"The road has been closed since Monday.\"],\"why\":\"«since» abre un periodo que llega hasta hoy, y eso pide perfecto: has been closed. El presente «is closed» describe cómo está la carretera ahora, pero no aguanta el «since» detrás.\",\"translation\":\"La carretera está cortada desde el lunes.\",\"itemIds\":[\"enb1m4hasbeenclosed\",\"enb1m1havelivedhere\"]},{\"id\":\"enb1m4l3e5\",\"type\":\"transform\",\"prompt\":\"De activa a pasiva, en perfecto\",\"source\":\"They have sold two hundred tickets.\",\"instruction\":\"Ponla en pasiva (sin decir quién)\",\"answers\":[\"Two hundred tickets have been sold\",\"Two hundred tickets have been sold.\"],\"translation\":\"Se han vendido doscientas entradas.\",\"hints\":[\"El objeto sube a sujeto: Two hundred tickets…\",\"Two hundred tickets have ... sold\"],\"itemIds\":[\"enb1m4havebeensold\"],\"tip\":\"Fíjate en que el auxiliar cambia con el sujeto nuevo: «tickets» es plural, así que «have», no «has».\"},{\"id\":\"enb1m4l3e6\",\"type\":\"bucket\",\"prompt\":\"Cada titular esconde un tiempo verbal. ¿Cuál?\",\"categories\":[\"Ya pasó (falta «was / were»)\",\"Va a pasar (el «to» del titular es futuro)\"],\"items\":[{\"text\":\"LIBRARY SAVED AFTER PROTEST\",\"bucket\":0},{\"text\":\"MAN ARRESTED IN HACKNEY\",\"bucket\":0},{\"text\":\"TWO SCHOOLS MERGED\",\"bucket\":0},{\"text\":\"POOL TO CLOSE IN MARCH\",\"bucket\":1},{\"text\":\"ROAD TO BE REPAIRED\",\"bucket\":1},{\"text\":\"COUNCIL TO ANNOUNCE CUTS\",\"bucket\":1}],\"itemIds\":[\"enb1m4headlinesaved\",\"enb1m4council\"],\"tip\":\"Un participio solo («SAVED», «ARRESTED») siempre es pasado en pasiva. Un «TO + infinitivo» siempre es futuro. Con esas dos reglas descifras el noventa por ciento de los titulares británicos.\"},{\"id\":\"enb1m4l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la nota del tablón — cuatro huecos\",\"text\":\"The report ___ just been published. Two hundred tickets have already ___ sold. The hall has been ___ for the whole weekend, and nothing has been ___ about the price yet.\",\"answers\":[\"has\",\"been\",\"booked\",\"said\"],\"bank\":[\"has\",\"been\",\"booked\",\"said\",\"have\",\"took\",\"saying\"],\"translation\":\"El informe acaba de publicarse. Ya se han vendido doscientas entradas. La sala está reservada para todo el fin de semana y del precio todavía no se ha dicho nada.\",\"itemIds\":[\"enb1m4hasjustbeenpublished\",\"enb1m4havebeensold\",\"enb1m1already\",\"enb1m1notyet\"],\"tip\":\"Cuatro perfectos en pasiva seguidos y ni un sujeto que haga nada. Así se escribe un informe: el que decide no aparece en ninguna de las cuatro frases.\"},{\"id\":\"enb1m4l3e8\",\"type\":\"order\",\"prompt\":\"Ordena los cinco días de la historia\",\"sentences\":[\"On Monday a photo of the library was posted online.\",\"On Tuesday it was shared two thousand times.\",\"On Wednesday the council was asked about it.\",\"On Thursday the post was taken down.\",\"On Friday the whole story was published in the local paper.\"],\"translation\":\"El lunes se publicó en internet una foto de la biblioteca. El martes se compartió dos mil veces. El miércoles se le preguntó al ayuntamiento. El jueves se retiró la publicación. El viernes el periódico local contó la historia entera.\",\"itemIds\":[\"enb1m4wasposted\",\"enb1m4wasshared\",\"enb1m4takendown\",\"enb1m4council\"],\"tip\":\"Cinco frases, cinco pasivas y ni un culpable en toda la semana. Léelas otra vez y pregúntate quién compartió, quién preguntó y quién retiró: el inglés de prensa no te lo dice, y esa es exactamente su gracia.\"},{\"id\":\"enb1m4l3e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"El informe acaba de publicarse.\",\"answers\":[\"The report has just been published\",\"The report has just been published.\"],\"hint\":\"«acabar de» en inglés es un adverbio del perfecto, no un verbo\",\"itemIds\":[\"enb1m4hasjustbeenpublished\",\"enb1m1just\"],\"tip\":\"«acabo de» no tiene verbo propio en inglés: se dice con perfecto + «just», y el «just» va entre el auxiliar y el resto.\"},{\"id\":\"enb1m4l3e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Despliega el titular: ¿qué dice de verdad?\",\"source\":\"POOL TO CLOSE IN MARCH\",\"answers\":[\"La piscina va a cerrar en marzo\",\"La piscina cerrará en marzo\",\"Se va a cerrar la piscina en marzo\"],\"itemIds\":[\"enb1m4headlinesaved\"],\"tip\":\"El «TO» del titular es futuro, no infinitivo de propósito. Confundirlo es leer un cierre pasado donde hay un anuncio.\"},{\"id\":\"enb1m4l3e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"The report has just been published.\",\"translation\":\"El informe acaba de publicarse.\",\"hints\":[\"Cuatro palabras antes del participio\",\"The report has ... been ...\"],\"itemIds\":[\"enb1m4hasjustbeenpublished\"],\"tip\":\"En el habla real «has been» se funde casi en una sílaba: «jas̬-bin». Si esperas dos palabras claras, te comes el perfecto.\"},{\"id\":\"enb1m4l3e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"Nothing has been decided yet, and the road has been closed since Monday.\",\"phonetic\":\"NÁ-zing jas̬ bin di-SÁI-did yet, and de róud jas̬ bin klóus̬d sins MÁN-dei\",\"translation\":\"Todavía no se ha decidido nada, y la carretera está cortada desde el lunes.\",\"itemIds\":[\"enb1m4hasbeenclosed\",\"enb1m1notyet\"],\"tip\":\"Dos perfectos en pasiva seguidos y el golpe cae siempre en el participio: deCIded, CLOSED. Los auxiliares pasan de puntillas, y así es como suenan de verdad.\"},{\"id\":\"enb1m4l3e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Todavía no se ha dicho nada del precio.\",\"answers\":[\"Nothing has been said about the price yet\",\"Nothing has been said about the price yet.\",\"Nothing has been said yet about the price\"],\"hints\":[\"Empieza por «Nothing…» y no añadas otro «not»\",\"Nothing has been ... about the price yet\"],\"itemIds\":[\"enb1m4hasjustbeenpublished\",\"enb1m1notyet\"],\"tip\":\"«Nothing» ya es negativo: con él el verbo va en afirmativo. «Nothing hasn't been said» sería doble negación, que en inglés
