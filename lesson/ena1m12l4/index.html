hueco gramatical\",\"question\":\"“Amy ___ coffee every morning.”\",\"options\":[\"drinks\",\"drink\",\"drinking\"],\"answer\":0,\"whyWrong\":[null,\"Amy = she → el verbo lleva -s: drinks\",\"El -ing necesita is delante (is drinking) — y esto es rutina, no ahora mismo\"],\"itemIds\":[\"entext\"],\"tip\":\"La -s de 3ª persona es LA trampa nº 1 del hispanohablante — y LanguageCert lo sabe.\"},{\"id\":\"ena1m12l4e2\",\"type\":\"mc\",\"prompt\":\"Tarea 1, tal cual: ¿is o has?\",\"question\":\"“It ___ cold today.”\",\"options\":[\"is\",\"has\",\"does\"],\"answer\":0,\"whyWrong\":[null,\"El frío en inglés se ES, no se TIENE: It is cold\",\"does es el auxiliar de preguntas — aquí falta el verbo be\"],\"itemIds\":[\"entext\"],\"tip\":\"It obligatorio + be para clima y estados: It's cold, It's raining. Nada de «Is cold».\"},{\"id\":\"ena1m12l4e3\",\"type\":\"cloze\",\"prompt\":\"Tarea 1 en formato hueco libre\",\"text\":\"People ___ happy at parties.\",\"answers\":[\"are\"],\"translation\":\"La gente está contenta en las fiestas.\",\"hints\":[\"people = ¿singular o plural?\",\"people A-R-E — siempre plural\"],\"itemIds\":[\"entext\"],\"tip\":\"people es plural SIEMPRE: people are, people want, people like. «People is» no existe.\"},{\"id\":\"ena1m12l4e4\",\"type\":\"order\",\"prompt\":\"Tarea 2, tal cual: reconstruye el email de Ben\",\"sentences\":[\"Dear Valeria, thank you for your email!\",\"Yes, I want to come to the party on Saturday.\",\"I can be at your house at seven.\",\"Do you want a chocolate cake?\",\"See you on Saturday! Ben\"],\"translation\":\"Querida Valeria: ¡gracias por tu email! Sí, quiero ir a la fiesta el sábado. Puedo estar en tu casa a las siete. ¿Quieres una tarta de chocolate? ¡Nos vemos el sábado! Ben\",\"hints\":[\"Saludo → sí → detalle → pregunta → despedida\",\"Dear… abre, See you… cierra\"],\"itemIds\":[\"entext\",\"endearamy\"],\"tip\":\"El orden lo marcan las pistas del texto: el saludo abre, la despedida firma. Igual en el examen.\"},{\"id\":\"ena1m12l4e5\",\"type\":\"mc\",\"prompt\":\"Tarea 3, tal cual: el cartel correcto\",\"question\":\"Quieres comprar pan el domingo. ¿Qué cartel te sirve?\",\"options\":[\"OPEN EVERY DAY 8-6\",\"CLOSED ON SUNDAYS\",\"NO DOGS IN THE SHOP\"],\"answer\":0,\"whyWrong\":[null,\"closed on Sundays = cerrado JUSTO el domingo\",\"Ese cartel habla de perros, no de horarios\"],\"itemIds\":[\"ensign\"],\"tip\":\"En la Tarea 3 pregúntate: ¿DÓNDE está este cartel y qué me deja o no me deja hacer?\"},{\"id\":\"ena1m12l4e6\",\"type\":\"mc\",\"prompt\":\"Tarea 4, tal cual: el detalle del texto\",\"question\":\"“Hi Sam! The party is at my house, 22 York Road. Come at seven and bring your guitar! — Valeria” · ¿Qué lleva Sam a la fiesta?\",\"options\":[\"Su guitarra\",\"Una tarta\",\"Un regalo\"],\"answer\":0,\"whyWrong\":[null,\"La tarta no aparece en la nota\",\"El regalo no aparece en la nota — bring your guitar sí\"],\"itemIds\":[\"entext\"],\"tip\":\"Responde SOLO con lo que dice el texto — nunca con lo que «sería lógico» llevar a una fiesta.\"},{\"id\":\"ena1m12l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa con la palabra del Reading\",\"text\":\"The ___ says: «Closed on Sundays».\",\"answers\":[\"sign\"],\"translation\":\"El cartel dice: «Cerrado los domingos».\",\"hints\":[\"Lo que cuelga en la puerta de la tienda\",\"the s-i-g-n — la g no suena\"],\"itemIds\":[\"ensign\"]},{\"id\":\"ena1m12l4e11\",\"type\":\"gapbank\",\"prompt\":\"Tarea 1 del Reading, en su formato real: elige la palabra de cada hueco\",\"text\":\"On the day of the exam, ___ carefully to the recording: you hear everything ___ . In the Reading, read the ___ before you look at the questions. In the Writing, ___ your words: 30 to 50, no more. And in the Spoken test, ___ worry — the examiner wants you to talk.\",\"answers\":[\"listen\",\"twice\",\"text\",\"count\",\"don't\"],\"bank\":[\"listen\",\"twice\",\"text\",\"count\",\"don't\",\"read\",\"answer\"],\"translation\":\"El día del examen, escucha con atención la grabación: todo se oye dos veces. En el Reading, lee el texto antes de mirar las preguntas. En el Writing, cuenta las palabras: de 30 a 50, ni una más. Y en el oral, no te preocupes: el examinador quiere que hables.\",\"itemIds\":[\"enlistencarefully\",\"entwice\",\"entext\",\"encountyourwords\",\"endontworry\"],\"tip\":\"En la Tarea 1 real sobran palabras del banco, igual que aquí. Lee la frase ENTERA antes de elegir: la pista casi nunca está pegada al hueco.\"},{\"id\":\"ena1m12l4e12\",\"type\":\"read\",\"prompt\":\"Tarea 4 del Reading: lee el texto y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Exam day in York Road\",\"text\":\"Every year the school in York Road [[organises|organiza]] the A1 exam in June. This year there are forty candidates: students, waiters, drivers, [[grandmothers|abuelas]] and one bus driver from Bogotá.\u003cbr/\u003e\u003cbr/\u003eThe Listening is first, at ten o'clock. \\\"Don't write in part one,\\\" says the examiner. \\\"Listen, then write. You hear everything twice.\\\"\u003cbr/\u003e\u003cbr/\u003eAfter a short [[break|pausa]], the Reading and the Writing: eighty minutes for four tasks and two texts of 30 to 50 words.\u003cbr/\u003e\u003cbr/\u003eThe Spoken test is in the afternoon and it takes six minutes. \\\"Six minutes!\\\" says Valeria. \\\"That's nothing.\\\" But her classmate Marta is [[nervous|nerviosa]]: \\\"Six minutes is a long time when the examiner is [[looking at|mirando]] you.\\\"\u003cbr/\u003e\u003cbr/\u003eAt five o'clock everybody is in the café. Nobody talks about the exam.\",\"questions\":[{\"id\":\"ena1m12l4e12q1\",\"q\":\"What time is the Listening?\",\"options\":[\"At ten o'clock\",\"In the afternoon\",\"At five o'clock\"],\"answer\":0,\"why\":\"«The Listening is first, at ten o'clock». Por la tarde es el oral.\"},{\"id\":\"ena1m12l4e12q2\",\"q\":\"How long is the Spoken test?\",\"options\":[\"Six minutes\",\"Eighty minutes\",\"Ten minutes\"],\"answer\":0,\"why\":\"«it takes six minutes». Los ochenta son del Reading y el Writing juntos.\"},{\"id\":\"ena1m12l4e12q3\",\"q\":\"Why does the examiner say \\\"Don't write in part one\\\"?\",\"options\":[\"Because you hear the recording twice: first listen, then write.\",\"Because part one has no questions.\",\"Because there is no paper in part one.\"],\"answer\":0,\"inference\":true,\"why\":\"El motivo no está en la orden: está en la frase siguiente («You hear everything twice»). Hay que unir las dos.\"},{\"id\":\"ena1m12l4e12q4\",\"q\":\"Valeria and Marta…\",\"options\":[\"…feel the same six minutes in a very different way.\",\"…both want a longer Spoken test.\",\"…do the exam on different days.\"],\"answer\":0,\"inference\":true,\"why\":\"Nadie dice «están nerviosas» ni «tranquilas»: se deduce de «That's nothing» frente a «Six minutes is a long time».\"},{\"id\":\"ena1m12l4e12q5\",\"q\":\"What happens at five o'clock?\",\"options\":[\"Everybody is in the café and nobody talks about the exam.\",\"The Spoken test starts.\",\"The examiner gives the results.\"],\"answer\":0,\"why\":\"Es la última frase del texto — y la más humana: al salir, nadie quiere hablar del examen.\"}],\"itemIds\":[\"enexam\",\"enexaminer\",\"entwice\",\"encandidate\",\"enpart\"],\"tip\":\"En la Tarea 4, dos preguntas de cinco no están escritas: se deducen. Si llevas dos minutos buscando la frase exacta, deja de buscarla y une las dos que ya tienes.\"},{\"id\":\"ena1m12l4e9\",\"type\":\"transform\",\"prompt\":\"Vacuna de la Tarea 1: la 3ª persona negativa\",\"source\":\"Amy don't like coffee.\",\"instruction\":\"Corrígela — tercera persona\",\"answers\":[\"Amy doesn't like coffee.\",\"Amy doesn't like coffee\",\"Amy does not like coffee.\"],\"translation\":\"A Amy no le gusta el café.\",\"hints\":[\"Amy = she → el auxiliar se viste\",\"doesn't\"],\"itemIds\":[\"entext\"],\"tip\":\"don't/doesn't es la pareja que la Tarea 1 explota sin piedad: he/she/it siempre con doesn't.\"},{\"id\":\"ena1m12l4e10\",\"type\":\"mc\",\"prompt\":\"Tarea 2, tal cual: la frase que falta\",\"question\":\"«I live in London. ___ It's small, but I love it.» ¿Qué frase falta en el hueco?\",\"options\":[\"My flat is near the park.\",\"See you tomorrow!\",\"Yes, please.\"],\"answer\":0,\"whyWrong\":[null,\"Una despedida no encaja entre dos frases sobre dónde vives\",\"Yes, please responde a un ofrecimiento — aquí nadie ofrece nada\"],\"itemIds\":[\"enmissingsentence\"],\"tip\":\"Tarea 2: lee lo de ANTES y lo de DESPUÉS del hueco. El It's small habla de algo — ¿de qué? Del piso que falta.\"},{\"id\":\"ena1m12l4e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción — la trampa estrella de la Tarea 1\",\"question\":\"Traduce (¡ojo con la trampa!): Amy tiene veinticuatro años.\",\"answers\":[\"Amy is twenty-four.\",\"Amy is twenty-four\",\"Amy's twenty-four.\",\"Amy's twenty-four\",\"Amy is twenty-four years old.\",\"Amy is twenty-four years old\",\"Amy's twenty-four years old.\",\"Amy's twenty-four years old\",\"Amy is 24.\",\"Amy is 24\",\"Amy is 24 years old.\",\"Amy is 24 years old\"],\"hints\":[\"La edad en inglés se ES, no se tiene\",\"A-m-y I-S t-w-e-n-t-y f-o-u-r (years old)\"],\"itemIds\":[\"entext\"],\"tip\":\"Edad con BE, nunca con have. En la Tarea 1 esta trampa cae casi seguro — ya no contigo.\"}]}],\"resources\":[{\"label\":\"British Council — A1 Reading\",\"url\":\"https://learnenglish.britishcouncil.org/skills/reading/a1-reading\",\"note\":\"Un texto al día con sus ejercicios: los tipos de tarea son primos de los del examen.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/s
