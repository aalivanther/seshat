RE piden dativo\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Chunks con preposición — el porqué del «mit dem Bus»\",\"itemIds\":[\"a2m4beimeineroma\",\"a2m4seit\",\"a2m4seiteinemjahr\",\"a2m4zum\",\"a2m4zur\",\"a2m4vonmeinembruder\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: aus, bei, mit, nach, seit, von, zu — dativo sin excepción\",\"body\":\"Siete preposiciones van SIEMPRE con dativo, pase lo que pase: \u003cb\u003eaus, bei, mit, nach, seit, von, zu\u003c/b\u003e. Recítalas como un conjuro hasta que tengan ritmo — los estudiantes de alemán las cantan con la melodía de un vals: \u003ci\u003eaus-bei-mit, nach-seit, von-zu\u003c/i\u003e. La recompensa: por fin sabes por qué el A1 te hizo memorizar \u003cb\u003emit dem Bus\u003c/b\u003e — mit pide dativo y der Bus se vuelve dem Bus. Chunks nuevos del mismo molde: \u003cb\u003ebei meiner Oma\u003c/b\u003e (en casa de mi abuela), \u003cb\u003eseit einem Jahr\u003c/b\u003e (desde hace un año — y el verbo en presente: \u003ci\u003eIch lerne seit einem Jahr Deutsch\u003c/i\u003e), \u003cb\u003evon meinem Bruder\u003c/b\u003e (de mi hermano). Y dos contracciones de andar por casa: zu + dem = \u003cb\u003ezum\u003c/b\u003e, zu + der = \u003cb\u003ezur\u003c/b\u003e — zum Bahnhof, zur Schule.\",\"table\":[[\"preposición\",\"chunk\"],[\"aus\",\"aus der Schweiz — de Suiza\"],[\"bei\",\"bei meiner Oma — en casa de mi abuela\"],[\"mit\",\"mit dem Bus — en bus\"],[\"nach\",\"nach Hause · nach Berlin\"],[\"seit\",\"seit einem Jahr — desde hace un año\"],[\"von\",\"von meinem Bruder — de mi hermano\"],[\"zu (zum/zur)\",\"zum Bahnhof · zur Schule\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m4l5e1\",\"type\":\"mc\",\"prompt\":\"El misterio del A1, resuelto\",\"question\":\"¿Por qué se dice «mit dem Bus» y no «mit der Bus»?\",\"options\":[\"Porque mit siempre lleva dativo — y der Bus se convierte en dem Bus\",\"Porque Bus es neutro\",\"Porque dem suena mejor delante de Bus\"],\"answer\":0,\"whyWrong\":[null,\"Bus es masculino: der Bus — el dem no viene del género sino del dativo\",\"El alemán no va de sonar mejor: mit pide dativo, siempre\"],\"itemIds\":[\"mitdembus\",\"bus\"],\"tip\":\"Todo chunk memorizado esconde una regla. mit dem Bus era dativo desde el primer día.\"},{\"id\":\"a2m4l5e2\",\"type\":\"cloze\",\"prompt\":\"Completa el posesivo\",\"text\":\"Ich wohne bei ___ Oma. (mi)\",\"answers\":[\"meiner\"],\"translation\":\"Vivo en casa de mi abuela.\",\"hints\":[\"bei + dativo — y la Oma es femenina\",\"mein + er\"],\"itemIds\":[\"a2m4beimeineroma\",\"grossmutter\"],\"tip\":\"bei + persona = «en casa de»: bei meiner Oma, bei Nico. La preposición más hogareña del alemán.\"},{\"id\":\"a2m4l5e3\",\"type\":\"cloze\",\"prompt\":\"Completa — ¿desde cuándo?\",\"text\":\"Ich lerne seit ___ Jahr Deutsch. (un)\",\"answers\":[\"einem\"],\"translation\":\"Aprendo alemán desde hace un año.\",\"hints\":[\"das Jahr es neutro → dativo en -em\",\"ein + em\"],\"itemIds\":[\"a2m4seit\",\"a2m4seiteinemjahr\"],\"tip\":\"seit + dativo + verbo en PRESENTE: Ich lerne seit einem Jahr — el alemán no dice «he estado aprendiendo».\"},{\"id\":\"a2m4l5e4\",\"type\":\"mc\",\"prompt\":\"¿zum o zur?\",\"question\":\"«Voy a la estación» →\",\"options\":[\"Ich fahre zur Bahnhof\",\"Ich fahre zum Bahnhof\"],\"answer\":1,\"whyWrong\":[\"zur = zu + der (femenino) — der Bahnhof es masculino: zu + dem = zum\",null],\"itemIds\":[\"a2m4zum\",\"bahnhof\"],\"tip\":\"zum para masculino y neutro, zur para femenino. La contracción te chiva el género del destino.\"},{\"id\":\"a2m4l5e5\",\"type\":\"match\",\"prompt\":\"Empareja el chunk con su significado\",\"pairs\":[{\"target\":\"zum Bahnhof\",\"source\":\"a la estación\"},{\"target\":\"zur Schule\",\"source\":\"al colegio\"},{\"target\":\"bei meiner Oma\",\"source\":\"en casa de mi abuela\"},{\"target\":\"seit einem Jahr\",\"source\":\"desde hace un año\"}],\"itemIds\":[\"a2m4zum\",\"a2m4zur\",\"a2m4beimeineroma\",\"a2m4seiteinemjahr\",\"bahnhof\"]},{\"id\":\"a2m4l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa — ¿de quién viene?\",\"text\":\"Das Buch ist von ___ Bruder. (mi)\",\"answers\":[\"meinem\"],\"translation\":\"El libro es de mi hermano.\",\"hints\":[\"von + dativo — y der Bruder es masculino\",\"mein + em\"],\"itemIds\":[\"a2m4vonmeinembruder\",\"buch\",\"bruder\"]},{\"id\":\"a2m4l5e7\",\"type\":\"build\",\"prompt\":\"Construye el plan del domingo\",\"target\":\"Wir fahren mit dem Zug zu meiner Oma\",\"translation\":\"Vamos en tren a casa de mi abuela\",\"altTargets\":[\"Mit dem Zug fahren wir zu meiner Oma\",\"Zu meiner Oma fahren wir mit dem Zug\"],\"distractors\":[\"zur\",\"den\"],\"itemIds\":[\"a2m4beimeineroma\",\"zug\",\"grossmutter\"],\"tip\":\"Dos dativos en una frase: mit dem Zug y zu meiner Oma. Con las siete mágicas no hay que pensar — dativo y listo.\"},{\"id\":\"a2m4l5e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich wohne seit einem Jahr in Berlin\",\"translation\":\"Vivo en Berlín desde hace un año\",\"hints\":[\"seit — la s zumba como abeja\",\"einem con -m final\"],\"itemIds\":[\"a2m4seiteinemjahr\",\"a2m4seit\"]},{\"id\":\"a2m4l5e9\",\"type\":\"speak\",\"prompt\":\"Lee en voz alta (pulsa audio para comparar)\",\"text\":\"Ich fahre mit dem Bus zu meiner Oma\",\"phonetic\":\"ij FAA-re mit deem bus tsu MAI-na OO-ma\",\"translation\":\"Voy en bus a casa de mi abuela\",\"itemIds\":[\"mitdembus\",\"a2m4beimeineroma\"]},{\"id\":\"a2m4l5e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Vivo en casa de mi abuela\",\"answers\":[\"Ich wohne bei meiner Oma\"],\"hints\":[\"bei + dativo femenino\",\"Ich wohne bei ... Oma\"],\"itemIds\":[\"a2m4beimeineroma\",\"grossmutter\"],\"tip\":\"aus-bei-mit-nach-seit-von-zu: si te salió meiner sin dudar, el conjuro ya funciona solo.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — Präpositionen mit Dativ (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Las siete preposiciones e
