43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T540,Este es \u003cb\u003eel\u003c/b\u003e contraste del B1 inglés, y se desmonta en tres piezas separadas y en este orden:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. for = duración · since = punto de arranque.\u003c/b\u003e\u003cbr/\u003e\u003ci\u003efor\u003c/i\u003e two years · \u003ci\u003efor\u003c/i\u003e three months · \u003ci\u003efor\u003c/i\u003e ages\u003cbr/\u003e\u003ci\u003esince\u003c/i\u003e 2023 · \u003ci\u003esince\u003c/i\u003e March · \u003ci\u003esince\u003c/i\u003e I arrived\u003cbr/\u003eTruco de bolsillo: si detrás puedes poner un número de tiempo, es \u003cb\u003efor\u003c/b\u003e. Si detrás va una fecha o un suceso, es \u003cb\u003esince\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. El tiempo verbal es obligatorio.\u003c/b\u003e «Vivo aquí desde hace tres años» no se dice \u003ci\u003eI live here\u003c/i\u003e: se dice \u003cb\u003eI have lived here\u003c/b\u003e / \u003cb\u003eI've been living here\u003c/b\u003e. El presente inglés significa «en general, siempre», no «desde entonces hasta hoy».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. La pregunta que lo dispara: How long…?\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eHow long have you been living here?\u003c/b\u003e — y la respuesta copia el tiempo verbal de la pregunta: \u003ci\u003eI've been living here for two years.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Simple o continuo?\u003c/b\u003e Con la \u003cb\u003eduración de una actividad\u003c/b\u003e el inglés prefiere el continuo: \u003ci\u003eI've been [[working|trabajando]] here since March.\u003c/i\u003e Con verbos de estado (\u003ci\u003ebe, know, have\u003c/i\u003e = tener) va el simple: \u003ci\u003eI've [[known|conocido]] her for two years\u003c/i\u003e, nunca «I've been knowing». Y con \u003cb\u003ecuántas veces\u003c/b\u003e o \u003cb\u003ecuántos\u003c/b\u003e, también simple: \u003ci\u003eI've seen that film three times.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l2\",\"phaseId\":\"enb1m1\",\"title\":\"How long have you been here?\",\"subtitle\":\"for y since, y el tiempo verbal que el español no usa\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuánto tiempo llevas — las piezas\",\"itemIds\":[\"enb1m1howlong\",\"enb1m1forthreemonths\",\"enb1m1sincemarch\",\"enb1m1beenworking\",\"enb1m1arrivedin\",\"enb1m1whenIwas\",\"enb1m1lastyear\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: «desde hace» son TRES piezas, no una\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés — mal\",\"Inglés — bien\"],[\"Vivo aquí desde hace 3 años\",\"I live here since 3 years\",\"I've lived here for 3 years\"],[\"Trabajo allí desde marzo\",\"I work there since March\",\"I've been working there since March\"],[\"¿Cuánto llevas aquí?\",\"How long are you here?\",\"How long have you been here?\"],[\"La conozco desde 2023\",\"I know her since 2023\",\"I've known her since 2023\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l2e1\",\"type\":\"bucket\",\"prompt\":\"¿for o since? Clasifica lo que va DETRÁS\",\"categories\":[\"for — duración\",\"since — punto de arranque\"],\"items\":[{\"text\":\"two years\",\"bucket\":0},{\"text\":\"March\",\"bucket\":1},{\"text\":\"three months\",\"bucket\":0},{\"text\":\"2023\",\"bucket\":1},{\"text\":\"ages\",\"bucket\":0},{\"text\":\"I arrived\",\"bucket\":1},{\"text\":\"a long time\",\"bucket\":0},{\"text\":\"last summer\",\"bucket\":1}],\"itemIds\":[\"enb1m1forthreemonths\",\"enb1m1sincemarch\"],\"tip\":\"No memorices frases: memoriza QUÉ va detrás. Un trozo de tiempo → for. Un momento del calendario → since.\"},{\"id\":\"enb1m1l2e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I work at the café since March.\",\"answers\":[\"I have been working at the café since March.\",\"I've been working at the café since March.\"],\"why\":\"«since March» abre un periodo que llega hasta hoy, y para eso el inglés exige perfecto: have been + -ing. El presente inglés significa «en general», no «desde entonces».\",\"translation\":\"Llevo trabajando en el café desde marzo.\",\"itemIds\":[\"enb1m1beenworking\",\"enb1m1sincemarch\"]},{\"id\":\"enb1m1l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"How long are you living here?\",\"answers\":[\"How long have you been living here?\"],\"why\":\"«How long…?» pregunta por un periodo que llega hasta ahora: siempre present perfect. «How long are you living here?» pregunta otra cosa — cuánto tiempo piensas quedarte.\",\"translation\":\"¿Cuánto tiempo llevas viviendo aquí?\",\"itemIds\":[\"enb1m1howlong\"]},{\"id\":\"enb1m1l2e4\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación del primer día en el piso\",\"text\":\"«___ long have you been living in London?» «I arrived ___ 2023, so it's been two years. I've been working at the café ___ March, and before that I shared a room ___ six months.»\",\"answers\":[\"How\",\"in\",\"since\",\"for\"],\"bank\":[\"How\",\"in\",\"since\",\"for\",\"What\",\"ago\",\"during\"],\"translation\":\"«¿Cuánto tiempo llevas viviendo en Londres?» «Llegué en 2023, así que hace dos años. Llevo trabajando en el café desde marzo, y antes compartí habitación durante seis meses.»\",\"itemIds\":[\"enb1m1howlong\",\"enb1m1arrivedin\",\"enb1m1sincemarch\",\"enb1m1forthreemonths\"],\"tip\":\"Los cuatro huecos son cuatro decisiones distintas: la palabra de la pregunta, la preposición del año, el arranque y la duración. En el examen caen todas juntas, como aquí.\"},{\"id\":\"enb1m1l2e5\",\"type\":\"mc\",\"prompt\":\"Simple o continuo\",\"question\":\"«La conozco desde 2023» →\",\"options\":[\"I've known her since 2023.\",\"I've been knowing her since 2023.\",\"I know her since 2023.\"],\"answer\":0,\"whyWrong\":[null,\"«know» es un verbo de estado: no admite forma continua en ningún tiempo.\",\"El presente no cubre «desde 2023»: hace falta perfecto.\"],\"itemIds\":[\"enb1m1sincemarch\"],\"tip\":\"Estados (be, know, have = tener, like, understand): siempre simple. Actividades (work, live, wait, study): el continuo suena mejor.\"},{\"id\":\"enb1m1l2e6\",\"type\":\"transform\",\"prompt\":\"De la pregunta a la respuesta\",\"source\":\"How long have you been working at the café?\",\"instruction\":\"Contéstala: desde marzo\",\"answers\":[\"I have been working at the café since March\",\"I've been working at the café since March\",\"I have been working there since March\",\"I've been working there since March\"],\"translation\":\"Llevo trabajando en el café desde marzo.\",\"hints\":[\"La respuesta copia el tiempo verbal de la pregunta\",\"I have been working ... since ...\"],\"itemIds\":[\"enb1m1beenworking\",\"enb1m1howlong\"],\"tip\":\"Copiar el tiempo verbal de la pregunta es una técnica de examen, no un truco: en el Speaking Part 1 te da media respuesta gratis.\"},{\"id\":\"enb1m1l2e7\",\"type\":\"bucket\",\"prompt\":\"¿Periodo cerrado o periodo abierto?\",\"categories\":[\"PASADO SIMPLE — cerrado (I moved)\",\"PRESENT PERFECT — abierto (I have moved)\"],\"items\":[{\"text\":\"two years ago\",\"bucket\":0},{\"text\":\"since March\",\"bucket\":1},{\"text\":\"in 2023\",\"bucket\":0},{\"text\":\"for three months\",\"bucket\":1},{\"text\":\"last year\",\"bucket\":0},{\"text\":\"so far\",\"bucket\":1},{\"text\":\"when I was a student\",\"bucket\":0},{\"text\":\"up to now\",\"bucket\":1}],\"itemIds\":[\"enb1m1movedin\",\"enb1m1arrivedin\",\"enb1m1lastyear\",\"enb1m1whenIwas\",\"enb1m1sofar\"],\"tip\":\"El marcador MANDA sobre el verbo, no al revés. Si el periodo terminó (ago, in 2023, last year, yesterday), pasado simple, aunque la acción te parezca reciente.\"},{\"id\":\"enb1m1l2e7b\",\"type\":\"mc\",\"prompt\":\"Tu español no te empuja al mismo error que al de al lado\",\"question\":\"«Ya terminé» / «Ya he terminado» — ¿cuál es el inglés del examen?\",\"options\":[\"I've already finished.\",\"I already finished.\",\"Las dos valen igual en el examen.\"],\"answer\":0,\"whyWrong\":[null,\"Es lo que sale si tu español dice «ya terminé». Se oye en el inglés americano, pero el examen que preparas es británico y con «already» pide el perfecto.\",\"En la calle americana casi; en el papel del examen, no. Elige una y sé coherente.\"],\"itemIds\":[\"enb1m1already\"],\"tip\":\"AQUÍ SE PARTE EN DOS, y depende de dónde seas. Si tú dirías «hoy he ido al médico», tu español te empuja a PONER perfecto de más: cuidado con «I have gone yesterday», que está mal en los dos idiomas. Si tú dirías «hoy fui al médico», te empuja a lo contrario — a comerte el perfecto donde el inglés lo exige: «Did you finish yet?», «I just arrived». Mira cuál de las dos frases suena a la tuya: esa es tu mitad de la trampa.\"},{\"id\":\"enb1m1l2e8\",\"type\":\"cloze\",\"prompt\":\"Completa con el tiempo verbal correcto\",\"text\":\"Last year I ___ to a bigger flat.\",\"answers\":[\"moved\"],\"translation\":\"El año pasado me mudé a un piso más grande.\",\"hints\":[\"«last year» es un periodo cerrado\",\"Pasado simple, un solo verbo\"],\"itemIds\":[\"enb1m1lastyear\"],\"tip\":\"«Last year I have moved» no sale de tu español: sale de traducir a bulto. En peninsular estándar tampoco se dice «el año pasado me he mudado» —«el año pasado» cierra el periodo y pide indefinido en todo el mundo hispanohablante—. Donde sí se parte en dos el español es en el periodo ABIERTO («hoy he ido» frente a «hoy fui»): mira la nota de las dos mitades en esta misma lección.\"},{\"id\":\"enb1m1l2e9\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del examen\",\"target\":\"How long have you been living in this flat\",\"translation\":\"¿Cuánto tiempo llevas viviendo en este piso?\",\"distractors\":[\"are\",\"since\"],\"itemIds\":[\"enb1m1howlong\",\"enflat\"],\"tip\":\"Es literalmente una pregunta del Speaking Part 1. Apréndetela entera: la vas a oír.\"},{\"id\":\"enb1m1l2e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Llevo dos horas esperando al casero.\",\"answers\":[\"I have been waiting for the landlord for two hours\",\"I've been waiting for the landlord for two hours\"],\"hint\":\"Duración de una actividad → forma continua del perfecto\",\"itemIds\":[\"enb1m1waitfor\",\"enb1m1landlord\"],\"tip\":\"Dos «for» seguidos y cada uno hace una cosa: el primero va pegado a «wait», el segundo mide el tiempo. No son el mismo «for».\"},{\"id\":\"enb1m1l2e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"I've been working here since March.\",\"translation\":\"Llevo trabajando aquí desde marzo.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I have»\",\"I've been ... here since March\"],\"itemIds\":[\"enb1m1beenworking\"],\"tip\":\"«I've been» se dice casi como «aiv bin», sin acento en ninguna de las tres. Lo que suena fuerte es WORKING. Por eso el perfecto se pierde de oído si no lo esperas.\"},{\"id\":\"enb1m1l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cuánto tiempo llevas viviendo aquí?\",\"answers\":[\"How long have you been living here?\",\"How long have you lived here?\",\"How long have you been here?\"],\"hints\":[\"How long + auxiliar del perfecto + you\",\"How long have you ...\"],\"itemIds\":[\"enb1m1howlong\"],\"tip\":\"Si te sale esta pregunta sin pensarla, la trampa reina del nivel ya no te pilla. Repítela hasta que salga sola.\"},{\"id\":\"enb1m1l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos personas se conocen en el descansillo. Dos escuchas.\",\"audio\":\"So, are you new here?|Not really, no. I've been in the building for about six months, but I was on the second floor before.|Oh, right. I moved in last week, so everything's still in boxes.|Tell me about it. When I moved, it took me a month to unpack.\",\"question\":\"¿Cuánto tiempo lleva cada uno en el edificio?\",\"options\":[\"Ella seis meses, él una semana\",\"Ella una semana, él seis meses\",\"Los dos llevan seis meses\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Al revés: «I've been in the building for about six months» lo dice la primera voz.\",\"El segundo dice «I moved in last week».\"],\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1movedin\"],\"tip\":\"«for about six months» (perfecto, sigue) frente a «I moved in last week» (pasado, punto cerrado). El tiempo verbal te dice quién es quién antes que el contenido.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — Present perfect continuous\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/course/intermediate\",\"note\":\"Busca la unidad de present perfect continuous y hazla entera: es el tiempo verbal nuevo de verdad de este nivel.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\
