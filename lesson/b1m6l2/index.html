c/i\u003e\",\"table\":[[\"estructura\",\"correcto\",\"el calco\"],[\"con modal\",\"…, weil ich arbeiten muss\",\"*…, weil ich muss arbeiten\"],[\"en Perfekt\",\"…, obwohl ich gearbeitet habe\",\"*…, obwohl ich habe gearbeitet\"],[\"con separable\",\"…, weil ich mich anmelde\",\"*…, weil ich melde mich an\"],[\"obwohl vs trotzdem\",\"Trotzdem mache ich weiter.\",\"*Trotzdem ich mache weiter.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l2e1\",\"type\":\"mc\",\"prompt\":\"¿Dónde va el modal?\",\"question\":\"Elige la frase correcta:\",\"options\":[\"Ich komme später, weil ich muss arbeiten.\",\"Ich komme später, weil ich arbeiten muss.\"],\"answer\":1,\"whyWrong\":[\"Ese es el calco exacto del español: el conjugado (muss) tiene que ser el ÚLTIMO\",null],\"itemIds\":[\"b1m6weilarbeitenmuss\"],\"tip\":\"Orden fijo: infinitivo + modal. arbeiten muss, lernen kann, anfangen will.\"},{\"id\":\"b1m6l2e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich komme später, weil ich muss arbeiten.\",\"answers\":[\"Ich komme später, weil ich arbeiten muss.\",\"Ich komme später, weil ich arbeiten muss\"],\"why\":\"En la subordinada, el verbo conjugado (muss) va el último de todos, detrás del infinitivo: weil ich arbeiten muss. Es EL error de calco del nivel B1.\",\"translation\":\"Llego más tarde porque tengo que trabajar.\",\"itemIds\":[\"b1m6weilarbeitenmuss\"]},{\"id\":\"b1m6l2e3\",\"type\":\"errorfix\",\"prompt\":\"Y este otro. Arréglalo.\",\"wrong\":\"Die Prüfung war schwer, obwohl ich habe viel gelernt.\",\"answers\":[\"Die Prüfung war schwer, obwohl ich viel gelernt habe.\",\"Die Prüfung war schwer, obwohl ich viel gelernt habe\"],\"why\":\"En Perfekt dentro de una subordinada, el auxiliar (habe) cierra la frase DETRÁS del participio: obwohl ich viel gelernt habe.\",\"translation\":\"El examen fue difícil aunque estudié mucho.\",\"itemIds\":[\"b1m6obwohlgelernthabe\",\"b1m6obwohl\"]},{\"id\":\"b1m6l2e4\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿subordinada o principal con inversión?\",\"categories\":[\"verbo AL FINAL (subordinada)\",\"INVERSIÓN (verbo 2º)\"],\"items\":[{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"damit\",\"bucket\":0},{\"text\":\"außerdem\",\"bucket\":1},{\"text\":\"falls\",\"bucket\":0},{\"text\":\"danach\",\"bucket\":1}],\"itemIds\":[\"b1m6obwohl\",\"b1m6trotzdem\",\"b1m6damit\",\"b1m6ausserdem\",\"b1m6falls\",\"b1m6danachhabeich\"],\"tip\":\"obwohl/trotzdem significan casi lo mismo y hacen lo contrario. Esa pareja se pregunta en todos los exámenes.\"},{\"id\":\"b1m6l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa el final de la subordinada\",\"text\":\"Ich mache eine Weiterbildung, weil ich mehr verdienen ___.\",\"answers\":[\"will\",\"möchte\"],\"translation\":\"Hago una formación continua porque quiero ganar más.\",\"hints\":[\"El modal cierra la subordinada\",\"verdienen + ...\"],\"itemIds\":[\"b1m6weiterbildung\"]},{\"id\":\"b1m6l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa el final de la subordinada (Perfekt)\",\"text\":\"Sie ist müde, obwohl sie nur vier Stunden gearbeitet ___.\",\"answers\":[\"hat\"],\"translation\":\"Está cansada aunque solo ha trabajado cuatro horas.\",\"hints\":[\"El auxiliar va DETRÁS del participio\",\"gearbeitet + ...\"],\"itemIds\":[\"b1m6obwohlgelernthabe\",\"b1m2teilzeit\"]},{\"id\":\"b1m6l2e7\",\"type\":\"build\",\"prompt\":\"Construye la frase con modal\",\"target\":\"Ich arbeite in Teilzeit, weil ich mein Kind betreuen muss\",\"altTargets\":[\"Weil ich mein Kind betreuen muss, arbeite ich in Teilzeit\"],\"translation\":\"Trabajo a tiempo parcial porque tengo que cuidar a mi hijo\",\"distractors\":[\"deshalb\",\"habe\"],\"itemIds\":[\"b1m2teilzeit\",\"b1m6betreuung\",\"b1m6weilarbeitenmuss\"]},{\"id\":\"b1m6l2e8\",\"type\":\"transform\",\"prompt\":\"Transforma: de dos frases a una subordinada\",\"source\":\"Ich lerne abends. Ich muss tagsüber arbeiten.\",\"instruction\":\"Únelas con weil\",\"answers\":[\"Ich lerne abends, weil ich tagsüber arbeiten muss\",\"Ich lerne abends, weil ich tagsüber arbeiten muss.\"],\"translation\":\"Estudio por las noches porque de día tengo que trabajar.\",\"hints\":[\"El modal, el último de todos\",\"Ich lerne abends, weil ich tagsüber ...\"],\"itemIds\":[\"b1m6weilarbeitenmuss\"]},{\"id\":\"b1m6l2e9\",\"type\":\"transform\",\"prompt\":\"Transforma: la pareja obwohl / trotzdem\",\"source\":\"Obwohl der Kurs teuer ist, mache ich weiter.\",\"instruction\":\"Dilo con trotzdem (dos frases)\",\"answers\":[\"Der Kurs ist teuer. Trotzdem mache ich weiter\",\"Der Kurs ist teuer. Trotzdem mache ich weiter.\",\"Der Kurs ist teuer, trotzdem mache ich weiter\"],\"translation\":\"El curso es caro. Aun así sigo.\",\"hints\":[\"trotzdem abre → verbo inmediatamente detrás\",\"Der Kurs ist teuer. Trotzdem ...\"],\"itemIds\":[\"b1m6trotzdem\",\"b1m6obwohl\",\"b1m6gebuehr\"],\"tip\":\"Mismo mensaje, dos sintaxis. Poder elegir entre las dos es lo que sube «Strukturen: Spektrum».\"},{\"id\":\"b1m6l2e10\",\"type\":\"gapbank\",\"prompt\":\"Completa con el banco de conectores\",\"text\":\"Ich mache eine Ausbildung, ___ ich einen Beruf lernen will. Die Bezahlung ist am Anfang niedrig. ___ bin ich zufrieden. ___ ich abends müde bin, lerne ich weiter.\",\"answers\":[\"weil\",\"Trotzdem\",\"Obwohl\"],\"bank\":[\"weil\",\"Trotzdem\",\"Obwohl\",\"denn\",\"dass\",\"wegen\"],\"translation\":\"Hago una formación porque quiero aprender un oficio. La paga es baja al principio. Aun así estoy contento. Aunque por las noches estoy cansado, sigo estudiando.\",\"itemIds\":[\"b1m6obwohl\",\"b1m6trotzdem\",\"b1m6weilarbeitenmuss\"],\"tip\":\"Fíjate en el verbo de cada hueco: donde hay inversión (bin, lerne) entra un adverbio; donde el verbo está al final, un subordinante. Y trotzdem necesita algo que contradecir: por eso va detrás de «la paga es baja», no detrás del motivo.\"},{\"id\":\"b1m6l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Aunque he estudiado mucho, tengo miedo del examen\",\"answers\":[\"Obwohl ich viel gelernt habe, habe ich Angst vor der Prüfung\",\"Obwohl ich viel gelernt habe, habe ich Angst vor der Prüfung.\"],\"hints\":[\"Subordinada antepuesta: gelernt habe, y la principal empieza por el verbo\",\"Obwohl ich viel gelernt habe, habe ich ...\"],\"itemIds\":[\"b1m6obwohlgelernthabe\",\"b1m6bestanden\"],\"tip\":\"Dos «habe» seguidos suenan raro y son correctos: uno cierra la subordinada, el otro abre la principal. Si te salió, dominas la pila.\"},{\"id\":\"b1m6l2e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · mensaje de contestador · tarea 1 de 2. Lee la afirmación, dale al play y marca Richtig o Falsch. El Teil 1 se oye DOS veces.\",\"audio\":\"Guten Tag, hier ist die Kita Sonnenblume. Ich rufe wegen Ihrer Anfrage an, wegen des Krippenplatzes. Also: Ab September hätten wir einen Platz frei, allerdings nur vormittags, von acht bis eins. Ganztags, da wird erst im Januar was frei, tut mir leid. Wenn Sie den Platz möchten, sagen Sie uns bitte bis Freitag Bescheid, weil wir die Liste dann weitergeben müssen.\",\"question\":\"„Ab September gibt es einen Ganztagsplatz.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«allerdings nur vormittags»; la jornada completa no se libera hasta enero\",null],\"itemIds\":[\"b1m6krippenplatz\",\"b1m6kita\"],\"tip\":\"«allerdings» avisa de que llega la pega. En los mensajes del Teil 1 la pega ES la respuesta.\"},{\"id\":\"b1m6l2e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas, y fíjate en la última frase.\",\"audio\":\"Guten Tag, hier ist die Kita Sonnenblume. Ich rufe wegen Ihrer Anfrage an, wegen des Krippenplatzes. Also: Ab September hätten wir einen Platz frei, allerdings nur vormittags, von acht bis eins. Ganztags, da wird erst im Januar was frei, tut mir leid. Wenn Sie den Platz möchten, sagen Sie uns bitte bis Freitag Bescheid, weil wir die Liste dann weitergeben müssen.\",\"question\":\"¿Por qué hay que contestar antes del viernes?\",\"options\":[\"Porque ese día tienen que pasar la lista\",\"Porque el viernes cierra la guardería\",\"Porque el precio sube el sábado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De cerrar no dice nada\",\"De dinero no se habla en ningún momento\"],\"itemIds\":[\"b1m6weilarbeitenmuss\",\"b1m6betreuung\"],\"tip\":\"«…, weil wir die Liste dann weitergeben müssen»: subordinada con modal a velocidad normal. Es la pila de verbos de esta lección, y en el audio se te echa encima en medio segundo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m6-1\",\"book\":\"Du schaffst das!\",\"real\":\"Das packst du!\",\"meaning\":\"¡Tú puedes con eso!\",\"when\":\"Antes de un examen, una entrevista o el primer día de curso, con amigos y compañeros de curso. Con el profesor, con el jefe o en un mail, no: ahí la fila de examen, y con Sie.\",\"register\":\"amigos\",\"exam\":\"Ich bin sicher, dass Sie das schaffen.\",\"note\":\"packen = agarrar. La imagen alemana del ánimo es física: agarrar el problema con la mano.\",\"sound\":\"das PAKST du\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m6natpackstdu\"}}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (B1)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «Nebensatz»: ejercicios con modal y Perfekt dentro de la subordinada, justo la pila de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:
