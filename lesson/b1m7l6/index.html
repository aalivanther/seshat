\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T920,"])</script><script>self.__next_f.push([1,"Ich bin in Wien geboren, aber [[erst|solo entonces, no antes]] als Erwachsene habe ich verstanden, wie viele Feste in einen einzigen Winter passen.\u003cbr/\u003e\u003cbr/\u003eAlles beginnt am Abend des fünften Dezembers. Ich höre Glocken auf der Gasse*, gehe zum Fenster und sehe eine Gruppe verkleideter Männer mit Hörnern und langen Ruten: die Krampusse. Sie laufen hinter den Kindern her, die [[kreischen|chillan]] und trotzdem nicht weggehen. Meine Nachbarin steht auf der Stiege* und lacht: „Heuer* sind es mehr als im letzten Jahr.“ Am nächsten Morgen liegt in jedem Schuh ein kleines Sackerl* mit Nüssen.\u003cbr/\u003e\u003cbr/\u003eZwischen dem Krampus und Weihnachten liegt der Adventmarkt. Wegen des Wetters trinken alle Punsch, und wegen des Punsches wird der Markt jedes Jahr lauter. Touristen glauben oft, ein Adventmarkt sei vor allem ein Ort zum Einkaufen. Für uns ist er ein Ort zum Stehenbleiben: Man trifft Leute, die man ein Jahr lang nicht gesehen hat, und bleibt eine Stunde in der Kälte stehen, obwohl man eigentlich keine Zeit hat.\u003cbr/\u003e\u003cbr/\u003eDer [[Höhepunkt|el punto culminante]] kommt in der Nacht auf den ersten Jänner*. Um Mitternacht läutet die Pummerin, die große Glocke des Stephansdoms, im Radio und im Fernsehen. Danach tanzen tausende Menschen auf der Straße Walzer — auch die, die nie Walzer gelernt haben. Ein großes Feuerwerk der Stadt gibt es seit einigen Jahren nicht mehr; trotz des Verbots knallt es in jeder Gasse.\u003cbr/\u003e\u003cbr/\u003eIch habe schon in Berlin und in Zürich gefeiert, und der Unterschied ist nicht die Lautstärke, sondern die Rolle der [[Wiederholung|repetición]]. In Wien ist ein Fest nicht ein Abend, sondern eine Wiederholung: dieselben Lieder, dieselben Sätze, dieselbe Nachbarin auf derselben Stiege. Freunde aus dem Ausland fragen mich manchmal, ob uns das nicht [[langweilt|aburre]]. Ich antworte immer dasselbe: Genau das ist der Punkt. Ein Brauch, den man jedes Jahr wiederholt, wird zu einem Kalender, den man nicht aufschreiben muss.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003e*Gasse = callejón, calle estrecha — la palabra existe en todo el alemán; lo austriaco es que en Viena casi cualquier calle pequeña se llame Gasse y no Straße · *Stiege = österr./süddt. für „Treppe“ · *heuer = österr./süddt. für „dieses Jahr“ · *Sackerl = österr. für „Tüte“ · *Jänner = österr. für „Januar“\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m7l6\",\"phaseId\":\"b1m7\",\"title\":\"Lesen: ein Winter in Wien\",\"subtitle\":\"Lectura larga austriaca — con nota al pie, como en el examen\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Austria escribe distinto: seis palabras del texto\",\"itemIds\":[\"b1m7feheuer\",\"b1m7fejaenner\",\"b1m7festiege\",\"b1m7fesackerl\",\"b1m7fekrampus\",\"b1m7fepunsch\",\"b1m7feadventmarkt\",\"b1m7fefeuerwerk\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: el examen es plurizéntrico\",\"body\":\"Los textos del Goethe-Zertifikat B1 «vienen de distintos medios en lengua alemana»: hay correos desde Viena y anuncios desde Zúrich. Cuando aparece una palabra que solo se usa en Austria o en Suiza, el examen \u003cb\u003eno la esconde\u003c/b\u003e: la marca con un asterisco y la explica a pie de página, exactamente así:\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003e*Stiege = österr. für „Treppe“\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEso significa dos cosas para ti. Primera: \u003cb\u003eno te asustes\u003c/b\u003e — la palabra rara del texto casi siempre está explicada abajo, y perder tiempo adivinándola es perder puntos en otro Teil. Segunda: \u003cb\u003elee siempre las notas al pie antes del texto\u003c/b\u003e, no después: son parte de la tarea, no un adorno.\u003cbr/\u003e\u003cbr/\u003eEl texto que viene es un blog vienés. Lleva cinco austriacismos marcados. Y lleva algo más útil todavía: está escrito con el genitivo y los participios de este módulo — \u003ci\u003eam Abend des fünften Dezembers\u003c/i\u003e, \u003ci\u003eeine Gruppe verkleideter Männer\u003c/i\u003e, \u003ci\u003etrotz des Verbots\u003c/i\u003e. Búscalos mientras lees.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l6e1\",\"type\":\"read\",\"prompt\":\"Lee el blog y responde. Las notas al pie están al final del texto: léelas primero.\",\"title\":\"Ein Winter in Wien — vom Krampus bis zum Feuerwerk\",\"source\":\"Blog „Servus, Wien!“, geschrieben von einer Wienerin — leicht gekürzt. Österreichisches Deutsch.\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m7l6e1q1\",\"q\":\"Was passiert am Abend des fünften Dezembers?\",\"options\":[\"Verkleidete Männer laufen durch die Straßen.\",\"Die große Glocke des Doms läutet.\",\"Die Familie backt Kekse für den Markt.\"],\"answer\":0,\"why\":\"«eine Gruppe verkleideter Männer mit Hörnern und langen Ruten: die Krampusse».\"},{\"id\":\"b1m7l6e1q2\",\"q\":\"Was meint die Autorin, wenn sie den Adventmarkt „einen Ort zum Stehenbleiben“ nennt?\",\"options\":[\"Dass man dort besonders langsam einkauft.\",\"Dass es dort weniger ums Einkaufen als ums Treffen von Leuten geht.\",\"Dass es dort keine Sitzplätze gibt.\"],\"answer\":1,\"inference\":true,\"why\":\"Lo contrapone a lo que creen los turistas: «Für uns ist er ein Ort zum Stehenbleiben: Man trifft Leute …». No lo dice con esas palabras: hay que deducirlo.\"},{\"id\":\"b1m7l6e1q3\",\"q\":\"Warum knallt es in der Silvesternacht trotzdem in jeder Gasse?\",\"options\":[\"Weil die Stadt ein großes Feuerwerk organisiert.\",\"Weil die Leute das Verbot nicht beachten.\",\"Weil die Pummerin so laut ist.\"],\"answer\":1,\"why\":\"«Ein großes Feuerwerk der Stadt gibt es seit einigen Jahren nicht mehr; trotz des Verbots knallt es in jeder Gasse.»\"},{\"id\":\"b1m7l6e1q4\",\"q\":\"Wie steht die Autorin zur Wiederholung der Feste?\",\"options\":[\"Sie findet sie langweilig, sagt es aber nicht direkt.\",\"Sie hält gerade die Wiederholung für das Wichtigste.\",\"Sie wünscht sich jedes Jahr etwas Neues.\"],\"answer\":1,\"inference\":true,\"why\":\"«Genau das ist der Punkt» + la imagen final del calendario que no hace falta apuntar. Su postura está implícita, nunca declarada.\"},{\"id\":\"b1m7l6e1q5\",\"q\":\"Für wen ist dieser Text am ehesten geschrieben?\",\"options\":[\"Für Leser, die Wien nicht kennen und die Feste verstehen möchten.\",\"Für Touristen, die den kürzesten Weg zum Adventmarkt suchen.\",\"Für Historiker, die die Herkunft des Krampus erforschen.\"],\"answer\":0,\"inference\":true,\"why\":\"Explica lo evidente para un vienés («Für uns ist er …», las notas al pie) y compara con Berlín y Zúrich: escribe para quien viene de fuera.\"}],\"itemIds\":[\"b1m7fekrampus\",\"b1m7feadventmarkt\",\"b1m7fepunsch\",\"b1m7fejaenner\",\"b1m7festiege\"],\"tip\":\"Fíjate en cuántas veces aparece el genitivo: des fünften Dezembers, des Wetters, des Punsches, des Stephansdoms, trotz des Verbots. Un texto B1 real está hecho de esto.\"},{\"id\":\"b1m7l6e2\",\"type\":\"mc\",\"prompt\":\"Nota al pie\",\"question\":\"„Heuer sind es mehr als im letzten Jahr.“ — ¿Qué significa «heuer»?\",\"options\":[\"este año\",\"el año pasado\",\"el año que viene\"],\"answer\":0,\"whyWrong\":[null,\"«el año pasado» es letztes Jahr — y el texto lo usa justo al lado para comparar\",\"«el año que viene» sería nächstes Jahr\"],\"itemIds\":[\"b1m7feheuer\"],\"tip\":\"heuer se usa en Austria, Baviera y Suiza. En Hamburgo te mirarían raro: allí es «dieses Jahr».\"},{\"id\":\"b1m7l6e3\",\"type\":\"match\",\"prompt\":\"Austriaco ↔ alemán estándar\",\"pairs\":[{\"target\":\"die Stiege\",\"source\":\"die Treppe (la escalera)\"},{\"target\":\"das Sackerl\",\"source\":\"die Tüte (la bolsa)\"},{\"target\":\"der Jänner\",\"source\":\"der Januar (enero)\"},{\"target\":\"die Gasse\",\"source\":\"die (kleine) Straße — en Viena, cualquier calle pequeña\"}],\"itemIds\":[\"b1m7festiege\",\"b1m7fesackerl\",\"b1m7fejaenner\"],\"tip\":\"Estas cuatro salen en textos reales del examen. Reconocerlas te ahorra medio minuto en el Lesen Teil 1. Matiz: Gasse no es exclusiva de Austria (en todas partes es «callejón»); lo austriaco es usarla para calles normales, donde en Alemania se diría Straße.\"},{\"id\":\"b1m7l6e4\",\"type\":\"bucket\",\"prompt\":\"¿Dónde lo oirías?\",\"categories\":[\"österreichisch\",\"deutschländisch\"],\"items\":[{\"text\":\"der Jänner\",\"bucket\":0},{\"text\":\"der Januar\",\"bucket\":1},{\"text\":\"das Sackerl\",\"bucket\":0},{\"text\":\"die Tüte\",\"bucket\":1},{\"text\":\"der Adventmarkt\",\"bucket\":0},{\"text\":\"der Weihnachtsmarkt\",\"bucket\":1}],\"itemIds\":[\"b1m7fejaenner\",\"b1m7fesackerl\",\"b1m7feadventmarkt\"],\"tip\":\"Ninguna de las dos columnas es «mejor alemán»: son dos estándares nacionales. El examen las trata como iguales.\"},{\"id\":\"b1m7l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase del texto\",\"text\":\"Am Abend ___ fünften Dezembers kommen die Krampusse.\",\"answers\":[\"des\"],\"translation\":\"La tarde del cinco de diciembre llegan los Krampusse.\",\"hints\":[\"Genitivo masculino\",\"d-e-s\"],\"itemIds\":[\"b1m7fekrampus\"]},{\"id\":\"b1m7l6e6\",\"type\":\"mc\",\"prompt\":\"Inferencia — el tono de la autora\",\"question\":\"„Man trifft Leute, die man ein Jahr lang nicht gesehen hat, und bleibt eine Stunde in der Kälte stehen, obwohl man eigentlich keine Zeit hat.“\",\"options\":[\"Le molesta perder ese tiempo\",\"Lo cuenta con cariño: ese tiempo perdido es parte de la fiesta\",\"Está describiendo una obligación oficial\"],\"answer\":1,\"whyWrong\":[\"Si le molestara no diría «Für uns ist er ein Ort zum Stehenbleiben»\",null,\"Nadie la obliga: es una costumbre, no una norma\"],\"itemIds\":[\"b1m7febrauch\"],\"tip\":\"En el Lesen Teil 4 casi nunca se dice «me gusta» o «no me gusta». La postura se deduce de los detalles que la persona elige contar.\"},{\"id\":\"b1m7l6e7\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye tres genitivos del texto\",\"text\":\"Wegen ___ Wetters trinken alle Punsch. Die große Glocke ___ Stephansdoms läutet um Mitternacht. Trotz ___ Verbots knallt es in jeder Gasse.\",\"answers\":[\"des\",\"des\",\"des\"],\"bank\":[\"des\",\"der\",\"dem\",\"den\"],\"translation\":\"Por el tiempo todos beben ponche. La gran campana de la catedral de San Esteban suena a medianoche. A pesar de la prohibición se lanzan petardos en cada calle.\",\"itemIds\":[\"b1m7fewegen\",\"b1m7fetrotz\",\"b1m7fepunsch\"],\"tip\":\"das Wetter, der Dom, das Verbot: masculino y neutro comparten des. Tres veces la misma casilla en un solo párrafo — así de frecuente es.\"},{\"id\":\"b1m7l6e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el genitivo del texto\",\"wrong\":\"Die große Glocke des Stephansdom läutet um Mitternacht.\",\"answers\":[\"Die große Glocke des Stephansdoms läutet um Mitternacht.\"],\"why\":\"El sustantivo masculino en genitivo también lleva su -s: des Stephansdoms. El artículo solo no basta.\",\"translation\":\"La gran campana de la catedral de San Esteban suena a medianoche.\",\"itemIds\":[\"b1m7fetradition\"]},{\"id\":\"b1m7l6e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe (austriacismo incluido)\",\"text\":\"Heuer sind es mehr als im letzten Jahr.\",\"translation\":\"Este año son más que el año pasado.\",\"hints\":[\"Empieza por Heuer ...\",\"mehr als im letzten Jahr\"],\"itemIds\":[\"b1m7feheuer\"]},{\"id\":\"b1m7l6e10\",\"type\":\"transform\",\"prompt\":\"Convierte el austriacismo\",\"source\":\"Heuer feiern wir im Jänner.\",\"instruction\":\"Reescríbelo en alemán estándar de Alemania\",\"answers\":[\"Dieses Jahr feiern wir im Januar.\",\"Dieses Jahr feiern wir im Januar\"],\"translation\":\"Este año celebramos en enero.\",\"hints\":[\"heuer → dieses Jahr\",\"Jänner → Januar\"],\"itemIds\":[\"b1m7feheuer\",\"b1m7fejaenner\"],\"tip\":\"Saber traducir entre los dos estándares es exactamente lo que te pide un examen desarrollado por el Goethe, el ÖSD y Friburgo a la vez.\"},{\"id\":\"b1m7l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción — resume el texto en una frase\",\"question\":\"A pesar de la prohibición se lanzan petardos en cada calle\",\"answers\":[\"Trotz des Verbots knallt es in jeder Gasse\",\"Trotz des Verbots knallt es in jeder Gasse.\",\"Trotz des Verbots knallt es in jeder Straße\"],\"hints\":[\"Trotz + genitivo neutro: des Verbots\",\"knallt es in jeder Gasse\"],\"itemIds\":[\"b1m7fetrotz\",\"b1m7fefeuerwerk\"],\"tip\":\"Una frase del texto, reproducida de memoria. Copiar bien estructuras leídas es la forma más barata de subir «Spektrum».\"}]}],\"resources\":[{\"label\":\"ÖSD — Modellsätze B1 (österreichisches Deutsch)\",\"url\":\"https://www.osd.at/\",\"note\":\"El mismo examen que el Goethe B1, con textos austriacos. Descarga un Modellsatz y busca las notas al pie.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
