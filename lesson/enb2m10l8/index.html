go, no el instante\",\"text\":\"She did not go back. In the years that ___, the ticket stayed in the drawer.\",\"answers\":[\"followed\"],\"translation\":\"No volvió. En los años que siguieron, la entrada se quedó en el cajón.\",\"itemIds\":[\"enb2m10intheyearsthatfollowed\"]},{\"id\":\"enb2m10l8e3\",\"type\":\"gapbank\",\"prompt\":\"Cose el cierre de un relato. Cuidado con eventually: no está en el banco a propósito\",\"text\":\"___ that point Ade opened the door. ___ it all, the show was about the length of time a person can look. Looking ___, Nora still has the ticket. In the ___, she went back the next week.\",\"answers\":[\"At\",\"Beneath\",\"back\",\"end\"],\"bank\":[\"At\",\"Beneath\",\"back\",\"end\",\"On\",\"Above\",\"start\",\"side\"],\"translation\":\"En ese momento Ade abrió la puerta. Debajo de todo, la exposición iba del tiempo que una persona puede mirar. Mirando atrás, Nora sigue teniendo la entrada. Al final, volvió la semana siguiente.\",\"itemIds\":[\"enb2m10atthatpoint\",\"enb2m10beneathitall\",\"enb1m1lookback\",\"ena2m2intheend\"]},{\"id\":\"enb2m10l8e4\",\"type\":\"errorfix\",\"prompt\":\"Un solo error: eventually donde iba in the end\",\"wrong\":\"At the end, she recognised the platform.\",\"answers\":[\"In the end, she recognised the platform.\",\"In the end she recognised the platform.\"],\"why\":\"Eventually es «al cabo de un tiempo / tras varias tentativas». Aquí no ha habido tentativas: ha habido un reconocimiento. In the end es cómo acabó la cosa.\",\"translation\":\"Al final reconoció el andén.\",\"itemIds\":[\"ena2m2intheend\"]},{\"id\":\"enb2m10l8e5\",\"type\":\"write\",\"prompt\":\"Descripción de 150-200. Un sitio, los sentidos, una evaluación. No es un inventario.\",\"scenario\":\"La revista del barrio pide una descripción, no un relato: «Describe a room that made an impression on you, and say why you still think about it.» 150-200 palabras. Lector: gente del barrio que igual no ha entrado.\",\"genre\":\"story\",\"register\":\"direct\",\"bullets\":[\"Describe la sala con al menos dos sentidos (vista, oído, frío, olor), no con una lista de muebles.\",\"Di qué había «de debajo» (quién la usaba, qué había pasado antes, por qué estaba así).\",\"Cierra con una evaluación en molde I found it… o looking back…, no con «was very nice».\"],\"checks\":[{\"re\":\"(light|lighting|quiet|cold|smell|sound|silence|floor|window)\",\"label\":\"Hay al menos un sentido concreto\"},{\"re\":\"(had (been)?|who had|which she had|in the years)\",\"label\":\"Hay una capa de fondo (past perfect o relativa)\"},{\"re\":\"(I found it|looking back|profoundly|beneath)\",\"label\":\"Hay evaluación de B2, no very nice\"}],\"frame\":[\"Párrafo 1 — entrar: qué se ve / se oye\",\"Párrafo 2 — el fondo: who had been… / in the years that followed…\",\"Párrafo 3 — I found it… / looking back…\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"looking back\",\"at that point\",\"beneath it all\",\"although\",\"in the end\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"The small room at the back of the Palmer Road Gallery holds one photograph and a bench. The lighting is winter light, even in June, and the silence is the kind that makes you hear your own coat. I had been walking around the noisy installation for ten minutes, which had been going on in my ears the way stacked chairs do, when Ade opened the door and said quietly that this one was different.\\nBeneath it all the room is not about photography. It is about the woman on the platform, who had been waiting in a coat that still exists, and about Nora, who had kept a ticket from that station for forty years. At that point I stopped reading the caption. There was nothing on it worth the looking.\\nLooking back, I found it profoundly moving, although I could not have said why until Nora nodded. In the years that followed she went back. I did too.\",\"itemIds\":[\"enb2m10adescriptivecomposition\",\"enb2m10thelighting\",\"enb2m10beneathitall\",\"enb2m10profoundlymoving\",\"enb2m10intheyearsthatfollowed\"],\"tip\":\"Tres párrafos, dos sentidos (luz, silencio, el abrigo), un fondo con had, una evaluación con found it. Si te sale un inventario (there was a bench, there was a wall), es A2.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
