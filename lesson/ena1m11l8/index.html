o en el examen\",\"body\":\"Las invitaciones escritas caen en el Reading del examen: busca el DATO (día, hora, sitio, qué te piden). Lee la tarjeta dos veces y responde abajo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePARTY!\u003c/b\u003e\u003cbr/\u003eCome to my birthday party!\u003cbr/\u003eSaturday 21st June, 7 o'clock.\u003cbr/\u003e15 York Road ([[next to|al lado de]] the park).\u003cbr/\u003eBring a friend! Please reply [[by|para (como muy tarde)]] Friday.\u003cbr/\u003e— Nora\u003cbr/\u003e\u003cbr/\u003eY al final, tu email de examen: \u003cb\u003etres funciones\u003c/b\u003e (invitar + informar + pedir) en 30-50 palabras — el Writing completo, por primera vez.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m11l8e1\",\"type\":\"mc\",\"prompt\":\"La tarjeta, dato 1\",\"question\":\"¿Cuándo es la fiesta de Nora?\",\"options\":[\"El sábado 21 de junio\",\"El viernes 21 de junio\",\"El sábado 12 de junio\"],\"answer\":0,\"whyWrong\":[null,\"Friday es la fecha límite para RESPONDER, no la fiesta\",\"21st = twenty-first — el 12 sería 12th (twelfth)\"],\"itemIds\":[\"enjune\",\"enpleaseanswer\"],\"tip\":\"En la tarjeta hay DOS fechas: la de la fiesta y la de responder. El examen cuenta con que las mezcles.\"},{\"id\":\"ena1m11l8e2\",\"type\":\"mc\",\"prompt\":\"La tarjeta, dato 2\",\"question\":\"Según la tarjeta, ¿qué puedes llevar a la fiesta?\",\"options\":[\"A un amigo\",\"Una tarta\",\"Nada — está prohibido llevar cosas\"],\"answer\":0,\"whyWrong\":[null,\"cake no aparece en la tarjeta\",\"Bring a friend! te invita a llevar compañía, no lo prohíbe\"],\"itemIds\":[\"enbringafriend\"],\"tip\":\"bring = traer/llevar hacia donde está quien habla. Bring a friend: la fiesta crece.\"},{\"id\":\"ena1m11l8e3\",\"type\":\"mc\",\"prompt\":\"La tarjeta, dato 3\",\"question\":\"«Please reply by Friday» — ¿qué te pide Nora?\",\"options\":[\"Que le contestes como muy tarde el viernes\",\"Que llegues como muy tarde el viernes\",\"Que la llames el viernes\"],\"answer\":0,\"whyWrong\":[null,\"reply = contestar, no llegar\",\"call no aparece — dice reply, por escrito\"],\"itemIds\":[\"enpleaseanswer\"],\"tip\":\"El RSVP británico: reply by + día. Si lo ves en una invitación real, ya sabes qué hacer.\"},{\"id\":\"ena1m11l8e4\",\"type\":\"match\",\"prompt\":\"Empareja las piezas de la invitación\",\"pairs\":[{\"target\":\"invite\",\"source\":\"invitar\"},{\"target\":\"Bring a friend!\",\"source\":\"¡Trae a un amigo!\"},{\"target\":\"See you there!\",\"source\":\"¡Nos vemos allí!\"},{\"target\":\"by Friday\",\"source\":\"para el viernes\"}],\"itemIds\":[\"eninvite\",\"enbringafriend\",\"enseeyouthere\",\"enpleaseanswer\"]},{\"id\":\"ena1m11l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa la respuesta de Valeria\",\"text\":\"Thank you for the ___! I'd love to come.\",\"answers\":[\"invitation\"],\"translation\":\"¡Gracias por la invitación! Me encantaría ir.\",\"hints\":[\"Lo que Nora te ha enviado\",\"the i-n-v-i-t-a-t-i-o-n\"],\"itemIds\":[\"eninvitation\",\"enidloveto\"]},{\"id\":\"ena1m11l8e6\",\"type\":\"order\",\"prompt\":\"Ordena el email de respuesta de Valeria\",\"sentences\":[\"Dear Nora, thank you for the invitation!\",\"I'd love to come to your party on Saturday.\",\"Can I bring my flatmate Amy?\",\"See you there! Valeria\"],\"translation\":\"Querida Nora: ¡gracias por la invitación! Me encantaría ir a tu fiesta el sábado. ¿Puedo llevar a mi compañera de piso, Amy? ¡Nos vemos allí! Valeria\",\"hints\":[\"Saludo y gracias → el sí → la pregunta → la despedida\",\"Dear… abre, See you there! cierra\"],\"itemIds\":[\"eninvitation\",\"enidloveto\",\"enflatmate\",\"enseeyouthere\"],\"tip\":\"Saludo → contenido → despedida: el esqueleto de TODO email del examen. Apréndete el orden, cambia el relleno.\"},{\"id\":\"ena1m11l8e7\",\"type\":\"transform\",\"prompt\":\"Vacuna: el to que se cae\",\"source\":\"I want come to your party.\",\"instruction\":\"Corrígela — a want le falta algo\",\"answers\":[\"I want to come to your party.\",\"I want to come to your party\"],\"translation\":\"Quiero ir a tu fiesta.\",\"hints\":[\"want + TO + verbo, siempre\",\"I want TO come…\"],\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"En el Writing esta errata cuesta puntos de gramática: want to, como un bloque soldado.\"},{\"id\":\"ena1m11l8e8\",\"type\":\"build\",\"prompt\":\"Construye la línea estrella de tu invitación\",\"target\":\"Bring a friend to my party\",\"translation\":\"Trae a un amigo a mi fiesta\",\"distractors\":[\"brings\",\"for\"],\"itemIds\":[\"enbringafriend\"],\"tip\":\"Imperativo: verbo desnudo delante (Bring…). Y «a mi fiesta» = to my party, no for.\"},{\"id\":\"ena1m11l8e10\",\"type\":\"read\",\"prompt\":\"Lee el texto y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Ten cards and one bus\",\"text\":\"Nora is [[eighty|ochenta]] on the 21st of June, and she wants a party in her garden. She writes ten cards: one for Valeria, one for Amy, one for Ben, one for Sam and six for her old friends.\u003cbr/\u003e\u003cbr/\u003eOn Friday, nine people reply: \\\"I'd love to!\\\" Only Ben doesn't answer. Nora is a little [[sad|triste]]: Ben always says yes.\u003cbr/\u003e\u003cbr/\u003eOn Saturday at seven the garden is full of people, cake and music. At half past seven the [[bell|el timbre]] rings. It's Ben — with his bus and twelve more friends from York Road.\u003cbr/\u003e\u003cbr/\u003e\\\"Sorry I'm late,\\\" he says. \\\"I don't reply to cards. I bring people.\\\"\",\"questions\":[{\"id\":\"ena1m11l8e10q1\",\"q\":\"When is Nora's party?\",\"options\":[\"On Saturday at seven\",\"On Friday at seven\",\"On the 21st of July\"],\"answer\":0,\"why\":\"«On Saturday at seven the garden is full of people». El viernes es el día de las respuestas.\"},{\"id\":\"ena1m11l8e10q2\",\"q\":\"How many cards does Nora write?\",\"options\":[\"Ten\",\"Nine\",\"Six\"],\"answer\":0,\"why\":\"«She writes ten cards» — cuatro para sus amigos jóvenes y seis para los de siempre.\"},{\"id\":\"ena1m11l8e10q3\",\"q\":\"On Friday, how many people are coming to the party?\",\"options\":[\"Nine\",\"Ten\",\"Twelve\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no lo dice: escribe diez cartas y contestan nueve. La cuenta la haces tú.\"},{\"id\":\"ena1m11l8e10q4\",\"q\":\"What does Ben's last sentence tell us about him?\",\"options\":[\"He isn't good with cards, but he is good with people.\",\"He doesn't want to go to Nora's party.\",\"He wants Nora to write him an email.\"],\"answer\":0,\"inference\":true,\"why\":\"«I don't reply to cards. I bring people» — no se disculpa por no escribir: cambia el papel por doce invitados.\"},{\"id\":\"ena1m11l8e10q5\",\"q\":\"Who comes with Ben?\",\"options\":[\"Twelve friends from York Road.\",\"Only Amy and Valeria.\",\"Nobody.\"],\"answer\":0,\"why\":\"«with his bus and twelve more friends from York Road».\"}],\"itemIds\":[\"eninvitation\",\"enbirthday\",\"enidloveto\",\"enpleaseanswer\",\"enhappybirthday\"],\"tip\":\"En el Reading del examen, las cifras nunca están juntas: una arriba y otra abajo. Escríbelas al margen y réstalas — así se contesta la pregunta que no está escrita.\"},{\"id\":\"ena1m11l8e9\",\"type\":\"write\",\"prompt\":\"Tu email de examen: tres funciones, 30-50 palabras\",\"scenario\":\"Es tu cumpleaños. Escríbele un email a Ben: invítalo a tu fiesta, dile cuándo y dónde es, y pídele que traiga algo (o a alguien).\",\"bullets\":[\"Invítalo (Do you want to come…? / Can you come…?)\",\"Dile el día y la hora (on Saturday… at seven…)\",\"Pídele que traiga algo con bring (Can you bring…? / Please bring…)\"],\"checks\":[{\"re\":\"(do you want to come|can you come|come to my)\",\"label\":\"la invitación\"},{\"re\":\"(on (monday|tuesday|wednesday|thursday|friday|saturday|sunday)|at (one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|\\\\d))\",\"label\":\"el día y la hora\"},{\"re\":\"bring\",\"label\":\"la petición con bring\"}],\"minWords\":30,\"maxWords\":50,\"model\":\"Dear Ben, it's my birthday on Saturday! Do you want to come to my party? It's at my flat at seven o'clock. Can you bring some music, please? See you on Saturday! Valeria\",\"itemIds\":[\"endoyouwanttocome\",\"enbirthday\",\"eninvite\"],\"tip\":\"Tres funciones + saludo y despedida + 30-50 palabras: este es EL formato del Writing T1. Cuenta tus palabras antes de enviar.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
