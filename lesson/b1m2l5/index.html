milie haben.\"],\"why\":\"Tras «würde» va el infinitivo (haben), nunca «hätte»: mezclar las dos construcciones es error seguro. Y con haben, la forma corta «Ich hätte …» es la natural y la que puntúa.\",\"translation\":\"Tendría más tiempo para mi familia.\",\"itemIds\":[\"b1m2ichhaettezeit\"]},{\"id\":\"b1m2l5e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Wenn ich Zeit hätte, ich würde einen Kurs machen.\",\"answers\":[\"Wenn ich Zeit hätte, würde ich einen Kurs machen.\"],\"why\":\"La subordinada con wenn ocupa la posición 1 de la frase entera, así que la principal tiene que empezar por el VERBO: «…, würde ich …». Poner «ich würde» detrás de la coma es el calco directo del español.\",\"translation\":\"Si tuviera tiempo, haría un curso.\",\"itemIds\":[\"b1m2wennichzeithaette\"]},{\"id\":\"b1m2l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa la condicional\",\"text\":\"Wenn ich flexible Arbeitszeiten ___, würde ich morgens Sport machen.\",\"answers\":[\"hätte\"],\"translation\":\"Si tuviera horarios flexibles, haría deporte por las mañanas.\",\"hints\":[\"haben en Konjunktiv II, con Umlaut\",\"h-ä-t-t-e\"],\"itemIds\":[\"b1m2wennichzeithaette\",\"b1m2flexiblearbeitszeiten\"],\"strictUmlaut\":true,\"tip\":\"Sin la ä, la frase dice «cuando tenía horarios flexibles»: otro tiempo y otro significado. Los dos puntos valen un punto de examen.\"},{\"id\":\"b1m2l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el desahogo del compañero\",\"text\":\"Wenn ich weniger Überstunden machen ___, ___ ich abends Zeit für meine Kinder. Mein Chef ___ das verstehen, aber er fragt nie. An deiner Stelle ___ ich mit ihm sprechen.\",\"answers\":[\"müsste\",\"hätte\",\"könnte\",\"würde\"],\"bank\":[\"müsste\",\"hätte\",\"könnte\",\"würde\",\"musste\",\"hatte\"],\"translation\":\"Si tuviera que hacer menos horas extra, tendría tiempo por las tardes para mis hijos. Mi jefe podría entenderlo, pero nunca pregunta. Yo en tu lugar hablaría con él.\",\"itemIds\":[\"b1m2muesste\",\"b1m2ichhaettezeit\",\"b1m2koennte\",\"b1m2andeinerstelle\"],\"tip\":\"Cuatro Konjunktiv II seguidos y solo el último lleva würde — porque «sprechen» no está en el grupo cerrado. El banco tiene las trampas sin Umlaut a propósito.\"},{\"id\":\"b1m2l5e7\",\"type\":\"transform\",\"prompt\":\"Da un consejo\",\"source\":\"Du musst mit deinem Chef sprechen.\",\"instruction\":\"Conviértelo en consejo con «solltest»\",\"answers\":[\"Du solltest mit deinem Chef sprechen\"],\"translation\":\"Deberías hablar con tu jefe.\",\"hints\":[\"sollen en Konjunktiv II para la 2ª persona\",\"Du sollt... mit deinem Chef sprechen\"],\"itemIds\":[\"b1m2solltest\",\"a2m10chef\"],\"tip\":\"musst = obligación · solltest = consejo. En una conversación, «du musst» suena a orden; «du solltest» suena a amigo.\"},{\"id\":\"b1m2l5e8\",\"type\":\"build\",\"prompt\":\"Construye el consejo elegante\",\"target\":\"An deiner Stelle würde ich das anders machen\",\"altTargets\":[\"Ich würde das an deiner Stelle anders machen\"],\"translation\":\"Yo en tu lugar lo haría de otra manera\",\"distractors\":[\"hätte\",\"ich würde\"],\"itemIds\":[\"b1m2andeinerstelle\"],\"tip\":\"«An deiner Stelle» abre la frase → inversión: würde ich. Es la fórmula de consejo más usada del alemán hablado.\"},{\"id\":\"b1m2l5e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe — atención al Umlaut\",\"text\":\"Wenn ich Zeit hätte, würde ich einen Kurs machen\",\"translation\":\"Si tuviera tiempo, haría un curso\",\"hints\":[\"Subordinada con wenn primero, principal con inversión después\",\"Wenn ich Zeit h..., w... ich ...\"],\"itemIds\":[\"b1m2wennichzeithaette\"],\"strictUmlaut\":true},{\"id\":\"b1m2l5e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «An deiner Stelle»\",\"source\":\"An deiner Stelle würde ich mit dem Chef sprechen.\",\"forbid\":[\"Stelle\",\"deiner\"],\"answers\":[\"Du solltest mit dem Chef sprechen\",\"Du könntest mit dem Chef sprechen\",\"Ich würde mit dem Chef sprechen\"],\"translation\":\"Yo en tu lugar hablaría con el jefe.\",\"hints\":[\"Un consejo directo con «solltest»\",\"Du solltest mit dem Chef ...\"],\"itemIds\":[\"b1m2solltest\",\"b1m2andeinerstelle\"],\"tip\":\"Dos formas de aconsejar, dos niveles de rodeo. Tener las dos disponibles es lo que el examen llama Spektrum.\"},{\"id\":\"b1m2l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Si tuviera horarios flexibles, tendría más tiempo para mi familia\",\"answers\":[\"Wenn ich flexible Arbeitszeiten hätte, hätte ich mehr Zeit für meine Familie\",\"Wenn ich flexible Arbeitszeiten hätte, würde ich mehr Zeit für meine Familie haben\"],\"hints\":[\"hätte en las dos partes: haben nunca va con würde\",\"Wenn ich flexible Arbeitszeiten hätte, hätte ich ...\"],\"itemIds\":[\"b1m2wennichzeithaette\",\"b1m2ichhaettezeit\",\"b1m2flexiblearbeitszeiten\"],\"strictUmlaut\":true,\"tip\":\"Dos «hätte» seguidos suenan raros al oído español y son perfectos en alemán. Si te salió, la trampa nº1 del nivel ya no te pilla.\"},{\"id\":\"b1m2l5e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: una asesora laboral en la radio · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Die Frage kommt in jeder Beratung: «Wenn ich weniger arbeiten würde, hätte ich dann weniger Rente?» Ja, ähm, das stimmt schon — aber viel weniger, als die Leute denken. Was ich immer sage: An Ihrer Stelle würde ich erst mal ein Jahr Teilzeit ausprobieren, bevor Sie kündigen. Zurück in Vollzeit kommen Sie fast immer. Zurück in die alte Firma, na ja, eher nicht.\",\"question\":\"„Wer Teilzeit arbeitet, bekommt laut der Beraterin viel weniger Rente.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Dice lo contrario: «aber viel weniger, als die Leute denken» — la pérdida es menor de lo que se cree\",null],\"itemIds\":[\"b1m2teilzeit\"],\"tip\":\"Cuidado con «viel weniger, als die Leute denken»: la comparación le da la vuelta a la frase entera.\"},{\"id\":\"b1m2l5e13\",\"type\":\"audiomc\",\"prompt\":\"Misma intervención, segunda tarea. Dos escuchas.\",\"audio\":\"Die Frage kommt in jeder Beratung: «Wenn ich weniger arbeiten würde, hätte ich dann weniger Rente?» Ja, ähm, das stimmt schon — aber viel weniger, als die Leute denken. Was ich immer sage: An Ihrer Stelle würde ich erst mal ein Jahr Teilzeit ausprobieren, bevor Sie kündigen. Zurück in Vollzeit kommen Sie fast immer. Zurück in die alte Firma, na ja, eher nicht.\",\"question\":\"¿Qué aconseja la asesora?\",\"options\":[\"Probar un año a media jornada antes de dejar el puesto\",\"Dejar el trabajo cuanto antes\",\"No reducir nunca la jornada por la pensión\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Avisa justo de que volver a la misma empresa es difícil\",\"Dice que la pérdida de pensión es menor de lo que se cree\"],\"itemIds\":[\"b1m2andeinerstelle\",\"b1m2vollzeit\"],\"tip\":\"«An Ihrer Stelle würde ich …» es la fórmula de consejo del B1, y aquí llega hablada y sin pausa.\"}]}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (B1)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «Konjunktiv II»: series enteras de hatte/hätte con corrección inmediata.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 —
