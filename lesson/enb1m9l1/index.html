03een el momento de hablar\u003c/u\u003e, lo que prometes y lo que predices sin pruebas delante. \u003ci\u003eThat looks heavy. I'll give you a hand.\u003c/i\u003e No lo tenías pensado: lo has decidido al ver la maleta.\u003cbr/\u003e· \u003cb\u003egoing to\u003c/b\u003e — lo que \u003cu\u003eya tenías decidido\u003c/u\u003e antes de abrir la boca, y lo que se ve venir \u003cu\u003econ pruebas delante\u003c/u\u003e. \u003ci\u003eI'm going to renew my passport\u003c/i\u003e (lo llevo pensando semanas). \u003ci\u003eLook at those clouds — it's going to rain.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003epresent continuous\u003c/b\u003e — lo que está \u003cu\u003equedado y organizado\u003c/u\u003e: hay hora, hay billete, hay alguien esperándote. \u003ci\u003eWe're flying out on Friday.\u003c/i\u003e Es el futuro de la agenda.\u003cbr/\u003e· \u003cb\u003epresent simple\u003c/b\u003e — \u003cu\u003ehorarios publicados\u003c/u\u003e: trenes, autocares, vuelos, cines, clases. \u003ci\u003eThe coach gets in at half nine.\u003c/i\u003e No es mi plan, es el suyo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la letra pequeña, que es lo que casi ningún manual dice:\u003c/b\u003e las cuatro se solapan. \u003ci\u003eWe fly out on Friday\u003c/i\u003e también se oye, y \u003ci\u003eWe'll fly out on Friday\u003c/i\u003e tampoco es un error. Lo que separa a unas de otras es el \u003cb\u003econtexto\u003c/b\u003e, no una regla mecánica. Por eso en este módulo no vas a ver ningún ejercicio que te diga que \u003ci\u003ewill\u003c/i\u003e está «mal»: vas a ver frases enteras donde el disparador está escrito, y tu trabajo es reconocerlo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde se pierden puntos de verdad\u003c/b\u003e, y son dos sitios:\u003cbr/\u003e1. \u003cb\u003eEl ofrecimiento espontáneo con presente simple:\u003c/b\u003e «te echo una mano» sale como \u003ci\u003eI give you a hand\u003c/i\u003e. En inglés eso significa que se lo echas todos los días. Va \u003cb\u003ewill\u003c/b\u003e, siempre.\u003cbr/\u003e2. \u003cb\u003eEl plan cerrado con \u003ci\u003ewill\u003c/i\u003e:\u003c/b\u003e si ya tienes el billete, \u003ci\u003eI'll go to Belfast on Friday\u003c/i\u003e suena a que lo acabas de decidir mientras hablabas. Va \u003cb\u003eI'm going to Belfast on Friday\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eUn aviso de pronunciación que vale un mark en el Listening: \u003cb\u003e\u003ci\u003egoing to\u003c/i\u003e delante de un verbo suena «gonna»\u003c/b\u003e, y \u003cb\u003edelante de un sitio no\u003c/b\u003e. \u003ci\u003eI'm gonna book it\u003c/i\u003e, sí; \u003ci\u003eI'm going to Belfast\u003c/i\u003e, jamás «gonna Belfast». Eso ya lo traes del A2, pero aquí se te va a caer encima a velocidad de aeropuerto."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l1\",\"phaseId\":\"enb1m9\",\"title\":\"We're flying out on Friday\",\"subtitle\":\"Cuatro maneras de hablar del futuro, y el disparador que elige cada una\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Un futuro por cada situación\",\"itemIds\":[\"enb1m9illgiveyouahand\",\"enb1m9imgoingtorenew\",\"enb1m9wereflyingout\",\"enb1m9thecoachgetsin\",\"enb1m9theyrepredicting\",\"enb1m9imnotgoingtorisk\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el inglés no tiene un futuro, tiene cuatro\",\"body\":\"$17\",\"table\":[[\"Lo que pasa por tu cabeza\",\"El futuro que sale\",\"Ejemplo\"],[\"Lo decido ahora mismo\",\"will\",\"I'll give you a hand.\"],[\"Ya lo tenía decidido\",\"going to\",\"I'm going to renew my passport.\"],[\"Está quedado, con hora\",\"present continuous\",\"We're flying out on Friday.\"],[\"Lo dice un horario\",\"present simple\",\"The coach gets in at half nine.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l1e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro futuros con lo que significan\",\"pairs\":[{\"target\":\"I'll give you a hand with your case.\",\"source\":\"Te echo una mano con la maleta.\"},{\"target\":\"I'm going to renew my passport.\",\"source\":\"Voy a renovar el pasaporte.\"},{\"target\":\"We're flying out on Friday.\",\"source\":\"Salimos en avión el viernes.\"},{\"target\":\"The coach gets in at half nine.\",\"source\":\"El autocar llega a las nueve y media.\"}],\"itemIds\":[\"enb1m9illgiveyouahand\",\"enb1m9imgoingtorenew\",\"enb1m9wereflyingout\",\"enb1m9thecoachgetsin\"],\"tip\":\"Las cuatro hablan de mañana y las cuatro tienen una forma distinta. Léelas otra vez fijándote solo en la parte española: verás que el español las dice casi todas igual. Ahí está el trabajo.\"},{\"id\":\"enb1m9l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — esto ya lo traes puesto desde el A2\",\"pairs\":[{\"target\":\"the coach\",\"source\":\"el autocar\"},{\"target\":\"luggage\",\"source\":\"el equipaje\"},{\"target\":\"a suitcase\",\"source\":\"una maleta\"},{\"target\":\"my passport\",\"source\":\"el pasaporte\"},{\"target\":\"platform four\",\"source\":\"el andén cuatro\"}],\"targetSeconds\":22,\"itemIds\":[\"ena2m6thecoach\",\"ena2m6luggage\",\"ena2m6suitcase\",\"ena2m6passport\",\"ena2m6platformfour\"],\"tip\":\"Cinco palabras del módulo de viaje del A2. El B1 no las cambia: las quiere más rápido y metidas en frases más largas. Y ojo con «luggage», que sigue siendo incontable: nunca «luggages».\"},{\"id\":\"enb1m9l1e3\",\"type\":\"mc\",\"prompt\":\"El ofrecimiento del momento\",\"question\":\"Ves a Nora subiendo la compra por la escalera. ¿Qué le dices?\",\"options\":[\"I'll give you a hand.\",\"I give you a hand.\",\"I'm giving you a hand.\"],\"answer\":0,\"whyWrong\":[null,\"El presente simple habla de costumbres: «te echo una mano todos los días». No es lo que quieres decir.\",\"El presente continuo es para lo que ya estaba quedado. Aquí acabas de verla: no había nada quedado.\"],\"itemIds\":[\"enb1m9illgiveyouahand\"],\"tip\":\"Este es el uso más útil de «will» y el que más se cae en el examen oral: ofrecerse. «I'll carry that», «I'll get the door», «I'll wait». Tres palabras y suena a nativo.\"},{\"id\":\"enb1m9l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Ya estaba decidido, o se decide al hablar?\",\"categories\":[\"Ya estaba decidido o quedado\",\"Se decide o se predice al hablar\"],\"items\":[{\"text\":\"We're flying out on Friday.\",\"bucket\":0},{\"text\":\"I'm going to renew my passport.\",\"bucket\":0},{\"text\":\"That looks heavy. I'll give you a hand.\",\"bucket\":1},{\"text\":\"I'm meeting Amy at six.\",\"bucket\":0},{\"text\":\"Don't worry, I'll wait for you.\",\"bucket\":1},{\"text\":\"I think it'll be quicker by coach.\",\"bucket\":1}],\"itemIds\":[\"enb1m9wereflyingout\",\"enb1m9imgoingtorenew\",\"enb1m9illgiveyouahand\",\"ena2m6weremeetingamyatsix\"],\"tip\":\"Truco: si delante de la frase cabe «ya lo tenía pensado», es la primera columna. Si cabe «pues mira, ahora que lo dices», es la segunda. No falla casi nunca.\"},{\"id\":\"enb1m9l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Falta UNA palabra.\",\"wrong\":\"That looks heavy. I give you a hand.\",\"answers\":[\"That looks heavy. I'll give you a hand.\"],\"why\":\"«I give you a hand» es una costumbre: se la echas siempre. Para un ofrecimiento que nace ahora mismo va «I'll». El español lo dice en presente («te echo una mano») y por eso el calco sale solo.\",\"translation\":\"Eso pesa. Te echo una mano.\",\"itemIds\":[\"enb1m9illgiveyouahand\"]},{\"id\":\"enb1m9l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa con el futuro del horario\",\"text\":\"Don't panic. The coach ___ in at half nine, and the hotel is five minutes away.\",\"answers\":[\"gets\",\"arrives\"],\"translation\":\"No te agobies. El autocar llega a las nueve y media y el hotel está a cinco minutos.\",\"hints\":[\"No es tu plan: es el horario de la compañía\",\"Presente simple, tercera persona\"],\"itemIds\":[\"enb1m9thecoachgetsin\"],\"tip\":\"Los horarios publicados van en presente simple igual que en español («el autocar llega a las nueve y media»). Es el único de los cuatro futuros que el hispanohablante hace bien sin pensarlo — y conviene saber por qué, para no cambiarlo.\"},{\"id\":\"enb1m9l1e7\",\"type\":\"build\",\"prompt\":\"Construye el plan que ya estaba cerrado\",\"target\":\"We are flying out on Friday morning\",\"translation\":\"Salimos en avión el viernes por la mañana\",\"distractors\":[\"will\",\"go\"],\"itemIds\":[\"enb1m9wereflyingout\"],\"tip\":\"Las dos fichas que sobran son las dos salidas fáciles: «will» por traducir «saldremos» y «go» por miedo al continuo. Con billete comprado, el inglés usa el presente continuo.\"},{\"id\":\"enb1m9l1e8\",\"type\":\"transform\",\"prompt\":\"De la intención a la decisión del momento\",\"source\":\"I'm going to help you with that.\",\"instruction\":\"Dilo como si lo acabaras de decidir, con «I'll»\",\"answers\":[\"I'll help you with that\",\"I'll help you with that.\",\"I will help you with that\"],\"translation\":\"Te ayudo con eso.\",\"hints\":[\"Empieza por «I'll…»\",\"I'll ... you with that\"],\"itemIds\":[\"enb1m9illgiveyouahand\"],\"tip\":\"Las dos son correctas y significan cosas distintas: «I'm going to help you» es que ya lo tenías pensado; «I'll help you» es que lo has decidido al verlo. En una conversación, la segunda suena mucho más amable.\"},{\"id\":\"enb1m9l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación en la cocina de Palmer Road\",\"text\":\"«What time ___ you flying out?» «Friday morning. The coach ___ in at half nine, so there's time.» «Right. I ___ give you a hand with the cases, then.»\",\"answers\":[\"are\",\"gets\",\"will\"],\"bank\":[\"are\",\"gets\",\"will\",\"am\",\"is\",\"leaves\",\"going\"],\"translation\":\"«¿A qué hora salís?» «El viernes por la mañana. El autocar llega a las nueve y media, así que da tiempo.» «Vale. Pues te echo una mano con las maletas.»\",\"itemIds\":[\"enb1m9wereflyingout\",\"enb1m9thecoachgetsin\",\"enb1m9illgiveyouahand\"],\"tip\":\"Tres huecos, tres futuros distintos y ni un «will» de más. Fíjate en que el tercero llega después de oír la información: por eso es «will» y no «I'm going to».\"},{\"id\":\"enb1m9l1e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"No me la voy a jugar: cojo el de antes.\",\"answers\":[\"I'm not going to risk it: I'll take the earlier one\",\"I'm not going to risk it. I'll take the earlier one\",\"I'm not going to risk it, so I'll take the earlier one\"],\"hint\":\"La primera mitad ya estaba decidida; la segunda se decide al decirlo\",\"itemIds\":[\"enb1m9imnotgoingtorisk\",\"enb1m9illgiveyouahand\"],\"tip\":\"Los dos futuros en la misma frase, y cada uno por su motivo. Poder alternarlos sin pararte a pensar es exactamente lo que el criterio de gramática del B1 llama rango.\"},{\"id\":\"enb1m9l1e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te están diciendo?\",\"source\":\"They're predicting snow on Thursday, so we're leaving on Wednesday instead.\",\"answers\":[\"Anuncian nieve para el jueves, así que nos vamos el miércoles\",\"Anuncian nieve el jueves, así que nos vamos el miércoles en su lugar\",\"Dan nieve para el jueves, así que salimos el miércoles\"],\"itemIds\":[\"enb1m9theyrepredicting\",\"enb1m9wereflyingout\"],\"tip\":\"«We're leaving on Wednesday» no es «nos estamos yendo»: es el futuro de la agenda. En cuanto veas un día de la semana detrás de un presente continuo, estás leyendo un plan cerrado.\"},{\"id\":\"enb1m9l1e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I'll give you a hand with your case.\",\"translation\":\"Te echo una mano con la maleta.\",\"strictContractions\":true,\"hints\":[\"Empieza por «I'll…»\",\"I'll give you a hand with ...\"],\"itemIds\":[\"enb1m9illgiveyouahand\"],\"tip\":\"Escríbelo con la contracción: «I'll» suena una sola sílaba, «áil», y si esperas oír «I will» separado no lo vas a oír nunca. En el dictado se corrige lo que sonó.\"},{\"id\":\"enb1m9l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"So it's definitely Friday, then?|Definitely. We're flying out at ten past seven in the morning.|Ten past seven. How are you getting to the airport at that hour?|That's the bit I haven't sorted. The first train doesn't get in until half six.|Then don't take the train. I'll drive you. I'm off on Friday anyway.|Are you sure? It's an hour each way.|I'm sure. Be ready at half four and I'm not going to risk the motorway after that.\",\"question\":\"¿Cómo van a ir al aeropuerto?\",\"options\":[\"Las lleva Ben en coche\",\"En el primer tren de la mañana\",\"En un taxi que ya han reservado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo se descarta: «The first train doesn't get in until half six», y el vuelo sale a las siete y diez.\",\"De taxi no se habla en ningún momento.\"],\"itemIds\":[\"enb1m9wereflyingout\",\"enb1m9illgiveyouahand\",\"enb1m9imnotgoingtorisk\"],\"tip\":\"Escucha el momento exacto en que Ben decide: «Then don't take the train. I'll drive you». Ese «I'll» es la marca de que la decisión nace ahí. Si hubiera dicho «I'm going to drive you», querría decir que ya lo tenía pensado y no te lo había contado.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m9-1\",\"book\":\"The train is late.\",\"real\":\"The train's been delayed again.\",\"meaning\":\"Otra vez el tren con retraso\",\"when\":\"Hablando, en el andén o por mensaje. El británico rara vez dice «the train is late» de un servicio: dice que lo han retrasado, en pasiva y con «again» aunque sea la primera vez. Es queja educada, no información. En el Writing y en el Speaking del examen, la versión completa y sin «again».\",\"register\":\"neutral\",\"exam\":\"The train has been delayed.\",\"note\":\"La pasiva no es adorno: «is late» culpa al tren y «has been delayed» culpa a quien lo gestiona. El «again» es el que lleva la queja, y por eso se dice en un tono plano, casi resignado.\",\"sound\":\"de tréins̬ bin di-LÉID a-GUÉN\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m9natdelayedagain\"}}],\"resources\":[{\"label\":\"National Rail — Live departures\",\"url\":\"https://www.nationalrail.co.uk/\",\"note\":\"Busca hoy un trayecto cualquiera (London Euston → Manchester Piccadilly, por ejemplo) y lee el panel real: «On time», «Expected 14:52», «Delayed», «Cancelled», «Calling at…». Cinco minutos: es el inglés de este módulo escrito por quien lo usa.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
