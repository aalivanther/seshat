itle\":\"Cómo suena el examen — y a qué ir a cazar\",\"body\":\"En Hören, los diálogos (Teil 1) y los mensajes de teléfono (Teil 3) los oyes \u003cb\u003ezweimal\u003c/b\u003e; las Ansagen de megafonía (Teil 2) ¡solo UNA vez! Casi todas las respuestas son un dato concreto: una \u003cb\u003ehora\u003c/b\u003e (um zehn Uhr), un \u003cb\u003eprecio\u003c/b\u003e (zwanzig Euro) o una \u003cb\u003eTelefonnummer\u003c/b\u003e (cifra a cifra). Antes de cada audio, lee la pregunta y decide QUÉ número vas a cazar. Los dictados de esta lección son frases tipo examen, tal cual.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f6l2e1\",\"type\":\"mc\",\"prompt\":\"Estrategia de Hören\",\"question\":\"Las Ansagen de megafonía (Teil 2) se escuchan...\",\"options\":[\"dos veces, como todo\",\"solo una vez — máxima atención\",\"las veces que pidas\"],\"answer\":1,\"whyWrong\":[\"Teil 1 y 3 van dos veces; Teil 2 no\",null,\"En el examen nada se repite a demanda — el número de escuchas es fijo\"],\"itemIds\":[\"ansage\",\"zweimal\"],\"tip\":\"Teil 1 y 3: zweimal. Teil 2: einmal. Prepara el oído antes de que empiece.\"},{\"id\":\"f6l2e2\",\"type\":\"match\",\"prompt\":\"Empareja\",\"pairs\":[{\"target\":\"die Ansage\",\"source\":\"el anuncio por megafonía\"},{\"target\":\"die Nachricht\",\"source\":\"el mensaje\"},{\"target\":\"zweimal\",\"source\":\"dos veces\"},{\"target\":\"noch einmal\",\"source\":\"otra vez\"}],\"itemIds\":[\"ansage\",\"nachricht\",\"zweimal\",\"nocheinmal\"]},{\"id\":\"f6l2e3\",\"type\":\"listen\",\"prompt\":\"Dictado tipo examen: una hora\",\"text\":\"Der Zug fährt um zehn Uhr\",\"translation\":\"El tren sale a las diez (der Zug = el tren; fährt, de fahren = sale/va)\",\"hints\":[\"um + hora = a las...\",\"fährt lleva ä — suena «fe-at»\",\"der Zug fährt = el tren sale — fórmula fija de las Ansagen de estación\"],\"itemIds\":[\"ansage\",\"uhr2\"]},{\"id\":\"f6l2e4\",\"type\":\"listen\",\"prompt\":\"Dictado tipo examen: un precio\",\"text\":\"Das kostet fünfu
