{\"src\":\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-6\",{\"src\":\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-7\",{\"src\":\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-8\",{\"src\":\"/seshat/_next/static/chunks/03veldm2tml_q.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@f\"}]}]]}],{},null,false,null]},null,false,\"$10\"]},null,false,\"$10\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L11\",null,{\"children\":\"$L12\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$e\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L14\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tcb6,"])</script><script>self.__next_f.push([1,"The council proposes to replace twelve [[parking spaces|plazas de aparcamiento]] on Palmer Road with a two-way bike lane between the lights and the school. The purpose of this paper is to set out the findings of a four-week count and to invite views, not to announce a decision that has already been taken.\u003cbr/\u003e\u003cbr/\u003eIn terms of air quality, the stretch is the worst in the ward. A sample of fourteen weekday mornings found nitrogen dioxide significantly higher at the lights than at the park end of the same road. Emissions sit there because congestion sits there: the school run and the 29 use the same twenty metres, and neither yields. Weather forecasting for the next decade, the paper notes, makes extreme weather more likely, not less — heat at those lights is already a finding, not a forecast. Global warming is named once, as context, not as a slogan.\u003cbr/\u003e\u003cbr/\u003eThe lane would, on the council's model, cut car movements by roughly a fifth. By contrast, the model is weaker on buses. Due to the fact that the road is narrow, a two-way lane leaves the 29 without a passing place at the corner. Once the parking is removed, it cannot be put back overnight. The paper admits this. Admittedly, the air would improve. The paper does not say nevertheless; it says further work is required on the bus turning circle, and that is the sentence on which the consultation now turns.\u003cbr/\u003e\u003cbr/\u003eProvided that one stop and one passing place remain, the officers' view is that both the buses and the bikes can be served. Except that nobody has yet counted, in public, how often the 29 already runs late because a van is on the stop. That count is promised for May. Until then, the paper asks residents to say whether they would accept a lane that keeps a stop, or no lane, or a lane with no stop. It does not offer a fourth option, and it does not pretend the street is wide enough for all four.\u003cbr/\u003e\u003cbr/\u003eRecycling, pollution and carbon-neutral targets appear in a box at the end, as they must. The box is not the argument. The argument is twenty metres of tarmac and a bus that has to turn. Responses by the twelfth of May. The council is obliged to publish a summary. It is not obliged, the paper is careful to say, to do what the loudest letter wants. A flood on the railway last winter already pushed extra buses onto this road; a drought summer will push more people onto the 29, not fewer. Extreme weather is not an appendix. It is already in the timetable. The officers know this and still have to put twenty metres of tarmac on one page. That is the consultation, and it is narrower than the climate, and it is the page residents actually get to write on. Twenty metres of tarmac, named twice, because that is all the argument has to stand on. Residents have until the twelfth of May to write. The officers will read every letter. They will not, this paper is careful to repeat, treat the loudest one as a vote. That is not a threat. It is the process, named, so that nobody can later say they were not told. A ward meeting is not a referendum, and a consultation is not a lane already painted. Both of those sentences are in this paper for a reason. The twelfth of May is a date, not a verdict, and the officers would like residents to treat it as one."])</script><script>self.__next_f.push([1,"18:Tb97,"])</script><script>self.__next_f.push([1,"I drive the 29. I am not against bikes. I am against a drawing that treats my bus as if it were a car that had simply chosen to be long. It is not a car. It is how Nora gets to the surgery, how the school run looks when a parent cannot park, and how this street still works when the lights fail, which they do.\u003cbr/\u003e\u003cbr/\u003eAdmittedly, the air at the lights is bad. I breathe it for a living. Nevertheless, cutting twelve spaces and hoping the 29 will levitate at the corner is not a climate plan. It is a wish. Even if the lane is built tomorrow, I still have to swing out, and when I swing out I am in the oncoming path of whoever has decided the drawing is the road. Not only is it slower; it is also less safe, and I am the one who will be asked why.\u003cbr/\u003e\u003cbr/\u003eGranted, parking is not a human right. All the same, one of those twelve spaces is the van that fills Mr Patel's shop at six, and one is the space a nurse uses when she cannot face the next stop on foot after a night shift. I am not inventing them. I see them from the cab. Whereas the consultation counts nitrogen, it does not yet count how often I am already late because a van is on the stop. That count would take a week. I would do it myself if someone gave me a pad.\u003cbr/\u003e\u003cbr/\u003eI must admit I have no carbon-neutral timetable to offer. I have a turning circle and a duty to keep to it. Thanks to the new filters the buses are cleaner than they were, which is a fact, not a feeling. Consequently, the next honest step is not to punish the 29 for being large. It is to keep a stop and a passing place, and then to build the lane. To sum up, neither the drawing nor the street as it is will do. Both the buses and the bikes have to be in the sentence. If they are not, you have not evaluated the views. You have listed them, and listing is what we did last time, and the air did not improve. I will add what a flood does to my duty: last winter the railway went under and every extra passenger came to me. A drought will do the same in July, with bottles instead of umbrellas. Weather forecasting can name the week; it cannot make the corner wider. If the council wants carbon-neutral and a 29 that still turns, both have to be in the sentence. I am not asking for a miracle. I am asking for a passing place, and for the drawing to look at the cab before it looks at the sky. From the cab the street is not a consultation. It is a turning circle I either have or I do not. I will be at the meeting, and I will bring the pad. If they want a count of the late 29s, they can have it in a week. If they want a drawing that ignores the cab, they already have one. I know which of those two I will vote for, and it is not the one that looks tidy on a page. Tidy drawings have already had their turn on this street. The air did not improve. The 29 did not get shorter. I would like the next drawing to know both of those facts before it knows my name. That is not attitude. That is a timetable, said from the cab."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m8l6\",\"phaseId\":\"enb2m8\",\"title\":\"The lane, on paper and in the road\",\"subtitle\":\"Dos lecturas: la consulta del ayuntamiento, y la carta de quien conduce el 29\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Aire, atasco, carril, clima\",\"itemIds\":[\"enb2m8pollution\",\"enb2m8globalwarming\",\"enb2m8weatherforecasting\",\"enb2m8extremeweather\",\"enb2m8abikelane\",\"enb2m8congestion\",\"enb2m8emissions\",\"enb2m8parking\",\"enb2m8apassingplace\",\"enb2m8theschoolrun\",\"enb2m8airquality\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: un texto que informa, y uno que convence, sobre el mismo tramo de asfalto\",\"body\":\"El descriptor pide sintetizar. Hoy: \u003cb\u003eA\u003c/b\u003e es la consulta del ayuntamiento (datos, proceso, reservas). \u003cb\u003eB\u003c/b\u003e es una carta abierta de un conductor de autobús — el oficio de Ben, y Ben puede firmarla: no le cambiamos de trabajo. Las dos hablan del carril, el aparcamiento y el 29. La pregunta no es quién tiene razón. Es: qué dato está en las dos, y qué hace cada una con él.\u003cbr/\u003e\u003cbr/\u003ePollution y congestion son incontables. A parking space es una plaza; parking, el recurso. Emissions, plural. Climate change ya era tuyo; global warming entra como bloque de este campo.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l6e1\",\"type\":\"read\",\"prompt\":\"Lectura A — informa. La consulta, con cifras y sin «yo».\",\"title\":\"Consultation: Palmer Road cycle lane\",\"source\":\"From a council consultation paper, Inner London (adapted)\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m8l6e1q1\",\"q\":\"What would the twelve parking spaces be replaced with?\",\"options\":[\"A two-way bike lane between the lights and the school\",\"A new bus garage\",\"A carbon-neutral car park\"],\"answer\":0,\"why\":\"Primera frase del segundo párrafo operativo: replace twelve parking spaces with a two-way bike lane.\"},{\"id\":\"enb2m8l6e1q2\",\"q\":\"Where is the model weaker, according to the paper?\",\"options\":[\"On buses: the road is narrow and the 29 would lose a passing place at the corner\",\"On air quality, which the paper says is already good\",\"On recycling targets\"],\"answer\":0,\"why\":\"«the model is weaker on buses. Due to the fact that the road is narrow…»\"},{\"id\":\"enb2m8l6e1q3\",\"q\":\"What is the sentence on which the consultation now turns?\",\"options\":[\"That further work is required on the bus turning circle\",\"That global warming is a slogan\",\"That the council will do what the loudest letter wants\"],\"answer\":0,\"inference\":true,\"why\":\"«The paper does not say nevertheless; it says further work is required on the bus turning circle, and that is the sentence on which the consultation now turns.» Hay que leer la concesión que no se cierra.\"},{\"id\":\"enb2m8l6e1q4\",\"q\":\"What does the paper refuse to pretend?\",\"options\":[\"That the street is wide enough for a lane, a stop, a passing place and the parking as now\",\"That anyone rides a bike in the rain\",\"That Ben is a resident\"],\"answer\":0,\"inference\":true,\"why\":\"Tres opciones, no cuatro, y «it does not pretend the street is wide enough for all four». El four son las que acaba de listar.\"}],\"itemIds\":[\"enb1m4council\",\"enb2m8abikelane\",\"enb2m8parking\",\"enb2m8emissions\",\"enb2m8congestion\",\"enb2m8pollution\",\"enb2m8globalwarming\",\"enb2m8weatherforecasting\",\"enb2m8extremeweather\",\"enb2m8intermsof\",\"enb2m8carbonneutral\",\"enb2m8apassingplace\",\"enb2m8theschoolrun\",\"enb2m8theturningcircle\",\"enb2m8airquality\",\"enb2m8nitrogendioxide\",\"enb2m8twentymetres\"],\"tip\":\"Cuenta los I: cero, salvo residents. Cuenta las perífrasis de m5 (more likely, is obliged to) y las concesiones de hoy. El texto A es un informe que aún no se moja del todo: further work is required.\"},{\"id\":\"enb2m8l6e2\",\"type\":\"read\",\"prompt\":\"Lectura B — convence. La misma calzada, vista desde el asiento de un 29.\",\"title\":\"The 29 still has to turn\",\"source\":\"Open letter from Ben Carter, bus driver, to the Kentish Town Gazette (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m8l6e2q1\",\"q\":\"What does Ben refuse to let the drawing treat the bus as?\",\"options\":[\"A car that had simply chosen to be long\",\"A bike with an engine\",\"A carbon-neutral van\"],\"answer\":0,\"why\":\"«treats my bus as if it were a car that had simply chosen to be long.»\"},{\"id\":\"enb2m8l6e2q2\",\"q\":\"What count does he say the consultation has not yet done?\",\"options\":[\"How often the 29 is already late because a van is on the stop\",\"How many bikes use Palmer Road on a Sunday\",\"Nitrogen dioxide at the park end\"],\"answer\":0,\"why\":\"«Whereas the consultation counts nitrogen, it does not yet count how often I am already late because a van is on the stop.»\"},{\"id\":\"enb2m8l6e2q3\",\"q\":\"What is «listing» doing in the last line?\",\"options\":[\"It names the failure of the last consultation: views side by side, no evaluation, and the air did not improve.\",\"It is a complaint about the Gazette's word limit.\",\"It means Ben wants a list of parking spaces published.\"],\"answer\":0,\"inference\":true,\"why\":\"«You have listed them, and listing is what we did last time, and the air did not improve.» Listing = el argumento sin concesión ni condición.\"},{\"id\":\"enb2m8l6e2q4\",\"q\":\"How does Ben's stance sit against the council paper?\",\"options\":[\"He accepts the air finding and refuses a lane that pretends the 29 can vanish at the corner.\",\"He wants the lane cancelled and the air ignored.\",\"He wants the school moved.\"],\"answer\":0,\"inference\":true,\"why\":\"Admittedly the air is bad. Nevertheless… keep a stop and a passing place, and then build the lane. Es la concesión del módulo, firmada por Ben.\"}],\"itemIds\":[\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8evenif\",\"enb2m8granted\",\"enb2m8allthesame\",\"enb2m8whereas\",\"enb2m8thanksto\",\"enb2m8consequently\",\"enb2m8tosumup\",\"enb2m8bothand\",\"enb2m8asif\",\"enb2m8thecab\",\"enb2m8thetimetable\",\"enb2m8theturningcircle\",\"enb2m8apassingplace\"],\"tip\":\"Ben usa el molde entero: admittedly, nevertheless, granted, all the same, whereas, even if, not only, to sum up. La B es el módulo puesto a convencer, y el oficio de Ben no se toca.\"},{\"id\":\"enb2m8l6e3\",\"type\":\"mc\",\"prompt\":\"Sintetizar\",\"question\":\"¿Qué hecho está en las dos lecturas?\",\"options\":[\"Que el tramo es estrecho, el aire en el semáforo es malo, y el 29 tiene que girar\",\"Que Ben quiere cancelar la consulta\",\"Que el ayuntamiento ya ha tomado la decisión\"],\"answer\":0,\"whyWrong\":[null,\"Ben pide un recuento y un carril con parada, no una cancelación.\",\"La A dice expresamente que no anuncia una decisión ya tomada.\"],\"itemIds\":[\"enb2m8congestion\",\"enb2m8emissions\",\"enb2m8abikelane\"],\"tip\":\"Tres hechos, dos posturas. Sintetizar es escribir esa línea antes de elegir bando.\"},{\"id\":\"enb2m8l6e4\",\"type\":\"paraphrase\",\"prompt\":\"Sin «I think» ni «against»: la tesis de Ben, de examen\",\"source\":\"I think the drawing is against buses.\",\"forbid\":[\"i\",\"think\",\"against\",\"my\"],\"answers\":[\"It could be argued that the plan treats the bus as a car\",\"It could be argued that the drawing treats the bus as a car\",\"The plan treats the bus as if it were a car\"],\"translation\":\"Yo creo que el plano va contra los autobuses.\",\"hints\":[\"It could be argued / treats the bus as if\",\"It could be argued that the plan treats the bus as ...\"],\"itemIds\":[\"enb2m8itcouldbearguedthat\",\"enb2m8asif\"],\"tip\":\"Ben no necesita I think: tiene as if y a turning circle. El ensayo tampoco.\"},{\"id\":\"enb2m8l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa el incontable\",\"text\":\"In terms of air quality, ___ at the lights is the worst in the ward.\",\"answers\":[\"pollution\",\"congestion\"],\"translation\":\"En cuanto a la calidad del aire, la contaminación / la congestión en el semáforo es la peor del distrito.\",\"hints\":[\"Incontable del campo\",\"poll- / conges-\"],\"itemIds\":[\"enb2m8pollution\",\"enb2m8congestion\",\"enb2m8intermsof\"],\"tip\":\"Las dos caben. A pollution no. A congestion, en este sentido, tampoco.\"},{\"id\":\"enb2m8l6e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"el calentamiento global y los fenómenos extremos\",\"answers\":[\"global warming and extreme weather\",\"global warming and extreme weather events\"],\"hint\":\"Dos bloques del campo WEATHER B2\",\"itemIds\":[\"enb2m8globalwarming\",\"enb2m8extremeweather\",\"enb1m8climatechange\"],\"tip\":\"Climate change ya era tuyo. Global warming es el bloque de este módulo. No son sinónimos exactos y no van en el mismo hueco de un gapbank.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\"
