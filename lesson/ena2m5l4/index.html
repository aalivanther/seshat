nero tampoco se cuenta.\u003cbr/\u003e\u003cbr/\u003eCon \u003cb\u003etoo\u003c/b\u003e delante, la cantidad se vuelve queja: [[There's too much salt in the soup.|La sopa tiene demasiada sal.]] Es la frase que abre media reclamación de restaurante, y vuelve en la lección 9."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l4\",\"phaseId\":\"ena2m5\",\"title\":\"How much sugar?\",\"subtitle\":\"Cuantificar los dos montones: much, many y el a lot of que se dice de verdad\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuánto y cuántos\",\"itemIds\":[\"ena2m5howmuchsugar\",\"ena2m5howmanypeoplearethere\",\"ena2m5alotof\",\"ena2m5thereisntmuchmilk\",\"ena2m5toomuchsalt\",\"enhowmany\",\"enhowmuchisit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"much, many, a lot of: cuál va con cuál\",\"body\":\"$17\",\"table\":[[\"\",\"no se cuenta\",\"se cuenta\"],[\"pregunta\",\"How much sugar?\",\"How many eggs?\"],[\"negación\",\"There isn't much milk.\",\"There aren't many tables.\"],[\"afirmación (lo normal)\",\"a lot of sugar\",\"a lot of people\"],[\"queja\",\"too much salt\",\"too many people\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l4e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga — ¿de qué montón es cada una?\",\"pairs\":[{\"target\":\"sugar\",\"source\":\"el azúcar → much\"},{\"target\":\"eggs\",\"source\":\"los huevos → many\"},{\"target\":\"money\",\"source\":\"el dinero → much\"},{\"target\":\"people\",\"source\":\"la gente → many\"},{\"target\":\"milk\",\"source\":\"la leche → much\"}],\"targetSeconds\":28,\"itemIds\":[\"ensugar\",\"eneggs\",\"ena2m5money\",\"enpeople\",\"enmilk\"],\"tip\":\"El cronómetro solo premia. Lo que buscamos es que el montón te salga sin pensar: si tardas, ese ítem volverá en el repaso.\"},{\"id\":\"ena2m5l4e2\",\"type\":\"bucket\",\"prompt\":\"¿How much o How many?\",\"categories\":[\"How much…?\",\"How many…?\"],\"items\":[{\"text\":\"sugar\",\"bucket\":0},{\"tex
