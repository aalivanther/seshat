Monta un párrafo argumentativo\",\"text\":\"___ sind Feste mehr als ein freier Tag. ___ kosten sie die Stadt viel Geld, ___ stärken sie den Zusammenhalt. ___ sollten wir sie behalten.\",\"answers\":[\"Meiner Meinung nach\",\"Einerseits\",\"andererseits\",\"Deshalb\"],\"bank\":[\"Meiner Meinung nach\",\"Einerseits\",\"andererseits\",\"Deshalb\",\"Obwohl\",\"Weil\",\"In meiner Meinung\"],\"translation\":\"En mi opinión las fiestas son más que un día libre. Por un lado le cuestan mucho dinero a la ciudad, por otro refuerzan la cohesión. Por eso deberíamos conservarlas.\",\"itemIds\":[\"b1m7femeinermeinungnach\",\"b1m7feeinerseits\",\"b1m7fezusammenhalt\"],\"tip\":\"einerseits … andererseits es el par que más sube «Kohärenz» en dos líneas. Y fíjate: los cuatro huecos van en posición 1, así que los cuatro obligan a inversión.\"},{\"id\":\"b1m7l8e6\",\"type\":\"match\",\"prompt\":\"Cada función, su Redemittel\",\"pairs\":[{\"target\":\"Meiner Meinung nach ...\",\"source\":\"tesis: doy mi opinión\"},{\"target\":\"Der Grund dafür ist, dass ...\",\"source\":\"razón: justifico\"},{\"target\":\"Bei uns in Spanien ...\",\"source\":\"ejemplo: traigo mi mundo\"},{\"target\":\"Allerdings hast du in einem Punkt recht: ...\",\"source\":\"concesión: reconozco algo del otro\"}],\"itemIds\":[\"b1m7femeinermeinungnach\",\"b1m7feallerdings\"]},{\"id\":\"b1m7l8e7\",\"type\":\"transform\",\"prompt\":\"Concesión con obwohl\",\"source\":\"Das Fest ist teuer. Trotzdem feiern wir es jedes Jahr.\",\"instruction\":\"Únelo en una sola frase con obwohl\",\"answers\":[\"Obwohl das Fest teuer ist, feiern wir es jedes Jahr.\",\"Wir feiern das Fest jedes Jahr, obwohl es teuer ist.\"],\"translation\":\"Aunque la fiesta es cara, la celebramos todos los años.\",\"hints\":[\"obwohl manda el verbo al final: ... teuer IST\",\"Si la subordinada va delante, la principal empieza por el verbo: feiern wir\"],\"itemIds\":[\"b1m6obwohl\"],\"tip\":\"Subordinada antepuesta + inversión en la principal. Es la estructura que el español no reproduce: «Aunque es cara, la celebramos» — sin inversión.\"},{\"id\":\"b1m7l8e8\",\"type\":\"paraphrase\",\"prompt\":\"Di lo mismo sin la fórmula de siempre\",\"source\":\"Meiner Meinung nach sind Traditionen wichtig.\",\"forbid\":[\"Meinung\",\"meiner\"],\"answers\":[\"Ich finde, dass Traditionen wichtig sind.\",\"Ich finde, dass Traditionen wichtig sind\",\"Ich glaube, dass Traditionen wichtig sind\",\"Ich denke, dass Traditionen wichtig sind\",\"Ich denke, dass Traditionen wichtig sind.\",\"Ich bin überzeugt, dass Traditionen wichtig sind.\",\"Ich bin überzeugt, dass Traditionen wichtig sind\",\"Ich bin der Ansicht, dass Traditionen wichtig sind\"],\"translation\":\"En mi opinión las tradiciones son importantes.\",\"hints\":[\"Ich finde, dass ... — y el verbo al final\",\"También vale: Ich bin überzeugt, dass ...\"],\"itemIds\":[\"b1m7femeinermeinungnach\",\"b1m7fetradition\"],\"tip\":\"Repetir «Meiner Meinung nach» cuatro veces baja «Wortschatz: Spektrum». Ten dos fórmulas de recambio siempre listas.\"},{\"id\":\"b1m7l8e9\",\"type\":\"build\",\"prompt\":\"Construye el cierre del comentario\",\"target\":\"Deshalb sollten wir die alte Tradition behalten\",\"translation\":\"Por eso deberíamos conservar la vieja tradición\",\"distractors\":[\"weil\",\"wir sollten\"],\"itemIds\":[\"b1m7fetradition\"],\"tip\":\"Deshalb en posición 1 → sollten en 2ª → wir en 3ª. Si escribes «Deshalb wir sollten», el corrector lo marca sin dudarlo.\"},{\"id\":\"b1m7l8e10\",\"type\":\"type\",\"prompt\":\"Escribe la concesión de tu comentario\",\"question\":\"Eso sí, tienes razón en un punto\",\"answers\":[\"Allerdings hast du in einem Punkt recht\",\"Allerdings hast du in einem Punkt recht.\",\"Allerdings hast du in einem Punkt Recht\"],\"hints\":[\"Allerdings va en posición 1 → inversión\",\"... hast du in einem Punkt recht\"],\"itemIds\":[\"b1m7feallerdings\"],\"tip\":\"Conceder algo al contrario no te debilita: sube «Erfüllung» porque demuestra que has leído el estímulo.\"},{\"id\":\"b1m7l8e11\",\"type\":\"write\",\"prompt\":\"Cierre del bloque: escribe tu comentario en el foro. 80 palabras, los cuatro puntos, tres conectores distintos.\",\"scenario\":\"En el foro de la radio local se debate si la ciudad debería seguir pagando el desfile de carnaval. Leo ha publicado su comentario. Responde con el tuyo.\",\"genre\":\"forum\",\"register\":\"du\",\"stimulus\":{\"author\":\"Leo\",\"text\":\"Ich verstehe den ganzen Aufwand nicht. Der Umzug kostet die Stadt jedes Jahr sehr viel Geld, drei Tage lang funktioniert nichts, und am Ende liegt überall Müll. Meiner Meinung nach sollte die Stadt das Geld lieber für die Schulen ausgeben. Alte Bräuche sind schön, aber sie gehören ins Museum.\"},\"frame\":[\"1. Tesis: ¿a favor o en contra de lo que dice Leo?\",\"2. Razón: ¿por qué? (weil / denn / deshalb)\",\"3. Ejemplo de tu país o de tu vida\",\"4. Concesión: dale la razón en algo (allerdings / natürlich … aber)\",\"5. Cierre: qué habría que hacer\"],\"bullets\":[\"Di claramente si estás a favor o en contra\",\"Da una razón con un conector (weil / denn / deshalb)\",\"Pon un ejemplo de tu país o de tu vida\",\"Concede algo al otro lado (natürlich / allerdings / obwohl / trotzdem)\"],\"checks\":[{\"re\":\"(dafür|dagegen|zustimmen|einverstanden|recht)\",\"label\":\"postura clara (dafür / dagegen / zustimmen)\"},{\"re\":\"(weil|denn|deshalb|darum)\",\"label\":\"una razón con conector\"},{\"re\":\"(bei uns|in meinem Land|in Spanien|zum Beispiel)\",\"label\":\"un ejemplo propio\"},{\"re\":\"(natürlich|zwar|allerdings|obwohl|trotzdem)\",\"label\":\"una concesión\"}],\"requireConnectors\":{\"min\":3,\"bank\":[\"meiner Meinung nach\",\"außerdem\",\"allerdings\",\"deshalb\",\"obwohl\",\"trotzdem\",\"einerseits\",\"andererseits\",\"zum Beispiel\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Hallo Leo, deiner Meinung kann ich nur teilweise zustimmen. Ich bin dagegen, alte Bräuche einfach abzuschaffen, weil sie den Zusammenhalt einer Stadt sichtbar machen. Meiner Meinung nach ist ein Fest mehr als ein freier Tag. Zum Beispiel feiern wir in Spanien im Frühling ein Fest, bei dem sich die ganze Nachbarschaft eine Woche lang trifft; danach kennt man plötzlich alle Nachbarn. Allerdings hast du in einem Punkt recht: Wegen des Alkohols wird aus manchen Umzügen eine reine Party. Trotzdem sollten wir die Tradition behalten und lieber verbessern.\",\"itemIds\":[\"b1m7femeinermeinungnach\",\"b1m7feallerdings\",\"b1m7fezusammenhalt\",\"b1m7febrauch\"],\"tip\":\"Cuenta las palabras antes de entregar. 79 palabras bien conectadas valen más que 120 brillantes que se dejan un punto de contenido.\"},{\"id\":\"b1m7l8e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 4 · debate de radio. Nadie dice su nombre ni su cargo antes de hablar: quien modera pregunta, la médica argumenta con datos y el del club, con la tradición. DOS escuchas: la primera para las voces, la segunda para decidir. (Fragmento: en el examen son OCHO afirmaciones repartidas entre tres voces.)\",\"audio\":\"Feuerwerk an Silvester — verbieten oder nicht? Darüber streiten heute eine Umweltmedizinerin und der Vorsitzende eines Karnevalsvereins. Frau Doktor, Sie zuerst. | Für mich ist das klar. In einer einzigen Nacht liegt so viel Feinstaub in der Luft wie sonst in Wochen, und in den Notaufnahmen ist es jedes Jahr dasselbe. Wir reden hier über Menschen mit Asthma, nicht über einen Ordnungsdienst. | Also, einerseits versteh ich das ja. Andererseits gehört das Feuerwerk für viele Familien halt einfach dazu, das ist Tradition. Und ein Verbot trifft am Ende die Falschen: Wer Unsinn machen will, macht ihn auch mit Verbot.\",\"question\":\"„Die gesundheitlichen Folgen wiegen schwerer als der Spaß.“ — Wer sagt das?\",\"options\":[\"Die Moderatorin\",\"Die Umweltmedizinerin\",\"Der Vereinsvorsitzende\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Ella solo formula la pregunta del programa\",null,\"Él admite el problema, pero no aporta ningún dato: aporta una tradición\"],\"itemIds\":[\"b1m7fefeuerwerk\",\"b1m7fesilvester\"],\"tip\":\"Ninguna de las dos afirmaciones aparece literal en el audio: hay que resumir la postura entera de un turno. Y los datos duros (partículas, urgencias, asma) casi siempre son del especialista: es un atajo fiable cuando dudas entre dos voces.\"},{\"id\":\"b1m7l8e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo debate, segunda afirmación. Dos escuchas.\",\"audio\":\"Feuerwerk an Silvester — verbieten oder nicht? Darüber streiten heute eine Umweltmedizinerin und der Vorsitzende eines Karnevalsvereins. Frau Doktor, Sie zuerst. | Für mich ist das klar. In einer einzigen Nacht liegt so viel Feinstaub in der Luft wie sonst in Wochen, und in den Notaufnahmen ist es jedes Jahr dasselbe. Wir reden hier über Menschen mit Asthma, nicht über einen Ordnungsdienst. | Also, einerseits versteh ich das ja. Andererseits gehört das Feuerwerk für viele Familien halt einfach dazu, das ist Tradition. Und ein Verbot trifft am Ende die Falschen: Wer Unsinn machen will, macht ihn auch mit Verbot.\",\"question\":\"„Ein Verbot bestraft die, die sich sowieso an die Regeln halten.“ — Wer sagt das?\",\"options\":[\"Die Moderatorin\",\"Die Umweltmedizinerin\",\"Der Vereinsvorsitzende\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Ella no defiende ninguna postura\",\"Ella está a favor de prohibirlo\",null],\"itemIds\":[\"b1m7feeinerseits\",\"b1m7feallerdings\",\"b1m7fetradition\"],\"tip\":\"«einerseits … andererseits» no es indecisión: quien lo usa concede primero y luego coloca su postura en la segunda mitad. Copia ese esqueleto en tu comentario de foro y ganas puntos de Kohärenz.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>s
