»: es \u003cb\u003ehabla de un error y corrígete al menos una vez\u003c/b\u003e. El descriptor de B2 dice \u003ci\u003ecan correct most of his/her mistakes\u003c/i\u003e. Hoy se entrena en voz alta: \u003ci\u003eAllow me to rephrase that\u003c/i\u003e / \u003ci\u003ewhat I meant was\u003c/i\u003e, a mitad de camino, a propósito.\u003cbr/\u003e\u003cbr/\u003e30 segundos de notas, 2 minutos, dos pasadas. Estructura:\u003cbr/\u003e1. Anuncia el error, sin rodeos.\u003cbr/\u003e2. El hecho: qué enviaste, a quién, qué daño.\u003cbr/\u003e3. El mundo que no fue: If I had… / I ought to have…\u003cbr/\u003e4. La reparación, y un cierre con on reflection.\u003cbr/\u003e\u003cbr/\u003eSi te oyes un «I think maybe it was a bit bad», páralo. Eso se llama evitación. Reformula.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la tarde\",\"sentences\":[\"Valeria had a fair point about the rota and put it in the first sentence.\",\"Then she wrote a second sentence she would not have written if she had waited.\",\"She pressed send before Sam could look at it.\",\"In hindsight she ought to have given it a second look.\",\"On reflection she did the four steps, and Priya accepted the apology.\"],\"translation\":\"Valeria tenía razón con el turno y lo puso en la primera frase. · Luego escribió una segunda que no habría escrito si hubiera esperado. · Pulsó enviar antes de que Sam pudiera mirarlo. · Visto ahora, debería haberle dado una segunda mirada. · Pensándolo bien, hizo los cuatro pasos, y Priya aceptó la disculpa.\",\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6pressedsend\",\"enb2m6asecondlook\",\"enb2m6onreflection\",\"enb2m6acceptinganapology\",\"enb2m6thefoursteps\"],\"tip\":\"El orden del relato es el de los hechos, no el de la culpa. La culpa llega en las frases 2 y 4; el cierre, en la 5.\"},{\"id\":\"enb2m6l9e2\",\"type\":\"fastmatch\",\"prompt\":\"Las fórmulas del módulo, sin pensar\",\"pairs\":[{\"target\":\"If I had known, I would have told you.\",\"source\":\"Si lo hubiera sabido, te lo habría dicho.\"},{\"target\":\"I should have told you.\",\"source\":\"Debería habértelo dicho.\"},{\"target\":\"I wish I had told her.\",\"source\":\"Ojalá se lo hubiera dicho.\"},{\"target\":\"I had it fixed.\",\"source\":\"Lo hice arreglar.\"},{\"target\":\"Allow me to rephrase that.\",\"source\":\"Permítame reformularlo.\"}],\"targetSeconds\":30,\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6shouldhavetoldyou\",\"enb2m6wishihadtoldher\",\"enb2m6ihaditfixed\",\"enb2m6allowmetorephrase\"],\"tip\":\"Cinco máquinas. Si una se te traba, es esa la que vas a evitar en el monólogo. Mírala ahora.\"},{\"id\":\"enb2m6l9e3\",\"type\":\"errorfix\",\"prompt\":\"Repaso espiral: el would del segundo, que no se ha ido\",\"wrong\":\"If I would have the money, I would buy it.\",\"answers\":[\"If I had the money, I would buy it.\"],\"why\":\"El would de la mitad del if, ahora en el segundo condicional, que es del B1. Se caza, no se reabre. Hoy el mismo error en el tercero; ayer, en este.\",\"translation\":\"Si tuviera el dinero, lo compraría.\",\"itemIds\":[\"enb1m5ifihadthemoney\"]},{\"id\":\"enb2m6l9e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el cierre de Valeria — B1 y B2 juntos\",\"text\":\"If I ___ known, I wouldn't have pressed send. I should have ___ you. I wish I had ___ a day. Anyway, I take full ___.\",\"answers\":[\"had\",\"told\",\"waited\",\"responsibility\"],\"bank\":[\"had\",\"told\",\"waited\",\"responsibility\",\"have\",\"tell\",\"said\",\"blame\"],\"translation\":\"Si lo hubiera sabido, no habría pulsado enviar. Debería habértelo dicho. Ojalá hubiera esperado un día. En fin, asumo toda la responsabilidad.\",\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6shouldhavetoldyou\",\"enb2m6wishihadtoldher\",\"enb2m6wouldhavewaited\",\"enb2m6itakefullresponsibility\",\"enb1m3anyway\"],\"tip\":\"Had / told / waited / responsibility: cuatro máquinas, cuatro huecos. «Tell» está de distractor porque el have ya pide participio.\"},{\"id\":\"enb2m6l9e5\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: un error que reparaste. Treinta segundos, dos minutos, y te corriges al menos una vez en voz alta.\",\"topic\":\"A time I got the wording wrong — what I sent, what I should have done, and how I repaired it\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"El error, en una frase, sin «I think maybe». «I sent an email I shouldn't have sent.»\"},{\"title\":\"2. The fact\",\"hint\":\"A quién, qué daño, qué había de cierto en el fondo. Wording, not meaning.\"},{\"title\":\"3. The world that didn't happen\",\"hint\":\"If I had… / I ought to have… / I wish I had… Al menos dos.\"},{\"title\":\"4. The repair, and a correction\",\"hint\":\"Qué hiciste después. Y a mitad, corrígete: «Allow me to rephrase that / what I meant was…». Cierra con on reflection.\"}],\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"checklist\":[\"Hablé al menos 1:45 sin pararme en seco\",\"Usé un tercer condicional (If I had…, I would have…)\",\"Usé should have u ought to have al menos una vez\",\"Me corregí en voz alta al menos una vez (rephrase / what I meant was)\",\"No me oí un «I think maybe it was a bit bad» como herramienta principal\",\"Cerré con on reflection, in hindsight o even so\"],\"model\":\"Solo el punto 4: «I did the four steps the next morning. Allow me to rephrase that — I did three of them well and I still hedged the fourth, and Amy caught it. On reflection I was unfair, and I take full responsibility for the wording, not for the rota, which still needs fixing.»\",\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6oughttohavechecked\",\"enb2m6allowmetorephrase\",\"enb2m6onreflection\",\"enb2m6itakefullresponsibility\",\"enb2m6thewording\",\"enb2m6thefoursteps\",\"enb2m6stopping\"],\"tip\":\"La corrección en voz alta no es un fallo: es el punto. Si llegas al final sin haberte oído un rephrase, te falta el descriptor de Accuracy.\"},{\"id\":\"enb2m6l9e6\",\"type\":\"audiomc\",\"prompt\":\"La cocina, al día siguiente. Una sola escucha. Toma notas: hay reparación y hay evitación, y no son de la misma voz.\",\"notepad\":true,\"plays\":1,\"audio\":\"Did she accept it?|She accepted the apology. She didn't accept the week. That's fair.|You still sound as if you're sorry if she was offended.|No, hang on — what I meant was I own the tone, not the rota. Allow me to rephrase that. I take full responsibility for the wording. I don't accept the blame for a rota I didn't write.|That's the sentence. Send her that if you write again.|I won't write again. I'll go in. If I had gone in yesterday I wouldn't have needed four drafts.\",\"question\":\"¿Qué está haciendo Valeria en «No, hang on… Allow me to rephrase»?\",\"options\":[\"Reparando: se oye la evitación y la sustituye por las dos frases de culpa que tocan\",\"Evitando otra vez, con más palabras\",\"Echándole la culpa a Amy\"],\"answer\":0,\"whyWrong\":[null,\"Las dos frases de después (own the tone / don't accept the blame for the rota) son B2, no rodeos.\",\"Amy es quien caza la evitación; no es el blanco.\"],\"itemIds\":[\"enb2m6nathangon\",\"enb2m6allowmetorephrase\",\"enb2m6itakefullresponsibility\",\"enb2m6idontaccepttheblame\",\"enb2m6ifihadknown\"],\"tip\":\"En treinta segundos oyes las tres alturas de la reparación (hang on, what I meant, allow me to rephrase) y un tercer condicional de cierre. Eso es el módulo, dicho.\"},{\"id\":\"enb2m6l9e7\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Si hubiera ido ayer, no habría necesitado cuatro borradores.\",\"answers\":[\"If I had gone in yesterday I wouldn't have needed four drafts\",\"If I had gone in yesterday, I wouldn't have needed four drafts\",\"If I had gone yesterday I wouldn't have needed four drafts\"],\"hints\":[\"Tercer condicional, gone (participio de go)\",\"If I had gone ... I wouldn't have needed four drafts\"],\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6aseconddraft\"],\"tip\":\"Gone, no went, en la mitad del if. Went es el calco del pasado simple, que es el segundo condicional, que es el B1.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
