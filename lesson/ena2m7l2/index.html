me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4e7,\u003cb\u003emust\u003c/b\u003e es «deber», y es el verbo más cómodo del inglés porque no cambia NUNCA:\u003cbr/\u003e\u003cbr/\u003eI must · you must · \u003cu\u003eshe must\u003c/u\u003e · we must · they must. Ni una -s. Y la negativa es \u003cb\u003emustn't\u003c/b\u003e, sin do; y la pregunta es \u003ci\u003eMust I…?\u003c/i\u003e, sin do tampoco. Es un modal, y los modales van por libre: se bastan solos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí viene la trampa nº 8 del hispanohablante, la que más barata sale de arreglar.\u003c/b\u003e En español, detrás de la perífrasis va un infinitivo con su \u003ci\u003ea\u003c/i\u003e, su \u003ci\u003ede\u003c/i\u003e o su \u003ci\u003eque\u003c/i\u003e: «tengo QUE ir», «voy A salir», «debo descansar». Al traducir, esa preposición se cuela sola:\u003cbr/\u003e\u003cbr/\u003e❌ \u003ci\u003eI must to go.\u003c/i\u003e · ❌ \u003ci\u003ePassengers must to show their tickets.\u003c/i\u003e\u003cbr/\u003e✅ \u003cb\u003eI must go.\u003c/b\u003e · ✅ \u003cb\u003ePassengers must show their tickets.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eDetrás de un modal el verbo va \u003cb\u003edesnudo\u003c/b\u003e: sin \u003ci\u003eto\u003c/i\u003e, sin \u003ci\u003e-s\u003c/i\u003e y sin \u003ci\u003e-ing\u003c/i\u003e. Y lo mismo valdrá mañana para \u003ci\u003ecan\u003c/i\u003e, \u003ci\u003ecould\u003c/i\u003e y \u003ci\u003emay\u003c/i\u003e: es una sola regla para los cuatro.\u003cbr/\u003e\u003cbr/\u003eUn apunte de colocación: en \u003cb\u003eYou must always keep your receipt\u003c/b\u003e el \u003ci\u003ealways\u003c/i\u003e va entre \u003cb\u003emust\u003c/b\u003e y el verbo. Es lo mismo que viste en el módulo 3 con los adverbios de frecuencia; aquí no hay nada nuevo, solo el sitio de siempre."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l2\",\"phaseId\":\"ena2m7\",\"title\":\"Passengers must show their tickets\",\"subtitle\":\"El verbo de los avisos — y la preposición que el español mete y aquí sobra\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Así habla una norma\",\"itemIds\":[\"ena2m7passengersmustshow\",\"ena2m7imustgo\",\"ena2m7youmustkeepyourreceipt\",\"ena2m7thereceipt\",\"ena2m7youmustsignhere\",\"ena2m7itsthelaw\",\"enticket\"]},{\"kind\":\"note\",\"note\":{\"title\":\"must: el verbo que no se dobla ante nadie\",\"body\":\"$17\",\"table\":[[\"español\",\"❌ calco\",\"✅ inglés\"],[\"Tengo que irme.\",\"I must to go.\",\"I must go.\"],[\"Debe firmar aquí.\",\"She must to sign here.\",\"She must sign here.\"],[\"Hay que enseñar el billete.\",\"You must to show your ticket.\",\"You must show your ticket.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"must o have to: quién manda\",\"body\":\"Las dos significan obligación, y en el 90 % de los casos el examinador acepta las dos. Pero no suenan igual, y esta es la diferencia que sí te van a agradecer:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003emust\u003c/b\u003e es la voz de la NORMA y la de UNO MISMO. Es el verbo de los avisos, los reglamentos, los carteles del ayuntamiento — [[Passengers must show their tickets.|Los viajeros deben mostrar el billete.]] — y también el de la obligación que me pongo yo: [[I must go.|Me tengo que ir.]] («ya va siendo hora, me lo digo yo»).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ehave to\u003c/b\u003e es la voz de la VIDA: la circunstancia, el horario, el jefe, la cola. [[She has to work on Saturday.|Tiene que trabajar el sábado.]] — no es que ella quiera, es que le toca.\u003cbr/\u003e\u003cbr/\u003eRegla práctica para el examen: si lo has leído en un cartel, \u003cb\u003emust\u003c/b\u003e. Si se lo cuentas a un amigo, \u003cb\u003ehave to\u003c/b\u003e. Y si dudas, \u003cb\u003ehave to\u003c/b\u003e: en inglés hablado de hoy es mucho más frecuente, y no queda raro en ningún sitio.\",\"table\":[[\"\",\"must\",\"have to\"],[\"quién obliga\",\"la norma escrita, o yo mismo\",\"la circunstancia, la vida\"],[\"dónde se lee\",\"carteles, avisos, contratos\",\"conversación normal\"],[\"forma\",\"invariable, sin to detrás\",\"have / has, con do en la pregunta\"],[\"ejemplo\",\"Passengers must show their tickets.\",\"I have to work on Saturday.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l2e1\",\"type\":\"build\",\"prompt\":\"Construye el aviso — y fíjate en qué fichas te sobran\",\"target\":\"Passengers must show their tickets\",\"translation\":\"Los viajeros deben mostrar el billete.\",\"distractors\":[\"to\",\"shows\"],\"itemIds\":[\"ena2m7passengersmustshow\",\"enticket\"],\"tip\":\"Las dos fichas que sobran son las dos trampas del español de golpe: el «to» de «tener que» y la -s que aquí no existe. Detrás de must, el verbo va desnudo.\"},{\"id\":\"ena2m7l2e2\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «to» que se coló\",\"wrong\":\"I must to go.\",\"answers\":[\"I must go.\"],\"why\":\"En español la perífrasis lleva preposición o «que» («tengo que ir»), y al traducir se traslada sola. Detrás de un modal —must, can, could, may— el verbo va en su forma de diccionario y nada más. Es uno de los errores más fáciles de quitar del A2: apunta la regla una vez y no vuelvas.\",\"translation\":\"Me tengo que ir.\",\"itemIds\":[\"ena2m7imustgo\"]},{\"id\":\"ena2m7l2e3\",\"type\":\"mc\",\"prompt\":\"El cartel de la estación\",\"question\":\"¿Cómo lo escribe la compañía?\",\"options\":[\"Passengers must show their tickets.\",\"Passengers must to show their tickets.\",\"Passengers musts show their tickets.\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de must, el verbo va desnudo: sin to\",\"must no lleva -s nunca, con ninguna persona\"],\"itemIds\":[\"ena2m7passengersmustshow\"]},{\"id\":\"ena2m7l2e4\",\"type\":\"bucket\",\"prompt\":\"¿Lo diría un aviso o lo diría una persona?\",\"categories\":[\"así habla un aviso (must)\",\"así habla la gente (have to)\"],\"items\":[{\"text\":\"Passengers must show their tickets.\",\"bucket\":0},{\"text\":\"I have to work late today.\",\"bucket\":1},{\"text\":\"Visitors must sign in at reception.\",\"bucket\":0},{\"text\":\"She has to go to the bank.\",\"bucket\":1},{\"text\":\"All bags must be closed.\",\"bucket\":0},{\"text\":\"We have to queue for an hour.\",\"bucket\":1}],\"itemIds\":[\"ena2m7passengersmustshow\",\"ena2m7ihavetogotothebank\",\"ena2m7thequeue\"],\"tip\":\"No es que una sea correcta y la otra no: es un asunto de voz. must viene de arriba y por escrito; have to viene de la vida y se dice hablando.\"},{\"id\":\"ena2m7l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa el aviso del banco\",\"text\":\"You ___ sign here, please.\",\"answers\":[\"must\"],\"translation\":\"Tiene que firmar aquí, por favor.\",\"hints\":[\"Es una norma del sitio, escrita\",\"m…t\"],\"itemIds\":[\"ena2m7youmustsignhere\",\"enbank\"]},{\"id\":\"ena2m7l2e6\",\"type\":\"transform\",\"prompt\":\"Ponlo como lo escribiría un cartel\",\"source\":\"You have to keep your receipt.\",\"instruction\":\"Dilo con must\",\"answers\":[\"You must keep your receipt.\",\"You must always keep your receipt.\"],\"translation\":\"Hay que guardar el recibo.\",\"hints\":[\"Cambia have to por el modal, y el verbo se queda igual\",\"You m… keep your receipt.\"],\"itemIds\":[\"ena2m7youmustkeepyourreceipt\",\"ena2m7thereceipt\"]},{\"id\":\"ena2m7l2e7\",\"type\":\"mc\",\"prompt\":\"Dónde se pone el «siempre»\",\"question\":\"«Hay que guardar SIEMPRE el recibo»\",\"options\":[\"You must always keep your receipt.\",\"You must keep always your receipt.\",\"Always you must keep your receipt.\"],\"answer\":0,\"whyWrong\":[null,\"Entre el verbo y su objeto no se mete nada — es la regla del módulo 3, tal cual\",\"Suena a traducción literal; el sitio natural es detrás del modal\"],\"itemIds\":[\"ena2m7youmustkeepyourreceipt\",\"enalways\"],\"tip\":\"El sitio del adverbio ya lo tienes del módulo 3: detrás del auxiliar o del modal, delante del verbo de verdad. Aquí no hay nada nuevo que aprender.\"},{\"id\":\"ena2m7l2e8\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"Es la ley.\",\"answers\":[\"It's the law.\",\"It is the law.\"],\"hint\":\"no te olvides del sujeto: el inglés nunca lo deja caer\",\"itemIds\":[\"ena2m7itsthelaw\"],\"tip\":\"«Es la ley» en español no lleva sujeto. En inglés hay que ponerlo: It's. Sin ese it, la frase no existe.\"},{\"id\":\"ena2m7l2e9\",\"type\":\"speak\",\"prompt\":\"Léelo como si lo estuvieras leyendo en la pared\",\"text\":\"Passengers must show their tickets.\",\"phonetic\":\"PA-sin-dchas̬ mast SHÓU dea TÍ-kits\",\"translation\":\"Los viajeros deben mostrar el billete.\",\"itemIds\":[\"ena2m7passengersmustshow\"],\"tip\":\"must aquí va átono y cortito: «mast», casi pegado a lo siguiente. El golpe de voz cae en SHOW.\"},{\"id\":\"ena2m7l2e10\",\"type\":\"match\",\"prompt\":\"Empareja\",\"pairs\":[{\"target\":\"the receipt\",\"source\":\"el recibo\"},{\"target\":\"It's the law.\",\"source\":\"Es la ley.\"},{\"target\":\"You must sign here.\",\"source\":\"Tiene que firmar aquí.\"},{\"target\":\"I must go.\",\"source\":\"Me tengo que ir.\"}],\"itemIds\":[\"ena2m7thereceipt\",\"ena2m7itsthelaw\",\"ena2m7youmustsignhere\",\"ena2m7imustgo\"]},{\"id\":\"ena2m7l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me tengo que ir. Tiene que firmar aquí.\",\"answers\":[\"I must go. You must sign here.\",\"I have to go. You must sign here.\",\"I must go. You have to sign here.\"],\"hints\":[\"Dos modales seguidos y ni un to detrás\",\"I m… go. You m… sign here.\"],\"itemIds\":[\"ena2m7imustgo\",\"ena2m7youmustsignhere\"],\"tip\":\"Si te has salido con have to en alguna de las dos, también vale: aquí las dos son buenas. Lo que no vale es el «to» detr
