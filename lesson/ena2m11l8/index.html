3ci\u003e…it might rain\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[Take an umbrella, just in case.|Coge un paraguas, por si acaso.]]\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e[[Be careful — the roads will be icy.|Ten cuidado: las carreteras estarán heladas.]]\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eDon't forget your jacket — it'll be chilly tonight.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e\u003ci\u003eJust in case\u003c/i\u003e\u003c/b\u003e es la joya de la lección: significa «por si acaso» y sirve para cerrar cualquier consejo sin dar explicaciones. Se pone al final, con coma delante, y no lleva nada detrás. \u003ci\u003eTake some money, just in case.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOjo con el registro.\u003c/b\u003e El imperativo pelado en inglés es normal entre amigos y en carteles, pero áspero con un desconocido. Si estás con alguien a quien no conoces, envuélvelo con lo que aprendiste en el módulo 5: \u003ci\u003eYou might want to take an umbrella\u003c/i\u003e o \u003ci\u003eI'd take an umbrella if I were you\u003c/i\u003e — esta última déjala solo para reconocerla, que ya es B1.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el plan B, que es de lo que va el módulo:\u003c/b\u003e cuando propongas algo con condición, ten siempre la salida preparada. La fórmula más corta que existe es \u003cb\u003e[[If not, we'll go to the cinema.|Si no, nos vamos al cine.]]\u003c/b\u003e — cuatro palabras que resuelven cualquier plan que se tuerza."])</script><script>self.__next_f.push([1,"18:T686,"])</script><script>self.__next_f.push([1,"En la lección 2 viste que el inglés niega la opinión al revés («I don't think it will rain»). \u003cb\u003eCon \u003ci\u003ehope\u003c/i\u003e no\u003c/b\u003e: aquí la negación se queda donde el español la pone.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[I hope it doesn't rain.|Espero que no llueva.]]\u003c/b\u003e ✅ — nunca \u003ci\u003eI don't hope it rains\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY hay una segunda cosa que sorprende: \u003cb\u003edetrás de \u003ci\u003ehope\u003c/i\u003e va PRESENTE\u003c/b\u003e, aunque estés hablando de mañana. \u003ci\u003eI hope it doesn't rain \u003cb\u003etomorrow\u003c/b\u003e\u003c/i\u003e. Es la misma economía de siempre: el «mañana» ya dice que es futuro, y el inglés no lo repite. \u003ci\u003eI hope it won't rain\u003c/i\u003e también existe y no está mal, pero lo normal es el presente.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error que hay que matar es el del sujeto.\u003c/b\u003e «Espero que no llueva» no tiene sujeto en español, y al traducir se cae: \u003ci\u003eI hope doesn't rain\u003c/i\u003e. Falta el \u003cb\u003eit\u003c/b\u003e, el mismo relleno obligatorio de la lección 3. Sin él, la frase dice que eres tú quien no llueve.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la pieza más rentable de la lección: \u003ci\u003eso\u003c/i\u003e y \u003ci\u003enot\u003c/i\u003e.\u003c/b\u003e Cuando alguien te pregunta algo y quieres contestar «espero que sí» o «espero que no», el inglés \u003cb\u003eno repite la frase\u003c/b\u003e: la sustituye por una palabra.\u003cbr/\u003e\u003cbr/\u003e· «Will it be sunny?» → \u003cb\u003e[[I hope so.|Ojalá.]]\u003c/b\u003e — nunca \u003ci\u003eI hope yes\u003c/i\u003e.\u003cbr/\u003e· «Will it rain?» → \u003cb\u003eI hope not.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eY el mismo truco funciona con otros verbos: \u003ci\u003eI think so\u003c/i\u003e · \u003ci\u003eI don't think so\u003c/i\u003e · \u003ci\u003eI'm afraid so\u003c/i\u003e · \u003ci\u003eI'm afraid not\u003c/i\u003e. Son cuatro respuestas de dos palabras que puedes soltar en cualquier conversación, y en el oral valen oro: contestas rápido, contestas bien y ganas tiempo para pensar la frase siguiente."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l8\",\"phaseId\":\"ena2m11\",\"title\":\"Take an umbrella, just in case\",\"subtitle\":\"Avisar de lo que viene, decir lo que esperas y tener siempre un plan B\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El aviso, la esperanza y la salida\",\"itemIds\":[\"ena2m11takeanumbrella\",\"ena2m11becarefulicy\",\"ena2m11ihopeitdoesntrain\",\"ena2m11ihopeso\",\"ena2m11ifnotwellgo\",\"ena2m11wewontbelong\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Avisar: primero qué hacer, y luego por qué\",\"body\":\"$17\"}},{\"kind\":\"note\",\"note\":{\"title\":\"I hope: la excepción que se comporta como el español, y el «so» que ahorra la frase\",\"body\":\"$18\",\"table\":[[\"te preguntan\",\"si esperas que sí\",\"si esperas que no\"],[\"Will it be sunny?\",\"I hope so.\",\"I hope not.\"],[\"Will it rain?\",\"I hope so.\",\"I hope not.\"],[\"Is it going to be cold?\",\"I think so.\",\"I don't think so.\"],[\"Are we late?\",\"I'm afraid so.\",\"I'm afraid not.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l8e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el aviso\",\"question\":\"Nora le dice a Valeria: “Take an umbrella, just in case.”\",\"options\":[\"Coge un paraguas, por si acaso\",\"Coge un paraguas solo en este caso\",\"Coge un paraguas en esa caja\"],\"answer\":0,\"whyWrong\":[null,\"«Just in case» es una expresión hecha: significa «por si acaso», no «solo en este caso»\",\"Case es también «caja», sí, pero aquí forma parte de la expresión entera\"],\"itemIds\":[\"ena2m11takeanumbrella\"],\"tip\":\"«Just in case» va siempre al final y no lleva nada detrás. Es un punto y final, no el principio de una explicación.\"},{\"id\":\"ena2m11l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Cómo contestarías: esperando que sí, o esperando que no?\",\"categories\":[\"I hope so.\",\"I hope not.\"],\"items\":[{\"text\":\"Will it be sunny for the picnic?\",\"bucket\":0},{\"text\":\"Will it rain on Sunday?\",\"bucket\":1},{\"text\":\"Will the shop be open?\",\"bucket\":0},{\"text\":\"Will the roads be icy tonight?\",\"bucket\":1},{\"text\":\"Will Amy come with us?\",\"bucket\":0},{\"text\":\"Will it be freezing tomorrow?\",\"bucket\":1}],\"itemIds\":[\"ena2m11ihopeso\",\"ena2m11becarefulicy\",\"ena2m11freezing\"],\"tip\":\"Fíjate en que la respuesta no repite ni una palabra de la pregunta. Ese es el ahorro: dos palabras cubren una frase entera.\"},{\"id\":\"ena2m11l8e3\",\"type\":\"cloze\",\"prompt\":\"Detrás de hope, presente\",\"text\":\"I hope it ___ rain tomorrow — we've got the picnic.\",\"answers\":[\"doesn't\",\"does not\"],\"translation\":\"Espero que mañana no llueva: tenemos el picnic.\",\"hints\":[\"Presente negativo, aunque hables de mañana\",\"I hope it d… rain tomorrow.\"],\"itemIds\":[\"ena2m11ihopeitdoesntrain\",\"enpicnic\"]},{\"id\":\"ena2m11l8e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige — falta el sujeto de relleno\",\"wrong\":\"I hope doesn't rain tomorrow.\",\"answers\":[\"I hope it doesn't rain tomorrow.\"],\"why\":\"«Espero que no llueva» no tiene sujeto en español, y al traducir se cae. En inglés hace falta el «it» de siempre: sin él, la frase dice que eres tú quien no llueve. Es el mismo it de «It's cold» y «It will rain».\",\"translation\":\"Espero que mañana no llueva.\",\"itemIds\":[\"ena2m11ihopeitdoesntrain\"]},{\"id\":\"ena2m11l8e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la respuesta corta\",\"wrong\":\"I hope yes.\",\"answers\":[\"I hope so.\"],\"why\":\"El inglés no contesta «sí» detrás de hope: sustituye la frase entera por «so». Y para el no, por «not». Funciona igual con think y con afraid: I think so, I don't think so, I'm afraid not.\",\"translation\":\"Ojalá. / Espero que sí.\",\"itemIds\":[\"ena2m11ihopeso\"],\"tip\":\"«I hope yes» es de los errores que más delatan, porque aparece en la primera conversación. Cuatro fórmulas —so, not, think so, afraid so— y te la quitas de encima para siempre.\"},{\"id\":\"ena2m11l8e6\",\"type\":\"gapbank\",\"prompt\":\"Valeria avisa a Amy antes de salir\",\"text\":\"Take an umbrella, ___ in case. It ___ rain this afternoon, and if it does, we ___ go to the cinema instead.\",\"answers\":[\"just\",\"might\",\"will\"],\"bank\":[\"just\",\"might\",\"will\",\"only\",\"must\",\"won't\"],\"translation\":\"Coge un paraguas, por si acaso. Puede que llueva esta tarde y, si llueve, nos vamos al cine.\",\"itemIds\":[\"ena2m11takeanumbrella\",\"ena2m11itmightrain\",\"ena2m11ifnotwellgo\",\"enletsgotothecinema\"],\"tip\":\"Los tres huecos son las tres piezas del plan B: el aviso, la posibilidad y la salida. Cópiate esa plantilla, que la vas a usar en la lección 9.\"},{\"id\":\"ena2m11l8e7\",\"type\":\"match\",\"prompt\":\"Empareja cada aviso con su razón\",\"pairs\":[{\"target\":\"Take an umbrella.\",\"source\":\"Puede que llueva\"},{\"target\":\"Be careful.\",\"source\":\"Las carreteras estarán heladas\"},{\"target\":\"Don't forget your jacket.\",\"source\":\"Hará fresquito esta noche\"},{\"target\":\"We won't be long.\",\"source\":\"Volvemos enseguida\"}],\"itemIds\":[\"ena2m11takeanumbrella\",\"ena2m11becarefulicy\",\"ena2m11wewontbelong\",\"enjacket\"]},{\"id\":\"ena2m11l8e8\",\"type\":\"order\",\"prompt\":\"Ordena la conversación de Amy y Valeria\",\"sentences\":[\"Are we still going to the park on Sunday?\",\"I hope so! But it might rain in the afternoon.\",\"And if it rains?\",\"If not, we'll go to the cinema instead.\",\"Perfect. Let me know on Saturday.\"],\"translation\":\"—¿Seguimos con lo del parque el domingo? —¡Ojalá! Pero puede que llueva por la tarde. —¿Y si llueve? —Si no, nos vamos al cine. —Perfecto. Ya me dirás el sábado.\",\"itemIds\":[\"ena2m11ihopeso\",\"ena2m11itmightrain\",\"ena2m11ifnotwellgo\",\"ena2m11letmeknow\",\"enpark\"],\"tip\":\"Ahí tienes un plan B entero en cinco frases, y solo una de ellas es larga. Negociar un domingo en inglés no pide más que esto.\"},{\"id\":\"ena2m11l8e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Ten cuidado: las carreteras estarán heladas. Espero que no nieve.\",\"answers\":[\"Be careful — the roads will be icy. I hope it doesn't snow.\",\"Be careful, the roads will be icy. I hope it doesn't snow.\",\"Be careful — the roads will be icy. I hope it won't snow.\"],\"hint\":\"detrás de hope hace falta un sujeto que el español no pone\",\"itemIds\":[\"ena2m11becarefulicy\",\"ena2m11ihopeitdoesntrain\",\"enitssnowing\"]},{\"id\":\"ena2m11l8e10\",\"type\":\"audiomc\",\"prompt\":\"Ben avisa a Valeria — pregunta primero, audio después\",\"audio\":\"Listen, if you're getting the bus tonight, take an umbrella just in case. It probably won't rain before nine, but it'll be freezing after that. And be careful on Palmer Road — the roads will be icy.\",\"question\":\"¿De qué avisa Ben para después de las nueve?\",\"options\":[\"De que hará muchísimo frío\",\"De que lloverá mucho\",\"De que no habrá autobuses\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice justo lo contrario de la lluvia: «It probably won't rain»\",\"Los autobuses no salen en ningún momento del audio\"],\"itemIds\":[\"ena2m11takeanumbrella\",\"ena2m11itprobablywont\",\"ena2m11freezing\",\"ena2m11becarefulicy\"],\"tip\":\"En un aviso, lo importante siempre va detrás del «but». Ben empieza descartando la lluvia y ahí es donde llega lo que de verdad quiere decirte.\"},{\"id\":\"ena2m11l8e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el aviso completo\",\"text\":\"Take an umbrella, just in case. I hope it doesn't rain, but if it does, we'll go to the cinema.\",\"phonetic\":\"téik an am-BRE-la, dchast in KÉIS. ái JÓUP it DA-s̬ent réin, bat if it DAS̬, uíil góu tu de SÍ-ne-ma\",\"translation\":\"Coge un paraguas, por si acaso. Espero que no llueva, pero si llueve nos vamos al cine.\",\"itemIds\":[\"ena2m11takeanumbrella\",\"ena2m11ihopeitdoesntrain\",\"ena2m11ifnotwellgo\"],\"tip\":\"Ese «if it does» del final sustituye a «if it rains» sin repetir el verbo. Es el mismo ahorro que «I hope so», y suena muy nativo por poco esfuerzo.\"},{\"id\":\"ena2m11l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Lloverá el domingo? Espero que no. Coge un paraguas, por si acaso.\",\"answers\":[\"Will it rain on Sunday? I hope not. Take an umbrella, just in case.\",\"Will it rain on Sunday? I hope not! Take an umbrella, just in case.\"],\"hints\":[\"La respuesta corta con not · el aviso termina en «just in case»\",\"Will it rain on Sunday? I hope n… Take an umbrella, j… in case.\"],\"itemIds\":[\"ena2m11ihopeso\",\"ena2m11takeanumbrella\",\"ena2m11willitbecold\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-8\",\"book\":\"I hope so.\",\"real\":\"Fingers crossed!\",\"meaning\":\"¡A ver si hay suerte! / ¡Crucemos los dedos!\",\"when\":\"Con amigos y compañeros, para desear que algo salga bien: el tiempo, una entrevista, un tren que llega. Se dice y se hace el gesto a la vez. Por escrito aparece en mensajes, nunca en un email de examen: ahí escribe «I hope so» o «Let's hope so».\",\"register\":\"amigos\",\"note\":\"En Reino Unido se cruzan dos dedos de la misma mano; el gesto español de tocar madera no se usa.\",\"sound\":\"FING-gas̬ KROST\",\"level\":\"a2\",\"itemId\":\"ena2m11ihopeso\"}}],\"resources\":[{\"label\":\"British Council — A2 Listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Busca cualquier audio donde alguien quede con alguien y cuenta las veces que sale un «if» o un «hope». En una conversación de plan no baja de tres.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"]
