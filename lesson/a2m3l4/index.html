estion\":\"Als Kind ___ ich nicht schwimmen — meine Eltern haben Nein gesagt.\",\"options\":[\"durfte\",\"konnte\"],\"answer\":0,\"whyWrong\":[null,\"konnte diría que no SABÍAS nadar — aquí los padres dijeron que no: permiso → durfte\"],\"itemIds\":[\"a2m3durfte\",\"a2m3konnte\",\"eltern\",\"schwimmen\"],\"tip\":\"¿Quién decide? Si deciden otros (padres, ley, cartel) → dürfen. Si decide tu habilidad → können.\"},{\"id\":\"a2m3l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡sin Umlaut!\",\"text\":\"Ich ___ nicht lange fernsehen. (me dejaban)\",\"answers\":[\"durfte\"],\"translation\":\"No me dejaban ver la tele mucho rato.\",\"hints\":[\"dürfen en pasado pierde el Umlaut\",\"d-u-r-f-t-e\"],\"itemIds\":[\"a2m3durfte\",\"a2m3ichdurftenicht\",\"a2m3lange\",\"a2m3fernsehen\"],\"tip\":\"dürfen → durfte: mismo truco que können → konnte y müssen → musste. En pasado, cero Umlauts.\"},{\"id\":\"a2m3l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa el presente — ¡aquí el Umlaut SÍ va!\",\"text\":\"Kinder ___ hier nicht schwimmen. (tienen permiso)\",\"answers\":[\"dürfen\"],\"translation\":\"Los niños no pueden (no está permitido) nadar aquí.\",\"hints\":[\"El cartel de la piscina habla en presente\",\"d-ü-r-f-e-n, con Umlaut\"],\"itemIds\":[\"a2m3duerfen\",\"kind\",\"schwimmen\"],\"strictUmlaut\":true,\"tip\":\"Presente con Umlaut (dürfen), pasado sin (durften). «durfen» no existe en ningún tiempo.\"},{\"id\":\"a2m3l4e6\",\"type\":\"transform\",\"prompt\":\"Transforma: del presente al recuerdo\",\"source\":\"Ich darf nicht lange fernsehen.\",\"instruction\":\"Ponla en Präteritum\",\"answers\":[\"Ich durfte nicht lange fernsehen\",\"Ich durfte nicht lange fernsehen.\"],\"translation\":\"No me dejaban ver la tele mucho rato.\",\"hints\":[\"darf → durfte, el resto no se toca\",\"Sin Umlaut: durfte\"],\"itemIds\":[\"a2m3ichdurftenicht\",\"a2m3durfte\",\"a2m3fernsehen\"],\"tip\":\"darf → durfte y la queja del niño se convierte en anécdota de adulto.\"},{\"id\":\"a2m3l4e7\",\"type\
