 you \u003cb\u003edidn't\u003c/b\u003e lend him the money.\u003c/i\u003e \u003cb\u003ePasado\u003c/b\u003e, aunque hables del futuro — otra vez el pasado irreal del módulo. ❌ \u003ci\u003eI'd rather you don't lend him…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ehad better\u003c/b\u003e = más te vale. Es una advertencia, no un consejo suave: dice que si no lo haces, habrá consecuencias.\u003cbr/\u003e\u003ci\u003eYou'\u003cb\u003ed better\u003c/b\u003e keep the receipt.\u003c/i\u003e Detrás va infinitivo \u003cb\u003esin «to»\u003c/b\u003e: ❌ \u003ci\u003eYou'd better to keep it.\u003c/i\u003e Y casi siempre se contrae en \u003ci\u003e'd\u003c/i\u003e; mucha gente se come hasta eso: \u003ci\u003eBetter keep the receipt\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos cuatro conectores del módulo\u003c/b\u003e, todos verificados como B1:\u003cbr/\u003e· \u003cb\u003ethough\u003c/b\u003e al FINAL de la frase = «eso sí». Es de lo más británico que hay: \u003ci\u003eIt's a bit dear, \u003cb\u003ethough\u003c/b\u003e.\u003c/i\u003e No lleva coma detrás porque cierra.\u003cbr/\u003e· \u003cb\u003ein spite of\u003c/b\u003e + sustantivo o -ing = a pesar de. ❌ \u003ci\u003eIn spite the price\u003c/i\u003e: el «of» va siempre. Y ❌ \u003ci\u003eDespite of\u003c/i\u003e: ese, al revés, no lo lleva nunca.\u003cbr/\u003e· \u003cb\u003ein addition\u003c/b\u003e = además. Abre frase, con coma.\u003cbr/\u003e· \u003cb\u003eon the other hand\u003c/b\u003e = por otro lado. Marca el segundo platillo de la balanza. ❌ \u003ci\u003eAt the other hand\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY un aviso de nivel: \u003cb\u003ewhereas\u003c/b\u003e, \u003cb\u003emoreover\u003c/b\u003e, \u003cb\u003efurthermore\u003c/b\u003e y \u003cb\u003eas a result\u003c/b\u003e los verás en listas de «conectores B1» por internet. \u003cb\u003eNo lo son\u003c/b\u003e: el English Vocabulary Profile los coloca en B2. Los tuyos son estos cuatro y los que ya traes."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l8\",\"phaseId\":\"enb1m5\",\"title\":\"Would you rather?\",\"subtitle\":\"Preferir, advertir y matizar — y la carta a Emma con tres conectores\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preferir, advertir, matizar\",\"itemIds\":[\"enb1m5wouldratheryou\",\"enb1m5youdbetter\",\"enb1m5though\",\"enb1m5inspiteof\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos fórmulas raras y cuatro conectores que sostienen 120 palabras\",\"body\":\"$17\",\"table\":[[\"Fórmula\",\"Qué va detrás\",\"Ejemplo\"],[\"I'd rather\",\"infinitivo SIN to\",\"I'd rather work mornings.\"],[\"I'd rather you\",\"PASADO\",\"I'd rather you didn't.\"],[\"You'd better\",\"infinitivo SIN to\",\"You'd better keep it.\"],[\"In spite of\",\"sustantivo o -ing\",\"In spite of the price…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cinco piezas\",\"pairs\":[{\"target\":\"I'd rather you didn't lend him the money.\",\"source\":\"Preferiría que no le prestaras el dinero.\"},{\"target\":\"You'd better keep the receipt.\",\"source\":\"Más te vale guardar el tique.\"},{\"target\":\"In spite of the price, I bought it.\",\"source\":\"A pesar del precio, lo compré.\"},{\"target\":\"In addition, the delivery is free.\",\"source\":\"Además, el envío es gratis.\"},{\"target\":\"On the other hand, it's cheaper online.\",\"source\":\"Por otro lado, por internet es más barato.\"}],\"itemIds\":[\"enb1m5wouldratheryou\",\"enb1m5youdbetter\",\"enb1m5inspiteof\",\"enb1m4inaddition\",\"enb1m4ontheotherhand\"],\"tip\":\"Las dos primeras son fórmulas de aviso; las tres últimas son la maquinaria de un texto de 120 palabras. Sin ellas, un B1 escribe frases sueltas pegadas con «and».\"},{\"id\":\"enb1m5l8e2\",\"type\":\"mc\",\"prompt\":\"Lo que va detrás de «would rather»\",\"question\":\"«Prefiero trabajar por las mañanas» →\",\"options\":[\"I'd rather to work mornings.\",\"I'd rather work mornings.\",\"I'd rather working mornings.\"],\"answer\":1,\"whyWrong\":[\"Detrás de «would rather» no va «to». Es el mismo caso que «You'd better go».\",null,\"Tampoco -ing: es infinitivo pelado.\"],\"itemIds\":[\"enb1m2wouldrather\"],\"tip\":\"Grupo cerrado y cortito: would rather, had better y los modales llevan infinitivo SIN «to». Con «prefer», en cambio, sí: «I prefer to work mornings».\"},{\"id\":\"enb1m5l8e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"You'd better to keep the receipt.\",\"answers\":[\"You'd better keep the receipt.\"],\"why\":\"Sobra el «to». «Had better» funciona como un modal: lo que viene detrás es infinitivo pelado, igual que con «you should go» o «you must wait».\",\"translation\":\"Más te vale guardar el tique.\",\"itemIds\":[\"enb1m5youdbetter\"]},{\"id\":\"enb1m5l8e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"In spite the price, I bought it.\",\"answers\":[\"In spite of the price, I bought it.\"],\"why\":\"«In spite» siempre lleva «of» detrás. Y su gemelo «despite» no lo lleva nunca: «Despite the price». Es justo al revés de lo que dice el oído.\",\"translation\":\"A pesar del precio, lo compré.\",\"itemIds\":[\"enb1m5inspiteof\",\"enb1m1despite\"]},{\"id\":\"enb1m5l8e5\",\"type\":\"transform\",\"prompt\":\"De «prefiero» a la fórmula del nivel\",\"source\":\"I prefer to work mornings.\",\"instruction\":\"Dilo con «would rather»\",\"answers\":[\"I'd rather work mornings\",\"I would rather work mornings\"],\"translation\":\"Prefiero trabajar por las mañanas.\",\"hints\":[\"Y sin «to» detrás\",\"I'd rather ... mornings\"],\"itemIds\":[\"enb1m2wouldrather\"],\"tip\":\"Las dos son correctas y dicen lo mismo. «Would rather» es más de conversación y más de examen oral; «prefer», más de formulario.\"},{\"id\":\"enb1m5l8e6\",\"type\":\"cloze\",\"prompt\":\"Completa el «eso sí» británico\",\"text\":\"It's a lovely jacket. It's a bit dear, ___.\",\"answers\":[\"though\"],\"translation\":\"Es una cazadora preciosa. Eso sí, es un poco cara.\",\"hints\":[\"Seis letras, y va al final de la frase\",\"Se parece a «although» sin el principio\"],\"itemIds\":[\"enb1m5though\"],\"tip\":\"«though» al final es un «pero» pospuesto, y suena muy natural. Nunca puede ir «although» ahí: esa abre frase y no la cierra jamás.\"},{\"id\":\"enb1m5l8e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que Valeria le cuenta a Amy\",\"text\":\"I found the jacket in a charity shop. ___ of the price, I took it: it's exactly what I wanted. ___, the lining is silk, which you never get at that price. It's a bit big, ___. ___ the other hand, I can have it taken in for a tenner.\",\"answers\":[\"In spite\",\"In addition\",\"though\",\"On\"],\"bank\":[\"In spite\",\"In addition\",\"though\",\"On\",\"Despite\",\"Instead\",\"At\",\"even\"],\"translation\":\"Encontré la cazadora en una tienda solidaria. A pesar del precio me la llevé: es exactamente lo que quería. Además, el forro es de seda, cosa que no se ve a ese precio. Eso sí, me queda un poco grande. Por otro lado, me la pueden meter por diez libras.\",\"itemIds\":[\"enb1m5inspiteof\",\"enb1m4inaddition\",\"enb1m5though\",\"enb1m4ontheotherhand\"],\"tip\":\"Cuatro conectores en cinco líneas y ni uno repetido. Eso es exactamente lo que mide el criterio de Organisation, y es lo más barato de subir de toda la rúbrica.\"},{\"id\":\"enb1m5l8e8\",\"type\":\"bucket\",\"prompt\":\"¿Este conector contrasta o suma?\",\"categories\":[\"CONTRASTE — va en la otra dirección\",\"SUMA — va en la misma dirección\"],\"items\":[{\"text\":\"In spite of the price, I bought it.\",\"bucket\":0},{\"text\":\"It's a bit dear, though.\",\"bucket\":0},{\"text\":\"On the other hand, it's cheaper online.\",\"bucket\":0},{\"text\":\"In addition, the delivery is free.\",\"bucket\":1},{\"text\":\"Besides, the shop is round the corner.\",\"bucket\":1},{\"text\":\"It's a bargain, and it's still under warranty.\",\"bucket\":1}],\"itemIds\":[\"enb1m5inspiteof\",\"enb1m5though\",\"enb1m4ontheotherhand\",\"enb1m4inaddition\",\"enb1m1besides\",\"enb1m5underwarranty\"],\"tip\":\"Saber en qué dirección empuja cada conector es la mitad del Reading Part 1: los huecos de cohesión se resuelven mirando si la frase de después confirma o desmiente la de antes.\"},{\"id\":\"enb1m5l8e9\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, se ha metido en un crédito a plazos y te pide opinión. Contéstale tratando LAS TRES cosas, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! Right, I've done something daft. I've bought a bike on instalments, £28 a month for two years, and I've just worked out that's nearly £700 for a bike that costs £450 new. Can I get out of it?? And are we still on for the weekend in February? I'm skint till payday but I can do cheap.\"},\"bullets\":[\"Dile qué harías tú en su lugar.\",\"Dale un consejo concreto sobre el crédito, con un conector de contraste.\",\"Contéstale a lo del fin de semana y propón un plan barato.\"],\"checks\":[{\"re\":\"(if i were you|i'?d |i would)\",\"label\":\"Le dices qué harías tú en su lugar\"},{\"re\":\"(though|in spite of|on the other hand|although)\",\"label\":\"El consejo lleva un conector de contraste\"},{\"re\":\"(weekend|february|we could|why don'?t we|let'?s)\",\"label\":\"Contestas a lo del fin de semana con un plan\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea que la tranquilice\",\"Punto 1 — tu consejo: «If I were you, I'd…»\",\"Punto 2 — el crédito, con contraste: «…, though…» / «On the other hand, …»\",\"Un plan B por si lo primero no sale: «If the fee is huge, …»\",\"Punto 3 — el finde: «Anyway, of course we're still on for February!» + un plan concreto\",\"Tu nombre a secas. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"though\",\"in spite of\",\"in addition\",\"on the other hand\",\"anyway\",\"at least\",\"actually\",\"besides\",\"otherwise\",\"of course\",\"apart from\",\"all in all\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nDon't beat yourself up, I've done worse. If I were you, I'd ring them first thing and ask exactly what it costs to pay the whole thing off now. A lot of these agreements let you do that, though they never put it on the front page. It's called settling early, and it's worth asking about. On the other hand, if the fee is huge, keep paying and cancel something else instead. Anyway, of course we're still on for February! I'm skint too, so let's do a cheap one: your sofa, my cooking and a long walk. At least the walking is free.\\nValeria\",\"itemIds\":[\"enb1m5ifiwereyou\",\"enb1m5though\",\"enb1m4ontheotherhand\",\"enb1m5ininstalments\",\"enb1m5natskint\",\"enb1m5worthit\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo — cuatro conectores distintos (though, On the other hand, Anyway, At least) y ni un «Yours sincerely». Meter la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m5l8e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Preferiría que no le prestaras el dinero.\",\"answers\":[\"I'd rather you didn't lend him the money\",\"I would rather you didn't lend him the money\",\"I'd rather you didn't lend her the money\"],\"hints\":[\"Detrás de «I'd rather you» va pasado, aunque hables del futuro\",\"I'd rather you ... lend him the money\"],\"itemIds\":[\"enb1m5wouldratheryou\",\"enb1m5couldyoulendme\"],\"tip\":\"Es el pasado irreal otra vez, en su tercer disfraz del módulo: condicional, wish y ahora would rather. Una sola pieza para tres usos.\"},{\"id\":\"enb1m5l8e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el matiz británico al final de la frase\",\"text\":\"It's a lovely jacket. It's a bit dear, though. I'd rather wait for the sales.\",\"phonetic\":\"its a LÁV-li DCHÁ-kit. its a bit DÍA, dóu. aid RAA-da uéit fo de séils̬\",\"translation\":\"Es una cazadora preciosa. Eso sí, es un poco cara. Prefiero esperar a las rebajas.\",\"itemIds\":[\"enb1m5though\",\"enb1m2wouldrather\"],\"tip\":\"Ese «though» final se dice flojito y bajando, casi de propina. Si lo dices con fuerza, suena a que le llevas la contraria a alguien; dicho suave, es solo un matiz.\"},{\"id\":\"enb1m5l8e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"You'd better keep the receipt.\",\"translation\":\"Más te vale guardar el tique.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «You had»\",\"You'd better ... the receipt\"],\"itemIds\":[\"enb1m5youdbetter\",\"ena2m7thereceipt\"],\"tip\":\"«You'd» aquí es «you had», no «you would». Y suena a una sola sílaba: «yud». Por eso mucha gente lo oye y escribe «You better», que es como se dice de verdad en la calle.\"},{\"id\":\"enb1m5l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy y Ben discuten un préstamo entre amigos. Aquí, una sola escucha — el examen te dará dos. Toma notas: hay dos opiniones y no son la misma.\",\"notepad\":true,\"audio\":\"He's asked me for two hundred until the end of the month.|And are you going to?|I think so. He's good for it. He paid me back last time.|Look, I'd rather you didn't. Not because of him. Because of what happens if he can't, and then you're the one who has to bring it up every time you see him.|He'd pay me back.|Probably. In spite of that, you'd better decide now what you'll do if he doesn't, because you won't decide it calmly in six weeks. If two hundred pounds would end the friendship, don't lend it. If you can lose it and still be fine, then fine, lend it.|That's quite harsh.|It's not harsh. It's the only way anybody lends money to a friend and stays friends.\",\"question\":\"¿Cuál es el consejo de la segunda voz?\",\"options\":[\"Que decida ya qué hará si él no le devuelve el dinero\",\"Que no le preste nunca dinero a un amigo\",\"Que le preste solo la mitad de lo que le pide\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice lo contrario al final: «If you can lose it and still be fine, then fine, lend it».\",\"De partir la cantidad no habla nadie.\"],\"itemIds\":[\"enb1m5wouldratheryou\",\"enb1m5youdbetter\",\"enb1m5inspiteof\",\"enb1m5couldyoulendme\"],\"tip\":\"Todo el módulo en un minuto: «I'd rather you didn't», «you'd better decide», «In spite of that» y dos condicionales seguidos. Cuando el examen pregunta «what does the speaker advise?», la respuesta va casi siempre detrás de una de estas fórmulas.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Writing (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Compara tu carta con la Tarea 2 oficial: 100-120 palabras, carta a un amigo y DOS funciones que cumplir. Cuenta las palabras a mano una vez: te calibra para siempre.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\
