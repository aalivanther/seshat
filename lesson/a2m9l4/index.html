",\"title\":\"La fiesta de Anna y sus preparativos\",\"itemIds\":[\"a2m9annasparty\",\"a2m9wassollichmitbringen\",\"a2m9mitbringen\",\"a2m9vorbereiten\",\"a2m9sollen\",\"a2m9gast\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: Annas Party — el -s del dueño, SIN apóstrofo\",\"body\":\"Para decir «la fiesta de Anna», el alemán pega una \u003cb\u003e-s\u003c/b\u003e al nombre y lo pone delante: \u003cb\u003eAnnas Party\u003c/b\u003e · \u003cb\u003eNicos Kuchen\u003c/b\u003e · \u003cb\u003eLeos Musik\u003c/b\u003e. Es el \u003cb\u003egenitivo\u003c/b\u003e de los nombres propios — y a diferencia del inglés (Anna's), va \u003cb\u003eSIN apóstrofo\u003c/b\u003e: Annas, no «Anna's». Única excepción: los nombres que ya terminan en -s marcan el genitivo solo con apóstrofo — Carlos' Party, Hans' Auto. Funciona con personas: para las cosas se usa von (die Tür von der Wohnung). Segunda pieza de la lección: organizar. \u003cb\u003emitbringen\u003c/b\u003e (traer algo consigo) y \u003cb\u003evorbereiten\u003c/b\u003e (preparar) son separables — \u003ci\u003eIch bringe einen Salat \u003cb\u003emit\u003c/b\u003e · Ich bereite die Party \u003cb\u003evor\u003c/b\u003e\u003c/i\u003e. Y la pregunta estrella de todo invitado (der \u003cb\u003eGast\u003c/b\u003e, die Gäste): \u003cb\u003eWas soll ich mitbringen?\u003c/b\u003e — con \u003cb\u003esollen\u003c/b\u003e, el modal de «¿qué quieres que haga?»: pregunta por los deseos del anfitrión, no por los tuyos.\",\"table\":[[\"genitivo -s\",\"significado\"],[\"Annas Party\",\"la fiesta de Anna\"],[\"Nicos Kuchen\",\"el pastel de Nico\"],[\"Leos Musik\",\"la música de Leo\"],[\"Sofias Fotos\",\"las fotos de Sofía\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m9l4e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el genitivo\",\"question\":\"„Annas Party“\",\"options\":[\"la fiesta de Anna\",\"las fiestas de Anna\",\"Anna está de fiesta\"],\"answer\":0,\"whyWrong\":[null,\"El -s no es plural: es el genitivo — marca a la dueña de la fiesta\",\"Eso sería «Anna feiert»\"],\"itemIds\":[\"a2m9annasparty\",\"a2m9party\"],\"tip\":\"Nombre + s + cosa = «la cosa de esa persona». El dueño va delante, como en inglés — pero sin apóstrofo.\"},{\"id\":\"a2m9l4e2\",\"type\":\"mc\",\"prompt\":\"Caza el apóstrofo intruso\",\"question\":\"«el pastel de Nico» →\",\"options\":[\"Nicos Kuchen\",\"Nico's Kuchen\",\"Nicos' Kuchen\"],\"answer\":0,\"whyWrong\":[null,\"El apóstrofo es del inglés — el genitivo alemán pega la -s directamente: Nicos\",\"Ese apóstrofo final tampoco existe aquí: solo Nicos, sin más\"],\"itemIds\":[\"a2m9annasparty\",\"kuchen\"],\"tip\":\"En Alemania verás «Nico's Bar» en algún letrero — pero es un anglicismo. El Duden dice: Nicos, sin apóstrofo.\"},{\"id\":\"a2m9l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa el genitivo\",\"text\":\"Das ist ___ Kuchen. (de Nico)\",\"answers\":[\"Nicos\"],\"translation\":\"Ese es el pastel de Nico.\",\"hints\":[\"El nombre + s, delante de la cosa\",\"N-i-c-o-s, sin apóstrofo\"],\"itemIds\":[\"a2m9annasparty\",\"kuchen\"]},{\"id\":\"a2m9l4e4\",\"type\":\"match\",\"prompt\":\"Empareja los preparativos\",\"pairs\":[{\"target\":\"mitbringen\",\"source\":\"traer (algo consigo)\"},{\"target\":\"vorbereiten\",\"source\":\"preparar\"},{\"target\":\"der Gast\",\"source\":\"el invitado\"},{\"target\":\"Was soll ich mitbringen?\",\"source\":\"¿Qué llevo a la fiesta?\"}],\"itemIds\":[\"a2m9mitbringen\",\"a2m9vorbereiten\",\"a2m9gast\",\"a2m9wassollichmitbringen\"]},{\"id\":\"a2m9l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta del invitado\",\"text\":\"Was ___ ich mitbringen? (debo)\",\"answers\":[\"soll\"],\"translation\":\"¿Qué llevo? (¿qué quieres que traiga?)\",\"hints\":[\"sollen con ich — sin terminación\",\"s-o-l-l\"],\"itemIds\":[\"a2m9wassollichmitbringen\",\"a2m9sollen\",\"a2m9mitbringen\"],\"tip\":\"sollen pregunta por el deseo DEL OTRO: Was soll ich mitbringen? = ¿qué quieres tú que traiga yo? Por eso es LA pregunta del invitado.\"},{\"id\":\"a2m9l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa — ¿dónde va el prefijo?\",\"text\":\"Ich bringe einen Salat ___.\",\"answers\":[\"mit\"],\"translation\":\"Yo llevo una ensalada.\",\"hints\":[\"mitbringen es separable, como einladen\",\"El m-i-t- cierra la frase\"],\"itemIds\":[\"a2m9mitbringen\",\"salat\"],\"tip\":\"La pinza separable otra vez: bringe 2º, mit al final. einladen, mitbringen, vorbereiten — toda la fiesta es separable.\"},{\"id\":\"a2m9l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡ojo con la ä!\",\"text\":\"Die ___ kommen um vier. (invitados)\",\"answers\":[\"Gäste\"],\"translation\":\"Los invitados llegan a las cuatro.\",\"hints\":[\"Plural de der Gast — con Umlaut\",\"G-ä-s-t-e, con mayúscula\"],\"itemIds\":[\"a2m9gast\",\"vier\"],\"strictUmlaut\":true,\"tip\":\"der Gast → die Gäste: el plural con Umlaut, como Apfel → Äpfel. Sin la ä, «Gaste» no existe.\"},{\"id\":\"a2m9l4e8\",\"type\":\"transform\",\"prompt\":\"Transforma: de frase a orden\",\"source\":\"Du bringst den Kuchen mit.\",\"instruction\":\"Dilo en imperativo (du)\",\"answers\":[\"Bring den Kuchen mit!\",\"Bring den Kuchen mit\"],\"translation\":\"¡Trae el pastel!\",\"hints\":[\"Sin du, sin -st — y el mit- sigue al final\",\"Bring ... mit!\"],\"itemIds\":[\"a2m9mitbringen\",\"a2m9komm\",\"kuchen\"],\"tip\":\"Imperativo + separable: Bring abre, mit cierra. Las dos reglas del módulo trabajando juntas.\"},{\"id\":\"a2m9l4e9\",\"type\":\"build\",\"prompt\":\"Construye los preparativos\",\"target\":\"Wir bereiten Annas Party vor\",\"translation\":\"Preparamos la fiesta de Anna\",\"distractors\":[\"Anna\",\"vorbereiten\"],\"itemIds\":[\"a2m9vorbereiten\",\"a2m9annasparty\"],\"tip\":\"Annas con -s (la dueña) y el vor- al final (la pinza separable): las dos piezas nuevas en una frase.\"},{\"id\":\"a2m9l4e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Qué llevo? (¿qué debo traer a la fiesta?)\",\"answers\":[\"Was soll ich mitbringen?\",\"Was soll ich mitbringen\"],\"hints\":[\"sollen 2º, mitbringen entero al final\",\"Was soll ich ...\"],\"itemIds\":[\"a2m9wassollichmitbringen\",\"a2m9sollen\",\"a2m9mitbringen\"],\"tip\":\"La pregunta que todo invitado alemán hace al recibir una Einladung — con ella nunca llegarás con las manos vacías.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «Party planen» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Geburtstag» en el A2: invitados, preparativos y mitbringen en contexto.\"},{\"label\":\"lingua.com — lecturas A2\",\"url\":\"https://lingua.com/german/reading/\",\"note\":\"Los textos de «Geburtstag»: fiestas narradas con genitivos y preparativos como los de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
