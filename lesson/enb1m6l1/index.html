ij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T64a,"])</script><script>self.__next_f.push([1,"Ya sabes que \u003ci\u003emust\u003c/i\u003e obliga y que \u003ci\u003ecan't\u003c/i\u003e prohíbe. Pues bien: los mismos verbos hacen \u003cb\u003eotro trabajo completamente distinto\u003c/b\u003e, y es el que más se cobra en el examen. Cuando no hay nadie mandando nada, \u003ci\u003emust\u003c/i\u003e y \u003ci\u003ecan't\u003c/i\u003e dejan de ser órdenes y pasan a ser \u003cb\u003econclusiones\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escalera, de arriba abajo:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eIt must be\u003c/b\u003e — «tiene que ser». Estoy casi seguro \u003ci\u003eporque lo he deducido\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eIt might / may / could be\u003c/b\u003e — «puede que sea». Es una posibilidad entre varias.\u003cbr/\u003e· \u003cb\u003eIt might not be\u003c/b\u003e — «puede que no sea».\u003cbr/\u003e· \u003cb\u003eIt can't be\u003c/b\u003e — «no puede ser». Estoy casi seguro de que NO.\u003cbr/\u003e\u003cbr/\u003eY aquí está el escalón que se rompe siempre: \u003cb\u003eel contrario de \u003ci\u003emust be\u003c/i\u003e NO es \u003ci\u003emustn't be\u003c/i\u003e\u003c/b\u003e. \u003ci\u003eYou mustn't be late\u003c/i\u003e es una prohibición («no llegues tarde»). Para deducir que algo no es, el inglés usa \u003cb\u003ecan't\u003c/b\u003e: \u003ci\u003eHe can't be at home — his car isn't there\u003c/i\u003e. En español las dos se dicen igual («no puede ser»), y por eso el calco no chirría al oído: chirría en la nota.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDetrás siempre va un infinitivo sin \u003ci\u003eto\u003c/i\u003e:\u003c/b\u003e \u003ci\u003emust \u003cu\u003ebe\u003c/u\u003e\u003c/i\u003e, \u003ci\u003emight \u003cu\u003ebe\u003c/u\u003e\u003c/i\u003e, nunca «must to be». Y si la deducción es sobre algo que está pasando ahora mismo, se alarga: \u003ci\u003eShe must be working\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e¿Por qué abrimos un módulo de salud con esto? Porque un síntoma es exactamente eso: \u003cb\u003eun indicio del que hay que deducir\u003c/b\u003e. Y porque el \u003cb\u003eListening Part 2\u003c/b\u003e del examen no pregunta qué pasó, pregunta cómo se siente quien habla — y eso solo se contesta deduciendo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l1\",\"phaseId\":\"enb1m6\",\"title\":\"It must be something you ate\",\"subtitle\":\"Deducir en inglés: lo que tiene que ser, lo que no puede ser y lo que a lo mejor es\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las tres certezas: la que sí, la que no y la del medio\",\"itemIds\":[\"enb1m6mustbe\",\"enb1m6cantbe\",\"enb1m6mightbe\",\"enb1m6mightnotbe\",\"enb1m6imnotsurewhat\",\"enb1m6symptom\",\"enb1m6rash\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: los mismos modales, otro oficio\",\"body\":\"$17\",\"table\":[[\"Lo que ves\",\"Lo que dices\",\"Cuánta seguridad\"],[\"Su coche no está\",\"He can't be at home.\",\"Casi seguro que NO\"],[\"Lleva tres días con fiebre\",\"It must be the flu.\",\"Casi seguro que SÍ\"],[\"Le ha salido después de la crema\",\"It might be an allergy.\",\"Una posibilidad\"],[\"No sé qué pensar\",\"I'm not sure what it is.\",\"Ninguna\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas de la deducción\",\"pairs\":[{\"target\":\"It must be an allergy.\",\"source\":\"Tiene que ser una alergia.\"},{\"target\":\"That can't be right.\",\"source\":\"Eso no puede ser.\"},{\"target\":\"It might not be serious.\",\"source\":\"Puede que no sea grave.\"},{\"target\":\"a rash\",\"source\":\"un sarpullido\"}],\"itemIds\":[\"enb1m6mightbe\",\"enb1m6cantbe\",\"enb1m6mightnotbe\",\"enb1m6rash\"],\"tip\":\"Fíjate en que las tres primeras llevan «be» a pelo, sin «to». Es la marca de la casa de todos los modales ingleses.\"},{\"id\":\"enb1m6l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — esto ya lo traes puesto\",\"pairs\":[{\"target\":\"doctor\",\"source\":\"médico, médica\"},{\"target\":\"nurse\",\"source\":\"enfermero, enfermera\"},{\"target\":\"hospital\",\"source\":\"hospital\"},{\"target\":\"tired\",\"source\":\"cansado, cansada\"},{\"target\":\"Excuse me\",\"source\":\"Perdone / Disculpe\"}],\"targetSeconds\":22,\"itemIds\":[\"endoctor\",\"ennurse\",\"enhospital\",\"ena2m1tired\",\"enexcuseme\"],\"tip\":\"Cinco palabras que ya tienes desde el A1. El B1 no las cambia: las quiere más rápido y dentro de frases más largas.\"},{\"id\":\"enb1m6l1e3\",\"type\":\"mc\",\"prompt\":\"La deducción negativa\",\"question\":\"«Su coche no está y las luces están apagadas. No puede estar en casa.» →\",\"options\":[\"He can't be at home.\",\"He mustn't be at home.\",\"He doesn't have to be at home.\"],\"answer\":0,\"whyWrong\":[null,\"«mustn't» prohíbe: eso sería «tiene prohibido estar en casa». No es lo que dices.\",\"«doesn't have to» dice que no es obligatorio: «no hace falta que esté en casa». Otra cosa distinta.\"],\"itemIds\":[\"enb1m6cantbe\"],\"tip\":\"Aquí se parte el hispanohablante: en español «no puede estar» sirve para las tres. En inglés, deducir que NO es siempre «can't».\"},{\"id\":\"enb1m6l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Está seguro o solo lo sospecha?\",\"categories\":[\"Casi seguro (must / can't)\",\"Es una posibilidad (might / could / may)\"],\"items\":[{\"text\":\"It must be the flu.\",\"bucket\":0},{\"text\":\"That can't be right.\",\"bucket\":0},{\"text\":\"It might be an allergy.\",\"bucket\":1},{\"text\":\"It could be something you ate.\",\"bucket\":1},{\"text\":\"She must be at the surgery.\",\"bucket\":0},{\"text\":\"It may be nothing.\",\"bucket\":1}],\"itemIds\":[\"enb1m6mustbe\",\"enb1m6cantbe\",\"enb1m6mightbe\"],\"tip\":\"«might», «may» y «could» dicen lo mismo aquí y se pueden intercambiar sin cambiar el sentido. «must» y «can't», no: esos son los dos extremos de la escalera.\"},{\"id\":\"enb1m6l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Cambia UNA palabra.\",\"wrong\":\"That mustn't be right.\",\"answers\":[\"That can't be right.\"],\"why\":\"«mustn't» es prohibición: «no debes». Para deducir que algo NO es, el inglés usa «can't». El español dice «no puede ser» en los dos casos, y de ahí sale el calco.\",\"translation\":\"Eso no puede ser.\",\"itemIds\":[\"enb1m6cantbe\"]},{\"id\":\"enb1m6l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa el modal\",\"text\":\"She isn't answering the phone. She ___ be at the surgery.\",\"answers\":[\"must\"],\"translation\":\"No coge el teléfono. Tiene que estar en el centro de salud.\",\"hints\":[\"No es posibilidad: es la única explicación que encaja\",\"Cuatro letras, y detrás va «be» sin «to»\"],\"itemIds\":[\"enb1m6mustbe\",\"ena2m8thesurgery\"],\"tip\":\"Ojo con «surgery»: no es «cirugía». Es el consultorio del médico de cabecera — el sitio, no la operación.\"},{\"id\":\"enb1m6l1e7\",\"type\":\"build\",\"prompt\":\"Construye la deducción\",\"target\":\"It can't be serious\",\"translation\":\"No puede ser grave\",\"distractors\":[\"mustn't\",\"isn't\"],\"itemIds\":[\"enb1m6cantbe\"],\"tip\":\"Las dos fichas que sobran son las dos que pone un hispanohablante: «mustn't» por calco y «isn't» por miedo al modal.\"},{\"id\":\"enb1m6l1e8\",\"type\":\"transform\",\"prompt\":\"De la certeza a la deducción\",\"source\":\"I'm sure it's an allergy.\",\"instruction\":\"Dilo deduciendo, con «must»\",\"answers\":[\"It must be an allergy\",\"It must be an allergy.\"],\"translation\":\"Tiene que ser una alergia.\",\"hints\":[\"Empieza por «It must…»\",\"It must ... an allergy\"],\"itemIds\":[\"enb1m6mightbe\",\"enb1m6mustbe\"],\"tip\":\"«I'm sure» y «It must be» dicen lo mismo, pero la segunda suena a inglés de nivel y la primera a traducción. En el Speaking, ese cambio se nota en el criterio de rango.\"},{\"id\":\"enb1m6l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación en el rellano\",\"text\":\"«Nora isn't answering. She ___ be out — I'm not sure.» «She ___ be out: her coat is on the hook. She ___ be asleep, then.»\",\"answers\":[\"might\",\"can't\",\"must\"],\"bank\":[\"might\",\"can't\",\"must\",\"should\",\"needn't\",\"mustn't\"],\"translation\":\"«Nora no abre. A lo mejor ha salido, no sé.» «No puede haber salido: el abrigo está en el perchero. Entonces tiene que estar dormida.»\",\"itemIds\":[\"enb1m6mightbe\",\"enb1m6cantbe\",\"enb1m6mustbe\"],\"tip\":\"Los tres huecos son la misma escalera en veinte segundos: posibilidad, descarte y conclusión. Y el indicio siempre va detrás, con dos puntos o con un guion: es así como se argumenta una deducción en inglés.\"},{\"id\":\"enb1m6l1e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Puede que no sea grave.\",\"answers\":[\"It might not be serious\",\"It may not be serious\",\"It might not be anything serious\",\"It may not be anything serious\"],\"hint\":\"Empieza por «It» y mete la negación entre el modal y «be»\",\"itemIds\":[\"enb1m6mightnotbe\"],\"tip\":\"«It might not be» — la negación va pegada al modal, no al verbo. «It doesn't might be» no existe: los modales no llevan «do» nunca.\"},{\"id\":\"enb1m6l1e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"It must be something you ate.\",\"answers\":[\"Tiene que ser algo que has comido\",\"Debe de ser algo que comiste\",\"Seguro que es algo que has comido\"],\"itemIds\":[\"enb1m6mustbe\"],\"tip\":\"En español culto la deducción es «debe DE ser» y la obligación es «debe ser». El inglés no tiene esa preposición: usa el mismo «must» y lo desambigua el contexto.\"},{\"id\":\"enb1m6l1e12\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"It might be an allergy.\",\"translation\":\"Puede que sea una alergia.\",\"hints\":[\"Empieza por «It»\",\"It might ... an allergy\"],\"itemIds\":[\"enb1m6mightbe\"],\"tip\":\"La «t» de «might» casi desaparece delante de «be»: suena «mai-bi», peligrosamente parecido a «maybe». Y no es casualidad — son primos.\"},{\"id\":\"enb1m6l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"Let me have a look. Right — when did that come up?|Yesterday morning. It was fine on Saturday.|And you've not changed anything? Washing powder, soap, a new cream?|I did start a new hand cream on Friday, actually.|Then that's your answer. It can't be the tablets, you've been on those for months. It must be the cream. Stop using it and if it's not gone by Wednesday, ring the surgery.\",\"question\":\"¿Qué concluye Amy?\",\"options\":[\"Que la culpa es de la crema nueva\",\"Que la culpa es de las pastillas\",\"Que hay que ir a urgencias hoy\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las descarta con un «can't»: «It can't be the tablets, you've been on those for months».\",\"De urgencias no dice nada: dice que llame al centro de salud el miércoles si sigue igual.\"],\"itemIds\":[\"enb1m6cantbe\",\"enb1m6mustbe\",\"enb1m6rash\"],\"tip\":\"Escucha cómo razona: descarta con «can't» y concluye con «must». Ese par es la firma del razonamiento en inglés, y el examen lo usa como pista de quién tiene razón.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m6-1\",\"book\":\"I am ill.\",\"real\":\"I'm not feeling too great.\",\"meaning\":\"No me encuentro muy allá\",\"when\":\"Hablando, con quien sea. El británico casi nunca dice «I am ill» de sí mismo: suena grave y un poco dramático. Se quita hierro con una negación floja. En el Writing y en el Sprechen del examen, la versión
