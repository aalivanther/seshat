 En medio de la frase se encoge: \u003ci\u003eIt was great\u003c/i\u003e → «it uos̬ GRÉIT», con la vocal comida.\u003cbr/\u003e\u003cb\u003ewere\u003c/b\u003e se encoge todavía más: casi solo queda una «ua» — \u003ci\u003eWe were tired\u003c/i\u003e → «ui ua TÁI-ad». Por eso \u003cb\u003ewe are\u003c/b\u003e y \u003cb\u003ewe were\u003c/b\u003e se parecen tanto: toda la diferencia está en una vocal pequeñísima.\u003cbr/\u003e\u003cbr/\u003eEstrategia de examen, y es la de verdad: \u003cb\u003eno persigas el auxiliar, persigue el marcador\u003c/b\u003e. Si oyes \u003ci\u003eyesterday\u003c/i\u003e, \u003ci\u003elast night\u003c/i\u003e o \u003ci\u003eon Saturday\u003c/i\u003e, ya sabes que la frase va en pasado aunque el was se te haya escapado.\u003cbr/\u003e\u003cbr/\u003eY el ritual con el que empieza el lunes en Londres son \u003cb\u003edos preguntas distintas\u003c/b\u003e, y cada una pide lo suyo:\u003cbr/\u003e· [[How was your weekend?|¿Qué tal el fin de semana?]] pregunta \u003cb\u003equé tal estuvo\u003c/b\u003e → \u003ci\u003eNot bad. · Yeah, good. · It was lovely.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eWhat did you do?\u003c/i\u003e pregunta \u003cb\u003equé hiciste\u003c/b\u003e → ahí sí: [[Not much.|Poca cosa.]]\u003cbr/\u003eContestar \u003ci\u003eNot much\u003c/i\u003e a \u003ci\u003eHow was it?\u003c/i\u003e es responder a otra pregunta. Y después de contestar, \u003cb\u003edevuelve el turno\u003c/b\u003e: \u003ci\u003eHow about you?\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m1l7\",\"phaseId\":\"ena2m1\",\"title\":\"Oído real: How was your weekend?\",\"subtitle\":\"was y were se esconden — y sin ellos no se oye el pasado\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El ritual del lunes por la mañana\",\"itemIds\":[\"ena2m1howwasyourweekend\",\"ena2m1notmuch\",\"ena2m1wasitgood\",\"ena2m1weweretired\",\"enitwasgreat\",\"enwherewereyou\"]},{\"kind\":\"note\",\"note\":{ m1l7e4\",\"type\":\"audiomc\",\"prompt\":\"La negación que decide la respuesta — 2 escuchas\",\"audio\":\"There weren't any tickets and we watched a film at home.\",\"question\":\"¿Qué hicieron?\",\"options\":[\"Ver una película en casa\",\"Ir al concierto\",\"Comprar entradas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El concierto se cae: no había entradas\",\"tickets suena, pero con weren't delante\"],\"itemIds\":[\"ena2m1therewasnt\",\"ena2m1shewatchedafilm\",\"enticket\"],\"tip\":\"weren't lleva una t final clarísima, mucho más audible que el were suelto. En negativo, el inglés se oye mejor.\"},{\"id\":\"ena2m1l7e5\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La pregunta del lunes\",\"book\":\"Was it good?\",\"real\":\"Was it any good?\",\"translation\":\"¿Estuvo bien?\",\"itemIds\":[\"ena2m1wasitgood\"],\"tip\":\"«any good» no añade significado: añade duda amable. Se usa muchísimo para preguntar por una peli, un restaurante o un concierto.\"},{\"id\":\"ena2m1l7e6\",\"type\":\"hearreal\",\"prompt\":\"¿Qué significa lo que has oído?\",\"book\":\"It was not very good.\",\"real\":\"It wasn't great.\",\"translation\":\"No estuvo muy bien.\",\"ask\":\"meaning\",\"meaningOptions\":[\"No estuvo muy bien\",\"Estuvo genial\",\"No lo sé\"],\"itemIds\":[\"enitwasgreat\",\"ena2m1wasitgood\"],\"tip\":\"Los británicos rebajan en vez de criticar: «It wasn't great» quiere decir «fue bastante malo». Entender ese rodeo es entender el país.\"},{\"id\":\"ena2m1l7e7\",\"type\":\"listen\",\"prompt\":\"Dictado — el were átono, escrito entero\",\"text\":\"We were really tired on Sunday.\",\"translation\":\"El domingo estábamos agotadas.\",\"hints\":[\"Suena «ui ua…», pero se escribe entero\",\"We w… really tired on Sunday.\"],\"itemIds\":[\"ena2m1weweretired\",\"ena2m1tired\"],\"tip\":\"Lo que se encoge al hablar se escribe completo. Esa distancia entre lo que suena y lo que se escribe es medio Listening del examen.\"},{\"id\":\"ena2m1l7e8\",\"type\":\"listen\",\"prompt\":\"Dictado — con la contracción tal cual suena\",\"text\":\"There wasn't any music at the party.\",\"translation\":\"No había música en la fiesta.\",\"strictContractions\":true,\"hints\":[\"La contracción es lo que sonó: no la deshagas\",\"There w…'t any music at the party.\"],\"itemIds\":[\"ena2m1therewasnt\"],\"tip\":\"Aquí «there was not» no vale: un dictado se corrige por lo que sonó, y sonó wasn't.\"},{\"id\":\"ena2m1l7e9\",\"type\":\"mc\",\"prompt\":\"La fórmula del lunes\",\"question\":\"«Not much.» es la respuesta de todos los lunes. ¿A cuál de las dos preguntas contesta?\",\"options\":[\"What did you do at the weekend?\",\"How was your weekend?\",\"A las dos igual.\"],\"answer\":0,\"whyWrong\":[null,\"Esa pregunta es «qué tal estuvo», y se contesta con «Not bad» o «Yeah, good». «Not much» estaría contestando a otra cosa.\",\"No: una pregunta por qué HICISTE y la otra por qué TAL estuvo. Es el fallo clásico del lunes.\"],\"itemIds\":[\"ena2m1notmuch\"],\"tip\":\"Guárdate las dos: «Not much» para lo que hiciste, «Not bad» para qué tal fue. Y después de contestar, devuelve la pregunta: «How about you?»\"},{\"id\":\"ena2m1l7e10\",\"type\":\"shadow\",\"prompt\":\"Sombrea el ritual entero\",\"text\":\"Not much, really. I worked on Saturday and I was very tired.\",\"phonetic\":\"not MACH, RÍA-li. ái UÉEKT on SÁ-ta-dei and ái uos̬ VE-ri TÁI-ad\",\"translation\":\"Poca cosa. Trabajé el sábado y acabé agotada.\",\"reps\":2,\"itemIds\":[\"ena2m1notmuch\",\"ena2m1iworked\",\"ena2m1tired\"],\"tip\":\"Fíjate en el contraste: worked suena fuerte y was casi no suena. Copia ese desnivel y ya hablas con ritmo inglés.\"},{\"id\":\"ena2m1l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Qué tal el fin de semana? — No estuvo mal. Trabajé el sábado.\",\"answers\":[\"How was your weekend? Not bad. I worked on Saturday.\",\"How was your weekend? Not bad, I worked on Saturday.\",\"How was your weekend? - Not bad. I worked on Saturday.\"],\"hints\":[\"La
