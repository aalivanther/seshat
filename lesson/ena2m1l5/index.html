3cu\u003et\u003c/u\u003e\u003c/i\u003e, \u003ci\u003ehelp\u003cu\u003et\u003c/u\u003e\u003c/i\u003e, \u003ci\u003eask\u003cu\u003et\u003c/u\u003e\u003c/i\u003e, \u003ci\u003earriv\u003cu\u003ed\u003c/u\u003e\u003c/i\u003e. El español \u003cb\u003eno hace eso jamás\u003c/b\u003e: nuestras palabras acaban en vocal o en una sola consonante amable (-n, -s, -r, -l). Cuando la boca se encuentra con /kt/ o /skt/, hace lo único que sabe: \u003cb\u003emete una vocal de apoyo\u003c/b\u003e y sale «uor-KED», «as-KED». Ahí se ha perdido la /t/ final, y con ella el pasado.\u003cbr/\u003e\u003cbr/\u003eNo es una manía tuya: le pasa a casi todo el que llega desde el español, y el motivo es la boca, no el oído. La /ɪd/ se acierta desde el primer día porque añade una sílaba; la /t/ y la /d/ se caen una y otra vez porque piden un final que en español no existe. Así que reparte el esfuerzo en consecuencia: \u003cb\u003ecasi todo el tiempo a /t/ y /d/; a /ɪd/, un repaso y a otra cosa\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se entrena, en dos gestos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eNo añadas una -e.\u003c/b\u003e «worked» tiene UNA sílaba. Di \u003ci\u003ework\u003c/i\u003e entero y cierra con la punta de la lengua: \u003ci\u003euéekt\u003c/i\u003e.\u003cbr/\u003e2. \u003cb\u003eEmpújala hacia la palabra siguiente.\u003c/b\u003e En \u003ci\u003eI worked all day\u003c/i\u003e la t no se queda sola: se pega a \u003ci\u003eall\u003c/i\u003e y suena \u003ci\u003euéek-tool\u003c/i\u003e. Ese enlace es lo que hace que suene inglés — y de paso te la salva.\u003cbr/\u003e\u003cbr/\u003eY el porqué de tanta insistencia: \u003cb\u003eesa consonante ES la gramática\u003c/b\u003e. Si te la comes, el examinador no ha oído un pasado, ha oído un presente mal dicho. Vas a usar esta clínica durante los once módulos que quedan."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m1l5\",\"phaseId\":\"ena2m1\",\"title\":\"Clínica de sonido: -ed\",\"subtitle\":\"Una letra, tres sonidos — y no cuestan lo mismo ni de lejos\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los seis verbos de la clínica\",\"itemIds\":[\"ena2m1wanted\",\"ena2m1decided\",\"ena2m1asked\",\"ena2m1helped\",\"ena2m1listened\",\"ena2m1phoned\",\"endanced\",\"enplayed\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La -ed se escribe igual y suena de tres maneras\",\"body\":\"Se escribe \u003cb\u003e-ed\u003c/b\u003e siempre. Suena de tres formas, y cuál sale \u003cb\u003eno lo eliges tú\u003c/b\u003e: lo decide el último sonido del infinitivo. La buena noticia es que no hay que memorizar listas — la boca lo hace sola en cuanto lo has oído unas cuantas veces.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e/ɪd/ — una sílaba nueva.\u003c/b\u003e Sale detrás de \u003cb\u003et\u003c/b\u003e o \u003cb\u003ed\u003c/b\u003e: [[wanted|quiso]] es UÓN-tid, [[decided|decidió]] es di-SÁI-did, visited es VÍ-s̬i-tid, started es STAA-tid. Dos sílabas pasan a tres.\u003cbr/\u003e\u003cb\u003e/t/ — sin sílaba nueva.\u003c/b\u003e Detrás de sonido sordo (k, p, s, sh, ch, f): worked = uéekt, helped = jelpt, [[asked|preguntó]] = aaskt, missed = mist, watched = uócht.\u003cbr/\u003e\u003cb\u003e/d/ — sin sílaba nueva.\u003c/b\u003e Detrás de todo lo demás (vocales, l, n, r, v, m, g): played = pléid, [[listened|escuchó]] = LÍ-send, arrived = a-RÁIVD, [[phoned|llamó]] = fóund, rained = réind.\",\"table\":[[\"si el infinitivo acaba en…\",\"la -ed suena\",\"ejemplos\"],[\"t o d\",\"/ɪd/ — sílaba nueva\",\"wanted · decided · visited · started\"],[\"sonido sordo: k p s sh ch f\",\"/t/ — pegada, sin sílaba\",\"worked · helped · asked · missed · watched\"],[\"todo lo demás\",\"/d/ — pegada, sin sílaba\",\"played · listened · arrived · phoned · rained\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y ahora lo importante: estas tres NO cuestan lo mismo\",\"body\":\"$17\",\"table\":[[\"sonido\",\"coste para ti\",\"por qué\",\"cuánto entrenar\"],[\"/ɪd/ (wanted)\",\"barato\",\"añade sílaba, que es lo que el español hace de serie\",\"un repaso y a otra cosa\"],[\"/t/ (worked)\",\"caro\",\"cierre de 2-3 consonantes sin vocal detrás: prohibido en español\",\"todos los días\"],[\"/d/ (played)\",\"caro\",\"lo mismo, con la garganta vibrando\",\"todos los días\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l5e1\",\"type\":\"bucket\",\"prompt\":\"¿La -ed añade una sílaba o no?\",\"categories\":[\"+1 sílaba: /ɪd/\",\"misma sílaba: /t/ o /d/\"],\"items\":[{\"text\":\"wanted\",\"bucket\":0},{\"text\":\"worked\",\"bucket\":1},{\"text\":\"decided\",\"bucket\":0},{\"text\":\"played\",\"bucket\":1},{\"text\":\"visited\",\"bucket\":0},{\"text\":\"listened\",\"bucket\":1},{\"text\":\"started\",\"bucket\":0},{\"text\":\"helped\",\"bucket\":1}],\"itemIds\":[\"ena2m1wanted\",\"ena2m1decided\",\"ena2m1helped\",\"ena2m1listened\"],\"tip\":\"Mira el infinitivo: want y decide acaban en t/d, así que piden sílaba. Los demás no.\"},{\"id\":\"ena2m1l5e2\",\"type\":\"bucket\",\"prompt\":\"Las dos caras: ¿la -ed suena /t/ o /d/?\",\"categories\":[\"suena /t/ (sordo delante)\",\"suena /d/ (sonoro delante)\"],\"items\":[{\"text\":\"worked\",\"bucket\":0},{\"text\":\"played\",\"bucket\":1},{\"text\":\"helped\",\"bucket\":0},{\"text\":\"listened\",\"bucket\":1},{\"text\":\"missed\",\"bucket\":0},{\"text\":\"phoned\",\"bucket\":1},{\"text\":\"watched\",\"bucket\":0},{\"text\":\"arrived\",\"bucket\":1}],\"itemIds\":[\"ena2m1helped\",\"ena2m1listened\",\"ena2m1phoned\",\"ena2m1missedthebus\"],\"tip\":\"Prueba casera: pon la mano en la garganta y di el infinitivo. Si vibra al final (play, listen, phone, arrive) → /d/. Si no vibra (work, help, miss, watch) → /t/.\"},{\"id\":\"ena2m1l5e3\",\"type\":\"mc\",\"prompt\":\"Cuenta sílabas — la fácil\",\"question\":\"«wanted» tiene…\",\"options\":[\"Dos sílabas: UÓN-tid\",\"Una sílaba: uónt\",\"Tres sílabas: ua-ÓN-ted\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de t la -ed SÍ suena aparte: la sílaba existe\",\"Ni la primera se parte en dos ni la -ed suena «ed»: es «id»\"],\"itemIds\":[\"ena2m1wanted\"],\"tip\":\"Esta es la barata: el español añade sílabas con los ojos cerrados. Un repaso y ya es tuya.\"},{\"id\":\"ena2m1l5e4\",\"type\":\"mc\",\"prompt\":\"Cuenta sílabas — la cara\",\"question\":\"«worked» tiene…\",\"options\":[\"Una sílaba: uéekt\",\"Dos sílabas: UÉE-ked\",\"Dos sílabas: uor-KÉD\"],\"answer\":0,\"whyWrong\":[null,\"Ahí has metido una vocal de apoyo que el inglés no tiene\",\"Ese es exactamente el reflejo español: partir el grupo /kt/ con una e\"],\"itemIds\":[\"ena2m1iworked\"],\"tip\":\"Cierra la palabra con la lengua, sin abrir la boca detrás. La t no necesita vocal para existir.\"},{\"id\":\"ena2m1l5e5\",\"type\":\"audiomc\",\"prompt\":\"¿Presente o pasado? La diferencia está en una consonante — 2 escuchas\",\"audio\":\"She asked Sam for the key.\",\"question\":\"¿Qué oíste?\",\"options\":[\"asked — ya pasó\",\"ask — presente\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Al final sonó una t pequeñita pegada: as-kt. Eso es el pasado\"],\"itemIds\":[\"ena2m1asked\"],\"tip\":\"En el Listening del examen, media respuesta depende de oír una consonante final. Entrena el oído aquí y cobras once módulos.\"},{\"id\":\"ena2m1l5e6\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Lo que se cae de verdad al hablar rápido\",\"book\":\"I asked Sam.\",\"real\":\"I ast Sam.\",\"translation\":\"Se lo pregunté a Sam.\",\"itemIds\":[\"ena2m1asked\"],\"tip\":\"Ojo al detalle: en el habla rápida lo que desaparece es la K de asked (/ɑːst/), NO la -ed. La marca de pasado no se cae nunca — es la k la que sobra.\"},{\"id\":\"ena2m1l5e7\",\"type\":\"shadow\",\"prompt\":\"Sombrea tres /t/ seguidas — primero lento, luego a velocidad normal\",\"text\":\"I worked, I cooked and I watched a film.\",\"phonetic\":\"ái UÉEKT, ái KUKT and ái UÓCHT a film\",\"translation\":\"Trabajé, cociné y vi una película.\",\"reps\":2,\"itemIds\":[\"ena2m1iworked\",\"ena2m1wecookedtogether\",\"ena2m1shewatchedafilm\"],\"tip\":\"Tres cierres de /t/ en una frase. Si te sale sin meter ninguna «e», la clínica ya está haciendo efecto.\"},{\"id\":\"ena2m1l5e8\",\"type\":\"speak\",\"prompt\":\"Ahora las dos caras juntas: /ɪd/ y /d/\",\"text\":\"She wanted to help and she phoned me.\",\"phonetic\":\"shi UÓN-tid tu jelp and shi FÓUND mi\",\"translation\":\"Quería ayudar y me llamó.\",\"itemIds\":[\"ena2m1wanted\",\"ena2m1phoned\",\"ena2m1helped\"],\"tip\":\"wanted te sale sola (sílaba nueva). phoned es la que hay que vigilar: fóund, con la d cerrando y sin vocal detrás.\"},{\"id\":\"ena2m1l5e9\",\"type\":\"listen\",\"prompt\":\"Dictado — dos -ed sonoras\",\"text\":\"We listened to music and we danced.\",\"translation\":\"Escuchamos música y bailamos.\",\"hints\":[\"listen + -ed y dance + -ed\",\"We listen… to music and we danc…\"],\"itemIds\":[\"ena2m1listened\",\"endanced\",\"enlistentomusic\"],\"tip\":\"Fíjate en el contraste dentro de la misma frase: listened acaba en /d/ y danced en /t/. Mismo escrito, dos sonidos.\"},{\"id\":\"ena2m1l5e10\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de pasados — sin pensar en la regla, solo el significado\",\"pairs\":[{\"target\":\"worked\",\"source\":\"trabajé\"},{\"target\":\"played\",\"source\":\"jugué\"},{\"target\":\"watched\",\"source\":\"vi\"},{\"target\":\"cooked\",\"source\":\"cociné\"},{\"target\":\"danced\",\"source\":\"bailé\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m1iworked\",\"enplayed\",\"endanced\"],\"tip\":\"La velocidad es el objetivo: si tienes que pararte a aplicar la regla, todavía no es tuyo. El cronómetro solo suma.\"},{\"id\":\"ena2m1l5e11\",\"type\":\"mc\",\"prompt\":\"Por qué esta lección vale más que ninguna\",\"question\":\"Si te comes la -ed al hablar, ¿qué pasa?\",\"options\":[\"Que has dicho un presente: la gramática vivía en esa consonante\",\"Nada, se entiende igual por el contexto\",\"Que suenas más natural, como los nativos\"],\"answer\":0,\"whyWrong\":[null,\"A veces se entiende, pero en el examen no se puntúa la buena voluntad del oyente\",\"Los nativos no se la comen: la pegan a la palabra siguiente, que es distinto\"],\"itemIds\":[\"ena2m1asked\",\"ena2m1helped\"],\"tip\":\"Este es el motivo de que la clínica vaya en el módulo 1 y no en el 7: se entrena desde el día uno y se cobra en los once que quedan.\"},{\"id\":\"ena2m1l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ayer ayudé a Amy y llamé a mi hermana.\",\"answers\":[\"Yesterday I helped Amy and I phoned my sister.\",\"Yesterday I helped Amy and phoned my sister.\",\"Yesterday I helped Amy and I called my sister.\"],\"hints\":[\"help → /t/ · phone → /d/\",\"Yesterday I help… Amy and I phon… my sister.\"],\"itemIds\":[\"ena2m1helped\",\"ena2m1phoned\",\"ensister\",\"enyesterday\"],\"tip\":\"Escríbela y después dila en voz alta cerrando las dos consonantes finales. Escribir la -ed es fácil; decirla es la clínica.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m1-3\",\"book\":\"It rained a lot.\",\"real\":\"It chucked it down.\",\"meaning\":\"Cayó una buena / diluvió\",\"when\":\"Entre amigos, quejándose del tiempo británico, que es deporte nacional. En el examen, escribe It rained a lot o It rained heavily: chucked it down es de bar, no de Writing.\",\"register\":\"amigos\",\"note\":\"Otra ración de /t/ final: chucked = CHAKT. Y fíjate en el it repetido — el inglés no deja huecos donde va un sujeto o un objeto.\",\"sound\":\"it CHAKT it dáun\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"BBC Learning English — Pronunciation: -ed endings\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/pronunciation\",\"note\":\"Busca la ficha de las terminaciones -ed y repite con el vídeo. Cinco minutos al día durante una semana: es la mejor inversión del nivel.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-wi
