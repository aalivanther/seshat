Sie sostenido, puntos de contenido en orden. Género: Nachricht.\u003cbr/\u003e· \u003cb\u003eAufgabe 1\u003c/b\u003e (~150 palabras, ~50 min, 60 puntos): Forumsbeitrag. Introducción y cierre explícitos, argumentar, proponer, ventajas e inconvenientes.\u003cbr/\u003e\u003cbr/\u003eLa regla que tumba la tarea entera: \u003cb\u003emenos del 50 % de las palabras pedidas = Erfüllung E = 0 puntos\u003c/b\u003e, por brillante que sea el alemán. 99 palabras bien atribuidas valen más que 140 que mezclan tu voz con la de la fuente.\u003cbr/\u003e\u003cbr/\u003eY la trampa de este módulo: un párrafo que afirma lo que otro dijo. Cada hecho ajeno lleva \u003cb\u003elaut / zufolge / sollen / Konjunktiv I\u003c/b\u003e. Si falta el dueño, el examinador lee tu opinión donde tú querías una cita.\",\"table\":[[\"tarea\",\"palabras\",\"registro\",\"lo que no puede faltar\"],[\"Nachricht an Vorgesetzte\",\"~100\",\"Sie\",\"Anrede, Gruß, puntos en orden\"],[\"Forumsbeitrag\",\"~150\",\"neutro escrito / du al hilo\",\"intro, pros/contras, propuesta, cierre\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l8e1\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich distanziere mich die Behauptung.\",\"answers\":[\"Ich distanziere mich von der Behauptung.\"],\"why\":\"sich distanzieren rige von + dativo. Sin la preposición es calco de «me distancio LA afirmación».\",\"translation\":\"Me distancio de la afirmación.\",\"itemIds\":[\"b2m1sichdistanzieren\"]},{\"id\":\"b2m1l8e2\",\"type\":\"gapbank\",\"prompt\":\"Completa el borrador del mensaje formal\",\"text\":\"Einem Bericht ___ soll unser Team Daten weitergegeben haben. Das lässt sich so nicht ___. Ich bitte Sie, die Angaben intern prüfen zu ___ und der Presse eine Stellungnahme zu geben.\",\"answers\":[\"zufolge\",\"belegen\",\"lassen\"],\"bank\":[\"zufolge\",\"belegen\",\"lassen\",\"laut\",\"sagen\",\"haben\"],\"translation\":\"Según un informe, nuestro equipo habría cedido datos. Eso no se puede demostrar así. Le pido que haga comprobar los datos dentro y que dé un comunicado a la prensa.\",\"itemIds\":[\"b2m1zufolge\",\"b2m1sichbelegen\",\"b2m1stellungnahme\"]},{\"id\":\"b2m1l8e3\",\"type\":\"mc\",\"prompt\":\"Registro: ¿qué cierre vale en Sie?\",\"question\":\"Mensaje a la jefa sobre una noticia falsa. ¿Qué cierre?\",\"options\":[\"Meld dich mal, ja?\",\"Mit freundlichen Grüßen\",\"Das ist doch Quatsch, oder?\"],\"answer\":1,\"whyWrong\":[\"Calle y du: fuga de registro. En Sie es 0 en Textsorte\",null,\"Es la píldora Nativo de amigos: aquí tumba la banda\"],\"itemIds\":[\"b2m1natquatsch\"]},{\"id\":\"b2m1l8e4\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Nachricht an die Vorgesetzte. Lee el esqueleto antes de escribir.\",\"scenario\":\"Eres Sofía Marín. En el periódico ha salido que tu equipo ha cedido datos de usuarios. Escribe un mensaje a tu jefa, Frau Keller, con tratamiento de Sie. Trata LOS TRES puntos: dejarte uno te baja de banda en Erfüllung.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Resume la noticia atribuyéndola (laut / zufolge / sollen): no la firmes tú.\",\"Di que eso no está demostrado y pide que se compruebe internamente.\",\"Propón un comunicado breve a la prensa y cierra con Grußformel.\"],\"checks\":[{\"re\":\"(laut|zufolge|soll)\",\"label\":\"atribuyes la noticia (laut / zufolge / soll)\"},{\"re\":\"(belegen|pr[üu]fen|unbest[äa]tigt|bestreit)\",\"label\":\"pides comprobar o marcas que no está demostrado\"},{\"re\":\"(Stellungnahme|Presse|klarstell)\",\"label\":\"propones un comunicado\"}],\"frame\":[\"Anrede: «Sehr geehrte Frau Keller,»\",\"Lead: «Einem Bericht zufolge soll …»\",\"Distancia: «Das lässt sich so nicht belegen.»\",\"Petición: «Ich bitte Sie, … prüfen zu lassen.»\",\"Propuesta: «Eine kurze Stellungnahme an die Presse …»\",\"Gruß: «Mit freundlichen Grüßen» + nombre\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"weil\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":120,\"model\":\"Sehr geehrte Frau Keller,\\neinem Bericht der Berliner Morgenpost zufolge soll unser Team interne Nutzerdaten weitergegeben haben. Das lässt sich so nicht belegen. Die Redaktion hat uns nicht um eine Stellungnahme gebeten, und die Quelle bleibt ungenannt. Ich bitte Sie deshalb, die Behauptung intern prüfen zu lassen, bevor wir darauf öffentlich reagieren. Außerdem kursiert der Text bereits in den sozialen Netzen; eine kurze, sachliche Klarstellung an die Presse wäre wichtig, weil die Reichweite sonst weiter steigt. Ich distanziere mich von dieser Unterstellung und stehe für Rückfragen gern zur Verfügung.\\nMit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[\"b2m1zufolge\",\"b2m1sollsein\",\"b2m1sichbelegen\",\"b2m1stellungnahme\",\"b2m1sichdistanzieren\",\"b2m1nutzerdaten\",\"b2m1unterstellung\"],\"tip\":\"Cuenta las palabras. Menos de 50 = 0. Y ni un «du»: el detector de registro no perdona.\"},{\"id\":\"b2m1l8e5\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag. Reacciona al texto y argumenta.\",\"scenario\":\"En un foro de lengua alemana alguien afirma que las redes sociales han matado el periodismo. Escribe un comentario de foro: introduce, da ventajas e inconvenientes, propón algo concreto y cierra. Atribuye lo que no sea tuyo.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Markus B.\",\"text\":\"Ohne soziale Netze wäre die Presse ehrlicher. Heute zählt nur die Reichweite, nicht die Recherche. Wer Klicks will, schreibt laut, nicht laut der Quelle.\"},\"bullets\":[\"Reacciona a Markus: concede algo y marca dónde no estás de acuerdo.\",\"Da una ventaja y un inconveniente de las redes para las noticias, con ejemplo.\",\"Propón una regla concreta (p. ej. citar la fuente en el titular) y cierra.\"],\"checks\":[{\"re\":\"(zwar|allerdings|jedoch|stimme .* zu|verstehe)\",\"label\":\"concedas algo antes de rebatir\"},{\"re\":\"(Vorteil|Nachteil|einerseits|andererseits|allerdings)\",\"label\":\"hay ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|würde ich|schlage vor|Vorschlag)\",\"label\":\"hay una propuesta\"}],\"frame\":[\"Apertura: «Zu dem Beitrag von Markus B. möchte ich Folgendes sagen:»\",\"Concesión: «Zwar stimmt, dass … Allerdings …»\",\"Ventaja / inconveniente con ejemplo (Sofía, Clara, un clic)\",\"Propuesta: «Schlagzeilen sollten die Quelle nennen.»\",\"Cierre: «Deshalb plädiere ich dafür, …»\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Markus B. möchte ich Folgendes sagen: Zwar stimmt, dass die Reichweite oft lauter ist als die Recherche. Allerdings sterben die Zeitungen nicht an den Netzen, sondern an Schlagzeilen ohne Quelle. Ein Vorteil der Portale ist die Gegenstimme: Stellungnahmen erreichen uns in Minuten, und der Leser kann beide Seiten halten. Ein Nachteil ist der Algorithmus, der Empörung belohnt und unbestätigte Meldungen nach oben schiebt. Clara Hofmann schreibt «eine Quelle habe bestätigt», und gelesen wird «hat bestätigt». Wer teilt, ohne die Stellungnahme zu lesen, unterschreibt eine Unterstellung. Deshalb sollte jede Schlagzeile die Quelle nennen oder den Konjunktiv sichtbar machen. Außerdem müssten unbestätigte Meldungen klar markiert werden, nicht erst im dritten Absatz. Ich plädiere dafür, weniger zu behaupten und mehr zu zitieren. Nur so bleibt die Glaubwürdigkeit der Presse, und nur so weiß man noch, wem ein Satz gehört.\",\"itemIds\":[\"b2m1reichweite\",\"b2m1recherche\",\"b2m1algorithmus\",\"b2m1schlagzeile\",\"b2m1gegenstimme\",\"b2m1zusammenfassen\"],\"tip\":\"150 palabras no son 80 con adjetivos. Son intro + concesión + dos argumentos + propuesta + cierre. Si te comes la concesión, el texto suena a panfleto y baja Strukturen.\"},{\"id\":\"b2m1l8extra1\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Nachricht Sie. Off-topic = 0.\",\"scenario\":\"Eres Sofía Marín. Escribes a Frau Keller: en un titular interno se ha colado el indicativo donde iba Konjunktiv I. Sie. Pide revisión antes del cierre de redacción. Tema equivocado o menos de 50 palabras = 0.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Nombra el motivo en la primera frase, con Sie.\",\"Pide una acción concreta y un plazo.\",\"Cierra con Grußformel.\"],\"checks\":[{\"re\":\"(Sehr geehrte|Guten Tag)\",\"label\":\"hay Anrede\"},{\"re\":\"(bitte|könnten|würde ich)\",\"label\":\"hay una petición\"},{\"re\":\"(Mit freundlichen Grüßen|Freundliche Grüße)\",\"label\":\"hay Gruß\"}],\"frame\":[\"Anrede Sie\",\"motivo\",\"petición + plazo\",\"Gruß + nombre\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"weil\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":120,\"model\":\"Sehr geehrte Frau Keller,\\nlaut einer internen Notiz soll unser Team in der Schlagzeile den Konjunktiv gestrichen haben. Das lässt sich so nicht belegen, weil die Distanz zwischen «habe bestätigt» und «hat bestätigt» genau der Punkt der Redaktion ist. Deshalb bitte ich Sie, die Titelformulierung bis Donnerstag prüfen zu lassen. Außerdem bräuchte die Presse eine kurze Klarstellung, dass wir zitieren und nicht unterschreiben. Allerdings darf die Gegendarstellung nicht kleiner stehen als die erste Meldung. Ich stehe für Rückfragen gern zur Verfügung. Eine kurze schriftliche Bestätigung reicht.\\nMit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[],\"tip\":\"Menos de 50 palabras o tema equivocado: 0. Ni un du.\"},{\"id\":\"b2m1l8extra2\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag. Off-topic = 0.\",\"scenario\":\"Foro de lengua: Tom Berger dice que el Konjunktiv en el titular confunde al lector. Reacciona: concede, ventaja e inconveniente, propuesta. Off-topic = 0.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Tom Berger\",\"text\":\"Der Konjunktiv in der Überschrift verwirrt den Leser. Wer «habe bestätigt» liest, denkt, die Redaktion sei unsicher. Schreibt Indikativ, dann weiß man, woran man ist.\"},\"bullets\":[\"Concede un punto a Tom Berger y marca el desacuerdo.\",\"Una ventaja y un inconveniente, con ejemplo.\",\"Una propuesta concreta y un cierre.\"],\"checks\":[{\"re\":\"(zwar|allerdings|jedoch)\",\"label\":\"concedes antes de rebatir\"},{\"re\":\"(Vorteil|Nachteil|einerseits|andererseits)\",\"label\":\"ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|schlage vor|Vorschlag)\",\"label\":\"hay propuesta\"}],\"frame\":[\"Apertura\",\"concesión\",\"pro/contra\",\"propuesta\",\"cierre\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Tom Berger möchte ich Folgendes sagen: Zwar stimmt, dass manche Leser «habe» überlesen. Allerdings ist das kein Freibrief für den Indikativ, wenn die Quelle nur «soll» gesagt hat. Ein Vorteil der Portale ist die Gegendarstellung in Minuten, und der Leser kann beide Seiten halten. Ein Nachteil ist der Algorithmus, der Empörung belohnt und den Konjunktiv unsichtbar macht. Clara Hofmann schreibt «eine Quelle habe bestätigt», und gelesen wird «hat bestätigt». Deshalb sollte jede Schlagzeile die Distanz zeigen oder die Quelle nennen. Außerdem müssten unbestätigte Meldungen markiert bleiben, nicht erst im dritten Absatz. Ich plädiere dafür, weniger zu behaupten und mehr zu zitieren, weil nur so klar bleibt, wem ein Satz gehört. Wer das nicht will, soll sagen, warum, und zwar schriftlich. Nur so bleibt die Sache nachvollziehbar. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll.\",\"itemIds\":[],\"tip\":\"150 palabras: intro, concesión, dos argumentos, propuesta, cierre. Off-topic = 0.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m1-4\",\"book\":\"Ich habe es in der Zeitung gelesen.\",\"real\":\"Stand in der Zeitung.\",\"meaning\":\"Lo he leído en el periódico / salió en el periódico\",\"when\":\"Al pasar una noticia en el pasillo, sin sujeto y sin auxiliar. En el Schreiben no cabe: allí la fuente se nombra entera y, si puedes, con Konjunktiv I. «Stand in der Zeitung» es un encogimiento de hombros, no una cita.\",\"register\":\"neutral\",\"exam\":\"Einem Bericht zufolge …\",\"note\":\"El alemán hablado se come el es y el artículo: «Stand in der Zeitung» = «Es stand in der Zeitung». Reconocerlo evita buscar un sujeto que no está.\",\"sound\":\"shtant in dea TSAI-tung\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"b2m1natstand\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B2 (Schreiben)\",\"url\":\"https://www.goethe.de/pro/relaunch/prf/materialien/B2/b2_modellsatz_erwachsene.pdf\",\"note\":\"Las dos tareas reales: Forumsbeitrag ~150 y Nachricht an den Vorgesetzten ~100. Compara tu texto con los criterios de la hoja de evaluación.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"a
