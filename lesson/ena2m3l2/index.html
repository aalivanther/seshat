nca detrás.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la regla que casi nadie te cuenta: «a bit» solo sirve para lo NEGATIVO.\u003c/b\u003e \u003ci\u003ea bit shy\u003c/i\u003e, \u003ci\u003ea bit tired\u003c/i\u003e, \u003ci\u003ea bit expensive\u003c/i\u003e, \u003ci\u003ea bit cold\u003c/i\u003e — cosas que preferirías que no fueran así. Con algo bueno no se usa: \u003ci\u003ea bit nice\u003c/i\u003e o \u003ci\u003ea bit beautiful\u003c/i\u003e no significan nada. En español sí decimos «es un poco simpático», y de ahí sale el error. Si lo bueno hay que rebajarlo, el inglés usa \u003cb\u003equite\u003c/b\u003e: \u003ci\u003eShe's quite friendly.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY un aviso cultural que vale por diez notas: en boca británica \u003cb\u003equite REBAJA\u003c/b\u003e. «It's quite good» no es «está bastante bien» con entusiasmo, es «está bien, sin más». Si de verdad te ha encantado, di \u003ci\u003ereally good\u003c/i\u003e o \u003ci\u003eso good\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l2\",\"phaseId\":\"ena2m3\",\"title\":\"Quite tall, a bit shy\",\"subtitle\":\"Graduar: bastante, tan, un poco — y el «poquito» que solo vale para lo malo\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Subir y bajar el volumen de un adjetivo\",\"itemIds\":[\"ena2m3quitetall\",\"ena2m3abitshy\",\"ena2m3sonice\",\"ena2m3shy\",\"ena2m3friendly\",\"envery\",\"entooexpensive\",\"enheisverytall\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cinco mandos de volumen, y dónde se colocan\",\"body\":\"$17\",\"table\":[[\"mando\",\"fuerza\",\"ejemplo\",\"ojo\"],[\"a bit\",\"un poco\",\"He's a bit shy.\",\"SOLO con lo negativo\"],[\"quite\",\"bastante\",\"She's quite tall.\",\"en boca británica, rebaja\"],[\"very / really\",\"muy\",\"She's very nice.\",\"el de siempre\"],[\"so\",\"tan / qué\",\"She's so nice!\",\"lleva emoción\"],[\"too\",\"demasiado\",\"It's too expensive.\",\"eso ya es un problema\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l2e1\",\"type\":\"mc\",\"prompt\":\"«Es un poco tímido»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"He's a bit shy.\",\"He's a bit of shy.\",\"He's shy a bit.\"],\"answer\":0,\"whyWrong\":[null,\"«a bit of» pide un sustantivo detrás: a bit of milk, a bit of luck\",\"El graduador va DELANTE del adjetivo, siempre\"],\"itemIds\":[\"ena2m3abitshy\",\"ena2m3shy\"]},{\"id\":\"ena2m3l2e2\",\"type\":\"bucket\",\"prompt\":\"¿Se puede decir con «a bit»?\",\"categories\":[\"sí: es algo negativo\",\"no: es algo bueno\"],\"items\":[{\"text\":\"shy\",\"bucket\":0},{\"text\":\"tired\",\"bucket\":0},{\"text\":\"expensive\",\"bucket\":0},{\"text\":\"beautiful\",\"bucket\":1},{\"text\":\"friendly\",\"bucket\":1},{\"text\":\"nice\",\"bucket\":1}],\"itemIds\":[\"ena2m3abitshy\",\"ena2m3friendly\",\"ena2m3beautiful\",\"ena2m1tired\",\"enexpensive\",\"ennice\"],\"tip\":\"El español dice «un poco simpático» sin problema; el inglés no. Para rebajar algo bueno usa quite: she's quite friendly.\"},{\"id\":\"ena2m3l2e3\",\"type\":\"match\",\"prompt\":\"Empareja cada mando con su fuerza\",\"pairs\":[{\"target\":\"a bit\",\"source\":\"un poco (y solo para lo malo)\"},{\"target\":\"quite\",\"source\":\"bastante\"},{\"target\":\"very\",\"source\":\"muy\"},{\"target\":\"so\",\"source\":\"tan / qué (con emoción)\"},{\"target\":\"too\",\"source\":\"demasiado (ya es un problema)\"}],\"itemIds\":[\"ena2m3abitshy\",\"ena2m3quitetall\",\"ena2m3sonice\",\"envery\",\"entooexpensive\"]},{\"id\":\"ena2m3l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el graduador\",\"text\":\"The film was a ___ long, but I liked it.\",\"answers\":[\"bit\"],\"translation\":\"La película se hacía un poco larga, pero me gustó.\",\"hints\":[\"«Un poco» son dos palabras y la primera ya está puesta\",\"a b…\"],\"itemIds\":[\"ena2m3abitshy\"]},{\"id\":\"ena2m3l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa con emoción\",\"text\":\"Amy is ___ nice! Everybody loves her.\",\"answers\":[\"so\"],\"translation\":\"¡Amy es majísima! Le cae bien a todo el mundo.\",\"hints\":[\"No es una medida, es una exclamación\",\"s…\"],\"itemIds\":[\"ena2m3sonice\"]},{\"id\":\"ena2m3l2e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «un poco» que en inglés no cabe\",\"wrong\":\"She's a bit friendly.\",\"answers\":[\"She's quite friendly.\"],\"why\":\"«a bit» solo acompaña a lo negativo: a bit shy, a bit tired, a bit expensive. Friendly es bueno, así que para rebajarlo el inglés usa quite. «A bit friendly» le suena a un nativo tan raro como a ti «es un poquito estupenda».\",\"translation\":\"Es bastante simpática.\",\"itemIds\":[\"ena2m3friendly\",\"ena2m3quitetall\"]},{\"id\":\"ena2m3l2e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el falso amigo de «bastante»\",\"wrong\":\"She's enough tall.\",\"answers\":[\"She's quite tall.\"],\"why\":\"«Bastante» tiene dos traducciones y el español las confunde: quite = bastante en el sentido de «medianamente» (quite tall), y enough = suficiente, lo justo para algo (tall enough to play basketball). Y fíjate en la colocación: enough va DETRÁS del adjetivo, quite va delante.\",\"translation\":\"Es bastante alta.\",\"itemIds\":[\"ena2m3quitetall\"]},{\"id\":\"ena2m3l2e8\",\"type\":\"transform\",\"prompt\":\"Súbele el volumen\",\"source\":\"She's nice.\",\"instruction\":\"Dilo con emoción: «¡Es majísima!»\",\"answers\":[\"She's so nice!\",\"She is so nice!\",\"She's so nice\"],\"translation\":\"¡Es majísima!\",\"hints\":[\"Dos letras delante del adjetivo\",\"She's s… nice!\"],\"itemIds\":[\"ena2m3sonice\",\"ennice\"]},{\"id\":\"ena2m3l2e9\",\"type\":\"build\",\"prompt\":\"Construye la frase con dos graduadores\",\"target\":\"He is a bit shy but he is very funny\",\"translation\":\"Es un poco tímido, pero es divertidísimo\",\"distractors\":[\"little\",\"too\"],\"itemIds\":[\"ena2m3abitshy\",\"ena2m3shy\",\"enfunny\"],\"tip\":\"«little» y «too» sobran: little no se usa así con adjetivos, y too diría que es demasiado divertido, que no es lo que quieres decir.\"},{\"id\":\"ena2m3l2e10\",\"type\":\"audiomc\",\"prompt\":\"Dos datos en una frase — 2 escuchas, como en el examen\",\"audio\":\"She's quite tall and she's very friendly.\",\"question\":\"¿Cómo es?\",\"options\":[\"Bastante alta y muy simpática\",\"Muy alta y bastante simpática\",\"Un poco alta y algo simpática\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Los dos graduadores están cambiados de sitio: quite va con tall y very con friendly\",\"«A bit» no suena en ninguna parte del audio\"],\"itemIds\":[\"ena2m3quitetall\",\"ena2m3friendly\"],\"tip\":\"La Parte 1 del Listening del A2 lleva DOS datos por frase. Aquí los dos datos son los graduadores, no los adjetivos: apunta los dos mientras suena.\"},{\"id\":\"ena2m3l2e11\",\"type\":\"hearreal\",\"prompt\":\"¿Qué significa de verdad lo que has oído?\",\"book\":\"It was quite good.\",\"real\":\"It was all right, I suppose.\",\"translation\":\"Estuvo bien, sin más.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Estuvo bien, sin más\",\"Estuvo genial\",\"Estuvo fatal\"],\"itemIds\":[\"ena2m3quitetall\"],\"tip\":\"El británico rebaja en vez de entusiasmarse. «Quite good» y «all right, I suppose» dicen lo mismo: ni fu ni fa. Si te encantó, di really good.\"},{\"id\":\"ena2m3l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Es bastante alta y un poco tímida, pero es majísima.\",\"answers\":[\"She's quite tall and a bit shy, but she's so nice.\",\"She's quite tall and a bit shy, but she's so nice!\",\"She is quite tall and a bit shy, but she is so nice.\"],\"hints\":[\"Tres graduadores en una frase, los tres delante de su adjetivo\",\"She's q… tall and a b… shy, but she's s… nice.\"],\"itemIds\":[\"ena2m3quitetall\",\"ena2m3abitshy\",\"ena2m3sonice\"],\"tip\":\"Ahí tienes el retrato de una persona en once palabras. Con esto ya contestas a «What's she like?».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m3-2\",\"book\":\"She's very nice.\",\"real\":\"She's so lovely.\",\"meaning\":\"Es un cielo / es un encanto\",\"when\":\"Entre amigos y compañeros, hablando bien de alguien. En Reino Unido «lovely» se usa a todas horas y para casi todo (una persona, una tarde, una taza de té). En el Writing del examen, very nice o really kind: son las que enseñan la gramática que te puntúan.\",\"register\":\"amigos\",\"note\":\"so + adjetivo es el «qué maja es» español: lleva emoción, no medida. Y lovely ya lo traías del A1, solo que aplicado a cosas.\",\"sound\":\"shis̬ sóu LAV-li\",\"level\":\"a2\",\"itemId\":\"ena2m3sonice\"}}],\"resources\":[{\"label\":\"British Council — Intensifiers and mitigators\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/intensifiers-mitigators\",\"note\":\"Lee solo la primera mitad (very, quite, a bit) y anota cada ejemplo con «a bit»: verás que todos son cosas malas. Ahí está la regla entera.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\"
