6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T696,"])</script><script>self.__next_f.push([1,"Aquí llegamos a lo que este módulo venía a darte: las fórmulas con las que se escribe un argumento en inglés sin decir quién lo dice. Son \u003cb\u003edos moldes\u003c/b\u003e, y los dos se aprenden enteros.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMolde 1 — It + be + participio + THAT + frase\u003c/b\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eIt is said that\u003c/b\u003e the pool will close.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eIt is believed that\u003c/b\u003e the fire started in the kitchen.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003e\u003cb\u003eIt has been shown that\u003c/b\u003e people read less.\u003c/i\u003e\u003cbr/\u003eEse \u003ci\u003eIt\u003c/i\u003e del principio no significa nada: es un sujeto de relleno, porque el inglés no admite frases sin sujeto. Ponlo siempre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMolde 2 — Sujeto + be + participio + TO + infinitivo\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eThe pool \u003cb\u003eis said to be\u003c/b\u003e closing.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003eHe \u003cb\u003eis thought to be\u003c/b\u003e abroad.\u003c/i\u003e\u003cbr/\u003eDice exactamente lo mismo, en menos palabras y con más nivel. Se reconoce siempre y se produce cuando te salga: con el molde 1 ya apruebas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos verbos que entran en los dos moldes son una lista corta:\u003c/b\u003e \u003ci\u003esay, believe, think, know, report, expect, show\u003c/i\u003e. No hace falta más.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el par que define este módulo\u003c/b\u003e, porque es el mismo contenido en tres registros:\u003cbr/\u003e· Calle: \u003ci\u003e\u003cb\u003eThey reckon\u003c/b\u003e it'll close.\u003c/i\u003e\u003cbr/\u003e· Neutro: \u003ci\u003ePeople say it's closing.\u003c/i\u003e\u003cbr/\u003e· Examen: \u003ci\u003e\u003cb\u003eIt is said that\u003c/b\u003e it will close.\u003c/i\u003e\u003cbr/\u003eEl alumno que solo tiene la primera escribe la primera en la carta formal, y pierde puntos de vocabulario sin cometer ni un error de gramática. Ese es el aviso de la lección.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos colocaciones del mismo campo, en bloque:\u003c/b\u003e \u003ci\u003ea survey is \u003cb\u003ecarried out\u003c/b\u003e\u003c/i\u003e (una encuesta se hace, no se «makes») y \u003ci\u003ean article is \u003cb\u003ebased on\u003c/b\u003e something\u003c/i\u003e (se basa EN)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l7\",\"phaseId\":\"enb1m4\",\"title\":\"It is said that…\",\"subtitle\":\"Los ladrillos del argumento escrito: informar sin firmar\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas que sostienen un texto formal\",\"itemIds\":[\"enb1m4itissaidthat\",\"enb1m4itisbelieved\",\"enb1m4ithasbeenshown\",\"enb1m4heisthought\",\"enb1m4basedon\",\"enb1m4carriedout\",\"enb1m4natreckon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos moldes, y los dos son fijos\",\"body\":\"$17\",\"table\":[[\"Calle\",\"Neutro\",\"Examen\"],[\"They reckon it'll close.\",\"People say it's closing.\",\"It is said that it will close.\"],[\"Everyone says he's abroad.\",\"People think he's abroad.\",\"He is thought to be abroad.\"],[\"They did a survey.\",\"They carried out a survey.\",\"A survey was carried out.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l7e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro fórmulas\",\"pairs\":[{\"target\":\"It is said that the pool will close.\",\"source\":\"Se dice que la piscina va a cerrar.\"},{\"target\":\"It is believed that the fire started in the kitchen.\",\"source\":\"Se cree que el fuego empezó en la cocina.\"},{\"target\":\"It has been shown that people read less.\",\"source\":\"Se ha demostrado que la gente lee menos.\"},{\"target\":\"He is thought to be abroad.\",\"source\":\"Se cree que está en el extranjero.\"}],\"itemIds\":[\"enb1m4itissaidthat\",\"enb1m4itisbelieved\",\"enb1m4ithasbeenshown\",\"enb1m4heisthought\"],\"tip\":\"Las cuatro traducen un «se» español y las cuatro son de registro escrito. Guárdalas como fórmulas cerradas: no hay nada que conjugar salvo el «be».\"},{\"id\":\"enb1m4l7e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It said that the pool will close.\",\"answers\":[\"It is said that the pool will close.\"],\"why\":\"Sin «is», la frase dice que «ello dijo». El molde lleva el verbo «be» delante del participio, igual que cualquier otra pasiva.\",\"translation\":\"Se dice que la piscina va a cerrar.\",\"itemIds\":[\"enb1m4itissaidthat\"]},{\"id\":\"enb1m4l7e3\",\"type\":\"cloze\",\"prompt\":\"Completa el participio\",\"text\":\"It is ___ that the fire started in the kitchen.\",\"answers\":[\"believed\",\"thought\"],\"translation\":\"Se cree que el fuego empezó en la cocina.\",\"hints\":[\"De «believe»\",\"be-lie-ved\"],\"itemIds\":[\"enb1m4itisbelieved\"],\"tip\":\"«It is believed» y «It is thought» son intercambiables aquí, y las dos valen. Tener dos formas para lo mismo es exactamente lo que el examen llama «range».\"},{\"id\":\"enb1m4l7e4\",\"type\":\"transform\",\"prompt\":\"Del molde hablado al molde escrito\",\"source\":\"People say that the pool will close.\",\"instruction\":\"Empieza por «It…»\",\"answers\":[\"It is said that the pool will close\",\"It is said that the pool will close.\"],\"translation\":\"Se dice que la piscina va a cerrar.\",\"hints\":[\"El sujeto de relleno va primero\",\"It is ... that the pool will close\"],\"itemIds\":[\"enb1m4itissaidthat\",\"enb1m4theysay\"],\"tip\":\"Fíjate en lo que ha desaparecido: «people». Ese es el trabajo del molde — decir lo mismo sin nombrar a nadie.\"},{\"id\":\"enb1m4l7e5\",\"type\":\"bucket\",\"prompt\":\"¿Detrás va «that + frase» o «to + infinitivo»?\",\"categories\":[\"Molde 1: It is said THAT…\",\"Molde 2: He is said TO…\"],\"items\":[{\"text\":\"It is believed ___ the fire started in the kitchen.\",\"bucket\":0},{\"text\":\"It has been shown ___ people read less.\",\"bucket\":0},{\"text\":\"It is said ___ the pool will close.\",\"bucket\":0},{\"text\":\"He is thought ___ be abroad.\",\"bucket\":1},{\"text\":\"The pool is said ___ be closing.\",\"bucket\":1},{\"text\":\"She is known ___ speak four languages.\",\"bucket\":1}],\"itemIds\":[\"enb1m4itissaidthat\",\"enb1m4itisbelieved\",\"enb1m4heisthought\"],\"tip\":\"La pista está al principio, no al final: si la frase empieza por «It», detrás va «that». Si empieza por una persona o una cosa concreta, detrás va «to».\"},{\"id\":\"enb1m4l7e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «everybody» y sin «says»\",\"source\":\"Everybody says the pool is closing.\",\"forbid\":[\"everybody\",\"says\"],\"answers\":[\"It is said that the pool is closing\",\"The pool is said to be closing\",\"It is said that the pool is closing.\"],\"translation\":\"Todo el mundo dice que la piscina cierra.\",\"hints\":[\"Empieza por el sujeto de relleno\",\"It is ... that the pool is closing\"],\"itemIds\":[\"enb1m4itissaidthat\"],\"tip\":\"Has subido un escalón de registro sin cambiar el contenido. Eso, hecho tres veces en una carta de cien palabras, es una banda entera de vocabulario.\"},{\"id\":\"enb1m4l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición del verbo\",\"text\":\"The article is based ___ a survey of four hundred readers.\",\"answers\":[\"on\"],\"translation\":\"El artículo se basa en una encuesta a cuatrocientos lectores.\",\"hints\":[\"Dos letras\",\"base + ...\"],\"itemIds\":[\"enb1m4basedon\"],\"tip\":\"«be based on» va en bloque, como «depend on». Y ojo: en español se basa EN, en inglés también es «on», así que esta vez la intuición ayuda — no siempre pasa.\"},{\"id\":\"enb1m4l7e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de informe — cuatro huecos\",\"text\":\"The survey ___ carried out last June by a university in London. ___ is said that four out of ten people no longer buy a paper, and it has been ___ that the number is falling faster in small towns. The council ___ thought to be planning cuts, but nothing has been announced.\",\"answers\":[\"was\",\"It\",\"shown\",\"is\"],\"bank\":[\"was\",\"It\",\"shown\",\"is\",\"were\",\"They\",\"are\"],\"translation\":\"La encuesta se hizo el pasado junio y la llevó a cabo una universidad de Londres. Se dice que cuatro de cada diez personas ya no compran periódico, y se ha demostrado que la cifra cae más deprisa en los pueblos. Se cree que el ayuntamiento prepara recortes, pero no se ha anunciado nada.\",\"itemIds\":[\"enb1m4carriedout\",\"enb1m4itissaidthat\",\"enb1m4ithasbeenshown\",\"enb1m4council\"],\"tip\":\"Cuatro frases, cuatro pasivas y un solo agente en todo el párrafo: la universidad. Así es el inglés de informe — y así es el texto del Reading Part 4 que te espera en la lección 10. Último hueco: en un informe escrito, «the council» va con singular («is»); en un mensaje hablado, como el de tu amiga en el módulo 6, es igual de normal el plural («are»). Las dos son correctas — depende del registro, no de la gramática.\"},{\"id\":\"enb1m4l7e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés, en registro de examen\",\"source\":\"Se ha demostrado que la gente lee menos.\",\"answers\":[\"It has been shown that people read less\",\"It has been shown that people read less.\",\"It has been proved that people read less\"],\"hint\":\"Perfecto en pasiva y el sujeto de relleno delante\",\"itemIds\":[\"enb1m4ithasbeenshown\"],\"tip\":\"«It has been shown that…» es el ladrillo con el que se abre un argumento escrito. Apréndetelo entero, con su «It» y su «that»: no se monta pieza a pieza.\"},{\"id\":\"enb1m4l7e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"The survey was carried out in June and the article is based on it.\",\"answers\":[\"La encuesta se hizo en junio y el artículo se basa en ella\",\"La encuesta se llevó a cabo en junio y el artículo se basa en ella\"],\"itemIds\":[\"enb1m4carriedout\",\"enb1m4basedon\"],\"tip\":\"«carry out a survey», no «make» ni «do». Es la colocación del oficio, y usarla bien se ve desde lejos en un texto escrito.\"},{\"id\":\"enb1m4l7e11\",\"type\":\"mc\",\"prompt\":\"El aviso de registro\",\"question\":\"Estás escribiendo la respuesta formal del examen. ¿Cuál NO escribes?\",\"options\":[\"It is said that the pool will close.\",\"They reckon it'll close.\",\"The pool is said to be closing.\"],\"answer\":1,\"whyWrong\":[\"Es exactamente la fórmula que puntúa: molde 1, entera.\",null,\"Es el molde 2, más corto y más alto de nivel. Perfecta para el examen.\"],\"itemIds\":[\"enb1m4natreckon\",\"enb1m4itissaidthat\",\"enb1m4heisthought\"],\"tip\":\"«reckon» no está mal: está en otro sitio. Es de las palabras que más oirás en Inglaterra y de las que menos deberías escribir en una carta formal.\"},{\"id\":\"enb1m4l7e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la misma idea, tres registros\",\"text\":\"They reckon it'll close. People say it's closing. It is said that the pool will close.\",\"phonetic\":\"dei RÉ-kon Í-tol klóus̬ · PÍI-pol sei its KLÓU-s̬ing · it is̬ sed dat de puul uil klóus̬\",\"translation\":\"Dicen por ahí que va a cerrar. · La gente dice que cierra. · Se dice que la piscina va a cerrar.\",\"itemIds\":[\"enb1m4natreckon\",\"enb1m4theysay\",\"enb1m4itissaidthat\"],\"tip\":\"Dilas seguidas y escucha cómo sube el registro sin que cambie el contenido. Saber moverse por esa escalera es media nota de vocabulario en las dos destrezas productivas.\"},{\"id\":\"enb1m4l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen. Dos escuchas.\",\"audio\":\"So, the survey. It was carried out in June, four hundred readers, and it's the one the article is based on.|Four hundred is not many.|No, but it's the first one anybody's done here. It has been shown that people read less on paper — that bit isn't news. What's new is the second finding, which nobody expected.|Which was?|That the people who pay for the local paper are the ones who moved here most recently.\",\"question\":\"¿Cuál es el dato que sorprende, según el hombre?\",\"options\":[\"Que la gente lee menos en papel\",\"Que quienes pagan el periódico local son los recién llegados\",\"Que solo se encuestó a cuatrocientas personas\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Eso lo da por sabido: «that bit isn't news».\",null,\"Lo dice la otra voz como pega, y él no lo llama sorprendente.\"],\"itemIds\":[\"enb1m4carriedout\",\"enb1m4basedon\",\"enb1m4ithasbeenshown\"],\"tip\":\"El Listening Part 4 pregunta justo esto: no qué se dijo, sino qué opina cada uno de lo que se dijo. La pista aquí es «that bit isn't news» — con eso descartas una opción antes de oír la respuesta.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m4-3\",\"book\":\"It is said that the pool will close.\",\"real\":\"They reckon it'll close.\",\"meaning\":\"Dicen por ahí que va a cerrar\",\"when\":\"Hablando, con quien sea: «reckon» es «creer, calcular» y en Inglaterra se dice a todas horas — «I reckon», «what do you reckon?». En el Writing formal NO: ahí va el molde con «It is said that…», que es lo que puntúa.\",\"register\":\"amigos\",\"exam\":\"It is believed that the pool will close.\",\"note\":\"«They reckon» tiene sujeto y el sujeto es un «ellos» que no existe. Justo eso es lo que el molde de examen elimina: nadie dice quién, pero tampoco se inventa un «ellos».\",\"sound\":\"dei RÉ-kon Í-tol klóus̬\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m4natreckon\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
