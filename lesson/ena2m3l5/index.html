, no cuatro!)\u003cbr/\u003e· [[important|importante]] → im-\u003cb\u003ePÓO\u003c/b\u003e-tant\u003cbr/\u003e· [[beautiful|precioso]] → \u003cb\u003eBIÚU\u003c/b\u003e-ti-fol\u003cbr/\u003e· [[difficult|difícil]] → \u003cb\u003eDÍ\u003c/b\u003e-fi-kalt\u003cbr/\u003e· [[dangerous|peligroso]] → \u003cb\u003eDÉIN\u003c/b\u003e-ya-ras\u003cbr/\u003e· expensive → iks-\u003cb\u003ePEN\u003c/b\u003e-siv (esta ya la traías del A1)\u003cbr/\u003e· terrible → \u003cb\u003eTE\u003c/b\u003e-ri-bol\u003cbr/\u003e· delicious → di-\u003cb\u003eLÍ\u003c/b\u003e-shas18:T48f,Esta es la otra mitad de la clínica, y es la que explica por qué no reconoces las palabras al oírlas. En inglés, \u003cb\u003ela sílaba sin golpe no se pronuncia despacio y clarita: se aplasta\u003c/b\u003e hasta un sonido neutro y perezoso que en este curso escribimos como una «a» floja.\u003cbr/\u003e\u003cbr/\u003ePor eso \u003ci\u003ecomfortable\u003c/i\u003e pierde una sílaba entera (la -or- se evapora: KAM-fta-bol) y \u003ci\u003edangerous\u003c/i\u003e termina en «-ras» y no en «-rous». Por eso también \u003ci\u003edifficult\u003c/i\u003e acaba en «-kalt» y no en «-kult».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eConsecuencia práctica, y es doble:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eAl hablar\u003c/b\u003e, si repartes el esfuerzo por igual entre todas las sílabas —como haces en español— suenas a robot y cuesta entenderte. Exagera el golpe y aplasta el resto: es justo al revés de lo que te pide el oído.\u003cbr/\u003e2. \u003cb\u003eAl escuchar\u003c/b\u003e, la palabra que buscas en el examen puede sonar la mitad de larga de lo que esperabas. Si esperas «kom-for-TÉI-bol» y suena «KAMftabol», no la oyes pasar.\u003cbr/\u003e\u003cbr/\u003eEntrenamiento en dos gestos: dilas \u003cb\u003egolpeando fuerte una sola sílaba\u003c/b\u003e, y cuenta las sílabas con los dedos antes de decirlas. Si te salen cuatro en comfortable, empieza otra vez."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\" n la 1ª\",\"golpe en la 2ª\"],\"items\":[{\"text\":\"comfortable\",\"bucket\":0},{\"text\":\"important\",\"bucket\":1},{\"text\":\"beautiful\",\"bucket\":0},{\"text\":\"expensive\",\"bucket\":1},{\"text\":\"difficult\",\"bucket\":0},{\"text\":\"delicious\",\"bucket\":1},{\"text\":\"dangerous\",\"bucket\":0},{\"text\":\"terrible\",\"bucket\":0}],\"itemIds\":[\"ena2m3comfortable\",\"ena2m3important\",\"ena2m3beautiful\",\"ena2m3difficult\",\"ena2m3dangerous\",\"enexpensive\",\"endelicious\",\"ena2m1terrible\"],\"tip\":\"Ninguna de las ocho lleva el golpe al final, que es justo donde lo pone el español. Esa es la moraleja de la lección.\"},{\"id\":\"ena2m3l5e3\",\"type\":\"mc\",\"prompt\":\"El golpe de «dangerous»\",\"question\":\"¿Dónde cae?\",\"options\":[\"DAN-ge-rous\",\"dan-GE-rous\",\"dan-ge-ROUS\"],\"answer\":0,\"whyWrong\":[null,\"El golpe se adelanta a la primera: DÉIN-ya-ras\",\"Y el final se aplasta del todo: «-ras», casi sin vocal\"],\"itemIds\":[\"ena2m3dangerous\"]},{\"id\":\"ena2m3l5e4\",\"type\":\"match\",\"prompt\":\"Empareja las palabras largas\",\"pairs\":[{\"target\":\"comfortable\",\"source\":\"cómodo\"},{\"target\":\"important\",\"source\":\"importante\"},{\"target\":\"beautiful\",\"source\":\"precioso\"},{\"target\":\"difficult\",\"source\":\"difícil\"},{\"target\":\"dangerous\",\"source\":\"peligroso\"}],\"itemIds\":[\"ena2m3comfortable\",\"ena2m3important\",\"ena2m3beautiful\",\"ena2m3difficult\",\"ena2m3dangerous\"]},{\"id\":\"ena2m3l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa\",\"text\":\"This sofa isn't very ___: it's old and hard.\",\"answers\":[\"comfortable\"],\"translation\":\"Este sofá no es muy cómodo: es viejo y duro.\",\"hints\":[\"Tres sílabas y golpe en la primera\",\"KAM-fta-bol\"],\"itemIds\":[\"ena2m3comfortable\",\"ensofa\"]},{\"id\":\"ena2m3l5e6\",\"type\":\"shadow\",\"prompt\":\"Sombrea dos palabras largas seguidas — lento primero, luego normal\",\"text\":\"It's a beautiful old flat, but it's very expensive.\",\"phonetic\":\"its a BIÚU-ti-fol óuld FLAT, bat its ve-ri iks-PEN-siv\",\"translation\":\"Es un piso antiguo precioso, pero es carísimo.\",\"reps\":2,\"itemIds\":[\"ena2m3beautiful\",\"enexpensive\",\"enflat\"],\"tip\":\"Fíjate en el desnivel: BIÚU y PEN suenan fuerte, todo lo demás se aplasta. Copia ese desnivel y ya suenas a inglés.\"},{\"id\":\"ena2m3l5e7\",\"type\":\"audiomc\",\"prompt\":\"Reconocer la palabra larga al vuelo — 2 escuchas\",\"audio\":\"The sofa is very comfortable, but it was quite expensive.\",\"question\":\"¿Qué dice del sofá?\",\"options\":[\"Que es cómodo pero costó bastante\",\"Que es incómodo y barato\",\"Que es cómodo y barato\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El but no niega el «comfortable»: introduce el precio\",\"«quite expensive» es lo contrario de barato\"],\"itemIds\":[\"ena2m3comfortable\",\"enexpensive\",\"ensofa\"],\"tip\":\"Las dos palabras que deciden la respuesta son las dos largas. Si no las reconoces al oírlas, la frase entera se cae.\"},{\"id\":\"ena2m3l5e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Lo que le pasa a comfortable al hablar rápido\",\"book\":\"It's very comfortable.\",\"real\":\"It's dead comfy.\",\"translation\":\"Es comodísimo.\",\"itemIds\":[\"ena2m3comfortable\"],\"tip\":\"«comfy» es la prueba de la lección: la palabra se recorta justo por donde no llevaba el golpe. Y «dead» ahí significa «muy», puro britanismo.\"},{\"id\":\"ena2m3l5e9\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de palabras largas — solo el significado, sin pensar en el acento\",\"pairs\":[{\"target\":\"expensive\",\"source\":\"caro\"},{\"target\":\"terrible\",\"source\":\"horrible\"},{\"target\":\"delicious\",\"source\":\"riquísimo\"},{\"target\":\"important\",\"source\":\"importante\"},{\"target\":\"difficult\",\"source\":\"difícil\"}],\"targetSeconds\":28,\"itemIds\":[\"enexpensive\",\"ena2m1terrible\",\"endelicious\",\"ena2m3important\",\"ena2m3difficult\"]},{\"id\":\"ena2m3l5e10\",\"type\":\"speak\",\"prompt\":\"Golpea u
