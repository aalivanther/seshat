detrás: +s… salvo los rebeldes\",\"body\":\"El plural inglés es fácil: +s — sisters, brothers, parents. Pero las palabras MÁS usadas son rebeldes y cambian por dentro: \u003cb\u003eman → men\u003c/b\u003e, \u003cb\u003ewoman → women\u003c/b\u003e (¡se escribe women y suena «UÍ-min»!), \u003cb\u003echild → children\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY la trampa coronada: \u003cb\u003epeople\u003c/b\u003e (la gente) YA es plural: [[People are nice.|La gente es simpática.]] — «*people is» es el calco del «la gente ES». En cambio \u003cb\u003efamily\u003c/b\u003e, el grupo, va en singular: my family is… Para «ellos son»: \u003cb\u003ethey are → they're\u003c/b\u003e: [[They're my children.|Son mis hijos.]]\",\"table\":[[\"singular\",\"plural\"],[\"sister\",\"sisters — regla: +s\"],[\"brother\",\"brothers\"],[\"man\",\"men — ¡cambia la vocal!\"],[\"woman\",\"women (suena «uimin»)\"],[\"child\",\"children\"],[\"—\",\"people (siempre plural)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m2l6e1\",\"type\":\"mc\",\"prompt\":\"El primer rebelde\",\"question\":\"El plural de man es…\",\"options\":[\"men\",\"mans\",\"manes\"],\"answer\":0,\"whyWrong\":[null,\"man es rebelde: no acepta la -s, cambia la vocal\",\"Eso sería español — en inglés: men\"],\"itemIds\":[\"enman\"]},{\"id\":\"ena1m2l6e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿+s o rebelde?\",\"categories\":[\"+s (regular)\",\"rebelde (irregular)\"],\"items\":[{\"text\":\"sisters\",\"bucket\":0},{\"text\":\"men\",\"bucket\":1},{\"text\":\"parents\",\"bucket\":0},{\"text\":\"women\",\"bucket\":1},{\"text\":\"children\",\"bucket\":1},{\"text\":\"brothers\",\"bucket\":0}],\"itemIds\":[\"enman\",\"enwoman\",\"enchild\",\"ensister\",\"enbrother\",\"enparents\"],\"tip\":\"Los tres rebeldes de la familia: men, women, children. El resto, +s y a correr.\"},{\"id\":\"ena1m2l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa el rebelde\",\"text\":\"One woman, two ___.\",\"answers\":[\"women\"],\"translation\":\"Una mujer, dos mujeres.\",\"hints\":[\"Se escribe casi igual… suena «UÍ-min»\",\"w-o-m-e-n\"],\"itemIds\":[\"enwoman\",\"enone\",\"entwo\"]},{\"id\":\"ena1m2l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa — la gente ES…\",\"text\":\"People ___ nice. (la gente es simpática)\",\"answers\":[\"are\"],\"translation\":\"La gente es simpática.\",\"hints\":[\"people ya es plural\",\"El verbo de they, no el de he\"],\"itemIds\":[\"enpeople\",\"ennice\"],\"tip\":\"people ARE, siempre. «People is» es el calco del «la gente es» — táchalo para siempre.\"},{\"id\":\"ena1m2l6e11\",\"type\":\"gapbank\",\"prompt\":\"Completa la descripción de la foto — sobran palabras del banco\",\"text\":\"In the photo there are three ___: my father, my uncle and my brother. My mother and my aunt are the two ___ on the left. The little ___ in front is my sister's daughter. And all these ___ are my family.\",\"answers\":[\"men\",\"women\",\"child\",\"people\"],\"bank\":[\"men\",\"women\",\"child\",\"people\",\"man\",\"woman\"],\"translation\":\"En la foto hay tres hombres: mi padre, mi tío y mi hermano. Mi madre y mi tía son las dos mujeres de la izquierda. La niña pequeña de delante es la hija de mi hermana. Y toda esta gente es mi familia.\",\"hints\":[\"Cuenta antes de elegir: ¿uno o varios?\",\"El último hueco es el comodín que YA es plural\"],\"itemIds\":[\"enman\",\"enwoman\",\"enchild\",\"enpeople\"],\"tip\":\"man y woman se han quedado sin hueco: los tres primeros pedían plural rebelde, y el cuarto, people, ya lo es de nacimiento.\"},{\"id\":\"ena1m2l6e12\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — hay UN solo error\",\"wrong\":\"The people in London is very nice.\",\"answers\":[\"The people in London are very nice.\"],\"why\":\"people ya es plural en inglés: no existe «one people». Pide are. El «la gente ES» del español es justo el calco que el examen pone a propósito.\",\"translation\":\"La gente de Londres es muy simpática.\",\"hints\":[\"El sujeto es people: cuéntalo como «personas»\",\"people ... very nice\"],\"itemIds\":[\"enpeople\",\"ennice\"],\"tip\":\"Recuerda la pareja: people ARE, pero family IS. La gente son muchos; la familia es un grupo.\"},{\"id\":\"ena1m2l6e5\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"They're my children.\",\"translation\":\"Son mis hijos.\",\"hints\":[\"they are, fundido\",\"They're my ...\"],\"itemIds\":[\"entheyare\",\"enchild\"]}]},{\"kind\":\"note\",\"note\":{\"title\":\"Cuento: la foto de Valeria\",\"body\":\"\u003ci\u003eEn el café. Sam trae dos tés. Valeria le enseña a Amy una foto de su familia. Lee en voz alta — las palabras subrayadas suenan al tocarlas.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e1. Amy: “Valeria, who's she?”\u003cbr/\u003e2. Valeria: “She's my mother. Her name is Rosa. She's very nice.”\u003cbr/\u003e3. Amy: “And who's he? He's tall!”\u003cbr/\u003e4. Valeria: “He's my brother, Andrés. He's young and funny.”\u003cbr/\u003e5. Amy: “[[Who are they?|¿Quiénes son ellos?]]”\u003cbr/\u003e6. Valeria: “They're my [[grandparents|abuelos]].”\u003cbr/\u003e7. Amy: “Your family is very nice!”\u003cbr/\u003e8. Valeria: “Thanks! And this is our [[dog|perro]], Simón!”\u003cbr/\u003e9. Amy: “Ha! He's funny!”\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m2l6e6\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 3-4)\",\"question\":\"¿Quién es alto?\",\"options\":[\"Andrés, el hermano\",\"Rosa, la madre\",\"Simón, el perro\"],\"answer\":0,\"whyWrong\":[null,\"Rosa es very nice — simpática\",\"Simón es funny — el gracioso de la foto\"],\"itemIds\":[\"entall\",\"enhesmybrother\"]},{\"id\":\"ena1m2l6e7\",\"type\":\"order\",\"prompt\":\"Ordena la escena de la foto\",\"sentences\":[\"Valeria, who's she?\",\"She's my mother. Her name is Rosa.\",\"And who's he?\",\"He's my brother, Andrés.\",\"They're my grandparents.\"],\"translation\":\"Primero la madre, luego el hermano, al final los abuelos.\",\"hints\":[\"Amy pregunta, Valeria responde — dos veces\",\"Los abuelos cierran la ronda\"],\"itemIds\":[\"enwhoisshe\",\"enshesmysister\",\"enwhoishe\",\"enhesmybrother\",\"entheyare\"]},{\"id\":\"ena1m2l6e8\",\"type\":\"shadow\",\"prompt\":\"Sombrea a Valeria: pégate al audio\",\"text\":\"He's my brother. He's young and funny.\",\"phonetic\":\"jíis̬ mái BRÁ-da — jíis̬ YANG and FA-ni\",\"translation\":\"Es mi hermano. Es joven y gracioso.\",\"reps\":2,\"itemIds\":[\"enhesmybrother\",\"enyoung\",\"enfunny\"],\"tip\":\"Dos he's seguidos: que salgan fundidos, «jíis̬», sin pensar en el sujeto — ya es automático.\"},{\"id\":\"ena1m2l6e9\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 7 — ¡ojo al singular!\",\"text\":\"Your family ___ very nice! (tu familia es…)\",\"answers\":[\"is\"],\"translation\":\"¡Tu familia es muy simpática!\",\"hints\":[\"family = el grupo, en singular\",\"people are, pero family ...\"],\"itemIds\":[\"enfamily\",\"ennice\"],\"tip\":\"El par que confunde: people ARE (plural) pero family IS (el grupo, singular).\"},{\"id\":\"ena1m2l6e10\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Son mis hijos. Son muy graciosos.\",\"answers\":[\"They're my children. They're very funny.\",\"They are my children. They are very funny.\"],\"hints\":[\"they're + plural rebelde + adjetivo SIN -s\",\"They're my children. They're very ...\"],\"itemIds\":[\"entheyare\",\"enchild\",\"envery\",\"enfunny\"],\"tip\":\"they're puesto, children rebelde, funny sin -s: las tres trampas del módulo, esquivadas de una. Módulo cerrado.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — vocabulario de familia\",\"url\":\"https://www.bbc.co.uk/learningenglish\",\"note\":\"Busca «family vocabulary»: audios británicos con men, women y children en contexto.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"conten
