L14\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tb74,"])</script><script>self.__next_f.push([1,"This exhibition began, as most of ours do, with a gap in the collection. We have still lifes; we have a small holding of contemporary photography; we do not have, or had not had until this spring, a single work that held those two traditions in the same frame. The photograph in the small room at the back, on loan from a municipal gallery in Leeds, is that work. It shows a woman on a station platform. The caption gives her no name. The lighting is the lighting of a winter afternoon in the North, which is to say it is not kind.\u003cbr/\u003e\u003cbr/\u003eVisitors who have been walking around the main rooms first — the still lifes on the west wall, the installation of stacked chairs in the centre — sometimes ask why we have given the quietest picture the quietest room. The answer is practical and it is also the argument of the show. The installation is loud by design: it is what had been going on in this neighbourhood in the years when the gallery was closed, the years of chairs left on pavements and of rooms that no longer had a use. The still lifes, most of them from the collection, are what the neighbourhood looks like when nobody is performing it. The photograph is what happens when those two facts occupy the same person.\u003cbr/\u003e\u003cbr/\u003eI had been looking for a loan of this kind for three years. Leeds said no, then said not yet, then said yes on the condition that we hung it alone. That condition, which I had been ready to refuse, proved to be the right one. Standing in the doorway of the small room, you cannot take a picture of the picture. You have to stay.\u003cbr/\u003e\u003cbr/\u003eA note on the written word, because several visitors have asked. The captions in this show are shorter than usual. That is not a lack of research. It is a decision. I had done the research — dates, printers, the name of the station, the likely year of the woman's coat — and I left most of it in the catalogue. A caption that tells you everything is a caption that has decided you will not look. I would rather you looked.\u003cbr/\u003e\u003cbr/\u003eThe opening night, last Friday, was full. A woman who had not been inside a gallery in forty years stood in the small room for twenty minutes and said nothing. I am not going to pretend that I had planned that. I am going to say that it is the reason the loan is here. Beneath it all, this show is not about photography, or still life, or even about Palmer Road. It is about the length of time a person can spend looking, and about the fact that some of us had forgotten how.\u003cbr/\u003e\u003cbr/\u003eIf you come on a weekday afternoon, the small room is often empty. That is by design as well. I would rather three people stayed twenty minutes than thirty people took a photograph of the photograph and left. The collection can live without another still life. It cannot live, I think, without a room in which the written word knows when to stop. That is what I had been looking for. That is what Leeds, in the end, allowed us to hang."])</script><script>self.__next_f.push([1,"18:Tb84,"])</script><script>self.__next_f.push([1,"I have a lot of time for Ade Balogun. He took a gallery that had been closed for eighteen months and made it a place people walk into on a Tuesday. That is not nothing. It is also not the same as making an argument, and Underneath, the current show, wants to be an argument dressed as a quiet room.\u003cbr/\u003e\u003cbr/\u003eThe installation of stacked chairs is the loudest thing Palmer Road has seen since the gallery reopened, and it is the most honest. Chairs that had been left on pavements, rooms that had lost their use: we lived that. The still lifes on the west wall are competent, most of them from the collection, none of them a reason to cross the city. Then there is the photograph. On loan from Leeds, hung alone, lit as if it were a relic. A woman on a platform. No name. Ade's caption, which I copy here in full, reads: «Station, winter, c. 1984.» That is not restraint. That is a refusal to do the work of the written word, and it leaves the visitor — who has paid nothing, this is a free gallery, I know — to invent a story the curator had already researched and chosen not to share.\u003cbr/\u003e\u003cbr/\u003eI asked Leeds. The woman has a name. The station has a name. The coat was bought in a shop that still exists. Ade had done the research; he says so in the catalogue, which costs twelve pounds and is not in the small room. So the quietness is a design. It is also, looking back at the opening night, a piece of theatre. A woman stood in that room for twenty minutes and said nothing, and by Monday the story was already being told as proof that the hanging had worked. Perhaps it had. Perhaps what had been going on underneath was simpler: she had recognised a platform, and nobody in the room had the information to tell her she was right.\u003cbr/\u003e\u003cbr/\u003eContemporary art is allowed to withhold. Classical art, in the same building, is not: the still lifes come with dates, painters, bequests. The double standard is the interesting thing in this show, and Ade does not mention it. He had been looking for a loan that would hold two traditions in one frame. He found one, and then he took the frame away.\u003cbr/\u003e\u003cbr/\u003eGo and see it. Take a neighbour who has not been inside in years. Stand in the small room. Then go to the desk and ask for the catalogue, or ask Ade, who will tell you, if you ask, the name of the station. A gallery that makes you ask is a gallery that is still doing its job. A gallery that makes you pay twelve pounds to finish looking is a gallery that has confused silence with depth.\u003cbr/\u003e\u003cbr/\u003eI will be fair. The lighting in that room is the best Ade has hung since he took over, and the bench is in the right place, which sounds like a small thing until you have stood in a dozen galleries where the bench is a joke. Photography, in the right hands, does not need a paragraph. It does, however, need a name, and the name is in a book that costs twelve pounds. That is the story underneath this show, and it is not the one on the wall."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m10l6\",\"phaseId\":\"enb2m10\",\"title\":\"The same show, two captions\",\"subtitle\":\"Una reseña que convence y una ficha que informa: el arte también tiene postura\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El léxico con el que se habla de una exposición\",\"itemIds\":[\"enb2m10anexhibition\",\"enb2m10thecurator\",\"enb2m10thecollection\",\"enb2m10onloan\",\"enb2m10astilllife\",\"enb2m10aninstallation\",\"enb2m10thecaption\",\"enb2m1thewrittenword\",\"enb2m10photography\",\"enb2m10theopeningnight\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El comisario escribe una capa; el crítico, otra\",\"body\":\"Las dos lecturas de hoy son de la misma exposición en la galería del barrio, la que comisaría Ade Balogun. Valeria las lee en la mesa de la biblioteca, el jueves, antes de llevar a Nora. Nadie se ha mudado.\u003cbr/\u003e\u003cbr/\u003eLa primera es la \u003cb\u003eficha de sala\u003c/b\u003e de Ade: informa, da procedencia, se reserva. La segunda es una \u003cb\u003ereseña\u003c/b\u003e en el semanario local: tiene tesis, tiene adjetivos, y usa a Nora —sin nombrarla— como prueba de que el relato de Ade no se sostiene. Las dos hablan de una fotografía en préstamo, de un bodegón y de una instalación. Lo que cambia es la capa que ponen debajo.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m10l6e1\",\"type\":\"read\",\"prompt\":\"Lectura 1 — ficha de sala. ¿Informa, o convence? Toca las glosas si te bloquean.\",\"title\":\"Underneath: notes on the current exhibition\",\"source\":\"Texto de sala de Ade Balogun, comisario de la Palmer Road Gallery. Adaptado.\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m10l6e1q1\",\"q\":\"¿De dónde sale la fotografía de la sala del fondo?\",\"options\":[\"Está en préstamo de una galería municipal de Leeds.\",\"Es de la colección permanente de Palmer Road.\",\"Ade la compró en la inauguración.\"],\"answer\":0,\"why\":\"On loan from a municipal gallery in Leeds. La colección de Palmer Road tiene bodegones, no esa foto.\"},{\"id\":\"enb2m10l6e1q2\",\"q\":\"¿Por qué las fichas de sala son más cortas de lo habitual?\",\"options\":[\"Porque Ade decidió dejar la investigación en el catálogo, para que la gente mire.\",\"Porque no había hecho la investigación.\",\"Porque Leeds se lo impuso como condición del préstamo.\"],\"answer\":0,\"why\":\"«That is not a lack of research. It is a decision… I left most of it in the catalogue.» Leeds impuso colgarla sola, no el texto corto.\"},{\"id\":\"enb2m10l6e1q3\",\"q\":\"«A caption that tells you everything is a caption that has decided you will not look.» ¿Qué está defendiendo Ade?\",\"options\":[\"Que el texto de sala puede quitarle al visitante el trabajo de mirar.\",\"Que las fichas largas son de un nivel inferior.\",\"Que el público de Palmer Road no lee.\"],\"answer\":0,\"inference\":true,\"why\":\"Has decided you will not look: el texto largo decide por ti. No insulta al barrio; insulta al género de la ficha-rollo.\"},{\"id\":\"enb2m10l6e1q4\",\"q\":\"Cuando Ade cuenta a la mujer de los veinte minutos, ¿para qué la usa?\",\"options\":[\"Como prueba de que el préstamo tiene sentido, no como anécdota de inauguración.\",\"Para rellenar el final, porque el texto se le había quedado corto.\",\"Para criticar que esa mujer no supiera hablar de arte.\"],\"answer\":0,\"inference\":true,\"why\":\"«I am going to say that it is the reason the loan is here.» La convierte en argumento. Said nothing no es un fallo: es el dato.\"},{\"id\":\"enb2m10l6e1q5\",\"q\":\"Según Ade, ¿qué es «lo de debajo» de la exposición?\",\"options\":[\"El tiempo que una persona puede pasar mirando, y que algunos lo habían olvidado.\",\"La historia personal de la mujer de la fotografía.\",\"La deuda de la galería con Leeds.\"],\"answer\":0,\"why\":\"«Beneath it all, this show is not about photography… It is about the length of time a person can spend looking.»\"}],\"itemIds\":[\"enb2m10thecurator\",\"enb2m10onloan\",\"enb2m10thecaption\",\"enb2m10thecatalogue\",\"enb2m10beneathitall\"],\"tip\":\"Ade informa, y al final se moja: the reason the loan is here. Un informe que se reserva hasta la última frase sigue siendo un informe. No es una reseña.\"},{\"id\":\"enb2m10l6e2\",\"type\":\"read\",\"prompt\":\"Lectura 2 — reseña. La misma exposición, otra capa. ¿Informa, o convence?\",\"title\":\"The story Ade is not hanging\",\"source\":\"Reseña de Colin Reeve en el Palmer Road Weekly. Adaptada. Colin ya cubría el barrio en el B2; aquí solo firma una crítica.\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m10l6e2q1\",\"q\":\"¿Qué pone, según Colin, la ficha de la fotografía?\",\"options\":[\"«Station, winter, c. 1984.»\",\"El nombre de la mujer y el de la estación.\",\"Un párrafo de investigación.\"],\"answer\":0,\"why\":\"Lo copia entero: Station, winter, c. 1984. Los nombres están en el catálogo de doce libras.\"},{\"id\":\"enb2m10l6e2q2\",\"q\":\"¿Qué hizo Colin que Ade no pone en la sala?\",\"options\":[\"Llamar a Leeds y confirmar que la mujer y la estación tienen nombre.\",\"Comprar la fotografía para Palmer Road.\",\"Cerrar la sala pequeña el lunes.\"],\"answer\":0,\"why\":\"«I asked Leeds. The woman has a name.» Es el golpe de la reseña.\"},{\"id\":\"enb2m10l6e2q3\",\"q\":\"«The quietness is a design. It is also… a piece of theatre.» ¿De qué acusa a Ade, sin decir la palabra mentira?\",\"options\":[\"De haber convertido el silencio de una visitante en prueba de que su montaje funciona.\",\"De haber inventado a la mujer de los veinte minutos.\",\"De cobrar entrada el viernes de inauguración.\"],\"answer\":0,\"inference\":true,\"why\":\"Theatre: la anécdota se está usando. «By Monday the story was already being told as proof.» No dice liar; dice que han montado la escena.\"},{\"id\":\"enb2m10l6e2q4\",\"q\":\"El doble rasero que Colin señala, ¿cuál es?\",\"options\":[\"El arte contemporáneo puede callar datos; los bodegones clásicos, en la misma casa, no.\",\"Leeds presta obras y Palmer Road no.\",\"Los vecinos entran gratis y los críticos pagan.\"],\"answer\":0,\"inference\":true,\"why\":\"«Contemporary art is allowed to withhold. Classical art, in the same building, is not.» El contraste está escrito. Ade no lo menciona, y esa omisión ES la tesis.\"},{\"id\":\"enb2m10l6e2q5\",\"q\":\"Las dos lecturas coinciden en un hecho y se pelean por su significado. ¿Cuál es el hecho?\",\"options\":[\"Una mujer estuvo veinte minutos en silencio en la sala pequeña.\",\"La galería cobra doce libras por entrar.\",\"Los bodegones son de Leeds.\"],\"answer\":0,\"inference\":true,\"why\":\"Ade: the reason the loan is here. Colin: proof that the hanging had worked, o una mujer que reconoció un andén. Mismo suceso, dos capas. Sintetizar es no casarse con ninguna.\"}],\"itemIds\":[\"enb2m10anexhibition\",\"enb2m1thewrittenword\",\"enb2m10contemporaryart\",\"enb2m10classicalart\",\"enb2m10theopeningnight\"],\"tip\":\"Colin no dice que la exposición sea mala: dice que el silencio está diseñado. Ade no dice que Colin esté equivocado: no lo ha leído todavía. Tú sí.\"},{\"id\":\"enb2m10l6e3\",\"type\":\"mc\",\"prompt\":\"Postura, otra vez\",\"question\":\"¿Desde dónde habla cada texto?\",\"options\":[\"Ade informa y se reserva; Colin convence de que esa reserva es teatro.\",\"Ade ataca a Colin; Colin defiende a Ade.\",\"Los dos informan, y las opiniones están solo en las preguntas.\"],\"answer\":0,\"whyWrong\":[null,\"Ade no menciona a Colin. Colin tiene «a lot of time for Ade» y aun así le pega.\",\"La reseña tiene tesis desde el primer párrafo. Eso no es informar.\"],\"itemIds\":[\"enb2m10thecurator\",\"enb2m10thestoryunderneath\"]},{\"id\":\"enb2m10l6e4\",\"type\":\"paraphrase\",\"prompt\":\"La capa de Ade, en una relativa. Prohibido el punto de en medio\",\"source\":\"Ade had done the research. He left most of it in the catalogue.\",\"forbid\":[\"Then\",\"After that\",\"So\"],\"answers\":[\"Ade, who had done the research, left most of it in the catalogue.\",\"Ade left most of the research he had done in the catalogue.\"],\"translation\":\"Ade, que había hecho la investigación, dejó la mayor parte en el catálogo.\",\"itemIds\":[\"enb2m5research\",\"enb2m10thecatalogue\"]},{\"id\":\"enb2m10l6e5\",\"type\":\"bucket\",\"prompt\":\"¿Ficha de Ade o reseña de Colin?\",\"categories\":[\"Ficha de sala (Ade)\",\"Reseña (Colin)\"],\"items\":[{\"text\":\"A caption that tells you everything is a caption that has decided you will not look.\",\"bucket\":0},{\"text\":\"That is not restraint. That is a refusal to do the work of the written word.\",\"bucket\":1},{\"text\":\"Leeds said no, then said not yet, then said yes.\",\"bucket\":0},{\"text\":\"I asked Leeds. The woman has a name.\",\"bucket\":1},{\"text\":\"I would rather you looked.\",\"bucket\":0},{\"text\":\"A gallery that makes you pay twelve pounds to finish looking…\",\"bucket\":1}],\"itemIds\":[\"enb2m10thecaption\",\"enb2m1thewrittenword\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
