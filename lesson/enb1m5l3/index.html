If I \u003cb\u003ewon\u003c/b\u003e the lottery, I \u003cb\u003ewould give up\u003c/b\u003e work.\u003c/i\u003e (no me va a tocar)\u003cbr/\u003e\u003cbr/\u003eFíjate en que la mecánica es la misma: \u003cb\u003ela mitad del if va un paso atrás\u003c/b\u003e. En el primero, presente; en el segundo, pasado. Y el modal (\u003ci\u003ewill\u003c/i\u003e o \u003ci\u003ewould\u003c/i\u003e) vive siempre en la otra mitad. Es la misma regla del día uno, con dos ajustes de temperatura.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí llega el segundo calco del módulo, que es de los que fosilizan:\u003c/b\u003e\u003cbr/\u003e❌ \u003ci\u003eIf it \u003cb\u003ewill rain\u003c/b\u003e, we'll take the bus.\u003c/i\u003e\u003cbr/\u003e✅ \u003ci\u003eIf it \u003cb\u003erains\u003c/b\u003e, we'll take the bus.\u003c/i\u003e\u003cbr/\u003eEn español la subordinada lleva subjuntivo («si llueve», «cuando llegue») y el alumno, al no encontrar subjuntivo en inglés, mete un futuro porque el sentido es futuro. La explicación que funciona: \u003cb\u003eel inglés ya sabe que es futuro por la otra mitad; repetirlo le sobra.\u003c/b\u003e Lo mismo pasa detrás de \u003ci\u003ewhen\u003c/i\u003e, \u003ci\u003eas soon as\u003c/i\u003e, \u003ci\u003euntil\u003c/i\u003e y \u003ci\u003ebefore\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo eliges en dos segundos:\u003c/b\u003e pregúntate si estarías dispuesto a apostar. Si sí, primero. Si te da la risa, segundo. \u003ci\u003eIf I finish early, I'll call you\u003c/i\u003e (puede pasar) frente a \u003ci\u003eIf I finished early every day, I'd have a life\u003c/i\u003e (no pasa)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l3\",\"phaseId\":\"enb1m5\",\"title\":\"Real or unreal?\",\"subtitle\":\"Primer y segundo condicional — y el futuro que en inglés no cabe detrás de «if»\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que puede pasar y lo que no\",\"itemIds\":[\"enb1m5ifyoukeepthereceipt\",\"enb1m5illpayyouback\",\"enb1m5ifiwonthelottery\",\"enb1m5whatifit\",\"enb1m5inthatcase\",\"enb1m5mightaswell\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: lo que decide no es el tiempo, es si te lo crees\",\"body\":\"$17\",\"table\":[[\"Primero — posible\",\"Segundo — irreal\"],[\"If you keep the receipt,\",\"If I won the lottery,\"],[\"…they will change it.\",\"…I would give up work.\"],[\"presente + will\",\"pasado + would\"],[\"Nunca: If it will rain…\",\"Nunca: If I would win…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l3e1\",\"type\":\"bucket\",\"prompt\":\"¿El que habla se lo cree o no?\",\"categories\":[\"Lo ve POSIBLE — 1.er condicional\",\"Lo ve IRREAL — 2.º condicional\"],\"items\":[{\"text\":\"If you keep the receipt, they'll change it.\",\"bucket\":0},{\"text\":\"If I won the lottery, I'd give up work.\",\"bucket\":1},{\"text\":\"If the bus is late, I'll get a taxi.\",\"bucket\":0},{\"text\":\"If I were taller, I'd play basketball.\",\"bucket\":1},{\"text\":\"If it rains, we'll stay in.\",\"bucket\":0},{\"text\":\"If I had a car, I'd drive you home.\",\"bucket\":1}],\"itemIds\":[\"enb1m5ifyoukeepthereceipt\",\"enb1m5ifiwonthelottery\",\"enb1m5ifihadthemoney\"],\"tip\":\"No hay nada que memorizar: se mira la mitad del if. ¿Presente? Posible. ¿Pasado? Irreal. La frase te dice sola de qué mundo habla.\"},{\"id\":\"enb1m5l3e2\",\"type\":\"mc\",\"prompt\":\"El calco del subjuntivo\",\"question\":\"«Si mañana llueve, cogemos el autobús» →\",\"options\":[\"If it will rain tomorrow, we'll take the bus.\",\"If it rains tomorrow, we'll take the bus.\",\"If it would rain tomorrow, we'll take the bus.\"],\"answer\":1,\"whyWrong\":[\"El futuro no cabe detrás de «if»: la otra mitad ya dice que es futuro.\",null,\"«would» es del condicional irreal, y llover mañana es de lo más posible.\"],\"itemIds\":[\"enb1m5ifyoukeepthereceipt\"],\"tip\":\"Lo mismo detrás de «when», «as soon as», «until» y «before»: «When I get there, I'll ring you», nunca «When I will get there».\"},{\"id\":\"enb1m5l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"If you will keep the receipt, they will change it.\",\"answers\":[\"If you keep the receipt, they will change it.\"],\"why\":\"Sobra el primer «will». Detrás de «if» va presente simple, aunque estemos hablando del futuro: el «will» de la otra mitad ya lo marca.\",\"translation\":\"Si guardas el tique, te lo cambian.\",\"itemIds\":[\"enb1m5ifyoukeepthereceipt\"]},{\"id\":\"enb1m5l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa la mitad del if\",\"text\":\"If the shop ___ me a refund, I'll buy the other one.\",\"answers\":[\"gives\"],\"translation\":\"Si la tienda me devuelve el dinero, me compro el otro.\",\"hints\":[\"Presente, no futuro\",\"Y el sujeto es «the shop»: tercera persona\"],\"itemIds\":[\"enb1m5ifyoukeepthereceipt\",\"enb1m5refund\"],\"tip\":\"Presente simple, y con su -s de tercera persona. Ese detalle se cae muchísimo justo aquí, porque la cabeza está ocupada con el condicional.\"},{\"id\":\"enb1m5l3e5\",\"type\":\"transform\",\"prompt\":\"De lo posible a lo imposible\",\"source\":\"If I win the lottery, I'll give up work.\",\"instruction\":\"Dilo como irreal: no te va a tocar\",\"answers\":[\"If I won the lottery, I would give up work\",\"If I won the lottery I would give up work\",\"If I won the lottery, I'd give up work\"],\"translation\":\"Si me tocara la lotería, dejaría de trabajar.\",\"hints\":[\"Cada mitad baja un escalón: presente → pasado\",\"If I won the lottery, I ... give up work\"],\"itemIds\":[\"enb1m5ifiwonthelottery\"],\"tip\":\"Un solo paso atrás en las dos mitades: «win → won» y «will → would». No hay más máquina que esa.\"},{\"id\":\"enb1m5l3e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje que Valeria le manda a Clara\",\"text\":\"If the shop ___ me my money back tomorrow, I'll be delighted. If I ___ rich, I'd forget about it, but I'm not. And if you ___ the receipt, they always change it — so guard yours with your life.\",\"answers\":[\"gives\",\"were\",\"keep\"],\"bank\":[\"gives\",\"were\",\"keep\",\"gave\",\"am\",\"kept\"],\"translation\":\"Si mañana la tienda me devuelve el dinero, encantada. Si fuera rica, lo dejaría estar, pero no lo soy. Y si guardas el tique, siempre te lo cambian: así que guarda el tuyo con tu vida.\",\"itemIds\":[\"enb1m5ifyoukeepthereceipt\",\"enb1m5ifihadthemoney\",\"enb1m5refund\"],\"tip\":\"Tres huecos y tres decisiones distintas en cuatro líneas: posible (gives), irreal (were) y regla general (keep). El banco trae los pasados a propósito: elegirlos es cambiar de mundo sin darte cuenta.\"},{\"id\":\"enb1m5l3e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Si me tocara la lotería, dejaría de trabajar.\",\"answers\":[\"If I won the lottery, I would give up work\",\"If I won the lottery I would give up work\",\"If I won the lottery, I'd give up work\",\"If I won the lottery, I would stop working\"],\"hint\":\"Pasado en la primera mitad, condicional en la segunda\",\"itemIds\":[\"enb1m5ifiwonthelottery\"],\"tip\":\"«tocar la lotería» es «win the lottery», con «win»: en inglés no te toca nada, la ganas tú. Y ojo con el artículo: THE lottery.\"},{\"id\":\"enb1m5l3e8\",\"type\":\"mc\",\"prompt\":\"La pregunta que abre cualquier plan B\",\"question\":\"«¿Y si no funciona?» →\",\"options\":[\"What if it doesn't work?\",\"And if it doesn't work?\",\"What would it doesn't work?\"],\"answer\":0,\"whyWrong\":[null,\"Se entiende, pero suena a traducción: la fórmula hecha es «What if…?».\",\"Mezcla dos estructuras y no significa nada.\"],\"itemIds\":[\"enb1m5whatifit\",\"enb1m5inthatcase\"],\"tip\":\"«What if…?» es una frase entera sin verbo principal, y se usa igual con presente («What if it doesn't work?») que con pasado («What if they said no?»). En el oral vale oro: abre una objeción sin llevar la contraria de frente.\"},{\"id\":\"enb1m5l3e9\",\"type\":\"build\",\"prompt\":\"Construye la hipótesis de la lotería\",\"target\":\"If I won the lottery I would give up work\",\"translation\":\"Si me tocara la lotería, dejaría de trabajar\",\"distractors\":[\"win\",\"will\"],\"itemIds\":[\"enb1m5ifiwonthelottery\"],\"tip\":\"Las dos fichas que sobran son la versión posible de la frase. Aquí no la queremos: la lotería no toca.\"},{\"id\":\"enb1m5l3e10\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? Escucha con atención: la diferencia es una sílaba entera que se evapora.\",\"book\":\"If I had the money, I would buy it.\",\"real\":\"If I had the money, I'd buy it.\",\"translation\":\"Si tuviera el dinero, lo compraría.\",\"itemIds\":[\"enb1m5ifihadthemoney\"],\"tip\":\"En el habla normal «I would» se funde en «aid». Y esto no es un detalle de acento: si no oyes el «'d», no oyes el condicional, y entiendes «I buy it». La gramática se te vuelve inaudible — que es justo lo que le pasa al hispanohablante en el Listening.\"},{\"id\":\"enb1m5l3e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I'll pay you back on Friday.\",\"translation\":\"Te lo devuelvo el viernes.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I will»\",\"I'll pay you ... on Friday\"],\"itemIds\":[\"enb1m5illpayyouback\"],\"tip\":\"«pay back» es devolver DINERO. Devolver una cosa comprada es «take it back» o «return it», y devolverle algo prestado a alguien es «give it back». Tres verbos donde el español pone uno.\"},{\"id\":\"enb1m5l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Si guardas el tique, te lo cambian sin problema.\",\"answers\":[\"If you keep the receipt, they'll change it without any problem\",\"If you keep the receipt, they will change it without any problem\",\"If you keep the receipt they'll change it without any problem\",\"If you keep the receipt, they'll change it with no problem\"],\"hints\":[\"Presente en la mitad del if, «will» en la otra\",\"If you keep the receipt, they ... change it ...\"],\"itemIds\":[\"enb1m5ifyoukeepthereceipt\",\"enb1m5proofofpurchase\"],\"tip\":\"Si te ha salido «If you will keep», vuelve a la nota. Es el calco número dos del módulo y se cobra en las cuatro destrezas.\"},{\"id\":\"enb1m5l3e13\",\"type\":\"audiomc\",\"prompt\":\"LISTENING EN FORMATO REAL: dos voces y varios datos seguidos. Usa el cuaderno mientras suena — en el examen también se puede. Dos escuchas.\",\"notepad\":true,\"audio\":\"Right, so the washing machine. Two hundred and eighty, or three hundred and forty for the one with the longer warranty.|What's the difference in the warranty?|One year against five. And the five-year one includes call-outs, which the other doesn't.|Sixty pounds for four extra years. Hmm.|Put it this way: if the machine broke in year three, a repair would cost you about a hundred and twenty, plus the call-out.|And if it doesn't break?|Then you've spent sixty pounds on nothing. I'm not going to pretend otherwise. Most of them last eight or nine years, mind you.|Right. I'll take the cheaper one and put the sixty by, then. If it goes wrong I'll have the money ready.\",\"question\":\"¿Qué decide la clienta al final?\",\"options\":[\"Llevarse la más barata y apartar las sesenta libras por si acaso\",\"Llevarse la de garantía larga porque le sale más a cuenta\",\"No comprar ninguna de las dos hoy\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Es lo que le ofrece el vendedor, pero ella escoge lo contrario.\",\"Sí compra: dice «I'll take the cheaper one».\"],\"itemIds\":[\"enb1m5underwarranty\",\"enb1m5ifiwonthelottery\",\"enb1m5natputabitby\"],\"tip\":\"El audio pone los dos condicionales cara a cara: «if the machine broke… a repair WOULD cost» (irreal, es un supuesto) y «if it goes wrong I'LL have the money» (posible, es su plan). Misma conversación, dos temperaturas.\"}]}],\"resources\":[{\"label\":\"Citizens Advice — Consumer rights (Reino Unido)\",\"url\":\"https://www.citizensadvice.org.uk/consumer/\",\"note\":\"La página a la que va todo el mundo cuando algo sale mal. Lee «Return faulty goods»: es inglés B1 auténtico y te sirve para vivir aquí.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
