von weniger Leuten erledigt werden. Das lasse sich so nicht machen. Herr Brandt blieb sachlich. Der Plan sei mit der Geschäftsführung abgestimmt. Die Küche sei samstags geöffnet, das sei der Zustand, von dem das Lokal lebe. Vertretung sei zu klären, bevor jemand frei nehme. Das sei zu schaffen.\n\nKai widersprach nicht laut. Er zitierte. Eine Betriebsvereinbarung müsse geschlossen werden, bevor ein Dienstplan mit mehr Samstagen gelte. Überstunden müssten ausgeglichen werden, nicht angeordnet. Die Mitbestimmung sei kein Wunsch, sie sei im Tarifvertrag festgehalten. «So wird das gehandhabt», sagte er, «nicht anders.» Nico dachte an seine Probezeit, in der ihm fast gekündigt worden war, weil er einen Samstag nicht konnte. Eine Abmahnung wegen eines Plans, der ihnen nicht vorgelegt worden sei — das gehe nicht.\n\nHerr Brandt schloss: bis Montag bleibe die Küche geöffnet. Die Einarbeitung der neuen Kollegin müsse bis Freitag erledigt werden. Das müsse im Arbeitsablauf stehen, nicht nur im Kopf. Das Protokoll, bitte sachlich: es werde diskutiert, nicht gestritten.\n\nZwei Tage später las Sofía, die mit Nico isst, wenn die Schicht es zulässt, einen Gastbeitrag in der Zürcher «NZZ». Die Autorin, eine Personalfachfrau, schreibt über denselben Konflikt, nur ohne Herd. In der Schweiz werde ein [[Pensum|jornada pactada en % — helvetismo; en Alemania: die Stelle / die Arbeitszeit]] von achtzig Prozent oft als Lösung verkauft. Wer weniger Tage komme, müsse an den Tagen, an denen er da sei, mehr schaffen. Die Überstunden würden dann nicht als Überstunden gebucht, sondern als «flexibles Pensum». Das lasse sich schön rechnen und schlecht belegen. Eine echte Mitbestimmung, so die Autorin, fange nicht beim Pensum an, sondern beim Dienstplan: er müsse vorgelegt werden, bevor er gelte. In Zürich, schreibt sie, gehe man bei Streit zuerst zum [[RAV|oficina regional de empleo suiza; en Alemania: die Arbeitsagentur]] — nicht zur Arbeitsagentur, die es dort so nicht gibt. Und in der ganzen [[Strasse|calle — en Suiza sin ß: Strasse; en Alemania: Straße]] der Altstadt hänge an den Türen dieselbe Notiz: «Teilzeit möglich. Pensum nach Absprache.» Gross gedruckt, ohne ß, und trotzdem derselbe Streit wie in Brandts Küche: wer darf den Plan ändern, bevor er hängt. Die Autorin nennt noch drei Dinge, die in jeder Betriebsversammlung landen und selten im Dienstplan stehen: der Zuschlag für Nachtarbeit, die Pausenregelung, der Ruhetag. Ohne sie, schreibt sie, sei Arbeitsschutz nur ein Wort an der Wand. Der Mindestlohn werde gezahlt, das sei das Gesetz; die Anwesenheit am Samstag werde erwartet, das sei die Kultur. Dazwischen werde verhandelt, oder eben nicht.\n\nSofía schickte Nico den Link. Er antwortete nicht mit «Das geht». Er antwortete: «Das lässt sich machen. Wenn der Betriebsrat zustimmt.»"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m2l6\",\"phaseId\":\"b2m2\",\"title\":\"Wer darf den Plan ändern?\",\"subtitle\":\"Lectura larga: dos voces sobre el mismo cuadrante\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del conflicto\",\"itemIds\":[\"b2m2betriebsvereinbarung\",\"b2m2mitbestimmung\",\"b2m2pensum\",\"b2m2ausgleich\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: un procedimiento, dos dueños\",\"body\":\"Vas a leer un acta de cocina y, debajo, un artículo suizo sobre el mismo tipo de conflicto. No se trata de quién tiene razón: se trata de \u003cb\u003ecómo se dice lo que se hace\u003c/b\u003e — pasiva, Ersatz, convenio.\u003cbr/\u003e\u003cbr/\u003eNota plurizéntrica: el segundo texto es suizo. Verás \u003cb\u003e[[das Pensum|la jornada pactada en % — en Suiza; en Alemania se dice die Stelle o die Arbeitszeit]]\u003c/b\u003e y no verás ß: \u003cb\u003egross\u003c/b\u003e, \u003cb\u003eStrasse\u003c/b\u003e. En Suiza el paro lo gestiona el [[RAV|oficina regional de empleo suiza; en Alemania: die Arbeitsagentur]], no la Arbeitsagentur. Reconocer, no producir: en el Goe q5\",\"q\":\"Warum erwähnt der Text «Strasse» und «gross» ohne ß?\",\"options\":[\"Porque es un error del periódico\",\"Porque el texto es suizo: allí no hay ß, y el Goethe lo glosa igual que aquí\",\"Porque Brandt es suizo\"],\"answer\":1,\"inference\":true,\"why\":\"El artículo es de la NZZ de Zúrich. En Suiza no hay ß. Brandt sigue en Berlín.\"}],\"itemIds\":[\"b2m2dienstplan\",\"b2m2betriebsrat\",\"b2m2tarifvertrag\",\"b2m2betriebsvereinbarung\",\"b2m2mitbestimmung\",\"b2m2pensum\",\"b2m2ausgleich\",\"b2m2sichlassen\"]},{\"id\":\"b2m2l6e2\",\"type\":\"mc\",\"prompt\":\"El helvetismo\",\"question\":\"«ein Pensum von 80 Prozent» — en un examen Goethe escribirías…\",\"options\":[\"eine Stelle mit 80 Prozent / in Teilzeit\",\"ein Pensum von 80 Prozent\",\"ein RAV von 80 Prozent\"],\"answer\":0,\"whyWrong\":[null,\"Pensum se reconoce, no se produce en el Goethe\",\"RAV es la oficina de empleo suiza, no una jornada\"],\"itemIds\":[\"b2m2pensum\",\"b1m2teilzeit\"]},{\"id\":\"b2m2l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la compensación\",\"text\":\"Überstunden müssen ___ werden, nicht einfach angeordnet.\",\"answers\":[\"ausgeglichen\"],\"translation\":\"Las horas extra hay que compensarlas, no simplemente imponerlas.\",\"itemIds\":[\"b2m2ausgleich\",\"b1m2ueberstunden\"]},{\"id\":\"b2m2l6e4\",\"type\":\"transform\",\"prompt\":\"De man a pasiva impersonal\",\"source\":\"Man diskutiert hier, man streitet nicht.\",\"instruction\":\"Sin man, con pasiva\",\"answers\":[\"Es wird hier diskutiert, nicht gestritten\",\"Hier wird diskutiert, nicht gestritten\"],\"itemIds\":[\"b2m2eswirdgestreikt\",\"b2m2eswirdgearbeitet\"]},{\"id\":\"b2m2l6e5\",\"type\":\"gapbank\",\"prompt\":\"Resume el conflicto\",\"text\":\"Der Dienstplan ___ geändert werden. Eine Betriebsvereinbarung muss ___ geschlossen werden. Überstunden ___ sich ausgleichen.\",\"answers\":[\"soll\",\"zuerst\",\"lassen\"],\"bank\":[\"soll\",\"zuerst\",\"lassen\",\"ist\",\"man\",\"hat\"],\"translation\":\"El cuadran
