\"Unos 30 de 60, por la calidad\",\"0: por debajo del 50 %, Erfüllung cae a E\",\"Se prorratea al 47 %\"],\"answer\":1,\"whyWrong\":[\"La calidad no rescata la Erfüllung\",null,\"No se prorratea: es todo o nada\"],\"itemIds\":[\"b2m9energiewende\"],\"tip\":\"Cuenta las palabras. En B2 la tarea larga es el 60 % del módulo: quedarte corto es tirar el Schreiben entero.\"},{\"id\":\"b2m9l8e2\",\"type\":\"errorfix\",\"prompt\":\"Fuga de registro en la Nachricht\",\"wrong\":\"Sehr geehrter Herr Bergmann, kannst du das Jobticket prüfen?\",\"answers\":[\"Sehr geehrter Herr Bergmann, können Sie das Jobticket prüfen?\",\"Sehr geehrter Herr Bergmann, können Sie das Jobticket prüfen\"],\"why\":\"Si abres con Sehr geehrter, el texto entero va de Sie. Un du en la primera petición tumba el registro y la banda de Erfüllung.\",\"translation\":\"Estimado señor Bergmann, ¿podría revisar el abono de empresa?\",\"itemIds\":[\"b2m9zustaendigfuer\"]},{\"id\":\"b2m9l8e3\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 — Nachricht al Betriebsrat. Unas 100 palabras, registro Sie, 25 minutos.\",\"scenario\":\"Trabajas en la cocina con Nico. Escribe a Kai Bergmann, miembro del Betriebsrat: pide que se estudie un Jobticket para el equipo, explica el motivo con una rección de sustantivo, nombra una consecuencia para el turno y cierra con una petición cortés.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"frame\":[\"Anrede: Sehr geehrter Herr Bergmann,\",\"Motivo: Der Grund für … / Die Voraussetzung für …\",\"Consecuencia: Das wirkt sich auf … aus / Das führt zu …\",\"Petición en Konjunktiv II: Wäre es möglich …?\",\"Grußformel: Mit freundlichen Grüßen + nombre\"],\"bullets\":[\"Abre con Anrede formal y cierra con Grußformel\",\"Nombra el Jobticket y el motivo con Grund für o Voraussetzung für\",\"Señala una consecuencia (auswirken auf / führen zu)\",\"Pide algo con Konjunktiv II (Wäre es möglich / Könnten Sie)\"],\"checks\":[{\"re\":\"Sehr geehrte[sr].*Mit freundlichen Grüßen\",\"label\":\"Anrede y Grußformel\"},{\"re\":\"(Grund für|Voraussetzung für|Jobticket)\",\"label\":\"motivo con rección o Jobticket\"},{\"re\":\"(wirkt sich|führen zu|führt zu|auswirken)\",\"label\":\"consecuencia\"},{\"re\":\"(Wäre es möglich|Könnten Sie|Ich würde Sie bitten)\",\"label\":\"petición cortés\"}],\"minWords\":90,\"maxWords\":120,\"requireConnectors\":{\"min\":2,\"bank\":[\"weil\",\"deshalb\",\"außerdem\",\"damit\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"model\":\"Sehr geehrter Herr Bergmann, hiermit bitte ich Sie um die Prüfung eines Jobtickets für die Küche. Der Grund für diese Bitte liegt in den langen Arbeitswegen: mehrere Kolleginnen pendeln täglich mehr als vierzig Minuten mit dem Auto nach Mitte. Das wirkt sich auf die Pünktlichkeit der Frühschicht aus, weil die erste Bahn oft ausfällt. Außerdem wäre ein Ticket die Voraussetzung für den Umstieg auf den Nahverkehr, und wir könnten Energie einsparen. Wäre es möglich, das Thema in der nächsten Runde am kommenden Donnerstag zu behandeln? Mit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[\"b2m9grundfuer\",\"b2m9voraussetzungfuer\",\"b2m9sichauswirkenauf\",\"b2m9einsparen\"],\"tip\":\"Cien palabras dan para cuatro movimientos, no para diez. Anrede, motivo con rección, consecuencia, petición, Gruß. Sin un du.\"},{\"id\":\"b2m9l8e4\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 — Forumsbeitrag. Unas 150 palabras. Reacciona, argumenta, no narres.\",\"scenario\":\"En el foro de «Stadttakt» un oyente ha escrito que la Verkehrswende es un capricho de quien vive en el centro. Escribe tu comentario: reacciona, da tu postura, nombra una ventaja y una pega, y cierra con una propuesta.\",\"genre\":\"forum\",\"register\":\"du\",\"stimulus\":{\"author\":\"Markus B., Hörer\",\"text\":\"Die Verkehrswende ist ein Hobby der Leute in Prenzlauer Berg. Wer pendelt, braucht das Auto. Grafiken ändern daran nichts.\"},\"frame\":[\"Reacción al texto (den Beitrag gelesen)\",\"Tesis: Meiner Meinung nach / Ich bin überzeugt von …\",\"Causa con rección: Der Grund für … / Das liegt daran, dass …\",\"Concesión: Allerdings / Das mag zutreffen, aber …\",\"Propuesta: Voraussetzung für … wäre …\"],\"bullets\":[\"Reacciona al comentario publicado\",\"Da tu postura (überzeugt von / meiner Meinung nach / dafür/dagegen)\",\"Nombra una causa con rección (Grund für / liegt daran / Auswirkung auf)\",\"Concede algo y cierra con una propuesta (Voraussetzung für)\"],\"checks\":[{\"re\":\"(Beitrag|gelesen|Kommentar|Markus)\",\"label\":\"reacción al texto\"},{\"re\":\"(überzeugt von|Meiner Meinung nach|Ich bin der Meinung|dafür|dagegen)\",\"label\":\"postura\"},{\"re\":\"(Grund für|liegt daran|Auswirkung auf|Voraussetzung für)\",\"label\":\"rección de causa\"},{\"re\":\"(Allerdings|trotzdem|zwar|aber)\",\"label\":\"concesión\"}],\"minWords\":135,\"maxWords\":170,\"requireConnectors\":{\"min\":3,\"bank\":[\"weil\",\"allerdings\",\"trotzdem\",\"außerdem\",\"deshalb\",\"aber\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"model\":\"Ich habe den Beitrag von Markus gelesen und sehe das nur zum Teil so. Meiner Meinung nach braucht, wer nachts pendelt, tatsächlich eine Lösung, die kein Radweg ist. Allerdings ist der Grund für den Stau im Kiez nicht die Wende, sondern ein Nahverkehr, der nach Mitternacht kaum taktet. Das liegt daran, dass zwei Gruppen in einen Topf geworfen werden. Außerdem sinkt laut der Grafik der CO2-Ausstoß dort, wo Kurzstrecken wegfallen — das ist messbar und kein Hobby der Innenstadt. Trotzdem bleibt die Voraussetzung für einen echten Umstieg ein Nachtnetz, nicht das schlechte Gewissen der Leute im Prenzlauer Berg. Deshalb wünsche ich mir Jobtickets und verlässliche Taktzeiten, nicht Moral. Wer pendelt, ist nicht gegen die Wende; er wartet auf die Voraussetzung, und die Stadt ist dafür zuständig. Ohne diesen Takt bleibt der Verzicht auf das Auto für die Schicht ein leeres Wort.\",\"itemIds\":[\"b2m9grundfuer\",\"b2m9natliegtdaran\",\"b2m9voraussetzungfuer\",\"b2m9lautgrafik\"],\"tip\":\"Ciento cincuenta palabras son un argumento, no una anécdota. Si cuentas lo que te pasó el martes, estás escribiendo el B1 en el sitio del B2.\"},{\"id\":\"b2m9l8e5\",\"type\":\"gapbank\",\"prompt\":\"El esqueleto de la Nachricht\",\"text\":\"Der Grund ___ das Jobticket ist der Arbeitsweg. Das wirkt sich ___ die Pünktlichkeit aus. Das führt ___ einem Umstieg.\",\"answers\":[\"für\",\"auf\",\"zu\"],\"bank\":[\"für\",\"auf\",\"zu\",\"an\",\"von\",\"über\"],\"translation\":\"El motivo del abono es el trayecto al trabajo. Eso repercute en la puntualidad. Eso conduce a un cambio de medio.\",\"itemIds\":[\"b2m9grundfuer\",\"b2m9sichauswirkenauf\",\"b2m9fuehrenzu\"]},{\"id\":\"b2m9l8e6\",\"type\":\"translate\",\"prompt\":\"Al alemán, registro de foro\",\"direction\":\"toTarget\",\"source\":\"El descenso se debe a que hay menos trayectos cortos.\",\"answers\":[\"Der Rückgang liegt daran, dass weniger Kurzstrecken gefahren werden.\",\"Der Rückgang liegt daran, dass es weniger Kurzstrecken gibt.\"],\"hint\":\"da-Komposita de «liegen an»\",\"itemIds\":[\"b2m9natliegtdaran\",\"b2m9rueckgang\"]},{\"id\":\"b2m9l8e7\",\"type\":\"type\",\"prompt\":\"Cierre: una frase que vale en las dos tareas\",\"question\":\"Eso conduce a un menor consumo de energía\",\"answers\":[\"Das führt zu einem geringeren Energieverbrauch\",\"Das führt zu einem geringeren Energieverbrauch.\"],\"hints\":[\"führen zu + Dativ\",\"Das führt zu einem geringeren …\"],\"itemIds\":[\"b2m9fuehrenzu\",\"b2m9energieverbrauch\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks
