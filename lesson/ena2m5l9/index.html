atic/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T82d,"])</script><script>self.__next_f.push([1,"En español una queja se dice de frente: «esto está frío», «esto no lo hemos pedido». Traducido tal cual al inglés suena a bronca. \u003cb\u003eEl inglés envuelve la queja en tres capas\u003c/b\u003e, y las tres son cortas:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Abre con Excuse me.\u003c/b\u003e No es «perdón» de disculpa: es «disculpe» para llamar la atención. Sin él, la queja empieza a medio grito. [[Excuse me, this is cold.|Perdone, esto está frío.]]\u003cbr/\u003e\u003cb\u003e2. Suaviza con «I think» o con «a bit».\u003c/b\u003e Sabes perfectamente que hay un error, pero se dice como si dudaras: [[I think there's a mistake in the bill.|Creo que hay un error en la cuenta.]] · \u003ci\u003eThis is a bit cold.\u003c/i\u003e El \u003ci\u003ea bit\u003c/i\u003e del módulo 3 vuelve aquí, y no por casualidad: solo se usa con lo malo.\u003cbr/\u003e\u003cb\u003e2 bis. Y cuando la queja va en negativo, el «no» sube al «I think».\u003c/b\u003e El español dice «\u003ci\u003ecreo que esto \u003cu\u003eno\u003c/u\u003e es lo que he pedido\u003c/i\u003e»; el inglés dice \u003cb\u003eI \u003cu\u003edon't\u003c/u\u003e think this is what I ordered\u003c/b\u003e, con la negación en el primer verbo y el segundo en afirmativa. Suena raro escrito así y es lo normal dicho: \u003ci\u003eI don't think we ordered this\u003c/i\u003e · \u003ci\u003eI don't think this is ours\u003c/i\u003e. La traducción literal —\u003ci\u003eI think this isn't…\u003c/i\u003e— se entiende, pero es la frase por la que te colocan de extranjero, y además suena más dura, que es justo lo contrario de lo que buscas.\u003cbr/\u003e\u003cb\u003e3. No acuses a nadie.\u003c/b\u003e Se dice qué pasa, no quién lo hizo: [[We didn't order this.|Esto no lo hemos pedido.]] mejor que «usted se ha equivocado».\u003cbr/\u003e\u003cbr/\u003eY ojo al calco del módulo 1, que aquí recae: «hay un error» es \u003cb\u003ethere IS a mistake\u003c/b\u003e, nunca \u003ci\u003e*there has\u003c/i\u003e. El «hay» del español viene de haber y arrastra la mano hacia have.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa disculpa\u003c/b\u003e, del otro lado del mostrador, también es fórmula: [[I'm so sorry about that.|Cuánto lo siento.]] y detrás, la solución: \u003ci\u003eI'll bring you another one\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY para acabar: en Reino Unido la cuenta es \u003cb\u003ethe bill\u003c/b\u003e (en Estados Unidos, the check), y se pide como todo lo demás: [[Could we have the bill, please?|¿Nos trae la cuenta, por favor?]]"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l9\",\"phaseId\":\"ena2m5\",\"title\":\"Sorry, this is cold\",\"subtitle\":\"Quejarse sin sonar borde, disculparse y pagar — la comida entera, de la puerta a la cuenta\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La queja, la disculpa y la cuenta\",\"itemIds\":[\"ena2m5excusemethisiscold\",\"ena2m5wedidntorderthis\",\"ena2m5ithinktheresamistake\",\"ena2m5imsosorryaboutthat\",\"ena2m5couldwehavethebill\",\"enexcuseme\",\"encanipaybycard\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La queja inglesa va envuelta, y por eso funciona\",\"body\":\"$17\",\"table\":[[\"lo que dirías en español\",\"lo que se dice en inglés\"],[\"Esto está frío.\",\"Excuse me, this is a bit cold.\"],[\"Esto no es lo que he pedido.\",\"Sorry, I don't think this is what I ordered.\"],[\"Hay un error en la cuenta.\",\"I think there's a mistake in the bill.\"],[\"Lo siento muchísimo.\",\"I'm so sorry about that.\"],[\"La cuenta, por favor.\",\"Could we have the bill, please?\"],[\"¿Se puede pagar con tarjeta?\",\"Can I pay by card?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — todo esto ya es tuyo\",\"pairs\":[{\"target\":\"How much…?\",\"source\":\"¿cuánto…? (lo que no se cuenta)\"},{\"target\":\"How many…?\",\"source\":\"¿cuántos…? (lo que se cuenta)\"},{\"target\":\"a little\",\"source\":\"un poco (lo que no se cuenta)\"},{\"target\":\"a few\",\"source\":\"unos cuantos (lo que se cuenta)\"},{\"target\":\"a lot of\",\"source\":\"mucho / muchos (los dos)\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m5howmuchsugar\",\"ena2m5howmanypeoplearethere\",\"ena2m5alittlemilk\",\"ena2m5afewfriends\",\"ena2m5alotof\"],\"tip\":\"El cronómetro solo premia. Si las cinco salen sin pensar, el sistema de cuantificación del módulo está instalado.\"},{\"id\":\"ena2m5l9e2\",\"type\":\"bucket\",\"prompt\":\"¿Queja envuelta o bronca?\",\"categories\":[\"queja que funciona\",\"suena a bronca\"],\"items\":[{\"text\":\"Excuse me, this is a bit cold.\",\"bucket\":0},{\"text\":\"This soup is cold!\",\"bucket\":1},{\"text\":\"I think there's a mistake in the bill.\",\"bucket\":0},{\"text\":\"You made a mistake in the bill.\",\"bucket\":1},{\"text\":\"Sorry, we didn't order this.\",\"bucket\":0},{\"text\":\"This is not our food.\",\"bucket\":1}],\"itemIds\":[\"ena2m5excusemethisiscold\",\"ena2m5ithinktheresamistake\",\"ena2m5wedidntorderthis\",\"ena2m3abitshy\"],\"tip\":\"Mira qué tienen en común las tres de la izquierda: abren con una fórmula (Excuse me, I think, Sorry) y ninguna señala a nadie. Eso es toda la técnica.\"},{\"id\":\"ena2m5l9e3\",\"type\":\"mc\",\"prompt\":\"Te traen la sopa fría\",\"question\":\"¿Qué dices?\",\"options\":[\"Excuse me, this is a bit cold.\",\"This is cold!\",\"You brought me a cold soup.\"],\"answer\":0,\"whyWrong\":[null,\"Sin fórmula de apertura y con exclamación: en inglés eso es levantar la voz\",\"Acusa directamente a la persona, que es lo que el inglés evita\"],\"itemIds\":[\"ena2m5excusemethisiscold\",\"ena2m5soup\",\"encold\"],\"tip\":\"El «a bit» no es que la sopa esté un poco fría: es la manera de decirlo. Puede estar helada y aun así se dice a bit.\"},{\"id\":\"ena2m5l9e4\",\"type\":\"errorfix\",\"prompt\":\"El «hay» que vuelve del módulo 1\",\"wrong\":\"I think there has a mistake in the bill.\",\"answers\":[\"I think there's a mistake in the bill.\"],\"why\":\"«Hay» viene de haber y la mano se va sola a have, pero la estructura inglesa es there + BE en todos los tiempos: there is, there are, there was, there were. Ya lo viste con «there was a party»; aquí recae porque la frase es larga.\",\"translation\":\"Creo que hay un error en la cuenta.\",\"itemIds\":[\"ena2m5ithinktheresamistake\",\"enthereis\"]},{\"id\":\"ena2m5l9e13\",\"type\":\"transform\",\"prompt\":\"El «no» está en el sitio del español — súbelo\",\"source\":\"I think this isn't what I ordered.\",\"instruction\":\"Pon la negación en el primer verbo (I think → I don't think) y deja el segundo en afirmativa\",\"answers\":[\"I don't think this is what I ordered.\"],\"translation\":\"Creo que esto no es lo que he pedido.\",\"itemIds\":[\"ena2m5ithinktheresamistake\"],\"tip\":\"Mueve dos piezas a la vez, y por eso no es un «corrige la palabra»: el inglés niega arriba —I don't think, I don't suppose, I don't believe— y el español niega abajo. Con quejas, además, la versión inglesa suena bastante menos dura.\"},{\"id\":\"ena2m5l9e5\",\"type\":\"gapbank\",\"prompt\":\"La escena de la cuenta: rellena con la ficha que toca\",\"text\":\"Excuse me, I ___ there's a mistake in the bill. We didn't ___ the wine. — Oh, I'm so ___ about that. I'll bring you a new bill.\",\"answers\":[\"think\",\"order\",\"sorry\"],\"bank\":[\"think\",\"order\",\"sorry\",\"say\",\"pay\",\"afraid\"],\"translation\":\"Perdone, creo que hay un error en la cuenta. No hemos pedido el vino. — Ay, cuánto lo siento. Le traigo una cuenta nueva.\",\"itemIds\":[\"ena2m5ithinktheresamistake\",\"ena2m5wedidntorderthis\",\"ena2m5imsosorryaboutthat\",\"ena2m5aglassofwine\"],\"tip\":\"El primer hueco es la clave de la lección: «I think» no dice que dudes, dice que no estás buscando pelea.\"},{\"id\":\"ena2m5l9e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin sonar borde\",\"source\":\"Give me the bill.\",\"forbid\":[\"give\"],\"answers\":[\"Could we have the bill, please?\",\"Can we pay, please?\"],\"translation\":\"La cuenta, por favor.\",\"itemIds\":[\"ena2m5couldwehavethebill\",\"encanipaybycard\"],\"tip\":\"Las dos salidas son las de la lección 8: envolver en pregunta, o cambiar de verbo. En el oral del examen, cualquiera de las dos te salva la marca de registro.\"},{\"id\":\"ena2m5l9e7\",\"type\":\"audiomc\",\"prompt\":\"La queja de la mesa de al lado — 2 escuchas\",\"audio\":\"Excuse me, I think there's a mistake here. We didn't order the wine, and there's too much salt in the soup. — I'm so sorry about that. I'll bring you another one.\",\"question\":\"¿De qué se quejan?\",\"options\":[\"Del vino de la cuenta y de la sopa\",\"Solo de la cuenta\",\"De que la comida tarda\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Hay dos quejas: el vino y la sal de la sopa\",\"Nadie habla de esperar\"],\"notepad\":true,\"itemIds\":[\"ena2m5ithinktheresamistake\",\"ena2m5wedidntorderthis\",\"ena2m5toomuchsalt\",\"ena2m5imsosorryaboutthat\"],\"tip\":\"Dos quejas en una intervención: en el Listening del examen, la pregunta casi siempre pide las dos. Apunta las dos y luego elige.\"},{\"id\":\"ena2m5l9e8\",\"type\":\"build\",\"prompt\":\"Construye la queja completa\",\"target\":\"Excuse me I think there is a mistake in the bill\",\"translation\":\"Perdone, creo que hay un error en la cuenta\",\"distractors\":[\"has\",\"sorry\"],\"itemIds\":[\"ena2m5ithinktheresamistake\",\"enexcuseme\"]},{\"id\":\"ena2m5l9e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Perdone, esto no lo hemos pedido y la sopa tiene demasiada sal.\",\"answers\":[\"Excuse me, we didn't order this and there's too much salt in the soup.\",\"Excuse me, we didn't order this and the soup has too much salt.\",\"Sorry, we didn't order this and there's too much salt in the soup.\"],\"hint\":\"abre con la fórmula y no acuses a nadie\",\"itemIds\":[\"ena2m5wedidntorderthis\",\"ena2m5toomuchsalt\",\"enexcuseme\"]},{\"id\":\"ena2m5l9e10\",\"type\":\"listen\",\"prompt\":\"Dictado — la petición del final\",\"text\":\"Could we have the bill, please?\",\"translation\":\"¿Nos trae la cuenta, por favor?\",\"hints\":[\"Empieza por Could w…\",\"…the bill, please?\"],\"itemIds\":[\"ena2m5couldwehavethebill\"],\"tip\":\"En Reino Unido, bill. Si dices «the check» te van a entender igual, pero suena a película americana.\"},{\"id\":\"ena2m5l9e11\",\"type\":\"monologue\",\"prompt\":\"La misión del módulo: pide una comida entera en inglés, de la puerta a la cuenta\",\"topic\":\"Una comida completa en un restaurante, en voz alta y de principio a fin\",\"slides\":[{\"title\":\"1. Llegar y sentarse\",\"hint\":\"Good evening. A table for two, please. — Could I have the menu, please?\"},{\"title\":\"2. Pedir la comida y la bebida\",\"hint\":\"I'd like the chicken, please. And could you bring us a bottle of water and two glasses of wine?\"},{\"title\":\"3. Algo va mal, y te quejas\",\"hint\":\"Excuse me, this is a bit cold. And I don't think we ordered this.\"},{\"title\":\"4. Pagar y salir\",\"hint\":\"Could we have the bill, please? Can I pay by card? Thank you very much.\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He pedido con Could I have… o Can I have…, y ni una vez con un verbo pelado (Give me, Bring me)\",\"He dicho please al menos dos veces\",\"He usado un envase o una porción: a bottle of, a glass of, a slice of\",\"He puesto una queja envuelta: Excuse me / I think / a bit\",\"He pedido la cuenta con Could we have the bill, please?\"],\"model\":\"Good evening. A table for two, please. Thank you. Could I have the menu, please? … I'd like the chicken with vegetables, please. And could you bring us a bottle of water and two glasses of wine? … Excuse me, sorry, I think there's a mistake: we didn't order this, and the soup is a bit cold. … Thank you very much. Could we have the bill, please? Can I pay by card?\",\"itemIds\":[\"ena2m5atablefortwoplease\",\"ena2m5couldihavethemenu\",\"ena2m5idlikethechicken\",\"ena2m5abottleofwater\",\"ena2m5aglassofwine\",\"ena2m5excusemethisiscold\",\"ena2m5couldwehavethebill\",\"ena2m5vegetables\"],\"tip\":\"La misión de verdad es fuera de la app: cocina algo siguiendo una receta en inglés, o pide en inglés en un sitio real (o por escrito, en una app de comida). Lo que te llevas no es una nota: es el plato o el pedido. Grábate las dos pasadas y quédate con la segunda.\"},{\"id\":\"ena2m5l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — todo en dos frases\",\"question\":\"¿Nos trae un poco de agua, por favor? Y creo que hay un error en la cuenta.\",\"answers\":[\"Could you bring us some water, please? And I think there's a mistake in the bill.\",\"Could you bring us a little water, please? And I think there's a mistake in the bill.\",\"Could you bring us some water, please? I think there's a mistake in the bill.\"],\"hints\":[\"Petición envuelta + some al pedir + there IS\",\"C… you bring us s… water, please? And I think there's a m… in the bill.\"],\"itemIds\":[\"ena2m5couldyoubringussomewater\",\"ena2m5ithinktheresamistake\",\"ena2m5canihavesomewater\"],\"tip\":\"Ahí está el módulo entero: el some de la petición, la escalera de cortesía y el there is del «hay». Con esto comes fuera en inglés sin que se te note que traduces.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m5-4\",\"book\":\"Excuse me, there's a problem with my soup.\",\"real\":\"Sorry to be a pain, but my soup's a bit cold.\",\"meaning\":\"Perdona que dé la lata, pero la sopa está fría\",\"when\":\"En Reino Unido, con quien te atiende, cuando quieres quejarte y que no se te note. «Sorry to be a pain» es la fórmula nacional: pide perdón por quejarse antes de quejarse. En el examen escribe la del libro, que es la que enseña la estructura que puntúan.\",\"register\":\"amigos\",\"note\":\"«A pain» es «un pesado». Es la capa cuarta de la queja: primero te disculpas por molestar y después dices lo que pasa, siempre con a bit.\",\"sound\":\"SO-ri tu bi a PÉIN, bat mái suups a bit KÓULD\",\"level\":\"a2\",\"itemId\":\"ena2m5excusemethisiscold\"}}],\"resources\":[{\"label\":\"British Council — A2 Listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Busca los audios de restaurante y de compras. Escúchalos una vez sin leer y apunta solo las peticiones: verás que todas empiezan por Can I, Could I o Could you.\"},{\"label\":\"British Council — A2 Writing\",\"url\":\"https://learnenglish.britishcouncil.org/skills/writing/a2-writing\",\"note\":\"Mira un email de reserva o de queja y compáralo con el tuyo de la lección 8. Fíjate solo en cómo abren y cierran: eso es el registro que puntúa.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2
