\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"frame\":[\"Anrede: Sehr geehrte Frau Schuster,\",\"Motivo: Ich habe … erhalten / gelesen\",\"Pregunta: Welche Norm gilt in der Produktion?\",\"Ejemplo: Jänner oder Januar\",\"Grußformel: Mit freundlichen Grüßen\"],\"bullets\":[\"Abre con Anrede y cierra con Grußformel\",\"Menciona el texto austriaco y una palabra (Jänner o Stiege) como ejemplo de reconocimiento\",\"Pregunta qué norma se produce en el escrito\",\"Pide la aclaración con cortesía (Könnten Sie / Wäre es möglich)\"],\"checks\":[{\"re\":\"Sehr geehrte.*Mit freundlichen Grüßen\",\"label\":\"Anrede y Grußformel\"},{\"re\":\"(Jänner|Stiege|austri)\",\"label\":\"ejemplo austriaco\"},{\"re\":\"(Standardsprache|Januar|Treppe|produz)\",\"label\":\"norma de producción\"},{\"re\":\"(Könnten Sie|Wäre es möglich|Ich würde Sie bitten)\",\"label\":\"petición cortés\"}],\"minWords\":90,\"maxWords\":120,\"requireConnectors\":{\"min\":2,\"bank\":[\"weil\",\"deshalb\",\"außerdem\",\"aber\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"model\":\"Sehr geehrte Frau Schuster, ich habe einen österreichischen Modelltext erhalten, in dem Jänner und Stiege vorkommen. Ich erkenne die Wörter, aber ich bin unsicher, welche Form ich im Schreiben produzieren soll. Im Kurs heißt es, im Goethe gelte die deutsche Standardsprache. Könnten Sie mir bitte bestätigen, dass Januar und Treppe die erwartete Produktion sind? Außerdem möchte ich vermeiden, Register und Herkunft zu verwechseln, weil beides im selben Text vorkommt und mich unsicher macht. Wäre es möglich, das in der nächsten Stunde am Montag kurz zu klären? Mit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[\"b2m10erhalten\",\"b2m10produktion\",\"b2m10standardsprache\"],\"tip\":\"El modelo escribe Januar y Treppe, no Jänner y Stiege. Reconocer el estímulo no es copiarlo.\"},{\"id\":\"b2m10l8e3\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 — Forumsbeitrag. Unas 150 palabras. Reacciona, no hagas turismo lingüístico.\",\"scenario\":\"En el foro de preparación al Goethe B2 alguien ha escrito que usar Jänner y Strasse en el escrito demuestra nivel B2. Escribe tu comentario: reacciona, da tu postura, concede algo y cierra.\",\"genre\":\"forum\",\"register\":\"du\",\"stimulus\":{\"author\":\"Jonas, Forum\",\"text\":\"Wer Jänner und Strasse schreibt, zeigt, dass er den ganzen Sprachraum kennt. Das sollte im B2 extra Punkte geben.\"},\"frame\":[\"Reacción al Beitrag\",\"Tesis: Im Schreiben gilt die deutsche Standardsprache\",\"Distinción: erkennen ≠ produzieren\",\"Concesión: in der Zeitung vor Ort ja\",\"Cierre: Fußnote für den Leser, nicht Lizenz für den Schreiber\"],\"bullets\":[\"Reacciona al comentario de Jonas\",\"Deja clara la norma de producción (Standardsprache / Januar / Straße)\",\"Separa reconocer y producir\",\"Concede el uso local (Zeitung, Wien, Bern) antes de cerrar\"],\"checks\":[{\"re\":\"(Jonas|Beitrag|gelesen|Forum)\",\"label\":\"reacción\"},{\"re\":\"(Standardsprache|Januar|Straße|Strasse|produz)\",\"label\":\"norma de producción\"},{\"re\":\"(erkenn|lesen|Fußnote|Fussnote)\",\"label\":\"reconocer frente a producir\"},{\"re\":\"(Allerdings|aber|trotzdem|zwar)\",\"label\":\"concesión\"}],\"minWords\":135,\"maxWords\":175,\"requireConnectors\":{\"min\":3,\"bank\":[\"weil\",\"allerdings\",\"aber\",\"deshalb\",\"außerdem\",\"trotzdem\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"model\":\"Jonas, ich habe deinen Beitrag gelesen und sehe das anders. Wer Jänner kennt, hat gut gelesen; wer Jänner in den Forumsbeitrag setzt, hat die Produktionsnorm verfehlt. Im Schreiben gilt die deutsche Standardsprache, deshalb schreibe ich Januar und Straße. Allerdings hat eine Wiener Zeitung jedes Recht, Stiege stehen zu lassen — das ist Zugehörigkeit, nicht Fehler. Die Fußnote erklärt dem Leser das Wort; sie ist keine Lizenz für uns im Exam. Außerdem trennt der Kurs Register und Herkunft, und das halte ich für ausgesprochen gelungen. Trotzd
