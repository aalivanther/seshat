id that ya eran tuyos del B1. All the same = aun así, prima de even so.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eNevertheless y however no van juntos en el mismo hueco\u003c/b\u003e: son la misma pieza. En el ensayo, elige uno y sé coherente. Nevertheless es un pelín más de cierre de concesión.\",\"table\":[[\"Molde\",\"Registro\",\"Oficio\"],[\"Admittedly, … Nevertheless, …\",\"examen\",\"das + quitas, dos frases\"],[\"It is true that… but…\",\"neutro\",\"das + quitas, una oración\"],[\"Alright, fair enough, but…\",\"calle\",\"das + quitas, de café\"],[\"Granted, …\",\"seco\",\"concedes el dato, no la tesis\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l3e1\",\"type\":\"match\",\"prompt\":\"Tres alturas de la misma concesión\",\"pairs\":[{\"target\":\"Alright, fair enough, but the buses still have to turn.\",\"source\":\"calle\"},{\"target\":\"It is true that the street is too full of cars, but the bus is not a car.\",\"source\":\"neutro\"},{\"target\":\"Admittedly, the air would improve. Nevertheless, the buses still have to get through.\",\"source\":\"examen\"},{\"target\":\"Granted, parking is not a human right.\",\"source\":\"concedes el dato, no la tesis\"},{\"target\":\"All the same, I would not remove the stop.\",\"source\":\"aun así: tiras después de dar\"}],\"itemIds\":[\"enb2m8natfairenoughbut\",\"enb2m8itistruethat\",\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8granted\",\"enb2m8allthesame\"],\"tip\":\"Sin la primera mitad, la segunda es una lista. La concesión no es educación: es estrategia.\"},{\"id\":\"enb2m8l3e2\",\"type\":\"paraphrase\",\"prompt\":\"Súbelo de registro: sin fair, alright ni but al principio\",\"source\":\"Alright, fair enough, but the buses still have to turn.\",\"forbid\":[\"fair\",\"alright\",\"all right\",\"okay\",\"ok\"],\"answers\":[\"Admittedly, the air would improve. Nevertheless, the buses still have to get through\",\"It is true that the street is too full of cars, but the bus is not a car\",\"Granted, parking is not a human right. Nevertheless, the buses still have to get through\"],\"translation\":\"Vale, de acuerdo, pero los autobuses siguen teniendo que girar.\",\"hints\":[\"Admittedly / Nevertheless, o It is true that\",\"Admittedly, ... Nevertheless, ...\"],\"itemIds\":[\"enb2m8natfairenoughbut\",\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8itistruethat\"],\"tip\":\"Te quito la calle a propósito. Lo que queda es el molde que puntúa. Si te ha salido however, también vale — y no está entre las respuestas a propósito, para que produzcas el nuevo.\"},{\"id\":\"enb2m8l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Admittedly the air would improve nevertheless the buses still have to get through.\",\"answers\":[\"Admittedly, the air would improve. Nevertheless, the buses still have to get through.\"],\"why\":\"Son dos frases, y las dos llevan coma. Sin punto en medio es un comma splice, la trampa del m1, ahora con los conectores de concesión. Un error: la puntuación que las parte.\",\"translation\":\"Cierto es que el aire mejoraría. No obstante, los autobuses siguen teniendo que pasar.\",\"itemIds\":[\"enb2m8admittedly\",\"enb2m8nevertheless\"]},{\"id\":\"enb2m8l3e4\",\"type\":\"gapbank\",\"prompt\":\"Completa la concesión — however NO está en el banco, a propósito\",\"text\":\"___, the air would improve. ___, the buses still have to get through. Granted, parking is not a human right. All the ___, I would not remove the stop.\",\"answers\":[\"Admittedly\",\"Nevertheless\",\"same\"],\"bank\":[\"Admittedly\",\"Nevertheless\",\"same\",\"Luckily\",\"Suddenly\",\"time\"],\"translation\":\"Cierto es que el aire mejoraría. No obstante, los autobuses siguen teniendo que pasar. Concedido: aparcar no es un derecho humano. Aun así, yo no quitaría la parada.\",\"itemIds\":[\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8granted\",\"enb2m8allthesame\"],\"tip\":\"However no está: es gemelo de nevertheless y el
