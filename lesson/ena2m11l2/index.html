El plan ya existía. \u003ci\u003e[[I'm going to book a hotel.|Voy a reservar un hotel.]]\u003c/i\u003e (lo llevas pensando desde ayer)\u003cbr/\u003e· \u003cb\u003eMientras hablas\u003c/b\u003e → \u003ci\u003ewill\u003c/i\u003e. Es una reacción a algo que acaba de pasar. \u003ci\u003e[[I'll help you.|Te echo una mano.]]\u003c/i\u003e · \u003ci\u003e[[I'll have a coffee, please.|Un café, por favor.]]\u003c/i\u003e (acabas de mirar la carta)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePREGUNTA 2: ¿tienes la prueba delante?\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eSí, se ve venir\u003c/b\u003e → \u003ci\u003egoing to\u003c/i\u003e. \u003ci\u003eLook at [[the clouds|las nubes]] — [[it's going to rain.|va a llover.]]\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eNo, lo dices de cabeza\u003c/b\u003e → \u003ci\u003ewill\u003c/i\u003e. Es tu opinión, tu cálculo, lo que te parece. \u003ci\u003e[[I think it'll rain.|Creo que va a llover.]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eFíjate en que en español \u003cb\u003elas cuatro frases se dicen igual\u003c/b\u003e: «va a llover» sirve tanto si estás mirando las nubes como si te lo estás imaginando. Por eso este reparto no te lo chiva el oído: hay que preguntárselo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la salida de emergencia, que conviene tener escrita:\u003c/b\u003e si dudas, \u003cb\u003egoing to\u003c/b\u003e. Es el que puntúa en tu examen, casi nunca queda mal y como mucho suena un poco menos fino. Al revés —meter \u003ci\u003ewill\u003c/i\u003e donde tocaba \u003ci\u003egoing to\u003c/i\u003e— sí chirría: \u003ci\u003eI'll book a hotel\u003c/i\u003e, dicho de un plan que llevas semanas cerrando, suena a que lo acabas de decidir en ese instante."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l2\",\"phaseId\":\"ena2m11\",\"title\":\"I think it'll rain\",\"subtitle\":\"Cuándo va will y cuándo va going to — y por qué el inglés niega «creo que no» al revés\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que crees, lo que prometes y lo que decides sobre la marcha\",\"itemIds\":[\"ena2m11ithinkitllrain\",\"ena2m11idontthinkitwill\",\"ena2m11illhaveacoffee\",\"ena2m11illcallyoulater\",\"ena2m11imsureitllbefine\",\"ena2m6itsgoingtorain\"]},{\"kind\":\"note\",\"note\":{\"title\":\"will o going to: el reparto, que es el trabajo de hoy\",\"body\":\"$17\",\"table\":[[\"la situación\",\"cuál va\",\"ejemplo\"],[\"el plan ya existía\",\"going to\",\"I'm going to book a hotel.\"],[\"lo decides al hablar\",\"will\",\"I'll have a coffee, please.\"],[\"hay señales delante\",\"going to\",\"It's going to rain — look at the clouds.\"],[\"es tu opinión, de cabeza\",\"will\",\"I think it'll rain tomorrow.\"],[\"prometes algo\",\"will\",\"I'll call you later.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«Creo que no lloverá»: el inglés lo niega al revés\",\"body\":\"Esta es pequeña, cabe en una línea y sale en cuanto abres la boca para opinar.\u003cbr/\u003e\u003cbr/\u003eEn español niegas \u003cb\u003ela segunda mitad\u003c/b\u003e: «creo que \u003cb\u003eno\u003c/b\u003e lloverá». El inglés niega \u003cb\u003ela primera\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[I don't think it will rain.|Creo que no va a llover.]]\u003c/b\u003e ✅\u003cbr/\u003e· \u003ci\u003eI think it won't rain.\u003c/i\u003e — se entiende, y no es un error de gramática, pero \u003cb\u003eningún inglés lo dice así\u003c/b\u003e. Suena a traducción.\u003cbr/\u003e\u003cbr/\u003eFunciona igual con los otros verbos de opinión: \u003ci\u003eI don't think she'll come\u003c/i\u003e · \u003ci\u003eI don't believe it'll work\u003c/i\u003e. La regla de bolsillo cabe en seis palabras: \u003cb\u003eel «no» se va al «creo»\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY ojo, porque hay una que NO sigue la regla: \u003cb\u003e\u003ci\u003eI hope\u003c/i\u003e\u003c/b\u003e. Con \u003ci\u003ehope\u003c/i\u003e la negación se queda donde el español la pone: \u003ci\u003e[[I hope it doesn't rain.|Espero que no llueva.]]\u003c/i\u003e, nunca \u003ci\u003eI don't hope it rains\u003c/i\u003e. Es una excepción de una sola palabra, y la trabajamos entera en la lección 8.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l2e1\",\"type\":\"mc\",\"prompt\":\"¿Cuál cabe aquí?\",\"question\":\"Sam te pasa la carta del café. Miras, decides y dices…\",\"options\":[\"I'll have a coffee, please.\",\"I'm going to have a coffee, please.\",\"I have a coffee, please.\"],\"answer\":0,\"whyWrong\":[null,\"Going to dice «lo tenía decidido de antes», y acabas de mirar la carta ahora\",\"Presente simple es rutina: diría que tomas café todos los días\"],\"itemIds\":[\"ena2m11illhaveacoffee\",\"ena2m5couldihavethemenu\"],\"tip\":\"Pedir en un bar es el caso más puro de will: la decisión nace en el momento de decirla. Por eso «I'll have…» es la fórmula estándar en todo Reino Unido.\"},{\"id\":\"ena2m11l2e2\",\"type\":\"bucket\",\"prompt\":\"¿Lo tenías decidido, o lo decides ahora?\",\"categories\":[\"ya estaba decidido → going to\",\"lo decide al hablar → will\"],\"items\":[{\"text\":\"I'm going to book a hotel in Brighton.\",\"bucket\":0},{\"text\":\"Those bags look heavy — I'll help you.\",\"bucket\":1},{\"text\":\"We're going to visit Emma next month.\",\"bucket\":0},{\"text\":\"Don't worry, I'll call you later.\",\"bucket\":1},{\"text\":\"She's going to study Italian this year.\",\"bucket\":0},{\"text\":\"It's cold in here. I'll close the window.\",\"bucket\":1}],\"itemIds\":[\"ena2m11illhelpyou\",\"ena2m11illcallyoulater\",\"ena2m6imgoingtobook\",\"enwindow\"],\"tip\":\"Las tres de la derecha tienen algo en común: delante hay una frase que las provoca. Will casi siempre viene de reaccionar a algo.\"},{\"id\":\"ena2m11l2e3\",\"type\":\"bucket\",\"prompt\":\"¿Hay pruebas delante, o es tu opinión?\",\"categories\":[\"se ve venir → going to\",\"es lo que crees → will\"],\"items\":[{\"text\":\"Look at those clouds — it's going to rain.\",\"bucket\":0},{\"text\":\"I think it'll rain on Sunday.\",\"bucket\":1},{\"text\":\"It's half past eight — we're going to be late.\",\"bucket\":0},{\"text\":\"I'm sure it'll be fine.\",\"bucket\":1},{\"text\":\"The sky is black. It's going to snow.\",\"bucket\":0},{\"text\":\"I don't think it will be cold in May.\",\"bucket\":1}],\"itemIds\":[\"ena2m6itsgoingtorain\",\"ena2m6clouds\",\"ena2m11ithinkitllrain\",\"ena2m11imsureitllbefine\",\"ena2m11idontthinkitwill\"],\"tip\":\"Un truco que funciona: si puedes señalar con el dedo lo que te hace decirlo, es going to. Si solo puedes señalarte la cabeza, es will.\"},{\"id\":\"ena2m11l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa la opinión\",\"text\":\"I ___ think it will rain — the forecast is good.\",\"answers\":[\"don't\",\"do not\"],\"translation\":\"Creo que no va a llover: la previsión es buena.\",\"hints\":[\"El «no» se va al «creo»\",\"I d… think it will rain.\"],\"itemIds\":[\"ena2m11idontthinkitwill\",\"ena2m11theweatherforecast\"]},{\"id\":\"ena2m11l2e5\",\"type\":\"transform\",\"prompt\":\"Dilo como lo diría un inglés\",\"source\":\"I think it won't rain tomorrow.\",\"instruction\":\"Mueve la negación adonde va en inglés\",\"answers\":[\"I don't think it will rain tomorrow.\",\"I don't think it'll rain tomorrow.\"],\"translation\":\"Creo que no lloverá mañana.\",\"hints\":[\"Se niega el verbo de opinión, no el de después\",\"I d… think it will rain tomorrow.\"],\"itemIds\":[\"ena2m11idontthinkitwill\"],\"tip\":\"No estabas diciendo nada incorrecto: estabas diciéndolo como se dice en español. La diferencia entre sonar a alumno y sonar a hablante suele ser justo esto.\"},{\"id\":\"ena2m11l2e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige — falta el sujeto que el español no pone\",\"wrong\":\"I think that will rain tomorrow.\",\"answers\":[\"I think it will rain tomorrow.\"],\"why\":\"En español «lloverá» va sin sujeto porque la persona ya está dentro del verbo. En inglés todas las frases llevan sujeto, y cuando no hay nadie que haga la acción se pone «it»: it rains, it will rain, it's raining. Sin ese «it» la frase se queda sin arrancar.\",\"translation\":\"Creo que lloverá mañana.\",\"itemIds\":[\"ena2m11ithinkitllrain\"],\"tip\":\"Este «it» de relleno es el mismo de «It's cold» y «It's five o'clock». No significa nada: solo ocupa la silla del sujeto, que en inglés nunca está vacía.\"},{\"id\":\"ena2m11l2e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige — hay una prueba delante y el futuro no la recoge\",\"wrong\":\"Look at those clouds — it will rain.\",\"answers\":[\"Look at those clouds — it's going to rain.\"],\"why\":\"Cuando la señal está a la vista —las nubes, el reloj, el humo—, el inglés usa going to: dice «esto ya está en marcha». Will es para lo que te sale de la cabeza sin nada delante que lo respalde.\",\"translation\":\"Mira esas nubes: va a llover.\",\"itemIds\":[\"ena2m6itsgoingtorain\",\"ena2m6clouds\"]},{\"id\":\"ena2m11l2e8\",\"type\":\"audiomc\",\"prompt\":\"El domingo de Ben — pregunta primero, audio después\",\"audio\":\"I'm going to work on Sunday, so I can't come to the park. But I'll finish at four, and I think it'll be sunny in the afternoon. If you're still there, I'll call you.\",\"question\":\"¿Qué dice Ben de la tarde del domingo?\",\"options\":[\"Que cree que hará sol\",\"Que ya sabe que va a llover\",\"Que estará trabajando toda la tarde\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No dice nada de lluvia: dice «I think it'll be sunny»\",\"Termina a las cuatro: «I'll finish at four»\"],\"itemIds\":[\"ena2m11ithinkitllrain\",\"ena2m11illcallyoulater\",\"enitssunny\"],\"tip\":\"Cuenta los futuros del audio: hay un going to (el turno de trabajo, decidido de antes) y tres will (lo que termina, lo que cree y lo que promete). Ese reparto es exactamente el de la nota.\"},{\"id\":\"ena2m11l2e9\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con la razón por la que lleva ese futuro\",\"pairs\":[{\"target\":\"I'll have a coffee, please.\",\"source\":\"Lo decide mirando la carta\"},{\"target\":\"It's going to rain.\",\"source\":\"Está mirando las nubes\"},{\"target\":\"I think it'll rain.\",\"source\":\"Es su opinión, sin pruebas\"},{\"target\":\"I'll call you later.\",\"source\":\"Es una promesa\"}],\"itemIds\":[\"ena2m11illhaveacoffee\",\"ena2m6itsgoingtorain\",\"ena2m11ithinkitllrain\",\"ena2m11illcallyoulater\"]},{\"id\":\"ena2m11l2e10\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"I don't think it will be cold, but I'm sure it'll rain.\",\"answers\":[\"Creo que no hará frío, pero seguro que llueve.\",\"No creo que haga frío, pero estoy segura de que va a llover.\"],\"itemIds\":[\"ena2m11idontthinkitwill\",\"ena2m11imsureitllbefine\"],\"tip\":\"Fíjate en cómo se mueve la negación al pasar al español: «I don't think it will be cold» tiene dos traducciones buenas, y en las dos el «no» cambia de sitio.\"},{\"id\":\"ena2m11l2e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la opinión y la promesa\",\"text\":\"I don't think it will rain. I'm sure it'll be fine. I'll call you later.\",\"phonetic\":\"ái dóunt zink it uil RÉIN. áim SHÓO Í-tol bi FÁIN. áil KÓOL yu LÉI-ta\",\"translation\":\"Creo que no va a llover. Seguro que sale bien. Te llamo luego.\",\"itemIds\":[\"ena2m11idontthinkitwill\",\"ena2m11imsureitllbefine\",\"ena2m11illcallyoulater\"],\"tip\":\"Las dos últimas llevan la 'll pegada: «Í-tol» y «áil», nunca «it uil» ni «ái uil». Si las separas, suenas a robot leyendo.\"},{\"id\":\"ena2m11l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Creo que no va a llover. Seguro que sale bien: te llamo luego.\",\"answers\":[\"I don't think it will rain. I'm sure it'll be fine. I'll call you later.\",\"I don't think it'll rain. I'm sure it'll be fine. I'll call you later.\",\"I don't think it will rain. I'm sure it will be fine. I'll call you later.\"],\"hints\":[\"El «no» se va al «creo» · las otras dos llevan will\",\"I d… think it will rain. I'm s… it'll be fine. I'll c… you later.\"],\"itemIds\":[\"ena2m11idontthinkitwill\",\"ena2m11imsureitllbefine\",\"ena2m11illcallyoulater\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-2\",\"book\":\"I think it will rain.\",\"real\":\"I reckon it'll rain.\",\"meaning\":\"Yo creo que va a llover\",\"when\":\"Entre amigos y compañeros, en todo Reino Unido, para dar tu opinión sobre algo que aún no ha pasado. «Reckon» es cotidiano y muy común en el habla, pero en el Writing del examen escribe «I think»: es lo que espera el corrector y no te la juegas.\",\"register\":\"amigos\",\"note\":\"reckon se usa casi solo en presente y con opinión: I reckon, do you reckon? Nada de «I am reckoning».\",\"sound\":\"ái RE-kon Í-tol RÉIN\",\"level\":\"a2\",\"itemId\":\"ena2m11ithinkitllrain\"}}],\"resources\":[{\"label\":\"BBC Weather\",\"url\":\"https://www.bbc.co.uk/weather\",\"note\":\"Cinco minutos con el tiempo de Londres. No traduzcas: cuenta cuántas veces aparece «will» y cuántas «going to». La proporción te va a sorprender, y explica por qué este módulo existe.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"y
