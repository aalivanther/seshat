],\"tip\":\"«Das habe ich mir fest vorgenommen» es la firma del propósito. Cázala y ya sabes de qué va el audio.\"},{\"id\":\"b1m11l7e2\",\"type\":\"audiomc\",\"prompt\":\"Ahora como en el examen: UNA sola escucha. Lee la pregunta, luego dale al play.\",\"audio\":\"Mit dem Rauchen aufzuhören ist mir letztes Jahr nicht gelungen. Dieses Jahr versuche ich es noch einmal, aber ohne festes Datum.\",\"question\":\"¿Qué dice sobre este año?\",\"options\":[\"Que lo vuelve a intentar sin fijarse una fecha\",\"Que el año pasado lo consiguió\",\"Que empieza el uno de enero\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice «ist mir nicht gelungen»: no lo consiguió\",\"Dice justo lo contrario: «ohne festes Datum»\"],\"itemIds\":[\"b1m11zkaufhoerenmit\"],\"tip\":\"Con una sola pasada, la palabra que decide suele ser una negación pequeña (nicht, ohne, kein). Escúchalas como si fueran palabras largas.\"},{\"id\":\"b1m11l7e3\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el propósito\",\"text\":\"Ich habe mir vorgenommen, mehr zu lesen.\",\"translation\":\"Me he propuesto leer más.\",\"hints\":[\"Ich habe mir …\",\"…, mehr zu lesen\"],\"itemIds\":[\"b1m11zksichvornehmen\"]},{\"id\":\"b1m11l7e4\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"Das habe ich mir vorgenommen.\",\"real\":\"Hab ich mir vorgenommen.\",\"translation\":\"Eso me lo he propuesto.\",\"ask\":\"which\",\"itemIds\":[\"b1m11zksichvornehmen\"],\"tip\":\"En el habla rápida el «Das» inicial y la -e de «habe» desaparecen. Reconocerlo es comprensión; producirlo, opcional.\"},{\"id\":\"b1m11l7e5\",\"type\":\"shadow\",\"prompt\":\"Sombrea la promesa\",\"text\":\"Diesmal halte ich durch, versprochen!\",\"phonetic\":\"DIIS-mal JAL-te ij durj, fea-SHPRO-jen\",\"translation\":\"Esta vez aguanto, ¡prometido!\",\"reps\":2,\"itemIds\":[\"b1m3durchhalten\"]},{\"id\":\"b1m11l7e6\",\"type\":\"speak\",\"prompt\":\"Léelo en voz alta con el ritmo del propósito\",\"text\":\"Künftig werde ich mit dem Rauchen aufhören.\",\"phonetic\":\"KÜNF-tij VEA-de ij mit deem RAU-jen AUF-jöö-ren\",\"translation\":\"De aquí en adelante voy a dejar de fumar.\",\"itemIds\":[\"b1m11zkkuenftig\",\"b1m11zkaufhoerenmit\"]},{\"id\":\"b1m11l7e7\",\"type\":\"mc\",\"prompt\":\"La preposición del verbo\",\"question\":\"„Ich höre ___ dem Rauchen auf.“\",\"options\":[\"mit\",\"von\",\"über\"],\"answer\":0,\"whyWrong\":[null,\"«von» va con abhängen, no con aufhören\",\"«über» va con sprechen o sich freuen\"],\"itemIds\":[\"b1m11zkaufhoerenmit\"],\"tip\":\"aufhören mit + Dativ. En español «dejar DE», en alemán «parar CON». No hay lógica: hay bloque.\"},{\"id\":\"b1m11l7e8\",\"type\":\"cloze\",\"prompt\":\"Completa el propósito\",\"text\":\"Ich habe mir ___, jeden Tag zwanzig Minuten Deutsch zu lernen.\",\"answers\":[\"vorgenommen\"],\"translation\":\"Me he propuesto estudiar alemán veinte minutos al día.\",\"hints\":[\"Participio de vornehmen\",\"vor + ge + nommen\"],\"itemIds\":[\"b1m11zksichvornehmen\",\"b1m11zkdaslernen\"]},{\"id\":\"b1m11l7e9\",\"type\":\"match\",\"prompt\":\"Empareja propósitos y excusas\",\"pairs\":[{\"target\":\"gute Vorsätze\",\"source\":\"buenos propósitos\"},{\"target\":\"durchhalten\",\"source\":\"aguantar / perseverar\"},{\"target\":\"mit dem Rauchen aufhören\",\"source\":\"dejar de fumar\"},{\"target\":\"Mir fehlt die Zeit\",\"source\":\"Me falta el tiempo\"}],\"itemIds\":[\"b1m11zkvorsatz\",\"b1m3durchhalten\",\"b1m11zkaufhoerenmit\"]},{\"id\":\"b1m11l7e10\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación de enero\",\"text\":\"— Und, was hast du dir für dieses Jahr ___? — Ich will ___ dem Rauchen aufhören. — Schaffst du das? — Diesmal ___ ich durch.\",\"answers\":[\"vorgenommen\",\"mit\",\"halte\"],\"bank\":[\"vorgenommen\",\"mit\",\"halte\",\"von\",\"genommen\",\"bleibe\"],\"translation\":\"— ¿Y qué te has propuesto para este año? — Quiero dejar de fumar. — ¿Lo vas a conseguir? — Esta vez aguanto.\",\"itemIds\":[\"b1m11zksichvornehmen\",\"b1m11zkaufhoerenm
