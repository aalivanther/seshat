pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T797,"])</script><script>self.__next_f.push([1,"Nach jeder Gewalttat an einer Schule wird dieselbe Frage gestellt: Sind Videospiele schuld? Politiker fordern ein Verbot, viele Eltern nicken, und die Spieler ärgern sich über den [[Verdacht|la sospecha]].\n\nDie Forschung ist deutlicher, als die Schlagzeilen vermuten lassen — nur sagt sie etwas anderes, als beide Seiten hören wollen. In den grossen Studien aus Deutschland und den USA wurde kein Beweis dafür gefunden, dass ein Jugendlicher durch ein Spiel zum [[Täter|autor de un delito]] wird. Gefunden wurde dagegen etwas Unbequemes: Wer nachts stundenlang spielt und zu wenig schläft, ist am nächsten Tag [[gereizter|más irritable]] und konzentriert sich schlechter. Das Problem heisst also nicht Gewalt, sondern Schlaf.\n\n„Ein Verbot wäre einfach“, sagt die Medienpädagogin Frau Brunner. „Wenn Verbote wirklich funktionieren würden, hätten wir in der Schweiz kein einziges Problem mit Alkohol. Wer etwas verbietet, kümmert sich nicht mehr darum. Und genau darum geht es: sich kümmern.“\n\nIn der Schweiz und in Österreich gibt es kein eigenes System wie die USK in Deutschland, die jedes Spiel prüft; dort richtet man sich nach den europäischen PEGI-Angaben. Trotzdem hängt vieles nicht vom Gesetz ab, sondern von den Eltern: Wird über das Spiel gesprochen? Wird nachgefragt, warum ein Bub* stundenlang vor dem Bildschirm sitzt?\n\nDie Spieler selbst argumentieren anders. In Foren wird immer wieder darauf hingewiesen, dass auch Fussball aggressiv machen kann und dass niemand deshalb ein Verbot fordert. Das Argument ist [[bequem|cómodo]], aber nicht ganz falsch.\n\nWas empfehlen die Fachleute? Keine Verbote für alle, sondern klare Regeln zu Hause: feste Zeiten, kein Bildschirm im Schlafzimmer und Interesse statt Kontrolle. „Fragen Sie Ihr Kind, worauf es sich im Spiel freut“, sagt Brunner. „Diese Frage bringt mehr als jedes Gesetz.“\n\n*der Bub = süddt., österr. und schweiz. für „der Junge“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m4l6\",\"phaseId\":\"b1m4\",\"title\":\"Lesen: Videospiele verbieten?\",\"subtitle\":\"Lectura larga de prensa suiza — el tema estrella del examen\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario del debate\",\"itemIds\":[\"b1m4dasvideospiel\",\"b1m4gewalttaetig\",\"b1m4verbieten\",\"b1m4dasverbot\",\"b1m4diealtersfreigabe\",\"b1m4dasgesetz\",\"b1m4dasargument\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: género, tesis y plurizentrismo\",\"body\":\"Este texto es un \u003cb\u003eartículo de prensa con opinión\u003c/b\u003e: presenta un debate, cita a una experta y termina con una recomendación. Ese es el formato del \u003cb\u003eLesen Teil 2\u003c/b\u003e del examen.\u003cbr/\u003e\u003cbr/\u003eTres avisos antes de entrar:\u003cbr/\u003e1. Es un periódico \u003cb\u003esuizo\u003c/b\u003e. En Suiza \u003cu\u003eno se usa la ß\u003c/u\u003e: escriben \u003ci\u003egross\u003c/i\u003e, \u003ci\u003eheisst\u003c/i\u003e, \u003ci\u003eFussball\u003c/i\u003e. No es una errata.\u003cbr/\u003e2. Trae una palabra del sur con nota al pie, igual que el examen real: \u003ci\u003eder Bub\u003c/i\u003e (sur de Alemania, Austria y Suiza) = \u003ci\u003eder Junge\u003c/i\u003e.\u003cbr/\u003e3. El texto está lleno de \u003cb\u003epasiva\u003c/b\u003e (b1m3) y de \u003cb\u003everbos con preposición\u003c/b\u003e (este módulo): \u003ci\u003ewird gefragt\u003c/i\u003e, \u003ci\u003eärgern sich über\u003c/i\u003e, \u003ci\u003ehängt von … ab\u003c/i\u003e, \u003ci\u003ekümmert sich um\u003c/i\u003e, \u003ci\u003efreut sich auf\u003c/i\u003e. Cázalos mientras lees: verlos en su hábitat vale más que veinte ejercicios.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Sollen gewalttätige Videospiele verboten werden?\",\"source\":\"Tageszeitung, Zürich (gekürzt)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m4l6e1q1\",\"q\":\"Was wurde in den grossen Studien gefunden?\",\"options\":[\"Ein klarer Beweis, dass Spiele Jugendliche zu Tätern machen.\",\"Kein Beweis dafür, dass Spiele Jugendliche zu Tätern machen.\",\"Dass Spieler ruhiger sind als andere Jugendliche.\"],\"answer\":1,\"why\":\"«wurde kein Beweis dafür gefunden, dass ein Jugendlicher durch ein Spiel zum Täter wird».\"},{\"id\":\"b1m4l6e1q2\",\"q\":\"Was ist laut Text das eigentliche Problem beim langen Spielen?\",\"options\":[\"die Gewalt in den Spielen\",\"der fehlende Schlaf\",\"die hohen Kosten der Spiele\"],\"answer\":1,\"inference\":true,\"why\":\"El texto no lo dice con esas palabras: hay que unir «zu wenig schläft» con «Das Problem heisst also nicht Gewalt, sondern Schlaf».\"},{\"id\":\"b1m4l6e1q3\",\"q\":\"Warum spricht Frau Brunner über Alkohol in der Schweiz?\",\"options\":[\"Weil Jugendliche beim Spielen oft Alkohol trinken.\",\"Um zu zeigen, dass Verbote allein wenig bringen.\",\"Weil Alkohol gefährlicher ist als Videospiele.\"],\"answer\":1,\"inference\":true,\"why\":\"Es una hipótesis irónica en Konjunktiv II: si las prohibiciones funcionaran, no habría problema con el alcohol — pero lo hay.\"},{\"id\":\"b1m4l6e1q4\",\"q\":\"Wie ist die Altersfreigabe in der Schweiz und in Österreich?\",\"options\":[\"Es gibt kein eigenes System wie die USK in Deutschland.\",\"Sie ist strenger als in Deutschland.\",\"Sie wird auch von der USK gemacht.\"],\"answer\":0,\"why\":\"«In der Schweiz und in Österreich gibt es kein eigenes System wie die USK in Deutschland»: se guían por PEGI, el sistema europeo.\"},{\"id\":\"b1m4l6e1q5\",\"q\":\"Welchen Rat gibt der Text den Eltern?\",\"options\":[\"Die Spiele komplett verbieten.\",\"Sich für das Spiel interessieren und klare Regeln vereinbaren.\",\"Die Kinder ganz allein entscheiden lassen.\"],\"answer\":1,\"inference\":true,\"why\":\"El cierre lo resume: «Interesse statt Kontrolle» y «feste Zeiten» — ni prohibir todo ni dejar hacer.\"}],\"itemIds\":[\"b1m4dasvideospiel\",\"b1m4gewalttaetig\",\"b1m4dasverbot\",\"b1m4diealtersfreigabe\",\"b1m4dasgesetz\"],\"tip\":\"Cuenta las pasivas del texto: wird gestellt, wurde gefunden, wird gesprochen, wird nachgefragt, wird hingewiesen. Es exactamente el alemán de prensa que entrenaste en b1m3.\"},{\"id\":\"b1m4l6e2\",\"type\":\"mc\",\"prompt\":\"Vocabulario del texto\",\"question\":\"„Die Altersfreigabe“ es ...\",\"options\":[\"la edad mínima recomendada para un juego o película\",\"el descuento para jóvenes\",\"la edad de jubilación\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería die Jugendermäßigung\",\"Eso sería das Rentenalter\"],\"itemIds\":[\"b1m4diealtersfreigabe\",\"b1m4derjugendschutz\"]},{\"id\":\"b1m4l6e3\",\"type\":\"match\",\"prompt\":\"Empareja las palabras del debate\",\"pairs\":[{\"target\":\"verbieten\",\"source\":\"prohibir\"},{\"target\":\"erlauben\",\"source\":\"permitir\"},{\"target\":\"das Gesetz\",\"source\":\"la ley\"},{\"target\":\"gewalttätig\",\"source\":\"violento\"}],\"itemIds\":[\"b1m4verbieten\",\"b1m4erlauben\",\"b1m4dasgesetz\",\"b1m4gewalttaetig\"]},{\"id\":\"b1m4l6e4\",\"type\":\"gapbank\",\"prompt\":\"Resume el artículo completando los huecos\",\"text\":\"Ein ___ wäre einfach, aber es hilft wenig. Das Problem ist nicht die Gewalt, sondern der fehlende Schlaf. Vieles hängt ___ den Eltern ab: Sie sollten sich ___ das Spiel interessieren.\",\"answers\":[\"Verbot\",\"von\",\"für\"],\"bank\":[\"Verbot\",\"von\",\"für\",\"Verbote\",\"über\",\"an\"],\"translation\":\"Una prohibición sería fácil, pero ayuda poco. El problema no es la violencia, sino la falta de sueño. Mucho depende de los padres: deberían interesarse por el juego.\",\"itemIds\":[\"b1m4dasverbot\",\"b1m4abhaengenvon\",\"b1m4sichinteressierenfuer\"]},{\"id\":\"b1m4l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la hipótesis de la experta\",\"text\":\"Wenn Verbote wirklich funktionieren würden, ___ wir kein Problem mit Alkohol.\",\"answers\":[\"hätten\"],\"translation\":\"Si las prohibiciones funcionaran de verdad, no tendríamos ningún problema con el alcohol.\",\"hints\":[\"Konjunktiv II de haben, 1ª persona del plural\",\"hatten + Umlaut\"],\"itemIds\":[\"b1m4wennichmehrzeithaette\",\"b1m4dasverbot\"],\"strictUmlaut\":true,\"tip\":\"La frase irónica del texto es Konjunktiv II puro: hipótesis imposible para demostrar que la premisa es falsa.\"},{\"id\":\"b1m4l6e6\",\"type\":\"mc\",\"prompt\":\"El helvetismo del texto\",\"question\":\"„Der Bub“ se dice en el sur de Alemania, en Austria y en Suiza. En el alemán estándar del norte se diría ...\",\"options\":[\"der Junge\",\"der Mann\",\"der Bube (naipe)\"],\"answer\":0,\"whyWrong\":[null,\"Un Bub es un niño o chaval, no un adulto\",\"La carta de la baraja se escribe igual, pero el texto habla de una persona\"],\"itemIds\":[\"kind\"],\"tip\":\"El examen anota estos regionalismos a pie de página exactamente así. Y recuerda: en Suiza no se escribe ß.\"},{\"id\":\"b1m4l6e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el resumen de un compañero\",\"wrong\":\"Die Eltern sollen sich über das Spiel interessieren.\",\"answers\":[\"Die Eltern sollen sich für das Spiel interessieren.\"],\"why\":\"sich interessieren rige für + Akkusativ. über va con sprechen y con sich ärgern, y por eso se cuela aquí.\",\"translation\":\"Los padres deberían interesarse por el juego.\",\"itemIds\":[\"b1m4sichinteressierenfuer\"]},{\"id\":\"b1m4l6e8\",\"type\":\"transform\",\"prompt\":\"Transforma: pon la frase del texto en pasiva (espiral b1m3)\",\"source\":\"Man stellt nach jeder Gewalttat dieselbe Frage.\",\"instruction\":\"Dilo en Passiv Präsens\",\"answers\":[\"Nach jeder Gewalttat wird dieselbe Frage gestellt\",\"Dieselbe Frage wird nach jeder Gewalttat gestellt\"],\"translation\":\"Tras cada acto violento se plantea la misma pregunta.\",\"hints\":[\"Tacha man, el objeto pasa a sujeto singular → wird\",\"Nach jeder Gewalttat wird dieselbe Frage ...\"],\"itemIds\":[\"b1m3eswirdempfohlen\",\"b1m3hierwirddeutschgesprochen\"],\"tip\":\"Es literalmente la primera frase del artículo. Los textos de prensa abren en pasiva porque el agente no importa.\"},{\"id\":\"b1m4l6e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin la palabra prohibida\",\"source\":\"Gewalttätige Videospiele sollen verboten werden.\",\"forbid\":[\"verboten\",\"verbieten\"],\"answers\":[\"Gewalttätige Videospiele sollen nicht mehr erlaubt sein\",\"Niemand soll gewalttätige Videospiele mehr kaufen dürfen\"],\"translation\":\"Los videojuegos violentos deberían prohibirse.\",\"hints\":[\"Sin «prohibir»: dilo con erlauben en negativo\",\"... sollen nicht mehr ... sein\"],\"itemIds\":[\"b1m4verbieten\",\"b1m4erlauben\",\"b1m4gewalttaetig\"]},{\"id\":\"b1m4l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción: tu postura\",\"question\":\"Estoy en contra de una prohibición.\",\"answers\":[\"Ich bin gegen ein Verbot\",\"Ich bin dagegen\"],\"hints\":[\"gegen + Akkusativ, o el da-Kompositum solo\",\"Ich bin gegen ein ...\"],\"itemIds\":[\"b1m4ichbindagegen\",\"b1m4dasverbot\"],\"tip\":\"Guarda esta frase: es el primer movimiento del comentario de opinión y del Lesen Teil 4.\"},{\"id\":\"b1m4l6e11\",\"type\":\"audiomc\",\"prompt\":\"Del texto al oído: el mismo tema, ahora en la radio. Hören Teil 1 · tarea 1 de 2. Dos escuchas.\",\"audio\":\"… und noch eine Meldung zum Jugendschutz. Ein Verbot gewalttätiger Videospiele ist erst einmal vom Tisch. Es gebe ja bereits die Altersfreigabe, heißt es aus dem Ministerium, sie werde zu Hause nur nicht durchgesetzt. Ab Januar sind die Hersteller deshalb verpflichtet, die Altersangabe größer und auf der Vorderseite zu drucken. Ob das reicht, ähm, da sind sich nicht einmal die Fachleute einig.\",\"question\":\"„Gewalttätige Videospiele werden ab Januar verboten.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Ein Verbot … ist erst einmal vom Tisch»: lo que cambia en enero es la etiqueta de edad\",null],\"itemIds\":[\"b1m4verbieten\",\"b1m4dasverbot\",\"b1m4gewalttaetig\"],\"tip\":\"«vom Tisch sein» = quedar descartado. En una noticia, esa expresión decide la mitad de las afirmaciones.\"},{\"id\":\"b1m4l6e12\",\"type\":\"audiomc\",\"prompt\":\"Misma noticia, segunda tarea. Dos escuchas.\",\"audio\":\"… und noch eine Meldung zum Jugendschutz. Ein Verbot gewalttätiger Videospiele ist erst einmal vom Tisch. Es gebe ja bereits die Altersfreigabe, heißt es aus dem Ministerium, sie werde zu Hause nur nicht durchgesetzt. Ab Januar sind die Hersteller deshalb verpflichtet, die Altersangabe größer und auf der Vorderseite zu drucken. Ob das reicht, ähm, da sind sich nicht einmal die Fachleute einig.\",\"question\":\"¿Qué cambia en enero?\",\"options\":[\"Los fabricantes deben imprimir la edad recomendada más grande y en la portada\",\"La edad recomendada sube a los dieciocho años\",\"Los padres tendrán que firmar una autorización\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La edad no cambia: cambia cómo se imprime\",\"De autorizaciones no se habla\"],\"itemIds\":[\"b1m4diealtersfreigabe\",\"b1m4derjugendschutz\",\"b1m4dasgesetz\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m4-2\",\"book\":\"Ich spiele gerade ein Videospiel.\",\"real\":\"Ich zocke gerade.\",\"meaning\":\"Estoy jugando (a videojuegos) ahora mismo\",\"when\":\"Entre gente joven y en chats, todo el rato. En un texto de examen, jamás: «zocken» es jerga pura y no sirve para contarle a un examinador qué haces en tu tiempo libre.\",\"register\":\"jerga\",\"exam\":\"In meiner Freizeit spiele ich gern Computerspiele.\",\"note\":\"«zocken» era jugar con dinero (apostar); hoy es el verbo normal del videojuego entre amigos. También existe «der Zocker».\",\"sound\":\"ij TSO-ke GUE-raa-de\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m4natzocken\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Lesen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"El Teil 2 son dos textos de prensa como este, con 3 preguntas cada uno.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
