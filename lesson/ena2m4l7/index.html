003cb\u003eY aquí está la trampa gorda de esta lección:\u003c/b\u003e el español dice «\u003cb\u003ela\u003c/b\u003e mayoría \u003cb\u003ede\u003c/b\u003e la gente», con artículo y con «de». El inglés, cuando habla en general, no pone ni una cosa ni la otra: \u003cb\u003eMost people\u003c/b\u003e, a secas. \u003ci\u003eThe most people\u003c/i\u003e está mal.\u003cbr/\u003e\u003cbr/\u003eAhora bien, si hablas de un \u003cb\u003egrupo concreto\u003c/b\u003e, sí aparece el \u003ci\u003eof\u003c/i\u003e: \u003ci\u003eMost \u003cb\u003eof\u003c/b\u003e my friends take the bus\u003c/i\u003e, \u003ci\u003emost \u003cb\u003eof\u003c/b\u003e the students\u003c/i\u003e. La regla es fácil de recordar así: \u003cb\u003een general, most a secas; de un grupo con nombre y apellidos, most of.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eY la otra que el español calca: «más \u003cb\u003ede\u003c/b\u003e diez libras» no es \u003ci\u003emore of ten pounds\u003c/i\u003e. Con números es \u003cb\u003emore than\u003c/b\u003e: [[more than ten pounds|más de diez libras]]. Es el mismo \u003ci\u003ethan\u003c/i\u003e de comparar, otra vez.18:T4d9,\u003cb\u003eenough\u003c/b\u003e = suficiente, bastante. Se coloca \u003cb\u003edelante del sustantivo\u003c/b\u003e: [[There isn't enough room.|No hay sitio suficiente.]] · \u003ci\u003eenough time\u003c/i\u003e, \u003ci\u003eenough money\u003c/i\u003e, \u003ci\u003eenough chairs\u003c/i\u003e. (Detrás de un adjetivo también existe —\u003ci\u003ebig enough\u003c/i\u003e—, y esa es la frontera de mañana.)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eno\u003c/b\u003e y \u003cb\u003enone\u003c/b\u003e son la misma idea repartida en dos sitios:\u003cbr/\u003e• \u003cb\u003eno + sustantivo\u003c/b\u003e: \u003ci\u003eThere's \u003cb\u003eno\u003c/b\u003e milk.\u003c/i\u003e — hay sustantivo detrás.\u003cbr/\u003e• \u003cb\u003enone\u003c/b\u003e, solo o con \u003ci\u003eof\u003c/i\u003e: \u003ci\u003eHow many are left? \u003cb\u003eNone\u003c/b\u003e.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eNone of\u003c/b\u003e them can come.\u003c/i\u003e — no hay sustantivo detrás.\u003cbr/\u003e\u003cbr/\u003eEl error español es decir \u003ci\u003eNo of them\u003c/i\u003e, porque en español «ninguno» es una sola palabra para las dos posiciones. En inglés, si detrás no hay sustantivo, \u003cb\u003enone\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eall\u003c/b\u003e = todo, todos. En general va a pelo (\u003ci\u003eAll the chairs are old\u003c/i\u003e, \u003ci\u003eall day\u003c/i\u003e) y con un grupo concreto lleva \u003ci\u003eof\u003c/i\u003e: \u003ci\u003eall of them\u003c/i\u003e, \u003ci\u003eall of my friends\u003c/i\u003e. Igual que most.\u003cbr/\u003e\u003cbr/\u003eY un aviso que te ahorra el módulo siguiente: \u003cb\u003emuch\u003c/b\u003e y \u003cb\u003emany\u003c/b\u003e viven en esta misma familia, pero necesitan saber si el sustantivo se puede contar o no. Eso es \u003ci\u003eena2m5\u003c/i\u003e entero. Aquí quédate con estos seis."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l7\",\"phaseId\":\"ena2m4\",\"title\":\"More, most, enough, none\",\"subtitle\":\"Comparar cantidades: las palabritas que van delante del sustantivo\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuánto hay, y cuánto falta\",\"itemIds\":[\"ena2m4weneedmoretime\",\"ena2m4mostpeople\",\"ena2m4enoughroom\",\"ena2m4nomilkleft\",\"ena2m4noneofthem\",\"ena2m4allofthem\",\"ena2m4morethantenpounds\",\"enmilk\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Los mismos more y most, pero delante de un sustantivo\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"lo que sale mal\"],[\"más tiempo\",\"more time\",\"more of time\"],[\"la mayoría de la gente\",\"most people\",\"the most people\"],[\"la mayoría de mis amigos\",\"most of my friends\",\"most my friends\"],[\"más de diez libras\",\"more than ten pounds\",\"more of ten pounds\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"enough, no, none y all: dónde se colocan\",\"body\":\"$18\",\"table\":[[\"palabra\",\"qué lleva detrás\",\"ejemplo\"],[\"more\",\"sustantivo, a pelo\",\"more time\"],[\"most\",\"sustantivo (general) / of + grupo\",\"most people · most of them\"],[\"enough\",\"sustantivo, a pelo\",\"enough room\"],[\"no\",\"sustantivo, a pelo\",\"no milk\"],[\"none\",\"nada, o of + grupo\",\"None. · none of them\"],[\"all\",\"sustantivo / of + grupo\",\"all day · all of them\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l7e1\",\"type\":\"mc\",\"prompt\":\"«Nos hace falta más tiempo»\",\"question\":\"¿Cuál es la frase correcta?\",\"options\":[\"We need more time.\",\"We need more of time.\",\"We need the more time.\"],\"answer\":0,\"whyWrong\":[null,\"El «de» del español no se traduce aquí: more va pegado al sustantivo\",\"more no lleva artículo delante cuando compara cantidades\"],\"itemIds\":[\"ena2m4weneedmoretime\"]},{\"id\":\"ena2m4l7e2\",\"type\":\"mc\",\"prompt\":\"«La mayoría de la gente»\",\"question\":\"Hablando en general, «la mayoría de la gente coge el autobús» es…\",\"options\":[\"Most people take the bus.\",\"The most people take the bus.\",\"The most of people take the bus.\"],\"answer\":0,\"whyWrong\":[null,\"Ese the sale del «la» español, y en inglés sobra cuando se habla en general\",\"Sobran el artículo y el of a la vez\"],\"itemIds\":[\"ena2m4mostpeople\",\"ena2m1therewere\"],\"tip\":\"Con of solo cuando el grupo está identificado: most of my friends, most of the students. Si no, most a secas.\"},{\"id\":\"ena2m4l7e3\",\"type\":\"cloze\",\"prompt\":\"Completa con la palabra de «suficiente»\",\"text\":\"The kitchen is small: there isn't ___ room for a big table.\",\"answers\":[\"enough\"],\"translation\":\"La cocina es pequeña: no hay sitio suficiente para una mesa grande.\",\"hints\":[\"Va delante del sustantivo\",\"e…\"],\"itemIds\":[\"ena2m4enoughroom\",\"enkitchen\",\"entable\"]},{\"id\":\"ena2m4l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la generalización\",\"text\":\"___ people in London take the tube to work.\",\"answers\":[\"Most\"],\"translation\":\"La mayoría de la gente en Londres va al trabajo en metro.\",\"hints\":[\"Sin artículo delante y sin of detrás\",\"M…\"],\"itemIds\":[\"ena2m4mostpeople\",\"entube\",\"enlondon\"]},{\"id\":\"ena2m4l7e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el artículo que el español añade\",\"wrong\":\"The most people take the bus.\",\"answers\":[\"Most people take the bus.\"],\"why\":\"En español «la mayoría» lleva artículo y en inglés no, cuando se habla en general. «The most people» solo tendría sentido en una comparación rarísima («el sitio con MÁS gente»), y no es lo que quieres decir.\",\"translation\":\"La mayoría de la gente coge el autobús.\",\"itemIds\":[\"ena2m4mostpeople\"]},{\"id\":\"ena2m4l7e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «de» de las cantidades\",\"wrong\":\"It costs more of ten pounds.\",\"answers\":[\"It costs more than ten pounds.\"],\"why\":\"«Más de diez» es una comparación con un número, y en inglés las comparaciones se hacen con THAN, siempre. El of del español aquí no tiene traducción: more than ten, less than five, over twenty.\",\"translation\":\"Cuesta más de diez libras.\",\"itemIds\":[\"ena2m4morethantenpounds\",\"ena2m4than\",\"enpound\"],\"tip\":\"Y fíjate en que es el mismo than de «cheaper than». Una sola palabra para todas las comparaciones: de adjetivos y de números.\"},{\"id\":\"ena2m4l7e7\",\"type\":\"gapbank\",\"prompt\":\"La cocina de Valeria — elige del banco\",\"text\":\"Our kitchen is small: there isn't ___ room for a big table. We need two ___ chairs for Sunday, but ___ of my friends can come, so two is enough. ___ the chairs in this flat are old.\",\"answers\":[\"enough\",\"more\",\"none\",\"All\"],\"bank\":[\"enough\",\"more\",\"none\",\"All\",\"most\",\"no\"],\"translation\":\"Nuestra cocina es pequeña: no hay sitio suficiente para una mesa grande. Necesitamos dos sillas más para el domingo, pero no puede venir ninguno de mis amigos, así que con dos basta. Todas las sillas de este piso son viejas.\",\"itemIds\":[\"ena2m4enoughroom\",\"ena2m4weneedmoretime\",\"ena2m4noneofthem\",\"ena2m4allofthem\",\"enkitchen\",\"enchair\"],\"tip\":\"Fíjate en el segundo hueco: «two more chairs», el more detrás del número. Es el orden inglés y no se puede cambiar.\"},{\"id\":\"ena2m4l7e8\",\"type\":\"bucket\",\"prompt\":\"¿Aquí va «no» o va «none»?\",\"categories\":[\"no + sustantivo\",\"none (sin sustantivo detrás)\"],\"items\":[{\"text\":\"There's ___ milk in the fridge.\",\"bucket\":0},{\"text\":\"How many are left? ___.\",\"bucket\":1},{\"text\":\"I have ___ money.\",\"bucket\":0},{\"text\":\"___ of them can come.\",\"bucket\":1},{\"text\":\"There's ___ room for a table.\",\"bucket\":0},{\"text\":\"I wanted three, but there were ___.\",\"bucket\":1}],\"itemIds\":[\"ena2m4nomilkleft\",\"ena2m4noneofthem\",\"enmilk\",\"enfridge\"],\"tip\":\"Mira solo lo que hay DETRÁS del hueco: si hay un sustantivo, no. Si no hay nada o hay «of», none. No falla.\"},{\"id\":\"ena2m4l7e9\",\"type\":\"mc\",\"prompt\":\"Dónde se coloca enough\",\"question\":\"¿Cuál de estas dos es la de esta lección?\",\"options\":[\"There isn't enough room.\",\"There isn't room enough.\"],\"answer\":0,\"whyWrong\":[null,\"Se entiende, pero suena a poesía antigua: delante del sustantivo, enough va primero\"],\"itemIds\":[\"ena2m4enoughroom\"],\"tip\":\"Delante de sustantivo, enough va antes: enough room, enough time. Detrás de adjetivo va después: big enough. Mañana lo vemos entero.\"},{\"id\":\"ena2m4l7e10\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"source\":\"There's no milk left, and none of the shops are open.\",\"answers\":[\"No queda leche, y no hay ninguna tienda abierta.\",\"No queda leche, y ninguna de las tiendas está abierta.\"],\"itemIds\":[\"ena2m4nomilkleft\",\"ena2m4noneofthem\",\"enmilk\",\"enopen\"],\"tip\":\"Fíjate en que el inglés niega UNA sola vez por frase: «no milk» y «none of the shops». En español encadenamos «no… ninguna» sin problema; en inglés eso serían dos negaciones y no cabe.\"},{\"id\":\"ena2m4l7e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"We need more chairs, but there isn't enough room.\",\"phonetic\":\"ui niid moo CHÉAS̬, bat déar is̬nt i-NAF RUUM\",\"translation\":\"Necesitamos más sillas, pero no hay sitio suficiente.\",\"itemIds\":[\"ena2m4weneedmoretime\",\"ena2m4enoughroom\",\"enchair\",\"enroom\"],\"tip\":\"enough se dice «i-NAF», con el golpe en la segunda y una f al final. La escritura de esta palabra es de las peores del inglés; el sonido, de los fáciles.\"},{\"id\":\"ena2m4l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La mayoría de las tiendas cuestan más de veinte libras, pero esta no.\",\"answers\":[\"Most shops cost more than twenty pounds, but this one doesn't.\",\"Most of the shops cost more than twenty pounds, but this one doesn't.\",\"Most shops cost more than twenty pounds, but this one doesn't cost that.\"],\"hints\":[\"Most sin artículo + more than con el número\",\"M… shops cost m… th… twenty pounds, but this one doesn't.\"],\"itemIds\":[\"ena2m4mostpeople\",\"ena2m4morethantenpounds\",\"enshop\",\"entwenty\",\"enpound\"]}]}],\"resources\":[{\"label\":\"British Council — Quantifiers\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/quantifiers\",\"note\":\"Lee solo el bloque de all, most, none y enough. Lo de much y many déjalo: es el módulo siguiente y se entiende mucho mejor con el contable/incontable delante.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"
