s/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T57a,"])</script><script>self.__next_f.push([1,"El vocabulario de esta lección es casi todo transparente, así que vamos directos a los cuatro sitios donde se pierde tiempo:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. [[luggage|el equipaje]] no tiene plural.\u003c/b\u003e Es incontable, como \u003ci\u003einformation\u003c/i\u003e o \u003ci\u003eadvice\u003c/i\u003e: nunca \u003ci\u003eluggages\u003c/i\u003e, nunca \u003ci\u003ea luggage\u003c/i\u003e. Si quieres contar, cuentas las piezas: \u003ci\u003etwo [[suitcases|maletas]]\u003c/i\u003e, \u003ci\u003ethree bags\u003c/i\u003e. Y si quieres decir «mucho equipaje»: \u003ci\u003ea lot of luggage\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. [[the traffic|el tráfico]] tampoco.\u003c/b\u003e \u003ci\u003eThere was a lot of traffic\u003c/i\u003e, siempre en singular. Lo que sí se cuenta es el atasco: \u003cb\u003e[[a traffic jam|un atasco]]\u003c/b\u003e, \u003ci\u003etwo traffic jams\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. [[the coach|el autocar]] es un falso amigo doble.\u003c/b\u003e No es un entrenador (aunque también signifique eso) y no es un coche: es el \u003cb\u003eautobús de largo recorrido\u003c/b\u003e, el que va de ciudad a ciudad. Y en un tren, \u003ci\u003ecoach B\u003c/i\u003e es el \u003cb\u003evagón\u003c/b\u003e B. El autobús urbano de siempre sigue siendo \u003ci\u003ebus\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e4. [[platform four|el andén número cuatro]] va sin «the» y sin «number».\u003c/b\u003e En la estación se dice \u003ci\u003ePlatform 4\u003c/i\u003e, tal cual, igual que \u003ci\u003eGate 12\u003c/i\u003e en el aeropuerto. El cartel lo dice así y el altavoz también.\u003cbr/\u003e\u003cbr/\u003eY dos que van en pareja: \u003cb\u003e[[a return ticket|un billete de ida y vuelta]]\u003c/b\u003e frente a \u003ci\u003ea single\u003c/i\u003e (solo ida). En la taquilla se pide entero: \u003ci\u003eA return to Brighton, please.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T4b6,Valeria and Amy are going to Brighton in July, and they still don't know how they are going to get there.\u003cbr/\u003e\u003cbr/\u003eThe train is the fast way. It leaves from Victoria and it takes about an hour. The problem is the price: on a Saturday morning in summer [[a return ticket|un billete de ida y vuelta]] is expensive, and if you buy it at the station on the day, it is even more expensive. Amy always says the same thing: 'Buy it three weeks before and it costs half.'\u003cbr/\u003e\u003cbr/\u003eThe coach is slower. It takes two hours, and two and a half when the traffic is bad. It leaves from a station that is not very close to the flat, so they are going to need a bus before the coach. But it is much cheaper, and you can take a big bag without paying extra.\u003cbr/\u003e\u003cbr/\u003eThere is a third way, and Ben talks about it every summer: he is going to drive. He has got a small old car and he loves it. He never mentions the [[car park|el aparcamiento]] in Brighton. It is full by ten o'clock and it costs more than two train tickets.\u003cbr/\u003e\u003cbr/\u003eAmy is going to decide this week. She usually decides these things and Valeria usually agrees. But this time Valeria has a plan: she is going to look at the prices herself, before Saturday."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l7\",\"phaseId\":\"ena2m6\",\"title\":\"Platform four, coach B\",\"subtitle\":\"Las palabras del viaje — y los incontables que hacen fallar una frase entera\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que llevas, lo que reservas y lo que te retrasa\",\"itemIds\":[\"ena2m6luggage\",\"ena2m6suitcase\",\"ena2m6passport\",\"ena2m6thebooking\",\"ena2m6platformfour\",\"ena2m6areturnticket\",\"ena2m6atrafficjam\",\"ena2m6abedandbreakfast\",\"ena2m6thecoach\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cuatro palabras de viaje que el español traduce mal\",\"body\":\"$17\",\"table\":[[\"se cuenta\",\"no se cuenta\"],[\"a suitcase · two suitcases\",\"luggage\"],[\"a traffic jam · two traffic jams\",\"traffic\"],[\"a bag · three bags\",\"information\"],[\"a ticket · two tickets\",\"advice\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Perder, dejarse y olvidar: los cuatro verbos del módulo 2, en un andén\",\"body\":\"Un viaje es el sitio donde estos cuatro se cruzan, y ya los tienes repartidos del módulo 2. Aquí solo se recuerda cuál va con qué, porque en español los tres primeros son «perder» u «olvidar» y en inglés no:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003elose\u003c/b\u003e → \u003cb\u003eobjetos\u003c/b\u003e. \u003ci\u003eI [[lost|perdí]] my phone. · I lost my passport.\u003c/i\u003e No sabes dónde está.\u003cbr/\u003e· \u003cb\u003emiss\u003c/b\u003e → \u003cb\u003etransportes y citas\u003c/b\u003e. \u003ci\u003eI [[missed the bus|perdí el autobús]]. · We're going to miss the train.\u003c/i\u003e Llegaste tarde.\u003cbr/\u003e· \u003cb\u003eforget\u003c/b\u003e → \u003cb\u003ese te va de la cabeza\u003c/b\u003e. \u003ci\u003eI [[forgot|me dejé]] my keys.\u003c/i\u003e No dice dónde están.\u003cbr/\u003e· \u003cb\u003eleave\u003c/b\u003e → \u003cb\u003elo dejaste en un sitio concreto\u003c/b\u003e, y ese sitio se dice. \u003ci\u003eI left my suitcase at the hotel.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLa regla corta: \u003cb\u003eforget sin sitio, leave con sitio\u003c/b\u003e. \u003ci\u003eI forgot my passport\u003c/i\u003e ✅ · \u003ci\u003eI left my passport at home\u003c/i\u003e ✅ · \u003ci\u003eI forgot my passport at home\u003c/i\u003e ❌.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m6l7e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga del andén\",\"pairs\":[{\"target\":\"luggage\",\"source\":\"el equipaje\"},{\"target\":\"a suitcase\",\"source\":\"una maleta\"},{\"target\":\"my passport\",\"source\":\"el pasaporte\"},{\"target\":\"the booking\",\"source\":\"la reserva\"},{\"target\":\"platform four\",\"source\":\"el andén cuatro\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m6luggage\",\"ena2m6suitcase\",\"ena2m6passport\",\"ena2m6thebooking\",\"ena2m6platformfour\"]},{\"id\":\"ena2m6l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Se cuenta o no se cuenta?\",\"categories\":[\"se cuenta (lleva a / plural)\",\"no se cuenta (nunca plural)\"],\"items\":[{\"text\":\"suitcase\",\"bucket\":0},{\"text\":\"luggage\",\"bucket\":1},{\"text\":\"traffic\",\"bucket\":1},{\"text\":\"traffic jam\",\"bucket\":0},{\"text\":\"ticket\",\"bucket\":0},{\"text\":\"information\",\"bucket\":1}],\"itemIds\":[\"ena2m6luggage\",\"ena2m6suitcase\",\"ena2m6atrafficjam\",\"enticket\"],\"tip\":\"Los incontables del inglés no siguen la lógica del español: «los equipajes» y «los tráficos» tampoco se dicen mucho en español, pero «las informaciones» sí, y en inglés jamás.\"},{\"id\":\"ena2m6l7e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el plural imposible\",\"wrong\":\"I'm going to take two luggages.\",\"answers\":[\"I'm going to take two bags.\"],\"why\":\"Luggage es incontable: no tiene plural ni lleva número delante. Si quieres contar, cuentas las piezas — two bags, two suitcases — o dejas la cantidad en «a lot of luggage».\",\"translation\":\"Voy a llevar dos bolsas.\",\"itemIds\":[\"ena2m6luggage\"]},{\"id\":\"ena2m6l7e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la concordancia\",\"wrong\":\"There were a lot of traffics this morning.\",\"answers\":[\"There was a lot of traffic this morning.\"],\"why\":\"Traffic es incontable y siempre singular, así que pide «there was», no «there were». Lo que sí se cuenta es el atasco: there were two traffic jams.\",\"translation\":\"Esta mañana había mucho tráfico.\",\"itemIds\":[\"ena2m6atrafficjam\",\"ena2m1therewas\",\"ena2m1therewere\"],\"tip\":\"Es el mismo mecanismo del módulo 1: en inglés, lo que va detrás decide si es was o were. Y «traffic» va en singular siempre.\"},{\"id\":\"ena2m6l7e5\",\"type\":\"bucket\",\"prompt\":\"Espiral del módulo 2: ¿lose, miss, forget o leave?\",\"categories\":[\"lo perdiste: no sabes dónde está\",\"llegaste tarde y se fue sin ti\"],\"items\":[{\"text\":\"I lost my passport.\",\"bucket\":0},{\"text\":\"We missed the train.\",\"bucket\":1},{\"text\":\"I lost my suitcase at the airport.\",\"bucket\":0},{\"text\":\"She missed her flight.\",\"bucket\":1},{\"text\":\"I lost my wallet on the coach.\",\"bucket\":0},{\"text\":\"They missed the last bus.\",\"bucket\":1}],\"itemIds\":[\"ena2m2ilostmyphone\",\"ena2m1missedthebus\",\"ena2m6passport\",\"ena2m2mywallet\"],\"tip\":\"El español llama «perder» a las dos cosas y por eso se cruzan. En inglés lose es para objetos y miss para lo que se va sin ti.\"},{\"id\":\"ena2m6l7e6\",\"type\":\"mc\",\"prompt\":\"Forget o leave\",\"question\":\"El pasaporte está encima de tu mesa, en casa, y tú estás en la estación.\",\"options\":[\"I left my passport at home.\",\"I forgot my passport at home.\",\"I lost my passport at home.\"],\"answer\":0,\"whyWrong\":[null,\"Forget no lleva sitio: se dice «I forgot my passport», a secas\",\"Lose es cuando no sabes dónde está, y tú lo sabes perfectamente\"],\"itemIds\":[\"ena2m2iforgotmykeys\",\"ena2m6passport\"],\"tip\":\"Forget sin sitio, leave con sitio. Es la única diferencia y sirve para toda la vida.\"},{\"id\":\"ena2m6l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa en la taquilla\",\"text\":\"A ___ to Brighton, please — I'm coming back on Sunday.\",\"answers\":[\"return\"],\"translation\":\"Un billete de ida y vuelta a Brighton, por favor: vuelvo el domingo.\",\"hints\":[\"Si vuelves, no es un single\",\"A r… to Brighton, please.\"],\"itemIds\":[\"ena2m6areturnticket\"]},{\"id\":\"ena2m6l7e8\",\"type\":\"cloze\",\"prompt\":\"Completa el aviso de la estación\",\"text\":\"The ten o'clock train to Brighton leaves from ___ four.\",\"answers\":[\"platform\"],\"translation\":\"El tren de las diez a Brighton sale del andén cuatro.\",\"hints\":[\"Va sin the y sin number\",\"leaves from p… four\"],\"itemIds\":[\"ena2m6platformfour\",\"ena2m6thetrainleavesatten\"]},{\"id\":\"ena2m6l7e9\",\"type\":\"listen\",\"prompt\":\"Dictado — el mensaje de Amy\",\"text\":\"I'm going to check the booking before we leave.\",\"translation\":\"Voy a mirar la reserva antes de salir.\",\"hints\":[\"going to + verbo desnudo · before + sujeto + presente\",\"I'm going to check the b… before we l….\"],\"itemIds\":[\"ena2m6thebooking\",\"ena2m6beforeweleave\"]},{\"id\":\"ena2m6l7e10\",\"type\":\"audiomc\",\"prompt\":\"Aviso de megafonía — pregunta primero, dos escuchas\",\"audio\":\"Good morning. The nine forty-five service to Brighton is going to leave from platform six, not platform four. Passengers with a lot of luggage, please use the lift.\",\"question\":\"¿Qué ha cambiado?\",\"options\":[\"El andén\",\"La hora\",\"El destino\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La hora se dice una sola vez y no se corrige\",\"Brighton se dice una vez y no cambia\"],\"notepad\":true,\"itemIds\":[\"ena2m6platformfour\",\"ena2m6luggage\"],\"tip\":\"En los avisos de estación, la información importante casi siempre viene con un «not» detrás: «platform six, NOT platform four». Ese not es el dato.\"},{\"id\":\"ena2m6l7e11\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"There was a traffic jam, so we missed the coach and we lost a whole morning.\",\"answers\":[\"Había un atasco, así que perdimos el autocar y perdimos una mañana entera.\",\"Hubo un atasco, así que perdimos el autocar y perdimos toda una mañana.\"],\"itemIds\":[\"ena2m6atrafficjam\",\"ena2m6thecoach\",\"ena2m2soiwalked\"],\"tip\":\"Dos «perder» en español, dos verbos distintos en inglés: miss el autocar, lose la mañana. Fíjate en que el reparto aguanta incluso con algo que no es un objeto.\"},{\"id\":\"ena2m6l7e13\",\"type\":\"read\",\"prompt\":\"Lectura larga, como la Parte 4 del Reading: lee el texto entero y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Two ways to get to Brighton\",\"text\":\"$18\",\"source\":\"relato del curso\",\"questions\":[{\"id\":\"ena2m6l7e13q1\",\"q\":\"How long does the train take?\",\"options\":[\"About an hour\",\"Two hours\",\"Two and a half hours\"],\"answer\":0,\"why\":\"«it takes about an hour». Las dos horas y las dos y media son las del autocar, y el texto las pone justo debajo para ver si vas rápido.\"},{\"id\":\"ena2m6l7e13q2\",\"q\":\"What does Amy's advice tell us about train tickets?\",\"options\":[\"That the same journey costs different money depending on when you buy it\",\"That tickets are always cheaper at the station\",\"That you cannot buy a ticket on the day of the journey\"],\"answer\":0,\"inference\":true,\"why\":\"Ella no explica la regla, da un consejo: «cómpralo tres semanas antes y cuesta la mitad». La regla hay que sacarla de ahí.\"},{\"id\":\"ena2m6l7e13q3\",\"q\":\"What are the two advantages of the coach?\",\"options\":[\"It is much cheaper and you can take a big bag for free\",\"It is faster and it leaves near the flat\",\"It is cheaper and it never gets stuck in traffic\"],\"answer\":0,\"why\":\"«it is much cheaper, and you can take a big bag without paying extra». Lo de la estación lejos y el tráfico son justo lo contrario de ventajas.\"},{\"id\":\"ena2m6l7e13q4\",\"q\":\"Why does the writer mention the car park in Brighton?\",\"options\":[\"To show that Ben's idea is not as cheap as it sounds\",\"To explain where Ben usually leaves his car\",\"To say that there is no station in Brighton\"],\"answer\":0,\"inference\":true,\"why\":\"Fíjate en la frase de antes: «He never mentions the car park». El texto lo menciona por él, y con el precio al lado.\"},{\"id\":\"ena2m6l7e13q5\",\"q\":\"What is different about Valeria this time?\",\"options\":[\"She is not going to leave the decision to Amy\",\"She is not going to travel with Amy\",\"She is going to go by car with Ben\"],\"answer\":0,\"inference\":true,\"why\":\"«She usually decides these things and Valeria usually agrees. But this time…». Ese «but this time» es toda la respuesta.\"}],\"itemIds\":[\"ena2m6weregoingtobrighton\",\"ena2m6areturnticket\",\"ena2m6thecoach\",\"ena2m6atrafficjam\"],\"tip\":\"Es la Parte 4 del Reading tal cual: un texto seguido y preguntas en el orden del texto. Dos de las cinco no están escritas en ninguna línea — hay que unir dos frases. Ese es el salto del A2.\"},{\"id\":\"ena2m6l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Voy a reservar una pensión y voy a llevar solo una maleta.\",\"answers\":[\"I'm going to book a bed and breakfast and I'm going to take one suitcase.\",\"I'm going to book a bed and breakfast and I'm going to take only one suitcase.\",\"I'm going to book a bed and breakfast and take one suitcase.\"],\"hints\":[\"going to + verbo desnudo, dos veces\",\"I'm going to b… a bed and breakfast and I'm going to take one s….\"],\"itemIds\":[\"ena2m6abedandbreakfast\",\"ena2m6suitcase\",\"ena2m6imgoingtobook\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m6-4\",\"book\":\"There is a lot of traffic today.\",\"real\":\"The traffic's terrible today.\",\"meaning\":\"Hay un tráfico horrible hoy\",\"when\":\"Con cualquiera, todos los días: es la queja nacional británica junto con el tiempo. Fíjate en que el nativo no dice «hay mucho», dice «el tráfico está fatal» — cambia la construcción entera. En el examen, «There's a lot of traffic» está perfecto y es más seguro.\",\"register\":\"neutral\",\"note\":\"El mismo giro sirve para el tiempo: «The weather's terrible». Es la forma corta de quejarse sin decir there is.\",\"sound\":\"de TRÁ-fiks TE-ri-bol tu-DÉI\",\"level\":\"a2\",\"itemId\":\"ena2m6atrafficjam\"}}],\"resources\":[{\"label\":\"National Rail — comprar billetes\",\"url\":\"https://www.nationalrail.co.uk/\",\"note\":\"Busca un tren de Londres a Brighton para el sábado que viene. No lo compres: lee la pantalla y apunta cinco palabras que reconozcas — single, return, platform, coach, off-peak.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
