003e\u003cbr/\u003eNo son sinónimos: quien está obliged puede negarse y atenerse; quien está forced, no.\u003cbr/\u003e\u003cbr/\u003eHoy escribes 150-200 palabras. El esqueleto de la L4 se queda; lo que crece es el dato y un conector de consecuencia.18:T413,To: Neighbourhood Library Committee\nFrom: Valeria Soto\nSubject: A second talk by Dr Farida Haq\n\nThe purpose of this report is to recommend whether the library should invite Dr Haq back, this time on space exploration.\n\nAccording to the attendance sheet, roughly forty people came on Thursday and stayed until the end. As a result, the caretaker had to lock up later than usual, which is a practical point rather than a complaint. The findings of the first evening were clear to a great extent: a method told as a story holds a room. Space exploration is highly likely to do the same work, namely to take a rare light and put it on a scale.\n\nIt is much less likely to draw the residents who came for the haunted-house question, and that is worth naming. All things considered, I would be grateful if the committee could offer her a weekday evening in May, with some reservations about a Saturday slot. In conclusion, the second talk is worth running, provided the title says what the evening will actually do: grade a claim, not sell a mystery."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l8\",\"phaseId\":\"enb2m5\",\"title\":\"With reservations\",\"subtitle\":\"Conectores del informe y el write de 150-200\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Causa, cierre, y la frase que admite ignorancia\",\"itemIds\":[\"enb2m5asaresult\",\"enb2m5thus\",\"enb2m5inconclusion\",\"enb2m5allthingsconsidered\",\"enb2m5conclusive\",\"enb2m5forcedto\",\"enb2m5obligedto\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: estos conectores son B2, y therefore ya lo tenías\",\"body\":\"$17\",\"table\":[[\"Conector\",\"Oficio\",\"No lo pongas con\"],[\"as a result\",\"consecuencia con dato\",\"thus (mismo hueco)\"],[\"thus\",\"consecuencia lógica, seca\",\"as a result (mismo hueco)\"],[\"in conclusion\",\"cierre de texto, una vez\",\"el primer párrafo\"],[\"all things considered\",\"cierre con reservas\",\"Odds are\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l8e1\",\"type\":\"mc\",\"prompt\":\"Obliged no es forced\",\"question\":\"«Se vio obligada a cancelar el experimento» (no dependía de ella) →\",\"options\":[\"She was forced to cancel the experiment.\",\"She was obliged to cancel the experiment.\",\"She was supposed to cancel the experiment.\"],\"answer\":0,\"whyWrong\":[null,\"«Obliged» es norma: hay un reglamento. Aquí el mundo se lo impide.\",\"«Supposed to» es expectativa. Cancelar no era lo previsto; fue a lo que la empujaron.\"],\"itemIds\":[\"enb2m5forcedto\",\"enb2m5obligedto\",\"enb2m5supposedtoobligation\"],\"tip\":\"Atajo: si hay un cartel, un contrato o un ayuntamiento, obliged. Si hay un apagón, un accidente o un jefe que te deja sin laboratorio, forced.\"},{\"id\":\"enb2m5l8e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"There are no conclusive evidences.\",\"answers\":[\"There is no conclusive evidence.\"],\"why\":\"Doble trampa: «evidence» es incontable (verbo en singular, sin -s) y «conclusive» se queda. «There are no conclusive evidences» es el calco de «no hay evidencias concluyentes», palabra por palabra, y en inglés no existe.\",\"translation\":\"No hay pruebas concluyentes.\",\"itemIds\":[\"enb2m5conclusive\",\"enb2m5theevidence\"]},{\"id\":\"enb2m5l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa el cierre de informe\",\"text\":\"___ conclusion, the data is not conclusive.\",\"answers\":[\"In\"],\"translation\":\"En conclusión, los datos no son concluyentes.\",\"hints\":[\"La preposición de esta fórmula de cierre\",\"Dos letras\"],\"itemIds\":[\"enb2m5inconclusion\",\"enb2m5conclusive\"],\"tip\":\"El chiste del módulo, y es deliberado: «in conclusion» cierra; «conclusive» es el adjetivo de las pruebas. No son la misma palabra. El examen adora este par.\"},{\"id\":\"enb2m5l8e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo — thus y as a result NO van juntos a propósito\",\"text\":\"The sample was stored above the recommended temperature. ___ a result, it was discarded. All things ___, the team should wait for a second run. Residents are ___ to report any damage to the fridge; the technician was ___ to cancel Tuesday's slot.\",\"answers\":[\"As\",\"considered\",\"obliged\",\"forced\"],\"bank\":[\"As\",\"considered\",\"obliged\",\"forced\",\"For\",\"concluded\",\"supposed\",\"bound\"],\"translation\":\"La muestra se guardó por encima de la temperatura recomendada. Como resultado, se descartó. Teniendo todo en cuenta, el equipo debería esperar a una segunda tanda. Los vecinos tienen la obligación de comunicar cualquier desperfecto de la nevera; el técnico se vio obligado a cancelar el hueco del martes.\",\"itemIds\":[\"enb2m5asaresult\",\"enb2m5allthingsconsidered\",\"enb2m5obligedto\",\"enb2m5forcedto\"],\"tip\":\"«Thus» no está en el banco: en el mismo párrafo «as a result» ya ocupa el hueco de consecuencia, y si las dos compitieran no sabrías cuál va.\"},{\"id\":\"enb2m5l8e5\",\"type\":\"write\",\"prompt\":\"Informe largo: 150-200 palabras. Mismos huesos que la L4, más un conector de consecuencia y una reserva.\",\"scenario\":\"El comité de la biblioteca quiere por escrito si debe invitar a Dr Haq a una segunda charla, esta vez sobre exploración espacial. Informe al comité. Datos, consecuencia, cierre con reservas. Sin «I think».\",\"genre\":\"report\",\"register\":\"polite\",\"bullets\":[\"Abre con el propósito.\",\"Usa al menos un dato y un conector de consecuencia (as a result / thus / therefore).\",\"Cierra con reservas (on balance / all things considered / in conclusion).\",\"Pide algo al comité con fórmula cortés.\"],\"checks\":[{\"re\":\"(purpose of this report|this report (aims|summarises|outlines))\",\"label\":\"Abres con el propósito\"},{\"re\":\"(as a result|thus|therefore)\",\"label\":\"Hay un conector de consecuencia\"},{\"re\":\"(on balance|all things considered|with some reservations|in conclusion)\",\"label\":\"Cierras con reservas\"},{\"re\":\"(would be grateful|could (you|the committee)|please)\",\"label\":\"Hay una petición cortés al comité\"}],\"frame\":[\"To / From / Subject\",\"The purpose of this report is to…\",\"Dato de la primera charla + as a result / thus\",\"El tema nuevo (space exploration) y por qué es likely / less likely\",\"On balance / All things considered… with some reservations\",\"I would be grateful if the committee could…\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"as a result\",\"in conclusion\",\"on balance\",\"all things considered\",\"according to\",\"to a great extent\",\"however\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"$18\",\"itemIds\":[\"enb2m5asaresult\",\"enb2m5inconclusion\",\"enb2m5allthingsconsidered\",\"enb2m5spaceexploration\",\"enb2m5namely\",\"enb2m5withreservations\",\"enb2m5highlylikelythat\",\"enb2m5muchlesslikely\"],\"tip\":\"Cuenta las palabras y cuenta los «I think». El modelo tiene «I would be grateful» y nada más en primera persona. Eso no es modestia: es el género.\"},{\"id\":\"enb2m5l8e6\",\"type\":\"build\",\"prompt\":\"Construye la consecuencia de laboratorio\",\"target\":\"Thus the original claim does not hold\",\"translation\":\"Así pues, la afirmación original no se sostiene\",\"distractors\":[\"holds\",\"holding\"],\"itemIds\":[\"enb2m5thus\",\"enb1m3claim\"],\"tip\":\"«Hold» aquí es «sostenerse», intransitivo. «Holds» sería presente con sujeto singular ya dicho; «holding» no encabeza esta frase.\"},{\"id\":\"enb2m5l8e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Los vecinos tienen la obligación de comunicar cualquier desperfecto.\",\"answers\":[\"Residents are obliged to report any damage\",\"The residents are obliged to report any damage\"],\"hint\":\"Perífrasis con be + obliged to\",\"itemIds\":[\"enb2m5obligedto\"],\"tip\":\"«Obliged to» + infinitivo. No «obliged of» ni «obligated for»: la preposición la come el to del infinitivo.\"},{\"id\":\"enb2m5l8e8\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo ya visto — el cronómetro solo premia\",\"pairs\":[{\"target\":\"She must be at the surgery.\",\"source\":\"Tiene que estar en el centro de salud.\"},{\"target\":\"That can't be right.\",\"source\":\"Eso no puede ser.\"},{\"target\":\"Apparently, they're closing the café.\",\"source\":\"Por lo visto, van a cerrar el café.\"},{\"target\":\"It's unlikely to be serious.\",\"source\":\"Es poco probable que sea grave.\"},{\"target\":\"according to the advert\",\"source\":\"según el anuncio\"}],\"targetSeconds\":28,\"itemIds\":[\"enb1m6mustbe\",\"enb1m6cantbe\",\"enb1m3apparently\",\"enb1m6unlikely\",\"enb1m2accordingto\"],\"tip\":\"Cinco fichas del B1, ninguna nueva. Si tardas, no es que no las sepas: es que todavía las traduces. Esta es la hebra de fluidez, y es la que rompe la meseta.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"m
