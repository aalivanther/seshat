u003e y \u003ci\u003eaccepting, attaching or denying blame\u003c/i\u003e. Una disculpa de examen tiene \u003cb\u003ecuatro piezas\u003c/b\u003e, y si falta la tercera, es una excusa:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eNombra el daño.\u003c/b\u003e \u003ci\u003eI sincerely apologise for the tone of my email.\u003c/i\u003e No «if you were offended»: eso carga la culpa en el otro.\u003cbr/\u003e2. \u003cb\u003eAsume.\u003c/b\u003e \u003ci\u003eI take full responsibility.\u003c/i\u003e No «there was a misunderstanding» como primera línea.\u003cbr/\u003e3. \u003cb\u003eEl arraigo:\u003c/b\u003e qué cambias. \u003ci\u003eIt won't happen again\u003c/i\u003e + una medida concreta (un segundo borrador, esperar un día).\u003cbr/\u003e4. \u003cb\u003ePide que la acepten,\u003c/b\u003e sin chantaje. \u003ci\u003ePlease accept my apology.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRegistro.\u003c/b\u003e A Priya, que fue tu encargada en el café, no se le escribe «My bad». Se le escribe la versión de examen. A Amy, en el sofá, sí. Las tres alturas de la píldora de hoy son exactamente esas.\u003cbr/\u003e\u003cbr/\u003eHoy, 100-150 palabras, correo formal. En la L8, 150-200 narrando el error.\",\"table\":[[\"Pieza\",\"Fórmula\",\"Lo que no es\"],[\"Daño\",\"apologise for + el tono / el retraso\",\"if you were offended\"],[\"Culpa\",\"I take full responsibility\",\"there was a misunderstanding (primero)\"],[\"Medida\",\"It won't happen again + un cambio\",\"I'm just tired\"],[\"Cierre\",\"Please accept my apology\",\"My bad\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l4e1\",\"type\":\"match\",\"prompt\":\"Tres alturas de la misma disculpa\",\"pairs\":[{\"target\":\"My bad.\",\"source\":\"la calle, con amigos\"},{\"target\":\"I'm sorry.\",\"source\":\"el manual, neutro\"},{\"target\":\"I sincerely apologise for the tone of my email.\",\"source\":\"lo que puntúa\"},{\"target\":\"I take full responsibility.\",\"source\":\"asumir, no explicar\"},{\"target\":\"Please accept my apology.\",\"source\":\"pedir que la acepten\"}],\"itemIds\":[\"enb2m6natmybad\",\"enb2m6isincerelyapologisefor\",\"enb2m6itakefullresponsibility\",\"enb2m6pleaseaccept\"],\"tip\":\"«I'm sorry» está en el medio y por eso no basta en B2: no nombra el daño. For + el daño es lo que sube la banda.\"},{\"id\":\"enb2m6l4e2\",\"type\":\"mc\",\"prompt\":\"La primera línea que tumba la disculpa\",\"question\":\"¿Cuál NO es una disculpa, aunque lo parezca?\",\"options\":[\"I'm sorry if you were offended.\",\"I sincerely apologise for the tone of my email.\",\"I take full responsibility. It won't happen again.\"],\"answer\":0,\"whyWrong\":[null,\"Nombra el daño y se pone en primera persona. Es una disculpa.\",\"Asume y promete un cambio. Es una disculpa.\"],\"itemIds\":[\"enb2m6isincerelyapologisefor\",\"enb2m6itakefullresponsibility\"],\"tip\":\"«If you were offended» dice: el problema es tu ofensa, no mi tono. El corrector británico lo lee como una no-disculpa, y tiene razón.\"},{\"id\":\"enb2m6l4e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I apologise for be late.\",\"answers\":[\"I apologise for being late.\",\"I sincerely apologise for being late.\"],\"why\":\"Detrás de apologise for va -ing, no infinitivo. Es la misma rección que ya tenías en «She apologised for being late»: for + gerundio.\",\"translation\":\"Pido disculpas por llegar tarde.\",\"itemIds\":[\"enb2m6isincerelyapologisefor\",\"enb1m3apologisedfor\"]},{\"id\":\"enb2m6l4e4\",\"type\":\"write\",\"prompt\":\"Correo de disculpa a Priya. 100-150 palabras, las cuatro piezas, registro cortés.\",\"scenario\":\"Le has mandado a Priya Shah, tu antigua encargada del café, un correo que sonaba a bronca sobre un turno. No era la intención. Escríbele una disculpa formal. Nombra el daño, asume, di qué cambias, pide que la acepte.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"bullets\":[\"Nombra el daño (el tono del correo), sin «if you were offended».\",\"Asume la responsabilidad y di qué harás distinto.\",\"Pide que acepte la disculpa, en registro cortés.\"],\"checks\":[{\"re\":\"(apologis[e]? for|the tone)\",\"label\":\"Nombras el daño (tono / correo)\"},{\"re\":\"(responsibility|won't happen|will not happen|second (look|draft)|ought to have|should have)\",\"label\":\"Asumes y cambias algo\"},{\"re\":\"(please accept|i would be grateful|could you (accept|forgive))\",\"label\":\"Pides que la acepte, con fórmula cortés\"}],\"frame\":[\"Dear Priya,\",\"I sincerely apologise for…\",\"I take full responsibility. If I had…, I would have…\",\"It won't happen again: from now on…\",\"Please accept my apology. / I would be grateful if you could…\",\"Kind regards, Valeria\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"in hindsight\",\"if I had\",\"even so\",\"on reflection\",\"and\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":150,\"model\":\"Dear Priya,\\nI sincerely apologise for the tone of my email yesterday. It came across as rude, and that is on me, not on you. I take full responsibility. If I had waited a day, I would not have pressed send, and in hindsight I ought to have given it a second look and asked Sam to read it. It won't happen again: I will send you a draft before I write anything about the rota, and I will not put a second sentence on a first that is already fair. I would be grateful if you could accept my apology. Please let me know if you would rather speak in person this week.\\nKind regards,\\nValeria\",\"itemIds\":[\"enb2m6isincerelyapologisefor\",\"enb2m6itakefullresponsibility\",\"enb2m6cameacrossas\",\"enb2m6ifihadknown\",\"enb2m6oughttohavechecked\",\"enb2m6pleaseaccept\",\"enb2m6itwonthappenagain\"],\"tip\":\"Cuenta las «if you were»: si hay una, táchala. Y fíjate en el modelo: hay un tercer condicional y un ought to have, que es justo lo que el criterio de gramática quiere ver en una disculpa de B2.\"},{\"id\":\"enb2m6l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa la asunción\",\"text\":\"I take full ___ .\",\"answers\":[\"responsibility\"],\"translation\":\"Asumo toda la responsabilidad.\",\"hints\":[\"La palabra larga de la disculpa de examen\",\"respon-...\"],\"itemIds\":[\"enb2m6itakefullresponsibility\"],\"tip\":\"«I take responsibility» sin full también vale. Full es el empujón que el Writing oye.\"},{\"id\":\"enb2m6l4e6\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"I am sorry.\",\"real\":\"My bad.\",\"translation\":\"Lo siento / culpa mía.\",\"itemIds\":[\"enb2m6natmybad\"],\"tip\":\"Dos palabras contra tres. En el sofá, My bad. En el correo a Priya, ni se te ocurra.\"},{\"id\":\"enb2m6l4e7\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Le pido disculpas sinceramente por el tono de mi correo.\",\"answers\":[\"I sincerely apologise for the tone of my email\",\"I sincerely apologize for the tone of my email\",\"I sincerely apologise for the tone of my e-mail\"],\"hints\":[\"Apologise for + el daño\",\"I sincerely apologise for the tone of my ...\"],\"itemIds\":[\"enb2m6isincerelyapologisefor\",\"enb2m6thetone\"],\"tip\":\"«Apologise» con s en el Reino Unido. El examen es británico: elige esa y sé coherente.\"},{\"id\":\"enb2m6l4e8\",\"type\":\"audiomc\",\"prompt\":\"Amy oye el borrador. Lee la pregunta antes. Dos escuchas.\",\"audio\":\"That's the third draft.|It's still a bit 'if you were offended'.|I took that out.|You took it out of the first line and put it in the third. 'I'm sorry if it came across badly' is the same sentence in a hat.|So what do I write?|You write 'I sincerely apologise for the tone'. Then you say you take full responsibility. Then you say what you'll do differently. Then you stop.|It feels naked.|It is naked. That's the point of an apology.\",\"question\":\"¿Qué le sobra al borrador, según Amy?\",\"options\":[\"La fórmula «if you were offended / if it came across badly», que carga la culpa en Priya\",\"Que sea el tercer borrador\",\"Que Valeria se disculpe del todo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El número de borradores no es el problema: es lo que sigue diciendo el tercero.\",\"Amy quiere que se disculpe del todo. Lo contrario.\"],\"itemIds\":[\"enb2m6isincerelyapologisefor\",\"enb2m6itakefullresponsibility\",\"enb2m6cameacrossas\",\"enb2m6aseconddraft\"],\"tip\":\"«The same sentence in a hat» — Amy está cazando evitación. El módulo entero cabe en esa frase.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m6-1\",\"book\":\"I am sorry\",\"real\":\"My bad\",\"meaning\":\"Culpa mía / lo siento\",\"when\":\"Con amigos, por una cosa pequeña y reciente: se te ha olvidado el azúcar, has llegado diez minutos tarde. En un correo de trabajo, en una disculpa de examen o cuando el daño tiene nombre, no cabe: allí se escribe «I sincerely apologise for».\",\"register\":\"amigos\",\"exam\":\"I sincerely apologise for\",\"note\":\"Americana de origen y ya británica de café. Dos palabras. Si el daño es serio, dos palabras no bastan, y se nota.\",\"sound\":\"mai bad\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m6natmybad\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":
