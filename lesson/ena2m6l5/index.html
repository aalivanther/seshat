bles:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eSolo delante de VERBO.\u003c/b\u003e \u003ci\u003eI'm gonna take the train\u003c/i\u003e ✅. Pero \u003ci\u003eI'm going to Brighton\u003c/i\u003e \u003cb\u003enunca\u003c/b\u003e es «I'm gonna Brighton» ❌ — ahí to es una preposición de destino, no la pieza del futuro. Fíjate en lo bien que encaja esto con la lección 1: \u003cb\u003egonna solo aparece donde había una intención\u003c/b\u003e.\u003cbr/\u003e2. \u003cb\u003eNo se escribe jamás.\u003c/b\u003e Ni en un email, ni en el examen, ni en un mensaje a tu profesora. En el papel siempre \u003cb\u003egoing to\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eYa lo oíste tres veces en el A1 sin tener que hacer nada. Hoy le pones nombre y regla."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l5\",\"phaseId\":\"ena2m6\",\"title\":\"Clínica de sonido: GÓU-in-ta\",\"subtitle\":\"Por qué nunca oyes «going to» — y por qué a ti no te entienden\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que suena de verdad\",\"itemIds\":[\"ena2m6gonnasound\",\"ena2m6wannasound\",\"ena2m6toweak\",\"ena2m6imgoingtogo\",\"ena2m6whereareyougonnastay\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El «to» que se apaga: la clínica del módulo\",\"body\":\"$17\",\"table\":[[\"lo que dice el libro\",\"lo que oyes\",\"¿vale gonna?\"],[\"I'm going to take the train.\",\"áim GA-na téik de tréin\",\"sí: detrás hay un verbo\"],[\"I'm going to Brighton.\",\"áim GÓU-in ta BRÁI-ton\",\"no: detrás hay un sitio\"],[\"What are you going to do?\",\"uót a ya GA-na dúu\",\"sí\"],[\"I want to go.\",\"ái UÓ-na góu\",\"wanna, la misma historia\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m6l5e1\",\"type\":\"mc\",\"prompt\":\"El sonido del «to»\",\"question\":\"En «I'm going to take the train», el «to» suena…\",\"options\":[\"«ta», flojo y pegado a going\",\"«tu», bien marcado\",\"no suena nada\"],\"answer\":0,\"whyWrong\":[null,\"«Tu» es como
