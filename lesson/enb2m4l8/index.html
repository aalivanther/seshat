"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del artículo\",\"pairs\":[{\"target\":\"It can be argued that the group is right.\",\"source\":\"opinión sin yo\"},{\"target\":\"The evidence suggests a leak, not vandalism.\",\"source\":\"las pruebas apuntan (incontable)\"},{\"target\":\"On balance, the paper was more careful.\",\"source\":\"cierre que sopesa\"},{\"target\":\"As mentioned above, nobody named the source.\",\"source\":\"remite hacia atrás\"}],\"itemIds\":[\"enb2m4itcanbeargued\",\"enb2m4theevidencesuggests\",\"enb2m4onbalance\",\"enb2m4asmentioned\"]},{\"id\":\"enb2m4l8e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The evidences suggest a leak, not vandalism.\",\"answers\":[\"The evidence suggests a leak, not vandalism.\"],\"why\":\"Evidence, incontable, con suggests. Segunda vez en el módulo, a propósito: el calco «las evidencias» se resiste.\",\"itemIds\":[\"enb2m4theevidencesuggests\"]},{\"id\":\"enb2m4l8e3\",\"type\":\"gapbank\",\"prompt\":\"Completa el cierre de un artículo\",\"text\":\"It can be ___ that the group is right about the water. The evidence ___ a leak, not a sale. As mentioned ___, nobody has confirmed a buyer. ___ balance, the paper was more careful. This article ___ that the passive is doing a job.\",\"answers\":[\"argued\",\"suggests\",\"above\",\"On\",\"claims\"],\"bank\":[\"argued\",\"suggests\",\"above\",\"On\",\"claims\",\"say\",\"In\"],\"itemIds\":[\"enb2m4itcanbeargued\",\"enb2m4theevidencesuggests\",\"enb2m4asmentioned\",\"enb2m4onbalance\",\"enb2m4thisarticleargues\"]},{\"id\":\"enb2m4l8e4\",\"type\":\"write\",\"prompt\":\"Artículo, 150-200. Informa. Marca lo no confirmado. Sin Dear, sin Yours, sin people say.\",\"scenario\":\"La revista del centro te pide 150-200 palabras sobre cómo viajó el rumor de Palmer Road: el periódico y el grupo. Trata LOS TRES puntos. Género artículo, registro directo de prensa (no carta).\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review\",\"text\":\"How did a leak become a sale? 150–200 words. Include: (1) what the paper said, with at least one reporting passive; (2) what the group said, and how the passive was doing a different job; (3) what, in your view, has not been confirmed. No Dear / Yours.\"},\"bullets\":[\"Qué dijo el periódico (al menos una pasiva de reporte).\",\"Qué dijo el grupo, y qué trabajo hacía su pasiva.\",\"Qué no está confirmado, en tu juicio (sin people say).\"],\"checks\":[{\"re\":\"(it is (thought|reported|believed|said)|according to|the paper|gazette|council says)\",\"label\":\"Citas el periódico con reporte\"},{\"re\":\"(group|chat|widely believed|without naming|unstated)\",\"label\":\"Citas el grupo y su pasiva\"},{\"re\":\"(not (been )?confirm|nobody has|no one has|should be noted|on balance|cannot be proved)\",\"label\":\"Marcas lo no confirmado\"}],\"frame\":[\"Apertura: According to the Gazette / It is reported that…\",\"El grupo: It is widely believed… without naming…\",\"Cierre: It should be noted / On balance / The evidence suggests…\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"according to\",\"it should be noted\",\"on balance\",\"as mentioned\",\"although\",\"it can be argued\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"According to the Gazette, a leak on Palmer Road is being investigated. It is thought that it started on Monday. It should be noted that nobody has confirmed a cause, and the council says the pipes are to blame. Residents had been warned twice, the paper added; several neighbours said they had not seen the letter.\\nThe group used the same grammar to a different end. It is widely believed, the chat claimed, that the shop is being closed on purpose. The leak was allowed to run. An unstated agent did the work that a name would have had to sign. Although a van at six was offered as evidence, nothing in it was named.\\nOn balance, the leak is real and the sale is not. As mentioned above, Patel has denied the claims. The evidence suggests water, not a conspiracy. Who says so? The paper names the council. The group names itself too late.\",\"itemIds\":[\"enb2m4accordingtothereport\",\"enb2m4itisthoughtthat\",\"enb2m4itshouldbenoted\",\"enb2m4itiswidelybelieved\",\"enb2m4unstatedagent\",\"enb2m4onbalance\",\"enb2m4asmentioned\",\"enb2m4theevidencesuggests\",\"enb2m4whosaysso\"]},{\"id\":\"enb2m4l8e5\",\"type\":\"mc\",\"prompt\":\"Fuga de género\",\"question\":\"En este artículo, ¿cuál tumba el género?\",\"options\":[\"Dear Sir or Madam, I am writing to inform you…\",\"According to the Gazette, a leak is being investigated.\",\"On balance, the leak is real and the sale is not.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es artículo. Va.\",\"Eso es el cierre de artículo. Va.\"],\"itemIds\":[\"enb2m4anarticlepiece\"]},{\"id\":\"enb2m4l8e6\",\"type\":\"paraphrase\",\"prompt\":\"Sin «I think» — quítate del medio\",\"source\":\"I think the group is right.\",\"forbid\":[\"I think\",\"I believe\",\"in my opinion\"],\"answers\":[\"It can be argued that the group is right\",\"It can be argued that the group is right.\",\"The evidence suggests the group is right\"],\"itemIds\":[\"enb2m4itcanbeargued\",\"enb2m4theevidencesuggests\"]},{\"id\":\"enb2m4l8e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"En balance, el periódico fue más cuidadoso.\",\"answers\":[\"On balance, the paper was more careful.\",\"On balance the paper was more careful.\"],\"itemIds\":[\"enb2m4onbalance\",\"enb2m4thepaperhedged\"]},{\"id\":\"enb2m4l8e8\",\"type\":\"cloze\",\"prompt\":\"Remite hacia atrás\",\"text\":\"As mentioned ___, nobody named the source.\",\"answers\":[\"above\"],\"itemIds\":[\"enb2m4asmentioned\"]},{\"id\":\"enb2m4l8e9\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — opinión sin yo\",\"text\":\"It can be argued that the group is right, although the evidence suggests a leak, not a sale.\",\"phonetic\":\"it kan bi ÁA-giud dat de gruup is̬ rait, ool-DÓU di É-vi-dens sa-DCHÉSTS a liik, not a seil\",\"translation\":\"Puede argumentarse que el grupo tiene razón, aunque las pruebas apuntan a una fuga, no a una venta.\",\"itemIds\":[\"enb2m4itcanbeargued\",\"enb2m4theevidencesuggests\"]},{\"id\":\"enb2m4l8e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Este artículo sostiene que la pasiva está haciendo un trabajo.\",\"answers\":[\"This article argues that the passive is doing a job.\",\"This article argues that the passive is doing a job\"],\"itemIds\":[\"enb2m4thisarticleargues\"]},{\"id\":\"enb2m4l8e11\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"On balance, the paper was more careful.\",\"translation\":\"En balance, el periódico fue más cuidadoso.\",\"itemIds\":[\"enb2m4onbalance\"]},{\"id\":\"enb2m4l8e12\",\"type\":\"audiomc\",\"prompt\":\"LISTENING LARGO · el editor, al teléfono. Pregunta 1 de 2. Cuaderno. Dos escuchas.\",\"notepad\":true,\"audio\":\"If you send me «people say the shop is closing», I bin it. If you send me «it is widely believed», I ask by who. If you send me «according to the council, the leak is being investigated, and it should be noted that the sale has been denied», I run it. That's the height. The group can shout. We have a byline.\",\"question\":\"¿Qué texto acepta el editor?\",\"options\":[\"El que cita al ayuntamiento, usa la pasiva de reporte y marca el desmentido\",\"El que empieza por people say\",\"El que grita como el grupo, porque vende más\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso lo tira: I bin it.\",\"El grupo puede gritar. El periódico tiene byline. No es lo mismo.\"],\"itemIds\":[\"enb2m4accordingtothereport\",\"enb2m4itshouldbenoted\",\"enb2m4abylines\",\"enb2m4theeditor\"]},{\"id\":\"enb2m4l8e13\",\"type\":\"audiomc\",\"prompt\":\"Misma llamada · pregunta 2 de 2.\",\
