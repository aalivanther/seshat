ich sein\",\"subtitle\":\"sollen y wollen de distanciamiento: un modal en lugar de una oración\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Distancia sin negar\",\"itemIds\":[\"b2m1sollsein\",\"b2m1willgewusst\",\"b2m1bestreiten\",\"b2m1dementieren\",\"b2m1angeblich\",\"b2m1glaubwuerdig\",\"b2m1falschmeldung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos modales que no mandan ni quieren\",\"body\":\"$17\",\"table\":[[\"alemán\",\"quién afirma\",\"español\"],[\"Er soll reich sein\",\"otros, no tú\",\"Dicen que es rico\"],[\"Sie will nichts gewusst haben\",\"ella, y tú te apartas\",\"Sostiene que no sabía nada\"],[\"Angeblich ist sie pleite\",\"rumor, sin fuente\",\"Supuestamente está en quiebra\"],[\"Er muss reich sein\",\"tú, por indicios (aún no)\",\"Debe de ser rico\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l4e1\",\"type\":\"mc\",\"prompt\":\"¿De quién es la afirmación?\",\"question\":\"„Der Chef soll gekündigt haben.“\",\"options\":[\"El jefe debe despedir a alguien (orden)\",\"Dicen que el jefe ha dimitido / lo han echado: tú no lo firmas\",\"El jefe quiere despedir\"],\"answer\":1,\"whyWrong\":[\"Eso sería soll + infinitivo con valor de deber, y aquí el sentido es rumor\",null,\"«querer» de la fuente sería will, no soll\"],\"itemIds\":[\"b2m1sollsein\"],\"tip\":\"soll + infinitivo en prensa = rumor con fuente ajena. El deber se lee por el contexto (instrucciones, no titulares).\"},{\"id\":\"b2m1l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Fuente ajena o la propia fuente se distancia?\",\"categories\":[\"soll (lo dicen otros)\",\"will (ella/él sostiene)\"],\"items\":[{\"text\":\"Er soll reich sein.\",\"bucket\":0},{\"text\":\"Sie will nichts gewusst haben.\",\"bucket\":1},{\"text\":\"Die Firma soll pleite sein.\",\"bucket\":0},{\"text\":\"Der Zeuge will das nicht gesagt haben.\",\"bucket\":1},{\"text\":\"Angeblich war er krank.\",\"bucket\":0},{\"text\":\"Er will nur geholfen haben.\",\"bucket\":1}],\"itemIds\"
