nb2m4itisunderstoodthat\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El español tiene «se»; el inglés, esta máquina\",\"body\":\"El B1 te dio \u003ci\u003eIt is said that the pool will close\u003c/i\u003e y \u003ci\u003eThey say…\u003c/i\u003e. El B2 no es otro molde: es \u003cb\u003eusarlo a propósito\u003c/b\u003e, para no mojarse, para informar, o para acusar sin nombrar. El descriptor de nivel pide distinguir el texto que informa del que convence. La pasiva impersonal es esa distinción, hecha gramática.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eIt is thought / said / believed / reported / understood that…\u003c/b\u003e El «it» no señala nada. Lo que cambia es el verbo: thought (cautela), reported (prensa), widely believed (rumor con traje), should be noted (el autor se asoma a evaluar).\u003cbr/\u003e\u003cbr/\u003eHoy el barrio: se dice que la tienda de Mr Patel va a cerrar, que recortan el autobús de noche, que hay una fuga en Palmer Road. El periódico usa la pasiva para no mojarse. El grupo de vecinos, para acusar sin firmar. Valeria lee las dos y pregunta: \u003cb\u003eWho says so?\u003c/b\u003e\",\"table\":[[\"Calle\",\"Manual\",\"Examen / prensa\"],[\"People say the shop will close.\",\"They say the shop will close.\",\"It is widely believed that the shop will close.\"],[\"Apparently it's shutting.\",\"It is said that it will close.\",\"It is reported that the shop will close.\"],[\"Word is they're cutting the bus.\",\"They say the bus will be cut.\",\"It is reported that the night bus will be cut.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l1e1\",\"type\":\"match\",\"prompt\":\"Empareja el molde impersonal\",\"pairs\":[{\"target\":\"It is widely believed that the shop will close.\",\"source\":\"se cree ampliamente que la tienda cierra\"},{\"target\":\"It is reported that the night bus will be cut.\",\"source\":\"se informa de que recortan el de noche\"},{\"target\":\"It should be noted that nobody has confirmed it.\",\"source\":\"cabe señalar que no lo ha confirmado nadie\"},{\"target\":\"a rumour\",\"source\":\"un rumor\"}],\"itemIds\":[\"enb2m4itiswidelybelieved\",\"enb2m4itisreportedthat\",\"enb2m4itshouldbenoted\",\"enb1m3rumour\"]},{\"id\":\"enb2m4l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — las pasivas que ya son tuyas\",\"pairs\":[{\"target\":\"It is said that the pool will close.\",\"source\":\"se dice que la piscina cierra\"},{\"target\":\"It is believed that the fire started in the kitchen.\",\"source\":\"se cree que el fuego empezó en la cocina\"},{\"target\":\"He is thought to be abroad.\",\"source\":\"se cree que está en el extranjero\"},{\"target\":\"They say the pool is closing.\",\"source\":\"dicen que la piscina cierra\"},{\"target\":\"That's rubbish.\",\"source\":\"eso es basura / no es verdad\"}],\"targetSeconds\":22,\"itemIds\":[\"enb1m4itissaidthat\",\"enb1m4itisbelieved\",\"enb1m4heisthought\",\"enb1m4theysay\",\"enb1m4natrubbish\"]},{\"id\":\"enb2m4l1e3\",\"type\":\"transform\",\"prompt\":\"Del they say a la impersonal de examen\",\"source\":\"People say the shop will close.\",\"instruction\":\"Dilo con It is widely believed that…\",\"answers\":[\"It is widely believed that the shop will close\",\"It is widely believed that the shop will close.\"],\"itemIds\":[\"enb2m4itiswidelybelieved\"],\"tip\":\"Aquí no vale people say / they say: comunican y bajan el registro. It is widely believed that es la misma idea con el traje que puntúa.\"},{\"id\":\"enb2m4l1e4\",\"type\":\"paraphrase\",\"prompt\":\"Prohíbe they say / people say\",\"source\":\"They say the night bus will be cut.\",\"forbid\":[\"they say\",\"people say\",\"everybody says\"],\"answers\":[\"It is reported that the night bus will be cut\",\"It is reported that the night bus will be cut.\",\"It is thought that the night bus will be cut\",\"It is widely believed that the night bus will be cut\"],\"itemIds\":[\"enb2m4itisreportedthat\",\"enb2m4itisthoughtthat\",\"enb2m4itiswidelybelieved\"]},{\"id\":\"enb2m
