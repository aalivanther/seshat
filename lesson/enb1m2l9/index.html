c/b\u003e — «merece la pena presentarse». Detrás de \u003ci\u003eworth\u003c/i\u003e va \u003cb\u003e-ing\u003c/b\u003e, nunca infinitivo: «It's worth to apply» ✗.\u003cbr/\u003e\u003cbr/\u003eY ahora, el monólogo. En el \u003cb\u003eSpeaking Part 4\u003c/b\u003e el examinador te ofrece \u003cb\u003etres temas y elige uno él\u003c/b\u003e, tienes \u003cb\u003e30 segundos\u003c/b\u003e con papel y lápiz y hablas \u003cb\u003eminuto y medio\u003c/b\u003e. Los descriptores oficiales dicen dos veces la misma cosa: \u003ci\u003e«a linear sequence of points»\u003c/i\u003e. \u003cb\u003eEl B1 oral no premia la frase complicada: premia encadenar.\u003c/b\u003e Anuncia, cuenta, contrasta, cierra.18:T6a9,"])</script><script>self.__next_f.push([1,"Have you seen this? It's the job I was telling you about, the one at the language centre in Camden.|Go on, read it out.|'We are looking for somebody who can work with adults, has good spoken English and Spanish, and is available three afternoons a week.' Permanent contract, twenty-two hours, and it says there are prospects.|Every advert says there are prospects, Valeria.|This one lists them. Assistant, then coordinator after a year, then course tutor. Nobody at the café has ever said the word coordinator to me.|All right, that's fair. What's the money?|Thirteen pounds an hour, which is about the same as I earn now. Slightly less, actually, once you take out the overtime I do on Saturdays.|So you'd be earning less.|At first. But the hours are the hours. No split shifts, no six in the morning, and I'd finish at seven every day, which means I could do the evening class I keep talking about.|Now that's the bit that matters. I took a pay cut when I moved to the ward and I have never regretted it, not once. It wasn't about the money. It was that I stopped dreading Mondays.|What did your mother say when you told her?|What every mother says. That a bird in the hand is worth two in the bush.|And?|And she was wrong. Look, apply. The worst thin oveon\",\"enb1m2suitme\",\"enb1m2worthapplying\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cuatro fórmulas para decidir, y una regla de cada una\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — todo esto ya es tuyo\",\"pairs\":[{\"target\":\"work\",\"source\":\"trabajar\"},{\"target\":\"busy\",\"source\":\"ocupado, ocupada\"},{\"target\":\"email\",\"source\":\"correo electrónico\"},{\"target\":\"hospital\",\"source\":\"hospital\"},{\"target\":\"school\",\"source\":\"escuela\"}],\"targetSeconds\":22,\"itemIds\":[\"enwork\",\"enbusy\",\"enemail\",\"enhospital\",\"enschool\"],\"tip\":\"Cinco palabras del A1 sacadas a toda velocidad. El B1 no se gana añadiendo palabras: se gana sacando más rápido las que ya tienes.\"},{\"id\":\"enb1m2l9e2\",\"type\":\"match\",\"prompt\":\"Espiral del módulo 1 — el presente perfecto sigue vivo\",\"pairs\":[{\"target\":\"I've lived here for two years.\",\"source\":\"Llevo dos años viviendo aquí.\"},{\"target\":\"I've been working at the café since March.\",\"source\":\"Llevo trabajando en el café desde marzo.\"},{\"target\":\"I've already paid the deposit.\",\"source\":\"Ya he pagado la fianza.\"},{\"target\":\"I'm still looking for a flat.\",\"source\":\"Sigo buscando piso.\"}],\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1beenworking\",\"enb1m1already\",\"enb1m1still\"],\"tip\":\"Cuatro frases del módulo anterior, sin una palabra nueva. Si te han costado, el repaso exprés sabe qué hacer contigo esta semana.\"},{\"id\":\"enb1m2l9e3\",\"type\":\"mc\",\"prompt\":\"Lo que va detrás de «I'd rather»\",\"question\":\"«Prefiero trabajar por las mañanas» →\",\"options\":[\"I'd rather work mornings.\",\"I'd rather to work mornings.\",\"I'd rather working mornings.\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de «I'd rather» va infinitivo SIN «to». Es de las poquísimas estructuras inglesas donde el «to» está prohibido.\",\"El -ing tampoco: eso es detrás de «worth», «enjoy» o una preposición.\"],\"itemIds\":[\"enb1m2wouldrather\"],\"tip\":\"Familia del infinitivo pelado: would rather, had better, y los modales (can, must, should). Las tres se dicen mucho y las tres se estropean con un «to».\"},{\"id\":\"enb1m2l9e4\",\"type\":\"bucket\",\"prompt\":\"Espiral del m1 — ¿qué tiempo verbal pide cada marcador?\",\"categories\":[\"PASADO SIMPLE — periodo cerrado\",\"PRESENT PERFECT — periodo abierto\"],\"items\":[{\"text\":\"last month\",\"bucket\":0},{\"text\":\"since March\",\"bucket\":1},{\"text\":\"in 2019\",\"bucket\":0},{\"text\":\"so far\",\"bucket\":1},{\"text\":\"two years ago\",\"bucket\":0},{\"text\":\"already\",\"bucket\":1}],\"itemIds\":[\"enb1m2applyfor\",\"enb1m1sincemarch\",\"enb1m1sofar\",\"enb1m1already\",\"enb1m1movedin\"],\"tip\":\"El marcador manda sobre el verbo, no al revés. «I applied last month» y «I've applied so far» son la misma acción contada desde dos sitios distintos.\"},{\"id\":\"enb1m2l9e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It's worth to apply, and the shifts suit to me.\",\"answers\":[\"It's worth applying, and the shifts suit me.\"],\"why\":\"Dos calcos del mismo tipo: detrás de «worth» va -ing, no infinitivo; y «suit» no lleva preposición, aunque en español digamos «me viene bien A mí».\",\"translation\":\"Merece la pena presentarse, y los turnos me vienen bien.\",\"itemIds\":[\"enb1m2worthapplying\",\"enb1m2suitme\"]},{\"id\":\"enb1m2l9e6\",\"type\":\"transform\",\"prompt\":\"Dilo con la fórmula de la preferencia\",\"source\":\"I prefer mornings to evenings.\",\"instruction\":\"Empieza por «I'd rather…» y usa «than»\",\"answers\":[\"I'd rather work mornings than evenings\",\"I would rather work mornings than evenings\",\"I'd rather work mornings than evenings.\"],\"translation\":\"Prefiero trabajar por las mañanas que por las tardes.\",\"hints\":[\"Infinitivo sin «to» detrás de «rather»\",\"I'd rather work mornings ... evenings\"],\"itemIds\":[\"enb1m2wouldrather\"],\"tip\":\"«prefer A to B» pero «I'd rather A than B». Dos estructuras para lo mismo y cada una con su palabra: mezclarlas es el error más común del nivel.\"},{\"id\":\"enb1m2l9e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Es hora de pasar página: merece la pena presentarse.\",\"answers\":[\"It's time to move on: it's worth applying\",\"It's time to move on. It's worth applying\",\"It is time to move on: it is worth applying\"],\"hint\":\"Dos fórmulas de la lección, una detrás de otra\",\"itemIds\":[\"enb1m2moveon\",\"enb1m2worthapplying\"],\"tip\":\"«move on» sin complemento significa pasar página. Con complemento cambia: «move on to the next question» es «pasar a la siguiente».\"},{\"id\":\"enb1m2l9e8\",\"type\":\"gapbank\",\"prompt\":\"Espiral del módulo — relativos y preposiciones al final\",\"text\":\"The job I applied ___ is the sort of job I've been looking ___ since 2023. The person I'll work ___ is a woman ___ used to be a teacher.\",\"answers\":[\"for\",\"for\",\"with\",\"who\"],\"bank\":[\"for\",\"with\",\"who\",\"to\",\"at\",\"which\"],\"translation\":\"El trabajo al que me presenté es el tipo de trabajo que llevo buscando desde 2023. La persona con la que voy a trabajar es una mujer que era profesora.\",\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2sortofjob\",\"enb1m2personiworkwith\",\"enb1m2personwho\"],\"tip\":\"Tres preposiciones huérfanas al final y un relativo que sí se queda porque es el sujeto. Todo el módulo en dos frases.\"},{\"id\":\"enb1m2l9e9\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: tu tema, minuto y medio. Treinta segundos de notas (cinco palabras sueltas, no frases), luego habla. Y repite: la segunda pasada sale mejor.\",\"topic\":\"A job you would like to do\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about the job I'd really like to do. I'll say three things.»\"},{\"title\":\"2. Describe it\",\"hint\":\"Descríbelo con relativas: «It's a job which…», «I'd work with people who…», «somewhere where…»\"},{\"title\":\"3. Why, and what it costs\",\"hint\":\"Contrasta con un conector: «While the pay is lower…», «Although I'd have to retrain…», «At least…»\"},{\"title\":\"4. Close\",\"hint\":\"Cierra con la decisión: «So, all in all, I'd rather… than…, and I think it's worth…»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Usé al menos TRES relativas (a job which…, people who…, the thing I like most…)\",\"Al menos una de ellas iba sin relativo (the job I applied for)\",\"Usé dos conectores distintos de este módulo (while, since, at least, apart from, otherwise)\",\"Dije «I'd rather… than…» o «it's worth …-ing» una vez\",\"Cerré con una frase de cierre y no me apagué a media idea\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «The job I'd really like to do is something in a library or a school. It's a job which is quiet, and where you deal with people all day but one at a time. I'd rather work with people who need help than serve two hundred coffees.»\",\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2personwho\",\"enb1m2placewhereiwork\",\"enb1m2wouldrather\",\"enb1m2while\"],\"tip\":\"Los treinta segundos no son para escribir el discurso: son para decidir el ORDEN. Si sabes por dónde vas, la fluidez viene sola — y el examinador puntúa justamente eso, «Task Fulfilment and Coherence».\"},{\"id\":\"enb1m2l9e10\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre\",\"text\":\"It's time to move on.\",\"translation\":\"Es hora de pasar página.\",\"strictContractions\":true,\"hints\":[\"Empieza con la contracción de «It is»\",\"It's time to ...\"],\"itemIds\":[\"enb1m2moveon\"],\"tip\":\"«It's» suena «its», una sola sílaba. Si escribes «It is», el dictado te lo da por malo: aquí el objetivo es la contracción.\"},{\"id\":\"enb1m2l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"El trabajo al que me presenté paga menos, pero al menos tiene perspectivas.\",\"answers\":[\"The job I applied for pays less, but at least it has prospects\",\"The job I applied for pays less, but at least there are prospects\",\"The job that I applied for pays less, but at least it has prospects\"],\"hints\":[\"El relativo se puede quitar\",\"The job I applied ... pays less, but at least ...\"],\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2atleast\",\"enb1m2prospects\"],\"tip\":\"Relativo omitido, preposición al final y un conector de los nuevos, todo en doce palabras. Módulo cerrado.\"},{\"id\":\"enb1m2l9e12\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 4 en formato real: una discusión. Aquí, una sola escucha — el examen te dará dos. Toma notas: hay varias opiniones y no todas son del mismo hablante.\",\"notepad\":true,\"audio\":\"They're advertising three jobs at the depot. Permanent, all of them.|Permanent, and forty hours of standing up. My cousin lasted eight months.|Well, at least he knew what he was getting. Half the places round here won't even tell you your hours until the Sunday before.|That's true. Although a permanent contract you can't live on isn't much of a prize either, is it?|No. But you can get a mortgage with it. You can't get one with a zero-hours contract, however many hours you actually work.|Now that I'll give you. That's the bit that changes things.\",\"question\":\"¿En qué acaban coincidiendo los dos?\",\"options\":[\"En que un contrato fijo abre puertas que uno de cero horas no abre\",\"En que el trabajo del almacén está bien pagado\",\"En que los contratos de cero horas son ilegales\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Del sueldo dicen justo lo contrario: «a permanent contract you can't live on».\",\"De legalidad no habla nadie: hablan de hipotecas.\"],\"itemIds\":[\"enb1m2permanentcontract\",\"enb1m2zerohours\"],\"tip\":\"«Now that I'll give you» es «en eso te doy la razón». El acuerdo casi nunca se dice con «I agree»: se dice cediendo. Reconocer esas fórmulas es medio Part 4.\"},{\"id\":\"enb1m2l9e13\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — tres minutos, dos voces, cinco preguntas. Léelas TODAS antes del play y usa el cuaderno: van en el orden de la conversación. Dos escuchas.\",\"audio\":\"$18\",\"question\":\"¿Cuántas horas semanales tiene el puesto?\",\"options\":[\"Veintidós\",\"Veinte\",\"Treinta y dos\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Veinte no se dice en ningún momento. La cifra que sí sale suelta es la de las libras por hora.\",\"Treinta y dos es lo que se oye si se te cruzan «twenty-two» y «thirty-two»: dos palabras que en inglés hablado se distinguen por la primera sílaba, no por la última.\"],\"itemIds\":[\"enb1m2permanentcontract\",\"enb1m2advert\",\"enb1m2vacancy\"],\"tip\":\"Las preguntas van en el orden del audio y esta cae en el primer minuto. Apúntala y sigue: en tres minutos vas a oír 22, 13, 7 y 2, y solo una contesta cada pregunta.\"},{\"id\":\"enb1m2l9e14\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 2: qué hace Amy con lo que lee Valeria.\",\"audio\":\"$19\",\"question\":\"«Every advert says there are prospects.» ¿Qué está haciendo Amy con esa frase?\",\"options\":[\"Poner en duda lo que promete el anuncio\",\"Confirmar que el puesto es bueno\",\"Explicar qué significa la palabra «prospects»\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Lo confirma después, y a regañadientes: «All right, that's fair». Primero desconfía.\",\"No explica nada: da por hecho que las dos saben lo que significa y por eso puede usarlo con ironía.\"],\"itemIds\":[\"enb1m2prospects\",\"enb1m2advert\"],\"tip\":\"Hecho contra opinión, que es lo que mide el Listening Part 4. «There are prospects» es lo que dice el anuncio; «every advert says that» es lo que opina Amy del anuncio. La misma palabra, dos estatus distintos.\"},{\"id\":\"enb1m2l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3: causa y efecto.\",\"audio\":\"$1a\",\"question\":\"¿Por qué ganaría menos al principio?\",\"options\":[\"Porque perdería las horas extra de los sábados\",\"Porque el sueldo por hora es mucho más bajo\",\"Porque el contrato sería temporal\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Dice que por hora cobraría «about the same»: la diferencia no está ahí.\",\"Es justo al revés: el contrato es permanente, y eso es parte de lo que le atrae.\"],\"itemIds\":[\"enb1m2overtime\",\"enb1m2hourlywage\",\"enb1m2salary\"],\"tip\":\"«Slightly less, actually, once you take out the overtime» — la respuesta está en la subordinada, no en la principal. En el examen la información que decide suele ir detrás de un «once», un «unless» o un «although».\"},{\"id\":\"enb1m2l9e16\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 4: qué convence a Amy.\",\"audio\":\"$1b\",\"question\":\"¿Qué es lo que a Amy le parece que sí importa?\",\"options\":[\"Que el horario le deja hacer la clase nocturna\",\"Que el sueldo por hora sea mejor\",\"Que el centro esté más cerca de casa\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"El sueldo es lo que Amy aparta con su propia historia: ella se bajó el sueldo y no se arrepiente.\",\"De la distancia no se habla. El centro está en Camden y nadie dice cuánto se tarda.\"],\"itemIds\":[\"enb1m2shiftpattern\",\"enb1m2nightshift\",\"enb1m2suitme\"],\"tip\":\"«Now that's the bit that matters» es un marcador de énfasis, y en el examen valen oro: quien lo dice te está señalando la respuesta con el dedo.\"},{\"id\":\"enb1m2l9e17\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 5, y esta no se contesta con una palabra oída.\",\"audio\":\"$1c\",\"question\":\"¿Por qué dice Amy que la referencia se la pida a Sam?\",\"options\":[\"Porque la conoce desde hace dos años y le enseñó buena parte de lo que sabe\",\"Porque es el único que sabe escribir una carta formal\",\"Porque Sam ya se ha enterado de que se va\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"De escribir cartas no se dice nada. Lo que se dice es qué sabe él de ella.\",\"Nadie dice que Sam lo sepa. Amy predice que se enfadará una semana, que es lo contrario de que ya lo sepa.\"],\"itemIds\":[\"enb1m2reference\",\"enb1m2cv\",\"enb1m2personwho\"],\"tip\":\"Una referencia no la firma quien te aprecia: la firma quien puede CONTAR lo que haces. Esa es la razón que da Amy, y es la que hay que oír debajo de «ask Sam».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m2-4\",\"book\":\"I'll do it.\",\"real\":\"I'll crack on with it.\",\"meaning\":\"Me pongo con ello ahora mismo\",\"when\":\"En el trabajo, con compañeros o con un jefe con el que tienes confianza: significa que empiezas ya y sin dar más vueltas. En un correo a alguien de fuera o en el Writing, no: allí queda demasiado de andar por casa.\",\"register\":\"neutral\",\"exam\":\"I'll get on with it straight away.\",\"note\":\"«Crack on» es «ponerse a ello sin más» y es muy británico. También se usa suelto, como ánimo: «Right, crack on» = «venga, al lío». Ojo: «crack on with» algo, nunca «crack on something».\",\"sound\":\"ail krak on uid it\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m2natcrackon\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Spoken (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Mira el Part 4: los tres temas que ofrece el interlocutor —elige él, no tú—, los treinta segundos de notas y el minuto y medio. Cronométrate en casa con el reloj del móvil y grábate: la segunda pasada siempre sale mejor.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\
