nks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T5b0,"])</script><script>self.__next_f.push([1,"Mira estas dos versiones del mismo día. La gramática es idéntica; lo único que cambia son cinco palabras.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003e«I woke up late. I missed the bus. I walked to work. I arrived at ten.»\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e«First of all, I woke up late. Then I missed the bus. After that, I walked to work. In the end, I arrived at ten.»\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eLa primera es una lista; la segunda es una historia. Y esa diferencia \u003cb\u003epuntúa\u003c/b\u003e: el criterio de \u003ci\u003eOrganisation\u003c/i\u003e del examen mira exactamente esto — si el texto avanza o si son frases sueltas pegadas.\u003cbr/\u003e\u003cbr/\u003eLas señales que necesitas son cinco, y no hacen falta más:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[First of all,|Lo primero de todo,]]\u003c/b\u003e — abre. Ojo: \u003ci\u003efirst\u003c/i\u003e a secas también vale, pero \u003ci\u003efirst of all\u003c/i\u003e suena a relato y no a lista de la compra.\u003cbr/\u003e· \u003cb\u003eThen\u003c/b\u003e — el eslabón normal, el que más se usa. Ya lo traes del A1.\u003cbr/\u003e· \u003cb\u003e[[After that,|Después de eso,]]\u003c/b\u003e — igual que then, pero con más aire. Alterna los dos para no repetir.\u003cbr/\u003e· \u003cb\u003e[[Suddenly,|De repente,]]\u003c/b\u003e — el giro. Es la palabra que anuncia que algo se tuerce.\u003cbr/\u003e· \u003cb\u003e[[In the end,|Al final,]]\u003c/b\u003e / \u003cb\u003e[[finally|por fin]]\u003c/b\u003e — cierra.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde van y qué coma llevan:\u003c/b\u003e casi siempre al principio de la frase y con coma detrás. \u003ci\u003eThen\u003c/i\u003e es el único que se usa mucho sin coma. Y ninguno cambia nada del verbo — no son como el \u003ci\u003ebecause\u003c/i\u003e de la lección siguiente: solo se ponen delante y ya."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l6\",\"phaseId\":\"ena2m2\",\"title\":\"First of all, then, after that\",\"subtitle\":\"Una historia no es una lista de frases: lleva señales\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las señales del relato\",\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2finally\",\"ena2m2intheend\",\"ena2m2suddenly\",\"enthen\",\"enfirst\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Con las mismas frases, dos textos distintos\",\"body\":\"$17\",\"table\":[[\"señal\",\"para qué\",\"ejemplo\"],[\"First of all,\",\"abrir\",\"First of all, I woke up late.\"],[\"Then\",\"seguir\",\"Then I missed the bus.\"],[\"After that,\",\"seguir (variando)\",\"After that, I walked to work.\"],[\"Suddenly,\",\"el giro\",\"Suddenly, my phone rang.\"],[\"In the end, / finally\",\"cerrar\",\"In the end, I arrived at ten.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"finally y «in the end» no son lo mismo, y hay un calco de por medio\",\"body\":\"Los dos se traducen por «al final» y el español no los distingue, así que hay que separarlos a mano:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003efinally\u003c/b\u003e = \u003cb\u003epor fin\u003c/b\u003e, después de mucho esperar. Lleva alivio dentro. \u003ci\u003eThe bus finally came.\u003c/i\u003e (por fin llegó)\u003cbr/\u003e· \u003cb\u003ein the end\u003c/b\u003e = \u003cb\u003eal final resultó que…\u003c/b\u003e Es el resultado de la historia, sin alivio ninguno. \u003ci\u003eIn the end, I walked.\u003c/i\u003e (al final acabé andando)\u003cbr/\u003e\u003cbr/\u003eY el calco que hay que matar hoy: «al final» \u003cb\u003eNO\u003c/b\u003e es \u003ci\u003eat the final\u003c/i\u003e. \u003ci\u003eThe final\u003c/i\u003e en inglés es la final de un campeonato, un partido. Si escribes \u003ci\u003eat the final I went home\u003c/i\u003e, has dicho «en la final me fui a casa».\u003cbr/\u003e\u003cbr/\u003eDos más que el español confunde y aquí no cuestan nada: \u003cb\u003eat the end\u003c/b\u003e (con \u003ci\u003eat\u003c/i\u003e) es el final \u003cb\u003ede algo concreto\u003c/b\u003e — \u003ci\u003eat the end of the film\u003c/i\u003e, \u003ci\u003eat the end of the street\u003c/i\u003e. Y \u003cb\u003eat last\u003c/b\u003e es sinónimo de \u003ci\u003efinally\u003c/i\u003e, con el mismo alivio dentro.\",\"table\":[[\"quieres decir\",\"en inglés\",\"no digas\"],[\"por fin (después de esperar)\",\"finally / at last\",\"at the final\"],[\"al final resultó que…\",\"in the end\",\"at the end\"],[\"al final de la película\",\"at the end of the film\",\"in the end of the film\"],[\"la final del campeonato\",\"the final\",\"—\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l6e1\",\"type\":\"order\",\"prompt\":\"Ordena la mañana de Valeria\",\"sentences\":[\"First of all, I woke up late.\",\"Then I missed the bus.\",\"After that, I walked to work in the rain.\",\"In the end, I arrived at ten.\"],\"translation\":\"Lo primero, me desperté tarde. Luego perdí el autobús. Después de eso, fui andando al trabajo bajo la lluvia. Al final llegué a las diez.\",\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2intheend\",\"ena2m1missedthebus\"],\"tip\":\"Fíjate en que las señales solas ya te dan el orden, sin leer el resto. Eso es exactamente lo que hacen por quien te lee a ti.\"},{\"id\":\"ena2m2l6e2\",\"type\":\"match\",\"prompt\":\"Empareja las señales\",\"pairs\":[{\"target\":\"First of all,\",\"source\":\"Lo primero de todo,\"},{\"target\":\"after that\",\"source\":\"después de eso\"},{\"target\":\"suddenly\",\"source\":\"de repente\"},{\"target\":\"in the end\",\"source\":\"al final resultó que…\"},{\"target\":\"finally\",\"source\":\"por fin, después de esperar\"}],\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2suddenly\",\"ena2m2intheend\",\"ena2m2finally\"]},{\"id\":\"ena2m2l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la apertura\",\"text\":\"___ of all, I got up at six.\",\"answers\":[\"First\"],\"translation\":\"Lo primero de todo, me levanté a las seis.\",\"hints\":[\"El ordinal que ya traes del A1, con «of all» detrás\",\"F…\"],\"itemIds\":[\"ena2m2firstofall\",\"enfirst\"]},{\"id\":\"ena2m2l6e4\",\"type\":\"gapbank\",\"prompt\":\"La mañana entera — elige del banco\",\"text\":\"___ of all, I woke up late. After ___, I missed the bus and I ___ to work in the rain. In the ___, I arrived at ten.\",\"answers\":[\"First\",\"that\",\"walked\",\"end\"],\"bank\":[\"First\",\"that\",\"walked\",\"end\",\"Then\",\"Finally\",\"took\"],\"translation\":\"Lo primero de todo, me desperté tarde. Después de eso, perdí el autobús y fui andando al trabajo bajo la lluvia. Al final llegué a las diez.\",\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2intheend\",\"ena2m1theywalkedtothepark\"],\"tip\":\"Tres huecos son de conector y uno es de verbo. Es a propósito: en el examen los huecos no vienen etiquetados y hay que mirar qué pide la frase.\"},{\"id\":\"ena2m2l6e5\",\"type\":\"mc\",\"prompt\":\"El calco de «al final»\",\"question\":\"«Al final llegué a las diez»\",\"options\":[\"In the end I arrived at ten.\",\"At the final I arrived at ten.\",\"To the end I arrived at ten.\"],\"answer\":0,\"whyWrong\":[null,\"«the final» en inglés es la final de un campeonato: has dicho «en la final llegué a las diez»\",\"«to the end» es «hasta el final», que es otra cosa\"],\"itemIds\":[\"ena2m2intheend\",\"ena2m1arrived\"],\"tip\":\"Al final (de la historia) = in the end. Al final de algo concreto = at the end of… Por fin = finally. Tres cosas distintas donde el español dice una.\"},{\"id\":\"ena2m2l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco\",\"wrong\":\"At the final, I went home.\",\"answers\":[\"In the end, I went home.\"],\"why\":\"«al final» de una historia es in the end. «At the final» sería «en la final» — la del campeonato. Y «at the end» necesita un complemento detrás: at the end OF the film.\",\"translation\":\"Al final me fui a casa.\",\"itemIds\":[\"ena2m2intheend\",\"ena2m2iwenttothecinema\"]},{\"id\":\"ena2m2l6e7\",\"type\":\"build\",\"prompt\":\"Construye el eslabón del medio\",\"target\":\"After that I went home and I made dinner\",\"translation\":\"Después de eso me fui a casa e hice la cena\",\"distractors\":[\"then\",\"finally\"],\"itemIds\":[\"ena2m2afterthat\",\"ena2m2iwenttothecinema\",\"ena2m2imadeamistake\"],\"tip\":\"Las dos fichas que sobran también valdrían… pero no a la vez que «After that». Una señal por eslabón: dos seguidas suenan a texto mal cosido.\"},{\"id\":\"ena2m2l6e8\",\"type\":\"order\",\"prompt\":\"Y ahora una historia con giro\",\"sentences\":[\"First of all, we had dinner at Amy's flat.\",\"Then we watched a film.\",\"Suddenly, the lights went off.\",\"After that, we sat in the kitchen with candles.\",\"In the end, we had a great evening.\"],\"translation\":\"Lo primero, cenamos en casa de Amy. Luego vimos una película. De repente se fue la luz. Después de eso nos sentamos en la cocina con velas. Al final pasamos una noche estupenda.\",\"itemIds\":[\"ena2m2suddenly\",\"ena2m2firstofall\",\"ena2m2intheend\",\"enwatchafilm\",\"enkitchen\"],\"tip\":\"«Suddenly» va justo antes del problema. Es la señal que le dice a quien te escucha: atención, aquí se tuerce.\"},{\"id\":\"ena2m2l6e9\",\"type\":\"listen\",\"prompt\":\"Dictado — dos señales\",\"text\":\"First of all, I made a coffee. Then I read my messages.\",\"translation\":\"Lo primero de todo, me hice un café. Luego leí los mensajes.\",\"hints\":[\"make → m… · read se escribe igual y suena «red»\",\"First of all, I m… a coffee. Then I r… my messages.\"],\"itemIds\":[\"ena2m2firstofall\",\"ena2m2imadeamistake\",\"ena2m2readred\",\"encoffee\",\"enmessage\"],\"tip\":\"read en el dictado es la prueba de fuego: has oído «red» y hay que escribir read. Lo que suena no te dice cómo se escribe.\"},{\"id\":\"ena2m2l6e10\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Lo primero de todo, perdí las llaves. Después de eso, perdí el autobús.\",\"answers\":[\"First of all, I lost my keys. After that, I missed the bus.\",\"First of all I lost my keys. After that I missed the bus.\"],\"hint\":\"los dos «perder» del español no son el mismo verbo en inglés\",\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2mykeys\",\"ena2m1missedthebus\"],\"tip\":\"Objetos: lose. Transportes y citas: miss. El español los llama igual y el inglés no: es de las repartos que más se fallan en el nivel.\"},{\"id\":\"ena2m2l6e11\",\"type\":\"speak\",\"prompt\":\"Tres eslabones seguidos, en voz alta\",\"text\":\"First of all I woke up late. Then I missed the bus. Finally, I walked to work.\",\"phonetic\":\"féest ov OOL ái uóuk ap LÉIT. den ái MIST de bas. FÁI-na-li, ái UÓOKT tu uéek\",\"translation\":\"Lo primero, me desperté tarde. Luego perdí el autobús. Al final fui andando al trabajo.\",\"itemIds\":[\"ena2m2firstofall\",\"ena2m2finally\",\"ena2m2wokegroup\",\"ena2m1missedthebus\"],\"tip\":\"Marca una pequeña pausa después de cada señal. Esa pausa es la coma, y es lo que hace que se te siga sin esfuerzo.\"},{\"id\":\"ena2m2l6e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lo primero de todo, me desperté tarde. Luego perdí el autobús y al final llegué a las diez.\",\"answers\":[\"First of all, I woke up late. Then I missed the bus and in the end I arrived at ten.\",\"First of all I woke up late. Then I missed the bus and in the end I arrived at ten.\",\"First of all, I woke up late. Then I missed the bus and in the end, I arrived at ten.\"],\"hints\":[\"Tres señales: apertura, eslabón y cierre\",\"First of all, I w… up late. Then I m… the bus and in the e… I arrived at ten.\"],\"itemIds\":[\"ena2m2firstofall\",\"ena2m2intheend\",\"ena2m2wokegroup\",\"ena2m1missedthebus\",\"ena2m1arrived\"],\"tip\":\"Tres frases y tres señales: eso ya es un texto organizado. En el Writing del examen, esto solo vale una banda entera del criterio de organización.\"}]}],\"resources\":[{\"label\":\"British Council — A2 writing\",\"url\":\"https://learnenglish.britishcouncil.org/skills/writing/a2-writing\",\"note\":\"Abre cualquier modelo y subraya las señales de secuencia. Verás que un texto de 40 palabras lleva dos o tres y ni una más: no es cuestión de meter muchas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
