e56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T547,El módulo pasado te dio la regla más barata del inglés: \u003cb\u003e+ed\u003c/b\u003e y ya está. Hoy llega la factura.\u003cbr/\u003e\u003cbr/\u003eHay unos \u003cb\u003eciento y pico verbos\u003c/b\u003e que no hacen la -ed: tienen su propia forma de pasado y hay que aprendérsela. Y —ley de Murphy de las lenguas— \u003cb\u003eson los que más se usan\u003c/b\u003e: go, have, see, get, make, take, come, say. En un texto normal, uno de cada tres verbos en pasado es de estos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAhora la letra pequeña, que es buena de verdad.\u003c/b\u003e Compara el trabajo:\u003cbr/\u003e\u003cbr/\u003e· En español, para poner «ir» en pasado tienes que aprender \u003ci\u003efui, fuiste, fue, fuimos, fuisteis, fueron\u003c/i\u003e — y encima el otro pasado: \u003ci\u003eiba, ibas, iba, íbamos, ibais, iban\u003c/i\u003e. Doce formas.\u003cbr/\u003e· En inglés, «go» en pasado es \u003cb\u003ewent\u003c/b\u003e. Una. Para todas las personas y para los dos pasados españoles.\u003cbr/\u003e\u003cbr/\u003eAsí que sí, hay que memorizar. Pero memorizas \u003cb\u003euna palabra por verbo\u003c/b\u003e, no doce. Y siguen valiendo las dos reglas del módulo pasado: \u003cb\u003eno hay -s de tercera persona\u003c/b\u003e (\u003ci\u003eshe went\u003c/i\u003e, no \u003ci\u003eshe wents\u003c/i\u003e) y \u003cb\u003eel sujeto nunca se cae\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eRegla de supervivencia mientras los aprendes: si no te sale el pasado raro, \u003cb\u003eno te inventes una -ed\u003c/b\u003e. \u003ci\u003e[[I goed|❌ no existe]]\u003c/i\u003e suena a niño de tres años; decir «I went» mal colocado no, y en el examen la forma inventada cuenta como error de sistema."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l1\",\"phaseId\":\"ena2m2\",\"title\":\"I went, I saw, I had\",\"subtitle\":\"Los verbos que no obedecen — y por qué son justo los que más usas\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los ocho que hay que tener esta semana\",\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2wehadagoodtime\",\"ena2m2isawamyyesterday\",\"ena2m2shegotamessage\",\"ena2m2imadeamistake\",\"ena2m2hetookthetrain\",\"ena2m2icamehomelate\",\"ena2m2shesaidsorry\",\"enyesterday\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Malas noticias con letra pequeña buena\",\"body\":\"$17\",\"table\":[[\"infinitivo\",\"pasado\",\"ejemplo\"],[\"go\",\"went\",\"I went to the cinema.\"],[\"have\",\"had\",\"We had a good time.\"],[\"see\",\"saw\",\"I saw Amy yesterday.\"],[\"get\",\"got\",\"She got a message.\"],[\"make\",\"made\",\"I made a mistake.\"],[\"take\",\"took\",\"He took the train.\"],[\"come\",\"came\",\"I came home late.\"],[\"say\",\"said\",\"She said sorry.\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"yesterday\",\"pastExample\":\"I went to the cinema.\",\"nowLabel\":\"every week\",\"nowExample\":\"I go to the cinema.\"}}},{\"kind\":\"note\",\"note\":{\"title\":\"Tres de los ocho traen premio\",\"body\":\"No todos cuestan lo mismo. Tres de ellos resuelven frases enteras que en español se dicen con otro verbo, y conviene aprenderlos ya así, en bloque:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ehave → had\u003c/b\u003e. «Pasarlo bien» no se pasa: se \u003ci\u003etiene\u003c/i\u003e. \u003cb\u003e[[We had a good time.|Nos lo pasamos bien.]]\u003c/b\u003e Y también \u003ci\u003ehad breakfast\u003c/i\u003e, \u003ci\u003ehad a shower\u003c/i\u003e, \u003ci\u003ehad a look\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003emake → made\u003c/b\u003e. «Equivocarse» no es un verbo en inglés: es \u003ci\u003ehacer\u003c/i\u003e un error. \u003cb\u003e[[I made a mistake.|Me equivoqué.]]\u003c/b\u003e Ojo, que aquí el español empuja a \u003ci\u003eI did a mistake\u003c/i\u003e, y no.\u003cbr/\u003e· \u003cb\u003eget → got\u003c/b\u003e. Es el comodín del inglés hablado: recibir, conseguir, llegar. \u003ci\u003eShe got a message\u003c/i\u003e (le llegó), \u003ci\u003eI got home late\u003c/i\u003e (llegué), \u003ci\u003eI got a job\u003c/i\u003e (conseguí).\u003cbr/\u003e\u003cbr/\u003eY una nota de pronunciación que vale por diez correcciones: \u003cb\u003esaid\u003c/b\u003e no suena «séid». Suena \u003cb\u003e«sed»\u003c/b\u003e, corto y seco, igual que \u003ci\u003ebed\u003c/i\u003e. Es de las palabras más frecuentes del idioma y casi todo el mundo la dice mal el primer año.\",\"table\":[[\"en español\",\"en inglés\",\"literal, y por eso falla\"],[\"Nos lo pasamos bien.\",\"We had a good time.\",\"We passed it well ❌\"],[\"Me equivoqué.\",\"I made a mistake.\",\"I did a mistake ❌\"],[\"Llegué a casa tarde.\",\"I came home late. / I got home late.\",\"I came to home late ❌\"],[\"Vi a Amy.\",\"I saw Amy.\",\"I saw to Amy ❌\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l1e1\",\"type\":\"mc\",\"prompt\":\"Lo primero: reconocerlos\",\"question\":\"“I went to the cinema.”\",\"options\":[\"Fui al cine\",\"Voy al cine\",\"Quiero ir al cine\"],\"answer\":0,\"whyWrong\":[null,\"«Voy» sería I go — went es el pasado y no se parece en nada\",\"El «querer» no está en la frase: went es pasado a secas\"],\"itemIds\":[\"ena2m2iwenttothecinema\",\"enletsgotothecinema\"],\"tip\":\"went no se parece a go. Esa es toda la dificultad y todo el trabajo: reconocer una palabra nueva como el pasado de otra.\"},{\"id\":\"ena2m2l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — los regulares del módulo pasado, sin pensar\",\"pairs\":[{\"target\":\"worked\",\"source\":\"trabajé\"},{\"target\":\"watched\",\"source\":\"vi (una peli)\"},{\"target\":\"walked\",\"source\":\"fui andando\"},{\"target\":\"stayed\",\"source\":\"me quedé\"},{\"target\":\"rained\",\"source\":\"llovió\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m1iworked\",\"ena2m1shewatchedafilm\",\"ena2m1theywalkedtothepark\",\"ena2m1istayedathome\",\"ena2m1itrained\"],\"tip\":\"Antes de meter cincuenta formas nuevas, comprueba que las viejas salen solas. El cronómetro aquí solo premia.\"},{\"id\":\"ena2m2l1e3\",\"type\":\"match\",\"prompt\":\"Empareja cada verbo con su pasado\",\"pairs\":[{\"target\":\"go\",\"source\":\"went\"},{\"target\":\"have\",\"source\":\"had\"},{\"target\":\"see\",\"source\":\"saw\"},{\"target\":\"get\",\"source\":\"got\"},{\"target\":\"make\",\"source\":\"made\"}],\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2wehadagoodtime\",\"ena2m2isawamyyesterday\",\"ena2m2shegotamessage\",\"ena2m2imadeamistake\"],\"tip\":\"Fíjate en que ninguno lo podrías haber adivinado. Por eso estos se memorizan y no se deducen.\"},{\"id\":\"ena2m2l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Este lleva -ed o cambia entero?\",\"categories\":[\"obediente: + -ed\",\"rebelde: cambia entero\"],\"items\":[{\"text\":\"watch\",\"bucket\":0},{\"text\":\"go\",\"bucket\":1},{\"text\":\"cook\",\"bucket\":0},{\"text\":\"see\",\"bucket\":1},{\"text\":\"play\",\"bucket\":0},{\"text\":\"take\",\"bucket\":1},{\"text\":\"listen\",\"bucket\":0},{\"text\":\"have\",\"bucket\":1}],\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2isawamyyesterday\",\"ena2m2hetookthetrain\",\"ena2m2wehadagoodtime\"],\"tip\":\"No hay pista en la forma del infinitivo: watch y catch se parecen y hacen watched y caught. Esta clasificación es memoria pura, y está bien que lo sea.\"},{\"id\":\"ena2m2l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el pasado del verbo entre paréntesis\",\"text\":\"Yesterday I ___ (go) to the cinema with Amy.\",\"answers\":[\"went\"],\"translation\":\"Ayer fui al cine con Amy.\",\"hints\":[\"No lleva -ed: es una palabra distinta\",\"Empieza por w\"],\"itemIds\":[\"ena2m2iwenttothecinema\",\"enyesterday\"]},{\"id\":\"ena2m2l1e6\",\"type\":\"cloze\",\"prompt\":\"Y el que en español se dice con otro verbo\",\"text\":\"We ___ (have) a good time at the concert.\",\"answers\":[\"had\"],\"translation\":\"Nos lo pasamos bien en el concierto.\",\"hints\":[\"«Pasarlo bien» en inglés se TIENE\",\"have → h…\"],\"itemIds\":[\"ena2m2wehadagoodtime\",\"ena2m1concert\"],\"tip\":\"«Nos lo pasamos bien» = We HAD a good time. Guárdatela entera como una fórmula: la vas a usar en cada relato del nivel.\"},{\"id\":\"ena2m2l1e7\",\"type\":\"mc\",\"prompt\":\"El error de principiante que hay que saltarse\",\"question\":\"«Fui al cine» — ¿cuál es la buena?\",\"options\":[\"I went to the cinema.\",\"I goed to the cinema.\",\"I did go to the cinema.\"],\"answer\":0,\"whyWrong\":[null,\"goed no existe: go tiene su propia forma, went\",\"«did go» existe, pero es enfático («sí que fui»), no la forma normal\"],\"itemIds\":[\"ena2m2iwenttothecinema\"],\"tip\":\"Si no te sale el pasado raro, no le pegues una -ed. Una forma inventada canta muchísimo más que una frase corta y correcta.\"},{\"id\":\"ena2m2l1e8\",\"type\":\"transform\",\"prompt\":\"Del presente al pasado\",\"source\":\"I go to the cinema every Friday.\",\"instruction\":\"Ponla en pasado, con «last Friday»\",\"answers\":[\"I went to the cinema last Friday.\",\"Last Friday I went to the cinema.\"],\"translation\":\"Fui al cine el viernes pasado.\",\"hints\":[\"El verbo cambia entero\",\"go → w…\"],\"itemIds\":[\"ena2m2iwenttothecinema\"]},{\"id\":\"ena2m2l1e9\",\"type\":\"transform\",\"prompt\":\"Y con «she», donde el A1 dolía\",\"source\":\"She takes the train every morning.\",\"instruction\":\"Ponla en pasado, con «yesterday»\",\"answers\":[\"She took the train yesterday.\",\"Yesterday she took the train.\"],\"translation\":\"Ayer cogió el tren.\",\"hints\":[\"En pasado la -s de tercera persona desaparece\",\"takes → t…\"],\"itemIds\":[\"ena2m2hetookthetrain\",\"entrain\",\"enyesterday\"],\"tip\":\"takes → took, no «tooks». En pasado el inglés se olvida de la persona: misma forma para todos, también con los rebeldes.\"},{\"id\":\"ena2m2l1e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige la -ed inventada\",\"wrong\":\"I seed Amy yesterday.\",\"answers\":[\"I saw Amy yesterday.\"],\"why\":\"see no hace «seed»: su pasado es saw. Cuando un verbo es irregular, la -ed no es una segunda opción — sencillamente no existe esa forma.\",\"translation\":\"Vi a Amy ayer.\",\"itemIds\":[\"ena2m2isawamyyesterday\"]},{\"id\":\"ena2m2l1e11\",\"type\":\"errorfix\",\"prompt\":\"Corrige la «a» que el español pone y el inglés no\",\"wrong\":\"I saw to Amy yesterday.\",\"answers\":[\"I saw Amy yesterday.\"],\"why\":\"En español «ver» pide «a» delante de persona: «vi A Amy». En inglés no hay tal cosa: el verbo va pegado a la persona, sin preposición. Lo mismo con help, call, visit: I helped Amy, I called Ben.\",\"translation\":\"Vi a Amy ayer.\",\"itemIds\":[\"ena2m2isawamyyesterday\"],\"tip\":\"La «a personal» del español no tiene equivalente inglés. Cuando la escribas, bórrala: no hay ningún verbo que la pida.\"},{\"id\":\"ena2m2l1e12\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"He took the train and I came home late\",\"translation\":\"Él cogió el tren y yo llegué a casa tarde\",\"distractors\":[\"taked\",\"comed\"],\"itemIds\":[\"ena2m2hetookthetrain\",\"ena2m2icamehomelate\",\"entrain\",\"enhome\"],\"tip\":\"Las dos fichas que sobran son las formas que tu cabeza va a fabricar sola durante un mes. Reconócelas para no escribirlas.\"},{\"id\":\"ena2m2l1e13\",\"type\":\"listen\",\"prompt\":\"Dictado — cuidado con la última\",\"text\":\"She got a message and she said sorry.\",\"translation\":\"Le llegó un mensaje y pidió perdón.\",\"hints\":[\"get → g… · say → s…\",\"She g… a message and she s… sorry.\"],\"itemIds\":[\"ena2m2shegotamessage\",\"ena2m2shesaidsorry\",\"enmessage\",\"ensorry\"],\"tip\":\"Suena «sed» y se escribe said. Es la trampa de deletreo más frecuente del nivel: lo que oyes no te dice cómo se escribe.\"},{\"id\":\"ena2m2l1e14\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"Yesterday I went to the cinema and I saw Amy.\",\"phonetic\":\"YÉS-ta-dei ái UENT tu de SÍ-ne-ma and ái SOO ÉI-mi\",\"translation\":\"Ayer fui al cine y vi a Amy.\",\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2isawamyyesterday\"],\"tip\":\"saw es una sola vocal larga: «soo». Ni «sáu» ni «sao».\"},{\"id\":\"ena2m2l1e15\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ayer cogí el tren, llegué a casa tarde y me equivoqué de parada.\",\"answers\":[\"Yesterday I took the train, I came home late and I made a mistake with the bus stop.\",\"Yesterday I took the train, I came home late and I made a mistake with the stop.\",\"Yesterday I took the train, came home late and made a mistake with the bus stop.\"],\"hints\":[\"Tres irregulares seguidos: take, come, make\",\"Yesterday I t… the train, I c… home late and I m… a mistake…\"],\"itemIds\":[\"ena2m2hetookthetrain\",\"ena2m2icamehomelate\",\"ena2m2imadeamistake\",\"enbusstop\"],\"tip\":\"Tres verbos rebeldes en una frase y ni una -ed. Si te ha salido, los ocho grandes ya empiezan a ser tuyos.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m2-1\",\"book\":\"We had a good time.\",\"real\":\"We had a laugh.\",\"meaning\":\"Nos lo pasamos genial / nos reímos mucho\",\"when\":\"Con amigos y compañeros, contando una noche o un finde. Es de las expresiones más británicas que hay y no lleva ninguna carga: se dice de una cena, de un concierto o de un turno de trabajo llevadero. En el Writing del examen, la versión del libro (a good time, a great time).\",\"register\":\"amigos\",\"note\":\"a laugh aquí no es «una risa»: es «un buen rato». Y se dice también de una persona — «Sam's a laugh» = «Sam es divertidísimo».\",\"sound\":\"ui jad a LAAF\",\"level\":\"a2\",\"itemId\":\"ena2m2wehadagoodtime\"}}],\"resources\":[{\"label\":\"British Council — Past simple\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple\",\"note\":\"Vuelve a la misma ficha del módulo pasado, pero hoy mira SOLO los ejemplos con verbos irregulares. Cinco minutos: se trata de acostumbrar el ojo, no de estudiar.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
