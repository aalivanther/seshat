ra]] — es ist eine Überraschung!“\u003cbr/\u003e3. Leo antwortet: „Ich komme gern! Was sollen wir mitbringen?“\u003cbr/\u003e4. Nico schreibt: „Leo, bring bitte Saft und Brot mit! Sofia, kauf bitte Annas [[Lieblingskuchen|pastel favorito]]!“\u003cbr/\u003e5. Am Samstag bereiten sie zusammen Nicos Wohnung vor. Sofias Kuchen [[sieht super aus|tiene una pinta estupenda]].\u003cbr/\u003e6. Um fünf [[klingelt es an der Tür|suena el timbre]]. Nico sagt: „Seid leise! Anna kommt!“\u003cbr/\u003e7. Nico öffnet die Tür — alle [[rufen|gritan]]: „Überraschung! Herzlichen Glückwunsch zum Geburtstag!“\u003cbr/\u003e8. Anna [[lacht|ríe]]: „Eine Party für mich? [[Was für eine|¡Menuda]] Überraschung!“\u003cbr/\u003e9. Sie essen Sofias Kuchen, hören Musik und tanzen. Anna sagt: „Danke! Nicos Überraschung ist [[das beste|el mejor]] Geschenk!“\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: die Idee = la idea · der Lieblingskuchen = el pastel favorito (Lieblings- convierte cualquier cosa en «favorita») · es klingelt an der Tür = suena el timbre · rufen = gritar / exclamar · lacht = ríe (lachen) · Was für eine ...! = ¡menuda ...! · das beste Geschenk = el mejor regalo\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"a2m9l7\",\"phaseId\":\"a2m9\",\"title\":\"Nicos Überraschung\",\"subtitle\":\"Mini-cuento — la fiesta sorpresa para Anna\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Dos piezas nuevas para el cuento\",\"itemIds\":[\"a2m9ueberraschung\",\"a2m9seidleise\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Nicos Überraschung\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m9l7e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 1)\",\"question\":\"„Am Samstag ist Annas Geburtstag.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"whyWrong\":[null,\"Relee la frase 1: Annas Geburtstag ist am Samstag — por eso Nico organiza la sorpresa\"],\"itemIds\":[\"a2m9annasparty\",\"geburtst
