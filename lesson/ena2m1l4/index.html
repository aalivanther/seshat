003eon yesterday\u003c/i\u003e.\u003cbr/\u003e2. \u003cb\u003elast + tiempo\u003c/b\u003e: [[last week|la semana pasada]], last month, last year, last Saturday, last summer → \u003cb\u003esin the y sin on\u003c/b\u003e. «El sábado pasado» es \u003ci\u003elast Saturday\u003c/i\u003e, no \u003ci\u003ethe last Saturday\u003c/i\u003e.\u003cbr/\u003e3. \u003cb\u003etiempo + ago\u003c/b\u003e: [[two days ago|hace dos días]], a week ago, [[a month ago|hace un mes]], ten years ago. Fíjate en el orden: \u003cb\u003eago va DETRÁS\u003c/b\u003e, cerrando el bloque. El español pone «hace» delante y por eso sale \u003ci\u003ebefore two days\u003c/i\u003e, que no significa nada.\u003cbr/\u003e4. \u003cb\u003ein + año\u003c/b\u003e: [[in 2024|en 2024]], in 1999. Con los años sí hay preposición, y es in.\u003cbr/\u003e\u003cbr/\u003eY una joya del calendario: \u003cb\u003ethe day before yesterday\u003c/b\u003e = anteayer. Larga, pero es la que hay.\",\"table\":[[\"marcador\",\"ejemplo\",\"ojo\"],[\"yesterday / last night\",\"I worked yesterday.\",\"sin preposición\"],[\"last + tiempo\",\"last week · last Saturday\",\"sin the y sin on\"],[\"tiempo + ago\",\"two days ago · a month ago\",\"ago va DETRÁS\"],[\"in + año\",\"in 2024\",\"aquí sí hay preposición\"],[\"the day before yesterday\",\"anteayer\",\"cuatro palabras, una idea\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"two days ago\",\"pastExample\":\"She arrived two days ago.\",\"nowLabel\":\"today\",\"nowExample\":\"She is at work.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l4e1\",\"type\":\"match\",\"prompt\":\"Empareja los marcadores\",\"pairs\":[{\"target\":\"last week\",\"source\":\"la semana pasada\"},{\"target\":\"two days ago\",\"source\":\"hace dos días\"},{\"target\":\"the day before yesterday\",\"source\":\"anteayer\"},{\"target\":\"in 2024\",\"source\":\"en 2024\"}],\"itemIds\":[\"ena2m1lastweek\",\"ena2m1twodaysago\",\"ena2m1thedaybeforeyesterday\",\"ena2m1in2024\"]},{\"id\":\"ena2m1l4e2\",\"type\":\"mc\",\"prompt\":\"«Hace tres semanas»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"three weeks ago\",\"before three weeks\",\"ago three weeks\"],\"answer\":0,\"whyWrong\":[null,\"before es «antes de algo», no «hace»: before the party, before six\",\"ago cierra el bloque, nunca lo abre\"],\"itemIds\":[\"ena2m1twodaysago\",\"enweek\"],\"tip\":\"Truco de colocación: el español empieza por «hace» y el inglés TERMINA por ago. Es el mismo bloque puesto del revés.\"},{\"id\":\"ena2m1l4e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco de «hace»\",\"wrong\":\"I visited London before two years.\",\"answers\":[\"I visited London two years ago.\"],\"why\":\"«Hace dos años» no es before: before significa «antes de». La palabra es ago, y va detrás del tiempo — two years ago, a month ago, ten minutes ago.\",\"translation\":\"Visité Londres hace dos años.\",\"itemIds\":[\"ena2m1twodaysago\",\"ena2m1shevisitedafriend\"]},{\"id\":\"ena2m1l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa el marcador\",\"text\":\"Amy phoned me ___ night.\",\"answers\":[\"last\"],\"translation\":\"Amy me llamó anoche.\",\"hints\":[\"«Anoche» es «la noche pasada»\",\"l… night\"],\"itemIds\":[\"enlastnight\",\"ena2m1phoned\"]},{\"id\":\"ena2m1l4e5\",\"type\":\"bucket\",\"prompt\":\"¿Lleva in delante o va a pelo?\",\"categories\":[\"a pelo, sin preposición\",\"con in delante\"],\"items\":[{\"text\":\"yesterday\",\"bucket\":0},{\"text\":\"last week\",\"bucket\":0},{\"text\":\"two days ago\",\"bucket\":0},{\"text\":\"2024\",\"bucket\":1},{\"text\":\"last night\",\"bucket\":0},{\"text\":\"1999\",\"bucket\":1}],\"itemIds\":[\"ena2m1lastweek\",\"ena2m1twodaysago\",\"ena2m1in2024\",\"enyesterday\",\"enlastnight\"],\"tip\":\"Regla corta: los años llevan in; todo lo demás de esta lista, nada. Si dudas, quítala — sobra más veces de las que falta.\"},{\"id\":\"ena2m1l4e6\",\"type\":\"transform\",\"prompt\":\"Añade el marcador y mueve el verbo\",\"source\":\"I work in a café.\",\"instruction\":\" I arrived in 2023.\",\"I arrived on 2023.\",\"I arrived 2023.\"],\"answer\":0,\"whyWrong\":[null,\"on es para días concretos: on Monday, on the third of May\",\"Los años necesitan su in; sin él la frase se queda coja\"],\"itemIds\":[\"ena2m1in2024\",\"ena2m1arrived\"]},{\"id\":\"ena2m1l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Llegué a Londres hace un año.\",\"answers\":[\"I arrived in London a year ago.\",\"I arrived in London one year ago.\",\"I arrived in London a year ago\"],\"hints\":[\"arrive + in + ciudad · «hace» va al final\",\"I arriv… in London a year a…\"],\"itemIds\":[\"ena2m1arrived\",\"ena2m1amonthago\",\"ena2m1lastyear\"]}]}],\"resources\":[{\"label\":\"British Council — Past simple (marcadores de tiempo)\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple\",\"note\":\"Fíjate solo en los marcadores de los ejemplos y cópialos en tu libreta. Ese listado es media nota del Writing.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"appl
