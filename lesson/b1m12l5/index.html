shat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4ce,El Hören dura ~40 minutos, tiene 4 Teile y 30 ítems. Lo que hay que grabarse a fuego es \u003cb\u003ecuántas veces suena cada uno\u003c/b\u003e:\u003cbr/\u003e· \u003cb\u003eTeil 1 — dos veces.\u003c/b\u003e Cinco textos cortos (contestador, aviso de radio, megafonía de la estación, parte meteorológico, información a un grupo). \u003cb\u003e2 ítems por texto\u003c/b\u003e: el primero \u003ci\u003eRichtig/Falsch\u003c/i\u003e, el segundo opción múltiple. Consigna: \u003ci\u003e„Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal.“\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eTeil 2 — UNA sola vez.\u003c/b\u003e Un monólogo largo (visita guiada, charla) con \u003cb\u003e5 preguntas\u003c/b\u003e. Consigna: \u003ci\u003e„Sie hören nun einen Text. Sie hören den Text einmal.“\u003c/i\u003e Antes tienes \u003cb\u003e60 segundos\u003c/b\u003e para leer las preguntas: no son una cortesía, son \u003cb\u003eparte de la tarea\u003c/b\u003e.\u003cbr/\u003e· Teil 3 — una vez · Teil 4 — dos veces (los ves en la lección siguiente).\u003cbr/\u003eLos Teile 2 y 3 son \u003cb\u003e12 de los 30 ítems: el 40 % del módulo se juega sin red\u003c/b\u003e. Tres reglas para sobrevivir: \u003cb\u003e(1)\u003c/b\u003e usa los 60 segundos para subrayar la palabra clave de cada pregunta; \u003cb\u003e(2)\u003c/b\u003e si pierdes un ítem, \u003cb\u003edéjalo ir\u003c/b\u003e — quedarse en él te cuesta los dos siguientes; \u003cb\u003e(3)\u003c/b\u003e anota \u003cb\u003eStichwörter\u003c/b\u003e, nunca frases: mientras escribes, no escuchas."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m12l5\",\"phaseId\":\"b1m12\",\"title\":\"Hören Teil 1 y 2\",\"subtitle\":\"Dos escuchas… y luego UNA sola: la diferencia brutal del módulo\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las consignas literales del audio\",\"itemIds\":[\"b1m12gzzweimalhoeren\",\"b1m12gzeinmalhoeren\",\"b1m9durchsage\",\"b1m12gzstichwort\",\"b1m12gzmoderator\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla 2 – 1 – 1 – 2\",\"body\":\"$17\",\"table\":[[\"Teil 1\",\"5 textos cortos · 10 ítems · 2 escuchas\"],[\"Teil 2\",\"1 monólogo · 5 ítems · 1 escucha\"],[\"Teil 3\",\"1 diálogo · 7 ítems · 1 escucha\"],[\"Teil 4\",\"discusión a 3 voces · 8 ítems · 2 escuchas\"],[\"Aprobado\",\"18 de 30 aciertos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l5e1\",\"type\":\"audiomc\",\"prompt\":\"Teil 1, texto 1 de 5 (contestador), primera tarea: SIEMPRE es una afirmación Richtig/Falsch. Dos escuchas, como en el examen.\",\"audio\":\"Guten Tag, hier ist die Praxis Doktor Weber. Ihr Termin am Donnerstag um zehn muss leider verschoben werden. Wir könnten Ihnen Freitag um halb neun anbieten. Bitte rufen Sie kurz zurück.\",\"question\":\"Der Termin am Donnerstag findet wie geplant statt.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Ihr Termin am Donnerstag um zehn muss leider verschoben werden»: se aplaza\",null],\"itemIds\":[\"b1m3einenterminvereinbaren\",\"b1m12gzzweimalhoeren\"],\"tip\":\"«verschoben werden» = ser aplazado. En los contestadores del Teil 1 aparece casi siempre, y la afirmación nunca lo repite con esa palabra: usa otra («wie geplant», «findet statt») y tú tienes que ver que dicen lo contrario.\"},{\"id\":\"b1m12l5e12\",\"type\":\"audiomc\",\"prompt\":\"Teil 1, texto 1, SEGUNDA tarea: la de opción múltiple. Cada uno de los cinco textos trae estas dos, y se oye dos veces.\",\"audio\":\"Guten Tag, hier ist die Praxis Doktor Weber. Ihr Termin am Donnerstag um zehn muss leider verschoben werden. Wir könnten Ihnen Freitag um halb neun anbieten. Bitte rufen Sie kurz zurück.\",\"question\":\"¿Qué le ofrecen?\",\"options\":[\"El viernes a las ocho y media\",\"El viernes a las nueve y media\",\"El jueves a las diez, pero con otro médico\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«halb neun» son las ocho y media, no las nueve y media: es el falso amigo horario del alemán\",\"De cambiar de médico no se dice nada\"],\"itemIds\":[\"b1m3einenterminvereinbaren\",\"b1m12gzzweimalhoeren\"],\"tip\":\"«halb neun» = 8:30, media hora ANTES de las nueve. Es el error de reloj más caro del Hören, y cae en los contestadores del Teil 1 con una regularidad sospechosa.\"},{\"id\":\"b1m12l5e2\",\"type\":\"audiomc\",\"prompt\":\"Teil 1, texto 2 de 5 (megafonía de estación), primera tarea: Richtig o Falsch. Dos escuchas.\",\"audio\":\"Achtung am Gleis sieben: Der ICE nach Hamburg fährt heute ausnahmsweise von Gleis elf ab. Wir bitten die Reisenden, den Bahnsteig zu wechseln. Die Abfahrt verzögert sich um etwa zehn Minuten.\",\"question\":\"Der ICE nach Hamburg fährt heute vom gewohnten Gleis ab.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«fährt heute ausnahmsweise von Gleis elf ab»: hoy sale del once, no del siete\",null],\"itemIds\":[\"b1m9durchsage\"],\"tip\":\"«ausnahmsweise» = excepcionalmente. Es la palabra que convierte un aviso rutinario en un ítem: si la oyes, algo cambia hoy.\"},{\"id\":\"b1m12l5e13\",\"type\":\"audiomc\",\"prompt\":\"Teil 1, texto 2, SEGUNDA tarea. Dos escuchas.\",\"audio\":\"Achtung am Gleis sieben: Der ICE nach Hamburg fährt heute ausnahmsweise von Gleis elf ab. Wir bitten die Reisenden, den Bahnsteig zu wechseln. Die Abfahrt verzögert sich um etwa zehn Minuten.\",\"question\":\"¿Qué deben hacer los viajeros?\",\"options\":[\"Cambiar de andén y contar con diez minutos de retraso\",\"Bajar del tren porque se ha cancelado\",\"Ir al andén siete y esperar allí\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Nadie habla de cancelación\",\"El andén 7 es justo el que ya no vale\"],\"itemIds\":[\"b1m9durchsage\"],\"tip\":\"En las Durchsagen el dato que decide suele ser un número. Apúntalos en cuanto suenen: primero el andén, después los minutos.\"},{\"id\":\"b1m12l5e3\",\"type\":\"mc\",\"prompt\":\"Los 60 segundos previos\",\"question\":\"Antes del Teil 2 tienes 60 segundos. ¿Para qué son?\",\"options\":[\"Para descansar\",\"Para leer las cinco preguntas y subrayar su palabra clave\",\"Para repasar el Teil 1\"],\"answer\":1,\"whyWrong\":[\"No es una pausa: el reloj del examen corre\",null,\"El Teil 1 ya está cerrado; volver atrás te cuesta el Teil 2\"],\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m12gzschluesselwort\"],\"tip\":\"Quien no lee las preguntas antes, escucha sin saber qué busca. Es el error nº 1 del que viene del A2.\"},{\"id\":\"b1m12l5e4\",\"type\":\"audiomc\",\"prompt\":\"Teil 2: UNA sola escucha. Lee la pregunta, subraya, y solo entonces dale al play. (Fragmento de una tarea; los Teile 2 completos —texto largo y cinco tareas de una pasada— están en los módulos 7, 9 y 11.)\",\"audio\":\"Herzlich willkommen im Stadtmuseum. Bevor wir starten, drei Hinweise: Fotografieren ist erlaubt, aber bitte ohne Blitz. Die Garderobe im Erdgeschoss ist kostenlos, große Rucksäcke müssen dort bleiben. Und die Sonderausstellung im dritten Stock schließt heute schon um sechzehn Uhr, weil dort am Abend eine Lesung stattfindet.\",\"question\":\"¿Qué cierra hoy antes de lo normal?\",\"options\":[\"La exposición temporal de la tercera planta\",\"El guardarropa de la planta baja\",\"El museo entero\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Del guardarropa solo se dice que es gratis\",\"Del museo entero no se dice ningún horario\"],\"itemIds\":[\"b1m12gzeinmalhoeren\"],\"tip\":\"Con una sola pasada, escucha la estructura: «drei Hinweise» te avisa de que vienen tres bloques. Coloca cada pregunta en su bloque.\" \",\"Stichwörter\",\"lasse\",\"Zeugnis\",\"wiederhole\",\"Anzeige\"],\"translation\":\"En los sesenta segundos leo las tareas y marco la palabra clave. Al escuchar solo apunto palabras sueltas. Si pierdo una tarea, la dejo y sigo escuchando.\",\"itemIds\":[\"b1m12gzschluesselwort\",\"b1m12gzstichwort\"]},{\"id\":\"b1m12l5e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige la frase sobre tu estrategia\",\"wrong\":\"Ich bereite mich auf der Prüfung vor.\",\"answers\":[\"Ich bereite mich auf die Prüfung vor.\",\"Ich bereite mich auf die Prüfung vor\"],\"why\":\"sich vorbereiten auf rige ACUSATIVO (auf die Prüfung), no dativo. «auf» es preposición de las dos caras: aquí manda el verbo, y el verbo pide acusativo.\",\"translation\":\"Me preparo para el examen.\",\"itemIds\":[\"b1m12gzsichvorbereitenauf\"]},{\"id\":\"b1m12l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Oigo el texto una sola vez, por eso leo las preguntas antes\",\"answers\":[\"Ich höre den Text einmal, deshalb lese ich die Aufgaben vorher\",\"Ich höre den Text einmal, deshalb lese ich die Aufgaben vorher.\",\"Ich höre den Text nur einmal, deshalb lese ich die Aufgaben vorher\"],\"hints\":[\"…, deshalb + verbo + sujeto (¡inversión!)\",\"…lese ich die Aufgaben vorher\"],\"itemIds\":[\"b1m12gzeinmalhoeren\"],\"tip\":\"deshalb es adverbio: obliga a inversión. Aquí lo practicas diciendo justo la estrategia que te salva el módulo.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",
