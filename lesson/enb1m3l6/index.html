a palabra, glosas tocables para lo que bloquee. Pero este texto tiene una dificultad nueva: \u003cb\u003eestá lleno de gente citada\u003c/b\u003e, unas con comillas y otras en estilo indirecto. Y el examen pregunta justo por eso: \u003cb\u003equién dice qué\u003c/b\u003e, y si lo que dice es un \u003cb\u003ehecho\u003c/b\u003e o una \u003cb\u003eopinión\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eTres trucos para no perderte:\u003cbr/\u003e1. Cuando veas comillas, mira \u003cb\u003equién\u003c/b\u003e las abre. El nombre suele ir justo detrás: \u003ci\u003e«…», says Marie Docherty\u003c/i\u003e.\u003cbr/\u003e2. Cuando veas \u003ci\u003esaid that\u003c/i\u003e, \u003ci\u003etold the magazine\u003c/i\u003e, \u003ci\u003epoints out\u003c/i\u003e, \u003ci\u003eagreed\u003c/i\u003e, subraya el verbo: te está diciendo \u003cb\u003econ qué actitud\u003c/b\u003e se dijo.\u003cbr/\u003e3. \u003cb\u003eQue alguien lo diga no lo convierte en verdad.\u003c/b\u003e El texto contiene cosas que resultaron ser falsas. Dos de las preguntas de abajo no se contestan buscando: se contestan juntando dos párrafos.\u003cbr/\u003e\u003cbr/\u003eY dos preguntas son de \u003cb\u003erespuesta escrita\u003c/b\u003e, con un máximo de tres palabras: exactamente el formato del \u003cb\u003eReading Part 4\u003c/b\u003e del examen, donde ya no hay opciones que adivinar."])</script><script>self.__next_f.push([1,"18:Ta37,"])</script><script>self.__next_f.push([1,"In March a message appeared on a neighbourhood group with more than four thousand members. It said that the number 61 bus, the only one that goes past the health centre, was going to be cut in the summer. Within a day it had been shared more than six hundred times.\u003cbr/\u003e\u003cbr/\u003e\"I passed it on because a friend sent it to me,\" says Marie Docherty, who has lived on the same street for thirty years. \"She's not somebody who makes things up. It never occurred to me to ask her where it had come from.\"\u003cbr/\u003e\u003cbr/\u003eBy the end of the week three shops had printed the message and put it in the window, and a [[wee|pequeño — así se dice en Escocia]] paper [[petition|recogida de firmas]] had appeared on the counter of the chemist's. On the Friday the bus company told this magazine that nobody had ever proposed cutting the 61.\u003cbr/\u003e\u003cbr/\u003eSo where did it come from? Nadia Rahman, who works at the community centre, spent an afternoon looking for the source, and she found it: a [[leaflet|folleto]] from a public [[consultation|consulta pública]] four years ago, when the company had asked people what they thought about running fewer buses on Sundays. The leaflet mentioned the 61. Somebody had photographed one page of it, and the photograph had lost the date.\u003cbr/\u003e\u003cbr/\u003e\"People read the headline and not the paragraph,\" Rahman says. \"That's not stupidity, it's speed. The message arrived from somebody they trusted, it was about something they use every day, and passing it on took four seconds. Checking it would have taken twenty minutes.\"\u003cbr/\u003e\u003cbr/\u003eShe points out that the rumour was not completely false either. The company had in fact [[withdrawn|retirado, suprimido]] two Sunday services in 2022, and the timetable had never gone back to what it was before. \"When a rumour is half true, it travels much further,\" she says. \"And anybody who corrects it ends up sounding as if they are defending the bus company.\"\u003cbr/\u003e\u003cbr/\u003eThe strange part is what happened next. The company agreed to hold a public meeting and expected perhaps thirty people. Three hundred came. Most of them had come because of the message, and most of them stayed to talk about the real problem, which was the Sunday timetable.\u003cbr/\u003e\u003cbr/\u003e\"I'm not going to apologise for it,\" says Marie Docherty, who was at the meeting. \"The thing was wrong, and I helped it along. But nobody from that company had ever stood in our hall before, and now they have.\"\u003cbr/\u003e\u003cbr/\u003eThis magazine asked her whether she would share a message like that again. She thought about it for a long time. \"I'd ask where it came from,\" she said. \"And then I'd probably share it anyway.\""])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l6\",\"phaseId\":\"enb1m3\",\"title\":\"The bus that was never cut\",\"subtitle\":\"Un texto de 450 palabras lleno de estilo indirecto — y de Glasgow, no de Londres\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del texto\",\"itemIds\":[\"enb1m3rumour\",\"enb1m3gossip\",\"enb1m2accordingto\",\"enb1m3misunderstanding\",\"enb1m3spread\",\"enb1m3claim\",\"enb1m3source\",\"enb1m3madeitup\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto lleno de gente hablando\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Toca las palabras subrayadas si te bloquean.\",\"title\":\"The bus that was never cut\",\"source\":\"From a community magazine on the south side of Glasgow (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb1m3l6e1q1\",\"q\":\"Which bus did the message say would be cut? (Máximo 3 palabras)\",\"accepted\":[\"the 61\",\"61\",\"the number 61\",\"number 61\",\"the 61 bus\"],\"why\":\"«the number 61 bus, the only one that goes past the health centre». En el Reading Part 4 basta con el dato: «the 61» vale, y no hace falta copiar la frase entera.\"},{\"id\":\"enb1m3l6e1q2\",\"q\":\"What does Marie Docherty's first answer suggest about how the message spread?\",\"options\":[\"That people checked who had sent it, but not where it came from.\",\"That people knew it was false and shared it anyway.\",\"That most people had seen the original leaflet.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice con esas palabras. Se deduce de dos frases suyas: «a friend sent it to me» / «She's not somebody who makes things up» (comprueba a la persona) y «It never occurred to me to ask her where it had come from» (no comprueba el origen).\"},{\"id\":\"enb1m3l6e1q3\",\"q\":\"What did the story originally come from? (Máximo 3 palabras)\",\"accepted\":[\"a leaflet\",\"an old leaflet\",\"a consultation leaflet\",\"leaflet\"],\"why\":\"«a leaflet from a public consultation four years ago». La foto de una página había perdido la fecha, y ahí nació el rumor.\"},{\"id\":\"enb1m3l6e1q4\",\"q\":\"What does Rahman mean by \\\"People read the headline and not the paragraph\\\"?\",\"options\":[\"That people react to the first line without reading the detail.\",\"That the leaflet had a headline that was not true.\",\"That people in the area do not read very well.\"],\"answer\":0,\"inference\":true,\"why\":\"Ella misma lo aclara en la frase siguiente: «That's not stupidity, it's speed». No habla de capacidad, habla de los cuatro segundos que cuesta reenviar algo.\"},{\"id\":\"enb1m3l6e1q5\",\"q\":\"Why does the article call what happened next \\\"the strange part\\\"?\",\"options\":[\"Because a false message ended up producing a real and useful meeting.\",\"Because the bus company refused to come to the meeting.\",\"Because only thirty people came in the end.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que juntar tres datos: el mensaje era falso, esperaban treinta personas y vinieron trescientas, y se quedaron a hablar del problema de verdad. Lo raro es que algo falso produjera algo útil — y por eso Marie no se disculpa.\"}],\"itemIds\":[\"enb1m3rumour\",\"enb1m3spread\",\"enb1m3source\",\"enb1m3madeitup\",\"enb1m3pointedout\"],\"tip\":\"¿Fallaste alguna de inferencia? Vuelve al párrafo y busca las DOS frases que, juntas, la sostienen. Y en las de respuesta escrita: tres palabras como máximo, sin frase entera. Copiar de más también resta.\"},{\"id\":\"enb1m3l6e2\",\"type\":\"mc\",\"prompt\":\"Rumour o gossip\",\"question\":\"«Hay un rumor de que van a cerrar el café» →\",\"options\":[\"There's a rumour that they're closing the café.\",\"There's a gossip that they're closing the café.\",\"There are gossips that they're closing the café.\"],\"answer\":0,\"whyWrong\":[null,\"«gossip» es incontable: no lleva «a» ni plural.\",\"Por lo mismo: «gossips» no existe como sustantivo de esto.\"],\"itemIds\":[\"enb1m3rumour\",\"enb1m3gossip\"],\"tip\":\"«a rumour» es UNA historia concreta que corre. «gossip» es la actividad de cotillear, en bloque y sin plural: «office gossip», «I don't like gossip».\"},{\"id\":\"enb1m3l6e3\",\"type\":\"mc\",\"prompt\":\"Inglés de Glasgow: la palabra del módulo, con otro sentido\",\"question\":\"En Glasgow, «I'm away for the messages» significa…\",\"options\":[\"Me voy a hacer la compra\",\"Voy a mirar el móvil\",\"Voy a llevar unos recados a alguien\"],\"answer\":0,\"whyWrong\":[null,\"Los mensajes del móvil son «texts» o «messages», pero esta expresión no va de eso.\",\"Ese sería el sentido de todo el resto del mundo anglófono, y es justo lo que despista.\"],\"itemIds\":[\"enmessage\",\"enb1m3passonthemessage\"],\"tip\":\"En Escocia «the messages» son la compra de la semana. Fuera de allí, «message» es lo que llevas usando todo el módulo: recado o mensaje. Es un recordatorio útil de que «inglés» no es una sola cosa — y de que el examen usa acentos y variedades de fuera de Londres.\"},{\"id\":\"enb1m3l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra clave del artículo\",\"text\":\"Nadia Rahman spent an afternoon looking for the ___ of the story, and she found it.\",\"answers\":[\"source\"],\"translation\":\"Nadia Rahman se pasó una tarde buscando la fuente de la historia, y la encontró.\",\"hints\":[\"De dónde sale la información\",\"sou...\"],\"itemIds\":[\"enb1m3source\"],\"tip\":\"«source» es la palabra del periodismo y la del examen: en el Reading, «according to the source» y «an unnamed source» aparecen cada dos por tres.\"},{\"id\":\"enb1m3l6e5\",\"type\":\"gapbank\",\"prompt\":\"Resume el artículo completando los huecos\",\"text\":\"A message on a neighbourhood group ___ that the 61 bus was going to be cut. It ___ very quickly, but ___ to the bus company nobody had ever proposed it. In the end the ___ turned out to be an old leaflet with no date.\",\"answers\":[\"claimed\",\"spread\",\"according\",\"source\"],\"bank\":[\"claimed\",\"spread\",\"according\",\"source\",\"announced\",\"rumour\",\"gossip\"],\"translation\":\"Un mensaje en un grupo del barrio afirmaba que el autobús 61 iba a desaparecer. Corrió muy rápido, pero según la compañía de autobuses nadie lo había propuesto nunca. Al final la fuente resultó ser un folleto viejo sin fecha.\",\"itemIds\":[\"enb1m3claim\",\"enb1m3spread\",\"enb1m2accordingto\",\"enb1m3source\"],\"tip\":\"«according to» se pega a la fuente, nunca a ti mismo: «according to the company», sí; «according to me», no — eso es «in my opinion».\"},{\"id\":\"enb1m3l6e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"According with the article, the bus was never going to be cut.\",\"answers\":[\"According to the article, the bus was never going to be cut.\"],\"why\":\"«según» se dice «according TO», con la preposición pegada. «According with» es el calco directo de «de acuerdo con», y no existe.\",\"translation\":\"Según el artículo, el autobús no iba a desaparecer nunca.\",\"itemIds\":[\"enb1m2accordingto\"]},{\"id\":\"enb1m3l6e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «spread»\",\"source\":\"The story spread very quickly.\",\"forbid\":[\"spread\"],\"answers\":[\"The story went round very quickly\",\"Everybody heard the story in a couple of days\",\"The story was shared hundreds of times\"],\"translation\":\"La historia corrió muy rápido.\",\"hints\":[\"Hay un verbo con «round» que dice lo mismo\",\"The story went ... very quickly\"],\"itemIds\":[\"enb1m3spread\",\"enb1m3rumour\"],\"tip\":\"«go round» es lo que dice un británico en la calle («there's a story going round»). En el examen no puedes buscar la palabra: la rodeas, y esta es la habilidad del nivel.\"},{\"id\":\"enb1m3l6e8\",\"type\":\"bucket\",\"prompt\":\"¿Hecho o opinión? (Es la pregunta del Listening Part 4 y del Reading)\",\"categories\":[\"HECHO — se puede comprobar\",\"OPINIÓN — es lo que alguien piensa\"],\"items\":[{\"text\":\"The message was shared more than six hundred times.\",\"bucket\":0},{\"text\":\"When a rumour is half true, it travels much further.\",\"bucket\":1},{\"text\":\"The company withdrew two Sunday services in 2022.\",\"bucket\":0},{\"text\":\"That's not stupidity, it's speed.\",\"bucket\":1},{\"text\":\"Three hundred people came to the meeting.\",\"bucket\":0},{\"text\":\"I'd probably share it anyway.\",\"bucket\":1}],\"itemIds\":[\"enb1m3claim\",\"enb1m3rumour\"],\"tip\":\"Regla práctica: si lleva un número, una fecha o algo que se puede contar, es hecho. Si lleva un verbo de opinión, un condicional o un adverbio como «probably», es opinión. El examen pregunta por esta diferencia con esas palabras exactas: «fact or opinion».\"},{\"id\":\"enb1m3l6e9\",\"type\":\"transform\",\"prompt\":\"Del estilo directo al indirecto — una frase del artículo\",\"source\":\"\\\"I passed it on because a friend sent it to me,\\\" she said.\",\"instruction\":\"Cuéntalo con «She said…»\",\"answers\":[\"She said she had passed it on because a friend had sent it to her\",\"She said that she had passed it on because a friend had sent it to her\",\"She said she had passed it on because a friend sent it to her\"],\"translation\":\"Dijo que lo había reenviado porque se lo había mandado una amiga.\",\"hints\":[\"Retroceden los dos verbos y cambian los pronombres\",\"She said she had ... because a friend had ...\"],\"itemIds\":[\"enb1m3passonthemessage\",\"enb1m3hesaidhehadseen\"],\"tip\":\"Aquí cambian tres cosas a la vez: el tiempo (passed → had passed), el pronombre (I → she) y el destinatario (me → her). El examen suele pedir las tres en el mismo ítem.\"},{\"id\":\"enb1m3l6e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Alguien se lo inventó.\",\"answers\":[\"Somebody made it up\",\"Someone made it up\"],\"hint\":\"El verbo lleva una partícula detrás\",\"itemIds\":[\"enb1m3madeitup\"],\"tip\":\"«make up» = inventarse algo. Y ojo a la posición del pronombre: «made it up», nunca «made up it». Con pronombre corto, la partícula va SIEMPRE detrás.\"},{\"id\":\"enb1m3l6e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"According to the company, nobody had ever proposed it.\",\"translation\":\"Según la compañía, nadie lo había propuesto nunca.\",\"hints\":[\"Empieza por «According…»\",\"According to the company, nobody ...\"],\"itemIds\":[\"enb1m2accordingto\"],\"tip\":\"«had ever» suena casi «adéva»: dos palabras sin acento pegadas. Si no las esperas, oyes «nobody proposed it» y pierdes el matiz de que ya estaba descartado antes.\"},{\"id\":\"enb1m3l6e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Según el artículo, la historia resultó ser un malentendido.\",\"answers\":[\"According to the article, the story turned out to be a misunderstanding\",\"According to the article the story turned out to be a misunderstanding\"],\"hints\":[\"«según» + su preposición pegada\",\"According to the article, the story turned out ...\"],\"itemIds\":[\"enb1m2accordingto\",\"enb1m3misunderstanding\",\"enb1m3itturnedout\"],\"tip\":\"Tres piezas del módulo en una frase: la fuente, el desenlace y la palabra que lo nombra. «misunderstanding» se escribe de un tirón y se acentúa en STAN: mis-an-da-STÁN-ding.\"},{\"id\":\"enb1m3l6e13\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 4 en formato real: una discusión sobre el mismo tema. Aquí, una sola escucha — el examen te dará dos. Toma notas: hay dos posturas y no siempre se dicen enteras.\",\"notepad\":true,\"audio\":\"Did you see they've taken the sign out of the chemist's window?|About time. The whole thing was made up, and half the street still believes it.|I'd not say made up, exactly. There was a real consultation, and they did cut the Sunday buses.|Four years ago. That's not the same as saying they're cutting the 61 this summer.|No, but you know what I mean. If the company had told people what they were doing back then, nobody would have believed a photograph of an old leaflet.|Maybe. Although somebody still photographed a page with no date on it and sent it to four thousand people.|Somebody did, yes. And three hundred of us ended up in that hall, which is three hundred more than last year.\",\"question\":\"¿En qué están de acuerdo los dos hablantes?\",\"options\":[\"En que el mensaje decía algo que no iba a pasar\",\"En que la compañía no tiene ninguna culpa\",\"En que la reunión no sirvió para nada\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"La segunda voz culpa a la compañía de no informar en su día.\",\"La última frase dice lo contrario: trescientas personas, «three hundred more than last year».\"],\"itemIds\":[\"enb1m3madeitup\",\"enb1m3rumour\",\"enb1m3claim\"],\"tip\":\"El acuerdo casi nunca se declara: se deduce. Aquí sale de que la segunda voz matiza («I'd not say made up, exactly») pero nunca niega que el 61 no iba a desaparecer. Discrepan del PORQUÉ, no del hecho.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m3-3\",\"book\":\"She told me a secret.\",\"real\":\"She let it slip.\",\"meaning\":\"Se le escapó\",\"when\":\"Contando algo que alguien dijo SIN QUERER: en el trabajo, entre amigos, sobre una sorpresa que se ha destripado. Lleva dentro que la persona no debía decirlo, así que no sirve para contar un secreto compartido a propósito. En el Writing formal no aparece.\",\"register\":\"neutral\",\"exam\":\"She mentioned it.\",\"note\":\"«slip» es «resbalar»: la información se le escurrió. Su primo es «It slipped out», sin culpable. Y ojo con la versión de examen: «mentioned» no dice si fue queriendo o sin querer — es más pobre, pero es la que no te juega ninguna mala pasada de registro.\",\"sound\":\"shi let it slip\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m3natletitslip\"}}],\"resources\":[{\"label\":\"Full Fact — cómo se comprueba un bulo\",\"url\":\"https://fullfact.org/\",\"note\":\"Elige un artículo corto y busca tres cosas: quién lo dice, cuándo lo dijo y de dónde sale el dato. Es inglés B1-B2 real y es exactamente lo que hace Nadia Rahman en el texto.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
