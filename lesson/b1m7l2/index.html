egen\u003c/b\u003e des Wetters — por culpa del tiempo\u003cbr/\u003e• \u003cb\u003etrotz\u003c/b\u003e des Regens — a pesar de la lluvia\u003cbr/\u003e• \u003cb\u003einnerhalb\u003c/b\u003e einer Woche — en el plazo de una semana\u003cbr/\u003e• \u003cb\u003eaufgrund\u003c/b\u003e der Tradition — debido a la tradición\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa trampa\u003c/b\u003e: en la calle oirás \u003ci\u003ewegen dem Wetter\u003c/i\u003e, \u003ci\u003ewährend dem Fest\u003c/i\u003e. Los alemanes lo dicen. Pero eso es habla coloquial y en el examen escrito cuenta como error: el corrector espera \u003cb\u003ewegen des Wetters\u003c/b\u003e. Regla de supervivencia: \u003cb\u003elo que oyes es dativo, lo que escribes es genitivo\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eTruco de memoria: las tres estrella se aprenden como una cantinela — \u003ci\u003ewährend, wegen, trotz\u003c/i\u003e — y las tres van seguidas de \u003cb\u003edes …-s\u003c/b\u003e o \u003cb\u003eder …\u003c/b\u003e. Nada más.\",\"table\":[[\"preposición\",\"genitivo\",\"significado\"],[\"während\",\"während des Festes\",\"durante\"],[\"wegen\",\"wegen des Wetters\",\"a causa de\"],[\"trotz\",\"trotz des Regens\",\"a pesar de\"],[\"innerhalb\",\"innerhalb einer Woche\",\"dentro de (plazo)\"],[\"aufgrund\",\"aufgrund der Tradition\",\"debido a\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l2e1\",\"type\":\"mc\",\"prompt\":\"¿Qué dice la frase?\",\"question\":\"„Trotz des Regens kommen viele Gäste.“\",\"options\":[\"A pesar de la lluvia vienen muchos invitados\",\"Por culpa de la lluvia no viene nadie\",\"Durante la lluvia esperan los invitados\"],\"answer\":0,\"whyWrong\":[null,\"«Por culpa de» sería wegen — y aquí sí vienen\",\"«Durante» sería während\"],\"itemIds\":[\"b1m7fetrotz\",\"b1m7fetrotzdesregens\"],\"tip\":\"trotz = concesión: pasa aunque haya un obstáculo. wegen = causa: pasa POR ese motivo.\"},{\"id\":\"b1m7l2e2\",\"type\":\"match\",\"prompt\":\"Empareja preposición y s
