 normal la deja \u003cb\u003ecolgada al final\u003c/b\u003e:\u003cbr/\u003e· \u003ci\u003ethe person I work \u003cb\u003ewith\u003c/b\u003e\u003c/i\u003e · \u003ci\u003ethe job I applied \u003cb\u003efor\u003c/b\u003e\u003c/i\u003e · \u003ci\u003ethe flat I told you \u003cb\u003eabout\u003c/b\u003e\u003c/i\u003e\u003cbr/\u003eExiste la versión formal —\u003ci\u003ethe person with whom I work\u003c/i\u003e— pero en B1 no la necesitas y suena a discurso de boda. Lo que \u003cb\u003eno\u003c/b\u003e existe es «the person with who I work».\u003cbr/\u003e\u003cbr/\u003eY ojo: la preposición no se elige por gusto, viene \u003cb\u003epegada al verbo\u003c/b\u003e. \u003ci\u003eapply \u003cb\u003efor\u003c/b\u003e\u003c/i\u003e a job (nunca «apply to a job»), \u003ci\u003ework \u003cb\u003ewith\u003c/b\u003e\u003c/i\u003e people, \u003ci\u003elook \u003cb\u003efor\u003c/b\u003e\u003c/i\u003e a flat."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l3\",\"phaseId\":\"enb1m2\",\"title\":\"The job I applied for\",\"subtitle\":\"El relativo que se puede quitar — y la preposición que se queda sola al final\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las frases sin relativo\",\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2personiworkwith\",\"enb1m2bestjobiveever\",\"enb1m2moneyiearn\",\"enb1m2applyfor\",\"enb1m2workwithpeople\",\"enb1m2sortofjob\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: cuándo desaparece el relativo\",\"body\":\"$17\",\"table\":[[\"¿Qué va detrás del relativo?\",\"¿Se puede quitar?\",\"Ejemplo\"],[\"un verbo (works, pays…)\",\"NO — es el sujeto\",\"the colleague who works nights\"],[\"un sujeto nuevo (I, she, Sam…)\",\"SÍ — es el objeto\",\"the job (that) I applied for\"],[\"un sujeto + verbo + preposición suelta\",\"SÍ\",\"the person (who) I work with\"],[\"español: «el trabajo que pedí»\",\"NUNCA\",\"—\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las frases sin relativo\",\"pairs\":[{\"target\":\"the job I applied for\",\"source\":\"el trabajo al que me presenté\"},{\"target\":\"the person I work with\",\"source\":\"la persona con la que trabajo\"},{\"target\":\"the money I earn\",\"source\":\"el dinero que gano\"},{\"target\":\"the best job I've ever had\",\"source\":\"el mejor trabajo que he tenido nunca\"}],\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2personiworkwith\",\"enb1m2moneyiearn\",\"enb1m2bestjobiveever\"],\"tip\":\"Fíjate en las cuatro: en español las cuatro llevan «que» o «el que». En inglés, ninguna lleva relativo. Eso es lo que hay que meter en el oído.\"},{\"id\":\"enb1m2l3e2\",\"type\":\"bucket\",\"prompt\":\"¿Se puede quitar el relativo? Mira qué va justo detrás\",\"categories\":[\"SE PUEDE QUITAR (detrás va un sujeto)\",\"NO SE PUEDE (detrás va el verbo)\"],\"items\":[{\"text\":\"the job that I applied for\",\"bucket\":0},{\"text\":\"the colleague who works with me\",\"bucket\":1},{\"text\":\"the money that I earn\",\"bucket\":0},{\"text\":\"the shift that starts at six\",\"bucket\":1},{\"text\":\"the person who I work with\",\"bucket\":0},{\"text\":\"the manager who signed it\",\"bucket\":1},{\"text\":\"the form that I filled in\",\"bucket\":0},{\"text\":\"the café which opened in 2019\",\"bucket\":1}],\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2personiworkwith\",\"enb1m2moneyiearn\"],\"tip\":\"No hace falta pensar en «sujeto» y «objeto» si no quieres: mira la palabra siguiente. ¿Es I, you, she, they o un nombre? Fuera el relativo.\"},{\"id\":\"enb1m2l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"the job that I applied for it\",\"answers\":[\"the job I applied for\",\"the job that I applied for\"],\"why\":\"El «it» es el pronombre reasumido otra vez: «the job» YA es lo que pediste, así que no hace falta repetirlo al final. Y el «that» puede quedarse o irse: las dos formas son correctas.\",\"translation\":\"el trabajo al que me presenté\",\"itemIds\":[\"enb1m2jobiappliedfor\"]},{\"id\":\"enb1m2l3e4\",\"type\":\"mc\",\"prompt\":\"Dónde va la preposición\",\"question\":\"«la persona con la que trabajo» →\",\"options\":[\"the person I work with\",\"the person with who I work\",\"the person who I work\"],\"answer\":0,\"whyWrong\":[null,\"Delante de una preposición nunca va «who»: sería «with whom», que es correcto pero de registro muy alto. En B1, al final.\",\"Falta la preposición: sin «with» la frase dice «la persona que trabajo», que no significa nada.\"],\"itemIds\":[\"enb1m2personiworkwith\"],\"tip\":\"Regla de bolsillo: escribe la frase sin relativo («I work with the person») y luego mueve el sustantivo al principio. La preposición se queda donde estaba.\"},{\"id\":\"enb1m2l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición que se quedó al final\",\"text\":\"That's the person I told you ___.\",\"answers\":[\"about\"],\"translation\":\"Esa es la persona de la que te hablé.\",\"hints\":[\"«hablar DE alguien» → tell somebody ___ somebody\",\"Empieza por a…\"],\"itemIds\":[\"enb1m2personiworkwith\"],\"tip\":\"«tell somebody about something». La preposición viaja con el verbo, no con el español: «hablar de» no da «tell of».\"},{\"id\":\"enb1m2l3e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"the person I work with\",\"translation\":\"la persona con la que trabajo\",\"distractors\":[\"him\",\"it\"],\"itemIds\":[\"enb1m2personiworkwith\"],\"tip\":\"Las dos fichas que sobran son las dos que un hispanohablante añade al final: el pronombre reasumido.\"},{\"id\":\"enb1m2l3e7\",\"type\":\"transform\",\"prompt\":\"Dos frases → una, sin relativo\",\"source\":\"I applied for a job. It was in a library.\",\"instruction\":\"Empieza por «The job I…»\",\"answers\":[\"The job I applied for was in a library\",\"The job I applied for was in a library.\",\"The job that I applied for was in a library\"],\"translation\":\"El trabajo al que me presenté era en una biblioteca.\",\"hints\":[\"El relativo se puede quitar entero\",\"The job I applied ... was in a library\"],\"itemIds\":[\"enb1m2jobiappliedfor\",\"enb1m2applyfor\"],\"tip\":\"«for» se queda flotando delante de «was» y parece un error. No lo es: es la marca de que la frase está bien construida.\"},{\"id\":\"enb1m2l3e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «earn»\",\"source\":\"the money I earn\",\"forbid\":[\"earn\"],\"answers\":[\"the money I get\",\"the money I make\",\"my income\",\"what they pay me\"],\"translation\":\"el dinero que gano\",\"hints\":[\"Con «make» también se dice\",\"the money I m...\"],\"itemIds\":[\"enb1m2moneyiearn\",\"enb1m2income\"],\"tip\":\"«make money» y «earn money» no son lo mismo para un nativo: «earn» es lo que te pagan por trabajar; «make» incluye lo que ganas de cualquier forma. En una entrevista, «earn».\"},{\"id\":\"enb1m2l3e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Es el mejor trabajo que he tenido nunca.\",\"answers\":[\"It's the best job I've ever had\",\"It is the best job I have ever had\",\"It's the best job I have ever had\",\"It's the best job that I've ever had\"],\"hint\":\"Detrás de «the best» el relativo desaparece\",\"itemIds\":[\"enb1m2bestjobiveever\"],\"tip\":\"Tres cosas de B1 en siete palabras: superlativo, relativo omitido y present perfect con «ever». Si te sale sola, el nivel está.\"},{\"id\":\"enb1m2l3e10\",\"type\":\"gapbank\",\"prompt\":\"Completa la preposición de cada final de frase\",\"text\":\"That's the flat I used to live ___. Here's the form I told you ___, and this is the job I applied ___. The people I work ___ are all students.\",\"answers\":[\"in\",\"about\",\"for\",\"with\"],\"bank\":[\"in\",\"about\",\"for\",\"with\",\"to\",\"on\"],\"translation\":\"Ese es el piso en el que vivía. Aquí está el formulario del que te hablé, y este es el trabajo al que me presenté. La gente con la que trabajo
