your message!\",\"Yes, I can come to your party on Saturday.\",\"I like pizza and chocolate cake.\",\"I can come at half past six.\",\"Write back soon! Valeria\"],\"translation\":\"Querida Amy: ¡gracias por tu mensaje! Sí, puedo ir a tu fiesta el sábado. Me gustan la pizza y la tarta de chocolate. Puedo llegar a las seis y media. ¡Contesta pronto! Valeria\",\"hints\":[\"Saludo → punto 1 (¿vas?) → punto 2 (comida) → punto 3 (hora) → despedida\",\"Los puntos se responden EN ORDEN\"],\"itemIds\":[\"endearamy\",\"enwriteback\"],\"tip\":\"Responder los puntos en el orden del input organiza el texto solo — y la organización puntúa.\"},{\"id\":\"ena1m12l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa la disculpa\",\"text\":\"I'm sorry, I ___ come on Friday.\",\"answers\":[\"can't\",\"cannot\"],\"translation\":\"Lo siento, no puedo ir el viernes.\",\"hints\":[\"El «no puedo» de siempre\",\"c-a-n-'-t\"],\"itemIds\":[\"ensorryicant\"]},{\"id\":\"ena1m12l8e5\",\"type\":\"bucket\",\"prompt\":\"Count your words: ¿dentro o fuera del rango?\",\"categories\":[\"✓ dentro de 30-50\",\"✗ fuera de rango\"],\"items\":[{\"text\":\"35 palabras\",\"bucket\":0},{\"text\":\"28 palabras\",\"bucket\":1},{\"text\":\"42 palabras\",\"bucket\":0},{\"text\":\"55 palabras\",\"bucket\":1},{\"text\":\"31 palabras\",\"bucket\":0},{\"text\":\"12 palabras\",\"bucket\":1}],\"itemIds\":[\"encountyourwords\"],\"tip\":\"Corto no cumple; largo cría errores y roba tiempo. 35-45 es tu zona: cuenta SIEMPRE antes de entregar.\"},{\"id\":\"ena1m12l8e6\",\"type\":\"transform\",\"prompt\":\"Vacuna: el «no puedo» sin calco\",\"source\":\"I no can come to the party.\",\"instruction\":\"Corrígela — el «no puedo» inglés\",\"answers\":[\"I can't come to the party.\",\"I can't come to the party\",\"I cannot come to the party.\"],\"translation\":\"No puedo ir a la fiesta.\",\"hints\":[\"can + not se funden\",\"can't\"],\"itemIds\":[\"ensorryicant\"],\"tip\":\"«no can» es calco puro: la negación vive DENTRO de can't. En tu Tarea 2 de hoy lo escribes bien.\"},{\"id\":\"ena1m12l8e7\",\"type\":\"match\",\"prompt\":\"Las funciones del baremo y sus fórmulas — repaso final\",\"pairs\":[{\"target\":\"Do you want to come?\",\"source\":\"invitar\"},{\"target\":\"Thank you for the present!\",\"source\":\"agradecer\"},{\"target\":\"Sorry, I can't come.\",\"source\":\"disculparse\"},{\"target\":\"The party is at seven.\",\"source\":\"informar\"},{\"target\":\"Can you bring a cake?\",\"source\":\"pedir\"}],\"itemIds\":[\"enthankyoufortheinvitation\",\"ensorryicant\",\"eninvite\"],\"tip\":\"Cinco funciones, cinco fórmulas del curso: el Writing entero cabe en esta tabla.\"},{\"id\":\"ena1m12l8e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige — la edad, tal y como la pide el examen\",\"wrong\":\"I have 25 years.\",\"answers\":[\"I am 25 years old.\",\"I'm 25 years old.\",\"I am 25 years old\",\"I'm 25 years old.\"],\"why\":\"La edad va con be, no con have: I AM 25 years OLD. El «tengo» español se cuela en la primera línea de casi todas las presentaciones.\",\"translation\":\"Tengo 25 años.\",\"hints\":[\"No es el verbo tener\",\"I ___ 25 years ___ .\"],\"itemIds\":[\"enimtwentyfive\",\"enyearsold\"]},{\"id\":\"ena1m12l8e11\",\"type\":\"gapbank\",\"prompt\":\"Monta la plantilla del email — apertura, cuerpo y cierre\",\"text\":\"___ Amy, thank you for the invitation! I'd love to come on Saturday. What time is the party? And can I ___ a friend? See you ___ ! Best ___ , Valeria\",\"answers\":[\"Dear\",\"bring\",\"soon\",\"wishes\"],\"bank\":[\"Dear\",\"bring\",\"soon\",\"wishes\",\"Best\",\"write\"],\"translation\":\"Querida Amy: ¡gracias por la invitación! Me encantaría ir el sábado. ¿A qué hora es la fiesta? ¿Y puedo llevar a un amigo? ¡Hasta pronto! Un saludo, Valeria\",\"itemIds\":[\"endearamy\",\"enbestwishes\",\"enthankyoufortheinvitation\",\"enseeyousoon\",\"enbringafriend\"],\"tip\":\"Apertura y cierre son puntos regalados: Dear + nombre arriba, Best wishes + tu nombre abajo. Escríbelos ANTES de pensar el contenido y ya llevas dos funciones hechas.\"},{\"id\":\"ena1m12l8e8\",\"type\":\"write\",\"prompt\":\"TAREA 1 en condiciones: responde el email de Amy (3 puntos)\",\"scenario\":\"Tarea 1, con reloj mental: Amy te escribe — «Hi! My birthday party is on Saturday at my flat. Can you come? What food do you like? And what time can you come?». Responde su email contestando LOS TRES puntos.\",\"bullets\":[\"Dile que sí vas (Yes, I can come… / I'd love to…)\",\"Dile qué comida te gusta (I like…)\",\"Dile a qué hora llegas (at + hora)\"],\"checks\":[{\"re\":\"(yes|i can come|i'?d love to|i want to come)\",\"label\":\"confirmas que vas\"},{\"re\":\"i (like|love)\",\"label\":\"la comida que te gusta\"},{\"re\":\"at (one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|half|quarter|\\\\d)\",\"label\":\"la hora de llegada\"}],\"minWords\":30,\"maxWords\":50,\"model\":\"Dear Amy, thank you for your message! Yes, I can come to your party on Saturday — I'd love to! I like pizza and chocolate cake. I can come at half past six after work. Write back soon! Valeria\",\"itemIds\":[\"endearamy\",\"enmessage\",\"enwriteback\"],\"tip\":\"Los tres puntos, en orden, con saludo y despedida: la Tarea 1 puntúa cumplimiento antes que perfección.\"},{\"id\":\"ena1m12l8e9\",\"type\":\"write\",\"prompt\":\"TAREA 2 en condiciones: la postal de 2 funciones — cierre\",\"scenario\":\"Tarea 2, la última: escribe una postal a Nora — dale las gracias por el regalo de cumpleaños y discúlpate: no puedes ir a su cena del viernes.\",\"bullets\":[\"Dale las gracias por el regalo (Thank you for…)\",\"Discúlpate: no puedes ir el viernes (Sorry… I can't…)\"],\"checks\":[{\"re\":\"thank(s| you) for\",\"label\":\"agradecer\"},{\"re\":\"(sorry|can'?t|cannot)\",\"label\":\"disculparte\"}],\"minWords\":30,\"maxWords\":50,\"model\":\"Dear Nora, thank you for the birthday present — I love the blue bag! But I'm sorry: I can't come to your dinner on Friday. I'm working late. Maybe another time? Best wishes, Valeria\",\"itemIds\":[\"enbirthdaypresent\",\"enbestwishes\",\"ensorryicant\",\"enanothertime\"],\"tip\":\"Dos funciones + plantilla + 30-50 palabras: exactamente el texto que aprueba. Ya has escrito los DOS del examen.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m12-4\",\"book\":\"Best wishes,\",\"real\":\"See you soon! xx\",\"meaning\":\"las equis son besos — la firma informal de los mensajes británicos\",\"when\":\"En mensajes y postales entre amigos: x = un beso, xx = dos. En el EXAMEN, jamás: Best wishes y tu nombre.\",\"register\":\"amigos\",\"note\":\"una x por beso: x, xx, xxx — cuantas más equis, más cariño\",\"sound\":\"kis, kis (no se leen: se ven)\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"British Council — A1 Writing\",\"url\":\"https://learnenglish.britishcouncil.org/skills/writing/a1-writing\",\"note\":\"Un texto de 30-50 palabras al día hasta el examen: cronómetro, contador y tus tres trampas repasadas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-st
