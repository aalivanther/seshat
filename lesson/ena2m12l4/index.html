b\u003e y lo de \u003cb\u003edespués\u003c/b\u003e de cada hueco: la pista casi nunca está en el hueco, está en el pegamento —\u003ci\u003ebut\u003c/i\u003e, \u003ci\u003eso\u003c/i\u003e, \u003ci\u003ebecause\u003c/i\u003e, \u003ci\u003ethen\u003c/i\u003e— y en de quién o de qué se venía hablando. Empieza por los huecos que tengas clarísimos y deja los dudosos para el final: cada acierto quita una opción de la mesa."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l4\",\"phaseId\":\"ena2m12\",\"title\":\"Reading: tasks 1 and 2\",\"subtitle\":\"Seis textos con un hueco, y el texto roto con una frase de sobra\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit del papel\",\"itemIds\":[\"ena2m12thenotice\",\"ena2m12theleaflet\",\"ena2m12theextrasentence\",\"ena2m12theparagraph\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tarea 1: seis huecos sueltos · Tarea 2: seis frases y una de más\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l4e1\",\"type\":\"mc\",\"prompt\":\"Tarea 1, tal cual: el aviso de la biblioteca\",\"question\":\"«Please do not ___ food or drink into the library.»\",\"options\":[\"bring\",\"brings\",\"bringing\"],\"answer\":0,\"whyWrong\":[null,\"Tras do not el verbo va desnudo, sin -s: es la misma regla que I don't work\",\"El -ing necesita un be delante, y aquí no hay ninguno\"],\"itemIds\":[\"ena2m12thenotice\",\"ena2m7donotenter\"],\"tip\":\"La Tarea 1 va a por reglas que ya tienes: auxiliar + verbo desnudo, la -s de tercera persona, is/are con there.\"},{\"id\":\"ena2m12l4e2\",\"type\":\"mc\",\"prompt\":\"Tarea 1, tal cual: el cartel de la estación\",\"question\":\"«Tickets ___ be shown at the barrier.»\",\"options\":[\"must\",\"have\",\"should\"],\"answer\":0,\"whyWrong\":[null,\"have necesita to detrás (have to be shown) — y no está\",\"should es correcto en inglés, pero es consejo, no norma… y además está en la columna B1: en un cartel el examen pone must\"],\"itemIds\":[\"ena2m7passengersmustshow\",\"ena2m12thenotice\"],\"tip\":\"La lengua de los carteles es must y mustn't. Si el texto es una norma escrita, apuesta por must.\"},{\"id\":\"ena2m12l4e3\",\"type\":\"mc\",\"prompt\":\"Tarea 1, tal cual: la etiqueta de las rebajas\",\"question\":\"«SALE! All winter jackets ___ than last month.»\",\"options\":[\"cheaper\",\"cheap\",\"the cheapest\"],\"answer\":0,\"whyWrong\":[null,\"than pide comparativo: sin -er la frase se queda coja\",\"El superlativo no admite than: sería the cheapest in the shop\"],\"itemIds\":[\"ena2m4cheaperthan\",\"ena2m4than\"],\"tip\":\"than es una señal luminosa: donde hay than, hay -er o more. Sin than, mira si hay the delante.\"},{\"id\":\"ena2m12l4e4\",\"type\":\"mc\",\"prompt\":\"Tarea 1, tal cual: la nota de la nevera\",\"question\":\"«There isn't ___ milk left — please buy some.»\",\"options\":[\"much\",\"many\",\"a lot\"],\"answer\":0,\"whyWrong\":[null,\"many va con contables en plural: many bottles, no many milk\",\"a lot necesita of delante del sustantivo, y en negativa el inglés prefiere much\"],\"itemIds\":[\"ena2m5thereisntmuchmilk\",\"ena2m4nomilkleft\"],\"tip\":\"milk no se cuenta: much en negativa y pregunta, a lot of en afirmativa. Tu módulo 5, en modo examen.\"},{\"id\":\"ena2m12l4e5\",\"type\":\"mc\",\"prompt\":\"Tarea 2: la trampa del nivel\",\"question\":\"En la Tarea 2 hay seis huecos y siete opciones. ¿Qué pasa con la séptima?\",\"options\":[\"Sobra, y está escrita para parecer la correcta\",\"Vale para dos huecos distintos\",\"Es un error de imprenta: se ignora\"],\"answer\":0,\"whyWrong\":[null,\"Cada hueco tiene UNA sola respuesta correcta\",\"Está puesta a propósito: es el distractor del ejercicio\"],\"itemIds\":[\"ena2m12theextrasentence\"],\"tip\":\"Que sobre una es una buena noticia: si te cuadran seis, la séptima se cae sola. Coloca primero las seguras.\"},{\"id\":\"ena2m12l4e6\",\"type\":\"gapbank\",\"prompt\":\"Tarea 2, en versión corta: el pegamento del texto\",\"text\":\"Last summer I went to Brighton with Amy. ___ we arrived, we left our bags at the hotel. It was very hot, ___ we went straight to the beach. We wanted to swim, ___ the water was really cold. ___ the end, we just walked along the beach and had an ice cream.\",\"answers\":[\"When\",\"so\",\"but\",\"In\"],\"bank\":[\"When\",\"so\",\"but\",\"In\",\"because\",\"After\"],\"translation\":\"El verano pasado fui a Brighton con Amy. Cuando llegamos, dejamos las maletas en el hotel. Hacía mucho calor, así que nos fuimos derechas a la playa. Queríamos bañarnos, pero el agua estaba helada. Al final, solo paseamos por la playa y nos tomamos un helado.\",\"itemIds\":[\"ena2m2soiwalked\",\"ena2m2becauseimissedthebus\",\"ena2m2intheend\",\"ena2m6whenigetthere\"],\"tip\":\"Los conectores son lo que la Tarea 2 mide de verdad. so mira hacia delante (consecuencia), because mira hacia atrás (causa), but gira.\"},{\"id\":\"ena2m12l4e7\",\"type\":\"order\",\"prompt\":\"Tarea 2, tal cual: recoloca el texto de la clase de inglés\",\"sentences\":[\"Last September I started an English course near my flat.\",\"At first I didn't say anything in class, because I was very shy.\",\"Then the teacher asked us to work in pairs, and everything changed.\",\"After a few weeks I made two good friends there.\",\"In the end, the course was the best thing I did last year.\"],\"translation\":\"En septiembre empecé un curso de inglés cerca de casa. Al principio no decía nada en clase, porque era muy tímida. Luego la profesora nos puso a trabajar por parejas y todo cambió. A las pocas semanas hice allí dos buenas amigas. Al final, el curso fue lo mejor que hice el año pasado.\",\"hints\":[\"Empieza por cuándo empezó todo\",\"At first… → Then… → After a few weeks… → In the end…\"],\"itemIds\":[\"ena2m2firstofall\",\"ena2m2afterthat\",\"ena2m2intheend\",\"ena2m10acourse\"],\"tip\":\"El orden no lo marca la lógica: lo marcan las palabras de tiempo. Subráyalas y el texto se coloca solo.\"},{\"id\":\"ena2m12l4e8\",\"type\":\"mc\",\"prompt\":\"Tarea 2: elige la frase que falta\",\"question\":\"«We arrived at the station at ten to eight. ___ We waited on platform four for twenty minutes.»\",\"options\":[\"The train was late again.\",\"The hotel was very comfortable.\",\"I bought a jacket in the sale.\"],\"answer\":0,\"whyWrong\":[null,\"El hotel no pinta nada entre la estación y el andén\",\"Las rebajas no explican por qué se espera veinte minutos\"],\"itemIds\":[\"ena2m12theextrasentence\",\"ena2m6platformfour\"],\"tip\":\"Lee lo de ANTES y lo de DESPUÉS. La frase buena explica el salto entre las dos: llegan pronto pero esperan mucho.\"},{\"id\":\"ena2m12l4e9\",\"type\":\"cloze\",\"prompt\":\"Completa la regla de la Tarea 2\",\"text\":\"In Task 2 there are seven options, so there is always one ___ sentence.\",\"answers\":[\"extra\"],\"translation\":\"En la Tarea 2 hay siete opciones, así que siempre sobra una frase.\",\"hints\":[\"La que sobra\",\"one ex… sentence\"],\"itemIds\":[\"ena2m12theextrasentence\"]},{\"id\":\"ena2m12l4e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige — el aviso habla en tercera persona\",\"wrong\":\"The notice on the door say the shop is closed.\",\"answers\":[\"The notice on the door says the shop is closed.\",\"The notice on the door says the shop is closed\"],\"why\":\"El sujeto es the notice, no the door: singular, y el verbo lleva -s. Cuando entre el sujeto y el verbo se cuela un complemento largo, el español se despista y el inglés no perdona — y la Tarea 1 vive de esto.\",\"translation\":\"El aviso de la puerta dice que la tienda está cerrada.\",\"hints\":[\"¿Quién dice? No la puerta\",\"The notice… say___\"],\"itemIds\":[\"ena2m12thenotice\"]},{\"id\":\"ena2m12l4e11\",\"type\":\"fastmatch\",\"prompt\":\"Carteles en ráfaga — los que caen en la Tarea 1\",\"pairs\":[{\"target\":\"No smoking\",\"source\":\"prohibido fumar\"},{\"target\":\"Out of order\",\"source\":\"no funciona\"},{\"target\":\"Staff only\",\"source\":\"solo personal\"},{\"target\":\"Do not enter\",\"source\":\"prohibido el paso\"},{\"target\":\"Push / Pull\",\"source\":\"empujar / tirar\"}],\"targetSeconds\":30,\"itemIds\":[\"ena2m7nosmoking\",\"ena2m7outoforder\",\"ena2m7staffonly\",\"ena2m7donotenter\",\"ena2m7pushpull\"],\"tip\":\"Estos cinco carteles llevan once módulos contigo. En el examen se leen sin pensar: eso es fluidez, y también puntúa.\"},{\"id\":\"ena2m12l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El aviso dice que la tienda cierra a las seis.\",\"answers\":[\"The notice says the shop closes at six.\",\"The notice says the shop closes at six\",\"The notice says that the shop closes at six.\"],\"hints\":[\"the notice + says…\",\"…the shop closes at six.\"],\"itemIds\":[\"ena2m12thenotice\"],\"tip\":\"Dos terceras personas en la misma frase (says, closes). Si te comes una -s en el examen, te la cuentan.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m12-4\",\"book\":\"The shop is closed today.\",\"real\":\"We're shut.\",\"meaning\":\"Está cerrado — lo que dice el tendero, no el cartel\",\"when\":\"En la puerta de una tienda, dicho por una persona. El cartel escribe CLOSED; la persona dice we're shut. En el examen lo leerás como closed y lo oirás como shut: son la misma cosa.\",\"register\":\"neutral\",\"note\":\"shut es más de boca que de papel: en carteles y avisos escritos casi siempre pone closed.\",\"sound\":\"uía SHAT\",\"level\":\"a2\",\"itemId\":\"ena2m12thenotice\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp4
