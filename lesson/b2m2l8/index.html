"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T42c,Zu dem Beitrag von Tina K. möchte ich Folgendes sagen: Zwar stimmt, dass samstags in der Küche unter Zeitdruck gearbeitet wird. Allerdings ist «wer nicht will, kann gehen» keine Lösung, sondern eine Drohung. Ein Vorteil der Mitbestimmung ist, dass Überstunden ausgeglichen werden müssen und nicht stillschweigend angeordnet. Ein Nachteil ist, dass Absprachen Zeit kosten, die am Herd fehlt. Deshalb sollte jeder Dienstplan vorgelegt werden, bevor er gilt, und eine Betriebsvereinbarung geschlossen werden. Außerdem lässt sich die Vertretung klären, wenn man früh Bescheid sagt. Pausenregelung, Zuschlag und Ruhetag sind keine Geschenke: sie sind Arbeitsschutz. Wo ein Betriebsrat sitzt, wird das so gehandhabt — und so sollte es auch ohne ihn gehandhabt werden. Nur dann bleibt eine Vollzeitstelle machbar, ohne dass jemand in der Probezeit gekündigt worden ist. Eine Betriebsversammlung kann das klären; ein Personalgespräch allein nicht. Deshalb plädiere ich für vorgelegte Pläne, sichtbaren Ausgleich und einen Ruhetag, der nicht gestrichen wird."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m2l8\",\"phaseId\":\"b2m2\",\"title\":\"Schreiben ohne Anklage\",\"subtitle\":\"Dos textos: Nachricht an den Chef (~100) y foro (~150)\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Reclamar sin acusar\",\"itemIds\":[\"b2m2anweisung\",\"b2m2sachlichbleiben\",\"b2m2hiermit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la pasiva es cortesía\",\"body\":\"Reclamar en B2 no es acusar. \u003ci\u003eSie haben den Plan nicht vorgelegt\u003c/i\u003e señala con el dedo. \u003ci\u003eDer Plan ist uns nicht vorgelegt worden\u003c/i\u003e describe el hueco. El dativo (\u003ci\u003euns\u003c/i\u003e) nombra a quien le pasa; el nominativo de usted desaparece.\u003cbr/\u003e\u003cbr/\u003eAufgabe 2 (~100, Sie, Anrede y Gruß): puntos en orden, sin «du», sin «halt». Aufgabe 1 (~150, foro): intro, ventaja e inconveniente, propuesta, cierre.\u003cbr/\u003e\u003cbr/\u003eFórmula de apertura formal: \u003cb\u003eHiermit teile ich Ihnen mit, dass …\u003c/b\u003e No es frío: es el traje.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m2l8e1\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Hiermit teile ich dir mit, dass der Plan geändert wird.\",\"answers\":[\"Hiermit teile ich Ihnen mit, dass der Plan geändert wird.\"],\"why\":\"Hiermit es fórmula de Sie. «dir» es fuga de registro: en un mensaje al jefe, Ihnen.\",\"translation\":\"Por la presente le comunico que se cambia el cuadrante.\",\"itemIds\":[\"b2m2hiermit\",\"b2m2dienstplan\"]},{\"id\":\"b2m2l8e2\",\"type\":\"gapbank\",\"prompt\":\"Completa el borrador formal\",\"text\":\"Hiermit teile ich ___ mit, dass der Dienstplan uns nicht vorgelegt ___ ist. Eine Betriebsvereinbarung ___ geschlossen werden, bevor er gilt.\",\"answers\":[\"Ihnen\",\"worden\",\"muss\"],\"bank\":[\"Ihnen\",\"worden\",\"muss\",\"dir\",\"geworden\",\"kann\",\"hat\"],\"translation\":\"Por la presente le comunico que no se nos ha presentado el cuadrante. Hay que cerrar un acuerdo de empresa antes de que valga.\",\"itemIds\":[\"b2m2hiermit\",\"b2m2dienstplan\",\"b2m2betriebsvereinbarung\"]},{\"id\":\"b2m2l8e3\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Nachricht an Herrn Brandt. Sie sostenido.\",\"scenario\":\"Eres Nico. El nuevo cuadrante se ha colgado sin pasar por el comité. Escribe a tu jefe, Herr Brandt, de Sie. Trata LOS TRES puntos.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Comunica el hecho en pasiva, sin acusarlo: el plan no se nos ha presentado.\",\"Pide que se cierre una Betriebsvereinbarung y que las horas extra se compensen.\",\"Propón una fecha para hablarlo y cierra con Grußformel.\"],\"checks\":[{\"re\":\"(worden|vorgelegt|geändert worden)\",\"label\":\"describes el hecho en pasiva\"},{\"re\":\"(Betriebsvereinbarung|Mitbestimmung|ausgeglichen|Ausgleich)\",\"label\":\"pides acuerdo o compensación\"},{\"re\":\"(Termin|sprechen|Montag|Woche)\",\"label\":\"propones un momento para hablarlo\"}],\"frame\":[\"Anrede: «Sehr geehrter Herr Brandt,»\",\"Hiermit teile ich Ihnen mit, dass … worden ist.\",\"Eine Betriebsvereinbarung muss geschlossen werden, …\",\"Überstunden müssen ausgeglichen werden.\",\"Könnten wir am Montag …?\",\"Mit freundlichen Grüßen + Nico\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"bevor\",\"weil\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":90,\"maxWords\":120,\"model\":\"Sehr geehrter Herr Brandt,\\nhiermit teile ich Ihnen mit, dass der neue Dienstplan uns nicht vorgelegt worden ist. Eine Betriebsvereinbarung muss geschlossen werden, bevor ein Plan mit zusätzlichen Samstagen gilt. Außerdem müssen Überstunden ausgeglichen werden und nicht einfach angeordnet. Die Pausenregelung und der Zuschlag für Nachtarbeit stehen im Tarifvertrag; beides ist einzuhalten. Deshalb bitte ich Sie um einen kurzen Termin am Montag, damit Vertretung, Einarbeitung und Urlaubsplanung sachlich geklärt werden können. Ich bleibe der Sache wegen gerne erreichbar und bitte um eine kurze schriftliche Rückmeldung von Ihnen.\\nMit freundlichen Grüßen\\nNico\",\"itemIds\":[\"b2m2hiermit\",\"b2m2dienstplan\",\"b2m2betriebsvereinbarung\",\"b2m2ausgleich\",\"b2m2vertretung\",\"b2m2sachlichbleiben\",\"b2m2pausenregelung\",\"b2m2zuschlag\",\"b2m2nachtarbeit\",\"b2m2urlaubsplanung\"]},{\"id\":\"b2m2l8e4\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag sobre turnos y horas extra.\",\"scenario\":\"En un foro de hostelería alguien afirma que los cuadrantes los decide solo el jefe. Escribe un comentario: concede, da ventaja e inconveniente, propón una regla y cierra. Usa pasiva o Ersatz, no solo man.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Tina K.\",\"text\":\"In der Gastronomie entscheidet der Chef den Plan, Punkt. Mitbestimmung klingt gut, hält aber den Samstag nicht frei. Wer nicht will, kann gehen.\"},\"bullets\":[\"Reacciona a Tina: concede la presión del sábado y marca dónde no estás de acuerdo.\",\"Da una ventaja y un inconveniente de la Mitbestimmung en hostelería.\",\"Propón una regla concreta (presentar el plan, Ausgleich) y cierra.\"],\"checks\":[{\"re\":\"(zwar|allerdings|stimme|verstehe)\",\"label\":\"concedas algo\"},{\"re\":\"(Vorteil|Nachteil|einerseits|andererseits)\",\"label\":\"hay ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|würde|Vorschlag|müssen)\",\"label\":\"hay una propuesta\"}],\"frame\":[\"«Zu dem Beitrag von Tina K. …»\",\"Zwar … Allerdings …\",\"Ein Vorteil / Ein Nachteil\",\"Ein Dienstplan sollte vorgelegt werden, bevor er gilt.\",\"Deshalb …\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"bevor\",\"außerdem\",\"weil\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"$17\",\"itemIds\":[\"b2m2mitbestimmung\",\"b2m2ausgleich\",\"b2m2betriebsvereinbarung\",\"b2m2gehandhabt\",\"b2m2sichlassen\",\"b1m2ueberstunden\",\"b2m2arbeitsschutz\",\"b2m2ruhetag\",\"b2m2vollzeitstelle\",\"b2m2betriebsversammlung\"]},{\"id\":\"b2m2l8extra1\",\"type\":\"write\",\"prompt\":\"Aufgabe 2 · Nachricht Sie. Off-topic = 0.\",\"scenario\":\"Eres Nico. El cuadrante nuevo «ist aufgehängt» desde el lunes, pero nadie ha dicho quién lo decidió. Escribes a Herr Brandt, Sie: distingue estado y proceso, pide que se aclare el procedimiento hasta el viernes.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"bullets\":[\"Nombra el motivo en la primera frase, con Sie.\",\"Pide una acción concreta y un plazo.\",\"Cierra con Grußformel.\"],\"checks\":[{\"re\":\"(Sehr geehrte|Guten Tag)\",\"label\":\"hay Anrede\"},{\" \":\"hay propuesta\"}],\"frame\":[\"Apertura\",\"concesión\",\"pro/contra\",\"propuesta\",\"cierre\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Kai Bergmann möchte ich Folgendes sagen: Zwar stimmt, dass eine pasiva sin agente puede verstecken, wer unterschreibt. Allerdings ist «es wird entschieden» in einem Quadranten oft das Verfahren selbst, nicht die Ausrede. Ein Vorteil der unpersönlichen Form ist, dass die Regel für alle gilt, nicht nur für den, der Dienst hat. Ein Nachteil ist, dass man den Betriebsrat nicht findet, wenn etwas schiefläuft. Deshalb sollte hinter jeder Entscheidung stehen, durch wen sie getroffen wurde, wenigstens intern. Außerdem müsste der Aushang sagen, bis wann man widersprechen kann. Ich plädiere dafür, den Vorgang zu nennen und den Zustand nicht mit dem Verfahren zu verwechseln, weil sonst die Küche den Zettel liest und niemanden fragen kann. Nur so bleibt die Sache nachvollziehbar. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll.\",\"itemIds\":[],\"tip\":\"150 palabras: intro, concesión, dos argumentos, propuesta, cierre. Off-topic = 0.\"},{\"id\":\"b2m2l8exd1\",\"type\":\"errorfix\",\"prompt\":\"Estado, no proceso.\",\"wrong\":\"Die Küche wird seit Montag geöffnet.\",\"answers\":[\"Die Küche ist seit Montag geöffnet.\"],\"why\":\"Seit Montag es estado: sein + P II, no werden. Werden es el arreglo en curso.\",\"translation\":\"La cocina está abierta desde el lunes.\",\"itemIds\":[]},{\"id\":\"b2m2l8exd2\",\"type\":\"transform\",\"prompt\":\"Ponlo en pasiva de proceso.\",\"source\":\"Man klärt die Vertretung morgen.\",\"instruction\":\"Pasiva con werden.\",\"answers\":[\"Die Vertretung wird
