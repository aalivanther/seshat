 Likewise, de similarly. Elige uno por párrafo.\"},{\"id\":\"enb2m8l8e2\",\"type\":\"cloze\",\"prompt\":\"Completa el cierre que no copia\",\"text\":\"To sum ___, neither side is entirely right.\",\"answers\":[\"up\"],\"translation\":\"En resumen, ninguno de los dos bandos tiene del todo razón.\",\"hints\":[\"La partícula de sum u-p\",\"u...\"],\"itemIds\":[\"enb2m8tosumup\",\"enb2m8neithernor\"],\"tip\":\"To sum up + una frase que NO esté en el párrafo 1. Si tu cierre es la tesis otra vez, no has evaluado.\"},{\"id\":\"enb2m8l8e3\",\"type\":\"write\",\"prompt\":\"El ensayo largo. 150-200. Tesis, a favor, concesión + en contra, cierre con condición. No es el Writing 2 de LanguageCert, y lo sabes.\",\"scenario\":\"La misma pregunta del boletín, ahora a 150-200: «Should the council replace parking on this street with a bike lane?» Ensayo for-and-against. Recuerda: LanguageCert Writing 2 no te va a pedir esto. Se escribe porque el descriptor de tu nivel sí. Tesis sin yo. Concesión. Cierre que ponga una condición (provided that / as long as / once), no que copie el primer párrafo.\",\"genre\":\"essay\",\"bullets\":[\"Tesis: It could be argued / The question is whether — sin In my opinion como herramienta.\",\"A favor con ejemplo, en contra CON Admittedly/Granted/It is true that + Nevertheless/All the same.\",\"Cierre To sum up / All things considered, sin copiar la tesis.\",\"El cierre pone una condición (provided that / as long as / once / unless).\"],\"checks\":[{\"re\":\"(it could be argued|the question is whether|whereas|in terms of)\",\"label\":\"Hay tesis o criterio sin «yo creo» como herramienta\"},{\"re\":\"(admittedly|granted|it is true that|nevertheless|all the same|even so)\",\"label\":\"Hay concesión\"},{\"re\":\"(to sum up|all things considered|on balance|in conclusion)\",\"label\":\"Hay cierre de ensayo\"},{\"re\":\"(provided that|as long as|once |unless )\",\"label\":\"El cierre pone una condición, no copia la tesis\"}],\"frame\":[\"Tesis + in terms of…\",\"To begin with / For a start — a favor, con dato\",\"Admittedly… Nevertheless… — buses, Nora, the corner\",\"Similarly / likewise — un distrito que sí dejó una parada\",\"To sum up + provided that / as long as…\"],\"requireConnectors\":{\"min\":4,\"bank\":[\"whereas\",\"admittedly\",\"nevertheless\",\"to begin with\",\"to sum up\",\"in terms of\",\"similarly\",\"even if\",\"provided that\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"In terms of air quality, it could be argued that a bike lane on Palmer Road is overdue, whereas the current drawing treats the 29 as if it were a car. To begin with, emissions at the lights are the worst in the ward, and a lane would cut the school run that sits there with engines on. Admittedly, the air would improve. Nevertheless, due to the fact that the road is narrow, not only is the corner slower, but it is also less safe if the bus has nowhere to pass. Similarly, the next ward tried a lane and kept one stop; the air improved and the timetable did not collapse. Granted, parking is not a human right. All the same, Nora cannot walk to the next stop. To sum up, neither side is entirely right. Build the lane provided that one stop and one passing place stay; once they go, you cannot put them back overnight.\",\"itemIds\":[\"enb2m8intermsof\",\"enb2m8itcouldbearguedthat\",\"enb2m8whereas\",\"enb2m8tobeginwith\",\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8similarly\",\"enb2m8granted\",\"enb2m8allthesame\",\"enb2m8tosumup\",\"enb1m9providedthat\",\"enb2m8once\"],\"tip\":\"Cuenta las concesiones (admittedly, granted, all the same) y la condición del cierre (provided that, once). Si el último párrafo es el primero con To sum up delante, no has evaluado: has listado.\"},{\"id\":\"enb2m8l8e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el cierre — moreover/furthermore no están\",\"text\":\"To begin ___, the street is too narrow. ___ , the next ward kept a stop. In terms ___ air quality the lights are the worst. To sum ___, neither side is entirely right.\",\"answers\":[\"with\",\"Similarly\",\"of\",\"up\"],\"bank\":[\"with\",\"Similarly\",\"of\",\"up\",\"from\",\"However\",\"on\",\"down\"],\"translation\":\"Para empezar, la calle es demasiado estrecha. De modo similar, el distrito de al lado dejó una parada. En cuanto a la calidad del aire, el semáforo es el peor. En resumen, ninguno de los dos bandos tiene del todo razón.\",\"itemIds\":[\"enb2m8tobeginwith\",\"enb2m8similarly\",\"enb2m8intermsof\",\"enb2m8tosumup\"],\"tip\":\"However está de distractor de contraste: el hueco 2 es comparación, no giro. Likewise valdría en la vida y no está, para que produzcas similarly.\"},{\"id\":\"enb2m8l8e5\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En resumen, ninguno de los dos bandos tiene del todo razón.\",\"answers\":[\"To sum up, neither side is entirely right\",\"To sum up neither side is entirely right\",\"All things considered, neither side is entirely right\"],\"hints\":[\"To sum up + neither\",\"To sum up, neither side is entirely ...\"],\"itemIds\":[\"enb2m8tosumup\",\"enb2m8neithernor\",\"enb2m5allthingsconsidered\"],\"tip\":\"Esa frase es el módulo. Si tu ensayo no puede acabarla de verdad —si uno de los dos bandos, en tu cierre, ha desaparecido— has listado, no has argumentado.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}
