eWir haben uns gestritten\u003c/i\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l2e1\",\"type\":\"mc\",\"prompt\":\"El falso amigo del módulo\",\"question\":\"„Wir haben zwei Stunden diskutiert.“\",\"options\":[\"Estuvimos dos horas debatiendo\",\"Estuvimos dos horas peleándonos\",\"Estuvimos dos horas discutiendo a gritos\"],\"answer\":0,\"whyWrong\":[null,\"Pelearse es «sich streiten»\",\"Gritar sería «sich anschreien»\"],\"itemIds\":[\"b1m10diskutieren\",\"b1m10sichstreitenmit\"],\"tip\":\"diskutieren = debatir, con calma. El «discutir» español enfadado es sich streiten. Confundirlos cambia el tono entero de lo que cuentas.\"},{\"id\":\"b1m10l2e2\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"Ich ärgere mich jeden Abend ___ den Lärm im Treppenhaus.\",\"answers\":[\"über\"],\"translation\":\"Cada noche me enfado por el ruido de la escalera.\",\"hints\":[\"sich ärgern + preposición fija\",\"üb…\"],\"itemIds\":[\"b1m10sichaergernueber\",\"b1m1laerm\"]},{\"id\":\"b1m10l2e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco\",\"wrong\":\"Ich ärgere mich von meinem Mitbewohner.\",\"answers\":[\"Ich ärgere mich über meinen Mitbewohner.\"],\"why\":\"sich ärgern pide ÜBER + Akkusativ. Con «von» (dativo) suena a que el compañero te está fabricando el enfado desde fuera: en alemán no existe.\",\"translation\":\"Me enfado con mi compañero de piso.\",\"itemIds\":[\"b1m10sichaergernueber\",\"b1m10mitbewohner\"]},{\"id\":\"b1m10l2e4\",\"type\":\"match\",\"prompt\":\"Empareja verbo y preposición\",\"pairs\":[{\"target\":\"sich ärgern über\",\"source\":\"enfadarse por\"},{\"target\":\"sich streiten mit\",\"source\":\"pelearse con\"},{\"target\":\"Rücksicht nehmen auf\",\"source\":\"tener consideración con\"},{\"target\":\"sich entschuldigen bei\",\"source\":\"pedir perdón a\"}],\"itemIds\":[\"b1m10sichaergernueber\",\"b1m10sichstreitenmit\",\"b1m10ruecksichtnehmenauf\",\"b1m10sichentschuldigenbei\"]},{\"id\":\"b1m10l2e5\",\"type\":\"gapbank\",\"prompt\":\"Rellena la escena de la WG\",\"text\":\"In unserer WG gibt es jede Woche ___ ums Putzen. Meine Mitbewohnerin ärgert sich ___ das schmutzige Bad, und ich ärgere mich ___ den Lärm am Abend. Wir bräuchten endlich eine ___ Abmachung.\",\"answers\":[\"Streit\",\"über\",\"über\",\"klare\"],\"bank\":[\"Streit\",\"über\",\"klare\",\"Diskussion\",\"von\",\"klaren\",\"Lärm\",\"für\"],\"translation\":\"En nuestro piso compartido hay bronca por la limpieza cada semana. Mi compañera se enfada por el baño sucio y yo me enfado por el ruido de la noche. Necesitaríamos por fin un acuerdo claro.\",\"hints\":[\"La misma preposición dos veces\",\"«eine k-l-a-r-e Abmachung»: femenino acusativo tras eine → -e\"],\"itemIds\":[\"b1m10streitumsputzen\",\"b1m10sichaergernueber\",\"b1m10klareabmachung\",\"b1m1laerm\"],\"tip\":\"«bräuchten» es Konjunktiv II de brauchen: lo verás a fondo en la lección 3, aquí solo lo reconoces.\"},{\"id\":\"b1m10l2e6\",\"type\":\"build\",\"prompt\":\"Construye la petición del vecino\",\"target\":\"Bitte nehmen Sie mehr Rücksicht auf die Nachbarn\",\"translation\":\"Por favor, tengan más consideración con los vecinos\",\"distractors\":[\"für\",\"nimmst\"],\"itemIds\":[\"b1m10ruecksichtnehmenauf\"]},{\"id\":\"b1m10l2e7\",\"type\":\"bucket\",\"prompt\":\"¿Debate tranquilo o pelea?\",\"categories\":[\"diskutieren (debate)\",\"sich streiten (pelea)\"],\"items\":[{\"text\":\"„Wir haben sachlich über die Regeln gesprochen.“\",\"bucket\":0},{\"text\":\"„Sie hat die Tür zugeknallt und ist gegangen.“\",\"bucket\":1},{\"text\":\"„Jeder durfte seine Meinung sagen.“\",\"bucket\":0},{\"text\":\"„Am Ende hat keiner mehr zugehört und alle haben geschrien.“\",\"bucket\":1},{\"text\":\"„Wir haben Argumente ausgetauscht.“\",\"bucket\":0},{\"text\":\"„Seitdem reden wir nicht mehr miteinander.“\",\"bucket\":1}],\"itemIds\":[\"b1m10diskutieren\",\"b1m10sichstreitenmit\"],\"tip\":\"El alemán separa lo que el español mezcla en «discutir». Elegir mal el verbo cambia lo que el otro entiende de tu historia.\"},{\"id\":\"b1m10l2e8\",\"type\":\"listen\",\"prompt\":\"Escucha la queja del piso\",\"text\":\"Ich ärgere mich über den Lärm\",\"translation\":\"Me enfado por el ruido\",\"hints\":[\"sich ärgern über\",\"Ich ärgere mich über den …\"],\"itemIds\":[\"b1m10sichaergernueber\",\"b1m1laerm\"]},{\"id\":\"b1m10l2e9\",\"type\":\"transform\",\"prompt\":\"Del enfado a la petición\",\"source\":\"Ich ärgere mich über den Lärm am Abend.\",\"instruction\":\"Conviértelo en una petición cortés con «Könntest du …?»\",\"answers\":[\"Könntest du abends bitte leiser sein?\",\"Könntest du am Abend bitte leiser sein?\",\"Könntest du abends leiser sein?\"],\"translation\":\"¿Podrías hacer menos ruido por las noches?\",\"hints\":[\"Könntest du … leiser sein?\",\"El verbo va al final\"],\"itemIds\":[\"b1m10koenntestdu\",\"b1m1laerm\"],\"tip\":\"Decir el enfado no arregla nada; pedir el cambio sí. Ese giro es exactamente la habilidad social que evalúa el B1.\"},{\"id\":\"b1m10l2e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin acusar\",\"source\":\"Du machst nie sauber!\",\"forbid\":[\"nie\",\"Du\"],\"answers\":[\"Mir ist aufgefallen, dass die Küche oft schmutzig bleibt\",\"Mir ist aufgefallen, dass die Küche oft schmutzig ist\",\"Ich habe das Gefühl, dass die Küche oft schmutzig bleibt\",\"Ich habe das Gefühl, dass die Küche oft schmutzig ist\"],\"translation\":\"Me he dado cuenta de que la cocina se queda sucia a menudo.\",\"hints\":[\"Habla de ti, no del otro: «Mir ist aufgefallen, dass …»\",\"Cambia «nunca» por «a menudo»\"],\"itemIds\":[\"b1m10streitumsputzen\"],\"tip\":\"La regla de oro del conflicto en alemán (y en cualquier idioma): frases con «ich», no con «du». Suena a información, no a ataque.\"},{\"id\":\"b1m10l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me enfado por el ruido y me gustaría un acuerdo claro.\",\"answers\":[\"Ich ärgere mich über den Lärm und ich hätte gern eine klare Abmachung\",\"Ich ärgere mich über den Lärm und hätte gern eine klare Abmachung\",\"Ich ärgere mich über den Lärm und ich hätte gern eine klare Abmachung.\"],\"hints\":[\"sich ärgern über + Akkusativ\",\"… und hätte gern eine klar__ Abmachung\"],\"itemIds\":[\"b1m10sichaergernueber\",\"b1m1laerm\",\"b1m10klareabmachung\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m10-1\",\"book\":\"Das ist nicht so schlimm.\",\"real\":\"Passt schon.\",\"meaning\":\"No pasa nada / déjalo, está bien\",\"when\":\"Entre amigos y compañeros, cuando el otro se disculpa por algo pequeño. A un cliente, a tu casera o por escrito, jamás: suena a que despachas el asunto.\",\"register\":\"amigos\",\"exam\":\"Das ist kein Problem, machen Sie sich bitte keine Sorgen.\",\"note\":\"Con dos palabras cierras el tema y quitas hierro. Si aún estás molesto, no lo digas: «Passt schon» significa que ya está olvidado.\",\"sound\":\"past shon\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"a2m7natvpasstschon\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-
