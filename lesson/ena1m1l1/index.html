 un cristal. Nada de jota.\"},{\"id\":\"ena1m1l1e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Hola, soy Valeria. ¿Cómo te llamas?\",\"answers\":[\"Hello, I'm Valeria. What's your name?\",\"Hello! I'm Valeria. What's your name?\",\"Hi, I'm Valeria. What's your name?\",\"Hi! I'm Valeria. What's your name?\",\"Hi, I'm Valeria. What is your name?\",\"Hello, I'm Valeria. What is your name?\",\"Hello, I am Valeria. What is your name?\",\"Hello, I am Valeria. What's your name?\",\"Hi, I am Valeria. What is your name?\"],\"hints\":[\"Saludo + I'm + la pregunta del nombre\",\"Hello, I'm ... What's ...?\"],\"itemIds\":[\"enhello\",\"eniam\",\"enwhatsyourname\"],\"tip\":\"Con esta línea abres cualquier conversación — y la parte 1 del examen oral.\"},{\"id\":\"ena1m1l1e9\",\"type\":\"audiomc\",\"prompt\":\"Solo con el oído: ¿qué te preguntan?\",\"audio\":\"Hi! I'm Ben. What's your name?\",\"question\":\"¿Qué te pregunta Ben?\",\"options\":[\"Cómo te llamas\",\"Cómo estás\",\"De dónde eres\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «How are you?» — llega en la lección 3\",\"Eso sería «Where are you from?» — lección 4\"],\"itemIds\":[\"enwhatsyourname\",\"eniam\"],\"tip\":\"En la vida real la pregunta vuela una sola vez: caza el what's your name al vuelo y responde sin pensar.\"},{\"id\":\"ena1m1l1e10\",\"type\":\"transform\",\"prompt\":\"Transforma: dilo como la calle\",\"strictContractions\":true,\"source\":\"What is your name?\",\"instruction\":\"Dilo con la fusión\",\"answers\":[\"What's your name?\",\"What's your name\"],\"translation\":\"¿Cómo te llamas?\",\"hints\":[\"what is → what's\",\"What's your ...?\"],\"itemIds\":[\"enwhatsyourname\"],\"tip\":\"what is se funde en what's igual que I am en I'm: la calle contrae siempre que puede.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — inglés desde cero\",\"url\":\"https://www.bbc.co.uk/learningenglish\",\"note\":\"El curso Basic English arranca exactamente aquí: saludos y presentacion
