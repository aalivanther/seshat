echas, un dato. Sin interpretación todavía.\u003cbr/\u003e3. Tres alturas. \u003ci\u003eIt can't have been… It may have been… It is highly likely that…\u003c/i\u003e\u003cbr/\u003e4. Cierra con ignorancia honesta o con reservas. \u003ci\u003eThere is no conclusive evidence. All things considered…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eHoy se recupera, sin volver a explicarlo: la deducción en presente del m6 de B1, \u003ci\u003eaccording to\u003c/i\u003e, y el «I think» que ya no es la herramienta buena."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l9\",\"phaseId\":\"enb2m5\",\"title\":\"The house opposite\",\"subtitle\":\"Seis alturas sobre la misma casa, y tu monólogo de dos minutos\",\"minutes\":26,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La casa, las luces, y la frase que admite que no sabes\",\"itemIds\":[\"enb2m5thehouseopposite\",\"enb2m5flickering\",\"enb2m5coincidence\",\"enb2m5natsearchme\",\"enb2m5scientificdevelopment\",\"enb2m5invention\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La historia, y cómo se monta un monólogo que gradúa\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la tarde en el rellano: de menos segura a más segura no, del hecho a la reserva\",\"sentences\":[\"Nora says the lights in the house opposite go on at a quarter past nine.\",\"Amy says it can't have been a ghost: there is no evidence for that.\",\"Valeria says she may have left the landing light on herself.\",\"It could have been a fox, or a coincidence, or both.\",\"All things considered, nobody in the kitchen said I think.\"],\"translation\":\"Nora dice que las luces de la casa de enfrente se encienden a las nueve y cuarto. · Amy dice que no puede haber sido un fantasma: no hay pruebas. · Valeria dice que puede que dejara ella misma la luz del rellano. · Podría haber sido un zorro, o una coincidencia, o las dos cosas. · Teniendo todo en cuenta, nadie en la cocina dijo «yo creo».\",\"itemIds\":[\"enb2m5thehouseopposite\",\"enb2m5canthavebeen\",\"enb2m5mayhaveleft\",\"enb2m5coincidence\",\"enb2m5allthingsconsidered\"],\"tip\":\"El orden no es de certeza creciente: es de género. Primero el hecho, luego lo que se descarta, luego lo posible, luego el cierre. Un monólogo que empiece por la teoría se oye a kilómetro.\"},{\"id\":\"enb2m5l9e2\",\"type\":\"fastmatch\",\"prompt\":\"Las seis alturas, sin pensar\",\"pairs\":[{\"target\":\"It's bound to fail if we rush it.\",\"source\":\"Va a fallar seguro si lo hacemos con prisas.\"},{\"target\":\"It is highly likely that the sample is contaminated.\",\"source\":\"Es muy probable que la muestra esté contaminada.\"},{\"target\":\"It's likely to rain later.\",\"source\":\"Es probable que llueva más tarde.\"},{\"target\":\"It may well be a coincidence.\",\"source\":\"Muy bien podría ser una coincidencia.\"},{\"target\":\"It can't have been a ghost.\",\"source\":\"No puede haber sido un fantasma.\"}],\"targetSeconds\":30,\"itemIds\":[\"enb2m5boundto\",\"enb2m5highlylikelythat\",\"enb2m5islikelyto\",\"enb2m5maywellbe\",\"enb2m5canthavebeen\"],\"tip\":\"Si las traduces, no llegas a dos minutos. El monólogo se sostiene porque estas cinco salen solas.\"},{\"id\":\"enb2m5l9e3\",\"type\":\"gapbank\",\"prompt\":\"Completa la cocina de Valeria y Amy — hay piezas de este módulo y del B1\",\"text\":\"It ___ have been a ghost, Amy said. She may have ___ the light on. According ___ Nora, the lamp moves. That can't ___ right, Valeria said, but there is no conclusive ___.\",\"answers\":[\"can't\",\"left\",\"to\",\"be\",\"evidence\"],\"bank\":[\"can't\",\"left\",\"to\",\"be\",\"evidence\",\"mustn't\",\"leave\",\"from\",\"been\",\"informations\"],\"translation\":\"No puede haber sido un fantasma, dijo Amy. Puede que se dejara la luz encendida. Según Nora, la lámpara se mueve. Eso no puede ser, dijo Valeria, pero no hay pruebas concluyentes.\",\"itemIds\":[\"enb2m5canthavebeen\",\"enb2m5mayhaveleft\",\"enb1m2accordingto\",\"enb1m6cantbe\",\"enb2m5conclusive\"],\"tip\":\"Cinco huecos y dos tiempos de deducción en el mismo párrafo: can't have (pasado) y can't be (ahora). El examen los mezcla; el cubo de la L2 era el entrenamiento.\"},{\"id\":\"enb2m5l9e4\",\"type\":\"errorfix\",\"prompt\":\"Repaso espiral del B1: el «would» en las dos mitades, que no se ha ido\",\"wrong\":\"If I would have the money, I would buy it.\",\"answers\":[\"If I had the money, I would buy it.\"],\"why\":\"El «would» de la mitad del if es la trampa del B1 y sigue viva en B2. La mitad del if lleva pasado; el would se queda fuera. Hoy no se reabre el tema: se caza.\",\"translation\":\"Si tuviera el dinero, lo compraría.\",\"itemIds\":[\"enb1m5ifihadthemoney\"]},{\"id\":\"enb2m5l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Admite ignorancia sin «I don't know»\",\"source\":\"I don't know.\",\"forbid\":[\"know\",\"idea\",\"clue\"],\"answers\":[\"There is no conclusive evidence\",\"Search me\",\"The evidence is not conclusive\"],\"translation\":\"No lo sé.\",\"hints\":[\"La versión de examen empieza por «There is no…»\",\"There is no conclusive ...\"],\"itemIds\":[\"enb2m5natsearchme\",\"enb2m5conclusive\"],\"tip\":\"«Search me» es la calle; «There is no conclusive evidence», el examen. Las dos admiten ignorancia. La que eliges depende de con quién estás, no de lo que sepas.\"},{\"id\":\"enb2m5l9e6\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: treinta segundos de notas, dos minutos hablando, y se repite. La segunda pasada sale mejor.\",\"topic\":\"Something unexplained that people in my building (or family) disagree about — graded, not guessed\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y que lo vas a poner en una escala: «I'll put it on a scale, from bound to to much less likely.»\"},{\"title\":\"2. The fact\",\"hint\":\"Un dato: luces, una fecha, quién lo dice. Todavía sin interpretación. «According to…» / «A neighbour says…»\"},{\"title\":\"3. Three heights\",\"hint\":\"Descarta una (can't have been), deja una abierta (may have been / could have been) y moja una (highly likely / bound to).\"},{\"title\":\"4. Close\",\"hint\":\"Reservas o ignorancia honesta: «There is no conclusive evidence. All things considered…» Nada de «I think that's it».\"}],\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"checklist\":[\"Hablé al menos 1:45 sin pararme en seco\",\"Anuncié al principio que iba a graduar, no a adivinar\",\"Di un dato concreto: una hora, una cifra o una fuente\",\"Usé al menos tres alturas distintas (bound to / likely / may have / can't have / no conclusive evidence)\",\"No dije «I think» como herramienta principal\",\"Cerré con On balance, All things considered o There is no conclusive evidence\"],\"model\":\"Solo el punto 3, para que el resto sea tuyo: «It can't have been a ghost: there is no evidence for that. She may have left the landing light on, and it could have been a fox. It is highly likely that the wiring in the block is the dull cause, and much less likely that the empty house is doing anything on its own.»\",\"itemIds\":[\"enb2m5canthavebeen\",\"enb2m5mayhaveleft\",\"enb2m5couldhavebeen\",\"enb2m5highlylikelythat\",\"enb2m5conclusive\",\"enb2m5thehouseopposite\"],\"tip\":\"Treinta segundos no dan para escribir el discurso: dan para decidir las TRES alturas. Si las tienes, los dos minutos se llenan solos. Si no, te oyes repetir «I think».\"},{\"id\":\"enb2m5l9e7\",\"type\":\"audiomc\",\"prompt\":\"La conversación de la cocina. Una sola escucha — el examen te dará dos. Toma notas: hay seis alturas y no todas son de la misma voz.\",\"notepad\":true,\"plays\":1,\"audio\":\"I'm telling you, the lamp moved.|Nora, it can't have been a person. There's no key. You said so yourself.|Then it's something else.|It may well be the wiring in our landing, not her house. The report's been on the hall table since April.|She says that report isn't about her house.|Then she's likely to be right about that, and much less likely to be right about a lamp with legs. It could have been a bus. It could have been a fox. It must have been something with a plug or a pulse.|Or it's a coincidence and we're all tired.|Search me. I'm not saying I know. I'm saying nobody in this kitchen gets to say I think it's a ghost and sit down.\",\"question\":\"¿Cuál es la altura más baja que se oye en la cocina?\",\"options\":[\"Search me / I'm not saying I know — ignorancia honesta\",\"It must have been something with a plug or a pulse — lo único que encaja\",\"She's likely to be right about that — probable\"],\"answer\":0,\"whyWrong\":[null,\"Esa es la más ALTA de las que se oyen, no la más baja.\",\"Esa está en el medio de la escala.\"],\"itemIds\":[\"enb2m5natsearchme\",\"enb2m5musthavebeen\",\"enb2m5maywellbe\",\"enb2m5islikelyto\",\"enb2m5couldhavebeen\",\"enb2m5coincidence\"],\"tip\":\"El Part 4 del Listening pregunta exactamente esto: gist, hecho frente a opinión, y hasta dónde se moja cada voz. Hoy lo oyes en casa; en la L10, en formato examen.\"},{\"id\":\"enb2m5l9e8\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"No hay pruebas concluyentes, y teniendo todo en cuenta deberíamos esperar.\",\"answers\":[\"There is no conclusive evidence, and all things considered we should wait\",\"There is no conclusive evidence and all things considered we should wait\",\"There is no conclusive evidence. All things considered, we should wait.\"],\"hints\":[\"Las dos fórmulas de cierre del módulo\",\"There is no conclusive evidence, and all things considered ...\"],\"itemIds\":[\"enb2m5conclusive\",\"enb2m5allthingsconsidered\"],\"tip\":\"Dos cierres, dos oficios: uno admite ignorancia, el otro pesa y decide. Un informe bueno usa los dos; un monólogo bueno, también.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m5-4\",\"book\":\"I don't know\",\"real\":\"Search me\",\"meaning\":\"Ni idea / no me preguntes a mí\",\"when\":\"Con amigos, cuando de verdad no sabes y no te da vergüenza. En el informe y en el Speaking del examen, la misma ignorancia se dice «There is no conclusive evidence» o «I have no data on that». «Search me» en un Writing 1 es un error de registro, no de sinceridad.\",\"register\":\"amigos\",\"exam\":\"There is no conclusive evidence\",\"note\":\"La broma vieja es «búscame a mí»: si la respuesta estuviera en algún sitio, estaría en mi persona, y no está. Quien ignore la raya seguirá leyendo una s, que es el error de partida.\",\"sound\":\"séech mi\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m5natsearchme\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
