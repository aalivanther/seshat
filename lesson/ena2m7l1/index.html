or eso se cae al hablar. Aquí se cae exactamente igual, así que vigílala.\u003cbr/\u003e\u003cbr/\u003eDetrás de \u003cb\u003ehave to\u003c/b\u003e el verbo va en su forma de diccionario: \u003ci\u003ego\u003c/i\u003e, \u003ci\u003ework\u003c/i\u003e, \u003ci\u003epay\u003c/i\u003e. Nunca \u003ci\u003egoing\u003c/i\u003e, nunca \u003ci\u003egoes\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el «hay que» impersonal.\u003c/b\u003e El español tiene una forma para hablar sin sujeto: «hay que facturar», «hay que hacer cola». El inglés no la tiene, así que usa \u003cb\u003eyou\u003c/b\u003e — un \u003ci\u003eyou\u003c/i\u003e que no señala a nadie, exactamente como el «tú» de «si tú vas al banco un lunes, te comes la cola». [[You have to check in first.|Primero hay que facturar.]] no le está diciendo nada a nadie en particular: es la norma del sitio."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l1\",\"phaseId\":\"ena2m7\",\"title\":\"You have to check in\",\"subtitle\":\"«Tengo que…», «hay que…»: la obligación que no pusiste tú\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que hay que hacer\",\"itemIds\":[\"ena2m7youhavetocheckin\",\"ena2m7ihavetogotothebank\",\"ena2m7shehastoworkonsaturday\",\"ena2m7doihavetopay\",\"ena2m7whatdoihavetodo\",\"ena2m7thequeue\",\"enbank\",\"enpostoffice\"]},{\"kind\":\"note\",\"note\":{\"title\":\"have to = tener que, y punto\",\"body\":\"$17\",\"table\":[[\"persona\",\"forma\",\"ejemplo\"],[\"I / you / we / they\",\"have to\",\"I have to go to the bank.\"],[\"he / she / it\",\"has to\",\"She has to work on Saturday.\"],[\"impersonal («hay que»)\",\"you have to\",\"You have to check in first.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Preguntar y negar: con do y does, como siempre\",\"body\":\"Esto es lo que hace a \u003cb\u003ehave to\u003c/b\u003e tan fácil: se comporta como un verbo normal y corriente, así que la pregunta y la negativa se hacen con el \u003cb\u003edo / does\u003c/b\u003e del A1. Nada nuevo que aprender.\u003cbr/\u003e\u003cbr/\u003e[[Do I have to pay?|¿Hay que pagar?]] · [[What do I have to do?|¿Qué tengo que hacer?]] · \u003ci\u003eDoes she have to wait?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eOjo a la pregunta, que es donde el español mete la pata: nosotros preguntamos con la entonación y nada más («¿tengo que pagar?»), y de ahí sale el clásico \u003ci\u003eI have to pay?\u003c/i\u003e, que en inglés escrito no es una pregunta. El auxiliar \u003cb\u003edo\u003c/b\u003e no es opcional: es lo que convierte la frase en pregunta.\u003cbr/\u003e\u003cbr/\u003eY fíjate en \u003ci\u003eDoes she have to…?\u003c/i\u003e: la -s ya se la ha llevado \u003cb\u003edoes\u003c/b\u003e, así que detrás vuelve \u003cb\u003ehave\u003c/b\u003e, no \u003ci\u003ehas\u003c/i\u003e. Es el mismo reparto que \u003ci\u003eDoes she work?\u003c/i\u003e del módulo 4 del A1.\",\"table\":[[\"afirmativa\",\"negativa\",\"pregunta\"],[\"I have to pay.\",\"I don't have to pay.\",\"Do I have to pay?\"],[\"She has to wait.\",\"She doesn't have to wait.\",\"Does she have to wait?\"],[\"You have to queue.\",\"You don't have to queue.\",\"Do you have to queue?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l1e1\",\"type\":\"mc\",\"prompt\":\"«Tengo que ir al banco»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"I have to go to the bank.\",\"I have that go to the bank.\",\"I have to going to the bank.\"],\"answer\":0,\"whyWrong\":[null,\"El «que» del español no se traduce: have to ya es «tener que» entero\",\"Detrás de have to, el verbo va en su forma de diccionario: go\"],\"itemIds\":[\"ena2m7ihavetogotothebank\",\"enbank\"],\"tip\":\"have to es una pieza de dos palabras. No la abras por la mitad para meter nada dentro.\"},{\"id\":\"ena2m7l1e2\",\"type\":\"cloze\",\"prompt\":\"La -s de tercera persona, otra vez\",\"text\":\"She ___ to work on Saturday.\",\"answers\":[\"has\"],\"translation\":\"Tiene que trabajar el sábado.\",\"hints\":[\"Es she: la -s no se perdona\",\"ha…\"],\"itemIds\":[\"ena2m7shehastoworkonsaturday\"]},{\"id\":\"ena2m7l1e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige la -s que se cayó\",\"wrong\":\"She have to work on Saturday.\",\"answers\":[\"She has to work on Saturday.\"],\"why\":\"Con he, she o it, have se convierte en has. En español la persona ya va en la terminación del verbo («trabaja»), así que esta -s suena a información repetida y se cae sola al hablar. En el examen no se cae: se penaliza.\",\"translation\":\"Tiene que trabajar el sábado.\",\"itemIds\":[\"ena2m7shehastoworkonsaturday\"]},{\"id\":\"ena2m7l1e4\",\"type\":\"bucket\",\"prompt\":\"¿have to o has to?\",\"categories\":[\"have to\",\"has to\"],\"items\":[{\"text\":\"I ___ pay\",\"bucket\":0},{\"text\":\"Ben ___ work\",\"bucket\":1},{\"text\":\"we ___ wait\",\"bucket\":0},{\"text\":\"Amy ___ sign\",\"bucket\":1},{\"text\":\"they ___ queue\",\"bucket\":0},{\"text\":\"my sister ___ go\",\"bucket\":1}],\"itemIds\":[\"ena2m7shehastoworkonsaturday\",\"ena2m7ihavetogotothebank\"],\"tip\":\"La regla es la misma de siempre: he / she / it van solos por un lado, todos los demás por el otro.\"},{\"id\":\"ena2m7l1e5\",\"type\":\"transform\",\"prompt\":\"Pásala a pregunta\",\"source\":\"I have to pay.\",\"instruction\":\"Hazla pregunta\",\"answers\":[\"Do I have to pay?\"],\"translation\":\"¿Hay que pagar?\",\"hints\":[\"have to es un verbo normal: la pregunta la abre do\",\"D… I have to pay?\"],\"itemIds\":[\"ena2m7doihavetopay\"]},{\"id\":\"ena2m7l1e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta que solo tiene entonación\",\"wrong\":\"I have to pay?\",\"answers\":[\"Do I have to pay?\"],\"why\":\"En español preguntamos subiendo la voz y ya está: «¿tengo que pagar?». En inglés hace falta el auxiliar Y va delante del sujeto. Sin do, eso es una afirmación con un signo de interrogación pegado detrás.\",\"translation\":\"¿Hay que pagar?\",\"itemIds\":[\"ena2m7doihavetopay\"],\"tip\":\"Es la misma trampa del A1 («Where you live?»), un tiempo más allá. Si preguntas, el auxiliar abre.\"},{\"id\":\"ena2m7l1e7\",\"type\":\"cloze\",\"prompt\":\"Pregunta por otra persona\",\"text\":\"___ she have to wait?\",\"answers\":[\"Does\"],\"translation\":\"¿Tiene que esperar?\",\"hints\":[\"Es she, así que el auxiliar se lleva la -s\",\"D…s\"],\"itemIds\":[\"ena2m7shedoesnthavetowait\"],\"tip\":\"Y fíjate: la -s se la ha llevado does, así que detrás vuelve have. Nunca «Does she has to…?».\"},{\"id\":\"ena2m7l1e8\",\"type\":\"build\",\"prompt\":\"Construye la pregunta de ventanilla\",\"target\":\"Do I have to fill in this form\",\"translation\":\"¿Tengo que rellenar este impreso?\",\"distractors\":[\"must\",\"am\"],\"itemIds\":[\"ena2m7whatdoihavetodo\",\"enform\",\"enfillintheform\"],\"tip\":\"Sobran dos fichas y no es casualidad: con have to, la pregunta la abre do y nada más.\"},{\"id\":\"ena2m7l1e9\",\"type\":\"translate\",\"prompt\":\"Traduce el «hay que» impersonal\",\"direction\":\"toTarget\",\"source\":\"¿Hay que hacer cola?\",\"answers\":[\"Do I have to queue?\",\"Do you have to queue?\",\"Do we have to queue?\",\"Do I have to wait in the queue?\"],\"hint\":\"el inglés no tiene «hay que»: pone un tú que no señala a nadie\",\"itemIds\":[\"ena2m7thequeue\",\"ena2m7doihavetopay\"],\"tip\":\"En inglés, para hablar de una norma general, se usa you. No te está tuteando: es como el «si tú vas un lunes, te comes la cola».\"},{\"id\":\"ena2m7l1e10\",\"type\":\"audiomc\",\"prompt\":\"En la oficina de correos — 2 escuchas\",\"audio\":\"Excuse me, do I have to fill in this form? | Yes, and you have to sign it at the bottom.\",\"question\":\"¿Qué le dicen que haga?\",\"options\":[\"Rellenar el impreso y firmarlo\",\"Solo firmarlo\",\"Volver mañana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «yes» a lo del impreso y añade la firma: son las dos cosas\",\"De volver no dice nada\"],\"itemIds\":[\"ena2m7whatdoihavetodo\",\"enform\",\"ena2m7youmustsignhere\"]},{\"id\":\"ena2m7l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe lo que oigas\",\"text\":\"You have to check in first.\",\"translation\":\"Primero hay que facturar.\",\"itemIds\":[\"ena2m7youhavetocheckin\"],\"tip\":\"Al hablar rápido, have to suena «hafta». Eso lo trabajamos entero en la lección 5.\"},{\"id\":\"ena2m7l1e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Tengo que ir al banco. ¿Tú también tienes que ir?\",\"answers\":[\"I have to go to the bank. Do you have to go too?\",\"I have to go to the bank. Do you have to go, too?\",\"I have to go to the bank. Do you have to go as well?\"],\"hints\":[\"Afirmativa con have to + pregunta con do\",\"I have to go to the bank. D… you have to go too?\"],\"itemIds\":[\"ena2m7ihavetogotothebank\",\"ena2m7doihavetopay\",\"enbank\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m7-1\",\"book\":\"You have to check in first.\",\"real\":\"You've got to check in first.\",\"meaning\":\"Primero hay que facturar\",\"when\":\"Entre amigos y en cualquier conversación de calle en Reino Unido: have got to es tan corriente como have to, quizá más. En el Writing del examen, mejor have to: es la forma neutra y no falla nunca.\",\"register\":\"neutral\",\"note\":\"Y al hablar deprisa, «got to» se funde en gotta: I gotta go. Eso ya es informal del todo — se reconoce, no se escribe.\",\"sound\":\"yuv got tu CHEK in féest\",\"level\":\"a2\",\"itemId\":\"ena2m7youhavetocheckin\"}}],\"resources\":[{\"label\":\"British Council — 'have to' and 'must'\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/modals-obligation-prohibition\",\"note\":\"Lee solo la primera mitad, la de have to. El must es la lección de mañana y la página lo mezcla todo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\"
