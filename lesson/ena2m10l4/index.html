· \u003ci\u003eHave you already finished?\u003c/i\u003e (= ¿tan pronto?)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eyet\u003c/b\u003e = «todavía» / «ya», y es la rara: solo sale en \u003cb\u003enegativas y preguntas\u003c/b\u003e, y va \u003cb\u003eal final de la frase\u003c/b\u003e.\u003cbr/\u003e· [[Have you finished yet?|¿Ya has terminado?]] · \u003ci\u003eShe hasn't called me yet.\u003c/i\u003e · [[Not yet.|Todavía no.]]\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error de colocación:\u003c/b\u003e \u003ci\u003eShe hasn't called yet me\u003c/i\u003e — no. yet cierra la frase, siempre. Y \u003ci\u003eI just have finished\u003c/i\u003e tampoco: just va DESPUÉS del auxiliar, no delante.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la mitad que casi nadie te cuenta.\u003c/b\u003e Si tú dirías «\u003ci\u003e¿ya terminaste?\u003c/i\u003e» y «\u003ci\u003erecién llegué\u003c/i\u003e» —como se dice en gran parte de Latinoamérica—, tu instinto te va a llevar al pasado simple: \u003ci\u003eDid you finish yet?\u003c/i\u003e, \u003ci\u003eI just arrived\u003c/i\u003e. En inglés americano eso pasa; en el inglés británico que enseña este curso y que corrigen en tu examen, \u003cb\u003elo esperado es el perfecto\u003c/b\u003e: \u003ci\u003eHave you finished yet?\u003c/i\u003e, \u003ci\u003eI've just arrived\u003c/i\u003e. Y si tú dirías «\u003ci\u003eya he terminado\u003c/i\u003e» y «\u003ci\u003eacabo de llegar\u003c/i\u003e» —como se dice en España—, aquí tu instinto acierta: es de las pocas veces en este módulo que juega a tu favor. Aprovéchalo, porque en la lección siguiente el instinto español cambia de bando."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l4\",\"phaseId\":\"ena2m10\",\"title\":\"Just, already, yet\",\"subtitle\":\"Acabo de, ya, todavía no — y dónde se coloca cada uno\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las noticias del día\",\"itemIds\":[\"ena2m10ivejustfinished\",\"ena2m10ivealreadyseenit\",\"ena2m10haveyoufinishedyet\",\"ena2m10notyet\",\"ena2m10shehasntcalledyet\",\"ena2m10recently\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres palabras, tres sitios, tres tipos de frase\",\"body\":\"$17\",\"table\":[[\"palabra\",\"significado\",\"dónde va\",\"tipo de frase\"],[\"just\",\"acabo de\",\"entre have y el participio\",\"afirmativa\"],[\"already\",\"ya (antes de lo previsto)\",\"entre have y el participio\",\"afirmativa y pregunta de sorpresa\"],[\"yet\",\"todavía no / ¿ya?\",\"AL FINAL\",\"negativa y pregunta\"],[\"recently\",\"hace poco\",\"al final (o al principio)\",\"cualquiera\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l4e1\",\"type\":\"mc\",\"prompt\":\"«Acabo de llegar»\",\"question\":\"¿Cuál es la del examen británico?\",\"options\":[\"I've just arrived.\",\"I just arrived.\",\"I have arrived just.\"],\"answer\":0,\"whyWrong\":[null,\"Así se dice en inglés americano y en media Latinoamérica, y se entiende; en el inglés que te corrigen aquí, lo esperado es el perfecto\",\"just no se va al final: ese sitio es de yet\"],\"itemIds\":[\"ena2m10ivejustfinished\",\"ena2m1arrived\"],\"tip\":\"Si tú dirías «recién llegué», tu oído te va a pedir la segunda. No es que esté prohibida en el mundo: es que no es la que puntúa aquí.\"},{\"id\":\"ena2m10l4e2\",\"type\":\"bucket\",\"prompt\":\"¿En medio o al final?\",\"categories\":[\"entre have y el participio\",\"al final de la frase\"],\"items\":[{\"text\":\"just\",\"bucket\":0},{\"text\":\"already\",\"bucket\":0},{\"text\":\"yet\",\"bucket\":1},{\"text\":\"never\",\"bucket\":0},{\"text\":\"ever\",\"bucket\":0},{\"text\":\"recently\",\"bucket\":1}],\"itemIds\":[\"ena2m10ivejustfinished\",\"ena2m10ivealreadyseenit\",\"ena2m10haveyoufinishedyet\",\"ena2m10recently\",\"ennever\"],\"tip\":\"Cuatro de estas viven en el mismo hueco: el que queda entre el auxiliar y el verbo. Es el mismo sitio del adverbio de frecuencia del A1 (I always get up at seven).\"},{\"id\":\"ena2m10l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa\",\"text\":\"I've ___ seen that film — twice, de hecho.\",\"answers\":[\"already\"],\"translation\":\"Ya he visto esa película, y dos veces además.\",\"hints\":[\"«Ya», y antes de lo que el otro esperaba\",\"al…\"],\"itemIds\":[\"ena2m10ivealreadyseenit\",\"entwice\"]},{\"id\":\"ena2m10l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa — cuidado con cuál de las tres es\",\"text\":\"She hasn't called me ___.\",\"answers\":[\"yet\"],\"translation\":\"Todavía no me ha llamado.\",\"hints\":[\"Frase negativa y hueco al final: solo cabe una\",\"y…\"],\"itemIds\":[\"ena2m10shehasntcalledyet\",\"ena2m10notyet\"]},{\"id\":\"ena2m10l4e5\",\"type\":\"mc\",\"prompt\":\"La pregunta de «¿ya has terminado?»\",\"question\":\"¿Cuál escribirías en el examen?\",\"options\":[\"Have you finished yet?\",\"Did you finish yet?\",\"Have you yet finished?\"],\"answer\":0,\"whyWrong\":[null,\"Es la que sale sola si tú dices «¿ya terminaste?», y por eso hay que vigilarla: el británico pide el perfecto\",\"yet no se cuela en medio; su sitio es el final\"],\"itemIds\":[\"ena2m10haveyoufinishedyet\"]},{\"id\":\"ena2m10l4e6\",\"type\":\"transform\",\"prompt\":\"Ponle just\",\"source\":\"I've finished my homework.\",\"instruction\":\"Añade «just» en su sitio\",\"answers\":[\"I've just finished my homework.\",\"I have just finished my homework.\"],\"translation\":\"Acabo de terminar los deberes.\",\"hints\":[\"Entre el auxiliar y el verbo\",\"I've j… finished my homework.\"],\"itemIds\":[\"ena2m10ivejustfinished\",\"enhomework\"]},{\"id\":\"ena2m10l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige la colocación\",\"wrong\":\"She hasn't called yet me.\",\"answers\":[\"She hasn't called me yet.\"],\"why\":\"yet cierra la frase entera, y el objeto va pegado a su verbo: called me. Es la misma regla del módulo 3 —nunca separes el verbo de su objeto—, aplicada a otro adverbio.\",\"translation\":\"Todavía no me ha llamado.\",\"itemIds\":[\"ena2m10shehasntcalledyet\"]},{\"id\":\"ena2m10l4e8\",\"type\":\"transform\",\"prompt\":\"Este es el sesgo latinoamericano: dilo como lo pide el examen\",\"source\":\"Did you finish yet?\",\"instruction\":\"Con Have you…? + yet\",\"answers\":[\"Have you finished yet?\",\"Have you finished yet\"],\"tip\":\"yet pide el perfecto en el inglés británico, porque señala algo que sigue pendiente AHORA. Si tú dirías «¿ya terminaste?», te va a salir did y suena natural en América; si dirías «¿ya has terminado?», ya estabas en lo correcto. En el examen, la fórmula es Have you…? + yet.\",\"translation\":\"¿Ya has terminado?\",\"itemIds\":[\"ena2m10haveyoufinishedyet\"]},{\"id\":\"ena2m10l4e9\",\"type\":\"order\",\"prompt\":\"Ordena la mañana de Valeria, de lo primero a lo último\",\"sentences\":[\"Valeria got up at seven and had a shower.\",\"She's already had breakfast with Amy.\",\"She's just finished her homework.\",\"She hasn't phoned the school yet.\",\"She wants to do it before her shift at the café.\"],\"translation\":\"Valeria se levantó a las siete y se duchó. Ya ha desayunado con Amy. Acaba de terminar los deberes. Todavía no ha llamado a la escuela. Quiere hacerlo antes de su turno en el café.\",\"itemIds\":[\"ena2m10ivealreadyseenit\",\"ena2m10ivejustfinished\",\"ena2m10shehasntcalledyet\",\"enhavebreakfast\"],\"tip\":\"Fíjate en el orden que dibujan las tres palabras: already es lo más antiguo, just es lo de ahora mismo y yet es lo que aún no ha pasado. Son una línea del tiempo en miniatura.\"},{\"id\":\"ena2m10l4e10\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"I've already seen it, but I haven't finished it yet.\",\"translation\":\"Ya la he visto, pero todavía no la he terminado.\",\"hints\":[\"already en medio, yet al final\",\"I've al… seen it, but I haven't finished it y…\"],\"itemIds\":[\"ena2m10ivealreadyseenit\",\"ena2m10haveyoufinishedyet\"]},{\"id\":\"ena2m10l4e11\",\"type\":\"audiomc\",\"prompt\":\"Escucha dos veces — la pregunta es de estado, no de dato\",\"audio\":\"I've
