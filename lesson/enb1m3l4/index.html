ión en la que te toca \u003cb\u003einiciar\u003c/b\u003e tú («I'm a teacher visiting your school. You start.»): esa fórmula, memorizada, es un salto de banda entero por diez palabras.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la pregunta incrustada arrastra las MISMAS reglas de la lección 3:\u003c/b\u003e\u003cbr/\u003e• fuera la inversión: \u003ci\u003eCould you tell me where \u003cb\u003ethe ticket office is\u003c/b\u003e?\u003c/i\u003e ✗ \u003ci\u003e…where is the ticket office?\u003c/i\u003e\u003cbr/\u003e• fuera el \u003ci\u003edo\u003c/i\u003e: \u003ci\u003eDo you know what time \u003cb\u003eit starts\u003c/b\u003e?\u003c/i\u003e ✗ \u003ci\u003e…what time does it start?\u003c/i\u003e\u003cbr/\u003e• sin palabra interrogativa, entra \u003ci\u003eif\u003c/i\u003e / \u003ci\u003ewhether\u003c/i\u003e: \u003ci\u003eDo you know \u003cb\u003eif\u003c/b\u003e the office opens on Saturdays?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl detalle que casi todo el mundo falla:\u003c/b\u003e el signo de interrogación va según la frase \u003cb\u003ede fuera\u003c/b\u003e, no la de dentro.\u003cbr/\u003e\u003ci\u003eCould you tell me where it is\u003cb\u003e?\u003c/b\u003e\u003c/i\u003e (fuera es pregunta → interrogación)\u003cbr/\u003e\u003ci\u003eI'd like to know where it is\u003cb\u003e.\u003c/b\u003e\u003c/i\u003e (fuera es afirmación → punto)\u003cbr/\u003e\u003cbr/\u003eY detrás de \u003cb\u003eWould you mind\u003c/b\u003e va \u003cb\u003e-ing\u003c/b\u003e, nunca infinitivo: \u003ci\u003eWould you mind \u003cb\u003erepeating\u003c/b\u003e that?\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l4\",\"phaseId\":\"enb1m3\",\"title\":\"Could you tell me…?\",\"subtitle\":\"Subir el registro entero con una fórmula — y la carta formal del examen\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las cuatro fórmulas que cambian el tono\",\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3doyouknowif\",\"enb1m3iwaswondering\",\"enb1m3wouldyoumind\",\"enb1m3ticketoffice\",\"enb1m3enquiry\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la manera más barata de sonar educado en inglés\",\"body\":\"$17\",\"table\":[[\"Directo (amigos)\",\"Incrustado (desconocidos, examen)\"],[\"Where's the station?\",\"Could you tell me where the station is?\"],[\"What time does it start?\",\"Do you know what time it starts?\"],[\"How much is it?\",\"I was wondering how much it is.\"],[\"Repeat that.\",\"Would you mind repeating that?\"],[\"Is it open on Sundays?\",\"Do you know if it's open on Sundays?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro fórmulas\",\"pairs\":[{\"target\":\"Could you tell me where the ticket office is?\",\"source\":\"¿Podría decirme dónde está la taquilla?\"},{\"target\":\"Do you know if the office opens on Saturdays?\",\"source\":\"¿Sabes si la oficina abre los sábados?\"},{\"target\":\"I was wondering whether you could help me.\",\"source\":\"Me preguntaba si podría ayudarme.\"},{\"target\":\"Would you mind repeating that?\",\"source\":\"¿Le importaría repetirlo?\"}],\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3doyouknowif\",\"enb1m3iwaswondering\",\"enb1m3wouldyoumind\"],\"tip\":\"Las cuatro son bloques: se memorizan enteras y se les cuelga detrás lo que haga falta. No se construyen palabra a palabra cada vez.\"},{\"id\":\"enb1m3l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Se lo dirías a un amigo o a un desconocido?\",\"categories\":[\"Directo — amigos\",\"Incrustado — desconocidos y examen\"],\"items\":[{\"text\":\"Where's the toilet?\",\"bucket\":0},{\"text\":\"Could you tell me where the toilet is?\",\"bucket\":1},{\"text\":\"What time does it start?\",\"bucket\":0},{\"text\":\"Do you know what time it starts?\",\"bucket\":1},{\"text\":\"How much is it?\",\"bucket\":0},{\"text\":\"I was wondering how much it is.\",\"bucket\":1},{\"text\":\"Repeat that.\",\"bucket\":0},{\"text\":\"Would you mind repeating that?\",\"bucket\":1}],\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3wouldyoumind\",\"enb1m3iwaswondering\"],\"tip\":\"Ninguna de la izquierda es maleducada entre amigos: son normales. Lo que las hace bruscas es el destinatario. El error de registro se paga más caro que el gramatical, y en inglés se juega justo aquí.\"},{\"id\":\"enb1m3l4e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Could you tell me where is the ticket office?\",\"answers\":[\"Could you tell me where the ticket office is?\"],\"why\":\"La pregunta va DENTRO de otra frase, así que pierde la inversión: sujeto («the ticket office») delante del verbo («is»). Es el mismo error de «She asked me where was the station», ahora en la vida real.\",\"translation\":\"¿Podría decirme dónde está la taquilla?\",\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3ticketoffice\"]},{\"id\":\"enb1m3l4e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Do you know if does the office open on Saturdays?\",\"answers\":[\"Do you know if the office opens on Saturdays?\"],\"why\":\"Un «do» por frase. El de fuera ya está («Do you know…»); dentro, el verbo va normal y se lleva la -s de tercera persona: «the office opens».\",\"translation\":\"¿Sabes si la oficina abre los sábados?\",\"itemIds\":[\"enb1m3doyouknowif\"]},{\"id\":\"enb1m3l4e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Would you mind to repeat that?\",\"answers\":[\"Would you mind repeating that?\"],\"why\":\"Detrás de «mind» va -ing, siempre. Es la misma familia que «I enjoy cooking» o «I look forward to seeing you»: en inglés hay verbos que solo admiten gerundio, y el español da infinitivo para todos.\",\"translation\":\"¿Le importaría repetirlo?\",\"itemIds\":[\"enb1m3wouldyoumind\",\"encanyourepeat\"]},{\"id\":\"enb1m3l4e6\",\"type\":\"transform\",\"prompt\":\"Sube el registro\",\"source\":\"Where is the ticket office?\",\"instruction\":\"Dilo como se lo dirías a un desconocido, con «Could you tell me…?»\",\"answers\":[\"Could you tell me where the ticket office is?\"],\"translation\":\"¿Podría decirme dónde está la taquilla?\",\"hints\":[\"Al meterla dentro, la pregunta pierde la inversión\",\"Could you tell me where the ... is?\"],\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3ticketoffice\"],\"tip\":\"Diez palabras y otro tono. Y el orden interno cambia: «is the ticket office» → «the ticket office is».\"},{\"id\":\"enb1m3l4e7\",\"type\":\"transform\",\"prompt\":\"Sube el registro\",\"source\":\"What time does the library close?\",\"instruction\":\"Dilo con «Do you know…?»\",\"answers\":[\"Do you know what time the library closes?\"],\"translation\":\"¿Sabes a qué hora cierra la biblioteca?\",\"hints\":[\"El «does» de dentro desaparece\",\"Do you know what time the library ...?\"],\"itemIds\":[\"enb1m3doyouknowif\"],\"tip\":\"Cuando cae el «does», el verbo recupera su -s: «close» → «closes». Ese detalle es medio punto del criterio de gramática y se olvida siempre.\"},{\"id\":\"enb1m3l4e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el correo formal a la biblioteca\",\"text\":\"I am writing to ___ about the English course on your noticeboard. Could you tell me ___ much the course costs, and ___ there are still places? I was ___ whether you could also send me a timetable.\",\"answers\":[\"enquire\",\"how\",\"whether\",\"wondering\"],\"bank\":[\"enquire\",\"how\",\"whether\",\"wondering\",\"telling\",\"where\",\"which\"],\"translation\":\"Escribo para preguntar por el curso de inglés de su tablón de anuncios. ¿Podría decirme cuánto cuesta el curso y si quedan plazas? Me preguntaba si podrían enviarme además un horario.\",\"itemIds\":[\"enb1m3enquiry\",\"enb1m3couldyoutellme\",\"enb1m3iwaswondering\"],\"tip\":\"Este párrafo es literalmente medio Writing Task 1. Dos preguntas incrustadas, una petición envuelta en «I was wondering whether…» y ni un imperativo suelto.\"},{\"id\":\"enb1m3l4e9\",\"type\":\"mc\",\"prompt\":\"El signo del final\",\"question\":\"¿Cuál está bien puntuada?\",\"options\":[\"I would like to know where the classes are.\",\"I would like to know where are the classes?\",\"I would like to know where the classes are?\"],\"answer\":0,\"whyWrong\":[null,\"Dos fallos: inversión dentro y un signo que la frase de fuera no pide.\",\"El orden está bien, pero la frase de fuera es una afirmación: acaba en punto.\"],\"itemIds\":[\"enb1m3iwaswondering\"],\"tip\":\"Manda la frase de FUERA. «Could you tell me…?» es pregunta → interrogación. «I'd like to know…» es afirmación → punto. En LanguageCert la puntuación entra en el criterio de Organisation: son puntos, no estética.\"},{\"id\":\"enb1m3l4e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el cartel, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Has visto este cartel en el tablón de la biblioteca de Palmer Road. Escribe a la Learning Team para pedir información. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Cartel en el tablón de la biblioteca de Palmer Road\",\"text\":\"ENGLISH FOR EXAMS — B1. Evening classes at Palmer Road Library, Tuesdays and Thursdays. Small groups. Places are limited. For further details, write to the Learning Team, Palmer Road Library.\"},\"bullets\":[\"Di de qué curso escribes y dónde has visto el cartel.\",\"Pregunta DOS cosas concretas con preguntas incrustadas, no directas.\",\"Pide que te contesten.\"],\"checks\":[{\"re\":\"(advertis|noticeboard|notice|poster)\",\"label\":\"Dices de qué curso hablas y dónde lo has visto\"},{\"re\":\"(could you tell me|i was wondering|do you know|would like to know)\",\"label\":\"Preguntas con una pregunta incrustada, no con una directa\"},{\"re\":\"(hearing from you|hear from you|get back to me|let me know|contact me)\",\"label\":\"Pides que te contesten\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — sin nombre, porque el cartel no lo da\",\"Por qué escribes: «I am writing about the English course advertised on…»\",\"Quién eres, en una línea: «I have lived in London for… and I am preparing for…»\",\"Punto 2 — tus dos preguntas: «Could you tell me how much…, and whether…?»\",\"Un dato tuyo con conector: «Although I work on…, I am free…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"since\",\"therefore\",\"besides\",\"despite\",\"in spite of\",\"unless\",\"for instance\",\"of course\",\"in addition\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the English course advertised on the noticeboard at Palmer Road Library. I have lived in London for two years and I am preparing for a B1 exam in June.\\nCould you tell me how much the course costs, and whether there are still places? I would also like to know when the classes start, since the poster does not say.\\nAlthough I work on Saturdays, I am free every evening. I look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3enquiry\",\"enb1m1although\",\"enb1m1havelivedhere\",\"enb1m3askedmewhether\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y fíjate en el modelo: ni un «I want», ni un imperativo suelto. Dos preguntas incrustadas y un «Yours faithfully» — que es el que va cuando NO sabes el nombre; con nombre sería «Yours sincerely».\"},{\"id\":\"enb1m3l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Podría decirme si el curso empieza en septiembre?\",\"answers\":[\"Could you tell me if the course starts in September?\",\"Could you tell me whether the course starts in September?\",\"Could you tell me if the course begins in September?\"],\"hints\":[\"Empieza por la fórmula de cortesía\",\"Could you tell me if the course ... in September?\"],\"itemIds\":[\"enb1m3couldyoutellme\",\"enb1m3doyouknowif\"],\"tip\":\"Sin palabra interrogativa entra «if» o «whether», y el verbo se queda con su -s: «starts». Nada de «does the course start».\"},{\"id\":\"enb1m3l4e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: en la taquilla de la estación. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Excuse me, could you tell me whether this train stops at Stratford?|This one doesn't, no. You want the one on platform four — it leaves at twenty past.|Right. And do you know if I can use this ticket on it?|You can, yes, it's the same line. Would you mind moving along a bit, though? There's a queue behind you.|Of course. Thanks very much.\",\"question\":\"¿Qué le dicen que haga?\",\"options\":[\"Que se aparte un poco\",\"Que compre otro billete\",\"Que espere en el andén tres\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El billete vale: «You can, yes, it's the same line».\",\"El andén es el cuatro, y nadie le manda esperar allí.\"],\"itemIds\":[\"enb1m3wouldyoumind\",\"enticket\",\"enb1m3couldyoutellme\"],\"tip\":\"Tres preguntas incrustadas seguidas en veinte segundos: «could you tell me whether…», «do you know if…», «would you mind…». Así habla la gente en un mostrador, y así se pregunta en el Speaking Part 2.\"},{\"id\":\"enb1m3l4e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu fórmula para el examen oral\",\"text\":\"Excuse me, could you tell me where the ticket office is, please?\",\"phonetic\":\"iks-KIÚUS̬ mi, kud yu tel mi uéa de TÍ-kit Ó-fis is̬, plíis̬\",\"translation\":\"Disculpe, ¿podría decirme dónde está la taquilla, por favor?\",\"itemIds\":[\"enb1m3couldyoutellme\",\"enexcuseme\",\"enb1m3ticketoffice\"],\"tip\":\"Fíjate en la melodía: «Excuse me» sube, «could you tell me» va llano y «please» baja. Si la dices toda plana, suena a orden aunque las palabras sean educadas — y eso, en el examen, lo penaliza el criterio de entonación.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m3-2\",\"book\":\"Where is the station?\",\"real\":\"Where's the station, mate?\",\"meaning\":\"¿Dónde está la estación, tío?\",\"when\":\"Entre hombres jóvenes, en la calle, y sobre todo si el otro es un desconocido de tu edad: «mate» ablanda la brusquedad de la pregunta directa. No lo digas en un mostrador, ni a alguien mayor, ni en el examen — allí lo que ablanda es la pregunta incrustada, no la palabra final.\",\"register\":\"amigos\",\"exam\":\"Could you tell me where the station is, please?\",\"note\":\"Es el par que resume el módulo: la misma pregunta, dos mundos. «mate» funciona en Inglaterra y Australia; en Escocia oirás «pal», y en Irlanda «lad». Y ojo, «mate» no significa «compañero de piso»: eso es «flatmate».\",\"sound\":\"uéas̬ de STÉI-shon, meit\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m3natmate\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Writing (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Descarga el Practice Paper 1 y compara tu carta con la tarea oficial: 70-100 palabras, lector público y tres puntos de contenido listados.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas
