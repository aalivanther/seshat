on esas dos calles.\",\"table\":[[\"Frase\",\"Golpes\",\"Se come\"],[\"Whereas the lane would cut cars\",\"WHEREAS LANE CUT CARS\",\"the, would\"],[\"It could be argued that\",\"COULD ARGUED\",\"it, be, that\"],[\"Admittedly the air would improve\",\"AD-mit AIR IM-prove\",\"the, would\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l5e1\",\"type\":\"mc\",\"prompt\":\"Dónde cae el golpe\",\"question\":\"En «Whereas the lane would cut cars», ¿qué palabras llevan el golpe?\",\"options\":[\"Whereas, lane, cut, cars\",\"The, would, cut\",\"Todas por igual, como en español\"],\"answer\":0,\"whyWrong\":[null,\"The y would se comen. Cut sí; the/would, no.\",\"Eso es el ritmo silábico, y es exactamente lo que hace indescifrable una frase de B2.\"],\"itemIds\":[\"enb2m8contentwords\",\"enb2m8stressthepoint\",\"enb2m8whereas\"],\"tip\":\"Content words = las que puedes enseñar con el dedo. Function words = las que se comen. El español no hace esa dieta. El inglés, sí.\"},{\"id\":\"enb2m8l5e2\",\"type\":\"paraphrase\",\"prompt\":\"Sin I, my, think, ask: la tesis al mundo\",\"source\":\"If you ask me, the lane is overdue.\",\"forbid\":[\"i\",\"me\",\"my\",\"ask\",\"think\",\"opinion\"],\"answers\":[\"It could be argued that the lane is overdue\",\"It could be argued that the bike lane is overdue\"],\"translation\":\"Si quieres que te diga, el carril llega tarde.\",\"hints\":[\"It could be argued that\",\"It could be argued that the lane is ...\"],\"itemIds\":[\"enb2m8natifyouaskme\",\"enb2m8itcouldbearguedthat\"],\"tip\":\"If you ask me es honesto y es B1. En un ensayo, es evitación del impersonal. Ya le pusimos nombre en el m6.\"},{\"id\":\"enb2m8l5e3\",\"type\":\"bucket\",\"prompt\":\"¿Cierre de café o de ensayo?\",\"categories\":[\"CALLE — no va en el Writing\",\"ENSAYO — va en el Writing\"],\"items\":[{\"text\":\"So, yeah.\",\"bucket\":0},{\"text\":\"If you ask me,\",\"bucket\":0},{\"text\":\"Then again,\",\"bucket\":0},{\"text\":\"Consequently,\",\"bucket\":1},{
