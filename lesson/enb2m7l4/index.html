 LanguageCert no examina la reseña de frente; el First sí. Se enseña igual.\",\"table\":[[\"Oficio\",\"Calle\",\"Examen\"],[\"Valoración alta\",\"banging\",\"outstanding\"],[\"Caro, con matiz\",\"a bit steep\",\"on the pricey side\"],[\"No lo vale\",\"a rip-off\",\"overpriced\"],[\"Soso\",\"a bit nothingy\",\"bland\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m7l4e1\",\"type\":\"match\",\"prompt\":\"Empareja la valoración con su altura\",\"pairs\":[{\"target\":\"It was banging.\",\"source\":\"calle: buenísimo\"},{\"target\":\"The food was outstanding.\",\"source\":\"examen: extraordinario\"},{\"target\":\"a bit steep\",\"source\":\"calle: un poco salado (precio)\"},{\"target\":\"on the pricey side\",\"source\":\"examen: tirando a caro\"},{\"target\":\"overpriced\",\"source\":\"examen: no lo vale\"}],\"itemIds\":[\"enb2m7natbanging\",\"enb2m7outstanding\",\"enb2m7abitsteep\",\"enb2m7onthepriceyside\",\"enb2m7overpriced\"],\"tip\":\"Steep y pricey side no son overpriced. Los dos primeros matizan; el tercero condena. En una reseña, esa diferencia es la nota.\"},{\"id\":\"enb2m7l4e2\",\"type\":\"mc\",\"prompt\":\"Rich no es rico\",\"question\":\"«The chocolate tart was rich» en una reseña británica significa…\",\"options\":[\"Que estaba contundente, muy mantecosa o muy densa\",\"Que estaba rica, en el sentido de «qué rica está»\",\"Que era cara\"],\"answer\":0,\"whyWrong\":[null,\"Eso es el calco de «rico». En inglés, delicious / outstanding. Rich de comida es densidad.\",\"Caro es steep / pricey / overpriced. Rich de precio existe («a rich man») y no es un tart.\"],\"itemIds\":[\"enb2m7rich\"],\"tip\":\"Si quieres decir «qué rica está», outstanding o delicious. Si quieres decir que un trozo ya llena, rich. El calco es de los que se leen en voz alta y delatan.\"},{\"id\":\"enb2m7l4e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The chips were very humid.\",\"answers\":[\"The chips were soggy.\",\"The chips were a bit soggy.\"],\"why\":\"Humid es el tiempo (un clima húmedo). De una patata frita que ha perdido el crujido, soggy. El bloque es crisp / soggy, no dry / humid.\",\"translation\":\"Las patatas estaban chiclosas.\",\"itemIds\":[\"enb2m7soggy\",\"enb2m7crisp\"]},{\"id\":\"enb2m7l4e4\",\"type\":\"write\",\"prompt\":\"La reseña del módulo, 150-180 palabras. Un a favor, un en contra, una recomendación. Colocaciones, no adjetivos sueltos.\",\"scenario\":\"Una revista de barrio te pide una reseña del café de Sam, que acaba de cambiar la carta. Escribe la reseña para lectores que aún no han ido. Un punto a favor con ejemplo, un punto en contra (precio o un plato), y una recomendación con reservas.\",\"genre\":\"review\",\"register\":\"direct\",\"bullets\":[\"Di qué es y para quién, en las dos primeras líneas.\",\"Un punto a favor con una colocación (outstanding / crisp / generous portion / source locally).\",\"Un punto en contra (on the pricey side / overpriced / bland / soggy) y una recomendación.\"],\"checks\":[{\"re\":\"(café|cafe|sam)\",\"label\":\"Se entiende de qué sitio hablas\"},{\"re\":\"(outstanding|crisp|generous portion|source locally|sourdough|banging)\",\"label\":\"Hay un punto a favor con bloque del módulo\"},{\"re\":\"(pricey|overpriced|steep|bland|soggy|reservations)\",\"label\":\"Hay un pero, y una recomendación o reserva\"}],\"frame\":[\"Qué es: a small café on… / Sam's place…\",\"Para quién: if you want… / worth a look if…\",\"A favor, con ejemplo concreto (un plato, no «la comida es buena»)\",\"En contra: precio o un plato que no llegó\",\"Recomendación con on the pricey side / with some reservations\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"however\",\"on the other hand\",\"even so\",\"worth a mention\",\"all in all\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":180,\"model\":\"Sam's café on the corner has a new menu, and it is worth a look if you care more about bread than about a bargain. The sourdough is outstanding — crisp at the edge, and it fills you up without the soggy middle that used to turn up on Tuesdays. He now sources locally on market day, and the soup consists of whatever looked honest at six in the morning, which is typical of the place at its best. Worth a mention: the coffee is strong and nobody rushes you. On the other hand, a sandwich and a bun will land on the pricey side, and one of the plant-based specials I tried was bland. All in all I would go back, with some reservations about eating there every day: it is not overpriced for what it is, but it is not cheap, and the portions are generous enough that leftovers go home in a bag he actually gives you.\",\"itemIds\":[\"enb2m7outstanding\",\"enb2m7crisp\",\"enb2m7soggy\",\"enb2m7sourcelocally\",\"enb2m7onthepriceyside\",\"enb2m7bland\",\"enb2m7worthamention\",\"enb2m7areview\",\"enb2m7fillup\",\"enb2m7aportion\"],\"tip\":\"Cuenta los very: si hay más de uno, táchalos y pon un bloque. Outstanding, crisp, bland, pricey side. Eso es rango léxico; very good, no.\"},{\"id\":\"enb2m7l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa el matiz del precio\",\"text\":\"A sandwich and a bun will land on the ___ side.\",\"answers\":[\"pricey\"],\"translation\":\"Un sándwich y un bollo van a salir tirando a caro.\",\"hints\":[\"El adjetivo de precio, no steep\",\"pri-...\"],\"itemIds\":[\"enb2m7onthepriceyside\"],\"tip\":\"On the X side es un molde: on the pricey side, on the small side, on the cold side. El examen lo oye y lo premia.\"},{\"id\":\"enb2m7l4e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés de reseña\",\"source\":\"La comida estaba extraordinaria.\",\"answers\":[\"The food was outstanding\",\"The food is outstanding\"],\"hint\":\"No very good\",\"itemIds\":[\"enb2m7outstanding\"],\"tip\":\"Extraordinary también vale y suena a traducción. Outstanding es el bloque.\"},{\"id\":\"enb2m7l4e7\",\"type\":\"audiomc\",\"prompt\":\"Sam prueba la reseña en voz alta. Lee la pregunta antes. Dos escuchas.\",\"audio\":\"Outstanding. You wrote outstanding about my buns.|They are.|And 'on the pricey side'. That's kinder than 'overpriced'.|It is. Overpriced would mean I wouldn't send anyone. Pricey side means I would, and I'd tell them to share a sandwich.|Bland, though. Which special?|The plant-based one on Thursday. I'm not fed up with plant-based. I'm fed up with bland plant-based.|That's fair. I'll put it off the board until it isn't.\",\"question\":\"¿Qué va a hacer Sam con el especial vegetal?\",\"options\":[\"Quitarlo de la pizarra hasta que deje de estar soso\",\"Subirle el precio\",\"Dejarlo y ponerle outstanding en la carta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del precio del especial no habla. Pricey side era del sándwich y el bollo.\",\"Outstanding era de los bollos, no de ese especial.\"],\"itemIds\":[\"enb2m7outstanding\",\"enb2m7onthepriceyside\",\"enb2m7overpriced\",\"enb2m7bland\",\"enb2m7fedupwith\",\"enb1m6putoff\"],\"tip\":\"«I'll put it off the board» aquí es quitarlo (off = fuera), no aplazar. Tres oficios de off en un módulo: aplazar, dar asco, fuera. El oído los separa por el objeto.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m7-4\",\"book\":\"very expensive\",\"real\":\"a bit steep\",\"meaning\":\"un poco salado (el precio)\",\"when\":\"Con amigos, de una cuenta. En una reseña, el matiz que puntúa es «on the pricey side»; si de verdad no lo vale, «overpriced». Steep en un Writing formal es aceptable; very expensive es el B1.\",\"register\":\"amigos\",\"exam\":\"on the pricey side / overpriced\",\"note\":\"Steep de cuesta ya lo tenías. Steep de precio es la acepción B2, igual que los phrasals de la L3: misma palabra, oficio nuevo.\",\"sound\":\"a bit stiip\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m7abitsteep\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\"
