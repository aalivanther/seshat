te\":{\"title\":\"Invitar en inglés: want to + verbo\",\"body\":\"La invitación básica es \u003cb\u003eDo you want to + verbo\u003c/b\u003e: Do you want to [[come|venir]]? · Do you want to [[dance|bailar]]? Para aceptar: \u003cb\u003eI'd love to!\u003c/b\u003e (¡me encantaría!) — o un simple Yes! Para decir que no SIN sonar borde, el inglés da tres pasos: \u003cb\u003eSorry\u003c/b\u003e + \u003cb\u003eI can't\u003c/b\u003e + una excusa: Sorry, I can't — I'm [[busy|ocupado]]. Maybe another time. Trampa del hispanohablante: a «Do you want to come?» no respondas solo «Yes» a secas — di \u003cb\u003eYes, I do\u003c/b\u003e o, mejor, \u003cb\u003eI'd love to!\u003c/b\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m11l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la invitación\",\"question\":\"“Do you want to come to my party?”\",\"options\":[\"¿Quieres venir a mi fiesta?\",\"¿Puedes venir a mi casa?\",\"¿Vienes de mi fiesta?\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Can you come to my house?» — aquí pregunta si QUIERES (want)\",\"come to = venir A; y want to pregunta por tus ganas, no por tu origen\"],\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"want to + verbo = querer hacer algo. La invitación número 1 del inglés.\"},{\"id\":\"ena1m11l1e2\",\"type\":\"match\",\"prompt\":\"Empareja invitación y respuestas\",\"pairs\":[{\"target\":\"Do you want to come?\",\"source\":\"¿Quieres venir?\"},{\"target\":\"I'd love to!\",\"source\":\"¡Me encantaría!\"},{\"target\":\"Sorry, I can't.\",\"source\":\"Lo siento, no puedo.\"},{\"target\":\"the invitation\",\"source\":\"la invitación\"}],\"itemIds\":[\"endoyouwanttocome\",\"enidloveto\",\"ensorryicant\",\"eninvitation\"]},{\"id\":\"ena1m11l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa la invitación\",\"text\":\"Do you want ___ come to my party?\",\"answers\":[\"to\"],\"translation\":\"¿Quieres venir a mi fiesta?\",\"hints\":[\"Entre want y el verbo siempre hay una palabrita\",\"want T-O come — el t-o no se cae\"],\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"«Do you want come» es el calco clásico: want pide TO antes del verbo, siempre.\"},{\"id\":\"ena1m11l1e4\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Escucha con atención\",\"book\":\"Do you want to come?\",\"real\":\"Do you wanna come?\",\"translation\":\"¿Quieres venir?\",\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"wanna = want to fundido en el habla rápida. Solo para tu oído: tú escribe y di want to.\"},{\"id\":\"ena1m11l1e5\",\"type\":\"build\",\"prompt\":\"Di que no, con educación\",\"target\":\"Sorry, I can't come to the party\",\"translation\":\"Lo siento, no puedo ir a la fiesta\",\"distractors\":[\"don't\",\"want\"],\"itemIds\":[\"ensorryicant\"],\"tip\":\"Sorry delante + can't + verbo: el «no» educado que nunca falla.\"},{\"id\":\"ena1m11l1e6\",\"type\":\"listen\",\"prompt\":\"Escucha la excusa completa y escríbela\",\"text\":\"I'm busy. Maybe another time.\",\"translation\":\"Estoy ocupado/a. Quizá en otro momento.\",\"hints\":[\"busy suena «BÍ-s̬i»\",\"Maybe another time = la salida elegante\"],\"itemIds\":[\"enimbusy\",\"enanothertime\"]},{\"id\":\"ena1m11l1e7\",\"type\":\"speak\",\"prompt\":\"Di que sí con entusiasmo\",\"text\":\"I'd love to!\",\"phonetic\":\"aid LAV tu\",\"translation\":\"¡Me encantaría!\",\"itemIds\":[\"enidloveto\"],\"tip\":\"I'd = I would. Como chunk entero: aid-LAV-tu, con energía.\"},{\"id\":\"ena1m11l1e11\",\"type\":\"errorfix\",\"prompt\":\"Corrige — falta la pieza del medio\",\"wrong\":\"Do you want come to my party?\",\"answers\":[\"Do you want to come to my party?\",\"Do you want to come to my party\"],\"why\":\"Tras want, el segundo verbo va con to: want TO come, want TO go. El español encadena los verbos («quieres venir») y por eso el to se cae.\",\"translation\":\"¿Quieres venir a mi fiesta?\",\"hints\":[\"Falta una palabra entre want y come\",\"Do you want ___ come…?\"],\"itemIds\":[\"endoyouwanttocome\"]},{\"id\":\"ena1m11l1e12\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — di que no sin decir «no puedo»\",\"source\":\"Sorry, I can't come.\",\"forbid\":[\"can't\",\"cannot\",\"sorry\"],\"answers\":[\"I'm busy on Saturday. Maybe another time.\",\"I'm busy that day. Maybe another time.\",\"I want to come, but I'm busy.\"],\"translation\":\"Lo siento, no puedo ir.\",\"hints\":[\"Di POR QUÉ no puedes\",\"I'm ___ … Maybe another time.\"],\"itemIds\":[\"enimbusy\",\"enanothertime\",\"ensorryicant\"],\"tip\":\"Un «Sorry, I can't» a secas suena a portazo. Con el motivo y una puerta abierta dices lo mismo sin romper nada — y eso es exactamente lo que sube la nota en el oral.\"},{\"id\":\"ena1m11l1e9\",\"type\":\"audiomc\",\"prompt\":\"Solo con el oído: ¿qué responde?\",\"audio\":\"Do you want to dance? | I'd love to!\",\"question\":\"¿Qué responde a la invitación?\",\"options\":[\"Que le encantaría\",\"Que está ocupada\",\"Que quizá en otro momento\"],\"answer\":0,\"whyWrong\":[null,\"busy no suena — sonó I'd love to\",\"another time no suena — el sí fue rotundo\"],\"itemIds\":[\"enidloveto\",\"endoyouwanttocome\"],\"tip\":\"I'd love to suena todo junto: aid-LAV-tu. Cázalo como un bloque y la respuesta es tuya.\"},{\"id\":\"ena1m11l1e10\",\"type\":\"transform\",\"prompt\":\"Vacuna contra el calco: corrige la invitación\",\"source\":\"Do you want come to my house?\",\"instruction\":\"Corrígela — a want le falta una palabrita\",\"answers\":[\"Do you want to come to my house?\",\"Do you want to come to my house\"],\"translation\":\"¿Quieres venir a mi casa?\",\"hints\":[\"want pide TO antes del verbo\",\"Do you want TO come…\"],\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"«want come» es EL calco de esta lección: cada corrección lo debilita para siempre.\"},{\"id\":\"ena1m11l1e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Quieres venir a mi fiesta?\",\"answers\":[\"Do you want to come to my party?\",\"Do you want to come to my party\"],\"hints\":[\"Pregunta con Do you…\",\"Do you want TO come…\"],\"itemIds\":[\"endoyouwanttocome\"],\"tip\":\"Si el to te salió solo, la invitación ya es tuya. Ahora, a usarla.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m11-1\",\"book\":\"I don't know.\",\"real\":\"Dunno…\",\"meaning\":\"No sé… / Ni idea — la respuesta vaga cuando aún no sabes si puedes\",\"when\":\"Entre amigos, al responder a un plan: «Do you want to come?» — «Dunno… maybe!». En el examen y por escrito, siempre I don't know.\",\"register\":\"amigos\",\"note\":\"don't know se funde en dunno («da-NÓU»). Emparienta con el «nsé» español.\",\"sound\":\"da-NÓU\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"British Council — A1 Speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a1-speaking\",\"note\":\"Busca los vídeos de invitaciones: oirás Do you want to…? y sus respuestas dichas por nativos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favico
