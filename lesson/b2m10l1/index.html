3cbr/\u003e\u003cbr/\u003eTres ejes, que no son el mismo:\u003cbr/\u003e· \u003cb\u003eDialekt / Mundart\u003c/b\u003e — lo que se habla en casa (el berlinés, el vienés, el bernés). En el examen \u003cb\u003eno te lo van a poner\u003c/b\u003e como audio a transcribir.\u003cbr/\u003e· \u003cb\u003eUmgangssprache\u003c/b\u003e — el coloquial estándar: elisión, dativo por genitivo, \u003ci\u003etun\u003c/i\u003e + infinitivo, \u003ci\u003ewo\u003c/i\u003e de relativo. Se oye. Se reconoce. Se produce poco.\u003cbr/\u003e· \u003cb\u003eStandardsprache\u003c/b\u003e — lo que escribes en el Goethe y dices en el Vortrag.\u003cbr/\u003e· \u003cb\u003eAmtsdeutsch\u003c/b\u003e — el traje administrativo, el del m8: no es austriaco ni suizo, es registro.\u003cbr/\u003e\u003cbr/\u003eLa misma idea, tres trajes: \u003ci\u003eDas ist sehr gut\u003c/i\u003e (libro) · \u003ci\u003eDas ist echt stark\u003c/i\u003e (calle) · \u003ci\u003eDas halte ich für ausgesprochen gelungen\u003c/i\u003e (examen)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m10l1\",\"phaseId\":\"b2m10\",\"title\":\"Drei Anzüge, eine Idee\",\"subtitle\":\"Coloquial, estándar, Amtsdeutsch — y la regla de producción, en pantalla\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los nombres de los tres trajes\",\"itemIds\":[\"b2m10umgangssprache\",\"b2m10standardsprache\",\"b2m10amtsdeutsch\",\"b2m10register\",\"b2m10ausdruck\",\"b2m10redewendung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Se produce estándar alemán. El resto se reconoce.\",\"body\":\"$17\",\"table\":[[\"Umgangssprache\",\"kriegen, Kumpel, echt stark, tun mal\"],[\"Standardsprache\",\"erhalten, Kollege, gelungen, nachschauen\"],[\"Amtsdeutsch\",\"hiermit, seitens, hinsichtlich\"],[\"Producción\",\"estándar alemán, también si el texto de origen es de Viena o de Berna\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m10l1e1\",\"type\":\"mc\",\"prompt\":\"La regla del módulo, la que hay
