na pasada · Teil 4: tres voces, ocho afirmaciones\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l6e1\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 COMPLETO, tal cual cae en el examen: una conversación de casi tres minutos, UNA sola pasada y SIETE afirmaciones en alemán que se marcan Richtig o Falsch. Léelas las siete antes de darle al play — tienes 60 segundos, ni uno más — y no vuelvas atrás. Afirmación 1 de 7.\",\"audio\":\"$18\",\"question\":\"Leo hat an seinem ersten Tag vor allem Formulare ausgefüllt.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich hab drei Stunden lang nur Formulare ausgefüllt» — es lo primero que cuenta\"],\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m12gzstichwort\"],\"tip\":\"La afirmación 1 llega enseguida y suele ser la más fácil: sirve para engancharte al audio. Si la fallas, no es de oído — es que aún estabas leyendo.\"},{\"id\":\"b1m12l6e2\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 2 de 7. Misma conversación, misma pasada.\",\"audio\":\"$19\",\"question\":\"Die Kollegen haben Leo erst nach ein paar Tagen zum Essen mitgenommen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Zwei haben mich gleich mittags mitgenommen, ohne dass ich fragen musste»: el primer día y sin pedirlo\",null],\"itemIds\":[\"b1m12gzeinmalhoeren\"],\"tip\":\"«gleich» = enseguida. Una palabra de dos sílabas decide el ítem, y en una sola pasada no hay tiempo de traducirla: hay que tenerla ya.\"},{\"id\":\"b1m12l6e13\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 3 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Am meisten stört Leo der lange Weg zur Arbeit.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Der Weg. Fünfzig Minuten hin, fünfzig zurück, und das jeden Tag». De los compañeros dice justo que son majos\"],\"itemIds\":[\"b1m12gzeinmalhoeren\"],\"tip\":\"En el Teil 3 la información que decide llega casi siempre después de una pregunta corta del otro («Wo ist dann das Problem?»). Las preguntas del interlocutor son señales de tráfico: detrás va la respuesta que se pregunta.\"},{\"id\":\"b1m12l6e14\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 4 de 7. Aquí se pregunta por la opinión de MIRA, la compañera de curso que habla con Leo, no por la de él. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Mira findet einen Umzug wegen des Praktikums sinnvoll.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Mira lo pone en duda: «Umziehen? Wegen eines Praktikums von drei Monaten? Das würd ich mir gut überlegen»\",null],\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m12gzsehedasanders\"],\"tip\":\"Dos personas hablando significa DOS opiniones, y el Teil 3 mezcla afirmaciones sobre una y sobre otra. Antes de escuchar, subraya en cada afirmación de quién habla.\"},{\"id\":\"b1m12l6e15\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 5 de 7. Un dato con condición: el «pero» está en el tiempo. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1c\",\"question\":\"Leo darf von Anfang an zweimal pro Woche zu Hause arbeiten.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Im ersten Monat geht das nicht, danach angeblich schon»: al principio, no\",null],\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m12gzteilnehmenan\"],\"tip\":\"«angeblich» = supuestamente, y avisa de que quien habla no se lo cree del todo. Es de esas palabras que no cambian el dato pero sí el tono, y el examen las usa para separar el 60 del 80.\"},{\"id\":\"b1m12l6e16\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 6 de 7 — y otra vez se pregunta por Mira. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1d\",\"question\":\"Mira hat im Zug für eine Prüfung gelernt.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich hab im Zug ein halbes Jahr lang Vokabeln gelernt, und die Prüfung hab ich am Ende bestanden» — y quien lo dice es Mira, no Leo\"],\"itemIds\":[\"b1m12gzbestehen\",\"b1m12gzsichvorbereitenauf\"],\"tip\":\"Ojo al cambio de tema: la conversación pasa del trabajo al tren y de ahí a un examen. En el Teil 3 se habla de tres o cuatro cosas distintas, y las afirmaciones siguen ese orden.\"},{\"id\":\"b1m12l6e17\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 7 de 7 — la última, y hay que inferirla del tono. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1e\",\"question\":\"Leo will das Praktikum abbrechen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Dice lo contrario y encima se ríe de sí mismo: «Natürlich. Ich beschwer mich nur gern. Ehrlich gesagt ist es die beste Stelle, die ich bisher hatte»\",null],\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m10ehrlichgesagt\"],\"tip\":\"Quien solo oye las quejas marca Richtig. La última afirmación del Teil 3 casi siempre pide juntar el tono con el contenido: alguien puede protestar durante dos minutos y estar encantado.\"},{\"id\":\"b1m12l6e3\",\"type\":\"audiomc\",\"prompt\":\"Teil 4: discusión a tres voces. ¿QUIÉN dice esto? Nadie anuncia su papel antes de hablar; la única ayuda es que quien modera nombra a los invitados al dar el turno, igual que en el examen. Dos escuchas. Afirmación 1 de 8.\",\"audio\":\"$1f\",\"question\":\"„Familie und freie Zeiteinteilung passen nicht zusammen.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La moderadora solo da el turno con una pregunta\",null,\"Herr Berger dice justo lo contrario: «Da muss ich widersprechen»\"],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzmoderator\"],\"tip\":\"La moderadora casi nunca opina: pregunta y reparte turnos. Descártala salvo que la afirmación sea una pregunta.\"},{\"id\":\"b1m12l6e4\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 2 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$20\",\"question\":\"„Wer nach der Uhr arbeiten muss, zahlt das irgendwann mit der Gesundheit.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Ella no da su opinión\",\"Ella defiende justo los horarios fijos\",null],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzwidersprechen\"]},{\"id\":\"b1m12l6e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 3 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$21\",\"question\":\"„Kinder brauchen einen festen Plan.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La moderadora solo pregunta por la salud y reparte turnos\",null,\"Berger no habla de niños: habla de su propio sueño\"],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzmoderator\"],\"tip\":\"«meine Kinder brauchen ihn auch» no sale en la afirmación: la resume. Si buscas la palabra «Plan» la oyes en Alt, no en las otras dos voces.\"},{\"id\":\"b1m12l6e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 4 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$22\",\"question\":\"„Seit er selbst entscheidet, schläft er besser.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Ella no opina sobre el sueño de nadie\",\"Ella duerme a hora fija con los niños; no es quien decide el horario\",null],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzwidersprechen\"],\"tip\":\"El «er» de la afirmación es Berger hablando de sí mismo: «Seit ich selbst entscheide, schlafe ich besser.» El examen cambia la persona y te obliga a reconocer el turno.\"},{\"id\":\"b1m12l6e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 5 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$23\",\"question\":\"„Das Team plant am Montag, wer wann da ist.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Ella pregunta quién cubre el hueco; no describe el sistema del equipo\",\"Ella ataca justo esa planificación del lunes\",null],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzwidersprechen\"],\"tip\":\"La pregunta de la moderadora («Wer springt ein…») provoca la respuesta. Quien describe el truco del lunes es Berger; Alt lo llama «der Haken» justo después.\"},{\"id\":\"b1m12l6e21\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 6 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$24\",\"question\":\"„Die Planung am Montag hilft nicht, wenn am Mittwoch jemand ausfällt.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La moderadora hace la pregunta que provoca esta respuesta; no la formula ella\",null,\"Berger acaba de describir esa planificación como solución\"],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzwidersprechen\"],\"tip\":\"«Genau das ist der Haken» marca el giro. En el Teil 4, esas fórmulas valen más que el contenido: te dicen de qué lado está cada voz.\"},{\"id\":\"b1m12l6e22\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 7 de 8. Mismo audio, dos escuchas.\",\"audio\":\"$25\",\"question\":\"„In der Pflege fällt jede Woche jemand aus.“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La moderadora no habla de la Pflege\",null,\"Berger dice que en SU equipo casi nadie falta\"],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzmoderator\"],\"tip\":\"Los dos hablan de bajas, con dos segundos de diferencia. La afirmación puntúa la primera vez que se dice el dato de la Pflege, y lo dice Alt.\"},{\"id\":\"b1m12l6e23\",\"type\":\"audiomc\",\"prompt\":\"Teil 4, afirmación 8 de 8. Mismo audio, dos escuchas. En el Teil 4 real siempre hay una afirmación de quien modera.\",\"audio\":\"$26\",\"question\":\"„Wer springt ein, wenn Sie um drei Uhr nachts arbeiten?“ — Wer sagt das?\",\"options\":[\"die Moderatorin\",\"Frau Alt\",\"Herr Berger\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella responde DESPUÉS, con el argumento del Haken; la pregunta la hace quien modera\",\"Él responde a esa pregunta; no la hace\"],\"itemIds\":[\"b1m12gzwersagtwas\",\"b1m12gzmoderator\"],\"tip\":\"Descartar a la moderadora por sistema cuesta un ítem. Su marca no es el tema: es la forma. Aquí no opina: da el turno con una pregunta, y esa pregunta es el ítem.\"},{\"id\":\"b1m12l6e5\",\"type\":\"bucket\",\"prompt\":\"¿Está dando la razón o contradiciendo?\",\"categories\":[\"Zustimmung\",\"Widerspruch\"],\"items\":[{\"text\":\"Genau das meine ich auch.\",\"bucket\":0},{\"text\":\"Da muss ich Ihnen widersprechen.\",\"bucket\":1},{\"text\":\"Da haben Sie völlig recht.\",\"bucket\":0},{\"text\":\"Das sehe ich ganz anders.\",\"bucket\":1},{\"text\":\"Dem kann ich nur zustimmen.\",\"bucket\":0},{\"text\":\"Also, davon halte ich gar nichts.\",\"bucket\":1}],\"itemIds\":[\"b1m12gzzustimmen\",\"b1m12gzwidersprechen\"],\"tip\":\"Estas seis fórmulas te sirven para DOS cosas: identificar turnos en el Hören y reaccionar en el Sprechen Teil 1.\"},{\"id\":\"b1m12l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el caso\",\"wrong\":\"Ich stimme dich zu.\",\"answers\":[\"Ich stimme dir zu.\",\"Ich stimme dir zu\"],\"why\":\"zustimmen rige DATIVO de persona: ich stimme dir / Ihnen / ihm zu. Lo mismo con widersprechen (ich widerspreche dir). El español «te doy la razón» sí usa dativo, pero «estoy de acuerdo contigo» empuja al calco con acusativo.\",\"translation\":\"Estoy de acuerdo contigo.\",\"itemIds\":[\"b1m12gzzustimmen\"]},{\"id\":\"b1m12l6e7\",\"type\":\"cloze\",\"prompt\":\"Contradecir con cortesía\",\"text\":\"Da muss ich Ihnen leider ___.\",\"answers\":[\"widersprechen\"],\"translation\":\"Ahí tengo que contradecirle, lo siento.\",\"hints\":[\"wider + sprechen\",\"wider___\"],\"itemIds\":[\"b1m12gzwidersprechen\"]},{\"id\":\"b1m12l6e8\",\"type\":\"match\",\"prompt\":\"Empareja las fórmulas de la discusión\",\"pairs\":[{\"target\":\"Da haben Sie völlig recht.\",\"source\":\"Ahí tiene toda la razón.\"},{\"target\":\"Das sehe ich ganz anders.\",\"source\":\"Yo lo veo completamente distinto.\"},{\"target\":\"Wie sehen Sie das?\",\"source\":\"¿Usted cómo lo ve? (el moderador da el turno)\"},{\"target\":\"Darf ich kurz etwas ergänzen?\",\"source\":\"¿Puedo añadir algo brevemente?\"}],\"itemIds\":[\"b1m12gzmoderator\",\"b1m12gzzustimmen\"]},{\"id\":\"b1m12l6e9\",\"type\":\"gapbank\",\"prompt\":\"Completa la estrategia del Teil 4\",\"text\":\"In den ersten Sekunden unterscheide ich die drei ___. Die ___ stellt nur Fragen. Wenn jemand sagt „Da muss ich ___“, kenne ich sofort seine Position.\",\"answers\":[\"Stimmen\",\"Moderatorin\",\"widersprechen\"],\"bank\":[\"Stimmen\",\"Moderatorin\",\"widersprechen\",\"Anzeigen\",\"Gebühr\",\"Widerspruch\"],\"translation\":\"En los primeros segundos distingo las tres voces. La moderadora solo hace preguntas. Si alguien dice «ahí tengo que contradecir», ya conozco su postura.\",\"itemIds\":[\"b1m12gzmoderator\",\"b1m12gzwidersprechen\"]},{\"id\":\"b1m12l6e10\",\"type\":\"mc\",\"prompt\":\"Falso amigo del módulo\",\"question\":\"„Wir haben zwei Stunden über das Thema diskutiert.“\",\"options\":[\"Estuvimos dos horas debatiendo sobre el tema\",\"Estuvimos dos horas discutiendo (peleándonos)\",\"Estuvimos dos horas hablando mal del tema\"],\"answer\":0,\"whyWrong\":[null,\"Pelearse es «streiten», no «diskutieren»\",\"«diskutieren» es neutro: no implica nada negativo\"],\"itemIds\":[\"b1m12gzdiskutieren\"],\"tip\":\"diskutieren = debatir, tranquilamente. Si en el examen oral dices «wir haben diskutiert», nadie entiende que os peleasteis.\"},{\"id\":\"b1m12l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En eso le doy la razón, pero en el segundo punto le contradigo\",\"answers\":[\"Da stimme ich Ihnen zu, aber beim zweiten Punkt widerspreche ich Ihnen\",\"Da stimme ich Ihnen zu, aber beim zweiten Punkt widerspreche ich Ihnen.\",\"Da stimme ich dir zu, aber beim zweiten Punkt widerspreche ich dir\"],\"hints\":[\"Da abre → inversión: Da stimme ich…\",\"Ambos verbos con DATIVO: Ihnen / dir\"],\"itemIds\":[\"b1m12gzzustimmen\",\"b1m12gzwidersprechen\"],\"tip\":\"Dar la razón en algo antes de contradecir es lo que el examen premia como «Interaktion». Es también buena educación.\"},{\"id\":\"b1m12l6e12\",\"type\":\"hearreal\",\"prompt\":\"Los dos nativos del Teil 3 no hablan como el libro. ¿Cuál de las dos oíste?\",\"book\":\"Die Kollegen sind nett, oder?\",\"real\":\"Die Kollegen sind nett, ne?\",\"translation\":\"Los compañeros son majos, ¿no?\",\"ask\":\"which\",\"itemIds\":[\"b1m12gzeinmalhoeren\",\"b1m12gzzustimmen\"],\"tip\":\"«ne?» (en el sur, «gell?») es la coletilla con la que se busca confirmación en el habla real: en el Teil 3 cae cada pocas frases y no aparece en ninguna transcripción de manual. Tú, en el Sprechen, di «oder?» o «nicht wahr?»: se entienden igual y no suenan a jerga.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m12-1\",\"book\":\"Da bin ich anderer Meinung.\",\"real\":\"Seh ich anders.\",\"meaning\":\"Yo lo veo de otra forma.\",\"when\":\"Entre compañeros y en debates informales. Delante de los examinadores no: sin «das» y sin la -e, la frase suena a corte seco y pierde el «yo lo veo» que el criterio de Interaktion quiere oír.\",\"register\":\"amigos\",\"exam\":\"Das sehe ich anders.\",\"note\":\"El alemán hablado se come el sujeto («das») cuando el contexto ya lo da, y de paso la -e de «sehe». En el examen se recupera todo: dos palabras más y cambia la banda de registro.\",\"sound\":\"zee ij AN-das\",\"level\":\"b1\",\"produce\":false}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"27:I[27201,[\"/seshat/_nex
