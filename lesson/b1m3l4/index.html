oktor Weber mit unserem Tipp der Woche — für alle, die «mehr Bewegung» hören und sofort ans Fitnessstudio denken. Müssen Sie nicht. Nehmen Sie die Treppe, auch wenn Sie im fünften Stock wohnen. Und an den Tagen, an denen Sie überhaupt keine Lust haben: Steigen Sie einfach zwei Stationen früher aus. Das merken Sie kaum, ähm, und es zählt trotzdem.\",\"question\":\"„Wer sich mehr bewegen will, braucht ein Fitnessstudio.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Müssen Sie nicht»: el gimnasio es justo lo que descarta\",null],\"itemIds\":[\"b1m3dietreppenehmen\",\"b1m3sichbewegen\",\"b1m3natkeinenbock\"],\"tip\":\"«Müssen Sie nicht» es una frase entera de dos palabras y medio texto depende de ella. Las respuestas cortas son las que más se pierden de oído.\"},{\"id\":\"b1m3l4e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo consejo, segunda tarea. Dos escuchas.\",\"audio\":\"Hier ist die Praxis Doktor Weber mit unserem Tipp der Woche — für alle, die «mehr Bewegung» hören und sofort ans Fitnessstudio denken. Müssen Sie nicht. Nehmen Sie die Treppe, auch wenn Sie im fünften Stock wohnen. Und an den Tagen, an denen Sie überhaupt keine Lust haben: Steigen Sie einfach zwei Stationen früher aus. Das merken Sie kaum, ähm, und es zählt trotzdem.\",\"question\":\"¿Qué propone para los días sin ganas?\",\"options\":[\"Bajarse del transporte dos paradas antes\",\"Ir igualmente al gimnasio\",\"Subir los cinco pisos igualmente\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El gimnasio es lo primero que descarta\",\"Eso es el consejo general, no el de los días sin ganas\"],\"itemIds\":[\"b1m3dietreppenehmen\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m3-2\",\"book\":\"Ich bin sehr müde und erschöpft.\",\"real\":\"Ich bin fix und fertig.\",\"meaning\":\"Estoy hecho polvo / reventado\",\"when\":\"Con amigos y compañeros, tras un día largo o después del deporte. Con el médico no: es una frase hecha coloquial y él espera que describas el síntoma. En un texto de examen, tampoco.\",\"register\":\"amigos\",\"exam\":\"Ich fühle mich völlig erschöpft.\",\"note\":\"«fix und fertig» es un par fijo: fix ya no significa aquí «rápido». Suena cansado, no dramático.\",\"sound\":\"ij bin fiks unt FEA-tij\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m3natfixundfertig\"}}],\"resources\":[{\"label\":\"DW — Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/de/nicos-weg/c-55735270\",\"note\":\"Escenas con médicos y consejos: fíjate en cuándo pasan de Sie a du.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
