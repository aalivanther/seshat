o.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePart 1, estrategia:\u003c/b\u003e oye la pregunta hasta el final. Si pide opinión, no des un dato. «I take the bus» no contesta «What should cities do about traffic?». Empieza por I think / It seems to me / It is clear that, da una razón, cierra.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePart 2, estrategia:\u003c/b\u003e lee la situación. ¿Respondes o empiezas? ¿Eres vecino, compañero, cliente, empleado? Esa pregunta ES el registro. Un «this is a joke» al jefe tumba el tono. Un «I remain your obedient servant» al vecino, también.\u003cbr/\u003e\u003cbr/\u003eLos ítems de abajo son nuestros. El patrón es el del Practice Paper: situaciones de piso, de trabajo, de queja."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m3l10\",\"phaseId\":\"enb2m3\",\"title\":\"Exam lab: Speaking Parts 1 and 2\",\"subtitle\":\"Opiniones, y dos situaciones de rol: una en la que respondes, otra en la que empiezas\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que el oral pide de verdad\",\"itemIds\":[\"enb2m3partoneopinions\",\"enb2m3parttworespond\",\"enb2m3toneandregister\",\"enb2m3turntaking\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué son las Parts 1 y 2, y por qué este módulo las entrena\",\"body\":\"$17\",\"table\":[[\"Situación\",\"Empieza…\",\"Registro\"],[\"vecino nuevo (respondes)\",\"Hello, nice to meet you…\",\"neutral, cálido\"],[\"compañera de piso, no quieres salir (respondes)\",\"I take your point, although…\",\"directo, sin grosería\"],[\"llegas tarde al jefe (empiezas)\",\"I'm sorry I'm late. I was wondering if…\",\"educado, sin disfraz\"],[\"pides que te cubran el finde (empiezas)\",\"I was wondering if you could cover…\",\"petición, no exigencia\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m3l10e1\",\"type\":\"mc\",\"prompt\":\"Part 1: qué se pide\",\"question\":\"«If you were responsible, what leisure facilities would you build in your area?» ¿Qué no vale como respuesta de B2?\",\"options\":[\"«There's a park.» — es un dato, y la pregunta pide una hipótesis y una opinión\",\"«I would build a leisure centre, because older people here have nowhere to go in the afternoon.»\",\"«If I were responsible, I would start with a pool. The nearest one closed last year.»\"],\"answer\":0,\"whyWrong\":[null,\"Eso es opinión + razón. Es lo que pide.\",\"Hipótesis + hecho que la sostiene. También vale.\"],\"itemIds\":[\"enb2m3partoneopinions\"]},{\"id\":\"enb2m3l10e2\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · opinión. Lee las opciones ANTES del play. Dos escuchas.\",\"audio\":\"What responsibilities do families have regarding older relatives who live alone?\",\"question\":\"¿Cuál es la mejor respuesta de B2?\",\"options\":[\"I think families should check in, but the council still has to answer the phone. A helpline that ends in a form is not care.\",\"My neighbour is called Nora.\",\"Yes.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Es un dato. La pregunta pide responsabilidades, no un nombre.\",\"Un yes pelado era A2. En B2 el turno tiene que llevar una razón.\"],\"itemIds\":[\"enb2m3partoneopinions\",\"enb2m3carefortheelderly\",\"enb2m3helpline\"]},{\"id\":\"enb2m3l10e3\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · otra opinión. Dos escuchas.\",\"audio\":\"Some people say we rely too much on banks and apps. What do you think?\",\"question\":\"¿Cuál es la mejor respuesta de B2?\",\"options\":[\"It is clear that apps exclude people who cannot reset a password. Financial services still have to offer a voice, even if digital is cheaper.\",\"I have an app.\",\"Banks are buildings.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dato. No hay opinión ni razón.\",\"Literalidad que no contesta.\"],\"itemIds\":[\"enb2m3itisclearthat\",\"enb2m3financialservices\",\"enb2m3itinthecommunity\"]},{\"id\":\"enb2m3l10e4\",\"type\":\"mc\",\"prompt\":\"Part 2: ¿respondes o empiezas?\",\"question\":\"El interlocutor dice: «We're flat
