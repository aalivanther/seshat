 detalle que lo sostiene.\u003cbr/\u003e\u003cbr/\u003ePartitura de cuatro tiempos, la misma del B1 con un piso más:\u003cbr/\u003e\u003cb\u003e1. Anuncia\u003c/b\u003e — de qué y en cuántos puntos.\u003cbr/\u003e\u003cb\u003e2. El punto\u003c/b\u003e — una frase-tema, un hecho con cifra o nombre.\u003cbr/\u003e\u003cb\u003e3. El detalle y la concesión\u003c/b\u003e — un supporting detail, y un admittedly / nevertheless si hay otro lado.\u003cbr/\u003e\u003cb\u003e4. Cierra\u003c/b\u003e — all things considered / to sum up. Cerrar vale puntos.\u003cbr/\u003e\u003cbr/\u003eEn los treinta segundos \u003cb\u003eno escribas frases\u003c/b\u003e. Cinco palabras sueltas. Si escribes frases las vas a leer, y leer se nota."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l9\",\"phaseId\":\"enb2m1\",\"title\":\"Amy reads it back\",\"subtitle\":\"La historia del módulo, el repaso y el monólogo de dos minutos\",\"minutes\":25,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas\",\"itemIds\":[\"enb2m1rewrite\",\"enb2m1bluntfeedback\",\"enb2m1gettothepoint\",\"enb2m1makeitstand\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos minutos, los mismos treinta segundos\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la tarde en que Amy leyó el borrador\",\"sentences\":[\"Valeria started two afternoons a week at the community advice desk.\",\"She wrote the landlady an email the way she would have written it in Spanish.\",\"Amy read it back and said it was not clear what she meant.\",\"The feedback was blunt, not unkind: put the request in the first line.\",\"She rewrote the whole email on the bus, and this time each paragraph stood alone.\"],\"translation\":\"Valeria empezó dos tardes a la semana en el mostrador de asesoría. Le escribió a la casera un correo como lo habría escrito en español. Amy se lo leyó y dijo que no estaba claro qué quería decir. La crítica fue directa, no cruel: pon la petición en la primera línea. Reescribió el correo entero en el autobús, y esta vez cada párrafo se sostenía solo.\",\"itemIds\":[\"enb2m1rewrite\",\"enb2m1bluntfeedback\",\"enb2m1notclear\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l9e2\",\"type\":\"gapbank\",\"prompt\":\"Espiral del módulo — completa el resumen\",\"text\":\"___ , the problem was the first line. Valeria writes long paragraphs, ___ Amy writes short ones. The draft was honest. ___, it was not clear. ___ Amy's notes, the second version landed.\",\"answers\":[\"To begin with\",\"whereas\",\"Nevertheless\",\"Thanks to\"],\"bank\":[\"To begin with\",\"whereas\",\"Nevertheless\",\"Thanks to\",\"Moreover\",\"lately\",\"so\"],\"translation\":\"Para empezar, el problema era la primera línea. Valeria escribe párrafos largos, mientras que Amy los escribe cortos. El borrador era honesto. Aun así, no era claro. Gracias a las notas de Amy, la segunda versión aterrizó.\",\"itemIds\":[\"enb2m1tobeginwith\",\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1thanksto\"]},{\"id\":\"enb2m1l9e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I've done a lot of progress with my paragraphs lately.\",\"answers\":[\"I've made a lot of progress with my paragraphs lately.\"],\"why\":\"«Hacer progreso» es make, no do. El módulo no reabre las colocaciones del B1: las caza. Y lately, no ultimately: el tiempo reciente.\",\"translation\":\"He avanzado mucho con los párrafos últimamente.\",\"itemIds\":[\"enb1m1madeprogress\",\"enb2m1lately\"]},{\"id\":\"enb2m1l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre los marcadores del módulo\",\"pairs\":[{\"target\":\"whereas\",\"source\":\"mientras que (paralelo)\"},{\"target\":\"nevertheless\",\"source\":\"aun así (giro)\"},{\"target\":\"namely\",\"source\":\"a saber (define)\"},{\"target\":\"admittedly\",\"source\":\"cierto es que (concede)\"},{\"target\":\"to sum up\",\"source\":\"en resumen (cierra)\"}],\"targetSeconds\":22,\"itemIds\":[\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1namely\",\"enb2m1admittedly\",\"enb2m1tosumup\"]},{\"id\":\"enb2m1l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin «rewrite» — la palabra precisa, no el rodeo\",\"source\":\"She had to rewrite the whole email.\",\"forbid\":[\"rewrite\",\"rewrote\",\"rewriting\"],\"answers\":[\"She had to write the whole email again\",\"She had to write the email again from the start\",\"She had to produce a second draft of the whole email\",\"She had to do the whole email again\"],\"translation\":\"Tuvo que reescribir el correo entero.\",\"itemIds\":[\"enb2m1rewrite\",\"enb2m1firstdraft\"]},{\"id\":\"enb2m1l9e6\",\"type\":\"cloze\",\"prompt\":\"La crítica, con el adjetivo justo\",\"text\":\"The feedback was ___, not unkind.\",\"answers\":[\"blunt\"],\"translation\":\"La crítica fue directa, no cruel.\",\"itemIds\":[\"enb2m1bluntfeedback\"],\"tip\":\"«Blunt» no es «tonto»: es «sin rodeos». En este módulo es un cumplido técnico. Amy no endulza, y por eso Valeria puede reescribir.\"},{\"id\":\"enb2m1l9e7\",\"type\":\"speak\",\"prompt\":\"La frase de cierre del monólogo\",\"text\":\"All things considered, each paragraph has to stand alone.\",\"phonetic\":\"ool zings kon-SÍ-dad, iich PÁ-ra-graaf jas tu stand a-LÓUN\",\"translation\":\"En conjunto, cada párrafo tiene que sostenerse solo.\",\"itemIds\":[\"enb2m1allthingsconsidered\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l9e8\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: treinta segundos de notas, dos minutos de habla. La segunda pasada sale mejor.\",\"topic\":\"A time when someone told you your writing was not clear — and what you changed\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about the first email I wrote at the advice desk. I'll say three things.»\"},{\"title\":\"2. The point\",\"hint\":\"Frase-tema y un hecho: quién lo leyó, qué dijo, una cita corta. «The problem was that the request sat in the third line.»\"},{\"title\":\"3. Detail and concession\",\"hint\":\"Un detalle que sostiene, y una concesión: «Admittedly, the English was fine. Nevertheless…»\"},{\"title\":\"4. Close\",\"hint\":\"Cierra con una regla que te quedas: «All things considered, I now put the point first.»\"}],\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"checklist\":[\"Hablé al menos 1:45 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Puse el punto en una frase-tema, no en la tercera línea\",\"Usé al menos un marcador de concesión (admittedly, granted, it is true that) y uno de cierre\",\"Di un dato concreto: un nombre, un sitio, una línea del correo\",\"Cerré; no me apagué a media idea\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «The problem was that I had written the email the way I would write it in Spanish. Amy, who shares the flat with me, read it back and said it wasn't clear what I meant. The request was in the third line, namely a question about the bin rota.»\",\"itemIds\":[\"enb2m1theproblemis\",\"enb2m1admittedly\",\"enb2m1allthingsconsidered\",\"enb2m1namely\",\"enb2m1gettothepoint\"],\"tip\":\"Treinta segundos no son para escribir el discurso: son para decidir qué es el punto y qué es el detalle. Si eso está claro, los dos minutos se llenan solos.\"},{\"id\":\"enb2m1l9e9\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre\",\"text\":\"Get to the point in the first line.\",\"translation\":\"Ve al grano en la primera línea.\",\"itemIds\":[\"enb2m1gettothepoint\"]},{\"id\":\"enb2m1l9e10\",\"type\":\"type\",\"prompt\":\"Cierre del módulo, en una frase\",\"question\":\"Haz que el párrafo se sostenga solo.\",\"answers\":[\"Make the paragraph stand up on its own.\",\"Make each paragraph stand up on its own.\",\"Make the paragraph stand alone.\"],\"itemIds\":[\"enb2m1makeitstand\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l9e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"La crítica fue directa, no cruel.\",\"answers\":[\"The feedback was blunt, not unkind.\",\"The feedback was blunt not unkind.\"],\"itemIds\":[\"enb2m1bluntfeedback\"]},{\"id\":\"enb2m1l9e12\",\"type\":\"audiomc\",\"prompt\":\"Listening Part 4 en formato real: dos voces, postura y contraste. Una sola escucha — el examen te dará dos. Cuaderno.\",\"notepad\":true,\"audio\":\"I thought the column was harsh.|Harsh isn't the same as wrong, though. The briefing refuses to tell you what to do, whereas the column tells you on line one.|That's because one is a briefing and one is a column.|Granted. That said, I wouldn't write the column's ending in the exam. «Stop calling that a loss» is a punch. Examiners don't mark punches. They mark whether the paragraph stood up.\",\"question\":\"¿Qué distingue, para la segunda voz, un informe de una columna?\",\"options\":[\"El informe se niega a decirte qué hacer; la columna te lo dice en la primera línea\",\"El informe no tiene datos y la columna sí\",\"El informe se puede usar en el examen y la columna no se puede leer\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Los dos tienen datos. Cambia la función.\",\"Los dos se pueden leer. Lo que no se copia es el gancho del cierre.\"],\"itemIds\":[\"enb2m1whereas\",\"enb2m1granted\",\"enb2m1thatsaid\"]},{\"id\":\"enb2m1l9e13\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — Valeria y Ben, dos años y un párrafo. Léelas antes del play. Cuaderno. Dos escuchas. Pregunta 1 de 3.\",\"notepad\":true,\"audio\":\"So you've started at the advice desk.|Two afternoons. They asked me to write an email for a neighbour, to the landlady. I wrote it the way I'd write it at home.|And?|Amy said it wasn't clear. Blunt, not unkind. The request was in the third line. Whereas she puts the point first, I had written a conversation.|Did you rewrite it?|On the 55, between two stops. To begin with I was annoyed. Then I saw she was right. Thanks to that, the second version actually got an answer.|What did the landlady say?|Recycling on Thursday, waste on Monday, green bags still fine. One paragraph, one idea. She even said it was a clear note.|Not bad for a first week.|Not bad. All things considered, I needed someone to say it wasn't clear. I'd have kept writing Spanish paragraphs in English for another year.\",\"question\":\"¿Dónde reescribió Valeria el correo?\",\"options\":[\"En el autobús 55, entre dos paradas\",\"En el mostrador, con el vecino delante\",\"En la cocina, con Amy dictándole\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El mostrador es donde se lo pidieron, no donde lo reescribió.\",\"Amy lo leyó y lo nombró; no se lo dictó.\"],\"itemIds\":[\"enb2m1rewrite\",\"enb2m1bluntfeedback\"]},{\"id\":\"enb2m1l9e14\",\"type\":\"audiomc\",\"prompt\":\"Misma conversación, pregunta 2 de 3.\",\"notepad\":true,\"audio\":\"So you've started at the advice desk.|Two afternoons. They asked me to write an email for a neighbour, to the landlady. I wrote it the way I'd write it at home.|And?|Amy said it wasn't clear. Blunt, not unkind. The request was in the third line. Whereas she puts the point first, I had written a conversation.|Did you rewrite it?|On the 55, between two stops. To begin with I was annoyed. Then I saw she was right. Thanks to that, the second version actually got an answer.|What did the landlady say?|Recycling on Thursday, waste on Monday, green bags still fine. One paragraph, one idea. She even said it was a clear note.|Not bad for a first week.|Not bad. All things considered, I needed someone to say it wasn't clear. I'd have kept writing Spanish paragraphs in English for another year.\",\"question\":\"¿Qué consiguió la segunda versión que la primera no?\",\"options\":[\"Una respuesta de la casera\",\"Que Amy le pidiera perdón\",\"Que el vecino escribiera él el siguiente correo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Amy no se disculpa: acertó.\",\"De eso no se habla.\"],\"itemIds\":[\"enb2m1thanksto\",\"enb2m1asaresult\"]},{\"id\":\"enb2m1l9e15\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3 de 3: la de actitud.\",\"notepad\":true,\"audio\":\"So you've started at the advice desk.|Two afternoons. They asked me to write an email for a neighbour, to the landlady. I wrote it the way I'd write it at home.|And?|Amy said it wasn't clear. Blunt, not unkind. The request was in the third line. Whereas she puts the point first, I had written a conversation.|Did you rewrite it?|On the 55, between two stops. To begin with I was annoyed. Then I saw she was right. Thanks to that, the second version actually got an answer.|What did the landlady say?|Recycling on Thursday, waste on Monday, green bags still fine. One paragraph, one idea. She even said it was a clear note.|Not bad for a first week.|Not bad. All things considered, I needed someone to say it wasn't clear. I'd have kept writing Spanish paragraphs in English for another year.\",\"question\":\"¿Qué quiere decir Valeria con «I needed someone to say it wasn't clear»?\",\"options\":[\"Que sin esa crítica habría seguido escribiendo párrafos españoles en inglés\",\"Que Amy se pasó de dura y ahora lo reconoce\",\"Que el vecino no entendía inglés y hacía falta un traductor\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«Blunt, not unkind» y «I needed someone» no son una queja: son un agradecimiento a destiempo.\",\"El vecino pedía un correo en inglés, no una traducción oral.\"],\"itemIds\":[\"enb2m1bluntfeedback\",\"enb2m1allthingsconsidered\",\"enb2m1notclear\"],\"tip\":\"La pregunta de actitud se contesta con lo que la persona QUIERE DECIR. La pista está en la frase de después: «I'd have kept writing Spanish paragraphs in English for another year.»\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m1-4\",\"book\":\"Furthermore\",\"real\":\"And another thing.\",\"meaning\":\"Además / Y otra cosa\",\"when\":\"Para sumar un punto en una discusión de cocina o de rellano. Con Nora, con Ben, con Sam. En un informe o en el Writing 1, Moreover o What is more. «And another thing» en un ensayo baja el registro; «furthermore» en el pub lo sube de más.\",\"register\":\"amigos\",\"exam\":\"What is more, the ending repeats the opening.\",\"note\":\"Furthermore y moreover son la misma altura formal. What's more es la de en medio. And another thing es la de la calle. Tres trajes, una función: sumar.\",\"sound\":\"and a-NÁ-dha zing\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m1natanotherthing\"}}],\"resources\":[{\"label\":\"LanguageCert B2 Communicator — Spoken (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b2-communicator-2282\",\"note\":\"Mira el Part 4: treinta segundos de notas, dos minutos de monólogo. Cronométrate en casa con el reloj del móvil. El minuto extra respecto al B1 se lo lleva entero el habla, no la preparación.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}
