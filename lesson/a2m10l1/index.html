c/b\u003e — el momento sagrado en que el trabajo termina. No es ninguna fiesta: es el derecho a irse a casa. \u003ci\u003eIch habe Feierabend!\u003c/i\u003e = ya terminé por hoy. Un colega que a las cinco dice solo «Feierabend!» está diciendo: se acabó, nos vamos. Para contar tu jornada de AYER ya tienes la herramienta: la pinza del Perfekt — \u003ci\u003eIch habe acht Stunden gearbeitet\u003c/i\u003e.\",\"table\":[[\"la pieza\",\"úsala así\"],[\"der Kollege / die Kollegin\",\"Mein Kollege heißt Leo\"],[\"der Chef / die Chefin\",\"Mein Chef trinkt viel Kaffee\"],[\"eine Pause machen\",\"Um zwölf Uhr mache ich eine Pause\"],[\"der Feierabend\",\"Um fünf Uhr habe ich Feierabend\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m10l1e1\",\"type\":\"mc\",\"prompt\":\"La palabra cultural\",\"question\":\"Tu colega mira el reloj a las cinco y dice: „Feierabend!“ ¿Qué significa?\",\"options\":[\"¡Fin de la jornada — nos vamos a casa!\",\"¡Esta noche hay una fiesta!\",\"¡Empieza el turno de tarde!\"],\"answer\":0,\"whyWrong\":[null,\"Feier suena a fiesta, pero el Feierabend no se celebra con nadie: es el momento de irse a casa\",\"Al revés: el Feierabend es el FINAL del trabajo, no el principio de nada\"],\"itemIds\":[\"a2m10feierabend\"],\"tip\":\"Feierabend = el final sagrado de la jornada. Los alemanes lo protegen como un tesoro — y también se desea: «Schönen Feierabend!»\"},{\"id\":\"a2m10l1e2\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del trabajo\",\"pairs\":[{\"target\":\"der Kollege\",\"source\":\"el colega (del trabajo)\"},{\"target\":\"der Chef\",\"source\":\"el jefe\"},{\"target\":\"die Pause\",\"source\":\"la pausa\"},{\"target\":\"der Feierabend\",\"source\":\"el fin de la jornada\"}],\"itemIds\":[\"a2m10kollege\",\"a2m10chef\",\"a2m10pause\",\"a2m10feierabend\"]},{\"id\":\"a2m10l1e3\",\"type\":\"mc\",\"prompt\":\"Caza el falso amigo\",\"question\":\"En alemán, «der Chef» es ...\",\"options\":[\"el jefe\",\"el cocinero\",\"el camarero jefe\"],\"answer\":0,\"whyWrong\":[null,\"El cocinero es der Koch — como Nico. Chef = jefe, siempre\",\"El camarero es der Kellner — y el Chef puede no pisar la cocina jamás\"],\"itemIds\":[\"a2m10chef\",\"koch\",\"kellner\"],\"tip\":\"El falso amigo estrella del mundo laboral: si tu Chef alemán cocina, es pura casualidad.\"},{\"id\":\"a2m10l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa la pausa de mediodía\",\"text\":\"Um zwölf Uhr mache ich eine ___.\",\"answers\":[\"Pause\"],\"translation\":\"A las doce hago una pausa.\",\"hints\":[\"El descanso de mediodía, con mayúscula\",\"P-a-u-s-e\"],\"itemIds\":[\"a2m10pause\",\"a2m10pausemachen\"],\"tip\":\"La pausa se «hace»: eine Pause machen — igual que en español, sin verbo especial.\"},{\"id\":\"a2m10l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa — tu jornada de ayer, en Perfekt (repaso)\",\"text\":\"Ich habe gestern acht Stunden ___. (trabajado)\",\"answers\":[\"gearbeitet\"],\"translation\":\"Ayer trabajé ocho horas.\",\"hints\":[\"La fábrica ge—t de a2m1, con raíz en -t\",\"ge + arbeit + et, cerrando la pinza\"],\"itemIds\":[\"gearbeitet\",\"stunde\",\"gestern\"],\"tip\":\"El Arbeitstag de ayer se cuenta con tu pinza del Perfekt: habe 2º, gearbeitet al final.\"},{\"id\":\"a2m10l1e6\",\"type\":\"build\",\"prompt\":\"Construye — las dos posiciones valen\",\"target\":\"Ich mache um zwölf Uhr eine Pause\",\"translation\":\"Hago una pausa a las doce\",\"altTargets\":[\"Um zwölf Uhr mache ich eine Pause\"],\"distractors\":[\"machst\",\"Pausen\"],\"itemIds\":[\"a2m10pausemachen\",\"a2m10pause\",\"umachtuhr\"],\"tip\":\"Empieces con Ich o con Um zwölf Uhr, el verbo mache no suelta la 2ª posición — tu inversión de siempre.\"},{\"id\":\"a2m10l1e7\",\"type\":\"listen\",\"prompt\":\"Escucha el grito de las cinco\",\"text\":\"Ich habe Feierabend!\",\"translation\":\"¡He terminado de trabajar por hoy!\",\"hints\":[\"habe + la palabra sagrada\",\"Feier + Abend, todo junto\"],\"itemIds\":[\"a2m10ichhabefeierabend\",\"a2m10feierabend\"]},{\"id\":\"a2m10l1e8\",\"type\":\"mc\",\"prompt\":\"¿Quién es quién en la oficina?\",\"question\":\"„Meine Kollegin trinkt Kaffee mit dem Chef.“ — ¿Quiénes aparecen?\",\"options\":[\"Una colega y el jefe\",\"Dos jefas\",\"Una clienta y un camarero\"],\"answer\":0,\"whyWrong\":[null,\"die Kollegin es colega, no jefa — la jefa sería die Chefin\",\"Ni Kunde ni Kellner: aquí todos son del trabajo — Kollegin y Chef\"],\"itemIds\":[\"a2m10kollege\",\"a2m10chef\",\"kaffee\"],\"tip\":\"Kollege/Kollegin es SOLO del trabajo. Al amigo del alma no lo llames Kollege: para eso está Freund.\"},{\"id\":\"a2m10l1e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡He terminado de trabajar por hoy!\",\"answers\":[\"Ich habe Feierabend\",\"Ich habe Feierabend!\"],\"hints\":[\"habe + la palabra cultural de esta lección\",\"Ich habe Feier...\"],\"itemIds\":[\"a2m10ichhabefeierabend\",\"a2m10feierabend\"],\"tip\":\"Dila el viernes a las cinco y observa las sonrisas: pocas frases alemanas dan tanta alegría como esta.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — busca «Arbeit» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Escenas de trabajo y oficina: escucha cuántas veces suena «Feierabend» en boca nativa.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés
