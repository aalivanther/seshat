u003cbr/\u003e\u003cbr/\u003eY ojo a un detalle de sentido: \u003cb\u003efeel\u003c/b\u003e va con adjetivo (feel \u003cb\u003etired\u003c/b\u003e, feel \u003cb\u003eill\u003c/b\u003e, feel \u003cb\u003ebetter\u003c/b\u003e), nunca con adverbio. Por eso es \u003ci\u003eI feel bad\u003c/i\u003e y no \u003ci\u003eI feel badly\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas tres fórmulas del día a día\u003c/b\u003e —y las tres se construyen con have, no con be:\u003cbr/\u003e· [[I have a cold.|Estoy constipada.]]\u003cbr/\u003e· [[I have a temperature.|Tengo fiebre.]] — \u003ci\u003efever\u003c/i\u003e existe, pero suena a enfermedad tropical: lo normal es \u003ci\u003ea temperature\u003c/i\u003e.\u003cbr/\u003e· [[I have a sore throat.|Me duele la garganta.]] — \u003ci\u003esore\u003c/i\u003e es «dolorido», y se usa con throat, eyes, feet…\u003cbr/\u003e\u003cbr/\u003eLa pregunta con la que empieza todo esto es [[What's the matter?|¿Qué te pasa?]], que no es reproche ninguno: es lo que dice quien te ve mala cara.18:T42c,Este merece nota propia, porque no es un fallo de estilo: es un fallo que \u003cb\u003ecambia la conversación de tema\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003econstipated\u003c/b\u003e en inglés significa \u003cb\u003eestreñido\u003c/b\u003e. Nada más. Así que \u003ci\u003eI am constipated\u003c/i\u003e delante de tu jefe, de la farmacéutica o del médico está diciendo exactamente eso, con toda claridad.\u003cbr/\u003e\u003cbr/\u003e«Estar constipado» es [[I have a cold.|Estoy constipada.]] · \u003ci\u003eI've got a cold.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY su vecino:\u003c/b\u003e «tengo frío» es \u003ci\u003eI'm cold\u003c/i\u003e y «estoy resfriado» es \u003ci\u003eI have a cold\u003c/i\u003e. Una letra de diferencia —el artículo— y dos cosas distintas:\u003cbr/\u003e· \u003cb\u003eI'm cold.\u003c/b\u003e = tengo frío (ponme una manta)\u003cbr/\u003e· \u003cb\u003eI have a cold.\u003c/b\u003e = estoy resfriado (ponme un paracetamol)\u003cbr/\u003e\u003cbr/\u003eY ya que estamos con los que engañan: \u003cb\u003esick\u003c/b\u003e en inglés británico no es «enfermo» a secas, es \u003cb\u003econ náuseas\u003c/b\u003e. [[I feel sick.|Tengo ganas de vomitar.]] Si quieres decir «estoy enfermo», la palabra es \u003cb\u003eill\u003c/b\u003e: \u003ci\u003eI'm ill.\u003c/i\u003e (En inglés americano sí usan \u003ci\u003esick\u003c/i\u003e por «enfermo», y de ahí viene el lío.)"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l2\",\"phaseId\":\"ena2m8\",\"title\":\"I don't feel very well\",\"subtitle\":\"Contar el síntoma — y no decirle a nadie que estás estreñido sin querer\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cómo estás y qué tienes\",\"itemIds\":[\"ena2m8whatsthematter\",\"ena2m8idontfeelwell\",\"ena2m8ihaveacold\",\"ena2m8ihaveatemperature\",\"ena2m8ifeelsick\",\"ena2m8ihaveasorethroat\",\"ena2m8constipated\",\"ena2m1tired\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«Me siento mal»: el inglés no se siente A SÍ MISMO\",\"body\":\"$17\",\"table\":[[\"en español\",\"en inglés, bien\",\"en inglés, mal\"],[\"Me encuentro mal.\",\"I don't feel very well.\",\"I don't feel myself well.\"],[\"Me siento cansada.\",\"I feel tired.\",\"I feel myself tired.\"],[\"¿Cómo te encuentras?\",\"How do you feel?\",\"How do you feel yourself?\"],[\"Tengo fiebre.\",\"I have a temperature.\",\"I have fever.\"],[\"Me duele la garganta.\",\"I have a sore throat.\",\"I have pain in my throat.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«Estoy constipado» — el falso amigo que no marca: rompe\",\"body\":\"$18\",\"table\":[[\"si quieres decir…\",\"di…\",\"porque si no…\"],[\"Estoy constipado.\",\"I have a cold.\",\"I am constipated = estoy estreñido\"],[\"Tengo frío.\",\"I'm cold.\",\"I have a cold = estoy resfriado\"],[\"Estoy enfermo.\",\"I'm ill.\",\"I'm sick (en UK) = tengo náuseas\"],[\"Tengo ganas de vomitar.\",\"I
