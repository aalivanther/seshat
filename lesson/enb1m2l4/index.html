/\u003e· \u003cb\u003eincome\u003c/b\u003e — \u003cb\u003etodo\u003c/b\u003e lo que entra, venga de donde venga: sueldo, ayudas, alquileres. Es la palabra de los formularios.\u003cbr/\u003e· \u003cb\u003epay\u003c/b\u003e — la genérica, y la que más se dice: \u003ci\u003ethe pay is terrible\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas condiciones:\u003c/b\u003e \u003ci\u003epermanent\u003c/i\u003e (fijo) frente a \u003ci\u003etemporary\u003c/i\u003e (temporal); \u003ci\u003efull-time\u003c/i\u003e / \u003ci\u003epart-time\u003c/i\u003e; \u003ci\u003eovertime\u003c/i\u003e (horas extra); \u003ci\u003eprospects\u003c/i\u003e (perspectivas de ascender o aprender).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la gramática escondida del vocabulario:\u003c/b\u003e el handbook de B1 pide «sintagmas nominales con pre- y post-modificación». Traducido: hay dos sitios donde colgar la información de un sustantivo.\u003cbr/\u003e· \u003cb\u003eDelante\u003c/b\u003e, con adjetivo o palabra compuesta: \u003ci\u003ea \u003cb\u003ewell-paid\u003c/b\u003e job\u003c/i\u003e, \u003ci\u003ea \u003cb\u003enight\u003c/b\u003e shift\u003c/i\u003e, \u003ci\u003ea \u003cb\u003epart-time\u003c/b\u003e contract\u003c/i\u003e. Ojo al guion: \u003ci\u003ewell-paid\u003c/i\u003e lleva guion delante del sustantivo, y la puntuación puntúa.\u003cbr/\u003e· \u003cb\u003eDetrás\u003c/b\u003e, con preposición o relativa: \u003ci\u003ea job \u003cb\u003ewith good prospects\u003c/b\u003e\u003c/i\u003e, \u003ci\u003ethe shift \u003cb\u003ethat nobody wants\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003eLas dos dicen lo mismo; usar las dos en el mismo texto es lo que el examen llama «range»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l4\",\"phaseId\":\"enb1m2\",\"title\":\"Salary, shifts and prospects\",\"subtitle\":\"El dinero, las condiciones y la carta formal de 70-100 palabras\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que se cobra y en qué condiciones\",\"itemIds\":[\"enb1m2salary\",\"enb1m2hourlywage\",\"enb1m2income\",\"enb1m2prospects\",\"enb1m2overtime\",\"enb1m2permanentcontract\",\"enb1m2temporaryjob\",\"enb1m2wellpaidjob\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres palabras para «sueldo», y por qué importan\",\"body\":\"$17\",\"table\":[[\"Palabra\",\"Qué es exactamente\",\"Ejemplo\"],[\"salary\",\"sueldo de puesto fijo, al mes o al año\",\"a salary of £28,000\"],[\"wage\",\"sueldo por horas o por semana\",\"the hourly wage\"],[\"income\",\"todo lo que entra, venga de donde venga\",\"my monthly income\"],[\"pay\",\"la genérica, la del habla\",\"the pay is terrible\"],[\"overtime\",\"las horas extra\",\"I did six hours' overtime\"],[\"prospects\",\"el futuro que da el puesto\",\"a job with good prospects\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l4e1\",\"type\":\"match\",\"prompt\":\"Empareja el dinero con su nombre\",\"pairs\":[{\"target\":\"the salary\",\"source\":\"el sueldo de un puesto fijo\"},{\"target\":\"the hourly wage\",\"source\":\"el sueldo por hora\"},{\"target\":\"my income\",\"source\":\"mis ingresos, venga de donde venga\"},{\"target\":\"overtime\",\"source\":\"las horas extra\"},{\"target\":\"good prospects\",\"source\":\"buenas perspectivas de futuro\"}],\"itemIds\":[\"enb1m2salary\",\"enb1m2hourlywage\",\"enb1m2income\",\"enb1m2overtime\",\"enb1m2prospects\"],\"tip\":\"En el formulario del banco y en el de la ayuda al alquiler siempre pone «income», nunca «salary»: quieren saber todo lo que entra, no solo lo que te paga la empresa.\"},{\"id\":\"enb1m2l4e2\",\"type\":\"mc\",\"prompt\":\"La palabra exacta\",\"question\":\"En el café te pagan 13,15 libras por hora. ¿Cómo se llama eso?\",\"options\":[\"the hourly wage\",\"the annual salary\",\"the income tax\"],\"answer\":0,\"whyWrong\":[null,\"«salary» es de puesto fijo y se dice por año o por mes, no por hora.\",\"«income tax» es el impuesto sobre la renta: lo que te quitan, no lo que te dan.\"],\"itemIds\":[\"enb1m2hourlywage\",\"enb1m2salary\"],\"tip\":\"Regla rápida: si lo cuentas por horas, wage. Si lo cuentas por año, salary. Y si te lo preguntan en un formulario, income.\"},{\"id\":\"enb1m2l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra de las horas de más\",\"text\":\"I get paid extra for the hours I work at the weekend: that's ___.\",\"answers\":[\"overtime\"],\"translation\":\"Me pagan aparte las horas que trabajo el fin de semana: eso son las horas extra.\",\"hints\":[\"Una sola palabra, empieza por over…\",\"over_____\"],\"itemIds\":[\"enb1m2overtime\"],\"tip\":\"«overtime» es incontable: nunca «overtimes» ni «an overtime». Se dice «I did four hours' overtime».\"},{\"id\":\"enb1m2l4e4\",\"type\":\"bucket\",\"prompt\":\"¿La información va DELANTE del sustantivo o DETRÁS?\",\"categories\":[\"DELANTE — adjetivo o compuesto\",\"DETRÁS — preposición o relativa\"],\"items\":[{\"text\":\"a well-paid job\",\"bucket\":0},{\"text\":\"a job with good prospects\",\"bucket\":1},{\"text\":\"a full-time contract\",\"bucket\":0},{\"text\":\"a colleague from Colombia\",\"bucket\":1},{\"text\":\"a night shift\",\"bucket\":0},{\"text\":\"the shift that nobody wants\",\"bucket\":1},{\"text\":\"a temporary job\",\"bucket\":0},{\"text\":\"people with experience\",\"bucket\":1}],\"itemIds\":[\"enb1m2wellpaidjob\",\"enb1m2prospects\",\"enb1m2temporaryjob\",\"enb1m2nightshift\"],\"tip\":\"Un texto de B1 que solo usa una de las dos suena plano. Alternarlas es literalmente lo que el criterio de vocabulario llama «range».\"},{\"id\":\"enb1m2l4e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el anuncio con las palabras del dinero\",\"text\":\"The advert says the ___ is £13.15 an hour, and there is ___ at the weekend. It's a ___ contract, not a temporary one, so the ___ are good.\",\"answers\":[\"wage\",\"overtime\",\"permanent\",\"prospects\"],\"bank\":[\"wage\",\"overtime\",\"permanent\",\"prospects\",\"salary\",\"temporary\"],\"translation\":\"El anuncio dice que el sueldo es de 13,15 libras la hora y que hay horas extra el fin de semana. Es un contrato fijo, no temporal, así que las perspectivas son buenas.\",\"itemIds\":[\"enb1m2hourlywage\",\"enb1m2overtime\",\"enb1m2permanentcontract\",\"enb1m2prospects\"],\"tip\":\"El primer hueco es la trampa: «salary» está en el banco a propósito, pero «an hour» exige «wage». El segundo distractor, «temporary», lo descarta la propia frase.\"},{\"id\":\"enb1m2l4e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I earn 1,500 pounds for month.\",\"answers\":[\"I earn 1,500 pounds a month.\"],\"why\":\"«al mes» no es «for month»: en inglés se dice «a month» (o «per month», más formal). Igual con «twice a week», «£13 an hour».\",\"translation\":\"Gano 1.500 libras al mes.\",\"itemIds\":[\"enb1m2moneyiearn\",\"enb1m2salary\"]},{\"id\":\"enb1m2l4e7\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa? Cuidado con «prospects»\",\"source\":\"It's a temporary job, but it has good prospects.\",\"answers\":[\"Es un trabajo temporal, pero tiene buenas perspectivas\",\"Es un trabajo temporal, pero tiene buen futuro\",\"Es un empleo temporal, pero tiene buenas perspectivas\"],\"itemIds\":[\"enb1m2temporaryjob\",\"enb1m2prospects\"],\"tip\":\"«prospects» no son «prospectos» ni folletos: son las posibilidades que te abre el puesto. Es una de las palabras nuevas del temario oficial de B1.\"},{\"id\":\"enb1m2l4e8\",\"type\":\"type\",\"prompt\":\"Producción: la pre-modificación con guion\",\"question\":\"un trabajo bien pagado y con buen horario\",\"answers\":[\"a well-paid job with good hours\",\"a well paid job with good hours\"],\"hints\":[\"Delante del sustantivo, «well paid» se une con guion\",\"a well-____ job with ...\"],\"itemIds\":[\"enb1m2wellpaidjob\"],\"tip\":\"El guion solo va cuando el compuesto está DELANTE del sustantivo: «a well-paid job», pero «the job is well paid». Es un punto de puntuación, y la puntuación entra en el criterio de Organisation.\"},{\"id\":\"enb1m2l4e9\",\"type\":\"mc\",\"prompt\":\"Lo mismo dicho de dos maneras\",\"question\":\"«a job which is well paid and has good hours» dicho en corto →\",\"options\":[\"a well-paid job with good hours\",\"a job well-paid with hours good\",\"a good hours well-paid job\"],\"answer\":0,\"whyWrong\":[null,\"El inglés no pone el adjetivo detrás del sustantivo: eso es orden español.\",\"Se amontonan tres modificadores delante y la frase deja de entenderse. Uno delante, el resto detrás.\"],\"itemIds\":[\"enb1m2wellpaidjob\"],\"tip\":\"Relativa larga → compuesto corto. Saber pasar de una a otra es exactamente la habilidad que mide el Reading Part 2 del examen.\"},{\"id\":\"enb1m2l4e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el anuncio, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Has visto este anuncio en el tablón de la biblioteca del barrio. Escribe a quien lo firma para presentarte al puesto. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Tablón de anuncios — Hackney Community Library\",\"text\":\"PART-TIME LIBRARY ASSISTANT — 20 hours a week, evenings and Saturdays. £13.15 an hour. Experience with the public preferred; no formal qualification necessary. Apply in writing to the Manager before 30 September.\"},\"bullets\":[\"Di a qué puesto te presentas y dónde has visto el anuncio.\",\"Cuenta en una línea qué experiencia tienes y qué sabes hacer.\",\"Pregunta algo concreto del anuncio y di cuándo puedes ir.\"],\"checks\":[{\"re\":\"(advertis|advert|notice board|library assistant)\",\"label\":\"Dices a qué puesto te presentas y dónde lo has visto\"},{\"re\":\"i have (worked|been)\",\"label\":\"Cuentas tu experiencia con un present perfect\"},{\"re\":\"\\\\?\",\"label\":\"Preguntas algo concreto y te ofreces para una fecha\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — si no sabes el nombre, esta es la fórmula (y luego «Yours faithfully»)\",\"Por qué escribes: «I am writing about the post of… advertised on…»\",\"Punto 2 — quién eres, en una línea, con una relativa: «I have worked… and I deal with people who…»\",\"Punto 3 — tu disponibilidad: «Apart from…, I am free…, although I could…»\",\"Tu pregunta: «Could you tell me whether…?»\",\"Cierre: «I look forward to hearing from you. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"apart from\",\"due to\",\"since\",\"therefore\",\"besides\",\"otherwise\",\"at least\",\"for instance\",\"of course\",\"in spite of\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the post of library assistant advertised on the notice board at the library. I have worked at a café for two years, and I deal with the public every day, which means I am used to helping people who are in a hurry. Apart from Tuesday, I am free every evening and on Saturdays, although I could change my shifts if necessary. Could you tell me whether the twenty hours are fixed, or whether the pattern changes each week? I look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m2advert\",\"enb1m2dealwith\",\"enb1m2apartfrom\",\"enb1m2personwho\",\"enb1m2shiftpattern\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y fíjate en el modelo — no hay ni un «I want». En inglés el registro no es un pronombre: es la forma de la petición, y «Could you tell me whether…?» es la fórmula que lo sube de golpe.\"},{\"id\":\"enb1m2l4e11\",\"type\":\"type\",\"prompt\":\"La pregunta educada de la carta\",\"question\":\"¿Podría decirme cuál es el sueldo?\",\"answers\":[\"Could you tell me what the salary is?\",\"Could you tell me what the wage is?\",\"Could you tell me what the pay is?\"],\"hints\":[\"Empieza por «Could you tell me…»\",\"Could you tell me what the ... is?\"],\"itemIds\":[\"enb1m2salary\"],\"tip\":\"Fíjate en el final: «what the salary IS», no «what is the salary». Dentro de otra frase, la pregunta pierde la inversión — lo trabajaremos a fondo en el módulo 3, pero esta fórmula ya te vale hoy.\"},{\"id\":\"enb1m2l4e12\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"The hourly wage is thirteen pounds.\",\"translation\":\"El sueldo por hora es de trece libras.\",\"hints\":[\"Empieza por «The hourly…»\",\"The hourly ... is thirteen pounds.\"],\"itemIds\":[\"enb1m2hourlywage\"],\"tip\":\"«hourly» empieza con h muda: se dice ÁUa-li, igual que «hour». Es de las poquísimas palabras inglesas donde la h no suena.\"},{\"id\":\"enb1m2l4e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en la agencia de empleo. Usa el cuaderno mientras suena. Dos escuchas.\",\"notepad\":true,\"audio\":\"Right, so I've got three that might suit you. The first is a warehouse, twelve pounds an hour, but it's a zero-hours contract, so some weeks you'd get eight hours and some you'd get thirty.|And the others?|A care home, permanent, twenty-six thousand a year, but it's nights. And a library assistant, part-time, thirteen fifteen an hour, evenings and Saturdays.|The library one is the least money, isn't it?|Over a month, yes. But it's the only one of the three where they'll pay for you to do a qualification.\",\"question\":\"¿Por qué recomienda la agencia el puesto de la biblioteca?\",\"options\":[\"Porque es el único que paga una formación\",\"Porque es el que más dinero da al mes\",\"Porque es el único con contrato fijo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[\"Al contrario: la propia Valeria dice que es el que menos paga, y nadie lo desmiente.\",null,\"El fijo es el de la residencia, no el de la biblioteca.\"],\"itemIds\":[\"enb1m2qualification\",\"enb1m2prospects\",\"enb1m2zerohours\"],\"tip\":\"«the only one of the three WHERE they'll pay…»: la clave del ítem vive dentro de una relativa con «where». En el Listening del B1, el dato que decide casi siempre va en la subordinada.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m2-2\",\"book\":\"I earn enough.\",\"real\":\"It pays the bills.\",\"meaning\":\"Da para vivir\",\"when\":\"Contestando a «¿qué tal el trabajo?» cuando no quieres entrar en cifras. Lleva dentro un encogimiento de hombros: no es entusiasmo, es conformidad. En el Writing formal y en el Speaking de examen, no: allí se dice con una frase entera y neutra.\",\"register\":\"neutral\",\"exam\":\"The salary is adequate.\",\"note\":\"Casi siempre va sola, como respuesta corta, y muchas veces con un «well» delante: «Well, it pays the bills». Si alguien te la dice, no le preguntes cuánto gana: te acaba de decir que prefiere no hablar de eso.\",\"sound\":\"it péis̬ de bils̬\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m2natpaysthebills\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Writing)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Descarga el modelo y mira solo la Writing Task 1: el texto de entrada, los tres puntos con viñetas y el rango de 70-100 palabras. Es exactamente la tarea que acabas de hacer.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"
