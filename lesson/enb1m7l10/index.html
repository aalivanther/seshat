dad, ciudad. En B1 el handbook añade una palabra y lo cambia todo — hay que dar datos \u003cb\u003ey expresar opiniones e ideas\u003c/b\u003e. Preguntas reales del practice paper: \u003ci\u003e«Why do you think so many people learn English?»\u003c/i\u003e, \u003ci\u003e«How can schools help students to keep fit?»\u003c/i\u003e Eso no se contesta con un dato. Se contesta con una opinión y \u003cb\u003euna razón\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eLa regla de oro: \u003cb\u003enunca contestes en menos de dos frases\u003c/b\u003e. Dato + porqué. «I'm twenty-five» es una respuesta de A1; «I'm twenty-five, and I think it's a good age to be living abroad, because you can still change your mind» es de B1.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePART 2 — situaciones sociales (3 min).\u003c/b\u003e Dos escenas cortas de unos dos turnos cada una. En una \u003cb\u003eempieza el examinador\u003c/b\u003e y tú respondes: \u003ci\u003e«I'm a tourist in your town. I start: Excuse me, is there a shopping centre nearby?»\u003c/i\u003e En la otra \u003cb\u003eempiezas tú\u003c/b\u003e: \u003ci\u003e«I'm a waiter. You are not happy with the food. You start.»\u003c/i\u003e · \u003ci\u003e«You're behind me in a queue. You have one thing and you're in a hurry. You start.»\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres cosas que hay que saber del Part 2:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eNunca haces de otro personaje.\u003c/b\u003e Eres tú, en esa situación. El que actúa es el examinador.\u003cbr/\u003e2. \u003cb\u003eLo que se mide es el REGISTRO\u003c/b\u003e, no la gramática. Una queja bien montada empieza suave: \u003ci\u003e«I'm afraid there's a problem…»\u003c/i\u003e, nunca \u003ci\u003e«This food is bad»\u003c/i\u003e.\u003cbr/\u003e3. \u003cb\u003eCuando empiezas tú, la primera frase lo decide todo.\u003c/b\u003e Ten tres arranques preparados: pedir ayuda, quejarte y pedir permiso. Son los tres que salen siempre."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l10\",\"phaseId\":\"enb1m7\",\"title\":\"Exam lab: Speaking Parts 1 y 2\",\"subtitle\":\"Deletrear, opinar y meterte en dos escenas de tres minutos\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas que abren las dos partes\",\"itemIds\":[\"enb1m7itsspelt\",\"enb1m7sorrytobotheryou\",\"enb1m7imafraidtheresaproblem\",\"enb1m7wouldyoumindifi\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué son exactamente los Parts 1 y 2, y por qué se fallan\",\"body\":\"$17\",\"table\":[[\"Situación\",\"Cómo se abre\"],[\"pedir ayuda a un desconocido\",\"Sorry to bother you, could you help me?\"],[\"quejarte de algo en un sitio\",\"I'm afraid there's a problem with…\"],[\"colarte con motivo en una cola\",\"Would you mind if I went first? I've only got one thing.\"],[\"llegas tarde y te esperan\",\"I'm so sorry I'm late — the bus never came.\"],[\"pedir que repitan\",\"Sorry, could you say that again?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Part 1 del B1, ¿qué convierte una respuesta de A2 en una de B1?\",\"options\":[\"Añadir una opinión y una razón al dato\",\"Contestar con frases más largas y más vocabulario raro\",\"Contestar más deprisa\"],\"answer\":0,\"whyWrong\":[null,\"La longitud sola no puntúa. El handbook pide expresar «opinions and ideas», no palabras difíciles.\",\"La velocidad no está en la rúbrica; la fluidez sí, y no es lo mismo: se puede ir despacio y sonar fluido.\"],\"itemIds\":[\"enb1m7imean\"],\"tip\":\"Regla de bolsillo para el Part 1: dato, coma, «because…» o «I think…». Dos frases por respuesta y no te va a faltar nada.\"},{\"id\":\"enb1m7l10e2\",\"type\":\"speak\",\"prompt\":\"Lo primero que te van a pedir: tu apellido, y que lo deletrees\",\"text\":\"My surname is Soto. It's spelt S-O-T-O.\",\"phonetic\":\"mai SÉE-neim is̬ SÓU-tou. its spelt es-óu-tii-óu\",\"translation\":\"Mi apellido es Soto. Se escribe S-O-T-O.\",\"itemIds\":[\"enb1m7itsspelt\",\"ensurname\",\"enhowdoyouspellit\"],\"tip\":\"Practica TU apellido, no el de Valeria. Y ojo a las letras que se confunden en inglés: G y J, E e I, A y R. Si tu apellido lleva alguna, dila con una palabra de apoyo: «B for Barcelona».\"},{\"id\":\"enb1m7l10e3\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"Could you spell that for me, please?\",\"translation\":\"¿Me lo puede deletrear, por favor?\",\"hints\":[\"Empieza por la fórmula educada de petición\",\"Could you s... that for me, please?\"],\"itemIds\":[\"ena2m12couldyouspellthat\"],\"tip\":\"Esta te la van a decir a ti y tú se la vas a decir a otros. En el Part 2, si el examinador te dice un nombre y no lo pillas, pedirlo deletreado no resta: demuestra que gestionas la conversación.\"},{\"id\":\"enb1m7l10e4\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · pregunta de opinión. Lee las opciones ANTES del play. Dos escuchas.\",\"audio\":\"Why do you think so many people around the world learn English?\",\"question\":\"¿Cuál es la mejor respuesta para un B1?\",\"options\":[\"Well, I think it's mainly for work, because so many companies use it as a common language.\",\"Yes, many people learn English.\",\"I learn English at a school near my flat.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Repite la pregunta y no dice nada. Es exactamente lo que el examen llama una respuesta de un nivel más bajo.\",\"Da un dato tuyo, y no se te ha preguntado por ti: se te ha preguntado qué opinas.\"],\"itemIds\":[\"enb1m7wellthethingis\",\"enilearnenglishatschool\"],\"tip\":\"Fíjate en la estructura de la buena: «Well,» (medio segundo para pensar) + «I think» (la opinión) + «because» (la razón). Esas tres piezas contestan cualquier pregunta del Part 1.\"},{\"id\":\"enb1m7l10e5\",\"type\":\"transform\",\"prompt\":\"Sube la respuesta de nivel\",\"source\":\"I'm twenty-five.\",\"instruction\":\"Añade opinión y razón, como pide el B1\",\"answers\":[\"I'm twenty-five, and I think it's a good age to be living abroad, because you can still change your mind.\",\"I'm twenty-five, which I think is a good age to be living abroad.\",\"I'm twenty-five, and I think that's a good age to move to another country.\"],\"translation\":\"Tengo veinticinco, y creo que es una buena edad para vivir fuera, porque todavía puedes cambiar de idea.\",\"hints\":[\"Dato, coma, y luego «and I think…»\",\"I'm twenty-five, and I th... it's a good age to ...\"],\"itemIds\":[\"entwentyfive\",\"enb1m7imean\"],\"tip\":\"El dato solo tarda un segundo y deja al examinador esperando. Añadirle una razón no es hablar de más: es lo que el descriptor pide expresamente en este nivel.\"},{\"id\":\"enb1m7l10e6\",\"type\":\"audiomc\",\"prompt\":\"Part 2 · bloque A: empieza el examinador y contestas tú. Dos escuchas.\",\"audio\":\"I'm a passenger on the same train as you. I start: I've got lots of heavy luggage and I can't find the lift. What can I do?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"There's one at the far end of the platform. Do you want me to give you a hand?\",\"I'm afraid not. The lift is broken.\",\"Yes, the luggage is very heavy.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Contesta a una pregunta de sí o no, y no se ha hecho ninguna: se ha pedido ayuda, con «What can I do?».\",\"Repite lo que ha dicho el otro sin resolver nada. Deja la escena parada, y el Part 2 puntúa que la mantengas viva.\"],\"itemIds\":[\"enb1m7sorrytobotheryou\",\"enb1m1imafraidnot\"],\"tip\":\"Cuando te piden ayuda, la respuesta completa tiene dos piezas: la información y un ofrecimiento. La segunda es la que le da al examinador algo a lo que contestar, y por eso la escena dura los dos turnos que tiene que durar.\"},{\"id\":\"enb1m7l10e7\",\"type\":\"match\",\"prompt\":\"Empareja cada situación con la frase que la ABRE\",\"pairs\":[{\"target\":\"Sorry to bother you, could you help me?\",\"source\":\"pedirle ayuda a un desconocido\"},{\"target\":\"I'm afraid there's a problem with my order.\",\"source\":\"quejarte en un sitio, sin sonar bordo\"},{\"target\":\"Would you mind if I went first?\",\"source\":\"colarte con motivo en una cola\"},{\"target\":\"I'm so sorry I'm late.\",\"source\":\"llegas tarde y alguien te espera\"}],\"itemIds\":[\"enb1m7sorrytobotheryou\",\"enb1m7imafraidtheresaproblem\",\"enb1m7wouldyoumindifi\",\"enb1m7speakmoreslowly\"],\"tip\":\"Las cuatro empiezan disculpándose o suavizando. Ninguna va directa al grano — y eso, en el Part 2, es literalmente el criterio de vocabulario y registro.\"},{\"id\":\"enb1m7l10e8\",\"type\":\"speak\",\"prompt\":\"Part 2 · bloque B: EMPIEZAS TÚ. «Soy el camarero de un café. No estás contenta con lo que te he traído. Empiezas tú.» Dilo en voz alta, dos turnos.\",\"text\":\"Sorry, I'm afraid there's a problem with this. I asked for the soup without cream, and I think this one has cream in it. Would you mind changing it?\",\"phonetic\":\"SÓ-ri, aim a-FRÉID déas̬ a PRÓ-blem uid dis. ai aaskt fo de suup uid-ÁUT kriim, and ai zink dis uan jas kriim in it. uud yu maind CHÉIN-ching it\",\"translation\":\"Perdona, me temo que hay un problema con esto. Pedí la sopa sin nata y creo que esta lleva. ¿Te importaría cambiármela?\",\"itemIds\":[\"enb1m7imafraidtheresaproblem\",\"enb1m3wouldyoumind\"],\"tip\":\"Tres movimientos y ni uno de más: suavizar («Sorry, I'm afraid…»), explicar el problema («I asked for… and I think…») y pedir la solución («Would you mind…?»). Sin el tercero, la queja no es una queja: es una protesta.\"},{\"id\":\"enb1m7l10e9\",\"type\":\"speak\",\"prompt\":\"Part 2 · bloque B, segunda escena: «Estás detrás de mí en la cola de una tienda. Llevas una sola cosa y tienes prisa. Empiezas tú.»\",\"text\":\"Sorry to bother you. Would you mind if I went first? I've only got one thing and my bus leaves in five minutes.\",\"phonetic\":\"SÓ-ri tu BÓ-da yu. uud yu maind if ai uent feest. aiv ÓUN-li got uan zing and mai bas liivs̬ in faiv MÍ-nits\",\"translation\":\"Perdona que te moleste. ¿Te importa que pase yo primero? Solo llevo una cosa y mi autobús sale en cinco minutos.\",\"itemIds\":[\"enb1m7wouldyoumindifi\",\"enb1m7sorrytobotheryou\",\"ena2m7thequeue\"],\"tip\":\"La razón («I've only got one thing») no es opcional: pedir un favor sin motivo suena a exigir. Y fíjate en el tiempo verbal detrás de «if»: «if I went», en pasado, aunque estés hablando de ahora mismo.\"},{\"id\":\"enb1m7l10e10\",\"type\":\"errorfix\",\"prompt\":\"Esto lo dijo un hispanohablante en el Part 2. Arréglalo.\",\"wrong\":\"Would you mind that I go first?\",\"answers\":[\"Would you mind if I went first?\"],\"why\":\"«Would you mind…» no admite «that»: pide «if» + pasado («if I went»), o bien un verbo en -ing («Would you mind letting me go first?»). El «que + subjuntivo» del español no tiene sitio ahí.\",\"translation\":\"¿Te importa que pase yo primero?\",\"itemIds\":[\"enb1m7wouldyoumindifi\"]},{\"id\":\"enb1m7l10e11\",\"type\":\"gapbank\",\"prompt\":\"Las tres escenas del Part 2, en tres huecos\",\"text\":\"Part 2, and you are twenty minutes late. You start: I'm so sorry I'm ___ , the bus never came. In the queue at the shop you have one thing and no time: ___ you mind if I went first? And if the interlocutor goes too fast for you: Could you speak a bit more ___ , please?\",\"answers\":[\"late\",\"Would\",\"slowly\"],\"bank\":[\"late\",\"Would\",\"slowly\",\"early\",\"Do\",\"slow\"],\"translation\":\"Part 2, y llegas veinte minutos tarde. Empiezas tú: siento muchísimo llegar tarde, el autobús no vino nunca. En la cola de la tienda llevas una sola cosa y no tienes tiempo: ¿te importa que pase yo primero? Y si el interlocutor va demasiado rápido para ti: ¿puede hablar un poco más despacio, por favor?\",\"itemIds\":[\"enb1m7wouldyoumindifi\",\"enb1m7speakmoreslowly\",\"enb1m7imafraidtheresaproblem\"],\"tip\":\"El tercer hueco es el de siempre: detrás de un verbo va el adverbio, con su -ly. «slow» está en el banco justo para eso.\"},{\"id\":\"enb1m7l10e12\",\"type\":\"type\",\"prompt\":\"Producción — el arranque que más se repite\",\"question\":\"Perdone que le moleste, ¿me puede ayudar?\",\"answers\":[\"Sorry to bother you, could you help me?\",\"Sorry to bother you, could you help me please?\",\"Excuse me, sorry to bother you, could you help me?\"],\"hints\":[\"Empieza por «Sorry to…» y sigue con la petición cortés\",\"Sorry to b... you, could you ...?\"],\"itemIds\":[\"enb1m7sorrytobotheryou\",\"encanyouhelpme\"],\"tip\":\"«Sorry to bother you» te compra medio segundo y compra la buena voluntad del otro. En el Part 2 es la manera más barata de empezar bien una escena.\"},{\"id\":\"enb1m7l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"Me temo que hay un problema con mi pedido.\",\"answers\":[\"I'm afraid there's a problem with my order\",\"I am afraid there is a problem with my order\",\"I'm afraid there is a problem with my order\"],\"hints\":[\"La fórmula educada para abrir una queja\",\"I'm afraid there's a p... with my order\"],\"itemIds\":[\"enb1m7imafraidtheresaproblem\"],\"tip\":\"Siete laboratorios hechos, tres por delante. Y con este ya sabes abrir las dos partes del oral que dependen de ti: la de opinar y la de meterte en una escena.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Spoken, Practice Paper 1\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo los Parts 1 y 2, cronometrados: tres minutos cada uno. Grábate con el móvil y escúchate una vez. Duele, y es lo que más rápido corrige.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/
