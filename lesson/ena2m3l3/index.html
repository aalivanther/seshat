tivo cambia de forma\u003c/b\u003e: \u003ci\u003etwo big old black bags\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl truco que te salva en el oral:\u003c/b\u003e si dudas del orden, \u003cb\u003edi solo uno\u003c/b\u003e. «a black bag» es perfecto e imposible de fallar. Nadie te va a bajar la nota por decir un adjetivo en vez de tres; sí te la bajan por decir \u003ci\u003ea bag black\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e¿Por qué existe este orden? Porque el inglés pone lo más subjetivo lejos del sustantivo y lo más pegado a la cosa —su color— justo al lado. Lo notarás: \u003ci\u003ea black big bag\u003c/i\u003e le suena mal a un nativo aunque no sepa explicarte por qué, igual que a ti te suena mal «una roja bonita casa»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l3\",\"phaseId\":\"ena2m3\",\"title\":\"A big old black bag\",\"subtitle\":\"Cuando hay varios adjetivos, el inglés tiene un orden — y es siempre el mismo\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La ropa, los colores y el bolso\",\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3acoat\",\"ena2m3ascarf\",\"ena2m3boots\",\"ena2m3green\",\"ena2m3brown\",\"ena2m3abigoldblackbag\",\"enred\",\"enblack\",\"enjacket\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Opinión → tamaño → edad → color → sustantivo\",\"body\":\"$17\",\"table\":[[\"opinión\",\"tamaño\",\"edad\",\"color\",\"sustantivo\"],[\"lovely\",\"little\",\"—\",\"—\",\"café\"],[\"—\",\"big\",\"old\",\"black\",\"bag\"],[\"nice\",\"—\",\"new\",\"red\",\"coat\"],[\"—\",\"long\",\"—\",\"dark\",\"hair\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Para señalar a alguien por lo que lleva: IN\",\"body\":\"Cuando identificas a una persona por su ropa, el inglés usa \u003cb\u003ein\u003c/b\u003e, no «of» ni «with»:\u003cbr/\u003e\u003cbr/\u003e· [[the woman in the red coat|la mujer del abrigo rojo]]\u003cbr/\u003e· the man in the blue jacket\u003cbr/\u003e· the woman in glasses\u003cbr/\u003e\u003cbr/\u003eEl español dice «la mujer \u003cb\u003edel\u003c/b\u003e abrigo rojo» y la mano se va sola a \u003ci\u003eof\u003c/i\u003e. No existe. Piensa que en inglés la persona está \u003cb\u003edentro\u003c/b\u003e del abrigo, que es literalmente lo que pasa.\u003cbr/\u003e\u003cbr/\u003eY si prefieres el verbo, es \u003cb\u003ewear\u003c/b\u003e, que ya traes del A1: \u003ci\u003eShe's wearing a red coat.\u003c/i\u003e Las dos valen; la de \u003cb\u003ein\u003c/b\u003e es más corta y es la que se oye en la calle y en el examen cuando hay que distinguir a dos personas de una foto.\",\"table\":[[\"español\",\"inglés\"],[\"la mujer del abrigo rojo\",\"the woman in the red coat\"],[\"el chico de la camisa blanca\",\"the boy in the white shirt\"],[\"la señora de las gafas\",\"the woman in glasses\"],[\"Lleva un abrigo rojo.\",\"She's wearing a red coat.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l3e1\",\"type\":\"mc\",\"prompt\":\"«Un bolso negro, viejo y grande»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"a big old black bag\",\"a black old big bag\",\"a bag big old black\"],\"answer\":0,\"whyWrong\":[null,\"El color va el último de los tres, pegado al sustantivo: tamaño, edad, color\",\"En inglés los adjetivos van SIEMPRE delante del sustantivo\"],\"itemIds\":[\"ena2m3abigoldblackbag\"],\"tip\":\"Tamaño → edad → color. Y ni una coma: en inglés esa lista se escribe seguida.\"},{\"id\":\"ena2m3l3e2\",\"type\":\"bucket\",\"prompt\":\"¿Este adjetivo es de tamaño o de color?\",\"categories\":[\"tamaño\",\"color\"],\"items\":[{\"text\":\"big\",\"bucket\":0},{\"text\":\"red\",\"bucket\":1},{\"text\":\"little\",\"bucket\":0},{\"text\":\"green\",\"bucket\":1},{\"text\":\"long\",\"bucket\":0},{\"text\":\"brown\",\"bucket\":1}],\"itemIds\":[\"ena2m3green\",\"ena2m3brown\",\"enbig\",\"enred\"],\"tip\":\"Saber en qué casilla cae cada adjetivo es todo el ejercicio: el orden viene solo detrás.\"},{\"id\":\"ena2m3l3e3\",\"type\":\"match\",\"prompt\":\"Empareja la ropa y los colores nuevos\",\"pairs\":[{\"target\":\"a coat\",\"source\":\"un abrigo\"},{\"target\":\"a scarf\",\"source\":\"una bufanda\"},{\"target\":\"boots\",\"source\":\"botas\"},{\"target\":\"green\",\"source\":\"verde\"},{\"target\":\"brown\",\"source\":\"marrón\"}],\"itemIds\":[\"ena2m3acoat\",\"ena2m3ascarf\",\"ena2m3boots\",\"ena2m3green\",\"ena2m3brown\"]},{\"id\":\"ena2m3l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"Do you know the woman ___ the red coat?\",\"answers\":[\"in\"],\"translation\":\"¿Conoces a la mujer del abrigo rojo?\",\"hints\":[\"El español dice «del», pero el inglés la mete DENTRO del abrigo\",\"i…\"],\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3acoat\"]},{\"id\":\"ena2m3l3e5\",\"type\":\"build\",\"prompt\":\"Construye la frase con tres adjetivos\",\"target\":\"She has a lovely little green bag\",\"translation\":\"Tiene un bolso verde, pequeño y precioso\",\"distractors\":[\"bags\",\"and\"],\"itemIds\":[\"ena2m3green\",\"enlovely\"],\"tip\":\"«and» sobra: entre adjetivos que van delante del sustantivo, el inglés no lo pone. La lista va seguida y sin comas.\"},{\"id\":\"ena2m3l3e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden\",\"wrong\":\"I have a jacket black new.\",\"answers\":[\"I have a new black jacket.\"],\"why\":\"Dos cosas a la vez, y las dos son el mismo reflejo español: los adjetivos van DELANTE del sustantivo, y entre ellos el orden es edad antes que color. new black jacket, nunca jacket black new.\",\"translation\":\"Tengo una cazadora negra nueva.\",\"itemIds\":[\"ena2m3abigoldblackbag\",\"enjacket\",\"ennew\"]},{\"id\":\"ena2m3l3e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige la preposición\",\"wrong\":\"the woman of the red coat\",\"answers\":[\"the woman in the red coat\"],\"why\":\"«Del abrigo rojo» no es «of the red coat»: para identificar a alguien por su ropa el inglés usa IN. La persona está dentro de la prenda — the man in the blue jacket, the girl in glasses.\",\"translation\":\"la mujer del abrigo rojo\",\"itemIds\":[\"ena2m3thewomanintheredcoat\"]},{\"id\":\"ena2m3l3e8\",\"type\":\"transform\",\"prompt\":\"Junta las dos frases en una\",\"source\":\"It's a bag. It's black and it's big.\",\"instruction\":\"Dilo en una sola frase, con los dos adjetivos delante\",\"answers\":[\"It's a big black bag.\",\"It is a big black bag.\"],\"translation\":\"Es un bolso negro grande.\",\"hints\":[\"Tamaño antes que color\",\"It's a b… bl… bag.\"],\"itemIds\":[\"ena2m3abigoldblackbag\",\"enbig\",\"enblack\"]},{\"id\":\"ena2m3l3e9\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de colores — dos son nuevos, tres ya eran tuyos\",\"pairs\":[{\"target\":\"red\",\"source\":\"rojo\"},{\"target\":\"blue\",\"source\":\"azul\"},{\"target\":\"black\",\"source\":\"negro\"},{\"target\":\"green\",\"source\":\"verde\"},{\"target\":\"brown\",\"source\":\"marrón\"}],\"targetSeconds\":25,\"itemIds\":[\"enred\",\"enblue\",\"enblack\",\"ena2m3green\",\"ena2m3brown\"]},{\"id\":\"ena2m3l3e10\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"The woman in the red coat has short brown hair.\",\"translation\":\"La mujer del abrigo rojo tiene el pelo corto y castaño.\",\"hints\":[\"La preposición de la ropa es in\",\"The woman i… the red coat has short br… hair.\"],\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3brown\",\"ena2m3shorthair\"]},{\"id\":\"ena2m3l3e11\",\"type\":\"gapbank\",\"prompt\":\"El mercadillo del sábado: rellena con la ficha que toca\",\"text\":\"Last Saturday Valeria walked to the street market. She wanted a ___ old black bag, but it was too expensive. Amy liked the ___ boots, and the woman ___ the red coat helped them.\",\"answers\":[\"big\",\"brown\",\"in\"],\"bank\":[\"big\",\"brown\",\"in\",\"small\",\"green\",\"of\"],\"translation\":\"El sábado pasado Valeria fue andando al mercadillo. Quería un bolso negro, viejo y grande, pero era demasiado caro. A Amy le gustaron las botas marrones, y la mujer del abrigo rojo las ayudó.\",\"itemIds\":[\"ena2m3abigoldblackbag\",\"ena2m3brown\",\"ena2m3boots\",\"ena2m3thewomanintheredcoat\",\"ena2m1streetmarket\"],\"tip\":\"El tercer hueco es el de verdad: «of» está ahí porque es lo que dicta el español. La ropa va con in.\"},{\"id\":\"ena2m3l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La mujer del abrigo rojo tiene un bolso negro grande.\",\"answers\":[\"The woman in the red coat has a big black bag.\",\"The woman in the red coat has a big black bag\",\"The woman in the red coat has got a big black bag.\"],\"hints\":[\"in para la ropa · tamaño antes que color\",\"The woman i… the red coat has a b… bl… bag.\"],\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3abigoldblackbag\"],\"tip\":\"Ahí está el título del módulo entero y su regla: la ropa con in, los adjetivos delante y en orden.\"}]}],\"resources\":[{\"label\":\"British Council — Adjectives: order\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/adjectives-order\",\"note\":\"Lee la tabla completa (hay más casillas de las cuatro del A2) pero practica solo con dos adjetivos seguidos. Con tres ya casi nadie habla.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\
