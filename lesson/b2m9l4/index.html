03ci\u003eworan, worauf, womit, wogegen, wodurch\u003c/i\u003e. Si la preposición empieza por vocal, se cuela una \u003cb\u003er\u003c/b\u003e: wo\u003cb\u003er\u003c/b\u003ean, wo\u003cb\u003er\u003c/b\u003eauf.\u003cbr/\u003e\u003cbr/\u003e· Woran liegt es, dass der Ausstoß sinkt?\u003cbr/\u003e· Worauf stützt sich diese Aussage?\u003cbr/\u003e· Womit hängt der Rückgang zusammen?\u003cbr/\u003e· Wogegen richtet sich die Kritik?\u003cbr/\u003e\u003cbr/\u003eEl calco \u003ci\u003e*An was liegt es?\u003c/i\u003e se entiende y está mal. En el oral del B2, \u003ci\u003eworan / worauf\u003c/i\u003e suena a quien ha leído prensa de verdad.\u003cbr/\u003e\u003cbr/\u003eY el gráfico: en el Schreiben y en el Vortrag hay que \u003cb\u003epresentar datos\u003c/b\u003e sin hincharlos. Tres muletillas honestas: \u003cb\u003elaut der Grafik\u003c/b\u003e, \u003cb\u003eim Vergleich zu\u003c/b\u003e, \u003cb\u003eder Rückgang / der Anstieg\u003c/b\u003e. Si el gráfico no dice la causa, tú tampoco.\",\"table\":[[\"an + was\",\"woran\",\"Woran liegt es, dass …?\"],[\"auf + was\",\"worauf\",\"Worauf stützt sich …?\"],[\"mit + was\",\"womit\",\"Womit hängt das zusammen?\"],[\"gegen + was\",\"wogegen\",\"Wogegen richtet sich …?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m9l4e1\",\"type\":\"match\",\"prompt\":\"De la preposición suelta al wo(r)-\",\"pairs\":[{\"target\":\"Woran liegt es, dass …?\",\"source\":\"¿A qué se debe que…?\"},{\"target\":\"Worauf stützt sich diese Aussage?\",\"source\":\"¿En qué se basa esa afirmación?\"},{\"target\":\"Womit hängt das zusammen?\",\"source\":\"¿Con qué guarda relación?\"},{\"target\":\"Wogegen richtet sich die Kritik?\",\"source\":\"¿Contra qué va la crítica?\"}],\"itemIds\":[\"b2m9woranliegtes\",\"b2m7stuetzt\",\"b2m9womithaengt\",\"b2m9wogegenrichtet\"]},{\"id\":\"b2m9l4e2\",\"type\":\"errorfix\",\"prompt\":\"El calco de «¿en qué?»\",\"wrong\":\"An was liegt es, dass weniger Auto gefahren wird?\",\"answers\":[\"Woran liegt es, dass weniger Auto gefahren wird?\",\"Woran liegt es, dass weniger Auto gefahren wird\"],\"why\":\"an + was se funde en woran. La r aparece porque an empieza por vocal. *An was se entiende en la calle y en el examen resta registro.\",\"translation\":\"¿A qué se debe que se circule menos en coche?\",\"itemIds\":[\"b2m9woranliegtes\"]},{\"id\":\"b2m9l4e3\",\"type\":\"cloze\",\"prompt\":\"Presentar el dato sin hincharlo\",\"text\":\"___ der Grafik sinkt der CO2-Ausstoß im Vergleich zu 2019 um zwölf Prozent.\",\"answers\":[\"Laut\"],\"translation\":\"Según el gráfico, las emisiones de CO₂ bajan un doce por ciento respecto a 2019.\",\"hints\":[\"La preposición de «según un documento»\",\"L___\"],\"itemIds\":[\"b2m9lautgrafik\",\"b2m9co2ausstoss\",\"b2m9imvergleichzu\"]},{\"id\":\"b2m9l4e4\",\"type\":\"mc\",\"prompt\":\"Qué puede decirse del gráfico y qué no\",\"question\":\"La gráfica muestra un descenso del 12 % entre 2019 y 2024. ¿Qué frase es honesta?\",\"options\":[\"Die Energiewende hat den Ausstoß um zwölf Prozent gesenkt.\",\"Laut der Grafik liegt ein Rückgang von zwölf Prozent vor.\",\"Alle Berliner sind auf den Nahverkehr umgestiegen.\"],\"answer\":1,\"whyWrong\":[\"Eso afirma una causa que el gráfico no demuestra\",null,\"El gráfico no dice quién se ha pasado a qué\"],\"itemIds\":[\"b2m9lautgrafik\",\"b2m9rueckgang\"],\"tip\":\"En el Vortrag, la causa se marca como hipótesis (Ich gehe davon aus / Das könnte daran liegen), no como hecho, si el gráfico no la enseña.\"},{\"id\":\"b2m9l4e5\",\"type\":\"gapbank\",\"prompt\":\"Describe la gráfica\",\"text\":\"___ der Grafik ist der Rückgang ___ 2019 deutlich. Die Folgen ___ die Luftqualität sind messbar.\",\"answers\":[\"Laut\",\"im Vergleich zu\",\"für\"],\"bank\":[\"Laut\",\"im Vergleich zu\",\"für\",\"Wegen\",\"trotz\",\"ohne\"],\"translation\":\"Según el gráfico, el descenso respecto a 2019 es claro. Las consecuencias para la calidad del aire son medibles.\",\"itemIds\":[\"b2m9lautgrafik\",\"b2m9imvergleichzu\",\"b2m9folgenfuer\",\"b2m9rueckgang\"]},{\"id\":\"b2m9l4e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo con woran, sin «warum»\",\"source\":\"Warum sinkt der Energieverbrauch?\",\"forbid\":[\"Warum\",\"weshalb\",\"wieso\"],\"answers\":[\"Woran liegt es, dass der Energieverbrauch sinkt?\",\"Womit hängt der sinkende Energieverbrauch zusammen?\"],\"translation\":\"¿A qué se debe que baje el consumo de energía?\",\"itemIds\":[\"b2m9woranliegtes\",\"b2m9energieverbrauch\"]},{\"id\":\"b2m9l4e7\",\"type\":\"speak\",\"prompt\":\"Lee en voz alta la pregunta de examen\",\"text\":\"Worauf stützt sich diese Aussage?\",\"phonetic\":\"vo-RAUF shtütst zij DII-ze AUS-zaa-gue\",\"translation\":\"¿En qué se basa esa afirmación?\",\"itemIds\":[\"b2m7stuetzt\"]},{\"id\":\"b2m9l4e8\",\"type\":\"type\",\"prompt\":\"Cierre: causa + gráfico\",\"question\":\"Eso se debe a que el consumo de energía baja\",\"answers\":[\"Das liegt daran, dass der Energieverbrauch sinkt\",\"Das liegt daran, dass der Energieverbrauch sinkt.\"],\"hints\":[\"Das liegt daran, dass …\",\"Energieverbrauch\"],\"itemIds\":[\"b2m9natliegtdaran\",\"b2m9energieverbrauch\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m9-3\",\"book\":\"Der Grund dafür ist…\",\"real\":\"Das liegt daran, dass…\",\"meaning\":\"Eso se debe a que…\",\"when\":\"Para dar la causa cuando ya está sobre la mesa el «eso». En un gráfico, detrás de un dato. En el Schreiben, la fila de examen nombra el fenómeno: «Der Grund für diese Entwicklung liegt in…».\",\"register\":\"neutral\",\"exam\":\"Der Grund für diese Entwicklung liegt in…\",\"note\":\"daran = da + an, porque liegen rige an. El libro nombra el Grund; la calle señala con da-. El examen recupera el sustantivo y su rección (Grund für).\",\"sound\":\"das leekt da-RAN, das\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"b2m9natliegtdaran\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":
