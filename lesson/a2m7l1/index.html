jetivo\",\"comparativo\"],[\"billig (barato)\",\"billiger\"],[\"klein (pequeño)\",\"kleiner\"],[\"alt (viejo)\",\"älter — a → ä\"],[\"groß (grande)\",\"größer — o → ö\"],[\"jung (joven)\",\"jünger — u → ü\"],[\"teuer (caro)\",\"teurer — ¡pierde una e!\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m7l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el comparativo\",\"question\":\"„Das ist billiger“\",\"options\":[\"Eso es barato\",\"Eso es más barato\",\"Eso es baratísimo\"],\"answer\":1,\"whyWrong\":[\"Eso sería «Das ist billig» — sin -er no hay comparación\",null,\"El -er compara, no intensifica — «baratísimo» sería «sehr billig»\"],\"itemIds\":[\"a2m7billiger\",\"billig\"],\"tip\":\"Una sola pieza: billig + er. El alemán no necesita «más» — el -er lo lleva dentro.\"},{\"id\":\"a2m7l1e2\",\"type\":\"match\",\"prompt\":\"Empareja los comparativos de tienda\",\"pairs\":[{\"target\":\"billiger\",\"source\":\"más barato\"},{\"target\":\"teurer\",\"source\":\"más caro\"},{\"target\":\"größer\",\"source\":\"más grande\"},{\"target\":\"kleiner\",\"source\":\"más pequeño\"}],\"itemIds\":[\"a2m7billiger\",\"a2m7teurer\",\"a2m7groesser\",\"a2m7kleiner\"]},{\"id\":\"a2m7l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el comparativo\",\"text\":\"Dieses T-Shirt ist ___. (más barato)\",\"answers\":[\"billiger\"],\"translation\":\"Esta camiseta es más barata.\",\"hints\":[\"billig + la terminación del comparativo\",\"billig + er\"],\"itemIds\":[\"a2m7billiger\",\"tshirt\",\"dieses\"]},{\"id\":\"a2m7l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa el chunk del probador — ¡Umlaut!\",\"text\":\"Hast du das eine Nummer ___? (más grande)\",\"answers\":[\"größer\"],\"translation\":\"¿Lo tienes una talla más?\",\"hints\":[\"groß + -er... y el peaje de la o\",\"gr + ö + ßer\"],\"itemIds\":[\"a2m7einenummergroesser\",\"a2m7groesser\",\"nummer\"],\"strictUmlaut\":true,\"tip\":\"groß → größer: la o se vuelve ö. «Groser» no existe — sin Umlaut, el dependiente no te entiende.\"},{\"id\":\"a2m7l1e5\",\"type\":\"mc\",\"prompt\":\"Caza el error — los puntitos importan\",\"question\":\"«Leo es mayor (más viejo)» →\",\"options\":[\"Leo ist alter\",\"Leo ist älter\"],\"answer\":1,\"whyWrong\":[\"Sin Umlaut no hay comparativo: alt → älter — la a se vuelve ä obligatoriamente\",null],\"itemIds\":[\"a2m7aelter\"],\"strictUmlaut\":true,\"tip\":\"alt, groß y jung pagan el peaje del Umlaut en el comparativo. Los puntitos no son decoración: son la mitad de la regla.\"},{\"id\":\"a2m7l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa — el caso de la e perdida\",\"text\":\"Der Mantel ist ___. (más caro)\",\"answers\":[\"teurer\"],\"translation\":\"El abrigo es más caro.\",\"hints\":[\"teuer + -er... pero pierde una e\",\"teu + rer, no «teuerer»\"],\"itemIds\":[\"a2m7teurer\",\"mantel\",\"teuer\"],\"tip\":\"teuer → teurer: tres e seguidas eran demasiadas hasta para el alemán — una se cae.\"},{\"id\":\"a2m7l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa — otro Umlaut sagrado\",\"text\":\"Mia ist zehn Jahre alt — sie ist viel ___. (más joven)\",\"answers\":[\"jünger\"],\"translation\":\"Mia tiene diez años — es mucho más joven.\",\"hints\":[\"jung + -er + el peaje de la u\",\"j + ü + nger\"],\"itemIds\":[\"a2m7juenger\"],\"strictUmlaut\":true},{\"id\":\"a2m7l1e8\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del probador\",\"target\":\"Hast du das eine Nummer größer?\",\"translation\":\"¿Lo tienes una talla más (grande)?\",\"distractors\":[\"großer\",\"habe\"],\"itemIds\":[\"a2m7einenummergroesser\",\"a2m7groesser\",\"nummer\"],\"tip\":\"eine Nummer größer / eine Nummer kleiner — la fórmula exacta para pedir otra talla sin pensar.\"},{\"id\":\"a2m7l1e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Die Schuhe sind billiger\",\"translation\":\"Los zapatos son más baratos\",\"hints\":[\"Plural: sind\",\"billig + er\"],\"itemIds\":[\"a2m7billiger\",\"schuhe\"]},{\"id\":\"a2m7l1e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Lo tienes una talla más (grande)?\",\"answers\":[\"Hast du das eine Nummer größer?\",\"Hast du das eine Nummer größer\",\"Haben Sie das eine Nummer größer?\",\"Haben Sie das eine Nummer größer\"],\"hints\":[\"El chunk del probador, con su Umlaut\",\"Hast du das eine Nummer ...?\"],\"itemIds\":[\"a2m7einenummergroesser\",\"a2m7groesser\"],\"strictUmlaut\":true,\"tip\":\"Si la ö te salió sola, el comparativo ya es tuyo. Con esta frase sobrevives a cualquier probador alemán.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — Komparativ (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Komparativ» en el curso A2: billiger, größer y compañía en boca nativa.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
