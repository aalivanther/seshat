al\"},{\"target\":\"warten\",\"source\":\"esperar\"},{\"target\":\"der Termin\",\"source\":\"la cita\"},{\"target\":\"die Unterschrift\",\"source\":\"la firma\"}],\"targetSeconds\":25,\"itemIds\":[\"buergeramt\",\"warten\",\"termin\",\"unterschrift\"]},{\"id\":\"f10l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la instrucción de la frase 2\",\"text\":\"Füllen Sie bitte das Formular ___.\",\"answers\":[\"aus\"],\"translation\":\"Rellene el formulario, por favor.\",\"hints\":[\"El separable de siempre\",\"a-u-s al final\"],\"itemIds\":[\"ausfuellen\",\"formular\"]},{\"id\":\"f10l6e6\",\"type\":\"build\",\"prompt\":\"Construye la frase 1 (resumida)\",\"target\":\"Nico hat einen Termin im Bürgeramt\",\"translation\":\"Nico tiene una cita en el Bürgeramt\",\"distractors\":[\"ein\",\"bei\"],\"itemIds\":[\"termin\",\"buergeramt\"],\"tip\":\"der Termin → acusativo einen, como einen Hund. Y dentro del edificio: im Bürgeramt.\"},{\"id\":\"f10l6e7\",\"type\":\"listen\",\"prompt\":\"Escucha el final de la historia\",\"text\":\"Auf Wiedersehen, Herr García\",\"translation\":\"Adiós, señor García\",\"hints\":[\"Cara a cara → Wiedersehen, no Wiederhören\",\"Herr + apellido\"],\"itemIds\":[\"aufwiedersehen\"]},{\"id\":\"f10l6e8\",\"type\":\"cloze\",\"prompt\":\"Completa el separable de la frase 6\",\"text\":\"Aber Nico steht nicht ___.\",\"answers\":[\"auf\"],\"translation\":\"Pero Nico no se levanta.\",\"hints\":[\"aufstehen — tu separable de la rutina\",\"a-u-f al final\"],\"itemIds\":[\"aufstehen\"]},{\"id\":\"f10l6e9\",\"type\":\"type\",\"prompt\":\"Traduce\",\"question\":\"Él espera una hora\",\"answers\":[\"Er wartet eine Stunde\"],\"hints\":[\"warten para er añade -et\",\"Er wartet eine ...\"],\"itemIds\":[\"warten\",\"stunde\"]},{\"id\":\"f10l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Nico tiene una cita en el Bürgeramt\",\"answers\":[\"Nico hat einen Termin im Bürgeramt\"],\"hints\":[\"haben + einen Termin (acusativo)\",\"Nico hat einen Te
