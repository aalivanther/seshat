,\"title\":\"Preguntar por lo que pone\",\"itemIds\":[\"ena2m7whatdoesthesignsay\",\"ena2m7imsorrytobotheryou\",\"ensign\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Los seis modales del módulo, en una tabla\",\"body\":\"Este módulo te ha dado seis palabras. Todas funcionan igual —\u003cb\u003esin do, sin -s y sin to\u003c/b\u003e— y cada una hace una cosa distinta. Si te llevas esta tabla, te llevas el módulo:\",\"table\":[[\"palabra\",\"qué hace\",\"ejemplo\"],[\"must\",\"obliga: la norma escrita, o yo mismo\",\"Passengers must show their tickets.\"],[\"have to\",\"obliga: la vida, el horario, la cola\",\"I have to go to the bank.\"],[\"mustn't\",\"PROHÍBE\",\"You mustn't smoke in here.\"],[\"don't have to\",\"EXIME: no hace falta\",\"You don't have to pay.\"],[\"can / could / may\",\"pide permiso o un favor, de menos a más formal\",\"Could I have a stamp, please?\"],[\"couldn't\",\"no hubo manera (pasado)\",\"I couldn't get through.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Tres carteles de verdad, explicados\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l9e1\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta sin auxiliar\",\"wrong\":\"What says that sign?\",\"answers\":[\"What does that sign say?\"],\"why\":\"En español la pregunta se hace con la entonación y el orden se queda igual («¿qué pone ese cartel?»). En inglés hace falta el auxiliar does, y detrás el verbo va desnudo: say, no says. Es el error más viejo del curso y sigue apareciendo en cuanto la frase se complica.\",\"translation\":\"¿Qué pone en ese cartel?\",\"itemIds\":[\"ena2m7whatdoesthesignsay\",\"ensign\"]},{\"id\":\"ena2m7l9e2\",\"type\":\"mc\",\"prompt\":\"El cartel del aparcamiento del hospital\",\"question\":\"«Permit holders only» — ¿qué te está diciendo?\",\"options\":[\"You mustn't park here without a permit.\",\"You don't have to park here.\",\"You must park here.\"],\"answer\":0,\"whyWrong\":[null,\"Eso dice «no hace falta aparcar aquí», que no prohíbe nada\",\"Al revés: no te obliga a aparcar, te lo impide\"],\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\",\"enhospital\"]},{\"id\":\"ena2m7l9e3\",\"type\":\"mc\",\"prompt\":\"En la puerta de una consulta pone: «No appointment necessary»\",\"question\":\"¿Qué significa?\",\"options\":[\"You don't have to make an appointment.\",\"You mustn't make an appointment.\",\"You have to make an appointment.\"],\"answer\":0,\"whyWrong\":[null,\"No te prohíbe pedir cita: te dice que no hace falta\",\"Justo lo contrario de lo que pone el cartel\"],\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7isitcompulsory\",\"endoctor\"],\"tip\":\"Este par —«prohibido» frente a «no hace falta»— es lo que este módulo ha venido a enseñarte. Si lo aciertas de corrido, ya está.\"},{\"id\":\"ena2m7l9e4\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿prohíbe, obliga o exime?\",\"categories\":[\"prohíbe o impide\",\"obliga o exime\"],\"items\":[{\"text\":\"You mustn't smoke in here.\",\"bucket\":0},{\"text\":\"You have to check in first.\",\"bucket\":1},{\"text\":\"Staff only\",\"bucket\":0},{\"text\":\"You don't have to pay.\",\"bucket\":1},{\"text\":\"You can't park here.\",\"bucket\":0},{\"text\":\"She has to work on Saturday.\",\"bucket\":1}],\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youhavetocheckin\",\"ena2m7staffonly\",\"ena2m7youdonthavetopay\",\"ena2m7youcantparkhere\",\"ena2m7shehastoworkonsaturday\"]},{\"id\":\"ena2m7l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar la palabra prohibida\",\"source\":\"You mustn't park here.\",\"forbid\":[\"mustn't\",\"must\"],\"answers\":[\"You can't park here.\",\"Parking isn't allowed here.\",\"You aren't allowed to park here.\"],\"translation\":\"Aquí no se puede aparcar.\",\"itemIds\":[\"ena2m7youcantparkhere\",\"ena2m7smokingisntallowed\"],\"tip\":\"Tener dos formas de decir lo mismo es lo que te salva en el oral cuando se te olvida una palabra. Y es exactamente lo que puntúa la Parte 2 del examen.\"},{\"id\":\"ena2m7l9e6\",\"type\":\"cloze\",\"prompt\":\"Espiral: el registro de ventanilla\",\"text\":\"Excuse me, ___ I have a stamp for Spain, please?\",\"answers\":[\"could\",\"can\",\"may\"],\"translation\":\"Perdone, ¿me pone un sello para España, por favor?\",\"hints\":[\"El escalón por defecto de todo el curso\",\"c…d\"],\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7astamp\"]},{\"id\":\"ena2m7l9e7\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"No hace falta hacer cola, pero no se puede pagar con tarjeta.\",\"answers\":[\"You don't have to queue, but you can't pay by card.\",\"You don't have to queue, but you mustn't pay by card.\",\"You don't have to wait in the queue, but you can't pay by card.\"],\"hint\":\"una que exime y otra que impide, unidas por but\",\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7thequeue\",\"encanipaybycard\"]},{\"id\":\"ena2m7l9e8\",\"type\":\"order\",\"prompt\":\"Ordena la historia del día que nada funcionó\",\"sentences\":[\"On Monday I had to go to the post office to send a parcel to my sister.\",\"There was a long queue, so I waited for twenty minutes.\",\"When it was my turn, the card machine was out of order.\",\"I couldn't pay, because I didn't have any cash on me.\",\"In the end I had to come back the next morning.\"],\"translation\":\"El lunes tuve que ir a correos a mandarle un paquete a mi hermana. Había una cola larga, así que esperé veinte minutos. Cuando me tocó, la máquina de las tarjetas estaba averiada. No pude pagar, porque no llevaba efectivo encima. Al final tuve que volver a la mañana siguiente.\",\"itemIds\":[\"ena2m7thequeue\",\"ena2m7outoforder\",\"ena2m7icouldntfindit\",\"ena2m7ididnthavetopay\",\"encash\",\"enpostoffice\"],\"tip\":\"Fíjate en «I had to», que no habíamos visto: es el pasado afirmativo de have to. Si didn't have to es «no tuve que», had to es «tuve que». Ya lo sabías sin saberlo.\"},{\"id\":\"ena2m7l9e9\",\"type\":\"fastmatch\",\"prompt\":\ les de tu barrio\",\"topic\":\"Tres carteles o avisos que hay cerca de tu casa, explicados en inglés\",\"slides\":[{\"title\":\"1. Dónde está y qué pone\",\"hint\":\"There's a sign outside the… / It says «…». Basta con leerlo tal cual, aunque esté en español: luego lo explicas.\"},{\"title\":\"2. Qué prohíbe o qué obliga\",\"hint\":\"Aquí van los modales del módulo: It means you mustn't… / You have to… / You can't… No te quedes en uno solo.\"},{\"title\":\"3. Uno que EXIMA de algo\",\"hint\":\"Busca uno de los que no obligan a nada: «entrada libre», «sin cita previa». It means you don't have to…\"},{\"title\":\"4. Si te parece razonable o no\",\"hint\":\"I think it's a good idea because… / I don't think it's necessary because… El descriptor de A2 pide opinión CON razón: no te dejes el because.\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He usado must o have to al menos una vez\",\"He usado mustn't o can't al menos una vez\",\"He usado don't have to al menos una vez, y para eximir de verdad\",\"He dado una opinión con su because detrás\"],\"itemIds\":[\"ena2m7whatdoesthesignsay\",\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\",\"ena2m7youhavetocheckin\"],\"tip\":\"La tercera diapositiva es la difícil a propósito: encontrar un cartel que EXIMA obliga a mirar el mundo con la distinción que enseña este módulo. Si te cuesta encontrarlo, es que la distinción ya te importa.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m7-8\",\"book\":\"What does that sign say?\",\"real\":\"What's that sign on about?\",\"meaning\":\"¿Y ese cartel qué quiere decir?\",\"when\":\"Entre amigos, con un punto de fastidio: se usa cuando el cartel te parece absurdo o incomprensible. En una ventanilla o en el examen, la del libro.\",\"register\":\"amigos\",\"note\":\"be on about = «ir de qué», «querer decir», siempre con un poquito de guasa. What are you on about? es «¿pero tú de qué hablas?».\",\"sound\":\"uóts dat SÁIN on a-báut\",\"level\":\"a2\",\"itemId\
