3e\u003cb\u003eY el falso amigo que más caro sale del nivel:\u003c/b\u003e\u003cbr/\u003e\u003cb\u003esensible\u003c/b\u003e ≠ sensible. \u003ci\u003eShe's very \u003cb\u003esensible\u003c/b\u003e with money\u003c/i\u003e significa que es \u003cb\u003esensata, prudente\u003c/b\u003e. Si quieres decir «sensible», la palabra es \u003cb\u003esensitive\u003c/b\u003e. Decirle a alguien \u003ci\u003eyou're very sensible\u003c/i\u003e es un piropo de cabeza fría, no de corazón blando — y en un examen oral, describir a tu abuela como «sensible» cuando querías decir «sensible» cambia el retrato entero.\u003cbr/\u003e\u003cbr/\u003eTres palabras más del dinero británico que no salen en los libros y salen en el banco: \u003cb\u003ea direct debit\u003c/b\u003e (domiciliación), \u003cb\u003ein instalments\u003c/b\u003e (a plazos) y \u003cb\u003ea subscription\u003c/b\u003e (suscripción). Las tres se cancelan con \u003ci\u003ecancel\u003c/i\u003e, no con «unsubscribe», que es solo para los correos."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l7\",\"phaseId\":\"enb1m5\",\"title\":\"Pay for, spend on\",\"subtitle\":\"La preposición es parte de la palabra — y un falso amigo que cambia a una persona entera\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Siete unidades léxicas, no catorce palabras\",\"itemIds\":[\"enb1m5payfor\",\"enb1m5spendon\",\"enb1m5chargedmefor\",\"enb1m5ininstalments\",\"enb1m5subscription\",\"enb1m5sensiblewithmoney\",\"enb1m5directdebit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no hay regla, hay unidad léxica\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l7e1\",\"type\":\"match\",\"prompt\":\"Empareja cada verbo con su preposición pegada\",\"pairs\":[{\"target\":\"I paid for the coffees.\",\"source\":\"Pagué los cafés.\"},{\"target\":\"I spend too much on takeaways.\",\"source\":\"Me gasto demasiado en comida a domicilio.\"},{\"target\":\"They charged me for the bag.\",\"source\":\"Me cobraron la bolsa.\"},{\"target\":\"I'm saving up for a laptop.\",\"source\":\"Estoy ahorrando para un portátil.\"}],\"itemIds\":[\"enb1m5payfor\",\"enb1m5spendon\",\"enb1m5chargedmefor\",\"enb1m5saveupfor\"],\"tip\":\"Tres «for» y un «on». Y fíjate en que en español las cuatro llevan preposiciones distintas o ninguna: por eso no se pueden deducir, se memorizan en bloque.\"},{\"id\":\"enb1m5l7e2\",\"type\":\"mc\",\"prompt\":\"El «for» que el español no pone\",\"question\":\"«Pagué los cafés» →\",\"options\":[\"I paid the coffees.\",\"I paid for the coffees.\",\"I paid by the coffees.\"],\"answer\":1,\"whyWrong\":[\"Es el calco literal. «Pay» sin preposición sí existe, pero con lo que se paga: «I paid the bill», «I paid the rent».\",null,\"«by» es el medio de pago: «pay by card», «pay by bank transfer».\"],\"itemIds\":[\"enb1m5payfor\"],\"tip\":\"La regla fina: pagas UNA CUENTA sin preposición (pay the bill, pay the rent) y pagas POR UNA COSA con «for» (pay for the coffees, pay for a taxi).\"},{\"id\":\"enb1m5l7e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I paid the coffees.\",\"answers\":[\"I paid for the coffees.\"],\"why\":\"Falta el «for». En español se paga algo; en inglés se paga POR algo cuando lo que nombras es la cosa comprada, no la cuenta.\",\"translation\":\"Pagué los cafés.\",\"itemIds\":[\"enb1m5payfor\"]},{\"id\":\"enb1m5l7e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I spend too much in takeaways.\",\"answers\":[\"I spend too much on takeaways.\"],\"why\":\"«Gastarse EN algo» pide «in» en la cabeza del hispanohablante, y en inglés es «on»: spend money ON something. Es la excepción del grupo: todo lo demás va con «for».\",\"translation\":\"Me gasto demasiado en comida a domicilio.\",\"itemIds\":[\"enb1m5spendon\"]},{\"id\":\"enb1m5l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"They charged me two pounds ___ the bag at the till.\",\"answers\":[\"for\"],\"translation\":\"Me cobraron dos libras por la bolsa en la caja.\",\"hints\":[\"Es la misma que la de «pay»\",\"Tres letras, empieza por f\"],\"itemIds\":[\"enb1m5chargedmefor\"],\"tip\":\"«charge somebody for something» = cobrarle algo a alguien. Ojo: «charge» también es cargar una batería y presentar cargos. El contexto lo decide todo.\"},{\"id\":\"enb1m5l7e6\",\"type\":\"bucket\",\"prompt\":\"¿Este verbo pide «for» o pide «on»?\",\"categories\":[\"pay · ask · charge · save up → FOR\",\"spend → ON\"],\"items\":[{\"text\":\"I paid ___ the tickets.\",\"bucket\":0},{\"text\":\"I spend too much ___ clothes.\",\"bucket\":1},{\"text\":\"They charged me ___ the bag.\",\"bucket\":0},{\"text\":\"She spent fifty pounds ___ a coat.\",\"bucket\":1},{\"text\":\"I'm saving up ___ a laptop.\",\"bucket\":0},{\"text\":\"How much do you spend ___ food?\",\"bucket\":1}],\"itemIds\":[\"enb1m5payfor\",\"enb1m5spendon\",\"enb1m5chargedmefor\",\"enb1m5saveupfor\"],\"tip\":\"Clasificar con el verbo tapado no vale de nada: aquí el verbo se ve, y es él quien manda. La preposición no es del sustantivo, es del VERBO.\"},{\"id\":\"enb1m5l7e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el repaso de cuentas de Valeria\",\"text\":\"I sat down with my bank statement on Sunday. I'm paying ___ a gym I stopped going to in March, there's a ___ debit for a magazine I don't read, and I spend about forty pounds a week ___ takeaways. I've cancelled the ___ and I'm going to cook on Sundays.\",\"answers\":[\"for\",\"direct\",\"on\",\"subscription\"],\"bank\":[\"for\",\"direct\",\"on\",\"subscription\",\"from\",\"directly\",\"in\",\"subscribe\"],\"translation\":\"El domingo me senté con el extracto del banco. Estoy pagando un gimnasio al que dejé de ir en marzo, hay una domiciliación de una revista que no leo y me gasto unas cuarenta libras a la semana en comida a domicilio. He dado de baja la suscripción y voy a cocinar los domingos.\",\"itemIds\":[\"enb1m5payfor\",\"enb1m5directdebit\",\"enb1m5spendon\",\"enb1m5subscription\"],\"tip\":\"Cuatro huecos y una tarde de domingo que le ha ahorrado a Valeria unas trescientas libras al año. El banco es el mejor libro de vocabulario que hay.\"},{\"id\":\"enb1m5l7e8\",\"type\":\"mc\",\"prompt\":\"El falso amigo más caro del nivel\",\"question\":\"«She's very sensible with money» significa…\",\"options\":[\"Es muy sensata con el dinero\",\"Es muy sensible con el dinero (se emociona)\",\"Es muy tacaña con el dinero\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «sensitive». «Sensible» en inglés es sensato, prudente, con la cabeza en su sitio.\",\"Tacaño es «mean» o «stingy». Ser «sensible» no tiene nada de malo: es un elogio.\"],\"itemIds\":[\"enb1m5sensiblewithmoney\"],\"tip\":\"Guárdate el par entero: sensible = sensato · sensitive = sensible. Y ojo con el tercero de la familia, «sensitive skin», que sale literalmente en el temario del examen: piel sensible.\"},{\"id\":\"enb1m5l7e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Lo estoy pagando a plazos.\",\"answers\":[\"I'm paying for it in instalments\",\"I am paying for it in instalments\",\"I'm paying for it in installments\"],\"hint\":\"El verbo lleva su preposición, y «a plazos» son dos palabras\",\"itemIds\":[\"enb1m5ininstalments\",\"enb1m5payfor\"],\"tip\":\"«instalments» con una sola L en el Reino Unido; en Estados Unidos, «installments». Las dos se aceptan aquí, pero el examen es británico: elige una y sé coherente.\"},{\"id\":\"enb1m5l7e10\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra del banco\",\"text\":\"The gym takes the money out automatically every month: it's a ___ debit.\",\"answers\":[\"direct\"],\"translation\":\"El gimnasio me saca el dinero automáticamente todos los meses: es una domiciliación.\",\"hints\":[\"Se parece muchísimo al español\",\"di-rec...\"],\"itemIds\":[\"enb1m5directdebit\"],\"tip\":\"«Direct debit» te lo cobran ellos; «standing order» lo mandas tú. La diferencia importa: la primera se puede cancelar en el banco sin avisar a nadie.\"},{\"id\":\"enb1m5l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me gasto demasiado en cafés, así que he dado de baja la suscripción del gimnasio.\",\"answers\":[\"I spend too much on coffees, so I've cancelled my gym subscription\",\"I spend too much on coffee, so I've cancelled my gym subscription\",\"I spend too much on coffees, so I have cancelled my gym subscription\",\"I spend too much on coffees, so I've cancelled the gym subscription\"],\"hints\":[\"«gastarse en» va con la preposición rara del grupo\",\"I spend too much ... coffees, so I've cancelled ...\"],\"itemIds\":[\"enb1m5spendon\",\"enb1m5subscription\"],\"tip\":\"«Cancel» es la palabra para dar de baja cualquier cosa: a subscription, a direct debit, an order. «Unsubscribe» es solo para dejar de recibir correos.\"},{\"id\":\"enb1m5l7e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"They charged me for the bag.\",\"translation\":\"Me cobraron la bolsa.\",\"hints\":[\"Empieza por «They…»\",\"They charged me ... the bag\"],\"itemIds\":[\"enb1m5chargedmefor\"],\"tip\":\"«charged» acaba en /dchd/: tres sonidos seguidos que el español no junta jamás. Si se te cae la -ed, se pierde el pasado — y eso no es acento, es gramática que desaparece.\"},{\"id\":\"enb1m5l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en el café, Sam y Priya repasan lo que les cuesta la máquina de tarjetas. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Right, the card machine. They charge us twenty pounds a month plus one point seven per cent of everything we take.|And the other company?|Twelve a month, but two point four per cent. So it depends how much we're taking.|On a normal month, what, four thousand?|About that. Four thousand at one point seven is sixty-eight, plus twenty, so eighty-eight. The other one would be ninety-six plus twelve, so a hundred and eight.|So we stay where we are.|We stay where we are. If we ever drop below two thousand a month it flips the other way, mind you. I'll put a note in the diary to check it in the spring.\",\"question\":\"¿Qué deciden hacer con la máquina de tarjetas?\",\"options\":[\"Quedarse con la empresa que tienen ahora\",\"Cambiarse a la que cobra doce libras al mes\",\"Quitarla y cobrar solo en efectivo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Sale más cara con la facturación que tienen: 108 frente a 88.\",\"Del efectivo no habla nadie.\"],\"itemIds\":[\"enb1m5chargedmefor\",\"enb1m5ifihadthemoney\",\"enb1m2colleague\"],\"tip\":\"«If we ever drop below two thousand a month it flips the other way» — un primer condicional dentro de una conversación de negocios. Cuando oigas un «if» en el examen, apunta la condición: casi siempre trae la respuesta pegada.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"lin
