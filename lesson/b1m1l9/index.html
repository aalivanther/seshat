hat der Vermieter gesagt.\u003cbr/\u003e5. Der Umzug war ein Albtraum. Der Freund, der ihr helfen wollte, war krank. Nico hat einen [[Transporter|una furgoneta]] geliehen und Anna hat vier Kartons die Treppe hochgetragen.\u003cbr/\u003e6. Um elf Uhr abends kam der Nachbar von unten. Sofía hat gedacht: Jetzt beschwert er sich über den Lärm.\u003cbr/\u003e7. Aber der Nachbar hatte zwei [[Flaschen|botellas]] Bier in der Hand. „Willkommen! Ich bin Herr Vogel. Ich kümmere mich um die Post, wenn Sie im Urlaub sind.“\u003cbr/\u003e8. Am Samstag hat Sofía ihre Einweihungsparty gefeiert. Sie hat die ganze Nachbarschaft eingeladen — außer dem Nachbarn aus dem vierten Stock, den noch nie jemand gesehen hat.\u003cbr/\u003e9. Drei Wochen später sagt sie: „Ich gewöhne mich langsam an die vielen Treppen. Und meiner Meinung nach ist das hier die beste Wohnung, die ich je hatte.“\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: die Absage = la negativa · der Albtraum = la pesadilla · leihen = prestar / tomar prestado · hochtragen = subir cargando · außer + Dativ = excepto\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T732,"])</script><script>self.__next_f.push([1,"So, herzlich willkommen alle zusammen, schön, dass Sie da sind. Ich mach das kurz, ähm, ich weiß, Sie wollen alle noch auspacken. Mein Name ist Meier, ich bin von der Hausverwaltung und betreue dieses Haus seit, äh, seit acht Jahren. Fangen wir mit dem an, wonach am häufigsten gefragt wird: die Nebenkosten. Sie zahlen jeden Monat eine Vorauszahlung, und einmal im Jahr — bei uns immer im März — bekommen Sie die Abrechnung. Da steht dann drin, ob Sie Geld zurückbekommen oder ob Sie nachzahlen müssen. Und ganz ehrlich: In den letzten zwei Jahren mussten die meisten nachzahlen, weil das Heizen so viel teurer geworden ist. Legen Sie also lieber jeden Monat ein bisschen was zurück. Zweiter Punkt, der Müll. Im Hof stehen vier Tonnen: Papier, Verpackungen, Bio und Restmüll. Glas gehört da nicht rein — das bringen Sie bitte zu den Containern an der Ecke, und zwar nicht nach zwanzig Uhr. Sonst beschweren sich die Nachbarn, und zwar zu Recht. Dritter Punkt, und der ist mir der wichtigste: die Ruhezeiten. Von zweiundzwanzig bis sieben Uhr ist Nachtruhe, sonntags den ganzen Tag. Das heißt nicht, dass Sie flüstern müssen, um Gottes willen. Das heißt: keine Waschmaschine um Mitternacht und keine Bohrmaschine am Sonntagvormittag. Was noch? Ach ja, das Treppenhaus. Wir haben keinen Putzdienst, das machen die Mieter selbst, im Wechsel. Der Plan hängt unten neben den Briefkästen. Wer dran ist und keine Zeit hat, tauscht einfach mit jemandem — das regeln Sie bitte untereinander, da misch ich mich nicht ein. Und zum Schluss, ganz wichtig: Wenn etwas kaputt ist, rufen Sie mich bitte nicht an, sondern schreiben Sie eine Mail. Ich weiß, das klingt unpersönlich, aber am Telefon vergesse ich die Hälfte, und schriftlich hab ich es, ähm, schwarz auf weiß. Und Sie auch. So, das war's von meiner Seite. Fragen?"])</script><script>self.__next_f.push([1,"19:T732,"])</script><script>self.__next_f.push([1,"So, herzlich willkommen alle zusammen, schön, dass Sie da sind. Ich mach das kurz, ähm, ich weiß, Sie wollen alle noch auspacken. Mein Name ist Meier, ich bin von der Hausverwaltung und betreue dieses Haus seit, äh, seit acht Jahren. Fangen wir mit dem an, wonach am häufigsten gefragt wird: die Nebenkosten. Sie zahlen jeden Monat eine Vorauszahlung, und einmal im Jahr — bei uns immer im März — bekommen Sie die Abrechnung. Da steht dann drin, ob Sie Geld zurückbekommen oder ob Sie nachzahlen müssen. Und ganz ehrlich: In den letzten zwei Jahren mussten die meisten nachzahlen, weil das Heizen so viel teurer geworden ist. Legen Sie also lieber jeden Monat ein bisschen was zurück. Zweiter Punkt, der Müll. Im Hof stehen vier Tonnen: Papier, Verpackungen, Bio und Restmüll. Glas gehört da nicht rein — das bringen Sie bitte zu den Containern an der Ecke, und zwar nicht nach zwanzig Uhr. Sonst beschweren sich die  que se interese) son las dos piezas que, juntas, dan la respuesta. Así funciona la inferencia.\"},{\"id\":\"b1m1l9e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 6-7) — inferencia\",\"question\":\"Was hat Sofía falsch erwartet?\",\"options\":[\"Dass der Nachbar sich beschweren würde\",\"Dass der Aufzug funktioniert\",\"Dass Nico nicht kommt\"],\"answer\":0,\"whyWrong\":[null,\"Ya sabía que no había ascensor (frase 2)\",\"Nico sí vino con la furgoneta\"],\"itemIds\":[\"b1m1sichbeschwerenueber\",\"b1m1laerm\"]},{\"id\":\"b1m1l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Repaso veloz — los dos módulos anteriores\",\"pairs\":[{\"target\":\"der Umzug\",\"source\":\"la mudanza\"},{\"target\":\"die Einladung\",\"source\":\"la invitación\"},{\"target\":\"der Plan\",\"source\":\"el plan\"},{\"target\":\"die Nachbarin\",\"source\":\"la vecina\"},{\"target\":\"der Kalender\",\"source\":\"la agenda\"}],\"targetSeconds\":22,\"itemIds\":[\"a2m5umzug\",\"a2m9einladung\",\"a2m10plan\",\"a2m4nachbarin\",\"a2m10kalender\"],\"tip\":\"Nada nuevo aquí: solo velocidad sobre lo que ya sabes. Es la práctica que rompe el estancamiento — DeKeyser lo llama automatización.\"},{\"id\":\"b1m1l9e5\",\"type\":\"order\",\"prompt\":\"Ordena la historia de Sofía\",\"sentences\":[\"Sofía hat drei Monate lang eine Wohnung gesucht.\",\"Bei der Besichtigung hat sie als Einzige eine Frage gestellt.\",\"Zwei Tage später kam die Zusage vom Vermieter.\",\"Nico hat einen Transporter geliehen und alle haben Kartons getragen.\",\"Am Samstag hat Sofía die ganze Nachbarschaft eingeladen.\"],\"translation\":\"Sofía buscó piso durante tres meses. En la visita fue la única que hizo una pregunta. Dos días después llegó el sí del casero. Nico tomó prestada una furgoneta y todos cargaron cajas. El sábado Sofía invitó a todo el vecindario.\",\"hints\":[\"Buscar → visitar → recibir el sí → mudarse → celebrar\",\"La fiesta va siempre al final\"],\"itemIds\":[\"b1m1besichtigung\",\"b1m1zusage\",\"b1m1kartons\",\"b1m1nachbarschaft\",\"b1m1einstand\"]},{\"id\":\"b1m1l9e6\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 9\",\"text\":\"Ich gewöhne mich langsam ___ die vielen Treppen.\",\"answers\":[\"an\"],\"translation\":\"Me estoy acostumbrando poco a poco a tantas escaleras.\",\"hints\":[\"sich gewöhnen + preposición fija\",\"a-n + Akkusativ\"],\"itemIds\":[\"b1m1sichgewoehnenan\",\"b1m1treppenhaus\"],\"tip\":\"«acostumbrarse A» → sich gewöhnen AN + Akkusativ. Otro bloque verbo+preposición para la libreta.\"},{\"id\":\"b1m1l9e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen con los relativos\",\"text\":\"Sofía hat eine Wohnung gefunden, ___ im dritten Stock liegt. Der Nachbar, ___ sie am Abend getroffen hat, war sehr freundlich. Das ist die beste Wohnung, ___ sie je hatte.\",\"answers\":[\"die\",\"den\",\"die\"],\"bank\":[\"die\",\"den\",\"der\",\"das\",\"dass\",\"als\"],\"translation\":\"Sofía ha encontrado un piso que está en la tercera planta. El vecino al que conoció por la noche era muy amable. Es el mejor piso que ha tenido nunca.\",\"itemIds\":[\"b1m1einewohnungdiehellist\",\"b1m1dervertragdenichunterschreibe\",\"wohnung\"],\"tip\":\"El segundo hueco es masculino Y objeto → den. Es el único de los tres que exige pensar: los otros dos son femeninos y no cambian.\"},{\"id\":\"b1m1l9e8\",\"type\":\"build\",\"prompt\":\"Construye la frase del vecino\",\"target\":\"Ich kümmere mich um die Post, wenn Sie im Urlaub sind\",\"altTargets\":[\"Wenn Sie im Urlaub sind, kümmere ich mich um die Post\"],\"translation\":\"Me ocupo del correo cuando esté de vacaciones\",\"distractors\":[\"über\",\"sind Sie\"],\"itemIds\":[\"b1m1sichkuemmernum\"]},{\"id\":\"b1m1l9e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «Meinung»\",\"source\":\"Meiner Meinung nach ist das die beste Wohnung.\",\"forbid\":[\"Meinung\",\"Meiner\"],\"answers\":[\"Ich finde, dass das die beste Wohnung ist\",\"Für mich ist das die beste Wohnung\"],\"translation\":\"En mi opinión, es el mejor piso.\",\"hints\":[\"Verbo de valoración + dass\",\"Ich finde, dass ...\"],\"itemIds\":[\"b1m1meinermeinungnach\",\"a2m6finden\"]},{\"id\":\"b1m1l9e10\",\"type\":\"monologue\",\"prompt\":\"Tu primer monólogo del nivel: tres minutos sobre la vivienda. Planifica primero, habla después, y repite.\",\"topic\":\"Wohnen in meinem Land: Wie findet man eine Wohnung?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"Di de qué vas a hablar y cómo lo has organizado: «Ich möchte heute über das Thema Wohnen sprechen. Zuerst … , dann … , zum Schluss …»\"},{\"title\":\"2. Eigene Erfahrung\",\"hint\":\"Cuenta tu última búsqueda o mudanza en Perfekt: «Vor zwei Jahren bin ich umgezogen. Ich habe … gesucht, weil …»\"},{\"title\":\"3. Die Situation in meinem Land\",\"hint\":\"¿Se alquila o se compra? ¿Es caro? Da un ejemplo con números: «In meinem Land … Zum Beispiel …»\"},{\"title\":\"4. Vor- und Nachteile + meine Meinung\",\"hint\":\"«Ein Vorteil ist, dass … Ein Nachteil ist, dass … Meiner Meinung nach …»\"},{\"title\":\"5. Abschluss\",\"hint\":\"Cierra y da las gracias: «Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit.»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin parar de golpe\",\"Di un ejemplo propio y concreto (una cifra, una ciudad, una fecha)\",\"Usé al menos una Relativsatz (…, die/der/das …)\",\"Usé al menos 3 conectores distintos (weil, deshalb, außerdem, trotzdem)\",\"En la 2ª pasada hablé sin mirar las pistas\"],\"model\":\"Diapositiva 2 como modelo (solo una, para que el resto sea tuyo): „Vor zwei Jahren bin ich nach Berlin umgezogen. Ich habe drei Monate gesucht, weil die Mieten sehr hoch waren. Am Ende habe ich eine kleine Wohnung gefunden, die zwar laut, aber bezahlbar ist.“\",\"itemIds\":[\"b1m1umziehen\",\"b1m1meinermeinungnach\",\"b1m1einewohnungdiehellist\",\"b1m1bezahlbar\"],\"tip\":\"La segunda pasada SIEMPRE sale mejor que la primera — está medido (Bygate). No es que hoy hables mejor: es que repetir la tarea libera atención para la forma.\"},{\"id\":\"b1m1l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Me estoy acostumbrando al piso que he encontrado\",\"answers\":[\"Ich gewöhne mich an die Wohnung, die ich gefunden habe\"],\"hints\":[\"sich gewöhnen an + Akkusativ, y luego la relativa\",\"Ich gewöhne mich an die Wohnung, die ich ...\"],\"itemIds\":[\"b1m1sichgewoehnenan\",\"b1m1diewohnungdieichsuche\"],\"tip\":\"Preposición regida + Relativsatz en acusativo + Perfekt, todo en una frase de once palabras. Módulo cerrado: ya escribes B1.\"},{\"id\":\"b1m1l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje de Herr Vogel, el vecino de abajo · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Frau Marín, hier ist Vogel, Ihr Nachbar von unten. Ich hab gesehen, Sie ziehen ein — herzlich willkommen! Ähm, falls Sie im Treppenhaus Hilfe brauchen, ich bin fast immer da. Und übrigens: Freitagabend wird das Treppenhaus frisch geputzt. Mit den schweren Kartons würde ich deshalb lieber am Donnerstag ran. Also, alles Gute!\",\"question\":\"„Am Freitagabend wird das Treppenhaus geputzt.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo dice tal cual tras el «übrigens»: «Freitagabend wird das Treppenhaus frisch geputzt»\"],\"itemIds\":[\"b1m1treppenhaus\",\"b1m1einziehen\"],\"tip\":\"El dato útil llega tras «übrigens» («por cierto»). En los mensajes de verdad, lo importante casi nunca va al principio.\"},{\"id\":\"b1m1l9e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Frau Marín, hier ist Vogel, Ihr Nachbar von unten. Ich hab gesehen, Sie ziehen ein — herzlich willkommen! Ähm, falls Sie im Treppenhaus Hilfe brauchen, ich bin fast immer da. Und übrigens: Freitagabend wird das Treppenhaus frisch geputzt. Mit den schweren Kartons würde ich deshalb lieber am Donnerstag ran. Also, alles Gute!\",\"question\":\"¿Qué le sugiere Herr Vogel?\",\"options\":[\"Subir las cajas pesadas el jueves y no el viernes\",\"No usar la escalera y coger el ascensor\",\"Que ella limpie la escalera el viernes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De ascensor no se habla en ningún momento\",\"La escalera la limpia otro: por eso avisa\"],\"itemIds\":[\"b1m1kartons\"]},{\"id\":\"b1m1l9e13\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre: escribe la frase que oyes\",\"text\":\"Ich habe mich schnell eingelebt.\",\"translation\":\"Me he adaptado rápido.\",\"hints\":[\"Ich habe mich schnell …\",\"… ein-ge-lebt\"],\"itemIds\":[\"b1m1sicheinleben\"],\"tip\":\"Verbo separable en Perfekt: el prefijo se pega delante del ge-. Oírlo entero es el paso previo a escribirlo.\"},{\"id\":\"b1m1l9e15\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 2 EN FORMATO REAL · pregunta 1 de 5. Esto ya no es un clip de treinta segundos: son casi TRES MINUTOS seguidos y cinco preguntas sobre el mismo audio, exactamente como el examen. Una sola escucha por pregunta. Antes de darle al play, lee la pregunta y subraya su palabra clave.\",\"audio\":\"$18\",\"question\":\"¿Qué pasa una vez al año con los Nebenkosten?\",\"options\":[\"Llega la liquidación y lo normal últimamente ha sido tener que pagar la diferencia\",\"Se devuelve siempre una parte del dinero\",\"Se fija un precio nuevo que ya no cambia\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice justo lo contrario: «die meisten mussten nachzahlen»\",\"De precios nuevos no habla: habla de la liquidación anual\"],\"itemIds\":[\"b1m1nebenkosten\",\"b1m1kaltmiete\"],\"tip\":\"El Teil 2 no pregunta «¿de qué va el texto?»: pregunta detalles, y en el ORDEN del audio. Esta es la primera parte de la charla; la quinta pregunta estará casi al final.\"},{\"id\":\"b1m1l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 2 de 5. Mismo audio, una escucha.\",\"audio\":\"$19\",\"question\":\"¿Qué se dice del vidrio?\",\"options\":[\"Que va a los contenedores de la esquina y no después de las ocho de la tarde\",\"Que va a la cuarta tonelada del patio\",\"Que lo recoge la administración una vez al mes\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Glas gehört da nicht rein»: en el patio hay papel, envases, orgánico y resto\",\"Nadie lo recoge: lo llevas tú\"],\"itemIds\":[\"b1m1muelltrennung\"],\"tip\":\"«und zwar nicht nach zwanzig Uhr» — ese «und zwar» añade la condición que decide la respuesta. Cuando lo oigas, viene dato.\"},{\"id\":\"b1m1l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 3 de 5. Mismo audio, una escucha.\",\"audio\":\"$1a\",\"question\":\"¿Qué significan las Ruhezeiten para el administrador?\",\"options\":[\"Que no se pone la lavadora a medianoche ni el taladro el domingo por la mañana\",\"Que dentro de casa hay que hablar bajito\",\"Que el domingo no se puede recibir visitas\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Lo descarta él mismo: «Das heißt nicht, dass Sie flüstern müssen»\",\"De visitas no dice nada\"],\"itemIds\":[\"b1m1ruhezeit\",\"b1m1hausordnung\"],\"tip\":\"Fíjate en la estructura «Das heißt nicht …, das heißt …»: primero quita una interpretación falsa y después da la buena. La opción mala está calcada de la parte que él descarta.\"},{\"id\":\"b1m1l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 4 de 5. Mismo audio, una escucha.\",\"audio\":\"$1b\",\"question\":\"¿Quién limpia la escalera?\",\"options\":[\"Los propios inquilinos, por turnos, según un plan que hay junto a los buzones\",\"Una empresa de limpieza que paga la administración\",\"El administrador cuando pasa por el edificio\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Wir haben keinen Putzdienst»: no hay empresa\",\"Él dice justo que en eso no se mete\"],\"itemIds\":[\"b1m1treppenhaus\",\"b1m1mieter\"],\"tip\":\"Aquí se juega el Teil 2 entero: la respuesta está en una frase negativa («keinen Putzdienst») y en otra positiva («das machen die Mieter selbst»). Hay que juntar las dos.\"},{\"id\":\"b1m1l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · pregunta 5 de 5. Mismo audio, una escucha. Esta llega al final: si has aguantado despierto hasta aquí, ya tienes la resistencia que pide el examen.\",\"audio\":\"$1c\",\"question\":\"¿Cómo hay que avisar de una avería?\",\"options\":[\"Por correo electrónico, no por teléfono\",\"Llamándole a él, que es lo más rápido\",\"Con una nota en el buzón de la administración\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«rufen Sie mich bitte nicht an»: por teléfono se le olvida la mitad\",\"La nota en el buzón no se menciona\"],\"itemIds\":[\"b1m1vermieter\"],\"tip\":\"«schwarz auf weiß» = por escrito, negro sobre blanco. Y una nota de examen: en el Teil 2 real la última pregunta cae en los últimos veinte segundos, cuando ya estás cansado. Por eso se entrena la resistencia, no solo el oído.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Mira el Teil 2 del oral: las cinco diapositivas del monólogo son SIEMPRE estas cinco. Memoriza la plantilla.\"},{\"label\":\"Easy German — Wohnungssuche\",\"url\":\"https://www.youtube.com/@EasyGerman\",\"note\":\"Entrevistas de calle con subtítulos dobles: escucha cómo cuenta la gente real su búsqueda de piso.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"n
