m10onefiftytotwohundred\"]},{\"id\":\"enb2m12l7e2\",\"type\":\"write\",\"prompt\":\"Writing Part 2 en condiciones. 150-200. Descripción con capa.\",\"scenario\":\"Tu revista del curso pide: «Describe a day when you realised that half the problem was the clock, not the English. Say what happened and why you still think about it.»\",\"genre\":\"story\",\"register\":\"direct\",\"bullets\":[\"Describe el día (dónde, con quién, qué examen o práctica).\",\"Di qué pasó con el reloj.\",\"Cierra con por qué te quedó (looking back / I found it…), no with very nice.\"],\"checks\":[{\"re\":\"(clock|minutes|time ran|ran out|two hours|seventy)\",\"label\":\"Hablas del reloj\"},{\"re\":\"(exam|writing|reading|listening|practice)\",\"label\":\"Hablas de un examen o de una práctica\"},{\"re\":\"(looking back|I found|in the end|that is why)\",\"label\":\"Cierras evaluando\"}],\"frame\":[\"Párrafo 1 — el día\",\"Párrafo 2 — el reloj\",\"Párrafo 3 — looking back\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"because\",\"in the end\",\"looking back\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"I had been doing a practice paper at the kitchen table, with Amy asleep after a night shift and Nora knocking once to ask if I wanted tea. I said no. I had two hours and ten minutes for reading and writing, and I told myself I was being professional.\\nI was not. I spent an hour on the four reading parts, because the long text looked like the kind of thing I could do perfectly, and because there is no cloze to tell you to move on. At that point I had seventy minutes and two tasks, 250 words at least. I wrote the formal letter. I started the story. The clock on the cooker said I had four minutes left, and I had not closed the story.\\nLooking back, I found the morning more useful than a good mark would have been, although I was furious at the time. Half the problem is the clock. The English, for once, had been the easy part of the morning.\",\"itemIds\":[\"enb2m12twohundredandfiftytothree\",\"enb2m12halftheproblemistheclock\",\"enb2m12ifyouspendanhour\",\"enb2m12notanargumentativeessay\"]},{\"id\":\"enb2m12l7e3\",\"type\":\"bucket\",\"prompt\":\"¿Cae en la Part 2 de LanguageCert?\",\"categories\":[\"Sí: carta / relato / descripción\",\"No: otro género (se enseñó, no se examina aquí)\"],\"items\":[{\"text\":\"Describe your clearest childhood memory and say why.\",\"bucket\":0},{\"text\":\"Write a for-and-against essay on tourism.\",\"bucket\":1},{\"text\":\"Write to a friend about a day that went wrong.\",\"bucket\":0},{\"text\":\"Write a report for your manager on visitor numbers.\",\"bucket\":1},{\"text\":\"Write a story ending with: «…and I booked it.»\",\"bucket\":0},{\"text\":\"Write a proposal to the council on a bypass.\",\"bucket\":1}],\"itemIds\":[\"enb2m12notanargumentativeessay\",\"enb2m10anarrativecomposition\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m12-4\",\"book\":\"In conclusion, I think…\",\"real\":\"So yeah, that's me.\",\"meaning\":\"Bueno, eso es todo / en conclusión.\",\"when\":\"So yeah, that's me cierra un café. In conclusion, I think es de manual y suena a recitar. El monólogo de dos minutos se cierra con To sum up, the evidence points to… o And that's everything I wanted to say: un cierre dicho a propósito, con una tesis, no un apagón.\",\"register\":\"amigos\",\"exam\":\"To sum up, the evidence points to…\",\"note\":\"In conclusion también vale y es B2. Evidence points to sube el rango porque quita el I think.\",\"sound\":\"sóu yea, dats mi\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m12tosumuptheevidence\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:
