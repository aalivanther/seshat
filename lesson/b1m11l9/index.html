o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T542,Lucía Ortega arbeitet seit vier Jahren in Valencia. Sie verdient genug, sie hat Freunde, sie kennt jeden Bäcker in ihrer Straße. Trotzdem sitzt sie jeden Sonntagabend auf dem Balkon und denkt an dieselbe Frage: \u003ci\u003eIst das alles?\u003c/i\u003e\u003cbr/\u003eIm März sieht sie eine Anzeige: ein Büro in Zürich sucht jemanden mit ihrem [[Profil|perfil]]. Sie liest die Anzeige dreimal. Dann schließt sie den Laptop. Am nächsten Tag öffnet sie ihn wieder und schreibt die Bewerbung — \u003cb\u003esich um eine Stelle bewerben\u003c/b\u003e, das hatte sie seit Jahren nicht mehr gemacht.\u003cbr/\u003eDrei Wochen später kommt die Einladung zum Vorstellungsgespräch. Ihre Mutter sagt: „Und wenn es nicht klappt?“ Nico, der Koch aus Berlin, den sie über Sofía kennengelernt hat, sagt zwischen zwei Töpfen nur: „Und wenn doch?“\u003cbr/\u003eDas Gespräch läuft gut. Am Freitag darauf kommt die Zusage. Lucía sitzt zwanzig Minuten mit der Mail vor sich, ohne etwas zu tun. Sie hat [[Angst|miedo]], und sie freut sich — beides gleichzeitig, und das hatte ihr niemand erklärt.\u003cbr/\u003eHeute packt sie Kisten. Im September wird sie für ein Jahr nach Zürich gehen; bis Weihnachten wird sie ihre erste Schweizer Weihnachtsfeier [[überstanden|superado, pasado]] haben. Das Heimweh wird kommen, das weiß sie. Aber die Entscheidung ist getroffen, und der Schritt ist gewagt. \u003cb\u003eMal sehen.\u003c/b\u003e18:T7e1,"])</script><script>self.__next_f.push([1,"«Zukunftsfragen», guten Abend. Ein Auslandssemester — lohnt sich das noch, oder ist es teurer Tourismus mit Prüfung am Ende? Bei mir sitzen eine Auslandsberaterin und ein Student, der vor drei Wochen aus Lissabon zurückgekommen ist. Sie zuerst. | Kurz gesagt: Es lohnt sich, nur fast nie aus dem Grund, den man vorher angibt. Praktisch alle schreiben in die Bewerbung, sie wollen die Sprache lernen. Mitgebracht haben sie am Ende etwas anderes: Sie halten es aus, wenn nichts nach Plan läuft. | Kann ich unterschreiben. Mein Portugiesisch ist, ähm, überschaubar. Aber ich hab in vier Monaten eine Wohnung gefunden, ein Konto eröffnet und mich mit einer Behörde gestritten — in einer Sprache, die ich nicht kann. | Und genau das steht in keinem Zeugnis. Deshalb sage ich jedem: Schreiben Sie auf, was Sie erledigt haben, nicht welche Kurse Sie belegt haben. | Und das Geld? Nicht jeder hat Eltern, die ein halbes Jahr Miete doppelt zahlen. Über diesen Teil wird in der Debatte gern hinweggegangen. | Es gibt mehr Stipendien, als besetzt werden — das ist die traurige Wahrheit. Bei uns bleiben jedes Jahr Plätze frei, weil sich niemand bewirbt. Viele halten sich für nicht gut genug und rechnen von vornherein mit einer Absage. | Bei mir war es genau so. Ich hab den Antrag zweimal angefangen und wieder zugemacht. Am Ende hat eine Kommilitonin ihn mit mir zusammen ausgefüllt, an einem einzigen Nachmittag. | Das hören wir ständig. Der Antrag ist nicht schwer, er sieht nur schwer aus. | Was mir keiner gesagt hat: Die ersten drei Wochen sind schrecklich. Ich wollte nach zehn Tagen nach Hause. Wenn man vorher weiß, dass das normal ist, hält man durch. | Deshalb sagen wir es heute vorher: Die dritte Woche ist die schwerste. Wer das weiß, packt in der dritten Woche nicht die Koffer. | Ein Satz an alle, die gerade überlegen. | Bewerben Sie sich, auch wenn Sie glauben, es klappt sowieso nicht. Die Absage schreiben immer noch die anderen. | Und geht nicht dahin, wo eure Freunde schon sind."])</script><script>self.__next_f.push([1,"19:T7e1,"])</script><script>self.__next_f.push([1,"«Zukunftsfragen», guten Abend. Ein Auslandssemester — lohnt sich das noch, oder ist es teurer Tourismus mit Prüfung am Ende? Bei mir sitzen eine Auslandsberaterin und ein Student, der vor drei Wochen aus Lissabon tte Woche ist die schwerste. Wer das weiß, packt in der dritten Woche nicht die Koffer. | Ein Satz an alle, die gerade überlegen. | Bewerben Sie sich, auch wenn Sie glauben, es klappt sowieso nicht. Die Absage schreiben immer noch die anderen. | Und geht nicht dahin, wo eure Freunde schon sind."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m11l9\",\"phaseId\":\"b1m11\",\"title\":\"Lucías Schritt\",\"subtitle\":\"Historia larga, espiral de los dos módulos anteriores y tu monólogo de 3 minutos\",\"minutes\":23,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Atreverse (y echar de menos)\",\"itemIds\":[\"b1m11zkschritt\",\"b1m11zkheimweh\",\"b1m11zksichfreuenauf\",\"b1m11zkmut\",\"b1m11zkveraenderung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Lucías Schritt — die ganze Geschichte\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la historia de Lucía\",\"sentences\":[\"Lucía sitzt jeden Sonntag auf dem Balkon und fragt sich, ob das alles ist.\",\"Im März sieht sie eine Anzeige aus Zürich und bewirbt sich um die Stelle.\",\"Drei Wochen später wird sie zum Vorstellungsgespräch eingeladen.\",\"Am Freitag darauf bekommt sie die Zusage.\",\"Im September wird sie für ein Jahr nach Zürich gehen.\"],\"translation\":\"Del domingo en el balcón al septiembre en Zúrich.\",\"itemIds\":[\"b1m11zksichbewerbenum\",\"b1m2vorstellungsgespraech\",\"b1m11zkbekommen\"],\"tip\":\"Fíjate en los marcadores temporales: son el esqueleto de cualquier relato del examen.\"},{\"id\":\"b1m11l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia sobre el cuento\",\"question\":\"Was meint Nico mit „Und wenn doch?“\",\"options\":[\"Que seguramente saldrá mal\",\"Que también puede salir bien, y eso también hay que pensarlo\",\"Que Lucía debería quedarse en Valencia\"],\"answer\":1,\"whyWrong\":[\"Eso es lo que dice la madre, no Nico\",null,\"Nico la está empujando, no frenando\"],\"itemIds\":[\"b1m11zkmut\",\"b1m11zkchance\"],\"tip\":\"Dos personajes, dos posturas, ni una palabra de opinión explícita. Así se pregunta la postura en el Lesen Teil 4.\"},{\"id\":\"b1m11l9e3\",\"type\":\"cloze\",\"prompt\":\"La frase del miedo y la ilusión\",\"text\":\"Sie hat Angst, und sie ___ sich — beides gleichzeitig.\",\"answers\":[\"freut\"],\"translation\":\"Tiene miedo y está ilusionada, las dos cosas a la vez.\",\"hints\":[\"sich freuen → tercera persona\",\"f___\"],\"itemIds\":[\"b1m11zksichfreuenauf\"]},{\"id\":\"b1m11l9e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el balance de Lucía\",\"text\":\"Bis Weihnachten ___ sie ihre erste Schweizer Weihnachtsfeier überstanden ___. Das Heimweh ___ kommen, das weiß sie.\",\"answers\":[\"wird\",\"haben\",\"wird\"],\"bank\":[\"wird\",\"haben\",\"sein\",\"wurde\",\"hat\",\"worden\"],\"translation\":\"Para Navidad habrá superado su primera fiesta navideña suiza. La morriña llegará, eso lo sabe.\",\"itemIds\":[\"b1m11zkfuturzwei\",\"b1m11zkheimweh\"]},{\"id\":\"b1m11l9e5\",\"type\":\"errorfix\",\"prompt\":\"Espiral: Konjunktiv II (módulo anterior)\",\"wrong\":\"Wenn ich mehr Zeit hätte, ich würde mehr lesen.\",\"answers\":[\"Wenn ich mehr Zeit hätte, würde ich mehr lesen.\",\"Wenn ich mehr Zeit hätte, würde ich mehr lesen\"],\"why\":\"La subordinada con wenn ocupa la posición 1, así que la principal empieza por el VERBO: «…, würde ich mehr lesen». Es el calco número uno del español («…, yo leería más»). Ojo: «Wenn ich Zeit haben würde» también es alemán —se oye a diario—, solo que la forma sintética hätte es la que puntúa; aquí el fallo es el orden, no el modo.\",\"translation\":\"Si tuviera más tiempo, leería más.\",\"itemIds\":[\"b1m11zkbeimlesen\"]},{\"id\":\"b1m11l9e6\",\"type\":\"errorfix\",\"prompt\":\"Espiral: adjetivo declinado (dos módulos atrás)\",\"wrong\":\"Ich suche ein gut bezahlt Job.\",\"answers\":[\"Ich suche einen gut bezahlten Job.\",\"Ich suche einen gut bezahlten Job\"],\"why\":\"Job es masculino y va en acusativo → einen. Y el participio usado como adjetivo (bezahlt) se declina como cualquier adjetivo: einen gut bezahlt-EN Job. El español lo resuelve con una relativa («un trabajo que esté bien pagado») y por eso la estructura no sale sola.\",\"translation\":\"Busco un trabajo bien pagado.\",\"itemIds\":[\"a2m10job\",\"b1m2gehalt\"]},{\"id\":\"b1m11l9e7\",\"type\":\"transform\",\"prompt\":\"Sube el registro del cuento\",\"source\":\"Lucía hat sich entschieden.\",\"instruction\":\"Dilo con «die Entscheidung» y el verbo «treffen»\",\"answers\":[\"Lucía hat die Entscheidung getroffen.\",\"Lucía hat eine Entscheidung getroffen.\"],\"translation\":\"Lucía ha tomado la decisión.\",\"hints\":[\"…hat die Entscheidung ___\",\"Participio de treffen\"],\"itemIds\":[\"b1m11zkentscheidungtreffen\"]},{\"id\":\"b1m11l9e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la última frase del cuento\",\"text\":\"Die Entscheidung ist getroffen, und der Schritt ist gewagt.\",\"translation\":\"La decisión está tomada y el paso está dado.\",\"hints\":[\"Die Entscheidung ist …\",\"…, und der Schritt ist gewagt\"],\"itemIds\":[\"b1m11zkentscheidung\",\"b1m11zkschritt\"]},{\"id\":\"b1m11l9e9\",\"type\":\"shadow\",\"prompt\":\"Sombrea la frase que resume el módulo\",\"text\":\"Ich freue mich auf das neue Leben.\",\"phonetic\":\"ij FROI-e mij auf das NOI-e LEE-ben\",\"translation\":\"Me hace ilusión la vida nueva.\",\"reps\":2,\"itemIds\":[\"b1m11zksichfreuenauf\"],\"tip\":\"sich freuen AUF = ilusión por lo que viene. sich freuen ÜBER = alegría por lo que ya pasó.\"},{\"id\":\"b1m11l9e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Es lohnt sich.\",\"forbid\":[\"lohnt\",\"lohnen\"],\"answers\":[\"Das ist die Mühe wert.\",\"Das bringt wirklich etwas.\"],\"translation\":\"Merece la pena.\",\"hints\":[\"…die Mühe wert\",\"Das bringt …\"],\"itemIds\":[\"b1m3eslohntsich\"]},{\"id\":\"b1m11l9e11\",\"type\":\"monologue\",\"prompt\":\"Habla tres minutos seguidos. Prepara primero, luego habla sin leer. Repítelo una segunda vez: saldrá mejor.\",\"topic\":\"Im Ausland leben und arbeiten: Chance oder Risiko?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"Di de qué vas a hablar y cómo has organizado la presentación: «Ich möchte heute über … sprechen. Zuerst …, dann …, zum Schluss …»\"},{\"title\":\"2. Deine eigene Erfahrung\",\"hint\":\"Cuenta tu situación o una experiencia tuya: ¿has vivido fuera? ¿lo has pensado alguna vez? ¿qué te frenó?\"},{\"title\":\"3. Die Situation in deinem Heimatland\",\"hint\":\"¿Se emigra mucho desde tu país? ¿Quién se va y por qué? Da un ejemplo concreto.\"},{\"title\":\"4. Vorteile, Nachteile, deine Meinung\",\"hint\":\"einerseits … andererseits …; después «Meiner Meinung nach …» + un ejemplo\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für eure Aufmerksamkeit.»\"}],\"planSeconds\":180,\"speakSeconds\":200,\"reps\":2,\"checklist\":[\"He tratado las 5 diapositivas, ninguna en menos de 20 segundos\",\"He usado al menos un Futur I o Futur II (werde … / werde … haben)\",\"He usado al menos una nominalización (das Lernen, die Entscheidung, die Erfahrung)\",\"He dicho «Meiner Meinung nach…» o «Ich bin der Meinung, dass…» una sola vez y bien\",\"He cerrado dando las gracias\"],\"model\":\"Ich möchte heute über das Thema „Im Ausland leben und arbeiten“ sprechen. Zuerst erzähle ich von meiner eigenen Situation, dann von der Lage in meinem Heimatland, danach nenne ich Vorteile und Nachteile, und zum Schluss gebe ich meine Meinung. — Ich selbst habe noch nicht im Ausland gelebt, aber ich habe mich schon zweimal um eine Stelle in Deutschland beworben. Die Vorbereitung hat mich viel Zeit gekostet. — In meinem Heimatland gehen viele junge Leute ins Ausland, vor allem nach dem Studium. — Einerseits verliert man die Familie und die Sprache des Alltags, andererseits gewinnt man Erfahrung und bessere Aussichten. Meiner Meinung nach lohnt sich der Schritt, wenn man weiß, warum man ihn macht. Bis 2030 werde ich es selbst versucht haben. — Das war meine Präsentation. Vielen Dank für eure Aufmerksamkeit.\",\"itemIds\":[\"b1m2einerseits\",\"b1m11zkmeinungnach\",\"b1m11zkfuturzwei\",\"b1m11zkerfahrung\",\"b1m3eslohntsich\"],\"tip\":\"Estas 5 diapositivas son SIEMPRE las mismas en el Sprechen Teil 2 del examen. Memoriza la partitura ahora y en el módulo 12 solo cambiarás el tema.\"},{\"id\":\"b1m11l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Me hace ilusión la vida nueva, aunque la morriña llegará\",\"answers\":[\"Ich freue mich auf das neue Leben, obwohl das Heimweh kommen wird\",\"Ich freue mich auf das neue Leben, obwohl das Heimweh kommen wird.\",\"Ich freue mich auf das neue Leben, auch wenn das Heimweh kommen wird\"],\"hints\":[\"sich freuen auf + Akkusativ: auf das neue Leben\",\"obwohl manda el verbo al final: …kommen wird\"],\"itemIds\":[\"b1m11zksichfreuenauf\",\"b1m11zkheimweh\"],\"strictUmlaut\":true,\"tip\":\"Rección + adjetivo declinado + obwohl con Futur I al final: tres capas del módulo en una sola frase tuya.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Hören Teil 4: tres voces, ocho afirmaciones\",\"body\":\"El \u003cb\u003eTeil 4\u003c/b\u003e del Hören es una discusión de radio con \u003cb\u003etres voces\u003c/b\u003e —quien modera y dos invitados— y \u003cb\u003eocho afirmaciones\u003c/b\u003e (23-30) que se reparten entre a, b y c. \u003cb\u003eDos escuchas.\u003c/b\u003e En el audio nadie anuncia su papel antes de hablar: quien modera presenta a los invitados una sola vez, al principio.\u003cbr/\u003e\u003cbr/\u003eTres anclas, en este orden:\u003cbr/\u003e· la \u003cb\u003evoz\u003c/b\u003e — decídela en los primeros diez segundos;\u003cbr/\u003e· el \u003cb\u003epapel\u003c/b\u003e: quien modera pregunta y da turnos, la asesora habla de muchos casos y el estudiante del suyo;\u003cbr/\u003e· la \u003cb\u003epostura\u003c/b\u003e: aquí los dos invitados están de acuerdo en el fondo, así que lo que separa sus afirmaciones es el \u003cb\u003epunto de vista\u003c/b\u003e, no el bando. Eso es lo difícil de este debate.\u003cbr/\u003e\u003cbr/\u003eY lo decisivo: las afirmaciones \u003cb\u003eno repiten las palabras del audio\u003c/b\u003e, las resumen. Fórmulas que marcan el turno: \u003ci\u003eKann ich unterschreiben\u003c/i\u003e · \u003ci\u003eDas hören wir ständig\u003c/i\u003e · \u003ci\u003eWas mir keiner gesagt hat…\u003c/i\u003e\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l9e13\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la asesora de estancias en el extranjero y c) el estudiante recién vuelto. Nadie dice quién es antes de hablar: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$18\",\"question\":\"„Der eigentliche Gewinn ist ein anderer als der, den man vorher nennt.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él plantea la pregunta del programa y presenta a los invitados\",null,\"Él lo confirma con su propio caso, pero la regla general la formula ella\"],\"itemIds\":[\"b1m11zkauslandssemester\",\"b1m11zkerfahrung\",\"b1m11zkabsicht\"],\"tip\":\"Ninguna de las ocho afirmaciones sale literal del audio. Aquí, además, los dos invitados dicen casi lo mismo: lo que los separa es que ella habla de todos y él de sí mismo.\"},{\"id\":\"b1m11l9e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$19\",\"question\":\"„Meine Sprachkenntnisse sind bescheiden, mein Alltag im Ausland war es nicht.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo modera\",\"Ella describe el fenómeno; los ejemplos concretos son de él\",null],\"itemIds\":[\"b1m11zkaufenthalt\",\"b1m11zksichgewoehnenan\"],\"tip\":\"Una casa, una cuenta y una discusión con la administración: quien enumera cosas que ha hecho él mismo casi nunca es el experto. Es un atajo fiable cuando dudas entre dos voces.\"},{\"id\":\"b1m11l9e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$1a\",\"question\":\"„In eine Bewerbung gehört, was man geschafft hat, nicht welche Kurse man hatte.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él no da consejos de redacción\",null,\"Él cuenta lo que hizo; qué hacer con eso en el papel lo dice ella\"],\"itemIds\":[\"b1m11zkbewerbung\",\"b1m11zklebenslauf\"],\"tip\":\"«Das steht in keinem Zeugnis» y el consejo que viene detrás. Las afirmaciones del Teil 4 nombran lo que el audio solo aconseja entre líneas.\"},{\"id\":\"b1m11l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. En el Teil 4 real siempre hay una o dos afirmaciones del moderador.\",\"audio\":\"$1b\",\"question\":\"„Über die Kosten wird in dieser Debatte gern hinweggegangen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella responde a eso hablando de becas; el reproche es de él\",\"Él no habla de dinero en ningún momento\"],\"itemIds\":[\"b1m11zkstipendium\",\"b1m11zkabhaengenvon\"],\"tip\":\"Descartar al moderador por sistema cuesta dos puntos. Su marca no es el tema: es la forma. Aquí abre un frente nuevo con una crítica, y esa crítica es un ítem.\"},{\"id\":\"b1m11l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$1c\",\"question\":\"„Viele bewerben sich gar nicht erst, weil sie mit einem Nein rechnen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pregunta por el dinero; el diagnóstico lo da ella\",null,\"Él es un caso de eso, pero lo cuenta en primera persona un turno después\"],\"itemIds\":[\"b1m11zkrechnenmit\",\"b1m11zkabsage\",\"b1m11zkkonkurrenz\"],\"tip\":\"El audio dice «rechnen von vornherein mit einer Absage»; la afirmación, «mit einem Nein rechnen». Misma idea, otra palabra: así se pregunta en el examen.\"},{\"id\":\"b1m11l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$1d\",\"question\":\"„Ohne Hilfe hätte ich den Antrag nie abgeschickt.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no cuenta ninguna experiencia propia\",\"Ella describe el fenómeno en general; el caso concreto es de él\",null],\"itemIds\":[\"b1m11zksichbewerbenum\",\"b1m11zkmut\"],\"tip\":\"Dos veces empezado y cerrado, y una compañera al lado. La afirmación resume la escena entera sin usar ni una de sus palabras.\"},{\"id\":\"b1m11l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8. Dos escuchas.\",\"audio\":\"$1e\",\"question\":\"„Die schwerste Zeit kommt gleich am Anfang.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",\"Ella lo confirma después y hasta lo pone en su asesoramiento; quien lo dice primero es él\",null],\"itemIds\":[\"b1m11zksichgewoehnenan\",\"b1m11zkveraenderung\"],\"tip\":\"Los dos hablan de la tercera semana, uno detrás del otro. Por eso las afirmaciones van en el orden del debate: la primera vez que se dice, cuenta.\"},{\"id\":\"b1m11l9e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido — exactamente como en el examen.\",\"audio\":\"$1f\",\"question\":\"„Man sollte es versuchen, auch wenn man selbst nicht daran glaubt.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Auslandsberaterin\",\"der Student\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pide la frase de cierre, no la da\",null,\"Su consejo final es otro: no ir donde ya están tus amigos\"],\"itemIds\":[\"b1m11zkchance\",\"b1m11zkentscheidungtreffen\",\"b1m11zkvorsatz\"],\"tip\":\"La ronda final vale dos o tres ítems y llega cuando ya estás cansado: por eso el Teil 4 se entrena entero y no por trozos. «Die Absage schreiben immer noch die anderen» — la negativa la escriben ellos, no tú.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m11-4\",\"book\":\"Ich habe mich entschieden zu gehen.\",\"real\":\"Ich bin raus.\",\"meaning\":\"Yo me bajo / lo dejo, y ya está decidido.\",\"when\":\"Entre amigos, cuando te sales de algo —un plan, un piso, un trabajo— y no piensas discutirlo más. Con un superior, en una negociación o por escrito, nunca: cierra la puerta de golpe.\",\"register\":\"jerga\",\"exam\":\"Ich möchte da nicht mehr mitmachen.\",\"note\":\"Literalmente «estoy fuera», como el «yo me bajo» español. Es una salida, no una explicación: quien lo dice ya no negocia.\",\"sound\":\"ij bin raus\",\"level\":\"b1\",\"produce\":false}}],\"resources\":[{\"label\":\"Goethe-Institut — Sprechen B1, Modellsatz\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Mira el Teil 2 del examen: las 5 diapositivas del monólogo son exactamente las de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"20:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\
