ut\u003c/b\u003e + \u003cb\u003e-te\u003c/b\u003e: können → \u003cb\u003ekonnte\u003c/b\u003e, müssen → \u003cb\u003emusste\u003c/b\u003e, wollen → \u003cb\u003ewollte\u003c/b\u003e, dürfen → \u003cb\u003edurfte\u003c/b\u003e. Dos detalles de oro: 1) \u003cb\u003eich y er/sie/es comparten forma\u003c/b\u003e (ich konnte, er konnte) — como en war/hatte; 2) el Umlaut se CAE: konnte, no «könnte» — [[könnte|podría]] con Umlaut existe, pero significa otra cosa (podría, condicional). La Satzklammer no cambia: modal 2º, infinitivo al final: \u003ci\u003eIch \u003cb\u003emusste\u003c/b\u003e früh \u003cb\u003eaufstehen\u003c/b\u003e\u003c/i\u003e. Y el chunk del sueño infantil: \u003ci\u003eIch \u003cb\u003ewollte\u003c/b\u003e Fußballprofi \u003cb\u003ewerden\u003c/b\u003e\u003c/i\u003e — werden = llegar a ser.\",\"table\":[[\"\",\"können → konnte\",\"müssen → musste\",\"wollen → wollte\",\"dürfen → durfte\"],[\"ich\",\"konnte\",\"musste\",\"wollte\",\"durfte\"],[\"du\",\"konntest\",\"musstest\",\"wolltest\",\"durftest\"],[\"er/sie/es\",\"konnte\",\"musste\",\"wollte\",\"durfte\"],[\"wir\",\"konnten\",\"mussten\",\"wollten\",\"durften\"],[\"ihr\",\"konntet\",\"musstet\",\"wolltet\",\"durftet\"],[\"sie/Sie\",\"konnten\",\"mussten\",\"wollten\",\"durften\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"als Kind\",\"pastExample\":\"Ich wollte Fußballprofi werden.\",\"nowLabel\":\"jetzt\",\"nowExample\":\"Ich will Deutsch lernen.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m3l2e1\",\"type\":\"match\",\"prompt\":\"Empareja los chunks de la infancia\",\"pairs\":[{\"target\":\"Ich konnte nicht schwimmen\",\"source\":\"No sabía nadar\"},{\"target\":\"Ich musste früh aufstehen\",\"source\":\"Tenía que levantarme temprano\"},{\"target\":\"Ich wollte Fußballprofi werden\",\"source\":\"Quería ser futbolista profesional\"},{\"target\":\"Ich will Deutsch lernen\",\"source\":\"Quiero aprender alemán\"}],\"itemIds\":[\"a2m3ichkonntenichtschwimmen\",\"a2m3ichmusstefrueh\",\"a2m3ichwollteprofi\",\"ichwilldeutsch\"]},{\"id\":\"a2m3l2e2\",\"type\":\"mc\",\"prompt\":\"Reconoce el tiempo\",\"question\":\"„Ich konnte nicht schwimmen“\",\"options\":[\"No sabía nadar\",\"No sé nadar\",\"No quería nadar\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Ich kann nicht schwimmen» — presente\",\"Eso sería «Ich wollte nicht schwimmen» — wollen, no können\"],\"itemIds\":[\"a2m3ichkonntenichtschwimmen\",\"a2m3konnte\",\"schwimmen\"],\"tip\":\"konnte = kann en pasado. La -te final es la señal del Präteritum, como en hatte.\"},{\"id\":\"a2m3l2e3\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡sin Umlaut!\",\"text\":\"Als Kind ___ ich nicht schwimmen. (sabía)\",\"answers\":[\"konnte\"],\"translation\":\"De niño no sabía nadar.\",\"hints\":[\"können en pasado pierde el Umlaut\",\"k-o-n-n-t-e\"],\"itemIds\":[\"a2m3konnte\",\"a2m3alskind\",\"schwimmen\",\"koennen\"],\"tip\":\"konnte sin Umlaut = podía/sabía. «könnte» con Umlaut = podría (condicional) — dos palabras distintas.\"},{\"id\":\"a2m3l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa el deber de cada mañana\",\"text\":\"Ich ___ früh aufstehen. (tenía que)\",\"answers\":[\"musste\"],\"translation\":\"Tenía que levantarme temprano.\",\"hints\":[\"müssen en pasado, también sin Umlaut\",\"m-u-s-s-t-e\"],\"itemIds\":[\"a2m3musste\",\"a2m3ichmusstefrueh\",\"a2m3frueh\",\"muessen\"],\"tip\":\"müssen → musste: el Umlaut se cae y llega el -te. El infinitivo aufstehen sigue cerrando la frase.\"},{\"id\":\"a2m3l2e5\",\"type\":\"transform\",\"prompt\":\"Transforma: del presente al pasado\",\"source\":\"Ich kann nicht schwimmen.\",\"instruction\":\"Ponla en Präteritum\",\"answers\":[\"Ich konnte nicht schwimmen\",\"Ich konnte nicht schwimmen.\"],\"translation\":\"No sabía nadar.\",\"hints\":[\"kann → konnte, el resto no se toca\",\"Sin Umlaut: konnte\"],\"itemIds\":[\"a2m3ichkonntenichtschwimmen\",\"a2m3konnte\",\"kannstduschwimmen\"],\"tip\":\"Cambias una sola pieza: kann → konnte. El infinitivo se queda al final, como siempre.\"},{\"id\":\"a2m3l2e6\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«De niño tenía que levantarme temprano» →\",\"options\":[\"Als Kind musste ich früh aufstehen\",\"Als Kind ich musste früh aufstehen\",\"Als Kind musste ich früh aufgestanden\"],\"answer\":0,\"whyWrong\":[null,\"Als Kind abre la frase → el verbo va inmediatamente: musste 2º, ich 3º\",\"Tras el modal va el INFINITIVO (aufstehen), no el participio\"],\"itemIds\":[\"a2m3musste\",\"a2m3alskind\",\"a2m3frueh\",\"aufstehen\"],\"tip\":\"Modal en Präteritum + infinitivo al final: la Satzklammer de la fase 5, ahora en pasado.\"},{\"id\":\"a2m3l2e7\",\"type\":\"build\",\"prompt\":\"Construye el sueño de infancia\",\"target\":\"Ich wollte Fußballprofi werden\",\"translation\":\"Quería ser futbolista profesional\",\"distractors\":[\"will\",\"geworden\"],\"itemIds\":[\"a2m3ichwollteprofi\",\"a2m3wollte\",\"a2m3werden\"],\"tip\":\"wollte + werden al final: «quería LLEGAR A SER». werden va en infinitivo — el participio geworden es otra historia (lección 7).\"},{\"id\":\"a2m3l2e8\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿presente o pasado?\",\"categories\":[\"Präsens (jetzt)\",\"Präteritum (als Kind)\"],\"items\":[{\"text\":\"ich kann\",\"bucket\":0},{\"text\":\"ich konnte\",\"bucket\":1},{\"text\":\"ich muss\",\"bucket\":0},{\"text\":\"ich musste\",\"bucket\":1},{\"text\":\"ich will\",\"bucket\":0},{\"text\":\"ich wollte\",\"bucket\":1},{\"text\":\"du musst\",\"bucket\":0},{\"text\":\"du konntest\",\"bucket\":1}],\"itemIds\":[\"a2m3konnte\",\"a2m3musste\",\"a2m3wollte\",\"koennen\",\"muessen\",\"wollen\"],\"tip\":\"La -te te delata: konnte, musste, wollte = pasado. Sin -te (kann, muss, will) sigues en el presente.\"},{\"id\":\"a2m3l2e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich musste früh aufstehen\",\"translation\":\"Tenía que levantarme temprano\",\"hints\":[\"Modal en pasado + infinitivo al final\",\"musste — con doble s\"],\"itemIds\":[\"a2m3ichmusstefrueh\",\"a2m3musste\",\"a2m3frueh\"]},{\"id\":\"a2m3l2e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"De niño quería ser futbolista profesional\",\"answers\":[\"Als Kind wollte ich Fußballprofi werden\",\"Ich wollte als Kind Fußballprofi werden\"],\"hints\":[\"Als Kind abre → wollte 2º, ich 3º\",\"Als Kind wollte ich ... werden\"],\"itemIds\":[\"a2m3ichwollteprofi\",\"a2m3wollte\",\"a2m3werden\",\"a2m3alskind\"],\"tip\":\"Si wollte quedó 2º y werden al final, los modales en pasado ya son tuyos. La frase favorita del examen oral A2.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — Modalverben im Präteritum (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «konnte» o «musste» en el A2: las mismas formas, dichas por actores nativos.\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra por A2 y busca «Präteritum Modalverben»: más práctica de konnte/musste/wollte.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"m
