u003cb\u003epara estudiar\u003c/b\u003e (verbo).\u003cbr/\u003e· \u003ci\u003eI went to the council \u003cb\u003efor information\u003c/b\u003e.\u003c/i\u003e — fui \u003cb\u003ea por información\u003c/b\u003e (sustantivo).\u003cbr/\u003e\u003cbr/\u003ePor eso \u003cb\u003e\u003ci\u003e«I came here for study English»\u003c/i\u003e es imposible\u003c/b\u003e: hay un \u003ci\u003efor\u003c/i\u003e y detrás un verbo. Es probablemente el error más repetido del hispanohablante en todo el nivel, y se arregla con esa única línea. Léela otra vez y apúntala en la primera página del cuaderno.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa excepción que confirma la regla — y que es la misma regla:\u003c/b\u003e \u003ci\u003efor\u003c/i\u003e SÍ puede llevar verbo, pero entonces el verbo va en \u003cb\u003e-ing\u003c/b\u003e y ya no dice para qué vas tú, sino \u003cb\u003epara qué sirve una cosa\u003c/b\u003e:\u003cbr/\u003e· \u003ci\u003eIt's \u003cb\u003efor cutting\u003c/b\u003e cardboard.\u003c/i\u003e — es para cortar cartón. (¿Qué hace este cacharro?)\u003cbr/\u003e· \u003ci\u003eThis form is \u003cb\u003efor reporting\u003c/b\u003e fly-tipping.\u003c/i\u003e\u003cbr/\u003eY coincide con la regla de la lección 3: detrás de preposición, \u003ci\u003e-ing\u003c/i\u003e. No es una excepción nueva; es la de siempre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas versiones largas, para la carta formal:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ein order to\u003c/b\u003e — \u003ci\u003eWe wrote \u003cb\u003ein order to\u003c/b\u003e get an answer.\u003c/i\u003e Igual que \u003ci\u003eto\u003c/i\u003e, pero un punto más formal. En una carta al ayuntamiento queda bien; hablando suena a discurso.\u003cbr/\u003e· \u003cb\u003eso as to\u003c/b\u003e — lo mismo.\u003cbr/\u003e· \u003cb\u003eso as not to\u003c/b\u003e / \u003cb\u003ein order not to\u003c/b\u003e — \u003cb\u003ela forma NEGATIVA\u003c/b\u003e, y aquí sí hay que fijarse: \u003ci\u003e«for not wake the baby»\u003c/i\u003e no existe, y \u003ci\u003e«to not wake»\u003c/i\u003e tampoco se dice. Es \u003ci\u003eWe keep it down \u003cb\u003eso as not to\u003c/b\u003e wake the baby.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUna prueba de dos segundos para no fallar nunca:\u003c/b\u003e mira la palabra que va después. ¿Es un verbo en infinitivo? → \u003cb\u003eto\u003c/b\u003e. ¿Es un sustantivo? → \u003cb\u003efor\u003c/b\u003e. ¿Es un verbo pero estás diciendo para qué sirve un objeto? → \u003cb\u003efor + -ing\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l4\",\"phaseId\":\"enb1m11\",\"title\":\"I came here to study English\",\"subtitle\":\"El calco más rentable del nivel: el español dice «para» dos veces y el inglés parte en dos\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos mitades de «para», y cómo se dice cada una\",\"itemIds\":[\"enb1m11cameheretostudy\",\"enb1m11wentforinformation\",\"enb1m11itsforcutting\",\"enb1m11inorderto\",\"enb1m11soasnotto\",\"enb1m11apetition\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla de bolsillo más rentable que vas a aprender este año\",\"body\":\"$17\",\"table\":[[\"Lo que quieres decir\",\"Se dice\",\"Lo que NO existe\"],[\"Vine para estudiar inglés\",\"I came here to study English.\",\"I came here for study English.\"],[\"Fui a por información\",\"I went to the council for information.\",\"I went to the council for get information.\"],[\"Es para cortar cartón\",\"It's for cutting cardboard.\",\"It's for to cut cardboard.\"],[\"Para no despertar al bebé\",\"…so as not to wake the baby.\",\"…for not wake the baby.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro maneras de decir «para»\",\"pairs\":[{\"target\":\"I came here to study English.\",\"source\":\"Vine aquí para estudiar inglés.\"},{\"target\":\"I went to the council for information.\",\"source\":\"Fui al ayuntamiento a por información.\"},{\"target\":\"It's for cutting cardboard.\",\"source\":\"Es para cortar cartón.\"},{\"target\":\"so as not to wake the baby\",\"source\":\"para no despertar al bebé\"}],\"itemIds\":[\"enb1m11cameheretostudy\",\"enb1m11wentforinformation\",\"enb1m11itsforcutting\",\"enb1m11soasnotto\"],\"tip\":\"Cuatro «para» en español y tres estructuras distintas en inglés. Si te fijas solo en lo que va DETRÁS de la preposición, no fallas ninguna.\"},{\"id\":\"enb1m11l4e2\",\"type\":\"mc\",\"prompt\":\"La prueba de dos segundos\",\"question\":\"¿Cómo se dice «Vine aquí para estudiar inglés»?\",\"options\":[\"I came here to study English.\",\"I came here for study English.\",\"I came here for to study English.\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de «for» no puede ir un verbo en infinitivo. Es el calco número uno del hispanohablante y se caza mirando la palabra siguiente.\",\"«For to» existió en inglés hace cuatrocientos años y hoy solo se oye en algunos dialectos. En el examen es un error.\"],\"itemIds\":[\"enb1m11cameheretostudy\"],\"tip\":\"Si te acuerdas de una sola cosa de esta lección, que sea esta: «to» delante de verbo, «for» delante de sustantivo. Vale para el escrito, para el oral y para el resto de tu vida en inglés.\"},{\"id\":\"enb1m11l4e3\",\"type\":\"errorfix\",\"prompt\":\"El calco del módulo. Cambia UNA palabra.\",\"wrong\":\"I came here for study English.\",\"answers\":[\"I came here to study English.\"],\"why\":\"«for» solo puede llevar sustantivo detrás («for information», «for the meeting»). Cuando lo que viene es un verbo que dice para qué, va «to». El español usa «para» para las dos cosas, y ahí nace el error.\",\"translation\":\"Vine aquí para estudiar inglés.\",\"itemIds\":[\"enb1m11cameheretostudy\"]},{\"id\":\"enb1m11l4e4\",\"type\":\"bucket\",\"prompt\":\"¿Detrás va «to» o va «for»? Mira solo la palabra siguiente\",\"categories\":[\"to + verbo\",\"for + sustantivo\"],\"items\":[{\"text\":\"…___ study English\",\"bucket\":0},{\"text\":\"…___ information\",\"bucket\":1},{\"text\":\"…___ ask them why\",\"bucket\":0},{\"text\":\"…___ the meeting on Thursday\",\"bucket\":1},{\"text\":\"…___ save time\",\"bucket\":0},{\"text\":\"…___ a second opinion\",\"bucket\":1}],\"itemIds\":[\"enb1m11cameheretostudy\",\"enb1m11wentforinformation\"],\"tip\":\"No has tenido que entender ni una de las seis frases: te ha bastado con mirar si lo de detrás era verbo o sustantivo. Eso es exactamente lo que hay que hacer en el examen, y en dos segundos.\"},{\"id\":\"enb1m11l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa con «to» o con «for»\",\"text\":\"We signed a petition ___ save the afternoon service.\",\"answers\":[\"to\"],\"translation\":\"Firmamos una recogida de firmas para salvar el servicio de tardes.\",\"hints\":[\"Mira la palabra que va justo detrás del hueco\",\"Es un verbo, así que…\"],\"itemIds\":[\"enb1m11apetition\",\"enb1m11cameheretostudy\"],\"tip\":\"El servicio de tardes de la biblioteca es el del bulo del módulo 4, el que Valeria desmintió por carta. Aquí ya va en serio: las firmas son para que no lo cierren de verdad.\"},{\"id\":\"enb1m11l4e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"It's for cutting cardboard\",\"translation\":\"Es para cortar cartón\",\"distractors\":[\"to\",\"cut\"],\"itemIds\":[\"enb1m11itsforcutting\"],\"tip\":\"Las dos fichas que sobran son las dos tentaciones: «to cut» por la regla de la lección y «cut» a pelo por el español. Aquí no dices para qué vas TÚ: dices para qué sirve la cosa.\"},{\"id\":\"enb1m11l4e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que Valeria le cuenta a Amy\",\"text\":\"I went to the council ___ information. Then I wrote ___ ask them why nothing had happened. That green bin is ___ garden waste, and we keep the key by the door ___ save time.\",\"answers\":[\"for\",\"to\",\"for\",\"to\"],\"bank\":[\"for\",\"to\",\"about\",\"because of\",\"with\"],\"translation\":\"Fui al ayuntamiento a por información. Luego escribí para preguntarles por qué no había pasado nada. Ese cubo verde es para restos de jardín, y la llave la tenemos junto a la puerta para ganar tiempo.\",\"itemIds\":[\"enb1m11wentforinformation\",\"enb1m11cameheretostudy\",\"enb1m11inorderto\"],\"tip\":\"Dos «for» y dos «to», alternándose. Tapa el hueco con el dedo y mira solo lo que viene después: dos sustantivos y dos verbos. No hace falta nada más.\"},{\"id\":\"enb1m11l4e8\",\"type\":\"transform\",\"prompt\":\"Sube el registro para la carta formal\",\"source\":\"We wrote to get an answer.\",\"instruction\":\"Dilo con la versión larga y formal\",\"answers\":[\"We wrote in order to get an answer\",\"We wrote in order to get an answer.\",\"We wrote so as to get an answer\"],\"translation\":\"Escribimos con el fin de obtener una respuesta.\",\"hints\":[\"Tres palabras entre «wrote» y «get»\",\"We wrote in ... to get an answer\"],\"itemIds\":[\"enb1m11inorderto\"],\"tip\":\"«In order to» no dice nada nuevo: solo sube el registro. Por eso vale para la carta al ayuntamiento y sobra hablando con un amigo, donde suena a que estás leyendo un informe.\"},{\"id\":\"enb1m11l4e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar las palabras prohibidas\",\"source\":\"I came here to study English.\",\"forbid\":[\"study\",\"studying\"],\"answers\":[\"I came here to learn English\",\"I came here in order to learn English\",\"The reason I came here was to learn English\"],\"translation\":\"Vine aquí para estudiar inglés.\",\"itemIds\":[\"enb1m11cameheretostudy\",\"enb1m11inorderto\"],\"tip\":\"Tres rodeos y ninguno cambia el sentido. Esto es lo que hace un hablante de B1 cuando se le atasca una palabra: no se calla, la esquiva.\"},{\"id\":\"enb1m11l4e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Lo tenemos bajito para no despertar al bebé.\",\"answers\":[\"We keep it down so as not to wake the baby\",\"We keep it down so as not to wake the baby.\",\"We keep it down in order not to wake the baby\"],\"hint\":\"La negación va entera antes del «to»\",\"itemIds\":[\"enb1m11soasnotto\",\"enb1m11turnitdown\"],\"tip\":\"Es la única forma del propósito que hay que aprender de memoria, porque la negación cae en un sitio raro: «so as NOT TO wake». Ni «for not», ni «to not». Dos veces en voz alta y ya es tuya.\"},{\"id\":\"enb1m11l4e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Para qué sirve exactamente?\",\"source\":\"That form is for reporting fly-tipping, not for anything else.\",\"answers\":[\"Ese impreso es para denunciar vertidos ilegales, no para nada más\",\"Ese formulario es para denunciar vertidos ilegales, no para otra cosa\",\"Ese impreso es para denunciar que alguien tira escombros, no para nada más\"],\"itemIds\":[\"enb1m11itsforcutting\",\"enb1m11flytipping\"],\"tip\":\"«Fly-tipping» es tirar muebles, escombros o bolsas grandes en la calle o en un descampado. No hay palabra española de una pieza: se explica. Y en el Reino Unido tiene multa propia y formulario propio.\"},{\"id\":\"enb1m11l4e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres frases que sostienen la regla\",\"text\":\"I came here to study English. I went to the council for information. It's for cutting cardboard.\",\"phonetic\":\"ai kéim jía tu STÁ-di ÍN-glish · ai uént tu de KÁUN-sil fo in-fa-MÉI-shon · its fo KÁ-ting KÁAD-bood\",\"translation\":\"Vine aquí para estudiar inglés. Fui al ayuntamiento a por información. Es para cortar cartón.\",\"itemIds\":[\"enb1m11cameheretostudy\",\"enb1m11wentforinformation\",\"enb1m11itsforcutting\"],\"tip\":\"Dilas seguidas tres veces. No estás practicando pronunciación: estás metiéndote en la boca el reflejo de que «for» pide sustantivo. Cuando la boca lo tenga, la mano dejará de fallar.\"},{\"id\":\"enb1m11l4e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Sam, en el café. Dos escuchas.\",\"audio\":\"You've got a folder. That's never good.|It's the petition. Ninety-one names.|Ninety-one! What do you need, a hundred?|Two hundred, and by the twelfth. I came in here for a coffee, honestly, and then I saw your counter and thought about it.|Go on, then. Put it by the till. I'm not signing it myself, mind.|You're not?|I don't live in the ward. It would be the first name they threw out. I'm not having ninety-one good ones binned because of mine.|Fair enough. That's — actually, that's a good point.\",\"question\":\"¿Por qué no firma Sam?\",\"options\":[\"Porque no vive en el distrito y su firma podría invalidar el resto\",\"Porque no está de acuerdo con la recogida de firmas\",\"Porque prefiere firmarla por internet más tarde\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Está de acuerdo: deja poner el folio junto a la caja.\",\"De internet no dice nada; lo que explica es un problema de dirección.\"],\"itemIds\":[\"enb1m11apetition\",\"enb1m11wentforinformation\",\"enb1m11thatsagoodpoint\"],\"tip\":\"Fíjate en «I came in here for a coffee»: «for» con sustantivo, y ahí está la lección metida en una frase de paso. Así es como aparece la gramática en el Listening — nunca anunciada.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"
