a, o directamente cierra la conversación. Es la señal universal de «me voy a ir».\u003cbr/\u003e· \u003cb\u003eMind you\u003c/b\u003e — \u003ci\u003e«eso sí»\u003c/i\u003e. Matiza lo que acabas de decir tú mismo, casi contradiciéndote un poco. Es muy británico y suena muy adulto.\u003cbr/\u003e· \u003cb\u003eActually\u003c/b\u003e — \u003ci\u003e«en realidad»\u003c/i\u003e. Corrige lo que el otro cree, con suavidad. \u003cb\u003eNo\u003c/b\u003e significa «actualmente».\u003cbr/\u003e· \u003cb\u003eWell\u003c/b\u003e — el arranque universal cuando la respuesta no es un sí o un no limpio, o cuando necesitas medio segundo.\u003cbr/\u003e· \u003cb\u003eRight\u003c/b\u003e — cierra un asunto y abre el siguiente: \u003ci\u003e«Right, then. Where were we?»\u003c/i\u003e Es lo que dice el jefe cuando empieza la reunión.\u003cbr/\u003e\u003cbr/\u003eY dos más que no son marcadores pero hacen el mismo trabajo:\u003cbr/\u003e· \u003cb\u003eI mean\u003c/b\u003e — reformula lo que acabas de decir, porque no te ha salido bien a la primera. Es el \u003ci\u003e«o sea»\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eGo on\u003c/b\u003e — \u003cb\u003ele das el turno al otro\u003c/b\u003e. Dos palabras y le has dicho «sigue, te escucho».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué esto puntúa.\u003c/b\u003e El descriptor oficial del B1 oral pide presentar las cosas \u003ci\u003e«as a linear sequence of points»\u003c/i\u003e, y habla de \u003ci\u003e«initiate, maintain and close»\u003c/i\u003e una conversación. Esas tres cosas —abrir, mantener y cerrar— \u003cb\u003eson literalmente estas palabras\u003c/b\u003e. Un candidato que no las usa contesta bien y suena a interrogatorio; uno que las usa suena a conversación."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l7\",\"phaseId\":\"enb1m7\",\"title\":\"Anyway, by the way, mind you\",\"subtitle\":\"Las seis palabras que hacen que una conversación no se caiga\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis marcadores, seis trabajos distintos\",\"itemIds\":[\"enb1m7bytheway\",\"enb1m7mindyou\",\"enb1m7wellthethingis\",\"enb1m7rightthen\",\"enb1m7imean\",\"enb1m7goon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no significan nada, y por eso valen tanto\",\"body\":\"$17\",\"table\":[[\"Marcador\",\"Qué le dice al otro\",\"Español\"],[\"By the way,\",\"cambio de tema, sin aviso\",\"por cierto\"],[\"Anyway,\",\"cierro esto y sigo (o me voy)\",\"en fin\"],[\"Mind you,\",\"matizo lo que acabo de decir\",\"eso sí\"],[\"Actually,\",\"no es como creías\",\"en realidad\"],[\"Well,\",\"no tengo una respuesta limpia\",\"bueno…\"],[\"Right, then.\",\"cierro y abro otro asunto\",\"vale, pues\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l7e1\",\"type\":\"match\",\"prompt\":\"Empareja cada marcador con lo que hace\",\"pairs\":[{\"target\":\"By the way,\",\"source\":\"mete un tema nuevo que no venía a cuento\"},{\"target\":\"Mind you,\",\"source\":\"matiza lo que acabas de decir tú\"},{\"target\":\"Well, the thing is…\",\"source\":\"avisa de que la respuesta no es limpia\"},{\"target\":\"Right, then.\",\"source\":\"cierra un asunto y abre el siguiente\"},{\"target\":\"Go on.\",\"source\":\"le cede el turno al otro\"}],\"itemIds\":[\"enb1m7bytheway\",\"enb1m7mindyou\",\"enb1m7wellthethingis\",\"enb1m7rightthen\",\"enb1m7goon\"],\"tip\":\"Ninguno se traduce solo: se traduce lo que HACEN. Por eso al aprenderlos hay que memorizar la función, no la palabra.\"},{\"id\":\"enb1m7l7e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo más caro del inglés\",\"question\":\"«Actually, I don't work there any more.» ¿Qué significa «actually»?\",\"options\":[\"En realidad\",\"Actualmente\",\"Efectivamente\"],\"answer\":0,\"whyWrong\":[null,\"«actualmente» es «currently» o «at the moment». Este es EL falso amigo del inglés y cae en todos los exámenes.\",\"«efectivamente» sería «indeed». «Actually» casi siempre corrige lo que el otro creía.\"],\"itemIds\":[\"enb1m3actually\"],\"tip\":\"Truco de memoria: «actually» sirve para llevar la contraria con educación. Si no hay nada que corregir, probablemente la palabra que buscas es otra.\"},{\"id\":\"enb1m7l7e3\",\"type\":\"bucket\",\"prompt\":\"¿Cambia de tema (o cierra) o matiza lo dicho?\",\"categories\":[\"Cambia de tema o cierra\",\"Matiza lo dicho\"],\"items\":[{\"text\":\"Anyway, we'd better get going.\",\"bucket\":0},{\"text\":\"By the way, did you ring the landlord?\",\"bucket\":0},{\"text\":\"Mind you, the coffee there is excellent.\",\"bucket\":1},{\"text\":\"Actually, it wasn't that expensive.\",\"bucket\":1},{\"text\":\"Right, then. Where were we?\",\"bucket\":0},{\"text\":\"I mean, it's not that difficult.\",\"bucket\":1}],\"itemIds\":[\"enb1m3anyway\",\"enb1m7bytheway\",\"enb1m7mindyou\",\"enb1m3actually\",\"enb1m7rightthen\",\"enb1m7imean\"],\"tip\":\"Los de la izquierda mueven la conversación; los de la derecha ajustan lo que ya se ha dicho. Saber cuál es cuál te dice qué esperar en la frase siguiente — y eso es media comprensión auditiva.\"},{\"id\":\"enb1m7l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa el marcador\",\"text\":\"It's a long walk from the station. ___ you, the bus takes just as long.\",\"answers\":[\"Mind\"],\"translation\":\"Hay un buen paseo desde la estación. Eso sí, el autobús tarda lo mismo.\",\"hints\":[\"Va seguido de «you» y matiza lo que acabas de decir tú mismo\",\"M...\"],\"itemIds\":[\"enb1m7mindyou\"],\"tip\":\"«Mind you» siempre va con «you» pegado y nunca cambia: no existe «mind me» ni «mind him». Es un bloque cerrado.\"},{\"id\":\"enb1m7l7e5\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación con sus marcadores\",\"text\":\"— ___, where did you learn your English? — In Bogotá, at school. ___, I've forgotten most of what they taught me. — ___ you, school English is never the same as street English. — No, it isn't. ___, that's exactly why I came here.\",\"answers\":[\"By the way\",\"Actually\",\"Mind\",\"Anyway\"],\"bank\":[\"By the way\",\"Actually\",\"Mind\",\"Anyway\",\"In other words\",\"Sort of\",\"At last\"],\"translation\":\"— Por cierto, ¿dónde aprendiste inglés? — En Bogotá, en el colegio. En realidad se me ha olvidado casi todo lo que me enseñaron. — Eso sí, el inglés del colegio nunca es el de la calle. — No lo es. En fin, por eso mismo vine aquí.\",\"itemIds\":[\"enb1m7bytheway\",\"enb1m3actually\",\"enb1m7mindyou\",\"enb1m3anyway\"],\"tip\":\"Fíjate en el cuarto: «Anyway» cierra el intercambio y devuelve la conversación a lo importante. Es el marcador que más se oye en Londres y el que menos se estudia.\"},{\"id\":\"enb1m7l7e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Actually, I live here since 2023.\",\"answers\":[\"Actually, I have lived here since 2023.\"],\"why\":\"El marcador está perfecto; lo que falla es el tiempo verbal. Lo que empezó en el pasado y sigue ahora pide present perfect en inglés, aunque el español use el presente: «vivo aquí desde 2023» → «I have lived here since 2023».\",\"translation\":\"En realidad, vivo aquí desde 2023.\",\"itemIds\":[\"enb1m3actually\",\"enb1m1havelivedhere\"]},{\"id\":\"enb1m7l7e7\",\"type\":\"order\",\"prompt\":\"Ordena la conversación — los marcadores te dicen por dónde va\",\"sentences\":[\"Right, then. You've been here two years now, haven't you?\",\"Two and a bit, yes. I came over in the spring of 2023.\",\"And do you follow everybody at work? Because I still don't, and I was born here.\",\"Mind you, the café was easier — you hear the same twenty sentences all day.\",\"Anyway, we'd better go in. They're waiting for us.\"],\"translation\":\"Vale, pues. Llevas dos años aquí ya, ¿no? · Dos y pico, sí. Vine en la primavera de 2023. · ¿Y entiendes a todo el mundo en el trabajo? Porque yo todavía no, y soy de aquí. · Eso sí, el café era más fácil: oyes las mismas veinte frases todo el día. · En fin, vamos entrando, que nos esperan.\",\"itemIds\":[\"enb1m7rightthen\",\"enb1m7mindyou\",\"enb1m3anyway\",\"enb1m7youvebeenhaventyou\"],\"tip\":\"«Right, then» abre, «Mind you» matiza y «Anyway» cierra. Con solo esos tres puedes reconstruir el orden aunque no entiendas el resto: eso es lo que hacen por ti.\"},{\"id\":\"enb1m7l7e8\",\"type\":\"transform\",\"prompt\":\"Ábrelo con un marcador para que no suene tan seco\",\"source\":\"I don't agree.\",\"instruction\":\"Suavízalo con un marcador del habla\",\"answers\":[\"Well, actually, I don't agree.\",\"Actually, I don't agree.\",\"Well, I don't agree.\",\"Mind you, I don't agree.\"],\"translation\":\"Bueno, en realidad no estoy de acuerdo.\",\"hints\":[\"El arranque universal cuando la respuesta no es limpia\",\"W..., I don't agree.\"],\"itemIds\":[\"ena2m3well\",\"enb1m3actually\"],\"tip\":\"«I don't agree» a pelo es correcto y suena a portazo. Con «Well, actually…» delante dices exactamente lo mismo y nadie se ofende. En el Speaking Part 3 eso es criterio de registro.\"},{\"id\":\"enb1m7l7e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Por cierto, ¿de dónde eres?\",\"answers\":[\"By the way, where are you from?\",\"By the way, whereabouts are you from?\"],\"hint\":\"Cuatro palabras antes de la coma\",\"itemIds\":[\"enb1m7bytheway\",\"enwhereareyoufrom\"],\"tip\":\"Y la respuesta a esa pregunta, si eres de Bogotá y llevas dos años aquí, puede ser las dos cosas: «I'm from Colombia, but I live here now». Nadie te obliga a elegir.\"},{\"id\":\"enb1m7l7e10\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"Eso sí, hay que reconocer que habla muy rápido.\",\"answers\":[\"Mind you, he does talk fast\",\"Mind you, he does speak very fast\",\"Mind you, she does talk fast\"],\"hints\":[\"Empieza por el marcador de dos palabras\",\"M... you, he d... talk fast\"],\"itemIds\":[\"enb1m7mindyou\"],\"tip\":\"Fíjate en «he DOES talk»: ese «does» no hace falta gramaticalmente, está ahí para insistir. Es lo que en español haces subiendo la voz, y en inglés se escribe.\"},{\"id\":\"enb1m7l7e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — y haz la pausa después de cada coma\",\"text\":\"Well, the thing is, I didn't understand a word. Mind you, nobody did. Anyway, go on.\",\"phonetic\":\"uel, de zing is̬, ai DÍ-dent an-das-TAND a ueed · maind yu, NÓU-ba-di did · É-ni-uei, góu on\",\"translation\":\"Bueno, es que no entendí ni una palabra. Eso sí, nadie entendió. En fin, sigue.\",\"itemIds\":[\"enb1m7wellthethingis\",\"enb1m7mindyou\",\"enb1m3anyway\",\"enb1m7goon\"],\"tip\":\"La pausa después del marcador no es opcional: es lo que hace que se oiga como marcador y no como parte de la frase. Sin la pausa, «well» suena a «bien».\"},{\"id\":\"enb1m7l7e12\",\"type\":\"shadow\",\"prompt\":\"Repite pegándote al audio: dos pasadas, la primera más lenta\",\"text\":\"Anyway, I'd better be off. Mind you, it was lovely to see you.\",\"phonetic\":\"É-ni-uei, aid BÉ-ta bi of · maind yu, it uos̬ LÁV-li tu sii yu\",\"translation\":\"En fin, me tengo que ir yendo. Eso sí, me ha encantado verte.\",\"reps\":2,\"itemIds\":[\"enb1m3anyway\",\"enb1m1natbetterbeoff\",\"enb1m7mindyou\"],\"tip\":\"Así se cierra una conversación en Londres: «Anyway» avisa, «I'd better be off» anuncia y «it was lovely to see you» despide. Tres piezas, siempre en ese orden.\"},{\"id\":\"enb1m7l7e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Right, so that's the rota sorted until March. By the way, Amy asked me whether you could do the Saturday morning in February. Mind you, don't say yes just to be nice — she asked four other people first, and two of them said no. Anyway, think about it and let me know Thursday.\",\"question\":\"¿Qué le está aconsejando?\",\"options\":[\"Que no diga que sí solo por quedar bien\",\"Que trabaje el sábado de febrero\",\"Que hable con las otras cuatro personas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo al revés: le dice que se lo piense y que conteste el jueves.\",\"Menciona a las otras cuatro para explicar por qué le toca a ella, no para que las llame.\"],\"itemIds\":[\"enb1m7bytheway\",\"enb1m7mindyou\",\"enb1m3anyway\"],\"tip\":\"Los tres marcadores te ordenan el audio: «By the way» trae el tema, «Mind you» trae el consejo y «Anyway» lo cierra. Si los oyes, sabes en qué trozo está la respuesta.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — The English We Speak\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\",\"note\":\"Episodios de tres minutos sobre expresiones reales. Escucha dos con los ojos cerrados y luego con la transcripción: lo que se te escapaba casi siempre es un marcador.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"
