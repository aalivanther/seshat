ht mit dem Auto. Die Innenstadt ist ab Mitternacht komplett gesperrt, und die wenigen Parkplätze am Rand sind längst besetzt. Mit dem Velo kommen Sie zwar bis an die Altstadt heran, abstellen dürfen Sie es aber nur an den markierten Plätzen. Am einfachsten haben es die Gäste, die mit dem Zug anreisen: In diesen drei Nächten fahren die Züge durch. Nach dem Morgestraich, also gegen fünf, gehen die meisten in ein Restaurant und essen Mehlsuppe, eine dunkle Suppe aus geröstetem Mehl. Klingt langweilig, ich weiss, schmeckt aber um diese Uhrzeit ausgezeichnet. Später am Vormittag gibt es dann ein Znüni, und überall in den Gassen spielt die Guggenmusik. Dass diese Blasmusik falsch klingt, ist übrigens kein Versehen der Musikerinnen und Musiker, sondern Absicht: Genau so gehört es sich. Und zum Schluss noch zwei Sachen, die unsere Gäste regelmässig überraschen. Erstens die Räppli, also das Konfetti: Das werfen bei uns nur die Aktiven, nicht das Publikum. Zweitens die Kleidung. Verkleidet sind hier ausschliesslich die Cliquen; wer im Kostüm kommt, fällt unangenehm auf. Ziehen Sie sich stattdessen warm an. Es ist Februar, es ist vier Uhr morgens, und die Kälte ist der einzige Teil des Programms, den bei uns niemand mag."])</script><script>self.__next_f.push([1,"18:T782,"])</script><script>self.__next_f.push([1,"Herzlich willkommen zu unserer kleinen Einführung in die Basler Fasnacht. Ich führe Sie nachher durch die Altstadt, aber zuerst erklär ich Ihnen in Ruhe, was Sie in den nächsten drei Tagen erwartet. Die Fasnacht beginnt immer am Montag nach Aschermittwoch, und zwar um Punkt vier Uhr morgens. In der ganzen Innenstadt wird dann das Licht ausgemacht, auch in den Wohnungen, und zwar freiwillig. Übrig bleiben nur die bemalten Laternen der Cliquen. Dieser Moment heisst Morgestraich, und ehrlich gesagt: Wer den einmal erlebt hat, stellt im nächsten Jahr den Wecker wieder auf halb vier, ganz sicher. Ein Hinweis, der jedes Jahr für Ärger sorgt: Kommen Sie bitte nicht mit dem Au  llama \u003cb\u003eMorgestraich\u003c/b\u003e, dura tres días y la UNESCO la reconoce como patrimonio inmaterial.\u003cbr/\u003e\u003cbr/\u003eEl suizo escrito es alemán estándar, pero su vocabulario tiene sus propias piezas: \u003cb\u003edas Velo\u003c/b\u003e (la bici, no «das Fahrrad»), \u003cb\u003edas Znüni\u003c/b\u003e (el bocadillo de media mañana, literalmente «a las nueve»), \u003cb\u003edas Zmittag\u003c/b\u003e (la comida). En el examen aparecen igual que los austriacismos: con asterisco y nota al pie.\u003cbr/\u003e\u003cbr/\u003eEstrategia del Hören que se entrena aquí: \u003cb\u003elee las preguntas ANTES del audio\u003c/b\u003e. En los Teile 2 y 3 del examen real solo hay \u003cb\u003euna escucha\u003c/b\u003e; los 60 segundos de lectura previa no son cortesía, son parte de la tarea.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 en formato real: un texto largo, UNA sola pasada y CINCO tareas seguidas (esta y las cuatro siguientes). Lee las cinco preguntas antes de darle al play y responde sin volver atrás.\",\"audio\":\"$17\",\"question\":\"Wann beginnt die Basler Fasnacht?\",\"options\":[\"Am Montag um vier Uhr morgens\",\"Am Mittwoch um Mitternacht\",\"Am Montag um vier Uhr nachmittags\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"La medianoche del audio es la hora en que se corta el centro al tráfico, no el comienzo\",\"El audio dice «vier Uhr morgens», y además insiste: el despertador a las tres y media\"],\"itemIds\":[\"b1m7fefasnacht\",\"b1m7femorgestraich\"],\"tip\":\"El Teil 2 dura casi tres minutos y trae cinco tareas EN EL ORDEN del texto. Por eso se leen todas antes: si te quedas pensando en la primera, la segunda ya ha pasado. El reproductor te deja repetir; el examen, no.\"},{\"id\":\"b1m7l7e2\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 2 de 5. Mismo texto largo, misma pasada.\",\"audio\":\"$18\",\"question\":\"Was passiert am Vormittag?\",\"options\":[\"Es gibt ein Znüni und die Guggenmusik spielt\",\"Alle gehen nach Hause und schlafen\",\"Die Laternen werden angezündet\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Nadie se va a dormir: a las cinco se cena sopa y por la mañana sigue la fiesta\",\"Los faroles ya están encendidos desde las cuatro\"],\"itemIds\":[\"b1m7feznueni\",\"b1m7feguggenmusik\"],\"tip\":\"Guggenmusik: la charanga que toca desafinado A PROPÓSITO. Si lo sabes, la palabra deja de ser ruido en el audio.\"},{\"id\":\"b1m7l7e12\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 3 de 5. La guía da tres medios de transporte: solo uno sale bien parado. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$19\",\"question\":\"Wie reist man am besten an?\",\"options\":[\"Mit dem Zug, weil er auch nachts fährt\",\"Mit dem Auto, weil es am Rand Parkplätze gibt\",\"Mit dem Velo, das man überall abstellen darf\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Los pocos aparcamientos del borde «sind längst besetzt», y el centro está cortado desde medianoche\",\"La bici llega hasta el casco antiguo, pero solo se puede dejar en los sitios marcados\"],\"itemIds\":[\"b1m7fevelo\",\"b1m7fefasnacht\"],\"tip\":\"Las tres opciones aparecen las tres en el audio: esa es la trampa del Teil 2. Lo que decide no es qué palabra oyes, sino qué se dice DE ella.\"},{\"id\":\"b1m7l7e13\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 4 de 5. Ojo a la frase que empieza por «Dass…». Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Was sagt die Stadtführerin über die Guggenmusik?\",\"options\":[\"Sie klingt mit Absicht falsch\",\"Die Musiker haben zu wenig geübt\",\"Sie spielt nur beim Morgestraich\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El audio lo descarta expresamente: «kein Versehen … sondern Absicht»\",\"Suena por las callejuelas a media mañana, no en el Morgestraich\"],\"itemIds\":[\"b1m7feguggenmusik\"],\"tip\":\"«kein Versehen, sondern Absicht»: la estructura «nicht/kein A, sondern B» es la que más ítems decide en el Hören. La información buena va SIEMPRE detrás del sondern.\"},{\"id\":\"b1m7l7e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 5 de 5 — la del final, que casi nadie oye ya con atención. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Was rät die Stadtführerin den Gästen?\",\"options\":[\"Warme Kleidung statt Kostüm\",\"Ein möglichst auffälliges Kostüm\",\"Räppli mitzubringen und zu werfen\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Justo al revés: quien va disfrazado «fällt unangenehm auf», porque solo se disfrazan las comparsas\",\"El confeti lo tiran únicamente los que desfilan, no el público\"],\"itemIds\":[\"b1m7fekostuem\",\"b1m7feverkleidet\"],\"tip\":\"Fíjate en la ortografía suiza del texto: heisst, regelmässig, ausschliesslich. En Suiza no existe la ß, y en el examen esos textos vienen con nota al pie. Truco de examen: las dos últimas tareas del Teil 2 salen del último tercio del audio — cuando ya crees que has terminado, quedan dos puntos.\"},{\"id\":\"b1m7l7e3\",\"type\":\"mc\",\"prompt\":\"Helvetismo\",\"question\":\"„Ich komme mit dem Velo.“ — ¿Cómo viene esa persona?\",\"options\":[\"En bici\",\"En coche\",\"Andando\"],\"answer\":0,\"whyWrong\":[null,\"El coche sería mit dem Auto\",\"Andando sería zu Fuß\"],\"itemIds\":[\"b1m7fevelo\"],\"tip\":\"das Velo viene del francés «vélo». Suiza tiene cuatro lenguas oficiales y su alemán se nota.\"},{\"id\":\"b1m7l7e4\",\"type\":\"match\",\"prompt\":\"Suizo ↔ alemán de Alemania\",\"pairs\":[{\"target\":\"das Velo\",\"source\":\"das Fahrrad (la bici)\"},{\"target\":\"das Znüni\",\"source\":\"der Snack am Vormittag (el tentempié)\"},{\"target\":\"die Fasnacht\",\"source\":\"der Karneval (el carnaval)\"},{\"target\":\"die Bundesfeier\",\"source\":\"der Nationalfeiertag (la fiesta nacional)\"}],\"itemIds\":[\"b1m7fevelo\",\"b1m7feznueni\",\"b1m7fefasnacht\",\"b1m7febundesfeier\"]},{\"id\":\"b1m7l7e5\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál oíste?\",\"book\":\"Hast du das gesehen?\",\"real\":\"Hesch du das gsee?\",\"translation\":\"¿Has visto eso?\",\"ask\":\"which\",\"itemIds\":[\"b1m7fefasnacht\"],\"tip\":\"El Schweizerdeutsch hablado no es el alemán escrito de Suiza: es otro dialecto. En el examen NO te van a poner dialecto — pero en Basilea sí lo oirás. Ojo al detalle: en Basilea es «hesch» (no «hasch», que es suabo, del sur de Alemania).\"},{\"id\":\"b1m7l7e6\",\"type\":\"cloze\",\"prompt\":\"Completa el dato de la fiesta nacional\",\"text\":\"Die Bundesfeier wird am ersten ___ gefeiert.\",\"answers\":[\"August\"],\"translation\":\"La fiesta nacional se celebra el uno de agosto.\",\"hints\":[\"Es el mes del verano suizo\",\"A-u-g-u-s-t\"],\"itemIds\":[\"b1m7febundesfeier\"]},{\"id\":\"b1m7l7e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Um vier Uhr macht die ganze Stadt das Licht aus.\",\"translation\":\"A las cuatro toda la ciudad apaga la luz.\",\"hints\":[\"Empieza por Um vier Uhr ...\",\"macht ... das Licht aus (verbo separable)\"],\"itemIds\":[\"b1m7femorgestraich\"]},{\"id\":\"b1m7l7e8\",\"type\":\"shadow\",\"prompt\":\"Sombrea el titular\",\"text\":\"Trotz der Kälte stehen tausende Menschen um vier Uhr auf der Straße.\",\"phonetic\":\"trots dea KEL-te SHTEE-en TAU-zen-de MEN-shen um fiia uua auf dea SHTRAA-se\",\"translation\":\"A pesar del frío hay miles de personas en la calle a las cuatro.\",\"reps\":2,\"itemIds\":[\"b1m7fetrotz\"]},{\"id\":\"b1m7l7e9\",\"type\":\"speak\",\"prompt\":\"Léelo en voz alta — la ü de Guggenmusik es corta\",\"text\":\"Die Guggenmusik spielt absichtlich falsch.\",\"phonetic\":\"di GU-guen-mu-siik shpiilt AP-zijt-lij falsh (absichtlich = a propósito)\",\"translation\":\"La charanga toca desafinada a propósito.\",\"itemIds\":[\"b1m7feguggenmusik\"]},{\"id\":\"b1m7l7e10\",\"type\":\"mc\",\"prompt\":\"Estrategia de examen\",\"question\":\"En el Hören Teil 3 solo hay UNA escucha. ¿Qué haces con los 60 segundos previos?\",\"options\":[\"Leer las siete afirmaciones y subrayar la palabra clave de cada una\",\"Repasar el vocabulario del módulo\",\"Cerrar los ojos y concentrarte\"],\"answer\":0,\"whyWrong\":[null,\"Ya es tarde para eso: el vocabulario se repasa antes del examen\",\"Concentrarse está bien, pero sin saber qué buscas escuchas a ciegas\"],\"itemIds\":[\"b1m7fefasnacht\"],\"tip\":\"Los Teile 2 y 3 son 12 de los 30 ítems del Hören: el 40 % de la nota se juega en una sola pasada.\"},{\"id\":\"b1m7l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"A las cuatro de la madrugada toda la ciudad apaga la luz\",\"answers\":[\"Um vier Uhr morgens macht die ganze Stadt das Licht aus\",\"Um vier Uhr morgens macht die ganze Stadt das Licht aus.\",\"Um vier Uhr macht die ganze Stadt das Licht aus\"],\"hints\":[\"Empieza por Um vier Uhr morgens → verbo en 2ª posición\",\"das Licht ausmachen: aus va al final\"],\"itemIds\":[\"b1m7femorgestraich\"],\"tip\":\"Empezar por un complemento de tiempo y mandar el verbo a la 2ª posición: la inversión ya es automática en ti. Ahora úsala para que el texto no empiece siempre por «Ich».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m7-3\",\"book\":\"Ich wünsche dir ein gutes neues Jahr!\",\"real\":\"Guten Rutsch!\",\"meaning\":\"¡Feliz año nuevo! (dicho ANTES de Nochevieja)\",\"when\":\"Del 27 de diciembre al 31, al despedirte de alguien a quien no verás hasta enero. El 1 de enero ya NO vale: entonces se dice «Frohes neues Jahr!». Confundirlos es el error clásico. Se lo puedes soltar al vecino y al jefe; en un mail formal, lo que se escribe es la frase entera de la fila de examen, no el «Guten Rutsch!» a secas.\",\"register\":\"neutral\",\"exam\":\"Ich wünsche Ihnen einen guten Rutsch ins neue Jahr!\",\"note\":\"Se suele explicar como «buen resbalón» hacia el año nuevo, aunque hay quien lo hace venir del yidis rosch, «comienzo». Es de las pocas fórmulas que cruzan registros: lo que cambia no es la palabra, es la frase que la envuelve.\",\"sound\":\"GUU-ten ruch\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m7fesilvester\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1c:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1c\",\"6\",{}]]\n"])</script></body></html>
