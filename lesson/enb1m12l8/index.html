u003e, dices de dónde eres, y respondes \u003cb\u003ehasta cinco preguntas\u003c/b\u003e repartidas en cinco bloques temáticos. Y aquí está el salto del A2: \u003cb\u003eya no basta con el dato\u003c/b\u003e. Las preguntas reales del Practice Paper son \u003ci\u003e«Why do you think so many people learn English?»\u003c/i\u003e o \u003ci\u003e«How can schools help students to keep fit and healthy?»\u003c/i\u003e — \u003cb\u003epiden opinión\u003c/b\u003e. Una respuesta de tres palabras es media respuesta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa fórmula: opinión + porque + ejemplo.\u003c/b\u003e \u003ci\u003ePersonally, I think… because… For instance, in my case…\u003c/i\u003e Tres piezas, quince segundos, y ya has dado \u003ci\u003eRange of grammar\u003c/i\u003e y \u003ci\u003eCoherence\u003c/i\u003e en la misma frase.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 2 — situaciones sociales (3 min).\u003c/b\u003e \u003cb\u003eAl menos dos.\u003c/b\u003e En una \u003cb\u003eresponde el candidato\u003c/b\u003e (\u003ci\u003e«I'm a teacher visiting your school. I start: Could you tell me where I can find the Director's office?»\u003c/i\u003e) y en otra \u003cb\u003eempieza el candidato\u003c/b\u003e (\u003ci\u003e«I'm a waiter in a café. You are not happy with the food. You start.»\u003c/i\u003e). Dos turnos cada una, más o menos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRegla que casi nadie dice: tú eres tú.\u003c/b\u003e Nunca haces de otro personaje. El que se disfraza es el interlocutor.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la trampa que se cobra justo aquí.\u003c/b\u003e Pedir información sin sonar brusco se hace con \u003cb\u003epregunta indirecta\u003c/b\u003e: \u003ci\u003eCould you tell me where the office is?\u003c/i\u003e, \u003ci\u003eDo you know where I could find…?\u003c/i\u003e Y en la pregunta indirecta \u003cb\u003eel inglés NO invierte\u003c/b\u003e: es \u003ci\u003ewhere the office IS\u003c/i\u003e, no \u003ci\u003ewhere is the office\u003c/i\u003e. El español sí invierte —«¿sabes dónde está la oficina?»—, y por eso este error sobrevive hasta niveles avanzados. Lo mismo con el «me» del español: \u003ci\u003eexplain me\u003c/i\u003e no existe. \u003cb\u003eExplain, say, describe, suggest, recommend, mention\u003c/b\u003e piden \u003cb\u003eto + persona\u003c/b\u003e; \u003ci\u003etell, give, show, send\u003c/i\u003e no."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l8\",\"phaseId\":\"enb1m12\",\"title\":\"Speaking: parts 1 and 2\",\"subtitle\":\"Tu apellido letra a letra, cinco preguntas que piden opinión, y dos situaciones — en una empiezas tú\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de los seis primeros minutos\",\"itemIds\":[\"enb1m12mysurnameis\",\"enb1m12personallyithink\",\"enb1m12doyouknowwhere\",\"enb1m12couldwemakeitlater\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Doce minutos, cuatro partes, tres minutos cada una\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l8e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de las dos primeras partes del oral\",\"pairs\":[{\"target\":\"My surname is Soto: S-O-T-O.\",\"source\":\"Mi apellido es Soto: ese-o-te-o.\"},{\"target\":\"Personally, I think schools should do more.\",\"source\":\"Personalmente, creo que los colegios deberían hacer más.\"},{\"target\":\"Do you know where I could find a chemist?\",\"source\":\"¿Sabe dónde podría encontrar una farmacia?\"},{\"target\":\"Could we make it a bit later?\",\"source\":\"¿Podríamos dejarlo un poco más tarde?\"}],\"itemIds\":[\"enb1m12mysurnameis\",\"enb1m12personallyithink\",\"enb1m12doyouknowwhere\",\"enb1m12couldwemakeitlater\"],\"tip\":\"Las cuatro son fórmulas, no frases: se dicen enteras y sin montarlas. En un examen de doce minutos, cada bloque que sale automático es tiempo que le dedicas a pensar el contenido.\"},{\"id\":\"enb1m12l8e2\",\"type\":\"speak\",\"prompt\":\"Parte 1: deletrea tu apellido en voz alta, como el primer minuto del examen\",\"text\":\"My surname is Soto: S-O-T-O. I'm from Colombia, but I live in London.\",\"phonetic\":\"mai SÉE-neim is̬ SÓU-tou: es-óu-tíi-óu. aim from ko-LÓM-bia, bat ai liv in LÁN-don\",\"translation\":\"Mi apellido es Soto: ese-o-te-o. Soy de Colombia, pero vivo en Londres.\",\"itemIds\":[\"enb1m12mysurnameis\",\"ensurname\",\"enhowdoyouspellit\"],\"tip\":\"Deletrea DESPACIO y agrupa: si tu apellido lleva dos letras iguales seguidas, en inglés se dice «double»: Beckett = B-E-C-K-E-double-T. Y practica el tuyo, no el de Valeria — es lo primero que vas a decir en el examen.\"},{\"id\":\"enb1m12l8e3\",\"type\":\"mc\",\"prompt\":\"Qué ha cambiado desde tu A2\",\"question\":\"El examinador pregunta: «Why do you think so many people learn English?» ¿Qué contestas?\",\"options\":[\"Una opinión con motivo y ejemplo, en tres o cuatro frases.\",\"«Because it is an international language.» y esperas la siguiente.\",\"«I don't know, I have never thought about it.»\"],\"answer\":0,\"whyWrong\":[null,\"Es correcto y es media respuesta: un dato sin desarrollo. En A2 valía; en B1 el descriptor pide «presentar las ideas como una secuencia de puntos».\",\"Eso deja tres minutos con un silencio dentro. Si de verdad no se te ocurre nada, se pide tiempo en inglés, no se cierra la puerta.\"],\"itemIds\":[\"enb1m12personallyithink\"],\"tip\":\"La fórmula de bolsillo: \u003cb\u003eopinión + because + ejemplo\u003c/b\u003e. «Personally, I think… because… For instance, in my case…» Con eso cualquier pregunta de la Parte 1 se contesta en quince segundos bien gastados.\"},{\"id\":\"enb1m12l8e4\",\"type\":\"speak\",\"prompt\":\"Parte 1: di tu opinión con la fórmula entera, en voz alta\",\"text\":\"Personally, I think schools should do more, because for instance in my case nobody taught me how to study.\",\"phonetic\":\"PÉE-so-na-li, ai zink skuuls̬ shud du moo, bi-KÓS̬ fo INS-tans in mai kéis NÓU-ba-di tóot mi jau tu STÁ-di\",\"translation\":\"Personalmente, creo que los colegios deberían hacer más porque, por ejemplo, en mi caso nadie me enseñó a estudiar.\",\"itemIds\":[\"enb1m12personallyithink\",\"enb1m1forinstance\"],\"tip\":\"Fíjate en el ritmo: THINK, SCHOOLS, MORE y CASE llevan el golpe; «should», «for» y «in» pasan de puntillas. El inglés es de ritmo acentual y el español, silábico: ahí está la mitad de tu acento y buena parte del criterio de fonología.\"},{\"id\":\"enb1m12l8e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta indirecta\",\"wrong\":\"Do you know where can I find a chemist?\",\"answers\":[\"Do you know where I can find a chemist?\"],\"why\":\"En cuanto la pregunta va \u003cb\u003edentro de otra\u003c/b\u003e, el inglés deja de invertir: el orden vuelve a ser \u003cb\u003esujeto + verbo\u003c/b\u003e. \u003ci\u003eWhere is the office?\u003c/i\u003e pero \u003ci\u003eCould you tell me where the office IS?\u003c/i\u003e El español sí invierte —«¿sabes dónde está la oficina?»— y por eso este error aguanta hasta niveles avanzados: Coe lo documenta incluso en aprendices avanzados. Y ojo, tampoco lleva «do»: \u003ci\u003eDo you know where do I find…?\u003c/i\u003e es el mismo fallo con otra pieza.\",\"translation\":\"¿Sabe dónde puedo encontrar una farmacia?\",\"itemIds\":[\"enb1m12doyouknowwhere\",\"enb1m3couldyoutellme\"]},{\"id\":\"enb1m12l8e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «me» que en inglés no cabe ahí\",\"wrong\":\"Could you explain me the task?\",\"answers\":[\"Could you explain the task to me?\"],\"why\":\"El español pega un dativo a cualquier verbo de decir: \u003ci\u003eexplícame\u003c/i\u003e, \u003ci\u003edime\u003c/i\u003e, \u003ci\u003esugiéreme\u003c/i\u003e. El inglés reparte en \u003cb\u003edos listas cerradas y cortas\u003c/b\u003e. Con \u003cb\u003eto + persona\u003c/b\u003e: explain, say, describe, suggest, recommend, mention. Con \u003cb\u003edoble objeto directo\u003c/b\u003e: tell, give, show, send, buy, offer. Por eso \u003ci\u003etell me the task\u003c/i\u003e es perfecto y \u003ci\u003eexplain me the task\u003c/i\u003e no existe.\",\"translation\":\"¿Me puedes explicar la tarea?\"},{\"id\":\"enb1m12l8e7\",\"type\":\"transform\",\"prompt\":\"Sube el registro: pásalo a pregunta indirecta\",\"source\":\"Where is the ticket office?\",\"instruction\":\"Pídelo con «Could you tell me…»\",\"answers\":[\"Could you tell me where the ticket office is?\",\"Could you tell me where the ticket office is\"],\"translation\":\"¿Podría decirme dónde está la taquilla?\",\"hints\":[\"Detrás de «where» ya no se invierte\",\"Could you tell me where the ticket office ___?\"],\"itemIds\":[\"enb1m3couldyoutellme\"],\"tip\":\"Esta transformación es media Parte 2 del oral. Preguntar directo no está mal, pero envolverlo en «Could you tell me…» sube el registro y le da al examinador una subordinada entera que puntuar en Range of grammar.\"},{\"id\":\"enb1m12l8e8\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: el examinador te pregunta. Dos escuchas.\",\"audio\":\"Right, thank you. Now, a few questions about free time. How do you think people's free time has changed since your parents were young?\",\"question\":\"¿Qué te está pidiendo exactamente?\",\"options\":[\"Que compares dos épocas y des tu opinión.\",\"Que cuentes qué haces tú los fines de semana.\",\"Que hables de tus padres y de su trabajo.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso sería una pregunta de A2. Aquí el «how has it changed» pide contraste, no rutina.\",\"Tus padres son el punto de referencia temporal, no el tema. Si te vas a hablar de ellos, te sales de la tarea.\"],\"itemIds\":[\"enb1m12personallyithink\"],\"tip\":\"Escucha el verbo de la pregunta: «think», «changed», «compare», «why» son señales de que quieren opinión y desarrollo. «What», «when», «where» piden dato — y esas ya casi no salen en B1.\"},{\"id\":\"enb1m12l8e9\",\"type\":\"shadow\",\"prompt\":\"Parte 2: sombrea el arranque de la situación en la que EMPIEZAS tú\",\"text\":\"Excuse me, I'm sorry to bother you, but could we make it a bit later?\",\"phonetic\":\"iks-KIÚUS̬ mi, aim SÓ-ri tu BÓ-da yu, bat kud ui méik it a bit LÉI-ta\",\"translation\":\"Perdona, siento molestarte, pero ¿podríamos dejarlo un poco más tarde?\",\"reps\":2,\"itemIds\":[\"enb1m12couldwemakeitlater\",\"ena2m7imsorrytobotheryou\",\"enexcuseme\"],\"tip\":\"El esqueleto de cualquier situación en la que empiezas tú: \u003cb\u003ellamada de atención + disculpa + petición con «could»\u003c/b\u003e. Tres piezas, y sirven para el camarero, para la cola de la tienda y para el amigo que llega tarde.\"},{\"id\":\"enb1m12l8e10\",\"type\":\"mc\",\"prompt\":\"La regla de la Parte 2 que casi nadie cuenta\",\"question\":\"El interlocutor dice: «I'm a waiter in a café. You are not happy with the food. You start.» ¿Quién eres tú?\",\"options\":[\"Tú mismo, quejándote de la comida.\",\"Un cliente inventado con otro nombre y otra historia.\",\"Otro camarero del mismo café.\"],\"answer\":0,\"whyWrong\":[null,\"El candidato nunca hace de otro personaje. El que se disfraza es el interlocutor: tú siempre eres tú.\",\"Los papeles los reparte la consigna, y ahí solo hay un camarero: él.\"],\"itemIds\":[\"enb1m12couldwemakeitlater\"],\"tip\":\"Es una buena noticia: no tienes que inventarte una vida. Y también un aviso — «You start» significa que el silencio inicial es tuyo, así que ten preparadas las tres piezas de arriba para no perder diez segundos.\"},{\"id\":\"enb1m12l8e11\",\"type\":\"bucket\",\"prompt\":\"Clasifica las situaciones de la Parte 2: ¿respondes tú o empiezas tú?\",\"categories\":[\"Empieza el interlocutor: tú respondes\",\"Empiezas tú\"],\"items\":[{\"text\":\"I'm a tourist in your town. I start: Excuse me, is there a chemist nearby?\",\"bucket\":0},{\"text\":\"I'm a waiter in a café. You are not happy with the food. You start.\",\"bucket\":1},{\"text\":\"I'm a passenger on your train. I start: I've got a lot of heavy luggage.\",\"bucket\":0},{\"text\":\"I'm your friend. I've been waiting for you for twenty minutes. You start.\",\"bucket\":1},{\"text\":\"I'm a teacher visiting your school. I start: Where is the Director's office?\",\"bucket\":0},{\"text\":\"You're behind me in a queue and you're in a hurry. You start.\",\"bucket\":1}],\"tip\":\"Las seis son literales del Practice Paper oficial. Fíjate en el patrón: cuando empiezas tú, siempre hay un problema —una queja, una espera, una prisa—. Es decir, siempre necesitas la misma plantilla de disculpa + petición.\"},{\"id\":\"enb1m12l8e12\",\"type\":\"paraphrase\",\"prompt\":\"Pide tiempo — sin «think» y sin «let»\",\"source\":\"Let me think.\",\"forbid\":[\"think\",\"let\"],\"answers\":[\"Hang on a moment\",\"Give me a second\",\"That's a good question — I'll need a moment\"],\"translation\":\"Déjame pensar.\",\"hints\":[\"Hay una fórmula muy británica que empieza por «Hang…»\",\"Hang on a m___\"],\"itemIds\":[\"enletmethink\"],\"tip\":\"Tener tres maneras de pedir tiempo es una póliza de seguros: si se te atasca una, sale otra y el silencio no llega a la grabación. Y el silencio sí llega: la fluidez es uno de los cuatro criterios del oral.\"},{\"id\":\"enb1m12l8e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Podría decirme dónde puedo encontrar la sala del examen?\",\"answers\":[\"Could you tell me where I can find the exam room?\",\"Could you tell me where the exam room is?\",\"Do you know where I can find the exam room?\"],\"hints\":[\"Pregunta indirecta: detrás de «where» no se invierte\",\"Could you tell me where I ___ ___ the exam room?\"],\"itemIds\":[\"enb1m12doyouknowwhere\",\"enb1m3couldyoutellme\"],\"tip\":\"Si te ha salido «where can I find» a la primera, no pasa nada: te ha salido el español. Dila tres veces bien en voz alta ahora — la inversión no se arregla entendiéndola, se arregla repitiéndola.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m12-2\",\"book\":\"I mean…\",\"real\":\"Well, what I mean is…\",\"meaning\":\"Bueno, lo que quiero decir es…\",\"when\":\"Cuando has empezado una frase y se te ha torcido. Sirve en las cuatro partes del oral y también en la vida: es la manera inglesa de \u003cb\u003eautocorregirse sin disculparse\u003c/b\u003e. Lo que NO se hace es parar, decir «sorry, sorry» y empezar de cero: eso son tres segundos de grabación tirados y el examinador solo oye el titubeo.\",\"register\":\"neutral\",\"exam\":\"Or rather… What I meant to say is…\",\"note\":\"El descriptor oficial del B1 asume que vas a titubear: «pausing for grammatical and lexical planning and repair is very evident». O sea, que reparar sobre la marcha ES el nivel — pero hay que reparar EN INGLÉS. «Well, what I mean is…» te compra dos segundos y suena a hablante, no a examinando.\",\"sound\":\"uel, uot ai miin is̬\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m12natwhatimeanis\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favico
