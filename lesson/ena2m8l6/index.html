\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T78e,"])</script><script>self.__next_f.push([1,"Aquí hay una sorpresa, y conviene decirla de frente: \u003cb\u003een este módulo no vas a aprender «should»\u003c/b\u003e. No es un olvido. «Should» es material de B1 en el programa oficial, y el A2 da el consejo con otras herramientas — las mismas que usa un nativo la mayor parte del tiempo. Al B1 llegarás con «should» aprendido en dos minutos; lo que no se aprende en dos minutos es esto:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Why don't you…?\u003c/b\u003e — la reina. Parece una pregunta y es un consejo: [[Why don't you go home?|¿Por qué no te vas a casa?]] · \u003ci\u003eWhy don't you phone the surgery?\u003c/i\u003e\u003cbr/\u003eDetrás va el \u003cb\u003everbo desnudo\u003c/b\u003e, sin to: \u003ci\u003eWhy don't you \u003cb\u003erest\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003eY el orden es el de cualquier pregunta con auxiliar: \u003cb\u003eWhy + don't + you + verbo\u003c/b\u003e. El calco \u003ci\u003eWhy you don't go home?\u003c/i\u003e es el mismo fallo de siempre —la pregunta española se hace con entonación y la inglesa con auxiliar—, y aquí duele el doble porque la frase es de las que más vas a decir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Why not…?\u003c/b\u003e — la versión corta, sin sujeto y con el verbo desnudo: [[Why not take a day off?|¿Por qué no te coges un día libre?]] Se usa igual, es más rápida y no lleva \u003ci\u003eto\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. El imperativo.\u003c/b\u003e En el módulo 5 aprendiste que pedir con imperativo suena mandón. \u003cb\u003eAconsejar con imperativo, no.\u003c/b\u003e Es la diferencia entre pedir algo para ti («Give me a coffee») y ofrecer algo para el otro: [[Go to bed and rest.|Vete a la cama y descansa.]] · [[Drink lots of water.|Bebe mucha agua.]] · \u003ci\u003eTake an aspirin.\u003c/i\u003e Nadie se ofende: el imperativo del consejo es un regalo, no una orden.\u003cbr/\u003eY en negativo, con \u003cb\u003edon't\u003c/b\u003e: [[Don't go to work today.|Hoy no vayas a trabajar.]]\u003cbr/\u003e\u003cbr/\u003eUn aviso pequeño y útil: el imperativo del consejo funciona \u003cb\u003eentre iguales y de arriba abajo\u003c/b\u003e (amigos, familia, el médico contigo). Si le hablas a un desconocido o a alguien mayor, envuélvelo: \u003ci\u003eWhy don't you…?\u003c/i\u003e siempre vale."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l6\",\"phaseId\":\"ena2m8\",\"title\":\"Why don't you go home?\",\"subtitle\":\"Aconsejar sin «should»: la pregunta que en realidad es un consejo\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que le dices a quien está malo\",\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8whynottakeadayoff\",\"ena2m8gotobedandrest\",\"ena2m8dontgotoworktoday\",\"ena2m8drinklotsofwater\",\"endontworry\",\"ena2m8whatsthematter\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El consejo del A2 se da preguntando\",\"body\":\"$17\",\"table\":[[\"fórmula\",\"ejemplo\",\"detrás va…\"],[\"Why don't you…?\",\"Why don't you go home?\",\"verbo desnudo, sin to\"],[\"Why not…?\",\"Why not take a day off?\",\"verbo desnudo, sin sujeto\"],[\"imperativo\",\"Go to bed and rest.\",\"el verbo, y ya\"],[\"imperativo negativo\",\"Don't go to work today.\",\"Don't + verbo\"],[\"lo que NO\",\"Why you don't go home?\",\"falta el auxiliar don't delante\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l6e1\",\"type\":\"mc\",\"prompt\":\"Tu compañera de piso tiene fiebre y se va a trabajar\",\"question\":\"¿Qué le dices?\",\"options\":[\"Why don't you stay at home?\",\"Why you don't stay at home?\",\"Why not to .\",\"instruction\":\"Dilo con «Why don't you…?»\",\"answers\":[\"Why don't you go home and rest?\"],\"translation\":\"¿Por qué no te vas a casa y descansas?\",\"hints\":[\"Why + don't + you + el verbo desnudo\",\"Why don't you g… home and rest?\"],\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8gotobedandrest\"],\"tip\":\"Las dos versiones son correctas y dicen lo mismo. La envuelta vale con cualquiera; la pelada, con gente de confianza.\"},{\"id\":\"ena2m8l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa el consejo\",\"text\":\"You look terrible. Why ___ you take a day off?\",\"answers\":[\"don't\"],\"translation\":\"Tienes muy mala cara. ¿Por qué no te coges un día libre?\",\"hints\":[\"El auxiliar va entre Why y you\",\"d…\"],\"itemIds\":[\"ena2m8whynottakeadayoff\",\"ena2m1terrible\"]},{\"id\":\"ena2m8l6e6\",\"type\":\"build\",\"prompt\":\"Construye el consejo en negativo\",\"target\":\"Don't go to work today\",\"translation\":\"Hoy no vayas a trabajar\",\"distractors\":[\"not\",\"you\"],\"itemIds\":[\"ena2m8dontgotoworktoday\",\"engotowork\"],\"tip\":\"El imperativo negativo es siempre Don't + verbo, para tú y para usted, para uno y para muchos. Una forma y se acabó.\"},{\"id\":\"ena2m8l6e7\",\"type\":\"match\",\"prompt\":\"Empareja el problema con el consejo\",\"pairs\":[{\"target\":\"Why don't you go home?\",\"source\":\"Tiene fiebre y sigue en la oficina.\"},{\"target\":\"Drink lots of water.\",\"source\":\"Le duele la cabeza y no ha bebido nada.\"},{\"target\":\"Don't go to work today.\",\"source\":\"Se pasó la noche tosiendo.\"},{\"target\":\"Go to bed and rest.\",\"source\":\"No ha dormido en dos días.\"}],\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8drinklotsofwater\",\"ena2m8dontgotoworktoday\",\"ena2m8gotobedandrest\",\"ena2m2ididntsleep\"]},{\"id\":\"ena2m8l6e8\",\"type\":\"listen\",\"prompt\":\"Dictado — el consejo entero\",\"text\":\"Why don't you go home and drink lots of water?\",\"translation\":\"¿Por qué no te vas a casa y bebes mucha agua?\",\"hints\":[\"Empieza por Why d…\",\"…go home and drink lots of water?\"],\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8drinklotsofwater\",\"enwater\"],\"tip\":\"Al hablar, «don't you» se funde y suena «dóunchu». Si esperas oír las dos palabras separadas, no las vas a oír nunca.\"},{\"id\":\"ena2m8l6e9\",\"type\":\"write\",\"prompt\":\"Contéstale a Amy — 30-50 palabras\",\"scenario\":\"Amy te escribe: lleva tres días con tos y fiebre y sigue yendo al hospital a trabajar. Contéstale con dos consejos y pregúntale cómo se encuentra.\",\"bullets\":[\"Dile que sientes que esté mala\",\"Dale un consejo con «Why don't you…?»\",\"Dale otro con «You need to…»\",\"Pregúntale cómo se encuentra\"],\"checks\":[{\"re\":\"sorry to hear|poor you|that's terrible\",\"label\":\"decir que lo sientes\"},{\"re\":\"why don't you|why not\",\"label\":\"un consejo con Why don't you…?\"},{\"re\":\"you need to\",\"label\":\"un consejo con You need to…\"},{\"re\":\"how are you feeling|how do you feel\",\"label\":\"preguntar cómo se encuentra\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"direct\",\"requireConnectors\":{\"min\":2,\"bank\":[\"and\",\"but\",\"because\",\"so\"]},\"model\":\"Hi Amy, I'm sorry to hear you're ill. Why don't you stay at home tomorrow? You need to see a doctor, because three days with a temperature is a long time. And please, no more night shifts! How are you feeling now? Valeria\",\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8youneedtoseeadoctor\",\"ena2m8howareyoufeeling\",\"ena2m8ihaveatemperature\"],\"tip\":\"Cuenta cuántos consejos has dado y cómo has envuelto cada uno. Si los dos empiezan igual, cambia uno: el examen premia la variedad de fórmulas, no la cantidad de palabras.\"},{\"id\":\"ena2m8l6e10\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"¿Por qué no te vas a la cama? Hoy no vayas a trabajar.\",\"answers\":[\"Why don't you go to bed? Don't go to work today.\",\"Why don't you go
