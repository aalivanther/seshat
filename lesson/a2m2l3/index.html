\"La regla detrás: para sein y haben no se usa el Perfekt — se usa war y hatte\",\"body\":\"Del A1 ya traes chunks como «Gestern war ich zu Hause» y «Ich hatte keine Zeit». Aquí está el sistema completo. Y el dato de examen: «Ich bin gewesen» (he estado) existe, y en el sur de Alemania y en Austria se oye muchísimo — allí el pasado simple casi ha desaparecido del habla (el llamado Präteritumschwund). Pero en el alemán estándar — y en el Goethe — para \u003cb\u003esein\u003c/b\u003e y \u003cb\u003ehaben\u003c/b\u003e lo esperado es el pasado simple, más corto: \u003ci\u003eIch \u003cb\u003ewar\u003c/b\u003e in Berlin. Ich \u003cb\u003ewar\u003c/b\u003e müde. Wir \u003cb\u003ehatten\u003c/b\u003e Hunger.\u003c/i\u003e Fíjate en el patrón: ich y er/sie/es comparten forma (war / hatte — sin terminación, como los modales), y el resto suena a lo que ya conoces: du war\u003cb\u003est\u003c/b\u003e como du bi\u003cb\u003est\u003c/b\u003e, wir war\u003cb\u003een\u003c/b\u003e como wir sind... mismo esqueleto, otro tiempo.\",\"table\":[[\"\",\"sein → war\",\"haben → hatte\"],[\"ich\",\"war\",\"hatte\"],[\"du\",\"warst\",\"hattest\"],[\"er/sie/es\",\"war\",\"hatte\"],[\"wir\",\"waren\",\"hatten\"],[\"ihr\",\"wart\",\"hattet\"],[\"sie/Sie\",\"waren\",\"hatten\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m2l3e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el significado\",\"question\":\"„Ich war müde“\",\"options\":[\"Estoy cansado\",\"Estaba cansado\",\"Estaré cansado\"],\"answer\":1,\"whyWrong\":[\"Eso sería «Ich bin müde» — presente\",null,\"El futuro con presente sería «Morgen bin ich müde»\"],\"itemIds\":[\"a2m2ichwarmuede\",\"muede\"],\"tip\":\"war = pasado de sein. Una letra de diferencia con «wir» — el oído lo afina esta lección.\"},{\"id\":\"a2m2l3e2\",\"type\":\"cloze\",\"prompt\":\"Completa con haben en pasado\",\"text\":\"Wir ___ Hunger.\",\"answers\":[\"hatten\"],\"translation\":\"Teníamos hambre.\",\"hints\":[\"haben en pasado, forma de wir\",\"hatte + n\"],\"itemIds\":[\"a2m2wirhattenhunger\",\"a2m2hunger\"]},{\"id\":\"a2m2l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa con sein en pasado\",\"text\":\"Ich ___ gestern sehr müde.\",\"answers\":[\"war\"],\"translation\":\"Ayer estaba muy cansado/a.\",\"hints\":[\"sein en pasado, forma de ich\",\"Tres letras: w-a-r\"],\"itemIds\":[\"a2m2ichwarmuede\",\"gestern\",\"muede\"]},{\"id\":\"a2m2l3e4\",\"type\":\"mc\",\"prompt\":\"El dato de examen\",\"question\":\"«Estuve en Berlín» — ¿cómo lo dice un alemán en una conversación real?\",\"options\":[\"Ich bin in Berlin gewesen\",\"Ich war in Berlin\"],\"answer\":1,\"whyWrong\":[\"Existe, y en el sur de Alemania y Austria se oye mucho — pero en el estándar (y en el Goethe) «war» es más corto y es lo esperado: Ich war in Berlin\",null],\"itemIds\":[\"wirwaren\"],\"tip\":\"Regla de oro A2: acción → Perfekt (bin gefahren) · estado con sein/haben → war/hatte. «Bin gewesen» y «habe gehabt» existen — pero evítalos en el examen: war/hatte siempre suena bien.\"},{\"id\":\"a2m2l3e5\",\"type\":\"match\",\"prompt\":\"Empareja la forma con su persona\",\"pairs\":[{\"target\":\"ich war\",\"source\":\"yo estaba\"},{\"target\":\"du warst\",\"source\":\"tú estabas\"},{\"target\":\"wir waren\",\"source\":\"nosotros estábamos\"},{\"target\":\"ihr wart\",\"source\":\"vosotros estabais\"}],\"itemIds\":[\"a2m2ichwarmuede\",\"wowarstdu\",\"wirwaren\"]},{\"id\":\"a2m2l3e6\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta simpática\",\"text\":\"___ du Spaß?\",\"answers\":[\"Hattest\"],\"translation\":\"¿Te divertiste?\",\"hints\":[\"haben en pasado, forma de du\",\"hatte + st, con mayúscula inicial\"],\"itemIds\":[\"a2m2hattestduspass\",\"a2m2spass\"],\"tip\":\"Literal: «¿tenías diversión?». Spaß haben = divertirse — el alemán TIENE la diversión, no «se divierte».\"},{\"id\":\"a2m2l3e7\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe la pregunta\",\"text\":\"Wie war dein Urlaub?\",\"translation\":\"¿Qué tal fueron tus vacaciones?\",\"hints\":[\"Empieza con Wie...\",\"war — la w suena v\"],\"itemIds\":[\"a2m2wiewardeinurlaub\",\"urlaub\"]},{\"id\":\"a2m2l3e8\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del lunes\",\"target\":\"Wie war dein Urlaub?\",\"translation\":\"¿Qué tal fueron tus vacaciones?\",\"distractors\":[\"bist\",\"gewesen\"],\"itemIds\":[\"a2m2wiewardeinurlaub\",\"urlaub\"],\"tip\":\"Sin «bist gewesen»: war lo resuelve en tres palabras. La pregunta estrella de cada lunes alemán.\"},{\"id\":\"a2m2l3e10\",\"type\":\"transform\",\"prompt\":\"Transforma: del presente al pasado directo\",\"source\":\"Ich bin müde.\",\"instruction\":\"Ponla en pasado con war\",\"answers\":[\"Ich war müde\",\"Ich war müde.\"],\"translation\":\"Estaba cansado/a.\",\"hints\":[\"sein en pasado no usa Perfekt\",\"bin → war, el resto no se toca\"],\"itemIds\":[\"a2m2ichwarmuede\",\"muede\"],\"tip\":\"Cambias una sola pieza: bin → war. Nada de «bin müde gewesen» — así habla el alemán real.\"},{\"id\":\"a2m2l3e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Teníamos hambre y estábamos cansados\",\"answers\":[\"Wir hatten Hunger und wir waren müde\",\"Wir hatten Hunger und waren müde\"],\"hints\":[\"hatten para el hambre, waren para el cansancio\",\"Wir hatten ... und (wir) waren ...\"],\"itemIds\":[\"a2m2wirhattenhunger\",\"a2m2hunger\",\"muede\"],\"tip\":\"hatte para lo que tenías, war para cómo estabas — el dúo que cuenta cualquier estado del pasado.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — war/hatte (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Las unidades A2 de Präteritum de sein y haben — con audio nativo para afinar war/waren.\"},{\"label\":\"Slow German — Erzählungen\",\"url\":\"https://slowgerman.com/\",\"note\":\"Historias lentas en pasado: cuenta cuántos war y hatte oyes por minuto — verás que gewesen casi no existe.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\
