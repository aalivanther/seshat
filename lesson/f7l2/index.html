n\",\"welchegroesse\",\"zuteuer\",\"kaufen\",\"mantel\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: anprobieren se parte en dos, y «zu» = demasiado\",\"body\":\"\u003cb\u003eanprobieren\u003c/b\u003e es separable, como aufstehen y einkaufen: la partícula \u003cb\u003ean\u003c/b\u003e se va AL FINAL — Ich probiere die Jacke \u003cb\u003ean\u003c/b\u003e. Con un modal, el verbo entero (con partícula pegada) cierra la pinza: Kann ich das \u003cb\u003eanprobieren\u003c/b\u003e? Y el truco de regateo: \u003cb\u003ezu\u003c/b\u003e + adjetivo = demasiado — \u003cb\u003ezu teuer\u003c/b\u003e (demasiado caro), zu groß, zu klein. «Das ist mir zu teuer» (con ese \u003cb\u003emir\u003c/b\u003e) = «eso me resulta demasiado caro».\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"f7l2e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de compras\",\"pairs\":[{\"target\":\"das Geschäft\",\"source\":\"la tienda\"},{\"target\":\"die Größe\",\"source\":\"la talla\"},{\"target\":\"der Mantel\",\"source\":\"el abrigo\"},{\"target\":\"kaufen\",\"source\":\"comprar\"}],\"itemIds\":[\"geschaeft\",\"groesse\",\"mantel\",\"kaufen\"]},{\"id\":\"f7l2e2\",\"type\":\"mc\",\"prompt\":\"Reconoce el chunk de precio\",\"question\":\"„Das ist mir zu teuer“\",\"options\":[\"Eso es muy bonito\",\"Eso me resulta demasiado caro\",\"Eso cuesta poco\"],\"answer\":1,\"whyWrong\":[\"Eso sería «Das ist sehr schön»\",null,\"Eso sería «Das ist billig» — justo lo contrario\"],\"itemIds\":[\"zuteuer\",\"teuer\"],\"tip\":\"zu + adjetivo = demasiado. sehr teuer = muy caro (aún puedes pagarlo); zu teuer = demasiado caro (no lo compras).\"},{\"id\":\"f7l2e3\",\"type\":\"mc\",\"prompt\":\"¿Dónde va el «an» de anprobieren?\",\"question\":\"«Me pruebo la chaqueta» →\",\"options\":[\"Ich anprobiere die Jacke\",\"Ich probiere die Jacke an\",\"Ich probiere an die Jacke\"],\"answer\":1,\"whyWrong\":[\"anprobieren es separable: el an se despega y se va al final\",null,\"La partícula va AL FINAL de la frase, no en medio\"],\"itemIds\":[\"anprobieren\"],\"tip\":\"Como aufstehen y einkaufen: Ich stehe auf · Ich kaufe ein · Ich probiere ... an.\"},{\"id\":\"f7l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta del vendedor\",\"text\":\"Welche ___ haben Sie? — M, bitte.\",\"answers\":[\"Größe\"],\"translation\":\"¿Qué talla tiene usted? — M, por favor.\",\"hints\":[\"die G-r-ö-ß-e — con mayúscula y con ö\",\"Gr-ö-ß-e\"],\"itemIds\":[\"welchegroesse\",\"groesse\"]},{\"id\":\"f7l2e5\",\"type\":\"cloze\",\"prompt\":\"Completa con la pinza\",\"text\":\"Kann ich das Kleid ___?\",\"answers\":[\"anprobieren\"],\"translation\":\"¿Puedo probarme el vestido?\",\"hints\":[\"Con kann, el verbo entero cierra la frase\",\"an + probieren, todo junto al final\"],\"itemIds\":[\"kannichanprobieren\",\"anprobieren\",\"kleid\"],\"tip\":\"Con modal, anprobieren NO se separa: kann ... anprobieren. Solo se parte cuando es el verbo conjugado.\"},{\"id\":\"f7l2e6\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del probador\",\"target\":\"Kann ich die Hose anprobieren?\",\"translation\":\"¿Puedo probarme el pantalón?\",\"distractors\":[\"probiere\",\"an\"],\"itemIds\":[\"kannichanprobieren\",\"hose\"],\"tip\":\"kann abre, anprobieren (entero) cierra. Las fichas «probiere» y «an» sueltas son la trampa.\"},{\"id\":\"f7l2e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Das Geschäft ist groß\",\"translation\":\"La tienda es grande\",\"hints\":[\"Geschäft lleva ä y suena «guesheft»\",\"groß con ß\"],\"itemIds\":[\"geschaeft\",\"gross\"]},{\"id\":\"f7l2e8\",\"type\":\"cloze\",\"prompt\":\"Completa el contraste de precios\",\"text\":\"Der Mantel ist ___, aber die Jacke ist billig. (caro)\",\"answers\":[\"teuer\",\"zu teuer\",\"sehr teuer\"],\"translation\":\"El abrigo es caro, pero la chaqueta es barata.\",\"hints\":[\"Lo contrario de billig\",\"t-e-u-e-r — eu suena «oi»\"],\"itemIds\":[\"mantel\",\"teuer\",\"billig\"]},{\"id\":\"f7l2e9\",\"type\":\"type\",\"prompt\":\"Traduce la pregunta del vendedor\",\"question\":\"¿Qué talla tiene usted?\",\"answers\":[\"Welche Größe haben Sie?\",\"Welche Größe haben Sie\"],\"hints\":[\"Welche + sustantivo + haben Sie\",\"Größe con ö y ß\"],\"itemIds\":[\"welchegroesse\",\"groesse\"]},{\"id\":\"f7l2e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quiero comprar un abrigo, pero es demasiado caro\",\"answers\":[\"Ich will einen Mantel kaufen, aber er ist zu teuer\",\"Ich möchte einen Mantel kaufen, aber er ist zu teuer\",\"Ich will einen Mantel kaufen, aber der Mantel ist zu teuer\"],\"hints\":[\"will + kaufen al final (Satzklammer), coma antes de aber\",\"der Mantel → einen Mantel; «es» = er (masculino)\"],\"itemIds\":[\"kaufen\",\"mantel\",\"zuteuer\"],\"tip\":\"Coma SIEMPRE antes de aber. Y der Mantel se retoma con er, no con es.\"}]}],\"resources\":[{\"label\":\"Goethe — Fotogeschichte «Einkaufen»\",\"url\":\"https://www.goethe.de/prj/mwd/de/deu/fot.html\",\"note\":\"Fotohistoria del Goethe sobre ir de compras: verás Größe y anprobieren en contexto real.\"},{\"label\":\"Easy German — compras en la calle\",\"url\":\"https://www.youtube.com/@EasyGerman\",\"note\":\"Busca «shopping» o «Kleidung kaufen»: diálogos reales de tienda con subtítulos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuadern
