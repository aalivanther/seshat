],\"LessonPlayer\"]\n10:C\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena1m4l9\",\"phaseId\":\"ena1m4\",\"title\":\"Leer y escribir: my day\",\"subtitle\":\"La nota semanal de Amy, tu día en 20-30 palabras — y espiral de m2-m3\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tres piezas para contar tu día\",\"itemIds\":[\"enearly\",\"enroutine\",\"enfromninetofive\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La nota de Amy — léela como en el examen\",\"body\":\"\u003ci\u003eAmy pega una nota en la nevera del piso. Léela dos veces: primero la idea, luego el dato.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eValeria — my week:\u003c/b\u003e\u003cbr/\u003eMonday to Friday: work \u003cb\u003efrom nine to five\u003c/b\u003e.\u003cbr/\u003eTuesday and Thursday: English class at half past six.\u003cbr/\u003eSaturday: café with you at eleven!\u003cbr/\u003eSunday: I call Mum at seven.\u003cbr/\u003e\u003cbr/\u003eLa [[routine|rutina]] de Amy cabe en cuatro líneas. Las preguntas del examen cruzan SIEMPRE el DÍA con la HORA: lee el encabezado del día, no solo el número que brilla. Después escribirás la tuya — con las armas del módulo: get up at, from … to …, on + día.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m4l9e1\",\"type\":\"mc\",\"prompt\":\"Lee la nota de Amy\",\"question\":\"¿Qué días tiene Amy clase de inglés?\",\"options\":[\"Martes y jueves\",\"De lunes a viernes\",\"El sábado\"],\"answer\":0,\"whyWrong\":[null,\"Monday to Friday es su horario de TRABAJO, no de clase\",\"El sábado es el café con Valeria\"],\"itemIds\":[\"enmontowed\",\"enthufri\"],\"tip\":\"Dos líneas mencionan días: gana la que dice English class. El encabezado manda.\"},{\"id\":\"ena1m4l9e2\",\"type\":\"mc\",\"prompt\":\"La misma nota — cruza día y hora\",\"question\":\"¿Cuándo llama Amy a su madre?\",\"options\":[\"El domingo a las siete\",\"El sábado a las once\",\"El martes a las seis y media\"],\"answer\":0,\"whyWrong\":[null,\"Las once del sábado son el café con Valeria\",\"half past six es la clase de inglés\"],\"itemIds\":[\"enweekend\",\"enmother\"],\"tip\":\"Tres horas brillan en la nota y solo una va con call Mum: el cruce día+hora es EL formato del examen.\"},{\"id\":\"ena1m4l9e3\",\"type\":\"cloze\",\"prompt\":\"Completa el horario de Amy\",\"text\":\"Amy works from nine ___ five.\",\"answers\":[\"to\"],\"translation\":\"Amy trabaja de nueve a cinco.\",\"hints\":[\"de … a … = from … ___ …\",\"from nine t-o five\"],\"itemIds\":[\"enfromninetofive\",\"enheworks\"],\"tip\":\"from … to …: el molde de todos los horarios — del trabajo, de la escuela y del café de Sam.\"},{\"id\":\"ena1m4l9e4\",\"type\":\"order\",\"prompt\":\"Ordena la respuesta de Valeria (su nota en la nevera)\",\"sentences\":[\"Thanks, Amy!\",\"My routine: I get up early and study English every day.\",\"Café on Saturday at eleven — yes!\",\"See you on Sunday!\"],\"translation\":\"¡Gracias, Amy! Mi rutina: me levanto temprano y estudio inglés todos los días. El café del sábado a las once — ¡sí! ¡Nos vemos el domingo!\",\"hints\":[\"Primero se agradece la nota\",\"gracias → rutina → plan del sábado → despedida\"],\"itemIds\":[\"enroutine\",\"enearly\",\"eneveryday\",\"enseeyou\"],\"tip\":\"Este es el esqueleto de tu write: gracias/arranque, tu rutina, un plan. Quédate el orden.\"},{\"id\":\"ena1m4l9e5\",\"type\":\"cloze\",\"prompt\":\"Espiral módulo 2: el posesivo del dueño\",\"text\":\"This is Valeria. ___ brother is Andrés. (su, de ELLA)\",\"answers\":[\"Her\"],\"translation\":\"Esta es Valeria. Su hermano es Andrés.\",\"hints\":[\"La dueña es ella\",\"H-e-r\"],\"itemIds\":[\"enher\",\"enbrother\"],\"tip\":\"his/her mira al DUEÑO, no a la cosa: el repaso del módulo 2 sigue vivo dentro de tu semana.\"},{\"id\":\"ena1m4l9e6\",\"type\":\"audiomc\",\"prompt\":\"Espiral módulo 3: la edad, al oído\",\"audio\":\"My sister is thirty. She gets up at six.\",\"question\":\"¿Cuántos años tiene la hermana?\",\"options\":[\"30\",\"13\",\"16\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"thirteen llevaría el golpe al FINAL — oíste ZÉE-ti\",\"sixteen no suena: six es la hora de levantarse\"],\"itemIds\":[\"ensister\",\"enthirteen30\",\"enshegetsup\"],\"tip\":\"El par 13/30 vuelve dentro de una rutina: el examen mezcla módulos exactamente así.\"},{\"id\":\"ena1m4l9e7\",\"type\":\"transform\",\"prompt\":\"Vacuna espiral: la edad va con BE\",\"source\":\"My father has 60 years.\",\"instruction\":\"Corrige el calco — la edad se ES\",\"answers\":[\"My father is 60 years old.\",\"My father is 60.\",\"My father is sixty years old.\",\"My father is sixty.\",\"My father is 60 years old\",\"My father is sixty years old\"],\"translation\":\"Mi padre tiene 60 años.\",\"hints\":[\"Fuera el has\",\"My father is ...\"],\"itemIds\":[\"enfather\",\"enyearsold\",\"ensixteen60\"],\"tip\":\"La vacuna del módulo 3 con la familia del módulo 2: si te sale aquí, te sale en el examen.\"},{\"id\":\"ena1m4l9e8\",\"type\":\"match\",\"prompt\":\"Espiral: las cuatro preguntas que ya dominas\",\"pairs\":[{\"target\":\"How old are you?\",\"source\":\"¿Cuántos años tienes?\"},{\"target\":\"Where are you from?\",\"source\":\"¿De dónde eres?\"},{\"target\":\"What time is it?\",\"source\":\"¿Qué hora es?\"},{\"target\":\"What's your phone number?\",\"source\":\"¿Cuál es tu número de teléfono?\"}],\"itemIds\":[\"enhowold\",\"enwhereareyoufrom\",\"enwhattimeisit\",\"enwhatsyourphone\"]},{\"id\":\"ena1m4l9e10\",\"type\":\"read\",\"prompt\":\"Lee el mensaje de Ben y responde — no hace falta entender cada palabra\",\"title\":\"Ben's week\",\"source\":\"Mensaje de Ben en el grupo del piso\",\"text\":\"Hi! You always ask me about my [[job|trabajo]], so here is my week.\u003cbr/\u003e\u003cbr/\u003eI'm a bus [[driver|conductor]]. I get up at half past four — yes, half past FOUR! I have breakfast at five and I start work at six. I finish at two in the afternoon, so I never have lunch at work: I have it at home, in front of the TV.\u003cbr/\u003e\u003cbr/\u003eFrom Monday to Friday I drive the number 24 bus. On Saturday I usually go to the [[football|fútbol]] with my dad.\u003cbr/\u003e\u003cbr/\u003eAnd on Sunday? On Sunday I do nothing. Nothing at all!\",\"questions\":[{\"id\":\"ena1m4l9e10q1\",\"q\":\"¿A qué hora empieza a trabajar Ben?\",\"options\":[\"A las seis\",\"A las cuatro y media\",\"A las cinco\"],\"answer\":0,\"why\":\"«I start work at six». Las cuatro y media es cuando se levanta; las cinco, el desayuno.\"},{\"id\":\"ena1m4l9e10q2\",\"q\":\"¿Por qué se levanta Ben tan temprano?\",\"options\":[\"Porque su turno empieza a las seis de la mañana\",\"Porque desayuna dos veces\",\"Porque el domingo no hace nada\"],\"answer\":0,\"inference\":true,\"why\":\"Ben no da la razón: encadena las horas (4:30 levantarse, 5:00 desayuno, 6:00 trabajo) y la conclusión la sacas tú.\"},{\"id\":\"ena1m4l9e10q3\",\"q\":\"¿Con quién va Ben al fútbol?\",\"options\":[\"Con su padre\",\"Con Valeria\",\"Con Amy\"],\"answer\":0,\"why\":\"«On Saturday I usually go to the football with my dad».\"},{\"id\":\"ena1m4l9e10q4\",\"q\":\"«On Sunday I do nothing. Nothing at all!» — ¿qué nos dice esa frase de Ben?\",\"options\":[\"Que el domingo lo dedica entero a descansar\",\"Que el domingo trabaja pocas horas\",\"Que el domingo su autobús no sale\"],\"answer\":0,\"inference\":true,\"why\":\"Repetir nothing y añadir at all es enfático: no es información, es cansancio. Eso se infiere del tono, no de un dato.\"}],\"itemIds\":[\"engetup\",\"enhavebreakfast\",\"enstartsat\",\"ennever\",\"enusually\",\"enmontowed\",\"enweekend\"],\"tip\":\"Un texto de rutina se lee siguiendo el reloj: subraya las horas al vuelo y las preguntas de detalle caen solas.\"},{\"id\":\"ena1m4l9e9\",\"type\":\"write\",\"prompt\":\"Tu writing del módulo: cuenta tu día\",\"scenario\":\"Amy te escribe: «Tell me about your day in London!». Respóndele contando tu rutina (real o inventada) — una sola misión: INFORMAR.\",\"bullets\":[\"A qué hora te levantas (I get up at…)\",\"Tu desayuno o su hora (breakfast)\",\"Tu trabajo o tu estudio (work / study)\",\"A qué hora te acuestas (I go to bed at…)\"],\"checks\":[{\"re\":\"get up at\",\"label\":\"tu hora de levantarte\"},{\"re\":\"breakfast\",\"label\":\"tu desayuno\"},{\"re\":\"(work|study)\",\"label\":\"tu trabajo o estudio\"},{\"re\":\"go to bed at\",\"label\":\"tu hora de dormir\"}],\"minWords\":20,\"maxWords\":30,\"model\":\"I get up at seven and have breakfast at eight. I work from nine to five. After work I study English. I usually go to bed at eleven.\",\"itemIds\":[\"enigetupatseven\",\"enhavebreakfast\",\"enfromninetofive\",\"engotobed\"],\"tip\":\"Una función (informar), 20-30 palabras y el contador vivo: tu rutina ya es un texto de examen. My day — hecho.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\"
