d\":\"b1m8l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3 en formato real: una conversación entera, UNA sola pasada y SIETE afirmaciones en alemán que marcas Richtig o Falsch. Léelas todas antes (60 segundos en el examen) y luego dale al play una vez. Afirmación 1 de 7.\",\"audio\":\"$18\",\"question\":\"Frau Ortega ruft an, weil ihre Bestellung nicht angekommen ist.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"El paquete llegó el martes: lo que pasa es que la mercancía viene rota. «Doch, angekommen ist alles»\",null],\"itemIds\":[\"b1m8gebestellung\",\"b1m8geware\",\"paket\"],\"tip\":\"La afirmación 1 es la trampa clásica: media frase coincide con el audio (hay un problema con el pedido) y la otra media, no. En el Teil 3 se marca Falsch en cuanto UNA parte no cuadra.\"},{\"id\":\"b1m8l7e2\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 2 de 7. Misma conversación, misma pasada.\",\"audio\":\"$19\",\"question\":\"Ohne die Fotos kann der Mitarbeiter die Beschwerde nicht weiterbearbeiten.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Lo dice claramente: «ohne die Fotos kommen wir keinen Schritt weiter». La afirmación lo repite con otras palabras, que es justo lo que hace el examen\"],\"itemIds\":[\"b1m8geinbearbeitung\",\"b1m8gebeschwerde\"],\"tip\":\"«Wir kommen keinen Schritt weiter» → «kann nicht weiterbearbeiten». La afirmación NUNCA repite las palabras del audio: reconocer la paráfrasis es la única habilidad que se mide aquí.\"},{\"id\":\"b1m8l7e12\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 3 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Der Kundenservice bietet ihr zuerst einen Gutschein an.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ich könnte Ihnen allerdings sofort einen Gutschein über fünfzig Euro anbieten» — el vale es la primera oferta, antes de hablar de dinero\"],\"itemIds\":[\"b1m8gegutschein\",\"b1m8gekundenservice\"],\"tip\":\"El vale siempre se ofrece primero: le sale más barato a la empresa. Saber el guion de la llamada te adelanta media respuesta.\"},{\"id\":\"b1m8l7e13\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 4 de 7. Ojo: aquí hay que oír quién quiere qué. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Frau Ortega ist mit dem Gutschein einverstanden.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Ella lo rechaza con educación: «Ehrlich gesagt hätte ich lieber mein Geld zurück»\",null],\"itemIds\":[\"b1m8gegutschein\",\"b1m8geerstatten\"],\"tip\":\"«Ehrlich gesagt…» anuncia casi siempre un NO cortés. Es la señal que te ahorra procesar la frase entera.\"},{\"id\":\"b1m8l7e14\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 5 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1c\",\"question\":\"Die Rücksendung muss Frau Ortega selbst bezahlen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Nein, auf keinen Fall»: la etiqueta de devolución se la mandan ellos por correo\",null],\"itemIds\":[\"b1m8gezurueckschicken\",\"b1m8geware\"],\"tip\":\"Una pregunta con «Auf meine Kosten?» y una respuesta con «Nein, auf keinen Fall». En una sola pasada, la negación va tan rápido que quien traduce mentalmente se queda con la pregunta y marca Richtig.\"},{\"id\":\"b1m8l7e15\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 6 de 7. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1d\",\"question\":\"Das Geld wird erst überwiesen, wenn die Ware wieder beim Händler ist.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Sobald die Ware bei uns eingetroffen ist, dauert es noch zwei bis drei Werktage»: primero llega la máquina, después el dinero\"],\"itemIds\":[\"b1m8geueberweisen\",\"b1m8gebetrag\"],\"tip\":\"«sobald» = en cuanto. Marca el orden de dos hechos, y el Teil 3 pregunta por el orden más que por los datos sueltos.\"},{\"id\":\"b1m8l7e16\",\"type\":\"audiomc\",\"prompt\":\"Afirmación 7 de 7 — la última, cuando ya has bajado la guardia. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1e\",\"question\":\"Der Mitarbeiter rechnet mit Schwierigkeiten bei der Erstattung.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Dice justo lo contrario: «machen Sie sich keine Sorgen: Bei einem gebrochenen Glas hat das noch nie Probleme gegeben»\",null],\"itemIds\":[\"b1m8geerstatten\",\"b1m8gekundenservice\"],\"tip\":\"Las dos últimas afirmaciones salen del final del audio, cuando la conversación ya suena a despedida. Es donde más puntos se pierden: no dejes de escuchar hasta que se cuelgue.\"},{\"id\":\"b1m8l7e3\",\"type\":\"mc\",\"prompt\":\"Lo que de verdad significa\",\"question\":\"„Ihre Beschwerde ist in Bearbeitung.“\",\"options\":[\"Su reclamación está en tramitación (aún no hay decisión)\",\"Su reclamación ha sido aceptada\",\"Su reclamación ha sido rechazada\"],\"answer\":0,\"whyWrong\":[null,\"Aceptada sería «Ihrer Beschwerde wurde stattgegeben»\",\"Rechazada sería «abgelehnt»\"],\"itemIds\":[\"b1m8geinbearbeitung\",\"b1m8gebeschwerde\"],\"tip\":\"«in Bearbeitung» es la frase-comodín de toda administración alemana. Significa exactamente: todavía nada.\"},{\"id\":\"b1m8l7e4\",\"type\":\"match\",\"prompt\":\"Empareja la fórmula con su momento de la llamada\",\"pairs\":[{\"target\":\"Es geht um meine Bestellung.\",\"source\":\"explicar de qué va la llamada\"},{\"target\":\"Können Sie mir Ihre Bestellnummer nennen?\",\"source\":\"lo que pregunta el operador\"},{\"target\":\"Die Ware ist beschädigt angekommen.\",\"source\":\"describir el problema\"},{\"target\":\"Ich möchte lieber den Betrag erstattet bekommen.\",\"source\":\"rechazar el vale y pedir el dinero\"}],\"itemIds\":[\"b1m8gebestellnummer\",\"b1m8geerstatten\",\"b1m8gebetrag\"]},{\"id\":\"b1m8l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa la petición de la clienta\",\"text\":\"Ich hätte lieber den ___ erstattet als einen Gutschein.\",\"answers\":[\"Betrag\"],\"translation\":\"Preferiría que me reembolsaran el importe antes que un vale.\",\"hints\":[\"El importe en dinero\",\"der B-e-t-r-a-g → acusativo den B-e-t-r-a-g\"],\"itemIds\":[\"b1m8gebetrag\",\"b1m8gegutschein\"]},{\"id\":\"b1m8l7e6\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál oíste?\",\"book\":\"Haben Sie einen Moment Zeit?\",\"real\":\"Ham Sie 'n Moment Zeit?\",\"translation\":\"¿Tiene un momento?\",\"ask\":\"which\",\"itemIds\":[\"b1m8gekundenservice\"],\"tip\":\"«haben» → «ham» y «einen» → «'n» en habla rápida, incluso en registro de usted. El teléfono no se pronuncia como el libro.\"},{\"id\":\"b1m8l7e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Können Sie mir bitte Ihre Bestellnummer nennen?\",\"translation\":\"¿Puede darme su número de pedido, por favor?\",\"hints\":[\"Können Sie mir bitte ...\",\"Ihre Bestellnummer nennen\"],\"itemIds\":[\"b1m8gebestellnummer\"]},{\"id\":\"b1m8l7e8\",\"type\":\"shadow\",\"prompt\":\"Sombrea la apertura de la llamada\",\"text\":\"Guten Tag, es geht um meine Bestellung von letzter Woche.\",\"phonetic\":\"GUU-ten taak, es guet um MAI-ne be-SHTE-lung fon LETS-ta VO-je\",\"translation\":\"Buenos días, llamo por mi pedido de la semana pasada.\",\"reps\":2,\"itemIds\":[\"b1m8gebestellung\"],\"tip\":\"«Es geht um …» = «se trata de…». Es la fórmula que abre el 90 % de las llamadas alemanas. Que salga sin pensar.\"},{\"id\":\"b1m8l7e9\",\"type\":\"speak\",\"prompt\":\"Léelo en voz alta — la ü de zurück es corta y cerrada\",\"text\":\"Ich möchte die Ware zurückschicken und den Betrag erstattet bekommen.\",\"phonetic\":\"ij MÖJ-te di VAA-re tsu-RÜK-shi-ken unt deen be-TRAAK ea-SHTA-tet be-KO-men\",\"translation\":\"Quiero devolver la mercancía y que me reembolsen el importe.\",\"itemIds\":[\"b1m8gezurueckschicken\",\"b1m8geerstatten\",\"b1m8gebetrag\"]},{\"id\":\"b1m8l7e10\",\"type\":\"mc\",\"prompt\":\"Estrategi
