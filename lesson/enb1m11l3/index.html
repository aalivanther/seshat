t allowed\u003c/b\u003e.\u003c/i\u003e · \u003ci\u003eResidents \u003cb\u003emust\u003c/b\u003e keep the entry clear.\u003c/i\u003e\u003cbr/\u003eSin sujeto humano, en presente y sin rodeos. Es el inglés de [[the regulations|la normativa]], y es el que tienes que \u003cb\u003ereconocer\u003c/b\u003e, no producir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Entre vosotros, hablando — con persona y con suavidad:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eYou're \u003cb\u003enot meant to\u003c/b\u003e leave bags in the hallway.\u003c/i\u003e · \u003ci\u003eYou're not \u003cb\u003esupposed to\u003c/b\u003e park there.\u003c/i\u003e\u003cbr/\u003eEsta es la forma que de verdad se oye, y la que casi ningún manual enseña. \u003cb\u003e\u003ci\u003ebe meant to\u003c/i\u003e = «se supone que no se hace»\u003c/b\u003e: no acusa a nadie, describe la norma. Es infinitamente más educado que \u003ci\u003eyou can't\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. En tu carta al ayuntamiento — formal pero humano:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eI understand that residents \u003cb\u003eare not allowed to\u003c/b\u003e leave bags there.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la regla buena, la que sí se deduce y no hay que memorizar:\u003c/b\u003e\u003cbr/\u003e\u003cmark class=\"akk\"\u003eDetrás de una PREPOSICIÓN, siempre -ing.\u003c/mark\u003e Sin excepciones y sin listas:\u003cbr/\u003e· \u003ci\u003eThey put it up \u003cb\u003ewithout asking\u003c/b\u003e anybody.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eRead it \u003cb\u003ebefore signing\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eThere's no point \u003cb\u003ein complaining\u003c/b\u003e.\u003c/i\u003e (esta ya la traías del módulo 5)\u003cbr/\u003e· \u003ci\u003eHow about \u003cb\u003emeeting\u003c/b\u003e halfway?\u003c/i\u003e · \u003ci\u003eI'm used to \u003cb\u003eliving\u003c/b\u003e here.\u003c/i\u003e\u003cbr/\u003eSi delante hay \u003ci\u003ewithout, before, after, in, on, at, by, about, for\u003c/i\u003e, detrás va \u003ci\u003e-ing\u003c/i\u003e. Y sí: eso incluye el \u003cb\u003e\u003ci\u003eto\u003c/i\u003e que es preposición\u003c/b\u003e —\u003ci\u003elook forward \u003cb\u003eto hearing\u003c/b\u003e from you\u003c/i\u003e—, que es la única trampa de esta regla y ya la tienes vista en el módulo 5.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn falso amigo que cuesta dinero:\u003c/b\u003e \u003cb\u003e\u003ci\u003ea fine\u003c/i\u003e es una multa\u003c/b\u003e, no «bien». \u003ci\u003eThey gave her a fine\u003c/i\u003e — y ojo con el calco: en español «te ponen una multa»; en inglés \u003cb\u003ete la \u003ci\u003edan\u003c/i\u003e\u003c/b\u003e: \u003ci\u003egive somebody a fine\u003c/i\u003e, nunca «put somebody a fine»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l3\",\"phaseId\":\"enb1m11\",\"title\":\"You're not meant to\",\"subtitle\":\"Las normas del portal, las del ayuntamiento y las del cartel — y la única regla del módulo que sí se deduce\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cómo se dice una norma según quién la diga\",\"itemIds\":[\"enb1m11natnotmeantto\",\"enb1m11houserules\",\"enb1m11theregulations\",\"enb1m11notpermitted\",\"enb1m11gaveherafine\",\"enb1m11withoutasking\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tres registros para la misma norma, y una regla que no falla nunca\",\"body\":\"$17\",\"table\":[[\"Dónde lo lees u oyes\",\"Cómo se dice\",\"Registro\"],[\"En un cartel\",\"Parking is not permitted.\",\"reglamento\"],[\"En el portal, hablando\",\"You're not meant to park there.\",\"normal, entre vecinos\"],[\"En tu carta al ayuntamiento\",\"Residents are not allowed to park there.\",\"formal escrito\"],[\"Cuando ya es tarde\",\"They gave her a fine.\",\"el resultado\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas de la norma\",\"pairs\":[{\"target\":\"the house rules\",\"source\":\"las normas de la casa\"},{\"target\":\"the regulations\",\"source\":\"la normativa oficial\"},{\"target\":\"Parking is not permitted.\",\"source\":\"Prohibido aparcar.\"},{\"target\":\"They gave her a fine.\",\"source\":\"Le pusieron una multa.\"}],\"itemIds\":[\"enb1m11houserules\",\"enb1m11theregulations\",\"enb1m11notpermitted\",\"enb1m11gaveherafine\"],\"tip\":\"«Rules» son las de convivencia y las pone quien manda en la casa; «regulations» son las de papel y las pone una institución. Mrs Beckett tiene rules; el ayuntamiento tiene regulations.\"},{\"id\":\"enb1m11l3e2\",\"type\":\"mc\",\"prompt\":\"El registro, que es donde se pierde la banda\",\"question\":\"Se lo dices a tu vecino, en el rellano y sin querer ofenderle:\",\"options\":[\"You're not meant to leave bags there.\",\"Leaving bags there is not permitted.\",\"You mustn't leave bags there.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es lo que pone el cartel. Dicho a un vecino en la cara suena a que le estás leyendo el reglamento.\",\"«mustn't» en boca de un vecino suena a orden. Entre iguales, prohibir no es tu papel: describir la norma, sí.\"],\"itemIds\":[\"enb1m11natnotmeantto\",\"enb1m11notpermitted\",\"ena2m7youmustntsmoke\"],\"tip\":\"«You're not meant to» es la fórmula social del inglés británico para decir una norma sin señalar a nadie: la culpa la tiene la norma, no tú. Vale para el trabajo, para el portal y para casa ajena.\"},{\"id\":\"enb1m11l3e3\",\"type\":\"gapbank\",\"prompt\":\"Completa el aviso de la asociación de vecinos\",\"text\":\"They put the sign up without ___ anybody, so now there's no point in ___ about it. Before ___ the form, read the small print: you agree to pay for ___ the bike there.\",\"answers\":[\"asking\",\"complaining\",\"signing\",\"leaving\"],\"bank\":[\"asking\",\"complaining\",\"signing\",\"leaving\",\"hearing\",\"paying\",\"waiting\"],\"translation\":\"Pusieron el cartel sin preguntar a nadie, así que ya no sirve de nada quejarse. Antes de firmar el impreso, lee la letra pequeña: aceptas pagar por dejar ahí la bici.\",\"itemIds\":[\"enb1m11withoutasking\",\"enb1m5nopointin\",\"enb1m11geringroup\"],\"tip\":\"Cuatro huecos y una sola regla: delante de cada uno hay una preposición (without, in, before, for). Cuando la ves, no tienes que decidir nada — va -ing y ya está.\"},{\"id\":\"enb1m11l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Cambia UNA cosa.\",\"wrong\":\"They put it up without to ask anybody.\",\"answers\":[\"They put it up without asking anybody.\"],\"why\":\"Detrás de preposición va -ing, siempre. «Without to ask» no existe en inglés: el español dice «sin preguntar» con infinitivo y de ahí sale el calco.\",\"translation\":\"Lo pusieron sin preguntar a nadie.\",\"itemIds\":[\"enb1m11withoutasking\"]},{\"id\":\"enb1m11l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa el cartel del patio\",\"text\":\"Parking is not ___ between eight and six.\",\"answers\":[\"permitted\",\"allowed\"],\"translation\":\"Prohibido aparcar de ocho a seis.\",\"hints\":[\"Es el inglés del reglamento, no el de la calle\",\"Empieza por «per…» (o vale «allowed»)\"],\"itemIds\":[\"enb1m11notpermitted\",\"ena2m7smokingisntallowed\"],\"tip\":\"«Permitted» y «allowed» valen las dos en un cartel; «permitted» es un punto más oficial. Lo que no verás nunca en un cartel es «you can't»: los carteles ingleses evitan el «you».\"},{\"id\":\"enb1m11l3e6\",\"type\":\"build\",\"prompt\":\"Construye la frase que le dices a tu vecino\",\"target\":\"You're not meant to leave bags in the hallway\",\"translation\":\"No se pueden dejar bolsas en el portal\",\"distractors\":[\"mustn't\",\"permitted\"],\"itemIds\":[\"enb1m11natnotmeantto\"],\"tip\":\"Las dos fichas que sobran son los otros dos registros: una prohíbe y la otra es del cartel. Aquí estás hablando con una persona.\"},{\"id\":\"enb1m11l3e7\",\"type\":\"transform\",\"prompt\":\"Del cartel al rellano\",\"source\":\"Smoking is not permitted in the stairwell.\",\"instruction\":\"Dilo como se lo dirías a un vecino, con «meant to»\",\"answers\":[\"You're not meant to smoke in the stairwell\",\"You're not meant to smoke in the stairwell.\",\"You aren't meant to smoke in the stairwell\"],\"translation\":\"No se puede fumar en la escalera.\",\"hints\":[\"Empieza por «You're not meant…»\",\"You're not meant ... in the stairwell\"],\"itemIds\":[\"enb1m11natnotmeantto\",\"enb1m11notpermitted\"],\"tip\":\"Fíjate en lo que cambia: aparece un «you», desaparece la voz impersonal y el verbo pierde la -ing. La misma norma, otra persona diciéndola.\"},{\"id\":\"enb1m11l3e8\",\"type\":\"bucket\",\"prompt\":\"¿Esto se lee en un cartel, o se dice hablando?\",\"categories\":[\"Cartel o reglamento\",\"Hablando, entre vecinos\"],\"items\":[{\"text\":\"Residents must keep the entry clear at all times.\",\"bucket\":0},{\"text\":\"You're not meant to leave it there, you know.\",\"bucket\":1},{\"text\":\"Parking is not permitted.\",\"bucket\":0},{\"text\":\"I don't think we're supposed to do that.\",\"bucket\":1},{\"text\":\"Failure to comply may result in a fine.\",\"bucket\":0},{\"text\":\"They'll give you a fine if they catch you.\",\"bucket\":1}],\"itemIds\":[\"enb1m11notpermitted\",\"enb1m11natnotmeantto\",\"enb1m11gaveherafine\",\"enb1m11theentry\"],\"tip\":\"El inglés del cartel esconde a la persona (no hay «you» por ningún lado) y usa palabras largas de origen latino: permitted, residents, comply. El de la calle pone al «you» delante y usa verbos cortos. Reconocer los dos es media prueba de Reading.\"},{\"id\":\"enb1m11l3e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar las palabras prohibidas\",\"source\":\"Parking is not permitted here.\",\"forbid\":[\"parking\",\"permitted\"],\"answers\":[\"You can't leave your car here\",\"You aren't allowed to leave your car here\",\"You're not meant to leave your car here\"],\"translation\":\"Aquí no se puede aparcar.\",\"itemIds\":[\"enb1m11notpermitted\",\"enb1m11natnotmeantto\"],\"tip\":\"Reformular es LA habilidad del B1: cuando no te sale la palabra, das un rodeo y sigues hablando. En el oral eso no se penaliza, se premia — lo que se penaliza es callarse.\"},{\"id\":\"enb1m11l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Le pusieron una multa por dejar el coche ahí.\",\"answers\":[\"They gave her a fine for leaving the car there\",\"They gave her a fine for leaving her car there\",\"She got a fine for leaving the car there\"],\"hint\":\"Detrás de la preposición «for», ya sabes qué forma va\",\"itemIds\":[\"enb1m11gaveherafine\",\"enb1m11withoutasking\"],\"tip\":\"Dos trampas en una frase corta: la multa se DA («give somebody a fine»), y detrás de «for» va -ing. La segunda es regla; la primera es colocación y se aprende de memoria.\"},{\"id\":\"enb1m11l3e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué te está diciendo tu vecino?\",\"source\":\"You're not meant to put cardboard in that one.\",\"answers\":[\"En ese no se puede echar cartón\",\"En ese no va el cartón\",\"Se supone que en ese no se echa cartón\"],\"itemIds\":[\"enb1m11natnotmeantto\"],\"tip\":\"Ojo con traducirlo por «no debes»: eso suena a regañina y aquí no la hay. «You're not meant to» es informativo, casi amable — el que te lo dice te está haciendo un favor.\"},{\"id\":\"enb1m11l3e12\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? Una es la del manual y la otra es la que se dice\",\"book\":\"You are not supposed to leave bags in the hallway.\",\"real\":\"You're not meant to leave bags in the hallway.\",\"translation\":\"No se pueden dejar bolsas en el portal.\",\"itemIds\":[\"enb1m11natnotmeantto\"],\"tip\":\"«Supposed to» y «meant to» significan exactamente lo mismo, pero «meant to» es más británico y más corriente, y en habla rápida se come casi entero: «yoo not MEN-tu…». Si no la tienes fichada, no la oyes.\"},{\"id\":\"enb1m11l3e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Mr Patel y Valeria, en la puerta de la tienda. Dos escuchas.\",\"audio\":\"Are those yours?|The boxes? No. They were there when I opened up.|Somebody's not meant to leave them there, are they.|Nobody's meant to leave anything there. That's the point of the sign.|Have you rung the council?|I rang them in March. And in May. In March a man came out and took photographs, which was nice of him, and then nothing happened. In May a woman told me it wasn't their department.|So what happens now?|Now I move them myself before the warden comes, because if he sees them outside my shop, guess who gets the fine.\",\"question\":\"¿Por qué mueve Mr Patel las cajas él mismo?\",\"options\":[\"Porque la multa se la acabarían poniendo a él\",\"Porque el ayuntamiento le ha pedido que lo haga\",\"Porque son suyas y las había olvidado fuera\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El ayuntamiento no le ha pedido nada: uno vino a hacer fotos y otra le dijo que no era su departamento.\",\"Lo primero que dice es que no son suyas: ya estaban ahí al abrir.\"],\"itemIds\":[\"enb1m11gaveherafine\",\"enb1m11natnotmeantto\",\"enb1m11flytipping\"],\"tip\":\"«Guess who gets the fine» no dice la respuesta: la deja caer. En el Listening del examen, media pregunta de actitud se contesta con frases así, que dicen lo importante sin decirlo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m11-1\",\"book\":\"It is not allowed.\",\"real\":\"You're not meant to.\",\"meaning\":\"No se puede / se supone que no\",\"when\":\"Hablando, con cualquiera, y sobre todo cuando NO quieres sonar a autoridad: al vecino, al compañero de trabajo, al amigo que va a aparcar donde no debe. En un cartel o en un reglamento no aparece jamás. En el Writing formal y en el Spoken del examen, la versión de la derecha.\",\"register\":\"neutral\",\"exam\":\"It is not permitted.\",\"note\":\"«Meant to» le echa la culpa a la norma y no a la persona: por eso se puede decir sin que nadie se ofenda. Es la misma jugada que hace el británico con «I'm afraid» — poner un colchón delante del mensaje.\",\"sound\":\"yoo not MEN-tu\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m11natnotmeantto\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
