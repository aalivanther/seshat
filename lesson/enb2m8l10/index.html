cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué se falla:\u003c/b\u003e elegir la frase que se oye literal (las incorrectas copian léxico); no separar hecho y opinión cuando las dos voces usan los mismos datos; no oír la concesión (admittedly / fair enough) como actitud.\u003cbr/\u003e\u003cbr/\u003eEstrategia: lee las seis preguntas antes. Primera pasada: gist y bandos. Segunda: hecho/opinión y la concesión. Cuaderno para quién dice qué.\u003cbr/\u003e\u003cbr/\u003eHoy oyes a dos vecinos —una voz del ayuntamiento de barrio y Ben— discutir el carril. Seis preguntas. El audio no se muestra.\",\"table\":[[\"Preguntan\",\"Qué cazas\",\"Pista en el audio\"],[\"Gist\",\"de qué va la discusión\",\"la primera y la última frase\"],[\"Hecho / opinión\",\"se puede comprobar vs se moja alguien\",\"the paper said vs if you ask me\"],[\"Contraste\",\"whereas / by contrast / then again\",\"el giro\"],[\"Actitud\",\"concesión, enfado, duda\",\"admittedly, fair enough, I'm not against\"],[\"Causa-efecto\",\"consequently / hence / that's why\",\"la consecuencia nombrada\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia\",\"question\":\"En el Part 4 del B2, ¿qué pregunta es la que más cambia respecto al B1?\",\"options\":[\"Hecho frente a opinión: las dos voces pueden usar el mismo dato y mojarse distinto\",\"El número de preguntas, que sube a diez\",\"Que el audio se oye una sola vez\"],\"answer\":0,\"whyWrong\":[null,\"Siguen siendo seis.\",\"Todo el Listening se oye dos veces, también en B2.\"],\"itemIds\":[\"enb2m8factvsopinion\",\"enb1m4factoropinion\"],\"tip\":\"El gist ya lo entrenabas. El hecho/opinión es el que el B2 añade de verdad, y casa con evaluating different views.\"},{\"id\":\"enb2m8l10e2\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · la discusión entera. Lee las preguntas de abajo ANTES. Cuaderno: quién concede, quién cuenta un hecho. PRIMERA pregunta: gist.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"GIST. ¿De qué va principalmente la discusión?\",\"options\":[\"De si el carril bici puede hacerse sin tratar el autobús como si pudiera desaparecer\",\"De si Ben debería dejar de conducir\",\"De si Nora tiene que mudarse\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del trabajo de Ben no se discute el empleo: se discute el giro.\",\"Nora es un punto subsidiario, no el tema.\"],\"itemIds\":[\"enb2m4thegist\",\"enb2m8abikelane\",\"enb2m8asif\"],\"tip\":\"Gist: primera y última. «I'm not against bikes. I'm against a drawing…» y «neither drawing will do». Las incorrectas cogen un nombre propio y lo hinchan.\"},{\"id\":\"enb2m8l10e3\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · la misma discusión. HECHO frente a OPINIÓN. Segunda escucha si hace falta: el audio es el de e2.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"¿Cuál presenta Ben como HECHO, no como opinión?\",\"options\":[\"Que el aire en el semáforo es el peor del distrito, y que Nora no puede ir andando a la siguiente parada\",\"Que then again no es un horario\",\"Que el ayuntamiento quiere el carril para otoño\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es una réplica de actitud, no un hecho comprobable del tramo.\",\"Eso lo dice la otra voz, y Ben lo corrige: quieren una consulta en mayo, no el carril en otoño.\"],\"itemIds\":[\"enb2m8factvsopinion\",\"enb2m8admittedly\"],\"tip\":\"«That's a finding, not my mood» y «those are facts from the cab» son las marcas. El examen no siempre las dice tan claras; hoy sí, para que las oigas.\"},{\"id\":\"enb2m8l10e4\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · CONTRASTE. Mismo audio.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"¿Qué contraste marca Ben entre «querer el carril» y «querer una consulta»?\",\"options\":[\"Que no son lo mismo: una consulta en mayo no es un carril en otoño\",\"Que la consulta es un eslogan y el carril, un hecho\",\"Que otoño y mayo son la misma fecha\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ben no llama eslogan a la consulta; llama drawing al plano que ignora el bus.\",\"Justo al revés: that's not the same.\"],\"itemIds\":[\"enb2m8natthenagain\",\"enb1m4council\"],\"tip\":\"That's not the same as… es el contraste más barato y más de examen. Whereas no hace falta que se oiga para que la pregunta sea de contraste.\"},{\"id\":\"enb2m8l10e5\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · PROPÓSITO. Mismo audio.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"¿Cuál es el propósito de Ben al hablar?\",\"options\":[\"Conseguir un carril que deje parada y un sitio para que el 29 pase, no tumbar el carril\",\"Convencer a Nora de que ande más\",\"Anunciar que deja el trabajo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Nora es el ejemplo, no el destinatario de un ruego de andar.\",\"Del empleo no se habla.\"],\"itemIds\":[\"enb2m8abikelane\",\"enb2m8tosumup\"],\"tip\":\"El propósito está en consequently / the honest next step. Las incorrectas cogen un nombre (Nora) o un oficio (drive) y los hinchan.\"},{\"id\":\"enb2m8l10e6\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · ACTITUD. Mismo audio.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"¿Cuál es la actitud de Ben hacia las bicis y hacia el plano?\",\"options\":[\"No está contra las bicis; está contra un plano que trata el autobús como un coche\",\"Está contra las bicis y contra el ayuntamiento por igual\",\"Está a favor del plano si se hace en otoño\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"I'm not against bikes es la primera concesión. Igualar las dos es no oírla.\",\"Otoño es lo que dice la otra voz y él corrige.\"],\"itemIds\":[\"enb2m8admittedly\",\"enb2m8aconcession\"],\"tip\":\"I'm not against X. I'm against Y. Es la actitud de B2: concede el valor, discute el medio. El Part 4 la pregunta con esas palabras o sin ellas.\"},{\"id\":\"enb2m8l10e7\",\"type\":\"audiomc\",\"prompt\":\"Part 4 · CAUSA-EFECTO. Mismo audio. Sexta y última.\",\"notepad\":true,\"audio\":\"So the council want the lane in by autumn.|They want a consultation by May. That's not the same as wanting the lane.|I'm not against bikes. I'm against a drawing that treats the 29 as a car.|Admittedly the air at the lights is the worst in the ward. That's a finding, not my mood. Nevertheless I still have to turn at that corner, and Nora cannot walk to the next stop. Those are facts from the cab.|Then again, twelve spaces are not a climate plan either.|Then again is not a timetable. Thanks to the filters the buses are cleaner. Consequently, the honest next step is a lane that keeps a stop and a passing place. To sum up, neither drawing — theirs or the street as it is — will do.\",\"question\":\"Según Ben, ¿qué se sigue (consequently) de que los filtros ya hayan limpiado los buses?\",\"options\":[\"Que el siguiente paso honesto es un carril que deje parada y un sitio para adelantar, no castigar al 29 por ser grande\",\"Que ya no hace falta carril\",\"Que Nora debería coger un taxi\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Thanks to the filters we're cleaner no anula el carril: cambia el siguiente paso.\",\"Nora es el hecho subsidiario, no la consecuencia.\"],\"itemIds\":[\"enb2m8consequently\",\"enb2m8thanksto\",\"enb2m8natsoyeah\"],\"tip\":\"Consequently nombra la consecuencia. So, yeah la habría dado por sentada. El Part 4 pregunta la que se nombra. Seis preguntas, seis marks: el ensayo, escuchado.\"},{\"id\":\"enb2m8l10e8\",\"type\":\"type\",\"prompt\":\"La regla, en una frase\",\"question\":\"Seis preguntas sobre una discusión: gist, hecho u opinión, contraste, propósito, actitud, causa.\",\"answers\":[\"six questions on a discussion: gist, fact versus opinion, contrast, purpose, attitude, cause\",\"six MC questions on a two-speaker discussion\",\"Listening Part 4: six questions on a discussion\"],\"hints\":[\"El formato exacto\",\"six questions on a discussion: gist, fact versus opinion, ...\"],\"itemIds\":[\"enb2m4thegist\",\"enb2m8factvsopinion\"],\"tip\":\"Guárdatelo. Si llegas al papel escuchando como si fuera un monólogo, se te cae el quién dice qué, y el hecho/opinión se te va con él.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_nex
