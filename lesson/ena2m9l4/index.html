u003e· \u003ci\u003eIt's mine key\u003c/i\u003e ❌ — mine ya lleva dentro el sustantivo.\u003cbr/\u003e· \u003cb\u003e[[It's not mine, it's hers.|No es mío, es suyo.]]\u003c/b\u003e ✅ — nunca \u003ci\u003eit's her\u003c/i\u003e a secas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una cosa de ortografía que puntúa:\u003c/b\u003e ninguno lleva apóstrofo. \u003cb\u003ehers\u003c/b\u003e, \u003cb\u003eyours\u003c/b\u003e, \u003cb\u003eours\u003c/b\u003e, \u003cb\u003etheirs\u003c/b\u003e, \u003cb\u003eits\u003c/b\u003e. Ese \u003ci\u003eits\u003c/i\u003e sin apóstrofo es el posesivo («su»); \u003ci\u003eit's\u003c/i\u003e con apóstrofo es «it is». Se confunden hasta en carteles de tiendas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa pregunta:\u003c/b\u003e \u003cb\u003e[[Whose is this?|¿De quién es esto?]]\u003c/b\u003e · \u003cb\u003e[[Whose keys are these?|¿De quién son estas llaves?]]\u003c/b\u003e — el calco que hay que matar es \u003ci\u003eOf who…?\u003c/i\u003e, que no es inglés en ningún registro.\u003cbr/\u003e\u003cbr/\u003eY una construcción que parece rara y es utilísima: \u003cb\u003e[[a friend of mine|un amigo mío]]\u003c/b\u003e — nunca \u003ci\u003ea friend of me\u003c/i\u003e, ni \u003ci\u003ea my friend\u003c/i\u003e.18:T512,El español dice \u003cb\u003ecosa + de + dueño\u003c/b\u003e: «el piso \u003cu\u003ede Amy\u003c/u\u003e», «las llaves \u003cu\u003ede mi hermana\u003c/u\u003e». El inglés le da la vuelta: \u003cb\u003edueño + 's + cosa\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003ethe flat of Amy\u003c/i\u003e ❌ → \u003cb\u003e[[Amy's flat|el piso de Amy]]\u003c/b\u003e ✅\u003cbr/\u003e\u003ci\u003ethe keys of my sister\u003c/i\u003e ❌ → \u003cb\u003emy sister's keys\u003c/b\u003e ✅\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos tres casos, y no hay más:\u003c/b\u003e\u003cbr/\u003e1. Singular → \u003cb\u003e's\u003c/b\u003e: \u003ci\u003eBen's key\u003c/i\u003e, \u003ci\u003ethe landlord's number\u003c/i\u003e.\u003cbr/\u003e2. Plural que ya acaba en -s → \u003cb\u003esolo el apóstrofo\u003c/b\u003e: \u003ci\u003emy flatmates' room\u003c/i\u003e (la habitación de mis compañeros).\u003cbr/\u003e3. Plural irregular, sin -s → otra vez \u003cb\u003e's\u003c/b\u003e: \u003ci\u003ethe children's room\u003c/i\u003e, \u003ci\u003ethe people's flats\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y con las cosas?\u003c/b\u003e Ahí el inglés sí usa \u003ci\u003eof\u003c/i\u003e —\u003ci\u003ethe end of the street\u003c/i\u003e, \u003ci\u003ethe name of the street\u003c/i\u003e— aunque muchas veces prefiere pegar los dos sustantivos y ya está: \u003cb\u003ethe kitchen door\u003c/b\u003e, \u003cb\u003ethe front door key\u003c/b\u003e. La regla práctica: \u003cb\u003esi el dueño es una persona (o un animal, o un país), 's; si es una cosa, of o dos sustantivos juntos.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eY el aviso de oído para la lección siguiente: \u003ci\u003eAmy's flat\u003c/i\u003e y \u003ci\u003eAmy is late\u003c/i\u003e empiezan igual. La \u003cb\u003e's\u003c/b\u003e del genitivo suena exactamente como la \u003cb\u003e's\u003c/b\u003e de \u003ci\u003eis\u003c/i\u003e. Lo desambigua lo que viene detrás, no el oído."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l4\",\"phaseId\":\"ena2m9\",\"title\":\"Whose is this?\",\"subtitle\":\"Mío, tuyo, de Amy — y el genitivo que le da la vuelta a la frase\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La cocina por la mañana: de quién es cada cosa\",\"itemIds\":[\"ena2m9whoseisthis\",\"ena2m9possessivegroup\",\"ena2m9itsnotminesits\",\"ena2m9amysflat\",\"ena2m9whosekeysarethese\",\"ena2m9afriendofmine\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos familias de posesivos: una necesita sustantivo y la otra no\",\"body\":\"$17\",\"table\":[[\"con sustantivo detrás\",\"solo, sin sustantivo\",\"ejemplo\"],[\"my key\",\"mine\",\"It's mine.\"],[\"your room\",\"yours\",\"Which room is yours?\  mine — it's ___ bag. (Amy)\",\"answers\":[\"Amy's\"],\"translation\":\"El bolso azul no es mío: es el bolso de Amy.\",\"hints\":[\"El dueño va delante, con dos caracteres detrás\",\"Amy…\"],\"itemIds\":[\"ena2m9amysflat\",\"enblue\"]},{\"id\":\"ena2m9l4e8\",\"type\":\"transform\",\"prompt\":\"Dale la vuelta al genitivo\",\"source\":\"the room of my flatmate\",\"instruction\":\"Escríbelo como lo escribiría un inglés\",\"answers\":[\"my flatmate's room\"],\"translation\":\"la habitación de mi compañera de piso\",\"hints\":[\"Dueño delante, cosa detrás\",\"my flatmate… room\"],\"itemIds\":[\"ena2m9amysflat\",\"enflatmate\",\"enroom\"]},{\"id\":\"ena2m9l4e9\",\"type\":\"transform\",\"prompt\":\"Sustituye el grupo entero por un posesivo solo\",\"source\":\"This is my key and that one is your key.\",\"instruction\":\"Quita el segundo «key» sin perder el significado\",\"answers\":[\"This is my key and that one is yours.\",\"This is my key and that's yours.\"],\"translation\":\"Esta es mi llave y esa es la tuya.\",\"hints\":[\"your + key se comprimen en una sola palabra\",\"…and that one is y…\"],\"itemIds\":[\"ena2m9possessivegroup\",\"enthat\"],\"tip\":\"Para eso están: para no repetir el sustantivo. Es lo mismo que hace el español con «la tuya».\"},{\"id\":\"ena2m9l4e10\",\"type\":\"build\",\"prompt\":\"Construye la presentación\",\"target\":\"She is a friend of mine\",\"translation\":\"Es una amiga mía\",\"distractors\":[\"me\",\"my\"],\"itemIds\":[\"ena2m9afriendofmine\",\"enfriend\"],\"tip\":\"«a friend of me» y «a my friend» son las dos trampas. La fórmula fija es of + mine / yours / his / hers.\"},{\"id\":\"ena2m9l4e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"¿De quién es este abrigo? No es mío, creo que es de Ben.\",\"answers\":[\"Whose is this coat? It isn't mine, I think it's Ben's.\",\"Whose coat is this? It isn't mine, I think it's Ben's.\",\"Whose is this coat? It's not mine, I think it's Ben's.\"],\"hint\":\"la pregunta abre con una sola palabra, y el dueño del final lleva dos caracteres detrás\",\"itemIds\":[\"ena2m9whoseisthis\",\"ena2m9itsnotminesits\",\"ena2m9amysflat\",\"ena2m3acoat\"]},{\"id\":\"ena2m9l4e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la escena entera\",\"text\":\"Whose is this? It's not mine, it's Amy's.\",\"phonetic\":\"JUUS̬ is̬ dis. its not MÁIN, its ÉI-mis̬\",\"translation\":\"¿De quién es esto? No es mío, es de Amy.\",\"itemIds\":[\"ena2m9whoseisthis\",\"ena2m9itsnotminesits\",\"ena2m9amysflat\"],\"tip\":\"Las tres eses finales son /z/, no /s/: juus̬, máin (esta no lleva), ÉI-mis̬. Con la garganta vibrando.\"},{\"id\":\"ena2m9l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Estas llaves no son mías: son de mi compañera de piso.\",\"answers\":[\"These keys aren't mine, they're my flatmate's.\",\"These keys are not mine, they're my flatmate's.\",\"These keys aren't mine, they are my flatmate's.\"],\"hints\":[\"Posesivo solo + genitivo con 's\",\"These keys aren't m…, they're my flatmate…\"],\"itemIds\":[\"ena2m9possessivegroup\",\"ena2m9amysflat\",\"enflatmate\",\"ena2m2mykeys\"],\"tip\":\"Fíjate en el final: «my flatmate's» se queda ahí colgado, sin «keys» detrás, porque ya se sabe de qué hablas. Eso también lo hace el inglés.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-4\",\"book\":\"It isn't mine.\",\"real\":\"Nothing to do with me.\",\"meaning\":\"Yo no he sido / no es cosa mía.\",\"when\":\"Entre compañeros de piso, cuando aparece algo en la cocina y nadie lo reclama, o cuando te achacan un lío que no es tuyo. Suena a defensa rápida; en un email de trabajo escribe «That wasn't me» o «It isn't mine».\",\"register\":\"amigos\",\"note\":\"Frase sin verbo, como muchas de las que se dicen de verdad. Y otra vez el pronombre de objeto detrás de la preposición: with ME, nunca with I.\",\"sound\":\"NA-zing tu du uid mi\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"Br
