ussion in der Schule teil — über das Handyverbot im Unterricht. Er sagt: „Ich bin dagegen. Aber ich verstehe jetzt beide Seiten.“\u003cbr/\u003e6. Am Donnerstag ärgert er sich zum ersten Mal nicht über die Werbung, weil er keine sieht.\u003cbr/\u003e7. Am Freitag ruft das Fundbüro an. Das Handy ist da. Leo freut sich darüber — und holt es erst am Montag ab.\u003cbr/\u003e8. „Und?“, fragt Anna. „Würdest du es wieder machen?“ — „Eine Woche? Ja. Für immer? Nein. Ich brauche das Ding, obwohl ich es nicht mag.“\u003cbr/\u003e9. Heute hat Leo eine Regel: Das Handy wird beim Essen ausgeschaltet. Nur beim Essen. Aber jeden Tag.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: das Fundbüro = objetos perdidos · in die leere Tasche greifen = meter la mano en el bolsillo vacío · seltsam = extraño · abholen = recoger\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T7dd,"])</script><script>self.__next_f.push([1,"Willkommen zur «Streitfrage». Die Frage heute: Sind wir wirklich süchtig, oder sind wir einfach nur beschäftigt? Bei mir sitzen eine Neurologin und ein Blogger, der seit zwei Jahren über digitale Gewohnheiten schreibt. Frau Doktor, fangen wir bei Ihnen an. | Süchtig ist ein großes Wort, das benutz ich ungern. Was ich sehe, ist etwas anderes: Diese Apps sind genau so gebaut, dass man nicht aufhört. Da hat sich jemand hingesetzt und das so geplant. | Also, da bin ich ganz anderer Meinung. Ich schalt mein Handy abends stumm, und seitdem ist das Thema für mich, ähm, durch. Es geht halt, wenn man wirklich will. | Für Sie geht das, ja. Sie sind aber auch vierzig und nicht vierzehn. Bei Jugendlichen ist der Teil im Gehirn, der «jetzt ist Schluss» sagt, schlicht noch nicht fertig. Die können das gar nicht allein. | Also doch Verbote? Muss der Gesetzgeber ran? | Nein, Verbote allein bringen wenig. Was hilft, sind feste Zeiten ohne Gerät — und zwar für alle in der Familie, für die Eltern genauso. | Da bin ich jetzt mal ganz bei Ihnen. Die Erwachsenen sind doch das eigent \"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (párrafos 1 y 2)\",\"question\":\"¿Qué le propone Anna a Leo?\",\"options\":[\"Que espere una semana antes de comprarse otro móvil\",\"Que compre un móvil nuevo el lunes\",\"Que denuncie la pérdida a la policía\"],\"answer\":0,\"whyWrong\":[null,\"Dice justo lo contrario: «An deiner Stelle würde ich kein neues kaufen»\",\"En la historia no aparece la policía, sino el Fundbüro\"],\"itemIds\":[\"b1m4wuerdeichnichtmachen\"]},{\"id\":\"b1m4l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (párrafos 4 y 8)\",\"question\":\"¿Qué ha cambiado de verdad en Leo al final de la semana?\",\"options\":[\"Se da cuenta de cosas que antes no notaba, pero sigue queriendo su móvil\",\"Ha decidido vivir sin móvil para siempre\",\"Ya no le interesa hablar con nadie\"],\"answer\":0,\"whyWrong\":[null,\"Él mismo dice: «Für immer? Nein»\",\"Al contrario: se fija en que en el autobús se habla\"],\"itemIds\":[\"b1m4dieaufmerksamkeit\"],\"tip\":\"Fíjate en la última frase de la historia: la conclusión no es dramática, es una regla pequeña. Muy B1 y muy alemán.\"},{\"id\":\"b1m4l9e3\",\"type\":\"order\",\"prompt\":\"Ordena la semana de Leo\",\"sentences\":[\"Leo verliert sein Handy im Bus.\",\"Anna schlägt ihm eine Woche ohne Handy vor.\",\"Im Bus merkt Leo, dass dort gesprochen wird.\",\"Er nimmt an der Diskussion über das Handyverbot teil.\",\"Das Fundbüro ruft an, aber Leo holt das Handy erst später ab.\"],\"translation\":\"Leo pierde el móvil en el autobús. Anna le propone una semana sin móvil. En el autobús se da cuenta de que allí se habla. Participa en el debate sobre la prohibición del móvil. La oficina de objetos perdidos llama, pero Leo recoge el móvil más tarde.\",\"itemIds\":[\"b1m4teilnehmenan\",\"b1m4dasverbot\",\"a2m3handy\"]},{\"id\":\"b1m4l9e4\",\"type\":\"cloze\",\"prompt\":\"Completa el da-Kompositum de la frase 1\",\"text\":\"Leo ärgert sich furchtbar ___.\",\"answers\":[\"darüber\"],\"translation\":\"Leo se enfada muchísimo por ello.\",\"hints\":[\"sich ärgern über + cosa → da + r + über\",\"dar...\"],\"itemIds\":[\"b1m4sichaergernueber\",\"b1m4ichfreuemichdarauf\"]},{\"id\":\"b1m4l9e5\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga: lo digital que ya sabías (del A1 y el A2)\",\"pairs\":[{\"target\":\"das Handy\",\"source\":\"el móvil\"},{\"target\":\"das Internet\",\"source\":\"internet\"},{\"target\":\"das Foto\",\"source\":\"la foto\"},{\"target\":\"die Nachricht\",\"source\":\"el mensaje / la noticia\"},{\"target\":\"fernsehen\",\"source\":\"ver la tele\"},{\"target\":\"der Film\",\"source\":\"la película\"}],\"targetSeconds\":25,\"itemIds\":[\"a2m3handy\",\"a2m9internet\",\"a2m9foto\",\"nachricht\",\"a2m3fernsehen\",\"film\"],\"tip\":\"Nada nuevo aquí: solo velocidad. Cuanto menos te cueste este vocabulario, más atención te queda para la rección y el Konjunktiv II.\"},{\"id\":\"b1m4l9e6\",\"type\":\"gapbank\",\"prompt\":\"Completa las preposiciones de la historia\",\"text\":\"Leo wartet ___ einen Anruf. Am Mittwoch nimmt er ___ einer Diskussion teil. Am Freitag freut er sich ___ sein Handy.\",\"answers\":[\"auf\",\"an\",\"über\"],\"bank\":[\"auf\",\"an\",\"über\",\"für\",\"von\",\"um\"],\"translation\":\"Leo espera una llamada. El miércoles participa en un debate. El viernes se alegra de tener su móvil.\",\"itemIds\":[\"b1m4wartenauf\",\"b1m4teilnehmenan\",\"b1m4sichfreuenueber\"],\"tip\":\"Los tres bloques del módulo en tres frases seguidas. Si te salieron sin pensar, la rección ya está automatizada.\"},{\"id\":\"b1m4l9e7\",\"type\":\"errorfix\",\"prompt\":\"Espiral b1m2: el orden de la subordinada\",\"wrong\":\"Ich brauche das Ding, obwohl ich mag es nicht.\",\"answers\":[\"Ich brauche das Ding, obwohl ich es nicht mag.\"],\"why\":\"obwohl es subordinante: el verbo conjugado cierra la subordinada, detrás del objeto y de la negación. El español «aunque no me gusta» no mueve nada de sitio.\",\"translation\":\"Necesito el aparato, aunque no me gusta.\",\"itemIds\":[\"b1m4dasgeraet\"]},{\"id\":\"b1m4l9e8\",\"type\":\"transform\",\"prompt\":\"Espiral b1m3: dilo en pasiva\",\"source\":\"Man schaltet das Handy beim Essen aus.\",\"instruction\":\"Dilo en Passiv Präsens\",\"answers\":[\"Das Handy wird beim Essen ausgeschaltet\",\"Beim Essen wird das Handy ausgeschaltet\"],\"translation\":\"El móvil se apaga durante la comida.\",\"hints\":[\"Separable en participio: aus + ge + schaltet\",\"Das Handy wird beim Essen ...\"],\"itemIds\":[\"b1m4ausschalten\",\"b1m3hierwirddeutschgesprochen\",\"a2m3handy\"],\"tip\":\"Es la última frase de la historia. Los reglamentos y las normas domésticas se dicen en pasiva: así suena a regla, no a orden.\"},{\"id\":\"b1m4l9e9\",\"type\":\"build\",\"prompt\":\"Construye el consejo de Anna\",\"target\":\"An deiner Stelle würde ich kein neues Handy kaufen\",\"altTargets\":[\"Ich würde an deiner Stelle kein neues Handy kaufen\"],\"translation\":\"Yo en tu lugar no me compraría un móvil nuevo\",\"distractors\":[\"werde\",\"hätte\"],\"itemIds\":[\"b1m4wuerdeichnichtmachen\",\"a2m3handy\"]},{\"id\":\"b1m4l9e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin el verbo prohibido\",\"source\":\"Ich bin gegen ein Handyverbot in der Schule.\",\"forbid\":[\"gegen\",\"dagegen\"],\"answers\":[\"Ein Handyverbot in der Schule finde ich falsch\",\"Ich halte ein Handyverbot in der Schule für falsch\"],\"translation\":\"Estoy en contra de prohibir el móvil en el colegio.\",\"hints\":[\"Usa finden o halten … für\",\"... finde ich falsch\"],\"itemIds\":[\"b1m4ichbindagegen\",\"b1m4dasverbot\"],\"tip\":\"Tres formas de decir lo mismo (dagegen sein · falsch finden · für falsch halten) = «Wortschatz: Spektrum». Es puntuación directa.\"},{\"id\":\"b1m4l9e11\",\"type\":\"monologue\",\"prompt\":\"Presenta tu tema en 3 minutos, con las cinco diapositivas del examen\",\"topic\":\"Handys in der Schule — verbieten oder Regeln vereinbaren?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"Di de qué vas a hablar y cómo lo has organizado: «Ich möchte heute über … sprechen. Zuerst …, dann …, zum Schluss …»\"},{\"title\":\"2. Deine eigene Erfahrung\",\"hint\":\"Tu relación con el móvil: horas, momentos, qué te molesta. «Meine Bildschirmzeit liegt bei …», «Ich ärgere mich über …»\"},{\"title\":\"3. Die Situation in deinem Land\",\"hint\":\"¿Están prohibidos los móviles en los colegios de tu país? ¿Hay normas? Usa la pasiva: «Bei uns wird … verboten / vereinbart»\"},{\"title\":\"4. Vor- und Nachteile + deine Meinung\",\"hint\":\"Ventajas e inconvenientes de una prohibición. «Einerseits …, andererseits …» y después «Ich bin dafür/dagegen, weil …»\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"Cierra y agradece: «Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit.»\"}],\"planSeconds\":150,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, no 3\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos una hipótesis con Konjunktiv II (wenn … hätte/wäre)\",\"Usé al menos dos verbos con preposición (sich ärgern über, achten auf…)\",\"Dije claramente mi postura (Ich bin dafür / dagegen, weil …)\",\"En la 2ª pasada hablé sin mirar las diapositivas\"],\"model\":\"Diapositiva 4, ejemplo: „Einerseits stört das Handy im Unterricht, weil die Aufmerksamkeit sofort weg ist. Andererseits gehört es zum Alltag, und ein totales Verbot löst das Problem nicht. Ich bin dagegen, weil Regeln, die man gemeinsam vereinbart, besser funktionieren als Gesetze. Wenn ich Lehrerin wäre, würde ich mit der Klasse feste Zeiten abmachen.“\",\"itemIds\":[\"b1m4dieaufmerksamkeit\",\"b1m4ichbindagegen\",\"b1m4regelnvereinbaren\",\"b1m4wennichmehrzeithaette\"],\"tip\":\"Pasada 1 para soltarte, pasada 2 para pulir. Y cronometra: hablar 1 minuto y tratar 2 diapositivas baja Erfüllung a la banda D, con 40 puntos en juego.\"},{\"id\":\"b1m4l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Si estuviera menos online, me enfadaría menos por la publicidad.\",\"answers\":[\"Wenn ich weniger online wäre, würde ich mich weniger über die Werbung ärgern\"],\"hints\":[\"wäre en la subordinada, würde en la principal\",\"Wenn ich weniger online wäre, würde ich mich weniger ... die Werbung ärgern\"],\"itemIds\":[\"b1m4ichwaeregernoffline\",\"b1m4sichaergernueber\",\"b1m4diewerbung\"],\"tip\":\"Konjunktiv II + verbo con preposición + orden de la principal invertida, todo en una frase. Eso ya no es A2 ni por asomo. Módulo cerrado.\"},{\"id\":\"b1m4l9e13\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la neuróloga y c) el bloguero. Nadie dice su nombre ni su papel al empezar cada turno: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$18\",\"question\":\"„Dass man am Handy nicht aufhören kann, ist so gewollt.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él plantea la pregunta de apertura y presenta a los invitados; no defiende nada\",null,\"Para él es cuestión de fuerza de voluntad, no de cómo están hechas las aplicaciones\"],\"itemIds\":[\"b1m4suechtig\",\"b1m4dasgeraet\"],\"tip\":\"Ninguna de las ocho afirmaciones aparece literal en el audio. Ella dice «Da hat sich jemand hingesetzt und das so geplant»: hay que llegar de ahí a «gewollt». Eso es el Teil 4.\"},{\"id\":\"b1m4l9e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$19\",\"question\":\"„Wer es wirklich will, bekommt das allein in den Griff.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no defiende ninguna postura: modera\",\"Ella responde justo que eso vale para un adulto y no para un chaval de catorce\",null],\"itemIds\":[\"b1m4stummschalten\"],\"tip\":\"«Es geht halt, wenn man wirklich will» — cuatro palabras sueltas al final de su turno. Las afirmaciones del Teil 4 resumen un turno entero, no una frase.\"},{\"id\":\"b1m4l9e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$1a\",\"question\":\"„Jugendlichen fehlt körperlich noch die Bremse — mit Willen hat das nichts zu tun.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo pregunta, no argumenta\",null,\"Él sostiene lo contrario: que basta con quererlo\"],\"itemIds\":[\"b1m4suechtig\"],\"tip\":\"En el audio: «Bei Jugendlichen ist der Teil im Gehirn, der ‹jetzt ist Schluss› sagt, schlicht noch nicht fertig» — o sea, falta el freno. Si buscabas la palabra «Bremse» en el audio, no la ibas a oír nunca.\"},{\"id\":\"b1m4l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. Ojo: en el Teil 4 real, una o dos afirmaciones son SIEMPRE del moderador.\",\"audio\":\"$1b\",\"question\":\"„Vielleicht muss am Ende doch der Gesetzgeber eingreifen.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella contesta a esa idea con un «Nein»: las prohibiciones solas sirven de poco\",\"Él no llega a hablar de leyes en ningún momento\"],\"itemIds\":[\"b1m4dasverbot\",\"b1m4dasgesetz\"],\"tip\":\"Descartar al moderador por sistema cuesta dos puntos. Su marca no es el tema: es la forma. Pregunta, resume o da el turno.\"},{\"id\":\"b1m4l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$1c\",\"question\":\"„Handyfreie Zeiten dürfen nicht nur für die Kinder gelten.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él ha preguntado por las prohibiciones, no ha propuesto nada\",null,\"Él llega a lo de los adultos justo después, y por otro camino: el de la anécdota\"],\"itemIds\":[\"b1m4ausschalten\",\"b1m4offlinegehen\"],\"tip\":\"Los dos invitados acaban diciendo cosas parecidas sobre los adultos, y por eso las afirmaciones van en el orden del debate: decide quién lo dice PRIMERO.\"},{\"id\":\"b1m4l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$1d\",\"question\":\"„Erwachsene werfen ihren Kindern genau das vor, was sie selbst tun.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",\"Ella lo formula después como principio general (‹Kinder machen, was wir vormachen›), pero la escena es de él\",null],\"itemIds\":[\"b1m4scrollen\",\"b1m4sichaergernueber\"],\"tip\":\"El ejemplo concreto —el tren, tres horas, el hijo— es del bloguero; la neuróloga lo convierte en regla en el turno siguiente. Quien cuenta anécdotas casi nunca es el experto.\"},{\"id\":\"b1m4l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8 — la que casi todo el mundo falla. Dos escuchas.\",\"audio\":\"$1e\",\"question\":\"„Ein Handyverbot in der Schule löst das Problem nur bis zum Nachmittag.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pregunta «Und die Schule?» y se calla\",null,\"Él es quien pide la caja para los móviles: esta frase es la respuesta a la suya\"],\"itemIds\":[\"b1m4dasverbot\",\"b1m4derunterricht\"],\"tip\":\"Aquí se cae quien va por palabras clave: «Schule», «Handys», «Verbot» son del bloguero. Pero la frase que dice que eso no basta —«und um vier ist das Kind wieder allein mit dem Gerät»— es de ella.\"},{\"id\":\"b1m4l9e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido — exactamente como en el examen.\",\"audio\":\"$1f\",\"question\":\"„Weniger Regeln wären besser als zwanzig, an die sich keiner hält.“ — ¿Quién lo dice?\",\"options\":[\"der Moderator\",\"die Neurologin\",\"der Blogger\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él pide un consejo en una frase, no lo da\",\"Su consejo va de hablar de uno mismo, no de quitar reglas\",null],\"itemIds\":[\"b1m4regelnvereinbaren\"],\"tip\":\"La ronda final vale dos o tres ítems y llega cuando ya estás cansado: por eso se entrena la resistencia, no solo el oído.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Las 5 diapositivas del Teil 2 no cambian nunca. Repite este monólogo con el tema del módulo anterior.\"},{\"label\":\"DW — Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/de/nicos-weg/c-55735270\",\"note\":\"Episodios sobre medios y redes: verbos con preposición en habla real y a velocidad normal.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"20:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\
