 fideicomiso de patrimonio: datos, proceso, recomendación con reservas. La segunda es una \u003cb\u003ecolumna de opinión\u003c/b\u003e en el periódico del condado: la dueña del café del pueblo, que vive de los autocares. Las dos usan pasiva, las dos usan -ing de circunstancia. Lo que cambia es la \u003cb\u003epostura\u003c/b\u003e. Si al terminar no puedes decir en una frase desde dónde habla cada una, las has leído como si fueran B1.18:Tdda,"])</script><script>self.__next_f.push([1,"Standing on the ridge above Llynfaen, you see the priory before you see the village. The ruin occupies a shelf of land between the estuary and a line of [[dry-stone walls|muros de piedra en seco]] that have marked the same fields since the sixteenth century. St Elen's has been a [[World Heritage site|sitio Patrimonio de la Humanidad]] since 2004. It is also, and this is the point this report has to hold together, a working landscape: sheep still graze the approach, and a public right of way still crosses the inner court.\u003cbr/\u003e\u003cbr/\u003eFootfall has doubled in five years. The visitor centre, opened in 2018, was designed for 40,000 people a year; last year 83,000 came through the gate. Most arrived by car. The approach road is a single track with passing places, and on summer Saturdays the queue reaches back to the A-road. Local residents have written to the Trust in terms that are hard to argue with. Something has to change.\u003cbr/\u003e\u003cbr/\u003eTwo options are on the table. The first is a car park of 180 spaces on the field immediately west of the visitor centre. It would be cheap to build and it would be full by half past ten. After having walked the field with the county ecologist, we cannot recommend it. The field is a sensitive habitat for lapwing, and the proposed route of the access lane would cut a public right of way that has been in continuous use since the tithe maps. Building there would solve a traffic problem by creating a conservation one.\u003cbr/\u003e\u003cbr/\u003eThe second option is a park-and-ride on the north side of the village, with a shuttle every twenty minutes. The shuttle would add twelve minutes to the visit. It would also leave the coast path, the inner court and the lapwing field untouched. Rather than pouring more cars into the shelf of land that makes the priory what it is, we would move the cars away from it. Gwen Pryce, who has guided here for eighteen years, put it more plainly on the site visit: «People come for the silence. You cannot have the silence and the car park.»\u003cbr/\u003e\u003cbr/\u003eThere had been a third proposal, briefly: a bypass looping south of the estuary. It looked, on the first maps, as if it would solve everything. After having modelled the earthworks, the engineers withdrew it. The southern loop would have destroyed two kilometres of dry-stone wall and taken a bite out of the salt marsh. In the interests of the listed landscape, that option is closed.\u003cbr/\u003e\u003cbr/\u003eThis Trust's recommendation is therefore the park-and-ride, with a view to reducing congestion at the gate without spending the landscape that people have come to see. We accept that some visitors will complain about the shuttle. We also accept that a World Heritage site is not a supermarket, and that getting there is part of what the place means. Protecting open spaces is not a slogan we print on a leaflet. It is the reason the priory is still visible from the ridge.\u003cbr/\u003e\u003cbr/\u003eOne further point, because it keeps being raised in the consultation: satellite navigation. The last junction at the church still offers a farm track that is not a public road. After having put up a sign, we still meet drivers who have followed the machine rather than the map. Green travel, in this valley, starts with not sending a car down a lane that cannot take it. The Trust will keep the sign, keep the shuttle, and keep saying the same thing on the guided tour: the landscape is the destination, not the obstacle between you and a photograph. The sheep, for their part, have not been consulted, and they will still be there if we get this right."])</script><script>self.__next_f.push([1,"19:Td23,"])</script><script>self.__next_f.push([1,"I have lived in Llynfaen for forty-one years and I have run the café on the harbour wall for twenty of them. I am not a heritage expert. I am the person who pours the tea for the people who have just walked up from the car park that does not exist, and I can tell you what the St Elen's Trust will not put in a report: visitors are already turning round.\u003cbr/\u003e\u003cbr/\u003eLast August I counted them. On three consecutive Saturdays, between eleven and one, more than thirty cars reached the passing place below the church, sat there for a few minutes looking as though they had lost a fight with the satnav, and drove back to the A-road. That is not a guess. That is ninety cars in three days, and each of those cars was a table I did not serve, a guided tour Gwen Pryce did not give, and a ticket the Trust did not sell. Footfall at the priory may have doubled on paper. In the village, on the ground, it is starting to fall on the days when the road jams.\u003cbr/\u003e\u003cbr/\u003eThe Trust wants a park-and-ride. Of course it does. Park-and-rides look wonderful on a plan. They look less wonderful at twenty past five, when the last shuttle has gone and a family with a sleeping child is standing at a stop that has no shelter. Rather than ask those people to add twelve minutes and a timetable to a day they have already spent five hours planning, we could give them a field to park in. The field west of the visitor centre is not a rainforest. It is a damp rectangle of grass with a few lapwings on it in March. I like lapwings. I also like being able to pay my staff in November.\u003cbr/\u003e\u003cbr/\u003eGwen is quoted in the Trust's paper as if she had come down against the car park. I heard her that afternoon. What she actually said, standing on the ridge with the wind in her coat, was: «People come for the silence — and they also come in cars, because that is how you get to west Wales if you do not live here.» The second half of the sentence did not make the report. I am not accusing anyone of lying. I am saying that a quotation without its other half is not evidence. It is scenery.\u003cbr/\u003e\u003cbr/\u003eThere had been a bypass on the table. The engineers took it off because of a wall. I will put this as politely as I can. A dry-stone wall can be rebuilt. A café that loses its August does not get a second August. Green travel is a lovely phrase when you live in London and the train is a walk away. From Llynfaen the train is a two-hour drive to a station that National Rail has already cut to four services a day. Telling us to arrive by public transport, given that the public transport does not reach us, is not a policy. It is a wish.\u003cbr/\u003e\u003cbr/\u003eI am not asking the Trust to pour tarmac up to the altar. I am asking it to remember who keeps the village alive between the photographs. A modest car park, with a low-emission zone at the gate and a bus that actually turns up, would do more for this landscape than another report about silence. Silence is easy to protect when there is nobody left to hear it.\u003cbr/\u003e\u003cbr/\u003eAnd if the Trust wants regional geographical features on a leaflet, it can start with this one: we are two hours from a station. Flora and fauna do not buy bread. Visitors do. Given that the county has already spent three years consulting, the next paper might usefully contain a date and a number of parking spaces, not another paragraph about the view from the ridge."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l6\",\"phaseId\":\"enb2m9\",\"title\":\"The same valley, two reports\",\"subtitle\":\"Uno informa y recomienda con reservas; el otro convence. El B2 es notar la diferencia\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El léxico que las dos lecturas van a usar\",\"itemIds\":[\"enb2m9worldheritagesite\",\"enb2m9alistedbuilding\",\"enb2m9thevisitorcentre\",\"enb2m9aguidedtour\",\"enb2m9thepriory\",\"enb2m9footfall\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sintetizar dos fuentes: lo que el examen no pide y el nivel sí\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m9l6e1\",\"type\":\"read\",\"prompt\":\"Lectura 1 — informe. Antes de las preguntas, decide: ¿informa, o convence? Toca las glosas si te bloquean.\",\"title\":\"Access to St Elen's: a working landscape, not a car park\",\"source\":\"Informe del St Elen's Trust, consultado en la biblioteca de Palmer Road. Texto adaptado.\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m9l6e1q1\",\"q\":\"¿Cuánta gente pasó el año pasado por el centro de visitantes?\",\"options\":[\"83.000\",\"40.000\",\"180\"],\"answer\":0,\"why\":\"El centro se diseñó para 40.000; el año pasado entraron 83.000. 180 son las plazas del aparcamiento que se descarta.\"},{\"id\":\"enb2m9l6e1q2\",\"q\":\"¿Por qué el fideicomiso descarta el aparcamiento junto al centro?\",\"options\":[\"Porque el campo es un hábitat sensible y el acceso cortaría un camino público.\",\"Porque saldría demasiado caro de construir.\",\"Porque Gwen Pryce se niega a guiar si se construye.\"],\"answer\":0,\"why\":\"Cheap to build, full by 10:30 — el problema no es el dinero. El problema es el lapwing y el right of way.\"},{\"id\":\"enb2m9l6e1q3\",\"q\":\"¿Qué pasó con la idea de la variante al sur del estuario?\",\"options\":[\"Los ingenieros la retiraron al modelar los movimientos de tierra.\",\"El fideicomiso la sigue considerando como plan B.\",\"El ayuntamiento la aprobó la semana pasada.\"],\"answer\":0,\"why\":\"There had been a third proposal… the engineers withdrew it. Está cerrada.\"},{\"id\":\"enb2m9l6e1q4\",\"q\":\"Cuando Gwen dice «You cannot have the silence and the car park», ¿qué está haciendo el informe con esa cita?\",\"options\":[\"Usar una voz del terreno para sostener una recomendación que ya ha argumentado con datos.\",\"Dejar que Gwen decida, porque es quien más sabe.\",\"Rebajar el tono formal para que el texto parezca una columna.\"],\"answer\":0,\"inference\":true,\"why\":\"La cita llega DESPUÉS de la ecología y del right of way. No sustituye al argumento: lo traduce. Un informe que solo citara a Gwen sería otra cosa.\"},{\"id\":\"enb2m9l6e1q5\",\"q\":\"«A World Heritage site is not a supermarket, and getting there is part of what the place means.» ¿Cuál es la postura del fideicomiso?\",\"options\":[\"Que la dificultad de llegar forma parte del valor del sitio, y no hay que borrarla del todo.\",\"Que el patrimonio no debería recibir visitantes en coche, nunca.\",\"Que los visitantes que se quejen del lanzadera no han entendido el folleto.\"],\"answer\":0,\"inference\":true,\"why\":\"No dice «no vengáis». Dice que llegar es parte del significado. Por eso aceptan las quejas del shuttle y aun así lo recomiendan.\"}],\"itemIds\":[\"enb2m9worldheritagesite\",\"enb2m9footfall\",\"enb2m9thevisitorcentre\",\"enb2m9protectingopenspaces\",\"enb2m9therehadbeen\"],\"tip\":\"El informe no grita. Recomienda el park-and-ride y cierra dos opciones con datos. Si lo leíste como un «no al coche», te comiste la reserva — y la reserva es la postura.\"},{\"id\":\"enb2m9l6e2\",\"type\":\"read\",\"prompt\":\"Lectura 2 — la misma semana, el mismo valle, otra voz. Decide otra vez: ¿informa, o convence?\",\"title\":\"Let people arrive, or the priory will empty\",\"source\":\"Columna de Sian Morris, dueña del Harbour Café de Llynfaen, en el Cambrian Weekly. Texto adaptado.\",\"text\":\"$19\",\"questions\":[{\"id\":\"enb2m9l6e2q1\",\"q\":\"¿Qué contó Sian Morris en tres sábados de agosto?\",\"options\":[\"Más de treinta coches por sábado que llegaron al apartadero y se dieron la vuelta.\",\"Noventa autocares que no pudieron aparcar junto al café.\",\"Que el centro de visitantes cerró tres sábados seguidos.\"],\"answer\":0,\"why\":\"Thirty cars on each of three Saturdays, then they drove back. 90 cars, not 90 coaches.\"},{\"id\":\"enb2m9l6e2q2\",\"q\":\"¿Qué le falta, según ella, a la cita de Gwen en el informe del fideicomiso?\",\"options\":[\"La segunda mitad: que la gente también llega en coche porque no hay otra forma.\",\"La cifra exacta de visitas guiadas que Gwen da al año.\",\"El permiso por escrito de Gwen para ser citada.\"],\"answer\":0,\"why\":\"«The second half of the sentence did not make the report.» Es el golpe de la columna.\"},{\"id\":\"enb2m9l6e2q3\",\"q\":\"«A quotation without its other half is not evidence. It is scenery.» ¿Qué está acusando Sian, sin decir la palabra?\",\"options\":[\"De usar a Gwen como decorado para una decisión ya tomada.\",\"De que Gwen mintió en la visita.\",\"De que el informe no tiene fotografías suficientes.\"],\"answer\":0,\"inference\":true,\"why\":\"Scenery es el insulto fino: la cita está para verse, no para probar. No dice liar; dice que han recortado.\"},{\"id\":\"enb2m9l6e2q4\",\"q\":\"Cuando escribe «Green travel is a lovely phrase when you live in London», ¿a quién está hablando de verdad?\",\"options\":[\"A quien redacta política patrimonial desde una ciudad con tren a la puerta.\",\"A Valeria en concreto, que vive en Palmer Road.\",\"A los turistas alemanes que llegan en autocar.\"],\"answer\":0,\"inference\":true,\"why\":\"London es el tipo, no la persona. El contraste es: fácil predicar green travel donde el tren existe. Llynfaen no es ese sitio.\"},{\"id\":\"enb2m9l6e2q5\",\"q\":\"Las dos lecturas recomiendan cosas distintas. ¿En qué coinciden, aunque ninguna lo celebre?\",\"options\":[\"En que el acceso actual no funciona: hay cola, hay gente que se da la vuelta, algo tiene que cambiar.\",\"En que el aparcamiento junto al priorato es la única solución seria.\",\"En que Gwen Pryce debería dejar de guiar hasta que se vote.\"],\"answer\":0,\"inference\":true,\"why\":\"El informe parte de que something has to change; la columna cuenta los coches que se van. El desacuerdo es qué hacer, no si hay problema. Sintetizar es eso: el solape, no el titular.\"}],\"itemIds\":[\"enb2m9footfall\",\"enb2m9satnav\",\"enb2m9greentravel\",\"enb2m9aguidedtour\",\"enb2m9thebypass\"],\"tip\":\"Ahora sí: dos fuentes. El informe protege el silencio; la columna protege agosto. Las dos tienen razón a medias, y un B2 que se case con una de las dos no ha leído.\"},{\"id\":\"enb2m9l6e3\",\"type\":\"mc\",\"prompt\":\"La pregunta de postura, que es la de este nivel\",\"question\":\"¿Cuál es la diferencia de postura entre los dos textos?\",\"options\":[\"El primero informa y recomienda con reservas; el segundo convence desde un interés declarado.\",\"El primero está a favor del coche y el segundo en contra.\",\"El primero es objetivo y el segundo está equivocado en los datos.\"],\"answer\":0,\"whyWrong\":[null,\"Al revés: el informe aparta el coche del priorato; la columna pide un aparcamiento.\",\"Los datos no se contradicen (83.000, la cola, el shuttle). Se contradice para qué se usan.\"],\"itemIds\":[\"enb2m9writersstance\",\"enb1m4factoropinion\"]},{\"id\":\"enb2m9l6e4\",\"type\":\"paraphrase\",\"prompt\":\"La frase de Gwen, empaquetada. Prohibido when / as / while\",\"source\":\"When she was standing on the ridge, Gwen said that people come for the silence.\",\"forbid\":[\"When\",\"As\",\"While\"],\"answers\":[\"Standing on the ridge, Gwen said that people come for the silence.\",\"Standing on the ridge, Gwen said people come for the silence.\"],\"translation\":\"De pie en la cresta, Gwen dijo que la gente viene por el silencio.\",\"itemIds\":[\"enb2m9standingontheplatform\",\"enb2m9aguidedtour\"]},{\"id\":\"enb2m9l6e5\",\"type\":\"bucket\",\"prompt\":\"¿De qué texto salió, o podría haber salido?\",\"categories\":[\"Informe del fideicomiso\",\"Columna de Sian Morris\"],\"items\":[{\"text\":\"Last year 83.000 came through the gate.\",\"bucket\":0},{\"text\":\"That is ninety cars in three days.\",\"bucket\":1},{\"text\":\"A World Heritage site is not a supermarket.\",\"bucket\":0},{\"text\":\"A café that loses its August does not get a second August.\",\"bucket\":1},{\"text\":\"In the interests of the listed landscape, that option is closed.\",\"bucket\":0},{\"text\":\"Silence is easy to protect when there is nobody left to hear it.\",\"bucket\":1}],\"itemIds\":[\"enb2m9worldheritagesite\",\"enb2m9footfall\"]},{\"id\":\"enb2m9l6e6\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Al español, con la postura a la vista: no es una frase neutra\",\"source\":\"Silence is easy to protect when there is nobody left to hear it.\",\"answers\":[\"El silencio es fácil de proteger cuando ya no queda nadie para oírlo.\",\"Es fácil proteger el silencio cuando no queda nadie que lo oiga.\",\"El silencio es fácil de proteger cuando no queda nadie para escucharlo.\"],\"itemIds\":[\"enb2m9protectingopenspaces\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1a:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status
