3c/i\u003e \u003ci\u003eThe figures are certain to change.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora el salto que el B1 no tocó: la deducción en pasado.\u003c/b\u003e\u003cbr/\u003ePresente (ya lo tienes): \u003ci\u003eShe must be at the surgery.\u003c/i\u003e = lo deduzco ahora.\u003cbr/\u003ePasado (hoy): \u003ci\u003eIt must have been the pipes.\u003c/i\u003e = lo deduzco sobre algo que ya ocurrió.\u003cbr/\u003e\u003cbr/\u003eLa forma es modal + \u003cb\u003ehave + participio\u003c/b\u003e: \u003ci\u003emust have been, may have left, can't have been, could have been.\u003c/i\u003e El calco es siempre el mismo: ❌ \u003ci\u003emust has been\u003c/i\u003e — el «have» no se conjuga, es el del perfecto.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escala de la deducción en pasado:\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003emust have\u003c/i\u003e — es lo único que encaja.\u003cbr/\u003e· \u003ci\u003emay / could have\u003c/i\u003e — no lo descarto.\u003cbr/\u003e· \u003ci\u003ecan't have\u003c/i\u003e — lo descarto. ❌ \u003ci\u003emustn't have\u003c/i\u003e no existe con este sentido: \u003ci\u003emustn't\u003c/i\u003e es prohibición, no deducción."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l2\",\"phaseId\":\"enb2m5\",\"title\":\"Bound to happen\",\"subtitle\":\"Lo inevitable, y la deducción que mira hacia atrás\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuando ya no hay otra lectura\",\"itemIds\":[\"enb2m5boundto\",\"enb2m5sureto\",\"enb2m5certainto\",\"enb2m5musthavebeen\",\"enb2m5evidencesuggests\",\"enb2m5natgottobe\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: bound to es el futuro que ya no se discute; must have, el pasado que se deduce\",\"body\":\"$17\",\"table\":[[\"Ahora\",\"Sobre el pasado\",\"Altura\"],[\"must be\",\"must have been\",\"lo único que encaja\"],[\"may / might be\",\"may / might have been\",\"no lo descarto\"],[\"can't be\",\"can't ha ón mira al presente o al pasado?\",\"categories\":[\"AHORA — must be / can't be\",\"ENTONCES — must have / can't have\"],\"items\":[{\"text\":\"She must be at the surgery.\",\"bucket\":0},{\"text\":\"That can't be right.\",\"bucket\":0},{\"text\":\"It must have been the pipes.\",\"bucket\":1},{\"text\":\"It can't have been a ghost.\",\"bucket\":1},{\"text\":\"She may have left the light on.\",\"bucket\":1},{\"text\":\"It might be an allergy.\",\"bucket\":0}],\"itemIds\":[\"enb1m6mustbe\",\"enb1m6cantbe\",\"enb2m5musthavebeen\",\"enb2m5canthavebeen\",\"enb2m5mayhaveleft\",\"enb1m6mightbe\"],\"tip\":\"La pista es «have» + participio. Si está, miras hacia atrás. Si no, miras a ahora. El modal es el mismo; cambia el tiempo de lo deducido.\"},{\"id\":\"enb2m5l2e5\",\"type\":\"paraphrase\",\"prompt\":\"Súbelo de registro: sin «got to» ni «must»\",\"source\":\"It's got to be the pipes.\",\"forbid\":[\"got\",\"must\",\"sure\"],\"answers\":[\"The evidence strongly suggests it was the pipes\",\"The evidence strongly suggests a leak\",\"It is highly likely that it was the pipes\"],\"translation\":\"Tienen que ser las tuberías.\",\"hints\":[\"Empieza por «The evidence…» o por «It is highly likely…»\",\"The evidence strongly ...\"],\"itemIds\":[\"enb2m5natgottobe\",\"enb2m5evidencesuggests\",\"enb2m5highlylikelythat\"],\"tip\":\"Esto es exactamente lo que pide el Writing: la misma deducción, sin la calle. «The evidence strongly suggests» es la versión que puntúa.\"},{\"id\":\"enb2m5l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa la perífrasis de lo inevitable\",\"text\":\"The figures are ___ to change once the lab repeats the test.\",\"answers\":[\"certain\",\"sure\",\"bound\"],\"translation\":\"Las cifras van a cambiar, sin ninguna duda, cuando el laboratorio repita la prueba.\",\"hints\":[\"Es un adjetivo de certeza detrás de «are»\",\"cer- / su- / bou-\"],\"itemIds\":[\"enb2m5certainto\",\"enb2m5sureto\",\"enb2m5boundto\"],\"tip\":\"Las tres valen en este hueco. En un informe, elige «certain»: «bound» suena a conversación y «sure» a aviso.\"},{\"id\":\"enb2m5l2e7\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La misma deducción, dos trajes\",\"book\":\"It must have been the pipes.\",\"real\":\"It's got to be the pipes.\",\"translation\":\"Tienen que haber sido las tuberías.\",\"itemIds\":[\"enb2m5musthavebeen\",\"enb2m5natgottobe\"],\"tip\":\"La calle pone presente («got to be») aunque hable de anoche. El examen, en el Writing, quiere el perfecto: «must have been».\"},{\"id\":\"enb2m5l2e8\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"The evidence strongly suggests a leak.\",\"translation\":\"La evidencia apunta con fuerza a una fuga.\",\"hints\":[\"Empieza por «The evidence…»\",\"The evidence strongly ... a leak\"],\"itemIds\":[\"enb2m5evidencesuggests\",\"enb2m5theevidence\"],\"tip\":\"«Evidence» es incontable: el verbo va en singular, «suggests». Si oyes una -s y la comes, has escrito un plural que no existe.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m5-2\",\"book\":\"It must be true\",\"real\":\"It's got to be\",\"meaning\":\"Tiene que ser eso / no hay otra lectura\",\"when\":\"Con amigos, cuando ya no te cabe otra explicación. En el informe y en el examen escrito, la misma certeza se dice con evidencia: «The evidence strongly suggests». «It's got to be» en un Writing Part 1 te baja el criterio de vocabulario por registro.\",\"register\":\"amigos\",\"exam\":\"The evidence strongly suggests\",\"note\":\"«Have got to» de obligación ya lo tienes de A2. Aquí no obliga: deduce. El oído no distingue las dos; el contexto sí.\",\"sound\":\"its got tu bi\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m5natgottobe\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"
