m6pflegenotstand\",\"b2m6belastung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos infinitivos al final, hätte delante de ellos\",\"body\":\"Cuando el irreal del pasado lleva un \u003cb\u003emodal\u003c/b\u003e (können, sollen, müssen, dürfen, wollen), el alemán no pone el participio del modal. Pone \u003cb\u003edos infinitivos\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ehätte + infinitivo + infinitivo del modal\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eIch hätte kommen können.\u003c/b\u003e — Habría podido venir.\u003cbr/\u003e\u003cb\u003eIch hätte anrufen sollen.\u003c/b\u003e — Tendría que haber llamado.\u003cbr/\u003e\u003cb\u003eIch hätte das machen müssen.\u003c/b\u003e — Habría tenido que hacerlo.\u003cbr/\u003e\u003cbr/\u003eEl orden es fijo y el español no lo da: primero lo que se hacía, al final el modal. *hätte gekonnt kommen no existe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ebeinahe / fast\u003c/b\u003e + K II = por poco, y no llegó a pasar: \u003cb\u003eBeinahe wäre sie in die Notaufnahme.\u003c/b\u003e El calco «casi he venido» (*Ich bin beinahe gekommen) cuenta como hecho; aquí el hecho no ocurrió.\",\"table\":[[\"sin modal\",\"con modal (doble infinitivo)\"],[\"Ich wäre gekommen.\",\"Ich hätte kommen können.\"],[\"Ich hätte angerufen.\",\"Ich hätte anrufen sollen.\"],[\"Ich hätte das gemacht.\",\"Ich hätte das machen müssen.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m6l2e1\",\"type\":\"mc\",\"prompt\":\"El orden del doble infinitivo\",\"question\":\"Elige la frase correcta:\",\"options\":[\"Ich hätte früher zum Arzt gehen sollen.\",\"Ich hätte früher zum Arzt gesollt gehen.\",\"Ich würde früher zum Arzt gehen gekonnt haben.\"],\"answer\":0,\"whyWrong\":[null,\"El modal no pone participio: sollen, no gesollt\",\"würde + Perfekt + modal no es una forma alemana\"],\"itemIds\":[\"b2m6haettegehensollen\"]},{\"id\":\"b2m6l2e2\",\"type\":\"match\",\"prompt\":\"Empareja modal y matiz\",\"pairs\":[{\"target\":\"hätte kommen können\",\"source\":\"habría podido (capacidad / permiso)\"},{\"target\":\"hätte anrufen sollen\",\"source\":\"tendría que haber (consejo a destiempo)\"},{\"target\":\"hätte machen müssen\",\"source\":\"habría tenido que (obligación)\"},{\"target\":\"beinahe wäre sie gekommen\",\"source\":\"por poco viene (y no vino)\"}],\"itemIds\":[\"b2m6haettekommenkoennen\",\"b2m6haetteanrufensollen\",\"b2m6haettemachenmuessen\",\"b2m6beinahe\"]},{\"id\":\"b2m6l2e3\",\"type\":\"cloze\",\"prompt\":\"Cierra el doble infinitivo\",\"text\":\"Sie hätte die Zweitmeinung in Anspruch nehmen ___.\",\"answers\":[\"können\"],\"translation\":\"Habría podido hacer uso de la segunda opinión.\",\"hints\":[\"El modal de posibilidad, en infinitivo, al final\",\"k...\"],\"itemIds\":[\"b2m6haettekommenkoennen\",\"b2m6zweitmeinung\"]},{\"id\":\"b2m6l2e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich hätte anrufen gesollt.\",\"answers\":[\"Ich hätte anrufen sollen.\",\"Ich hätte anrufen sollen\"],\"why\":\"Con modal, el irreal del pasado no usa el participio (gesollt). Usa el infinitivo: hätte anrufen sollen. Es el Ersatzinfinitiv, y es la forma que el examen quiere ver.\",\"translation\":\"Tendría que haber llamado.\",\"itemIds\":[\"b2m6haetteanrufensollen\"]},{\"id\":\"b2m6l2e5\",\"type\":\"transform\",\"prompt\":\"Añade el modal de consejo a destiempo\",\"source\":\"Ich bin nicht zum Arzt gegangen.\",\"instruction\":\"Dilo como reproche suave: hätte … sollen\",\"answers\":[\"Ich hätte zum Arzt gehen sollen\",\"Ich hätte zum Arzt gehen sollen.\",\"Ich hätte früher zum Arzt gehen sollen\",\"Ich hätte früher zum Arzt gehen sollen.\"],\"translation\":\"Tendría que haber ido al médico.\",\"itemIds\":[\"b2m6haettegehensollen\"],\"tip\":\"El reproche en K II no acusa: describe lo que no ocurrió. Por eso Anna puede decírselo a una paciente.\"},{\"id\":\"b2m6l2e6\",\"type\":\"gapbank\",\"prompt\":\"La noche en la planta de Anna\",\"text\":\
