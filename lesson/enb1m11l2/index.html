acción.\u003cbr/\u003e· \u003ci\u003eI forgot \u003cb\u003eto tell\u003c/b\u003e you.\u003c/i\u003e — no te lo dije. (Lo olvidé \u003cb\u003eantes\u003c/b\u003e de decirlo.)\u003cbr/\u003e· \u003ci\u003eI'll never forget \u003cb\u003eseeing\u003c/b\u003e that.\u003c/i\u003e — lo vi, y no se me va a olvidar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTRY\u003c/b\u003e — la que más se usa mal:\u003cbr/\u003e· \u003ci\u003eWe tried \u003cb\u003etalking\u003c/b\u003e to them.\u003c/i\u003e — lo \u003cb\u003eprobamos\u003c/b\u003e a ver si funcionaba. (Hablar no costaba nada; lo que no sabíamos era si serviría.)\u003cbr/\u003e· \u003ci\u003eWe tried \u003cb\u003eto talk\u003c/b\u003e to them.\u003c/i\u003e — lo \u003cb\u003eintentamos\u003c/b\u003e y fue difícil. (A lo mejor ni nos abrieron la puerta.)\u003cbr/\u003eRegla de bolsillo: \u003cb\u003e\u003ci\u003etry + -ing\u003c/i\u003e es «probar a»; \u003ci\u003etry + to\u003c/i\u003e es «intentar»\u003c/b\u003e, con esfuerzo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY dos de propina, para reconocerlas:\u003c/b\u003e \u003ci\u003ego on \u003cb\u003edoing\u003c/b\u003e\u003c/i\u003e es seguir con lo mismo y \u003ci\u003ego on \u003cb\u003eto do\u003c/b\u003e\u003c/i\u003e es pasar a otra cosa; \u003ci\u003eit means \u003cb\u003ewaiting\u003c/b\u003e\u003c/i\u003e es «supone esperar» y \u003ci\u003eI meant \u003cb\u003eto tell\u003c/b\u003e you\u003c/i\u003e es «tenía intención de decírtelo».\u003cbr/\u003e\u003cbr/\u003eCuidado con una cosa: \u003cb\u003eninguna de estas formas está mal\u003c/b\u003e. No son un error que corregir, son dos frases con dos significados. Por eso, si en un ejercicio ves las dos, la pregunta no es «cuál es correcta» sino \u003cb\u003e«cuál dice lo que quieres decir»\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l2\",\"phaseId\":\"enb1m11\",\"title\":\"I stopped listening\",\"subtitle\":\"Seis verbos donde la forma de detrás no es una regla: es el significado entero\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los seis, y los tres minipares que los prueban\",\"itemIds\":[\"enb1m11switchgroup\",\"enb1m11stoppedlistening\",\"enb1m11stoppedtolisten\",\"enb1m11rememberposting\",\"enb1m11remembertosign\",\"enb1m11triedtalking\",\"enb1m11forgottotell\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Aquí sí hay lógica, y por eso estos seis se aprenden aparte\",\"body\":\"$17\",\"table\":[[\"Frase\",\"Qué significa\",\"En español\"],[\"I stopped listening.\",\"se acabó lo de escuchar\",\"dejé de escuchar\"],[\"I stopped to listen.\",\"paré con ese fin\",\"me paré a escuchar\"],[\"I remember posting it.\",\"lo hice y lo recuerdo\",\"me acuerdo de haberla echado\"],[\"Remember to post it.\",\"todavía no está hecho\",\"acuérdate de echarla\"],[\"We tried talking to them.\",\"lo probamos a ver\",\"probamos a hablar con ellos\"],[\"We tried to talk to them.\",\"costó, o no salió\",\"intentamos hablar con ellos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l2e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro sentidos — fíjate en que el verbo inglés es el mismo\",\"pairs\":[{\"target\":\"I stopped listening.\",\"source\":\"Dejé de escuchar.\"},{\"target\":\"I stopped to listen.\",\"source\":\"Me paré a escuchar.\"},{\"target\":\"I remember posting the letter.\",\"source\":\"Me acuerdo de haber echado la carta.\"},{\"target\":\"Remember to sign it.\",\"source\":\"Acuérdate de firmarlo.\"}],\"itemIds\":[\"enb1m11stoppedlistening\",\"enb1m11stoppedtolisten\",\"enb1m11rememberposting\",\"enb1m11remembertosign\"],\"tip\":\"Cuatro frases, dos verbos ingleses y cuatro verbos españoles. Es la prueba de que aquí no se traduce palabra por palabra: se traduce la dirección del tiempo.\"},{\"id\":\"enb1m11l2e2\",\"type\":\"mc\",\"prompt\":\"El minipar del módulo\",\"question\":\"«Ha dejado de fumar» es…\",\"options\":[\"She's stopped smoking.\",\"She's stopped to smoke.\",\"She's stopped for smoking.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es «se ha parado a fumar»: ha interrumpido lo que hacía para echarse un cigarro. Justo lo contrario.\",\"«for + -ing» dice para qué sirve una cosa, no para qué se para una persona.\"],\"itemIds\":[\"enb1m11stoppedlistening\",\"enb1m6giveup\"],\"tip\":\"Es el ejemplo con el que se enseña esto en medio mundo, y con razón: las dos frases existen, las dos son correctas y significan cosas opuestas. Del módulo 6 ya traías la otra forma de decirlo: «She gave up smoking».\"},{\"id\":\"enb1m11l2e3\",\"type\":\"bucket\",\"prompt\":\"¿La acción ya está hecha, o está por hacer?\",\"categories\":[\"Ya hecha (mira hacia atrás)\",\"Por hacer (mira hacia delante)\"],\"items\":[{\"text\":\"I remember posting the letter.\",\"bucket\":0},{\"text\":\"Remember to sign it.\",\"bucket\":1},{\"text\":\"I forgot to tell you.\",\"bucket\":1},{\"text\":\"I'll never forget seeing that.\",\"bucket\":0},{\"text\":\"I stopped listening.\",\"bucket\":0},{\"text\":\"I stopped to listen.\",\"bucket\":1}],\"itemIds\":[\"enb1m11rememberposting\",\"enb1m11remembertosign\",\"enb1m11forgottotell\",\"enb1m11switchgroup\"],\"tip\":\"Es la única regla del módulo que se puede razonar: -ing mira hacia atrás, «to» mira hacia delante. Si te la quedas, estos seis verbos dejan de darte problemas para siempre.\"},{\"id\":\"enb1m11l2e4\",\"type\":\"transform\",\"prompt\":\"Cambia el sentido sin cambiar el verbo\",\"source\":\"He stopped reading.\",\"instruction\":\"Dilo con el otro sentido: se paró PARA leer\",\"answers\":[\"He stopped to read\",\"He stopped to read.\"],\"translation\":\"Se paró a leer.\",\"hints\":[\"Solo cambia lo que va detrás de «stopped»\",\"He stopped ... read\"],\"itemIds\":[\"enb1m11stoppedlistening\",\"enb1m11stoppedtolisten\"],\"tip\":\"Dos letras de diferencia y la frase entera cambia de significado. En el examen oral eso se llama precisión, y es medio criterio de vocabulario.\"},{\"id\":\"enb1m11l2e5\",\"type\":\"errorfix\",\"prompt\":\"Esto quería decir «lo dejó hace cinco años». Arréglalo.\",\"wrong\":\"He stopped to smoke five years ago.\",\"answers\":[\"He stopped smoking five years ago.\"],\"why\":\"«stop to do» es pararse CON EL FIN DE hacer algo: eso dice que hace cinco años se paró para fumarse un cigarro. Para «dejar de», detrás de «stop» va -ing.\",\"translation\":\"Dejó de fumar hace cinco años.\",\"itemIds\":[\"enb1m11stoppedlistening\"]},{\"id\":\"enb1m11l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa: la carta todavía no está firmada\",\"text\":\"Remember ___ sign it before you hand it in.\",\"answers\":[\"to\"],\"translation\":\"Acuérdate de firmarlo antes de entregarlo.\",\"hints\":[\"La acción está por hacer\",\"Dos letras\"],\"itemIds\":[\"enb1m11remembertosign\"],\"tip\":\"«Remember to…» es la forma normal de recordarle algo a alguien: en un aviso, en una nota en la nevera, en un correo del trabajo. «Remember signing it» sería «acuérdate de cuando lo firmaste», que no es lo que quiere nadie.\"},{\"id\":\"enb1m11l2e7\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué está contando exactamente?\",\"source\":\"We tried talking to them, but nothing changed.\",\"answers\":[\"Probamos a hablar con ellos, pero no cambió nada\",\"Probamos a hablar con ellos, pero nada cambió\",\"Intentamos hablar con ellos a ver si servía, pero no cambió nada\"],\"itemIds\":[\"enb1m11triedtalking\"],\"tip\":\"«Tried talking» no dice que costara hablar con ellos: hablar fue fácil. Lo que dice es que se probó ese método, como quien prueba una medicina. Si hubiera costado, sería «tried to talk».\"},{\"id\":\"enb1m11l2e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Se me olvidó decírtelo.\",\"answers\":[\"I forgot to tell you\",\"I forgot to tell you.\",\"I forgot to say it to you\"],\"hint\":\"La acción no llegó a pasar: mira hacia delante\",\"itemIds\":[\"enb1m11forgottotell\",\"ena2m9explaintogroup\"],\"tip\":\"«tell» lleva la persona pegada, sin preposición: «tell you». Es el montón A del A2 —tell, give, show, send— y aquí vuelve a aparecer sin avisar.\"},{\"id\":\"enb1m11l2e9\",\"type\":\"build\",\"prompt\":\"Construye la frase: la carta ya está echada\",\"target\":\"I remember posting the letter\",\"translation\":\"Me acuerdo de haber echado la carta\",\"distractors\":[\"to\",\"post\"],\"itemIds\":[\"enb1m11rememberposting\"],\"tip\":\"Las dos fichas que sobran forman la otra frase, la que mira hacia delante. Fíjate en que ninguna de las dos está mal: solo dicen otra cosa.\"},{\"id\":\"enb1m11l2e10\",\"type\":\"order\",\"prompt\":\"Ordena la historia del ruido de arriba\",\"sentences\":[\"For three weeks we tried talking to the people upstairs.\",\"Nothing changed, so I stopped going up there.\",\"Last Tuesday I stopped on the stairs to listen, and it was worse than ever.\",\"I remember writing the whole thing down that night, dates and times.\",\"In the end I forgot to send it, and the noise sorted itself out.\"],\"translation\":\"Durante tres semanas probamos a hablar con los de arriba. No cambió nada, así que dejé de subir. El martes pasado me paré en la escalera a escuchar y estaba peor que nunca. Me acuerdo de escribirlo todo esa noche, con fechas y horas. Al final se me olvidó mandarlo, y el ruido se arregló solo.\",\"itemIds\":[\"enb1m11triedtalking\",\"enb1m11stoppedlistening\",\"enb1m11stoppedtolisten\",\"enb1m11rememberposting\",\"enb1m11forgottotell\"],\"tip\":\"Los cinco usos del módulo en cinco frases seguidas, y ninguno se puede cambiar por el otro sin cambiar la historia. Léelas otra vez en orden: así es como suenan de verdad.\"},{\"id\":\"enb1m11l2e11\",\"type\":\"shadow\",\"prompt\":\"Repite pegándote al audio — dos pasadas, la primera más lenta\",\"text\":\"I stopped listening. Then I stopped to listen, and it was worse.\",\"phonetic\":\"ai stopt LÍ-se-ning · den ai stopt tu LÍ-sen, and it uos̬ uées\",\"translation\":\"Dejé de escuchar. Luego me paré a escuchar, y estaba peor.\",\"reps\":2,\"itemIds\":[\"enb1m11stoppedlistening\",\"enb1m11stoppedtolisten\"],\"tip\":\"Escucha la diferencia de ritmo: «stopped listening» va todo seguido y «stopped to listen» tiene un golpecito en el «to». En el habla rápida ese golpecito es toda la pista que hay.\"},{\"id\":\"enb1m11l2e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I remember posting the letter.\",\"translation\":\"Me acuerdo de haber echado la carta.\",\"hints\":[\"Empieza por «I remember…»\",\"I remember ... the letter\"],\"itemIds\":[\"enb1m11rememberposting\"],\"tip\":\"«Posting» en británico es echar al buzón; «mailing» es americano. Y ojo: la «t» de «letter» entre vocales suena a «t» de verdad en el inglés británico estándar, no a «d» como en América.\"},{\"id\":\"enb1m11l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Amy y Valeria, en la cocina. Dos escuchas.\",\"audio\":\"Did you post that thing for the residents' meeting?|I remember putting it in my bag.|That's not the same as posting it.|No. It isn't, is it.|Have a look, then.|It's here. Under everything. In my defence, I tried leaving it by the door so I'd see it, and then I put my coat over it.|Right. So it goes out tomorrow.|It goes out tonight. I'll stop at the postbox on my way to work — no, hang on, that's the wrong direction. I'll do it now.\",\"question\":\"¿Qué ha pasado con el papel?\",\"options\":[\"Sigue en el bolso de Valeria, sin echar\",\"Valeria lo echó ayer y no se acuerda\",\"Amy lo echó por ella\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Se acuerda de meterlo en el bolso, no de echarlo — y Amy le señala justo esa diferencia.\",\"Amy no lo toca: le dice que mire en el bolso.\"],\"itemIds\":[\"enb1m11rememberposting\",\"enb1m11triedtalking\",\"enb1m11residentsassociation\"],\"tip\":\"«I remember putting it in my bag» y «that's not the same as posting it» es la lección entera dicha en dos frases y sin explicar nada. En el examen, esta parte se contesta oyendo qué acción es la que se recuerda.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
