de tres peldaños:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Can I have…?\u003c/b\u003e — normal, rápido, correcto. En una barra, en un pub, con Sam: [[Can I have some water?|¿Me pones agua?]]\u003cbr/\u003e\u003cb\u003e2. Could I have… please?\u003c/b\u003e — el peldaño neutro, el que \u003cb\u003epuntúa en el examen\u003c/b\u003e. Vale con cualquiera: [[Could I have the menu, please?|¿Me trae la carta, por favor?]]\u003cbr/\u003e\u003cb\u003e3. Could you…, please?\u003c/b\u003e — cuando la otra persona tiene que hacer algo: [[Could you bring us some water, please?|¿Nos trae agua, por favor?]]\u003cbr/\u003e\u003cbr/\u003ePara pedir un plato, la fórmula fija: \u003cb\u003eI'd like…\u003c/b\u003e — [[I'd like the chicken, please.|Yo, el pollo, por favor.]] Y ojo: \u003ci\u003eI want the chicken\u003c/i\u003e es correcto gramaticalmente y \u003cb\u003emaleducado\u003c/b\u003e en una mesa. \u003ci\u003eWant\u003c/i\u003e se usa entre amigos, no con quien te sirve.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY responder a una petición\u003c/b\u003e también tiene su fórmula:\u003cbr/\u003e· sí → [[Of course. Here you are.|Claro. Aquí tiene.]]\u003cbr/\u003e· no → [[I'm afraid we don't have any.|Me temo que no nos queda.]] El \u003ci\u003eI'm afraid\u003c/i\u003e es lo que hace que un «no» no duela.\u003cbr/\u003e\u003cbr/\u003eY el \u003cb\u003eplease\u003c/b\u003e, al final. En inglés no es un adorno: es la señal de que aquello era una petición y no una orden."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l8\",\"phaseId\":\"ena2m5\",\"title\":\"Could I have the menu, please?\",\"subtitle\":\"Pedir en inglés: la escalera que decide si suenas educado o mandón\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Reservar, pedir y contestar\",\"itemIds\":[\"ena2m5atablefortwoplease\",\"ena2m5areyoureadytoorder\",\"ena2m5idlikethechicken\",\"ena2m5couldihavethemenu\",\"ena2m5couldyoubringussomewater\",\"ena2m5ofcoursehereyouare\",\"ena2m5imafraidwedonthaveany\",\"enmenu\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«Dame un café» no es maleducado en español. En inglés, sí\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés (lo que suena bien)\",\"lo que NO\"],[\"Ponme un café\",\"Can I have a coffee, please?\",\"Give me a coffee.\"],[\"Tráeme la carta\",\"Could I have the menu, please?\",\"Bring me the menu.\"],[\"Yo, el pollo\",\"I'd like the chicken, please.\",\"I want the chicken.\"],[\"Tráenos agua\",\"Could you bring us some water, please?\",\"Bring us water.\"],[\"Aquí tiene\",\"Of course. Here you are.\",\"—\"],[\"No queda\",\"I'm afraid we don't have any.\",\"No, we don't have.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l8e1\",\"type\":\"bucket\",\"prompt\":\"¿Suena educado o suena a orden?\",\"categories\":[\"educado\",\"orden pelada\"],\"items\":[{\"text\":\"Could I have the menu, please?\",\"bucket\":0},{\"text\":\"Give me the menu.\",\"bucket\":1},{\"text\":\"Can I have a coffee, please?\",\"bucket\":0},{\"text\":\"I want a coffee.\",\"bucket\":1},{\"text\":\"Could you bring us some water?\",\"bucket\":0},{\"text\":\"Bring us water.\",\"bucket\":1}],\"itemIds\":[\"ena2m5couldihavethemenu\",\"ena2m5couldyoubringussomewater\",\"ena2m5idlikethechicken\",\"encanihaveacoffee\"],\"tip\":\"Todas las de la derecha son traducciones literales del español y todas suenan mal. No es cuestión de tono: es que en inglés la petición va en forma de pregunta.\"},{\"id\":\"ena2m5l8e2\",\"type\":\"mc\",\"prompt\":\"En un restaurante con gente que no conoces\",\"question\":\"¿Cuál es la versión que puntúa en el examen?\",\"options\":[\"Could I have the menu, please?\",\"Give me the menu, please.\",\"I want the menu.\"],\"answer\":0,\"whyWrong\":[null,\"El please no salva un imperativo: sigue siendo una orden\",\"want con quien te sirve suena a exigencia\"],\"itemIds\":[\"ena2m5couldihavethemenu\",\"enmenu\"],\"tip\":\"Could I have… es el peldaño neutro: no se queda corto con desconocidos ni suena raro con amigos. Si tuvieras que memorizar una sola fórmula de todo el módulo, esa.\"},{\"id\":\"ena2m5l8e3\",\"type\":\"mc\",\"prompt\":\"Pedir el plato\",\"question\":\"El camarero pregunta «Are you ready to order?». ¿Qué contestas?\",\"options\":[\"I'd like the chicken, please.\",\"I want the chicken.\",\"Give me chicken.\"],\"answer\":0,\"whyWrong\":[null,\"Gramaticalmente correcto, socialmente borde: want no se usa con quien te sirve\",\"Imperativo pelado, lo peor de las tres\"],\"itemIds\":[\"ena2m5idlikethechicken\",\"ena2m5areyoureadytoorder\",\"enchicken\"],\"tip\":\"I'd like es «I would like» contraído, y no se dice entero al hablar: «áid láik». Es LA fórmula del pedido en todo el mundo anglosajón.\"},{\"id\":\"ena2m5l8e4\",\"type\":\"errorfix\",\"prompt\":\"Sube un peldaño la escalera\",\"wrong\":\"Bring me the bill, please.\",\"answers\":[\"Could you bring me the bill, please?\"],\"why\":\"El imperativo con please sigue siendo una orden: el please no cambia la forma de la frase. Lo que la convierte en petición es envolverla en una pregunta: Could you + verbo. Es la diferencia entre pedir y mandar.\",\"translation\":\"¿Me trae la cuenta, por favor?\",\"itemIds\":[\"ena2m5couldyoubringussomewater\",\"ena2m5couldwehavethebill\"]},{\"id\":\"ena2m5l8e5\",\"type\":\"errorfix\",\"prompt\":\"Y el «quiero» que en inglés no se dice\",\"wrong\":\"I want the chicken, please.\",\"answers\":[\"I'd like the chicken, please.\"],\"why\":\"want dice lo que te apetece a ti y no deja hueco a la otra persona; en una mesa suena a exigencia. La fórmula del pedido es I'd like, que es literalmente «me gustaría»: la misma distancia que pone el condicional en español.\",\"translation\":\"Yo, el pollo, por favor.\",\"itemIds\":[\"ena2m5idlikethechicken\",\"enchicken\"]},{\"id\":\"ena2m5l8e6\",\"type\":\"order\",\"prompt\":\"Ordena la escena, de la puerta a la mesa\",\"sentences\":[\"A table for two, please.\",\"Of course. Here you are.\",\"Are you ready to order?\",\"I'd like the chicken, please.\",\"And could you bring us some water?\"],\"translation\":\"Una mesa para dos, por favor. — Claro. Aquí tiene (la carta). — ¿Ya saben lo que van a tomar? — Yo, el pollo, por favor. — ¿Y nos trae agua?\",\"itemIds\":[\"ena2m5atablefortwoplease\",\"ena2m5ofcoursehereyouare\",\"ena2m5areyoureadytoorder\",\"ena2m5idlikethechicken\",\"ena2m5couldyoubringussomewater\"],\"tip\":\"Ese es el guion entero de una mesa en inglés: mesa, carta, pedido, bebida. Si te lo sabes de memoria, la Parte 2 del oral se resuelve sola.\"},{\"id\":\"ena2m5l8e7\",\"type\":\"cloze\",\"prompt\":\"Completa la negativa educada\",\"text\":\"I'm ___ we don't have any soup today.\",\"answers\":[\"afraid\"],\"translation\":\"Me temo que hoy no tenemos sopa.\",\"hints\":[\"Es lo que amortigua el «no»\",\"a…\"],\"itemIds\":[\"ena2m5imafraidwedonthaveany\",\"ena2m5theydonthaveanysoup\"],\"tip\":\"I'm afraid no tiene nada que ver con el miedo: es «me temo». Ábrelo cada vez que tengas que dar una mala noticia, aunque sea mínima.\"},{\"id\":\"ena2m5l8e8\",\"type\":\"build\",\"prompt\":\"Construye la reserva\",\"target\":\"Could I have a table for two please\",\"translation\":\"¿Me da una mesa para dos, por favor?\",\"distractors\":[\"persons\",\"give\"],\"itemIds\":[\"ena2m5atablefortwoplease\",\"ena2m5couldihavethemenu\",\"entable\"],\"tip\":\"Las dos fichas que sobran son los dos calcos: «two persons» (en inglés, two people) y el «give» del imperativo español.\"},{\"id\":\"ena2m5l8e9\",\"type\":\"audiomc\",\"prompt\":\"Escucha al camarero — 2 escuchas\",\"audio\":\"Good evening. Have you got a booking? I'm afraid we don't have any tables free, but there's a table at the bar.\",\"question\":\"¿Qué le pasa al restaurante?\",\"options\":[\"No hay mesas libres\",\"Está cerrado\",\"No sirven cenas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Si estuviera cerrado no te ofrecería la barra\",\"No dice nada de la comida: habla de mesas\"],\"notepad\":true,\"itemIds\":[\"ena2m5imafraidwedonthaveany\",\"ena2m5therearentmanytables\"],\"tip\":\"El «I'm afraid» es la señal: en cuanto lo oigas, lo que viene detrás es un no. Apúntalo en el cuaderno y no hará falta que entiendas el resto.\"},{\"id\":\"ena2m5l8e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — los tres peldaños seguidos\",\"text\":\"Can I have a coffee? Could I have the menu, please? Could you bring us some water?\",\"phonetic\":\"kan ái jav a KO-fi? kud ái jav de ME-niu, plíis̬? kud yu bring as sam UÓ-ta?\",\"translation\":\"¿Me pones un café? ¿Me trae la carta, por favor? ¿Nos trae agua?\",\"itemIds\":[\"encanihaveacoffee\",\"ena2m5couldihavethemenu\",\"ena2m5couldyoubringussomewater\"],\"tip\":\"Fíjate en que las tres suben al final, como las preguntas. Si las dices con entonación de afirmación, vuelves a sonar a orden.\"},{\"id\":\"ena2m5l8e11\",\"type\":\"write\",\"prompt\":\"Escribe al restaurante para reservar — 30-50 palabras\",\"scenario\":\"Quieres reservar mesa en The Green Table para el sábado a las ocho. Sois cuatro y uno de tus amigos no come carne. Escribe el email.\",\"bullets\":[\"Pide la mesa con «Could we…?»: día, hora y cuántos sois\",\"Pregunta si tienen algo sin carne\",\"Pide que te confirmen\"],\"checks\":[{\"re\":\"(could|can) (i|we|you)\",\"label\":\"una petición con could/can\"},{\"re\":\"(without meat|vegetarian|no meat)\",\"label\":\"algo sin carne\"},{\"re\":\"(confirm|let me know|write back)\",\"label\":\"pedir confirmación\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"polite\",\"requireConnectors\":{\"min\":2,\"bank\":[\"and\",\"but\",\"because\",\"so\"]},\"model\":\"Hello, Could we have a table for four on Saturday at eight, please? One of my friends doesn't eat meat, so could you tell me if you have anything without meat? And could you confirm by email, please? Thank you, Valeria\",\"itemIds\":[\"ena2m5atablefortwoplease\",\"ena2m5couldyoubringussomewater\",\"ena2m5meat\"],\"tip\":\"Antes de corregir, cuenta cuántas veces has escrito «I want» o un verbo pelado al principio de una frase. Si hay alguno, ahí se te ha caído el registro — y eso, en el examen, es la mitad de la nota de la tarea.\"},{\"id\":\"ena2m5l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Me trae la carta, por favor? Yo, el pollo.\",\"answers\":[\"Could I have the menu, please? I'd like the chicken.\",\"Could I have the menu, please? I'd like the chicken, please.\",\"Can I have the menu, please? I'd like the chicken.\"],\"hints\":[\"Petición envuelta en pregunta + I'd like para el plato\",\"C… I have the menu, please? I'd l… the chicken.\"],\"itemIds\":[\"ena2m5couldihavethemenu\",\"ena2m5idlikethechicken\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m5-3\",\"book\":\"Could I have a coffee, please?\",\"real\":\"Can I get a coffee, please?\",\"meaning\":\"¿Me pones un café?\",\"when\":\"En cafeterías y sitios de comida rápida, sobre todo con gente joven. Nació en Estados Unidos y hoy se oye por todo Reino Unido, aunque a los mayores les suena brusco. En el examen —oral y escrito— usa Could I have: es la que puntúa como registro neutro.\",\"register\":\"amigos\",\"note\":\"El get sustituye al have y baja medio peldaño la escalera: más rápido, menos formal. Sigue llevando please, que es lo que evita que sea una orden.\",\"sound\":\"kan ái GUET a KO-fi, plíis̬\",\"level\":\"a2\",\"itemId\":\"ena2m5couldihavethemenu\"}}],\"resources\":[{\"label\":\"British Council — A2 Speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca el vídeo de pedir en un restaurante y apunta cada petición que oigas. Verás que ninguna empieza por un verbo pelado: todas van envueltas en pregunta.\"},{\"label\":\"LanguageCert — ESOL A2 Access (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Mira solo la Parte 2 del Spoken: te toca INICIAR la situación (pedir, reservar, quejarte). Esta lección es exactamente el guion de esa parte.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
