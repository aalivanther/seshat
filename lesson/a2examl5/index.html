e. \u003cb\u003eTeil 1\u003c/b\u003e: tarjetas con una palabra de pregunta o un tema — formulas preguntas sencillas a tu compañero sobre su vida y respondes las suyas. \u003cb\u003eTeil 2\u003c/b\u003e: la tarjeta «Von sich erzählen» — hablas de tu propio día a día siguiendo las palabras guía de la tarjeta (tu presentación del A1, ahora en frases hiladas y con pasado: «Gestern habe ich...»). \u003cb\u003eTeil 3\u003c/b\u003e, el que entrena esta lección: os dan una situación y tenéis que \u003cb\u003eplanear algo juntos\u003c/b\u003e — cuándo quedar, qué hacer, qué llevar. Aquí no gana quien más habla: gana quien CONVERSA — propone, reacciona a lo del otro y cierra un acuerdo.\"}},{\"kind\":\"note\",\"note\":{\"title\":\"La partitura de la negociación: proponer → rechazar → alternativa → acuerdo\",\"body\":\"Toda negociación del Teil 3 baila los mismos cuatro pasos. \u003cb\u003eProponer\u003c/b\u003e: \u003cb\u003eWollen wir am Samstag schwimmen gehen?\u003c/b\u003e — Wollen wir + infinitivo al final, la Satzklammer de siempre. \u003cb\u003eAceptar\u003c/b\u003e: \u003cb\u003eGute Idee!\u003c/b\u003e · [[Ja, gern!|¡Sí, con gusto!]] \u003cb\u003eRechazar\u003c/b\u003e (¡siempre con motivo!): \u003cb\u003eDas passt mir nicht\u003c/b\u003e — ¿reconoces el passen + mir del módulo del dativo? — + «Ich muss arbeiten». \u003cb\u003eAlternativa\u003c/b\u003e: [[lieber|mejor / preferiblemente]] am Sonntag! Y \u003cb\u003ecerrar\u003c/b\u003e: \u003cb\u003eEinverstanden!\u003c/b\u003e El error que más puntos cuesta: decir solo ja y nein. El examinador quiere oírte NEGOCIAR — un rechazo con motivo y contrapropuesta vale más que tres síes.\",\"table\":[[\"Paso\",\"Tu frase\"],[\"Proponer\",\"Wollen wir am Samstag schwimmen gehen?\"],[\"Aceptar\",\"Gute Idee! / Ja, gern!\"],[\"Rechazar + motivo\",\"Das passt mir nicht. Ich muss arbeiten.\"],[\"Alternativa\",\"Und am Sonntag? / Lieber am Sonntag!\"],[\"Cerrar\",\"Einverstanden! Bis Sonntag!\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl5e1\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con su paso en la negociación\",\"pairs\":[{\"target\":\"Wollen wir ...?\",\"source\":\"proponer un plan\"},{\"target\":\"Gute Idee!\",\"source\":\"aceptar\"},{\"target\":\"Das passt mir nicht\",\"source\":\"rechazar\"},{\"target\":\"Einverstanden!\",\"source\":\"cerrar el acuerdo\"}],\"itemIds\":[\"a2wollenwir\",\"a2guteidee\",\"a2daspasstmirnicht\",\"a2einverstanden\"]},{\"id\":\"a2examl5e2\",\"type\":\"mc\",\"prompt\":\"Estrategia del Teil 3\",\"question\":\"Tu compañero propone: «Wollen wir am Samstag ins Kino gehen?» — pero tú no puedes. ¿Cuál es la MEJOR respuesta de examen?\",\"options\":[\"Nein.\",\"Das passt mir nicht. Ich muss arbeiten. Und am Sonntag?\",\"Ja. (aunque no puedas)\"],\"answer\":1,\"whyWrong\":[\"Un nein seco mata la conversación — y el Teil 3 puntúa la conversación\",null,\"Decir ja a todo también mata la negociación: no hay nada que planear\"],\"itemIds\":[\"a2daspasstmirnicht\",\"a2wollenwir\"],\"tip\":\"La fórmula de oro: rechazo + motivo + alternativa. Tres frases cortas que demuestran TODO lo que pide el Teil 3.\"},{\"id\":\"a2examl5e3\",\"type\":\"build\",\"prompt\":\"Construye la propuesta\",\"target\":\"Wollen wir am Samstag schwimmen gehen?\",\"translation\":\"¿Qué tal si vamos a nadar el sábado?\",\"distractors\":[\"Willst\",\"kann\"],\"itemIds\":[\"a2wollenwir\",\"a2m1amsamstag\",\"schwimmen\"],\"tip\":\"Wollen wir...? propone SIN mandar: por eso es la llave del Teil 3. El infinitivo gehen cierra la pinza.\"},{\"id\":\"a2examl5e4\",\"type\":\"cloze\",\"prompt\":\"Completa el rechazo elegante\",\"text\":\"Das ___ mir nicht. Ich muss am Samstag arbeiten.\",\"answers\":[\"passt\"],\"translation\":\"Eso no me viene bien. El sábado tengo que trabajar.\",\"hints\":[\"El verbo del dativo que ya conoces de la ropa y las tallas\",\"passen con es/eso: p-a-s-s-t — doble s\"],\"itemIds\":[\"a2daspasstmirnicht\"],\"tip\":\"passen + mir: con ropa es la talla, con planes es la agenda. Mismo dativo, nueva vida en el examen.\"},{\"id\":\"a2examl5e5\",\"type\":\"speak\",\"prompt\":\"El diálogo modelo del Teil 3 — léelo en voz alta haciendo los DOS papeles\",\"text\":\"Wollen wir am Samstag schwimmen gehen? — Das passt mir nicht. Ich muss arbeiten. Lieber am Sonntag! — Gute Idee! Einverstanden!\",\"phonetic\":\"VO-len via am ZAMS-taak SHVI-men GUÉE-en? — das past mia nijt. ij mus AR-bai-ten. LÍI-ba am ZON-taak! — GUU-te i-DÉE! ÁIN-fer-shtan-den!\",\"translation\":\"¿Vamos a nadar el sábado? — No me viene bien. Tengo que trabajar. ¡Mejor el domingo! — ¡Buena idea! ¡De acuerdo!\",\"itemIds\":[\"a2wollenwir\",\"a2daspasstmirnicht\",\"a2guteidee\",\"a2einverstanden\"],\"tip\":\"Ensaya los dos papeles: en el examen no eliges cuál te toca. La partitura entera dura quince segundos.\"},{\"id\":\"a2examl5e6\",\"type\":\"order\",\"prompt\":\"Ordena la negociación completa del Teil 3\",\"sentences\":[\"Wollen wir am Samstag ins Kino gehen?\",\"Das passt mir nicht. Am Samstag muss ich arbeiten.\",\"Und am Sonntag? Hast du am Sonntag Zeit?\",\"Ja, super! Am Sonntag habe ich Zeit.\",\"Gute Idee! Einverstanden — bis Sonntag!\"],\"translation\":\"¿Vamos al cine el sábado? — No me viene bien: el sábado trabajo. — ¿Y el domingo? ¿Tienes tiempo? — ¡Sí, genial! El domingo tengo tiempo. — ¡Buena idea! De acuerdo, ¡hasta el domingo!\",\"hints\":[\"La partitura: proponer → rechazar con motivo → alternativa → aceptar → cerrar\",\"Einverstanden siempre cierra el trato\"],\"itemIds\":[\"a2wollenwir\",\"a2daspasstmirnicht\",\"hastduzeit\",\"a2guteidee\",\"a2einverstanden\"],\"tip\":\"Esta secuencia ES el Teil 3 entero. Si te sale ordenarla, te sale improvisarla con cualquier plan que te den.\"},{\"id\":\"a2examl5e7\",\"type\":\"cloze\",\"prompt\":\"Completa la aceptación\",\"text\":\"Gute ___! Wollen wir um drei Uhr gehen?\",\"answers\":[\"Idee\"],\"translation\":\"¡Buena idea! ¿Vamos a las tres?\",\"hints\":[\"Como «idea» en español, casi igual\",\"I mayúscula: es sustantivo — y doble e final\"],\"itemIds\":[\"a2guteidee\",\"a2wollenwir\"]},{\"id\":\"a2examl5e8\",\"type\":\"listen\",\"prompt\":\"Escucha el cierre del trato\",\"text\":\"Einverstanden! Bis Sonntag!\",\"translation\":\"¡De acuerdo! ¡Hasta el domingo!\",\"hints\":[\"Empieza con Ein-\",\"ei suena «ai»: ÁIN-fer-shtan-den\"],\"itemIds\":[\"a2einverstanden\"]},{\"id\":\"a2examl5e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción: tu turno en la negociación\",\"question\":\"Propón: «¿Qué tal si vamos a nadar el domingo?»\",\"answers\":[\"Wollen wir am Sonntag schwimmen gehen?\",\"Wollen wir am Sonntag schwimmen gehen\"],\"hints\":[\"Wollen wir + el resto + infinitivos al final\",\"am Sonntag en medio; schwimmen gehen cierra\"],\"itemIds\":[\"a2wollenwir\",\"a2m1amsonntag\",\"schwimmen\"],\"tip\":\"Cambia Sonntag por Kino, Park o Café y tienes propuestas infinitas: la plantilla trabaja, tú solo pones el plan.\"}]}],\"resources\":[{\"label\":\"Goethe — materiales de práctica A2\",\"url\":\"https://www.goethe.de/ins/us/en/spr/prf/ueb/pa2.html\",\"note\":\"Mira el video de ejemplo del Sprechen A2: fíjate en el Teil 3 — cómo los candidatos proponen, rechazan con motivo y cierran. Es exactamente la partitura de esta lección.\"},{\"label\":\"Easy German — conversaciones reales\",\"url\":\"https://www.youtube.com/@EasyGerman\",\"note\":\"Busca «making plans in German»: la negociación de esta lección, dicha por gente de la calle.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]
