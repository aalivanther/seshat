 ella, \u003cb\u003etheir\u003c/b\u003e = de ellos. La elección depende SOLO del dueño — nunca de la cosa poseída: [[his sister|su hermana (de él)]] · [[her brother|su hermano (de ella)]]\u003cbr/\u003e\u003cbr/\u003eEl \u003cb\u003emy\u003c/b\u003e y el \u003cb\u003eyour\u003c/b\u003e ya los usas desde el módulo 1 (my name, your name). Se suman \u003cb\u003eour\u003c/b\u003e (nuestro) y \u003cb\u003etheir\u003c/b\u003e (de ellos). Y una buena noticia: los posesivos NUNCA cambian — my brothers, sin «*mys».\",\"table\":[[\"español\",\"inglés\",\"ejemplo\"],[\"mi\",\"my\",\"my family\"],[\"tu\",\"your\",\"your name\"],[\"su (de él)\",\"his\",\"his sister\"],[\"su (de ella)\",\"her\",\"her brother\"],[\"nuestro/a\",\"our\",\"our mother\"],[\"su (de ellos)\",\"their\",\"their son\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m2l4e1\",\"type\":\"mc\",\"prompt\":\"Mira al dueño\",\"question\":\"La hermana DE BEN → «su hermana» =\",\"options\":[\"his sister\",\"her sister\",\"their sister\"],\"answer\":0,\"whyWrong\":[null,\"her = de ELLA — y el dueño aquí es Ben, un hombre\",\"their = de ELLOS — aquí el dueño es uno solo\"],\"itemIds\":[\"enhis\"],\"tip\":\"Pregúntate siempre: ¿de quién es? Ben → his. Amy → her. Ben y Amy → their.\"},{\"id\":\"ena1m2l4e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿his o her?\",\"categories\":[\"his (de él)\",\"her (de ella)\"],\"items\":[{\"text\":\"Ben → ___ sister\",\"bucket\":0},{\"text\":\"Amy → ___ brother\",\"bucket\":1},{\"text\":\"mi padre → ___ name\",\"bucket\":0},{\"text\":\"mi madre → ___ family\",\"bucket\":1},{\"text\":\"Sam → ___ son\",\"bucket\":0},{\"text\":\"Nora → ___ husband\",\"bucket\":1}],\"itemIds\":[\"enhis\",\"enher\"],\"tip\":\"La cosa poseída da igual: solo importa si el dueño es él o ella.\"},{\"id\":\"ena1m2l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa — la dueña es tu madre\",\"text\":\"This is my mother. ___ name is Rosa.\",\"answers\":[\"Her\"],\"translation\":\"Esta es mi madre. Se llama Rosa.\",\"hints\":[\"El nombre es de ELLA\",\"h-e-r\"],\"itemIds\":[\"enher\",\"enhernameis\",\"enmother\"]},{\"id\":\"ena1m2l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa — el dueño es tu padre\",\"text\":\"This is my father. ___ name is Óscar.\",\"answers\":[\"His\"],\"translation\":\"Este es mi padre. Se llama Óscar.\",\"hints\":[\"El nombre es de ÉL\",\"h-i-s\"],\"itemIds\":[\"enhis\",\"enhisnameis\",\"enfather\"]},{\"id\":\"ena1m2l4e5\",\"type\":\"build\",\"prompt\":\"Construye la presentación de Amy\",\"target\":\"Her name is Amy\",\"translation\":\"Ella se llama Amy (su nombre es Amy)\",\"distractors\":[\"His\",\"he\"],\"itemIds\":[\"enhernameis\",\"enher\"]},{\"id\":\"ena1m2l4e6\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Our mother is from Bogotá.\",\"translation\":\"Nuestra madre es de Bogotá.\",\"hints\":[\"Empieza con «nuestro»\",\"Our mother is from ...\"],\"itemIds\":[\"enour\",\"enmother\",\"eniamfrom\"]},{\"id\":\"ena1m2l4e11\",\"type\":\"gapbank\",\"prompt\":\"Completa la foto de Valeria — sobran palabras del banco\",\"text\":\"This is a photo of my family in Bogotá. My father is next to ___ wife, my mother Rosa. My sister is with ___ husband, and these are ___ two children. My brother Andrés and I are in the middle, with ___ grandparents.\",\"answers\":[\"his\",\"her\",\"their\",\"our\"],\"bank\":[\"his\",\"her\",\"their\",\"our\",\"my\",\"your\"],\"translation\":\"Esta es una foto de mi familia en Bogotá. Mi padre está al lado de su mujer, mi madre Rosa. Mi hermana está con su marido, y estos son sus dos hijos. Mi hermano Andrés y yo estamos en el medio, con nuestros abuelos.\",\"hints\":[\"Antes de cada hueco, pregúntate: ¿de QUIÉN es?\",\"El último: «mi hermano y yo» somos dos → nosotros\"],\"itemIds\":[\"enhis\",\"enher\",\"entheir\",\"enour\"],\"tip\":\"Los cuatro «su» del español, uno detrás de otro. Manda siempre el dueño: padre → his, hermana → her, la pareja → their, nosotros → our.\"},{\"id\":\"ena1m2l
