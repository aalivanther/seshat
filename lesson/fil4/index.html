o de lógica\",\"No — se aprende cada palabra con su artículo\"],\"answer\":1,\"whyWrong\":[\"Prueba de fuego: das Mädchen (la chica) es neutro. La lógica pierde\",null],\"itemIds\":[\"dasart\"],\"tip\":\"No es mala noticia: como no hay que razonar, solo hay que mirar. Y la app te lo muestra siempre.\"},{\"id\":\"fil4e4\",\"type\":\"mc\",\"prompt\":\"La estrategia\",\"question\":\"¿Cómo conviene memorizar la palabra «Hund»?\",\"options\":[\"Solo «Hund» — el artículo ya vendrá\",\"Siempre «der Hund», artículo y palabra como un bloque\"],\"answer\":1,\"whyWrong\":[\"Aprenderla suelta obliga a re-aprenderla después — sale el doble de caro\",null],\"itemIds\":[\"hund\",\"derart\"],\"hints\":[\"¿Qué te acaba de decir la nota de arriba?\"]},{\"id\":\"fil4e5\",\"type\":\"mc\",\"prompt\":\"¿Coinciden los idiomas?\",\"question\":\"«das Auto» es neutro, pero «el coche» es masculino. ¿Los géneros coinciden entre alemán y español?\",\"options\":[\"Siempre\",\"A veces sí, a veces no — por eso el artículo se aprende con la palabra\"],\"answer\":1,\"whyWrong\":[\"Ojalá — pero das Auto y die Sonne (el sol) demuestran lo contrario\",null],\"itemIds\":[\"dasart\",\"auto\"]},{\"id\":\"fil4e6\",\"type\":\"mc\",\"prompt\":\"El bonus del plural\",\"question\":\"En plural (los perros, las gatas, los coches), ¿qué artículo usan TODOS?\",\"options\":[\"der\",\"die\",\"das\"],\"answer\":1,\"whyWrong\":[\"der es solo masculino singular\",null,\"das es solo neutro singular\"],\"itemIds\":[\"dieart\"],\"tip\":\"die Hunde, die Katzen, die Autos. En plural el género desaparece: siempre die.\"},{\"id\":\"fil4e7\",\"type\":\"mc\",\"prompt\":\"La regla de oro, con tu ancla nueva\",\"question\":\"¿Por qué «Musik» se escribe con mayúscula en medio de una frase?\",\"options\":[\"Porque es palabra importada\",\"Porque en alemán TODOS los sustantivos van con mayúscula\",\"Es un error tipográfico\"],\"answer\":1,\"whyWrong\":[\"No importa el origen: Taxi, Hund y Katze la llevan igual\",null,\"Nada de error
