h|obligatorios]].\u003cbr/\u003eCompara: \u003ci\u003eEs ist schwer, sich zu entscheiden\u003c/i\u003e (hablado) ↔ \u003cb\u003eDie Entscheidung fällt mir schwer\u003c/b\u003e (escrito). La segunda es la que puntúa en el Schreiben.\",\"table\":[[\"lernen\",\"das Lernen\"],[\"lesen\",\"das Lesen · beim Lesen\"],[\"sich entscheiden\",\"die Entscheidung\"],[\"sich verändern\",\"die Veränderung\"],[\"sich vorbereiten\",\"die Vorbereitung\"],[\"erfahren\",\"die Erfahrung\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l4e1\",\"type\":\"mc\",\"prompt\":\"¿Cuál suena a texto escrito de B1?\",\"question\":\"Quieres escribir «tomar la decisión me cuesta» en un comentario de foro.\",\"options\":[\"Es ist schwer für mich, mich zu entscheiden.\",\"Die Entscheidung fällt mir schwer.\",\"Ich kann nicht entscheiden was.\"],\"answer\":1,\"whyWrong\":[\"Correcto, pero es registro hablado: en el examen suma menos en Wortschatz\",null,\"Agramatical: falta el objeto y el orden está roto\"],\"itemIds\":[\"b1m11zkentscheidung\"],\"tip\":\"Nominalizar = decir lo mismo con menos verbos y más peso. Es el gesto de estilo del nivel.\"},{\"id\":\"b1m11l4e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica cada sustantivo por su fábrica\",\"categories\":[\"das + Infinitiv\",\"die …-ung\"],\"items\":[{\"text\":\"das Lernen\",\"bucket\":0},{\"text\":\"die Entscheidung\",\"bucket\":1},{\"text\":\"das Rauchen\",\"bucket\":0},{\"text\":\"die Vorbereitung\",\"bucket\":1},{\"text\":\"das Reisen\",\"bucket\":0},{\"text\":\"die Veränderung\",\"bucket\":1}],\"itemIds\":[\"b1m11zkdaslernen\",\"b1m11zkentscheidung\",\"b1m11zkvorbereitung\",\"b1m11zkveraenderung\"],\"tip\":\"Regla sin excepciones prácticas: infinitivo nominalizado → das. Terminación -ung → die.\"},{\"id\":\"b1m11l4e3\",\"type\":\"match\",\"prompt\":\"Empareja verbo y sustantivo\",\"pairs\":[{\"target\":\"sich entscheiden → die Entscheidung\",\"source\":\"decidirse → la decisión\"},{\"target\":\"sich vorbereiten → die Vorbereitung\",\
