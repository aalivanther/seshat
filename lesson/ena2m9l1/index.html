u\u003ela\u003c/u\u003e vi», «\u003cu\u003ele\u003c/u\u003e ayudé», «\u003cu\u003enos\u003c/u\u003e espera». En inglés va \u003cb\u003esiempre detrás\u003c/b\u003e, pegado al verbo: \u003cb\u003eI saw \u003cu\u003eher\u003c/u\u003e\u003c/b\u003e, \u003cb\u003eI helped \u003cu\u003ehim\u003c/u\u003e\u003c/b\u003e, \u003cb\u003eHe's waiting for \u003cu\u003eus\u003c/u\u003e\u003c/b\u003e. \u003ci\u003eI her saw\u003c/i\u003e no existe en ningún registro y suena a traducción de máquina.\u003cbr/\u003e\u003cbr/\u003eRecuerda además la regla que cerraste en el módulo 3: \u003cb\u003eentre el verbo y su objeto no se mete nada\u003c/b\u003e. Por eso es [[I saw her this morning.|La vi esta mañana.]] y nunca \u003ci\u003eI saw this morning her\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTras preposición, la misma fila de abajo.\u003c/b\u003e Aquí el inglés te lo pone fácil: \u003ci\u003efor me\u003c/i\u003e, \u003ci\u003ewith him\u003c/i\u003e, \u003ci\u003enext to her\u003c/i\u003e, \u003ci\u003ebetween us\u003c/i\u003e, \u003ci\u003eabout them\u003c/i\u003e. Una sola forma para todo, mientras el español cambia entre «mí/ti» y «él/ella».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso caro: el objeto que el español calla.\u003c/b\u003e «No lo encuentro», «no lo sé», «ya lo he hecho» — el español puede dejarlo caer si está claro. El inglés \u003cb\u003eno\u003c/b\u003e: si el verbo lleva objeto, el objeto se dice. \u003cb\u003e[[I can't find it.|No lo encuentro.]]\u003c/b\u003e, no \u003ci\u003eI can't find\u003c/i\u003e. Es el mismo hueco que el \u003ci\u003eit\u003c/i\u003e de \u003ci\u003eIt rained\u003c/i\u003e del módulo 1, pero al otro lado del verbo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l1\",\"phaseId\":\"ena2m9\",\"title\":\"I saw her this morning\",\"subtitle\":\"Los pronombres que en español van delante y en inglés van detrás\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Hablar de gente sin repetir su nombre\",\"itemIds\":[\"ena2m9objectgroup\",\"ena2m9isawherthismorning\",\"ena2m9ihelpedhimwiththeboxes\",\"ena2m9icantfindit\",\"ena2m9waitforus\",\"enflatmate\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos filas de pronombres, y la segunda es nueva\",\"body\":\"$17\",\"table\":[[\"quien lo hace\",\"quien lo recibe\",\"ejemplo\"],[\"I\",\"me\",\"Amy phoned me.\"],[\"you\",\"you\",\"I saw you at the bus stop.\"],[\"he\",\"him\",\"I helped him with the boxes.\"],[\"she\",\"her\",\"I saw her this morning.\"],[\"it\",\"it\",\"I can't find it.\"],[\"we\",\"us\",\"Wait for us!\"],[\"they\",\"them\",\"I don't know them.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l1e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — la fila de arriba ya es tuya desde el A1\",\"pairs\":[{\"target\":\"he\",\"source\":\"él\"},{\"target\":\"she\",\"source\":\"ella\"},{\"target\":\"his\",\"source\":\"su (de él)\"},{\"target\":\"her\",\"source\":\"su (de ella)\"},{\"target\":\"their\",\"source\":\"su (de ellos)\"}],\"targetSeconds\":25,\"itemIds\":[\"enhe\",\"enshe\",\"enhis\",\"enher\",\"entheir\"],\"tip\":\"Ojo a «her», que hace dos trabajos: «su (de ella)» y «la / le». Es la única palabra que aparece en las dos filas con dos oficios distintos.\"},{\"id\":\"ena2m9l1e2\",\"type\":\"match\",\"prompt\":\"Empareja cada pronombre de objeto con lo que significa\",\"pairs\":[{\"target\":\"me\",\"source\":\"me / a mí\"},{\"target\":\"him\",\"source\":\"lo / le (a él)\"},{\"target\":\"her\",\"source\":\"la / le (a ella)\"},{\"target\":\"us\",\"source\":\"nos / a nosotros\"},{\"target\":\"them\",\"source\":\"los / les (a ellos)\"}],\"itemIds\":[\"ena2m9objectgroup\"],\"tip\":\"Donde el español reparte entre «lo» y «le» según el caso, el inglés usa una sola palabra. Menos que decidir.\"},{\"id\":\"ena2m9l1e3\",\"type\":\"bucket\",\"prompt\":\"¿Hace la acción o la recibe?\",\"categories\":[\"hace la acción (sujeto)\",\"la recibe (objeto)\"],\"items\":[{\"text\":\"I\",\"bucket\":0},{\"text\":\"me\",\"bucket\":1},{\"text\":\"he\",\"bucket\":0},{\"text\":\"him\",\"bucket\":1},{\"text\":\"we\",\"bucket\":0},{\"text\":\"us\",\"bucket\":1},{\"text\":\"they\",\"bucket\":0},{\"text\":\"them\",\"bucket\":1}],\"itemIds\":[\"ena2m9objectgroup\",\"enhe\"],\"tip\":\"Truco de un segundo: si va delante del verbo, es de los de arriba; si va detrás del verbo o detrás de una preposición, es de los de abajo.\"},{\"id\":\"ena2m9l1e4\",\"type\":\"mc\",\"prompt\":\"Dónde se coloca\",\"question\":\"«La vi esta mañana» en inglés es…\",\"options\":[\"I saw her this morning.\",\"I her saw this morning.\",\"I saw this morning her.\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el orden español: el pronombre delante del verbo. En inglés va detrás, sin excepción\",\"Entre el verbo y su objeto no se mete nada — la regla del módulo 3, aplicada aquí\"],\"itemIds\":[\"ena2m9isawherthismorning\"],\"tip\":\"Verbo primero, objeto pegado detrás. Todo lo demás —la hora, el sitio, el modo— se coloca después.\"},{\"id\":\"ena2m9l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el pronombre que toca\",\"text\":\"Amy is in the kitchen. Can you help ___ with the shopping?\",\"answers\":[\"her\"],\"translation\":\"Amy está en la cocina. ¿Puedes ayudarla con la compra?\",\"hints\":[\"Amy es «ella», y aquí RECIBE la ayuda\",\"h…\"],\"itemIds\":[\"encanyouhelpme\",\"eninthekitchen\"]},{\"id\":\"ena2m9l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa con el pronombre que toca\",\"text\":\"Ben was late, so I helped ___ with the boxes.\",\"answers\":[\"him\"],\"translation\":\"Ben llegó tarde, así que le ayudé con las cajas.\",\"hints\":[\"Ben es «él» y aquí recibe la ayuda\",\"h…\"],\"itemIds\":[\"ena2m9ihelpedhimwiththeboxes\",\"ena2m2soiwalked\"]},{\"id\":\"ena2m9l1e7\",\"type\":\"gapbank\",\"prompt\":\"La noche de las llaves perdidas — rellena con el pronombre\",\"text\":\"Ben lost his key, so I gave ___ mine. Amy and Nora were in the kitchen, so I asked ___ about it. In the end Ben found ___ under the sofa.\",\"answers\":[\"him\",\"them\",\"it\"],\"bank\":[\"him\",\"them\",\"it\",\"her\",\"us\",\"me\"],\"translation\":\"Ben perdió su llave, así que le di la mía. Amy y Nora estaban en la cocina, así que les pregunté. Al final Ben la encontró debajo del sofá.\",\"itemIds\":[\"ena2m9objectgroup\",\"ena2m2ilostmyphone\",\"ena2m2ifounditinmybag\",\"ensofa\"],\"tip\":\"Los tres huecos los decide el CONTEXTO, no la gramática: los seis pronombres del banco encajan igual de bien en el hueco. Lee quién es quién antes de elegir.\"},{\"id\":\"ena2m9l1e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden español\",\"wrong\":\"I her saw this morning.\",\"answers\":[\"I saw her this morning.\"],\"why\":\"En español el pronombre se agarra delante del verbo («la vi») y en inglés va detrás, siempre. No hay ni un caso en todo el idioma en que el objeto vaya delante del verbo.\",\"translation\":\"La vi esta mañana.\",\"itemIds\":[\"ena2m9isawherthismorning\"]},{\"id\":\"ena2m9l1e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el objeto que se ha caído\",\"wrong\":\"I can't find.\",\"answers\":[\"I can't find it.\"],\"why\":\"El español puede callarse el «lo» cuando ya se sabe de qué hablas («no encuentro» suena raro, pero «no lo encuentro» y «no encuentro las llaves» son las dos opciones). El inglés no tiene esa tercera vía: si el verbo pide objeto, el objeto se escribe. Lo mismo con I know it, I did it, I like it.\",\"translation\":\"No lo encuentro.\",\"itemIds\":[\"ena2m9icantfindit\"],\"tip\":\"Regla mecánica: detrás de find, know, do, like, want, need y see nunca hay un hueco. O va el nombre de la cosa, o va it.\"},{\"id\":\"ena2m9l1e10\",\"type\":\"transform\",\"prompt\":\"Sustituye el nombre por un pronombre\",\"source\":\"I saw Amy and Nora at the bus stop.\",\"instruction\":\"Cambia «Amy and Nora» por el pronombre que toca\",\"answers\":[\"I saw them at the bus stop.\"],\"translation\":\"Las vi en la parada.\",\"hints\":[\"Dos personas, y reciben la acción\",\"I saw t… at the bus stop.\"],\"itemIds\":[\"ena2m9objectgroup\",\"enbusstop\"]},{\"id\":\"ena2m9l1e11\",\"type\":\"build\",\"prompt\":\"Construye la frase de la parada\",\"target\":\"Wait for us at the bus stop\",\"translation\":\"Espéranos en la parada\",\"distractors\":[\"we\",\"to\"],\"itemIds\":[\"ena2m9waitforus\",\"enbusstop\"],\"tip\":\"Dos fichas sobran a propósito: «we» es de la fila de arriba y aquí toca la de abajo, y wait pide FOR, nunca TO.\"},{\"id\":\"ena2m9l1e12\",\"type\":\"listen\",\"prompt\":\"Dictado — dos pronombres en una frase\",\"text\":\"I saw her this morning and I helped him with the boxes.\",\"translation\":\"La vi esta mañana y le ayudé con las cajas.\",\"hints\":[\"Uno es «ella» y el otro es «él», los dos detrás del verbo\",\"I saw h… this morning and I helped h… with the boxes.\"],\"itemIds\":[\"ena2m9isawherthismorning\",\"ena2m9ihelpedhimwiththeboxes\"]},{\"id\":\"ena2m9l1e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tres objetos seguidos\",\"text\":\"I phoned her, I helped him and I waited for them.\",\"phonetic\":\"ái FÓUND jee, ái JELPT jim and ái UÉI-tid foo dem\",\"translation\":\"La llamé, le ayudé y los esperé.\",\"itemIds\":[\"ena2m1phoned\",\"ena2m9ihelpedhimwiththeboxes\",\"ena2m9objectgroup\"],\"tip\":\"Fíjate en dónde caen: siempre después del verbo, sin nada en medio. Y las tres -ed cerradas, que de eso va la clínica del módulo 1.\"},{\"id\":\"ena2m9l1e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Los vi ayer, pero no me dijeron nada.\",\"answers\":[\"I saw them yesterday, but they didn't tell me anything.\",\"I saw them yesterday but they didn't tell me anything.\",\"I saw them yesterday, but they said nothing to me.\"],\"hints\":[\"Objeto detrás del verbo las dos veces\",\"I saw t… yesterday, but they didn't tell m… anything.\"],\"itemIds\":[\"ena2m9objectgroup\",\"ena2m9didyoutellhim\",\"enyesterday\"],\"tip\":\"Ahí van los dos: «los» detrás de saw, «me» detrás de tell. Y de paso ya has escrito la primera frase del cubo de la lección siguiente.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-1\",\"book\":\"Can you help me?\",\"real\":\"Give us a hand, would you?\",\"meaning\":\"Échame una mano, ¿quieres?\",\"when\":\"Entre compañeros de piso, amigos y compañeros de trabajo, para pedir ayuda con algo pequeño y físico: una caja, una mesa, la compra. En el examen escribe Could you help me, please?: «give us a hand» es de cocina, no de Writing.\",\"register\":\"amigos\",\"note\":\"Y ojo al detalle que te descoloca: ese «us» quiere decir «me». En el inglés hablado de Reino Unido, us se cuela con frecuencia donde el libro pondría me. No lo produzcas todavía; reconócelo al oírlo.\",\"sound\":\"guiv as a JAND, uud yu\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Personal pronouns\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/personal-pronouns-it-them\",\"note\":\"Lee la ficha y haz los ejercicios. Fíjate solo en una cosa: dónde está colocado el pronombre en cada frase de ejemplo. Siempre detrás.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"
