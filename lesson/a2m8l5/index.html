nta que ya conoces del A1: \u003cb\u003e„Was fehlt Ihnen?“\u003c/b\u003e — y tú respondes con tus síntomas: \u003ci\u003eIch habe Halsschmerzen und Fieber\u003c/i\u003e. El diagnóstico afina: \u003cb\u003edie Erkältung\u003c/b\u003e (resfriado — leve, tu palabra de f8) o \u003cb\u003edie Grippe\u003c/b\u003e (gripe — con fiebre y todo el cuerpo dolido). El médico aconseja con Sie (\u003ci\u003eSie sollten im Bett bleiben\u003c/i\u003e) y te da \u003cb\u003edas Rezept\u003c/b\u003e (la receta): con él vas a la Apotheke y te dan la \u003cb\u003eTablette\u003c/b\u003e o la \u003cb\u003eSalbe\u003c/b\u003e (pomada — para el Rücken, por ejemplo). Y si el dolor es de muelas, la fábrica de palabras fabrica al especialista: Zahn + Arzt = \u003cb\u003eder Zahnarzt\u003c/b\u003e. Despedida de manual: \u003ci\u003eGute Besserung!\u003c/i\u003e\",\"table\":[[\"paso\",\"frase del guion\"],[\"1 · llamar\",\"Ich brauche einen Termin\"],[\"2 · el médico pregunta\",\"Was fehlt Ihnen?\"],[\"3 · tú respondes\",\"Ich habe Halsschmerzen und Fieber\"],[\"4 · consejo\",\"Sie sollten im Bett bleiben\"],[\"5 · la receta\",\"Hier ist ein Rezept\"],[\"6 · despedida\",\"Gute Besserung!\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m8l5e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit médico A2\",\"pairs\":[{\"target\":\"das Rezept\",\"source\":\"la receta\"},{\"target\":\"die Salbe\",\"source\":\"la pomada\"},{\"target\":\"der Zahnarzt\",\"source\":\"el dentista\"},{\"target\":\"die Grippe\",\"source\":\"la gripe\"}],\"itemIds\":[\"a2m8rezept\",\"a2m8salbe\",\"a2m8zahnarzt\",\"a2m8grippe\"]},{\"id\":\"a2m8l5e2\",\"type\":\"mc\",\"prompt\":\"¿Erkältung o Grippe?\",\"question\":\"Fiebre alta y te duele todo el cuerpo →\",\"options\":[\"die Grippe\",\"die Erkältung\"],\"answer\":0,\"whyWrong\":[null,\"La Erkältung es el resfriado leve: tos y nariz — con fiebre alta el médico dice Grippe\"],\"itemIds\":[\"a2m8grippe\",\"erkaeltung\",\"fieber\"],\"tip\":\"Erkältung = molestia; Grippe
