\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T574,El \u003cb\u003eHören Teil 4\u003c/b\u003e del examen es una discusión radiofónica con tres voces: un moderador y dos invitados. La tarea no es entenderlo todo, es \u003cb\u003eatribuir\u003c/b\u003e: ¿quién dice qué?\u003cbr/\u003e\u003cbr/\u003eEstrategia que hay que automatizar:\u003cbr/\u003e1. Antes del audio tienes \u003cb\u003e60 segundos\u003c/b\u003e para leer las afirmaciones. Úsalos: subraya la palabra clave de cada una.\u003cbr/\u003e2. Escucha buscando \u003cb\u003epostura\u003c/b\u003e, no palabras. Casi nunca dicen «ich bin dafür»; dicen \u003ci\u003e«Also, ich sehe da kein Problem»\u003c/i\u003e o \u003ci\u003e«Da bin ich [[skeptisch|escéptico]]»\u003c/i\u003e.\u003cbr/\u003e3. Las tres voces repiten las mismas palabras clave: \u003ci\u003eHandy\u003c/i\u003e, \u003ci\u003eSchule\u003c/i\u003e, \u003ci\u003eRegeln\u003c/i\u003e. Si te guías por ellas, fallas. Guíate por el \u003cb\u003etono\u003c/b\u003e y por los conectores: \u003ci\u003eallerdings\u003c/i\u003e, \u003ci\u003etrotzdem\u003c/i\u003e, \u003ci\u003eich verstehe das, aber…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eFórmulas de postura que hay que reconocer al vuelo:\u003cbr/\u003e\u003cb\u003ea favor\u003c/b\u003e: \u003ci\u003eIch bin dafür.\u003c/i\u003e · \u003ci\u003eDas finde ich richtig.\u003c/i\u003e · \u003ci\u003eDa spricht nichts dagegen.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003een contra\u003c/b\u003e: \u003ci\u003eIch bin dagegen.\u003c/i\u003e · \u003ci\u003eDas halte ich für falsch.\u003c/i\u003e · \u003ci\u003eDavon halte ich nichts.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde lo practicas de verdad:\u003c/b\u003e el cierre de oído de esta lección son textos cortos del Teil 1 (que sí son cortos en el examen). El Teil 4 completo —tres minutos de debate, tres voces y las OCHO afirmaciones seguidas— cierra la última lección del módulo. Ahí es donde se ve si aguantas."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m4l7\",\"phaseId\":\"b1m4\",\"title\":\"Handys im Unterricht\",\"subtitle\":\"Escuchar el debate: padres, profesora y alumnos\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario del aula\",\"itemIds\":[\"b1m4derunterricht\",\"b1m4dieaufmerksamkeit\",\"b1m4regelnvereinbaren\",\"b1m4suechtig\",\"b1m4diewerbung\",\"b1m4derdatenschutz\",\"b1m4derkommentar\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Escuchar una discusión a tres voces\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l7e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario del aula\",\"pairs\":[{\"target\":\"der Unterricht\",\"source\":\"la clase (la enseñanza)\"},{\"target\":\"die Aufmerksamkeit\",\"source\":\"la atención\"},{\"target\":\"Regeln vereinbaren\",\"source\":\"acordar normas\"},{\"target\":\"der Datenschutz\",\"source\":\"la protección de datos\"}],\"itemIds\":[\"b1m4derunterricht\",\"b1m4dieaufmerksamkeit\",\"b1m4regelnvereinbaren\",\"b1m4derdatenschutz\"]},{\"id\":\"b1m4l7e2\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje del instituto a las familias · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist das Sekretariat der Gesamtschule Nord, eine Information für die Eltern der siebten Klassen. Ein komplettes Handyverbot halten wir für falsch, die Geräte gehören zum Alltag der Jugendlichen. Im Unterricht werden die Handys aber stummgeschaltet und liegen in der Box. Diese Regel haben wir mit den Schülerinnen und Schülern gemeinsam vereinbart, ähm, und deshalb funktioniert sie auch.\",\"question\":\"„In dieser Schule sind Handys komplett verboten.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Ein komplettes Handyverbot halten wir für falsch»: en clase se silencian y se guardan, nada más\",null],\"itemIds\":[\"b1m4derunterricht\",\"b1m4stummschalten\"],\"tip\":\"«halten wir für falsch» = estamos en contra. Nadie dice «wir sind dagegen»: la postura hay que inferirla.\"},{\"id\":\"b1m4l7e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist das Sekretariat der Gesamtschule Nord, eine Information für die Eltern der siebten Klassen. Ein komplettes Handyverbot halten wir für falsch, die Geräte gehören zum Alltag der Jugendlichen. Im Unterricht werden die Handys aber stummgeschaltet und liegen in der Box. Diese Regel haben wir mit den Schülerinnen und Schülern gemeinsam vereinbart, ähm, und deshalb funktioniert sie auch.\",\"question\":\"¿Por qué funciona la norma, según el centro?\",\"options\":[\"Porque se acordó con el propio alumnado\",\"Porque hay una sanción para quien la incumple\",\"Porque los móviles se guardan en secretaría\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De sanciones no se dice nada\",\"Se guardan en una caja del aula, no en secretaría\"],\"itemIds\":[\"b1m4regelnvereinbaren\"]},{\"id\":\"b1m4l7e3\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje de voz de un padre a un amigo · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Hey, ich bin's. Du, wegen gestern Abend — sorry, dass ich so genervt war. Meine Tochter ist praktisch süchtig, sie scrollt beim Frühstück, sie scrollt im Bus, und abends ärgere ich mich jedes Mal über dieselbe Diskussion. In der Schule wird jetzt über ein Verbot abgestimmt, und ehrlich: Das würde uns zu Hause wirklich helfen. Ähm, meld dich mal, ja?\",\"question\":\"„Der Vater ist gegen ein Verbot in der Schule.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Das würde uns zu Hause wirklich helfen»: lo está deseando\",null],\"itemIds\":[\"b1m4suechtig\",\"b1m4scrollen\",\"b1m4sichaergernueber\"],\"tip\":\"Su postura no se dice, se deduce del Konjunktiv II: «würde uns helfen». En el examen la opinión casi nunca viene con etiqueta.\"},{\"id\":\"b1m4l7e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Hey, ich bin's. Du, wegen gestern Abend — sorry, dass ich so genervt war. Meine Tochter ist praktisch süchtig, sie scrollt beim Frühstück, sie scrollt im Bus, und abends ärgere ich mich jedes Mal über dieselbe Diskussion. In der Schule wird jetzt über ein Verbot abgestimmt, und ehrlich: Das würde uns zu Hause wirklich helfen. Ähm, meld dich mal, ja?\",\"question\":\"¿Qué espera el padre de una prohibición en el colegio?\",\"options\":[\"Que le facilite las cosas en casa\",\"Que su hija saque mejores notas\",\"Que el colegio le quite el móvil para siempre\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No menciona las notas en ningún momento\",\"Se habla de una prohibición en clase, no de confiscar el móvil\"],\"itemIds\":[\"b1m4muesste\"]},{\"id\":\"b1m4l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la frase de la profesora\",\"text\":\"Im Unterricht werden die Handys ___.\",\"answers\":[\"stummgeschaltet\"],\"translation\":\"En clase los móviles se silencian.\",\"hints\":[\"Pasiva + verbo separable: el ge- va en medio\",\"stumm + ge + schaltet\"],\"itemIds\":[\"b1m4stummschalten\",\"b1m4derunterricht\"],\"tip\":\"Separable en participio: stumm-GE-schaltet, como ein-GE-kauft. Y en pasiva, al final de la frase.\"},{\"id\":\"b1m4l7e5\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la postura\",\"text\":\"Davon halte ich nichts\",\"translation\":\"Eso no me parece nada bien / no le veo sentido\",\"hints\":[\"Empieza por un da-Kompositum\",\"Davon halte ich ...\"],\"itemIds\":[\"b1m4ichbindagegen\"]},{\"id\":\"b1m4l7e6\",\"type\":\"shadow\",\"prompt\":\"Sombrea la fórmula de postura\",\"text\":\"Ein komplettes Verbot halte ich für falsch.\",\"phonetic\":\"ain kom-PLE-tes fea-BOOT JAL-te ij füa falsh\",\"translation\":\"Una prohibición total me parece equivocada.\",\"reps\":2,\"itemIds\":[\"b1m4dasverbot\",\"b1m4ichbindagegen\"],\"tip\":\"«halte ich für + adjetivo» es un chunk de opinión de nivel alto y sale gratis: memorízalo entero.\"},{\"id\":\"b1m4l7e7\",\"type\":\"hearreal\",\"prompt\":\"Escucha — ¿qué significa la frase?\",\"book\":\"Hast du dein Handy dabei?\",\"real\":\"Hast du dein Natel dabei?\",\"translation\":\"¿Llevas el móvil encima?\",\"ask\":\"meaning\",\"meaningOptions\":[\"¿Llevas el móvil encima?\",\"¿Tienes batería en el móvil?\",\"¿Me prestas tu ordenador?\"],\"itemIds\":[\"b1m4natnatel\",\"a2m3handy\"]},{\"id\":\"b1m4l7e8\",\"type\":\"bucket\",\"prompt\":\"¿Está a favor o en contra? (Hören Teil 4)\",\"categories\":[\"Dafür\",\"Dagegen\"],\"items\":[{\"text\":\"Da spricht nichts dagegen.\",\"bucket\":0},{\"text\":\"Davon halte ich nichts.\",\"bucket\":1},{\"text\":\"Das finde ich richtig.\",\"bucket\":0},{\"text\":\"Das halte ich für falsch.\",\"bucket\":1},{\"text\":\"Ich sehe da kein Problem.\",\"bucket\":0},{\"text\":\"Da bin ich sehr skeptisch.\",\"bucket\":1}],\"itemIds\":[\"b1m4ichbindafuer\",\"b1m4ichbindagegen\"],\"tip\":\"Ninguna dice «dafür» o «dagegen». Así es el examen: la postura está en la formulación, no en la etiqueta.\"},{\"id\":\"b1m4l7e9\",\"type\":\"gapbank\",\"prompt\":\"Completa las normas del colegio\",\"text\":\"Im Unterricht ___ die Handys stummgeschaltet. Die Regeln ___ mit den Schülern vereinbart. ___ die Pausen achtet niemand.\",\"answers\":[\"werden\",\"werden\",\"Auf\"],\"bank\":[\"werden\",\"wird\",\"Auf\",\"Über\",\"An\",\"ist\"],\"translation\":\"En clase los móviles se silencian. Las normas se acuerdan con los alumnos. Nadie vigila las pausas.\",\"itemIds\":[\"b1m4derunterricht\",\"b1m4regelnvereinbaren\",\"b1m4achtenauf\"],\"tip\":\"Dos pasivas en plural y un bloque con rección: achten AUF. Todo el módulo en tres frases.\"},{\"id\":\"b1m4l7e10\",\"type\":\"build\",\"prompt\":\"Construye la norma acordada\",\"target\":\"Wir haben die Regeln gemeinsam vereinbart\",\"translation\":\"Hemos acordado las normas juntos\",\"distractors\":[\"werden\",\"vereinbaren\"],\"itemIds\":[\"b1m4regelnvereinbaren\"]},{\"id\":\"b1m4l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me molesta la publicidad en cada aplicación.\",\"answers\":[\"Ich ärgere mich über die Werbung in jeder App\"],\"hints\":[\"sich ärgern + preposición con Akkusativ\",\"Ich ärgere mich ... die Werbung ...\"],\"itemIds\":[\"b1m4sichaergernueber\",\"b1m4diewerbung\"]},{\"id\":\"b1m4l7e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: megafonía para el último ciclo · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Eine Durchsage an die Oberstufe: Wir haben eure Rückmeldungen gelesen. Ihr habt recht, ihr seid achtzehn, und wir sprechen euch die Aufmerksamkeit nicht ab. Deshalb testen wir ab Montag Folgendes: In der Oberstufe bleiben die Handys in der Tasche, nicht in der Box. Wenn das vier Wochen lang klappt, bleibt es so. Und wenn nicht, ähm, dann reden wir noch einmal darüber.\",\"question\":\"„In der Oberstufe müssen die Handys ab Montag in die Box.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«In der Oberstufe bleiben die Handys in der Tasche, nicht in der Box»\",null],\"itemIds\":[\"b1m4dieaufmerksamkeit\",\"b1m4derunterricht\"],\"tip\":\"La afirmación repite palabra por palabra («Box», «ab Montag») lo que sí suena en el audio… y aun así es falsa. Oír la palabra no es entender la frase.\"},{\"id\":\"b1m4l7e15\",\"type\":\"audiomc\",\"prompt\":\"Misma megafonía, segunda tarea. Dos escuchas.\",\"audio\":\"Eine Durchsage an die Oberstufe: Wir haben eure Rückmeldungen gelesen. Ihr habt recht, ihr seid achtzehn, und wir sprechen euch die Aufmerksamkeit nicht ab. Deshalb testen wir ab Montag Folgendes: In der Oberstufe bleiben die Handys in der Tasche, nicht in der Box. Wenn das vier Wochen lang klappt, bleibt es so. Und wenn nicht, ähm, dann reden wir noch einmal darüber.\",\"question\":\"¿Qué pasa si la prueba sale bien durante cuatro semanas?\",\"options\":[\"Que la norma se queda como está\",\"Que se amplía a todos los cursos\",\"Que se vuelve a votar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De los demás cursos no se dice nada\",\"Volver a hablarlo es lo que pasaría si NO funciona\"],\"itemIds\":[\"b1m4erlauben\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m4-3\",\"book\":\"Hast du dein Handy dabei?\",\"real\":\"Hast du dein Natel dabei?\",\"meaning\":\"¿Llevas el móvil encima?\",\"when\":\"Solo en Suiza. Ojo al matiz: fue LA palabra durante décadas y sigue viva sobre todo entre gente mayor y en el suizo alemán hablado, pero los jóvenes usan Handy con toda normalidad. En Austria y Alemania, siempre Handy — y en el examen también, con Sie si no es un amigo.\",\"register\":\"regional\",\"exam\":\"Haben Sie Ihr Handy dabei?\",\"note\":\"«Natel» viene de Nationales Autotelefon y era la marca de la red suiza. Es el ejemplo perfecto de que el examen es plurizéntrico: puede caerte en un texto suizo, con nota al pie. Entenderla es obligatorio; usarla, opcional.\",\"sound\":\"jast du dain NA-tel da-BAI\",\"level\":\"b1\",\"itemId\":\"b1m4natnatel\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Hören)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"El Teil 4 es esta discusión a tres voces. Escúchalo una sola vez y compara: así es el examen.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42
