otas al revés\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El léxico del cole — para contar tus años de escuela\",\"itemIds\":[\"a2m3schule\",\"a2m3grundschule\",\"a2m3gymnasium\",\"a2m3klasse\",\"a2m3fach\",\"a2m3note\",\"a2m3mathe\",\"a2m3meinlieblingsfach\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La cultura detrás: el cole alemán y sus notas al revés\",\"body\":\"En Alemania todos empiezan en la \u003cb\u003eGrundschule\u003c/b\u003e (primaria, clases 1 a 4). Después, los que siguen la vía académica van al \u003cb\u003eGymnasium\u003c/b\u003e — ¡nada que ver con el gimnasio! Es el instituto que lleva al Abitur (la selectividad). Cada materia es un \u003cb\u003eFach\u003c/b\u003e (plural F\u003cb\u003eä\u003c/b\u003echer, con Umlaut — como Land → Länder), y tu favorita es tu \u003cb\u003eLieblingsfach\u003c/b\u003e, igual que tu Lieblingshobby del A1. Ahora la sorpresa: las \u003cb\u003eNoten\u003c/b\u003e van del 1 al 6 y ¡el \u003cb\u003e1 es la MEJOR\u003c/b\u003e! Para contar tu escuela solo necesitas tu war de a2m2: \u003ci\u003eMein Lieblingsfach \u003cb\u003ewar\u003c/b\u003e Mathe. Meine Noten \u003cb\u003ewaren\u003c/b\u003e gut.\u003c/i\u003e\",\"table\":[[\"die Note\",\"significado\"],[\"1 — sehr gut\",\"sobresaliente (¡la mejor!)\"],[\"2 — gut\",\"notable\"],[\"3 — befriedigend\",\"bien\"],[\"4 — ausreichend\",\"suficiente (aprobado por poco)\"],[\"5 — mangelhaft\",\"insuficiente\"],[\"6 — ungenügend\",\"muy deficiente (la peor)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m3l3e1\",\"type\":\"match\",\"prompt\":\"Empareja el cole alemán\",\"pairs\":[{\"target\":\"die Grundschule\",\"source\":\"la primaria\"},{\"target\":\"das Gymnasium\",\"source\":\"el instituto\"},{\"target\":\"die Klasse\",\"source\":\"el curso\"},{\"target\":\"die Note\",\"source\":\"la nota\"}],\"itemIds\":[\"a2m3grundschule\",\"a2m3gymnasium\",\"a2m3klasse\",\"a2m3note\"]},{\"id\":\"a2m3l3e2\",\"type\":\"mc\",\"prompt\":\"El dato cultural que nadie se espera\",\"question\":\"En el cole alemán, la mejor nota es ...\",\"options\":[\"die Eins (1)\",\"die Sechs (6)\",\"die Zehn (10)\"],\"answer\":0,\"whyWrong\":[null,\"¡Al revés! La 6 es la peor: ungenügend\",\"Las Noten van del 1 al 6 — el 10 no existe\"],\"itemIds\":[\"a2m3note\"],\"tip\":\"eine Eins schreiben = sacar un 10. Si un alemán te dice que sacó «una uno», ¡felicítalo!\"},{\"id\":\"a2m3l3e3\",\"type\":\"mc\",\"prompt\":\"El falso amigo\",\"question\":\"„das Gymnasium“ =\",\"options\":[\"el instituto\",\"el gimnasio\",\"la universidad\"],\"answer\":0,\"whyWrong\":[null,\"El gimnasio de las pesas es «das Fitnessstudio» — falso amigo clásico\",\"La universidad es «die Universität» — al Gymnasium se va antes\"],\"itemIds\":[\"a2m3gymnasium\"],\"tip\":\"Gymnasium = instituto académico que acaba en el Abitur. Para sudar, los alemanes van al Fitnessstudio.\"},{\"id\":\"a2m3l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el pasado que ya conoces\",\"text\":\"Mein Lieblingsfach ___ Mathe. (era)\",\"answers\":[\"war\"],\"translation\":\"Mi asignatura favorita eran las mates.\",\"hints\":[\"Estado en pasado → el w-a-r de a2m2\",\"w-a-r\"],\"itemIds\":[\"a2m3meinlieblingsfach\",\"a2m3mathe\",\"a2m3fach\"],\"tip\":\"Lieblings- + Fach, como Lieblingshobby en el A1. Y war porque hablas de tus años de escuela.\"},{\"id\":\"a2m3l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa el plural — ¡Umlaut!\",\"text\":\"Deutsch, Mathe und Sport — das sind drei ___. (asignaturas)\",\"answers\":[\"Fächer\"],\"translation\":\"Alemán, mates y educación física — son tres asignaturas.\",\"hints\":[\"Plural de das Fach: la a toma Umlaut\",\"F-ä-c-h-e-r, con mayúscula\"],\"itemIds\":[\"a2m3fach\"],\"strictUmlaut\":true,\"tip\":\"das Fach → die Fächer, como das Land → die Länder. «Facher» sin Umlaut cuenta como error.\"},{\"id\":\"a2m3l3e6\",\"type\":\"cloze\",\"prompt\":\"Completa — el examen de mates (¡y su ü!)\",\"text\":\"Morgen habe ich eine ___ in Mathe. (examen)\",\"answers\":[\"Prüfung\"],\"translation\":\"Mañana tengo un examen de mates.\",\"hints\":[\"Tu palabra de la fase de examen A1\",\"Prü-fung, con ü\"],\"itemIds\":[\"pruefung\",\"a2m3mathe\"],\"strictUmlaut\":true,\"tip\":\"die Prüfung conserva su ü siempre — y «morgen + presente» sigue siendo tu futuro de la fase 11.\"},{\"id\":\"a2m3l3e7\",\"type\":\"mc\",\"prompt\":\"¿Grundschule o Gymnasium?\",\"question\":\"Lara ist acht Jahre alt und geht in die dritte Klasse. ¿Dónde está?\",\"options\":[\"In der Grundschule\",\"Im Gymnasium\"],\"answer\":0,\"whyWrong\":[null,\"Al Gymnasium se pasa después de la 4. Klasse — con ocho años Lara sigue en la primaria\"],\"itemIds\":[\"a2m3grundschule\",\"a2m3gymnasium\",\"a2m3klasse\"]},{\"id\":\"a2m3l3e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Mein Lieblingsfach war Mathe\",\"translation\":\"Mi asignatura favorita eran las mates\",\"hints\":[\"Lieblings- + Fach + war\",\"Mathe con th = t simple\"],\"itemIds\":[\"a2m3meinlieblingsfach\",\"a2m3mathe\"]},{\"id\":\"a2m3l3e9\",\"type\":\"build\",\"prompt\":\"Construye el recuerdo de escuela\",\"target\":\"In der Schule war Mathe mein Lieblingsfach\",\"translation\":\"En la escuela, mates era mi asignatura favorita\",\"altTargets\":[\"Mathe war in der Schule mein Lieblingsfach\"],\"distractors\":[\"ist\",\"hatte\"],\"itemIds\":[\"a2m3schule\",\"a2m3mathe\",\"a2m3meinlieblingsfach\"],\"tip\":\"In der Schule abre → war 2º. Estado del pasado → war, nunca «ist» si cuentas tu infancia.\"},{\"id\":\"a2m3l3e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Mi asignatura favorita eran las mates\",\"answers\":[\"Mein Lieblingsfach war Mathe\"],\"hints\":[\"Lieblingsfach + war\",\"Mein Lieblingsfach war ...\"],\"itemIds\":[\"a2m3meinlieblingsfach\",\"a2m3mathe\",\"a2m3fach\"],\"tip\":\"La frase comodín del tema «Schule» en el oral A2 — cámbiale el Fach y es tuya para siempre.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-a2m3-1\",\"book\":\"Es war okay.\",\"real\":\"Na ja, es war okay.\",\"meaning\":\"Bueno... estuvo bien (con matiz de «más o menos»)\",\"when\":\"Al abrir una respuesta sincera pero tibia: «Wie waren deine Noten?» — «Na ja...». En un correo formal no se escribe.\",\"register\":\"neutral\",\"note\":\"Na ja gana medio segundo y avisa: viene una respuesta con matices. La oirás en cada entrevista de calle.\",\"sound\":\"na YAA — es vaa o-KEE\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"Nicos Weg — «Schule» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Las unidades A2 sobre la escuela: Grundschule, Gymnasium y las Noten explicadas con video.\"},{\"label\":\"lingua.com — lecturas A2\",\"url\":\"https://lingua.com/german/reading/\",\"note\":\"Busca los textos sobre «Schule»: este léxico exacto en textos con preguntas de comprensión.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqp
