scuchar, presentarse y negociar condiciones\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de una entrevista\",\"itemIds\":[\"b1m2sichvorstellen\",\"b1m2staerken\",\"b1m2teamfaehig\",\"b1m2einstellen\",\"b1m2probezeit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la entrevista alemana tiene guion, y lo puedes memorizar\",\"body\":\"$17\",\"table\":[[\"pregunta\",\"qué se espera\",\"fórmula\"],[\"Erzählen Sie über sich\",\"trayectoria en 2 min\",\"Ich habe … studiert / gearbeitet\"],[\"Ihre Stärken?\",\"2-3, con ejemplo\",\"Ich bin teamfähig, zum Beispiel …\"],[\"Ihre Schwächen?\",\"1, con solución\",\"Ich bin ungeduldig, deshalb …\"],[\"Haben Sie Fragen?\",\"SIEMPRE tener 2\",\"Könnten Sie mir sagen, …?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l7e1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje de la empresa en el buzón de voz · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Ortega, hier ist die Firma Hanselmann, Personalabteilung. Wir haben Ihre Bewerbung bekommen und würden Sie gern kennenlernen. Passt Ihnen Donnerstag um vierzehn Uhr? Das Gespräch dauert etwa eine Stunde. Bringen Sie bitte nichts mit, Ihre Unterlagen haben wir alle — erzählen Sie uns einfach, was Sie bisher gemacht haben und warum Sie sich bei uns beworben haben. Rufen Sie kurz zurück, ja?\",\"question\":\"„Frau Ortega soll ihre Unterlagen zum Gespräch mitbringen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Bringen Sie bitte nichts mit, Ihre Unterlagen haben wir alle»\",null],\"itemIds\":[\"b1m2vorstellungsgespraech\",\"b1m2sichbewerbenbei\"],\"tip\":\"Lee la afirmación antes de reproducir. Ese reflejo es la mitad del Teil 1.\"},{\"id\":\"b1m2l7e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Ortega, hier ist die Firma Hanselmann, Personalabteilung. Wir haben Ihre Bewerbung bekommen und würden Sie gern kennenlernen. Passt Ihnen Donnerstag um vierzehn Uhr? Das Gespräch dauert etwa eine Stunde. Bringen Sie bitte nichts mit, Ihre Unterlagen haben wir alle — erzählen Sie uns einfach, was Sie bisher gemacht haben und warum Sie sich bei uns beworben haben. Rufen Sie kurz zurück, ja?\",\"question\":\"¿Qué le piden a la candidata en la entrevista?\",\"options\":[\"Que cuente su trayectoria y por qué se presenta a este puesto\",\"Que explique cuánto quiere ganar\",\"Que diga cuándo puede empezar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El sueldo no se menciona en el mensaje\",\"Tampoco se habla de la fecha de incorporación\"],\"itemIds\":[\"b1m2vorstellungsgespraech\"]},{\"id\":\"b1m2l7e2\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: segundo mensaje de la empresa, con las condiciones · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Frau Ortega, hier noch mal die Personalabteilung, Sie hatten nach den Arbeitsbedingungen gefragt. Also: Die Arbeitszeit ist bei uns flexibel, Sie können zwischen sieben und zehn Uhr anfangen, die Kernzeit ist von zehn bis fünfzehn Uhr. Zwei Tage pro Woche können Sie im Homeoffice arbeiten, mehr leider nicht. Und die Probezeit dauert sechs Monate, das ist bei uns Standard. Alles Weitere dann im Gespräch.\",\"question\":\"„Man kann bei dieser Firma jeden Tag im Homeoffice arbeiten.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Zwei Tage pro Woche …, mehr leider nicht»\",null],\"itemIds\":[\"b1m2homeoffice\",\"b1m2probezeit\"],\"tip\":\"«Zwei Tage pro Woche» — dos días, no todos. En el examen los números son casi siempre lo que discrimina.\"},{\"id\":\"b1m2l7e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Frau Ortega, hier noch mal die Personalabteilung, Sie hatten nach den Arbeitsbedingungen gefragt. Also: Die Arbeitszeit ist bei uns flexibel, Sie können zwischen sieben und zehn Uhr anfangen, die Kernzeit ist von zehn bis fünfzehn Uhr. Zwei Tage pro Woche können Sie im Homeoffice arbeiten, mehr leider nicht. Und die Probezeit dauert sechs Monate, das ist bei uns Standard. Alles Weitere dann im Gespräch.\",\"question\":\"¿Qué NO ofrece la empresa?\",\"options\":[\"Teletrabajo todos los días\",\"Horario flexible de entrada\",\"Un periodo de prueba de seis meses\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Sí: se puede entrar entre las siete y las diez\",\"Sí: la Probezeit dura seis meses\"],\"itemIds\":[\"b1m2kernzeit\"]},{\"id\":\"b1m2l7e3\",\"type\":\"match\",\"prompt\":\"Empareja las piezas de la entrevista\",\"pairs\":[{\"target\":\"teamfähig\",\"source\":\"capaz de trabajar en equipo\"},{\"target\":\"die Probezeit\",\"source\":\"el periodo de prueba\"},{\"target\":\"das Vorstellungsgespräch\",\"source\":\"la entrevista de trabajo\"},{\"target\":\"das Gehalt\",\"source\":\"el sueldo\"}],\"itemIds\":[\"b1m2teamfaehig\",\"b1m2probezeit\",\"b1m2vorstellungsgespraech\",\"b1m2gehalt\"]},{\"id\":\"b1m2l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la presentación\",\"text\":\"Darf ich mich kurz ___?\",\"answers\":[\"vorstellen\"],\"translation\":\"¿Me permite presentarme brevemente?\",\"hints\":[\"Separable: vor|stellen\",\"Con modal vuelve entero al final\"],\"itemIds\":[\"b1m2sichvorstellen\"],\"tip\":\"«sich vorstellen» tiene dos vidas: presentarse (acusativo) e imaginarse algo (dativo: Ich stelle mir vor, dass…). El caso las separa.\"},{\"id\":\"b1m2l7e5\",\"type\":\"shadow\",\"prompt\":\"Sombrea la pregunta que hay que hacer siempre\",\"text\":\"Könnten Sie mir sagen, wie ein normaler Arbeitstag aussieht?\",\"phonetic\":\"KÖN-ten zii mia ZAA-guen, vii ain nor-MAA-la AR-baits-taak AUS-siit\",\"translation\":\"¿Podría decirme cómo es un día de trabajo normal?\",\"reps\":2,\"itemIds\":[\"b1m2koenntensie\",\"a2m10arbeitstag\"],\"tip\":\"Repítela hasta que salga sin pensar. Es la pregunta que salva el «Haben Sie Fragen?» final.\"},{\"id\":\"b1m2l7e6\",\"type\":\"mc\",\"prompt\":\"Fuga de registro\",\"question\":\"En una entrevista, ¿cuál de estas frases NO puedes decir?\",\"options\":[\"Kannst du mir sagen, wie viel ich verdiene?\",\"Könnten Sie mir sagen, wie hoch das Gehalt ist?\",\"Wäre es möglich, im Homeoffice zu arbeiten?\"],\"answer\":0,\"whyWrong\":[null,\"Perfecta: Sie + Konjunktiv II\",\"Perfecta: la fórmula para lo delicado\"],\"itemIds\":[\"b1m2gehalt\",\"b1m2koenntensie\"],\"tip\":\"El «du» en una entrevista no es un error de gramática: es un error pragmático, y esos se perdonan menos.\"},{\"id\":\"b1m2l7e7\",\"type\":\"build\",\"prompt\":\"Construye la pregunta delicada\",\"target\":\"Wäre es möglich, zwei Tage im Homeoffice zu arbeiten\",\"translation\":\"¿Sería posible teletrabajar dos días?\",\"distractors\":[\"Würde\",\"arbeiten zu\"],\"itemIds\":[\"b1m2waereesmoeglich\",\"b1m2homeoffice\"],\"tip\":\"«zu arbeiten» al final del todo: el «zu» se pega al infinitivo y ambos cierran la frase.\"},{\"id\":\"b1m2l7e8\",\"type\":\"hearreal\",\"prompt\":\"Escucha — ¿qué significa?\",\"book\":\"Das kann ich noch nicht genau sagen.\",\"real\":\"Kommt drauf an.\",\"translation\":\"Depende.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Depende\",\"Estoy totalmente de acuerdo\",\"No tengo ni idea del tema\"],\"itemIds\":[\"b1m2natkommtdraufan\"],\"tip\":\"«Kommt drauf an» = «Es kommt darauf an» sin el sujeto y con darauf comido. Se dice cien veces al día; en un examen escrito, la versión entera.\"},{\"id\":\"b1m2l7e9\",\"type\":\"gapbank\",\"prompt\":\"Completa las respuestas de la candidata\",\"text\":\"Ich bin sehr ___ und arbeite gern im Team. Meine größte ___ ist, dass ich manchmal ungeduldig bin. ___ mache ich mir immer einen genauen Plan.\",\"answers\":[\"teamfähig\",\"Schwäche\",\"Deshalb\"],\"bank\":[\"teamfähig\",\"Schwäche\",\"Deshalb\",\"Stärke\",\"obwohl\",\"erreichbar\"],\"translation\":\"Soy muy capaz de trabajar en equipo y me gusta trabajar en grupo. Mi mayor debilidad es que a veces soy impaciente. Por eso siempre me hago un plan detallado.\",\"itemIds\":[\"b1m2teamfaehig\",\"b1m2staerken\",\"a2m6deshalb\",\"a2m10plan\"],\"tip\":\"La receta de la debilidad: dila, y a continuación di qué haces con ella. Nunca la dejes sola.\"},{\"id\":\"b1m2l7e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la buena noticia\",\"text\":\"Wir stellen Sie ein\",\"translation\":\"Le contratamos\",\"hints\":[\"Separable: einstellen\",\"Wir stellen Sie ...\"],\"itemIds\":[\"b1m2einstellen\"]},{\"id\":\"b1m2l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Sería posible empezar media hora más tarde?\",\"answers\":[\"Wäre es möglich, eine halbe Stunde später anzufangen?\",\"Wäre es möglich, eine halbe Stunde später zu beginnen?\"],\"hints\":[\"Wäre + es möglich, ... zu ...\",\"El separable parte el zu: an-zu-fangen\"],\"itemIds\":[\"b1m2waereesmoeglich\",\"stunde\"],\"strictUmlaut\":true,\"tip\":\"«anzufangen»: en los separables el zu se cuela EN MEDIO. Igual que el ge- del Perfekt. Misma lógica, otro tiempo.\"},{\"id\":\"b1m2l7e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: la empresa explica cómo sigue el proceso · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Ortega, Personalabteilung Hanselmann. Ich erklär Ihnen kurz, wie es weitergeht, damit Sie nicht warten müssen. Also: Diese Woche haben wir noch vier Gespräche. Nächsten Dienstag entscheiden wir intern, und am Mittwoch bekommen alle eine Rückmeldung — auch die Absagen, ähm, das ist uns wichtig. Wenn es klappt, fangen Sie am Ersten des Monats an, mit sechs Monaten Probezeit. Schönen Tag noch!\",\"question\":\"„Nur wer die Stelle bekommt, hört noch einmal von der Firma.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«am Mittwoch bekommen alle eine Rückmeldung — auch die Absagen»\",null],\"itemIds\":[\"b1m2vorstellungsgespraech\",\"b1m2probezeit\"],\"tip\":\"Dos días seguidos en una frase, martes y miércoles, con dos hechos distintos. Ahí es donde el examen te tiende la trampa.\"},{\"id\":\"b1m2l7e15\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Ortega, Personalabteilung Hanselmann. Ich erklär Ihnen kurz, wie es weitergeht, damit Sie nicht warten müssen. Also: Diese Woche haben wir noch vier Gespräche. Nächsten Dienstag entscheiden wir intern, und am Mittwoch bekommen alle eine Rückmeldung — auch die Absagen, ähm, das ist uns wichtig. Wenn es klappt, fangen Sie am Ersten des Monats an, mit sechs Monaten Probezeit. Schönen Tag noch!\",\"question\":\"¿Cuándo recibirán respuesta los candidatos?\",\"options\":[\"El miércoles de la semana que viene\",\"El martes, en cuanto se decida\",\"Solo si los seleccionan\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El martes deciden en interno; avisan al día siguiente\",\"Dice expresamente que también avisan a los rechazados\"],\"itemIds\":[\"b1m2einstellen\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m2-3\",\"book\":\"Das kann ich noch nicht genau sagen.\",\"real\":\"Kommt drauf an.\",\"meaning\":\"Depende\",\"when\":\"En conversación informal, todo el rato. En una entrevista o por escrito no vale así: además de comerse el «Es» y de recortar «darauf», dejar la respuesta ahí suena a que esquivas la pregunta — en el examen se completa con la subordinada.\",\"register\":\"amigos\",\"exam\":\"Das kommt ganz darauf an, wie viel Zeit ich habe.\",\"note\":\"«Es kommt darauf an» pierde el «Es» y el «darauf» se come a «drauf». Es la respuesta más útil del alemán cuando necesitas un segundo para pensar.\",\"sound\":\"komt drauf an\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m2natkommtdraufan\"}}],\"resources\":[{\"label\":\"DW — Bewerbungstraining\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Bewerbung» y «Vorstellungsgespräch»: diálogos completos con transcripción.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\
