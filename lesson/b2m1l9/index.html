ic/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6d9,"])</script><script>self.__next_f.push([1,"\u003ci\u003eLee la historia en voz alta. Lo nuevo va glosado.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e1. Am Dienstag um acht las Sofía die Schlagzeile in der S-Bahn. Clara Hofmann, eine Journalistin, die sie vom Kiez kennt, hatte über Nordlicht geschrieben.\u003cbr/\u003e2. Nico schrieb als Erster: «Ist das wahr?» Sofía tippte, löschte, tippte noch einmal. Sie schrieb nicht ja. Sie schrieb: «Einer Quelle zufolge.»\u003cbr/\u003e3. Anna, die Nachbarin, war klarer: «Das ist doch Quatsch. Die Firma will doch nur ablenken.» Anna ist Krankenschwester, nicht Juristin, und «Quatsch» ist ihre Form von dementieren.\u003cbr/\u003e4. Leo kam zu spät, wie immer, und hatte den Leitartikel nicht gelesen. «Stand in der Zeitung», sagte er, als hätte das die Sache erledigt.\u003cbr/\u003e5. Am Abend gab Nordlicht eine kurze Pressekonferenz. Der Sprecher betonte, die Firma habe anonymisierte Statistiken weitergegeben, nicht personenbezogene Daten. Die Vorwürfe bestritten sie. Eine interne Quelle wolle namentlich nicht genannt werden, räumte er ein — und setzte hinterher: sie habe ein Motiv.\u003cbr/\u003e6. Clara Hofmann saß in der ersten Reihe. Sie notierte im Konjunktiv I. Nicht aus Eleganz: aus Handwerk. Was der Sprecher sagte, gehörte dem Sprecher.\u003cbr/\u003e7. Lucía Ortega schrieb aus Valencia: «Y tú qué opinas?» Sofía antwortete auf Spanisch, und dann noch einmal auf Deutsch, sachlich: «Ich distanziere mich von der Schlagzeile. Die Recherche ist nicht fertig.»\u003cbr/\u003e8. Herr Vogel, der Nachbar, hatte das Boulevardblatt im Briefkasten. «Die schreiben laut», sagte er. Sofía lächelte. Laut der Quelle, dachte sie. Nicht laut.\u003cbr/\u003e9. Drei Tage später stellte sich heraus, dass die Meldung übertrieben gewesen war. Sofía öffnete den Chat mit Nico und schrieb nur: «Siehste. Deshalb sei, nicht ist.»"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m1l9\",\"phaseId\":\"b2m1\",\"title\":\"Sofía zitiert, ohne zu unterschreiben\",\"subtitle\":\"La historia del módulo y tu primer Vortrag de cuatro minutos\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas\",\"itemIds\":[\"b2m1indirekterede\",\"b2m1sachlich\",\"b2m1pressekonferenz\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sofía zitiert: drei Stimmen, ein Chat\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 2-3)\",\"question\":\"Warum schreibt Sofía nicht einfach «ja»?\",\"options\":[\"Porque no ha leído la noticia\",\"Porque no quiere firmar lo que una fuente afirma\",\"Porque Anna le ha dicho que es Quatsch\"],\"answer\":1,\"whyWrong\":[\"La ha leído en la S-Bahn\",null,\"Anna escribe después, y Sofía ya había contestado a Nico\"],\"itemIds\":[\"b2m1zufolge\",\"b2m1quelle\"]},{\"id\":\"b2m1l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (frase 6)\",\"question\":\"Warum notiert Clara Hofmann im Konjunktiv I?\",\"options\":[\"Porque el Konjunktiv I suena más elegante\",\"Porque así el enunciado sigue siendo del portavoz, no suyo\",\"Porque no se fía de su propio alemán\"],\"answer\":1,\"whyWrong\":[\"El texto dice «Nicht aus Eleganz: aus Handwerk»\",null,\"Es periodista nativa: el modo es oficio, no inseguridad\"],\"itemIds\":[\"b2m1indirekterede\",\"b2m1sei\"]},{\"id\":\"b2m1l9e3\",\"type\":\"order\",\"prompt\":\"Ordena lo que pasó\",\"sentences\":[\"Sofía las die Schlagzeile in der S-Bahn.\",\"Nico fragte, ob das wahr sei.\",\"Nordlicht gab eine Pressekonferenz.\",\"Es stellte sich heraus, dass die Meldung übertrieben war.\",\"Sofía schrieb: «Deshalb sei, nicht ist.»\"],\"translation\":\"Sofía leyó el titular. Nico preguntó si era verdad. Nordlicht dio una rueda de prensa. Resultó que la noticia estaba hinchada. Sofía escribió: por eso sei, no ist.\",\"itemIds\":[\"b2m1schlagzeile\",\"b2m1pressekonferenz\",\"b2m1sichherausstellen\"]},{\"id\":\"b2m1l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo de este módulo\",\"pairs\":[{\"target\":\"die Schlagzeile\",\"source\":\"el titular\"},{\"target\":\"die Quelle\",\"source\":\"la fuente\"},{\"target\":\"angeblich\",\"source\":\"supuestamente\"},{\"target\":\"dementieren\",\"source\":\"desmentir\"},{\"target\":\"die Recherche\",\"source\":\"la investigación periodística\"}],\"targetSeconds\":20,\"itemIds\":[\"b2m1schlagzeile\",\"b2m1quelle\",\"b2m1angeblich\",\"b2m1dementieren\",\"b2m1recherche\"]},{\"id\":\"b2m1l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «sagen» ni «ist wahr»\",\"source\":\"Nico sagte: «Ist das wahr?»\",\"forbid\":[\"sagte\",\"wahr\",\"Ist\"],\"answers\":[\"Nico wollte wissen, ob die Meldung stimme\",\"Nico fragte, ob sich die Meldung belegen lasse\",\"Nico fragte nach der Glaubwürdigkeit der Meldung\"],\"translation\":\"Nico dijo: «¿Es verdad?»\",\"hints\":[\"fragen / wissen wollen + K I\",\"ob die Meldung stimme\"],\"itemIds\":[\"b2m1meldung\",\"b2m1glaubwuerdigkeit\"]},{\"id\":\"b2m1l9e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen con K I y fuentes\",\"text\":\"Laut Hofmann ___ eine Quelle die Vorwürfe bestätigt. Die Firma ___ die Meldung und ___ nichts gewusst haben. Einem späteren Bericht ___ war die Meldung übertrieben.\",\"answers\":[\"habe\",\"dementiert\",\"will\",\"zufolge\"],\"bank\":[\"habe\",\"dementiert\",\"will\",\"zufolge\",\"hat\",\"soll\",\"laut\"],\"translation\":\"Según Hofmann, una fuente confirmó las acusaciones. La empresa desmiente la noticia y sostiene que no sabía nada. Según un informe posterior, la noticia estaba hinchada.\",\"itemIds\":[\"b2m1habe\",\"b2m1dementieren\",\"b2m1willgewusst\",\"b2m1zufolge\"]},{\"id\":\"b2m1l9e7\",\"type\":\"monologue\",\"prompt\":\"Tu primer Vortrag de B2: cuatro minutos, estructura tuya, dos pasadas.\",\"topic\":\"Kann man Nachrichten in sozialen Netzen noch trauen?\",\"slides\":[{\"title\":\"1. Einstieg\",\"hint\":\"Presenta el tema y el plan: «Ich möchte heute der Frage nachgehen, ob … Zuerst …, dann …, zum Schluss …». Nada de «Ich spreche über Nachrichten» pelado.\"},{\"title\":\"2. Ein Fall\",\"hint\":\"Cuenta un caso concreto (Nordlicht, o uno tuyo) atribuyendo: laut / zufolge / sollen. Un hecho ajeno sin dueño no cuenta.\"},{\"title\":\"3. Vorteil und Nachteil\",\"hint\":\"Una ventaja (rapidez, Gegenstimme) y un inconveniente (Algorithmus, Schlagzeile sin fuente). «Zwar …, allerdings …».\"},{\"title\":\"4. Meine Position\",\"hint\":\"Tu postura, con una regla concreta: qué debería hacer un titular, un portal, un lector. Konjunktiv I o sollen si citas.\"},{\"title\":\"5. Schluss\",\"hint\":\"Cierra y ábrete a preguntas: «Damit bin ich am Ende. Ich beantworte gern Ihre Fragen.»\"}],\"planSeconds\":180,\"speakSeconds\":240,\"reps\":2,\"checklist\":[\"Traté las 5 partes, ninguna en menos de 20 segundos\",\"Hablé al menos 3:30 sin cortar en seco\",\"Atribuí al menos dos afirmaciones ajenas (laut / zufolge / sollen / K I)\",\"Concedí algo antes de rebatir (zwar / allerdings)\",\"Di una propuesta concreta, no solo una queja\",\"En la 2.ª pasada hablé sin leer las pistas\"],\"model\":\"Diapositiva 2 como modelo (solo una, para que el resto sea tuyo): „Am Dienstag las ich eine Schlagzeile über eine Berliner Firma. Laut einer internen Quelle sollen Daten weitergegeben worden sein. Die Firma dementierte das noch am selben Tag. Zwischen diesen zwei Sätzen liegt genau die Distanz, über die ich sprechen möchte.“\",\"itemIds\":[\"b2m1schlagzeile\",\"b2m1laut\",\"b2m1sollsein\",\"b2m1dementieren\",\"b2m1algorithmus\"],\"tip\":\"En B2 no hay cinco diapositivas fijas: hay quince minutos y un esqueleto que te inventas. La segunda pasada libera atención para el Konjunktiv I. El motor cronometra; no puntúa lo que dices.\"},{\"id\":\"b2m1l9e8\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Según un informe, la noticia era falsa; yo me distancio de ese titular\",\"answers\":[\"Einem Bericht zufolge war die Meldung falsch. Ich distanziere mich von dieser Schlagzeile\",\"Laut einem Bericht war die Meldung falsch. Ich distanziere mich von der Schlagzeile\"],\"hints\":[\"zufolge o laut + sich distanzieren von\",\"Einem Bericht zufolge …\"],\"itemIds\":[\"b2m1zufolge\",\"b2m1falschmeldung\",\"b2m1sichdistanzieren\",\"b2m1schlagzeile\",\"b2m1sachlich\"],\"tip\":\"Fuente + distancia. El módulo entero en dos frases. A partir de aquí, un texto de B2 que afirma sin citar suena a B1.\"},{\"id\":\"b2m1l9e9\",\"type\":\"hearreal\",\"prompt\":\"Última discriminación: ¿calle o libro?\",\"book\":\"Ich habe es in der Zeitung gelesen.\",\"real\":\"Stand in der Zeitung.\",\"translation\":\"Lo he leído en el periódico.\",\"itemIds\":[\"b2m1natstand\"]}]}],\"resources\":[{\"label\":\"tagesschau in 100 Sekunden\",\"url\":\"https://www.tagesschau.de/multimedia/sendung/tagesschau_in_100_sekunden/\",\"note\":\"Cien segundos de noticias reales: caza un sei o un sollen al día. Es el oído que el Hören Teil 4 te va a pedir.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],
