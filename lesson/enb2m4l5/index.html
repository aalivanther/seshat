s de la prensa, para hispanohablantes\",\"body\":\"\u003cb\u003e1. People say / they say.\u003c/b\u003e Comunican. Bajan el registro. En un artículo, el examinador lee Range 2. La salida es It is thought/said/believed/reported that, o He is said to have. El ejercicio te quita people say / they say a propósito: es la herramienta exacta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. notorious.\u003c/b\u003e En español «notorio» es conocido. En inglés \u003cb\u003enotorious = famoso por lo malo\u003c/b\u003e. Un poeta notorio no es a notorious poet: es a well-known / renowned poet. A notorious landlord sí: mala fama. El error culto aparece en cuanto escribes formal.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. expose.\u003c/b\u003e Destapar, dejar a la intemperie. No es «exponer un tema» (set out / present / outline, que ya viste en el m1). The article exposed the leak = destapó. The article exposed the figures in a table = calco, y suena a que las cifras se quedaron a la lluvia.\",\"table\":[[\"Español\",\"Lo que escribes\",\"Lo que querías\"],[\"es notorio que…\",\"he is a notorious poet\",\"he is a well-known poet\"],[\"el artículo expone las cifras\",\"the article exposed the figures\",\"the article set out the figures\"],[\"dicen que cierra\",\"people say it will close\",\"it is reported that it will close\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l5e1\",\"type\":\"bucket\",\"prompt\":\"¿notorious (mala fama) o well-known (conocido)?\",\"categories\":[\"notorious — famoso por lo malo\",\"well-known / renowned — conocido, sin veneno\"],\"items\":[{\"text\":\"a notorious landlord\",\"bucket\":0},{\"text\":\"a well-known poet\",\"bucket\":1},{\"text\":\"a notorious fraud\",\"bucket\":0},{\"text\":\"a renowned surgeon\",\"bucket\":1},{\"text\":\"a notorious delay on that line\",\"bucket\":0},{\"text\":\"a well-known face on this street\",\"bucket\":1}],\"itemIds\":[\"enb2m4notorious\"]},{\"id\":\"enb2m4l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Lorca is a notorious poet in Spain.\",\"answers\":[\"Lorca is a well-known poet in Spain.\",\"Lorca is a renowned poet in Spain.\"],\"why\":\"Notorious es famoso por lo malo. Lorca no es un casero con mala fama: es well-known / renowned. El falso amigo «notorio» solo se caza al escribir culto.\",\"itemIds\":[\"enb2m4notorious\"]},{\"id\":\"enb2m4l5e3\",\"type\":\"errorfix\",\"prompt\":\"Expose no es exponer un tema\",\"wrong\":\"The article exposed the figures in a clear table.\",\"answers\":[\"The article set out the figures in a clear table.\",\"The article presented the figures in a clear table.\"],\"why\":\"Expose es destapar. Las cifras en una tabla se set out / present. Exposed the leak sí: destapó la fuga. Exposed the figures suena a que las dejó a la intemperie.\",\"itemIds\":[\"enb2m4exposedtheleak\",\"enb2m4setoutthefigures\"]},{\"id\":\"enb2m4l5e4\",\"type\":\"paraphrase\",\"prompt\":\"Prohíbe people say\",\"source\":\"People say the shop will close.\",\"forbid\":[\"people say\",\"they say\",\"everybody says\"],\"answers\":[\"It is widely believed that the shop will close\",\"It is widely believed that the shop will close.\",\"Apparently the shop is closing\",\"Apparently the shop is closing.\",\"The shop is said to be closing\"],\"itemIds\":[\"enb2m4itiswidelybelieved\",\"enb2m4apparently\"]},{\"id\":\"enb2m4l5e5\",\"type\":\"gapbank\",\"prompt\":\"Completa sin calcos\",\"text\":\"___ the shop is closing. Word ___ the night bus is going. The article ___ the leak, and then ___ the figures in a table. The rumour cannot be ___.\",\"answers\":[\"Apparently\",\"is\",\"exposed\",\"set out\",\"proved\"],\"bank\":[\"Apparently\",\"is\",\"exposed\",\"set out\",\"proved\",\"People\",\"famous\"],\"itemIds\":[\"enb2m4apparently\",\"enb2m4wordis\",\"enb2m4exposedtheleak\",\"enb2m4setoutthefigures\",\"enb2m4cannotbeproved\",\"enb2m4notorious\"]},{\"id\":\"enb2m4l5e6\",\"type\":\"mc\",\"prompt\":\"Word is\",\"ques
