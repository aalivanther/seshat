r — solo el artículo cambia) y al Umlaut obligatorio de die Z\u003cb\u003eä\u003c/b\u003ehne.\",\"table\":[[\"singular\",\"plural\"],[\"der Rücken\",\"die Rücken\"],[\"die Schulter\",\"die Schultern\"],[\"das Knie\",\"die Knie — ¡igual!\"],[\"der Hals\",\"die Hälse\"],[\"der Finger\",\"die Finger — ¡igual!\"],[\"der Zahn\",\"die Zähne (¡con ä!)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m8l3e1\",\"type\":\"match\",\"prompt\":\"Empareja el cuerpo fino\",\"pairs\":[{\"target\":\"der Rücken\",\"source\":\"la espalda\"},{\"target\":\"die Schulter\",\"source\":\"el hombro\"},{\"target\":\"das Knie\",\"source\":\"la rodilla\"},{\"target\":\"der Hals\",\"source\":\"el cuello / la garganta\"}],\"itemIds\":[\"a2m8ruecken\",\"a2m8schulter\",\"a2m8knie\",\"a2m8hals\"]},{\"id\":\"a2m8l3e2\",\"type\":\"mc\",\"prompt\":\"Reconoce la parte\",\"question\":\"„Mein Finger tut weh“\",\"options\":[\"Me duele el dedo\",\"Me duele el pie\",\"Me duele la rodilla\"],\"answer\":0,\"whyWrong\":[null,\"El pie es der Fuß — tu palabra del A1\",\"La rodilla es das Knie\"],\"itemIds\":[\"a2m8finger\",\"wehtun\"],\"tip\":\"der Finger = dedo de la MANO. Los del pie tienen su propia palabra (die Zehen) — llegará más adelante.\"},{\"id\":\"a2m8l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡el Umlaut no se perdona!\",\"text\":\"Mein ___ tut weh. (espalda)\",\"answers\":[\"Rücken\"],\"translation\":\"Me duele la espalda.\",\"hints\":[\"Masculino, con ü\",\"R-ü-c-k-e-n, con mayúscula\"],\"itemIds\":[\"a2m8ruecken\",\"wehtun\"],\"strictUmlaut\":true,\"tip\":\"Rücken lleva ü siempre — «Rucken» no existe. La ü ES parte de la palabra, no un adorno.\"},{\"id\":\"a2m8l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa con la fábrica\",\"text\":\"Ich habe ___. (dolor de garganta)\",\"answers\":[\"Halsschmerzen\"],\"translation\":\"Me duele la garganta.\",\"hints\":[\"Hals + schmerzen, todo junto\",\"H-a-l-s-s-c-h... — con doble s en la costura\"],\"itemIds\":[\"a2m8halsschmerzen\",\"a2m8hals\",\"schmerzen\"],\"tip\":\"La fábrica pega las piezas tal cual: Hals + Schmerzen = Halsschmerzen. La doble s de la costura se queda.\"},{\"id\":\"a2m8l3e5\",\"type\":\"transform\",\"prompt\":\"Transforma: dilo con la fábrica\",\"source\":\"Mein Rücken tut weh.\",\"instruction\":\"Di lo mismo con -schmerzen: empieza con Ich habe\",\"answers\":[\"Ich habe Rückenschmerzen\",\"Ich habe Rückenschmerzen.\"],\"translation\":\"Me duele la espalda.\",\"hints\":[\"Rücken + schmerzen, todo junto\",\"Ich habe Rücken...\"],\"itemIds\":[\"a2m8rueckenschmerzen\",\"a2m8ruecken\",\"schmerzen\"],\"strictUmlaut\":true,\"tip\":\"Dos caminos al mismo dolor: tut weh (el verbo) o -schmerzen (la fábrica). El médico entiende los dos — y la ü viaja con la palabra.\"},{\"id\":\"a2m8l3e6\",\"type\":\"mc\",\"prompt\":\"¿tut o tun? — el plural invisible\",\"question\":\"Meine Knie ___ weh.\",\"options\":[\"tut\",\"tun\"],\"answer\":1,\"whyWrong\":[\"meine (no mein) delata el plural: die Knie son las DOS rodillas → tun\",null],\"itemIds\":[\"a2m8knie\",\"tunweh\"],\"tip\":\"das Knie y die Knie se escriben igual — el posesivo desempata: mein Knie tut / meine Knie tun. Tu regla de f8, afinada.\"},{\"id\":\"a2m8l3e7\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡y la ä tampoco se perdona!\",\"text\":\"Meine ___ tun nicht mehr weh. (dientes)\",\"answers\":[\"Zähne\"],\"translation\":\"Ya no me duelen los dientes.\",\"hints\":[\"der Zahn toma Umlaut en plural — lo viste en f8\",\"Z-ä-h-n-e\"],\"itemIds\":[\"zahn\",\"tunweh\"],\"strictUmlaut\":true,\"tip\":\"Zahn → Zähne: sin la ä no hay plural. Este par protagoniza el cuento de la lección 7.\"},{\"id\":\"a2m8l3e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Meine Schulter tut weh\",\"translation\":\"Me duele el hombro\",\"hints\":[\"Schulter: la sch como en Schule\",\"una sola parte → tut\"],\"itemIds\":[\"a2m8schulter\",\"wehtun\"]},{\"id\":\"a2m8l3e9\",\"type\":\"build\",\"prompt\":\"Construye el parte de guerra\",\"target\":\"Ich habe Halsschmerzen und mein Knie tut weh\",\"translation\":\"Me duele la garganta y me duele la rodilla\",\"distractors\":[\"tun\",\"mir\"],\"itemIds\":[\"a2m8halsschmerzen\",\"a2m8knie\",\"wehtun\"],\"tip\":\"Los dos caminos en una frase: la fábrica (Halsschmerzen) y el verbo (tut weh). mein Knie singular → tut.\"},{\"id\":\"a2m8l3e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me duele la espalda\",\"answers\":[\"Mein Rücken tut weh\",\"Ich habe Rückenschmerzen\",\"Der Rücken tut mir weh\",\"Mir tut der Rücken weh\"],\"hints\":[\"Los dos caminos valen\",\"Mein Rücken ... / Ich habe Rücken...\"],\"itemIds\":[\"a2m8ruecken\",\"a2m8rueckenschmerzen\",\"wehtun\"],\"strictUmlaut\":true,\"tip\":\"Camino que elijas, la ü de Rücken viaja contigo. Con esta frase el fisio alemán ya sabe por dónde empezar.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «Der Körper» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"El cuerpo ampliado del A2 con audio nativo — busca «Körperteile».\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «Körper» en A2: más partes y más -schmerzen para seguir fabricando.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usa
