ínea. \u003ci\u003eThe purpose of this report is to…\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eDatos\u003c/b\u003e: una muestra, una cifra, una tendencia. Sin «I think». \u003ci\u003eAccording to… / A sample of… / The findings…\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eEl proceso\u003c/b\u003e, en una frase: cómo se ha obtenido el dato.\u003cbr/\u003e4. \u003cb\u003eUna conclusión con reservas.\u003c/b\u003e \u003ci\u003eOn balance… / All things considered… / …with some reservations.\u003c/i\u003e Mojarse del todo es de editorial, no de informe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRegistro:\u003c/b\u003e sin contracciones si puedes, sin «Odds are», sin «got to». La altura de compromiso es \u003ci\u003elikely / highly likely / the evidence suggests\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eHoy escribes 120-150 palabras. Mañana, en la L8, 150-200. El esqueleto es el mismo; lo que crece es el dato."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l4\",\"phaseId\":\"enb2m5\",\"title\":\"The report\",\"subtitle\":\"Datos, proceso, conclusión con reservas — el género del módulo\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de un informe\",\"itemIds\":[\"enb2m5findings\",\"enb2m5onbalance\",\"enb2m5withreservations\",\"enb2m5asampleof\",\"enb2m5atrend\",\"enb2m5theprocess\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es un informe, y por qué LanguageCert no te lo pide nunca de frente\",\"body\":\"$17\",\"table\":[[\"Pieza\",\"Fórmula\",\"Lo que no es\"],[\"Propósito\",\"The purpose of this report is to…\",\"I wanted to tell you about…\"],[\"Dato\",\"According to / A sample of\",\"I think / In my opinion\"],[\"Cierre\",\"On balance… with some reservations\",\"So yeah, basically\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l4e1\",\"type\":\"match\",\"prompt\":\"Empareja cada pieza del informe con su oficio\",\"pairs\":[{\"target\":\"the findings\",\"source\":\"lo que ha salido del estudio\"},{\"target\":\"a sample of fifty residents\",\"source\":\"de quién has sacado el dato\"},{\"target\":\"a clear trend\",\"source\":\"la dirección que marcan los números\"},{\"target\":\"the process\",\"source\":\"cómo se ha hecho, no solo el resultado\"},{\"target\":\"On balance, the talk was worth repeating.\",\"source\":\"cierre con reservas\"}],\"itemIds\":[\"enb2m5findings\",\"enb2m5asampleof\",\"enb2m5atrend\",\"enb2m5theprocess\",\"enb2m5onbalance\"],\"tip\":\"Si un párrafo de informe no tiene al menos una de estas cinco, es una opinión disfrazada. El corrector lo ve.\"},{\"id\":\"enb2m5l4e2\",\"type\":\"mc\",\"prompt\":\"La primera línea\",\"question\":\"¿Cuál abre un informe?\",\"options\":[\"The purpose of this report is to summarise last Thursday's talk.\",\"I wanted to tell you about last Thursday's talk.\",\"Odds are the talk went well.\"],\"answer\":0,\"whyWrong\":[null,\"Eso abre un correo a un amigo. El informe no tiene «I wanted».\",\"«Odds are» es la calle de la L1. En un informe es un error de registro, no de gramática.\"],\"itemIds\":[\"enb2m5findings\",\"enb2m5natoddsare\"],\"tip\":\"La primera línea decide el género. Si empiezas por «I», el lector ya no está leyendo un informe.\"},{\"id\":\"enb2m5l4e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The evidences show a clear trend.\",\"answers\":[\"The evidence shows a clear trend.\",\"The findings show a clear trend.\"],\"why\":\"«Evidence» es incontable: no tiene plural y el verbo va en singular. «Findings», en cambio, casi siempre va en plural. Son la pareja que el informe usa: evidence (la materia) y findings (lo que ha salido).\",\"translation\":\"La evidencia muestra una tendencia clara.\",\"itemIds\":[\"enb2m5theevidence\",\"enb2m5atrend\",\"enb2m5findings\"]},{\"id\":\"enb2m5l4e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el cierre del informe de Valeria\",\"text\":\"___ balance, the talk was worth repeating, with some ___. It is highly ___ that a second evening would fill the room. There is, however, no conclusive ___.\",\"answers\":[\"On\",\"reservations\",\"likely\",\"evidence\"],\"bank\":[\"On\",\"reservations\",\"likely\",\"evidence\",\"In\",\"opinions\",\"sure\",\"informations\"],\"translation\":\"En conjunto, la charla merecía repetirse, con algunas reservas. Es muy probable que una segunda tarde llenara la sala. No hay, sin embargo, pruebas concluyentes.\",\"itemIds\":[\"enb2m5onbalance\",\"enb2m5withreservations\",\"enb2m5highlylikelythat\",\"enb2m5theevidence\",\"enb2m5conclusive\"],\"tip\":\"Cuatro huecos y ni un «I think». Eso es el cierre de un informe de B2, y es exactamente lo que el descriptor llama «con reservas».\"},{\"id\":\"enb2m5l4e5\",\"type\":\"write\",\"prompt\":\"El informe del módulo, versión corta. 120-150 palabras, datos y reservas, sin «I think».\",\"scenario\":\"La biblioteca del barrio te pide un informe breve para el comité: ¿merece la pena repetir la charla de Dr Farida Haq? Escribe el informe al comité. Registro cortés de informe, no de correo a un amigo.\",\"genre\":\"report\",\"register\":\"polite\",\"bullets\":[\"Abre con el propósito del informe.\",\"Da al menos un dato (cifra, muestra o asistencia).\",\"Cierra con una recomendación y reservas, sin «I think».\"],\"checks\":[{\"re\":\"(purpose of this report|this report (aims|summarises|outlines))\",\"label\":\"Abres con el propósito del informe\"},{\"re\":\"(sample|forty|40|according to|findings|attendance|roughly)\",\"label\":\"Hay un dato, no solo una impresión\"},{\"re\":\"(on balance|all things considered|with some reservations|in conclusion)\",\"label\":\"Cierras con reservas, no con «I think»\"}],\"frame\":[\"Encabezado: To / From / Subject\",\"Propósito: «The purpose of this report is to…»\",\"Dato: asistencia, muestra o hallazgo, con «According to…» o «A sample of…»\",\"Lectura del dato: «It is highly likely that…» / «The evidence suggests…»\",\"Cierre: «On balance… with some reservations.»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"on balance\",\"according to\",\"in conclusion\",\"as a result\",\"however\",\"to a great extent\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":120,\"maxWords\":150,\"model\":\"To: Neighbourhood Library Committee\\nFrom: Valeria Soto\\nSubject: Attendance at Dr Haq's talk\\n\\nThe purpose of this report is to summarise last Thursday's open talk and to recommend whether the library should run a second evening. Please find the main points below.\\n\\nDr Farida Haq spoke for forty minutes to a room of roughly forty people. According to the attendance sheet, most of them were local residents rather than students. The findings were clear to a great extent: people are more likely to accept an unexplained story than a dull explanation, even when the evidence strongly suggests a simple cause.\\n\\nIt is highly likely that a second talk would fill the room. On balance, I would be grateful if the committee could consider a weekday evening, with some reservations about weekend dates. In conclusion, the event is worth repeating.\",\"itemIds\":[\"enb2m5findings\",\"enb2m5onbalance\",\"enb2m5withreservations\",\"enb2m5highlylikelythat\",\"enb2m5evidencesuggests\",\"enb2m5asampleof\"],\"tip\":\"Cuenta las «I think»: si hay una, táchala y ponle una perífrasis con be. Y fíjate en el modelo: «I would be grateful if the committee could consider» es la única primera persona, y es petición, no opinión.\"},{\"id\":\"enb2m5l4e6\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En conjunto, la charla merecía repetirse, con algunas reservas.\",\"answers\":[\"On balance, the talk was worth repeating, with some reservations\",\"On balance the talk was worth repeating, with some reservations\",\"All things considered, the talk was worth repeating, with some reservations\"],\"hints\":[\"Empieza por «On balance» o «All things considered»\",\"On balance, the talk was worth repeating, with some ...\"],\"itemIds\":[\"enb2m5onbalance\",\"enb2m5withreservations\",\"enb2m5allthingsconsidered\"],\"tip\":\"«With some reservations» es la firma del B2. Un A2 cierra con «I think it was good». Un B2 cierra mojándose a medias, y se nota.\"},{\"id\":\"enb2m5l4e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Una muestra de cincuenta vecinos.\",\"answers\":[\"a sample of fifty residents\",\"a sample of 50 residents\",\"a sample of fifty neighbours\"],\"hint\":\"«Muestra» no es «a show»\",\"itemIds\":[\"enb2m5asampleof\"],\"tip\":\"«Sample of» + cifra + grupo. En un informe, esa línea vale más que un párrafo de impresiones.\"},{\"id\":\"enb2m5l4e8\",\"type\":\"audiomc\",\"prompt\":\"Listening: Priya le pide a Valeria que le cuente la charla en dos minutos, para el grupo del café. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"So was it worth going?|It was, actually. Forty people, give or take, and she didn't once say 'I think'. She kept saying 'the evidence suggests' and 'it's likely that', which I thought was going to be dry, and it wasn't.|What was it about?|Why we prefer a ghost to a pipe. A sample of fifty residents in a block where the lights kept flickering: most of them went for something unexplained, even when the wiring report was sitting on the hall table.|And her conclusion?|On balance, she said, people aren't stupid. They're doing what brains do. She was due to finish at eight and she overran, and nobody moved.\",\"question\":\"¿Cuál fue el hallazgo de la charla, según Valeria?\",\"options\":[\"Que la mayoría de los vecinos del bloque eligió una explicación sin explicar, con el informe del cableado delante\",\"Que la charla se pasó de hora y nadie se movió\",\"Que Priya debería haber ido\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es un detalle del cierre, no el hallazgo.\",\"Priya pregunta; no es una conclusión de la charla.\"],\"itemIds\":[\"enb2m5asampleof\",\"enb2m5onbalance\",\"enb2m5flickering\",\"enb2m5dueatseven\",\"enb2m5evidencesuggests\"],\"tip\":\"Fíjate en cómo Valeria reporta: no dice «I think people prefer ghosts». Cita el dato (fifty residents, most of them) y la fórmula de Farida. Eso es ya un informe oral.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
