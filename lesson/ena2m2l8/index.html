and.\u003cbr/\u003e10. «Where did you find it?» — «In the fridge. You put it there with the milk this morning.»\u003cbr/\u003e11. Valeria didn't say anything. In the end, she made dinner and they had a good laugh.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: got on = subirse a un autobús o a un tren · she didn't hear / she didn't have / she didn't answer — detrás de didn't, el verbo desnudo, también aquí · sent es el pasado de send.\u003c/i\u003e18:T43f,Last winter Ben started work at half past five. It was dark, it was cold, and the bus was already ten minutes late when he left the [[depot|las cocheras]].\u003cbr/\u003e\u003cbr/\u003eAt the second stop a woman got on with three big bags and a small dog. She paid, she sat down, and two minutes later the dog ran to the front of the bus. Ben stopped. The woman said sorry, took the dog and sat down again. The passengers laughed, because the dog was very small and everybody was still half asleep.\u003cbr/\u003e\u003cbr/\u003eThen things got worse. A car broke down in front of the bus, so Ben waited. And waited. After twenty minutes a police officer arrived and sent all the traffic down a narrow street. Ben knew that street. The bus did not fit under the bridge.\u003cbr/\u003e\u003cbr/\u003eHe got out and he told the officer. The officer looked at the bus, looked at the bridge and said nothing for a long time. Then he moved the cars again and let the bus go the normal way.\u003cbr/\u003e\u003cbr/\u003eBen arrived at the last stop fifty minutes late. His manager did not ask about the traffic or about the bridge. He only asked one question: 'And the dog?'"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l8\",\"phaseId\":\"ena2m2\",\"title\":\"The day I lost my wallet\",\"subtitle\":\"Una anécdota completa — y todas las piezas del módulo trabajando juntas\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas del contratiempo\",\"itemIds\":[\"ena2m2mywallet\",\"ena2m2mykeys\",\"ena2m2ifelloverinthestreet\",\"ena2m2iforgotmykeys\",\"ena2m1missedthebus\",\"ena2m1whathappened\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El martes de Valeria\",\"body\":\"$17\",\"table\":[[\"quién\",\"qué hizo\"],[\"Valeria\",\"se despertó tarde, corrió al autobús y perdió la cartera\"],[\"Sam\",\"no encontró nada en el café\"],[\"Amy\",\"encontró la cartera en la nevera\"],[\"la cartera\",\"estuvo todo el día en casa, con la leche\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l8e1\",\"type\":\"order\",\"prompt\":\"Ordena el martes de Valeria\",\"sentences\":[\"Valeria woke up late and she didn't have time for breakfast.\",\"She ran to the bus stop and she got on the bus at eight.\",\"At the office she opened her bag: her wallet wasn't there.\",\"She phoned Sam and after that she phoned Amy.\",\"In the end, Amy found the wallet in the fridge.\"],\"translation\":\"Valeria se despertó tarde y no le dio tiempo a desayunar. Corrió a la parada y se subió al autobús a las ocho. En la oficina abrió el bolso: la cartera no estaba. Llamó a Sam y después llamó a Amy. Al final, Amy encontró la cartera en la nevera.\",\"itemIds\":[\"ena2m2mywallet\",\"ena2m2wokegroup\",\"ena2m2afterthat\",\"ena2m2intheend\",\"enbusstop\"],\"tip\":\"El orden lo dan las señales y las horas. Cuando escribas tu propia anécdota, deja esas dos pistas sembradas: es lo que hace que se te siga sin esfuerzo.\"},{\"id\":\"ena2m2l8e2\",\"type\":\"mc\",\"prompt\":\"Comprensión — el dato\",\"question\":\"¿Dónde estaba la cartera?\",\"options\":[\"En la nevera\",\"En el café de Sam\",\"En el autobús\"],\"answer\":0,\"whyWrong\":[null,\"Sam miró y no encontró nada\",\"En el autobús no llegó a buscarla\"],\"itemIds\":[\"ena2m2mywallet\",\"enfridge\"]},{\"id\":\"ena2m2l8e3\",\"type\":\"mc\",\"prompt\":\"Comprensión — hay que atar cabos\",\"question\":\"¿Por qué acabó la cartera en la nevera?\",\"options\":[\"Valeria la dejó allí al guardar la leche por la mañana\",\"Amy la escondió para gastarle una broma\",\"Se cayó dentro cuando Valeria corría\"],\"answer\":0,\"whyWrong\":[null,\"Amy la encontró, no la escondió: por eso mandó el mensaje\",\"Valeria corrió a la parada, no por la cocina\"],\"itemIds\":[\"ena2m2mywallet\",\"enmilk\",\"enfridge\"],\"tip\":\"La respuesta no está escrita con esas palabras: «You put it there with the milk» te obliga a reconstruirlo. Eso es exactamente lo que pide el Reading del examen.\"},{\"id\":\"ena2m2l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el pasado del verbo\",\"text\":\"Valeria ___ (run) to the bus stop.\",\"answers\":[\"ran\"],\"translation\":\"Valeria corrió a la parada del autobús.\",\"hints\":[\"Familia de la A abierta: la vocal se abre\",\"run → r…\"],\"itemIds\":[\"ena2m2sanggroup\",\"enbusstop\"]},{\"id\":\"ena2m2l8e5\",\"type\":\"bucket\",\"prompt\":\"¿Pasó antes o después de llegar a la oficina?\",\"categories\":[\"antes de llegar a la oficina\",\"después\"],\"items\":[{\"text\":\"She woke up late\",\"bucket\":0},{\"text\":\"She phoned Sam\",\"bucket\":1},{\"text\":\"She ran to the bus stop\",\"bucket\":0},{\"text\":\"Amy sent her a message\",\"bucket\":1},{\"text\":\"She got on the bus\",\"bucket\":0},{\"text\":\"She came home at six\",\"bucket\":1}],\"itemIds\":[\"ena2m2wokegroup\",\"ena2m1phoned\",\"ena2m2icamehomelate\",\"ena2m2shegotamessage\"]},{\"id\":\"ena2m2l8e6\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"She didn't have time for breakfast, so she ran to the bus stop.\",\"answers\":[\"No le dio tiempo a desayunar, así que corrió a la parada del autobús.\",\"No tuvo tiempo de desayunar, así que corrió a la parada del autobús.\"],\"itemIds\":[\"ena2m2wedidnthavetime\",\"ena2m2soiwalked\",\"ena2m2sanggroup\"],\"tip\":\"Mira la primera mitad: didn't have, no didn't had. Y aun así en español sale «no TUVO». Cada idioma pone la marca donde quiere.\"},{\"id\":\"ena2m2l8e7\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Me dejé las llaves y me caí en la calle. ¡Qué desastre!\",\"answers\":[\"I forgot my keys and I fell over in the street. What a disaster!\",\"I forgot my keys and I fell over in the street. It was a disaster!\"],\"hint\":\"los dos verbos son irregulares y ninguno lleva -ed\",\"itemIds\":[\"ena2m2iforgotmykeys\",\"ena2m2ifelloverinthestreet\",\"ena2m2mykeys\"]},{\"id\":\"ena2m2l8e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la -ed inventada\",\"wrong\":\"I falled over in the street.\",\"answers\":[\"I fell over in the street.\"],\"why\":\"fall es irregular: fell. Y ojo al reflexivo del español — «me caí» lleva el «me» y el inglés no: I fell, sin pronombre. Lo mismo con «me equivoqué» (I made a mistake) o «me fui» (I left).\",\"translation\":\"Me caí en la calle.\",\"itemIds\":[\"ena2m2ifelloverinthestreet\"],\"tip\":\"Los «me/te/se» del español no viajan al inglés. Cuando traduzcas un verbo reflexivo, quítalos y mira si la frase sigue en pie: casi siempre sí.\"},{\"id\":\"ena2m2l8e9\",\"type\":\"gapbank\",\"prompt\":\"Cuéntalo tú — elige del banco\",\"text\":\"Last Tuesday I ___ up late and I ___ my wallet. First of all I phoned Sam, but he didn't ___ it. In the end Amy ___ it in the fridge.\",\"answers\":[\"woke\",\"lost\",\"find\",\"found\"],\"bank\":[\"woke\",\"lost\",\"find\",\"found\",\"broke\",\"missed\",\"gave\"],\"translation\":\"El martes pasado me desperté tarde y perdí la cartera. Lo primero, llamé a Sam, pero no la encontró. Al final Amy la encontró en la nevera.\",\"itemIds\":[\"ena2m2wokegroup\",\"ena2m2ilostmyphone\",\"ena2m2ifounditinmybag\",\"ena2m2mywallet\"],\"tip\":\"Los huecos tres y cuatro son el mismo verbo en dos sitios distintos: detrás de didn't va desnudo (find) y en afirmativa va con su forma rara (found). Es el módulo entero en dos huecos.\"},{\"id\":\"ena2m2l8e10\",\"type\":\"audiomc\",\"prompt\":\"Otra anécdota — 2 escuchas\",\"audio\":\"I had a terrible morning. I forgot my keys, so I went back home. Then I missed the train and I arrived at eleven. Luckily, nobody said anything.\",\"question\":\"¿Por qué volvió a casa?\",\"options\":[\"Se dejó las llaves\",\"Perdió el tren\",\"Se cayó en la calle\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El tren lo perdió después, ya de camino\",\"La caída no aparece en el audio\"],\"itemIds\":[\"ena2m2iforgotmykeys\",\"ena2m2soiwalked\",\"ena2m1terrible\"],\"tip\":\"Cuando un audio trae tres sucesos seguidos, la pregunta suele ir por la CAUSA, no por el último. Apunta los tres en el orden en que suenan.\"},{\"id\":\"ena2m2l8e11\",\"type\":\"speak\",\"prompt\":\"Cuenta el final de la historia en voz alta\",\"text\":\"In the end, Amy found the wallet in the fridge. What a shame!\",\"phonetic\":\"in di END, ÉI-mi fáund de UÓ-lit in de fridch. uót a SHÉIM\",\"translation\":\"Al final, Amy encontró la cartera en la nevera. ¡Qué desastre!\",\"itemIds\":[\"ena2m2intheend\",\"ena2m2mywallet\",\"ena2m2whatashame\",\"enfridge\"],\"tip\":\"Fíjate en el ritmo: la señal (in the end) lleva pausa detrás y la reacción va al final, sola. Así se cuenta un remate.\"},{\"id\":\"ena2m2l8e13\",\"type\":\"read\",\"prompt\":\"Lectura larga, como la Parte 4 del Reading: lee el texto entero y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Ben's worst morning\",\"text\":\"$18\",\"source\":\"relato del curso\",\"questions\":[{\"id\":\"ena2m2l8e13q1\",\"q\":\"Why did Ben stop the bus the first time?\",\"options\":[\"Because a dog ran to the front of the bus\",\"Because a woman got on with three big bags\",\"Because a car broke down in front of him\"],\"answer\":0,\"why\":\"«the dog ran to the front of the bus. Ben stopped». El coche averiado llega mucho después, y las bolsas no le hacen parar.\"},{\"id\":\"ena2m2l8e13q2\",\"q\":\"Why did Ben get out and talk to the police officer?\",\"options\":[\"Because his bus was too tall for the bridge in that street\",\"Because he wanted the officer to move the broken car\",\"Because he was angry about the twenty minutes\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no dice «se lo explicó»: pone «Ben knew that street. The bus did not fit under the bridge» y después «he got out and he told the officer». Hay que juntar las dos frases.\"},{\"id\":\"ena2m2l8e13q3\",\"q\":\"How late was Ben at the last stop?\",\"options\":[\"Fifty minutes\",\"Twenty minutes\",\"Ten minutes\"],\"answer\":0,\"why\":\"Los veinte son los que esperó al policía y los diez, el retraso con el que salió. El texto pone los tres números a propósito.\"},{\"id\":\"ena2m2l8e13q4\",\"q\":\"Why did the officer say nothing for a long time?\",\"options\":[\"Because he realised that he had sent the bus the wrong way\",\"Because he did not understand Ben\",\"Because he was writing down the number of the bus\"],\"answer\":0,\"inference\":true,\"why\":\"Mira lo que hace, no lo que dice: mira el autobús, mira el puente, se calla y acto seguido deshace su propia orden. Ese silencio es la respuesta.\"},{\"id\":\"ena2m2l8e13q5\",\"q\":\"What does the manager's question tell us?\",\"options\":[\"That he had already heard the story of the dog\",\"That he did not believe Ben\",\"That he was worried about the animal\"],\"answer\":0,\"inference\":true,\"why\":\"No pregunta por lo que le contarías tú —el tráfico, el puente, los cincuenta minutos— sino por el perro. Alguien se lo había contado antes.\"}],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2afterthat\",\"ena2m2whathappenednext\"],\"tip\":\"Así es la Parte 4 del examen: un texto seguido y preguntas que van EN EL ORDEN DEL TEXTO. Avanza en paralelo, no vuelvas atrás, y si una palabra no la sabes, sigue leyendo: casi nunca la pregunta depende de esa palabra.\"},{\"id\":\"ena2m2l8e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Perdí la cartera, así que llamé a Sam. Al final, Amy la encontró en la nevera.\",\"answers\":[\"I lost my wallet, so I phoned Sam. In the end, Amy found it in the fridge.\",\"I lost my wallet, so I phoned Sam. In the end Amy found it in the fridge.\",\"I lost my wallet, so I called Sam. In the end, Amy found it in the fridge.\"],\"hints\":[\"Irregular + so + señal de cierre + irregular\",\"I l… my wallet, so I phoned Sam. In the e…, Amy f… it in the fridge.\"],\"itemIds\":[\"ena2m2mywallet\",\"ena2m2soiwalked\",\"ena2m2intheend\",\"ena2m2ifounditinmybag\"],\"tip\":\"Dos irregulares, un conector de consecuencia y una señal de cierre. Con esas cuatro piezas ya se cuenta cualquier contratiempo.\"}]}],\"resources\":[{\"label\":\"British Council — A2 listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Busca una conversación donde alguien cuente algo que le pasó y apunta solo los verbos en pasado que oigas. Cuenta cuántos son irregulares: te vas a sorprender.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$
