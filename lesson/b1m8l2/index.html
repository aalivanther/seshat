ompleta el aviso de la empresa de transporte\",\"text\":\"Ihr Paket ___ voraussichtlich am Freitag geliefert. Die Zustellung ___ zwischen acht und achtzehn Uhr erfolgen. Sie ___ am Morgen eine Nachricht bekommen.\",\"answers\":[\"wird\",\"wird\",\"werden\"],\"bank\":[\"wird\",\"werden\",\"wirst\",\"werdet\",\"wurde\"],\"translation\":\"Su paquete se entregará previsiblemente el viernes. El reparto tendrá lugar entre las ocho y las dieciocho horas. Usted recibirá un aviso por la mañana.\",\"itemIds\":[\"b1m8gevoraussichtlich\",\"paket\"],\"tip\":\"«Sie werden» con mayúscula: usted. La misma forma que «sie werden» (ellos), pero la mayúscula lo cambia todo — y en un aviso comercial siempre es usted.\"},{\"id\":\"b1m8l2e8\",\"type\":\"build\",\"prompt\":\"Construye la predicción\",\"target\":\"In zehn Jahren wird niemand mehr bar bezahlen\",\"translation\":\"Dentro de diez años ya nadie pagará en efectivo\",\"distractors\":[\"werden\",\"zu bezahlen\"],\"itemIds\":[\"b1m8gewerden\"],\"tip\":\"Complemento de tiempo en posición 1 → wird en 2ª → niemand en 3ª → bezahlen al final. Cuatro reglas en una frase.\"},{\"id\":\"b1m8l2e9\",\"type\":\"mc\",\"prompt\":\"El uso que casi nadie enseña\",\"question\":\"„Er wird wohl im Büro sein.“ — ¿De qué habla la frase?\",\"options\":[\"De dónde está ahora, con una suposición\",\"De dónde estará el año que viene\",\"De dónde estuvo ayer\"],\"answer\":0,\"whyWrong\":[null,\"Para el futuro real haría falta un complemento de tiempo futuro\",\"El pasado sería «Er war wohl im Büro»\"],\"itemIds\":[\"b1m8gewahrscheinlich\"],\"tip\":\"werden + wohl = «estará / será» de suposición, sobre el PRESENTE. El español hace lo mismo: «estará en la oficina» no habla del futuro.\"},{\"id\":\"b1m8l2e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Die Preise werden im nächsten Jahr weiter steigen.\",\"translation\":\"Los precios seguirán subiendo el año que viene.\",\"hints\":[\"Die Preise werden ...\",\"weiter steigen al final\"],
