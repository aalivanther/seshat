"body\":\"Ya no se trata de entender mal \u003ci\u003eeventuell\u003c/i\u003e o \u003ci\u003esensibel\u003c/i\u003e. Se trata de \u003cb\u003esonar mal\u003c/b\u003e: la palabra es la correcta y el traje no.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ekriegen\u003c/b\u003e — calle y cocina. En la Nachricht al jefe: \u003cb\u003eerhalten\u003c/b\u003e o \u003ci\u003ebekommen\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eerhalten\u003c/b\u003e — al revés: con Nico suena a circular. Ahí \u003ci\u003ekriegen\u003c/i\u003e o \u003ci\u003ebekommen\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eKumpel\u003c/b\u003e — barra y vestuario. En la Besprechung: \u003cb\u003eKollege\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003etun + infinitivo\u003c/b\u003e (\u003ci\u003eIch tu mal nachschauen\u003c/i\u003e) — muy alemán de hablar, cero de Schreiben.\u003cbr/\u003e· \u003cb\u003ewo de relativo\u003c/b\u003e (\u003ci\u003eder Typ, wo ich kenne\u003c/i\u003e) — calle del sur y no solo. En el examen: \u003ci\u003eden ich kenne\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eEl Sprachgefühl se entrena con pares mínimos, no con una lista de «palabras feas». La pregunta de la clínica no es «¿se entiende?». Es «¿dónde la dirías sin que te miren raro?».\",\"table\":[[\"calle\",\"examen / Nachricht Sie\"],[\"kriegen\",\"erhalten / bekommen\"],[\"Kumpel\",\"Kollege\"],[\"Ich tu mal nachschauen\",\"Ich schaue nach / Ich prüfe das\"],[\"der Typ, wo ich kenne\",\"der Typ, den ich kenne\"],[\"echt stark\",\"ausgesprochen gelungen\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m10l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Dónde se puede decir sin perder banda?\",\"categories\":[\"con Nico, en la cocina\",\"en la Nachricht al Betriebsrat\"],\"items\":[{\"text\":\"Kriegst du das hin?\",\"bucket\":0},{\"text\":\"Haben Sie die Unterlagen erhalten?\",\"bucket\":1},{\"text\":\"Mein Kumpel von der Schicht\",\"bucket\":0},{\"text\":\"Ein Kollege aus der Abteilung\",\"bucket\":1},{\"text\":\"Ich tu mal nachschauen.\",\"bucket\":0},{\"text\":\"Ich prüfe das und melde mich.\",\"bucket\":1}],\"itemIds\":[\"b2m10kriegen\",\"b2m10erhalten\",\"b2m10kumpel\",\"b2m10tuninf\"]},{\"id\":\"b2m10l5e2\",\"type\":\"errorfix\",\"prompt\":\"Kumpel en la reunión\",\"wrong\":\"Sehr geehrter Herr Bergmann, ein Kumpel aus der Küche hat gefragt.\",\"answers\":[\"Sehr geehrter Herr Bergmann, ein Kollege aus der Küche hat gefragt.\",\"Sehr geehrter Herr Bergmann, ein Kollege aus der Küche hat gefragt\"],\"why\":\"Kumpel no es insulto: es el traje de barra. En una Nachricht de Sie, Kollege. El examinador no discute si os queréis: discute si controlas el registro.\",\"translation\":\"Estimado señor Bergmann, un compañero de la cocina ha preguntado.\",\"itemIds\":[\"b2m10kumpel\"]},{\"id\":\"b2m10l5e3\",\"type\":\"errorfix\",\"prompt\":\"wo de relativo\",\"wrong\":\"Das ist der Text, wo ich gestern gelesen habe.\",\"answers\":[\"Das ist der Text, den ich gestern gelesen habe.\",\"Das ist der Text, den ich gestern gelesen habe\"],\"why\":\"wo de relativo es calle, muy oída, y en el Schreiben es un error de Strukturen. El relativo es den/die/das, o wo(r)- cuando hay preposición (worauf, womit): eso ya lo viste en el m9, y no es este wo.\",\"translation\":\"Ese es el texto que leí ayer.\",\"itemIds\":[\"b2m10worelativ\"]},{\"id\":\"b2m10l5e4\",\"type\":\"errorfix\",\"prompt\":\"tun + infinitivo en el escrito\",\"wrong\":\"Ich tue die Grafik nachschauen und schreibe Ihnen.\",\"answers\":[\"Ich schaue die Grafik nach und schreibe Ihnen.\",\"Ich prüfe die Grafik und schreibe Ihnen.\"],\"why\":\"tun + infinitivo es una de las marcas más claras de Umgangssprache. En el Schreiben se borra el tun y queda el verbo: ich schaue nach / ich prüfe.\",\"translation\":\"Reviso el gráfico y le escribo.\",\"itemIds\":[\"b2m10tuninf\"]},{\"id\":\"b2m10l5e5\",\"type\":\"mc\",\"prompt\":\"erhalten con un amigo: el error inverso\",\"question\":\"Le escribes a Nico: «Hast du die Nachricht erhalten?» ¿Qué pasa?\",\"options\":[\"Perfecto: erhalten es siempre más correcto\",\"Gramaticalmente sí; de registro suena a circular. Con Nico: bekommen o kriegen\",\"Está mal porque erhalten no existe en presente\"],\"answer\":1,\"whyWrong\":[\"Más correcto no es más de examen en todos los géneros\",null,\"Sí existe\"],\"itemIds\":[\"b2m10erhalten\",\"b2m10kriegen\"]},{\"id\":\"b2m10l5e6\",\"type\":\"gapbank\",\"prompt\":\"Elige el traje, no el sinónimo\",\"text\":\"An den Chef: Haben Sie die Mail ___? An Nico: ___ du das hin? In der Küche: mein ___ von der Schicht.\",\"answers\":[\"erhalten\",\"Kriegst\",\"Kumpel\"],\"bank\":[\"erhalten\",\"Kriegst\",\"Kumpel\",\"bekommen\",\"Kollege\",\"Natel\"],\"translation\":\"Al jefe: ¿ha recibido el correo? A Nico: ¿lo sacas? En la cocina: mi colega del turno.\",\"itemIds\":[\"b2m10erhalten\",\"b2m10kriegen\",\"b2m10kumpel\"]},{\"id\":\"b2m10l5e7\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"Das ist sehr gut.\",\"real\":\"Das ist echt stark.\",\"translation\":\"Eso está muy bien.\",\"ask\":\"which\",\"itemIds\":[\"b2m10natechtstark\"]},{\"id\":\"b2m10l5e8\",\"type\":\"type\",\"prompt\":\"Cierre de la clínica\",\"question\":\"He recibido su mensaje (a un superior, Sie)\",\"answers\":[\"Ich habe Ihre Nachricht erhalten\",\"Ich habe Ihre Nachricht erhalten.\",\"Ihre Nachricht habe ich erhalten\"],\"hints\":[\"erhalten, no kriegen\",\"Ihre Nachricht\"],\"itemIds\":[\"b2m10erhalten\"],\"tip\":\"Ihre con mayúscula es Sie. kriegen aquí sería el error de la lección, no un atajo simpático.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chu
