 have, no\",\"body\":\"El tercer condicional trae un if. El arrepentimiento del B2 a menudo no lo trae: \u003ci\u003eI should have told you.\u003c/i\u003e Es la misma máquina (modal + have + participio) sin la mitad hipotética.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eshould have / ought to have\u003c/b\u003e = me arrepiento. Ought es un pelín más formal y es lo que puntúa en un Writing: \u003ci\u003eIn hindsight, I ought to have checked.\u003c/i\u003e Should y ought to son gemelos: no los pongas en el mismo hueco de un gapbank.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eshouldn't have\u003c/b\u003e = me arrepiento de lo que SÍ hice. \u003ci\u003eI shouldn't have said it like that.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003emight have\u003c/b\u003e sin if = especulación, no consejo. \u003ci\u003eI might have waited a day\u003c/i\u003e = a lo mejor esa era una opción; no es «debería». El consejo es should.\u003cbr/\u003e\u003cbr/\u003eEn B1, \u003ci\u003eI should have kept the receipt\u003c/i\u003e era receptivo. Hoy se produce. La forma no ha cambiado; ha cambiado que ya no te la perdonan si la rodeas.\",\"table\":[[\"Fórmula\",\"Oficio\",\"Ejemplo\"],[\"should have + participio\",\"arrepentimiento\",\"I should have told you.\"],[\"ought to have + participio\",\"lo mismo, más formal\",\"I ought to have checked.\"],[\"shouldn't have\",\"arrepentimiento de lo hecho\",\"I shouldn't have said it.\"],[\"might have (sin if)\",\"especulación\",\"I might have waited.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l2e1\",\"type\":\"match\",\"prompt\":\"Empareja cada fórmula con su oficio\",\"pairs\":[{\"target\":\"I should have told you.\",\"source\":\"arrepentimiento: no lo hice y debía\"},{\"target\":\"I shouldn't have said it like that.\",\"source\":\"arrepentimiento: sí lo hice y no debía\"},{\"target\":\"In hindsight, I ought to have checked.\",\"source\":\"lo mismo, en registro de examen\"},{\"target\":\"I might have waited a day.\",\"source\":\"especulación: era una opción\"},{\"target\":\"It could have been worse.\",\"source\":\"consuelo: el mundo que no fue, menos malo\"}],\"itemIds\":[\"enb2m6shouldhavetoldyou\",\"enb2m6shouldnthavesaidit\",\"enb2m6oughttohavechecked\",\"enb2m6mighthavewaited\",\"enb2m6couldhavebeenworse\"],\"tip\":\"Should y might no son sinónimos. Should se moja: había que hacerlo. Might no: era posible.\"},{\"id\":\"enb2m6l2e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I should have tell you.\",\"answers\":[\"I should have told you.\"],\"why\":\"Detrás de have va participio, no infinitivo. El español dice «haber dicho» y el infinitivo se cuela. Told, no tell.\",\"translation\":\"Debería habértelo dicho.\",\"itemIds\":[\"enb2m6shouldhavetoldyou\",\"enb1m5shouldhavekept\"]},{\"id\":\"enb2m6l2e3\",\"type\":\"paraphrase\",\"prompt\":\"Súbelo de registro: sin should ni told\",\"source\":\"I should have told you.\",\"forbid\":[\"should\",\"told\",\"say\",\"said\"],\"answers\":[\"In hindsight, I ought to have checked\",\"In hindsight, I ought to have mentioned it\",\"In hindsight I ought to have checked\"],\"translation\":\"Debería habértelo dicho.\",\"hints\":[\"Empieza por «In hindsight»\",\"In hindsight, I ought to have ...\"],\"itemIds\":[\"enb2m6shouldhavetoldyou\",\"enb2m6oughttohavechecked\",\"enb2m6inhindsight\"],\"tip\":\"«In hindsight, I ought to have» es la versión que puntúa. Should have vale; ought to have sube banda.\"},{\"id\":\"enb2m6l2e4\",\"type\":\"bucket\",\"prompt\":\"¿Arrepentimiento o especulación?\",\"categories\":[\"ARREPENTIMIENTO — había que / no había que\",\"ESPECULACIÓN — era posible\"],\"items\":[{\"text\":\"I should have told you.\",\"bucket\":0},{\"text\":\"I shouldn't have said it like that.\",\"bucket\":0},{\"text\":\"I ought to have checked.\",\"bucket\":0},{\"text\":\"I might have waited a day.\",\"bucket\":1},{\"text\":\"It could have been worse.\",\"bucket\":1},{\"text\":\"I could have asked first.\",\"bucket\":1}],\"itemIds\":[\"enb2m6shouldhavetoldyou\",\"enb2m6shouldnthavesaidit\",\"enb2m6oughttohavechecked\",\"enb2m6mighthavewaited\",\"enb2m6couldhavebeenworse\",\"enb2m6couldhaveasked\"],\"tip\":\"Could have hace los dos oficios según el contexto. Aquí, sin if y con «first» o «worse», especula o consuela; no manda.\"},{\"id\":\"enb2m6l2e5\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"I should have told you.\",\"real\":\"I should've said something.\",\"translation\":\"Debería habértelo dicho / habría tenido que decir algo.\",\"itemIds\":[\"enb2m6shouldhavetoldyou\",\"enb2m6natsouldvesaid\"],\"tip\":\"En la calle, should've se come hasta el have: «shud-av» o «shudda». En el Writing, las dos palabras se escriben.\"},{\"id\":\"enb2m6l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa el arrepentimiento de examen\",\"text\":\"In hindsight, I ought to ___ checked.\",\"answers\":[\"have\"],\"translation\":\"Visto ahora, debería haberlo comprobado.\",\"hints\":[\"El mismo h-a-v-e de todo el módulo\",\"ha...\"],\"itemIds\":[\"enb2m6oughttohavechecked\",\"enb2m6inhindsight\"],\"tip\":\"Ought TO have: el to de ought no se cae. Should have no lo lleva. Son gemelos con una preposición de diferencia.\"},{\"id\":\"enb2m6l2e7\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué oficio tiene este might have?\",\"source\":\"I might have waited a day.\",\"answers\":[\"A lo mejor habría esperado un día\",\"Quizá habría esperado un día\",\"Puede que hubiera esperado un día\"],\"itemIds\":[\"enb2m6mighthavewaited\"],\"tip\":\"Si lo traduces por «debería haber esperado», le has puesto should. Might no se moja tanto.\"},{\"id\":\"enb2m6l2e8\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I shouldn't have said it like that.\",\"translation\":\"No debería haberlo dicho así.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de should not\",\"I shouldn't have ... it like that\"],\"itemIds\":[\"enb2m6shouldnthavesaidit\"],\"tip\":\"Shouldn't have suena «shudn-tav». Si escribes «should not have» en un dictado con contracción, el oído no te ha servido.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m6-2\",\"book\":\"I should have told you\",\"real\":\"I should've said something\",\"meaning\":\"Tendría que haber dicho algo / me arrepiento de haberme callado\",\"when\":\"Con amigos, al reconocer un silencio. En una disculpa formal o en el Writing, la misma frase se pone en hindsight: «In hindsight, I ought to have». La contracción should've no entra en un correo a un comité.\",\"register\":\"amigos\",\"exam\":\"In hindsight, I ought to have\",\"note\":\"«Said something» es más vago que «told you»: en la calle basta. En el examen, nombra qué.\",\"sound\":\"ai SHÚ-dav sed SÁM-zing\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m6natsouldvesaid\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"
