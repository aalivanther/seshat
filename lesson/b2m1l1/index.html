3c/b\u003e más \u003cb\u003esei-\u003c/b\u003e entero. El resto coincide con el indicativo y por eso no sirve para marcar la cita — eso va en la lección 2.\u003cbr/\u003e\u003cbr/\u003eTres formas, y las tres son correctas:\u003cbr/\u003e1. Con [[dass|dass]]: \u003ci\u003eEr sagte, dass er krank \u003cb\u003esei\u003c/b\u003e.\u003c/i\u003e Verbo al final.\u003cbr/\u003e2. Sin dass: \u003ci\u003eEr sagte, er \u003cb\u003esei\u003c/b\u003e krank.\u003c/i\u003e El verbo vuelve a la segunda posición.\u003cbr/\u003e3. Lo que ya traías del B1, el indicativo: \u003ci\u003eEr sagte, dass er krank \u003cb\u003eist\u003c/b\u003e.\u003c/i\u003e Se entiende; en prensa y en el Schreiben de B2 \u003cb\u003eno puntúa igual\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY el aviso que el español no te da: «dijo que viniera» es otra cosa. Aquí no hay subjuntivo de deseo. Hay \u003cb\u003eatribución\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m1l1\",\"phaseId\":\"b2m1\",\"title\":\"Er sei krank\",\"subtitle\":\"El Konjunktiv I corto: sei, habe, komme, könne, müsse\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La cita que no es tuya\",\"itemIds\":[\"b2m1sei\",\"b2m1habe\",\"b2m1komme\",\"b2m1koenne\",\"b2m1muesse\",\"b2m1schlagzeile\",\"b2m1quelle\",\"b2m1meldung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: un modo para no firmar\",\"body\":\"$17\",\"table\":[[\"infinitivo\",\"indicativo 3.sg\",\"Konjunktiv I 3.sg\"],[\"sein\",\"ist\",\"sei\"],[\"haben\",\"hat\",\"habe\"],[\"kommen\",\"kommt\",\"komme\"],[\"können\",\"kann\",\"könne\"],[\"müssen\",\"muss\",\"müsse\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l1e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento: esto ya es tuyo del B1\",\"pairs\":[{\"target\":\"sagen\",\"source\":\"decir\"},{\"target\":\"dass\",\"source\":\"que (frase entera)\"},{\"target\":\"behaupten\",\"source\":\"afirmar (algo discutible)\"},{\"target\":\
