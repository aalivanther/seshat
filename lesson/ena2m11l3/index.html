 hay quién llueva. En inglés eso no está permitido: \u003cb\u003etoda frase lleva sujeto\u003c/b\u003e, y cuando no hay nadie que haga la acción se pone \u003cb\u003e\u003ci\u003eit\u003c/i\u003e\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e rains a lot in London.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e's raining.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e will rain tomorrow.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eIt\u003c/b\u003e's cold.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEse \u003ci\u003eit\u003c/i\u003e no significa «ello» ni significa nada: es un relleno para que la silla del sujeto no esté vacía. Y no se cae nunca, ni cuando la frase se alarga: \u003ci\u003eI think \u003cb\u003eit\u003c/b\u003e will rain\u003c/i\u003e, \u003ci\u003eIf \u003cb\u003eit\u003c/b\u003e rains…\u003c/i\u003e, \u003ci\u003eDo you think \u003cb\u003eit\u003c/b\u003e'll be cold?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora fíjate en un reparto que el español no hace, y que decide si el verbo lleva -ing o no:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eit + adjetivo\u003c/b\u003e: \u003ci\u003eIt's sunny · It's cloudy · It's windy · It's cold · It's foggy.\u003c/i\u003e Aquí hay un \u003ci\u003ebe\u003c/i\u003e y un adjetivo, como en \u003ci\u003eI'm tired\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eit + verbo en -ing\u003c/b\u003e: \u003ci\u003eIt's raining · It's snowing · It's pouring.\u003c/i\u003e Aquí hay un verbo de verdad, en continuo.\u003cbr/\u003e\u003cbr/\u003ePor eso no existe \u003ci\u003eIt's raining weather\u003c/i\u003e ni \u003ci\u003eIt's sun\u003c/i\u003e: cada palabra está en un bando y no se mezclan. Con \u003ci\u003ewill\u003c/i\u003e, el adjetivo pide \u003cb\u003ebe\u003c/b\u003e delante —\u003ci\u003eIt'll \u003cb\u003ebe\u003c/b\u003e sunny\u003c/i\u003e— y el verbo no lo lleva —\u003ci\u003eIt'll rain\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la pregunta, que ya es tuya del A1 con una palabra cambiada:\u003c/b\u003e [[What's the weather like?|¿Qué tiempo hace?]] → \u003ci\u003eWhat \u003cb\u003ewill\u003c/b\u003e the weather \u003cb\u003ebe\u003c/b\u003e like tomorrow?\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l3\",\"phaseId\":\"ena2m11\",\"title\":\"The weather forecast\",\"subtitle\":\"Leer y oír un parte del tiempo — y el «it» que el español nunca pone\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario del parte\",\"itemIds\":[\"ena2m11theweatherforecast\",\"ena2m11showers\",\"ena2m11itllbecloudy\",\"ena2m11sunnyspells\",\"ena2m11chilly\",\"ena2m11freezing\",\"ena2m11anumbrella\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Un parte del tiempo se lee con veinte palabras, y son estas\",\"body\":\"$17\",\"table\":[[\"frío →\",\"→ calor\",\"cuándo se dice\"],[\"freezing\",\"boiling\",\"el tope de cada lado: exageración normal\"],[\"cold\",\"hot\",\"lo neutro, lo que ya traías del A1\"],[\"chilly\",\"warm\",\"el escalón intermedio: fresquito / templado\"],[\"wet · rainy\",\"dry\",\"de agua, no de temperatura\"],[\"cloudy · grey\",\"sunny · bright\",\"de nubes, no de temperatura\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«Llueve» no tiene sujeto en español, y en inglés sí: el «it» obligatorio\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l3e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la palabra del parte\",\"question\":\"El parte dice: “Showers in the afternoon.” ¿Qué significa?\",\"options\":[\"Chubascos: lluvia a ratos\",\"Nieve por la tarde\",\"Duchas calientes\"],\"answer\":0,\"whyWrong\":[null,\"Nieve es snow: «It'll snow» o «snow showers»\",\"Es la misma palabra que «ducha», sí, pero en el parte del tiempo significa lluvia a ratos\"],\"itemIds\":[\"ena2m11showers\"],\"tip\":\"Si en el parte oyes showers, sal con paraguas pero sin drama: es lluvia que va y viene, no un día
