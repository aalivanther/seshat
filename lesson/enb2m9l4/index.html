 habitat.\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eEvalúa las opciones\u003c/b\u003e — ventajas y costes, con reserva. \u003ci\u003eA park-and-ride would reduce congestion; it would not, however, protect the coast path.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eRecomienda una\u003c/b\u003e — con [[I would recommend + -ing|Recomendaría + -ing]], no con \u003ci\u003eI think we should\u003c/i\u003e. [[I would recommend siting the car park further north|Recomendaría ubicar el aparcamiento más al norte]].\u003cbr/\u003e\u003cbr/\u003eLos dos bloques que le dan el tono de propuesta y no de carta al director: [[in the interests of local wildlife|en beneficio de la fauna local]] y [[with a view to reducing congestion|con vistas a reducir los atascos]]. With a view to lleva \u003cb\u003e-ing\u003c/b\u003e, como toda preposición. \u003ci\u003eWith a view to reduce\u003c/i\u003e es el calco, y se ve mucho.\u003cbr/\u003e\u003cbr/\u003eY una cosa que una propuesta \u003cb\u003eno hace\u003c/b\u003e: no cuenta tu fin de semana. Eso es el relato del módulo 10. Si te piden una propuesta y escribes una anécdota, el criterio de Task fulfilment se cae entero — la regla dura del baremo: \u003ci\u003eoff-topic answers score nothing\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l4\",\"phaseId\":\"enb2m9\",\"title\":\"A proposal, not an opinion\",\"subtitle\":\"Informar, evaluar, recomendar: las tres patas de una propuesta\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El esqueleto de una propuesta\",\"itemIds\":[\"enb2m9aproposal\",\"enb2m9protectingopenspaces\",\"enb2m9theproposedroute\",\"enb2m9iwouldrecommend\",\"enb2m9intheinterestsof\",\"enb2m9withaviewto\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Una propuesta no es un ensayo, y LanguageCert la pone en el Reading 1\",\"body\":\"$17\",\"table\":[[\"Pata\",\"Qué hay\",\"Qué no hay\"],[\"Situación\",\"datos, the proposed route, cifras\",\"me parece tegories\":[\"Propuesta\",\"Carta de opinión\"],\"items\":[{\"text\":\"I would recommend siting the car park further north.\",\"bucket\":0},{\"text\":\"It is a disgrace that the council is ignoring us.\",\"bucket\":1},{\"text\":\"In the interests of local wildlife, the path should stay.\",\"bucket\":0},{\"text\":\"How would you feel if this were your village?\",\"bucket\":1},{\"text\":\"A park-and-ride would cut congestion by a third.\",\"bucket\":0},{\"text\":\"I urge readers to write to their MP.\",\"bucket\":1}],\"itemIds\":[\"enb2m9aproposal\",\"enb2m9intheinterestsof\"]},{\"id\":\"enb2m9l4e5\",\"type\":\"cloze\",\"prompt\":\"El bloque de propósito de una propuesta\",\"text\":\"The new park-and-ride is being built with a view to ___ congestion on the approach road.\",\"answers\":[\"reducing\"],\"translation\":\"El nuevo aparcamiento disuasorio se construye con vistas a reducir los atascos en la vía de acceso.\",\"itemIds\":[\"enb2m9withaviewto\",\"enb2m8congestion\"]},{\"id\":\"enb2m9l4e6\",\"type\":\"order\",\"prompt\":\"Ordena las tres patas de la propuesta\",\"sentences\":[\"The proposed route would cut across two public rights of way and a sensitive habitat.\",\"A park-and-ride on the north side would reduce congestion without touching the coast path.\",\"A bypass to the south would be cheaper to build, but it would destroy the dry-stone walls that give the valley its character.\",\"I would recommend siting the car park further north, in the interests of local wildlife.\"],\"translation\":\"Situación → las dos opciones evaluadas → recomendación.\",\"itemIds\":[\"enb2m9theproposedroute\",\"enb2m9iwouldrecommend\",\"enb2m9asensitivehabitat\"]},{\"id\":\"enb2m9l4e7\",\"type\":\"write\",\"prompt\":\"Una propuesta corta, 100-150 palabras: las tres patas, registro cortés\",\"scenario\":\"El ayuntamiento de Llynfaen (Gales) ha sacado a consulta el trazado de un aparcamiento nuevo junto a St Elen's Priory, que es Patrimonio de la Humanidad. Escribes una propuesta para el registro de la consulta. No es una queja: es un papel que alguien va a usar para decidir.\",\"genre\":\"proposal\",\"register\":\"polite\",\"bullets\":[\"Describe el problema de acceso actual en una o dos frases con dato.\",\"Evalúa DOS opciones (aparcamiento junto al priorato vs park-and-ride más al norte).\",\"Recomienda UNA, con I would recommend + -ing, y di en beneficio de qué.\"],\"checks\":[{\"re\":\"(congestion|approach road|footfall|right of way|coast path|visitor)\",\"label\":\"Describes el problema con un dato de acceso o de visitantes\"},{\"re\":\"(park-and-ride|park and ride|further north|bypass|two options|on the one hand)\",\"label\":\"Evalúas al menos dos opciones\"},{\"re\":\"recommend \\\\w+ing\",\"label\":\"Cierras con I would recommend + -ing\"}],\"frame\":[\"Título: Proposal: access to St Elen's Priory\",\"Párrafo 1 — situación: un dato (congestion / footfall / the approach road)\",\"Párrafo 2 — dos opciones, cada una con un coste\",\"Párrafo 3 — I would recommend + -ing · in the interests of… / with a view to…\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"however\",\"although\",\"therefore\",\"given that\",\"in the interests of\",\"with a view to\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":150,\"model\":\"Proposal: access to St Elen's Priory\\nThe approach road already carries more traffic than the village can absorb, and footfall at the priory has doubled in five years. Given that the site is a World Heritage site, any new parking has to protect the open space around the ruins.\\nA car park beside the visitor centre would be convenient. However, it would cut across a public right of way and a sensitive habitat. A park-and-ride further north would add a twelve-minute shuttle, but it would leave the coast path untouched.\\nI would therefore recommend siting the car park further north, in the interests of local wildlife and with a view to reducing congestion at the gate. I would be grateful if the committee could consider this.\",\"itemIds\":[\"enb2m9aproposal\",\"enb2m9iwouldrecommend\",\"enb2m9intheinterestsof\",\"enb2m9withaviewto\",\"enb2m9protectingopenspaces\",\"enb2m9giventhat\"],\"tip\":\"Cuenta las patas del modelo: situación con cifra, dos opciones con however, recomendación con recommend + -ing. Si te falta una, no es una propuesta: es una opinión.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
