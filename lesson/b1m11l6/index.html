hat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T914,"])</script><script>self.__next_f.push([1,"Vor zwei Jahren hätte ich nicht geglaubt, dass ich einmal in einem Wiener Café sitzen und über meine Zukunft schreiben würde. Damals studierte ich in Madrid, ich hatte einen kleinen Job, feste Zeiten und einen ruhigen [[Tagesablauf|el día a día]]. Alles war in Ordnung. Vielleicht war genau das das Problem.\u003cbr/\u003e\u003cbr/\u003eDann kam die E-Mail: Mein Antrag auf ein [[Stipendium|una beca]] war angenommen worden — ein Auslandssemester in Österreich. Ich habe drei Tage gebraucht, um Ja zu sagen. Nicht weil ich nicht wollte, sondern weil mir das Entscheiden immer schwerfällt. Meine Mutter war [[skeptisch|escéptica]]: „Und dein Studium hier? Und deine Freunde?“ Eine Freundin sagte dagegen nur einen Satz: „Wenn du es jetzt nicht machst, wirst du in zehn Jahren immer noch davon reden.“ Sie hatte recht.\u003cbr/\u003e\u003cbr/\u003eDie ersten Wochen waren hart. Mein Deutsch reichte für den Unterricht, aber nicht für den Alltag. Im Supermarkt verstand ich die Kassiererin nicht, im Sekretariat verstand ich die Formulare nicht, und im Kurs erzählte eine Mitstudentin, sie habe die [[Matura|el bachillerato, en Austria]] mit Auszeichnung gemacht — ich musste zweimal nachfragen, was das überhaupt ist. Nach einem Monat habe ich aufgehört, alles verstehen zu wollen. Seitdem ging es besser.\u003cbr/\u003e\u003cbr/\u003eHeute, acht Monate später, sieht mein Kalender anders aus. Ich arbeite zwölf Stunden pro Woche in einem Labor, ich habe zwei Freundinnen, mit denen ich nur Deutsch spreche, und ich weiß endlich, was ich beruflich will. Im Juli werde ich meine Arbeit abgeben, im September werde ich sie [[verteidigt|defendido]] haben, und dann steht die große Frage im Raum: bleiben oder zurückgehen?\u003cbr/\u003e\u003cbr/\u003eEhrlich gesagt habe ich noch keine Antwort. In Madrid warten meine Familie und eine Sprache, in der ich witzig sein kann. In Wien warten bessere [[Aussichten|perspectivas]] in meinem Fach und ein Leben, das ich selbst aufgebaut habe. Wer mir sagt, die Entscheidung sei einfach, hat sie noch nie treffen müssen.\u003cbr/\u003e\u003cbr/\u003eEines aber weiß ich sicher: Das Jahr hat mich nicht mutiger gemacht, sondern ehrlicher. Ich weiß jetzt, was ich aushalte und was nicht. Und das ist mehr wert als jedes Zertifikat, das ich in dieser Zeit bekommen habe.\u003cbr/\u003e\u003cbr/\u003e*Matura = österreichischer (und schweizerischer) Standard für „Abitur“."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m11l6\",\"phaseId\":\"b1m11\",\"title\":\"Lesen: Ein Semester in Wien\",\"subtitle\":\"Lectura larga de un blog austriaco — inferir la postura, no buscar datos\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cinco palabras que sostienen el texto\",\"itemIds\":[\"b1m11zkauslandssemester\",\"b1m11zkstipendium\",\"b1m11zkmatura\",\"b1m11zkmut\",\"b1m11zkerfahrung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto de B1 (y cómo NO)\",\"body\":\"En el A2 leías para \u003cb\u003elocalizar un dato\u003c/b\u003e. En el B1 se lee para \u003cb\u003einferir\u003c/b\u003e: qué opina quien escribe, qué siente, a quién se dirige. Eso casi nunca está dicho con todas las letras.\u003cbr/\u003eMétodo en tres pasos: \u003cb\u003e1)\u003c/b\u003e lee el título y el origen del texto y decide qué esperas encontrar; \u003cb\u003e2)\u003c/b\u003e lee entero SIN parar en cada palabra — las glosas subrayadas están ahí para tocarlas solo si el sentido se cae; \u003cb\u003e3)\u003c/b\u003e ve a las preguntas y busca la [[Belegstelle|el fragmento que lo demuestra]].\u003cbr/\u003eEste texto viene de Viena. El examen real es \u003cb\u003eplurizéntrico\u003c/b\u003e: mete textos de Austria y Suiza y anota a pie de página las palabras propias de allí. Aquí verás \u003cb\u003edie Matura\u003c/b\u003e — en Alemania se dice \u003ci\u003edas Abitur\u003c/i\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l6e1\",\"type\":\"read\",\"prompt\":\"Lee el texto entero de un tirón y responde después. Toca las palabras subrayadas solo si las necesitas.\",\"title\":\"Ein Semester in Wien — und dann?\",\"source\":\"Blog „Grenzenlos studieren“, Beitrag aus Wien\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m11l6e1q1\",\"q\":\"Wie ist die Autorin an den Studienplatz im Ausland gekommen?\",\"options\":[\"Über ein Stipendium\",\"Über einen Job in einem Labor\",\"Über eine Freundin in Wien\"],\"answer\":0,\"why\":\"„Mein Antrag auf ein Stipendium war angenommen worden.“\"},{\"id\":\"b1m11l6e1q2\",\"q\":\"Was meint die Autorin mit „Vielleicht war genau das das Problem“?\",\"options\":[\"Ihr Job in Madrid war zu anstrengend\",\"Ihr Leben war zu bequem und veränderte sich nicht\",\"Sie hatte zu wenig Geld zum Reisen\"],\"answer\":1,\"inference\":true,\"why\":\"Antes dice que todo estaba «en orden»: tranquilo, fijo, sin cambios. El «problema» es justo esa quietud.\"},{\"id\":\"b1m11l6e1q3\",\"q\":\"Warum fällt ihr die Wahl zwischen Wien und Madrid schwer?\",\"options\":[\"Weil beide Städte ihr etwas geben, was die andere nicht hat\",\"Weil sie in beiden Städten niemanden kennt\",\"Weil ihr Professor in Madrid auf sie wartet\"],\"answer\":0,\"inference\":true,\"why\":\"En Madrid: familia y su idioma. En Viena: perspectivas profesionales y una vida propia. Ninguna lista incluye a la otra.\"},{\"id\":\"b1m11l6e1q4\",\"q\":\"Was will die Autorin im letzten Absatz sagen?\",\"options\":[\"Zertifikate sind wichtiger als Erfahrungen\",\"Sie kennt sich selbst jetzt besser als vorher\",\"Sie ist mutiger geworden als alle anderen\"],\"answer\":1,\"inference\":true,\"why\":\"«nicht mutiger, sondern ehrlicher» + «ich weiß jetzt, was ich aushalte»: el balance es de autoconocimiento.\"},{\"id\":\"b1m11l6e1q5\",\"q\":\"Was ist bis September erledigt?\",\"options\":[\"Sie gibt ihre Arbeit ab\",\"Sie verteidigt ihre Arbeit\",\"Sie zieht nach Madrid zurück\"],\"answer\":1,\"why\":\"«Im Juli werde ich meine Arbeit abgeben, bis September werde ich sie verteidigt haben.»\"},{\"id\":\"b1m11l6e1q6\",\"q\":\"Für wen ist dieser Text vor allem geschrieben?\",\"options\":[\"Für Leute, die über einen Auslandsaufenthalt nachdenken\",\"Für Professoren an österreichischen Universitäten\",\"Für Touristen, die Wien besuchen wollen\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no informa de trámites ni de turismo: comparte dudas y balance con quien está ante la misma decisión.\"}],\"itemIds\":[\"b1m11zkauslandssemester\",\"b1m11zkstipendium\",\"b1m11zkmatura\",\"b1m11zkentscheidung\",\"b1m11zkerfahrung\"],\"tip\":\"Fíjate: la autora NUNCA escribe «ich bin unsicher». Lo demuestra con hechos. Eso es inferir postura.\"},{\"id\":\"b1m11l6e2\",\"type\":\"mc\",\"prompt\":\"Palabra del texto en su contexto\",\"question\":\"„Mein Deutsch reichte für den Unterricht, aber nicht für den Alltag.“ ¿Qué le pasaba?\",\"options\":[\"Entendía la clase pero no la vida diaria\",\"No entendía nada en clase\",\"Hablaba mejor en la calle que en clase\"],\"answer\":0,\"whyWrong\":[null,\"«reichte für den Unterricht» dice justo lo contrario\",\"El «aber nicht» invierte esa lectura\"],\"itemIds\":[\"b1m11zkerfahrung\"],\"tip\":\"reichen für = «alcanzar/dar para». Es de las palabras que más se repiten en los textos del examen.\"},{\"id\":\"b1m11l6e3\",\"type\":\"match\",\"prompt\":\"Empareja las palabras glosadas del texto\",\"pairs\":[{\"target\":\"das Stipendium\",\"source\":\"la beca\"},{\"target\":\"die Matura\",\"source\":\"el bachillerato (Austria y Suiza)\"},{\"target\":\"die Aussichten\",\"source\":\"las perspectivas\"},{\"target\":\"der Tagesablauf\",\"source\":\"el día a día\"}],\"itemIds\":[\"b1m11zkstipendium\",\"b1m11zkmatura\",\"b1m11zkauslandssemester\"],\"tip\":\"Matura es el austriacismo del texto. El examen real siempre lo anota a pie de página, como aquí.\"},{\"id\":\"b1m11l6e4\",\"type\":\"cloze\",\"prompt\":\"Reconstruye la frase clave del texto\",\"text\":\"Das Jahr hat mich nicht mutiger gemacht, ___ ehrlicher.\",\"answers\":[\"sondern\"],\"translation\":\"El año no me hizo más valiente, sino más honesta.\",\"hints\":[\"Tras una negación no va «aber»\",\"s___\"],\"itemIds\":[\"b1m11zkmut\"],\"tip\":\"nicht X, SONDERN Y. Tras negación, «pero» es sondern. «aber» ahí es el calco número uno del hispanohablante.\"},{\"id\":\"b1m11l6e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen del texto\",\"text\":\"Die Autorin hat ein ___ in Wien gemacht. Am Anfang war der Alltag schwer, aber die ___ hat sie verändert. Jetzt weiß sie nicht, ob sie bleiben soll: die ___ ist noch offen.\",\"answers\":[\"Auslandssemester\",\"Erfahrung\",\"Entscheidung\"],\"bank\":[\"Auslandssemester\",\"Erfahrung\",\"Entscheidung\",\"Absage\",\"Vorbereitung\",\"Heimat\"],\"translation\":\"La autora hizo un semestre en el extranjero en Viena. Al principio el día a día fue duro, pero la experiencia la cambió. Ahora no sabe si quedarse: la decisión sigue abierta.\",\"itemIds\":[\"b1m11zkauslandssemester\",\"b1m11zkerfahrung\",\"b1m11zkentscheidung\"]},{\"id\":\"b1m11l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el resumen de un compañero\",\"wrong\":\"Die Autorin hat die Entscheidung schon getroffen.\",\"answers\":[\"Die Autorin hat die Entscheidung noch nicht getroffen.\",\"Die Autorin hat die Entscheidung noch nicht getroffen\"],\"why\":\"El texto dice «Ehrlich gesagt habe ich noch keine Antwort». Confundir «ya» con «todavía no» es el error clásico de quien lee buscando palabras sueltas en vez de leer la postura.\",\"translation\":\"La autora todavía no ha tomado la decisión.\",\"itemIds\":[\"b1m11zkentscheidungtreffen\"]},{\"id\":\"b1m11l6e7\",\"type\":\"mc\",\"prompt\":\"Inferencia: la frase de la amiga\",\"question\":\"„Wenn du es jetzt nicht machst, wirst du in zehn Jahren immer noch davon reden.“ ¿Qué le está diciendo?\",\"options\":[\"Que hablar de planes está bien\",\"Que si no lo hace, se quedará en un arrepentimiento eterno\",\"Que dentro de diez años tendrá otra oportunidad\"],\"answer\":1,\"whyWrong\":[\"La frase es un reproche cariñoso, no un elogio\",null,\"No promete ninguna segunda oportunidad\"],\"itemIds\":[\"b1m11zkchance\"],\"tip\":\"En B1 las opiniones se dicen en forma de consecuencia. Traduce siempre la consecuencia a una postura.\"},{\"id\":\"b1m11l6e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la frase del texto\",\"text\":\"Nach einem Monat habe ich aufgehört, alles verstehen zu wollen.\",\"translation\":\"Al cabo de un mes dejé de querer entenderlo todo.\",\"hints\":[\"Nach einem Monat…\",\"…aufgehört, alles verstehen zu wollen\"],\"itemIds\":[\"b1m11zkaufhoerenmit\"]},{\"id\":\"b1m11l6e9\",\"type\":\"shadow\",\"prompt\":\"Sombrea la frase de balance\",\"text\":\"Ich weiß jetzt, was ich aushalte und was nicht.\",\"phonetic\":\"ij vais yetst, vas ij AUS-jal-te unt vas nijt\",\"translation\":\"Ahora sé lo que aguanto y lo que no.\",\"reps\":2,\"itemIds\":[\"b1m3durchhalten\"]},{\"id\":\"b1m11l6e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Die Entscheidung fällt mir schwer.\",\"forbid\":[\"Entscheidung\",\"schwer\"],\"answers\":[\"Ich kann mich einfach nicht entscheiden.\",\"Ich kann mich nicht entscheiden.\",\"Es fällt mir nicht leicht, mich zu entscheiden.\",\"Mir fällt es nicht leicht, mich zu entscheiden.\"],\"translation\":\"La decisión me cuesta.\",\"hints\":[\"Vuelve al verbo: sich entscheiden\",\"Ich kann mich … nicht …\"],\"itemIds\":[\"b1m11zkentscheidung\"]},{\"id\":\"b1m11l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción — tu resumen en una frase\",\"question\":\"La experiencia en el extranjero la ha cambiado, pero la decisión sigue abierta\",\"answers\":[\"Die Erfahrung im Ausland hat sie verändert, aber die Entscheidung ist noch offen\",\"Die Erfahrung im Ausland hat sie verändert, aber die Entscheidung ist noch offen.\",\"Die Erfahrung im Ausland hat sie verändert, aber die Entscheidung bleibt offen\"],\"hints\":[\"Die Erfahrung im Ausland hat sie …\",\"…, aber die Entscheidung ist noch offen\"],\"itemIds\":[\"b1m11zkerfahrung\",\"b1m11zkentscheidung\",\"b1m11zkausland\"],\"tip\":\"Dos nominalizaciones en una frase: así se resume un texto en el nivel B1.\"}]}],\"resources\":[{\"label\":\"derStandard.at — Uni \u0026 Karriere\",\"url\":\"https://www.derstandard.at/\",\"note\":\"Prensa austriaca: el mismo alemán del texto, con sus austriacismos incluidos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico
