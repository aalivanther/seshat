 lo diga — responder «yes, please» ya lo bordas.\"},{\"id\":\"ena1m3l6e11\",\"type\":\"gapbank\",\"prompt\":\"Completa la ficha de Valeria — sobran palabras del banco\",\"text\":\"Valeria fills in the form at the school. Her ___ name is Valeria and her ___ is Soto. She's twenty-five, so in the box for ___ she writes 25. And her phone ___ is 07700 900 123.\",\"answers\":[\"first\",\"surname\",\"age\",\"number\"],\"bank\":[\"first\",\"surname\",\"age\",\"number\",\"city\",\"country\"],\"translation\":\"Valeria rellena el formulario de la escuela. Su nombre es Valeria y su apellido es Soto. Tiene veinticinco, así que en la casilla de la edad escribe 25. Y su número de teléfono es 07700 900 123.\",\"hints\":[\"Nombre de pila y apellido no son la misma casilla\",\"city y country se quedan sin hueco\"],\"itemIds\":[\"enfirstname\",\"ensurname\",\"enage\",\"enphonenumber\"],\"tip\":\"Estas cuatro casillas son literalmente el Listening parte 4: alguien las dicta y tú las rellenas. Que te salgan de memoria.\"},{\"id\":\"ena1m3l6e12\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — hay UN solo error\",\"wrong\":\"This is a email address.\",\"answers\":[\"This is an email address.\"],\"why\":\"an va delante de SONIDO de vocal, y email empieza sonando «i»: an email. Es cuestión de oído, no de letra.\",\"translation\":\"Esto es una dirección de correo.\",\"hints\":[\"Di la frase en voz alta: ¿a-email suena bien?\",\"a → an\"],\"itemIds\":[\"enemailaddress\"],\"tip\":\"an email, an address, an age, an apple — y a phone number, a name, a city. Deja que decida la oreja.\"},{\"id\":\"ena1m3l6e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cuál es tu número de teléfono?\",\"answers\":[\"What's your phone number?\",\"What is your phone number?\"],\"hints\":[\"What's your ...\",\"phone number\"],\"itemIds\":[\"enwhatsyourphone\",\"enphonenumber\"],\"tip\":\"Con esta pregunta y tu email deletreado con at/dot, la parte 4 del Listening juega en tu campo.\"},{\"id\":\"ena1m3l6e9\",\"type\":\"audiomc\",\"prompt\":\"Solo con el oído: apunta el teléfono\",\"audio\":\"My phone number is oh two oh, eight one three, nine oh five.\",\"question\":\"¿Qué número apuntas?\",\"options\":[\"020 813 905\",\"020 831 905\",\"002 813 950\"],\"answer\":0,\"whyWrong\":[null,\"eight ONE three, no eight three one — el orden de las cifras manda\",\"El audio arranca oh two oh: 020, no 002\"],\"itemIds\":[\"enoh\",\"enphonenumber\"],\"tip\":\"El formulario del Listening T4, tal cual: oh = 0 y cada cifra en su sitio. Segunda escucha solo para verificar.\"},{\"id\":\"ena1m3l6e10\",\"type\":\"type\",\"prompt\":\"Cierre extra — tu email, en voz inglesa\",\"question\":\"amy@mail.com — escríbelo como se DICE en inglés\",\"answers\":[\"amy at mail dot com\"],\"hints\":[\"@ = at · . = dot\",\"amy at mail ...\"],\"itemIds\":[\"enat\",\"endot\",\"enemailaddress\"],\"tip\":\"Esta traducción simultánea símbolo→palabra es la que el examen (y todo Londres) da por hecha.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m3-2\",\"book\":\"a cup of tea\",\"real\":\"a cuppa\",\"meaning\":\"una taza de té — LA bebida nacional británica\",\"when\":\"En casa, en la oficina y en el café de Sam: «Fancy a cuppa?» = ¿te apetece un té? Por escrito y en el examen, la versión del libro: a cup of tea.\",\"register\":\"amigos\",\"note\":\"cup of tea se funde: el of casi desaparece y queda KÁ-pa\",\"sound\":\"a KÁ-pa\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"LanguageCert A1 Preliminary — material oficial\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a1-preliminary-2275\",\"note\":\"El Listening parte 4 es exactamente esto: rellenar un formulario con nombre, edad, teléfono y email.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name
