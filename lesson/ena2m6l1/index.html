 They \u003cb\u003eare going to\u003c/b\u003e move to Manchester. → \u003ci\u003eSe van a mudar a Manchester.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY aquí llega la única buena noticia que te va a dar el inglés hoy: \u003cb\u003ees exactamente lo que haces en español\u003c/b\u003e. «Voy a reservar» = \u003ci\u003eir a\u003c/i\u003e + infinitivo. La estructura es la misma pieza por pieza, así que no hay nada que reordenar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo único que hay que vigilar es el «be».\u003c/b\u003e En español el verbo \u003ci\u003eir\u003c/i\u003e se conjuga solo («voy», «vas», «vamos»); en inglés esa conjugación la lleva \u003cb\u003ebe\u003c/b\u003e, y sin él la frase no existe: \u003ci\u003eI going to book\u003c/i\u003e no es inglés. La contracción es obligatoria al hablar: \u003cb\u003eI'm · you're · he's · we're · they're\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué significa exactamente.\u003c/b\u003e Going to no es «el futuro» a secas: es lo que \u003cb\u003eya has decidido\u003c/b\u003e antes de abrir la boca. El plan existía antes de la frase. Por eso funciona tan bien para un viaje: cuando dices \u003ci\u003eI'm going to book a hotel\u003c/i\u003e, lo que estás contando es una decisión que ya tomaste.18:T5ab,"])</script><script>self.__next_f.push([1,"Esto hay que aclararlo hoy, porque si no lo arrastras el nivel entero. En el A1 aprendiste \u003cb\u003e[[I'm going to work.|Voy al trabajo (ahora, en camino).]]\u003c/b\u003e — el continuo de \u003ci\u003ego\u003c/i\u003e con un destino detrás. Y hoy has aprendido \u003cb\u003eI'm going to work harder\u003c/b\u003e — voy a esforzarme más. \u003cb\u003eMisma cara, dos cosas distintas.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eLa regla para decidir no es de gramática, es de ojo. \u003cb\u003eMira lo que va DETRÁS de «to»:\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e· Detrás hay un \u003cb\u003eSITIO\u003c/b\u003e → es \u003cb\u003emovimiento\u003c/b\u003e: vas allí. \u003ci\u003eI'm going to \u003cb\u003ethe station\u003c/b\u003e. · We're going to \u003cb\u003eBrighton\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e· Detrás hay un \u003cb\u003eVERBO\u003c/b\u003e en forma de diccionario → es \u003cb\u003eintención\u003c/b\u003e: eso es lo que piensas hacer. \u003ci\u003eI'm going to \u003cb\u003ebook\u003c/b\u003e a hotel. · I'm going to \u003cb\u003etake\u003c/b\u003e the train.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y por qué la frase del A1 era ambigua?\u003c/b\u003e Porque \u003ci\u003ework\u003c/i\u003e es las dos cosas a la vez: el sustantivo «el trabajo» y el verbo «trabajar». Lo mismo pasa con \u003ci\u003ehome\u003c/i\u003e, \u003ci\u003ebed\u003c/i\u003e o \u003ci\u003ethe shops\u003c/i\u003e. Cuando el inglés se queda con la duda, la resuelve con lo que viene después:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eI'm going to work.\u003c/b\u003e (y punto) → voy al trabajo.\u003cbr/\u003e· \u003cb\u003eI'm going to work harder.\u003c/b\u003e → voy a esforzarme más.\u003cbr/\u003e\u003cbr/\u003eCon cualquier otro verbo no hay duda posible, porque \u003ci\u003ebook\u003c/i\u003e, \u003ci\u003etake\u003c/i\u003e, \u003ci\u003estudy\u003c/i\u003e o \u003ci\u003emove\u003c/i\u003e no son sitios adonde ir. Así que en la práctica la ambigüedad se reduce a un puñado de palabras, y ya sabes cuáles son."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l1\",\"phaseId\":\"ena2m6\",\"title\":\"I'm going to book a hotel\",\"subtitle\":\"El futuro decidido — y por fin se aclara qué significa «I'm going to work»\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que ya tienes decidido\",\"itemIds\":[\"ena2m6imgoingtobook\",\"ena2m6weregoingtobrighton\",\"ena2m6imgoingtoworkharder\",\"ena2m6shesgoingtostudy\",\"ena2m6theyregoingtomove\",\"ena2m6whatareyougoingtodo\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tercer eje: el futuro que ya está decidido\",\"body\":\"$17\",\"table\":[[\"persona\",\"la frase entera\",\"en español\"],[\"I\",\"I'm going to book a hotel.\",\"Voy a reservar un hotel.\"],[\"you / we / they\",\"We're going to Brighton.\",\"Vamos a Brighton.\"],[\"he / she / it\",\"She's going to study Italian.\",\"Va a estudiar italiano.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«I'm going to work»: la frase que significa dos cosas (y cómo se decide)\",\"body\":\"$18\",\"table\":[[\"lo que va detrás de to\",\"qué es\",\"ejemplo\"],[\"un sitio (the station, Brighton, work)\",\"movimiento: vas allí\",\"I'm going to the station.\"],[\"un verbo (book, take, study)\",\"intención: eso vas a hacer\",\"I'm going to book a hotel.\"],[\"work / home, sin nada más\",\"movimiento (es lo que enseñó el A1)\",\"I'm going to work.\"],[\"work / home + más palabras\",\"intención\",\"I'm going to work harder.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m6l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la intención\",\"question\":\"“I'm going to book a hotel.”\",\"options\":[\"Voy a reservar un hotel\",\"Voy a un hotel\",\"Estoy reservando un hotel ahora mismo\"],\"answer\":0,\"whyWrong\":[null,\"Detrás de to hay un VERBO (book), no un sitio: es una intención, no un trayecto\",\"Eso sería «I'm booking a hotel» — el continuo normal, sin going to\"],\"itemIds\":[\"ena2m6imgoingtobook\"],\"tip\":\"Detrás de to, un verbo. Ese es el cartel que dice «esto es un plan», no un desplazamiento.\"},{\"id\":\"ena2m6l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — el transporte ya es tuyo del A1\",\"pairs\":[{\"target\":\"the train\",\"source\":\"el tren\"},{\"target\":\"the tube\",\"source\":\"el metro de Londres\"},{\"target\":\"a taxi\",\"source\":\"un taxi\"},{\"target\":\"the plane\",\"source\":\"el avión\"},{\"target\":\"on foot\",\"source\":\"a pie\"}],\"targetSeconds\":25,\"itemIds\":[\"entrain\",\"entube\",\"entaxi\",\"enplane\",\"enonfoot\"],\"tip\":\"El módulo entero se mueve en estos cinco. Que salgan sin pensar es media lección ganada.\"},{\"id\":\"ena2m6l1e3\",\"type\":\"bucket\",\"prompt\":\"La trampa del A1, desactivada: mira lo que va detrás de «to»\",\"categories\":[\"movimiento: va a un SITIO\",\"intención: va a HACER algo\"],\"items\":[{\"text\":\"I'm going to the station.\",\"bucket\":0},{\"text\":\"I'm going to book a hotel.\",\"bucket\":1},{\"text\":\"We're going to Brighton.\",\"bucket\":0},{\"text\":\"I'm going to take the train.\",\"bucket\":1},{\"text\":\"She's going to the beach.\",\"bucket\":0},{\"text\":\"She's going to study Italian.\",\"bucket\":1},{\"text\":\"I'm going to work.\",\"bucket\":0},{\"text\":\"I'm going to work harder.\",\"bucket\":1}],\"itemIds\":[\"ena2m6imgoingtobook\",\"ena2m6weregoingtobrighton\",\"ena2m6imgoingtoworkharder\",\"ena2m6shesgoingtostudy\",\"enimgoingtowork\"],\"tip\":\"Las dos últimas son la misma frase con dos palabras de más. Por eso la regla no es «going to significa X», sino «mira qué viene detrás».\"},{\"id\":\"ena2m6l1e4\",\"type\":\"mc\",\"prompt\":\"La regla, en una pregunta\",\"question\":\"¿Qué te dice si «I'm going to…» es un trayecto o un plan?\",\"options\":[\"Lo que va detrás de to: un sitio o un verbo\",\"La persona: I es trayecto, we es plan\",\"El tono de voz\"],\"answer\":0,\"whyWrong\":[null,\"La persona no decide nada: I'm going to work y we're going to work funcionan igual\",\"En escrito no hay tono, y aun así la frase se entiende: la información está en la palabra siguiente\"],\"itemIds\":[\"enimgoingtowork\",\"ena2m6imgoingtoworkharder\"]},{\"id\":\"ena2m6l1e5\",\"type\":\"cloze\",\"prompt\":\"El «be» que el español no pone\",\"text\":\"I ___ going to book a hotel in Brighton.\",\"answers\":[\"'m\",\"am\"],\"translation\":\"Voy a reservar un hotel en Brighton.\",\"hints\":[\"En español «voy» lleva la persona dentro; en inglés la lleva otra palabra\",\"I … going to…\"],\"itemIds\":[\"ena2m6imgoingtobook\"],\"tip\":\"«I going to book» es el error de arranque más común, y sale de que en español el verbo ir ya va conjugado. En inglés hace falta el be delante, siempre.\"},{\"id\":\"ena2m6l1e6\",\"type\":\"cloze\",\"prompt\":\"Y con «she»\",\"text\":\"Amy ___ going to study Italian next year.\",\"answers\":[\"is\",\"'s\"],\"translation\":\"Amy va a estudiar italiano el año que viene.\",\"hints\":[\"El be de tercera persona\",\"Amy … going to study…\"],\"itemIds\":[\"ena2m6shesgoingtostudy\"]},{\"id\":\"ena2m6l1e7\",\"type\":\"transform\",\"prompt\":\"Del presente de rutina al plan\",\"source\":\"We visit Emma every summer.\",\"instruction\":\"Ponla como plan, con going to y «next summer»\",\"answers\":[\"We're going to visit Emma next summer.\",\"We are going to visit Emma next summer.\",\"Next summer we're going to visit Emma.\"],\"translation\":\"El verano que viene vamos a visitar a Emma.\",\"hints\":[\"be + going to + el verbo tal cual, sin tocarlo\",\"We're going to v… Emma next summer.\"],\"itemIds\":[\"ena2m6theyregoingtomove\",\"enmyfavouriteseason\"]},{\"id\":\"ena2m6l1e8\",\"type\":\"build\",\"prompt\":\"Construye el plan\",\"target\":\"I'm going to book a hotel\",\"translation\":\"Voy a reservar un hotel\",\"distractors\":[\"booking\",\"goes\"],\"itemIds\":[\"ena2m6imgoingtobook\"]},{\"id\":\"ena2m6l1e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — este sale del «voy a reservando» que nadie diría en español, y aun así se escribe\",\"wrong\":\"I'm going to booking a hotel.\",\"answers\":[\"I'm going to book a hotel.\"],\"why\":\"Detrás de «going to» el verbo va en forma de diccionario, desnuda: book, take, study, move. La terminación -ing ya la lleva going, y un verbo no puede llevarla dos veces en la misma frase.\",\"translation\":\"Voy a reservar un hotel.\",\"itemIds\":[\"ena2m6imgoingtobook\"],\"tip\":\"Es el mismo motor que ya conoces de did + verbo desnudo: la pieza de delante se lleva toda la gramática y el verbo se queda limpio.\"},{\"id\":\"ena2m6l1e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta\",\"wrong\":\"What you are going to do on Saturday?\",\"answers\":[\"What are you going to do on Saturday?\"],\"why\":\"Con be, la pregunta se hace dándole la vuelta al sujeto y al verbo: are you, no you are. Es lo mismo que ya haces con «Are you busy?» — la palabra qu- delante no cambia esa regla, solo se pone al principio.\",\"translation\":\"¿Qué vas a hacer el sábado?\",\"itemIds\":[\"ena2m6whatareyougoingtodo\",\"enimbusy\"]},{\"id\":\"ena2m6l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"They're going to move to Manchester.\",\"translation\":\"Se van a mudar a Manchester.\",\"hints\":[\"They + be contraído + going to + verbo\",\"They're going to m… to Manchester.\"],\"itemIds\":[\"ena2m6theyregoingtomove\"]},{\"id\":\"ena2m6l1e12\",\"type\":\"match\",\"prompt\":\"Empareja cada plan con su traducción\",\"pairs\":[{\"target\":\"I'm going to work.\",\"source\":\"Voy al trabajo (estoy en camino)\"},{\"target\":\"I'm going to work harder.\",\"source\":\"Voy a esforzarme más\"},{\"target\":\"We're going to Brighton.\",\"source\":\"Vamos a Brighton\"},{\"target\":\"We're going to book a hotel.\",\"source\":\"Vamos a reservar un hotel\"}],\"itemIds\":[\"enimgoingtowork\",\"ena2m6imgoingtoworkharder\",\"ena2m6weregoingtobrighton\",\"ena2m6imgoingtobook\"],\"tip\":\"Fíjate en los pares 1-2 y 3-4: en cada uno cambia una sola cosa, lo que viene después de to. Y con eso cambia todo el significado.\"},{\"id\":\"ena2m6l1e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tus dos primeros planes de A2\",\"text\":\"We're going to Brighton on Saturday. I'm going to book a hotel.\",\"phonetic\":\"uía GÓU-in ta BRÁI-ton on SÁ-ta-dei. áim GÓU-in ta buk a jou-TÉL\",\"translation\":\"Vamos a Brighton el sábado. Voy a reservar un hotel.\",\"itemIds\":[\"ena2m6weregoingtobrighton\",\"ena2m6imgoingtobook\"],\"tip\":\"El «to» de en medio no se pronuncia «tu»: es una «ta» floja. GÓU-in-ta, todo pegado. En la lección 5 lo trabajamos entero.\"},{\"id\":\"ena2m6l1e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Qué vas a hacer el sábado? Voy a reservar un hotel.\",\"answers\":[\"What are you going to do on Saturday? I'm going to book a hotel.\",\"What are you going to do on Saturday? I am going to book a hotel.\"],\"hints\":[\"La pregunta invierte are y you · la respuesta lleva be + going to + verbo desnudo\",\"What a… you going to do on Saturday? I'm going to b… a hotel.\"],\"itemIds\":[\"ena2m6whatareyougoingtodo\",\"ena2m6imgoingtobook\"],\"tip\":\"Con esas dos frases ya puedes abrir y cerrar cualquier conversación sobre planes. Todo lo demás del módulo es afinar.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m6-1\",\"book\":\"We're going to travel by train.\",\"real\":\"We're getting the train.\",\"meaning\":\"Vamos en tren\",\"when\":\"Con amigos y compañeros, para un plan ya cerrado. En Reino Unido «get the train / get the bus» es lo normal para coger un transporte. En el examen escribe «take the train» o «go by train»: las dos puntúan y no suenan raras.\",\"register\":\"amigos\",\"note\":\"get es el comodín del inglés hablado: get the train, get a taxi, get home. En el papel, take.\",\"sound\":\"uía GUE-tin de TRÉIN\",\"level\":\"a2\",\"itemId\":\"entrain\"}}],\"resources\":[{\"label\":\"British Council — 'going to'\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/talking-about-the-future\",\"note\":\"Lee solo el primer apartado, el de going to (3 min). Ignora de momento todo lo que diga «will»: eso es del módulo 11.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq
