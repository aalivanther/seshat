sagt: Ich halt den zweiten Vorsatz für den besseren. So ein Datum macht Druck, und wer den Termin dann verpasst, hört ganz auf. Die zweite Person hat sich nur vorgenommen, es wieder zu versuchen. Genau so übersteht man auch das erste Jahr im Ausland."])</script><script>self.__next_f.push([1,"18:T793,"])</script><script>self.__next_f.push([1,"Schön, dass Sie so zahlreich gekommen sind. Ich berate jetzt seit zwölf Jahren Leute, die ins Ausland ziehen wollen, und ich fang immer mit demselben Satz an: Auswandern löst kein Problem, das Sie schon hier haben. Es verschiebt es höchstens. Wer geht, weil ihm die Arbeit fehlt, findet meistens Arbeit. Wer geht, weil ihm das Leben zu eng ist, nimmt die Enge im Koffer mit. So, und jetzt zum Praktischen. Unterschätzen Sie mir die ersten sechs Monate nicht. In dieser Zeit ist alles gleichzeitig neu — die Sprache, die Behörden, das Wetter und die Freunde, die noch fehlen. Und dann kommt das Heimweh, meistens nicht am Anfang, sondern so im vierten, fünften Monat. Das ist völlig normal, und das geht auch wieder vorbei. Zwei Dinge sollten Sie allerdings vor der Abreise erledigen und nicht danach. Erstens die Papiere: Lassen Sie Ihre Zeugnisse übersetzen, solange Sie noch hier sind — im Ausland dauert dasselbe, ähm, gut dreimal so lange. Zweitens das Geld: Rechnen Sie mit drei Monatsmieten, die Sie nicht verplanen. Wer ohne Reserve ankommt, nimmt die erste Stelle, die er bekommt, und nicht die richtige. Mein Rat für den Anfang: Nehmen Sie sich für das erste Jahr nichts Großes vor. Ein einziger Vorsatz reicht — zum Beispiel jede Woche einen Menschen ansprechen, der nicht aus Ihrem Land kommt. Und noch etwas zu den Vorsätzen selbst. Letzte Woche hat mir ein Teilnehmer geschrieben: „Ab Januar werde ich dreimal pro Woche joggen. Das habe ich mir fest vorgenommen.“ Eine Teilnehmerin schrieb dagegen: „Mit dem Rauchen aufzuhören ist mir letztes Jahr nicht gelungen. Dieses Jahr versuche ich es noch einmal, aber ohne festes Datum.“ Und ehrlich g merece la pena]] sich der Schritt.\u003c/b\u003e\",\"table\":[[\"obwohl / weil / damit\",\"verbo AL FINAL\"],[\"deshalb / trotzdem / allerdings\",\"posición 1 → INVERSIÓN\"],[\"und / aber / sondern / denn\",\"no cambian nada\"],[\"einerseits … andererseits\",\"pareja: dos caras del asunto\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l8e1\",\"type\":\"mc\",\"prompt\":\"¿Qué hace el conector al verbo?\",\"question\":\"„Ich bleibe hier, ___ die Miete sehr hoch ist.“\",\"options\":[\"trotzdem\",\"obwohl\",\"deshalb\"],\"answer\":1,\"whyWrong\":[\"trotzdem es adverbio: pediría «trotzdem ist die Miete hoch»\",null,\"deshalb también es adverbio y además cambia el sentido\"],\"itemIds\":[\"b1m7feallerdings\"],\"tip\":\"Si el verbo está al final (…ist), delante solo puede ir una conjunción subordinante.\"},{\"id\":\"b1m11l8e2\",\"type\":\"gapbank\",\"prompt\":\"Completa el comentario con los conectores del banco\",\"text\":\"___ ist Auswandern eine große Chance. ___ verliert man die Familie, ___ gewinnt man Erfahrung. ___ würde ich es jederzeit wieder machen.\",\"answers\":[\"Meiner Meinung nach\",\"Einerseits\",\"andererseits\",\"Trotzdem\"],\"bank\":[\"Meiner Meinung nach\",\"Einerseits\",\"andererseits\",\"Trotzdem\",\"obwohl\",\"weil\"],\"translation\":\"En mi opinión, emigrar es una gran oportunidad. Por un lado se pierde a la familia, por otro se gana experiencia. Aun así, lo volvería a hacer en cualquier momento.\",\"itemIds\":[\"b1m11zkmeinungnach\",\"b1m2einerseits\",\"b1m11zkchance\",\"b1m11zkerfahrung\"],\"tip\":\"Fíjate en el verbo tras cada hueco: los cuatro ocupan la posición 1 y los cuatro provocan inversión.\"},{\"id\":\"b1m11l8e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige la fórmula de opinión\",\"wrong\":\"In meiner Meinung ist das ein Fehler.\",\"answers\":[\"Meiner Meinung nach ist das ein Fehler.\",\"Meiner Meinung nach ist das ein Fehler\"],\"why\":\"«En mi opinión» no se calca. La fórmula alemana lleva la preposición DETRÁS: «Meiner Meinung nach…». Alternativa igual de buena: «Ich bin der Meinung, dass…».\",\"translation\":\"En mi opinión, eso es un error.\",\"itemIds\":[\"b1m11zkmeinungnach\"]},{\"id\":\"b1m11l8e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la posición del verbo\",\"wrong\":\"Deshalb ich denke, dass es sich lohnt.\",\"answers\":[\"Deshalb denke ich, dass es sich lohnt.\",\"Deshalb denke ich, dass es sich lohnt\"],\"why\":\"«deshalb» es un ADVERBIO en posición 1, así que el verbo conjugado tiene que ir inmediatamente después y el sujeto detrás: Deshalb denke ich… El español «por eso yo pienso» no tiene esa consecuencia.\",\"translation\":\"Por eso pienso que merece la pena.\",\"itemIds\":[\"b1m3eslohntsich\"]},{\"id\":\"b1m11l8e5\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿manda el verbo al final o provoca inversión?\",\"categories\":[\"Conjunción: verbo al final\",\"Adverbio: inversión\"],\"items\":[{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"weil\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"damit\",\"bucket\":0},{\"text\":\"allerdings\",\"bucket\":1}],\"itemIds\":[\"b1m7feallerdings\"],\"tip\":\"Truco de examen: si puedes ponerlo detrás del verbo sin que la frase se rompa, es adverbio.\"},{\"id\":\"b1m11l8e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 en formato real: una asesora habla casi tres minutos ante un público. UNA sola pasada y CINCO tareas seguidas. Lee las cinco preguntas antes de darle al play — en el examen tienes 60 segundos justos para eso.\",\"audio\":\"$17\",\"question\":\"¿Qué dice la asesora sobre emigrar?\",\"options\":[\"No resuelve los problemas que uno se lleva puestos\",\"Resuelve casi todos los problemas\",\"Solo merece la pena para quien ya tiene trabajo\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice literalmente lo contrario en su primera frase\",\"El trabajo es un ejemplo suyo, no una condición\"],\"itemIds\":[\"b1m11zkauswandern\",\"b1m11zkinsauslandziehen\"],\"tip\":\"«Es verschiebt es höchstens» — lo aplaza, como mucho. Ese verbo es la tesis entera de la charla, y es el material exacto para tu comentario de foro de hoy.\"},{\"id\":\"b1m11l8e13\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 2 de 5. Mismo texto, misma pasada.\",\"audio\":\"$18\",\"question\":\"¿Cuándo suele aparecer la morriña?\",\"options\":[\"Al cuarto o quinto mes\",\"Ya en la primera semana\",\"Solo después del primer año\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice expresamente que no suele venir al principio\",\"Habla de meses, no de años\"],\"itemIds\":[\"b1m11zkheimweh\"],\"tip\":\"En el Teil 2 los números son la mitad de las respuestas. Apúntalos según suenan, sin frase: «4-5 Mon. Heimweh». Mientras escribes una oración entera, el audio sigue.\"},{\"id\":\"b1m11l8e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 3 de 5. Mismo texto, misma pasada.\",\"audio\":\"$19\",\"question\":\"¿Qué aconseja para el primer año?\",\"options\":[\"Proponerse una sola cosa\",\"Proponerse lo máximo posible\",\"No dirigirle la palabra a nadie nuevo\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Pide justo lo contrario: «nichts Großes vor»\",\"Su ejemplo es precisamente hablar cada semana con alguien nuevo\"],\"itemIds\":[\"b1m11zkvorsatz\",\"b1m11zksichvornehmen\"],\"tip\":\"«sich etwas vornehmen» rige acusativo y va con dativo de persona: ich nehme MIR etwas vor. Es la fórmula del propósito, y aquí la oyes en boca de una nativa antes de escribirla tú.\"},{\"id\":\"b1m11l8e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 4 de 5. La asesora enumera: «Erstens… Zweitens…». Ahí van dos respuestas seguidas. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1a\",\"question\":\"Was soll man laut der Beraterin vor der Abreise erledigen?\",\"options\":[\"Die Zeugnisse übersetzen lassen\",\"Eine Stelle im Ausland unterschreiben\",\"Eine Wohnung im Ausland mieten\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Del trabajo dice más bien lo contrario: quien llega sin reserva acepta la primera oferta, y esa no suele ser la buena\",\"De alquilar piso antes de irse no habla en ningún momento\"],\"itemIds\":[\"b1m11zkvorbereitung\",\"b1m11zkaufenthalt\"],\"tip\":\"«Erstens… zweitens…» es la señal más fiable del Teil 2: anuncia una lista, y las listas son la mina de las preguntas. En cuanto la oigas, apunta dos palabras por punto y nada más.\"},{\"id\":\"b1m11l8e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 2, tarea 5 de 5 — la última, y es de opinión: hay que oír de qué lado se pone ella. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"$1b\",\"question\":\"Welchen Vorsatz hält die Beraterin für den besseren?\",\"options\":[\"Den ohne festes Datum\",\"Den mit dem Start im Januar\",\"Sie hält beide für gleich gut\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El de enero es justo el que critica: «So ein Datum macht Druck, und wer den Termin dann verpasst, hört ganz auf»\",\"Se moja: «Und ehrlich gesagt: Ich halt den zweiten Vorsatz für den besseren»\"],\"itemIds\":[\"b1m11zkvorsatz\",\"b1m11zksichvornehmen\",\"b1m11zkmeinungnach\"],\"tip\":\"La última tarea del Teil 2 suele preguntar por la OPINIÓN de quien habla, no por un dato. Se reconoce por las fórmulas: «Und ehrlich gesagt…», «Ich halt … für…». Y esa opinión llega casi siempre en los últimos treinta segundos, cuando ya has bajado la guardia.\"},{\"id\":\"b1m11l8e6\",\"type\":\"build\",\"prompt\":\"Construye la frase con inversión\",\"target\":\"Trotzdem würde ich es wieder machen\",\"translation\":\"Aun así lo volvería a hacer\",\"distractors\":[\"obwohl\",\"dass\"],\"itemIds\":[\"b1m7feallerdings\"]},{\"id\":\"b1m11l8e7\",\"type\":\"match\",\"prompt\":\"Empareja los Redemittel del comentario\",\"pairs\":[{\"target\":\"Meiner Meinung nach …\",\"source\":\"En mi opinión…\"},{\"target\":\"Einerseits … andererseits …\",\"source\":\"Por un lado… por otro…\"},{\"target\":\"Allerdings muss man sagen, dass …\",\"source\":\"Eso sí, hay que decir que…\"},{\"target\":\"Es lohnt sich.\",\"source\":\"Merece la pena.\"}],\"itemIds\":[\"b1m11zkmeinungnach\",\"b1m2einerseits\",\"b1m7feallerdings\",\"b1m3eslohntsich\"]},{\"id\":\"b1m11l8e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera (sin la fórmula de siempre)\",\"source\":\"Meiner Meinung nach ist das ein Fehler.\",\"forbid\":[\"Meinung\",\"Meiner\"],\"answers\":[\"Ich finde, dass das ein Fehler ist.\",\"Ich halte das für einen Fehler.\",\"Ich bin der Ansicht, dass das ein Fehler ist.\",\"Ich glaube, dass das ein Fehler ist.\"],\"translation\":\"En mi opinión, eso es un error.\",\"hints\":[\"Ich finde, dass…\",\"halten für + Akkusativ\"],\"itemIds\":[\"b1m11zkmeinungnach\"],\"tip\":\"Tener DOS fórmulas de opinión y alternarlas sube el criterio «Wortschatz: Spektrum». Repetir una sola lo baja.\"},{\"id\":\"b1m11l8e9\",\"type\":\"transform\",\"prompt\":\"Une las dos ideas con un adverbio\",\"source\":\"Die Miete ist hoch. Ich bleibe hier.\",\"instruction\":\"Únelas con «trotzdem» (¡inversión!)\",\"answers\":[\"Die Miete ist hoch. Trotzdem bleibe ich hier.\",\"Die Miete ist hoch, trotzdem bleibe ich hier.\"],\"translation\":\"El alquiler es alto. Aun así me quedo aquí.\",\"hints\":[\"Trotzdem abre la segunda frase\",\"Trotzdem ___ ich hier.\"],\"itemIds\":[\"b1m7feallerdings\"]},{\"id\":\"b1m11l8e10\",\"type\":\"cloze\",\"prompt\":\"Cierra el argumento\",\"text\":\"Der Schritt ist riskant, aber meiner Meinung nach ___ er sich.\",\"answers\":[\"lohnt\"],\"translation\":\"El paso es arriesgado, pero en mi opinión merece la pena.\",\"hints\":[\"Es l-o-h-n-t sich → tercera persona\",\"l___\"],\"itemIds\":[\"b1m3eslohntsich\",\"b1m11zkschritt\"]},{\"id\":\"b1m11l8e11\",\"type\":\"write\",\"prompt\":\"Escribe tu comentario en el foro (unas 80 palabras). Cierre de producción del módulo.\",\"scenario\":\"En el foro «Arbeiten im Ausland» alguien ha publicado que emigrar es huir de los problemas. Escribe tu comentario reaccionando a esa opinión y dando la tuya.\",\"genre\":\"forum\",\"register\":\"du\",\"stimulus\":{\"author\":\"Jonas_84\",\"text\":\"Ich verstehe diese Auswanderer nicht. Wer im Ausland arbeitet, läuft doch nur vor seinen Problemen weg. Wer bleibt, baut wenigstens etwas auf.\"},\"frame\":[\"Saluda a Jonas y di qué te parece su opinión\",\"Da tu propia opinión con una fórmula (Meiner Meinung nach…)\",\"Nombra una ventaja y una desventaja (einerseits… andererseits…)\",\"Cierra con lo que tú harás o harías, y devuélvele una pregunta\"],\"bullets\":[\"Reacciona directamente a Jonas (háblale de «du»)\",\"Da tu opinión con una fórmula de opinión\",\"Nombra una ventaja y una desventaja\",\"Cierra diciendo qué harás o qué harías\"],\"checks\":[{\"re\":\"(Jonas|deine Meinung|du (schreibst|sagst|hast|meinst))\",\"label\":\"Reacciona a Jonas\"},{\"re\":\"(Meiner Meinung nach|Ich bin der Meinung|Ich finde|Ich halte)\",\"label\":\"Fórmula de opinión\"},{\"re\":\"(einerseits|andererseits|Vorteil|Nachteil)\",\"label\":\"Ventaja y desventaja\"},{\"re\":\"(werde|würde)\",\"label\":\"Cierre con futuro o condicional\"}],\"minWords\":70,\"maxWords\":110,\"requireConnectors\":{\"min\":3,\"bank\":[\"Meiner Meinung nach\",\"einerseits\",\"andererseits\",\"allerdings\",\"deshalb\",\"trotzdem\",\"außerdem\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"model\":\"Hallo Jonas, deine Meinung finde ich zu hart. Meiner Meinung nach ist Auswandern kein Weglaufen, sondern eine Entscheidung. Einerseits verliert man wirklich viel: die Familie, die Freunde, die Sprache des Alltags. Andererseits lernt man in einem Jahr im Ausland mehr über sich selbst als in fünf Jahren zu Hause. Allerdings gebe ich dir in einem Punkt recht: Wer nur vor Problemen flieht, nimmt sie im Koffer mit. Deshalb werde ich erst dann gehen, wenn ich weiß, warum. Und du, warst du schon einmal länger im Ausland?\",\"itemIds\":[\"b1m11zkmeinungnach\",\"b1m2einerseits\",\"b1m7feallerdings\",\"b1m11zkauswandern\",\"b1m11zkentscheidung\"],\"tip\":\"Cuenta las palabras antes de entregar: por debajo del 50 % de lo pedido, la tarea entera vale CERO por muy bien escrita que esté.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1c:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1c\",\"6\",{}]]\n"])</script></body></html>
