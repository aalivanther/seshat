cortesía. Es la misma máquina que \u003ci\u003eIt is reported that\u003c/i\u003e: esconde el yo para que el texto sobreviva a quien lo firma.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eSolicitud no es matrícula.\u003c/b\u003e Mandar el formulario es presentar la solicitud. La plaza se confirma cuando se han visto las [[tuition fees|tasas]] o una carta de financiación. Un correo de «me interesa» no es una plaza. Un documento de Word no es una fuente.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCoursework, no un examen suelto.\u003c/b\u003e Ciento veinte créditos. Cada módulo de veinte se evalúa con trabajo de curso. El trabajo tardío se queda en el aprobado cinco días; después, un cero. Una [[extension|prórroga]] se concede una vez, con pruebas, tres días laborables antes. «Estaba liado» no es prueba.\u003cbr/\u003e\u003cbr/\u003eValeria lee el handbook en la cocina. Amy, que ha atravesado más reglamentos que nadie en esa casa, señala el párrafo de la prórroga. Nora pregunta si es el centro de al lado de la biblioteca. Lo es.18:Td98,"])</script><script>self.__next_f.push([1,"Applications for the part-time [[undergraduate course|grado / primer ciclo]] must be submitted by 17:00 on Friday 15 May. Late applications will not be considered. It should be noted that the deadline is a deadline: it is not a target and it is not a rumour. An application is understood to be complete only when the form, a [[personal statement|carta de motivación]] of 400 to 600 words, and evidence of a prior [[qualification|título o certificado]] have been received. Incomplete files are returned. They are not held.\u003cbr/\u003e\u003cbr/\u003e[[Enrolment|la matrícula]] is not the same as application. An offer, if one is made, is sent in writing. The place is not confirmed until [[tuition fees|las tasas académicas]] for the first term have been paid, or a student-finance letter has been seen. It is widely believed, among applicants who have never been through the process, that an email of interest counts as a place. It does not. Word is not a source. A paid invoice is.\u003cbr/\u003e\u003cbr/\u003eThe course is taught over two evenings a week and one Saturday a month. One hundred and twenty [[credits|créditos]] must be completed for the award. Each twenty-credit module is assessed by [[coursework|trabajo de curso]], not by a single unseen exam. Work must be submitted by 23:59 on the published date. Late work is capped at the pass mark if it arrives within five working days; after that it is given a mark of zero. An [[extension|prórroga]] may be granted once, and only if a request is received at least three working days before the deadline, with evidence. «I was busy» is not evidence. A medical note is.\u003cbr/\u003e\u003cbr/\u003eIt is expected that students will attend seminars. Attendance is not a rumour on a group chat. It is recorded. A student who misses four seminars in a term is invited to a meeting. The meeting is not a punishment. It is a chance to say whether the course is still possible. Places on this programme are limited. A place that is not being used is a place that could have been offered to someone on the waiting list.\u003cbr/\u003e\u003cbr/\u003eRecognition of prior learning is possible. Credits earned at another UK institution may be transferred if a transcript and a module description are provided. Credits from outside the UK are considered, not guaranteed. A [[degree|título universitario]] from another country is not automatically a degree here. The claim that «any university counts» has been denied in writing, more than once, by the admissions office.\u003cbr/\u003e\u003cbr/\u003eMs Kehinde Adeyemi, who signs the offers, was asked last year why the handbook is written in the passive. «Because the rule has no owner in the room,» she said. «If I write I will not mark late work, it becomes my mood. If the handbook writes late work will not be marked, it is the course. Who says so? The regulation. That is the point.»\u003cbr/\u003e\u003cbr/\u003eValeria Soto read the handbook on a Thursday, at the kitchen table, with a pencil. Amy, who trained as a nurse and who has sat through more handbooks than she cares to count, read the extension paragraph twice. «That's the sentence that catches people,» she said. «They think the deadline is a conversation. It is not. It is a date.» Nora, who was making tea, asked whether the college was the one by the library. It is. Applications are still being taken. The shop of rumours on Palmer Road has already decided that the course is full. That claim has not been independently verified. Until it is, the handbook is the source, and the handbook still says 15 May."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m4l11\",\"phaseId\":\"enb2m4\",\"title\":\"Apply by Friday\",\"subtitle\":\"Un reglamento de formación: la pasiva sin dueño, aplicada a un plazo\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del handbook\",\"itemIds\":[\"enb2m4applicationsmustbe\",\"enb2m4enrolment\",\"enb2m4tuitionfees\",\"enb2m4credits\",\"enb2m4coursework\",\"enb2m4anextension\",\"enb2m4personalstatement\",\"enb2m4lateworkcapped\",\"enb2m4undergraduate\",\"enb2m3deadline\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Who says so, cuando quien habla es un reglamento\",\"body\":\"$17\",\"table\":[[\"Calle\",\"Handbook\"],[\"You've got to send it by Friday.\",\"Applications must be submitted by Friday.\"],[\"They'll take it if you're a bit late.\",\"Late work is capped at the pass mark.\"],[\"I emailed them, so I'm in.\",\"Enrolment is not the same as application.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m4l11e1\",\"type\":\"match\",\"prompt\":\"Empareja cada pieza del reglamento\",\"pairs\":[{\"target\":\"enrolment\",\"source\":\"la matrícula: la plaza se confirma\"},{\"target\":\"tuition fees\",\"source\":\"las tasas académicas\"},{\"target\":\"120 credits\",\"source\":\"la carga del título\"},{\"target\":\"coursework\",\"source\":\"el trabajo de curso\"},{\"target\":\"an extension\",\"source\":\"una prórroga del plazo\"},{\"target\":\"a personal statement\",\"source\":\"la carta de motivación\"}],\"itemIds\":[\"enb2m4enrolment\",\"enb2m4tuitionfees\",\"enb2m4credits\",\"enb2m4coursework\",\"enb2m4anextension\",\"enb2m4personalstatement\"],\"tip\":\"«Matrícula» en español cubre dos cosas. En este handbook, enrolment es la plaza confirmada; application es el papel que mandas. Si las mezclas, das por hecha una plaza que no tienes.\"},{\"id\":\"enb2m4l11e2\",\"type\":\"mc\",\"prompt\":\"Solicitud o matrícula\",\"question\":\"Valeria ha mandado el formulario y la carta de motivación. ¿Tiene plaza?\",\"options\":[\"No: eso es la solicitud. La plaza se confirma cuando se han pagado las tasas o se ha visto la carta de financiación.\",\"Sí: un formulario enviado cuenta como matrícula.\",\"Sí, si el grupo de vecinos dice que el curso está lleno.\"],\"answer\":0,\"whyWrong\":[null,\"El handbook separa application y enrolment a propósito. Mandar el papel no es estar dentro.\",\"El grupo no es fuente. Word is not a source: es el mismo oficio del periódico de la L6.\"],\"itemIds\":[\"enb2m4enrolment\",\"enb2m4tuitionfees\",\"enb2m4applicationsmustbe\"]},{\"id\":\"enb2m4l11e3\",\"type\":\"read\",\"prompt\":\"Lee el reglamento entero. Toca las glosas si te bloquean. Al menos dos preguntas no están escritas con esas palabras.\",\"title\":\"Part-time undergraduate study: regulations at a glance\",\"source\":\"Camden Adult College, Applicant Handbook 2026/27 (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m4l11e3q1\",\"q\":\"When is an application understood to be complete?\",\"options\":[\"When the form, a personal statement of 400 to 600 words, and evidence of a prior qualification have been received.\",\"When the applicant has sent an email of interest.\",\"When the neighbourhood group says the course is full.\"],\"answer\":0,\"why\":\"«An application is understood to be complete only when the form, a personal statement… and evidence of a prior qualification have been received.»\"},{\"id\":\"enb2m4l11e3q2\",\"q\":\"What is the handbook doing when it separates enrolment from application?\",\"options\":[\"It is refusing to treat an email, or even a sent form, as a confirmed place until fees or a finance letter exist.\",\"It is saying that enrolment is optional and the form is enough.\",\"It is advertising a course that has already closed.\"],\"answer\":0,\"inference\":true,\"why\":\"No dice «un correo no vale» con esas palabras. Pone enrolment frente a application, niega el correo de interés, y cierra: Word is not a source. A paid invoice is. Hay que juntar las tres frases.\"},{\"id\":\"enb2m4l11e3q3\",\"q\":\"What happens to coursework that arrives six working days late?\",\"options\":[\"It is given a mark of zero: the five-day cap has expired.\",\"It is marked as normal, because the tutor is kind.\",\"It is automatically given an extension.\"],\"answer\":0,\"why\":\"«Late work is capped at the pass mark if it arrives within five working days; after that it is given a mark of zero.»\"},{\"id\":\"enb2m4l11e3q4\",\"q\":\"Why does Ms Adeyemi defend the passive?\",\"options\":[\"Because a rule with no owner in the room survives the person who signs it; «I will not mark» would be a mood.\",\"Because she cannot write in the active.\",\"Because the exam forbids the word «I» in every sentence.\"],\"answer\":0,\"inference\":true,\"why\":\"Ella no dice «la pasiva es de examen». Dice: If I write I will not mark late work, it becomes my mood. If the handbook writes late work will not be marked, it is the course. Who says so? The regulation. Es el módulo entero, dicho por quien firma las ofertas.\"},{\"id\":\"enb2m4l11e3q5\",\"q\":\"When Amy says the deadline is a date, not a conversation, what is she warning Valeria about?\",\"options\":[\"That people treat a published deadline as something they can negotiate, and the handbook does not.\",\"That the college has already closed the course.\",\"That Nora cannot read a handbook.\"],\"answer\":0,\"inference\":true,\"why\":\"Amy no usa «negociar». Lee dos veces el párrafo de la prórroga y dice: They think the deadline is a conversation. It is not. It is a date. El lector tiene que oír lo que el handbook acaba de regular: una prórroga, una vez, con pruebas, tres días antes.\"}],\"itemIds\":[\"enb2m4applicationsmustbe\",\"enb2m4enrolment\",\"enb2m4tuitionfees\",\"enb2m4credits\",\"enb2m4coursework\",\"enb2m4anextension\",\"enb2m4personalstatement\",\"enb2m4lateworkcapped\",\"enb2m4undergraduate\",\"enb2m4itshouldbenoted\",\"enb2m4whosaysso\",\"enb1m2qualification\",\"ena2m10adegree\",\"enb2m3deadline\"],\"tip\":\"Cuenta los «I» del handbook: cero, hasta que habla Adeyemi, y entonces el «I» sirve para explicar por qué no va. Eso es informar, no convencer.\"},{\"id\":\"enb2m4l11e4\",\"type\":\"mc\",\"prompt\":\"Las dos fuentes del cierre\",\"question\":\"El grupo de Palmer Road dice que el curso está lleno. El handbook, no. ¿Qué hace el texto?\",\"options\":[\"Registra el rumor, marca que no está verificado, y se queda con la fecha del handbook.\",\"Da la razón al grupo, porque Word is a source.\",\"Ignora el handbook y fía la plaza al chat.\"],\"answer\":0,\"whyWrong\":[null,\"«Word is not a source» es la frase del segundo párrafo. El cierre la cobra: That claim has not been independently verified.\",\"El último párrafo nombra el handbook como fuente y deja el 15 de mayo en pie.\"],\"itemIds\":[\"enb2m4informorconvince\",\"enb2m4whosaysso\",\"enb2m4enrolment\"],\"tip\":\"Misma operación que el Gazette y el grupo de la L6. El handbook informa. El rumor de la esquina convence. Who says so?\"},{\"id\":\"enb2m4l11e5\",\"type\":\"bucket\",\"prompt\":\"¿Aún no hay plaza, o ya está confirmada?\",\"categories\":[\"aún no hay plaza\",\"la plaza queda confirmada\"],\"items\":[{\"text\":\"the form, the personal statement and a qualification\",\"bucket\":0},{\"text\":\"an email of interest\",\"bucket\":0},{\"text\":\"first-term tuition fees paid\",\"bucket\":1},{\"text\":\"a student-finance letter that has been seen\",\"bucket\":1}],\"itemIds\":[\"enb2m4enrolment\",\"enb2m4tuitionfees\",\"enb2m4personalstatement\",\"enb1m2qualification\"],\"tip\":\"La oferta por escrito aún no es matrícula: el handbook lo dice. Hasta las tasas o la carta de financiación, sigues en el cubo de la izquierda.\"},{\"id\":\"enb2m4l11e6\",\"type\":\"cloze\",\"prompt\":\"La norma, sin dueño en la sala\",\"text\":\"Applications must be ___ by Friday.\",\"answers\":[\"submitted\"],\"translation\":\"Las solicitudes deben entregarse para el viernes.\",\"hints\":[\"Participio de submit\",\"subm...\"],\"itemIds\":[\"enb2m4applicationsmustbe\"],\"tip\":\"Must be submitted: modal + pasiva. «You must to submit» es el calco. La norma no te nombra.\"},{\"id\":\"enb2m4l11e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I need an extend of the deadline.\",\"answers\":[\"I need an extension of the deadline.\",\"I need an extension.\"],\"why\":\"Extend es el verbo. Extension es el nombre: la prórroga. El calco «un extend» nace de oír el verbo y escribirlo como cosa.\",\"translation\":\"Necesito una prórroga del plazo.\",\"itemIds\":[\"enb2m4anextension\",\"enb2m3deadline\"]},{\"id\":\"enb2m4l11e8\",\"type\":\"paraphrase\",\"prompt\":\"Sin «they» — como el handbook\",\"source\":\"They will not mark late work.\",\"forbid\":[\"they\"],\"answers\":[\"Late work will not be marked\",\"Late work will not be marked.\",\"Late work is not marked\",\"Late work is not marked.\"],\"translation\":\"No puntúan el trabajo tardío.\",\"hints\":[\"Sujeto: Late work\",\"Late work will not be ...\"],\"itemIds\":[\"enb2m4lateworkcapped\",\"enb2m4applicationsmustbe\"],\"tip\":\"Es la frase de Adeyemi. «I will not mark» es un humor. «Late work will not be marked» es el curso.\"},{\"id\":\"enb2m4l11e9\",\"type\":\"gapbank\",\"prompt\":\"Completa e
