u003e Quítala y la frase sigue en pie.\u003cbr/\u003e\u003ci\u003eAmy, \u003cb\u003ewho is a nurse\u003c/b\u003e, works nights.\u003c/i\u003e → ya sabemos quién es Amy; lo de la enfermería es información extra.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres reglas duras de la explicativa\u003c/b\u003e, y las tres caen en el examen:\u003cbr/\u003e· \u003cb\u003eNunca «that».\u003c/b\u003e \u003ci\u003eAmy, that is a nurse…\u003c/i\u003e ✗ → \u003ci\u003eAmy, who is a nurse…\u003c/i\u003e ✓\u003cbr/\u003e· \u003cb\u003eNunca se puede quitar el relativo.\u003c/b\u003e Lo de «the job I applied for» solo vale en la especificativa.\u003cbr/\u003e· \u003cb\u003eLas dos comas o ninguna.\u003c/b\u003e Abrir sin cerrar es el error de puntuación más caro del Writing, y la puntuación va \u003cb\u003edentro\u003c/b\u003e del criterio de Organisation: no es estética, son puntos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el uso que más rendimiento da:\u003c/b\u003e \u003ci\u003ewhich\u003c/i\u003e puede referirse a \u003cb\u003etoda la frase anterior\u003c/b\u003e, no solo a un sustantivo.\u003cbr/\u003e\u003ci\u003eI start at six, \u003cb\u003ewhich means\u003c/b\u003e I finish at two.\u003c/i\u003e\u003cbr/\u003eAquí el hispanohablante escribe \u003ci\u003ewhat means\u003c/i\u003e, porque en español es «lo que significa». \u003cb\u003e«what» no es un relativo en inglés\u003c/b\u003e: no puede hacer eso jamás.\u003cbr/\u003e\u003cbr/\u003eCon nombres propios (Amy, Ben, London, el nombre de una empresa) la relativa \u003cb\u003esiempre\u003c/b\u003e va con comas: ya sabemos cuál es, así que solo cabe añadir."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l7\",\"phaseId\":\"enb1m2\",\"title\":\"Amy, who is a nurse\",\"subtitle\":\"Las comas que cambian el significado — y valen puntos de Organisation\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Añadir un dato de más\",\"itemIds\":[\"enb1m2amywhoisanurse\",\"enb1m2cafewhichopened\",\"enb1m2whichmeans\",\"enb1m2benwhodrives\",\"enb1m2shiftpattern\",\"enb1m2workingnights\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: dos comas cambian lo que dice la frase\",\"body\":\"$17\",\"table\":[[\"Frase\",\"Qué significa\"],[\"The nurse who works nights is Amy.\",\"Hay varias enfermeras; hablamos de una\"],[\"Amy, who is a nurse, works nights.\",\"Ya sabes quién es Amy; te cuento algo más\"],[\"Amy, that is a nurse, works nights.\",\"MAL: «that» no entra en la explicativa\"],[\"I start at six, which means I finish at two.\",\"«which» = toda la frase de antes\"],[\"I start at six, what means I finish at two.\",\"MAL: «what» no es relativo en inglés\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l7e1\",\"type\":\"match\",\"prompt\":\"Empareja\",\"pairs\":[{\"target\":\"Amy, who is a nurse, works nights.\",\"source\":\"Amy, que es enfermera, trabaja de noche.\"},{\"target\":\"Ben, who drives a bus, starts at five.\",\"source\":\"Ben, que conduce un autobús, empieza a las cinco.\"},{\"target\":\"the shift pattern\",\"source\":\"el cuadrante de turnos\"},{\"target\":\"working nights\",\"source\":\"trabajar de noche\"}],\"itemIds\":[\"enb1m2amywhoisanurse\",\"enb1m2benwhodrives\",\"enb1m2shiftpattern\",\"enb1m2workingnights\"],\"tip\":\"Con nombre propio delante, la relativa va SIEMPRE con comas: no hace falta decir cuál es Amy, solo se puede añadir algo sobre ella.\"},{\"id\":\"enb1m2l7e2\",\"type\":\"mc\",\"prompt\":\"¿Qué dice cada frase?\",\"question\":\"«The nurse who works nights is called Amy.» significa que…\",\"options\":[\"hay varias enfermeras y hablamos de la de noches\",\"Amy es la única enfermera y además trabaja de noche\",\"todas las enfermeras trabajan de noche\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería con comas: «Amy, who works nights, is a nurse». Sin comas, la relativa está señalando a cuál de todas.\",\"La relativa no habla de todas: recorta el grupo a una.\"],\"itemIds\":[\"enb1m2amywhoisanurse\"],\"tip\":\"Prueba de bolsillo: quita la relativa. Si la frase sigue diciendo lo mismo, van comas. Si se queda coja («The nurse is called Amy» — ¿cuál?), no van.\"},{\"id\":\"enb1m2l7e3\",\"type\":\"bucket\",\"prompt\":\"¿Lleva comas o no?\",\"categories\":[\"SIN comas — dice CUÁL\",\"CON comas — añade un dato de más\"],\"items\":[{\"text\":\"The nurse ___ works nights is called Amy\",\"bucket\":0},{\"text\":\"Amy ___ who is a nurse ___ works nights\",\"bucket\":1},{\"text\":\"The job ___ pays best is the night shift\",\"bucket\":0},{\"text\":\"My new job ___ which starts in May ___ is part-time\",\"bucket\":1},{\"text\":\"The colleague ___ sits next to me is from Cali\",\"bucket\":0},{\"text\":\"Ben ___ who drives a bus ___ starts at five\",\"bucket\":1}],\"itemIds\":[\"enb1m2amywhoisanurse\",\"enb1m2benwhodrives\",\"enb1m2nightshift\"],\"tip\":\"Los tres de la derecha empiezan por un nombre propio o por «my new job»: cosas que ya están identificadas. Ahí solo cabe añadir, y añadir va entre comas.\"},{\"id\":\"enb1m2l7e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Amy, that is a nurse, works nights.\",\"answers\":[\"Amy, who is a nurse, works nights.\"],\"why\":\"«that» no entra nunca en la relativa con comas. En español «que» vale para las dos («Amy, que es enfermera…»), y de ahí sale el calco.\",\"translation\":\"Amy, que es enfermera, trabaja de noche.\",\"itemIds\":[\"enb1m2amywhoisanurse\"]},{\"id\":\"enb1m2l7e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I start at six, what means I finish at two.\",\"answers\":[\"I start at six, which means I finish at two.\"],\"why\":\"El español dice «lo que significa» y el alumno traduce «what». En inglés «what» no es un relativo: para referirse a toda la frase anterior se usa «which».\",\"translation\":\"Empiezo a las seis, lo que significa que acabo a las dos.\",\"itemIds\":[\"enb1m2whichmeans\"]},{\"id\":\"enb1m2l7e6\",\"type\":\"cloze\",\"prompt\":\"Completa el relativo que se refiere a TODA la frase\",\"text\":\"They took me on last Friday, ___ means I start in May.\",\"answers\":[\"which\"],\"translation\":\"Me contrataron el viernes pasado, lo que significa que empiezo en mayo.\",\"hints\":[\"No es «what»\",\"Empieza por wh… y tiene cinco letras\"],\"itemIds\":[\"enb1m2whichmeans\",\"enb1m2takeon\"],\"tip\":\"«…, which means…» es un bloque entero que puedes memorizar. Vale para cerrar cualquier frase con su consecuencia, y en el Writing sube el criterio de coherencia solo.\"},{\"id\":\"enb1m2l7e7\",\"type\":\"transform\",\"prompt\":\"Mete el dato extra dentro de la frase\",\"source\":\"Ben starts at five. He drives a bus.\",\"instruction\":\"Únelas con una relativa CON comas\",\"answers\":[\"Ben, who drives a bus, starts at five\",\"Ben, who drives a bus, starts at five.\"],\"translation\":\"Ben, que conduce un autobús, empieza a las cinco.\",\"hints\":[\"El nombre propio ya identifica: van comas\",\"Ben, who ..., starts at five\"],\"itemIds\":[\"enb1m2benwhodrives\"],\"tip\":\"Las dos comas van juntas o no van ninguna. Abrir y no cerrar es el error de puntuación que más se repite en el Writing del B1.\"},{\"id\":\"enb1m2l7e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el correo — cuidado con el relativo de cada hueco\",\"text\":\"Amy, ___ is a nurse, has been working nights since March. Her hospital, ___ is near the park, has changed the shift pattern again. She starts at eight in the evening, ___ means she gets home when I'm leaving. The only day ___ we see each other is Sunday.\",\"answers\":[\"who\",\"which\",\"which\",\"when\"],\"bank\":[\"who\",\"which\",\"when\",\"whose\",\"where\",\"what\"],\"translation\":\"Amy, que es enfermera, lleva trabajando de noche desde marzo. Su hospital, que está al lado del parque, ha vuelto a cambiar el cuadrante. Empieza a las ocho de la tarde, lo que significa que llega a casa cuando yo me voy. El único día en que nos vemos es el domingo.\",\"itemIds\":[\"enb1m2amywhoisanurse\",\"enb1m2whichmeans\",\"enb1m2shiftpattern\",\"enb1m2workingnights\"],\"tip\":\"«what» está en el banco a propósito: es el distractor del tercer hueco, y es exactamente el error que acabas de corregir dos ejercicios antes.\"},{\"id\":\"enb1m2l7e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"El café, que abrió en 2019, está siempre lleno.\",\"answers\":[\"The café, which opened in 2019, is always full\",\"The cafe, which opened in 2019, is always full\",\"The café, which opened in 2019, is always full.\"],\"hint\":\"Con comas, y nunca «that»\",\"itemIds\":[\"enb1m2cafewhichopened\"],\"tip\":\"Si lo escribes sin comas, la frase pasa a decir «el café que abrió en 2019» — o sea, que hay otros cafés y hablamos de ese. Dos comas cambian el sentido entero.\"},{\"id\":\"enb1m2l7e10\",\"type\":\"order\",\"prompt\":\"Ordena la historia de la solicitud\",\"sentences\":[\"In March, Valeria saw an advert on the notice board at the library.\",\"She filled in the form and sent it with her CV and a covering letter.\",\"Two weeks later the agency rang about the job she had applied for.\",\"The interview, which lasted twenty minutes, was on a Thursday.\",\"They took her on, which meant she could hand in her notice at the café.\"],\"translation\":\"En marzo Valeria vio un anuncio en el tablón de la biblioteca. Rellenó el formulario y lo mandó con el currículum y una carta de presentación. Dos semanas después la agencia llamó por el trabajo al que se había presentado. La entrevista, que duró veinte minutos, fue un jueves. La contrataron, lo que significaba que podía presentar su dimisión en el café.\",\"itemIds\":[\"enb1m2advert\",\"enb1m2fillinform\",\"enb1m2jobinterview\",\"enb1m2handinnotice\"],\"tip\":\"Fíjate en las pistas de orden: «In March», «Two weeks later», «which meant». Los marcadores de tiempo hacen la mitad del trabajo, y en el Reading Part 2 del examen son justo lo que se prueba.\"},{\"id\":\"enb1m2l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Amy, que es enfermera, trabaja de noche, lo que significa que casi no nos vemos.\",\"answers\":[\"Amy, who is a nurse, works nights, which means we hardly see each other\",\"Amy, who is a nurse, works nights, which means we almost never see each other\",\"Amy, who is a nurse, works nights, which means that we hardly see each other\"],\"hints\":[\"Dos comas alrededor del dato extra\",\"Amy, who ..., works nights, which means ...\"],\"itemIds\":[\"enb1m2amywhoisanurse\",\"enb1m2whichmeans\",\"enb1m2workingnights\"],\"tip\":\"Dos relativas explicativas en una frase, cuatro comas bien puestas y ni un «that» ni un «what». Eso ya no lo escribe un A2.\"},{\"id\":\"enb1m2l7e12\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe (las comas cuentan)\",\"text\":\"Ben, who drives a bus, starts at five.\",\"translation\":\"Ben, que conduce un autobús, empieza a las cinco.\",\"hints\":[\"Empieza por el nombre\",\"Ben, who ..., starts at five.\"],\"itemIds\":[\"enb1m2benwhodrives\"],\"tip\":\"Al hablar, las comas se oyen: hay una pausa antes y otra después del inciso, y la voz baja un poco. Si no las oyes, la relativa era de las otras.\"},{\"id\":\"enb1m2l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos compañeras hablan de un tercero. Dos escuchas.\",\"audio\":\"Did you hear about Marcus?|Marcus who works Saturdays, or Marcus from the warehouse?|The one from the warehouse. He got the sack on Friday.|No. What for?|Nothing he did, apparently. They lost the contract, so they let four people go. Which is redundancy, whatever they call it.\",\"question\":\"¿Qué le pasó de verdad a Marcus?\",\"options\":[\"Perdió el puesto porque la empresa perdió un contrato\",\"Lo despidieron por algo que hizo mal\",\"Se fue él por su cuenta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La primera voz lo descarta: «Nothing he did, apparently».\",\"Nadie dice que se fuera: «they let four people go».\"],\"itemIds\":[\"enb1m2natgotthesack\",\"enb1m2permanentcontract\"],\"tip\":\"«Marcus who works Saturdays, or Marcus from the warehouse?» — ahí tienes la relativa especificativa haciendo su trabajo: sirve para saber DE CUÁL de los dos se habla. Y al final, «which is redundancy» refiere a toda la frase anterior.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
