s enteras, con dos voces y datos repartidos. Por eso aparece el \u003cb\u003ecuaderno de notas\u003c/b\u003e: en el examen se puede escribir mientras suena, y aquí también.\u003cbr/\u003e3. \u003cb\u003eTu opinión.\u003c/b\u003e El B1 deja de preguntar «¿dónde vives?» y empieza a preguntar «¿qué te parece?». El examen entero gira sobre eso.\u003cbr/\u003e4. \u003cb\u003eAutonomía.\u003c/b\u003e Vas a escribir 100 palabras seguidas y a hablar minuto y medio sin que nadie te dé la frase.\u003cbr/\u003e\u003cbr/\u003eY arrancamos por donde arranca todo balance: \u003cb\u003elo que llevas hecho\u003c/b\u003e. Valeria lleva dos años en Londres. En español eso se dice con presente —«llevo dos años aquí»—; en inglés, \u003cb\u003ejamás\u003c/b\u003e: se dice con \u003cb\u003epresent perfect\u003c/b\u003e. Ahí está la trampa número uno del nivel, y por eso es la primera lección."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l1\",\"phaseId\":\"enb1m1\",\"title\":\"Two years in\",\"subtitle\":\"Bienvenido al B1 — y tus dos años contados en una sola frase\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El balance de dos años\",\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1movedin\",\"enb1m1sofar\",\"enb1m1settlein\",\"enb1m1homecountry\",\"enb1m1thingshavechanged\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué cambia ahora (y qué no)\",\"body\":\"$17\",\"table\":[[\"A1\",\"B1\"],[\"Carteles y notas de una línea\",\"Artículos de 280-450 palabras\"],[\"Audios de 20-30 segundos\",\"Conversaciones de varios minutos\"],[\"«Where do you live?»\",\"«What do you think about the rent here?»\"],[\"30-50 palabras escritas\",\"70-100 formales + 100-120 informales\"],[\"1 minuto de oral\",\"1,5 min de monólogo y negociar un acuerdo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del balance\",\"pairs\":[{\"target\":\"so far\",\"source\":\"hasta ahora / de momento\"},{\"target\":\"settle in\",\"source\":\"hacerse a un sitio nuevo\"},{\"target\":\"my home country\",\"source\":\"mi país de origen\"},{\"target\":\"I moved in two years ago.\",\"source\":\"Me instalé hace dos años.\"}],\"itemIds\":[\"enb1m1sofar\",\"enb1m1settlein\",\"enb1m1homecountry\",\"enb1m1movedin\"],\"tip\":\"«settle in» no es «sentarse»: es lo que estás haciendo tú con el inglés ahora mismo — dejar de estar de paso.\"},{\"id\":\"enb1m1l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — esto ya es tuyo del A1\",\"pairs\":[{\"target\":\"flat\",\"source\":\"piso\"},{\"target\":\"flatmate\",\"source\":\"compañero de piso\"},{\"target\":\"kitchen\",\"source\":\"cocina\"},{\"target\":\"expensive\",\"source\":\"caro\"},{\"target\":\"cheap\",\"source\":\"barato\"}],\"targetSeconds\":22,\"itemIds\":[\"enflat\",\"enflatmate\",\"enkitchen\",\"enexpensive\",\"encheap\"],\"tip\":\"El B1 no se gana añadiendo palabras: se gana sacando MÁS RÁPIDO las que ya tienes. El cronómetro aquí solo premia, nunca castiga.\"},{\"id\":\"enb1m1l1e3\",\"type\":\"mc\",\"prompt\":\"La trampa número uno del nivel\",\"question\":\"«Llevo dos años viviendo aquí» →\",\"options\":[\"I live here since two years.\",\"I've lived here for two years.\",\"I am living here since two years.\"],\"answer\":1,\"whyWrong\":[\"Dos errores de una vez: el presente («I live») y «since» con una duración. Es el calco literal del español.\",null,\"El presente continuo dice «ahora mismo», no «desde hace dos años».\"],\"itemIds\":[\"enb1m1havelivedhere\"],\"tip\":\"El español mantiene el presente para lo que empezó antes y sigue. El inglés obliga a present perfect: empezó en el pasado y TOCA el presente.\"},{\"id\":\"enb1m1l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I have lived here since two years.\",\"answers\":[\"I have lived here for two years.\"],\"why\":\"El tiempo verbal ya está bien; lo que falla es la preposición. «since» marca el PUNTO en que empezó (since 2023, since March). «for» marca la DURACIÓN (for two years).\",\"translation\":\"Llevo dos años viviendo aquí.\",\"itemIds\":[\"enb1m1havelivedhere\"]},{\"id\":\"enb1m1l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo\",\"text\":\"I ___ in London for two years.\",\"answers\":[\"have lived\",\"'ve lived\",\"have been living\",\"'ve been living\"],\"translation\":\"Llevo dos años en Londres.\",\"hints\":[\"No vale el presente: el inglés pide perfecto\",\"have + participio\"],\"itemIds\":[\"enb1m1havelivedhere\",\"enlondon\"],\"tip\":\"have + participio. Y ojo: el auxiliar es «have», no «has», porque el sujeto es «I».\"},{\"id\":\"enb1m1l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase del balance\",\"target\":\"I have lived in London for two years\",\"translation\":\"Llevo dos años viviendo en Londres\",\"distractors\":[\"since\",\"am\"],\"itemIds\":[\"enb1m1havelivedhere\",\"enlondon\"],\"tip\":\"Las dos fichas que sobran son justo las dos que pone un hispanohablante: «since» y «am».\"},{\"id\":\"enb1m1l1e7\",\"type\":\"transform\",\"prompt\":\"Del pasado cerrado al periodo abierto\",\"source\":\"I moved to London two years ago.\",\"instruction\":\"Dilo con present perfect y «for» (sigo aquí)\",\"answers\":[\"I have lived in London for two years\",\"I've lived in London for two years\",\"I have been in London for two years\",\"I've been in London for two years\"],\"translation\":\"Llevo dos años en Londres.\",\"hints\":[\"El periodo sigue abierto: have + participio\",\"I have ... in London for two years\"],\"itemIds\":[\"enb1m1movedin\",\"enb1m1havelivedhere\"],\"tip\":\"Las dos frases son verdad a la vez y dicen cosas distintas: «I moved two years ago» es un punto cerrado; «I've lived here for two years» es un periodo que llega hasta hoy.\"},{\"id\":\"enb1m1l1e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Hasta ahora todo ha ido bien.\",\"answers\":[\"So far everything has gone well\",\"So far, everything has gone well\",\"Everything has gone well so far\",\"So far so good\"],\"hint\":\"Empieza por la expresión de «hasta ahora»\",\"itemIds\":[\"enb1m1sofar\"],\"tip\":\"«so far» abre la puerta al present perfect: marca un periodo que llega hasta hoy, así que el pasado simple ahí chirría.\"},{\"id\":\"enb1m1l1e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"Things have changed a lot since 2023.\",\"answers\":[\"Las cosas han cambiado mucho desde 2023\",\"Todo ha cambiado mucho desde 2023\"],\"itemIds\":[\"enb1m1thingshavechanged\"],\"tip\":\"«since» + año, mes o fecha. Nunca «since» + duración: eso es «for».\"},{\"id\":\"enb1m1l1e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"I've lived here for two years.\",\"translation\":\"Llevo dos años viviendo aquí.\",\"strictContractions\":true,\"hints\":[\"Empieza con la contracción de «I have»\",\"I've lived here ...\"],\"itemIds\":[\"enb1m1havelivedhere\"],\"tip\":\"«I've» suena casi como «aiv», una sola sílaba. Si oyes «I lived» te has comido el perfecto — y ese es el error que se cobra en el examen.\"},{\"id\":\"enb1m1l1e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es tu primera frase de B1\",\"text\":\"I've lived here for two years, and I've settled in.\",\"phonetic\":\"aiv livd JÍA fo tuu YÍAS̬, and aiv SÉ-told in\",\"translation\":\"Llevo dos años aquí y ya me he adaptado.\",\"itemIds\":[\"enb1m1havelivedhere\",\"enb1m1settlein\"],\"tip\":\"Fíjate en el ritmo: LIVED y SETTLED llevan el golpe, «I've» y «and» pasan de puntillas. El inglés es de ritmo acentual; el español, silábico. Ahí está la mitad de tu acento.\"},{\"id\":\"enb1m1l1e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me instalé hace dos años y me he adaptado rápido.\",\"answers\":[\"I moved in two years ago and I have settled in quickly\",\"I moved in two years ago and I've settled in quickly\",\"I moved in two years ago and I have settled in fast\"],\"hints\":[\"Primera mitad: punto cerrado → pasado simple\",\"Segunda mitad: resultado que dura → present perfect\"],\"itemIds\":[\"enb1m1movedin\",\"enb1m1settlein\"],\"tip\":\"Dos tiempos verbales distintos en una sola frase, y cada uno por un motivo. Eso ya es B1.\"},{\"id\":\"enb1m1l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES de darle al play. Dos escuchas, como en el examen.\",\"audio\":\"Hi, it's Amy. Listen, I've just got back from the agency and, um, they said the landlady wants an answer by Friday. I've already sent her our references, so we only need to sort out the deposit. Give me a ring when you finish at the café, yeah?\",\"question\":\"¿Qué queda por resolver?\",\"options\":[\"Las referencias\",\"La fianza\",\"La fecha de la visita\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Las referencias ya están enviadas: «I've already sent her our references».\",null,\"De visita no se habla: la decisión ya está tomada.\"],\"itemIds\":[\"enb1m1already\",\"enb1m1deposit\"],\"tip\":\"«already» dice que eso YA está hecho. En el Listening del examen, los adverbios de perfecto (already, yet, just, still) son la pista que separa lo hecho de lo pendiente.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m1-1\",\"book\":\"I have lived here for two years.\",\"real\":\"I've been here two years now.\",\"meaning\":\"Llevo aquí dos años ya\",\"when\":\"Hablando, con cualquiera: es lo que dice de verdad un londinense. Se come el «for» y añade «now». En el Writing NO: allí el «for» va escrito y la forma continua suma en el criterio de gramática.\",\"register\":\"neutral\",\"exam\":\"I've been living in London for two years.\",\"note\":\"El «now» final no significa «ahora»: significa «a estas alturas». Y el «for» desaparece en el habla porque la duración ya se entiende — pero desaparece solo cuando la dices, nunca cuando la escribes.\",\"sound\":\"aiv bin JÍA
