ation\":\"Además del alquiler, está el impuesto municipal.\",\"itemIds\":[\"enb2m1inadditionto\"]},{\"id\":\"enb2m1l3e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el informe corto del mostrador\",\"text\":\"The first email buried the request. ___, two neighbours had already missed a collection. ___ the rent, residents now pay for extra bags. There is one problem, ___ the opening line. ___, Valeria rewrote the whole thing.\",\"answers\":[\"Moreover\",\"In addition to\",\"namely\",\"As a result\"],\"bank\":[\"Moreover\",\"In addition to\",\"namely\",\"As a result\",\"because\",\"so\",\"although\"],\"translation\":\"El primer correo enterraba la petición. Es más, dos vecinos ya se habían perdido una recogida. Además del alquiler, los vecinos pagan ahora las bolsas extra. Hay un problema, a saber: la primera línea. Como resultado, Valeria lo reescribió entero.\",\"itemIds\":[\"enb2m1moreover\",\"enb2m1inadditionto\",\"enb2m1namely\",\"enb2m1asaresult\"],\"tip\":\"«Furthermore» no está en el banco a propósito: es sinónimo de moreover y el hueco tendría dos claves. En un informe real podrías usar cualquiera; en un hueco, no.\"},{\"id\":\"enb2m1l3e5\",\"type\":\"paraphrase\",\"prompt\":\"Súbelo de registro — sin «what's more»\",\"source\":\"What's more, the bus is late every morning.\",\"forbid\":[\"what's more\",\"whats more\"],\"answers\":[\"Moreover, the bus is late every morning\",\"Moreover, the bus is late every morning.\",\"Furthermore, the bus is late every morning\",\"Furthermore, the bus is late every morning.\",\"In addition, the bus is late every morning\"],\"translation\":\"Es más, el autobús llega tarde todas las mañanas.\",\"itemIds\":[\"enb2m1whatsmore\",\"enb2m1moreover\",\"enb2m1furthermore\"],\"tip\":\"Misma función, otra altura. El Writing 1 del examen no quiere «what's more». El Speaking Part 1 sí lo acepta.\"},{\"id\":\"enb2m1l3e6\",\"type\":\"transform\",\"prompt\":\"De la calle al examen\",\"source\":\"The thing is that the request comes too late.\",\"instruction\":\"Dilo con The problem is that…\",\"answers\":[\"The problem is that the request comes too late\",\"The problem is that the request comes too late.\"],\"translation\":\"El problema es que la petición llega demasiado tarde.\",\"itemIds\":[\"enb2m1thethingisthat\",\"enb2m1theproblemis\"]},{\"id\":\"enb2m1l3e7\",\"type\":\"cloze\",\"prompt\":\"El marcador que define\",\"text\":\"There is one problem, ___ the opening line.\",\"answers\":[\"namely\"],\"translation\":\"Hay un problema, a saber: la primera línea.\",\"hints\":[\"Nombra lo que acabas de anunciar\",\"name-ly\"],\"itemIds\":[\"enb2m1namely\"]},{\"id\":\"enb2m1l3e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa en un informe?\",\"source\":\"Thus, the first sentence has to carry the point.\",\"answers\":[\"Así pues, la primera frase tiene que llevar el punto\",\"Por tanto, la primera frase tiene que llevar el punto\",\"Así pues, la primera oración tiene que llevar la idea principal\"],\"itemIds\":[\"enb2m1thus\"],\"tip\":\"«Thus» no es «así» de «así, me fui». Es «así pues»: cierra un razonamiento. Si lo pones en una receta, suena a juez.\"},{\"id\":\"enb2m1l3e9\",\"type\":\"shadow\",\"prompt\":\"Sombra el foco hablado — pegado al audio\",\"text\":\"The thing is, I haven't got time.\",\"phonetic\":\"de zing is̬, ai JÁ-vent got taim\",\"translation\":\"Es que no tengo tiempo.\",\"reps\":2,\"itemIds\":[\"enb2m1natthethingis\"]},{\"id\":\"enb2m1l3e10\",\"type\":\"speak\",\"prompt\":\"Ahora el de examen, en voz alta\",\"text\":\"The reason for this is that the first line buried the request.\",\"phonetic\":\"de RÍI-s̬on fo dhis is̬ dat de feest lain BÉ-rid de ri-KUÉST\",\"translation\":\"La razón de esto es que la primera línea enterraba la petición.\",\"itemIds\":[\"enb2m1thereasonthat\"]},{\"id\":\"enb2m1l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Es más, no se consultó a nadie. Como resultado, reescribió el correo.\",\"answers\":[\"Mor
