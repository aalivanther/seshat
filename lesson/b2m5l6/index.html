m Dienstag vor rund achtzig Anwohnern.\n\nSofía Marín, die den Antrag mit unterschrieben hat, argumentiert sowohl mit der Sicherheit der Kinder als auch mit der Luft. «Weder die Zahl der Unfälle noch die Messwerte an der Kreuzung sind ein Zufall», sagte sie. «Zwar brauchen die Geschäfte Lieferungen, aber die Lieferungen können morgens kommen, ohne dass der ganze Tag verloren geht.» Sie sprach sich klar dafür aus.\n\nNico, Koch im Viertel, räumte ein, dass die Straße laut sei. Dem konnte er sich nicht anschließen, dass eine Spielstraße die Lösung sei. «Einerseits verstehe ich die Eltern. Andererseits fährt bei uns der Lieferwagen dreimal am Tag vor. Ohne die Straße, geschweige denn ohne den Parkplatz davor, geht der Betrieb nicht.» Er bat um Differenzierung: nicht die ganze Straße, sondern zwei Stunden am Nachmittag.\n\nDie Umfrage, die der Kiezverein in der Vorwoche durchgeführt hat, zeigt eine knappe Mehrheit für die Spielstraße — vierundfünfzig Prozent. Die Minderheit ist allerdings laut, und sie hat einen Einwand, den Lena Krüger nicht vom Tisch wischte: Beteiligung ohne Folge sei Theater. «Zumal wir schon zweimal abgestimmt haben», rief jemand aus der hinteren Reihe.\n\nGenau da setzt dieser Leitartikel an. Bürgerbeteiligung lohnt sich nur, insofern die Verwaltung die Ergebnisse ernst nimmt. Sofern das Bezirksamt den Kompromiss in den Plan schreibt, war der Abend keine Show. Wohingegen eine weitere Versammlung ohne Beschluss den Zusammenhalt gefährdet, nicht stärkt.\n\nClara Hofmann, die für dieses Blatt berichtet, hat drei Abende dieser Art in einem Monat besucht. Ihr Befund: Die Debatte spitzt sich zu, wo man nicht differenziert. Indem man die andere Seite nachvollzieht, ohne dass man die eigene These aufgibt, entsteht das, was der Kiez wirklich braucht: einen Kompromiss, den sowohl die Eltern als auch die Betriebe tragen können.\n\nDas Ehrenamt trägt diese Abende. Ohne die Nachbarinnen, die Stühle stellen, und ohne Lena Krüger, die das Wort verteilt, gäbe es die Versammlung nicht. Geschweige denn ein Protokoll, das das Amt lesen kann. Wer sich dagegen ausspricht, dass «immer dieselben» reden, hat recht — und sollte selbst kommen.\n\nWir sprechen uns dafür aus, die Lindenstraße nachmittags zur Spielstraße zu machen, wobei die Lieferzeiten am Morgen bleiben. Das mag für die einen zu wenig sein; dennoch ist es mehr, als eine Mehrheit über eine Minderheit zu stülpen. Meinungsfreiheit heißt auch, zuzuhören. Aufeinander zugehen ist unbequem. Es ist trotzdem der einzige Weg, der diesen Kiez nicht spaltet."])</script><script>self.__next_f.push([1,"18:Tcba,"])</script><script>self.__next_f.push([1,"Im Jänner* hat unser Grätzl* die vierte Bürgerversammlung in sechs Monaten erlebt. Das Thema war, wieder einmal, eine Begegnungszone in der Lerchengasse. Wieder einmal gab es Kaffee, Namensschilder und eine Moderatorin, die um Ruhe bat. Wieder einmal ging niemand mit einem Beschluss nach Hause. Wer die Stiege* des Bezirksamts hinaufsteigt, findet an der Pinnwand das Protokoll — und darunter den Satz, den niemand hören will: «Wird weiter beraten.»\n\nDie Befürworter sprechen von Meinungsfreiheit und Zusammenhalt. Das mag zutreffen; dennoch stellt sich eine andere Frage, die in Berlin offenbar niemand stellen mag: Wieviel Debatte verträgt ein Grätzl, bevor aus Beteiligung Theater wird? Weder die Zahl der Abende noch die Länge der Redelisten sagt etwas über die Qualität der Entscheidung. Wohingegen jede Woche ohne Beschluss den Lieferverkehr, die Eltern und die Hausverwaltungen im Unklaren lässt.\n\nEine Umfrage des Bezirks vom vergangenen Herbst zeigte keine Mehrheit, sondern ein Unentschieden: 41 Prozent dafür, 39 dagegen, der Rest unentschieden. Insofern die Verwaltung «die Stimmen hören» will, hat sie sie gehört. Sofern sie daraus keinen Plan macht, ist die nächste Versammlung keine Beteiligung, sondern eine Wiederholung. Zumal dieselben zwanzig Gesichter reden — und dieselben zwanzig zu Hause bleiben, weil sie nach der Schicht keine Kraft mehr haben für ein Ehrenamt, das sich anfühlt wie ein zweiter Job.\n\nMan könnte einwenden, ohne Versammlung hätten die stillen Anwohner gar keine Stimme. Das Gegenargument ist unbequem und trotzdem stichhaltig: Wer dreimal kommt und dreimal dasselbe sagt, nimmt anderen die Zeit. Indem man «alle» einlädt, lädt man in Wahrheit die ein, die Zeit haben. Die Minderheit der Lauten wird zur Mehrheit der Anwesenden, ohne dass jemand das so nennen würde.\n\nWir sprechen uns nicht gegen Beteiligung aus. Wir sprechen uns dagegen aus, Beteiligung mit Entscheidung zu verwechseln. Ein Kompromiss, der auf dem Papier steht, ist mehr wert als vier Abende, an denen man aufeinander zugeht und hinterher auf derselben Stiege wieder auseinandergeht. Geschweige denn ein fünfter Abend im März, der dasselbe Protokoll produziert.\n\nWas in Berliner Leitartikeln gern «aufeinander zugehen» heißt, sieht von der Stiege in Ottakring oft anders aus: dieselben Gesichter, dieselben Sätze, und unten wartet schon der nächste Lieferwagen, der nicht weiß, ob er halten darf. Die Meinungsfreiheit ist damit nicht in Gefahr. In Gefahr ist die Geduld der Leute, die arbeiten und trotzdem kommen — und derer, die nicht mehr kommen, weil sie den Abend dreimal ohne Schlussfolgerung verlassen haben.\n\nDer Bezirk sollte entweder beschließen oder ehrlich sagen, dass er nicht beschließen will. Teils reden, teils entscheiden — das klingt nach Klugheit und ist oft nur Angst. Je länger die Debatte dauert, desto teurer wird sie: in Nerven, in Ehrenamt, in Vertrauen. Das Amt kann vermitteln. Es muss am Ende auch unterschreiben. Wer das für hart hält, der mag recht haben. Dennoch ist eine klare Absage ehrlicher als ein Protokoll, das niemanden bindet.\n\n*Jänner = österr. für „Januar“ · *Grätzl = österr. für „Kiez“ / Stadtviertel · *Stiege = österr. für „Treppe“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m5l6\",\"phaseId\":\"b2m5\",\"title\":\"Zwei Texte, zwei Thesen\",\"subtitle\":\"Dos artículos que se contradicen — el Lesen de B2 vive de eso\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Palabras del Kiez y del Grätzl que verás en los dos textos\",\"itemIds\":[\"b2m5kiez\",\"b2m5buergerbeteiligung\",\"b2m5buergerversammlung\",\"b2m5graetzl\",\"b2m5vermitteln\",\"b1m10aufeinanderzugehen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se leen dos textos que no se ponen de acuerdo\",\"body\":\"El B2 no pregunta «¿qué dice el texto?». Pregunta \u003cb\u003edónde se contradicen\u003c/b\u003e y \u003cb\u003equé se sigue de las dos fuentes\u003c/b\u003e. Estrategia:\u003cbr/\u003e1. Subraya la \u003cb\u003etesis\u003c/b\u003e de cada uno (suele estar al final del primer párrafo o en el cierre).\u003cbr/\u003e2. Marca un \u003cb\u003eargumento\u003c/b\u003e y una \u003cb\u003eprueba\u003c/b\u003e (cifra, cita, ejemplo).\u003cbr/\u003e3. Busca el \u003cb\u003eEinwand\u003c/b\u003e que cada uno le hace al otro, aunque no lo nombre.\u003cbr/\u003e4. La pregunta de inferencia casi nunca usa las palabras del texto.\u003cbr/\u003e\u003cbr/\u003eEl segundo texto es de una gaceta de distrito \u003cb\u003evienesa\u003c/b\u003e. Los austriacismos van a pie de página, igual que en el examen. El elenco no se muda a Viena: el plurizentrismo va por el texto.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m5l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo de Berlín. Las preguntas van en alemán, como en el examen.\",\"title\":\"Mehr Stimmen, bessere Stadt\",\"source\":\"Kiezblatt Prenzlauer Berg (Berlin)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m5l6e1q1\",\"q\":\"Wofür spricht sich der Leitartikel am Ende aus?\",\"options\":[\"Für eine Spielstraße am Nachmittag, mit Lieferzeiten am Morgen.\",\"Für eine Spielstraße den ganzen Tag, ohne Lieferverkehr.\",\"Gegen jede Veränderung der Lindenstraße.\"],\"answer\":0,\"why\":\"Cierre: «die Lindenstraße nachmittags zur Spielstraße … wobei die Lieferzeiten am Morgen bleiben».\"},{\"id\":\"b2m5l6e1q2\",\"q\":\"Welchen Einwand nimmt Lena Krüger ernst?\",\"options\":[\"Dass Beteiligung ohne Folge Theater sei.\",\"Dass die Kinder zu laut spielen.\",\"Dass die Umfrage gefälscht wurde.\"],\"answer\":0,\"why\":\"«Beteiligung ohne Folge sei Theater» — y no lo aparta de la mesa. Las otras dos no aparecen.\"},{\"id\":\"b2m5l6e1q3\",\"q\":\"Warum erwähnt der Text das Ehrenamt?\",\"options\":[\"Weil ohne unbezahlte Arbeit die Versammlung kaum stattfände.\",\"Weil das Bezirksamt Ehrenamtliche einstellen will.\",\"Weil Nico im Ehrenamt kocht.\"],\"answer\":0,\"inference\":true,\"why\":\"No dice «sin voluntarios no hay asamblea» con esas palabras: describe sillas, moderación y acta. Hay que unir las frases.\"},{\"id\":\"b2m5l6e1q4\",\"q\":\"Welche Schlussfolgerung zieht Clara Hofmann aus drei Abenden?\",\"options\":[\"Die Debatte wird schärfer, wo niemand differenziert.\",\"Die Eltern haben immer recht.\",\"Versammlungen sollte man abschaffen.\"],\"answer\":0,\"inference\":true,\"why\":\"«Die Debatte spitzt sich zu, wo man nicht differenziert» — es su Befund, no una cita de Sofía.\"},{\"id\":\"b2m5l6e1q5\",\"q\":\"Wie steht der Text zur knappen Mehrheit von 54 Prozent?\",\"options\":[\"Er nimmt sie ernst, will sie aber nicht über die Minderheit stülpen.\",\"Er hält 54 Prozent für eine klare Absage an den Kompromiss.\",\"Er ignoriert die Zahl und fordert eine neue Umfrage.\"],\"answer\":0,\"inference\":true,\"why\":\"Usa la cifra y, en el cierre, rechaza «eine Mehrheit über eine Minderheit zu stülpen». Inferencia: mayoría sí, aplastamiento no.\"}],\"itemIds\":[\"b2m5kiez\",\"b2m5buergerversammlung\",\"b2m5ehrenamt\",\"b1m10aufeinanderzugehen\"],\"tip\":\"Cuenta los conectores de dos piezas: el artículo los usa como esqueleto, no como adorno. Eso es exactamente lo que te piden en el Schreiben.\"},{\"id\":\"b2m5l6e2\",\"type\":\"read\",\"prompt\":\"Ahora el texto de Viena. Contradice al de Berlín. Anota en qué.\",\"title\":\"Diskussion statt Entscheidung\",\"source\":\"Bezirkszeitung Ottakring (Wien)\",\"text\":\"$18\",\"questions\":[{\"id\":\"b2m5l6e2q1\",\"q\":\"Was lag nach der Versammlung im Jänner am Brett des Bezirksamts?\",\"options\":[\"Ein Protokoll mit dem Satz «Wird weiter beraten.»\",\"Ein Beschluss für die Begegnungszone.\",\"Eine neue Umfrage mit klarer Mehrheit.\"],\"answer\":0,\"why\":\"Primer párrafo: el acta y debajo la frase que nadie quiere oír.\"},{\"id\":\"b2m5l6e2q2\",\"q\":\"Was zeigte die Umfrage des Bezirks?\",\"options\":[\"Kein klares Ergebnis, sondern ein Unentschieden.\",\"Eine Mehrheit von 54 Prozent wie in Berlin.\",\"Eine klare Absage an jede Begegnungszone.\"],\"answer\":0,\"why\":\"41 / 39 / resto indeciso. El texto de Berlín tenía 54 %: aquí se contradicen los datos, no solo el tono.\"},{\"id\":\"b2m5l6e2q3\",\"q\":\"Wem nimmt die Versammlung laut Text die Zeit?\",\"options\":[\"Denjenigen, die nicht kommen können, weil immer dieselben reden.\",\"Der Moderatorin, die um Ruhe bitten muss.\",\"Den Kindern in der Lerchengasse.\"],\"answer\":0,\"inference\":true,\"why\":\"«Wer dreimal kommt und dreimal dasselbe sagt, nimmt anderen die Zeit» + los que salen de la Schicht. Hay que unir los dos párrafos.\"},{\"id\":\"b2m5l6e2q4\",\"q\":\"Worin widerspricht dieser Text dem Kiezblatt aus Berlin am schärfsten?\",\"options\":[\"Darin, dass mehr Debatte den Zusammenhalt gefährdet, statt ihn zu stärken.\",\"Darin, dass Lieferwagen verboten werden sollen.\",\"Darin, dass Ehrenamt abgeschafft gehört.\"],\"answer\":0,\"inference\":true,\"why\":\"Berlín: más voces = mejor compromiso. Viena: más noches = teatro y desgaste. Esa es la contradicción que el B2 pregunta.\"},{\"id\":\"b2m5l6e2q5\",\"q\":\"Was bedeutet «Grätzl» in diesem Text?\",\"options\":[\"Ein Wiener Wort für das Stadtviertel, vergleichbar mit dem Berliner Kiez.\",\"Das Wiener Wort für die Treppe im Bezirksamt.\",\"Eine politische Partei in Ottakring.\"],\"answer\":0,\"why\":\"Nota a pie, como en el examen. Stiege es la escalera; Grätzl es el barrio.\"}],\"itemIds\":[\"b2m5graetzl\",\"b2m5vermitteln\",\"b2m5schlussfolgerung\",\"b2m5standpunkt\"],\"tip\":\"Los austriacismos no son trampa: van glosados. La trampa es leer el segundo texto con la tesis del primero todavía en la cabeza.\"},{\"id\":\"b2m5l6e3\",\"type\":\"mc\",\"prompt\":\"Dónde se contradicen de verdad\",\"question\":\"¿Cuál es la contradicción de fondo entre los dos textos?\",\"options\":[\"Berlín trata la disputa como camino hacia un compromiso; Viena, como sustituto de la decisión\",\"Berlín está a favor de los niños y Viena a favor de los coches\",\"Berlín usa conectores cultos y Viena no\"],\"answer\":0,\"whyWrong\":[null,\"Los dos hablan de padres y de entregas; el choque no es el tema, es el diagnóstico\",\"Viena está llena de zumal, wohingegen, sofern\"],\"itemIds\":[\"b2m5debatte\",\"b2m5schlussfolgerung\",\"b2m5meinungsfreiheit\"],\"tip\":\"Sintetizar dos fuentes es lo que pide el escrito de B2. Aquí lo acabas de hacer.\"},{\"id\":\"b2m5l6e4\",\"type\":\"cloze\",\"prompt\":\"El austriacismo del examen\",\"text\":\"Im ___ hat unser Grätzl die vierte Versammlung erlebt. (österr. für Januar)\",\"answers\":[\"Jänner\"],\"translation\":\"En enero nuestro barrio ha vivido la cuarta asamblea.\",\"hints\":[\"La palabra vienesa de la nota a pie\",\"J...er\"],\"itemIds\":[\"b2m5graetzl\"],\"tip\":\"Jänner, Grätzl, Stiege: se reconocen, no se producen en el Schreiben. El examen glosa; tú no tienes que escribirlos.\"},{\"id\":\"b2m5l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Di la tesis de Viena sin usar sus palabras clave\",\"source\":\"Beteiligung ohne Beschluss ist Theater.\",\"forbid\":[\"Theater\",\"Beteiligung\"],\"answers\":[\"Reden ohne Entscheidung bringt nichts.\",\"Reden ohne Entscheidung bringt nichts\",\"Versammlungen ohne Ergebnis spalten den Kiez.\",\"Ohne einen Beschluss bleibt die Debatte wirkungslos.\",\"Ohne einen Beschluss bleibt die Debatte wirkungslos\"],\"translation\":\"Participar sin acordar es teatro.\",\"itemIds\":[\"b2m5beteiligung\",\"b2m5buergerversammlung\"]},{\"id\":\"b2m5l6e6\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de los dos textos\",\"pairs\":[{\"target\":\"der Kiez\",\"source\":\"el barrio (Berlín)\"},{\"target\":\"das Grätzl\",\"source\":\"el barrio (Viena)\"},{\"target\":\"die Spielstraße\",\"source\":\"la calle de juego\"},{\"target\":\"die Lieferzone\",\"source\":\"la zona de carga\"},{\"target\":\"das Protokoll\",\"source\":\"el acta\"}],\"itemIds\":[\"b2m5kiez\",\"b2m5graetzl\",\"b2m5spielstrasse\",\"b2m5lieferzone\",\"b2m5protokoll\"]}]}],\"resources\":[{\"label\":\"Goethe — Übungen B2 Lesen\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gb2/ueb.html\",\"note\":\"El Lesen de B2 pone dos textos en diálogo. Entrena a marcar tesis y contradicción, no a traducir párrafo a párrafo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\
