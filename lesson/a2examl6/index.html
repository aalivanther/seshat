"note\":{\"title\":\"geschafft: la palabra de la meta\",\"body\":\"\u003cb\u003eschaffen\u003c/b\u003e = conseguir, lograr, sacar algo adelante. Su Perfekt es regular de manual — ge + schafft — y su chunk es un grito de alegría que oirás en toda Alemania: \u003cb\u003eIch habe es geschafft!\u003c/b\u003e (¡lo logré!). Los alemanes lo dicen al terminar un examen, una mudanza o un lunes. Y tu frase de graduación del nivel le añade el porqué con \u003cb\u003eweil\u003c/b\u003e: \u003ci\u003eIch habe das A2 geschafft, weil ich jeden Tag geübt habe\u003c/i\u003e — logré el A2 PORQUE practiqué cada día. Fíjate dónde vive el habe de la segunda frase: al final, porque weil lo manda allí. No es suerte: es método — y la frase lo dice con la gramática del propio nivel que acabas de terminar.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl6e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 2)\",\"question\":\"„Sofia hört den Anrufbeantworter nur einmal.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Relee la frase 2: «Sofia hört zweimal und findet die Lösung»\",null],\"itemIds\":[\"a2anrufbeantworter\",\"zweimal\",\"a2einmal\"],\"tip\":\"Los mensajes cortos del Teil 1 suenan zweimal — también en el cuento.\"},{\"id\":\"a2examl6e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 3)\",\"question\":\"¿Qué técnica usa Sofía en el Lesen?\",\"options\":[\"Lee cada texto palabra a palabra\",\"Sobrevuela: primero las preguntas, luego el texto\",\"Empieza por el último Teil\"],\"answer\":1,\"whyWrong\":[\"Palabra a palabra no da tiempo — por eso entrenaste el überfliegen\",null,\"El orden de los Teile no era su técnica: era el sobrevuelo\"],\"itemIds\":[\"a2ueberfliegen\",\"a2welcheanzeigepasst\"]},{\"id\":\"a2examl6e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 5 y 8)\",\"question\":\"¿Qué dos cosas salen bien al final de la historia?\",\"options\":[\"El plan del cine y el certificado A2\",\"El deletreo y el formulario\",\"La mudanza y el B1\"],\"answer\":0,\"whyWrong\":[null,\"Deletrear era del A1 — en el A2 ya no existe, ¿recuerdas?\",\"El B1 apenas asoma en la última frase: es el siguiente capítulo\"],\"itemIds\":[\"a2wollenwir\",\"a2ichhabeesgeschafft\"]},{\"id\":\"a2examl6e4\",\"type\":\"fastmatch\",\"prompt\":\"Empareja rápido las palabras de la meta — ya las conoces todas\",\"targetSeconds\":25,\"pairs\":[{\"target\":\"die Generalprobe\",\"source\":\"el ensayo general\"},{\"target\":\"geschafft\",\"source\":\"conseguido\"},{\"target\":\"Keine Angst!\",\"source\":\"¡sin miedo!\"},{\"target\":\"Viel Erfolg!\",\"source\":\"¡mucho éxito!\"}],\"itemIds\":[\"a2generalprobe\",\"a2geschafft\",\"a2m8keineangst\",\"vielerfolg\"]},{\"id\":\"a2examl6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 1 — el ánimo de Nico\",\"text\":\"Keine ___! Du hast jeden Tag geübt.\",\"answers\":[\"Angst\"],\"translation\":\"¡Sin miedo! Has practicado cada día.\",\"hints\":[\"die A-n-g-s-t = el miedo\",\"Con mayúscula: es sustantivo\"],\"itemIds\":[\"a2m8keineangst\",\"geuebt\"],\"tip\":\"keine + Angst: la vieja regla del kein con sustantivos, reciclada como frase de ánimo.\"},{\"id\":\"a2examl6e6\",\"type\":\"cloze\",\"prompt\":\"Completa el grito de la frase 8\",\"text\":\"Ich habe es ___!\",\"answers\":[\"geschafft\"],\"translation\":\"¡Lo he conseguido!\",\"hints\":[\"schaffen por la fábrica ge—t\",\"ge + schafft — con doble f y doble t\"],\"itemIds\":[\"a2geschafft\",\"a2ichhabeesgeschafft\"]},{\"id\":\"a2examl6e7\",\"type\":\"listen\",\"prompt\":\"Escucha el grito de la meta y escríbelo\",\"text\":\"Ich habe es geschafft\",\"translation\":\"Lo he conseguido\",\"hints\":[\"habe 2º, participio al final — como todo este nivel\",\"geschafft: gue-SHAFT\"],\"itemIds\":[\"a2ichhabeesgeschafft\",\"a2geschafft\"]},{\"id\":\"a2examl6e8\",\"type\":\"cloze\",\"prompt\":\"La frase de graduación, parte weil: ¿dónde vive el verbo?\",\"text\":\"Ich habe das A2 geschafft, weil ich jeden Tag geübt ___.\",\"answers\":[\"habe\"],\"translation\":\"He logrado el A2 porque he practicado cada día.\",\"hints\":[\"weil manda el verbo conjugado al FINAL de su frase\",\"ich ... h-a-b-e — al cierre, detrás del participio\"],\"itemIds\":[\"a2geschafft\",\"geuebt\"],\"tip\":\"En la frase con weil, el verbo conjugado cierra: ... geübt habe. Decir el porqué con weil es EL gesto A2.\"},{\"id\":\"a2examl6e9\",\"type\":\"type\",\"prompt\":\"Cierre del nivel: tu frase de graduación\",\"question\":\"«He logrado el A2 porque he practicado cada día»\",\"answers\":[\"Ich habe das A2 geschafft, weil ich jeden Tag geübt habe\",\"Ich habe das A2 geschafft, weil ich jeden Tag geübt habe.\",\"Ich habe das A2 geschafft weil ich jeden Tag geübt habe\"],\"hints\":[\"Primera parte: habe ... geschafft — la pinza de siempre\",\"Segunda parte: weil + ich + jeden Tag + geübt + habe (el verbo, al final)\"],\"itemIds\":[\"a2geschafft\",\"a2ichhabeesgeschafft\",\"geuebt\"],\"strictUmlaut\":true,\"tip\":\"Perfekt + weil + la ü de geübt: todo el nivel en una frase — y es verdad. Viel Erfolg en el examen. ¡Nos vemos en el B1!\"}]}],\"resources\":[{\"label\":\"Goethe — materiales de práctica A2\",\"url\":\"https://www.goethe.de/ins/us/en/spr/prf/ueb/pa2.html\",\"note\":\"AHORA sí: haz el examen modelo ENTERO con reloj — Hören, Lesen y Schreiben seguidos, como el día real. Si superas el 60%, estás en zona de aprobado.\"},{\"label\":\"Nicos Weg — curso A2 (DW)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Última pasada: repasa en el A2 de DW los temas que fallaste en el modelo. Y luego descansa — a la Prüfung se llega dormido, no empollado.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2
