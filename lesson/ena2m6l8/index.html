\u003c/i\u003e Es el mismo motor del do/does del A1.18:T48d,En el oral del examen te van a proponer cosas y hay que reaccionar. Tres casillas, y con una frase por casilla vas servido:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQue sí:\u003c/b\u003e \u003cb\u003e[[That sounds great!|¡Me parece genial!]]\u003c/b\u003e · \u003ci\u003e[[I'd love to!|¡Me encantaría!]]\u003c/i\u003e (ya la traes del A1) · \u003ci\u003ePerfect!\u003c/i\u003e\u003cbr/\u003e\u003cb\u003eGanar tiempo:\u003c/b\u003e \u003cb\u003e[[Let me check my diary.|Déjame mirar la agenda.]]\u003c/b\u003e Ojo: \u003ci\u003ediary\u003c/i\u003e es la agenda, no el diario íntimo — ese es \u003ci\u003ea journal\u003c/i\u003e.\u003cbr/\u003e\u003cb\u003eQue no:\u003c/b\u003e \u003cb\u003e[[I'm afraid I can't.|Me temo que no puedo.]]\u003c/b\u003e Y detrás, \u003cb\u003esiempre una razón\u003c/b\u003e: \u003ci\u003eI'm working that day. · I'm going to Manchester.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué la razón no es opcional.\u003c/b\u003e En inglés un «no» pelado suena brusco de verdad, mucho más que en español. La estructura completa que espera un británico son tres piezas: \u003cb\u003edisculpa + no + razón + alternativa\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eI'm afraid I can't — I'm working on Friday. [[What about Saturday?|¿Qué tal el sábado?]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eCon esa frase se cierra cualquier negociación de plan, y es exactamente lo que puntúa en la Parte 2 del oral, donde a veces te toca a ti \u003cb\u003einiciar\u003c/b\u003e la situación en vez de responder."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l8\",\"phaseId\":\"ena2m6\",\"title\":\"How about going on Friday?\",\"subtitle\":\"Proponer sin mandar, aceptar con ganas y decir que no sin quedar mal\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cerrar un plan entre dos\",\"itemIds\":[\"ena2m6howaboutgoing\",\"ena2m6w
