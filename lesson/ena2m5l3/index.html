xt/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T51f,En el A1 lo aprendiste como fórmula: \u003cb\u003esome\u003c/b\u003e afirma, \u003cb\u003eany\u003c/b\u003e pregunta y niega. Sigue siendo verdad y sigue siendo el 80 % de los casos:\u003cbr/\u003e\u003cbr/\u003e· afirmo → \u003ci\u003eThere's \u003cb\u003esome\u003c/b\u003e bread.\u003c/i\u003e\u003cbr/\u003e· pregunto → [[Is there any milk?|¿Hay leche?]]\u003cbr/\u003e· niego → [[They don't have any soup today.|Hoy no tienen sopa.]]\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora las dos excepciones, que son las que caen en el examen oral\u003c/b\u003e, porque las dos son de restaurante:\u003cbr/\u003e\u003cb\u003e1. Al OFRECER\u003c/b\u003e algo se dice some aunque sea pregunta: [[Would you like some tea?|¿Quieres té?]] Con \u003ci\u003eany\u003c/i\u003e sonaría a que dudas de que quede té.\u003cbr/\u003e\u003cb\u003e2. Al PEDIR\u003c/b\u003e algo, igual: [[Can I have some water?|¿Me pones agua?]] El any ahí suena a súplica rara.\u003cbr/\u003eLa lógica es sencilla: some se usa cuando \u003cb\u003eya cuentas con que la respuesta es sí\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY la familia entera funciona igual: \u003cb\u003esomething / anything\u003c/b\u003e, \u003cb\u003esomebody / anybody\u003c/b\u003e, \u003cb\u003esomewhere / anywhere\u003c/b\u003e — [[something to eat|algo de comer]] en la afirmativa, [[Anything to drink?|¿Algo para beber?]] en la pregunta del camarero (que aquí sí es pregunta de verdad, no ofrecimiento con una copa en la mano).\u003cbr/\u003e\u003cbr/\u003eY no se te olvide lo del A1: en inglés \u003cb\u003ese niega una sola vez\u003c/b\u003e. \u003ci\u003eI don't want \u003cb\u003eany\u003c/b\u003e sugar\u003c/i\u003e, jamás \u003ci\u003e*I don't want no sugar\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l3\",\"phaseId\":\"ena2m5\",\"title\":\"Some tea? Any milk?\",\"subtitle\":\"El A1 te dio la fórmula; aquí está el sistema — con sus dos excepciones\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Ofrecer, pedir y negar\",\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"ena2m5canihavesomewater\",\"ena2m5theydonthaveanysoup\",\"ena2m5somethingtoeat\",\"ena2m5anythingtodrink\",\"ensome\",\"enany\"]},{\"kind\":\"note\",\"note\":{\"title\":\"some / any: la regla, y las dos veces que se salta\",\"body\":\"$17\",\"table\":[[\"situación\",\"qué se usa\",\"ejemplo\"],[\"afirmo\",\"some\",\"There's some bread.\"],[\"pregunto de verdad\",\"any\",\"Is there any milk?\"],[\"niego\",\"any\",\"They don't have any soup.\"],[\"OFREZCO\",\"some\",\"Would you like some tea?\"],[\"PIDO\",\"some\",\"Can I have some water?\"],[\"compuestos\",\"something / anything\",\"something to eat · Anything to drink?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l3e1\",\"type\":\"bucket\",\"prompt\":\"¿some o any? Cuidado con las dos excepciones\",\"categories\":[\"some\",\"any\"],\"items\":[{\"text\":\"Would you like ___ cake?\",\"bucket\":0},{\"text\":\"Is there ___ milk in the fridge?\",\"bucket\":1},{\"text\":\"Can I have ___ water, please?\",\"bucket\":0},{\"text\":\"They don't have ___ soup today.\",\"bucket\":1},{\"text\":\"There's ___ bread on the table.\",\"bucket\":0},{\"text\":\"We didn't buy ___ vegetables.\",\"bucket\":1}],\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"ena2m5canihavesomewater\",\"ena2m5theydonthaveanysoup\",\"ensome\",\"enany\",\"enisthereanymilk\"],\"tip\":\"Las dos primeras son preguntas las dos, y llevan cosas distintas. La diferencia no es la forma: es si estás ofreciendo o preguntando de verdad.\"},{\"id\":\"ena2m5l3e2\",\"type\":\"mc\",\"prompt\":\"Sam te ve entrar en el café\",\"question\":\"Te ofrece un té. ¿Qué dice?\",\"options\":[\"Would you like some tea?\",\"Would you like any tea?\",\"Do you like any tea?\"],\"answer\":0,\"whyWrong\":[null,\"Con any parecería que duda de que quede té; ofrecer va con some\",\"«Do you like tea?» pregunta si te gusta el té en general, no si quieres uno ahora\"],\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"endoyoulike\",\"entea\"],\"tip\":\"Ojo a la pareja: «Do you like tea?» es sobre tus gustos; «Would you like some tea?» es una taza aquí y ahora. El examen las mezcla a propósito.\"},{\"id\":\"ena2m5l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa — estás pidiendo\",\"text\":\"Excuse me, can I have ___ water, please?\",\"answers\":[\"some\"],\"translation\":\"Perdona, ¿me pones agua, por favor?\",\"hints\":[\"Es pregunta, pero estás pidiendo\",\"s…\"],\"itemIds\":[\"ena2m5canihavesomewater\",\"enexcuseme\",\"enwater\"]},{\"id\":\"ena2m5l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa — aquí niegas\",\"text\":\"I'm sorry, we haven't got ___ vegetarian food today.\",\"answers\":[\"any\"],\"translation\":\"Lo siento, hoy no tenemos comida vegetariana.\",\"hints\":[\"haven't got ya niega\",\"a…\"],\"itemIds\":[\"ena2m5theydonthaveanysoup\",\"enany\"]},{\"id\":\"ena2m5l3e5\",\"type\":\"errorfix\",\"prompt\":\"La doble negación, que el español regala\",\"wrong\":\"I don't want no sugar in my coffee.\",\"answers\":[\"I don't want any sugar in my coffee.\"],\"why\":\"En español la negación se reparte («no quiero nada de azúcar») y en inglés se niega UNA sola vez: el don't ya niega, así que detrás va any. Dos negaciones juntas, en inglés, se leen como una afirmación.\",\"translation\":\"No quiero azúcar en el café.\",\"itemIds\":[\"enany\",\"ensugar\",\"encoffee\"]},{\"id\":\"ena2m5l3e6\",\"type\":\"transform\",\"prompt\":\"De afirmar a negar\",\"source\":\"There's some milk in the fridge.\",\"instruction\":\"Ponla en negativa\",\"answers\":[\"There isn't any milk in the fridge.\",\"There's no milk in the fridge.\"],\"translation\":\"No hay leche en la nevera.\",\"hints\":[\"some se convierte en any al negar\",\"There isn't a… milk…\"],\"itemIds\":[\"ensome\",\"enany\",\"enmilk\",\"eninthefridge\"],\"tip\":\"La segunda respuesta también vale: «there's no milk» dice lo mismo con la negación metida en el no. Lo que no vale es mezclarlas: «there isn't no milk».\"},{\"id\":\"ena2m5l3e7\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del camarero\",\"target\":\"Would you like something to eat\",\"translation\":\"¿Quiere tomar algo de comer?\",\"distractors\":[\"anything\",\"eating\"],\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"ena2m5somethingtoeat\"],\"tip\":\"Ofrecimiento → something, igual que some. anything ahí sonaría a «¿hay algo, lo que sea, que puedas comer?».\"},{\"id\":\"ena2m5l3e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? El ofrecimiento más británico que existe\",\"book\":\"Would you like some tea?\",\"real\":\"Fancy a cuppa?\",\"translation\":\"¿Te apetece un té?\",\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"encupoftea\"],\"tip\":\"cuppa es «a cup of tea» fundido en una palabra, y fancy es «apetecer». Solo con amigos: al cliente se le ofrece con Would you like.\"},{\"id\":\"ena2m5l3e9\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"Anything to drink?\",\"translation\":\"¿Algo para beber?\",\"hints\":[\"Empieza por Any…\",\"…to drink?\"],\"itemIds\":[\"ena2m5anythingtodrink\",\"enanythingelse\"],\"tip\":\"Esta la vas a oír en cada mesa de Reino Unido. Va sin «would you like» delante: el camarero se lo come.\"},{\"id\":\"ena2m5l3e10\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"They don't have any soup today, but would you like some bread?\",\"answers\":[\"Hoy no tienen sopa, pero ¿quieres pan?\",\"Hoy no tienen sopa, ¿pero quieres pan?\",\"Hoy no hay sopa, pero ¿quieres pan?\"],\"itemIds\":[\"ena2m5theydonthaveanysoup\",\"ena2m5wouldyoulikesometea\",\"enbread\"],\"tip\":\"Una frase con any y otra con some, y las dos mitades salen igual en español. Por eso hay que fijar el criterio en inglés: el español no te va a avisar.\"},{\"id\":\"ena2m5l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Quieres té? — No, gracias. ¿Me pones agua?\",\"answers\":[\"Would you like some tea? No, thanks. Can I have some water?\",\"Would you like some tea? No, thank you. Can I have some water?\",\"Would you like some tea? No, thanks. Can I have some water, please?\"],\"hints\":[\"Las dos frases llevan some: una ofrece y otra pide\",\"Would you like s… tea? No, thanks. Can I have s… water?\"],\"itemIds\":[\"ena2m5wouldyoulikesometea\",\"ena2m5canihavesomewater\",\"enthankyou\"],\"tip\":\"Dos preguntas seguidas y ni un any. Si te ha salido, ya tienes las excepciones instaladas donde hacen falta: en la mesa.\"}]}],\"resources\":[{\"label\":\"British Council — Some and any\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/some-any\",\"note\":\"Lee la ficha entera y fíjate solo en los ejemplos con «Would you like…»: son la excepción de esta lección, y ahí la verás explicada por nativos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\
