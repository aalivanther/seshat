r reden Montag weiter. Bis dahin bleibt die Küche geöffnet. Und ja, Nico, die Einarbeitung der neuen Kollegin muss bis Freitag erledigt werden. Das muss im Ablauf stehen, nicht nur im Kopf. | Gut. Wer das Protokoll schreibt: bitte sachlich. Es wird hier diskutiert, nicht gestritten. Und bevor wir gehen: die Pausenregelung gilt auch samstags, der Zuschlag für Nachtarbeit steht im Tarif, und der Ruhetag darf nicht einfach gestrichen werden. Das ist Arbeitsschutz, nicht Verhandlungsmasse. Eine Betriebsversammlung ist für nächste Woche angesetzt; dort wird die Urlaubsplanung vorgelegt, nicht nachgereicht. Protokollende, danke an alle drei."])</script><script>self.__next_f.push([1,"18:T8d5,"])</script><script>self.__next_f.push([1,"So, kurz und knapp, ich bin Kai Bergmann, Betriebsrat hier in der Küche, und wir sitzen zusammen, weil der neue Dienstplan ab Montag gelten soll. Nico, du zuerst, du stehst am Herd. | Also, ich sag’s geradeheraus: Der Plan ist gemacht worden, ohne dass uns jemand gefragt hat. Es wird hier schon unter Zeitdruck gearbeitet, und jetzt sollen samstags zwei Leute die Arbeit von dreien machen. Das lässt sich so nicht machen. | Herr Brandt, Sie sind der Chef. | Der Plan ist abgestimmt, Kai, das weißt du. Mit der Geschäftsführung. Die Gäste erwarten, dass samstags durchgehend gekocht wird. Die Küche ist samstags geöffnet, nicht «wird geöffnet», sie IST es, das ist der Zustand, in dem wir Geld verdienen. | Kai Bergmann. | Abgestimmt mit der Geschäftsführung ist nicht abgestimmt mit dem Betriebsrat. Eine Betriebsvereinbarung muss geschlossen werden, bevor ein Dienstplan mit mehr Samstagen gilt. Das steht im Tarifvertrag. Und Überstunden müssen ausgeglichen werden, nicht einfach angeordnet. | Nico. | Mir ist letztes Jahr fast gekündigt worden, in der Probezeit, weil ich einen Samstag nicht konnte. Das will ich niemandem wünschen. Eine Abmahnung wegen eines Dienstplans, der uns nicht vorgelegt wurde, das geht nicht. | Herr Brandt. | Niemand wird abgemahnt
