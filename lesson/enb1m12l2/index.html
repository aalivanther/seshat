w it? · b) I can sing very well. · c) It's great, isn't it?\u003c/i\u003e Las tres son inglés correcto. Solo una \u003cb\u003econtesta\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eParte 2 — tres conversaciones a dos voces, dos preguntas cada una (6 puntos).\u003c/b\u003e No te preguntan datos: te preguntan \u003cb\u003etema, propósito, contexto, quiénes hablan, qué relación tienen, qué actitud tienen\u003c/b\u003e. La respuesta casi nunca está en una palabra: está en el tono y en lo que se da por supuesto.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa estrategia, en tres movimientos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eLee las opciones antes de que empiece el audio.\u003c/b\u003e Tienes segundos de margen; úsalos. Si sabes lo que te van a preguntar, escuchas buscando, no esperando.\u003cbr/\u003e2. \u003cb\u003ePrimera escucha: el sentido.\u003c/b\u003e ¿De qué va? ¿Quién habla con quién? ¿Está pidiendo, quejándose, ofreciendo? Marca a lápiz la que te suene y sigue.\u003cbr/\u003e3. \u003cb\u003eSegunda escucha: el dato.\u003c/b\u003e Ahora sí, confirma o cambia. Y si en la segunda sigues dudando, \u003cb\u003emarca la que marcaste la primera vez\u003c/b\u003e: cambiar por cambiar sale mal más veces de las que sale bien.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso fonético.\u003c/b\u003e Lo que te va a tumbar no es el vocabulario: es que el inglés hablado \u003cb\u003ese come los auxiliares\u003c/b\u003e. \u003ci\u003eHe's left\u003c/i\u003e y \u003ci\u003eHe left\u003c/i\u003e se parecen muchísimo; \u003ci\u003ecan\u003c/i\u003e y \u003ci\u003ecan't\u003c/i\u003e también, porque el inglés simplifica el grupo consonántico final. No es acento: \u003cb\u003ees gramática que se vuelve inaudible\u003c/b\u003e. Si esperas oír el auxiliar entero para saber que hay un perfecto, en la vida real no lo vas a oír nunca."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l2\",\"phaseId\":\"enb1m12\",\"title\":\"Listening: parts 1 and 2\",\"subtitle\":\"Siete frases sueltas que hay que CONTESTAR, y tres conversaciones de las que hay que sacar la intención\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de las dos primeras partes\",\"itemIds\":[\"enb1m12eachparttwice\",\"enb1m12choosethebestresponse\",\"enb1m12thepurposeofthecall\",\"enb1m12readtheoptionsfirst\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué te piden exactamente, y por qué se falla\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l2e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de las dos primeras partes\",\"pairs\":[{\"target\":\"You will hear each part twice.\",\"source\":\"Cada parte se oye dos veces.\"},{\"target\":\"Choose the best response.\",\"source\":\"Elige lo que TÚ contestarías.\"},{\"target\":\"the purpose of the call\",\"source\":\"para qué llama, no de qué habla\"},{\"target\":\"Read the options before the audio starts.\",\"source\":\"Lee las opciones antes de que empiece el audio.\"}],\"itemIds\":[\"enb1m12eachparttwice\",\"enb1m12choosethebestresponse\",\"enb1m12thepurposeofthecall\",\"enb1m12readtheoptionsfirst\"],\"tip\":\"«response» y «reply» valen las dos, pero el examen escribe «response». Que no te sorprenda en la hoja.\"},{\"id\":\"enb1m12l2e2\",\"type\":\"mc\",\"prompt\":\"Qué te pide de verdad la Parte 1\",\"question\":\"En la Parte 1 oyes una frase suelta. ¿Qué eliges?\",\"options\":[\"Lo que tú le contestarías a esa persona.\",\"La opción que repite las palabras que has oído.\",\"El resumen de lo que ha dicho.\"],\"answer\":0,\"whyWrong\":[null,\"Justo al revés: la opción que repite palabras del audio suele ser la trampa. Se llama «word spotting» y es el error clásico.\",\"Resumir es la Parte 2. Aquí hay que responder, como en una conversación real.\"],\"itemIds\":[\"enb1m12choosethebestresponse\"],\"tip\":\"Piénsalo así: la Parte 1 no mide comprensión, mide PRAGMÁTICA. Te están preguntando si sabes qué se dice después de lo que acabas de oír.\"},{\"id\":\"enb1m12l2e3\",\"type\":\"audiomc\",\"prompt\":\"Parte 1 tal cual: elige la respuesta que tú darías. Dos escuchas.\",\"audio\":\"I'm afraid the lift isn't working today.\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"Never mind, I'll take the stairs.\",\"Yes, it's on the second floor.\",\"I'm afraid so.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Contesta a «¿dónde está?», que es otra pregunta. Ha caído en el «second floor» porque la frase sonaba a edificio.\",\"«I'm afraid so» confirma una mala noticia que te han preguntado. Aquí no te han preguntado nada: te la han dado.\"],\"itemIds\":[\"enb1m12choosethebestresponse\"],\"tip\":\"«Never mind» es la fórmula de «no pasa nada, me apaño». En la Parte 1 aparece constantemente, porque medio examen consiste en reaccionar a contratiempos.\"},{\"id\":\"enb1m12l2e4\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: aquí se decide por implicatura, no por palabras. Dos escuchas.\",\"audio\":\"Have you heard the new album?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"It's great, isn't it?\",\"I can sing very well.\",\"Oh, don't you know it?\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Habla de tu voz, no del disco. Es la trampa del tema: suena a música y no responde nada.\",\"Devuelve la pregunta a quien te la ha hecho, que es justo quien acaba de decir que lo conoce.\"],\"itemIds\":[\"enb1m1itsgreatisntit\"],\"tip\":\"Este ítem es literal del Practice Paper oficial. «It's great, isn't it?» contesta que sí lo has oído Y da tu opinión de una vez: eso es exactamente lo que el B1 añade sobre el A2.\"},{\"id\":\"enb1m12l2e5\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: el propósito de la llamada. Lee la pregunta ANTES. Dos escuchas.\",\"audio\":\"Hello, I'm ringing from the exam centre about Saturday — nothing to worry about, but the room's been changed. You're in the hall now, not the small room upstairs. Same time, half past nine. There's a sign on the door.\",\"question\":\"¿Para qué llama?\",\"options\":[\"Para avisar de un cambio de sala.\",\"Para cambiar la hora del examen.\",\"Para recordarle que traiga el documento de identidad.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «same time, half past nine»: la hora es la misma. La palabra «changed» está ahí para que te precipites.\",\"Del documento no se dice nada. Es lo que uno espera de una llamada así, y por eso se elige sin haberlo oído.\"],\"itemIds\":[\"enb1m12thepurposeofthecall\"],\"tip\":\"Propósito no es tema. El tema es «el examen del sábado»; el propósito es «avisar de un cambio». Las tres opciones suelen compartir tema — por eso no se decide por ahí.\"},{\"id\":\"enb1m12l2e6\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: quiénes hablan y qué relación tienen. Dos escuchas.\",\"audio\":\"«Right, so you've done the two mock papers?» «Both of them, yes. The second one went a lot better.» «Good. And the writing? Did you finish inside the time?» «Not the first time. I ran out with about ten minutes to go.»\",\"question\":\"¿Quiénes están hablando?\",\"options\":[\"Una profesora y un alumno suyo.\",\"Dos alumnos de la misma clase.\",\"Un examinador y un candidato durante el examen oral.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Uno pregunta y el otro rinde cuentas; entre iguales no se pregunta «¿has hecho los dos simulacros?» con ese tono.\",\"Durante el oral nadie pregunta por los simulacros escritos. Y el examinador no hace seguimiento del trabajo de nadie.\"],\"itemIds\":[\"enb1m6attitude\",\"enb1m6howdoesshefeel\"],\"tip\":\"La pista es quién pregunta y quién justifica. En la Parte 2 la relación entre los hablantes casi nunca se dice: se deduce de quién tiene derecho a preguntar qué.\"},{\"id\":\"enb1m12l2e7\",\"type\":\"mc\",\"prompt\":\"Estrategia de las dos escuchas\",\"question\":\"En la segunda escucha sigues dudando entre dos opciones. ¿Qué haces?\",\"options\":[\"Te quedas con la que marcaste en la primera escucha.\",\"Cambias a la otra: si dudas, la primera suele estar mal.\",\"Dejas la pregunta en blanco para no arriesgar.\"],\"answer\":0,\"whyWrong\":[null,\"Es una superstición cara. Tu primera marca la hiciste con el sentido general fresco, que es justo lo que mide la Parte 2.\",\"No se descuenta por fallar. Dejar en blanco es regalar el punto con total seguridad.\"],\"tip\":\"Regla de bolsillo para todo el examen: \u003cb\u003enunca se deja nada en blanco\u003c/b\u003e. No hay penalización por error en ninguna parte, ni en el Listening ni en el Reading.\"},{\"id\":\"enb1m12l2e8\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿esto lo haces en la primera escucha o en la segunda?\",\"categories\":[\"Primera escucha: el sentido\",\"Segunda escucha: el dato\"],\"items\":[{\"text\":\"Decidir de qué va la conversación\",\"bucket\":0},{\"text\":\"Confirmar el número o el nombre exacto\",\"bucket\":1},{\"text\":\"Ver quién habla con quién\",\"bucket\":0},{\"text\":\"Rellenar los huecos que te has dejado\",\"bucket\":1},{\"text\":\"Descartar la opción que claramente no pega\",\"bucket\":0},{\"text\":\"Comprobar la ortografía de lo que has escrito\",\"bucket\":1}],\"tip\":\"Si intentas cazar el dato en la primera pasada, pierdes el hilo y llegas a la segunda sin saber ni de qué iba. El orden importa: primero el mapa, después el tesoro.\"},{\"id\":\"enb1m12l2e9\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? El inglés hablado se come los auxiliares\",\"book\":\"He has already left.\",\"real\":\"He's already left.\",\"translation\":\"Ya se ha ido.\",\"itemIds\":[\"enb1m1already\"],\"tip\":\"De «has» solo queda una ese pegada al sujeto. Y esa misma ese puede ser «is» («He's leaving»). Lo que te dice cuál es el participio de detrás: «left» = has; «leaving» = is. En el Listening esa ese es la diferencia entre «se ha ido» y «se está yendo».\"},{\"id\":\"enb1m12l2e10\",\"type\":\"errorfix\",\"prompt\":\"Corrige: el phrasal verb y el pronombre\",\"wrong\":\"I didn't catch the word, so I looked up it.\",\"answers\":[\"I didn't catch the word, so I looked it up.\"],\"why\":\"Cuando el objeto de un phrasal verb separable es un \u003cb\u003epronombre\u003c/b\u003e (it, them, him), va \u003cb\u003een medio, obligatoriamente\u003c/b\u003e: \u003ci\u003elook it up\u003c/i\u003e, \u003ci\u003eturn it down\u003c/i\u003e, \u003ci\u003eput them off\u003c/i\u003e. Con un sustantivo caben las dos («look up the word» / «look the word up»), pero con pronombre solo cabe una. El español no tiene esta categoría, así que el orden hay que aprenderlo como se aprende una colocación.\",\"translation\":\"No pillé la palabra, así que la busqué.\",\"itemIds\":[\"enb1m3didntcatch\"]},{\"id\":\"enb1m12l2e11\",\"type\":\"cloze\",\"prompt\":\"Completa la instrucción que te vas a dar a ti mismo\",\"text\":\"___ the options before the audio starts.\",\"answers\":[\"Read\"],\"translation\":\"Lee las opciones antes de que empiece el audio.\",\"hints\":[\"Es un imperativo\",\"R-e-a-d\"],\"itemIds\":[\"enb1m12readtheoptionsfirst\"],\"tip\":\"Y fíjate en el verbo de después: «before the audio STARTS», en presente. Detrás de «before», «when» o «as soon as» el inglés NO pone futuro, aunque el sentido sea futuro. Es la trampa 11 y la vemos entera en la lección 7.\"},{\"id\":\"enb1m12l2e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa? Ojo al matiz\",\"source\":\"The purpose of the call is to cancel the appointment.\",\"answers\":[\"El propósito de la llamada es cancelar la cita\",\"Llama para cancelar la cita\",\"La finalidad de la llamada es anular la cita\"],\"itemIds\":[\"enb1m12thepurposeofthecall\"],\"tip\":\"«purpose» es para qué se hace algo. En la Parte 2 verás la pregunta escrita como «Why is she calling?» o «What is the purpose of the call?»: es la misma pregunta con dos trajes.\"},{\"id\":\"enb1m12l2e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lee las opciones antes de que empiece el audio: cada parte se oye dos veces.\",\"answers\":[\"Read the options before the audio starts: you will hear each part twice\",\"Read the options before the audio starts. You will hear each part twice\",\"Read the options before the audio starts, because you will hear each part twice\"],\"hints\":[\"Dos frases: un imperativo y luego el aviso del examen\",\"Read the options before the audio starts: you will hear…\"],\"itemIds\":[\"enb1m12readtheoptionsfirst\",\"enb1m12eachparttwice\"],\"tip\":\"Estas dos frases juntas son tu protocolo del Listening. Si las tienes automatizadas, la Parte 1 deja de dar miedo el día D.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
