s\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T731,"])</script><script>self.__next_f.push([1,"Todos los demás fallos del examen tienen algo a favor: \u003cb\u003ese notan\u003c/b\u003e. Si dices \u003ci\u003e«I have 25 years»\u003c/i\u003e, el examinador oye un error, te entiende igual y te descuenta un poco. Con un falso amigo no pasa eso: \u003cb\u003ela frase es correcta, se entiende bien y significa otra cosa\u003c/b\u003e. Nadie te va a pedir que repitas.\u003cbr/\u003e\u003cbr/\u003eMíralo en las cuatro que más caen:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eeventually\u003c/b\u003e no es «eventualmente». Es \u003cb\u003eal final, con el tiempo\u003c/b\u003e. Si escribes \u003ci\u003e«Eventually I will help you»\u003c/i\u003e crees que has dicho «puede que te ayude» y has dicho \u003cb\u003e«acabaré ayudándote»\u003c/b\u003e. Lo contrario.\u003cbr/\u003e\u003cb\u003eactually\u003c/b\u003e no es «actualmente» — eso es \u003cb\u003ecurrently\u003c/b\u003e. \u003ci\u003eActually\u003c/i\u003e es \u003cb\u003een realidad\u003c/b\u003e, y sirve para corregir con suavidad.\u003cbr/\u003e\u003cb\u003esensible\u003c/b\u003e en inglés es \u003cb\u003esensato\u003c/b\u003e; el «sensible» español es \u003cb\u003esensitive\u003c/b\u003e. \u003ci\u003e«My grandmother is very sensible»\u003c/i\u003e es un elogio a su cabeza, no a su corazón.\u003cbr/\u003e\u003cb\u003eargument\u003c/b\u003e es una \u003cb\u003eriña\u003c/b\u003e, no un argumento; \u003cb\u003ediscuss\u003c/b\u003e es tratar un tema, no discutir a gritos. Así que \u003ci\u003e«We discussed all night»\u003c/i\u003e suena a reunión de trabajo y \u003ci\u003e«We had an argument»\u003c/i\u003e es lo que de verdad querías decir.\u003cbr/\u003e\u003cbr/\u003eY los tres que además cambian la gramática de la frase: \u003cb\u003eattend\u003c/b\u003e (asistir) va \u003cb\u003esin preposición\u003c/b\u003e —\u003ci\u003eattend a meeting\u003c/i\u003e, no \u003ci\u003e«assist to»\u003c/i\u003e, que además significa ayudar—; \u003cb\u003esupport\u003c/b\u003e es apoyar, así que «no soporto» es \u003cb\u003eI can't stand\u003c/b\u003e; y \u003cb\u003ethe plot\u003c/b\u003e es el argumento de una película.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla de bolsillo para el día del examen:\u003c/b\u003e si una palabra inglesa se parece muchísimo a una española y encaja demasiado bien, \u003cb\u003edesconfía\u003c/b\u003e. En el Reading, esa es la palabra por la que la respuesta te parece obvia y está mal. En el Writing, es la que te cambia el sentido de la frase sin que te enteres."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l10\",\"phaseId\":\"enb1m12\",\"title\":\"The words that lie\",\"subtitle\":\"Los falsos amigos que no rompen el estilo: rompen el sentido\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los que cambian lo que dices\",\"itemIds\":[\"enb1m12attendameeting\",\"enb1m12icantstandit\",\"enb1m12weargued\",\"enb1m12theplot\",\"enb1m12sensitive\",\"enb1m12currently\",\"enb1m12eventually\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué estos son los peores errores que puedes cometer\",\"body\":\"$17\",\"table\":[[\"Lo que quieres decir\",\"Lo que escribes por calco\",\"Lo que dice de verdad\"],[\"actualmente\",\"actually\",\"en realidad\"],[\"eventualmente\",\"eventually\",\"al final, con el tiempo\"],[\"sensible (emotivo)\",\"sensible\",\"sensato\"],[\"discutir (reñir)\",\"discuss\",\"tratar un tema\"],[\"asistir a\",\"assist to\",\"ayudar a\"],[\"no soporto\",\"I can't support\",\"no puedo apoyar\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l10e1\",\"type\":\"match\",\"prompt\":\"Empareja cada palabra con lo que significa DE VERDAD\",\"pairs\":[{\"target\":\"currently\",\"source\":\"actualmente, ahora mismo\"},{\"target\":\"eventually\",\"source\":\"al final, con el tiempo\"},{\"target\":\"sensitive\",\"source\":\"sensible, que se emociona\"},{\"target\":\"the plot\",\"source\":\"el argumento de una película\"}],\"itemIds\":[\"enb1m12currently\",\"enb1m12eventually\",\"enb1m12sensitive\",\"enb1m12theplot\"],\"tip\":\"Las cuatro tienen gemela española que dice otra cosa. Empareja mirando el español, no el parecido: es justo el reflejo que hay que romper.\"},{\"id\":\"enb1m12l10e2\",\"type\":\"mc\",\"prompt\":\"Lectura: qué acabas de leer\",\"question\":\"En un texto de examen lees: «The council eventually agreed to fund the centre.» ¿Qué pasó?\",\"options\":[\"Que al final lo aprobaron, después de un tiempo.\",\"Que puede que lo aprueben, no es seguro.\",\"Que lo aprobaron por casualidad.\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «possibly» o «they might». \u003ci\u003eEventually\u003c/i\u003e no deja nada en el aire: dice que ocurrió, y que tardó.\",\"«Por casualidad» es \u003ci\u003eby chance\u003c/i\u003e. La confusión viene del «eventual» español, que sí habla de lo que puede pasar.\"],\"itemIds\":[\"enb1m12eventually\"],\"tip\":\"Este es el falso amigo que más veces decide una pregunta del Reading, porque cambia un hecho consumado por una posibilidad.\"},{\"id\":\"enb1m12l10e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el falso amigo\",\"wrong\":\"I have to assist a meeting on Friday.\",\"answers\":[\"I have to attend a meeting on Friday.\"],\"why\":\"\u003ci\u003eAssist\u003c/i\u003e es \u003cb\u003eayudar\u003c/b\u003e, así que la frase decía que vas a echar una mano en la reunión. «Asistir a» es \u003cb\u003eattend\u003c/b\u003e, y encima va \u003cb\u003esin preposición\u003c/b\u003e: \u003ci\u003eattend a meeting\u003c/i\u003e, nunca \u003ci\u003eattend to a meeting\u003c/i\u003e (eso es «ocuparse de»).\",\"translation\":\"Tengo que asistir a una reunión el viernes.\",\"itemIds\":[\"enb1m12attendameeting\"]},{\"id\":\"enb1m12l10e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el falso amigo\",\"wrong\":\"I can't support the noise from the street.\",\"answers\":[\"I can't stand the noise from the street.\"],\"why\":\"\u003ci\u003eSupport\u003c/i\u003e es \u003cb\u003eapoyar\u003c/b\u003e — a un equipo, a una idea, a una persona. «No soporto» es \u003cb\u003eI can't stand\u003c/b\u003e. Tal como estaba, la frase decía que no puedes respaldar el ruido, que es una postura política curiosa.\",\"translation\":\"No soporto el ruido de la calle.\",\"itemIds\":[\"enb1m12icantstandit\"]},{\"id\":\"enb1m12l10e5\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿dice lo que crees, o dice otra cosa?\",\"categories\":[\"Significa lo que parece\",\"Es un falso amigo\"],\"items\":[{\"text\":\"important\",\"bucket\":0},{\"text\":\"possible\",\"bucket\":0},{\"text\":\"difficult\",\"bucket\":0},{\"text\":\"sensible\",\"bucket\":1},{\"text\":\"actually\",\"bucket\":1},{\"text\":\"argument\",\"bucket\":1},{\"text\":\"eventually\",\"bucket\":1},{\"text\":\"carpet\",\"bucket\":1}],\"itemIds\":[\"enb1m12sensitive\",\"enb1m12currently\",\"enb1m12weargued\"],\"tip\":\"Que se parezca no lo convierte en trampa: la mayoría de las palabras largas de origen latino significan lo que parecen, y esa es justo la razón de que las cinco traidoras cuelen. La lista de las que mienten es corta: apréndetela y fíate del resto.\"},{\"id\":\"enb1m12l10e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Traduce al inglés\",\"source\":\"Nos peleamos toda la noche por una tontería.\",\"answers\":[\"We argued all night about something silly.\",\"We had an argument all night about something silly.\"],\"itemIds\":[\"enb1m12weargued\"],\"tip\":\"Si te sale \u003ci\u003ediscussed\u003c/i\u003e, has dicho que estuvisteis toda la noche tratando un asunto con calma. \u003ci\u003eArgue\u003c/i\u003e es reñir; \u003ci\u003ediscuss\u003c/i\u003e es tratar.\"},{\"id\":\"enb1m12l10e7\",\"type\":\"cloze\",\"prompt\":\"Completa: «actualmente» no es lo que parece\",\"text\":\"___ I'm working part-time at the library.\",\"answers\":[\"Currently\",\"At the moment\",\"Right now\"],\"translation\":\"Actualmente trabajo media jornada en la biblioteca.\",\"itemIds\":[\"enb1m12currently\"],\"tip\":\"Si te ha salido «Actually», acabas de decir «en realidad». La palabra para «actualmente» es \u003cb\u003ecurrently\u003c/b\u003e — o, más fácil todavía, \u003ci\u003eat the moment\u003c/i\u003e, que no se parece a nada español y por eso nunca falla.\"},{\"id\":\"enb1m12l10e8\",\"type\":\"mc\",\"prompt\":\"Escritura: qué le has dicho a tu casera\",\"question\":\"Escribes a Mrs Beckett: «I am very sensible about the noise.» ¿Qué ha leído ella?\",\"options\":[\"Que eres una persona sensata en lo del ruido.\",\"Que el ruido te afecta mucho.\",\"Que el ruido te da igual.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es lo que querías decir, y se dice con \u003cb\u003esensitive\u003c/b\u003e. \u003ci\u003eSensible\u003c/i\u003e es sensato.\",\"No: \u003ci\u003esensible\u003c/i\u003e no dice nada de indiferencia. Dice que tienes buen criterio.\"],\"itemIds\":[\"enb1m12sensitive\"],\"tip\":\"El error no se ve porque la frase es correcta y hasta te deja bien. Simplemente no es la queja que querías poner por escrito.\"},{\"id\":\"enb1m12l10e9\",\"type\":\"type\",\"prompt\":\"Escribe la frase entera\",\"question\":\"No soporto el ruido.\",\"answers\":[\"I can't stand the noise.\",\"I cannot stand the noise.\"],\"itemIds\":[\"enb1m12icantstandit\"],\"tip\":\"Es la fórmula que más se usa en la Parte 4 del oral para hablar de lo que no te gusta. Que te salga sin pensarla.\"},{\"id\":\"enb1m12l10e10\",\"type\":\"gapbank\",\"prompt\":\"Completa la reseña con el banco\",\"text\":\"I watched a film last night. The ___ was slow at first, but after almost an hour of nothing happening it ___ got really good. I'm quite ___ to sad endings, so I cried.\",\"answers\":[\"plot\",\"eventually\",\"sensitive\"],\"bank\":[\"plot\",\"eventually\",\"sensitive\",\"argument\",\"recently\",\"sensible\"],\"translation\":\"Anoche vi una película. El argumento era lento al principio, pero tras casi una hora sin pasar nada al final se puso muy bien. Soy bastante sensible con los finales tristes, así que lloré.\",\"itemIds\":[\"enb1m12theplot\",\"enb1m12eventually\",\"enb1m12sensitive\"],\"tip\":\"«after almost an hour of nothing happening» solo puede terminar en «eventually» — «actually» no encaja ahí, así que no hace falta ponerlo como distractor para practicar el resto. Dos de los tres huecos sí llevan su gemela española (argument/sensible); acierta por significado, no por parecido.\"},{\"id\":\"enb1m12l10e11\",\"type\":\"speak\",\"prompt\":\"Parte 1 del oral: preséntate sin falsos amigos\",\"text\":\"Currently I work at a library, and eventually I'd like to teach.\",\"phonetic\":\"KÁ-rent-li ai uöök at a LÁI-bra-ri, and i-VÉN-chu-a-li aid laik tu tiich\",\"translation\":\"Actualmente trabajo en una biblioteca y al final me gustaría dedicarme a enseñar.\",\"itemIds\":[\"enb1m12currently\",\"enb1m12eventually\"],\"tip\":\"Una frase, dos falsos amigos desactivados y una respuesta de Parte 1 completa: dato, plus, y hacia dónde vas. Guárdatela.\"},{\"id\":\"enb1m12l10e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe lo que oyes\",\"text\":\"We had an argument, but we sorted it out.\",\"translation\":\"Tuvimos una riña, pero lo arreglamos.\",\"itemIds\":[\"enb1m12weargued\",\"enb1m11sortitout\"],\"tip\":\"«Argument» en el oído inglés es una bronca, no un razonamiento. Y el remate es el phrasal verb del módulo 11, con el pronombre en su sitio: \u003ci\u003esorted it out\u003c/i\u003e, nunca \u003ci\u003esorted out it\u003c/i\u003e.\"},{\"id\":\"enb1m12l10e13\",\"type\":\"write\",\"prompt\":\"Lo último del curso: cuéntale a Emma cómo te ha ido\",\"scenario\":\"Emma te escribe desde Manchester: «So how did the exam go? Tell me everything!»\",\"bullets\":[\"Di cómo te fue el examen y cómo te sentiste\",\"Cuenta una parte que salió bien y una que salió peor\",\"Di qué vas a hacer ahora con tu inglés\"],\"checks\":[{\"re\":\"exam|test|writing|speaking|listening|reading\",\"label\":\"Hablas del examen\"},{\"re\":\"but|although|though|however\",\"label\":\"Contrastas lo bueno y lo malo\"},{\"re\":\"going to|will|hope|plan|want to\",\"label\":\"Dices qué viene ahora\"}],\"minWords\":100,\"maxWords\":120,\"genre\":\"mail-informal\",\"register\":\"direct\",\"model\":\"Hi Emma,\\n\\nThanks for asking! The exam was long — two hours and forty minutes without a break, and by the writing part my hand was killing me. The listening went better than I expected, because they play everything twice and I used the first time just to follow the story.\\n\\nThe reading was harder. There was one text about the council and I ran out of time, although I managed to answer everything in the end.\\n\\nNow I'm going to keep reading the news in English every morning, and eventually I'd like to do the B2. Currently I'm just glad it's over!\\n\\nSpeak soon,\\nValeria\",\"itemIds\":[\"enb1m12currently\",\"enb1m12eventually\",\"enb1m12twohoursforty\"],\"tip\":\"Fíjate en el modelo: no dice que todo saliera bien. Contar lo que costó, con un contraste y un plan, es exactamente lo que puntúa en la Tarea 2 — y de paso es lo que le contarías de verdad a una amiga.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m12-4\",\"book\":\"That is all.\",\"real\":\"Yeah, that's about it.\",\"meaning\":\"Sí, eso es más o menos todo.\",\"when\":\"Para cerrar tu minuto y medio de monólogo cuando ya has dicho lo que tenías. Es mil veces mejor que quedarse callado o que decir «finish»: suena a que has terminado porque querías, no porque te has quedado en blanco.\",\"register\":\"neutral\",\"exam\":\"And that's everything I wanted to say.\",\"note\":\"El examinador no penaliza que acabes antes de los noventa segundos; penaliza que te apagues. Un cierre dicho a propósito convierte un monólogo corto en un monólogo completo.\",\"sound\":\"yea, dats a-BÁUT it\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m12natthatsaboutit\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
