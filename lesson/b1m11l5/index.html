 «serio» de no bromear es \u003ci\u003eernst\u003c/i\u003e) · \u003cb\u003erealisieren\u003c/b\u003e = darse cuenta — aunque también existe el sentido de «llevar a cabo» (\u003ci\u003eein Projekt realisieren\u003c/i\u003e); lo que no se dice nunca es *\u003ci\u003eeine Aufgabe realisieren\u003c/i\u003e por «hacer una tarea» (eso es \u003ci\u003emachen\u003c/i\u003e o \u003ci\u003eerledigen\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m11l5\",\"phaseId\":\"b1m11\",\"title\":\"Clínica: Futur II y los falsos amigos\",\"subtitle\":\"Lo que estará hecho, lo que supones — y ocho palabras que te traicionan\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Suposición y balance del futuro\",\"itemIds\":[\"b1m11zkfuturzwei\",\"b1m11zkwohl\",\"b1m11zkvermutlich\",\"b1m11zkbekommen\",\"b1m11zkaktuell\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Futur II: no es «el futuro del futuro», es el balance\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m11l5e1\",\"type\":\"mc\",\"prompt\":\"Solo la FORMA te dice el significado\",\"question\":\"„Er wird wohl schon zu Hause sein.“\",\"options\":[\"Mañana estará en casa\",\"Estará en casa ahora mismo, supongo\",\"Ayer estuvo en casa\"],\"answer\":1,\"whyWrong\":[\"No hay ningún marcador de futuro en la frase\",null,\"No hay ninguna marca de pasado\"],\"itemIds\":[\"b1m11zkwohl\"],\"tip\":\"wohl = supongo. Con «wohl», werden deja de ser futuro y pasa a ser probabilidad sobre el AHORA.\"},{\"id\":\"b1m11l5e2\",\"type\":\"mc\",\"prompt\":\"Otra vez: fíate de la forma, no del contexto\",\"question\":\"„Bis Freitag wird sie die Bewerbung abgeschickt haben.“\",\"options\":[\"Antes del viernes la solicitud estará enviada\",\"El viernes empezará a escribir la solicitud\",\"El viernes pasado envió la solicitud\"],\"answer\":0,\"whyWrong\":[null,\"«abgeschickt haben» habla del resultado terminado, no del inicio\",\"«wird … haben» mira hacia delante, no hacia atrás\"],\"itemIds\":[\"b1m11zkfuturzwei\",\"b1m11zkbewerbung\"],\"tip\":\"bis + fecha + Futur II = «para entonces ya estará hecho». Es la fórmula de los plazos.\"},{\"id\":\"b1m11l5e3\",\"type\":\"bucket\",\"prompt\":\"¿Plan por hacer o cosa ya terminada para entonces?\",\"categories\":[\"Futur I: plan\",\"Futur II: ya hecho para entonces\"],\"items\":[{\"text\":\"Ich werde morgen anrufen.\",\"bucket\":0},{\"text\":\"Bis morgen werde ich angerufen haben.\",\"bucket\":1},{\"text\":\"Nächstes Jahr werde ich umziehen.\",\"bucket\":0},{\"text\":\"Bis nächstes Jahr werde ich umgezogen sein.\",\"bucket\":1},{\"text\":\"Ich werde mich bewerben.\",\"bucket\":0},{\"text\":\"Bis Freitag werde ich mich beworben haben.\",\"bucket\":1}],\"tip\":\"El Partizip II delante de haben/sein es la única diferencia visible. Entrena el ojo a cazarlo al final de la frase.\"},{\"id\":\"b1m11l5e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el Futur II\",\"text\":\"Bis zum Sommer ___ ich mein Studium beendet ___. Und bis Dezember ___ ich hoffentlich nach Wien umgezogen sein.\",\"answers\":[\"werde\",\"haben\",\"werde\"],\"bank\":[\"werde\",\"haben\",\"sein\",\"wurde\",\"hatte\",\"worden\"],\"translation\":\"Para el verano habré terminado la carrera. Y para diciembre me habré mudado a Viena, espero.\",\"itemIds\":[\"b1m11zkfuturzwei\"],\"tip\":\"beenden va con haben; umziehen (movimiento) va con sein. La misma regla del Perfekt, un piso más arriba.\"},{\"id\":\"b1m11l5e5\",\"type\":\"errorfix\",\"prompt\":\"Falso amigo: bekommen\",\"wrong\":\"Ich bekomme Lehrer.\",\"answers\":[\"Ich werde Lehrer.\",\"Ich werde Lehrer\"],\"why\":\"«bekommen» significa RECIBIR, no «llegar a ser». «Llegar a ser algo» es «werden»: Ich werde Lehrer. Con bekommen la frase dice «recibo un profesor».\",\"translation\":\"Voy a ser profesor.\",\"itemIds\":[\"b1m11zkbekommen\"]},{\"id\":\"b1m11l5e6\",\"type\":\"errorfix\",\"prompt\":\"Falso amigo: das Gymnasium\",\"wrong\":\"Ich gehe ins Gymnasium, um Sport zu machen.\",\"answers\":[\"Ich gehe ins Fitnessstudio, um Sport zu machen.\",\"Ich gehe in die Turnhalle, um Sport zu machen\"],\"why\":\"«das Gymnasium» es el instituto de secundaria, no el gimnasio. El gimnasio del colegio es «die Turnhalle»; el de pesas, «das Fitnessstudio».\",\"translation\":\"Voy al gimnasio a hacer deporte.\",\"itemIds\":[\"a2m3gymnasium\"]},{\"id\":\"b1m11l5e7\",\"type\":\"errorfix\",\"prompt\":\"Falso amigo: aktuell\",\"wrong\":\"Aktuell wollte ich gar nicht auswandern, aber jetzt schon.\",\"answers\":[\"Eigentlich wollte ich gar nicht auswandern, aber jetzt schon.\",\"Eigentlich wollte ich gar nicht auswandern, aber jetzt schon\"],\"why\":\"Ojo, que aquí hay dos cosas: «Aktuell arbeite ich in Madrid» (= ahora mismo) es alemán correcto y nadie te lo va a tachar. Lo que «aktuell» NO significa nunca es «en realidad» — eso es «eigentlich». El español mezcla los dos sentidos y el calco sale por ahí.\",\"translation\":\"En realidad no quería emigrar, pero ahora sí.\",\"itemIds\":[\"b1m11zkaktuell\"]},{\"id\":\"b1m11l5e8\",\"type\":\"transform\",\"prompt\":\"De plan a balance\",\"source\":\"Ich werde mein Studium beenden.\",\"instruction\":\"Ponla en Futur II con «bis 2030»\",\"answers\":[\"Bis 2030 werde ich mein Studium beendet haben.\",\"Ich werde mein Studium bis 2030 beendet haben.\",\"Ich werde bis 2030 mein Studium beendet haben.\"],\"translation\":\"Para 2030 habré terminado la carrera.\",\"hints\":[\"Bis 2030 abre → werde en 2ª posición\",\"…mein Studium beendet ___.\"],\"itemIds\":[\"b1m11zkfuturzwei\"]},{\"id\":\"b1m11l5e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2: una charla informativa. UNA sola escucha — lee la pregunta y subraya su palabra clave antes de darle al play. (Fragmento: el Teil 2 completo, con sus cinco tareas de una sola pasada, está en la lección de Schreiben del módulo.)\",\"audio\":\"So, herzlich willkommen zum Infoabend über das Auslandssemester. Ich mach's kurz, ähm, damit Sie nachher noch Fragen stellen können. Wer sich für das kommende Wintersemester bewerben will, muss die Unterlagen bis zum ersten März einreichen — bis dahin werden Sie auch Ihr Sprachzeugnis bekommen haben, die Prüfungen sind ja im Januar. Zwei Sachen werden hier jedes Jahr falsch verstanden. Erstens: Das Stipendium deckt die Miete nicht, es deckt den Flug und einen Teil der Lebenshaltungskosten. Und zweitens: Die Konkurrenz ist groß, aber lange nicht so groß, wie alle glauben — letztes Jahr hatten wir sogar mehr Plätze als Bewerbungen. Wirklich.\",\"question\":\"¿Hasta cuándo hay que entregar la documentación?\",\"options\":[\"Hasta el 1 de marzo\",\"Hasta enero\",\"Hasta el comienzo del semestre de invierno\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"En enero son los exámenes de idioma, no la entrega\",\"El semestre de invierno es para lo que te presentas, no la fecha límite\"],\"itemIds\":[\"b1m11zkauslandssemester\",\"b1m11zkbewerbung\",\"b1m11zksichbewerbenum\"],\"tip\":\"Ahí tienes el Futur II en su hábitat: «bis dahin werden Sie Ihr Sprachzeugnis bekommen haben» = para entonces ya lo tendrás. Y «bekommen» es recibir, no llegar a ser.\"},{\"id\":\"b1m11l5e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2, segunda tarea del mismo texto. Una escucha.\",\"audio\":\"So, herzlich willkommen zum Infoabend über das Auslandssemester. Ich mach's kurz, ähm, damit Sie nachher noch Fragen stellen können. Wer sich für das kommende Wintersemester bewerben will, muss die Unterlagen bis zum ersten März einreichen — bis dahin werden Sie auch Ihr Sprachzeugnis bekommen haben, die Prüfungen sind ja im Januar. Zwei Sachen werden hier jedes Jahr falsch verstanden. Erstens: Das Stipendium deckt die Miete nicht, es deckt den Flug und einen Teil der Lebenshaltungskosten. Und zweitens: Die Konkurrenz ist groß, aber lange nicht so groß, wie alle glauben — letztes Jahr hatten wir sogar mehr Plätze als Bewerbungen. Wirklich.\",\"question\":\"¿Qué cubre la beca?\",\"options\":[\"El vuelo y parte de los gastos de manutención\",\"El alquiler y el vuelo\",\"Todos los gastos\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El alquiler es justo lo que NO cubre\",\"Nadie promete cubrirlo todo\"],\"itemIds\":[\"b1m11zkstipendium\",\"b1m11zkkonkurrenz\"],\"tip\":\"Estrategia del Teil 2: el ponente numera («Erstens… Zweitens…»). Cada número abre un bloque y cada bloque suele traer una pregunta. Coloca las preguntas en los bloques y ya no te pierdes.\"},{\"id\":\"b1m11l5e9\",\"type\":\"mc\",\"prompt\":\"Falso amigo: sensibel\",\"question\":\"„Sie ist sehr sensibel.“\",\"options\":[\"Es muy sensata\",\"Es muy sensible (se emociona con facilidad)\",\"Es muy razonable\"],\"answer\":1,\"whyWrong\":[\"«Sensata» sería «vernünftig»\",null,\"«Razonable» también es «vernünftig»\"],\"itemIds\":[\"b1m11zksensibel\"],\"tip\":\"sensibel = sensible emocional. vernünftig = sensato. Dos palabras, dos personas distintas.\"},{\"id\":\"b1m11l5e10\",\"type\":\"cloze\",\"prompt\":\"Suposición, no futuro\",\"text\":\"Sie antwortet nicht — sie ___ wohl schon schlafen.\",\"answers\":[\"wird\"],\"translation\":\"No contesta: estará durmiendo ya, supongo.\",\"hints\":[\"Tercera persona de werden\",\"w___\"],\"itemIds\":[\"b1m11zkwohl\",\"b1m11zkvermutlich\"]},{\"id\":\"b1m11l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Para el verano habré terminado la carrera\",\"answers\":[\"Bis zum Sommer werde ich mein Studium beendet haben\",\"Bis zum Sommer werde ich mein Studium beendet haben.\",\"Bis Sommer werde ich mein Studium beendet haben\"],\"hints\":[\"Bis zum Sommer abre la frase → werde en 2ª\",\"…mein Studium beendet haben\"],\"itemIds\":[\"b1m11zkfuturzwei\"],\"tip\":\"Esta frase entera es un chunk de examen: úsala tal cual en el Sprechen Teil 2, diapositiva 4.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m11-2\",\"book\":\"Ich bin sicher, dass alles gut wird.\",\"real\":\"Das wird schon!\",\"meaning\":\"¡Ya verás como sale bien!\",\"when\":\"Para animar a alguien que duda, entre amigos o compañeros. De usted no se dice: dar ánimos a un superior con esta fórmula suena a paternalismo.\",\"register\":\"amigos\",\"exam\":\"Ich bin zuversichtlich, dass es klappt.\",\"note\":\"Ese «schon» no significa «ya»: es la partícula de la confianza tranquila.\",\"sound\":\"das virt shoon\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m11zkdaswirdschon\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
