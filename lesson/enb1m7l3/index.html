e al final, como en cualquier pregunta de sí/no.\u003cbr/\u003e\u003cbr/\u003eComo aquí no podemos jugar con el tono —la voz que lee estos audios es una sola y no lo controla—, hoy lo vas a decidir por \u003cb\u003eel contexto\u003c/b\u003e, que es exactamente lo que hace tu cabeza cuando alguien te habla: si los dos estáis mirando la misma lluvia, «\u003ci\u003eMiserable, isn't it?\u003c/i\u003e» no es una consulta meteorológica.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la irregular que hay que saberse:\u003c/b\u003e con \u003ci\u003eI am\u003c/i\u003e, la coletilla negativa es \u003cb\u003earen't I?\u003c/b\u003e — «\u003ci\u003eI'm right, aren't I?\u003c/i\u003e». No «amn't I» (eso solo se oye en Irlanda y Escocia) y desde luego no «\u003ci\u003eisn't it\u003c/i\u003e».\u003cbr/\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eSegunda mitad: so / such… that.\u003c/b\u003e El español dice \u003ci\u003etan…\u0026nbsp;que\u003c/i\u003e con una sola palabra y el inglés reparte según lo que venga detrás:\u003cbr/\u003e· \u003cb\u003eso\u003c/b\u003e + adjetivo o adverbio: \u003ci\u003eso fast that…\u003c/i\u003e · \u003ci\u003eso strong that…\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003esuch (a)\u003c/b\u003e + sustantivo (con su adjetivo, si lo lleva): \u003ci\u003esuch a strong accent that…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl calco «\u003cs\u003eso strong accent\u003c/s\u003e» es de los que más se oyen. Truco de bolsillo: \u003cb\u003esi detrás hay un sustantivo, es «such»\u003c/b\u003e. Si detrás no hay sustantivo, es «so»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l3\",\"phaseId\":\"enb1m7\",\"title\":\"Lovely day, isn't it?\",\"subtitle\":\"Cuándo la coletilla pregunta de verdad y cuándo solo busca compañía\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de hoy\",\"itemIds\":[\"enb1m7imright\",\"enb1m7everybodyknows\",\"enb1m7suchastrongaccent\",\"enb1m7sofastthat\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la misma coletilla hace dos cosas distintas\",\"body\":\"$17\",\"table\":[[\"Lo que va detrás\",\"Se dice\",\"Ejemplo\"],[\"adjetivo solo\",\"so\",\"so fast that I lost the thread\"],[\"adverbio\",\"so\",\"so quickly that nobody heard\"],[\"sustantivo contable en singular\",\"such a\",\"such a strong accent that…\"],[\"sustantivo plural o incontable\",\"such\",\"such kind people that…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l3e1\",\"type\":\"mc\",\"prompt\":\"¿Qué está haciendo esta coletilla?\",\"question\":\"Los dos estáis calados esperando el autobús y alguien dice: «Lovely weather, isn't it?»\",\"options\":[\"Busca acuerdo: está abriendo conversación\",\"Pregunta de verdad: no sabe qué tiempo hace\",\"Está corrigiendo a la otra persona\"],\"answer\":0,\"whyWrong\":[null,\"Lo tiene delante y empapado. Cuando la respuesta es obvia para los dos, la coletilla no pregunta: acompaña.\",\"Para corregir no se usa la coletilla, se usa el auxiliar acentuado: «It IS raining, actually».\"],\"itemIds\":[\"ena2m9questiontags\",\"enb1m1itsgreatisntit\"],\"tip\":\"El inglés británico abre conversaciones así todo el rato, y casi siempre con el tiempo. No hace falta contestar gran cosa: «It is, isn't it» ya vale.\"},{\"id\":\"enb1m7l3e2\",\"type\":\"mc\",\"prompt\":\"Y esta otra\",\"question\":\"Llevas media hora buscando las llaves por toda la casa y le dices a tu compañera: «You haven't seen my keys, have you?»\",\"options\":[\"Pregunta de verdad: necesita la respuesta\",\"Busca acuerdo: sabe que las ha visto\",\"Es una queja disimulada\"],\"answer\":0,\"whyWrong\":[null,\"Si lo supiera no preguntaría. La coletilla aquí es una pregunta entera, solo que envuelta para que suene menos brusca.\",\"No hay reproche. Fíjate en la forma: frase negativa + coletilla positiva es la manera educada de pedir algo que probablemente sea que no.\"],\"itemIds\":[\"ena2m9questiontags\"],\"tip\":\"«You haven't got a pen, have you?» es la fórmula estándar para pedir algo dando por hecho que a lo mejor no. Suena mil veces mejor que «Give me a pen».\"},{\"id\":\"enb1m7l3e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica por el CONTEXTO: ¿busca acuerdo o pregunta de verdad?\",\"categories\":[\"Busca acuerdo\",\"Pregunta de verdad\"],\"items\":[{\"text\":\"Saliendo juntos del cine: «That was brilliant, wasn't it?»\",\"bucket\":0},{\"text\":\"Buscando por toda la casa: «You haven't seen my keys, have you?»\",\"bucket\":1},{\"text\":\"Los dos con el abrigo puesto dentro: «It's freezing in here, isn't it?»\",\"bucket\":0},{\"text\":\"Por si acaso, antes de escribir a Lisboa: «You don't speak Portuguese, do you?»\",\"bucket\":1},{\"text\":\"Subiendo a un autobús con dudas: «This isn't the 38, is it?»\",\"bucket\":1},{\"text\":\"Mirando los dos la misma cola enorme: «Unbelievable, isn't it?»\",\"bucket\":0}],\"itemIds\":[\"ena2m9questiontags\",\"enb1m1itsgreatisntit\"],\"tip\":\"Patrón que se repite: las de acuerdo son frases POSITIVAS sobre algo que los dos estáis viendo. Las de pregunta suelen ser NEGATIVAS y sobre algo que solo sabe el otro.\"},{\"id\":\"enb1m7l3e4\",\"type\":\"transform\",\"prompt\":\"Añade la coletilla — cuidado, esta es la irregular\",\"source\":\"I'm right.\",\"instruction\":\"Conviértelo en pregunta de confirmación\",\"answers\":[\"I'm right, aren't I?\",\"I am right, aren't I?\"],\"translation\":\"Tengo razón, ¿a que sí?\",\"hints\":[\"Con «I am» la coletilla no es la que esperas\",\"I'm right, ... I?\"],\"itemIds\":[\"enb1m7imright\"],\"tip\":\"«amn't I» no existe en inglés estándar (sí en Irlanda y Escocia). La lengua se quedó sin la forma lógica y aprovechó «aren't». Es un hueco del sistema, y hay que saberlo tal cual.\"},{\"id\":\"enb1m7l3e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I'm right, isn't it?\",\"answers\":[\"I'm right, aren't I?\"],\"why\":\"«isn't it» es una coletilla fija en español («¿no es así?») pero en inglés tiene que concordar con el sujeto. El sujeto aquí es «I», y con «I am» la coletilla negativa es la irregular «aren't I».\",\"translation\":\"Tengo razón, ¿a que sí?\",\"itemIds\":[\"enb1m7imright\"]},{\"id\":\"enb1m7l3e6\",\"type\":\"cloze\",\"prompt\":\"so o such: mira lo que viene detrás\",\"text\":\"She had ___ a strong accent that I gave up after two minutes.\",\"answers\":[\"such\"],\"translation\":\"Tenía un acento tan marcado que me rendí a los dos minutos.\",\"hints\":[\"Detrás hay un sustantivo: «accent»\",\"s...\"],\"itemIds\":[\"enb1m7suchastrongaccent\"],\"tip\":\"Detrás del hueco viene «a strong accent», o sea, un sustantivo. Con sustantivo, «such». Con adjetivo pelado, «so».\"},{\"id\":\"enb1m7l3e7\",\"type\":\"errorfix\",\"prompt\":\"El calco de «tan… que». Arréglalo.\",\"wrong\":\"She had so strong accent that I gave up.\",\"answers\":[\"She had such a strong accent that I gave up.\"],\"why\":\"«so» solo puede ir con adjetivo o adverbio suelto («so strong that…»). Con un sustantivo detrás hace falta «such», y además el artículo: such A strong accent.\",\"translation\":\"Tenía un acento tan marcado que me rendí.\",\"itemIds\":[\"enb1m7suchastrongaccent\"]},{\"id\":\"enb1m7l3e8\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"It was such a strange feeling that I wrote it down\",\"translation\":\"Era una sensación tan rara que la anoté\",\"distractors\":[\"so\",\"very\"],\"itemIds\":[\"enb1m7suchastrongaccent\"],\"tip\":\"«such a strange feeling»: el artículo va DESPUÉS de such y ANTES del adjetivo. Ese orden no se negocia — such a strange feeling, nunca «a such strange feeling».\"},{\"id\":\"enb1m7l3e9\",\"type\":\"gapbank\",\"prompt\":\"Completa con so, such o that\",\"text\":\"The first week was hard. Sam talked ___ fast that I only caught half of it, and Nora has ___ a strong accent that I just smiled and nodded. Two years later I understand them both, not perfectly, but ___ well ___ I no longer worry about it.\",\"answers\":[\"so\",\"such\",\"so\",\"that\"],\"bank\":[\"so\",\"such\",\"that\",\"very\",\"too\",\"as\"],\"translation\":\"La primera semana fue dura. Sam hablaba tan rápido que solo pillaba la mitad, y Nora tiene un acento tan marcado que yo me limitaba a sonreír y asentir. Dos años después los entiendo a los dos, no perfectamente, pero sí lo bastante bien como para no preocuparme ya.\",\"itemIds\":[\"enb1m7sofastthat\",\"enb1m7suchastrongaccent\"],\"tip\":\"Los dos primeros huecos son la regla entera: «fast» es adverbio → so; «a strong accent» es sustantivo → such. Los dos últimos son el par «so… that» partido en dos trozos.\"},{\"id\":\"enb1m7l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Hablaba tan rápido que perdí el hilo.\",\"answers\":[\"He spoke so fast that I lost the thread\",\"She spoke so fast that I lost the thread\",\"He was speaking so fast that I lost the thread\"],\"hint\":\"Detrás del primer hueco hay un adverbio, no un sustantivo\",\"itemIds\":[\"enb1m7sofastthat\"],\"tip\":\"«lose the thread» es literalmente «perder el hilo», igual que en español. No siempre pasa, pero cuando pasa hay que aprovecharlo.\"},{\"id\":\"enb1m7l3e11\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"Eso lo sabe todo el mundo, ¿no?\",\"answers\":[\"Everybody knows that, don't they?\",\"Everyone knows that, don't they?\",\"Everybody knows that, doesn't he?\"],\"hints\":[\"El verbo va en tercera de singular, pero el pronombre de la coletilla no\",\"Everybody knows that, ... they?\"],\"itemIds\":[\"enb1m7everybodyknows\"],\"tip\":\"«everybody» lleva verbo en singular («knows») y pronombre en plural («they»). Es raro y es lo normal: el inglés lleva un siglo usando «they» para no tener que elegir entre he y she.\"},{\"id\":\"enb1m7l3e12\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «so»\",\"source\":\"His accent was so strong that I understood nothing.\",\"forbid\":[\"so\",\"understood\",\"understand\"],\"answers\":[\"He had such a strong accent that I got nothing at all\",\"He had such a strong accent that I could not follow him\",\"His accent was too strong for me\"],\"translation\":\"Tenía un acento tan marcado que no entendí nada.\",\"hints\":[\"La otra mitad de la regla: con sustantivo detrás\",\"He had s... a strong accent that ...\"],\"itemIds\":[\"enb1m7suchastrongaccent\",\"enb1m7accent\"],\"tip\":\"Al pasar de «so» a «such» hay que reordenar la frase entera: el adjetivo deja de estar solo y se le pega un sustantivo. Eso es reformular, y es literalmente lo que el nivel B1 llama «circunloquio».\"},{\"id\":\"enb1m7l3e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — y baja la voz en la coletilla, que no es una pregunta\",\"text\":\"Lovely day, isn't it? I'm right, aren't I? He spoke so fast that I lost the thread.\",\"phonetic\":\"LÁV-li déi, Í-s̬ent it · aim ráit, AANT ai · ji spóuk sóu faast dat ai lost de zred\",\"translation\":\"Bonito día, ¿verdad? · Tengo razón, ¿a que sí? · Hablaba tan rápido que perdí el hilo.\",\"itemIds\":[\"enb1m7imright\",\"enb1m7sofastthat\"],\"tip\":\"En las dos primeras la voz baja: no estás preguntando, estás invitando al otro a estar de acuerdo. Si las subes, suenan a examen.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo.
