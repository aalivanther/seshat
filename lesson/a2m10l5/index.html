g Zeit?|¿Tienes tiempo el sábado?]] para quedar. Ahora, la logística alrededor: el Termin se tiene (\u003ci\u003eIch habe morgen einen Termin\u003c/i\u003e), se hace (\u003ci\u003eeinen Termin machen\u003c/i\u003e = concertar una cita) y se apunta en \u003cb\u003eder Kalender\u003c/b\u003e: \u003ci\u003eIch schreibe den Termin in meinen Kalender\u003c/i\u003e — in + acusativo, porque el Termin VIAJA al calendario: tu flecha de a2m5. Junto al Termin vive \u003cb\u003eder Plan\u003c/b\u003e (los planes de tu semana) y la palabra que es casi una ley en Alemania: \u003cb\u003epünktlich\u003c/b\u003e. Un Termin a las 9:00 significa a las 9:00 — llegar a las 9:10 no es «un poco tarde», es no ser puntual, y eso en Alemania se nota. Fíjate: pünktlich viene de Punkt (punto) — llegar AL punto exacto.\",\"table\":[[\"la pieza\",\"úsala así\"],[\"einen Termin machen\",\"concertar una cita\"],[\"einen Termin haben\",\"Ich habe morgen einen Termin\"],[\"der Kalender\",\"Ich schreibe den Termin in meinen Kalender\"],[\"pünktlich\",\"Ich bin pünktlich — llego a la hora exacta\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m10l5e1\",\"type\":\"match\",\"prompt\":\"Empareja tu agenda\",\"pairs\":[{\"target\":\"der Termin\",\"source\":\"la cita (formal)\"},{\"target\":\"der Kalender\",\"source\":\"el calendario / la agenda\"},{\"target\":\"der Plan\",\"source\":\"el plan\"},{\"target\":\"pünktlich\",\"source\":\"puntual\"}],\"itemIds\":[\"termin\",\"a2m10kalender\",\"a2m10plan\",\"a2m10puenktlich\"]},{\"id\":\"a2m10l5e2\",\"type\":\"mc\",\"prompt\":\"La ley cultural\",\"question\":\"Tu Termin en Alemania es a las 9:00. ¿A qué hora llegas?\",\"options\":[\"A las 9:00 en punto — o cinco minutos antes\",\"Hacia las 9:15 — el cuarto de hora de cortesía\",\"Cuando pueda: lo importante es llegar\"],\"answer\":0,\"whyWrong\":[null,\"El cuarto de cortesía no existe en Alemania: a las 9:15 tu Termin puede haberse esfumado\",\"En Alemania llegar tarde sin avisar es casi cancelar — pün
