unks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T732,"])</script><script>self.__next_f.push([1,"Una consulta con un GP dura \u003cb\u003ediez minutos\u003c/b\u003e, y empieza siempre igual: \u003ci\u003eWhat seems to be the problem?\u003c/i\u003e Lo que digas en los treinta segundos siguientes decide el resto. La estructura que funciona son tres frases:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eQué tienes\u003c/b\u003e: \u003ci\u003eI've got a sore throat.\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eDesde cuándo\u003c/b\u003e: \u003ci\u003eI've had it for four days.\u003c/i\u003e ← aquí vuelve el present perfect del módulo 1, y vuelve el «for».\u003cbr/\u003e3. \u003cb\u003eQué has probado\u003c/b\u003e: \u003ci\u003eI've tried paracetamol and it hasn't helped.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eFíjate en el punto 2, porque es donde se cae medio mundo: \u003cb\u003e«desde hace cuatro días» es \u003ci\u003efor four days\u003c/i\u003e\u003c/b\u003e, con present perfect. \u003ci\u003eI have it since four days\u003c/i\u003e junta los dos errores del nivel en cinco palabras.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos cuatro papeles que salen de una consulta\u003c/b\u003e, y conviene no confundirlos:\u003cbr/\u003e· \u003cb\u003ea prescription\u003c/b\u003e — la receta. Se lleva a \u003ci\u003ethe chemist's\u003c/i\u003e (la farmacia; en EE. UU. sería \u003ci\u003ethe drugstore\u003c/i\u003e).\u003cbr/\u003e· \u003cb\u003ea referral\u003c/b\u003e — el volante para el especialista. Detrás de él viene casi siempre \u003ci\u003ethe waiting list\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003ea sick note\u003c/b\u003e — el justificante para el trabajo. Oficialmente se llama \u003ci\u003efit note\u003c/i\u003e, y hay un detalle que sorprende a todo el mundo: \u003cb\u003epara una baja de menos de una semana no hace falta\u003c/b\u003e. Los primeros siete días se rellenan uno mismo, y eso se llama \u003ci\u003eself-certification\u003c/i\u003e. Pedir cita solo para eso es quitarle el hueco a otro.\u003cbr/\u003e· \u003cb\u003ea painkiller\u003c/b\u003e — el analgésico. Paracetamol e ibuprofeno se compran sin receta en cualquier sitio.\u003cbr/\u003e\u003cbr/\u003eY una nota de registro para hoy: en el mostrador y en la consulta se usa \u003cb\u003e«Could you…?»\u003c/b\u003e y \u003cb\u003e«I was wondering whether…»\u003c/b\u003e, que ya traes del módulo 3. Un imperativo pelado —\u003ci\u003eGive me a sick note\u003c/i\u003e— no es que sea grosero: es que hace que te traten como a un problema."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l4\",\"phaseId\":\"enb1m6\",\"title\":\"What seems to be the problem?\",\"subtitle\":\"Contar un síntoma en treinta segundos — y escribirle a la administración del centro\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que se dice y lo que te dan\",\"itemIds\":[\"ena2m8whatseemstobetheproblem\",\"enb1m6ivehaditfor\",\"ena2m8ihaveasorethroat\",\"ena2m8somepainkillers\",\"ena2m8aprescription\",\"enb1m6sicknote\",\"enb1m6referral\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: una cita de diez minutos se prepara en tres frases\",\"body\":\"$17\",\"table\":[[\"Lo que necesitas\",\"Cómo se llama\",\"Dónde se usa\"],[\"Medicina que solo da el médico\",\"a prescription\",\"en la farmacia (the chemist's)\"],[\"Que te vea un especialista\",\"a referral\",\"hospital, y lista de espera\"],[\"Justificar la falta al trabajo\",\"a sick note\",\"a partir del octavo día\"],[\"Algo para el dolor\",\"a painkiller\",\"se compra sin receta\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l4e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro papeles\",\"pairs\":[{\"target\":\"a prescription\",\"source\":\"una receta\"},{\"target\":\"a referral to a specialist\",\"source\":\"un volante para el especialista\"},{\"target\":\"a sick note\",\"source\":\"un justificante médico para el trabajo\"},{\"target\":\"a painkiller\",\"source\":\"un analgésico\"}],\"itemIds\":[\"ena2m8aprescription\",\"enb1m6referral\",\"enb1m6sicknote\",\"ena2m8somepainkillers\"],\"tip\":\"«Sick note» es el nombre que usa todo el mundo; «fit note» es el oficial. Los dos se entienden, pero en una carta formal escribe el oficial.\"},{\"id\":\"enb1m6l4e2\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo que ya tienes del m1 y del m2\",\"pairs\":[{\"target\":\"the waiting list\",\"source\":\"la lista de espera\"},{\"target\":\"a colleague\",\"source\":\"un compañero de trabajo\"},{\"target\":\"the night shift\",\"source\":\"el turno de noche\"},{\"target\":\"I handed in my notice.\",\"source\":\"Presenté mi dimisión.\"},{\"target\":\"I can't afford the rent.\",\"source\":\"No me puedo permitir el alquiler.\"}],\"targetSeconds\":26,\"itemIds\":[\"enb1m1waitinglist\",\"enb1m2colleague\",\"enb1m2nightshift\",\"enb1m2handinnotice\",\"enb1m1afford\"],\"tip\":\"Cinco piezas de módulos anteriores, ninguna nueva. El objetivo hoy no es aprenderlas: es que salgan sin pensar, que es lo que pide un examen de doce minutos hablando.\"},{\"id\":\"enb1m6l4e3\",\"type\":\"mc\",\"prompt\":\"Lo que de verdad hace falta\",\"question\":\"Llevas tres días sin ir a trabajar. ¿Necesitas un «sick note»?\",\"options\":[\"No: los primeros siete días se rellenan uno mismo\",\"Sí, desde el primer día de baja\",\"Sí, y hay que pedirlo en urgencias\"],\"answer\":0,\"whyWrong\":[null,\"El justificante del médico hace falta a partir del octavo día. Antes de eso existe la «self-certification», que rellena el propio trabajador.\",\"Urgencias no da justificantes de baja, y además no es lo que corresponde a un catarro.\"],\"itemIds\":[\"enb1m6sicknote\"],\"tip\":\"Este dato ahorra una cita y una discusión con el trabajo. Y en el examen sirve igual: el Reading del B1 mete folletos administrativos, y lo que se pregunta es justo quién tiene que hacer qué.\"},{\"id\":\"enb1m6l4e4\",\"type\":\"errorfix\",\"prompt\":\"El error de los dos módulos juntos. Cambia UNA palabra.\",\"wrong\":\"I've had a sore throat since three days.\",\"answers\":[\"I've had a sore throat for three days.\"],\"why\":\"El tiempo verbal está bien. Lo que falla es la preposición: «since» marca el punto de arranque (since Monday) y «for» marca la duración (for three days). «Desde hace» es siempre «for».\",\"translation\":\"Llevo tres días con dolor de garganta.\",\"itemIds\":[\"enb1m6ivehaditfor\",\"ena2m8ihaveasorethroat\"]},{\"id\":\"enb1m6l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa la primera frase del médico\",\"text\":\"What ___ to be the problem?\",\"answers\":[\"seems\"],\"translation\":\"¿Qué le pasa?\",\"hints\":[\"Es el verbo de «parecer»\",\"Cinco letras y acaba en -s\"],\"itemIds\":[\"ena2m8whatseemstobetheproblem\"],\"tip\":\"Es una fórmula fija: nadie pregunta «What is the problem?», que sonaría a bronca. El «seems» le quita filo — el mismo envoltorio que aprendiste ayer para los consejos.\"},{\"id\":\"enb1m6l4e6\",\"type\":\"order\",\"prompt\":\"Ordena la visita de Valeria, de la llamada a la farmacia\",\"sentences\":[\"Valeria rang the surgery at eight in the morning and waited eleven minutes on hold.\",\"The receptionist asked her what the problem was and offered her a phone appointment.\",\"The GP listened, asked to see a photo of the rash and said it was probably an allergy.\",\"She sent a prescription straight to the chemist's on the corner.\",\"Valeria picked up the cream that afternoon and paid the prescription charge.\"],\"translation\":\"Valeria llamó al centro a las ocho y esperó once minutos. La recepcionista le preguntó qué le pasaba y le ofreció una cita telefónica. La médica escuchó, pidió ver una foto del sarpullido y dijo que seguramente era una alergia. Mandó la receta directamente a la farmacia de la esquina. Valeria recogió la crema por la tarde y pagó la tasa de la receta.\",\"itemIds\":[\"ena2m8aprescription\",\"enb1m6receptionist\",\"enb1m6rash\",\"enb1m6prescriptioncharge\"],\"tip\":\"Cuenta cuántos verbos de decir hay: asked, said, asked to see. Es el estilo indirecto del módulo 3 trabajando dentro de un relato normal, sin que nadie lo anuncie. Así es como viaja de verdad.\"},{\"id\":\"enb1m6l4e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la consulta\",\"text\":\"«What ___ to be the problem?» «I've had a ___ throat for four days, and now I've got a ___ on my neck too.» «Right. I'll give you a ___ for something stronger.»\",\"answers\":[\"seems\",\"sore\",\"rash\",\"prescription\"],\"bank\":[\"seems\",\"sore\",\"rash\",\"prescription\",\"looks\",\"referral\",\"painkiller\"],\"translation\":\"«¿Qué le pasa?» «Llevo cuatro días con dolor de garganta y ahora me ha salido un sarpullido en el cuello.» «Bien. Le doy una receta para algo más fuerte.»\",\"itemIds\":[\"ena2m8whatseemstobetheproblem\",\"ena2m8ihaveasorethroat\",\"enb1m6rash\",\"ena2m8aprescription\"],\"tip\":\"«Something stronger» es la forma británica de decir «algo que no se compra sin receta». Si el médico usa esa frase, es que va a recetarte algo.\"},{\"id\":\"enb1m6l4e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Llevo tres días con esto y no mejora.\",\"answers\":[\"I've had it for three days and it isn't getting any better\",\"I've had it for three days and it's not getting better\",\"I have had it for three days and it isn't getting better\"],\"hint\":\"La primera mitad lleva perfecto y la preposición de duración\",\"itemIds\":[\"enb1m6ivehaditfor\"],\"tip\":\"«It isn't getting any better» es lo que dice un británico; «it doesn't improve» se entiende, pero suena a informe. En una consulta, cuanto más normal hables, mejor te entienden.\"},{\"id\":\"enb1m6l4e9\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee la carta que te han mandado, mira el esqueleto y contesta. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"El centro de salud te ha anulado la cita. Escribe a la administración (the Practice Manager) para pedir otra. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Palmer Road Medical Centre\",\"text\":\"Dear Ms Soto, We are sorry to inform you that your appointment on Thursday 14 May has been cancelled, as the doctor is unwell. We can offer you a telephone appointment next week instead. If this is not suitable, please write to the Practice Manager. Reception Team.\"},\"bullets\":[\"Di de qué cita hablas y cuándo era.\",\"Explica por qué necesitas que te vean en persona.\",\"Pide otra fecha y que te confirmen.\"],\"checks\":[{\"re\":\"(appointment|cancelled|your letter)\",\"label\":\"Dices de qué cita hablas\"},{\"re\":\"(rash|in person|face to face|face-to-face|see it|have a look)\",\"label\":\"Explicas por qué necesitas que te vean en persona\"},{\"re\":\"(could you|would it be possible|i would be grateful|another date|confirm)\",\"label\":\"Pides otra fecha y que te confirmen\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — la carta no da nombre, así que sin nombre\",\"Por qué escribes: «I am writing about the appointment…» + la fecha exacta\",\"Punto 2 — el motivo, con un conector de contraste: «Although a telephone appointment would…»\",\"Punto 3 — la petición, envuelta: «I would be grateful if you could…» / «Could you tell me whether…?»\",\"Un dato práctico con «In addition,…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully,…»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"in spite of\",\"in addition\",\"on the other hand\",\"since\",\"therefore\",\"besides\",\"unless\",\"for instance\",\"all in all\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the appointment I had booked for Thursday 14 May, which your letter has cancelled.\\nI would be grateful if you could offer me another date. Although a telephone appointment would normally be fine, I have a rash on my arm and I think the doctor needs to see it in person.\\nCould you tell me whether there is anything earlier than the following week? In addition, please confirm the new time by text.\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m6rash\",\"enb1m4inaddition\",\"enb1m1although\",\"enb1m3couldyoutellme\",\"enb1m6bookanappointment\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y mira el modelo: ni un «I want», ni una orden pelada. La queja va envuelta en «I would be grateful if you could…», y el motivo llega detrás de un «Although» — que es exactamente lo que el criterio de Organisation llama coherencia.\"},{\"id\":\"enb1m6l4e10\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I've had a sore throat for four days.\",\"translation\":\"Llevo cuatro días con dolor de garganta.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I have»\",\"I've had a sore throat ...\"],\"itemIds\":[\"ena2m8ihaveasorethroat\",\"enb1m6ivehaditfor\"],\"tip\":\"«sore» y «saw» no son la misma palabra, aunque en habla rápida se rocen: «sore» lleva la boca más redonda. Y ojo con «throat», que empieza por la zr- de «three».\"},{\"id\":\"enb1m6l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres frases que preparas antes de entrar\",\"text\":\"I've got a sore throat. I've had it for four days. I've tried paracetamol and it hasn't helped.\",\"phonetic\":\"aiv got a soo ZRÓUT · aiv jad it fo foo déis̬ · aiv tráid pa-ra-SÍI-ta-mol and it JÁ-s̬ent jelpt\",\"translation\":\"Tengo dolor de garganta. Llevo cuatro días. He probado con paracetamol y no me ha hecho nada.\",\"itemIds\":[\"ena2m8ihaveasorethroat\",\"enb1m6ivehaditfor\",\"ena2m8somepainkillers\"],\"tip\":\"Tres frases, tres present perfects, diez segundos. Dilas dos veces antes de entrar en la consulta y no te vas a bloquear — y de paso es exactamente el tipo de monólogo corto que puntúa en el Speaking Part 1.\"},{\"id\":\"enb1m6l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Podría darme un volante para el especialista?\",\"answers\":[\"Could you give me a referral to a specialist?\",\"Could I have a referral to a specialist?\",\"Could you give me a referral to a specialist\"],\"hints\":[\"Empieza por la fórmula educada del m3\",\"Could you ... me a referral to a specialist?\"],\"itemIds\":[\"enb1m6referral\",\"enb1m3couldyoutellme\"],\"tip\":\"«Give me a referral» a secas es una orden. Con «Could you…?» delante es una petición, y no cuesta ni un segundo más. El registro en inglés no está en el pronombre: está en la forma de pedir.\"},{\"id\":\"enb1m6l4e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: la cita telefónica. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Hello, is that Valeria? It's Dr — I'm ringing about the throat.|Yes, hello.|So, four days you said. Any temperature?|Not really. It's just that it hurts to swallow, and I can't work like this, I'm on the desk all day.|Right. I'm not going to give you antibiotics — it's almost certainly viral and they won't touch it. But I'll send something for the pain to the chemist's on Palmer Road. If you're no better by Monday, ring us back.|And do I need a note for work?|Not for four days, no. You self-certify for the first week. Only ring me if it goes past that.\",\"question\":\"¿Qué le manda la médica?\",\"options\":[\"Algo para el dolor, a la farmacia de Palmer Road\",\"Un antibiótico, a la farmacia de Palmer Road\",\"Un justificante para el trabajo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo descarta expresamente: «I'm not going to give you antibiotics — it's almost certainly viral».\",\"Le dice justo lo contrario: para cuatro días no hace falta, se autojustifica uno mismo.\"],\"itemIds\":[\"ena2m8aprescription\",\"enb1m6sicknote\",\"ena2m8somepainkillers\"],\"tip\":\"«It's almost certainly viral» es la deducción de la lección 1 vestida de médico. Y fíjate en el «won't touch it»: no significa tocar, significa que no le hará ningún efecto.\"}]}],\"resources\":[{\"label\":\"GOV.UK — Taking sick leave\",\"url\":\"https://www.gov.uk/taking-sick-leave\",\"note\":\"Lee solo el primer bloque, «Self-certification»: son ocho líneas y confirman lo de los siete días. Es lenguaje administrativo británico auténtico, que es el que cae en el Reading.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"i
