/\u003e· \u003ci\u003eYou \u003cb\u003eare\u003c/b\u003e from Colombia\u003c/i\u003e → \u003cb\u003earen't\u003c/b\u003e you?\u003cbr/\u003e· \u003ci\u003eYou \u003cb\u003ehave\u003c/b\u003e been to Scotland\u003c/i\u003e → \u003cb\u003ehaven't\u003c/b\u003e you?\u003cbr/\u003e· \u003ci\u003eHe \u003cb\u003ecan't\u003c/b\u003e drive\u003c/i\u003e → \u003cb\u003ecan\u003c/b\u003e he?\u003cbr/\u003e· \u003ci\u003eThey \u003cb\u003esaid\u003c/b\u003e nothing\u003c/i\u003e (no hay auxiliar) → \u003cb\u003edid\u003c/b\u003e they?\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. ¿Positiva o negativa?\u003c/b\u003e Al revés que la frase. Frase positiva → coletilla negativa; frase negativa → coletilla positiva. \u003cb\u003eNunca las dos iguales\u003c/b\u003e: «They didn't say anything, \u003cs\u003edidn't they?\u003c/s\u003e» es el error número uno.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. ¿Qué pronombre?\u003c/b\u003e El sujeto, convertido en pronombre. \u003ci\u003eYour sister\u003c/i\u003e → \u003cb\u003eshe\u003c/b\u003e. \u003ci\u003eThe buses\u003c/i\u003e → \u003cb\u003ethey\u003c/b\u003e. \u003ci\u003eThere is a problem\u003c/i\u003e → \u003cb\u003eisn't there?\u003c/b\u003e (sí, \u003ci\u003ethere\u003c/i\u003e hace de sujeto).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY dos que van por libre y hay que aprenderse tal cual:\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eLet's\u003c/i\u003e + coletilla → siempre \u003cb\u003eshall we?\u003c/b\u003e\u003cbr/\u003e· Un imperativo + coletilla → \u003cb\u003ewill you?\u003c/b\u003e («Pass me that, \u003cb\u003ewill you\u003c/b\u003e?»)\u003cbr/\u003e\u003cbr/\u003eOjo también con la contracción: se escribe con la \u003cb\u003enegativa contraída\u003c/b\u003e. «are not you» no existe: es \u003cb\u003earen't you\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l2\",\"phaseId\":\"enb1m7\",\"title\":\"…aren't you? …haven't you?\",\"subtitle\":\"El «¿no?» del español son veinte coletillas distintas en inglés\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis coletillas, seis verbos distintos\",\"itemIds\":[\"enb1m7youreirentyou\",\"enb1m7hecantcanhe\",\"enb1m7youvebeenhaventyou\",\"enb1m7theydidntdidthey\",\"enb1m7letsgoshallwe\",\"enb1m7passmethatwillyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: tres decisiones, y ninguna es difícil\",\"body\":\"$17\",\"table\":[[\"La frase\",\"El auxiliar\",\"La coletilla\"],[\"You're from Bogotá,\",\"are\",\"aren't you?\"],[\"You've been here two years,\",\"have\",\"haven't you?\"],[\"He can't drive,\",\"can't\",\"can he?\"],[\"They didn't say anything,\",\"did\",\"did they?\"],[\"She works nights,\",\"(ninguno)\",\"doesn't she?\"],[\"Let's go,\",\"—\",\"shall we?\"],[\"Pass me that,\",\"—\",\"will you?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l2e1\",\"type\":\"mc\",\"prompt\":\"Decisión 2: positiva o negativa\",\"question\":\"«They didn't say anything, ___?»\",\"options\":[\"did they\",\"didn't they\",\"no\"],\"answer\":0,\"whyWrong\":[null,\"Frase negativa + coletilla negativa: nunca. Las dos van al revés una de la otra.\",\"Ese es el calco directo del español. En inglés no existe la coletilla invariable.\"],\"itemIds\":[\"enb1m7theydidntdidthey\"],\"tip\":\"Balancín: si la frase baja, la coletilla sube. Si la frase sube, la coletilla baja. Nunca las dos al mismo lado.\"},{\"id\":\"enb1m7l2e2\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con SU coletilla\",\"pairs\":[{\"target\":\"You're from Colombia,\",\"source\":\"aren't you?\"},{\"target\":\"You've been to Scotland,\",\"source\":\"haven't you?\"},{\"target\":\"He can't drive,\",\"source\":\"can he?\"},{\"target\":\"Let's go,\",\"source\":\"shall we?\"},{\"target\":\"Pass me that,\",\"source\":\"will you?\"}],\"itemIds\":[\"enb1m7youreirentyou\",\"enb1m7youvebeenhaventyou\",\"enb1m7hecantcanhe\",\"enb1m7letsgoshallwe\",\"enb1m7passmethatwillyou\"],\"tip\":\"Las dos últimas no siguen la regla: «Let's» pide siempre «shall we?» y el imperativo pide «will you?». Son dos, se memorizan y se acabó.\"},{\"id\":\"enb1m7l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She has a very strong accent, no?\",\"answers\":[\"She has a very strong accent, hasn't she?\"],\"why\":\"El «¿no?» invariable del español no existe en inglés. Hay que repetir el auxiliar de la frase («has»), ponerlo en negativo y añadir el pronombre del sujeto: hasn't she?\",\"translation\":\"Tiene un acento muy marcado, ¿verdad?\",\"itemIds\":[\"enb1m7accent\",\"enb1m7youreirentyou\"]},{\"id\":\"enb1m7l2e4\",\"type\":\"errorfix\",\"prompt\":\"Otro clásico: el auxiliar equivocado\",\"wrong\":\"You've been to Scotland, didn't you?\",\"answers\":[\"You've been to Scotland, haven't you?\"],\"why\":\"La coletilla copia el auxiliar de la frase, y aquí el auxiliar es «have» («you've been»), no «did». Ese cambio de tiempo es lo que delata que se ha traducido «¿verdad?» en bloque en vez de mirar el verbo.\",\"translation\":\"Has estado en Escocia, ¿no?\",\"itemIds\":[\"enb1m7youvebeenhaventyou\",\"enb1m1everbeen\"]},{\"id\":\"enb1m7l2e5\",\"type\":\"transform\",\"prompt\":\"Añade la coletilla\",\"source\":\"You're from Colombia.\",\"instruction\":\"Conviértelo en pregunta de confirmación\",\"answers\":[\"You're from Colombia, aren't you?\",\"You are from Colombia, aren't you?\"],\"translation\":\"Eres de Colombia, ¿verdad?\",\"hints\":[\"El auxiliar de la frase es «are»\",\"You're from Colombia, ... you?\"],\"itemIds\":[\"enb1m7youreirentyou\"],\"tip\":\"Con «I» la negativa es irregular: «I'm right, aren't I?». Con el resto no hay sorpresa: aren't you, isn't he, aren't they.\"},{\"id\":\"enb1m7l2e6\",\"type\":\"transform\",\"prompt\":\"Añade la coletilla\",\"source\":\"He hasn't got a car.\",\"instruction\":\"Conviértelo en pregunta de confirmación\",\"answers\":[\"He hasn't got a car, has he?\"],\"translation\":\"No tiene coche, ¿verdad?\",\"hints\":[\"Frase negativa → coletilla positiva\",\"He hasn't got a car, ... he?\"],\"itemIds\":[\"enb1m7hecantcanhe\"],\"tip\":\"Ojo con «has got»: el auxiliar es «has», no «does». «He hasn't got a car, doesn't he?» mezcla las dos formas y suena raro a cualquier oído británico.\"},{\"id\":\"enb1m7l2e7\",\"type\":\"cloze\",\"prompt\":\"Completa la coletilla\",\"text\":\"Your flatmate works nights, ___ she?\",\"answers\":[\"doesn't\"],\"translation\":\"Tu compañera de piso trabaja de noche, ¿no?\",\"hints\":[\"La frase no tiene auxiliar: hay que traerlo\",\"Tercera persona del singular\"],\"itemIds\":[\"enb1m7youreirentyou\",\"enflatmate\"],\"tip\":\"Cuando la frase no tiene auxiliar, la coletilla lo inventa: do / does / did. Y hereda la persona: «works» → «doesn't she».\"},{\"id\":\"enb1m7l2e8\",\"type\":\"build\",\"prompt\":\"Construye la frase con su coletilla\",\"target\":\"You didn't understand a word, did you\",\"translation\":\"No entendiste ni una palabra, ¿verdad?\",\"distractors\":[\"don't\",\"have\"],\"itemIds\":[\"enb1m7theydidntdidthey\",\"enidontunderstand\"],\"tip\":\"El auxiliar «did» ya está en la frase («didn't»), así que la coletilla solo tiene que devolverlo en positivo. No hay que buscar nada nuevo.\"},{\"id\":\"enb1m7l2e9\",\"type\":\"gapbank\",\"prompt\":\"Cuatro coletillas seguidas — completa la conversación\",\"text\":\"You're from Bogotá, ___? And you've been in London for two years, ___? You didn't know anybody here at first, ___? Well, let's have a coffee and you can tell me the whole story, ___?\",\"answers\":[\"aren't you\",\"haven't you\",\"did you\",\"shall we\"],\"bank\":[\"aren't you\",\"haven't you\",\"did you\",\"shall we\",\"isn't it\",\"don't you\",\"have you\",\"will you\"],\"translation\":\"Eres de Bogotá, ¿verdad? Y llevas dos años en Londres, ¿no? Al principio no conocías a nadie aquí, ¿verdad? Venga, vamos a tomar un café y me lo cuentas todo, ¿te parece?\",\"itemIds\":[\"enb1m7youreirentyou\",\"enb1m7youvebeenhaventyou\",\"enb1m7theydidntdidthey\",\"enb1m7letsgoshallwe\"],\"tip\":\"Cuatro huecos, cuatro auxiliares distintos: are, have, did y el «shall we» fijo de «let's». Si te salen los cuatro, la lección está.\"},{\"id\":\"enb1m7l2e10\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"No sabe conducir, ¿verdad?\",\"answers\":[\"He can't drive, can he?\",\"She can't drive, can she?\",\"He cannot drive, can he?\"],\"hints\":[\"El auxiliar de la frase es un modal\",\"He can't drive, ... he?\"],\"itemIds\":[\"enb1m7hecantcanhe\"],\"tip\":\"Los modales son los más fáciles: se copian tal cual. can → can, will → will, should → should. Ni «do» ni nada.\"},{\"id\":\"enb1m7l2e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes, con la contracción tal cual suena\",\"text\":\"You've been to Scotland, haven't you?\",\"translation\":\"Has estado en Escocia, ¿no?\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «You have»\",\"You've been to ..., ... you?\"],\"itemIds\":[\"enb1m7youvebeenhaventyou\"],\"tip\":\"Aquí la contracción cuenta: la coletilla NUNCA se escribe entera. «have not you?» no existe en inglés moderno; se escribe siempre «haven't you?».\"},{\"id\":\"enb1m7l2e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las cinco de la lección, seguidas\",\"text\":\"You're from Colombia, aren't you? You've been here two years, haven't you? He can't drive, can he? Let's go, shall we? Pass me that, will you?\",\"phonetic\":\"yoo from ko-LÓM-bia, AANT yu · yuv bin JÍA tuu YÍAS̬, JÁ-vent yu · ji kaant draiv, kan i · lets góu, shal ui · paas mi dat, uil yu\",\"translation\":\"Eres de Colombia, ¿verdad? · Llevas aquí dos años, ¿no? · No sabe conducir, ¿verdad? · Vámonos, ¿te parece? · Pásame eso, ¿quieres?\",\"itemIds\":[\"enb1m7youreirentyou\",\"enb1m7youvebeenhaventyou\",\"enb1m7hecantcanhe\",\"enb1m7letsgoshallwe\",\"enb1m7passmethatwillyou\"],\"tip\":\"Dilas hasta que la coletilla salga sola, sin pensar el auxiliar. En el Speaking Part 2 no hay tiempo de calcularla: o sale pegada o no sale.\"},{\"id\":\"enb1m7l2e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Right, so you've filled in the form, haven't you? And you brought the two photos, didn't you? Good. You haven't paid yet, though, have you? No, I thought not. The machine's over there, next to the lift.\",\"question\":\"¿Qué es lo único que falta por hacer?\",\"options\":[\"Pagar\",\"Rellenar el impreso\",\"Traer las fotos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso ya está: «you've filled in the form, haven't you?» y la respuesta es que sí.\",\"También hecho: «you brought the two photos, didn't you?».\"],\"itemIds\":[\"enb1m7youvebeenhaventyou\",\"enform\",\"enfillintheform\"],\"tip\":\"Fíjate en «You haven't paid yet, though, have you?»: la frase es NEGATIVA, así que la coletilla es positiva. Esa inversión es la señal de que lo que viene es lo que falta.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — nivel intermedio\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/course/intermediate\",\"note\":\"Busca las unidades de question tags y haz solo el ejercicio de audio. Escucharlas dichas es lo que fija dónde cae el golpe de voz.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno
