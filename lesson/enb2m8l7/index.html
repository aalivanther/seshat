 to the next stop. Thanks ___ the new filters, the buses are cleaner.\",\"answers\":[\"Consequently\",\"more\",\"to\"],\"bank\":[\"Consequently\",\"more\",\"to\",\"Suddenly\",\"less\",\"for\"],\"translation\":\"En consecuencia, el 29 llega tarde todas las mañanas. Es más, Nora no puede ir andando hasta la siguiente parada. Gracias a los filtros nuevos, los autobuses están más limpios.\",\"itemIds\":[\"enb2m8consequently\",\"enb2m8hence\",\"enb2m8whatsmore\",\"enb2m8thanksto\"],\"tip\":\"Moreover y furthermore no están: competirían con what's more. Suddenly es de relato. Although, de contraste, no de consecuencia.\"},{\"id\":\"enb2m8l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la adición de informe\",\"text\":\"___, Nora cannot walk to the next stop.\",\"answers\":[\"Furthermore\",\"Moreover\"],\"translation\":\"Además, Nora no puede ir andando hasta la siguiente parada.\",\"hints\":[\"Adición formal, una palabra\",\"Further- / More-\"],\"itemIds\":[\"enb2m8furthermore\",\"enb2m8moreover\"],\"tip\":\"Las dos valen en este hueco aislado. En un banco compartido, no convivirían. What's more también, y es más de columna.\"},{\"id\":\"enb2m8l7e5\",\"type\":\"paraphrase\",\"prompt\":\"De la calle al ensayo: sin so ni yeah\",\"source\":\"The 29 is late every morning. So, yeah, that's why.\",\"forbid\":[\"so\",\"yeah\",\"yes\"],\"answers\":[\"Consequently, the 29 is late every morning\",\"The 29 is late every morning. Consequently, the lane has to leave a passing place\",\"As a result, the 29 is late every morning\"],\"translation\":\"El 29 llega tarde todas las mañanas. Pues eso.\",\"hints\":[\"Consequently / As a result\",\"Consequently, the 29 is late ...\"],\"itemIds\":[\"enb2m8natsoyeah\",\"enb2m8consequently\",\"enb2m5asaresult\"],\"tip\":\"So, yeah no argumenta: cierra. Consequently abre la consecuencia y sigue. El ensayo necesita que sigas.\"},{\"id\":\"enb2m8l7e6\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — cuaderno. Amy y Ben, la cocina. Dos escuchas.\",\"notepad\":true,\"audio\":\"They're going to put the lane in.|Admittedly the air is grim. Nevertheless I still have to turn at that corner. Moreover the school run uses the same twenty metres. What's more, Nora cannot do the next stop on foot. Consequently, if they take the passing place, the 29 is late every morning and I am the letter in the Gazette.|Then again, the air is worse than it was.|Then again is not a timetable, Amy. Hence the empty shop, if you want a picture. Thanks to the filters we're cleaner. That isn't the same as being able to levitate.\",\"question\":\"¿Qué está haciendo Ben con moreover / what's more / consequently?\",\"options\":[\"Apilando razones de informe, y Amy le pone un then again de calle que él rechaza como horario\",\"Concediendo que el carril debe hacerse sin condiciones\",\"Cambiando de tema hacia el café de Sam\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Admittedly es la concesión; nevertheless tira. No entrega la tesis.\",\"El café no sale.\"],\"itemIds\":[\"enb2m8admittedly\",\"enb2m8nevertheless\",\"enb2m8moreover\",\"enb2m8whatsmore\",\"enb2m8consequently\",\"enb2m8natthenagain\",\"enb2m8hence\",\"enb2m8thanksto\"],\"tip\":\"Then again is not a timetable. Ben está diciendo, en una línea, la diferencia de registro que el módulo entrena.\"},{\"id\":\"enb2m8l7e7\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — consecuencia de informe\",\"text\":\"Consequently, the 29 is late every morning.\",\"phonetic\":\"KÓN-si-kuent-li, de TUÉN-ti-náin is̬ leit É-vri MÓO-ning\",\"translation\":\"En consecuencia, el 29 llega tarde todas las mañanas.\",\"itemIds\":[\"enb2m8consequently\"],\"tip\":\"El golpe va en CON, TWEN-ty-NINE, LATE, MOR-ning. Consequently se come las sílabas del medio. Si las deletreas, suenas a libro.\"},{\"id\":\"enb2m8l7ext2\",\"type\":\"transform\",\"prompt\":\"De dos frases a una concesión\",\"source\":\"The lane may be built. The buses still have to turn.\",\"instruction\":\"Únelas con even if\",\"answers\":[\"Even if the lane is built, the buses still have to turn.\",\"Even if the lane is built, the buses still have to turn\",\"The buses still have to turn even if the lane is built.\"],\"translation\":\"Aunque se construya el carril, los autobuses siguen teniendo que girar.\",\"itemIds\":[\"enb2m8evenif\"],\"tip\":\"Even if no da el carril por hecho. Even though sí. Una letra, un mundo.\"},{\"id\":\"enb2m8l7exw2\",\"type\":\"write\",\"prompt\":\"Artículo de 140-180. Describe Palmer Road un día laborable, no un ensayo a favor o en contra.\",\"scenario\":\"La revista del barrio pide una descripción, no un for-and-against: «A weekday morning on Palmer Road». 140-180 palabras. Lector: vecinos. Ben conduce el 29; Nora espera; el aire en el semáforo es el que es. No contestes «should the council…»: eso es otra tarea y vale cero.\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review — call for pieces\",\"text\":\"Describe the street between eight and nine. Buses, air, the corner, who waits. Do not argue for or against the lane. Off-topic scores nothing.\"},\"bullets\":[\"Describe la calle a esa hora con al menos un hecho concreto (el 29, el semáforo, Nora, el aire).\",\"Incluye a Ben o a Nora en la escena, no como tesis.\",\"Cierra con by contrast / even so / consequently, sin «should the council».\"],\"checks\":[{\"re\":\"(palmer road|the 29|lights|queue)\",\"label\":\"Names the street at that hour\"},{\"re\":\"(ben carter|\\\\bnora\\\\b|the buses|the air)\",\"label\":\"Puts Ben, Nora, the buses or the air in the scene\"},{\"re\":\"(by contrast|even so|consequently)\",\"label\":\"Closes with a connector, not a council thesis\"}],\"frame\":[\"Párrafo 1 — las ocho: el 29, el semáforo, Nora\",\"Párrafo 2 — By contrast… las calles de detrás / Even so… el giro\",\"Párrafo 3 — Consequently… lo que se ve desde el café, no lo que «debería» hacerse\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"by contrast\",\"even so\",\"consequently\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"On a weekday morning Palmer Road does not look like a debate. It looks like a queue. Ben Carter sits in the 29 at the lights, engine on, while the school run fills the same twenty metres. The air at the corner is the worst in the ward. Nora, who cannot walk to the next stop, waits under the shop awning.\\nAmy walks past with a mask of sleep still on her face. The empty shop on the corner has been empty since last winter. By contrast, the side streets are already full of parked cars that will not move until evening. Even so, the buses still have to turn, and they swing out because the road is narrow.\\nValeria watches from the café window. She is not writing a thesis. She is describing what the street does between eight and nine: the 29 late, the bikes threading the gap, the air you can taste. Consequently, anyone who lives here already knows the picture. The drawing on the council noticeboard is cleaner than the corner itself.\",\"itemIds\":[\"enb2m8bycontrast\",\"enb2m8evenif\",\"enb2m8consequently\",\"enb2m8pollution\",\"enb2m8parking\"],\"tip\":\"Si el último párrafo pide un carril o un voto, has cambiado de género. Recorta y vuelve a la esquina.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m8-3\",\"book\":\"because of this\",\"real\":\"So, yeah\",\"meaning\":\"Pues eso / así que bueno\",\"when\":\"Con amigos, al cerrar una explicación que ya se ha entendido. En el ensayo, la misma consecuencia se dice «as a result» o «consequently». So, yeah en un Writing es un error de registro, no de lógica.\",\"register\":\"amigos\",\"exam\":\"as a result / consequently\",\"note\":\"Yeah no es yes: es el cierre que da por sentado que el otro ya ha llegado. En un argumento, llegar no basta: hay que nombrarlo.\",\"sound\":\"sóu, yé\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m8natsoyeah\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\
