003e.\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eAdverbiales → ocupan la posición 1 y provocan INVERSIÓN\u003c/b\u003e: deshalb, trotzdem, außerdem, danach, deswegen.\u003cbr/\u003e\u0026nbsp;\u0026nbsp;\u003ci\u003e\u003cb\u003eTrotzdem bin ich\u003c/b\u003e sehr glücklich.\u003c/i\u003e — jamás «Trotzdem ich bin».\u003cbr/\u003e3. \u003cb\u003eCoordinantes → no tocan nada\u003c/b\u003e: und, aber, oder, denn, sondern.\u003cbr/\u003e\u0026nbsp;\u0026nbsp;\u003ci\u003eIch bin müde, \u003cb\u003eaber ich bin\u003c/b\u003e glücklich.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa estructura del correo informal\u003c/b\u003e (Schreiben Aufgabe 1 del examen, 40 puntos, 20 minutos):\u003cbr/\u003e· \u003cb\u003eAnrede\u003c/b\u003e: Hallo Nico, / Liebe Anna, — coma, y la línea siguiente en minúscula.\u003cbr/\u003e· \u003cb\u003eEinleitung\u003c/b\u003e: una frase que explique por qué escribes.\u003cbr/\u003e· \u003cb\u003eLos 3 puntos de contenido\u003c/b\u003e, en el orden en que te los dan. \u003cu\u003eSaltarte uno te baja de banda en Erfüllung\u003c/u\u003e y ahí se van muchos puntos de golpe (el 0 solo llega si no tratas el tema o te quedas por debajo de la mitad de las palabras).\u003cbr/\u003e· \u003cb\u003eSchluss\u003c/b\u003e: una pregunta o una propuesta.\u003cbr/\u003e· \u003cb\u003eGruß\u003c/b\u003e: Viele Grüße / Liebe Grüße + tu nombre.\u003cbr/\u003e\u003cbr/\u003eY la regla que más duele aprender: \u003cb\u003emenos del 50% de las palabras pedidas = 0 puntos\u003c/b\u003e, por bien escrito que esté. 79 palabras bien conectadas valen más que 120 brillantes que ignoran un punto."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l8\",\"phaseId\":\"b1m1\",\"title\":\"Schreib mir mal!\",\"subtitle\":\"Escritura — el correo informal de la mudanza (80 palabras)\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los conectores que sostienen un texto\",\"itemIds\":[\"b1m1ausserdem\",\"b1m1trotzdem\",\"b1m1sichfreuenauf\",\"b1m1einstand\",\"a2m6deshalb\",\"a2m6weil\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: conectores y qué le hacen al verbo\",\"body\":\"$17\",\"table\":[[\"familia\",\"conectores\",\"efecto\"],[\"subordinante\",\"weil, dass, obwohl, wenn\",\"verbo AL FINAL\"],[\"adverbial\",\"deshalb, trotzdem, außerdem, danach\",\"posición 1 → inversión\"],[\"coordinante\",\"und, aber, oder, denn, sondern\",\"no cambia nada\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l8e1\",\"type\":\"bucket\",\"prompt\":\"¿Verbo al final o inversión?\",\"categories\":[\"verbo AL FINAL (…, weil ich müde bin)\",\"INVERSIÓN (deshalb bin ich müde)\"],\"items\":[{\"text\":\"weil\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"dass\",\"bucket\":0},{\"text\":\"außerdem\",\"bucket\":1}],\"itemIds\":[\"a2m6weil\",\"a2m6deshalb\",\"b1m1trotzdem\",\"b1m1ausserdem\",\"b1m1dass\"],\"tip\":\"Regla de bolsillo: si el conector es UNA palabra que podrías sustituir por «por eso» o «además», hay inversión. Si equivale a «porque/aunque/que», el verbo se va al final.\"},{\"id\":\"b1m1l8e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Trotzdem ich bin sehr glücklich.\",\"answers\":[\"Trotzdem bin ich sehr glücklich.\"],\"why\":\"«trotzdem» ocupa la posición 1, así que el verbo tiene que ir inmediatamente detrás y el sujeto pasa al tercer lugar. En español «aun así yo estoy» no obliga a nada; en alemán sí.\",\"translation\":\"Aun así estoy muy contento.\",\"itemIds\":[\"b1m1trotzdem\"]},{\"id\":\"b1m1l8e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Außerdem der Bahnhof ist ganz nah.\",\"answers\":[\"Außerdem ist der Bahnhof ganz nah.\"],\"why\":\"Mismo caso: «außerdem» es adverbio en posición 1 → inversión. El verbo no suelta nunca la segunda posición.\",\"translation\":\"Además, la estación está muy cerca.\",\"itemIds\":[\"b1m1ausserdem\"]},{\"id\":\"b1m1l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich freue mich ___ deinen Besuch!\",\"answers\":[\"auf\"],\"translation\":\"¡Tengo ganas de tu visita!\",\"hints\":[\"Algo que aún NO ha pasado: se espera con ilusión\",\"sich freuen + preposición de futuro\"],\"itemIds\":[\"b1m1sichfreuenauf\"],\"tip\":\"sich freuen AUF = ilusión por algo futuro · sich freuen ÜBER = alegría por algo ya ocurrido. El español dice «alegrarse DE» para los dos.\"},{\"id\":\"b1m1l8e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el borrador del correo con los conectores\",\"text\":\"Der Umzug war anstrengend, ___ der Aufzug kaputt war. ___ bin ich sehr glücklich. Ich bleibe hier bestimmt lange, ___ die Wohnung ist perfekt für mich.\",\"answers\":[\"weil\",\"Trotzdem\",\"denn\"],\"bank\":[\"weil\",\"Trotzdem\",\"denn\",\"obwohl\",\"damit\",\"aber\"],\"translation\":\"La mudanza fue agotadora porque el ascensor estaba roto. Aun así estoy muy contento. Seguro que me quedo mucho tiempo, porque el piso es perfecto para mí.\",\"itemIds\":[\"a2m6weil\",\"b1m1trotzdem\"],\"tip\":\"Un hueco por familia: «weil» manda el verbo al final · «Trotzdem» ocupa la posición 1 y provoca inversión · «denn» no toca nada (sujeto + verbo, como siempre). El orden de palabras te dice cuál cabe en cada sitio.\"},{\"id\":\"b1m1l8e6\",\"type\":\"build\",\"prompt\":\"Construye la invitación\",\"target\":\"Am Samstag feiere ich meine Einweihungsparty\",\"translation\":\"El sábado celebro la fiesta de estreno del piso\",\"altTargets\":[\"Ich feiere am Samstag meine Einweihungsparty\"],\"distractors\":[\"ich feiere\",\"Einweihungspartys\"],\"itemIds\":[\"b1m1einstand\",\"a2m1amsamstag\"],\"tip\":\"Cuidado con el par: la fiesta del PISO nuevo es «die Einweihungsparty» (o Einweihungsfeier). «Der Einstand» es la invitación que pagas al entrar en un TRABAJO nuevo — otra cosa.\"},{\"id\":\"b1m1l8e7\",\"type\":\" ster\":\"du\",\"bullets\":[\"Cuenta cómo fue la mudanza (usa el Perfekt: bin umgezogen / war anstrengend).\",\"Describe el piso nuevo con una frase de relativo (…, die/der/das …).\",\"Invítalo a tu Einweihungsparty y propón un día concreto.\"],\"checks\":[{\"re\":\"(umgezogen|umzug)\",\"label\":\"Cuentas la mudanza\"},{\"re\":\",\\\\s*(die|der|das|den)\\\\s\",\"label\":\"Usas una frase de relativo\"},{\"re\":\"(einweihung|party|feier|besuch|komm)\",\"label\":\"Invitas y propones un día\"}],\"frame\":[\"Anrede: «Hallo Nico,» + coma, y sigue en minúscula\",\"Einleitung: «endlich habe ich es geschafft: …»\",\"Punto 1 — la mudanza: «Am Samstag bin ich umgezogen. Der Umzug war …, weil …»\",\"Punto 2 — el piso: «Ich habe jetzt eine Wohnung, die …»\",\"Punto 3 — la invitación: «Am … feiere ich meine Einweihungsparty. Hast du Zeit?»\",\"Schluss + Gruß: «Ich freue mich auf deinen Besuch. Viele Grüße, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"deshalb\",\"außerdem\",\"trotzdem\",\"weil\",\"aber\",\"denn\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Hallo Nico,\\nendlich habe ich es geschafft: Am Samstag bin ich umgezogen! Der Umzug war anstrengend, weil der Aufzug kaputt war und wir alles über das Treppenhaus tragen mussten. Trotzdem bin ich sehr glücklich. Ich habe jetzt eine Wohnung, die hell und ruhig ist. Die Küche ist zwar klein, aber der Balkon ist super. Außerdem ist der Bahnhof nur fünf Minuten entfernt. Am nächsten Samstag feiere ich meine Einweihungsparty. Hast du Zeit? Es wäre schön, wenn du kommen könntest.\\nViele Grüße\\nSofía\",\"itemIds\":[\"b1m1umziehen\",\"b1m1trotzdem\",\"b1m1ausserdem\",\"b1m1einstand\",\"b1m1sichfreuenauf\",\"b1m1einewohnungdiehellist\"],\"tip\":\"Cuenta tus palabras antes de enviar. Menos de 40 = 0 puntos automáticos, aunque cada frase sea perfecta. Es la lección más rentable del nivel.\"},{\"id\":\"b1m1l8e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil
