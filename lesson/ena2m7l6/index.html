next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T49e,En el A1 aprendiste \u003cb\u003ecan\u003c/b\u003e como capacidad: [[I can swim.|Sé nadar.]], [[I can't dance.|No sé bailar.]] Ese es su primer trabajo, y no cambia.\u003cbr/\u003e\u003cbr/\u003eEl segundo es el de este módulo: \u003cb\u003epermiso\u003c/b\u003e. [[Can I sit here?|¿Puedo sentarme aquí?]] no pregunta si eres físicamente capaz de sentarte: pregunta si te dejan. Y [[You can't park here.|Aquí no se puede aparcar.]] no dice que el coche no quepa: dice que no te dejan.\u003cbr/\u003e\u003cbr/\u003eEs exactamente el mismo doble oficio que tiene «poder» en español, así que aquí no tienes que aprender nada nuevo: solo darte cuenta de que la palabra sirve para las dos cosas y de que el contexto las separa sin esfuerzo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la trampa del to, otra vez.\u003c/b\u003e can es un modal como must, así que detrás va el verbo desnudo: ❌ \u003ci\u003eCan I to sit here?\u003c/i\u003e · ✅ \u003cb\u003eCan I sit here?\u003c/b\u003e. La lista de modales del módulo es must, mustn't, can, can't, could y may, y los seis funcionan igual: sin do, sin -s y sin to.\u003cbr/\u003e\u003cbr/\u003eLa otra trampa es la negación. El español niega con una sola palabra delante («no puedo»), y de ahí sale ❌ \u003ci\u003eI don't can\u003c/i\u003e. En inglés el modal se niega él solo, pegándose el not: \u003cb\u003ecan't\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l6\",\"phaseId\":\"ena2m7\",\"title\":\"Can I sit here?\",\"subtitle\":\"El can que ya conoces, en su segundo oficio: permiso y favores\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Pedir y conceder\",\"itemIds\":[\"ena2m7canisithere\",\"ena2m7youcantparkhere\",\"ena2m7canyoucheckit\",\"ena2m7ofcourseyoucan\",\"ena2m7imafraidyoucant\",\"ena2m7thecashpoint\",\"encanipaybycard\"]},{\"kind\":\"note\",\"note\":{\"title\":\"can tiene dos trabajos, y ya conocías uno\",\"body\":\"$17\",\"table\":[[\"\",\"capacidad (A1)\",\"permiso (aquí)\"],[\"afirmativa\",\"I can swim.\",\"You can sit here.\"],[\"negativa\",\"I can't dance.\",\"You can't park here.\"],[\"pregunta\",\"Can you swim?\",\"Can I sit here?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Can I…? y Can you…?: dos preguntas que no se parecen en nada\",\"body\":\"Las dos empiezan igual y hacen cosas distintas. Fíjate en quién va detrás del \u003ci\u003ecan\u003c/i\u003e, porque ahí está todo:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eCan I…?\u003c/b\u003e → pido algo \u003cb\u003epara mí\u003c/b\u003e: permiso, o un objeto. [[Can I sit here?|¿Puedo sentarme aquí?]] · [[Can I pay by card?|¿Puedo pagar con tarjeta?]] · \u003ci\u003eCan I have a coffee, please?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eCan you…?\u003c/b\u003e → le pido \u003cb\u003ea otra persona\u003c/b\u003e que haga algo: un favor. [[Can you check it for me?|¿Me lo puedes mirar?]] · \u003ci\u003eCan you help me?\u003c/i\u003e · \u003ci\u003eCan you repeat that, please?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY las respuestas, que en una ventanilla las vas a oír exactamente así:\u003cbr/\u003e· Sí → [[Of course you can.|Claro que sí.]] · \u003ci\u003eYes, of course.\u003c/i\u003e · \u003ci\u003eSure.\u003c/i\u003e\u003cbr/\u003e· No → [[I'm afraid you can't.|Lo siento, no puede ser.]] · \u003ci\u003eSorry, you can't.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eI'm afraid\u003c/b\u003e no tiene nada que ver con el miedo: es la fórmula estándar para dar una mala noticia con educación. En inglés, un «no» pelado suena bastante más seco que en español, así que casi nunca va solo.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l6e1\",\"type\":\"build\",\"prompt\":\"Construye la pregunta — y mira qué fichas sobran\",\"target\":\"Can I sit here\",\"translation\":\"¿Puedo sentarme aquí?\",\"distractors\":[\"to\",\"sitting\"],\"itemIds\":[\"ena2m7canisithere\"],\"tip\":\"Otra vez las dos mismas fichas de sobra. Detrás de un modal, el verbo va en su forma de diccionario y punto.\"},{\"id\":\"ena2m7l6e2\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «to»\",\"wrong\":\"Can I to sit here?\",\"answers\":[\"Can I sit here?\"],\"why\":\"can es un modal, igual que must: detrás va el verbo desnudo. El «to» viene del español, que sí lo pide («puedo sentarme», «tengo QUE sentarme»), y aquí no pinta nada.\",\"translation\":\"¿Puedo sentarme aquí?\",\"itemIds\":[\"ena2m7canisithere\"]},{\"id\":\"ena2m7l6e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige la negación calcada\",\"wrong\":\"You don't can park here.\",\"answers\":[\"You can't park here.\"],\"why\":\"En español negamos poniendo un «no» delante y ya está («no puedes aparcar»). En inglés, un modal se niega él solo pegándose el not: can + not = can't. El do no entra nunca en la ecuación cuando hay un modal.\",\"translation\":\"Aquí no se puede aparcar.\",\"itemIds\":[\"ena2m7youcantparkhere\"]},{\"id\":\"ena2m7l6e4\",\"type\":\"bucket\",\"prompt\":\"¿Pides algo para ti o le pides algo a otro?\",\"categories\":[\"para mí (Can I…?)\",\"un favor a otro (Can you…?)\"],\"items\":[{\"text\":\"___ sit here?\",\"bucket\":0},{\"text\":\"___ check it for me?\",\"bucket\":1},{\"text\":\"___ pay by card?\",\"bucket\":0},{\"text\":\"___ repeat that, please?\",\"bucket\":1},{\"text\":\"___ have a stamp, please?\",\"bucket\":0},{\"text\":\"___ help me with this?\",\"bucket\":1}],\"itemIds\":[\"ena2m7canisithere\",\"ena2m7canyoucheckit\",\"encanipaybycard\",\"encanyourepeat\",\"encanyouhelpme\"],\"tip\":\"Mira quién hace la acción. Si la hago yo, Can I. Si la hace la otra persona, Can you.\"},{\"id\":\"ena2m7l6e5\",\"type\":\"cloze\",\"prompt\":\"En el taller\",\"text\":\"___ you check it for me, please?\",\"answers\":[\"Can\",\"Could\"],\"translation\":\"¿Me lo puede mirar, por favor?\",\"hints\":[\"Le pides el favor a otra persona\",\"C…\"],\"itemIds\":[\"ena2m7canyoucheckit\",\"ena2m7thegarage\"]},{\"id\":\"ena2m7l6e6\",\"type\":\"mc\",\"prompt\":\"Le dices que no, pero sin ser brusco\",\"question\":\"«Lo siento, no puede ser»\",\"options\":[\"I'm afraid you can't.\",\"I have fear that you can't.\",\"No, you don't can.\"],\"answer\":0,\"whyWrong\":[null,\"I'm afraid aquí no habla de miedo: es una fórmula fija para dar una mala noticia\",\"El modal se niega solo: can't, sin do\"],\"itemIds\":[\"ena2m7imafraidyoucant\"],\"tip\":\"Guárdate esta frase entera, tal cual. La vas a usar cada vez que tengas que decir que no en inglés, que es más a menudo de lo que parece.\"},{\"id\":\"ena2m7l6e7\",\"type\":\"match\",\"prompt\":\"Empareja pregunta y respuesta\",\"pairs\":[{\"target\":\"Can I sit here?\",\"source\":\"— Of course you can.\"},{\"target\":\"Can I pay by card?\",\"source\":\"— I'm afraid you can't, it's cash only.\"},{\"target\":\"Can you check it for me?\",\"source\":\"— Sure, give me two minutes.\"},{\"target\":\"Can I park here?\",\"source\":\"— No, sorry, it's for staff only.\"}],\"itemIds\":[\"ena2m7canisithere\",\"encanipaybycard\",\"ena2m7canyoucheckit\",\"ena2m7youcantparkhere\",\"ena2m7staffonly\"]},{\"id\":\"ena2m7l6e8\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"¿Puedo pagar con tarjeta? — Lo siento, no puede ser.\",\"answers\":[\"Can I pay by card? I'm afraid you can't.\",\"Can I pay by card? — I'm afraid you can't.\",\"Could I pay by card? I'm afraid you can't.\"],\"hint\":\"una pregunta de permiso y una negativa con envoltorio\",\"itemIds\":[\"encanipaybycard\",\"ena2m7imafraidyoucant\",\"encash\"]},{\"id\":\"ena2m7l6e9\",\"type\":\"audiomc\",\"prompt\":\"En el cajero — 2 escuchas\",\"audio\":\"Excuse me, can I use this cashpoint? — I'm afraid you can't, it's out of order. There's another one inside the bank.\",\"question\":\"¿Qué pasa con el cajero?\",\"options\":[\"Está averiado y hay otro dentro del banco\",\"Solo funciona con tarjeta del banco\",\"Está cerrado hasta mañana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De tarjetas no dice nada\",\"No dice que cierre: dice que no funciona\"],\"itemIds\":[\"ena2m7thecashpoint\",\"ena2m7outoforder\",\"ena2m7imafraidyoucant\",\"enbank\"]},{\"id\":\"ena2m7l6e10\",\"type\":\"speak\",\"prompt\":\"Pide permiso y agradece la respuesta\",\"text\":\"Excuse me, can I sit here? — Of course you can. — Thank you!\",\"phonetic\":\"eks-KIÚUS̬ mi, kan ái SIT jía? — ov KÓOS yu kan — ZANK yu\",\"translation\":\"Perdone, ¿puedo sentarme aquí? — Claro que sí. — ¡Gracias!\",\"itemIds\":[\"ena2m7canisithere\",\"ena2m7ofcourseyoucan\",\"enexcuseme\",\"enthankyou\"],\"tip\":\"El can de la pregunta va de puntillas y el golpe cae en SIT. Si acentúas el can, suena a que dudas de que te dejen.\"},{\"id\":\"ena2m7l6e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Puedo sentarme aquí? — Claro que sí.\",\"answers\":[\"Can I sit here? Of course you can.\",\"Can I sit here? — Of course you can.\",\"Could I sit here? Of course you can.\"],\"hints\":[\"Modal + verbo desnudo, y la respuesta hecha\",\"C… I sit here? Of course you c…\"],\"itemIds\":[\"ena2m7canisithere\",\"ena2m7ofcourseyoucan\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m7-5\",\"book\":\"I'm afraid you can't.\",\"real\":\"Sorry, no can do.\",\"meaning\":\"Lo siento, imposible\",\"when\":\"Entre compañeros y amigos, y solo para cosas sin importancia: un favor pequeño, un cambio de turno. Con un cliente o en una ventanilla, jamás — ahí suena a que te da igual. En el examen, siempre I'm afraid you can't.\",\"register\":\"amigos\",\"note\":\"Es una frase hecha con la gramática rota a propósito, como el «ni de broma» español. No intentes analizarla: se aprende entera o no se usa.\",\"sound\":\"SO-ri, nóu kan DÚU\",\"level\":\"a2\",\"itemId\":\"ena2m7imafraidyoucant\"}}],\"resources\":[{\"
