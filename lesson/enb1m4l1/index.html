rticle \u003cb\u003eis written\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003ci\u003eThey \u003cb\u003epublished\u003c/b\u003e it on Tuesday.\u003c/i\u003e → \u003ci\u003eIt \u003cb\u003ewas published\u003c/b\u003e on Tuesday.\u003c/i\u003e\u003cbr/\u003eEl objeto de la frase activa se sube a sujeto, y el verbo se parte en dos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora lo importante, que no es la forma: es PARA QUÉ.\u003c/b\u003e El inglés usa la pasiva cuando el que hace la acción \u003cb\u003eno importa, no se sabe o se prefiere no decir\u003c/b\u003e. Por eso vive en la prensa, en los carteles y en los informes.\u003cbr/\u003e· \u003ci\u003eThe library \u003cb\u003ewas built\u003c/b\u003e in 1904.\u003c/i\u003e — ¿por quién? Da igual.\u003cbr/\u003e· \u003ci\u003eMy bike \u003cb\u003ewas stolen\u003c/b\u003e.\u003c/i\u003e — no se sabe.\u003cbr/\u003e· \u003ci\u003eA mistake \u003cb\u003ewas made\u003c/b\u003e.\u003c/i\u003e — se sabe, y justo por eso no se dice.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl agente con «by» es la excepción, no la regla.\u003c/b\u003e Solo se pone cuando aporta algo: \u003ci\u003eThe article is written \u003cb\u003eby a local journalist\u003c/b\u003e\u003c/i\u003e (eso sí es información). En un texto real, cuatro de cada cinco pasivas van sin \u003ci\u003eby\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn aviso de nivel, con nombre y apellidos:\u003c/b\u003e LanguageCert coloca la pasiva en su lista de B2, no de B1. Y aun así se enseña, porque el propio handbook dice que al candidato \u003ci\u003ese le expone\u003c/i\u003e a la gramática del nivel de arriba aunque no se le pregunte por ella. Traducido: en el examen no te van a pedir que la produzcas, pero el texto del Reading Part 4 está escrito en pasiva de arriba abajo. Sin ella no lees tu propio examen."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l1\",\"phaseId\":\"enb1m4\",\"title\":\"Written, published, delivered\",\"subtitle\":\"La pasiva: cuando lo que importa es qué pasó, no quién lo hizo\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La prensa, y la frase que la sostiene\",\"itemIds\":[\"enb1m4thepress\",\"enb1m4headline\",\"enb1m4article\",\"enb1m4journalist\",\"enb1m4iswrittenby\",\"enb1m4waspublished\",\"enb1m4isdelivered\",\"enb1m4wasbuilt\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: be + participio, y el culpable que se calla\",\"body\":\"$17\",\"table\":[[\"Tiempo\",\"Activa\",\"Pasiva\"],[\"Present simple\",\"They deliver the paper.\",\"The paper is delivered.\"],[\"Past simple\",\"They published it.\",\"It was published.\"],[\"Present perfect\",\"They have sold the tickets.\",\"The tickets have been sold.\"],[\"Con agente\",\"A journalist writes it.\",\"It is written by a journalist.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro palabras de la prensa\",\"pairs\":[{\"target\":\"the press\",\"source\":\"la prensa\"},{\"target\":\"the headline\",\"source\":\"el titular\"},{\"target\":\"an article\",\"source\":\"un artículo\"},{\"target\":\"a journalist\",\"source\":\"un periodista, una periodista\"}],\"itemIds\":[\"enb1m4thepress\",\"enb1m4headline\",\"enb1m4article\",\"enb1m4journalist\"],\"tip\":\"«the press» es toda la prensa a la vez, como en español, y no lleva plural: «the press say» o «the press says», nunca «the presses».\"},{\"id\":\"enb1m4l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — todo esto ya lo traes de los módulos 1 y 2\",\"pairs\":[{\"target\":\"the advert\",\"source\":\"el anuncio\"},{\"target\":\"the neighbourhood\",\"source\":\"el barrio\"},{\"target\":\"a colleague\",\"source\":\"un compañero de trabajo\"},{\"target\":\"the local paper\",\"source\":\"el periódico local\"},{\"target\":\"a vacancy\",\"source\":\"una vacante\"}],\"targetSeconds\":24,\"itemIds\":[\"enb1m2advert\",\"enb1m1neighbourhood\",\"enb1m2colleague\",\"enb1m4localpaper\",\"enb1m2vacancy\"],\"tip\":\"Ojo con «advert»: es el anuncio, no la advertencia. Ese falso amigo se cobra en el Reading, donde un texto de cinco líneas se entiende al revés por una palabra.\"},{\"id\":\"enb1m4l1e3\",\"type\":\"mc\",\"prompt\":\"La estructura del módulo, en una frase\",\"question\":\"«El artículo lo escribe una periodista local» →\",\"options\":[\"The article writes a local journalist.\",\"The article is written by a local journalist.\",\"The article is write by a local journalist.\"],\"answer\":1,\"whyWrong\":[\"Esto significa «el artículo escribe a una periodista»: sin pasiva, el sujeto es quien hace la acción.\",null,\"El verbo «be» está bien, pero detrás va el PARTICIPIO (written), no el infinitivo.\"],\"itemIds\":[\"enb1m4iswrittenby\"],\"tip\":\"En español el orden basta para decir quién hace qué («lo escribe»). En inglés no: si el sujeto va delante del verbo, es quien actúa — a menos que pongas la pasiva.\"},{\"id\":\"enb1m4l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The article written by a local journalist.\",\"answers\":[\"The article is written by a local journalist.\"],\"why\":\"Falta el verbo «be». Sin él no hay frase: «written» solo es un participio suelto. El español puede dejarlo caer («artículo escrito por…»); el inglés, en una oración entera, nunca.\",\"translation\":\"El artículo lo escribe una periodista local.\",\"itemIds\":[\"enb1m4iswrittenby\"]},{\"id\":\"enb1m4l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar\",\"text\":\"The paper ___ delivered every morning.\",\"answers\":[\"is\"],\"translation\":\"El periódico lo traen todas las mañanas.\",\"hints\":[\"El sujeto es «the paper»: singular\",\"Presente del verbo «be»\"],\"itemIds\":[\"enb1m4isdelivered\"],\"tip\":\"El auxiliar concuerda con el sujeto NUEVO, el que era objeto: «the paper is», «the papers are». Es el error de concordancia más frecuente al pasar a pasiva.\"},{\"id\":\"enb1m4l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase de la biblioteca\",\"target\":\"The library was built in 1904\",\"translation\":\"La biblioteca se construyó en 1904\",\"distractors\":[\"is\",\"building\"],\"itemIds\":[\"enb1m4wasbuilt\"],\"tip\":\"Las dos fichas que sobran son las dos que pone un hispanohablante: el presente («is built», calcando «se construye») y el gerundio.\"},{\"id\":\"enb1m4l1e7\",\"type\":\"transform\",\"prompt\":\"De activa a pasiva\",\"source\":\"A local journalist writes the article.\",\"instruction\":\"Ponla en pasiva, con el agente\",\"answers\":[\"The article is written by a local journalist\",\"The article is written by a local journalist.\"],\"translation\":\"El artículo lo escribe una periodista local.\",\"hints\":[\"El objeto sube a sujeto: The article…\",\"The article is ... by a local journalist\"],\"itemIds\":[\"enb1m4iswrittenby\"],\"tip\":\"Tres pasos, siempre los mismos: el objeto sube a sujeto, el verbo se parte en be + participio, y el sujeto viejo se va al final con «by» — o desaparece.\"},{\"id\":\"enb1m4l1e8\",\"type\":\"bucket\",\"prompt\":\"¿Quién hace la acción: el sujeto, o alguien que no se nombra?\",\"categories\":[\"ACTIVA — el sujeto lo hace\",\"PASIVA — al sujeto se lo hacen\"],\"items\":[{\"text\":\"A journalist writes the article.\",\"bucket\":0},{\"text\":\"They deliver the paper.\",\"bucket\":0},{\"text\":\"The council closed the pool.\",\"bucket\":0},{\"text\":\"Nora reads the local paper.\",\"bucket\":0},{\"text\":\"The article is written in London.\",\"bucket\":1},{\"text\":\"The paper is delivered every morning.\",\"bucket\":1},{\"text\":\"The pool was closed in March.\",\"bucket\":1},{\"text\":\"The library was built in 1904.\",\"bucket\":1}],\"itemIds\":[\"enb1m4iswrittenby\",\"enb1m4isdelivered\",\"enb1m4wasbuilt\"],\"tip\":\"La pista no es el significado, es la forma: si ves «be» (is, are, was, were) seguido de participio, es pasiva. Sin ese «be», no lo es por muy impersonal que suene.\"},{\"id\":\"enb1m4l1e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Se publicó el martes.\",\"answers\":[\"It was published on Tuesday\",\"It was published on Tuesday.\",\"It was published last Tuesday\"],\"hint\":\"El «se» español desaparece: aquí va pasado de «be» + participio\",\"itemIds\":[\"enb1m4waspublished\"],\"tip\":\"Fíjate en lo que ha pasado con el «se»: no se traduce por nada. Se convierte en la pasiva entera.\"},{\"id\":\"enb1m4l1e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"The paper is delivered every morning.\",\"answers\":[\"El periódico lo traen todas las mañanas\",\"El periódico se reparte todas las mañanas\",\"El periódico lo reparten todas las mañanas\"],\"itemIds\":[\"enb1m4isdelivered\"],\"tip\":\"En español tienes dos salidas —«lo traen» y «se reparte»— y las dos son buenas. El inglés tiene una sola: la pasiva.\"},{\"id\":\"enb1m4l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"It was published on Tuesday.\",\"translation\":\"Se publicó el martes.\",\"hints\":[\"Empieza por «It was…»\",\"It was pu... on Tuesday\"],\"itemIds\":[\"enb1m4waspublished\"],\"tip\":\"El «was» átono suena casi «uos̬», tragado, y el golpe cae en PU-blished. Si esperas oír una palabra fuerte, te la pierdes — y con ella el tiempo verbal entero.\"},{\"id\":\"enb1m4l1e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"The library was built in 1904, and the paper is still delivered every morning.\",\"phonetic\":\"de LÁI-bra-ri uos̬ bilt in náin-TÍIN óu foo, and de PÉI-pa is̬ stil di-LÍ-vad É-vri MÓO-ning\",\"translation\":\"La biblioteca se construyó en 1904 y el periódico se sigue repartiendo todas las mañanas.\",\"itemIds\":[\"enb1m4wasbuilt\",\"enb1m4isdelivered\",\"enb1m1still\"],\"tip\":\"1904 se dice «nineteen oh four»: los años se parten en dos mitades y el cero se lee «oh». 2019, en cambio, es «twenty nineteen».\"},{\"id\":\"enb1m4l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"Right, before you start on the returns — the local paper is delivered at about eight, and it goes on the rack by the window, not on the desk. The big table was booked yesterday by the reading group, so leave it laid out as it is. Oh, and the noticeboard hasn't been cleared since March, so if you've got ten minutes at the end, that would be brilliant.\",\"question\":\"¿Qué le piden a Valeria que haga si le sobra tiempo?\",\"options\":[\"Repartir el periódico\",\"Recoger la mesa grande\",\"Limpiar el tablón de anuncios\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"El periódico lo traen a las ocho: ella solo tiene que colocarlo, y eso no es lo del final.\",\"La mesa está reservada: le dicen justamente que la deje como está.\",null],\"itemIds\":[\"enb1m4isdelivered\",\"enb1m4localpaper\"],\"tip\":\"Tres pasivas en un audio de veinte segundos: «is delivered», «was booked», «hasn't been cleared». En el Listening no hay que producirlas — hay que no perderse cuando aparecen.\"}]}],\"resources\":[{\"label\":\"BBC News — sección London\",\"url\":\"https://www.bbc.co.uk/news/england/london\",\"note\":\"Diez minutos: no leas los artículos, lee solo los TITULARES y cuenta cuántos llevan participio sin auxiliar («Man charged», «Road closed»). Ese conteo es la lección de hoy.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:
