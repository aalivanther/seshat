"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tdb6,"])</script><script>self.__next_f.push([1,"This briefing is not a defence of the council. It is a description of what happens when a resident over seventy tries to complete a complaint about [[care for the elderly|el cuidado de mayores]], a missed [[carer|cuidador]] visit, or a direct debit they did not set up, and finds that every door now has a website in front of it.\u003cbr/\u003e\u003cbr/\u003eThe first number is the one the team hears every Monday. Of the complaints logged last year about home care in this borough, forty-one per cent began as a telephone call that was never completed. The resident, or the daughter calling from another city, was placed on hold, asked for a reference number they did not yet have, and invited to «complete the form online». A [[helpline|línea de ayuda]] that ends in a form is not a helpline. It is a redirect. The briefing records this without a recommendation, on purpose.\u003cbr/\u003e\u003cbr/\u003e[[IT in the community|La informática en el barrio]] was sold as inclusion. In practice it has moved the queue from a corridor in the town hall to a password the resident cannot reset. Older people in this borough are not, on the whole, unwilling. They are locked out. A 2025 internal survey of residents receiving home care found that one in three had no email address they could open without a relative in the room, and that one in five had been asked to photograph a document and upload it through a portal that timed out. The [[emergency services|servicios de emergencia]] still answer a voice. Adult social care, and most [[financial services|servicios financieros]], increasingly do not.\u003cbr/\u003e\u003cbr/\u003eWhat the procedure actually requires is smaller and less digital than the portal suggests. A complaint about a missed carer visit must include a date, a time window, and a name if the resident has one. A complaint about an unauthorised charge must include the amount, the date, and — if the bank has given one — a reference number. Ten working days is the published deadline for a first written reply. The briefing notes that the clock starts when the form is logged, not when the resident first rang, and that this difference is the source of most of the anger the team then has to absorb.\u003cbr/\u003e\u003cbr/\u003eCarers themselves are not the villains of this document. Turnover is high, the workload is heavier in December, and a missed slot is more often a rota than a refusal. The briefing is careful to separate the missed visit from the missed reply. One is a failure of care. The other is a failure of the complaint procedure, and it is the second that this paper is able to count.\u003cbr/\u003e\u003cbr/\u003eA last practical point, because the team is asked for one in every public meeting. The residents who get a reply inside ten days are almost never the ones who only rang. They are the ones who also wrote, with the three facts in the first paragraph, and who copied the reference number into the subject line. That is not a moral ranking of daughters. It is a map of a system that still reads.\u003cbr/\u003e\u003cbr/\u003eThe team is also asked, every month, why a missed carer visit and a missed bank debit are in the same paper. Because the resident experiences them as the same afternoon: a person who did not arrive, a charge that should not have left the account, and a telephone that played music. Care for the elderly, financial services and IT in the community are not three topics. They are one queue. The policy argument — whether a borough should keep a walk-in desk for people who cannot complete a form — belongs somewhere else. The briefing ends there."])</script><script>self.__next_f.push([1,"18:Td60,"])</script><script>self.__next_f.push([1,"I do not believe that «please hold the line» is a courtesy. I believe it is a filter. The people who can wait forty minutes, remember a reference number they have not been given, and then complete a form that times out are not a random sample of the borough. They are the people with a spare afternoon, a relative in the room, and a password that still works. Everyone else hangs up. The complaint dies, and the dashboard looks clean.\u003cbr/\u003e\u003cbr/\u003eThe charities will tell you this is a problem of [[IT in the community|informática del barrio]]: teach older people to upload a photo and the queue will shrink. I have sat with my neighbour while she tried. She is not unwilling. She is seventy-eight, she has a missed [[carer|cuidador]] slot on her fridge calendar, and the portal asked her for an email she has not opened since her son set it up in 2019. Calling that a skills gap is a way of not saying the system has moved the desk into a place she cannot enter.\u003cbr/\u003e\u003cbr/\u003eI take the briefing's point about the three facts. A date, an amount, a name. Write them down. Copy the reference into the subject line. I have told her that. It is good advice, and it is also a confession: the borough still reads, and it reads letters. It does not, with the same appetite, answer the phone. A [[helpline|línea de ayuda]] that is staffed to redirect is not underfunded by accident. It is designed to produce the statistic the briefing then reports — forty-one per cent of calls never completed — as if that figure were weather.\u003cbr/\u003e\u003cbr/\u003eCare for the elderly is not a website. Neither is a complaint about an unauthorised charge. [[Financial services|Los servicios financieros]] have learned the same trick: a call centre that thanks you for holding, a case number that exists only after you have already given up, a letter that invites you to escalate into another form. The [[emergency services|servicios de emergencia]] still pick up because a fire will not complete a portal. A missed wash, a missed meal, a debit of forty-seven pounds fifty — those can be made to wait. That is the policy. The hold music is how it sounds.\u003cbr/\u003e\u003cbr/\u003eThe practical proposal is not nostalgia for a corridor. Keep the form. Keep the ten working days. And keep a person, in a room, one morning a week, who can log the complaint from a voice. Not a chatbot. Not a daughter on a train. A person. Until that exists, I am far from satisfied with every sentence that begins «please complete the form online». It may be efficient. It is not care.\u003cbr/\u003e\u003cbr/\u003eI know the counter-argument. Walk-in desks are expensive. Staff turnover is high. Digital is the future. Granted. Nevertheless, a future that a quarter of the people on the home-care list cannot enter is not a future. It is a locked door with a helpful recorded message.\u003cbr/\u003e\u003cbr/\u003eI have no brief against a well-written form. I have a brief against a borough that counts an abandoned call as a success because it did not become a logged complaint. Forty-one per cent is not weather. It is a design. Until a person in a room can take Nora's three facts from her voice, I will keep calling the hold music what it is. Care for the elderly is a human job, and a complaint about it cannot be a test of who still owns a working password. A missed wash can wait on a dashboard. A person cannot. If that sounds harsh, it is because the hold music is still playing, and my neighbour is still on the line."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m3l6\",\"phaseId\":\"enb2m3\",\"title\":\"Hold the line\",\"subtitle\":\"Dos lecturas: un informe sobre trámites y mayores, y una columna que acusa al hold music\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Servicios, mayores, la línea\",\"itemIds\":[\"enb2m3carefortheelderly\",\"enb2m3emergencyservices\",\"enb2m3financialservices\",\"enb2m3itinthecommunity\",\"enb2m3carer\",\"enb2m3helpline\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El mismo trámite, dos intenciones\",\"body\":\"Dos textos sobre \u003cb\u003ecómo se queja uno en este país\u003c/b\u003e cuando el trámite es un laberinto: [[care for the elderly|cuidado de mayores]], [[financial services|banca]], [[IT in the community|informática del barrio]]. El primero es un informe del ayuntamiento. El segundo es una columna que sostiene que el «please hold the line» no es un accidente: es una política. Los dos hablan de Nora, o de gente como Nora. Solo uno quiere que, el lunes, hagas algo distinto con el teléfono.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m3l6e1\",\"type\":\"read\",\"prompt\":\"Lee el informe. Toca las glosas si te bloquean.\",\"title\":\"Ten working days, if you can find the form\",\"source\":\"From a briefing by a London borough adult-social-care team (adapted)\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m3l6e1q1\",\"q\":\"What is the briefing mainly trying to do?\",\"options\":[\"Describe what happens when an older resident tries to complain, without defending the council or ranking families.\",\"Convince readers to stop using the telephone altogether.\",\"Prove that carers refuse visits on purpose.\"],\"answer\":0,\"inference\":true,\"why\":\"«This briefing is not a defence… The policy argument belongs somewhere else.» La C contradice «Carers themselves are not the villains».\"},{\"id\":\"enb2m3l6e1q2\",\"q\":\"Why does the briefing say a helpline that ends in a form is not a helpline?\",\"options\":[\"Because it is a redirect: the call is not completed, it is moved online.\",\"Because helplines are illegal in adult social care.\",\"Because forms are always faster than calls.\"],\"answer\":0,\"why\":\"«A helpline that ends in a form is not a helpline. It is a redirect.»\"},{\"id\":\"enb2m3l6e1q3\",\"q\":\"When does the ten-working-day clock start?\",\"options\":[\"When the form is logged, not when the resident first rang.\",\"When the carer misses the slot.\",\"When the emergency services arrive.\"],\"answer\":0,\"why\":\"«the clock starts when the form is logged, not when the resident first rang».\"},{\"id\":\"enb2m3l6e1q4\",\"q\":\"Who, according to the last practical point, gets a reply inside ten days?\",\"options\":[\"Almost never the people who only rang: the ones who also wrote, with three facts and a reference in the subject line.\",\"Only residents with a daughter in the same borough.\",\"Anyone who shouted at the operator.\"],\"answer\":0,\"why\":\"El último párrafo práctico es explícito. No es un ranking moral de hijas: es un mapa.\"},{\"id\":\"enb2m3l6e1q5\",\"q\":\"Why does the briefing separate a missed visit from a missed reply?\",\"options\":[\"Because one is a failure of care and the other is a failure of the complaint procedure, and only the second can be counted here.\",\"Because missed visits do not matter.\",\"Because replies are the carers' job, not the council's.\"],\"answer\":0,\"inference\":true,\"why\":\"«One is a failure of care. The other is a failure of the complaint procedure, and it is the second that this paper is able to count.» Hay que inferir por qué el informe se para en el segundo: es lo que su mandato le deja contar.\"}],\"itemIds\":[\"enb2m3carefortheelderly\",\"enb2m3helpline\",\"enb2m3carer\",\"enb2m3itinthecommunity\",\"enb2m3complaintprocedure\",\"enb2m3deadline\"]},{\"id\":\"enb2m3l6e2\",\"type\":\"read\",\"prompt\":\"Ahora la columna. Mismo trámite, otra intención.\",\"title\":\"The hold music is the policy\",\"source\":\"Opinion column in a London weekly (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m3l6e2q1\",\"q\":\"What does the writer believe «please hold the line» really is?\",\"options\":[\"A filter: people who cannot wait and complete a form hang up, and the dashboard looks clean.\",\"A courtesy that the borough should use more often.\",\"Proof that the emergency services have too many staff.\"],\"answer\":0,\"why\":\"El primer párrafo lo dice sin rodeos: «I believe it is a filter.»\"},{\"id\":\"enb2m3l6e2q2\",\"q\":\"How does the writer treat the briefing's advice about the three facts?\",\"options\":[\"Accepts it as good advice, then calls it a confession that the borough still reads letters rather than answering the phone.\",\"Denies that dates and amounts matter.\",\"Copies it as the whole solution.\"],\"answer\":0,\"inference\":true,\"why\":\"«I take the briefing's point… It is good advice, and it is also a confession.» Acepta el dato y le da la vuelta. Eso es stance.\"},{\"id\":\"enb2m3l6e2q3\",\"q\":\"Why, according to the writer, do the emergency services still pick up?\",\"options\":[\"Because a fire will not complete a portal; a missed wash can be made to wait.\",\"Because they have no websites.\",\"Because older people prefer fires to forms.\"],\"answer\":0,\"why\":\"«The emergency services still pick up because a fire will not complete a portal. A missed wash… those can be made to wait.»\"},{\"id\":\"enb2m3l6e2q4\",\"q\":\"What is the writer's practical proposal?\",\"options\":[\"Keep the form and the deadline, and also keep a person in a room one morning a week who can log a complaint from a voice.\",\"Close all websites and return to paper only.\",\"Replace carers with chatbots.\"],\"answer\":0,\"why\":\"El párrafo de la propuesta es explícito. No es nostalgia de un pasillo: es un hueco de voz, un día a la semana.\"},{\"id\":\"enb2m3l6e2q5\",\"q\":\"When the writer says «the hold music is the policy», what are they doing?\",\"options\":[\"Turning a courtesy phrase into an accusation: waiting is not an accident, it is how the system chooses who remains.\",\"Reviewing a playlist used by the council.\",\"Praising the borough for its efficiency.\"],\"answer\":0,\"inference\":true,\"why\":\"El título y el cierre no hablan de música. Hablan de un filtro. Hay que inferir la acusación contra la lectura literal.\"}],\"itemIds\":[\"enb2m3helpline\",\"enb2m3itinthecommunity\",\"enb2m3carefortheelderly\",\"enb2m3financialservices\",\"enb2m3emergencyservices\",\"enb2m3onhold\"]},{\"id\":\"enb2m3l6e3\",\"type\":\"mc\",\"prompt\":\"Las dos posturas\",\"question\":\"¿En qué se distinguen de verdad los dos textos?\",\"options\":[\"El informe describe el laberinto y se niega a pedir un mostrador; la columna acepta los tres datos y acusa al hold music de ser una política.\",\"El informe defiende a los cuidadores y la columna no ha visto una queja.\",\"El informe habla de Londres y la columna, de otra ciudad.\"],\"answer\":0,\"whyWrong\":[null,\"La columna HA visto una queja: la de la vecina. El informe no «defiende»: separa visita de respuesta.\",\"Los dos están en el mismo borough.\"],\"itemIds\":[\"enb2m3carefortheelderly\",\"enb2m3helpline\"]},{\"id\":\"enb2m3l6e4\",\"type\":\"cloze\",\"prompt\":\"La palabra del informe\",\"text\":\"A ___ that ends in a form is not a helpline. It is a redirect.\",\"answers\":[\"helpline\"],\"itemIds\":[\"enb2m3helpline\"]},{\"id\":\"enb2m3l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin «on hold» — preciso, no un rodeo\",\"source\":\"I was on hold for forty minutes.\",\"forbid\":[\"hold\"],\"answers\":[\"I waited forty minutes on the phone\",\"I waited forty minutes on the phone.\",\"They made me wait forty minutes before anyone spoke\",\"I spent forty minutes waiting for an operator\"],\"itemIds\":[\"enb2m3onhold\"]},{\"id\":\"enb2m3l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume los dos textos sin mezclarles la postura\",\"text\":\"The briefing describes ___ for the elderly and IT in the ___. It says a ___ that ends in a form is a redirect. The column takes the three facts. ___, it calls the hold music a policy.\",\"answers\":[\"care\",\"community\",\"helpline\",\"Nevertheless\"],\"bank\":[\"care\",\"community\",\"helpline\",\"Nevertheless\",\"career\",\"Moreover\",\"joke\"],\"itemIds\":[\"enb2m3carefortheelderly\",\"enb2m3itinthecommunity\",\"enb2m3helpline\",\"enb2m1nevertheless\"],\"tip\":\"«Career» está en el banco porque carer y career se mezclan. El hueco 1 es care, no career.\"},{\"id\":\"enb2m3l6e7\",\"type\":\"errorfix\",\"prompt\":\"Después de leer, un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Nora needs a career to come in the morning.\",\"answers\":[\"Nora needs a carer to come in the morning.\"],\"why\":\"Carer es el cuidador. Career es la carrera profesional. El falso amigo no es latino: es de oído, y en un texto de mayores se cobra caro.\",\"translation\":\"Nora necesita que venga un cuidador por la mañana.\",\"itemIds\":[\"enb2m3carer\"]},{\"id\":\"enb2m3l6e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"La frase de la columna\",\"source\":\"The hold music is the policy.\",\"answers\":[\"La música de espera es la política\",\"La música de espera es la política en sí\",\"La música de espera no es cortesía: es la política\"],\"itemIds\":[\"enb2m3onhold\",\"enb2m3helpline\"]},{\"id\":\"enb2m3l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Estuve en espera cuarenta minutos. Me fueron pasando de un departamento a otro.\",\"answers\":[\"I was on hold for forty minutes. They passed me from one department to another.\",\"I was on hold for forty minutes. They passed me from one department to another\"],\"itemIds\":[\"enb2m3onhold\",\"enb2m3passedaround\"]},{\"id\":\"enb2m3l6e10\",\"type\":\"audiomc\",\"prompt\":\"Listening: Nora, después de las dos lecturas. Pregunta antes del play. Una sola escucha.\",\"audio\":\"The first one tells me to write the three facts. The second one says the music is the policy. I can do the three facts, Valeria. I cannot do forty minutes. Amy said she'd sit with me on Thursday and we'd write. That's the person in the room. That's what the column wants. I'm not shouting at anyone.\",\"question\":\"¿Qué va a hacer Nora el jueves?\",\"options\":[\"Escribir la queja con Amy al lado, que es «la persona en la habitación»\",\"Llamar otra vez y aguantar los cuarenta minutos\",\"Dejarlo, porque el informe no defiende al ayuntamiento\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice que no puede hacer cuarenta minutos.\",\"No lo deja: toma el consejo del informe (escribir) y la petición de la columna (una persona).\"],\"itemIds\":[\"enb2m3norashelpline\",\"enb2m3amythenurse\",\"enb2m3onhold\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
