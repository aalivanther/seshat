t/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T808,"])</script><script>self.__next_f.push([1,"En español un consejo se da en imperativo sin que nadie se ofenda: «vete al médico». En inglés eso mismo —\u003ci\u003eGo to the doctor\u003c/i\u003e— suena a orden de un superior. El B1 pide \u003cb\u003eenvolverlo\u003c/b\u003e, y hay una escalera clara:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eYou should see a doctor.\u003c/b\u003e — el consejo normal, el que sirve para el 90 % de las veces.\u003cbr/\u003e· \u003cb\u003eYou ought to rest.\u003c/b\u003e — igual de fuerte, un pelín más formal y más escrito.\u003cbr/\u003e· \u003cb\u003eHave you tried drinking more water?\u003c/b\u003e — el más suave de todos: finge que es una pregunta.\u003cbr/\u003e· \u003cb\u003eWhy don't you ring the surgery?\u003c/b\u003e — una sugerencia entre iguales.\u003cbr/\u003e\u003cbr/\u003eDos trampas gramaticales, las dos del mismo tipo:\u003cbr/\u003e1. \u003cb\u003e«should» va sin «to»\u003c/b\u003e: \u003ci\u003eYou should see\u003c/i\u003e, nunca «you should to see».\u003cbr/\u003e2. \u003cb\u003e«ought» va CON «to»\u003c/b\u003e: \u003ci\u003eYou ought to rest\u003c/i\u003e, nunca «you ought rest». Es el único de la familia que lo lleva, y hay que aprendérselo así.\u003cbr/\u003e3. Y una tercera de vocabulario: \u003cb\u003e\u003ci\u003etry + -ing\u003c/i\u003e es «probar A hacer algo»\u003c/b\u003e (a ver si funciona); \u003ci\u003etry to\u003c/i\u003e es «intentar» (esforzarse). \u003ci\u003eHave you tried drinking more water?\u003c/i\u003e = ¿has probado a beber más agua? \u003ci\u003eI tried to drink more water\u003c/i\u003e = lo intenté (y no lo conseguí).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la otra mitad de la lección, que casi nadie enseña: rechazar un consejo.\u003c/b\u003e El examen lo pide en el Speaking («aconsejar y rechazar consejo con razones») y la fórmula es siempre la misma: \u003cb\u003ereconoces + peros + motivo\u003c/b\u003e. \u003ci\u003eI know, but I can't stop working right now.\u003c/i\u003e · \u003ci\u003eThat's easier said than done.\u003c/i\u003e Decir «no» a secas no es que sea maleducado: es que no cumple la tarea.\u003cbr/\u003e\u003cbr/\u003eUn aviso de vocabulario, y es de los que rompen conversaciones: \u003cb\u003e\u003ci\u003eadvise\u003c/i\u003e pide «to» + infinitivo\u003c/b\u003e — \u003ci\u003eThe nurse advised me to rest\u003c/i\u003e. Nada de «advised me that I rest», que es el calco del subjuntivo español («me aconsejó que descansara»). Y ojo con el sustantivo: \u003cb\u003e\u003ci\u003eadvice\u003c/i\u003e es incontable\u003c/b\u003e, como \u003ci\u003einformation\u003c/i\u003e. Un consejo es \u003ci\u003ea piece of advice\u003c/i\u003e; «two advices» no existe."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l3\",\"phaseId\":\"enb1m6\",\"title\":\"You should get that looked at\",\"subtitle\":\"Dar un consejo que no ofenda — y rechazar uno con motivos\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las siete frases del consejo\",\"itemIds\":[\"enb1m6youshouldsee\",\"enb1m6oughtto\",\"enb1m6haveyoutried\",\"enb1m6advisedmeto\",\"enb1m6iknowbut\",\"enb1m6easiersaid\",\"enb1m6takeiteasy\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: en inglés el consejo se envuelve\",\"body\":\"$17\",\"table\":[[\"Fuerza\",\"Fórmula\",\"Ejemplo\"],[\"Suave\",\"Have you tried…?\",\"Have you tried drinking more water?\"],[\"Normal\",\"You should…\",\"You should see a doctor.\"],[\"Formal\",\"You ought to…\",\"You ought to rest.\"],[\"Rechazo\",\"I know, but…\",\"I know, but I can't stop working right now.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro fórmulas\",\"pairs\":[{\"target\":\"You should see a doctor.\",\"source\":\"Deberías ir al médico.\"},{\"target\":\"You ought to rest.\",\"source\":\"Deberías descansar.\"},{\"target\":\"Have you tried drinking more water?\",\"source\":\"¿Has probado a beber más agua?\"},{\"target\":\"That's easier said than done.\",\"source\":\"Del dicho al hecho hay mucho trecho.\"}],\"itemIds\":[\"enb1m6youshouldsee\",\"enb1m6oughtto\",\"enb1m6haveyoutried\",\"enb1m6easiersaid\"],\"tip\":\"Las tres primeras aconsejan y la cuarta frena el consejo. Con esas cuatro tienes montada media conversación del Speaking Part 3.\"},{\"id\":\"enb1m6l3e2\",\"type\":\"mc\",\"prompt\":\"«Probar a» o «intentar»\",\"question\":\"Quieres decir: «¿Has probado a tomarte un analgésico?» →\",\"options\":[\"Have you tried taking a painkiller?\",\"Have you tried to take a painkiller?\",\"Have you proved to take a painkiller?\"],\"answer\":0,\"whyWrong\":[null,\"«tried to take» es «intentaste tomártelo» — como si te costara trabajo tragarlo. No es lo que quieres decir.\",\"«prove» es demostrar algo, nunca probar a hacer algo. Falso amigo de manual.\"],\"itemIds\":[\"enb1m6haveyoutried\",\"ena2m8somepainkillers\"],\"tip\":\"Regla de bolsillo: «try + -ing» = a ver qué pasa. «try to» = me cuesta y lo intento. «I tried to open the window» (estaba atascada) frente a «I tried opening the window» (a ver si así se iba el olor).\"},{\"id\":\"enb1m6l3e3\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra\",\"wrong\":\"You should to see a doctor.\",\"answers\":[\"You should see a doctor.\"],\"why\":\"«should» es modal y va con infinitivo sin «to». El «to» se cuela porque en español decimos «deberías IR», con el infinitivo pelado, y al traducir se le pone la marca de infinitivo inglesa por si acaso.\",\"translation\":\"Deberías ir al médico.\",\"itemIds\":[\"enb1m6youshouldsee\"]},{\"id\":\"enb1m6l3e4\",\"type\":\"errorfix\",\"prompt\":\"Y ahora al revés: aquí FALTA una palabra\",\"wrong\":\"You ought rest for a few days.\",\"answers\":[\"You ought to rest for a few days.\"],\"why\":\"«ought» es la excepción de la familia: es el único modal que exige «to» detrás. Se aprende en bloque, «ought to», como si fuera una sola palabra.\",\"translation\":\"Deberías descansar unos días.\",\"itemIds\":[\"enb1m6oughtto\"]},{\"id\":\"enb1m6l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de aconsejar\",\"text\":\"The nurse ___ me to rest for a week.\",\"answers\":[\"advised\"],\"translation\":\"La enfermera me aconsejó descansar una semana.\",\"hints\":[\"Es el verbo de «aconsejar», en pasado\",\"Empieza por «ad…» y lleva -ed\"],\"itemIds\":[\"enb1m6advisedmeto\"],\"tip\":\"Con «s» es el verbo (advise, se pronuncia con s̬ al final) y con «c» es el sustantivo (advice, con «s» seca). Es el mismo par que «practise / practice».\"},{\"id\":\"enb1m6l3e6\",\"type\":\"build\",\"prompt\":\"Construye el consejo suave\",\"target\":\"Have you tried taking a painkiller\",\"translation\":\"¿Has probado a tomarte un analgésico?\",\"distractors\":[\"to\",\"did\"],\"itemIds\":[\"enb1m6haveyoutried\",\"ena2m8somepainkillers\"],\"tip\":\"Sobran las dos fichas del calco: el «to» del infinitivo español y el «did» de quien traduce «¿probaste?» en pasado simple.\"},{\"id\":\"enb1m6l3e7\",\"type\":\"transform\",\"prompt\":\"Baja el tono del consejo\",\"source\":\"Go to the surgery tomorrow.\",\"instruction\":\"Dilo con «should», que no suena a orden\",\"answers\":[\"You should go to the surgery tomorrow\",\"You should go to the surgery tomorrow.\"],\"translation\":\"Deberías ir al centro de salud mañana.\",\"hints\":[\"Empieza por «You should…»\",\"You should ... to the surgery tomorrow\"],\"itemIds\":[\"enb1m6youshouldsee\",\"ena2m8thesurgery\"],\"tip\":\"El imperativo pelado en inglés no es de mala educación solo con desconocidos: entre amigos también suena a que mandas. Un «should» delante lo arregla entero, y cuesta una palabra.\"},{\"id\":\"enb1m6l3e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «should» y sin «doctor»\",\"source\":\"You should see a doctor.\",\"forbid\":[\"should\",\"doctor\"],\"answers\":[\"You ought to see a GP\",\"Why don't you see a GP?\",\"Have you thought about seeing a GP?\",\"I think you need to see a GP\"],\"translation\":\"Deberías ir al médico.\",\"hints\":[\"Hay un modal que hace lo mismo y lleva «to» detrás\",\"You ought ...\"],\"itemIds\":[\"enb1m6oughtto\",\"enb1m6gp\"],\"tip\":\"Tener tres maneras de decir lo mismo es literalmente el criterio de rango del examen. Y en el Speaking te salva: si se te atasca una, sale la otra sin que se note el hueco.\"},{\"id\":\"enb1m6l3e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Rechaza el consejo con un motivo\",\"source\":\"Ya, pero ahora mismo no puedo dejar de trabajar.\",\"answers\":[\"I know, but I can't stop working right now\",\"I know, but I can't stop working at the moment\",\"I know, but I can't afford to stop working right now\"],\"hint\":\"Empieza reconociendo lo que te han dicho, en dos palabras\",\"itemIds\":[\"enb1m6iknowbut\",\"enb1m1afford\"],\"tip\":\"Ese «I know» de entrada no es relleno: es lo que evita que el otro repita el consejo. Reconoce, frena y da el motivo — en ese orden, siempre.\"},{\"id\":\"enb1m6l3e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué te está diciendo?\",\"source\":\"Take it easy for a few days.\",\"answers\":[\"Tómatelo con calma unos días\",\"Tómalo con calma unos días\",\"Ve con calma unos días\"],\"itemIds\":[\"enb1m6takeiteasy\"],\"tip\":\"«Take it easy» también sirve de despedida entre amigos, con el sentido de «cuídate». En una consulta significa literalmente «no te fuerces».\"},{\"id\":\"enb1m6l3e11\",\"type\":\"shadow\",\"prompt\":\"Sombrea la escalera del consejo — dos pasadas\",\"text\":\"You should see a doctor. Well, you ought to at least ring them.\",\"phonetic\":\"yu shud síi a DOK-ta · uel, yu óot tu at liist ring dem\",\"translation\":\"Deberías ir al médico. Bueno, deberías por lo menos llamarles.\",\"reps\":2,\"itemIds\":[\"enb1m6youshouldsee\",\"enb1m6oughtto\",\"enb1m2atleast\"],\"tip\":\"Fíjate en que «ought to» se funde en «óo-tu», una sola pieza, y que «should» pierde la «l» del todo. Si los dices separando sílabas, suenan a lectura y no a consejo.\"},{\"id\":\"enb1m6l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La enfermera me aconsejó descansar, pero del dicho al hecho hay mucho trecho.\",\"answers\":[\"The nurse advised me to rest, but that's easier said than done\",\"The nurse advised me to rest, but it's easier said than done\",\"The nurse advised me to rest, but that is easier said than done\"],\"hints\":[\"«advise» pide «to» + infinitivo\",\"The nurse advised me to rest, but ...\"],\"itemIds\":[\"enb1m6advisedmeto\",\"enb1m6easiersaid\"],\"tip\":\"Una frase entera con consejo recibido y consejo rechazado. Guárdatela: en el Speaking Part 3 la vas a usar tal cual.\"},{\"id\":\"enb1m6l3e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Ben y Valeria en la parada. Dos escuchas.\",\"audio\":\"You're limping.|It's my back. It's been like this since Tuesday.|Ben, you should get that looked at. Have you tried ringing the surgery?|I know, but I can't take a day off this week — we're two drivers down as it is.|That's easier said than done, then. Look, they do phone appointments now. You needn't even go in.|Do they? Right. Maybe tomorrow, then.\",\"question\":\"¿Por qué no ha ido Ben al médico?\",\"options\":[\"Porque esta semana no puede faltar al trabajo\",\"Porque cree que no es nada\",\"Porque no está dado de alta con ningún GP\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No dice eso en ningún momento: dice que lleva así desde el martes, sin quitarle importancia.\",\"Del alta no se habla; de hecho Valeria da por sentado que puede llamar al centro.\"],\"itemIds\":[\"enb1m6iknowbut\",\"enb1m6haveyoutried\",\"enb1m6neednt\"],\"tip\":\"Escucha el orden de Valeria: consejo suave («Have you tried…?»), Ben lo rechaza con motivo («I know, but…»), y ella no insiste: cambia el consejo por uno que sí encaja con el motivo. Eso es negociar, y es Speaking Part 3 puro.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m6-2\",\"book\":\"I have a cold.\",\"real\":\"I've come down with something.\",\"meaning\":\"Me está entrando algo\",\"when\":\"Hablando, y sobre todo al principio: cuando aún no sabes qué es. Sirve para avisar en el trabajo sin dar un parte médico. En cuanto ya sabes lo que tienes, se vuelve a «I've got a cold» — y en el examen, la versión completa.\",\"register\":\"neutral\",\"exam\":\"I think I'm coming down with a cold.\",\"note\":\"«something» hace todo el trabajo: dice que hay síntomas y que aún no hay diagnóstico. Es la deducción de la lección 1 metida en una sola palabra.\",\"sound\":\"aiv kam daun uid SÁM-zing\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m6natcomedownwith\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes
