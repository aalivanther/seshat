",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T51f,El módulo pasado te dejó montada la máquina: para negar en pasado aparece \u003cb\u003edidn't\u003c/b\u003e y \u003cb\u003eel verbo vuelve a su forma de diccionario\u003c/b\u003e. \u003ci\u003eI worked\u003c/i\u003e → \u003ci\u003eI didn't work\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eAhora viene el regalo: \u003cb\u003eeso vale igual para los cincuenta verbos rebeldes de este módulo\u003c/b\u003e. Como el pasado lo lleva el auxiliar, el verbo se queda desnudo — y desnudo significa \u003cb\u003ela forma normal, no la rara\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e· I went out → I \u003cb\u003edidn't go\u003c/b\u003e out.\u003cbr/\u003e· We had time → We \u003cb\u003edidn't have\u003c/b\u003e time.\u003cbr/\u003e· I saw Amy → I \u003cb\u003edidn't see\u003c/b\u003e Amy.\u003cbr/\u003e\u003cbr/\u003eO sea: en negativa \u003cb\u003eno necesitas saberte went, had ni saw\u003c/b\u003e. Solo go, have, see, que ya los sabías del A1. La mitad del trabajo de esta semana desaparece en cuanto pones un didn't delante.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY de ahí sale el error nº 1 del A2 español:\u003c/b\u003e \u003ci\u003eI didn't went out\u003c/i\u003e. Es el pasado marcado dos veces, exactamente el mismo fallo que decir \u003ci\u003eShe doesn't works\u003c/i\u003e en presente. Una marca por frase, y la lleva el auxiliar. Si ves \u003cb\u003edidn't\u003c/b\u003e y a la vez una forma de pasado, sobra una de las dos.\u003cbr/\u003e\u003cbr/\u003eEl otro calco, más de habla rápida que de escritura: \u003ci\u003e[[I no went|❌]]\u003c/i\u003e. En español se niega con una sola palabra delante («no salí»); en inglés hace falta el auxiliar completo, \u003cb\u003edidn't\u003c/b\u003e, y no hay atajo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l3\",\"phaseId\":\"ena2m2\",\"title\":\"I didn't go out\",\"subtitle\":\"Negar en pasado: el auxiliar se lleva la marca y el verbo se queda desnudo\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que NO pasó\",\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2wedidnthavetime\",\"ena2m2ididntsleep\",\"ena2m2ilostmyphone\",\"ena2m2ifounditinmybag\",\"ena2m2ididntdoanything\",\"ena2m1ididntwork\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Buenas noticias: los irregulares desaparecen en la negativa\",\"body\":\"$17\",\"table\":[[\"afirmativa\",\"negativa\",\"qué pasa\"],[\"I went out.\",\"I didn't go out.\",\"went → go\"],[\"We had time.\",\"We didn't have time.\",\"had → have\"],[\"I saw Amy.\",\"I didn't see Amy.\",\"saw → see\"],[\"She got the message.\",\"She didn't get the message.\",\"got → get\"],[\"They came home.\",\"They didn't come home.\",\"came → come\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«No hice nada»: la doble negación que el inglés no aguanta\",\"body\":\"En español se niega dos veces y suena perfecto: «\u003cb\u003eno\u003c/b\u003e hice \u003cb\u003enada\u003c/b\u003e», «\u003cb\u003eno\u003c/b\u003e vi a \u003cb\u003enadie\u003c/b\u003e». Son dos negaciones en la misma frase y nadie se escandaliza.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn inglés solo cabe una.\u003c/b\u003e Si ya has puesto \u003ci\u003edidn't\u003c/i\u003e, lo que viene detrás va en positivo: \u003cb\u003eanything\u003c/b\u003e, \u003cb\u003eanybody\u003c/b\u003e, \u003cb\u003eanywhere\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[I didn't do anything.|No hice nada.]]\u003c/b\u003e ✔ · \u003ci\u003eI didn't do nothing\u003c/i\u003e ❌\u003cbr/\u003e· \u003cb\u003eI didn't see anybody.\u003c/b\u003e ✔ · \u003ci\u003eI didn't see nobody\u003c/i\u003e ❌\u003cbr/\u003e\u003cbr/\u003eLa otra forma de decirlo es cargar la negación en la palabra y dejar el verbo en positivo: \u003cb\u003eI did nothing\u003c/b\u003e, \u003cb\u003eI saw nobody\u003c/b\u003e. Es correcta y suena más formal, pero \u003cb\u003esolo una de las dos mitades puede ser negativa\u003c/b\u003e. Elige una.\u003cbr/\u003e\u003cbr/\u003e(Sí: en canciones y en habla muy coloquial se oye \u003ci\u003eI didn't do nothing\u003c/i\u003e. Es un dialecto reconocible, no un descuido — pero en el examen es un error, y punto.)\",\"table\":[[\"español\",\"inglés ✔\",\"calco ❌\"],[\"No hice nada.\",\"I didn't do anything. / I did nothing.\",\"I didn't do nothing.\"],[\"No vi a nadie.\",\"I didn't see anybody.\",\"I didn't see nobody.\"],[\"No fui a ningún sitio.\",\"I didn't go anywhere.\",\"I didn't go nowhere.\"],[\"No salí.\",\"I didn't go out.\",\"I no went out.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l3e1\",\"type\":\"mc\",\"prompt\":\"«No salí»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"I didn't go out.\",\"I didn't went out.\",\"I no went out.\"],\"answer\":0,\"whyWrong\":[null,\"Pasado marcado dos veces: didn't ya lo dice, así que go va desnudo\",\"El español niega con una palabra delante; el inglés necesita el auxiliar entero\"],\"itemIds\":[\"ena2m2ididntgoout\"],\"tip\":\"Es el error nº 1 del nivel y el que más veces se corrige en un examen. Merece la pena reconocerlo de un vistazo.\"},{\"id\":\"ena2m2l3e2\",\"type\":\"bucket\",\"prompt\":\"¿Quién lleva la marca de pasado en esta frase?\",\"categories\":[\"la lleva el verbo\",\"la lleva el auxiliar (verbo desnudo)\"],\"items\":[{\"text\":\"I went out\",\"bucket\":0},{\"text\":\"I didn't go out\",\"bucket\":1},{\"text\":\"She had time\",\"bucket\":0},{\"text\":\"She didn't have time\",\"bucket\":1},{\"text\":\"We saw it\",\"bucket\":0},{\"text\":\"They didn't see it\",\"bucket\":1}],\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2wedidnthavetime\",\"ena2m2didyouseeit\"],\"tip\":\"Una marca por frase. Si está en didn't, el verbo no la repite — igual que en presente la -s está en does y no en el verbo.\"},{\"id\":\"ena2m2l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa la negativa\",\"text\":\"I ___ go out last night.\",\"answers\":[\"didn't\",\"did not\"],\"translation\":\"Anoche no salí.\",\"hints\":[\"did + not, contraído\",\"d…'t\"],\"itemIds\":[\"ena2m2ididntgoout\",\"enlastnight\"]},{\"id\":\"ena2m2l3e4\",\"type\":\"cloze\",\"prompt\":\"Y ahora el verbo — cuidado\",\"text\":\"We didn't ___ time for breakfast.\",\"answers\":[\"have\"],\"translation\":\"No nos dio tiempo de desayunar.\",\"hints\":[\"Detrás de didn't, forma de diccionario\",\"No es «had»…\"],\"itemIds\":[\"ena2m2wedidnthavetime\"],\"tip\":\"Aquí es donde casi todo el mundo escribe «had». Detrás de didn't, la forma rara del verbo NO aparece nunca.\"},{\"id\":\"ena2m2l3e5\",\"type\":\"transform\",\"prompt\":\"Pásala a negativa\",\"source\":\"I went out on Saturday.\",\"instruction\":\"Ponla en negativa\",\"answers\":[\"I didn't go out on Saturday.\",\"I did not go out on Saturday.\"],\"translation\":\"No salí el sábado.\",\"hints\":[\"El pasado se muda al auxiliar y went vuelve a go\",\"I d…'t go out on Saturday.\"],\"itemIds\":[\"ena2m2ididntgoout\"]},{\"id\":\"ena2m2l3e6\",\"type\":\"transform\",\"prompt\":\"Otra, con un rebelde de los gordos\",\"source\":\"She had a good time.\",\"instruction\":\"Ponla en negativa\",\"answers\":[\"She didn't have a good time.\",\"She did not have a good time.\"],\"translation\":\"No se lo pasó bien.\",\"hints\":[\"had → have\",\"She d…'t h… a good time.\"],\"itemIds\":[\"ena2m2wehadagoodtime\",\"ena2m2wedidnthavetime\"]},{\"id\":\"ena2m2l3e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el doble pasado — el error nº 1 del A2\",\"wrong\":\"I didn't went out.\",\"answers\":[\"I didn't go out.\"],\"why\":\"El pasado se marca UNA vez por frase y lo lleva el auxiliar. Con didn't delante, el verbo vuelve a su forma de diccionario: go, have, see, take. Es el mismo fallo que «Does she works?», solo que un tiempo más allá.\",\"translation\":\"No salí.\",\"itemIds\":[\"ena2m2ididntgoout\"]},{\"id\":\"ena2m2l3e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la doble negación\",\"wrong\":\"I didn't do nothing on Sunday.\",\"answers\":[\"I didn't do anything on Sunday.\"],\"why\":\"En español «no hice nada» lleva dos negaciones y está bien. En inglés solo cabe una: si ya has puesto didn't, lo de detrás va en positivo (anything). La alternativa es «I did nothing», con la negación en la palabra y el verbo limpio.\",\"translation\":\"No hice nada el domingo.\",\"itemIds\":[\"ena2m2ididntdoanything\"]},{\"id\":\"ena2m2l3e9\",\"type\":\"mc\",\"prompt\":\"El verbo que en español es uno y en inglés son dos\",\"question\":\"«Perdí el móvil»\",\"options\":[\"I lost my phone.\",\"I missed my phone.\",\"I losed my phone.\"],\"answer\":0,\"whyWrong\":[null,\"miss es «perder» un tren, un autobús o una cita — algo que sale sin ti. Un objeto se pierde con lose\",\"lose es irregular: lost\"],\"itemIds\":[\"ena2m2ilostmyphone\",\"ena2m1missedthebus\",\"enphonenumber\"],\"tip\":\"El español usa «perder» para las dos cosas y el inglés reparte: lose un objeto, miss un transporte o una cita. I lost my keys / I missed the bus.\"},{\"id\":\"ena2m2l3e10\",\"type\":\"build\",\"prompt\":\"Construye la negativa\",\"target\":\"We didn't have time for breakfast\",\"translation\":\"No nos dio tiempo de desayunar\",\"distractors\":[\"had\",\"hadn't\"],\"itemIds\":[\"ena2m2wedidnthavetime\"],\"tip\":\"Las dos fichas sobrantes son exactamente lo que tu cabeza va a querer poner. Que sobren es el ejercicio.\"},{\"id\":\"ena2m2l3e11\",\"type\":\"audiomc\",\"prompt\":\"Escucha dos veces, como en el examen\",\"audio\":\"Did you go out on Saturday? — No, I didn't. I didn't sleep very well on Friday and I stayed at home all weekend.\",\"question\":\"¿Qué hizo el sábado?\",\"options\":[\"Se quedó en casa\",\"Salió con amigos\",\"Trabajó\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La respuesta corta es «No, I didn't»: no salió\",\"El trabajo no se menciona en ningún momento\"],\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2ididntsleep\",\"ena2m1istayedathome\"],\"tip\":\"Cuando oigas «No, I didn't», el dato ya está: lo que viene detrás es el motivo. En el examen, la respuesta corta te da la mitad de la pregunta.\"},{\"id\":\"ena2m2l3e12\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"No dormí muy bien y el domingo no hice nada.\",\"answers\":[\"I didn't sleep very well and I didn't do anything on Sunday.\",\"I didn't sleep very well and on Sunday I didn't do anything.\",\"I didn't sleep very well and I did nothing on Sunday.\"],\"hint\":\"dos negativas seguidas, y ninguna de las dos lleva forma de pasado en el verbo\",\"itemIds\":[\"ena2m2ididntsleep\",\"ena2m2ididntdoanything\"]},{\"id\":\"ena2m2l3e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — dos didn't seguidos\",\"text\":\"I didn't go out and I didn't do anything.\",\"phonetic\":\"ái DÍ-dent góu áut and ái DÍ-dent du É-ni-zing\",\"translation\":\"Ni salí ni hice nada.\",\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2ididntdoanything\"],\"tip\":\"didn't es «DÍ-dent», dos golpes. Al hablar rápido casi se come la t final: «DÍ-den góu». Escríbela siempre, dila corta.\"},{\"id\":\"ena2m2l3e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No salí el sábado. Perdí el móvil y lo encontré en el bolso el domingo.\",\"answers\":[\"I didn't go out on Saturday. I lost my phone and I found it in my bag on Sunday.\",\"I didn't go out on Saturday. I lost my phone and found it in my bag on Sunday.\"],\"hints\":[\"Negativa con verbo desnudo + dos irregulares en afirmativa\",\"I d…'t go out on Saturday. I l… my phone and I f… it in my bag on Sunday.\"],\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2ilostmyphone\",\"ena2m2ifounditinmybag\"],\"tip\":\"Mira la diferencia dentro de tu propia frase: go desnudo detrás de didn't, y lost y found con su forma rara en afirmativa. Ese contraste es la lección entera.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m2-2\",\"book\":\"I didn't sleep very well.\",\"real\":\"I didn't sleep a wink.\",\"meaning\":\"No pegué ojo\",\"when\":\"Con amigos y en el trabajo, quejándote de la noche. Es una exageración amable, igual que «no pegué ojo» en español: nadie se la toma al pie de la letra. En el Writing del examen, la del libro.\",\"register\":\"amigos\",\"note\":\"a wink es «un parpadeo». La expresión solo existe en negativo: nadie dice «I slept a wink».\",\"sound\":\"ái DÍ-dent sliip a UÍNK\",\"level\":\"a2\",\"itemId\":\"ena2m2ididntsleep\"}}],\"resources\":[{\"label\":\"British Council — Past simple\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/past-simple\",\"note\":\"Vuelve a los ejercicios de negativa y comprueba en cada frase que detrás de didn't NO hay ninguna forma de pasado. Diez minutos y la trampa deja de tenerte.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\"
