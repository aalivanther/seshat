alla, si nombra the rise in o dice prices went up.\u003cbr/\u003e\u003cbr/\u003eEl monólogo del Part 4 no es esa conversación. Es \u003cb\u003econtar la decisión\u003c/b\u003e, dos minutos, treinta segundos de notas. Punto primero: qué cifra no era la que pensaba. Detalle: NI, no un retraso. Concesión: Ben cobra más con las extra, y no es una ranking moral. Cierre: una regla que te quedas — leer la línea de abajo, escribir a Nadia, no convertir el autobús en un mercado.\u003cbr/\u003e\u003cbr/\u003eSi el punto va en la tercera línea, Amy ya te dijo lo que pasa.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l9e1\",\"type\":\"order\",\"prompt\":\"Ordena la tarde de la primera nómina\",\"sentences\":[\"Valeria opened her first payslip on the 55, on the way to the advice desk.\",\"She compared the top line with the money in the bank and thought there had been a delay.\",\"Ben asked, without malice, whether it was enough to live on.\",\"The conversation turned awkward when the two figures sat next to each other.\",\"She wrote to Nadia that evening, rather than asking Ben what he took home.\"],\"translation\":\"Valeria abrió su primera nómina en el 55, de camino al mostrador. Comparó la línea de arriba con el dinero del banco y pensó que había habido un retraso. Ben preguntó, sin maldad, si le llegaba para vivir. La conversación se volvió incómoda cuando las dos cifras se sentaron una al lado de la otra. Esa noche le escribió a Nadia, en vez de preguntarle a Ben lo que cobraba.\",\"itemIds\":[\"enb2m2thefirstpayslip\",\"enb2m2awkward\",\"enb2m2enoughto\",\"enb2m2ratherthan\"]},{\"id\":\"enb2m2l9e2\",\"type\":\"gapbank\",\"prompt\":\"Espiral del módulo\",\"text\":\"The ___ in the top line was not take-home pay. There had not been a ___ in payment: it was National Insurance. ___ to asking Ben what he earned, she wrote to Nadia. The conversation had been ___, not unkind.\",\"answers\":[\"figure\",\"delay\",\"Rather\",\"awkward\"],\"bank\":[\"figure\",\"delay\",\"Rather\",\"awkward\",\"rise\",\"fortune\",\"agenda\"],\"translation\":\"La cifra de la línea de arriba no era el líquido. No había habido un retraso en el pago: era National Insurance. En vez de preguntarle a Ben lo que cobraba, le escribió a Nadia. La conversación había sido incómoda, no cruel.\",\"itemIds\":[\"enb2m2thedelayin\",\"enb2m2ratherthan\",\"enb2m2awkward\",\"enb2m2nationalinsurance\"]},{\"id\":\"enb2m2l9e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Compared to Ben's overtime, my pay is the same than last month.\",\"answers\":[\"Compared to Ben's overtime, my pay is the same as last month.\"],\"why\":\"The same AS, nunca than. El calco es «el mismo que». Compared to ya estaba bien: no se toca.\",\"translation\":\"Comparado con las horas extra de Ben, mi sueldo es el mismo que el mes pasado.\",\"itemIds\":[\"enb2m2comparedto\",\"enb2m2thesameas\"]},{\"id\":\"enb2m2l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo que el módulo ha condensado\",\"pairs\":[{\"target\":\"a rise in\",\"source\":\"una subida de (nombre)\"},{\"target\":\"take-home pay\",\"source\":\"el líquido\"},{\"target\":\"a circumlocution\",\"source\":\"un circunloquio\"},{\"target\":\"provided that\",\"source\":\"siempre que\"},{\"target\":\"I intend to stay\",\"source\":\"pretendo quedarme\"}],\"targetSeconds\":22,\"itemIds\":[\"enb2m2therisein\",\"enb2m2takehomepay\",\"enb2m2circumlocution\",\"enb2m2providedthat\",\"enb2m2intend\"]},{\"id\":\"enb2m2l9e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin «keep quiet» — otra formulación precisa\",\"source\":\"I'd rather keep quiet about it.\",\"forbid\":[\"quiet\",\"keep\"],\"answers\":[\"I'd rather not talk about it\",\"I'd rather not talk about it.\",\"I'd rather say nothing about it\",\"I'd prefer not to discuss it\"],\"translation\":\"Prefiero no hablar de ello.\",\"itemIds\":[\"enb2m2keepquiet\"]},{\"id\":\"enb2m2l9e6\",\"type\":\"cloze\",\"prompt\":\"La conversación, con el adjetivo justo\",\"text\":\"The conversation turned ___ when the two figures sat next to each other.\",\"answers\":[\"awkward\"],\"translation\":\"La conversación se volvió incómoda cuando las dos cifras se sentaron una al lado de la otra.\",\"itemIds\":[\"enb2m2awkward\"]},{\"id\":\"enb2m2l9e7\",\"type\":\"speak\",\"prompt\":\"La frase de cierre del monólogo\",\"text\":\"I'd rather keep quiet about it on the bus, and write to Nadia instead.\",\"phonetic\":\"aid RÁA-dha kiip KUÁI-et a-BÁUT it on de bas, and rait tu NÁA-dia in-STÉD\",\"translation\":\"Prefiero no hablar de ello en el autobús, y escribirle a Nadia en su lugar.\",\"itemIds\":[\"enb2m2keepquiet\"]},{\"id\":\"enb2m2l9e8\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4: treinta segundos, dos minutos. La segunda pasada sale mejor.\",\"topic\":\"The first time you were paid in a new country — what the number actually meant\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué y en cuántos puntos: «I'd like to talk about my first payslip in London. I'll say three things.»\"},{\"title\":\"2. The point\",\"hint\":\"Frase-tema: la cifra de arriba no era take-home. Un hecho: NI, no un retraso.\"},{\"title\":\"3. Detail and concession\",\"hint\":\"Un detalle (Ben, el 55, Nadia). Una concesión: «Admittedly, his overtime is a considerable sum. Nevertheless, that is not a ranking.»\"},{\"title\":\"4. Close\",\"hint\":\"Una regla: leer la línea de abajo, escribir, no preguntar en el autobús. «All things considered…»\"}],\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"checklist\":[\"Hablé al menos 1:45 sin pararme en seco\",\"Anuncié de cuántas cosas iba a hablar\",\"Puse el punto en una frase-tema (gross no es take-home / NI no es un retraso)\",\"Usé al menos una nominalización (the delay in, the rise in, the decision to)\",\"Concedí un punto (admittedly / granted) y lo recuperé\",\"Cerré con una regla, no con un chisme\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 2, para que el resto sea tuyo: «The problem was that I had compared the top line with the money in the bank. There had not been a delay in payment. It was National Insurance, a regular deduction, and I had read the wrong figure.»\",\"itemIds\":[\"enb2m2thefirstpayslip\",\"enb2m2takehomepay\",\"enb2m2thedelayin\",\"enb2m2nationalinsurance\",\"enb2m2awkward\"]},{\"id\":\"enb2m2l9e9\",\"type\":\"listen\",\"prompt\":\"Dictado de cierre\",\"text\":\"I'd rather keep quiet about it.\",\"translation\":\"Prefiero no hablar de ello.\",\"itemIds\":[\"enb2m2keepquiet\"]},{\"id\":\"enb2m2l9e10\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Abrí mi primera nómina en el autobús.\",\"answers\":[\"I opened my first payslip on the bus.\",\"I opened my first payslip on the bus\"],\"itemIds\":[\"enb2m2thefirstpayslip\"]},{\"id\":\"enb2m2l9e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Comparado con las horas extra de Ben, no es un dineral.\",\"answers\":[\"Compared to Ben's overtime, it is not a fortune.\",\"Compared to Ben's overtime, it's not a fortune.\"],\"itemIds\":[\"enb2m2comparedto\",\"enb2m2natafortune\"]},{\"id\":\"enb2m2l9e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: la conversación incómoda. Pregunta 1 de 3. Cuaderno. Dos escuchas.\",\"notepad\":true,\"audio\":\"You all right? You've been staring at that paper since Hackney.|It's my first payslip. The top line looks fine. The bank doesn't.|That's gross, that is. Take-home's the bottom. NI, tax, maybe pension.|Is it enough to live on?|Compared to the café, yes. Compared to a late shift on my route, no. I'd rather keep quiet about the number, though. Not because I'm ashamed. Because the bus isn't a market.\",\"question\":\"¿Qué cifra, según Ben, es la que llega al banco?\",\"options\":[\"Take-home, la de abajo\",\"Gross, la de arriba\",\"La de las extra de su ruta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Gross es la de arriba, y él dice que esa NO llega.\",\"Esa es la comparación, no la cifra de ella.\"],\"itemIds\":[\"enb2m2takehomepay\",\"enb2m2grosspay\"]},{\"id\":\"enb2m2l9e13\",\"type\":\"audiomc\",\"prompt\":\"Misma conversación, pregunta 2 de 3.\",\"notepad\":true,\"audio\":\"You all right? You've been staring at that paper since Hackney.|It's my first payslip. The top line looks fine. The bank doesn't.|That's gross, that is. Take-home's the bottom. NI, tax, maybe pension.|Is it enough to live on?|Compared to the café, yes. Compared to a late shift on my route, no. I'd rather keep quiet about the number, though. Not because I'm ashamed. Because the bus isn't a market.\",\"question\":\"¿Por qué prefiere Ben no hablar de la cifra?\",\"options\":[\"Porque el autobús no es un mercado, no porque le dé vergüenza\",\"Porque le da vergüenza cobrar más que Valeria\",\"Porque Nadia se lo ha prohibido\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice explícitamente que no es vergüenza.\",\"Nadia no sale en este audio.\"],\"itemIds\":[\"enb2m2keepquiet\",\"enb2m2comparedto\",\"enb2m2enoughto\"]},{\"id\":\"enb2m2l9e14\",\"type\":\"audiomc\",\"prompt\":\"Pregunta 3 de 3: la de actitud.\",\"notepad\":true,\"audio\":\"You all right? You've been staring at that paper since Hackney.|It's my first payslip. The top line looks fine. The bank doesn't.|That's gross, that is. Take-home's the bottom. NI, tax, maybe pension.|Is it enough to live on?|Compared to the café, yes. Compared to a late shift on my route, no. I'd rather keep quiet about the number, though. Not because I'm ashamed. Because the bus isn't a market.\",\"question\":\"¿Qué está haciendo Ben al comparar el café, el mostrador y su ruta?\",\"options\":[\"Ofrecer un mapa de cifras, no un ranking moral — y luego negarse a convertir el 55 en ese mapa\",\"Decirle a Valeria que deje el mostrador y se ponga a conducir\",\"Pedirle que le muestre la nómina para comprobar el NI\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No le ofrece trabajo. Ofrece una comparación y la cierra.\",\"No pide ver el papel. Explica las líneas.\"],\"itemIds\":[\"enb2m2thegoingrate\",\"enb2m2awkward\",\"enb2m2keepquiet\"],\"tip\":\"La pregunta de actitud se contesta con lo que Ben QUIERE DECIR: un mapa, y un límite. «The bus isn't a market» es la columna de la L6, dicha por un conductor.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m2-3\",\"book\":\"a lot of money\",\"real\":\"It cost a fortune.\",\"meaning\":\"mucho dinero / un dineral\",\"when\":\"Quejándote de un precio de verdad —el alquiler, un curso, una reparación—, con Amy o con Ben. En un informe o en la Writing 1, a considerable sum. «A fortune» en una carta a Nadia baja el registro; «a considerable sum» en el pub lo sube de más.\",\"register\":\"amigos\",\"exam\":\"The overtime comes to a considerable sum.\",\"note\":\"Fortune no es siempre literalmente una fortuna: es la queja. En el examen, considerable sum hace el mismo trabajo sin la queja.\",\"sound\":\"it kost a FÓO-chun\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m2natafortune\"}}],\"resources\":[{\"label\":\"GOV.UK — Understanding your pay\",\"url\":\"https://www.gov.uk/national-minimum-wage/what-is-the-minimum-wage\",\"note\":\"Una página oficial sobre el sueldo. Busca gross, deductions y el lenguaje con el que el gobierno nombra lo que llega a la cuenta. Es el inglés de la Writing 1.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\
