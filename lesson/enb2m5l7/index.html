es más bajo: te mojas a medias.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eProbabilidad en bloque:\u003c/b\u003e \u003ci\u003ein all likelihood\u003c/i\u003e = con toda probabilidad. Prima formal de \u003ci\u003eOdds are\u003c/i\u003e. \u003ci\u003eIt's almost certainly a wiring fault\u003c/i\u003e = casi certeza, todavía no bound to.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCifra que no es exacta:\u003c/b\u003e \u003ci\u003eroughly half\u003c/i\u003e, \u003ci\u003eroughly forty people\u003c/i\u003e. «Roughly» le dice al lector que no te inventas un recuento. ❌ \u003ci\u003emore or less fifty\u003c/i\u003e en un informe suena a conversación; ✓ \u003ci\u003eroughly fifty\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDato que importa:\u003c/b\u003e \u003ci\u003esignificantly higher\u003c/i\u003e no es «mucho más alto». En un informe, \u003ci\u003esignificantly\u003c/i\u003e quiere decir que la diferencia no es ruido. No lo uses para un café más caro.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eBy and large\u003c/b\u003e = en líneas generales. Cierra un párrafo de hallazgos. \u003cb\u003eNamely\u003c/b\u003e = a saber: nombra lo que acabas de anunciar. \u003ci\u003eTwo causes, namely a leak and a left-on lamp.\u003c/i\u003e No es un conector de relleno: si no viene una lista o un nombre, sobra."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l7\",\"phaseId\":\"enb2m5\",\"title\":\"To a great extent\",\"subtitle\":\"Léxico de precisión: grado, extensión y la cifra que no es exacta\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cuánto, más o menos, y en qué medida\",\"itemIds\":[\"enb2m5toagreatextent\",\"enb2m5tosomeextent\",\"enb2m5inalllikelihood\",\"enb2m5roughlyhalf\",\"enb2m5significantlyhigher\",\"enb2m5byandlarge\",\"enb2m5namely\",\"enb2m5almostcertainly\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: «very» no es un dato, y «namely» no es «namely» de relleno\",\"body\":\"$17\",\"table\":[[\"Locución\",\"Trabajo\",\"No es\"],[\"to a great / some extent\",\"hasta dónde llega la afirmación\",\"very\"],[\"in all likelihood\",\"probabilidad de informe\",\"Odds are\"],[\"roughly\",\"cifra no exacta, a propósito\",\"about, en un café\"],[\"significantly\",\"la diferencia importa\",\"very, de un precio\"],[\"namely\",\"nombra lo que has anunciado\",\"relleno\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l7e1\",\"type\":\"match\",\"prompt\":\"Empareja cada locución con su trabajo\",\"pairs\":[{\"target\":\"to a great extent\",\"source\":\"hasta dónde: casi del todo\"},{\"target\":\"to some extent\",\"source\":\"hasta dónde: a medias\"},{\"target\":\"in all likelihood\",\"source\":\"probabilidad de informe\"},{\"target\":\"roughly half\",\"source\":\"cifra no exacta, a propósito\"},{\"target\":\"namely\",\"source\":\"nombra lo que acabas de anunciar\"}],\"itemIds\":[\"enb2m5toagreatextent\",\"enb2m5tosomeextent\",\"enb2m5inalllikelihood\",\"enb2m5roughlyhalf\",\"enb2m5namely\"],\"tip\":\"Si las usas como si fueran «very», el informe se llena de humo. Cada una ocupa un hueco distinto.\"},{\"id\":\"enb2m5l7e2\",\"type\":\"mc\",\"prompt\":\"«Significantly» no es «muy»\",\"question\":\"En un informe, «the second figure was significantly higher» significa…\",\"options\":[\"Que la diferencia importa: no es ruido del recuento\",\"Que la segunda cifra era muy alta, sin más\",\"Que la segunda cifra era más o menos la misma\"],\"answer\":0,\"whyWrong\":[null,\"«Muy alta» sería «much higher» o «far higher». «Significantly» afirma que la diferencia cuenta.\",\"Eso sería «roughly the same» o «not significantly different».\"],\"itemIds\":[\"enb2m5significantlyhigher\",\"enb1m8slightly\"],\"tip\":\"En SCIENCE, «significant» es una palabra técnica prestada al informe. Si no hay recuento, no la uses.\"},{\"id\":\"enb2m5l7e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The findings were clear to a great extend.\",\"answers\":[\"The findings were clear to a great extent.\"],\"why\":\"«Extent» (extensión, alcance) y «extend» (el verbo, extender) se calcan porque en español es la misma familia. En inglés no: to a great extent, nunca extend.\",\"translation\":\"Los hallazgos eran claros en gran medida.\",\"itemIds\":[\"enb2m5toagreatextent\",\"enb2m5findings\"]},{\"id\":\"enb2m5l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la aproximación\",\"text\":\"A room of ___ forty people stayed until the end.\",\"answers\":[\"roughly\"],\"translation\":\"Una sala de unas cuarenta personas se quedó hasta el final.\",\"hints\":[\"Adverbio de aproximación, más de informe que «about»\",\"rou...\"],\"itemIds\":[\"enb2m5roughlyhalf\"],\"tip\":\"«About forty» vale en conversación. En un informe, «roughly forty» le dice al lector que no estás fingiendo un recuento.\"},{\"id\":\"enb2m5l7e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de hallazgos — sin therefore/thus juntos\",\"text\":\"___ and large, the results hold. Attendance was ___ higher on Thursday than on Saturday, ___ because Thursday is a school night and parents are already out. In all ___, a weekday evening is the better slot.\",\"answers\":[\"By\",\"significantly\",\"namely\",\"likelihood\"],\"bank\":[\"By\",\"significantly\",\"namely\",\"likelihood\",\"To\",\"slightly\",\"usually\",\"possible\"],\"translation\":\"En líneas generales, los resultados se sostienen. La asistencia fue significativamente más alta el jueves que el sábado, a saber, porque el jueves es noche de colegio y los padres ya están fuera. Con toda probabilidad, un entre semana es el mejor hueco.\",\"itemIds\":[\"enb2m5byandlarge\",\"enb2m5significantlyhigher\",\"enb2m5namely\",\"enb2m5inalllikelihood\",\"enb1m8slightly\"],\"tip\":\"«Namely» aquí sí gana: anuncia la causa concreta. «Usually» no nombra nada. Y «slightly» está de distractor porque es el hermano pequeño de «significantly», el que ya tienes del B1.\"},{\"id\":\"enb2m5l7e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés de informe\",\"source\":\"En cierta medida, tiene razón.\",\"answers\":[\"To some extent, she is right\",\"To some extent she's right\",\"To some extent, he is right\",\"To some extent, they are right\"],\"hint\":\"Empieza por «To some extent»\",\"itemIds\":[\"enb2m5tosomeextent\"],\"tip\":\"«To some extent» es la concesión mínima del informe: le das parte de la razón sin entregarle el párrafo. El m8 la subirá a «admittedly».\"},{\"id\":\"enb2m5l7e7\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — cuaderno abierto. Lee la pregunta ANTES. Dos escuchas.\",\"notepad\":true,\"audio\":\"Good evening. I'm Farida Haq, and in the next hour I want to steal six phrases from the laboratory and give them to you for the kitchen. The first is 'to a great extent'. Not 'very'. 'To a great extent' tells a listener how far you are willing to go. The second is 'roughly'. If I say forty people came, I am inventing a precision I do not have. If I say roughly forty, I am being careful. The third is 'in all likelihood', which is the grown-up sister of 'odds are' — same height, different room. Fourth: 'significantly'. Only use it when a difference would still be there if you counted again. Fifth: 'namely'. It is a pointer, not furniture; if nothing is being named, take it out. And sixth: 'by and large', which is how you close a set of findings without pretending they are a law. Write them down. You will need them if you ever have to tell a committee that you do not, in fact, know.\",\"question\":\"¿Qué pide Farida que se haga con «namely»?\",\"options\":[\"Usarlo solo cuando se nombra algo concreto; si no, quitarlo\",\"Ponerlo al final de cada párrafo de hallazgos\",\"Sustituir con él todas las cifras aproximadas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es el oficio de «by and large», el sexto.\",\"Las cifras aproximadas son el oficio de «roughly», el segundo.\"],\"itemIds\":[\"enb2m5toagreatextent\",\"enb2m5roughlyhalf\",\"enb2m5inalllikelihood\",\"enb2m5significantlyhigher\",\"enb2m5namely\",\"enb2m5byandlarge\",\"enb2m5natoddsare\"],\"tip\":\"Seis locuciones, una cada una, y el cuaderno no es adorno: en B2 la respuesta llega tarde. Si no apuntas las seis, la pregunta 4 y la 5 se te caen.\"},{\"id\":\"enb2m5l7e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — cierre de hallazgos\",\"text\":\"By and large, the results hold. In all likelihood, a weekday is better.\",\"phonetic\":\"bai and laach, de ri-SÁLTS jould. in ool LÁIK-li-jud, a UÍIK-dei is̬ BÉ-ta\",\"translation\":\"En líneas generales, los resultados se sostienen. Con toda probabilidad, un entre semana es mejor.\",\"itemIds\":[\"enb2m5byandlarge\",\"enb2m5inalllikelihood\"],\"tip\":\"Dos bloques, dos golpes: LARGE y LIKE-li-hood. El resto es cola. Si le das el mismo peso a «by and», se te deshace el cierre.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\
