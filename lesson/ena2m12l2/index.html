a ítem lleva \u003cb\u003edos datos\u003c/b\u003e, no uno. Ya no basta con cazar la hora: hay que cazar la hora \u003cb\u003ey\u003c/b\u003e el andén, el número \u003cb\u003ey\u003c/b\u003e la planta, el precio \u003cb\u003ey\u003c/b\u003e la cantidad. Los tres distractores están hechos para que uno de los dos datos encaje. \u003cb\u003eParte 2\u003c/b\u003e (7 ítems): oyes una frase y eliges \u003cb\u003ela mejor réplica\u003c/b\u003e — no la que suena parecido, la que \u003ci\u003eresponde\u003c/i\u003e. Y la regla que lo cambia todo: \u003cb\u003ese oye dos veces\u003c/b\u003e. La primera escucha es para entender de qué va; la segunda, para confirmar los dos datos. Nunca al revés.\",\"table\":[[\"Escucha\",\"Qué haces\"],[\"La primera\",\"Entender la situación · marcar a lápiz lo que creas\"],[\"Entre las dos\",\"Leer otra vez las tres opciones\"],[\"La segunda\",\"Confirmar LOS DOS datos · escribir en firme\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l2e1\",\"type\":\"mc\",\"prompt\":\"Lo que cambia respecto al A1\",\"question\":\"En la Parte 1 del A2, ¿qué trae cada ítem?\",\"options\":[\"Dos datos que hay que cruzar\",\"Un solo dato, como en el A1\",\"Un texto largo con seis huecos\"],\"answer\":0,\"whyWrong\":[null,\"Ese era el A1: aquí el handbook dice literalmente «two pieces of information»\",\"Eso es la Parte 4, y además se escribe\"],\"itemIds\":[\"ena2m12twopiecesofinformation\"],\"tip\":\"Antes de darle al play, decide QUÉ DOS cosas vas a cazar. Con una sola en la cabeza, fallas.\"},{\"id\":\"ena2m12l2e2\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: hora y andén — 2 escuchas\",\"audio\":\"The nine fifteen service to Brighton leaves from platform four.\",\"question\":\"¿Qué dos datos apuntas?\",\"options\":[\"9:15 y andén 4\",\"9:50 y andén 4\",\"9:15 y andén 14\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El andén sí, pero la hora no: fifteen lleva el golpe al final (fif-TÍIN) — fifty sonaría plano\",\"La hora sí, pero el andén no: oíste four a secas, no fourteen\"],\"itemIds\":[\"ena2m6platformfour\",\"ena2m12twopiecesofinformation\"],\"tip\":\"Fíjate en los distractores: cada uno acierta UN dato y falla el otro. Así están hechos todos los de la Parte 1 en A2.\"},{\"id\":\"ena2m12l2e3\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: habitación y planta — 2 escuchas\",\"audio\":\"Your room is number thirteen, on the third floor.\",\"question\":\"¿Qué dos datos apuntas?\",\"options\":[\"Habitación 13, tercera planta\",\"Habitación 30, tercera planta\",\"Habitación 13, primera planta\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"thirty suena plano (ZÉE-ti); aquí el golpe cayó al final: zee-TÍIN\",\"third es tercera; first sonaría féest, con otra vocal entera\"],\"itemIds\":[\"ena2m4thirteenpounds\",\"ena2m12twopiecesofinformation\"],\"tip\":\"El par 13/30 vuelve, pero ahora con un segundo dato al lado. Cazar los dos es el nivel A2.\"},{\"id\":\"ena2m12l2e4\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: cantidad y precio — 2 escuchas\",\"audio\":\"Two coffees and a slice of cake — that's six pounds fifty, please.\",\"question\":\"¿Qué dos datos apuntas?\",\"options\":[\"2 cafés y £6,50\",\"2 cafés y £6,15\",\"3 cafés y £6,50\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El número de cafés sí; el precio no: fifty va plano, fifteen llevaría el golpe al final\",\"El precio sí; los cafés no: oíste two, y el tercer artículo era un trozo de tarta\"],\"itemIds\":[\"ena2m5twocoffeesplease\",\"ena2m5asliceofcake\"],\"tip\":\"En una cuenta, los dos datos son casi siempre CUÁNTOS y CUÁNTO. Prepara dos casillas antes del play.\"},{\"id\":\"ena2m12l2e5\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: apellido y teléfono — 2 escuchas\",\"audio\":\"It's Doctor Ellis, E-double L-I-S. My number is oh two oh, seven nine four six.\",\"question\":\"¿Qué dos datos apuntas?\",\"options\":[\"Ellis y 020 7946\",\"Elis y 020 7946\",\"Ellis y 020 7964\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"double L son DOS eles: Ellis\",\"El apellido sí; el número no: el orden fue nine-four-six, no nine-six-four\"],\"itemIds\":[\"endouble\",\"enexaminer\"],\"tip\":\"Letras y cifras en el mismo audio: la combinación favorita de la Parte 1. Escribe mientras suena, no después.\"},{\"id\":\"ena2m12l2e6\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: la mejor réplica — 2 escuchas\",\"audio\":\"Would you like some more tea?\",\"question\":\"Elige la mejor réplica:\",\"options\":[\"No, thanks. I'm fine.\",\"Yes, I did.\",\"It's over there.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Yes, I did responde a una pregunta en pasado con did\",\"Eso respondería a un Where…?\"],\"itemIds\":[\"enbestreply\",\"ena2m5wouldyoulikesometea\"],\"tip\":\"Pregúntate siempre: ¿a QUÉ pregunta respondería esto? La opción que responde a otra cosa se cae sola.\"},{\"id\":\"ena2m12l2e7\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: la disculpa — 2 escuchas\",\"audio\":\"I'm really sorry about the noise last night.\",\"question\":\"Elige la mejor réplica:\",\"options\":[\"Don't worry about it.\",\"Yes, please.\",\"Here you are.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Yes, please responde a un ofrecimiento\",\"Here you are se dice al ENTREGAR algo\"],\"itemIds\":[\"enbestreply\",\"endontworry\",\"ena2m5imsosorryaboutthat\"],\"tip\":\"Disculpa → quitar hierro. Es una de las seis funciones que más caen: perdón, gracias, ofrecer, pedir, invitar, quedar.\"},{\"id\":\"ena2m12l2e8\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: el aviso de la estación — 2 escuchas\",\"audio\":\"Attention, please. The ten thirty coach to Manchester is now leaving from stand B.\",\"question\":\"¿Qué dos datos apuntas?\",\"options\":[\"10:30 y dársena B\",\"10:13 y dársena B\",\"10:30 y dársena D\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"thirty es plano; thirteen llevaría el golpe al final\",\"B se dice «bii»; D se dice «dii» — la consonante es la que cambia\"],\"itemIds\":[\"ena2m12theannouncement\",\"ena2m6thecoach\"],\"tip\":\"En los avisos reales, la hora va SIEMPRE antes del sitio. Prepara las dos casillas en ese orden.\"},{\"id\":\"ena2m12l2e9\",\"type\":\"bucket\",\"prompt\":\"¿Qué cazas en cada parte?\",\"categories\":[\"Parte 1: dos DATOS\",\"Parte 2: la FUNCIÓN\"],\"items\":[{\"text\":\"una hora y un andén\",\"bucket\":0},{\"text\":\"responder a un gracias\",\"bucket\":1},{\"text\":\"un apellido deletreado y un teléfono\",\"bucket\":0},{\"text\":\"aceptar o rechazar un ofrecimiento\",\"bucket\":1},{\"text\":\"un precio y una cantidad\",\"bucket\":0},{\"text\":\"quitar hierro a una disculpa\",\"bucket\":1}],\"itemIds\":[\"ena2m12twopiecesofinformation\",\"enbestreply\"],\"tip\":\"Saber qué se te pide antes de oír nada es media respuesta. La otra media es la segunda escucha.\"},{\"id\":\"ena2m12l2e10\",\"type\":\"listen\",\"prompt\":\"Dictado de examen: los dos datos en la misma frase\",\"text\":\"The bus to the airport leaves at ten past six from stop C.\",\"translation\":\"El autobús al aeropuerto sale a las seis y diez desde la parada C.\",\"hints\":[\"ten past six = las seis y diez\",\"…from stop C.\"],\"itemIds\":[\"ena2m12theannouncement\",\"ena2m6thecoach\"],\"tip\":\"Escribir lo que oyes entrena las dos cosas a la vez: el oído y la mano. La Parte 4 te lo va a cobrar.\"},{\"id\":\"ena2m12l2e11\",\"type\":\"errorfix\",\"prompt\":\"Corrige — el pronombre se ha colado fuera\",\"wrong\":\"Write down it in your notes.\",\"answers\":[\"Write it down in your notes.\",\"Write it down in your notes\"],\"why\":\"Con estos verbos de dos piezas (write down, pick up, turn off), el pronombre it, them, him va SIEMPRE en medio: write it down. Solo el sustantivo entero puede ir detrás: write down the number.\",\"translation\":\"Apúntalo en tus notas.\",\"hints\":[\"it no se pone al final\",\"Write ___ down…\"],\"itemIds\":[\"ena2m12writeitdown\"]},{\"id\":\"ena2m12l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Apúntalo.\",\"answers\":[\"Write it down.\",\"Write it down\"],\"hints\":[\"Verbo + it + partícula\",\"Write it…\"],\"itemIds\":[\"ena2m12writeitdown\"],\"tip\":\"En la Parte 1 se escribe a lápiz durante la primera escucha y en firme durante la segunda. La mano también se entrena.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m12-2\",\"book\":\"Would you like some more tea?\",\"real\":\"More tea?\",\"meaning\":\"¿Más té? — el ofrecimiento reducido a dos palabras\",\"when\":\"En casa de alguien, en una mesa, con la tetera en la mano. En el examen lo oyes así de corto en la Parte 2 y tienes que reconocer que es un OFRECIMIENTO, no una pregunta de información.\",\"register\":\"amigos\",\"note\":\"Los ofrecimientos en inglés se acortan hasta el sustantivo: «Coffee?», «Lift?», «Hand?». La entonación sube y eso basta.\",\"sound\":\"móo TÍI? (subiendo)\",\"level\":\"a2\",\"itemId\":\"ena2m5wouldyoulikesometea\"}}],\"resources\":[{\"label\":\"British Council — A2 Listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Un audio al día esta semana, con la regla del examen: lee las preguntas antes, dos escuchas y ni una más. Apunta SIEMPRE dos datos por audio, aunque no te los pidan.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$
