 ni vas a perder un «¿dónde está?» por no distinguir been de gone.\u003cbr/\u003e2. \u003cb\u003eTu pasado simple es mejor que antes.\u003c/b\u003e Esto es lo importante: al ver los dos tiempos enfrentados sabes exactamente \u003cb\u003ecuándo el inglés te obliga al pasado simple\u003c/b\u003e — con yesterday, last…, ago, in 2019 y cualquier pregunta con when. Antes lo hacías por costumbre; ahora lo haces por regla, y por eso ya no se te va a colar \u003ci\u003eI have seen him yesterday\u003c/i\u003e.\u003cbr/\u003e3. \u003cb\u003eSabes por dónde te engaña tu español\u003c/b\u003e, y sabes por qué lado: sobreusando el perfecto o infrausándolo. Eso no se olvida.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY para el minuto de oral\u003c/b\u003e, la plantilla de siempre, con material de este módulo:\u003cbr/\u003e· \u003cb\u003e1. Una experiencia sin fecha\u003c/b\u003e: \u003ci\u003eI've been to three countries.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003e2. El detalle, con fecha\u003c/b\u003e: \u003ci\u003eI went to Mexico in 2022 with my sister.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003e3. Lo que aún no\u003c/b\u003e: \u003ci\u003eI've never been to Scotland, but I'd like to go.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003ePerfecto para abrir, pasado simple para contar, perfecto para cerrar. Es la estructura que usa un nativo sin pensarlo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l9\",\"phaseId\":\"ena2m10\",\"title\":\"Three people, three answers\",\"subtitle\":\"Todo el módulo junto — y el recordatorio de qué entra y qué no\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cerrar contando experiencias\",\"itemIds\":[\"ena2m10thebestivever\",\"ena2m10howmanytimes\",\"ena2m10experience\",\"ena2m10onceortwice\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes del cierre: qué te llevas y qué NO te van a pedir\",\"body\":\"$17\",\"table\":[[\"\",\"en el examen A2\",\"en la calle y en el Listening\"],[\"Pasado simple con marcador\",\"se te exige\",\"constante\"],[\"ever / never\",\"no entra\",\"constante\"],[\"been vs gone\",\"no entra\",\"decide «¿dónde está?»\"],[\"just / already / yet\",\"no entra\",\"constante\"],[\"for / since\",\"no entra\",\"en cuanto alguien te pregunta cuánto llevas\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — todo esto ya lo tienes\",\"pairs\":[{\"target\":\"Have you ever…?\",\"source\":\"¿Has… alguna vez?\"},{\"target\":\"I've never…\",\"source\":\"No he… nunca\"},{\"target\":\"Not yet.\",\"source\":\"Todavía no.\"},{\"target\":\"for three years\",\"source\":\"desde hace tres años\"},{\"target\":\"since 2019\",\"source\":\"desde 2019\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m10haveyouever\",\"ena2m10ivenevertried\",\"ena2m10notyet\",\"ena2m10forthreeyears\",\"ena2m10since2019\"],\"tip\":\"El cronómetro solo premia. Si estas cinco salen sin pensar, el módulo se ha instalado; si te paras en alguna, volverá en el repaso.\"},{\"id\":\"ena2m10l9e2\",\"type\":\"bucket\",\"prompt\":\"Espiral final: ¿qué tiempo pide cada marcador?\",\"categories\":[\"pasado simple\",\"present perfect\"],\"items\":[{\"text\":\"last night\",\"bucket\":0},{\"text\":\"so far\",\"bucket\":1},{\"text\":\"in 2019\",\"bucket\":0},{\"text\":\"recently\",\"bucket\":1},{\"text\":\"When…?\",\"bucket\":0},{\"text\":\"three times\",\"bucket\":1},{\"text\":\"two days ago\",\"bucket\":0},{\"text\":\"yet\",\"bucket\":1}],\"itemIds\":[\"enlastnight\",\"ena2m10recently\",\"ena2m10whendidithappen\",\"ena2m10threetimes\",\"ena2m1twodaysago\",\"ena2m10haveyoufinishedyet\"],\"tip\":\"Es el mismo ejercicio de la lección 6 con marcadores nuevos. Si lo has hecho sin dudar, la regla ya no depende de tu español.\"},{\"id\":\"ena2m10l9e3\",\"type\":\"gapbank\",\"prompt\":\"La conversación entera: rellena con el banco\",\"text\":\"«___ you ever been to Mexico?» «Yes, I have. I ___ in 2022.» «___ long did you stay?» «Two weeks. It's the best trip I've ___ had.»\",\"answers\":[\"Have\",\"went\",\"How\",\"ever\"],\"bank\":[\"Have\",\"went\",\"How\",\"ever\",\"Did\",\"never\",\"When\"],\"translation\":\"«¿Has estado alguna vez en México?» «Sí. Fui en 2022.» «¿Cuánto tiempo te quedaste?» «Dos semanas. Es el mejor viaje que he hecho nunca.»\",\"itemIds\":[\"ena2m10haveyoueverbeenabroad\",\"ena2m10yesihave\",\"ena2m10thebestivever\",\"enmexico\"],\"tip\":\"Fíjate en el último hueco: ever en afirmativa solo se admite detrás de un superlativo — «the best I've ever had». Es la única puerta que tiene.\"},{\"id\":\"ena2m10l9e4\",\"type\":\"order\",\"prompt\":\"Ordena la respuesta de Valeria, de la noticia al detalle\",\"sentences\":[\"I've worked in three cafés since I arrived in London.\",\"My first job was at a place near the station.\",\"I only stayed there for two months.\",\"Then I got a job at the café with Sam.\",\"I've been there ever since, and I love it.\"],\"translation\":\"He trabajado en tres cafés desde que llegué a Londres. Mi primer trabajo fue en un sitio cerca de la estación. Solo estuve allí dos meses. Luego empecé a trabajar en el café con Sam. Llevo ahí desde entonces, y me encanta.\",\"itemIds\":[\"ena2m10shesworkedin\",\"ena2m10since2019\",\"ena2m10forthreeyears\",\"enstation\"],\"tip\":\"Perfecto para abrir, pasado simple en medio para los episodios, perfecto para cerrar. Ese sándwich es la forma normal de contar una trayectoria.\"},{\"id\":\"ena2m10l9e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco más caro del módulo\",\"wrong\":\"I have seen Ben yesterday at the bus stop.\",\"answers\":[\"I saw Ben yesterday at the bus stop.\"],\"why\":\"yesterday es tiempo cerrado, y eso obliga al pasado simple en inglés. Y ojo, porque el español tampoco dice «he visto a Ben ayer» en ninguna orilla: lo que engaña es «he visto a Ben hoy», donde el periodo sigue abierto. La regla inglesa es una sola y no depende de cómo hables tú: marcador cerrado, pasado simple.\",\"translation\":\"Vi a Ben ayer en la parada del autobús.\",\"itemIds\":[\"ena2m10isawherlastweek\",\"enyesterday\",\"enbusstop\"]},{\"id\":\"ena2m10l9e6\",\"type\":\"errorfix\",\"prompt\":\"Y el calco de la otra orilla\",\"wrong\":\"I live in London since three years.\",\"answers\":[\"I've lived in London for three years.\",\"I have lived in London for three years.\"],\"why\":\"Tres errores en cinco palabras, y conviene verlos separados: (1) el español usa presente y el inglés necesita perfecto; (2) tres años es DURACIÓN, así que es for y no since; (3) «desde hace» son dos palabras en español y una sola en inglés. Arreglar solo uno de los tres no salva la frase.\",\"translation\":\"Vivo en Londres desde hace tres años.\",\"itemIds\":[\"ena2m10ivestudiedenglishfor\",\"ena2m10forthreeyears\",\"enlondon\"]},{\"id\":\"ena2m10l9e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"I've never been to Scotland.\",\"forbid\":[\"never\"],\"answers\":[\"I haven't been to Scotland.\",\"I have not been to Scotland.\"],\"translation\":\"No he estado nunca en Escocia.\",\"itemIds\":[\"ena2m10ivenevertried\",\"ena2m10ivebeento\"],\"tip\":\"never y haven't dicen lo mismo por dos caminos, y ese es el truco que te salva en el oral cuando una palabra no te sale. Lo que NO puedes hacer es juntarlas: «I haven't never» no existe.\"},{\"id\":\"ena2m10l9e8\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"Amy has gone to the hospital, but I've been there twice this week and it's fine.\",\"answers\":[\"Amy se ha ido al hospital, pero yo he estado allí dos veces esta semana y está bien.\",\"Amy se ha ido al hospital, pero yo he estado ahí dos veces esta semana y no pasa nada.\"],\"itemIds\":[\"ena2m10shesgoneto\",\"ena2m10ivebeento\",\"ena2m10thisweekthisyear\"],\"tip\":\"Los dos participios de ir, en la misma frase, contando cosas distintas: Amy está allí, quien habla ya ha vuelto. Si eso te ha quedado claro, la lección 3 está cerrada.\"},{\"id\":\"ena2m10l9e9\",\"type\":\"audiomc\",\"prompt\":\"Cierre de oído — dos datos, como en la Parte 1 del examen\",\"audio\":\"I've applied for four jobs this month, but I haven't had an interview yet. I had one in March, and it went really badly.\",\"question\":\"¿Cuándo hizo la última entrevista?\",\"options\":[\"En marzo\",\"Este mes\",\"Todavía no ha hecho ninguna\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Este mes ha echado solicitudes, pero entrevistas no: lo dice el yet\",\"Sí ha hecho una, la de marzo; lo que no ha habido es ninguna este mes\"],\"itemIds\":[\"ena2m10iveappliedfor\",\"ena2m10haveyoufinishedyet\",\"ena2m3badly\"],\"tip\":\"El yet dice «este mes, ninguna» y el «in March» abre un episodio cerrado con su pasado simple. Dos tiempos verbales, dos informaciones distintas: eso es lo que la pregunta te está midiendo.\"},{\"id\":\"ena2m10l9e10\",\"type\":\"speak\",\"prompt\":\"Tu minuto, bloque a bloque — léelo y luego dilo mirando al frente\",\"text\":\"I've been to three countries. I went to Mexico in 2022 with my sister. I've never been to Scotland, but I'd like to go.\",\"phonetic\":\"áiv bin tu zríi KÁN-tris̬. ái uent tu MEK-si-kou in tuénti tuénti-TÚU uid mái SÍS-ta. áiv NÉ-va bin tu SKOT-land, bat áid láik tu góu\",\"translation\":\"He estado en tres países. Fui a México en 2022 con mi hermana. No he estado nunca en Escocia, pero me gustaría ir.\",\"itemIds\":[\"ena2m10ivebeento\",\"ena2m10ivenevertried\",\"enmexico\",\"ensister\"],\"tip\":\"Perfecto, pasado simple, perfecto. Y fíjate en que el único que lleva fecha es el del medio: esa es toda la regla, dicha en voz alta.\"},{\"id\":\"ena2m10l9e11\",\"type\":\"monologue\",\"prompt\":\"El minuto de verdad: tus experiencias\",\"topic\":\"Tres cosas que has hecho en tu vida (y una que no has hecho todavía)\",\"slides\":[{\"title\":\"1. Una experiencia, sin fecha\",\"hint\":\"I've been to… / I've worked in… / I've studied… — nada de «in 2022» todavía\"},{\"title\":\"2. El detalle, con fecha\",\"hint\":\"Ahora sí: I went there in… / I started in… / It happened last year.\"},{\"title\":\"3. Lo que aún no has hecho\",\"hint\":\"I've never… , but I'd like to. / I haven't… yet.\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He empezado con una experiencia SIN fecha (have/has + tercera columna)\",\"He dado un detalle CON fecha, y ahí he usado pasado simple\",\"He usado never o yet una vez\",\"He dicho cuánto tiempo con for o con since\",\"No he metido ninguna fecha detrás de have\"],\"model\":\"I've been to four countries. I've studied English for three years and I've worked in two cafés in London. I went to Mexico in 2022 with my sister and we stayed for two weeks — it's the best trip I've ever had. I've never been to Scotland, but a friend has just moved to Edinburgh, so I'd like to go this year. I haven't booked anything yet.\",\"itemIds\":[\"ena2m10ivebeento\",\"ena2m10ivestudiedenglishfor\",\"ena2m10thebestivever\",\"ena2m10ivenevertried\",\"ena2m10haveyoufinishedyet\"],\"tip\":\"Grábate las dos veces. La última casilla es la que más se falla: en cuanto sale una fecha, el verbo tiene que caer al pasado simple. Cuéntalas al escucharte.\"},{\"id\":\"ena2m10l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"¿Cuántas veces has estado en Londres? — Una vez o dos. Fui en 2022.\",\"answers\":[\"How many times have you been to London? Once or twice. I went in 2022.\",\"How many times have you been to London? Once or twice. I went there in 2022.\",\"How many times have you been to London? Once or twice, I went in 2022.\"],\"hints\":[\"La pregunta cuenta veces (perfecto); la respuesta con fecha cae al pasado simple\",\"How many times h… you b…n to London? Once or twice. I w… in 2022.\"],\"itemIds\":[\"ena2m10howmanytimes\",\"ena2m10onceortwice\",\"ena2m10ivebeento\",\"enlondon\"],\"tip\":\"Con esto cierras la frontera. Si lo reconoces al oírlo y te sale al escribirlo, vas por delante de lo que el A2 te va a pedir — y llegas al B1 con la cara ya conocida. Y recuerda: nada de este módulo entra en tu simulacro.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m10-9\",\"book\":\"It's the best coffee I have ever had.\",\"real\":\"Best coffee ever.\",\"meaning\":\"El mejor café de la historia\",\"when\":\"Coloquial y muy actual: se cae la frase entera y quedan tres palabras. Vale para todo — «best day ever», «worst film ever». En el examen escribe la fórmula completa: es superlativo + I've ever + participio, y ahí sí puntúa.\",\"register\":\"amigos\",\"note\":\"Es la única puerta por la que ever entra en una afirmativa: detrás de un superlativo. En cualquier otro sitio, ever es de preguntas.\",\"sound\":\"best KO-fi É-va\",\"level\":\"a2\",\"itemId\":\"ena2m10thebestivever\"}}],\"resources\":[{\"label\":\"British Council — A2 Speaking: personal experiences\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Ensaya el minuto con los vídeos: 30 segundos de papel y uno de habla, siempre dos veces. La segunda pasada sale mejor y es la que te llevas.\"},{\"label\":\"LanguageCert — ESOL A2 Access (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Vuelve al syllabus y compruébalo tú: el present perfect no está en la columna Access. Verlo con tus ojos vale más que creerme a mí.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy
