eller\",\"a2mitfreundlichengruessen\",\"a2wort\",\"a2punkt\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 1: el SMS al amigo (~20-30 palabras)\",\"body\":\"Escribes un SMS o una nota breve a alguien de confianza — registro \u003cb\u003edu\u003c/b\u003e — respondiendo a \u003cb\u003e3 Punkte\u003c/b\u003e de contenido dados (p. ej.: por qué no puedes ir, propón otro día, pregunta algo). La plantilla que nunca falla: \u003cb\u003esaludo\u003c/b\u003e (Hallo Leo, / [[Lieber Leo|Querido Leo]],) → \u003cb\u003euna frase por cada Punkt\u003c/b\u003e → \u003cb\u003edespedida corta\u003c/b\u003e (Viele Grüße / Bis Samstag!). Los tres Punkte son obligatorios: un Punkt olvidado cuesta más nota que tres errores de gramática. Cuenta tus Wörter por encima — unas 20-30 — y no te alargues: más palabras = más errores posibles.\"}},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 2: el correo semiformal (~30-40 palabras)\",\"body\":\"Aquí escribes a alguien que se trata de \u003cb\u003eSie\u003c/b\u003e: una profesora, un casero, una oficina. Cambian el saludo y la despedida — el cuerpo sigue siendo una frase por Punkt. Saludo: \u003cb\u003eLiebe Frau Müller,\u003c/b\u003e / \u003cb\u003eLieber Herr Schmidt,\u003c/b\u003e — el Liebe/Lieber del A1, ahora con Frau/Herr + apellido. Despedida: \u003cb\u003eMit freundlichen Grüßen\u003c/b\u003e + tu nombre en la línea siguiente — SIN coma tras la despedida: la coma ahí es un calco del español, en alemán no se escribe. Dentro, todos los verbos en Sie: «Können Sie mir bitte helfen?». El termómetro del registro: ¿le dirías du a esa persona en la calle? Si no, es Teil 2 — Frau/Herr y Sie de principio a fin.\",\"table\":[[\"\",\"Teil 1 (SMS, du)\",\"Teil 2 (correo, Sie)\"],[\"Saludo\",\"Hallo Leo, / Lieber Leo,\",\"Liebe Frau Müller, / Lieber Herr Schmidt,\"],[\"Cuerpo\",\"1 frase por Punkt\",\"1 frase por Punkt\"],[\"Despedida\",\"Viele Grüße / Bis Samstag!\",\"Mit freundlichen Grüßen\"],[\"Palabras\",\"~20-30\",\"~30-40\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl4e1\",\"type\":\"mc\",\"prompt\":\"Elige el registro\",\"question\":\"Escribes a tu casera, Frau Müller, porque la calefacción no funciona. ¿Cómo empiezas?\",\"options\":[\"Hallo Müller,\",\"Liebe Frau Müller,\",\"Liebe Anna,\"],\"answer\":1,\"whyWrong\":[\"El apellido a secas suena brusco — falta Frau y falta calidez\",null,\"¿Anna? A tu casera no la llamas por el nombre de pila: Frau + apellido\"],\"itemIds\":[\"a2liebefraumueller\",\"liebeanna\"],\"tip\":\"Liebe Frau + apellido, Lieber Herr + apellido: el mismo Liebe/Lieber del A1 con traje formal.\"},{\"id\":\"a2examl4e2\",\"type\":\"match\",\"prompt\":\"Empareja cada pieza con su carta\",\"pairs\":[{\"target\":\"Hallo Leo,\",\"source\":\"saludo del SMS (du)\"},{\"target\":\"Liebe Frau Müller,\",\"source\":\"saludo del correo (Sie)\"},{\"target\":\"Viele Grüße\",\"source\":\"despedida entre amigos\"},{\"target\":\"Mit freundlichen Grüßen\",\"source\":\"despedida formal\"}],\"itemIds\":[\"a2liebefraumueller\",\"a2mitfreundlichengruessen\",\"vielegruesse\"]},{\"id\":\"a2examl4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la despedida formal (¡Umlaut y ß!)\",\"text\":\"Mit freundlichen ___\",\"answers\":[\"Grüßen\"],\"translation\":\"Atentamente (la firma, Sofia, va en la línea siguiente)\",\"hints\":[\"Viene de der Gruß, como en Viele Grüße\",\"Aquí con -n final: G-r-ü-ß-e-n — con ü y con ß\"],\"itemIds\":[\"a2mitfreundlichengruessen\",\"vielegruesse\"],\"strictUmlaut\":true,\"tip\":\"Tras mit, la despedida toma -n: Grüßen. Y ojo: en alemán NO hay coma tras la despedida — la firma va en la línea siguiente, sin más. Escríbela siempre entera y correcta: son puntos casi gratis.\"},{\"id\":\"a2examl4e4\",\"type\":\"mc\",\"prompt\":\"La regla de oro de los Punkte\",\"question\":\"La consigna trae 3 Punkte y tu texto responde solo 2, pero sin un solo error. ¿Qué pasa?\",\"options\":[\"Nota máxima: la gramática es perfecta\",\"Pierdes más nota que por errores de gramática\",\"No
