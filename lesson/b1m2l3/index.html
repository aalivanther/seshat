\u003cbr/\u003e· \u003cb\u003eabhängen \u003cmark class=\"dat\"\u003evon\u003c/mark\u003e\u003c/b\u003e + Dativ — depender DE. \u003ci\u003eDas \u003cb\u003ehängt von\u003c/b\u003e der Firma \u003cb\u003eab\u003c/b\u003e\u003c/i\u003e — y ojo: el prefijo \u003cb\u003eab-\u003c/b\u003e se va al final."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m2l3\",\"phaseId\":\"b1m2\",\"title\":\"damit, falls, um … zu\",\"subtitle\":\"Finalidad y condición — las tres subordinadas que faltaban\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Para qué y en qué caso\",\"itemIds\":[\"b1m2damit\",\"b1m2falls\",\"b1m2umzu\",\"b1m2sichkonzentrierenauf\",\"b1m2abhaengenvon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: quién es el sujeto decide la estructura\",\"body\":\"$17\",\"table\":[[\"situación\",\"estructura\",\"ejemplo\"],[\"mismo sujeto\",\"um … zu + Infinitiv\",\"…, um Zeit zu sparen\"],[\"sujetos distintos\",\"damit + verbo al final\",\"…, damit die Kinder pünktlich sind\"],[\"condición probable\",\"wenn + verbo al final\",\"Wenn ich Zeit habe, …\"],[\"condición poco probable\",\"falls + verbo al final\",\"Falls es Probleme gibt, …\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l3e1\",\"type\":\"bucket\",\"prompt\":\"¿Mismo sujeto (um…zu) o sujetos distintos (damit)?\",\"categories\":[\"um … zu (mismo sujeto)\",\"damit (sujetos distintos)\"],\"items\":[{\"text\":\"Ich arbeite mehr, ___ mehr Geld ___ verdienen.\",\"bucket\":0},{\"text\":\"Ich arbeite mehr, ___ meine Familie mehr Geld hat.\",\"bucket\":1},{\"text\":\"Er lernt Deutsch, ___ in Berlin ___ arbeiten.\",\"bucket\":0},{\"text\":\"Er spricht langsam, ___ ich ihn verstehe.\",\"bucket\":1},{\"text\":\"Wir machen Pause, ___ uns ___ erholen.\",\"bucket\":0},{\"text\":\"Der Chef schreibt eine Mail, ___ alle informiert sind.\",\"bucket\":1}],\"itemIds\":[\"b1m2damit\",\"b1m2umzu\"],\"tip\":\"Test de una pregunta: ¿el que hace la primera acción es el mismo que hace la segunda? Sí → um…zu. No → damit. Nunca falla.\"},{\"id\":\"b1m2l3e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich stehe früh auf, für dass meine Kinder pünktlich sind.\",\"answers\":[\"Ich stehe früh auf, damit meine Kinder pünktlich sind.\"],\"why\":\"«para que» no se traduce palabra por palabra: «für dass» no existe en alemán. Con sujetos distintos se usa «damit».\",\"translation\":\"Me levanto pronto para que mis hijos lleguen a tiempo.\",\"itemIds\":[\"b1m2damit\"]},{\"id\":\"b1m2l3e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Falls es gibt Probleme, rufen Sie mich an.\",\"answers\":[\"Falls es Probleme gibt, rufen Sie mich an.\"],\"why\":\"falls es subordinante: el verbo se va al final («gibt»). Y como la subordinada abre la frase, la principal empieza por el verbo: «rufen Sie».\",\"translation\":\"Si hubiera problemas, llámeme.\",\"itemIds\":[\"b1m2falls\"]},{\"id\":\"b1m2l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa la finalidad\",\"text\":\"Ich arbeite von zu Hause, ___ Zeit zu sparen.\",\"answers\":[\"um\"],\"translation\":\"Trabajo desde casa para ahorrar tiempo.\",\"hints\":[\"Mismo sujeto en las dos partes: yo trabajo, yo ahorro\",\"u-m ... zu + infinitivo\"],\"itemIds\":[\"b1m2umzu\"]},{\"id\":\"b1m2l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Zu Hause kann ich mich besser ___ die Arbeit konzentrieren.\",\"answers\":[\"auf\"],\"translation\":\"En casa me puedo concentrar mejor en el trabajo.\",\"hints\":[\"No es «in», aunque el español diga «en»\",\"sich konzentrieren + Akkusativ\"],\"itemIds\":[\"b1m2sichkonzentrierenauf\"],\"tip\":\"«concentrarse EN» → sich konzentrieren AUF + Akkusativ. Bloque cerrado: verbo + preposición + caso.\"},{\"id\":\"b1m2l3e6\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ob ich im Homeoffice arbeiten darf, hängt ___ meiner Chefin ab.\",\"answers\":[\"von\"],\"translation\":\"Que pueda teletrabajar depende de mi jefa.\",\"hints\":[\"abhängen + preposición fija, con Dativ\",\"«meiner Chefin» ya está en dativo: te lo chiva\"],\"itemIds\":[\"b1m2abhaengenvon\",\"a2m10chef\"],\"tip\":\"Fíjate en el prefijo: «hängt ... ab». El ab- viaja al final, aunque haya media frase en medio.\"},{\"id\":\"b1m2l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje del jefe al equipo\",\"text\":\"Wir führen die Gleitzeit ein, ___ alle Kollegen ihre Kinder in die Schule bringen können. Die Kernzeit bleibt, ___ Termine leichter zu planen. ___ es Probleme gibt, sprechen Sie bitte mit mir.\",\"answers\":[\"damit\",\"um\",\"Falls\"],\"bank\":[\"damit\",\"um\",\"Falls\",\"obwohl\",\"weil\",\"deshalb\"],\"translation\":\"Introducimos el horario flexible para que todos los compañeros puedan llevar a sus hijos al colegio. La franja obligatoria se mantiene para planificar mejor las citas. Si hay problemas, hable conmigo.\",\"itemIds\":[\"b1m2damit\",\"b1m2umzu\",\"b1m2falls\",\"b1m2gleitzeit\",\"b1m2kernzeit\"],\"tip\":\"Hueco 1: los que llevan a los niños son los compañeros, no la empresa → damit. Hueco 2: hay un «zu planen» detrás → um. Hueco 3: condición cauta → Falls.\"},{\"id\":\"b1m2l3e8\",\"type\":\"transform\",\"prompt\":\"De damit a um…zu\",\"source\":\"Ich arbeite von zu Hause, damit ich Zeit spare.\",\"instruction\":\"Dilo con «um … zu» (el sujeto es el mismo)\",\"answers\":[\"Ich arbeite von zu Hause, um Zeit zu sparen\"],\"translation\":\"Trabajo desde casa para ahorrar tiempo.\",\"hints\":[\"El sujeto repetido desaparece\",\"..., um Zeit zu ...\"],\"itemIds\":[\"b1m2umzu\",\"b1m2damit\"],\"tip\":\"Con el mismo sujeto, «damit» no es incorrecto pero suena pesado. um…zu es más corto y más natural: en el examen, mejor nota de Wortschatz.\"},{\"id\":\"b1m2l3e9\",\"type\":\"build\",\"prompt\":\"Construye con damit\",\"target\":\"Der Chef schreibt eine Mail, damit alle informiert sind\",\"translation\":\"El jefe escribe un correo para que todos estén informados\",\"distractors\":[\"um\",\"sind alle\"],\"itemIds\":[\"b1m2damit\",\"a2m10chef\"]},{\"id\":\"b1m2l3e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Falls es Probleme gibt, rufen Sie mich an\",\"translation\":\"Si hay problemas, llámeme\",\"hints\":[\"Empieza con la condición\",\"Falls es Probleme ...\"],\"itemIds\":[\"b1m2falls\"]},{\"id\":\"b1m2l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Trabajo desde casa para concentrarme mejor\",\"answers\":[\"Ich arbeite von zu Hause, um mich besser zu konzentrieren\",\"Ich arbeite zu Hause, um mich besser zu konzentrieren\"],\"hints\":[\"Mismo sujeto → um … zu, y el reflexivo va detrás de «um»\",\"..., um mich besser zu ...\"],\"itemIds\":[\"b1m2umzu\",\"b1m2sichkonzentrierenauf\"],\"tip\":\"«um mich besser zu konzentrieren»: el «zu» va pegado al infinitivo, al final del todo. Ese es el molde entero.\"},{\"id\":\"b1m2l3e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información a un grupo antes de una visita · tarea 1 de 2. Dos escuchas.\",\"audio\":\"So, bevor wir reingehen, drei Sachen. Erstens: Bleiben Sie bitte hinter der gelben Linie, damit die Gabelstapler freie Bahn haben. Zweitens: Falls der Alarm losgeht — und der ist wirklich laut —, gehen Sie ruhig zum Ausgang am Ende der Halle, nicht zurück zum Eingang. Und drittens: Fotos, ähm, nur hier vorne, um die Leute an den Maschinen nicht zu blenden. Alles klar? Dann los.\",\"question\":\"„Fotografieren ist überall in der Halle erlaubt.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Fotos, ähm, nur hier vorne»: solo en la parte delantera\",null],\"itemIds\":[\"b1m2umzu\"],\"tip\":\"«erstens, zweitens, drittens» te regala la estructura: tres bloques, un dato por bloque.\"},{\"id\":\"b1m2l3e13\",\"type\":\"audiomc\",\"prompt\":\"Mismas instrucciones, segunda tarea. Dos escuchas.\",\"audio\":\"
