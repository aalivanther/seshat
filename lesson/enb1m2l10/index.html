,\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T779,"])</script><script>self.__next_f.push([1,"Cada módulo de este curso cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e: una lección entera dedicada a UNA parte del LanguageCert. El módulo 1 se llevó el \u003cb\u003eListening Part 1\u003c/b\u003e; hoy toca el \u003cb\u003eReading Part 1\u003c/b\u003e. Antes del simulacro habrás pasado por las catorce partes del examen —diez del escrito, cuatro del oral— una a una.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué es:\u003c/b\u003e \u003cb\u003ecinco textos cortos\u003c/b\u003e —un anuncio, un cartel, una nota, un correo, una instrucción—, de \u003cb\u003e25 a 50 palabras\u003c/b\u003e cada uno, y en cada uno \u003cb\u003eun hueco\u003c/b\u003e con \u003cb\u003etres opciones\u003c/b\u003e. Cinco preguntas, cinco marks.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué se prueba, según el propio handbook:\u003c/b\u003e \u003ci\u003elayout, lexis, cohesive devices, coherence\u003c/i\u003e. Traducido: \u003cb\u003eno te van a preguntar por el tema del texto\u003c/b\u003e. Te van a preguntar por la \u003cb\u003epalabra de enganche\u003c/b\u003e — un conector, una preposición, un relativo, una palabra de referencia. Casi nunca es el sustantivo importante: es la palabra pequeña que sostiene la frase.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEstrategia, en tres pasos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eLee el texto entero antes de mirar el hueco.\u003c/b\u003e Y sobre todo mira \u003cb\u003edónde estaría pegado\u003c/b\u003e: un cartel de una puerta, un anuncio de trabajo y un correo no usan las mismas palabras. Eso es el \u003ci\u003elayout\u003c/i\u003e.\u003cbr/\u003e2. \u003cb\u003eMira qué va DETRÁS del hueco.\u003c/b\u003e ¿Una frase entera? ¿Un sustantivo? ¿Un verbo en -ing? La mitad de las opciones se caen solo por eso: \u003ci\u003edue to\u003c/i\u003e pide sustantivo, \u003ci\u003ealthough\u003c/i\u003e pide frase.\u003cbr/\u003e3. \u003cb\u003eLee la frase entera con tu opción puesta.\u003c/b\u003e Si tiene sentido pero contradice lo que dice el resto del texto, es la trampa: en el Part 1 las tres opciones son gramaticalmente posibles, y solo una es \u003cb\u003ecoherente\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY una nota sobre el inglés de los anuncios: se comen los verbos y los artículos. \u003ci\u003eNo experience necessary\u003c/i\u003e es «no se requiere experiencia»; \u003ci\u003eApply in writing\u003c/i\u003e es «diríjase por escrito». Hay que reconocerlo, no imitarlo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l10\",\"phaseId\":\"enb1m2\",\"title\":\"Exam lab: Reading Part 1\",\"subtitle\":\"Cinco textos cortos, un hueco cada uno, y la palabra que casi nunca es la que buscas\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El idioma de los anuncios\",\"itemIds\":[\"enb1m2vacancy\",\"enb1m2noexperience\",\"enb1m2applyinwriting\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 1, y por qué se falla\",\"body\":\"$17\",\"table\":[[\"Dónde lo lees\",\"Qué palabras esperar\"],[\"Un anuncio de trabajo\",\"wanted · necessary · required · apply · per hour\"],[\"Un cartel en una puerta\",\"please · until · do not · while\"],[\"Un correo de una agencia\",\"attached · however · if · could you\"],[\"Una nota entre compañeros\",\"anyway · by the way · so · but\"],[\"Un folleto informativo\",\"for people who · due to · in order to\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Reading Part 1, ¿qué tipo de palabra suele faltar en el hueco?\",\"options\":[\"Una palabra de enganche: conector, preposición o relativo\",\"El sustantivo más importante del texto\",\"Un verbo irregular en pasado\"],\"answer\":0,\"whyWrong\":[null,\"El sustantivo importante casi siempre está escrito: si faltara, el texto no se entendería y el ítem sería irresoluble.\",\"El Part 1 no prueba morfología verbal: prueba «cohesive devices» y coherencia.\"],\"itemIds\":[\"enbestreply\"],\"tip\":\"Regla de oro: mira qué va DETRÁS del hueco antes que lo que va delante. La estructura descarta opciones más rápido que el significado.\"},{\"id\":\"enb1m2l10e2\",\"type\":\"mc\",\"prompt\":\"Part 1 · texto 1 de 5 — un anuncio en el escaparate de una cafetería\",\"question\":\"«CAFÉ ASSISTANT WANTED. Twenty hours a week, mornings only. ___ experience necessary: full training given. Ask inside for an application form.»\",\"options\":[\"No\",\"Not\",\"Never\"],\"answer\":0,\"whyWrong\":[null,\"«Not» necesita un verbo al lado: «experience is not necessary». En el inglés de anuncio, sin verbo, va «No».\",\"«Never» habla de frecuencia, no de requisitos.\"],\"itemIds\":[\"enb1m2noexperience\",\"enb1m2jobinterview\"],\"tip\":\"«No + sustantivo» es la fórmula del cartel: «No experience necessary», «No parking», «No entry». Reconocerla vale un mark cada vez que aparece.\"},{\"id\":\"enb1m2l10e3\",\"type\":\"mc\",\"prompt\":\"Part 1 · texto 2 de 5 — un cartel en la puerta de una sala\",\"question\":\"«INTERVIEWS ARE HELD ON THURSDAYS. Please take a seat and wait here ___ your name is called. Do not knock on the door.»\",\"options\":[\"until\",\"since\",\"during\"],\"answer\":0,\"whyWrong\":[null,\"«since» marca desde cuándo, y aquí lo que se dice es hasta cuándo.\",\"«during» pide un sustantivo («during the interview»), no una frase con verbo.\"],\"itemIds\":[\"enb1m2jobinterview\"],\"tip\":\"Detrás del hueco hay una frase entera («your name is called»), así que «during» se cae sin leer el significado. Ese descarte por estructura es la mitad del Part 1.\"},{\"id\":\"enb1m2l10e4\",\"type\":\"mc\",\"prompt\":\"Part 1 · texto 3 de 5 — un correo de una agencia de empleo\",\"question\":\"«Thank you for sending your CV. We have passed it on to the manager. ___ you need to change any of your details, please ring us before Friday.»\",\"options\":[\"If\",\"Unless\",\"Although\"],\"answer\":0,\"whyWrong\":[null,\"«Unless» es «a menos que», y ya es negativo: saldría «a menos que necesites cambiarlo, llámanos», que es lo contrario.\",\"«Although» contrasta, y aquí no hay nada que contrastar: hay una condición.\"],\"itemIds\":[\"enb1m2cv\"],\"tip\":\"«Unless» está ahí para cazar a quien traduce «si» sin mirar. En el examen, prueba tu opción leyendo la frase entera: si el resultado dice lo contrario de lo que quiere el texto, es la trampa.\"},{\"id\":\"enb1m2l10e5\",\"type\":\"mc\",\"prompt\":\"Part 1 · texto 4 de 5 — un folleto en la biblioteca\",\"question\":\"«ENGLISH FOR WORK. A free evening course for people ___ want to change job but have no formal qualification. Ten weeks, starting in October.»\",\"options\":[\"who\",\"which\",\"whose\"],\"answer\":0,\"whyWrong\":[null,\"«which» es para cosas y sitios; «people» son personas.\",\"«whose» necesita un sustantivo detrás («whose English is good»), y aquí detrás va un verbo.\"],\"itemIds\":[\"enb1m2personwho\",\"enb1m2qualification\"],\"tip\":\"El relativo del módulo, ahora en formato examen. Y fíjate en el detalle que descarta «whose» sin pensar en el significado: detrás del hueco hay un verbo, no un sustantivo.\"},{\"id\":\"enb1m2l10e6\",\"type\":\"mc\",\"prompt\":\"Part 1 · texto 5 de 5 — una nota en el tablón del personal\",\"question\":\"«The shift pattern for December is now on the board. Anyone who cannot do their allocated shifts should speak to Priya this week, ___ we will assume the pattern is agreed.»\",\"options\":[\"otherwise\",\"due to\",\"in spite of\"],\"answer\":0,\"whyWrong\":[null,\"«due to» pide un sustantivo detrás, y aquí va una frase entera.\",\"«in spite of» también pide sustantivo o -ing, y además contrasta en vez de dar la consecuencia.\"],\"itemIds\":[\"enb1m2otherwise\",\"enb1m2shiftpattern\"],\"tip\":\"Cinco de cinco y ni un hueco de vocabulario técnico: conector, preposición, relativo y palabra de anuncio. Así es el Part 1 real.\"},{\"id\":\"enb1m2l10e7\",\"type\":\"match\",\"prompt\":\"Empareja el idioma de los anuncios\",\"pairs\":[{\"target\":\"a vacancy\",\"source\":\"una vacante\"},{\"target\":\"No experience necessary.\",\"source\":\"No se requiere experiencia.\"},{\"target\":\"Apply in writing to the Manager.\",\"source\":\"Diríjase por escrito a la encargada.\"},{\"target\":\"the advert\",\"source\":\"el anuncio\"}],\"itemIds\":[\"enb1m2vacancy\",\"enb1m2noexperience\",\"enb1m2applyinwriting\",\"enb1m2advert\"],\"tip\":\"Ojo con «advert»: no es «advertencia» (eso es «warning»). Es el anuncio, y en el habla se acorta a «ad».\"},{\"id\":\"enb1m2l10e8\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra del anuncio\",\"text\":\"There's a ___ at the library: they need a part-time assistant.\",\"answers\":[\"vacancy\"],\"translation\":\"Hay una vacante en la biblioteca: necesitan un auxiliar a media jornada.\",\"hints\":[\"Empieza por vac…\",\"va-can-cy\"],\"itemIds\":[\"enb1m2vacancy\"],\"tip\":\"«vacancy» también es la habitación libre de un hotel: los carteles de la carretera ponen «VACANCIES» o «NO VACANCIES». Misma palabra, dos mundos.\"},{\"id\":\"enb1m2l10e9\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el anuncio entero — cuatro huecos del Part 1\",\"text\":\"WANTED: café assistant. ___ experience necessary, ___ you must be able to work weekends. Apply ___ writing to the Manager ___ 30 September at the latest.\",\"answers\":[\"No\",\"but\",\"in\",\"before\"],\"bank\":[\"No\",\"but\",\"in\",\"before\",\"Not\",\"after\",\"on\"],\"translation\":\"SE BUSCA: auxiliar de cafetería. No se requiere experiencia, pero hay que poder trabajar los fines de semana. Diríjase por escrito a la encargada antes del 30 de septiembre.\",\"itemIds\":[\"enb1m2noexperience\",\"enb1m2applyinwriting\",\"enb1m2advert\"],\"tip\":\"Cuatro huecos y ni una palabra de contenido: dos gramaticales, una preposición fija («in writing») y un conector. Ese es exactamente el reparto del Part 1.\"},{\"id\":\"enb1m2l10e10\",\"type\":\"transform\",\"prompt\":\"Del inglés de anuncio al inglés de persona\",\"source\":\"No experience necessary.\",\"instruction\":\"Dilo con una frase entera\",\"answers\":[\"You do not need any experience\",\"You don't need any experience\",\"Experience is not necessary\",\"You don't need experience\"],\"translation\":\"No se requiere experiencia.\",\"hints\":[\"Empieza por «You…» y añade el verbo que falta\",\"You don't need ...\"],\"itemIds\":[\"enb1m2noexperience\"],\"tip\":\"El inglés de anuncio se come el verbo y el sujeto. Hay que entenderlo en el Reading, pero en el Writing se escribe entero: allí las frases sin verbo cuentan como error de gramática.\"},{\"id\":\"enb1m2l10e11\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"Según el anuncio, hay una vacante y no se requiere experiencia.\",\"answers\":[\"According to the advert, there's a vacancy and no experience is necessary\",\"According to the advert, there is a vacancy and no experience is necessary\",\"According to the advert, there's a vacancy and you don't need any experience\"],\"hints\":[\"Empieza por «According to…»\",\"According to the advert, there's a ... and ...\"],\"itemIds\":[\"enb1m2accordingto\",\"enb1m2vacancy\",\"enb1m2noexperience\",\"enb1m2advert\"],\"tip\":\"Dos laboratorios hechos, diez por delante. En el módulo 12 te sientas al examen entero sin sorpresas — y ese es todo el plan.\"},{\"id\":\"enb1m2l10e12\",\"type\":\"audiomc\",\"prompt\":\"Cierre en formato Listening: la llamada que cambia el módulo. Dos escuchas.\",\"audio\":\"Valeria? It's the library. We've had a look at the four applications and we'd like to offer you the post.|Really? Thank you — sorry, that's, um, that's brilliant.|You start on the fourth of May, twenty hours, evenings and Saturdays. One thing:
