mc\",\"prompt\":\"¿Verdadero o falso? (frase 7)\",\"question\":\"„Nico kauft die Tabletten im Geschäft.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Frase 7: las compra in der Apotheke — los medicamentos nunca se compran en un Geschäft\",null],\"itemIds\":[\"tablette\",\"apotheke\"]},{\"id\":\"f8l6e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 3)\",\"question\":\"¿Por qué llama Nico a la Praxis?\",\"options\":[\"Necesita una cita\",\"Quiere comprar pastillas\",\"Quiere bailar\"],\"answer\":0,\"whyWrong\":[null,\"Las pastillas vienen después, en la Apotheke\",\"El baile llega al final — cuando ya está sano\"],\"itemIds\":[\"anrufen\",\"ichbraucheeinentermin\"]},{\"id\":\"f8l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 3 (verbo separable)\",\"text\":\"Nico ruft die Praxis ___.\",\"answers\":[\"an\"],\"translation\":\"Nico llama al consultorio.\",\"hints\":[\"anrufen es separable, como anprobieren\",\"La partícula va al final\"],\"itemIds\":[\"anrufen\",\"praxis\"],\"tip\":\"anrufen = llamar por teléfono: Ich rufe ... an. La partícula an cierra la frase.\"},{\"id\":\"f8l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 6\",\"text\":\"„___ Sorge!“, sagt der Arzt. (¡no se preocupe!)\",\"answers\":[\"Keine\"],\"translation\":\"«¡No se preocupe!», dice el médico.\",\"hints\":[\"La forma femenina de kein, con un sustantivo femenino\",\"K-e-i-n-e\"],\"itemIds\":[\"keinesorge\",\"sagen\",\"arzt\"],\"tip\":\"Keine Sorge = literalmente «ninguna preocupación». Chunk de calma instantánea.\"},{\"id\":\"f8l6e6\",\"type\":\"build\",\"prompt\":\"Construye la receta del médico (frase 6)\",\"target\":\"Nehmen Sie die Tabletten und bleiben Sie im Bett\",\"translation\":\"Tome las pastillas y quédese en la cama\",\"distractors\":[\"nimmst\",\"bleibst\"],\"itemIds\":[\"nehmensie\",\"bleibensie\",\"tablette\"],\"tip\":\"El imperativo formal de la lección 4, tal cual lo dice el médico de Nico.\"},{\"id\":\"f8l6e7\",\"type\":\"listen\",\"prompt\":\"Escucha la frase 8 (parte final)\",\"text\":\"Es geht mir besser\",\"translation\":\"Estoy mejor / Me va mejor\",\"hints\":[\"Cuatro palabras\",\"besser = mejor, con doble s\"],\"itemIds\":[\"besser\"]},{\"id\":\"f8l6e8\",\"type\":\"cloze\",\"prompt\":\"Completa el final feliz (frase 8)\",\"text\":\"Am Donnerstag ist Nico wieder ___. (sano)\",\"answers\":[\"gesund\"],\"translation\":\"El jueves Nico está sano otra vez.\",\"hints\":[\"Lo contrario de krank\",\"wieder g-e-s-u-n-d = sano de nuevo\"],\"itemIds\":[\"gesund\",\"wieder\"]},{\"id\":\"f8l6e9\",\"type\":\"type\",\"prompt\":\"Cuenta la escena (verbo separable)\",\"question\":\"Nico llama al médico\",\"answers\":[\"Nico ruft den Arzt an\"],\"hints\":[\"anrufen se separa: ruft ... an\",\"der Arzt en acusativo: den Arzt\"],\"itemIds\":[\"anrufen\",\"arzt\"],\"tip\":\"anrufen pide acusativo directo: den Arzt, die Praxis — sin preposición, no como el español «llamar A».\"},{\"id\":\"f8l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¡No te preocupes! Estoy mejor\",\"answers\":[\"Keine Sorge! Es geht mir besser\",\"Keine Sorge, es geht mir besser\"],\"hints\":[\"El chunk de calma + el chunk de mejora\",\"Keine Sorge! Es geht mir ...\"],\"itemIds\":[\"keinesorge\",\"besser\"],\"tip\":\"Como Nico: de krank a gesund en una fase. Y si todo falla — Tanzen ist Medizin.\"}]}],\"resources\":[{\"label\":\"Goethe — Fotogeschichte «Beim Arzt»\",\"url\":\"https://www.goethe.de/prj/mwd/de/deu/fot.html\",\"note\":\"Revive la historia de Nico en fotos: la visita al médico completa, del síntoma a la receta.\"},{\"label\":\"lingua.com — lecturas A1\",\"url\":\"https://lingua.com/german/reading/\",\"note\":\"Busca los textos sobre salud y rutina: comprensión lectora al nivel de este cuento.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\
