s\u003c/u\u003e: \u003ci\u003eDeshalb \u003cb\u003emelde\u003c/b\u003e ich mich an.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Coordinantes\u003c/b\u003e (und, aber, oder, denn, sondern): \u003cu\u003eno mueven nada\u003c/u\u003e. \u003ci\u003eIch lerne viel, \u003cb\u003edenn\u003c/b\u003e ich will die Prüfung bestehen.\u003c/i\u003e ¡Ojo! \u003ci\u003edenn\u003c/i\u003e = weil pero sin mover el verbo.\u003cbr/\u003e\u003cbr/\u003eEl español no marca ninguna de las tres diferencias: «porque», «por eso» y «pues» se comportan igual. Por eso \u003cb\u003e*Deshalb ich melde mich an\u003c/b\u003e es el error más frecuente del B1 escrito.\u003cbr/\u003e\u003cbr/\u003eY de propina, la rección: \u003cb\u003esich anmelden für\u003c/b\u003e + Akk · \u003cb\u003eteilnehmen an\u003c/b\u003e + Dat · \u003cb\u003esich bewerben um\u003c/b\u003e + Akk · \u003cb\u003esich interessieren für\u003c/b\u003e + Akk. Se memorizan en bloque, con la preposición pegada."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m6l5\",\"phaseId\":\"b1m6\",\"title\":\"Clínica: ¿al final o inversión?\",\"subtitle\":\"Las tres familias de conectores, de una vez y para siempre\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Verbos de matrícula con su preposición pegada\",\"itemIds\":[\"b1m6sichanmeldenfuer\",\"b1m6teilnehmenan\",\"b1m6sichbewerbenum\",\"b1m6sichinteressierenfuer\",\"b1m6volkshochschule\",\"b1m6gebuehr\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El diagnóstico: tres familias, tres efectos\",\"body\":\"$17\",\"table\":[[\"familia\",\"conectores\",\"verbo\"],[\"subordinantes\",\"weil, obwohl, damit, falls, während, seitdem\",\"AL FINAL\"],[\"adverbiales\",\"deshalb, trotzdem, außerdem, danach\",\"justo detrás (inversión)\"],[\"coordinantes\",\"und, aber, oder, denn, sondern\",\"no se mueve\"],[\"par peligroso\",\"obwohl ≠ trotzdem\",\"final ≠ inversión\"],[\"par peligroso\",\"weil ≠ denn\",\"final ≠ nada\"]]}},{\"kind\":\"exercises\" olkshochschule.\",\"Außerdem lerne ich Spanisch in der Volkshochschule\"],\"why\":\"außerdem también es adverbio de posición 1 → inversión: Außerdem lerne ich… Todos los de su familia funcionan igual: deshalb, trotzdem, danach, deswegen.\",\"translation\":\"Además estudio español en la escuela de adultos.\",\"itemIds\":[\"b1m6ausserdem\",\"b1m6volkshochschule\"]},{\"id\":\"b1m6l5e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el texto con el banco (mira dónde está el verbo)\",\"text\":\"Ich lerne Deutsch, ___ ich hier arbeiten will. ___ habe ich mich an der Volkshochschule angemeldet. ___ der Kurs teuer ist, mache ich weiter.\",\"answers\":[\"weil\",\"Deshalb\",\"Obwohl\"],\"bank\":[\"weil\",\"Deshalb\",\"Obwohl\",\"Denn\",\"Damit\",\"dass\"],\"translation\":\"Aprendo alemán porque quiero trabajar aquí. Por eso me he apuntado a la escuela de adultos. Aunque el curso es caro, sigo.\",\"itemIds\":[\"b1m6obwohl\",\"b1m6deshalbmeldeich\",\"b1m6volkshochschule\"],\"tip\":\"Hueco 2: detrás viene «habe ich» — inversión, o sea adverbio. Hueco 3: detrás «der Kurs teuer ist» — verbo al final, o sea subordinante. El orden te dice la respuesta.\"},{\"id\":\"b1m6l5e6\",\"type\":\"gapbank\",\"prompt\":\"Segundo banco: el plan de estudios\",\"text\":\"___ ich in Deutschland wohne, mache ich jedes Jahr einen Kurs. Ich lerne abends, ___ meine Kinder schlafen. ___ nehme ich im Sommer an einem Intensivkurs teil.\",\"answers\":[\"Seitdem\",\"während\",\"Außerdem\"],\"bank\":[\"Seitdem\",\"während\",\"Außerdem\",\"Obwohl\",\"Falls\",\"Damit\"],\"translation\":\"Desde que vivo en Alemania hago un curso cada año. Estudio por las noches mientras mis hijos duermen. Además, en verano participo en un curso intensivo.\",\"itemIds\":[\"b1m6seitdem\",\"b1m6waehrend\",\"b1m6ausserdem\",\"b1m6teilnehmenan\"]},{\"id\":\"b1m6l5e7\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich nehme ___ einem Deutschkurs teil.\",\"answers\":[\"an\"],\"translation\":\"Participo en un curso de alemán.\",\"hints\":[\"teilnehmen pide siempre la misma preposición + Dativo\",\"a...\"],\"itemIds\":[\"b1m6teilnehmenan\"],\"tip\":\"teilnehmen an + Dativ. Se aprende en bloque: teilnehmen-an, como una sola palabra.\"},{\"id\":\"b1m6l5e8\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich bewerbe mich ___ einen Ausbildungsplatz.\",\"answers\":[\"um\"],\"translation\":\"Me presento a una plaza de formación.\",\"hints\":[\"sich bewerben + preposición + Akkusativ\",\"u...\"],\"itemIds\":[\"b1m6sichbewerbenum\",\"b1m6ausbildungsplatz\"]},{\"id\":\"b1m6l5e9\",\"type\":\"type\",\"prompt\":\"Pregunta por una COSA\",\"question\":\"«¿Por qué te interesas?» con sich interessieren für\",\"answers\":[\"Wofür interessierst du dich?\",\"Wofür interessieren Sie sich?\"],\"hints\":[\"Para cosas: wo + für, en una sola palabra\",\"Wo + für ...\"],\"itemIds\":[\"b1m6sichinteressierenfuer\"],\"tip\":\"Personas: Für wen interessierst du dich? · Cosas: Wofür interessierst du dich? Y la respuesta corta: Dafür.\"},{\"id\":\"b1m6l5e10\",\"type\":\"transform\",\"prompt\":\"Transforma: cambia de familia\",\"source\":\"Obwohl der Kurs teuer ist, mache ich ihn.\",\"instruction\":\"Dilo con trotzdem (dos frases)\",\"answers\":[\"Der Kurs ist teuer. Trotzdem mache ich ihn\",\"Der Kurs ist teuer. Trotzdem mache ich ihn.\",\"Der Kurs ist teuer, trotzdem mache ich ihn\"],\"translation\":\"El curso es caro. Aun así lo hago.\",\"hints\":[\"trotzdem → el verbo se le pega detrás\",\"Der Kurs ist teuer. Trotzdem ...\"],\"itemIds\":[\"b1m6trotzdem\",\"b1m6obwohl\",\"b1m6gebuehr\"]},{\"id\":\"b1m6l5e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera (cambia de familia)\",\"source\":\"Ich lerne viel, weil ich die Prüfung bestehen will.\",\"forbid\":[\"weil\"],\"answers\":[\"Ich lerne viel, denn ich will die Prüfung bestehen\",\"Ich lerne viel, denn ich will die Prüfung bestehen.\",\"Ich lerne viel, denn ich möchte die Prüfung bestehen\",\"Ich will die Prüfung bestehen. Deshalb lerne ich viel\",\"Ich will die Prüfung bestehen. Deshalb lerne ich viel.\",\"Ich will die Prüfung bestehen. Darum lerne ich viel\",\"Ich will die Prüfung bestehen. Deswegen lerne ich viel\"],\"translation\":\"Estudio mucho porque quiero aprobar el examen.\",\"hints\":[\"Sin weil: prueba denn (no mueve nada) o deshalb (inversión)\",\"Ich lerne viel, denn ich ... / ... Deshalb lerne ich ...\"],\"itemIds\":[\"b1m6deshalbmeldeich\",\"b1m6bestanden\"],\"tip\":\"Decir lo mismo con tres sintaxis distintas es el rango que mide el examen. Y de paso te salva cuando te bloqueas.\"},{\"id\":\"b1m6l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Por eso me apunto al curso de alemán\",\"answers\":[\"Deshalb melde ich mich für den Deutschkurs an\",\"Deshalb melde ich mich für den Deutschkurs an.\",\"Deshalb melde ich mich zum Deutschkurs an\"],\"hints\":[\"Deshalb + verbo pegado detrás · sich anmelden für + Akkusativ\",\"Deshalb melde ich mich ...\"],\"itemIds\":[\"b1m6deshalbmeldeich\",\"b1m6sichanmeldenfuer\",\"b1m6sprachkurs\"],\"tip\":\"Inversión y rección en una sola frase corta. Si te salió del tirón, este módulo ya está trabajando.\"},{\"id\":\"b1m6l5e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · Carmen deja un mensaje a su vecina Mira · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Hey Mira, ich bin's, Carmen. Du, ich hab's gemacht: Ich hab mich gestern angemeldet, für den Abendkurs, weil ich vormittags arbeiten muss. Die Kleine ist bis vier in der Krippe, und der Kurs fängt erst um sechs an — das klappt also, ähm, auch wenn's eng wird. Zwei Jahre dauert das Ganze. Klingt lang, ich weiß. Aber ohne den Abschluss komm ich nirgendwo weiter. Meld dich mal!\",\"question\":\"„Carmen hat sich für den Vormittagskurs angemeldet.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«für den Abendkurs, weil ich vormittags arbeiten muss»: por las mañanas trabaja\",null],\"itemIds\":[\"b1m6weilarbeitenmuss\",\"b1m6krippe\"],\"tip\":\"Dos horas en el mensaje, dos horas distintas: las cuatro (guardería) y las seis (curso). El examen mete siempre un número de más para que te lleves el equivocado.\"},{\"id\":\"b1m6l5e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Hey Mira, ich bin's, Carmen. Du, ich hab's gemacht: Ich hab mich gestern angemeldet, für den Abendkurs, weil ich vormittags arbeiten muss. Die Kleine ist bis vier in der Krippe, und der Kurs fängt erst um sechs an — das klappt also, ähm, auch wenn's eng wird. Zwei Jahre dauert das Ganze. Klingt lang, ich weiß. Aber ohne den Abschluss komm ich nirgendwo weiter. Meld dich mal!\",\"question\":\"¿Cómo ve Carmen los dos años que dura?\",\"options\":[\"Largos, pero sin el título no avanza\",\"Demasiado largos: va a dejarlo\",\"Cortos para lo que quiere conseguir\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«Klingt lang, ich weiß» es una concesión, no una renuncia\",\"No dice en ningún momento que se le queden cortos\"],\"itemIds\":[\"b1m6obwohl\",\"b1m6abschluss\"],\"tip\":\"«Klingt lang, ich weiß. Aber…» es el patrón concesión + postura, hablado. Cópialo tal cual en el Sprechen: suena adulto y te ahorra un «aber» a secas.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m6-4\",\"book\":\"Ich komme nicht, weil ich keine Zeit habe.\",\"real\":\"Ich komm nicht — weil, ich hab keine Zeit.\",\"meaning\":\"No voy, es que no tengo tiempo\",\"when\":\"Se oye a diario en toda Alemania, con esa pausa antes de la explicación. Hablando con amigos pasa desapercibido; por escrito, nunca: un «weil» con el verbo en segunda posición se corrige como error de orden y te baja la banda en el Schreiben. Si lo que quieres es ese orden, el conector es denn: «Ich komme nicht, denn ich habe keine Zeit».\",\"register\":\"amigos\",\"exam\":\"Ich kann leider nicht kommen, weil ich keine Zeit habe.\",\"note\":\"Con la pausa el hablante deja de subordinar y arranca una frase nueva: ahí «weil» funciona como el «es que» español. Los mismos alemanes que lo dicen te lo marcan en rojo si lo escribes — por eso esta tarjeta es solo para reconocerla, no para copiarla.\",\"sound\":\"ij kom nijt — vail, ij hab KAI-ne tsait\",\"level\":\"b1\"}}],\"resources\":[{\"label\":\"Libreta B1 — Orden de la frase\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"La tabla conector → posición del verbo es la página que más veces vas a abrir del nivel.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
