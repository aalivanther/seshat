8oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T522,Dos citas, igual que en el A1, pero el examen ha crecido. El \u003cb\u003eescrito\u003c/b\u003e dura 1 h 40: \u003cb\u003eListening\u003c/b\u003e (~20 min, 4 partes, 26 preguntas, y \u003cb\u003etodo se oye dos veces\u003c/b\u003e) y, sin pausa, \u003cb\u003eReading\u003c/b\u003e (4 partes, 26 preguntas) + \u003cb\u003eWriting\u003c/b\u003e (2 textos de \u003cb\u003e30-50 palabras\u003c/b\u003e) en 1 h 20 seguidos. El \u003cb\u003eoral\u003c/b\u003e son \u003cb\u003e9 minutos\u003c/b\u003e en 4 partes; se graba y lo puntúa un examinador que no estuvo en la sala, así que hablar claro vale más que hablar bonito. Se aprueba con \u003cb\u003e75 de 150\u003c/b\u003e —ese es [[the pass mark|el corte de aprobado]]— y a partir de \u003cb\u003e101\u003c/b\u003e el certificado dice \u003cb\u003eHigh Pass\u003c/b\u003e. El corte que el handbook publica es \u003cb\u003eese, el del total\u003c/b\u003e: 75 sobre la suma de Listening, Reading y Writing. Lo que \u003cb\u003eno\u003c/b\u003e publica en esa tabla es si hay además un mínimo por destreza — así que no lo sabemos, y no saberlo no es lo mismo que saber que no lo hay. Consecuencia práctica, y es la única que importa: \u003cb\u003eno dejes una destreza en blanco confiando en que las otras la levanten\u003c/b\u003e. Contesta las 26 del Reading y escribe los dos textos aunque vayas mal de tiempo, que cada tarea del Writing vale \u003cb\u003e12 marcas\u003c/b\u003e y dejar una sin hacer es tirar una tarea entera. Y el \u003cb\u003eoral se puntúa aparte\u003c/b\u003e, con su propio corte (25 de 50): ahí no hay compensación posible, es otro certificado.18:T42c,Esto se dice una vez y claro. El syllabus oficial de LanguageCert reparte la gramática en columnas, y hay cinco cosas que estudiaste en este curso que viven en la columna de \u003cb\u003eB1\u003c/b\u003e, no en la de A2:\u003cbr/\u003e\u003cbr/\u003e· el \u003cb\u003epast continuous\u003c/b\u003e (\u003ci\u003eI was waiting\u003c/i\u003e) del módulo 3,\u003cbr/\u003e· \u003cb\u003eshould / shouldn't\u003c/b\u003e del módulo 8,\u003cbr/\u003e· el \u003cb\u003epresent perfect\u003c/b\u003e entero (\u003ci\u003ehave you ever…\u003c/i\u003e, \u003ci\u003ejust\u003c/i\u003e, \u003ci\u003eyet\u003c/i\u003e, \u003ci\u003efor\u003c/i\u003e, \u003ci\u003esince\u003c/i\u003e) del módulo 10,\u003cbr/\u003e· \u003cb\u003ewill / won't\u003c/b\u003e y el \u003cb\u003eprimer condicional\u003c/b\u003e del módulo 11.\u003cbr/\u003e\u003cbr/\u003eEn el examen no te van a puntuar por usarlos ni te van a penalizar por no usarlos: \u003cb\u003eno entran\u003c/b\u003e. ¿Y entonces por qué están en el curso? Porque \u003cb\u003eentender es gratis\u003c/b\u003e: en el Listening y en el Reading salen igual, dichos por ingleses que no consultan syllabus, y quien los reconoce no se queda en blanco. Y porque el B1 empieza exactamente ahí. Lo único que no se hace es \u003cb\u003eapostar la nota\u003c/b\u003e a ellos: si dudas entre \u003ci\u003eI have finished\u003c/i\u003e y \u003ci\u003eI finished\u003c/i\u003e el día del examen, escribe \u003cb\u003eI finished\u003c/b\u003e y sigue."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l1\",\"phaseId\":\"ena2m12\",\"title\":\"The A2 exam, up close\",\"subtitle\":\"El mapa del A2 Access — y, con todas las letras, qué NO entra\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras que verás en todas las hojas\",\"itemIds\":[\"ena2m12thepassmark\",\"ena2m12ahighpass\",\"ena2m12theinstructions\",\"ena2m12readthequestionsfirst\",\"ena2m12checkyouranswers\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El A2 Access, por dentro\",\"body\":\"$17\",\"table\":[[\"Parte\",\"Tiempo\",\"Qué haces\"],[\"Listening\",\"~20 min\",\"4 partes · 26 ítems (7-7-6-6) · todo ×2\"],[\"
