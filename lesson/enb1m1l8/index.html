e rent went up. \u003cb\u003eTherefore,\u003c/b\u003e I moved out.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso de nivel, que no te va a dar ningún libro:\u003c/b\u003e \u003ci\u003ehowever\u003c/i\u003e no es una novedad del B1 — es A2, ya lo tienes. Y hay una familia entera que suena muy culta y que \u003cb\u003ees B2\u003c/b\u003e: \u003ci\u003emoreover, furthermore, whereas, as a result, in conclusion\u003c/i\u003e. Meterlos en un texto de B1 no sube la nota; lo que la sube es usar bien los de tu nivel: \u003cb\u003ealthough, though, despite, in spite of, unless, while, since, therefore, otherwise, besides, for instance, due to\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l8\",\"phaseId\":\"enb1m1\",\"title\":\"Although, despite, unless\",\"subtitle\":\"Los conectores que sostienen 110 palabras — y la carta a Emma\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los conectores del nivel\",\"itemIds\":[\"enb1m1although\",\"enb1m1despite\",\"enb1m1therefore\",\"enb1m1besides\",\"enb1m1unless\",\"enb1m1forinstance\",\"enb1m1neighbourhood\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: qué va detrás de cada conector\",\"body\":\"$17\",\"table\":[[\"Conector\",\"Qué va detrás\",\"Ejemplo\"],[\"although / though\",\"frase entera\",\"Although the flat is small…\"],[\"despite / in spite of\",\"sustantivo o -ing\",\"Despite the high rent…\"],[\"unless\",\"frase en afirmativo\",\"…unless the rent goes down.\"],[\"therefore / besides\",\"coma y frase nueva\",\"Therefore, I moved out.\"],[\"for instance\",\"un ejemplo\",\"…for instance, the noise.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l8e1\",\"type\":\"bucket\",\"prompt\":\"¿Le sigue una FRASE o un SUSTANTIVO?\",\"categories\":[\"+ frase entera (…it is small)\",\"+ sustantivo o -ing (…the noise)\"],\"items\":[{\"text\":\"although\",\"bucket\":0},{\"text\":\"though\",\"bucket\":0},{\"text\":\"unless\",\"bucket\":0},{\"text\":\"while\",\"bucket\":0},{\"text\":\"despite\",\"bucket\":1},{\"text\":\"in spite of\",\"bucket\":1},{\"text\":\"because of\",\"bucket\":1},{\"text\":\"due to\",\"bucket\":1}],\"itemIds\":[\"enb1m1although\",\"enb1m1despite\",\"enb1m1unless\"],\"tip\":\"Es la decisión que más veces se falla del grupo, y no tiene nada que ver con el significado: «although» y «despite» significan lo mismo y piden cosas distintas.\"},{\"id\":\"enb1m1l8e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Although the flat is small, but it's very bright.\",\"answers\":[\"Although the flat is small, it's very bright.\"],\"why\":\"«although» ya hace el trabajo de «pero»: uno de los dos sobra. En español «aunque… , pero…» se oye; en inglés es un error de manual.\",\"translation\":\"Aunque el piso es pequeño, es muy luminoso.\",\"itemIds\":[\"enb1m1although\"]},{\"id\":\"enb1m1l8e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Despite of the high rent, I took the flat.\",\"answers\":[\"Despite the high rent, I took the flat.\",\"In spite of the high rent, I took the flat.\"],\"why\":\"O «despite» sin nada, o «in spite of» entero. «Despite of» es la mezcla de los dos y no existe — es el error más frecuente del grupo entero.\",\"translation\":\"A pesar del alquiler alto, cogí el piso.\",\"itemIds\":[\"enb1m1despite\"]},{\"id\":\"enb1m1l8e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I won't move unless the rent doesn't go down.\",\"answers\":[\"I won't move unless the rent goes down.\"],\"why\":\"«unless» ya significa «a menos que NO»: la negación está dentro. Ponerla otra vez le da la vuelta al sentido.\",\"translation\":\"No me mudo a menos que baje el alquiler.\",\"itemIds\":[\"enb1m1unless\"]},{\"id\":\"enb1m1l8e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo con los conectores\",\"text\":\"The room is tiny. ___, it's the cheapest one in the area and the neighbours are lovely. ___ I earn more now, I don't want to pay four hundred pounds extra. ___ the noise from the pub downstairs, I'm happy here. I won't move ___ the rent goes up again.\",\"answers\":[\"Besides\",\"Although\",\"Despite\",\"unless\"],\"bank\":[\"Besides\",\"Although\",\"Despite\",\"unless\",\"because\",\"therefore\",\"while\"],\"translation\":\"La habitación es diminuta. Además, es la más barata de la zona y los vecinos son encantadores. Aunque ahora gano más, no quiero pagar cuatrocientas libras de más. A pesar del ruido del pub de abajo, estoy a gusto aquí. No me mudo a menos que vuelva a subir el alquiler.\",\"itemIds\":[\"enb1m1besides\",\"enb1m1although\",\"enb1m1despite\",\"enb1m1unless\"],\"tip\":\"Fíjate en lo que hay DETRÁS de cada hueco antes de elegir: frase entera, sustantivo, o coma. La gramática decide, no el significado.\"},{\"id\":\"enb1m1l8e6\",\"type\":\"transform\",\"prompt\":\"Mismo sentido, otra estructura\",\"source\":\"Although the rent was high, I took the flat.\",\"instruction\":\"Dilo con «despite» (recuerda: detrás va sustantivo)\",\"answers\":[\"Despite the high rent, I took the flat\",\"Despite the high rent I took the flat\",\"In spite of the high rent, I took the flat\"],\"translation\":\"A pesar del alquiler alto, cogí el piso.\",\"hints\":[\"Hay que convertir la frase en un sustantivo\",\"Despite the high ..., I took the flat\"],\"itemIds\":[\"enb1m1despite\",\"enb1m1although\"],\"tip\":\"Poder decir la misma idea con las dos estructuras es exactamente lo que el examen llama «range of grammar». Y se entrena así, transformando.\"},{\"id\":\"enb1m1l8e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «although»\",\"source\":\"Although the flat is small, it's very bright.\",\"forbid\":[\"although\",\"though\"],\"answers\":[\"The flat is small, but it's very bright\",\"Despite its size, the flat is very bright\",\"The flat is small; however, it's very bright\"],\"translation\":\"Aunque el piso es pequeño, es muy luminoso.\",\"hints\":[\"Con «but» y dos frases\",\"O con «despite» y un sustantivo\"],\"itemIds\":[\"enb1m1although\",\"enb1m1despite\"],\"tip\":\"Tres formas de decir lo mismo y las tres son de tu nivel. Ojo: «however» ya lo traías del A2 — no es la novedad del B1 que muchos libros venden.\"},{\"id\":\"enb1m1l8e8\",\"type\":\"mc\",\"prompt\":\"El aviso de nivel\",\"question\":\"¿Cuál de estos NO es un conector de B1?\",\"options\":[\"for instance\",\"furthermore\",\"otherwise\"],\"answer\":1,\"whyWrong\":[\"Es B1: introduce un ejemplo.\",null,\"Es B1: «si no, de lo contrario».\"],\"itemIds\":[\"enb1m1forinstance\"],\"tip\":\"«furthermore» y «moreover» son B2. Ponerlos en un texto de B1 no sube la nota: lo que la sube es que los tuyos estén bien usados.\"},{\"id\":\"enb1m1l8e9\",\"type\":\"cloze\",\"prompt\":\"Completa el conector\",\"text\":\"The rent went up by ninety pounds. ___, I decided to move out.\",\"answers\":[\"Therefore\"],\"translation\":\"El alquiler subió noventa libras. Por eso decidí mudarme.\",\"hints\":[\"Consecuencia, y con coma detrás\",\"The-re-fore\"],\"itemIds\":[\"enb1m1therefore\"],\"tip\":\"«Therefore» abre frase y lleva coma. Esa coma no es estética: en LanguageCert la puntuación va DENTRO del criterio de Organisation.\"},{\"id\":\"enb1m1l8e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, te escribe. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! I can't believe it's been two years since you arrived. How's the new flat? Are you still at the café, or have you found something else? I've got a few days off in November — could I come down and stay?\"},\"bullets\":[\"Dile cuánto llevas en Londres y en el piso (present perfect).\",\"Cuéntale una cosa que ya ha cambiado y una que sigue igual (already / still / yet).\",\"Dile que sí y propón un plan concreto para su visita.\"],\"checks\":[{\"re\":\"(i'?ve|i have) (been|lived)\",\"label\":\"Dices cuánto llevas aquí, en present perfect\"},{\"re\":\"\\\\b(already|still|yet)\\\\b\",\"label\":\"Contrastas lo que ha cambiado y lo que no\"},{\"re\":\"(you can come|come in|come down|stay|visit)\",\"label\":\"Aceptas la visita y propones un plan\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea de alegría por saber de ella\",\"Punto 1 — el tiempo: «I've been in London for… and I've lived in this flat since…»\",\"Punto 2 — el contraste: «I've already… , and I'm still…» / «I haven't… yet»\",\"Punto 3 — la visita: «Of course you can come in November!» + un plan concreto\",\"Cierre corto y tu nombre. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"though\",\"since\",\"besides\",\"therefore\",\"otherwise\",\"unless\",\"for instance\",\"of course\",\"at least\",\"anyway\",\"despite\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nIt's lovely to hear from you! I've been in London for two years now, and I've lived in this flat since March. Although the room is small, it's bright and the bills are included, so I can't complain. Amy and I get on really well.\\nThings have changed a lot. I've already passed my B1 course at the college, and I'm still at the café, although I've applied for a job at the library. I haven't heard anything yet.\\nOf course you can come in November! Since you love markets, we could go to Brick Lane on the Sunday. Let me know your dates.\\nValeria\",\"itemIds\":[\"enb1m1although\",\"enb1m1already\",\"enb1m1still\",\"enb1m1notyet\",\"enb1m1havelivedhere\",\"enb1m1getonwith\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo — tres conectores distintos (although, since, of course) y ni un «Yours sincerely». Meter la despedida formal en una carta a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m1l8e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Aunque el barrio es ruidoso, no me mudo a menos que suba el alquiler.\",\"answers\":[\"Although the neighbourhood is noisy, I won't move unless the rent goes up\",\"Although the neighbourhood is noisy, I'm not moving unless the rent goes up\"],\"hints\":[\"«although» + frase entera\",\"«unless» + verbo en afirmativo\"],\"itemIds\":[\"enb1m1although\",\"enb1m1unless\",\"enb1m1neighbourhood\"],\"tip\":\"Dos conectores de contraste y condición en una sola frase, cada uno con lo que le toca detrás. Eso ya no lo escribe un A2.\"},{\"id\":\"enb1m1l8e12\",\"type\":\"audiomc\",\"prompt\":\"LISTENING EN FORMATO REAL · pregunta 1 de 3. Esto ya no es un clip de veinte segundos: son dos voces y varios datos seguidos, como el Part 2 del examen. Usa el cuaderno mientras suena — en el examen también se puede.\",\"notepad\":true,\"audio\":\"Right, so, you've seen the room. Any questions before you decide?|Yes, a few, actually. The advert said a hundred and sixty a week — is that with the bills?|It is, yes. Gas, electricity, water and the internet. The council tax is separate, though; that's about thirty pounds a month each, between the three of you.|Right. And the deposit?|Five weeks, which is the legal maximum. It goes into a government scheme, so it isn't sitting in my account. You get it back when you leave, unless something's broken.|And how long is the contract?|Twelve months normally, although I'd be happy with two years if you'd prefer. The last tenant was here for three years, and honestly, I'd rather not be looking for someone every winter.|Two years would suit me, actually. One more thing — the room upstairs was a bit damp last time I looked.|That was the old window. I had it replaced in September, so it's been dry since then. If it comes back, you ring me and I'll deal with it.\",\"question\":\"¿Qué NO entra en las 160 libras semanales?\",\"options\":[\"El internet\",\"El impuesto municipal\",\"El agua\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Sí entra: está en la lista de «gas, electricity, water and the internet».\",null,\"También entra, en la misma lista.\"],\"itemIds\":[\"enb1m1billsincluded\",\"enb1m1counciltax\",\"enb1m1rent\"],\"tip\":\"«The council tax is separate, though» — ese «though» al final de la frase es un «pero» pospuesto, muy británico y muy hablado. Cuando lo oigas, viene la excepción.\"},{\"id\":\"enb1m1l8e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo audio · pregunta 2 de 3. Dos escuchas.\",\"notepad\":true,\"audio\":\"Right, so, you've seen the room. Any questions before you decide?|Yes, a few, actually. The advert said a hundred and sixty a week — is that with the bills?|It is, yes. Gas, electricity, water and the internet. The council tax is separate, though; that's about thirty pounds a month each, between the three of you.|Right. And the deposit?|Five weeks, which is the legal maximum. It goes into a government scheme, so it isn't sitting in my account. You get it back when you leave, unless something's broken.|And how long is the contract?|Twelve months normally, although I'd be happy with two years if you'd prefer. The last tenant was here for three years, and honestly, I'd rather not be looking for someone every winter.|Two years would suit me, actually. One more thing — the room upstairs was a bit damp last time I looked.|That was the old window. I had it replaced in September, so it's been dry since then. If it comes back, you ring me and I'll deal with it.\",\"question\":\"¿Por qué prefiere la casera un contrato de dos años?\",\"options\":[\"Porque no quiere buscar inquilino cada invierno\",\"Porque la ley se lo exige\",\"Porque así puede subir el alquiler antes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La ley solo aparece a propósito de la fianza: «the legal maximum».\",\"Justo lo contrario: un contrato largo le congela el alquiler.\"],\"itemIds\":[\"enb1m1although\",\"enb1m1landlord\"],\"tip\":\"La respuesta llega detrás de «and honestly…». En las conversaciones reales, el motivo verdadero casi nunca va en la primera frase: va detrás de una muletilla.\"},{\"id\":\"enb1m1l8e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo audio · pregunta 3 de 3. Esta cae al final: si has llegado despierto hasta aquí, ya tienes la resistencia que pide el examen.\",\"audio\":\"Right, so, you've seen the room. Any questions before you decide?|Yes, a few, actually. The advert said a hundred and sixty a week — is that with the bills?|It is, yes. Gas, electricity, water and the internet. The council tax is separate, though; that's about thirty pounds a month each, between the three of you.|Right. And the deposit?|Five weeks, which is the legal maximum. It goes into a government scheme, so it isn't sitting in my account. You get it back when you leave, unless something's broken.|And how long is the contract?|Twelve months normally, although I'd be happy with two years if you'd prefer. The last tenant was here for three years, and honestly, I'd rather not be looking for someone every winter.|Two years would suit me, actually. One more thing — the room upstairs was a bit damp last time I looked.|That was the old window. I had it replaced in September, so it's been dry since then. If it comes back, you ring me and I'll deal with it.\",\"question\":\"¿Qué dice la casera sobre la humedad?\",\"options\":[\"Que cambió la ventana y desde entonces está seco\",\"Que la humedad es normal en esa habitación\",\"Que la arreglará antes de que entre la nueva inquilina\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No la normaliza: la explica y dice que está resuelta.\",\"No promete arreglarla: dice que ya está arreglada.\"],\"itemIds\":[\"enb1m1damp\",\"enb1m1sincemarch\"],\"tip\":\"«it's been dry since then» — perfecto + since. El tiempo verbal es la respuesta: si dijera «it was dry», no sabrías si sigue seco hoy.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Writing (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Descarga el Practice Paper 1 y compara tus dos textos con las tareas oficiales: la formal de 70-100 y la informal de 100-120.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
