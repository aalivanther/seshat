,\"body\":\"Después de los cincuenta verbos irregulares de \u003ci\u003eena2m2\u003c/i\u003e, esto es un regalo. La lista completa de comparativos irregulares del A2 cabe aquí:\u003cbr/\u003e\u003cbr/\u003e• good → \u003cb\u003ebetter\u003c/b\u003e → the \u003cb\u003ebest\u003c/b\u003e\u003cbr/\u003e• bad → \u003cb\u003eworse\u003c/b\u003e → the \u003cb\u003eworst\u003c/b\u003e\u003cbr/\u003e• far → \u003cb\u003efurther\u003c/b\u003e (o \u003ci\u003efarther\u003c/i\u003e: las dos valen)\u003cbr/\u003e\u003cbr/\u003eY ya está. \u003ci\u003eMore good\u003c/i\u003e y \u003ci\u003emore bad\u003c/i\u003e no existen, igual que en español no decimos «más bueno que» cuando queremos decir «mejor que».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuidado con dos sonidos:\u003c/b\u003e [[worse|peor]] se dice «uées», con la vocal larga de \u003ci\u003ework\u003c/i\u003e, no «uors». Y \u003cb\u003ebetter\u003c/b\u003e en boca británica es «BÉ-ta»: la doble t del medio suena a t normal y la -er del final es esa «a» floja de la que hablaremos en la clínica.\u003cbr/\u003e\u003cbr/\u003eY ojo al calco de significado: en español «peor» también sirve para «más mal hecho», pero el inglés reparte. \u003ci\u003eworse\u003c/i\u003e compara la \u003cb\u003ecalidad\u003c/b\u003e o el \u003cb\u003eestado\u003c/b\u003e: \u003ci\u003eThe weather was worse\u003c/i\u003e, \u003ci\u003eI feel worse today\u003c/i\u003e.\",\"table\":[[\"adjetivo\",\"comparativo\",\"superlativo\"],[\"good\",\"better\",\"the best\"],[\"bad\",\"worse\",\"the worst\"],[\"far\",\"further / farther\",\"the furthest\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"than / that: un «que» español que en inglés son dos\",\"body\":\"Esta es la trampa de escritura más frecuente del nivel, y la más silenciosa: \u003cb\u003esuena bien y está mal\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eEn español, «que» hace dos trabajos distintos con la misma palabra:\u003cbr/\u003e• \u003cb\u003ecomparar\u003c/b\u003e: «este es mejor \u003cu\u003eque\u003c/u\u003e aquel»\u003cbr/\u003e• \u003cb\u003eencabezar una subordinada\u003c/b\u003e: «creo \u003cu\u003eque\u003c/u\u003e es mejor»\u003cbr/\u003e\u003cbr/\u003eEl inglés usa \u003cb\u003edos palabras distintas\u003c/b\u003e:\u003cbr/\u003e• comparar → \u003cb\u003ethan\u003c/b\u003e: \u003ci\u003eThis one is better \u003cb\u003ethan\u003c/b\u003e that one.\u003c/i\u003e\u003cbr/\u003e• subordinada → \u003cb\u003ethat\u003c/b\u003e: \u003ci\u003eI think \u003cb\u003ethat\u003c/b\u003e this one is better.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eComo en el habla rápida las dos se pronuncian igual de flojas («dan», «dat»), el oído no te va a salvar: esto se arregla mirándolo al escribir. \u003cb\u003eY en el examen escrito penaliza\u003c/b\u003e, porque el corrector lo lee como error de gramática básica.\u003cbr/\u003e\u003cbr/\u003eRegla de bolsillo: \u003cb\u003esi delante hay un comparativo (algo con -er, con more, o better/worse), va THAN.\u003c/b\u003e En cualquier otro sitio, that.\",\"table\":[[\"español\",\"inglés\",\"por qué\"],[\"mejor que este\",\"better than this one\",\"hay comparación\"],[\"más grande que el mío\",\"bigger than mine\",\"hay comparación\"],[\"creo que es mejor\",\"I think that it's better\",\"es una subordinada\"],[\"la diferencia es que…\",\"the difference is that…\",\"es una subordinada\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l3e1\",\"type\":\"mc\",\"prompt\":\"«Mejor»\",\"question\":\"El comparativo de good es…\",\"options\":[\"better\",\"gooder\",\"more good\"],\"answer\":0,\"whyWrong\":[null,\"good es de los que cambian entero, no de los que añaden -er\",\"Ni con more ni con -er: good tiene forma propia\"],\"itemIds\":[\"ena2m4goodbetterbest\"]},{\"id\":\"ena2m4l3e2\",\"type\":\"match\",\"prompt\":\"Empareja cada forma con su significado\",\"pairs\":[{\"target\":\"better\",\"source\":\"mejor\"},{\"target\":\"worse\",\"source\":\"peor\"},{\"target\":\"further\",\"source\":\"más lejos\"},{\"target\":\"the best\",\"source\":\"el mejor / la mejor\"}],\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4badworseworst\",\"ena2m4further\"]},{\"id\":\"ena2m4l3e3\",\"type\":\"bucket\",\"prompt\":\"¿Este adjetivo sigue la regla o tiene forma propia?\",\"categories\":[\"sigue la regla (-er / more)\",\"tiene forma propia\"],\"items\":[{\"text\":\"good\",\"bucket\":1},{\"text\":\"cheap\",\"bucket\":0},{\"text\":\"bad\",\"bucket\":1},{\"text\":\"expensive\",\"bucket\":0},{\"text\":\"far\",\"bucket\":1},{\"text\":\"big\",\"bucket\":0}],\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4badworseworst\",\"ena2m4further\"],\"tip\":\"Tres frente a todos los demás. Después de los irregulares del pasado, esta lista es prácticamente un descanso.\"},{\"id\":\"ena2m4l3e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el comparativo de good\",\"text\":\"Sam's coffee is ___ than the coffee at the station.\",\"answers\":[\"better\"],\"translation\":\"El café de Sam es mejor que el de la estación.\",\"hints\":[\"No lleva -er ni more: cambia la palabra entera\",\"b…\"],\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4itsbetterthan\",\"enstation\"]},{\"id\":\"ena2m4l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el comparativo de bad\",\"text\":\"The weather was ___ than last year.\",\"answers\":[\"worse\"],\"translation\":\"El tiempo estuvo peor que el año pasado.\",\"hints\":[\"Se dice «uées», con vocal larga\",\"w…\"],\"itemIds\":[\"ena2m4badworseworst\",\"ena2m4worsethanlastyear\",\"ena2m1lastyear\"]},{\"id\":\"ena2m4l3e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el comparativo de más\",\"wrong\":\"This one is more better than that one.\",\"answers\":[\"This one is better than that one.\"],\"why\":\"better ya ES el comparativo de good: lleva el «más» dentro. Ponerle more delante es como decir «más mejor». Y en inglés «more better» suena tan raro como suena en español.\",\"translation\":\"Este es mejor que ese.\",\"itemIds\":[\"ena2m4itsbetterthan\"]},{\"id\":\"ena2m4l3e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «que» equivocado\",\"wrong\":\"Sam's coffee is better that Mr Patel's.\",\"answers\":[\"Sam's coffee is better than Mr Patel's.\"],\"why\":\"Delante hay un comparativo (better), así que el «que» es THAN. THAT se guarda para las subordinadas: «I think that Sam's coffee is better». En español las dos son «que» y por eso se cruzan al escribir.\",\"translation\":\"El café de Sam es mejor que el del señor Patel.\",\"itemIds\":[\"ena2m4than\",\"ena2m4itsbetterthan\"],\"tip\":\"Cuando revises un texto en el examen, busca cada «than» y cada «that» y pregúntate: ¿hay una comparación delante? Es un repaso de diez segundos que salva puntos.\"},{\"id\":\"ena2m4l3e8\",\"type\":\"mc\",\"prompt\":\"¿than o that?\",\"question\":\"«Creo que este es mejor que el otro» es…\",\"options\":[\"I think that this one is better than the other one.\",\"I think than this one is better that the other one.\",\"I think that this one is better that the other one.\"],\"answer\":0,\"whyWrong\":[null,\"Las dos cambiadas: la subordinada pide that y la comparación pide than\",\"La subordinada está bien; la comparación necesita than\"],\"itemIds\":[\"ena2m4than\",\"ena2m4itsbetterthan\"],\"tip\":\"En la misma frase caben las dos, y con esa frase se entiende de golpe: think THAT (subordinada) … better THAN (comparación).\"},{\"id\":\"ena2m4l3e9\",\"type\":\"transform\",\"prompt\":\"De la descripción a la comparación\",\"source\":\"This café is good.\",\"instruction\":\"Compáralo con el de la estación, usando better than\",\"answers\":[\"This café is better than the café at the station.\",\"This café is better than the one at the station.\"],\"translation\":\"Este café es mejor que el de la estación.\",\"hints\":[\"good no admite ni -er ni more\",\"This café is b… th… the one at the station.\"],\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4itsbetterthan\",\"enstation\"]},{\"id\":\"ena2m4l3e10\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"source\":\"It's much better than the other one, and it isn't further.\",\"answers\":[\"Es mucho mejor que el otro, y no está más lejos.\",\"Es mucho mejor que la otra, y no está más lejos.\"],\"itemIds\":[\"ena2m4itsbetterthan\",\"ena2m4further\",\"ena2m4muchcheaper\"],\"tip\":\"much better, much worse, much further: el much delante del comparativo funciona con los irregulares igual que con los demás.\"},{\"id\":\"ena2m4l3e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — cuidado con la vocal de worse\",\"text\":\"The coffee is better here, but the weather is worse.\",\"phonetic\":\"de KO-fi is̬ BÉ-ta jía, bat de UÉ-da is̬ UÉES\",\"translation\":\"El café es mejor aquí, pero el tiempo es peor.\",\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4badworseworst\",\"ena2m4worsethanlastyear\"],\"tip\":\"worse rima con first y con work: es esa vocal larga de la boca a medio abrir. Si te sale «uors», estás leyendo la R, y aquí no suena.\"},{\"id\":\"ena2m4l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Esta tienda es mejor que la otra, pero está más lejos.\",\"answers\":[\"This shop is better than the other one, but it's further.\",\"This shop is better than the other one but it's further.\",\"This shop is better than the other shop, but it's further.\"],\"hints\":[\"Dos irregulares en la misma frase\",\"This shop is b… th… the other one, but it's f…\"],\"itemIds\":[\"ena2m4goodbetterbest\",\"ena2m4further\",\"ena2m4than\",\"enshop\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m4-2\",\"book\":\"That's much better.\",\"real\":\"That's way better.\",\"meaning\":\"Eso está mucho mejor\",\"when\":\"Con amigos y compañeros, comparando cualquier cosa: una foto, una versión, un sitio. Es informal pero muy corriente en Reino Unido. En el examen escrito, much better: way better te marcaría el registro como demasiado coloquial.\",\"register\":\"amigos\",\"note\":\"way delante de un comparativo es «mucho» subido de tono: way cheaper, way worse, way too expensive.\",\"sound\":\"dats uéi BÉ-ta\",\"level\":\"a2\",\"itemId\":\"ena2m4itsbetterthan\"}}],\"resources\":[{\"label\":\"British Council — Comparative and superlative adjectives\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/comparative-superlative-adjectives\",\"note\":\"Busca la tabla de irregulares y compruébalo: son tres. Lo demás de la página es la lección de mañana.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
