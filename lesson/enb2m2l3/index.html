e es otro calco.\u003cbr/\u003e\u003cbr/\u003eY la escala de la cantidad, que es tarjeta Nativo: \u003ci\u003ea lot of money\u003c/i\u003e (B1) · \u003ci\u003ea fortune\u003c/i\u003e (calle) · \u003ci\u003ea [[considerable sum|cantidad considerable]]\u003c/i\u003e (informe).\",\"table\":[[\"Contable\",\"Incontable\",\"Calco\"],[\"fewer meetings\",\"less overtime\",\"less meetings / fewer money\"],[\"fewer hours\",\"less pay\",\"\"],[\"the same as last month\",\"—\",\"the same than\"],[\"rather than commuting\",\"—\",\"rather than to commute\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l3e1\",\"type\":\"bucket\",\"prompt\":\"¿fewer o less?\",\"categories\":[\"fewer — contable en plural\",\"less — incontable\"],\"items\":[{\"text\":\"meetings\",\"bucket\":0},{\"text\":\"overtime\",\"bucket\":1},{\"text\":\"hours\",\"bucket\":0},{\"text\":\"money\",\"bucket\":1},{\"text\":\"deductions\",\"bucket\":0},{\"text\":\"work\",\"bucket\":1},{\"text\":\"payslips\",\"bucket\":0},{\"text\":\"pay\",\"bucket\":1}],\"itemIds\":[\"enb2m2fewer\",\"enb2m2lessovertime\"]},{\"id\":\"enb2m2l3e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"There were less meetings than last month.\",\"answers\":[\"There were fewer meetings than last month.\"],\"why\":\"Meetings se cuentan: fewer. Less va con incontables (overtime, money, work). «Menos» en español no te ayuda: hay que mirar si el nombre tiene plural.\",\"translation\":\"Hubo menos reuniones que el mes pasado.\",\"itemIds\":[\"enb2m2fewer\"]},{\"id\":\"enb2m2l3e3\",\"type\":\"errorfix\",\"prompt\":\"Otro calco, otra pieza\",\"wrong\":\"Rather than to commute, she walks.\",\"answers\":[\"Rather than commuting, she walks.\",\"Rather than commute, she walks.\"],\"why\":\"Rather than lleva -ing (o el infinitivo pelado, en algunos registros). No lleva to. El calco es tratarlo como «más que ir a».\",\"translation\":\"En vez de ir y volver en transporte, va andando.\",\"itemIds\":[\"enb2m2ratherthan\"]},{\"id\":\"enb2m2l3e4\",\"type\":\"errorfix\",\"prompt\":\"The same… ¿as o than?\",\"wrong\":\"The take-home pay is the same than last month.\",\"answers\":[\"The take-home pay is the same as last month.\"],\"why\":\"The same AS. Than va con comparativos (more than, fewer than). El calco es «el mismo que».\",\"translation\":\"El líquido es el mismo que el mes pasado.\",\"itemIds\":[\"enb2m2thesameas\",\"enb2m2takehomepay\"]},{\"id\":\"enb2m2l3e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el resumen de la primera semana\",\"text\":\"There were ___ meetings than Nadia had warned. There was ___ overtime than Valeria had feared. The take-home pay was not ___ to live on without the café hours, so, ___ than dropping the café, she kept both. It is not even a ___ sum.\",\"answers\":[\"fewer\",\"less\",\"enough\",\"rather\",\"considerable\"],\"bank\":[\"fewer\",\"less\",\"enough\",\"rather\",\"considerable\",\"than\",\"more\"],\"translation\":\"Hubo menos reuniones de las que Nadia había avisado. Hubo menos horas extra de las que Valeria temía. El líquido no daba para vivir sin las horas del café, así que, en vez de dejar el café, mantuvo los dos. No es un dineral. Ni siquiera es una cantidad considerable. Es lo mismo que el mes pasado en el café, más dos tardes.\",\"itemIds\":[\"enb2m2fewer\",\"enb2m2lessovertime\",\"enb2m2enoughto\",\"enb2m2ratherthan\",\"enb2m2considerablesum\",\"enb2m2thesameas\"],\"tip\":\"Seis huecos, seis decisiones. «Than» está en el banco para the same than, que es el calco. El último hueco es as.\"},{\"id\":\"enb2m2l3e6\",\"type\":\"transform\",\"prompt\":\"De la finita a rather than + -ing\",\"source\":\"She does not commute. She walks.\",\"instruction\":\"Una frase con rather than + -ing\",\"answers\":[\"Rather than commuting, she walks\",\"Rather than commuting, she walks.\",\"She walks rather than commuting\"],\"translation\":\"En vez de ir y volver en transporte, va andando.\",\"itemIds\":[\"enb2m2ratherthan\"]},{\"id\":\"enb2m2l3e7\",\"type\":\"paraphrase\",\"prompt\":\"Sin «a lot of money» — sube el registro\",\"source\":\"They paid her a lot of money.\",\"forbid\":[\"a lot\",\"lots\",\"plenty\"],\"answers\":[\"They paid her a considerable sum\",\"They paid her a considerable sum.\",\"They paid her a considerable amount\"],\"translation\":\"Le pagaron una cantidad considerable.\",\"itemIds\":[\"enb2m2considerablesum\",\"enb2m2natafortune\"]},{\"id\":\"enb2m2l3e8\",\"type\":\"mc\",\"prompt\":\"enough to live on\",\"question\":\"«The pay is enough to live on.» ¿Qué hace «on» ahí?\",\"options\":[\"Va pegado a live: se vive on a salary. No se puede quitar.\",\"Es un adorno: enough to live ya bastaría.\",\"Es un error: debería ser enough for live.\"],\"answer\":0,\"whyWrong\":[null,\"Sin on, «live» queda cojo: ¿vivir dónde, de qué?\",\"Enough for living se oye, pero enough to live on es la pieza.\"],\"itemIds\":[\"enb2m2enoughto\"]},{\"id\":\"enb2m2l3e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Menos reuniones que el mes pasado, menos horas extra de las que esperaba.\",\"answers\":[\"Fewer meetings than last month, less overtime than I expected.\",\"Fewer meetings than last month and less overtime than I expected.\"],\"hint\":\"fewer + contable, less + incontable\",\"itemIds\":[\"enb2m2fewer\",\"enb2m2lessovertime\"]},{\"id\":\"enb2m2l3e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la no finita\",\"text\":\"Rather than commuting, she walks.\",\"phonetic\":\"RÁA-dha dhan ka-MIÚU-ting, shi uooks\",\"translation\":\"En vez de ir y volver en transporte, va andando.\",\"itemIds\":[\"enb2m2ratherthan\"]},{\"id\":\"enb2m2l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No es un dineral. Es una cantidad considerable.\",\"answers\":[\"It is not a fortune. It is a considerable sum.\",\"It's not a fortune. It's a considerable sum.\",\"It is not a fortune; it is a considerable sum.\"],\"itemIds\":[\"enb2m2natafortune\",\"enb2m2considerablesum\"]},{\"id\":\"enb2m2l3e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Ben, en la parada. Pregunta antes del play. Dos escuchas.\",\"audio\":\"I did fewer late shifts this month, so less overtime. It's not a fortune, Valeria. It's enough to live on if I don't take the car. Rather than moaning, I walk the last stop. Same as last month, give or take a tenner.\",\"question\":\"¿Qué ha hecho Ben en vez de quejarse?\",\"options\":[\"Andar la última parada\",\"Pedir más horas extra\",\"Comparar su sueldo con el de Valeria\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ha hecho MENOS extra, no más.\",\"Eso es la conversación incómoda de la L9, no esta.\"],\"itemIds\":[\"enb2m2fewer\",\"enb2m2lessovertime\",\"enb2m2ratherthan\",\"enb2m2enoughto\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"typ
