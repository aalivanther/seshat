 · dar feedback y preguntar (16 pts)\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Proponer, reaccionar y cerrar el trato\",\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzwashaeltstdudavon\",\"b1m12gzsehedasanders\",\"b1m12gzabgemacht\",\"b1m10derkompromiss\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El Teil 1 no premia hablar bien: premia INTERACTUAR\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l8e1\",\"type\":\"mc\",\"prompt\":\"Qué se puntúa de verdad en el Teil 1\",\"question\":\"Tu pareja propone ir el sábado. Tú tenías pensado el domingo. ¿Qué haces?\",\"options\":[\"Sigues con tu plan y dices el tuyo entero\",\"Reaccionas a su propuesta, explicas tu problema y contrapropones\",\"Aceptas sin decir nada para no complicarte\"],\"answer\":1,\"whyWrong\":[\"Monologar hunde el criterio Interaktion, que en este Teil pesa tanto como Erfüllung\",null,\"Aceptar sin argumentar tampoco es interactuar: no hay negociación\"],\"itemIds\":[\"b1m12gzwashaeltstdudavon\",\"b1m12gzsehedasanders\"],\"tip\":\"«Samstag passt mir leider nicht, weil… Wie wäre es am Sonntag?» — reaccionar + razón + contrapropuesta. Ese es el molde.\"},{\"id\":\"b1m12l8e2\",\"type\":\"match\",\"prompt\":\"Empareja las fórmulas del Teil 1\",\"pairs\":[{\"target\":\"Wollen wir uns um acht treffen?\",\"source\":\"proponer una hora\"},{\"target\":\"Was hältst du davon?\",\"source\":\"pedirle su opinión a tu pareja\"},{\"target\":\"Das sehe ich anders.\",\"source\":\"discrepar con cortesía\"},{\"target\":\"Abgemacht!\",\"source\":\"cerrar el acuerdo\"}],\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzwashaeltstdudavon\",\"b1m12gzsehedasanders\",\"b1m12gzabgemacht\"]},{\"id\":\"b1m12l8e3\",\"type\":\"bucket\",\"prompt\":\"¿Es una propuesta o una reacción a la propuesta del otro?\",\"categories\":[\"Vorschlag machen\",\"Auf einen Vorschlag reagieren\"],\"items\":[{\"text\":\"Wie wäre es, wenn wir am Sonntag fahren?\",\"bucket\":0},{\"text\":\"Das ist eine gute Idee, aber es ist teuer.\",\"bucket\":1},{\"text\":\"Ich hätte einen Vorschlag: Wir bringen Kuchen mit.\",\"bucket\":0},{\"text\":\"Da bin ich mir nicht sicher.\",\"bucket\":1},{\"text\":\"Sollen wir uns am Bahnhof treffen?\",\"bucket\":0},{\"text\":\"Einverstanden, machen wir das so.\",\"bucket\":1}],\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzabgemacht\",\"a2einverstanden\"],\"tip\":\"Un buen Teil 1 alterna las dos columnas. Si solo produces la izquierda, estás monologando.\"},{\"id\":\"b1m12l8e4\",\"type\":\"cloze\",\"prompt\":\"Propón una hora\",\"text\":\"Wollen wir uns um acht ___?\",\"answers\":[\"treffen\"],\"translation\":\"¿Quedamos a las ocho?\",\"hints\":[\"El infinitivo cierra la frase\",\"tr___\"],\"itemIds\":[\"b1m12gzwollenwir\"]},{\"id\":\"b1m12l8e5\",\"type\":\"gapbank\",\"prompt\":\"Completa la negociación\",\"text\":\"— ___ wir am Samstag fahren? — Samstag passt mir leider nicht. ___ es am Sonntag? — Gute Idee. Dann finden wir einen ___: Sonntag, aber früh. — ___!\",\"answers\":[\"Wollen\",\"Wie wäre\",\"Kompromiss\",\"Abgemacht\"],\"bank\":[\"Wollen\",\"Wie wäre\",\"Kompromiss\",\"Abgemacht\",\"Verpflichtung\",\"Vielleicht\"],\"translation\":\"— ¿Vamos el sábado? — El sábado no me viene bien. ¿Y el domingo? — Buena idea. Entonces llegamos a un acuerdo: domingo, pero temprano. — ¡Trato hecho!\",\"hints\":[\"El acuerdo intermedio es masculino: einen …\",\"«Verpflichtung» es femenina (die) y además significa otra cosa\"],\"itemIds\":[\"b1m12gzwollenwir\",\"b1m10derkompromiss\",\"b1m12gzabgemacht\"]},{\"id\":\"b1m12l8e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la colocación\",\"wrong\":\"Wir haben einen Kompromiss gemacht.\",\"answers\":[\"Wir haben einen Kompromiss gefunden.\",\"Wir haben einen Kompromiss gefunden\"],\"why\":\"einen Kompromiss FINDEN (o schließen), nunca «machen». Y ojo al falso amigo: «der Kompromiss» es un acuerdo intermedio, no un compromiso adquirido (eso es «die Verpflichtung»).\",\"translation\":\"Llegamos a un acuerdo intermedio.\",\"itemIds\":[\"b1m10derkompromiss\"]},{\"id\":\"b1m12l8e7\",\"type\":\"mc\",\"prompt\":\"Teil 3: lo que más se olvida\",\"question\":\"Tu pareja termina su presentación. ¿Qué tienes que hacer, obligatoriamente?\",\"options\":[\"Solo escuchar y esperar tu turno\",\"Darle feedback Y hacerle una pregunta\",\"Corregirle los errores de gramática\"],\"answer\":1,\"whyWrong\":[\"Callarse en el Teil 3 son 16 puntos regalados\",null,\"Corregir a tu pareja no puntúa y además no es tu papel\"],\"itemIds\":[\"b1m12gzhaettefrage\"],\"tip\":\"La pregunta al compañero es obligatoria y puntúa. Llévala preparada: «Ich hätte noch eine Frage: …» sirve para cualquier tema.\"},{\"id\":\"b1m12l8e8\",\"type\":\"match\",\"prompt\":\"Empareja las fórmulas del feedback (Teil 3)\",\"pairs\":[{\"target\":\"Mir hat besonders gut gefallen, dass …\",\"source\":\"Me ha gustado especialmente que…\"},{\"target\":\"Interessant fand ich deinen Punkt über …\",\"source\":\"Me pareció interesante tu punto sobre…\"},{\"target\":\"Ich hätte noch eine Frage:\",\"source\":\"Tengo una pregunta más:\"},{\"target\":\"Wie ist das in deinem Land?\",\"source\":\"¿Y en tu país cómo es?\"}],\"itemIds\":[\"b1m12gzhaettefrage\",\"b1m12gzheimatland\"],\"tip\":\"Dos frases de feedback + una pregunta. Con eso el Teil 3 está resuelto y son 16 puntos.\"},{\"id\":\"b1m12l8e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3: dos personas planifican algo — es tu propio Sprechen Teil 1, pero oído. UNA sola escucha y la tarea del examen: afirmación en alemán, Richtig o Falsch. (Aquí van dos; las siete seguidas las tienes en la lección «Hören Teil 3 y 4».)\",\"audio\":\"Also, wir sollen zusammen einen Abschied für Mira organisieren. Wollen wir am Freitag oder lieber am Samstag? | Freitag passt mir leider nicht, da arbeite ich bis acht. Wie wär's am Samstagnachmittag? | Einverstanden. Und wo? Ich hätt einen Vorschlag: bei mir im Garten, dann kostet es nichts. Was hältst du davon? | Gute Idee. Aber wenn es regnet, stehen wir im Nassen. | Stimmt. Dann fragen wir zur Sicherheit im Café nebenan, ob sie den hinteren Raum haben. | Abgemacht. Und was schenken wir ihr? | Etwas von uns allen zusammen. Einzelne Geschenke fand ich beim letzten Mal ziemlich unpersönlich.\",\"question\":\"Die beiden einigen sich auf den Samstagnachmittag.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Wie wär’s am Samstagnachmittag?» — «Einverstanden». Propuesta, aceptación y acuerdo cerrado\"],\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzabgemacht\"],\"tip\":\"Escucha el ciclo completo: proponer, rechazar con motivo, contraproponer, cerrar. Eso es exactamente lo que puntúa como Interaktion cuando el que habla eres tú.\"},{\"id\":\"b1m12l8e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3, segunda tarea del mismo diálogo. Una escucha.\",\"audio\":\"Also, wir sollen zusammen einen Abschied für Mira organisieren. Wollen wir am Freitag oder lieber am Samstag? | Freitag passt mir leider nicht, da arbeite ich bis acht. Wie wär's am Samstagnachmittag? | Einverstanden. Und wo? Ich hätt einen Vorschlag: bei mir im Garten, dann kostet es nichts. Was hältst du davon? | Gute Idee. Aber wenn es regnet, stehen wir im Nassen. | Stimmt. Dann fragen wir zur Sicherheit im Café nebenan, ob sie den hinteren Raum haben. | Abgemacht. Und was schenken wir ihr? | Etwas von uns allen zusammen. Einzelne Geschenke fand ich beim letzten Mal ziemlich unpersönlich.\",\"question\":\"Sie fragen im Café nach, weil der Garten zu klein ist.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"El motivo es la lluvia: «Aber wenn es regnet, stehen wir im Nassen». Del tamaño del jardín no se dice nada\",null],\"itemIds\":[\"b1m12gzwashaeltstdudavon\",\"b1m10derkompromiss\"],\"tip\":\"«Dann fragen wir zur Sicherheit im Café nebenan» es un compromiso de manual: ni tu plan ni el mío, un plan B. Guárdate la fórmula para el Teil 1 del oral.\"},{\"id\":\"b1m12l8e9\",\"type\":\"speak\",\"prompt\":\"Léelo en voz alta — la frase que abre tu turno del Teil 3\",\"text\":\"Mir hat besonders gut gefallen, dass du Beispiele gegeben hast.\",\"phonetic\":\"mia jat be-ZON-das guut gue-FA-len, das du BAI-shpii-le gue-GUEE-ben jast\",\"translation\":\"Me ha gustado especialmente que hayas puesto ejemplos.\",\"itemIds\":[\"b1m12gzhaettefrage\"]},{\"id\":\"b1m12l8e10\",\"type\":\"paraphrase\",\"prompt\":\"Di lo mismo sin la fórmula de siempre\",\"source\":\"Wollen wir uns um acht treffen?\",\"forbid\":[\"Wollen\",\"treffen\"],\"answers\":[\"Wie wäre es um acht?\",\"Passt es dir um acht?\",\"Hättest du um acht Zeit?\",\"Wie wäre es denn um acht?\"],\"translation\":\"¿Quedamos a las ocho?\",\"hints\":[\"Wie wäre es …?\",\"Passt es dir …?\"],\"itemIds\":[\"b1m12gzwollenwir\"],\"tip\":\"Tener tres formas de proponer lo mismo es exactamente lo que mide el criterio «Wortschatz: Spektrum» del oral.\"},{\"id\":\"b1m12l8e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El sábado no me viene bien, ¿qué te parece el domingo?\",\"answers\":[\"Samstag passt mir leider nicht, wie wäre es am Sonntag?\",\"Samstag passt mir leider nicht. Wie wäre es am Sonntag?\",\"Der Samstag passt mir leider nicht, wie wäre es am Sonntag?\"],\"hints\":[\"passt mir (nicht) = «me viene (mal)»\",\"Wie wäre es am …?\"],\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzsehedasanders\"],\"tip\":\"Rechazar + contraproponer en una sola frase: es LA frase del Teil 1. Apréndetela de memoria.\"},{\"id\":\"b1m12l8e14\",\"type\":\"speak\",\"prompt\":\"En voz alta — el ciclo entero del Teil 1 en una sola frase: reaccionar, objetar y contraproponer.\",\"text\":\"Das ist eine gute Idee, aber der Samstag passt mir leider nicht. Wie wäre es am Sonntag?\",\"phonetic\":\"das ist AI-ne GUU-te i-DEE, AA-ba dea ZAMS-taak past mia LAI-da nijt. vii VEE-re es am ZON-taak\",\"translation\":\"Es buena idea, pero el sábado no me viene bien. ¿Qué tal el domingo?\",\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzsehedasanders\"],\"tip\":\"Dilo tres veces seguidas hasta que salga sin pensar. Es la frase que salva el criterio Interaktion: reconoce lo del otro, pone tu problema y devuelve una propuesta — todo sin decir «nein».\"},{\"id\":\"b1m12l8e15\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 1 hablando de verdad, no eligiendo opciones: planificáis algo entre dos, 2-3 minutos y 28 puntos. Estás solo, así que HABLA LOS DOS PAPELES en voz alta: propones, tu compañera objeta (invéntale la objeción) y tú reaccionas, contrapropones y cierras. Cada punto tiene que pasar por el ciclo entero.\",\"topic\":\"Gemeinsam etwas planen: Ihr wollt Tobias im Krankenhaus besuchen. Plant den Besuch zu zweit.\",\"slides\":[{\"title\":\"1 · Wann besuchen wir ihn?\",\"hint\":\"Propón día y hora con «Ich hätte einen Vorschlag: …» o «Wollen wir …?». Ponle a tu compañera una objeción real («Da arbeite ich bis vier») y resuélvela tú con «Wie wäre es, wenn …?».\"},{\"title\":\"2 · Wie kommen wir hin?\",\"hint\":\"Dos opciones y un motivo para cada una: S-Bahn, Auto, Fahrrad. Reacciona antes de proponer: «Gute Idee, aber …».\"},{\"title\":\"3 · Was bringen wir mit?\",\"hint\":\"Propón algo, que la otra voz lo descarte por una razón concreta (en la planta no se admiten flores) y contrapropón: «Sollen wir ihm stattdessen … kaufen?».\"},{\"title\":\"4 · Wie können wir ihm helfen?\",\"hint\":\"Repartíos el trabajo: «Ich könnte …, und würdest du …?». Repartir tareas es negociar, y aquí es donde puntúa Interaktion.\"},{\"title\":\"5 · Punkt offen + Abschluss\",\"hint\":\"Añade un punto que no está en la lista (avisar a alguien, llevarle los apuntes) y cierra el acuerdo repitiéndolo entero: «Dann also Samstag, halb fünf, Eingang. — Abgemacht!»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"He hecho al menos CUATRO propuestas con Wollen wir…? / Sollen wir…? / Wie wäre es, wenn…? / Ich hätte einen Vorschlag\",\"He puesto al menos DOS objeciones en boca de mi compañera y las he resuelto con una contrapropuesta\",\"He reaccionado a cada propuesta ANTES de soltar la mía (Gute Idee, aber… / Das sehe ich anders)\",\"He tratado los cuatro Leitpunkte y he añadido un punto propio\",\"He cerrado con el acuerdo repetido y una fórmula de cierre (Abgemacht / Dann machen wir das so)\",\"No he hablado más de treinta segundos seguidos sin darle la palabra a la otra voz\"],\"model\":\"— Hallo Mira, wir sollen ja zusammen den Besuch bei Tobias planen. Ich hätte einen Vorschlag: Wir gehen am Samstagnachmittag hin, da ist Besuchszeit bis sechs. — Samstag ist bei mir schwierig, ich arbeite bis vier. — Das ist kein Problem. Wie wäre es, wenn wir uns um halb fünf am Eingang treffen? Dann haben wir noch anderthalb Stunden. — Einverstanden. Und wie kommen wir hin? — Am besten mit der S-Bahn, die hält direkt vor dem Krankenhaus. Mit dem Auto finden wir dort nie einen Parkplatz. — Gute Idee. Was bringen wir ihm mit? — Blumen sind auf der Station nicht erlaubt. Sollen wir ihm stattdessen etwas zu lesen kaufen? Er mag Krimis. — Das gefällt mir, und ich backe einen Kuchen. — Perfekt. Und wie können wir ihm sonst helfen? Ich könnte seine Post holen; du wohnst näher an der Uni — würdest du mit seinen Dozenten sprechen? — Mache ich. — Eins noch: Wir sagen Leo Bescheid, sonst fährt er umsonst hin. Dann also Samstag, halb fünf, am Eingang. — Abgemacht!\",\"itemIds\":[\"b1m12gzwollenwir\",\"b1m12gzwashaeltstdudavon\",\"b1m12gzsehedasanders\",\"b1m12gzabgemacht\",\"b1m10derkompromiss\"],\"tip\":\"Grábate y cuenta dos cosas: cuántas veces propones y cuántas veces REACCIONAS. Si el segundo número es cero, tu alemán da igual — «Interaktion» es un criterio propio del Teil 1 y ahí se queda en E. Y si te toca un compañero callado, la nota sigue siendo tuya: pregúntale («Was hältst du davon?») y así produces tú la interacción que el examen quiere ver.\"},{\"id\":\"b1m12l8e16\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 3 hablando: 1-2 minutos y 16 puntos que casi nadie prepara. Tu compañera acaba de presentar «Haustiere in der Großstadt». Le das feedback, le haces UNA pregunta (obligatoria), respondes a su feedback y contestas a la pregunta de la examinadora. El Teil 3 no se prepara en el examen: aquí tienes 30 segundos solo para releer las fórmulas.\",\"topic\":\"Nach der Präsentation deiner Partnerin: Rückmeldung, eigene Frage und Antwort auf die Frage der Prüferin.\",\"slides\":[{\"title\":\"1 · Rückmeldung: dos frases, no una\",\"hint\":\"«Mir hat besonders gut gefallen, dass …» + «Interessant fand ich (vor allem) …». Di algo CONCRETO de su presentación: la estructura, un ejemplo, una cifra. Un «sehr gut, danke» no puntúa.\"},{\"title\":\"2 · Deine Frage — obligatoria\",\"hint\":\"«Ich hätte noch eine Frage: …» Una pregunta abierta y de verdad respondible: «Würdest du selbst …?», «Wie ist das bei euch …?». Si no preguntas, pierdes puntos aunque hayas hablado bien.\"},{\"title\":\"3 · Auf ihr Feedback reagieren\",\"hint\":\"«Danke, das freut mich.» · «Du hast recht, dass …, beim nächsten Mal …» · «Das sehe ich etwas anders, weil …». Aceptar una crítica con una frase también puntúa.\"},{\"title\":\"4 · Die Frage der Prüferin beantworten\",\"hint\":\"Suele ser «Wie ist das in Ihrem Heimatland?» o «Würden Sie das auch so machen?». Responde con el molde de siempre: dato + ejemplo + «Meiner Meinung nach …».\"}],\"planSeconds\":30,\"speakSeconds\":100,\"reps\":2,\"checklist\":[\"He dado DOS frases de feedback y las dos nombran algo concreto de la presentación\",\"He hecho mi pregunta con «Ich hätte noch eine Frage:» y era abierta, no de sí o no\",\"He reaccionado al feedback de mi compañera sin limitarme a decir «danke»\",\"He contestado a la pregunta de la examinadora con dato + ejemplo + opinión\",\"He hablado al menos un minuto en total y no he leído nada\"],\"model\":\"Mir hat besonders gut gefallen, dass du am Anfang gesagt hast, wie deine Präsentation aufgebaut ist — so konnte ich gut folgen. Interessant fand ich vor allem dein Beispiel mit dem Hund im dritten Stock ohne Aufzug. Ich hätte noch eine Frage: Würdest du selbst in einer kleinen Wohnung ein Tier halten? … Danke für dein Feedback. Du hast recht, dass ich beim dritten Punkt zu schnell geworden bin; beim nächsten Mal nehme ich mir dort mehr Zeit. Und zur Frage, wie das in meinem Heimatland ist: Bei uns leben sehr viele Hunde in der Stadt. Die Wohnungen sind zwar klein, aber die Leute sind viel draußen — meine Nachbarin geht mit ihrem Hund dreimal am Tag in den Park. Meiner Meinung nach kommt es deshalb weniger auf die Quadratmeter an als auf die Zeit, die man hat.\",\"itemIds\":[\"b1m12gzhaettefrage\",\"b1m12gzpraesentation\",\"b1m12gzheimatland\",\"b1m12gzzustimmen\",\"b1m12gzaufmerksamkeit\"],\"tip\":\"El Teil 3 son 16 puntos que se pierden por callarse. Llévate las tres frases hechas —feedback, pregunta, reacción— y solo tendrás que rellenarlas con lo que acabas de oír. Y ojo al reparto: la pregunta al compañero es obligatoria y se puntúa aparte del feedback.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m12-2\",\"book\":\"Wir sind uns einig. Wir machen es so.\",\"real\":\"Abgemacht!\",\"meaning\":\"¡Trato hecho!\",\"when\":\"Para cerrar un acuerdo entre iguales: amigos, compañeros y —sí— tu pareja del Sprechen Teil 1, que se trata de tú. Con un superior o en la Schreiben Aufgabe 3 no vale: por escrito y de usted suena a apretón de manos en un bar.\",\"register\":\"amigos\",\"exam\":\"Einverstanden, dann machen wir das so.\",\"note\":\"Una palabra sola que cierra la negociación y ahorra tiempo en el oral. Su gemelo escrito es «verbleiben», el verbo con el que se cierran los correos formales.\",\"sound\":\"AP-gue-majt\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m12gzabgemacht\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
