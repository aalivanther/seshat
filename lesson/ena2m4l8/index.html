3eso cheap as\u003c/i\u003e está mal.\u003cbr/\u003e• «como» tienta a poner \u003ci\u003elike\u003c/i\u003e. \u003cb\u003eTampoco.\u003c/b\u003e Va el segundo \u003ci\u003eas\u003c/i\u003e: \u003ci\u003eas cheap like\u003c/i\u003e está mal.\u003cbr/\u003e\u003cbr/\u003eY muy cerca vive una fórmula que te va a servir muchísimo en la Parte 3 para las \u003cb\u003esemejanzas\u003c/b\u003e: \u003cb\u003ethe same as\u003c/b\u003e = igual que. [[It's the same as mine.|Es igual que el mío.]] Aquí el «que» tampoco es \u003ci\u003ethan\u003c/i\u003e ni \u003ci\u003ethat\u003c/i\u003e: es \u003cb\u003eas\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eFíjate en que «not as cheap as» y «more expensive than» dicen lo mismo con otra cara. Poder decirlo de dos maneras es exactamente lo que se premia en el oral."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l8\",\"phaseId\":\"ena2m4\",\"title\":\"As cheap as, too small\",\"subtitle\":\"Frontera: decir que dos cosas son iguales, y que algo se pasa o no llega\",\"minutes\":9,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Igual, de más y de menos\",\"itemIds\":[\"ena2m4ascheapas\",\"ena2m4thesameasmine\",\"ena2m4tooshoessmall\",\"ena2m4bigenough\",\"entooexpensive\",\"enshoes\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Esta lección se PRESENTA — no se examina\",\"body\":\"Antes de empezar, una cosa importante para tu tranquilidad: \u003cb\u003elo de hoy no entra en lo que se te va a exigir producir\u003c/b\u003e. Es lección de \u003cb\u003efrontera\u003c/b\u003e. Con el comparativo y el superlativo de las lecciones 1 a 4 tienes cubierto el A2 entero, y la Parte 3 del oral se aprueba sin nada de esto.\u003cbr/\u003e\u003cbr/\u003e¿Y por qué está aquí, entonces? Por dos razones muy prácticas:\u003cbr/\u003e1. \u003cb\u003eLo vas a oír\u003c/b\u003e. «Not as good as», «too expensive» y «big enough» salen constantemente en las escuchas del examen, y entender no cuesta lo mismo que producir.\u003cbr/\u003e2. \u003cb\u003eCuando lo necesites, ya lo habrás visto\u003c/b\u003e. Te lo vas a encontrar otra vez en el B1, y llegar con la cara ya conocida vale mucho.\u003cbr/\u003e\u003cbr/\u003eAsí que hoy: reconocer, entender y, si te sale, usar. Sin agobios.\"}},{\"kind\":\"note\",\"note\":{\"title\":\"as … as: decir que dos cosas van igualadas\",\"body\":\"$17\",\"table\":[[\"español\",\"inglés\",\"lo que sale mal\"],[\"tan barato como\",\"as cheap as\",\"so cheap like\"],[\"no tan bueno como\",\"not as good as\",\"not so good like\"],[\"igual que el mío\",\"the same as mine\",\"the same that mine\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"too y enough: se pasa, o no llega\",\"body\":\"Dos palabras que parecen inocentes y que el español mezcla sin parar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003etoo = demasiado, Y es un problema.\u003c/b\u003e No es «muy». \u003ci\u003eThese shoes are \u003cb\u003etoo small\u003c/b\u003e\u003c/i\u003e quiere decir que no te valen. \u003ci\u003eThese shoes are very small\u003c/i\u003e solo dice que son pequeñas, sin queja. Del A1 ya traes \u003ci\u003etoo expensive\u003c/i\u003e: cuando lo dices en una tienda, estás diciendo que no lo compras.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eenough = lo suficiente, Y llega justo.\u003c/b\u003e Con adjetivos va \u003cb\u003eDETRÁS\u003c/b\u003e: [[It isn't big enough.|No es lo bastante grande.]] Con sustantivos va delante, como viste ayer: \u003ci\u003eenough room\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eLos dos errores del español:\u003cbr/\u003e• \u003ci\u003etoo much small\u003c/i\u003e — «demasiado» se traduce por \u003cb\u003etoo\u003c/b\u003e a secas cuando va con adjetivo. El \u003ci\u003emuch\u003c/i\u003e sobra.\u003cbr/\u003e• \u003ci\u003eenough big\u003c/i\u003e — con adjetivo, enough va detrás. Es la única palabra del inglés que se coloca así, y por eso se falla.\u003cbr/\u003e\u003cbr/\u003eY hay un truco de examen: \u003cb\u003etoo small\u003c/b\u003e y \u003cb\u003enot big enough\u003c/b\u003e significan exactamente lo mismo. Si en el oral no te sale una, di la otra.\",\"table\":[[\"idea\",\"con adjetivo\",\"con sustantivo\"],[\"demasiado\",\"too small (delante)\",\"too much / too many (m5)\"],[\"suficiente\",\"big enough (DETRÁS)\",\"enough room (delante)\"],[\"lo mismo, dicho al revés\",\"too small = not big enough\",\"—\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l8e1\",\"type\":\"mc\",\"prompt\":\"«Tan barato como»\",\"question\":\"«No es tan barato como el mercado» es…\",\"options\":[\"It isn't as cheap as the market.\",\"It isn't so cheap like the market.\",\"It isn't as cheap like the market.\"],\"answer\":0,\"whyWrong\":[null,\"«tan» no es so aquí y «como» no es like: los dos son as\",\"El primer as está bien; el segundo también tiene que ser as\"],\"itemIds\":[\"ena2m4ascheapas\"]},{\"id\":\"ena2m4l8e2\",\"type\":\"cloze\",\"prompt\":\"Completa la comparación de igualdad\",\"text\":\"This shop isn't ___ cheap as the street market.\",\"answers\":[\"as\"],\"translation\":\"Esta tienda no es tan barata como el mercadillo.\",\"hints\":[\"La misma palabra que ya está al otro lado del adjetivo\",\"a…\"],\"itemIds\":[\"ena2m4ascheapas\",\"enshop\",\"ena2m1streetmarket\"]},{\"id\":\"ena2m4l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa con la palabra de «lo bastante»\",\"text\":\"This room isn't big ___ for two beds.\",\"answers\":[\"enough\"],\"translation\":\"Esta habitación no es lo bastante grande para dos camas.\",\"hints\":[\"Va DETRÁS del adjetivo, no delante\",\"big e…\"],\"itemIds\":[\"ena2m4bigenough\",\"enroom\",\"enbed\"]},{\"id\":\"ena2m4l8e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «tan… como»\",\"wrong\":\"It isn't so cheap like the market.\",\"answers\":[\"It isn't as cheap as the market.\"],\"why\":\"El español pone dos palabras distintas («tan» y «como») y el inglés pone la misma dos veces: as … as. So y like existen, pero en otras frases: «so cheap!» es una exclamación y «like the market» es «parecido al mercado».\",\"translation\":\"No es tan barato como el mercado.\",\"itemIds\":[\"ena2m4ascheapas\"]},{\"id\":\"ena2m4l8e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige la colocación de enough\",\"wrong\":\"It isn't enough big.\",\"answers\":[\"It isn't big enough.\"],\"why\":\"enough es la única palabra del inglés que se pone DETRÁS del adjetivo: big enough, cheap enough, good enough. Delante solo va cuando lo que sigue es un sustantivo (enough room).\",\"translation\":\"No es lo bastante grande.\",\"itemIds\":[\"ena2m4bigenough\",\"ena2m4enoughroom\"],\"tip\":\"Este error no es de conocimiento, es de reflejo: el español pone «suficientemente» delante y la mano copia el orden. Se cura diciendo la frase en voz alta tres veces.\"},{\"id\":\"ena2m4l8e6\",\"type\":\"mc\",\"prompt\":\"too no es «muy»\",\"question\":\"En una tienda dices «These shoes are too small». ¿Qué estás diciendo?\",\"options\":[\"Que no te valen\",\"Que son pequeñas y bonitas\",\"Que son la talla que buscabas\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «They're very small» o «They're small and nice»: too siempre trae queja\",\"Si te valieran dirías «They're the right size» o «They fit»\"],\"itemIds\":[\"ena2m4tooshoessmall\",\"entooexpensive\",\"enshoes\"],\"tip\":\"too = hay un problema. Por eso «too expensive» en una tienda es la forma educada de decir que no te lo llevas.\"},{\"id\":\"ena2m4l8e7\",\"type\":\"bucket\",\"prompt\":\"¿Esta frase dice que se pasa, o que no llega?\",\"categories\":[\"se pasa (too)\",\"no llega (not … enough)\"],\"items\":[{\"text\":\"These shoes are too small.\",\"bucket\":0},{\"text\":\"This room isn't big enough.\",\"bucket\":1},{\"text\":\"It's too expensive for me.\",\"bucket\":0},{\"text\":\"The coffee isn't hot enough.\",\"bucket\":1},{\"text\":\"It's too far from the station.\",\"bucket\":0},{\"text\":\"I don't have enough time.\",\"bucket\":1}],\"itemIds\":[\"ena2m4tooshoessmall\",\"ena2m4bigenough\",\"entooexpensive\",\"ena2m4further\"],\"tip\":\"Las dos columnas dicen lo mismo con la cara al revés: «too small» y «not big enough» son la misma queja.\"},{\"id\":\"ena2m4l8e8\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con la que significa lo mismo\",\"pairs\":[{\"target\":\"It's too small.\",\"source\":\"It isn't big enough.\"},{\"target\":\"It's too expensive.\",\"source\":\"It isn't cheap enough.\"},{\"target\":\"It isn't as cheap as the market.\",\"source\":\"The market is cheaper.\"},{\"target\":\"It's the same as mine.\",\"source\":\"It isn't different from mine.\"}],\"itemIds\":[\"ena2m4tooshoessmall\",\"ena2m4bigenough\",\"ena2m4ascheapas\",\"ena2m4thesameasmine\"],\"tip\":\"Poder decir lo mismo de dos maneras es media Parte 3. Cuando se te atasque una fórmula, tira de la otra y no pares.\"},{\"id\":\"ena2m4l8e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"Es igual que el mío, pero es demasiado caro.\",\"answers\":[\"It's the same as mine, but it's too expensive.\",\"It's the same as mine but it's too expensive.\"],\"hint\":\"«igual que» lleva as\",\"itemIds\":[\"ena2m4thesameasmine\",\"entooexpensive\"]},{\"id\":\"ena2m4l8e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las dos fórmulas seguidas\",\"text\":\"It isn't as cheap as the market, and it isn't big enough.\",\"phonetic\":\"it is̬nt as̬ CHÍIP as̬ de MAA-kit, and it is̬nt big i-NAF\",\"translation\":\"No es tan barato como el mercado, y no es lo bastante grande.\",\"itemIds\":[\"ena2m4ascheapas\",\"ena2m4bigenough\"],\"tip\":\"Los dos «as» son átonos: suenan «as̬» flojito, igual que el than. Solo pesa el adjetivo del medio.\"},{\"id\":\"ena2m4l8e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Estos zapatos me quedan pequeños y no son tan cómodos como los otros.\",\"answers\":[\"These shoes are too small and they aren't as comfortable as the other ones.\",\"These shoes are too small, and they aren't as comfortable as the other ones.\",\"These shoes are too small and they aren't as comfortable as the others.\"],\"hints\":[\"too + adjetivo, y después as … as\",\"These shoes are t… small and they aren't a… comfortable a… the other ones.\"],\"itemIds\":[\"ena2m4tooshoessmall\",\"ena2m4ascheapas\",\"ena2m4morecomfortable\",\"enshoes\"],\"tip\":\"Y con esto cierras la frontera. Si te ha salido, perfecto; si no, tranquilo: nada de esta lección se te va a exigir en el examen de A2.\"}]}],\"resources\":[{\"label\":\"British Council — as … as\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/comparative-superlative-adjectives\",\"note\":\"Busca el apartado de «as … as» al final de la página. Léelo una vez, sin hacer los ejercicios: hoy solo hace falta reconocerlo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\"
