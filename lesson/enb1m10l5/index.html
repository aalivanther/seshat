archa mientras pasa lo demás. Contesta a «¿qué se estaba haciendo?».\u003cbr/\u003e· \u003cb\u003ePast simple\u003c/b\u003e — \u003ci\u003ethe phone \u003cb\u003erang\u003c/b\u003e\u003c/i\u003e — son los \u003cb\u003eHECHOS\u003c/b\u003e, en orden, uno detrás de otro. Es la columna vertebral: si quitas todo lo demás, la historia todavía se entiende.\u003cbr/\u003e· \u003cb\u003ePast perfect\u003c/b\u003e — \u003ci\u003ehe \u003cb\u003ehad found out\u003c/b\u003e\u003c/i\u003e — es lo que \u003cb\u003eYA ESTABA ANTES\u003c/b\u003e. No avanza la historia: la explica.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn párrafo entero, con los tres:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eWe \u003cb\u003ewere having\u003c/b\u003e dinner when Ben \u003cb\u003erang\u003c/b\u003e. He \u003cb\u003ehad found out\u003c/b\u003e about the party from Mr Patel, and he \u003cb\u003ewasn't\u003c/b\u003e happy about it.\u003c/i\u003e\u003cbr/\u003eFondo, hecho, explicación. Ese es el patrón, y con él se escribe cualquier carta del Writing Part 2.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se abre y cómo se cierra.\u003c/b\u003e El inglés hablado abre las historias con \u003cb\u003eIt all started when…\u003c/b\u003e y las cierra con lo que ya sabes del A2: \u003ci\u003ein the end\u003c/i\u003e, \u003ci\u003eand that was it\u003c/i\u003e. Y ordena por dentro con \u003cb\u003eFirst of all\u003c/b\u003e, \u003cb\u003eafter that\u003c/b\u003e, \u003cb\u003esuddenly\u003c/b\u003e, \u003cb\u003eluckily\u003c/b\u003e, \u003cb\u003eunfortunately\u003c/b\u003e. No hacen falta conectores nuevos: los del A2 son exactamente los que un relato necesita.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos palabras que se dicen mal, y las dos importan hoy:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ean argument\u003c/b\u003e es una \u003cb\u003ediscusión\u003c/b\u003e, una bronca. No es «un argumento». El argumento de una película es \u003ci\u003ethe plot\u003c/i\u003e; un argumento en un debate es \u003ci\u003ea point\u003c/i\u003e o \u003ci\u003ean argument\u003c/i\u003e según el contexto, pero cuando alguien dice \u003ci\u003ewe had an argument\u003c/i\u003e está contando una pelea, no un razonamiento.\u003cbr/\u003e· \u003cb\u003eupset\u003c/b\u003e no es «enfadado»: es \u003cb\u003edolido y descolocado\u003c/b\u003e, a punto de llorar más que de gritar. \u003ci\u003eShe was really upset\u003c/i\u003e da mucha más pena que \u003ci\u003eshe was angry\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY la preposición: se discute \u003cb\u003eabout\u003c/b\u003e algo (\u003ci\u003ethey argue about money\u003c/i\u003e) y se riñe \u003cb\u003ewith\u003c/b\u003e alguien (\u003ci\u003eI argued with my brother\u003c/i\u003e). En español las dos son «con» y «por», y se cruzan sin querer."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l5\",\"phaseId\":\"enb1m10\",\"title\":\"It all started when\",\"subtitle\":\"El fondo, los hechos y lo que ya estaba antes: los tres motores de una historia\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario de una bronca\",\"itemIds\":[\"enb1m10itallstartedwhen\",\"enb1m10argument\",\"enb1m10argueabout\",\"enb1m10upset\",\"enb1m10natfallingout\",\"enb1m10itwasmyfault\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: tres tiempos y tres oficios distintos\",\"body\":\"$17\",\"table\":[[\"Motor\",\"Ejemplo\",\"Qué hace\"],[\"Past continuous\",\"We were having dinner…\",\"el decorado, lo que ya estaba en marcha\"],[\"Past simple\",\"…when Ben rang.\",\"el hecho que corta el decorado\"],[\"Past perfect\",\"He had found out from Mr Patel.\",\"lo que ya estaba antes: explica\"],[\"Past simple otra vez\",\"In the end he apologised.\",\"cómo acabó la cosa\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l5e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas de la bronca\",\"pairs\":[{\"target\":\"It all started when he forgot her birthday.\",\"source\":\"Todo empezó cuando se le olvidó su cumpleaños.\"},{\"target\":\"We had a stupid argument.\",\"source\":\"Tuvimos una discusión tonta.\"},{\"target\":\"She was really upset.\",\"source\":\"Estaba muy disgustada.\"},{\"target\":\"It was my fault.\",\"source\":\"Fue culpa mía.\"}],\"itemIds\":[\"enb1m10itallstartedwhen\",\"enb1m10argument\",\"enb1m10upset\",\"enb1m10itwasmyfault\"],\"tip\":\"«It all started when…» es el mejor arranque que hay para el Speaking Part 4: te obliga a poner una causa y te da tiempo mientras la piensas.\"},{\"id\":\"enb1m10l5e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo del día\",\"question\":\"«We had an argument» significa…\",\"options\":[\"Tuvimos una discusión, una bronca\",\"Tuvimos un argumento a favor\",\"Estuvimos de acuerdo\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el sentido de «argument» en un debate escrito, pero «HAVE an argument» es siempre una pelea entre personas.\",\"Lo contrario. Estar de acuerdo es «we agreed».\"],\"itemIds\":[\"enb1m10argument\"],\"tip\":\"El argumento de una novela o de una peli es «the plot», nunca «the argument». Es de los falsos amigos que más se cuelan en el Speaking cuando te preguntan por una película.\"},{\"id\":\"enb1m10l5e3\",\"type\":\"bucket\",\"prompt\":\"¿Esta parte de la historia es el fondo o es el hecho?\",\"categories\":[\"El fondo: qué estaba pasando\",\"El hecho: qué pasó\"],\"items\":[{\"text\":\"We were having dinner.\",\"bucket\":0},{\"text\":\"The phone rang.\",\"bucket\":1},{\"text\":\"It was raining.\",\"bucket\":0},{\"text\":\"She got up and left.\",\"bucket\":1},{\"text\":\"Amy was working nights that week.\",\"bucket\":0},{\"text\":\"Ben apologised on the Sunday.\",\"bucket\":1}],\"itemIds\":[\"ena2m3itwasrainingwhenileft\",\"enb1m10itallstartedwhen\"],\"tip\":\"El fondo casi siempre se puede quitar y la historia se entiende igual, aunque quede sosa. Los hechos no: si quitas uno, la historia deja de tener sentido. Es la prueba más rápida para saber qué tiempo va.\"},{\"id\":\"enb1m10l5e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante quiso pedir perdón. Cambia UNA palabra.\",\"wrong\":\"It was my guilt.\",\"answers\":[\"It was my fault.\"],\"why\":\"«Guilt» es el sentimiento de culpa que llevas dentro, y no se usa así. Para asumir la responsabilidad de algo, el inglés dice «my fault», siempre.\",\"translation\":\"Fue culpa mía.\",\"itemIds\":[\"enb1m10itwasmyfault\"]},{\"id\":\"enb1m10l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"They argue ___ money all the time, and it's exhausting.\",\"answers\":[\"about\",\"over\"],\"translation\":\"Se pasan el día discutiendo por dinero, y es agotador.\",\"hints\":[\"Cinco letras, y es la de los temas\",\"Se discute ___ un tema, y se discute «with» una persona\"],\"itemIds\":[\"enb1m10argueabout\"],\"tip\":\"El tema lleva «about» (o «over», que suena a algo más serio); la persona lleva «with». En español los dos son «por» y «con», y ahí es donde se cruzan.\"},{\"id\":\"enb1m10l5e6\",\"type\":\"build\",\"prompt\":\"Construye el arranque de la historia\",\"target\":\"It all started when he forgot her birthday\",\"translation\":\"Todo empezó cuando se le olvidó su cumpleaños\",\"distractors\":[\"everything\",\"was\"],\"itemIds\":[\"enb1m10itallstartedwhen\"],\"tip\":\"«It all» es más natural que «everything» al abrir un relato: pone la historia en marcha sin comprometerse todavía con lo que pasó.\"},{\"id\":\"enb1m10l5e7\",\"type\":\"order\",\"prompt\":\"Ordena la historia de la cena. Fíjate en qué frase mira hacia atrás.\",\"sentences\":[\"We were having dinner on the Friday when Ben rang the flat.\",\"He had heard about the party from Mr Patel, of all people.\",\"He said one thing, Amy said another, and suddenly they were both shouting.\",\"In the end Amy hung up and sat in the kitchen for an hour without speaking.\",\"On the Sunday Ben came round with flowers and said it had been his fault.\"],\"translation\":\"Estábamos cenando el viernes cuando Ben llamó al piso. Se había enterado de lo de la fiesta por el señor Patel, nada menos. Él dijo una cosa, Amy dijo otra, y de repente estaban los dos gritando. Al final Amy colgó y se quedó una hora sentada en la cocina sin hablar. El domingo Ben se pasó por casa con flores y dijo que había sido culpa suya.\",\"itemIds\":[\"enb1m10argument\",\"enb1m10itwasmyfault\",\"ena2m2suddenly\",\"ena2m2intheend\"],\"tip\":\"Las dos frases con «had» son las dos que no avanzan: una explica cómo se enteró y la otra es lo que Ben dijo después, contado en estilo indirecto. Todo lo que avanza va en pasado simple.\"},{\"id\":\"enb1m10l5e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo con los tres motores\",\"text\":\"We ___ having dinner when Ben rang. He ___ found out about the party from Mr Patel, and he ___ not happy about it.\",\"answers\":[\"were\",\"had\",\"was\"],\"bank\":[\"were\",\"had\",\"was\",\"did\",\"have\",\"are\"],\"translation\":\"Estábamos cenando cuando llamó Ben. Se había enterado de lo de la fiesta por el señor Patel, y no le hacía ninguna gracia.\",\"itemIds\":[\"enb1m10itallstartedwhen\",\"enb1m10hadalreadyleft\"],\"tip\":\"Tres huecos, tres tiempos, un solo párrafo. Si te sale este de carrerilla, ya sabes escribir una carta narrativa: el resto es vocabulario.\"},{\"id\":\"enb1m10l5e9\",\"type\":\"transform\",\"prompt\":\"Mete la explicación por debajo\",\"source\":\"Ben found out about the party. Then he rang the flat.\",\"instruction\":\"Cuéntalo empezando por la llamada\",\"answers\":[\"Ben rang the flat because he had found out about the party\",\"Ben rang the flat because he had found out about the party.\",\"Ben rang the flat because he'd found out about the party\"],\"translation\":\"Ben llamó al piso porque se había enterado de lo de la fiesta.\",\"hints\":[\"La explicación va detrás y necesita el piso de abajo\",\"Ben rang the flat because he ... about the party\"],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10itallstartedwhen\"],\"tip\":\"Contar los hechos fuera de orden y sostenerlos con un «had» es exactamente lo que separa una redacción de B1 de una de A2. El A2 cuenta en fila; el B1 monta.\"},{\"id\":\"enb1m10l5e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"They had a big argument and they were both very angry.\",\"forbid\":[\"argument\",\"angry\"],\"answers\":[\"They had a row and they were both really upset\",\"They fell out and they were both very upset\",\"They had a falling-out and they were both really upset\"],\"translation\":\"Tuvieron una discusión gorda y los dos estaban muy afectados.\",\"itemIds\":[\"enb1m10upset\",\"enb1m10natfallingout\",\"enb1m10falloutwith\"],\"tip\":\"«A row» —que rima con «cow», no con «go»— es la palabra británica de todos los días para una bronca. La vas a oír mucho más que «argument» en boca de alguien contando algo.\"},{\"id\":\"enb1m10l5e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Estaba muy disgustada porque nadie se lo había contado.\",\"answers\":[\"She was really upset because nobody had told her\",\"She was very upset because nobody had told her\",\"She was really upset because no one had told her\"],\"hint\":\"La segunda mitad mira hacia atrás y necesita el auxiliar de la lección 1\",\"itemIds\":[\"enb1m10upset\",\"enb1m10hadalreadyleft\"],\"tip\":\"«Nobody had told her» es una frase que vas a escribir cien veces: el motivo de un disgusto casi siempre está en el pasado del pasado.\"},{\"id\":\"enb1m10l5e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"We had a bit of a falling-out, but it was my fault.\",\"answers\":[\"Tuvimos nuestro más y nuestro menos, pero fue culpa mía\",\"Nos peleamos un poco, pero fue culpa mía\",\"Tuvimos un roce, pero la culpa fue mía\"],\"itemIds\":[\"enb1m10natfallingout\",\"enb1m10itwasmyfault\"],\"tip\":\"«A bit of a…» es el atenuador británico por excelencia: «a bit of a falling-out» puede ser un año sin hablarse. Cuanto peor es la cosa, más pequeña se dice.\"},{\"id\":\"enb1m10l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"notepad\":true,\"audio\":\"So are you two speaking again?|We are. He came round on Sunday.|And?|And he'd already talked to Mr Patel, so he knew nobody had kept it from him on purpose. That was the bit that had upset him, not the party.|Ah.|He said it was his fault and I let him say it, which is not very noble of me.|You'd both said things.|We had. But he got there first.\",\"question\":\"¿Por qué se había molestado Ben en realidad?\",\"options\":[\"Porque creía que le habían ocultado la fiesta a propósito\",\"Porque no le habían invitado a la fiesta\",\"Porque Amy había hablado con el señor Patel antes que él\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La fiesta no es el problema y se dice con todas las letras: «That was the bit that had upset him, not the party».\",\"Fue Ben quien habló con el señor Patel, y eso es lo que le hizo entenderlo.\"],\"itemIds\":[\"enb1m10upset\",\"enb1m10itwasmyfault\",\"enb1m10hadalreadyleft\"],\"tip\":\"Cuenta los «had» del audio: had already talked, had kept, had upset, had said. Todos apuntan a lo mismo — la respuesta no está en lo que pasó el domingo, sino en lo que ya estaba antes del domingo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m10-2\",\"book\":\"We argued.\",\"real\":\"We had a bit of a falling-out.\",\"meaning\":\"Tuvimos nuestro más y nuestro menos\",\"when\":\"Contando algo a alguien de confianza, y casi siempre para quitarle hierro a una bronca que fue bastante seria. En el Writing y en el Speaking del examen, la versión neutra y sin atenuador.\",\"register\":\"neutral\",\"exam\":\"We had a disagreement.\",\"note\":\"«A bit of a» no significa «un poco»: es el atenuador británico. Cuanto más se atenúa, más gorda fue la cosa — un año sin hablarse cabe perfectamente aquí dentro.\",\"sound\":\"ui jad a bit ov a FÓO-ling áut\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m10natfallingout\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
