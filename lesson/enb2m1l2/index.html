lla sola: eso es el [[comma splice|comma splice]], la trampa nº 2 del B2.\u003cbr/\u003e\u003cbr/\u003eEl [[semicolon|punto y coma]] es la herramienta que el hispanohablante no usa nunca y el examinador premia: dos oraciones que se sostienen solas y están emparentadas. \u003ci\u003eThe first line was polite; the request never appeared.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l2\",\"phaseId\":\"enb2m1\",\"title\":\"Whereas, not but\",\"subtitle\":\"El contraste paralelo, y la coma que el español no pone\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Contraste de B2\",\"itemIds\":[\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1evenif\",\"enb2m1thatsaid\",\"enb2m1bycontrast\",\"enb2m1commaand\",\"enb2m1semicolon\"]},{\"kind\":\"note\",\"note\":{\"title\":\"whereas no es but, y la coma no es estética\",\"body\":\"$17\",\"table\":[[\"Marcador\",\"Qué contrasta\",\"Qué le va detrás\"],[\"whereas\",\"dos hechos paralelos\",\"frase entera, mismo molde\"],[\"nevertheless / that said\",\"un giro, después de conceder\",\"punto + coma + frase\"],[\"even if\",\"una hipótesis\",\"frase en afirmativo\"],[\"by contrast\",\"el otro polo, ya anunciado\",\"coma + frase\"],[\", and\",\"dos oraciones con sujeto propio\",\"sujeto + verbo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l2e1\",\"type\":\"match\",\"prompt\":\"Empareja el contraste con su trabajo\",\"pairs\":[{\"target\":\"whereas\",\"source\":\"dos hechos paralelos\"},{\"target\":\"nevertheless\",\"source\":\"giro después de conceder\"},{\"target\":\"even if\",\"source\":\"concesión de una hipótesis\"},{\"target\":\"by contrast\",\"source\":\"el otro polo, ya anunciado\"}],\"itemIds\":[\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1evenif\",\"enb2m1bycontrast\"]},{\"id\":\"enb2m1l2e2\",\"type\":\"bucket\",\"prompt\":\"¿Hecho paralelo o giro después de conceder?\",\"categories\":[\"whereas / by contrast — dos polos\",\"nevertheless / that said — un giro\"],\"items\":[{\"text\":\"Cardiff recycles a lot, whereas London recycles less.\",\"bucket\":0},{\"text\":\"The rent is high. Nevertheless, she stayed.\",\"bucket\":1},{\"text\":\"By contrast, Amy cuts every email into blocks.\",\"bucket\":0},{\"text\":\"That said, the hours are long.\",\"bucket\":1},{\"text\":\"Valeria writes long paragraphs, whereas Amy writes short ones.\",\"bucket\":0},{\"text\":\"The draft was honest. Nevertheless, it was not clear.\",\"bucket\":1}],\"itemIds\":[\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1thatsaid\",\"enb2m1bycontrast\"],\"tip\":\"Si puedes poner las dos mitades en dos columnas de una tabla, es whereas. Si la segunda mitad da la vuelta a la primera, es nevertheless.\"},{\"id\":\"enb2m1l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Even if the room is small, but it is bright.\",\"answers\":[\"Even if the room is small, it is bright.\"],\"why\":\"«even if» ya hace de «pero». El «but» sobra, igual que sobraba detrás de «although» en el B1. El calco es «aunque…, pero…», que en español se oye y en inglés es error de manual.\",\"translation\":\"Aunque el cuarto sea pequeño, es luminoso.\",\"itemIds\":[\"enb2m1evenif\"]},{\"id\":\"enb2m1l2e4\",\"type\":\"errorfix\",\"prompt\":\"Puntuación: dos sujetos, una coma que faltaba\",\"wrong\":\"I went home and she stayed behind.\",\"answers\":[\"I went home, and she stayed behind.\",\"I went home. She stayed behind.\"],\"why\":\"Cuando «and» une dos oraciones con sujeto propio, el inglés pone coma delante. Sin ella, «she» parece seguir colgando de «went». No es estética: es Organisation.\",\"translation\":\"Yo me fui a casa, y ella se quedó.\",\"itemIds\":[\"enb2m1commaand\"]},{\"id\":\"enb2m1l2e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de Amy sobre el borrador\",\"text\":\"Valeria writes long paragraphs, ___ Amy writes short ones. The first draft was honest. ___, it was not clear. ___ the request is tiny, it still has to go first. ___ the hours are long, so she rewrote it on the bus.\",\"answers\":[\"whereas\",\"Nevertheless\",\"Even if\",\"That said\"],\"bank\":[\"whereas\",\"Nevertheless\",\"Even if\",\"That said\",\"because\",\"so\",\"although\"],\"translation\":\"Valeria escribe párrafos largos, mientras que Amy los escribe cortos. El primer borrador era honesto. Aun así, no era claro. Aunque la petición sea mínima, tiene que ir primero. Dicho esto, la jornada es larga, así que lo reescribió en el autobús.\",\"itemIds\":[\"enb2m1whereas\",\"enb2m1nevertheless\",\"enb2m1evenif\",\"enb2m1thatsaid\"],\"tip\":\"«although» está en el banco a propósito: vale para un hecho, no para una hipótesis. El hueco 3 pide even if porque «the request is tiny» es una concesión hipotética, no un hecho que Amy dé por cerrado.\"},{\"id\":\"enb2m1l2e6\",\"type\":\"mc\",\"prompt\":\"El punto y coma\",\"question\":\"«The first line was polite; the request never appeared.» ¿Por qué punto y coma y no coma?\",\"options\":[\"Porque son dos oraciones que se sostienen solas y están emparentadas.\",\"Porque en inglés siempre hay que poner punto y coma antes de «never».\",\"Porque el punto y coma sustituye a «and» en cualquier lista.\"],\"answer\":0,\"whyWrong\":[null,\"«Never» no pide puntuación ninguna. El punto y coma une oraciones, no palabras.\",\"En una lista de tres o más va la coma (y la de Oxford, si la usas). El punto y coma no es una coma disfrazada.\"],\"itemIds\":[\"enb2m1semicolon\",\"enb2m1commasplice\"],\"tip\":\"Prueba de bolsillo: si puedes poner un punto y las dos mitades siguen siendo frases, el punto y coma es legal. Si una mitad se queda coja, no.\"},{\"id\":\"enb2m1l2e7\",\"type\":\"transform\",\"prompt\":\"Mismo contraste, otro marcador\",\"source\":\"Valeria writes long paragraphs, but Amy writes short ones.\",\"instruction\":\"Dilo con whereas (dos hechos paralelos)\",\"answers\":[\"Valeria writes long paragraphs, whereas Amy writes short ones\",\"V gunta antes del play. Dos escuchas.\",\"audio\":\"You know the new bins on my route? Hackney actually uses them, whereas Walthamstow just leaves them in the street. That said, Walthamstow's got the better market. I wouldn't swap.\",\"question\":\"¿Qué contrapone Ben con whereas?\",\"options\":[\"Lo que hace cada barrio con los cubos\",\"El mercado de Walthamstow y el de Hackney\",\"Si él cambiaría de ruta o no\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso va con «That said»: es el giro, no el paralelo.\",\"«I wouldn't swap» es el cierre, no el contraste.\"],\"itemIds\":[\"enb2m1whereas\",\"enb2m1thatsaid\"],\"tip\":\"En el Listening del B2, el marcador te dice qué tipo de contraste oyes. «Whereas» = dos columnas. «That said» = me doy la vuelta.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1
