c/u\u003e zu viel\u003c/i\u003e). El español dice «aunque» y «aun así» sin consecuencias; el alemán te cobra la diferencia."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m3l8\",\"phaseId\":\"b1m3\",\"title\":\"Schreiben: Sport im Betrieb\",\"subtitle\":\"Comentario de foro — el género que más se suspende del examen\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas del debate laboral\",\"itemIds\":[\"b1m3derbetrieb\",\"b1m3diepflicht\",\"b1m3freiwillig\",\"b1m2arbeitgeber\",\"b1m2einerseits\",\"b1m3trotzdemsitzeichzuviel\",\"b1m3obwohlichsportmache\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El esqueleto de un comentario de opinión\",\"body\":\"$17\",\"table\":[[\"función\",\"Redemittel\"],[\"postura\",\"Ich bin dafür/dagegen, dass … · Ich sehe das anders.\"],[\"razón\",\"…, weil … (verbo al final) · denn … (orden normal)\"],[\"ejemplo\",\"Bei uns im Betrieb … · Zum Beispiel …\"],[\"concesión\",\"Einerseits …, andererseits … · Natürlich …, aber …\"],[\"propuesta\",\"Man könnte … · Meiner Meinung nach sollte …\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m3l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del debate\",\"pairs\":[{\"target\":\"der Betrieb\",\"source\":\"la empresa / el centro de trabajo\"},{\"target\":\"die Pflicht\",\"source\":\"la obligación\"},{\"target\":\"freiwillig\",\"source\":\"voluntario, por voluntad propia\"},{\"target\":\"der Arbeitgeber\",\"source\":\"el empleador\"}],\"itemIds\":[\"b1m3derbetrieb\",\"b1m3diepflicht\",\"b1m3freiwillig\",\"b1m2arbeitgeber\"]},{\"id\":\"b1m3l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Manda el verbo al final o pide inversión?\",\"categories\":[\"Subordinante (verbo al FINAL)\",\"Adverbio (inversión)\"],\"items\":[{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"weil\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"da\",\"bucket\":0},{\"text\":\"außerdem\",\"bucket\":1},{\"text\":\"dass\",\"bucket\":0},{\"text\":\"danach\",\"bucket\":1}],\"itemIds\":[\"b1m3obwohlichsportmache\",\"b1m3trotzdemsitzeichzuviel\",\"a2m6weil\",\"a2m6deshalb\",\"a2m6dass\"],\"tip\":\"Es la trampa nº1 del B1 escrito: obwohl/weil/da/dass mandan el verbo al final; trotzdem/deshalb/außerdem/danach son adverbios y arrastran el verbo detrás de ellos.\"},{\"id\":\"b1m3l8e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden\",\"wrong\":\"Trotzdem ich sitze zu viel.\",\"answers\":[\"Trotzdem sitze ich zu viel.\"],\"why\":\"trotzdem es un adverbio en posición 1, así que el verbo va inmediatamente detrás y el sujeto después: Trotzdem sitze ich. El español «aun así yo me siento» no cambia nada, y por eso lo calcas.\",\"translation\":\"Aun así estoy demasiado tiempo sentado.\",\"itemIds\":[\"b1m3trotzdemsitzeichzuviel\"]},{\"id\":\"b1m3l8e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden de la subordinada\",\"wrong\":\"Ich sitze viel, obwohl ich mache Sport.\",\"answers\":[\"Ich sitze viel, obwohl ich Sport mache.\"],\"why\":\"obwohl es conjunción subordinante: el verbo conjugado cierra la frase. «obwohl ich mache Sport» es el calco literal de «aunque hago deporte».\",\"translation\":\"Estoy mucho tiempo sentado aunque hago deporte.\",\"itemIds\":[\"b1m3obwohlichsportmache\"]},{\"id\":\"b1m3l8e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el comentario de otro usuario\",\"text\":\"Ich bin ___ die Pflicht: Bewegung soll ___ bleiben. ___ hat mein Arbeitgeber recht, wenn er Pausen bezahlt.\",\"answers\":[\"gegen\",\"freiwillig\",\"Andererseits\"],\"bank\":[\"gegen\",\"freiwillig\",\"Andererseits\",\"wegen\",\"obwohl\",\"Betrieb\"],\"translation\":\"Estoy en contra de la obligación: el ejercicio debe seguir siendo voluntario. Por otro lado, mi empleador tiene razón cuando paga las pausas.\",\"itemIds\":[\"b1m3diepflicht\",\"b1m3freiwillig\",\"b1m2einerseits\",\"b1m2arbeitgeber\"]},{\"id\":\"b1m3l8e6\",\"type\":\"build\",\"prompt\":\"Construye la concesión\",\"target\":\"Einerseits ist Sport gesund, andererseits kostet er Zeit\",\"translation\":\"Por un lado el deporte es sano, por otro cuesta tiempo\",\"distractors\":[\"obwohl\",\"weil\"],\"itemIds\":[\"b1m2einerseits\",\"gesund\",\"zeit\"],\"tip\":\"Los dos miembros del par piden inversión: einerseits IST Sport…, andererseits KOSTET er…\"},{\"id\":\"b1m3l8e7\",\"type\":\"transform\",\"prompt\":\"Transforma: de obwohl a trotzdem\",\"source\":\"Obwohl ich Sport mache, sitze ich zu viel.\",\"instruction\":\"Dilo con trotzdem en dos frases\",\"answers\":[\"Ich mache Sport. Trotzdem sitze ich zu viel\",\"Ich mache Sport, trotzdem sitze ich zu viel\"],\"translation\":\"Hago deporte. Aun así estoy demasiado tiempo sentado.\",\"hints\":[\"Con trotzdem el verbo va justo detrás\",\"Ich mache Sport. Trotzdem ...\"],\"itemIds\":[\"b1m3obwohlichsportmache\",\"b1m3trotzdemsitzeichzuviel\"],\"tip\":\"Mismo contenido, dos sintaxis. Dominar el par obwohl/trotzdem es de lo que más puntúa en Kohärenz.\"},{\"id\":\"b1m3l8e8\",\"type\":\"cloze\",\"prompt\":\"Completa la postura\",\"text\":\"Ich bin ___, dass Sport im Betrieb Pflicht wird.\",\"answers\":[\"dagegen\"],\"translation\":\"Estoy en contra de que el deporte sea obligatorio en la empresa.\",\"hints\":[\"Lo contrario de dafür\",\"da + gegen\"],\"itemIds\":[\"b1m3diepflicht\",\"b1m3derbetrieb\"],\"tip\":\"«Ich bin dafür / dagegen» es literalmente la respuesta que pide el Lesen Teil 4 del examen.\"},{\"id\":\"b1m3l8e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin la palabra clave\",\"source\":\"Sport im Betrieb soll Pflicht sein.\",\"forbid\":[\"Pflicht\"],\"answers\":[\"Alle Mitarbeiter sollen im Betrieb Sport machen müssen\",\"Im Betrieb soll Sport für alle verpflichtend sein\"],\"translation\":\"El deporte en la empresa debe ser obligatorio.\",\"hints\":[\"Sin el sustantivo: usa müssen o verpflichtend\",\"Alle ... sollen ... müssen\"],\"itemIds\":[\"b1m3diepflicht\",\"b1m3derbetrieb\"]},{\"id\":\"b1m3l8e10\",\"type\":\"write\",\"prompt\":\"Escribe tu comentario en el foro (unas 80 palabras)\",\"scenario\":\"En el foro de una revista de salud, Lukas ha publicado su opinión sobre el deporte obligatorio en el trabajo. Escribe tu comentario reaccionando a lo que dice.\",\"genre\":\"forum\",\"register\":\"du\",\"stimulus\":{\"author\":\"Lukas_87\",\"text\":\"Ich finde, jede Firma sollte eine Stunde Sport pro Woche für alle Mitarbeiter zur Pflicht machen. Wer den ganzen Tag am Schreibtisch sitzt, wird krank – und das kostet am Ende uns alle.\"},\"frame\":[\"Postura: Ich bin dafür/dagegen … · Ich sehe das anders …\",\"Razón: …, weil … (verbo al final)\",\"Ejemplo propio: Bei uns im Büro … · Zum Beispiel …\",\"Concesión: Natürlich …, aber … · Einerseits …, andererseits …\",\"Propuesta o cierre: Man könnte … · Ich würde …\"],\"bullets\":[\"Di claramente si estás a favor o en contra de la propuesta de Lukas\",\"Justifica tu postura con weil o denn\",\"Da un ejemplo de tu propia experiencia (bei uns / zum Beispiel / in meiner Firma)\",\"Termina con una propuesta propia (sollte / könnte / müsste)\",\"Mete una pasiva de verdad (wird / worden / werden), no solo man\"],\"checks\":[{\"re\":\"dagegen|dafür|sehe das anders|stimme .* nicht zu\",\"label\":\"postura clara (dafür / dagegen / ich sehe das anders)\"},{\"re\":\"weil|denn\",\"label\":\"una razón con weil o denn\"},{\"re\":\"bei uns|zum beispiel|in meiner firma|in meinem büro\",\"label\":\"un ejemplo propio\"},{\"re\":\"sollte|könnte|müsste\",\"label\":\"una propuesta con sollte / könnte / müsste\"},{\"re\":\"(wird |worden|werden )\",\"label\":\"una pasiva (wird / worden / werden)\"}],\"requireConnectors\":{\"min\":3,\"bank\":[\"weil\",\"denn\",\"deshalb\",\"trotzdem\",\"außerdem\",\"obwohl\",\"einerseits\",\"andererseits\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Ich sehe das anders als Lukas und bin dagegen, Sport zur Pflicht zu machen. Bewegung ist wichtig, weil bei uns im Büro fast alle über Rückenschmerzen klagen. Trotzdem finde ich Zwang falsch: Erwachsene entscheiden selbst über ihren Körper. Bei uns wird jeden Freitag eine Laufgruppe angeboten, und sie ist immer voll, obwohl niemand kommen muss. Außerdem hat nicht jeder Zeit dafür. Man könnte lieber die Treppe attraktiver machen und kurze Pausen bezahlen. Freiwillig bewegt man sich einfach lieber.\",\"itemIds\":[\"b1m3derbetrieb\",\"b1m3diepflicht\",\"b1m3freiwillig\",\"b1m3trotzdemsitzeichzuviel\",\"b1m3obwohlichsportmache\"],\"tip\":\"Regla de oro del examen: 79 palabras que tratan los cuatro puntos valen más que 130 brillantes que se dejan uno. Cada punto que falta te baja de banda en Erfüllung; el 0 se reserva para el tema no tratado o el texto que no llega a la mitad de las palabras.\"},{\"id\":\"b1m3l8e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información a la plantilla sobre el deporte en la empresa · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Noch eine Sache, dann könnt ihr in die Pause. Die Firma führt Sport im Betrieb ein: eine Stunde pro Woche, und zwar in der Arbeitszeit, nicht danach. Freiwillig — erst hieß es Pflicht, das haben wir zurückgenommen. Ich weiß, was ihr jetzt denkt: Das macht doch keiner. Ähm, doch. In der Firma von meinem Bruder machen zwei Drittel mit, genau weil es in der Arbeitszeit liegt.\",\"question\":\"„Die Stunde Sport findet nach Feierabend statt.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«in der Arbeitszeit, nicht danach» — y de ahí sale, según él, que participe tanta gente\",null],\"itemIds\":[\"b1m3derbetrieb\",\"b1m3freiwillig\"],\"tip\":\"«und zwar» anuncia la precisión que decide la respuesta. Cuando lo oigas, sube la atención medio segundo.\"},{\"id\":\"b1m3l8e12\",\"type\":\"audiomc\",\"prompt\":\"Misma información, segunda tarea. Dos escuchas.\",\"audio\":\"Noch eine Sache, dann könnt ihr in die Pause. Die Firma führt Sport im Betrieb ein: eine Stunde pro Woche, und zwar in der Arbeitszeit, nicht danach. Freiwillig — erst hieß es Pflicht, das haben wir zurückgenommen. Ich weiß, was ihr jetzt denkt: Das macht doch keiner. Ähm, doch. In der Firma von meinem Bruder machen zwei Drittel mit, genau weil es in der Arbeitszeit liegt.\",\"question\":\"¿Por qué participa tanta gente en la empresa del hermano?\",\"options\":[\"Porque es dentro de la jornada laboral\",\"Porque allí sí es obligatorio\",\"Porque la empresa lo paga aparte\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La obligatoriedad se retiró: es voluntario\",\"De dinero no se habla en ningún momento\"],\"itemIds\":[\"b1m3diepflicht\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m3-4\",\"book\":\"Ich finde diesen Vorschlag nicht gut.\",\"real\":\"Das find ich echt Quatsch.\",\"meaning\":\"Eso me parece una tontería\",\"when\":\"En un foro entre iguales o hablando con amigos. En el comentario del examen, no: «Quatsch» y la -e comida de «find» te bajan el registro justo en la frase que abre tu postura, que es la que más se lee.\",\"register\":\"amigos\",\"exam\":\"Ich halte diesen Vorschlag für keine gute Idee.\",\"note\":\"«Quatsch» es «tontería, chorrada» y se oye a todas horas; «ich find» es «ich finde» con la -e comida al hablar. Para el Schreiben, «Ich halte … für …» suena a opinión argumentada y no a rechazo seco.\",\"sound\":\"das fint ij ejt kvach\",\"level\":\"b1\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Schreiben)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Mira la Aufgabe 2 original: el estímulo y la consigna tienen exactamente esta forma.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/
