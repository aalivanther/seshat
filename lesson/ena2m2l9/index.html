\u003cbr/\u003e\u003cbr/\u003eY el remate que te salva de quedarte callada: \u003cb\u003e[[And that was it!|¡Y ahí acabó la cosa!]]\u003c/b\u003e o el \u003cb\u003eHow about you?\u003c/b\u003e que ya traes del módulo pasado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que separa un A2 de un A1 aquí\u003c/b\u003e no son las palabras raras: es que los cuatro bloques estén cosidos. Cósalos con lo de esta semana — \u003ci\u003efirst of all, then, after that, suddenly, in the end\u003c/i\u003e para el orden, y \u003ci\u003ebecause\u003c/i\u003e y \u003ci\u003eso\u003c/i\u003e para el porqué. Con eso, un minuto se llena solo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l9\",\"phaseId\":\"ena2m2\",\"title\":\"Your story, in one minute\",\"subtitle\":\"Todo el módulo junto — y tu primera anécdota contada de principio a fin\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cerrar la historia\",\"itemIds\":[\"ena2m2itwasadisaster\",\"ena2m2andthatwasit\",\"ena2m2whathappenednext\",\"ena2m1howaboutyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Una anécdota son cuatro bloques, y ni uno más\",\"body\":\"$17\",\"table\":[[\"bloque\",\"qué dices\",\"con qué se cose\"],[\"1. la situación\",\"cuándo y dónde\",\"Last Tuesday… / Two days ago…\"],[\"2. el problema\",\"lo que se torció\",\"Suddenly, … / Unfortunately, …\"],[\"3. qué hiciste\",\"uno o dos verbos\",\"First of all… Then… After that…\"],[\"4. cómo acabó\",\"el desenlace y tu opinión\",\"In the end… because… so…\"],[\"remate\",\"devolver la palabra\",\"And that was it! / How about you?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — esto ya es tuyo\",\"pairs\":[{\"target\":\"went\",\"source\":\"fui\"},{\"target\":\"had\",\"source\":\"tuve\"},{\"target\":\"saw\",\"source\":\"vi\"},{\"target\":\"bought\",\"source\":\"compré\"},{\"target\":\"lost\",\"source\":\"perdí (una cosa)\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2wehadagoodtime\",\"ena2m2isawamyyesterday\",\"ena2m2boughtgroup\",\"ena2m2ilostmyphone\"],\"tip\":\"Si los cinco salen sin pensar, el núcleo del módulo está consolidado. Los que te frenen volverán solos en el repaso.\"},{\"id\":\"ena2m2l9e2\",\"type\":\"gapbank\",\"prompt\":\"La historia entera, con banco de palabras\",\"text\":\"Last Tuesday I ___ up late, ___ I missed the bus. At the office I ___ my wallet. ___ the end, Amy found it in the fridge.\",\"answers\":[\"woke\",\"so\",\"lost\",\"In\"],\"bank\":[\"woke\",\"so\",\"lost\",\"In\",\"broke\",\"found\",\"After\"],\"translation\":\"El martes pasado me desperté tarde, así que perdí el autobús. En la oficina perdí la cartera. Al final, Amy la encontró en la nevera.\",\"itemIds\":[\"ena2m2wokegroup\",\"ena2m2soiwalked\",\"ena2m2ilostmyphone\",\"ena2m2intheend\"],\"tip\":\"Cuatro huecos y cuatro cosas distintas: un irregular de familia, un conector de consecuencia, otro irregular y una señal de cierre. Ese es el módulo resumido.\"},{\"id\":\"ena2m2l9e3\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿el verbo va desnudo o con su forma de pasado?\",\"categories\":[\"forma de pasado (went, had, saw…)\",\"desnudo (detrás de did / didn't)\"],\"items\":[{\"text\":\"I ___ to the cinema\",\"bucket\":0},{\"text\":\"Did you ___ to the cinema?\",\"bucket\":1},{\"text\":\"She didn't ___ time\",\"bucket\":1},{\"text\":\"We ___ a good time\",\"bucket\":0},{\"text\":\"Where did you ___?\",\"bucket\":1},{\"text\":\"They ___ the train\",\"bucket\":0}],\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2wheredidyougo\",\"ena2m2wedidnthavetime\",\"ena2m2hetookthetrain\"],\"tip\":\"Es la única decisión de todo el módulo, y se toma mirando si hay un did o un didn't delante. Nada más.\"},{\"id\":\"ena2m2l9e4\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"No salí el sábado porque perdí las llaves, así que me quedé en casa.\",\"answers\":[\"I didn't go out on Saturday because I lost my keys, so I stayed at home.\",\"I didn't go out on Saturday because I lost my keys, so I stayed home.\"],\"hint\":\"una negativa con el verbo desnudo, una causa y una consecuencia\",\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2mykeys\",\"ena2m1istayedathome\"]},{\"id\":\"ena2m2l9e5\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"Suddenly the lights went off, so we sat in the kitchen. In the end we had a good time.\",\"answers\":[\"De repente se fue la luz, así que nos sentamos en la cocina. Al final nos lo pasamos bien.\",\"De repente se apagaron las luces, así que nos sentamos en la cocina. Al final nos lo pasamos bien.\"],\"itemIds\":[\"ena2m2suddenly\",\"ena2m2soiwalked\",\"ena2m2intheend\",\"ena2m2wehadagoodtime\",\"enkitchen\"],\"tip\":\"«we had a good time» no se traduce con «tener»: en español lo pasamos, en inglés lo tenemos. Guárdala como bloque, no como palabras.\"},{\"id\":\"ena2m2l9e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco más caro del nivel — ahora con un irregular\",\"wrong\":\"I have gone to the cinema yesterday.\",\"answers\":[\"I went to the cinema yesterday.\"],\"why\":\"Con yesterday, last… o …ago, el inglés exige pasado simple: son tiempos TERMINADOS. Y ojo con lo que se cuenta por ahí: «ayer he ido al cine» no es correcto tampoco en España — \u003ci\u003eayer\u003c/i\u003e cierra el periodo y pide indefinido en todas partes. Lo que sí cambia según de dónde seas es el \u003cb\u003ehoy\u003c/b\u003e: «hoy he ido» frente a «hoy fui». Con \u003ci\u003eyesterday\u003c/i\u003e, \u003ci\u003elast…\u003c/i\u003e y \u003ci\u003e…ago\u003c/i\u003e la regla es una sola para todos: tiempo terminado, pasado simple, siempre.\",\"translation\":\"Ayer fui al cine.\",\"itemIds\":[\"ena2m2iwenttothecinema\",\"enyesterday\"],\"tip\":\"Este calco ya salió en el módulo 1 con los verbos regulares. Vuelve aquí porque con los irregulares recae: «have gone», «have seen» y «have had» son las tres formas que más se cuelan.\"},{\"id\":\"ena2m2l9e7\",\"type\":\"errorfix\",\"prompt\":\"Y el error nº 1, por última vez este módulo\",\"wrong\":\"Did you went out on Saturday?\",\"answers\":[\"Did you go out on Saturday?\"],\"why\":\"did ya marca el pasado, así que el verbo vuelve a su forma de diccionario. Es el mismo mecanismo del «Does she work?» del A1 y va a seguir siéndolo en todos los módulos que quedan: el auxiliar se lleva la marca, el verbo se queda desnudo.\",\"translation\":\"¿Saliste el sábado?\",\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2ididntgoout\"]},{\"id\":\"ena2m2l9e8\",\"type\":\"mc\",\"prompt\":\"Espiral: la regla de oro del módulo\",\"question\":\"¿Cuándo necesitas saberte la forma rara de un verbo irregular?\",\"options\":[\"Solo en la afirmativa: en la negativa y la pregunta va desnudo\",\"Siempre, en las tres formas\",\"Nunca, si pones did delante\"],\"answer\":0,\"whyWrong\":[null,\"En negativa y pregunta la marca la lleva did: I didn't go, Did you go?\",\"Solo funciona en negativa y pregunta; en afirmativa no hay did que valga\"],\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2ididntgoout\",\"ena2m2wheredidyougo\"],\"tip\":\"Dicho al revés: aprenderte los irregulares te sirve para UNA de las tres formas. Las otras dos te las regala el auxiliar.\"},{\"id\":\"ena2m2l9e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"It was a disaster!\",\"forbid\":[\"disaster\",\"was\"],\"answers\":[\"What a shame!\",\"Everything went wrong.\"],\"translation\":\"¡Fue un desastre!\",\"itemIds\":[\"ena2m2itwasadisaster\",\"ena2m2whatashame\"],\"tip\":\"Cuando en el oral no te salga una palabra, no te pares: rodéala. Esa capacidad de rodeo vale más puntos que la palabra exacta.\"},{\"id\":\"ena2m2l9e10\",\"type\":\"write\",\"prompt\":\"Escribe tu anécdota — 30-50 palabras\",\"scenario\":\"Emma, tu amiga de Manchester, te escribe: «What happened to you on Monday?». Contéstale por email y cuéntale el contratiempo.\",\"bullets\":[\"Cuenta qué pasó, con al menos un verbo irregular en pasado\",\"Da la razón con because o so\",\"Di cómo acabó (in the end / finally)\"],\"checks\":[{\"re\":\"\\\\b(went|had|saw|got|made|took|came|said|lost|found|forgot|fell|bought|thought|caught|brought|left|slept|kept|felt|met|woke|broke|spoke|wrote|drove|knew|threw|flew|ate|paid|heard|read|told|ran|sat|drank|sang|put|cut|cost)\\\\b\",\"label\":\"un verbo irregular en pasado\"},{\"re\":\"(\\\\bbecause\\\\b|\\\\bso\\\\b|that's why)\",\"label\":\"la razón con because / so\"},{\"re\":\"(in the end|finally|at last)\",\"label\":\"cómo acabó\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"direct\",\"requireConnectors\":{\"min\":2,\"bank\":[\"because\",\"so\",\"then\",\"and\",\"but\"]},\"model\":\"Hi Emma! What a morning. On Monday I woke up late and I missed the bus, so I walked to work in the rain. Then I lost my wallet, but luckily Sam found it in the café. In the end I arrived at ten. Valeria\",\"itemIds\":[\"ena2m2wokegroup\",\"ena2m2soiwalked\",\"ena2m2mywallet\",\"ena2m2intheend\",\"ena2m2luckily\"],\"tip\":\"El corrector mira primero si has contestado a lo que te preguntaban y solo después la gramática. Tres contenidos, dos conectores y las 30-50 palabras: ese es el orden de prioridades.\"},{\"id\":\"ena2m2l9e11\",\"type\":\"monologue\",\"prompt\":\"El minuto de verdad: cuenta TU contratiempo\",\"topic\":\"Un día en que algo te salió mal\",\"slides\":[{\"title\":\"1. La situación\",\"hint\":\"Cuándo y dónde: Last Tuesday I… / Two days ago I was at…\"},{\"title\":\"2. El problema\",\"hint\":\"Qué se torció: Suddenly, … / Unfortunately, I lost / I forgot / I missed…\"},{\"title\":\"3. Qué hiciste\",\"hint\":\"Uno o dos verbos: First of all I… Then I… After that I…\"},{\"title\":\"4. Cómo acabó\",\"hint\":\"El desenlace y tu opinión: In the end… It was a disaster / We had a good laugh.\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He usado al menos tres verbos irregulares en pasado\",\"He puesto una señal de secuencia (first of all, then, after that)\",\"He dado una razón con because o con so\",\"He dicho cómo acabó con «in the end»\",\"He cerrado con «And that was it!» o con «How about you?»\"],\"model\":\"Last Tuesday I woke up late because I didn't hear my alarm. I didn't have time for breakfast, so I ran to the bus stop, but I missed the bus. Then I walked to work in the rain and I arrived at ten. At the office I opened my bag and my wallet wasn't there. First of all I phoned Sam at the café, but he didn't find it. After that I phoned my flatmate. In the end she found it in the fridge — I put it there with the milk! It was a disaster, but we had a good laugh. And that was it!\",\"itemIds\":[\"ena2m2wokegroup\",\"ena2m2becauseimissedthebus\",\"ena2m2intheend\",\"ena2m2itwasadisaster\",\"ena2m2andthatwasit\"],\"tip\":\"Grábate las dos veces y compara. La segunda pasada siempre sale más suelta, y esa es la que te llevas al examen. No te evalúas por lo bonito: por las casillas de la lista.\"},{\"id\":\"ena2m2l9e12\",\"type\":\"speak\",\"prompt\":\"El remate, en voz alta\",\"text\":\"In the end, Amy found it in the fridge. It was a disaster! And that was it.\",\"phonetic\":\"in di END, ÉI-mi fáund it in de fridch. it uos̬ a di-S̬AAS-ta. and dat uos̬ IT\",\"translation\":\"Al final, Amy la encontró en la nevera. ¡Fue un desastre! Y ahí acabó la cosa.\",\"itemIds\":[\"ena2m2intheend\",\"ena2m2itwasadisaster\",\"ena2m2andthatwasit\"],\"tip\":\"«And that was it» se dice bajando la voz: es el punto final. Sin él, quien te escucha se queda esperando más.\"},{\"id\":\"ena2m2l9e13\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — la anécdota entera en dos frases\",\"question\":\"Perdí el autobús, así que fui andando y llegué tarde. Al final no dijo nada nadie.\",\"answers\":[\"I missed the bus, so I walked and I arrived late. In the end nobody said anything.\",\"I missed the bus, so I walked and I was late. In the end nobody said anything.\",\"I missed the bus, so I walked and I arrived late. In the end, nobody said anything.\"],\"hints\":[\"Consecuencia con so + señal de cierre + una sola negación\",\"I m… the bus, so I walked and I arrived late. In the e… nobody s… anything.\"],\"itemIds\":[\"ena2m2soiwalked\",\"ena2m2intheend\",\"ena2m2shesaidsorry\",\"ena2m1missedthebus\"],\"tip\":\"Fíjate en la última mitad: «nobody said anything», con la negación en nobody y anything detrás. Dos negaciones en la misma frase siguen sin caber. Y con esto ya puedes contar cualquier cosa que te haya pasado.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m2-5\",\"book\":\"It was a very bad day.\",\"real\":\"It was a nightmare.\",\"meaning\":\"Fue una pesadilla\",\"when\":\"Con amigos y compañeros, resumiendo un día horrible: un viaje, una mudanza, una jornada de trabajo. Es exageración normal y nadie la toma en serio. En el Writing del examen, la del libro (it was terrible, it was a disaster).\",\"register\":\"amigos\",\"note\":\"Se dice de situaciones, no de personas. Y su hermana pequeña, «It was a disaster», ya la tienes en esta lección.\",\"sound\":\"it uos̬ a NÁIT-mea\",\"level\":\"a2\",\"itemId\":\"ena2m2itwasadisaster\"}}],\"resources\":[{\"label\":\"British Council — A2 speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Ensaya el minuto con los vídeos: 30 segundos de papel, uno de habla y una segunda pasada. Siempre dos veces, siempre grabándote.\"},{\"label\":\"LanguageCert — ESOL A2 Access (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Mira hoy la Parte 4 del Spoken: es exactamente el minuto que acabas de ensayar, con sus 30 segundos de preparación.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"m
