 cinema.|Si no, nos vamos al cine.]]\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e4. El cierre.\u003c/b\u003e \u003ci\u003e[[We'll see how it goes.|Ya veremos cómo va la cosa.]]\u003c/i\u003e · \u003ci\u003e[[Let me know.|Ya me dirás.]]\u003c/i\u003e · \u003ci\u003e[[How about you?|¿Y tú?]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas tres cosas que el corrector va a mirar\u003c/b\u003e, y las tres son de este módulo: que la mitad del \u003ci\u003eif\u003c/i\u003e \u003cb\u003eno lleve futuro dentro\u003c/b\u003e, que \u003ci\u003eprobably\u003c/i\u003e esté \u003cb\u003een su sitio\u003c/b\u003e (detrás del will, delante del won't) y que detrás de un modal el verbo vaya \u003cb\u003edesnudo\u003c/b\u003e, sin \u003ci\u003eto\u003c/i\u003e. Si eso está limpio, lo demás lo tienes desde el módulo 6.18:T5fb,"])</script><script>self.__next_f.push([1,"Este módulo cierra el A2 antes del de examen, así que conviene dejar la cuenta clara.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que te llevas y vas a reciclar en el módulo 12\u003c/b\u003e, sin que nadie te lo vuelva a explicar:\u003cbr/\u003e· \u003cb\u003eIf it rains, we'll…\u003c/b\u003e — la condición y su consecuencia.\u003cbr/\u003e· \u003cb\u003eWe might…\u003c/b\u003e — la posibilidad sin mojarse.\u003cbr/\u003e· \u003cb\u003eIt'll probably…\u003c/b\u003e — la apuesta medida.\u003cbr/\u003e· \u003cb\u003eI hope so. / I hope not.\u003c/b\u003e — las dos respuestas de dos palabras.\u003cbr/\u003e· \u003cb\u003eI don't think it will…\u003c/b\u003e — la opinión negada al revés.\u003cbr/\u003eCon esas cinco puedes contestar cualquier pregunta de la Parte 2 del oral sobre planes, y montar el Writing de un plan con su alternativa sin pensar la estructura.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que te dejas aquí, y no pasa nada:\u003c/b\u003e este módulo era \u003cb\u003efrontera\u003c/b\u003e. \u003ci\u003ewill\u003c/i\u003e, \u003ci\u003emight\u003c/i\u003e, \u003ci\u003emay\u003c/i\u003e y la primera condicional están en la lista de B1 de LanguageCert y \u003cb\u003eno aparecen en el simulacro\u003c/b\u003e. Si el domingo antes del examen te dan pereza, sáltalos: no te van a preguntar por ellos. Lo que sí es tuyo y sí puntúa son \u003cb\u003eprobably, possibly y perhaps\u003c/b\u003e, el vocabulario del parte del tiempo y todo lo que traías de los módulos 1 al 9.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una cosa que sí vale para el examen aunque no la produzcas:\u003c/b\u003e el Listening y el Reading del A2 \u003cb\u003eestán llenos de \u003ci\u003ewill\u003c/i\u003e y de \u003ci\u003eif\u003c/i\u003e\u003c/b\u003e, porque los escriben ingleses hablando como ingleses. Reconocerlos —que es lo que has hecho estas nueve lecciones— es puntuación directa aunque no escribas ni un \u003ci\u003ewill\u003c/i\u003e en tu vida."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l9\",\"phaseId\":\"ena2m11\",\"title\":\"Your plan B, in one minute\",\"subtitle\":\"Todo el módulo junto — y las tres fórmulas que te llevas al módulo de examen\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cerrar el plan\",\"itemIds\":[\"ena2m11whatevertheweather\",\"ena2m11letmeknow\",\"ena2m11wellseehowitgoes\",\"ena2m1howaboutyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Un plan con plan B se monta con cuatro bloques\",\"body\":\"$17\",\"table\":[[\"bloque\",\"qué dices\",\"ejemplo\"],[\"1. el plan\",\"going to o continuo + fecha\",\"On Sunday we're going to the park.\"],[\"2. el tiempo\",\"will · might · probably\",\"It'll probably be chilly.\"],[\"3. el plan B\",\"if + presente ‖ will + verbo\",\"If it rains, we'll stay in.\"],[\"4. el cierre\",\"fórmula corta\",\"Let me know. How about you?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Qué te llevas de aquí, y qué te dejas\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — todo esto ya es tuyo\",\"pairs\":[{\"target\":\"If it rains, we'll stay in.\",\"source\":\"Si llueve, nos quedamos en casa\"},{\"target\":\"It might rain.\",\"source\":\"Puede que llueva\"},{\"target\":\"It'll probably rain.\",\"source\":\"Seguramente llueva\"},{\"target\":\"I hope not.\",\"source\":\"Espero que no\"},{\"target\":\"Let me know.\",\"source\":\"Ya me dirás\"}],\"targetSeconds\":30,\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11itmightrain\",\"ena2m11itllprobablyrain\",\"ena2m11ihopeso\",\"ena2m11letmeknow\"],\"tip\":\"Esas cinco son literalmente las que te pide el módulo 12. Lo que salga solo aquí, ya no hay que estudiarlo.\"},{\"id\":\"ena2m11l9e2\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿cuánta seguridad hay en cada frase?\",\"categories\":[\"lo da por hecho\",\"no se moja\"],\"items\":[{\"text\":\"It'll rain tomorrow.\",\"bucket\":0},{\"text\":\"It might rain tomorrow.\",\"bucket\":1},{\"text\":\"It's going to rain — look at the clouds.\",\"bucket\":0},{\"text\":\"Perhaps it'll rain tomorrow.\",\"bucket\":1},{\"text\":\"It won't rain tonight.\",\"bucket\":0},{\"text\":\"I'm not sure about tomorrow.\",\"bucket\":1},{\"text\":\"I'm sure it'll be fine.\",\"bucket\":0},{\"text\":\"It may be cold later.\",\"bucket\":1}],\"itemIds\":[\"ena2m11itwillrain\",\"ena2m11itmightrain\",\"ena2m6itsgoingtorain\",\"ena2m11perhapswellgo\",\"ena2m11imnotsure\",\"ena2m11imsureitllbefine\",\"ena2m11itmaybecold\"],\"tip\":\"Ocho frases y una sola diferencia: la pieza que va delante del verbo. Eso es todo lo que el inglés necesita para medir la certeza.\"},{\"id\":\"ena2m11l9e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error nº 1 del módulo\",\"wrong\":\"If it will rain on Sunday, we'll go to the cinema.\",\"answers\":[\"If it rains on Sunday, we'll go to the cinema.\"],\"why\":\"La mitad del if nunca lleva will: el futuro ya está dicho en la otra mitad. Es la misma regla que usabas con when y before en el módulo 6, y el mismo motivo — una frase, una marca de futuro.\",\"translation\":\"Si el domingo llueve, nos vamos al cine.\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11ifnotwellgo\"],\"tip\":\"Truco de revisión, por última vez: cuenta los will de la frase. Si hay dos, sobra el del if.\"},{\"id\":\"ena2m11l9e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden del adverbio\",\"wrong\":\"It won't probably be cold on Sunday.\",\"answers\":[\"It probably won't be cold on Sunday.\"],\"why\":\"En negativa, probably se adelanta al won't: estás diciendo «es probable que NO», y el adverbio va delante de aquello a lo que se aplica. En afirmativa es al revés: «It'll probably be cold».\",\"translation\":\"Seguramente no haga frío el domingo.\",\"itemIds\":[\"ena2m11itprobablywont\"]},{\"id\":\"ena2m11l9e5\",\"type\":\"gapbank\",\"prompt\":\"El domingo de Valeria, con su plan B\",\"text\":\"On Sunday we're going to the park. It'll ___ be chilly, but it probably ___ rain. And if it ___, we'll go to the cinema instead.\",\"answers\":[\"probably\",\"won't\",\"rains\"],\"bank\":[\"probably\",\"won't\",\"rains\",\"perhaps\",\"doesn't\",\"will rain\"],\"translation\":\"El domingo vamos al parque. Seguramente haga fresquito, pero seguramente no llueva. Y si llueve, nos vamos al cine.\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itprobablywont\",\"ena2m11ifitrains\",\"ena2m11chilly\"],\"tip\":\"«Will rain» está en el banco por lo mismo de siempre: es la ficha que jamás entra detrás de un if. Y «perhaps» tampoco cabe dentro de la frase, porque perhaps abre.\"},{\"id\":\"ena2m11l9e6\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Seguramente llueva el domingo. Si llueve, nos quedamos en casa.\",\"answers\":[\"It'll probably rain on Sunday. If it rains, we'll stay in.\",\"It will probably rain on Sunday. If it rains, we will stay in.\",\"It'll probably rain on Sunday. If it rains, we'll stay at home.\"],\"hint\":\"el adverbio va entre el futuro y el verbo; la mitad del if, en presente\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11ifitrains\"]},{\"id\":\"ena2m11l9e7\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"I don't think it will be cold, but take a jacket just in case.\",\"answers\":[\"Creo que no hará frío, pero coge una chaqueta por si acaso.\",\"No creo que haga frío, pero llévate una chaqueta por si acaso.\"],\"itemIds\":[\"ena2m11idontthinkitwill\",\"ena2m11takeanumbrella\",\"enjacket\"],\"tip\":\"Dos cosas del módulo en una frase: la negación que se va al «creo» y el «just in case» que cierra el aviso. Si las dos te salieron solas, el módulo está.\"},{\"id\":\"ena2m11l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"We might go to the park.\",\"forbid\":[\"might\",\"go\"],\"answers\":[\"Maybe we'll visit the park.\",\"Perhaps we'll walk in the park.\"],\"translation\":\"Igual vamos al parque.\",\"itemIds\":[\"ena2m11wemightgo\",\"ena2m11perhapswellgo\"],\"tip\":\"Rodear una palabra que no te sale es lo que más te va a salvar en el oral. Y fíjate en que las dos salidas siguen llevando un futuro detrás del adverbio: sin él, la frase se iría al presente.\"},{\"id\":\"ena2m11l9e9\",\"type\":\"audiomc\",\"prompt\":\"El plan de Amy, con cuaderno — pregunta primero\",\"audio\":\"Right, so the plan for Saturday. We're meeting at the bus stop at ten. The forecast says sunny spells in the morning and showers after four, so it'll probably be fine for the walk. If it rains before we leave, we won't go — we'll stay at my flat and watch a film. I'll text you at nine either way.\",\"question\":\"¿Qué pasará si llueve antes de salir?\",\"options\":[\"Se quedan en el piso de Amy\",\"Van igualmente y se llevan paraguas\",\"Lo dejan para el domingo\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"El audio dice «we won't go»: no van\",\"El domingo no sale en ningún momento\"],\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11sunnyspells\",\"ena2m11showers\",\"ena2m11itllprobablyrain\"],\"tip\":\"Cuando un audio trae un plan con condición, la respuesta casi siempre está detrás del «if». Apunta lo que venga después y tienes el ejercicio hecho.\"},{\"id\":\"ena2m11l9e10\",\"type\":\"write\",\"prompt\":\"Mándale a Emma tu plan con su plan B — 30-50 palabras\",\"scenario\":\"Emma, tu amiga de Manchester, te escribe: «What are you doing at the weekend? Is the weather any good down there?» Contéstale por email con el plan y con lo que haréis si el tiempo se estropea.\",\"bullets\":[\"Di el plan, con going to o con el presente continuo, y pon un día\",\"Di lo que crees que hará el tiempo (will, might o probably)\",\"Di el plan B, con una frase que empiece por if\"],\"checks\":[{\"re\":\"\\\\b(going to \\\\w+|(?:'m|am|'re|are|is|'s)\\\\s+\\\\w+ing)\\\\b\",\"label\":\"el plan con going to o continuo\"},{\"re\":\"\\\\b(will|'ll|won't|might|may|probably|possibly|perhaps)\\\\b\",\"label\":\"una predicción sobre el tiempo\"},{\"re\":\"\\\\bif\\\\s+(it|we|you|i|she|he|they)\\\\b\",\"label\":\"un plan B con if\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"direct\",\"requireConnectors\":{\"min\":2,\"bank\":[\"and\",\"but\",\"because\",\"so\"]},\"model\":\"Hi Emma! We're going to the park on Sunday and we're meeting Amy at twelve. It'll probably be chilly, but I don't think it will rain. If it rains, we'll go to the cinema instead. Let me know! Valeria\",\"itemIds\":[\"ena2m11ifitrains\",\"ena2m11itllprobablyrain\",\"ena2m11idontthinkitwill\",\"ena2m11letmeknow\",\"ena2m6weremeetingamyatsix\"],\"tip\":\"Antes de darle a corregir, revisa una sola cosa: que la mitad del «if» no lleve ningún will dentro. Es el error que más caro sale de todo el módulo, y es el único que se caza mirando.\"},{\"id\":\"ena2m11l9e11\",\"type\":\"monologue\",\"prompt\":\"El minuto de verdad: tu próximo plan, con su plan B\",\"topic\":\"Un plan tuyo de esta semana y qué harás si el tiempo lo estropea\",\"slides\":[{\"title\":\"1. El plan\",\"hint\":\"Con going to o continuo, y con día: On Saturday I'm going to… / Next week I'm meeting…\"},{\"title\":\"2. El tiempo\",\"hint\":\"It'll probably be… / It might rain / I don't think it will be cold.\"},{\"title\":\"3. El plan B\",\"hint\":\"If it rains, I'll… / If not, we'll… / We might go to the cinema instead.\"},{\"title\":\"4. El cierre\",\"hint\":\"We'll see how it goes. I hope it doesn't rain. How about you?\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"He dicho el plan con going to o con el presente continuo, y con un día concreto\",\"He usado al menos una predicción del tiempo (will, might o probably)\",\"He dicho una frase entera con if\",\"Dentro de la mitad del if NO he puesto ningún will ni ningún would\",\"He cerrado con una fórmula corta y con «How about you?»\"],\"model\":\"On Saturday I'm going to the market with Nora, and after that we're having lunch at her flat. The forecast isn't great: it'll probably be chilly and there might be showers in the afternoon. I don't think it will rain in the morning, so we'll be fine at the market. But if it rains before ten, we won't go — we'll stay in and cook something instead. I hope it doesn't rain, because I want to buy fruit for the week. We'll see how it goes. How about you?\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itmightrain\",\"ena2m11ifitrains\",\"ena2m11ihopeitdoesntrain\",\"ena2m11wellseehowitgoes\"],\"tip\":\"Grábate las dos veces y cuenta casillas, no lo bonito que ha sonado. La segunda pasada siempre sale más suelta: esa es la que se parece al examen.\"},{\"id\":\"ena2m11l9e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el módulo entero en tres frases\",\"text\":\"It'll probably be chilly on Sunday. If it rains, we'll stay in. Let me know!\",\"phonetic\":\"Í-tol PRO-bli bi CHÍ-li on SAN-dei. if it RÉINS̬, uíil stéi IN. let mi NÓU\",\"translation\":\"Seguramente el domingo haga fresquito. Si llueve, nos quedamos en casa. ¡Ya me dirás!\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11ifitrains\",\"ena2m11letmeknow\"],\"tip\":\"Tres frases, tres cosas del módulo: la apuesta medida, la condición y el cierre. Si te salen seguidas y sin pensar, ya tienes el plan B en inglés.\"},{\"id\":\"ena2m11l9e13\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Seguramente llueva el domingo. Si llueve, nos vamos al cine. Ya me dirás.\",\"answers\":[\"It'll probably rain on Sunday. If it rains, we'll go to the cinema. Let me know.\",\"It will probably rain on Sunday. If it rains, we will go to the cinema. Let me know.\"],\"hints\":[\"El adverbio entre el futuro y el verbo · la mitad del if en presente\",\"It'll p… rain on Sunday. If it r…, we'll go to the cinema.\"],\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11ifitrains\",\"ena2m11letmeknow\"],\"tip\":\"Ahí está el módulo entero. Y ahí se cierra la frontera: lo que viene ahora es el módulo 12, que no enseña nada nuevo — solo afila lo que ya tienes y te lleva al examen. Llueva o no llueva.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m11-9\",\"book\":\"We will go whatever the weather is.\",\"real\":\"We're going, rain or shine.\",\"meaning\":\"Vamos, llueva o no llueva\",\"when\":\"Con amigos y compañeros, para decir que el plan no se cancela pase lo que pase. Es de las expresiones más comunes del inglés británico y aparece en carteles de mercadillos y de fiestas de barrio. En el examen escribe «whatever the weather»: dice lo mismo y es igual de correcta.\",\"register\":\"neutral\",\"note\":\"No se dice «rain or sun»: la pareja fija es rain or shine, y se queda así.\",\"sound\":\"uía GÓU-ing, RÉIN oo SHÁIN\",\"level\":\"a2\",\"itemId\":\"ena2m11whatevertheweather\"}}],\"resources\":[{\"label\":\"BBC Weather — Londres\",\"url\":\"https://www.bbc.co.uk/weather\",\"note\":\"Escribe esta noche el parte de mañana de tu ciudad en cuatro líneas, copiando la plantilla de la lección 3. Es la práctica más barata que hay: cinco minutos y sale un texto entero.\"},{\"label\":\"British Council — A2 Speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Busca el vídeo de «making arrangements» y ensaya encima tu minuto: 30 segundos de papel, noventa de habla y una segunda pasada. Siempre dos veces.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
