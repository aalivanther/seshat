003cb\u003ecould\u003c/b\u003e put a sheet on the noticeboard.\u003c/i\u003e\u003cbr/\u003eOjo a la forma: \u003cb\u003ehow about + -ing\u003c/b\u003e (es preposición, la regla de la lección 3) y \u003cb\u003ewhat if + pasado\u003c/b\u003e (\u003ci\u003ewhat if we \u003cb\u003etried\u003c/b\u003e\u003c/i\u003e, no «what if we try»): ese pasado no es pasado, es una propuesta hipotética y suena mucho más suave.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. OBJETAR CON RAZÓN\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eI'm not so sure about that, \u003cb\u003ebecause\u003c/b\u003e…\u003c/i\u003e · \u003ci\u003eThat's a good point, \u003cb\u003ebut\u003c/b\u003e the lorry can't get down there.\u003c/i\u003e\u003cbr/\u003eYa lo tienes de la lección 8. Sin el «because», el movimiento no cuenta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. CONTRAPROPONER O CEDER\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eWhat if we tried it \u003cb\u003efor six months\u003c/b\u003e and kept a note?\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eThe only fair thing\u003c/b\u003e is to share the cost.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003eI'd be happy \u003cb\u003eto meet you halfway\u003c/b\u003e on that.\u003c/i\u003e\u003cbr/\u003eAquí es donde aparece la palabra del módulo: \u003cb\u003ea compromise\u003c/b\u003e, que \u003cb\u003eNO es «un compromiso»\u003c/b\u003e. Un \u003ci\u003ecompromise\u003c/i\u003e es un acuerdo en el que los dos ceden algo. «Un compromiso» en español es \u003ci\u003ea commitment\u003c/i\u003e o \u003ci\u003ean engagement\u003c/i\u003e. Es uno de los falsos amigos que más cambian el sentido de una frase entera.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e4. CERRAR — y este es el que todo el mundo se deja.\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eRight, so we've agreed to\u003c/b\u003e try it for a month.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eSo, shall we say\u003c/b\u003e Tuesday?\u003c/i\u003e · \u003ci\u003e\u003cb\u003eThat's settled, then.\u003c/b\u003e\u003c/i\u003e\u003cbr/\u003eEl descriptor oficial del Part 3 dice que \u003cb\u003ese espera un intento de acuerdo\u003c/b\u003e. No dice que haya que acordar de verdad: dice que hay que \u003cb\u003eintentarlo en voz alta\u003c/b\u003e. Si los tres minutos se acaban y nadie ha dicho «so we've agreed…», la parte se ha hecho a medias aunque el inglés haya sido impecable. \u003cb\u003eEs la frase más rentable del examen entero\u003c/b\u003e, y se aprende de memoria.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY una fórmula social para empezar el asunto:\u003c/b\u003e \u003ci\u003eI want to \u003cb\u003ehave a word\u003c/b\u003e with someone\u003c/i\u003e — «quiero hablar con alguien», con la idea implícita de que algo no va bien. \u003ci\u003eCan I have a word?\u003c/i\u003e a solas con alguien es el arranque británico de cualquier conversación incómoda."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l9\",\"phaseId\":\"enb1m11\",\"title\":\"How about meeting halfway?\",\"subtitle\":\"Una discusión que no termina en acuerdo no ha terminado — y el examen lo sabe\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las seis piezas de cerrar un trato\",\"itemIds\":[\"enb1m11howabout\",\"enb1m11whatifwe\",\"enb1m11acompromise\",\"enb1m11theonlyfairthing\",\"enb1m11soweveagreed\",\"enb1m11nathaveaword\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Los cuatro movimientos, y por qué el cuarto es el que se olvida\",\"body\":\"$17\",\"table\":[[\"Movimiento\",\"Cómo suena\",\"Ojo con\"],[\"1. Proponer\",\"How about meeting halfway?\",\"how about + -ing\"],[\"2. Objetar con razón\",\"I'm not so sure, because…\",\"sin «because» no cuenta\"],[\"3. Contraproponer\",\"What if we tried it for a month?\",\"what if + pasado\"],[\"4. Cerrar\",\"Right, so we've agreed to try it.\",\"es la que todos olvidan\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l9e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del acuerdo\",\"pairs\":[{\"target\":\"How about meeting halfway?\",\"source\":\"¿Y si nos vemos a medio camino?\"},{\"target\":\"What if we tried it for a month?\",\"source\":\"¿Y si lo probamos un mes?\"},{\"target\":\"a compromise\",\"source\":\"un término medio en el que los dos ceden\"},{\"target\":\"Right, so we've agreed to try it.\",\"source\":\"Vale, entonces quedamos en probarlo.\"}],\"itemIds\":[\"enb1m11howabout\",\"enb1m11whatifwe\",\"enb1m11acompromise\",\"enb1m11soweveagreed\"],\"tip\":\"Las cuatro en orden son una discusión entera. Apréndetelas como una secuencia, no como cuatro frases sueltas: en el examen las vas a necesitar seguidas.\"},{\"id\":\"enb1m11l9e2\",\"type\":\"mc\",\"prompt\":\"La forma de proponer\",\"question\":\"¿Cuál es correcta?\",\"options\":[\"How about meeting halfway?\",\"How about to meet halfway?\",\"How about we meeting halfway?\"],\"answer\":0,\"whyWrong\":[null,\"«About» es preposición, y detrás de preposición va -ing. Es la regla de la lección 3, sin excepciones.\",\"«How about we meet halfway?» sí existe y es muy corriente, pero entonces el verbo va sin -ing. Mezclar las dos formas no vale.\"],\"itemIds\":[\"enb1m11howabout\"],\"tip\":\"Dos formas correctas: «How about meeting…?» y «How about we meet…?». La primera es la que hay que llevar puesta; la segunda te la vas a encontrar en el Listening.\"},{\"id\":\"enb1m11l9e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Cambia UNA cosa.\",\"wrong\":\"How about to meet halfway on the bins?\",\"answers\":[\"How about meeting halfway on the bins?\"],\"why\":\"«About» es preposición: detrás va -ing y nunca infinitivo. El español dice «¿qué tal quedar…?» con infinitivo y de ahí sale el calco.\",\"translation\":\"¿Y si nos vemos a medio camino con lo de los cubos?\",\"itemIds\":[\"enb1m11howabout\"]},{\"id\":\"enb1m11l9e4\",\"type\":\"order\",\"prompt\":\"Ordena los cuatro movimientos de una discusión que sí termina\",\"sentences\":[\"How about putting a gate at each end?\",\"I'm not so sure about that, because the bin lorry can't get down there.\",\"That's a good point. What if we tried it for six months and kept a note?\",\"Right, so we've agreed to try it for six months.\"],\"translation\":\"¿Y si ponemos una verja en cada extremo? — No lo tengo yo tan claro, porque el camión no puede bajar por ahí. — Ahí tienes razón. ¿Y si lo probamos seis meses y vamos anotando? — Vale, entonces quedamos en probarlo seis meses.\",\"itemIds\":[\"enb1m11howabout\",\"enb1m11natnotsosure\",\"enb1m11whatifwe\",\"enb1m11soweveagreed\"],\"tip\":\"Proponer, objetar con razón, contraproponer, cerrar. Cuatro turnos, cuarenta segundos, y el examen entero del Part 3 cabe ahí dentro. Memoriza el esqueleto, no las frases.\"},{\"id\":\"enb1m11l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa la propuesta hipotética\",\"text\":\"What if we ___ it for a month and then decided?\",\"answers\":[\"tried\"],\"translation\":\"¿Y si lo probamos un mes y luego decidimos?\",\"hints\":[\"«What if» pide pasado, aunque hables del futuro\",\"El verbo es «try»\"],\"itemIds\":[\"enb1m11whatifwe\"],\"tip\":\"Ese pasado no cuenta el pasado: hace la propuesta más suave y más hipotética, como el segundo condicional del módulo 5. «What if we try» también se dice, pero suena más directo y menos negociador.\"},{\"id\":\"enb1m11l9e6\",\"type\":\"build\",\"prompt\":\"Construye el movimiento de cierre\",\"target\":\"Right so we've agreed to try it\",\"translation\":\"Vale, entonces quedamos en probarlo\",\"distractors\":[\"trying\",\"for\"],\"itemIds\":[\"enb1m11soweveagreed\",\"enb1m11toinfgroup\"],\"tip\":\"«Agree» está en el montón B: detrás va «to». Y esta frase es la que más puntos por palabra da en todo el examen oral, porque casi nadie la dice.\"},{\"id\":\"enb1m11l9e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la negociación en la puerta del centro cívico\",\"text\":\"«___ meeting halfway on this?» «I'd rather not decide tonight.» «___ we tried it for a month first?» «All right, a month.» «___, so we've agreed to try it for a month.»\",\"answers\":[\"How about\",\"What if\",\"Right\"],\"bank\":[\"How about\",\"What if\",\"Right\",\"Because of\",\"In order to\",\"So as to\"],\"translation\":\"«¿Y si nos vemos a medio camino en esto?» «Prefiero no decidirlo esta noche.» «¿Y si lo probamos un mes primero?» «Vale, un mes.» «Bien, entonces quedamos en probarlo un mes.»\",\"itemIds\":[\"enb1m11howabout\",\"enb1m11whatifwe\",\"enb1m11soweveagreed\",\"enb1m5ifiwereyou\"],\"tip\":\"El tercer hueco es el que cierra, y fíjate en que no aporta ninguna idea nueva: solo repite en voz alta lo acordado. Por eso es tan barato de decir y tan caro de olvidar.\"},{\"id\":\"enb1m11l9e8\",\"type\":\"transform\",\"prompt\":\"De la orden a la propuesta\",\"source\":\"Take the bins round to the front.\",\"instruction\":\"Conviértelo en propuesta con «How about…?»\",\"answers\":[\"How about taking the bins round to the front?\",\"How about taking the bins round to the front\"],\"translation\":\"¿Y si llevamos los cubos a la parte de delante?\",\"hints\":[\"Detrás de «about» ya sabes qué forma va\",\"How about ... the bins round to the front?\"],\"itemIds\":[\"enb1m11howabout\"],\"tip\":\"El imperativo pelado manda; «How about…?» propone. En una discusión entre iguales la diferencia entre las dos es la diferencia entre llegar a un acuerdo y no llegar.\"},{\"id\":\"enb1m11l9e9\",\"type\":\"monologue\",\"prompt\":\"Habla minuto y medio, formato Speaking Part 4. Treinta segundos de notas (cinco palabras sueltas, no frases), y luego habla. Repite: la segunda pasada sale mejor.\",\"topic\":\"A rule in my neighbourhood that I would change\",\"slides\":[{\"title\":\"1. Announce\",\"hint\":\"Di de qué vas a hablar y en cuántos puntos: «I'd like to talk about a rule where I live. I'll say three things.»\"},{\"title\":\"2. What the rule is\",\"hint\":\"La norma, en presente y con el vocabulario del módulo: «You're not meant to… · Parking isn't permitted… · They'll give you a fine if…»\"},{\"title\":\"3. Why it isn't fair, and for whom\",\"hint\":\"Opinión con el molde impersonal: «It isn't fair that… · It's unfair on the people who… · As far as I'm concerned…»\"},{\"title\":\"4. What I would do, and close\",\"hint\":\"Propuesta y cierre: «The only fair thing would be to… · What if they tried…? · All in all, I'd rather…»\"}],\"planSeconds\":30,\"speakSeconds\":90,\"reps\":2,\"checklist\":[\"Hablé al menos 1:15 sin pararme en seco\",\"Anuncié al principio de cuántas cosas iba a hablar\",\"Dije la norma con «you're not meant to» o con «isn't permitted»\",\"Usé al menos una vez el molde impersonal (It isn't fair that… / It takes ages to…)\",\"Marqué una opinión como opinión (as far as I'm concerned / if you ask me)\",\"Propuse algo concreto antes de terminar\",\"Usé al menos tres verbos con su forma correcta detrás (enjoy doing, decided to do, keep doing…)\",\"No dije ni un «for study» ni un «I looked up it»\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Solo el punto 3, para que el resto sea tuyo: «The rule itself is fine. What isn't fair is who ends up paying for it. It's unfair on the people who work nights, because they're asleep at half eight in the morning and that's when the lorry comes. Nobody decided to leave them out, which is almost worse: if somebody had decided it, you could go and have a word with them. As far as I'm concerned, a rule that only works for people who sleep at night isn't finished.»\",\"itemIds\":[\"enb1m11natnotmeantto\",\"enb1m11itisntfairthat\",\"enb1m11unfairon\",\"enb1m11asfarasimconcerned\",\"enb1m11theonlyfairthing\",\"enb1m11nathaveaword\"],\"tip\":\"El barrio es el tema perfecto para el Part 4 porque no se puede contar sin opinar: cualquier norma tiene a alguien a quien le viene mal. Y si te falta un dato, «as far as I know» te saca del apuro sin mentir.\"},{\"id\":\"enb1m11l9e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Lo único justo sería repartir el gasto.\",\"answers\":[\"The only fair thing would be to share the cost\",\"The only fair thing would be to share the cost.\",\"The only fair thing to do would be to share the cost\"],\"hint\":\"Empieza por «The only fair thing…» y sigue con un condicional suave\",\"itemIds\":[\"enb1m11theonlyfairthing\",\"enb1m5ifiwereyou\"],\"tip\":\"«Would be» en vez de «is» hace que la propuesta suene a sugerencia y no a sentencia. Es el mismo truco del «what if we tried»: el condicional negocia y el presente impone.\"},{\"id\":\"enb1m11l9e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Cuidado con el falso amigo\",\"source\":\"In the end we reached a compromise.\",\"answers\":[\"Al final llegamos a un acuerdo en el que los dos cedimos\",\"Al final llegamos a un término medio\",\"Al final llegamos a un acuerdo intermedio\"],\"itemIds\":[\"enb1m11acompromise\"],\"tip\":\"«Compromise» no es «compromiso». Un compromiso en español es «a commitment» (o «an engagement» si es de boda). «Compromise» lleva dentro la idea de que las dos partes han cedido algo — y esa idea es justo lo que el examen quiere oír en el Part 3.\"},{\"id\":\"enb1m11l9e12\",\"type\":\"listen\",\"prompt\":\"Dictado: la frase que cierra cualquier discusión\",\"text\":\"Right, so we've agreed to try it.\",\"translation\":\"Vale, entonces quedamos en probarlo.\",\"strictContractions\":true,\"hints\":[\"Empieza por «Right,» y sigue con la contracción de «we have»\",\"Right, so we've ... to try it\"],\"itemIds\":[\"enb1m11soweveagreed\"],\"tip\":\"Escríbela con su coma después de «Right» y con la contracción: es lo que sonó. Y apréndetela de memoria — es la frase con la que se cierra el Part 3 y la que casi nadie dice.\"},{\"id\":\"enb1m11l9e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Mrs Beckett, en el descansillo. Dos escuchas.\",\"audio\":\"Mrs Beckett, could I have a word?|If it's about the cardboard, I've said what I'm going to say.|It's not about the cardboard. It's about where the note went up.|On the door, where everybody sees it.|Where everybody sees it and nobody knows who it's for. Two of us have been carrying other people's boxes out for a month and we're in the same note as the ones who leave them.|I can't put names on a door.|No, and I'm not asking you to. How about a box by the meter cupboard for a fortnight, and whatever's still in it on the Friday, I take round myself?|And if it doesn't work?|Then you put the note back up and I'll not say another word about it.|Two weeks.|Two weeks.\",\"question\":\"¿Qué han acordado?\",\"options\":[\"Probar quince días con una caja, y si no funciona, vuelve la nota\",\"Que Mrs Beckett ponga los nombres en la nota\",\"Que Valeria deje de sacar las cajas de los demás\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Mrs Beckett lo descarta expresamente y Valeria dice que no se lo está pidiendo.\",\"Es justo al revés: Valeria se ofrece a llevarse lo que quede el viernes.\"],\"itemIds\":[\"enb1m11nathaveaword\",\"enb1m11howabout\",\"enb1m11soweveagreed\",\"enb1m11acompromise\"],\"tip\":\"«Could I have a word?» abre la conversación, y el cierre es de manual: una prueba con plazo y una salida para las dos partes. Fíjate en que ninguna gana — eso es exactamente un compromise.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m11-4\",\"book\":\"I want to complain.\",\"real\":\"I want to have a word with someone.\",\"meaning\":\"Quiero hablar con alguien de esto (algo no va bien)\",\"when\":\"Hablando, y sobre todo cuando la cosa aún se puede arreglar sin papeles: con el casero, con el encargado, con un compañero. «Can I have a word?» a solas es el arranque británico de toda conversación incómoda. En cuanto la cosa va por escrito, la versión de la derecha.\",\"register\":\"neutral\",\"exam\":\"I'd like to make a formal complaint.\",\"note\":\"«Have a word» suena a charla y no lo es: todo el mundo entiende que algo va mal. Es el mismo mecanismo de siempre — decir la mitad para que se entienda el doble.\",\"sound\":\"ai uónt tu jav a uéed uid SÁM-uan\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m11nathaveaword\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Spoken Practice Paper 1\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Baja al Part 3 y lee solo la consigna del interlocutor. Fíjate en la última frase que dice antes de empezar: «let's ask and answer questions to help us decide…». Eso es la tarea entera — decidir, no describir.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
