3ehad\u003c/b\u003e— no cambia el tiempo de la frase. \u003cb\u003eCambia el orden.\u003c/b\u003e Y esa es toda la gramática de hoy: el \u003cb\u003epast perfect\u003c/b\u003e es la señal de que lo que viene \u003cb\u003eya estaba ahí antes\u003c/b\u003e del momento que estás contando.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo se hace, y es lo fácil:\u003c/b\u003e \u003cb\u003ehad\u003c/b\u003e + participio, \u003cb\u003ey ya está\u003c/b\u003e. \u003ci\u003ehad gone\u003c/i\u003e, \u003ci\u003ehad seen\u003c/i\u003e, \u003ci\u003ehad started\u003c/i\u003e, \u003ci\u003ehad been\u003c/i\u003e. \u003cb\u003eUn solo \u003ci\u003ehad\u003c/i\u003e para todo el mundo\u003c/b\u003e: I had, she had, they had — no hay tercera persona que memorizar, no hay \u003ci\u003ehads\u003c/i\u003e. Negativo: \u003ci\u003ehadn't\u003c/i\u003e. En la calle casi siempre se contrae: \u003cb\u003eI'd, she'd, they'd\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl aviso de la contracción\u003c/b\u003e, que vale oro y llega esta semana: \u003cb\u003e'd\u003c/b\u003e puede ser \u003ci\u003ehad\u003c/i\u003e o \u003ci\u003ewould\u003c/i\u003e. Lo desambigua lo que va detrás, siempre:\u003cbr/\u003e· \u003ci\u003eShe'\u003cb\u003ed left\u003c/b\u003e\u003c/i\u003e → participio → es \u003cb\u003ehad\u003c/b\u003e. Ya se había ido.\u003cbr/\u003e· \u003ci\u003eShe'\u003cb\u003ed leave\u003c/b\u003e\u003c/i\u003e → infinitivo → es \u003cb\u003ewould\u003c/b\u003e. Solía irse.\u003cbr/\u003eEn la lección 4 verás la otra mitad de este par.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora lo que nadie explica: cuándo NO hace falta.\u003c/b\u003e El past perfect solo se pone cuando el orden \u003cb\u003eno se ve solo\u003c/b\u003e. Si ya hay una palabra que ordena —\u003cb\u003eafter\u003c/b\u003e, \u003cb\u003ebefore\u003c/b\u003e, \u003cb\u003ethen\u003c/b\u003e—, el pasado simple basta y sobra: \u003ci\u003eAfter he \u003cb\u003ewent\u003c/b\u003e, I found the note\u003c/i\u003e es correcto y es lo que dice un nativo. Ponerlo también con \u003ci\u003ehad\u003c/i\u003e no está mal, pero es innecesario. \u003cb\u003eRegla práctica: si quitas el \u003ci\u003ehad\u003c/i\u003e y el orden se entiende igual, no lo pongas.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDónde se parte el hispanohablante.\u003c/b\u003e El español tiene exactamente esta forma —«ya se había ido»— y aun así el error es constante: se traduce «ya» por \u003ci\u003ealready\u003c/i\u003e y se deja el verbo en pasado simple. \u003ci\u003eWhen I arrived, she already left\u003c/i\u003e no dice lo que quieres decir; dice que se fue después de que llegaras. La palabra que ordena no es \u003ci\u003ealready\u003c/i\u003e: es \u003cb\u003ehad\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l1\",\"phaseId\":\"enb1m10\",\"title\":\"By the time I got there\",\"subtitle\":\"El pasado que ya estaba antes de lo que estás contando\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis frases con dos pisos de pasado\",\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10bythetime\",\"enb1m10hadneverseen\",\"enb1m10hadntrealised\",\"enb1m10afterhehadgone\",\"enb1m10theorderofevents\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no es un tiempo más, es una señal de orden\",\"body\":\"$17\",\"table\":[[\"Lo que quieres contar\",\"Se dice\",\"Por qué\"],[\"Llegué y ya no estaba\",\"When I got there, she had left.\",\"el «had» la manda antes\"],[\"Llegué y entonces se fue\",\"When I got there, she left.\",\"sin «had», todo en orden\"],[\"La peli empezó antes que nosotros\",\"By the time we arrived, the film had started.\",\"«by the time» pide el piso de abajo\"],[\"Se fue, y luego encontré la nota\",\"After he went, I found the note.\",\"«after» ya ordena: el «had» sobra\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"lo que ya estaba antes\",\"pastExample\":\"She had already left.\",\"nowLabel\":\"el momento que cuentas\",\"nowExample\":\"I got there.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro frases con dos pisos\",\"pairs\":[{\"target\":\"When I got there, she had already left.\",\"source\":\"Cuando llegué, ya se había ido.\"},{\"target\":\"By the time we arrived, the film had started.\",\"source\":\"Cuando llegamos, la película ya había empezado.\"},{\"target\":\"I hadn't realised how late it was.\",\"source\":\"No me había dado cuenta de lo tarde que era.\"},{\"target\":\"the order of events\",\"source\":\"el orden de los hechos\"}],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10bythetime\",\"enb1m10hadntrealised\",\"enb1m10theorderofevents\"],\"tip\":\"Fíjate en que el «had» no se traduce por ninguna palabra suelta del español: se reparte dentro del «había». Por eso se olvida tanto al escribir.\"},{\"id\":\"enb1m10l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — el pasado que ya traes puesto\",\"pairs\":[{\"target\":\"I went to the cinema.\",\"source\":\"Fui al cine.\"},{\"target\":\"I saw Amy yesterday.\",\"source\":\"Vi a Amy ayer.\"},{\"target\":\"What happened?\",\"source\":\"¿Qué pasó?\"},{\"target\":\"I came home late.\",\"source\":\"Llegué a casa tarde.\"},{\"target\":\"suddenly\",\"source\":\"de repente\"}],\"targetSeconds\":22,\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2isawamyyesterday\",\"ena2m1whathappened\",\"ena2m2icamehomelate\",\"ena2m2suddenly\"],\"tip\":\"Cinco piezas del A2. Este módulo no las cambia: las pone debajo de otra capa. El pasado simple sigue siendo el suelo del relato.\"},{\"id\":\"enb1m10l1e3\",\"type\":\"mc\",\"prompt\":\"La pregunta del módulo entero\",\"question\":\"«When I got there, she had left.» ¿Qué pasó ANTES?\",\"options\":[\"Que ella se fue\",\"Que yo llegué\",\"Las dos cosas a la vez\"],\"answer\":0,\"whyWrong\":[null,\"Al revés: mi llegada es el momento desde el que cuento, y el «had» manda lo suyo por debajo.\",\"El «had» existe precisamente para decir que NO fue a la vez.\"],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10theorderofevents\"],\"tip\":\"Quédate con esta imagen: el pasado simple va a ras de suelo y el «had» abre un sótano. Todo lo que lleva «had» está en el sótano, o sea, antes.\"},{\"id\":\"enb1m10l1e4\",\"type\":\"bucket\",\"prompt\":\"¿Hace falta el «had» o el orden ya se ve sin él?\",\"categories\":[\"Hace falta el past perfect\",\"Con el pasado simple basta\"],\"items\":[{\"text\":\"When I arrived, everybody ___ gone home.\",\"bucket\":0},{\"text\":\"After he ___ home, I washed up.\",\"bucket\":1},{\"text\":\"By the time she rang, I ___ already eaten.\",\"bucket\":0},{\"text\":\"First I ___ Amy, then I rang Ben.\",\"bucket\":1},{\"text\":\"I couldn't get in because I ___ left my keys at work.\",\"bucket\":0},{\"text\":\"Before she left, she ___ a note.\",\"bucket\":1}],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10afterhehadgone\",\"enb1m10bythetime\"],\"tip\":\"Mira lo que tienen en común las de la derecha: todas llevan ya una palabra que ordena (after, then, before). El past perfect entra cuando NO hay ninguna y el orden se saldría del texto.\"},{\"id\":\"enb1m10l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Añade UNA palabra.\",\"wrong\":\"When I got there, she already left.\",\"answers\":[\"When I got there, she had already left.\"],\"why\":\"«Already» no ordena nada: solo dice «ya». Lo que manda la salida por debajo de la llegada es «had». Sin él, la frase cuenta que se fue DESPUÉS de que llegaras, que es justo lo contrario.\",\"translation\":\"Cuando llegué, ya se había ido.\",\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m1already\"]},{\"id\":\"enb1m10l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa la frase\",\"text\":\"We couldn't get in. The film ___ already started.\",\"answers\":[\"had\",\"'d\"],\"translation\":\"No pudimos entrar. La película ya había empezado.\",\"hints\":[\"Tres letras, y detrás va un participio\",\"Es la palabra que abre el sótano\"],\"itemIds\":[\"enb1m10bythetime\"],\"tip\":\"Un solo «had» para todos los sujetos: the film had, we had, they had. Es de los pocos sitios del inglés donde no hay que pensar en la persona.\"},{\"id\":\"enb1m10l1e7\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"I hadn't realised how late it was\",\"translation\":\"No me había dado cuenta de lo tarde que era\",\"distractors\":[\"didn't\",\"have\"],\"itemIds\":[\"enb1m10hadntrealised\"],\"tip\":\"Las dos fichas que sobran son las dos salidas fáciles: «didn't realise» (pasado simple, se entiende pero pierde el orden) y «have» (presente perfecto, que aquí no pinta nada porque todo esto ya terminó).\"},{\"id\":\"enb1m10l1e8\",\"type\":\"transform\",\"prompt\":\"Dos frases, un solo relato\",\"source\":\"She left at six. I got there at seven.\",\"instruction\":\"Júntalas en una, empezando por «When I got there…»\",\"answers\":[\"When I got there, she had already left\",\"When I got there, she had left\",\"When I got there, she had already left.\",\"When I got there, she had left.\"],\"translation\":\"Cuando llegué, ya se había ido.\",\"hints\":[\"La que pasó ANTES es la que lleva «had»\",\"When I got there, she ... left\"],\"itemIds\":[\"enb1m10hadalreadyleft\"],\"tip\":\"Al juntar dos frases en una, el inglés no repite las horas: deja que el «had» haga el trabajo del reloj. Eso es lo que el examen llama «rango de estructuras».\"},{\"id\":\"enb1m10l1e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje de Valeria a Emma\",\"text\":\"I got to the café at half four and Sam ___ already gone. Nobody ___ told me he finished early on Fridays. I ___ never felt so silly in my life.\",\"answers\":[\"had\",\"had\",\"had\"],\"bank\":[\"had\",\"have\",\"has\",\"was\",\"did\"],\"translation\":\"Llegué al café a las cuatro y media y Sam ya se había ido. Nadie me había dicho que los viernes acaba antes. En mi vida me había sentido tan tonta.\",\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10hadneverseen\"],\"tip\":\"Tres huecos y la misma palabra en los tres: «had» no cambia con el sujeto. Y fíjate en que los tres verbos de después son participios (gone, told, felt), que es la otra mitad de la fórmula.\"},{\"id\":\"enb1m10l1e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Nunca la había visto tan disgustada.\",\"answers\":[\"I had never seen her so upset\",\"I'd never seen her so upset\",\"I had never seen her so upset.\",\"I'd never seen her so upset.\"],\"hint\":\"El adverbio de negación va ENTRE el auxiliar y el participio\",\"itemIds\":[\"enb1m10hadneverseen\",\"enb1m10upset\"],\"tip\":\"«Never» se mete en medio: had NEVER seen. Es el mismo sitio que ocupa en el presente perfecto que traes del m1 («I've never been to Scotland»): el sistema no cambia, solo baja un piso.\"},{\"id\":\"enb1m10l1e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"After he had gone, I found the note.\",\"answers\":[\"Después de que se fuera, encontré la nota\",\"Cuando se fue, encontré la nota\",\"Después de irse él, encontré la nota\"],\"itemIds\":[\"enb1m10afterhehadgone\"],\"tip\":\"Aquí el «had» es opcional: «After he went, I found the note» dice exactamente lo mismo, porque «after» ya ordena. Reconocerlo es de nivel; obligarse a ponerlo, no.\"},{\"id\":\"enb1m10l1e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"By the time we arrived, the film had started.\",\"translation\":\"Cuando llegamos, la película ya había empezado.\",\"hints\":[\"Empieza por «By the time…»\",\"By the time we arrived, the film ...\"],\"itemIds\":[\"enb1m10bythetime\"],\"tip\":\"«Had started» suena casi pegado: «jad-STÁA-tid», con la «d» del had comida por la «s». Si no la oyes, la pista es el participio: donde hay participio, hubo «had».\"},{\"id\":\"enb1m10l1e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen: lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"You look like you've had a day of it.|I went all the way to Highbury for nothing. She'd moved.|Moved?|Moved. In February. The girl downstairs told me. Apparently she'd left a forwarding address with the landlord and he never passed it on.|Oh, Valeria.|Two buses. In the rain.|Right. Kettle.\",\"question\":\"¿Por qué el viaje de Valeria no sirvió de nada?\",\"options\":[\"Porque la persona a la que iba a ver ya se había mudado antes\",\"Porque llegó tarde y no la encontró en casa\",\"Porque se equivocó de dirección\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No es cuestión de hora: «She'd moved. In February.» La mudanza fue meses antes.\",\"La dirección era la buena; lo que fallaba era que estaba vieja.\"],\"itemIds\":[\"enb1m10hadalreadyleft\",\"enb1m10theorderofevents\"],\"tip\":\"Escucha cuántas veces suena la contracción «'d»: she'd moved, she'd left. En el habla real el past perfect casi nunca se pronuncia entero, y aun así es la única pista de qué pasó primero.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — The past perfect\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/course/upper-intermediate/unit-1\",\"note\":\"Cinco minutos y una sola idea: escucha cuántas veces dicen «'d» y no «had». Si entrenas el oído para la contracción, el Listening deja de ocultarte el orden de los hechos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"
