ooklike\",\"ena2m3whatsshelike\",\"ena2m3thewomanintheredcoat\",\"ena2m1howaboutyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El retrato en cuatro pasos\",\"body\":\"$17\",\"table\":[[\"paso\",\"qué dices\",\"ejemplo\"],[\"1. aspecto\",\"be + adjetivo · have + sustantivo\",\"She's quite tall and she has short dark hair.\"],[\"2. ropa\",\"in + prenda\",\"She's the woman in the red coat.\"],[\"3. carácter\",\"graduador + adjetivo\",\"She's very friendly, but she's a bit shy.\"],[\"4. lo que hace\",\"verbo + objeto + adverbio\",\"She speaks English very well.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — todo esto ya lo tienes\",\"pairs\":[{\"target\":\"quite\",\"source\":\"bastante\"},{\"target\":\"a bit\",\"source\":\"un poco\"},{\"target\":\"so\",\"source\":\"tan / qué\"},{\"target\":\"well\",\"source\":\"bien\"},{\"target\":\"slowly\",\"source\":\"despacio\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m3quitetall\",\"ena2m3abitshy\",\"ena2m3sonice\",\"ena2m3well\",\"ena2m3slowly\"],\"tip\":\"El cronómetro solo premia. Si sale sin pensar, está consolidado; si te paras, ese ítem volverá en el repaso.\"},{\"id\":\"ena2m3l9e2\",\"type\":\"gapbank\",\"prompt\":\"Nora, la vecina: rellena con la ficha que toca\",\"text\":\"Nora is my neighbour. She has short white hair and she ___ glasses. She's the woman ___ the green coat. She talks very ___, so I understand everything. She's a bit ___, but she's so nice.\",\"answers\":[\"wears\",\"in\",\"slowly\",\"shy\"],\"bank\":[\"wears\",\"in\",\"slowly\",\"shy\",\"quickly\",\"on\"],\"translation\":\"Nora es mi vecina. Tiene el pelo corto y blanco, y lleva gafas. Es la mujer del abrigo verde. Habla muy despacio, así que la entiendo todo. Es un poco tímida, pero es majísima.\",\"itemIds\":[\"ena2m3glasses\",\"ena2m3thewomanintheredcoat\",\"ena2m3slowly\",\"ena2m3shy\",\"ena2m3green\"],\"tip\":\"El tercer hueco lo decide el «so I understand everything»: si hablara deprisa, no la entenderías. En el examen, la mitad de los huecos se resuelven así, por lo que viene después.\"},{\"id\":\"ena2m3l9e3\",\"type\":\"bucket\",\"prompt\":\"¿Contesta a «What does she look like?» o a «What's she like?»\",\"categories\":[\"look like: aspecto\",\"like: carácter\"],\"items\":[{\"text\":\"She's tall with dark hair\",\"bucket\":0},{\"text\":\"She's very friendly\",\"bucket\":1},{\"text\":\"She wears glasses\",\"bucket\":0},{\"text\":\"She's a bit shy\",\"bucket\":1},{\"text\":\"She has big blue eyes\",\"bucket\":0},{\"text\":\"She's so funny\",\"bucket\":1}],\"itemIds\":[\"ena2m3whatdoesshelooklike\",\"ena2m3whatsshelike\",\"ena2m3friendly\",\"ena2m3abitshy\"],\"tip\":\"En el oral te pueden hacer cualquiera de las dos. Si contestas a la que no era, pierdes la marca de Task Fulfilment aunque el inglés sea perfecto.\"},{\"id\":\"ena2m3l9e4\",\"type\":\"mc\",\"prompt\":\"«Se parece a su padre»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"He looks like his dad.\",\"He looks his dad.\",\"He seems his dad.\"],\"answer\":0,\"whyWrong\":[null,\"Sin like, «he looks» es «tiene pinta de» y pide un adjetivo: he looks tired\",\"seem es «parecer» de opinión, no de parecido físico\"],\"itemIds\":[\"ena2m3helookslikehisdad\"],\"tip\":\"look + adjetivo = «tener pinta»: he looks tired. look LIKE + persona o cosa = «parecerse a»: he looks like his dad.\"},{\"id\":\"ena2m3l9e5\",\"type\":\"errorfix\",\"prompt\":\"Espiral: corrige la terminación\",\"wrong\":\"I'm very interesting in this book.\",\"answers\":[\"I'm very interested in this book.\"],\"why\":\"-ed para lo que sientes tú, -ing para lo que lo provoca. El libro es interesting; tú estás interested in él. Es el error nº 1 de la lección 7 y sobrevive hasta B2 si nadie lo nombra.\",\"translation\":\"Este libro me interesa mucho.\",\"itemIds\":[\"ena2m3iminterestedin\",\"enbook\"]},{\"id\":\"ena2m3l9e6\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"She's quite tall and she has long dark hair.\",\"answers\":[\"Es bastante alta y tiene el pelo largo y moreno.\",\"Es bastante alta y tiene el pelo largo y oscuro.\",\"Ella es bastante alta y tiene el pelo largo y moreno.\"],\"itemIds\":[\"ena2m3quitetall\",\"ena2m3longdarkhair\"],\"tip\":\"Fíjate en lo que cambia de sitio al traducir: en inglés los adjetivos van delante del sustantivo y en español detrás. Es la misma frase del revés.\"},{\"id\":\"ena2m3l9e7\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Es un poco tímido, pero es majísimo.\",\"answers\":[\"He's a bit shy, but he's so nice.\",\"He is a bit shy, but he is so nice.\",\"He's a bit shy, but he's very nice.\"],\"hint\":\"el «un poco» solo cabe porque tímido es algo negativo\",\"itemIds\":[\"ena2m3abitshy\",\"ena2m3sonice\"]},{\"id\":\"ena2m3l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"She's very beautiful.\",\"forbid\":[\"beautiful\",\"very\"],\"answers\":[\"She's stunning.\",\"She's so lovely.\"],\"translation\":\"Es guapísima.\",\"itemIds\":[\"ena2m3beautiful\",\"ena2m3sonice\"],\"tip\":\"Decir lo mismo por otro camino es lo que te salva en el oral cuando no te sale una palabra. Las dos salidas te las dieron las píldoras de las lecciones 2 y 5.\"},{\"id\":\"ena2m3l9e9\",\"type\":\"order\",\"prompt\":\"Ordena el retrato de Nora\",\"sentences\":[\"This is my neighbour Nora.\",\"She's quite old and she has short white hair.\",\"She always wears a green coat and glasses.\",\"She's a bit shy, but she's so nice.\",\"Yesterday she cooked dinner for me and it was delicious.\"],\"translation\":\"Esta es mi vecina Nora. Es bastante mayor y tiene el pelo corto y blanco. Siempre lleva un abrigo verde y gafas. Es un poco tímida, pero es majísima. Ayer me hizo la cena y estaba riquísima.\",\"itemIds\":[\"ena2m3quitetall\",\"ena2m3shorthair\",\"ena2m3glasses\",\"ena2m3abitshy\",\"endelicious\"],\"tip\":\"Ese es el orden de un retrato: quién es, cómo es por fuera, qué lleva, cómo es por dentro y una anécdota. Sirve igual para el oral y para el escrito.\"},{\"id\":\"ena2m3l9e10\",\"type\":\"audiomc\",\"prompt\":\"Identificar a alguien por la descripción — 2 escuchas\",\"audio\":\"The woman in the red coat is quite tall and she has short dark hair. She wears glasses.\",\"question\":\"¿Cuál de las tres es?\",\"options\":[\"Alta, pelo corto moreno y gafas\",\"Alta, pelo largo moreno y gafas\",\"Bajita, pelo corto y sin gafas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El pelo es corto: short hair, no long\",\"Es quite tall y sí lleva gafas\"],\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3quitetall\",\"ena2m3shorthair\",\"ena2m3glasses\"],\"tip\":\"En la Parte 1 del Listening cada frase trae dos datos y los distractores cambian solo uno. Apunta los dos y compara después.\"},{\"id\":\"ena2m3l9e11\",\"type\":\"monologue\",\"prompt\":\"La misión del módulo: describe a una persona real y que otro la reconozca\",\"topic\":\"Una persona que conoces bien, en un minuto\",\"slides\":[{\"title\":\"1. Quién es y cómo es por fuera\",\"hint\":\"She's quite tall. She has short dark hair. She wears glasses.\"},{\"title\":\"2. Qué suele llevar puesto\",\"hint\":\"She's the woman in the red coat. She always wears boots.\"},{\"title\":\"3. Cómo es por dentro\",\"hint\":\"She's very friendly, but she's a bit shy. She's so funny.\"},{\"title\":\"4. Qué hace y cómo lo hace\",\"hint\":\"She works hard. She cooks really well. She speaks English very well.\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He usado be para lo que ES y have para lo que TIENE\",\"He dicho al menos dos graduadores distintos (quite, so, a bit, very)\",\"He puesto dos adjetivos seguidos en el orden correcto delante del sustantivo\",\"He usado un adverbio de modo, y no lo he metido entre el verbo y su objeto\",\"He cerrado devolviendo la pregunta: «What's your neighbour like?»\"],\"model\":\"This is my neighbour Nora. She's quite old and she's not very tall. She has short white hair and she wears big glasses. In winter she's the woman in the long green coat, always with her brown boots. She's a bit shy with new people, but she's so nice: she talks to me every morning. She speaks Spanish very well because her husband was from Madrid, and she cooks really well too. What's your neighbour like?\",\"itemIds\":[\"ena2m3quitetall\",\"ena2m3shorthair\",\"ena2m3glasses\",\"ena2m3thewomanintheredcoat\",\"ena2m3abitshy\",\"ena2m3sonice\",\"ena2m3shespeaksenglishverywell\",\"ena2m3well\"],\"tip\":\"Grábate las dos veces y compara: la segunda siempre sale mejor, y esa es la que te llevas al examen. Después enséñale la grabación a alguien y pregúntale si sabría reconocer a esa persona por la calle. Si sabe, la misión está cumplida.\"},{\"id\":\"ena2m3l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — todo en una frase\",\"question\":\"La mujer del abrigo rojo es bastante alta, habla despacio y es majísima.\",\"answers\":[\"The woman in the red coat is quite tall, she speaks slowly and she's so nice.\",\"The woman in the red coat is quite tall, she speaks slowly and she is so nice.\",\"The woman in the red coat is quite tall, speaks slowly and is so nice.\"],\"hints\":[\"in para la ropa · quite delante del adjetivo · slowly detrás del verbo\",\"The woman i… the red coat is q… tall, she speaks slow… and she's s… nice.\"],\"itemIds\":[\"ena2m3thewomanintheredcoat\",\"ena2m3quitetall\",\"ena2m3slowly\",\"ena2m3sonice\"],\"tip\":\"Ahí está el módulo entero: la ropa con in, el orden de los adjetivos, el graduador delante y el adverbio detrás del verbo. Con esto ya describes a cualquiera — y no vuelves a decir «I like very much this film».\"}]}],\"resources\":[{\"label\":\"British Council — A2 Speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Ensaya el minuto con los vídeos de descripción: 30 segundos de papel, uno de habla y una segunda pasada. Siempre dos veces, que la segunda es la buena.\"},{\"label\":\"LanguageCert — ESOL A2 Access (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Mira solo la Parte 3 del Spoken: dos imágenes, semejanzas y diferencias. Es exactamente lo que has entrenado en este módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
