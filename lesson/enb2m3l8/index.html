turas: ella es tu igual)\",\"On hold… passed me… That's not right, is it?\",\"I've written. Unless they refund by Friday…\",\"Cierre corto con tu nombre. Sin Yours sincerely\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"unless\",\"despite\",\"although\",\"so\",\"then\",\"anyway\",\"even if\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"Hi Amy,\\nThe thing is, there is an unauthorised charge of £47.50 on the statement — a direct debit I never set up. I rang the call centre after lunch. Despite being promised a call back, I was on hold for forty minutes and they passed me from billing to complaints and back again. That's not right, is it?\\nAnyway, I have written to them with the reference number from the call. I asked for a full refund, not a partial one, and I copied the three facts into the first paragraph. Unless they sort it by Friday, I will escalate it under their own procedure. I take their point that the system shows it as authorised, although it still isn't mine.\\nIf you're back before then, any chance you could look at the letter? I don't want to sound like a bank. I just want the money back in the account. Fair enough?\\nValeria\",\"itemIds\":[\"enb2m3unauthorised\",\"enb2m3onhold\",\"enb2m3passedaround\",\"enb2m3despitebeing\",\"enb2m3unlessi\",\"enb2m3natnotright\",\"enb2m3natfairenough\",\"enb2m3natanychancehelp\"],\"tip\":\"Cuenta 150-200. Si se te ha colado Yours sincerely o I would be grateful, has escrito al banco otra vez. Esta carta es a Amy: Hi, the thing is, fair enough.\"},{\"id\":\"enb2m3l8e5\",\"type\":\"mc\",\"prompt\":\"Fuga de registro\",\"question\":\"En la carta a Amy, ¿cuál de estas tumba el registro directo?\",\"options\":[\"I would be grateful if you could look at the letter.\",\"Any chance you could look at the letter?\",\"That's not right, is it?\"],\"answer\":0,\"whyWrong\":[null,\"Esa es la altura de igual a igual. Es la que toca.\",\"El tag de contradicción es de cocina, y aquí está bien.\"],\"itemIds\":[\"enb2m2iwouldbegrateful\",\"enb2m3natanychancehelp\"]},{\"id\":\"enb2m3l8e6\",\"type\":\"paraphrase\",\"prompt\":\"Baja el registro — sin «in the light of»\",\"source\":\"In the light of what happened, I wrote.\",\"forbid\":[\"light\"],\"answers\":[\"Because of what happened, I wrote\",\"Because of what happened, I wrote.\",\"After what happened, I wrote\",\"Given what happened, I wrote\"],\"itemIds\":[\"enb2m3inlightof\"]},{\"id\":\"enb2m3l8e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Acepto a regañadientes la devolución parcial.\",\"answers\":[\"I reluctantly accept the partial refund.\",\"I reluctantly accept a partial refund.\"],\"itemIds\":[\"enb2m3reluctantly\",\"enb2m3partialrefund\"]},{\"id\":\"enb2m3l8e8\",\"type\":\"cloze\",\"prompt\":\"El unless de la carta formal, que aquí también vale\",\"text\":\"___ I hear from them by Friday, I'll escalate.\",\"answers\":[\"Unless\"],\"itemIds\":[\"enb2m3unlessi\"]},{\"id\":\"enb2m3l8e9\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — a Amy, no al banco\",\"text\":\"That's not right, is it? Any chance you could look at the letter?\",\"phonetic\":\"dhats not rait, is̬ it? É-ni chaans yu kud luk at de LÉ-ta\",\"translation\":\"Eso no está bien, ¿verdad? ¿Hay alguna posibilidad de que mires la carta?\",\"itemIds\":[\"enb2m3natnotright\",\"enb2m3natanychancehelp\"]},{\"id\":\"enb2m3l8e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Estoy de acuerdo, con reservas.\",\"answers\":[\"I agree, with reservations.\",\"I agree with reservations.\"],\"itemIds\":[\"enb2m3withreservations\"]},{\"id\":\"enb2m3l8e11\",\"type\":\"listen\",\"prompt\":\"Dictado — la cocina\",\"text\":\"Yeah, fair enough. I'll write tonight.\",\"translation\":\"Vale, de acuerdo. Escribo esta noche.\",\"itemIds\":[\"enb2m3natfairenough\"]},{\"id\":\"enb2m3l8e12\",\"type\":\"audiomc\",\"prompt\":\"LISTENING LARGO · Amy responde desde el hospital. Pregunta 1 de 2. Cuaderno. Dos escuchas.\",\"notepad\":true,\"audio\":\"Got it. Don't put «this is a joke» in the bank letter — that's for me. Far from satisfied, reference number, Friday. That's the height. And don't put «Yours sincerely» in the WhatsApp. That's the other height. You did both in one afternoon. That's the module, love. I'll read the letter when I'm off. Fair enough?\",\"question\":\"¿Qué le prohíbe Amy poner en la carta al banco?\",\"options\":[\"This is a joke — eso es para ella, en el WhatsApp\",\"El número de referencia\",\"Far from satisfied\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El número de referencia ES lo que tiene que ir.\",\"Far from satisfied es la altura de la carta, y Amy la aprueba.\"],\"itemIds\":[\"enb2m3natjoke\",\"enb2m3farfromsatisfied\",\"enb2m3threeregisters\"]},{\"id\":\"enb2m3l8e13\",\"type\":\"audiomc\",\"prompt\":\"Misma respuesta de Amy · pregunta 2 de 2.\",\"notepad\":true,\"audio\":\"Got it. Don't put «this is a joke» in the bank letter — that's for me. Far from satisfied, reference number, Friday. That's the height. And don't put «Yours sincerely» in the WhatsApp. That's the other height. You did both in one afternoon. That's the module, love. I'll read the letter when I'm off. Fair enough?\",\"question\":\"¿Qué le prohíbe Amy poner en el WhatsApp?\",\"options\":[\"Yours sincerely — esa es la otra altura\",\"Fair enough\",\"Got it\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Fair enough es su cierre, y es de cocina.\",\"Got it es lo primero que dice ella misma.\"],\"itemIds\":[\"ena2m12yourssincerely\",\"enb2m3gotit\",\"enb2m3natfairenough\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/sesha
