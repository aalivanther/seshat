tent\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tb32,"])</script><script>self.__next_f.push([1,"Present: Mrs Beckett (chair), Tomasz Wójcik (minutes), Valeria Soto (2B), Nora Keane (ground floor), Ben Carter (by phone). Apologies: Amy Wright, night shift.\u003cbr/\u003e\u003cbr/\u003eThe meeting opened at 18.30. Mrs Beckett reported that the sinking fund now holds £14,600, following a repayment from the insurer that nobody on the committee had been expecting. Never before had the building sat down with a figure of this size. Four informal ideas had already been put forward on the stairs; the purpose of the meeting was to turn at least one of them into a motion.\u003cbr/\u003e\u003cbr/\u003eIdea 1, from Nora: a lift, or, failing that, a stairlift to the first floor, in the interests of step-free access. Nora, who had been on the ground floor for eleven years, said she was not asking for herself alone. Buggies, deliveries, and anyone who came home with a suitcase used the same stairs. There ought to be a way to reach the first floor without carrying a life on one hip.\u003cbr/\u003e\u003cbr/\u003eIdea 2, from the fourth floor, tabled in writing: restore the communal garden, which had been closed since the boiler leak. The letter argued for family life and for equal opportunities for children who had no other outdoor space. It did not mention a cost.\u003cbr/\u003e\u003cbr/\u003eIdea 3, from Tomasz: a new boiler. The current one had failed twice this winter. Neither of the last two repairs had lasted a month. He advised the meeting not to spend the whole fund on a garden that would freeze if the heating failed again.\u003cbr/\u003e\u003cbr/\u003eIdea 4, from Ben, by phone: paint the hall and fix the bike store. Cheap, visible, done in a fortnight. Not only is it cheaper, he said, it is also the one thing every floor would see.\u003cbr/\u003e\u003cbr/\u003eNo motion was passed. The chair asked for written proposals by Friday. The meeting closed at 19.10. These minutes do not recommend. They record.\u003cbr/\u003e\u003cbr/\u003eA note on procedure, because it was asked. Mrs Beckett remains chair until June. Votes are by show of hands of those present; proxies are not accepted. The £14,600 cannot be spent without a motion that names a supplier or a date. Ideas on the stairs are not motions. Tomasz Wójcik will keep the minutes and will obtain two quotes for the boiler and one for a stairlift, for information only, before Friday. He is not, by taking minutes, proposing. Equal opportunities were mentioned twice and not defined. Care for the elderly was mentioned once, by Nora, in relation to the stairs. Family life was mentioned in the letter from 4C, which is attached. Individual rights were not discussed. The chair thanked those who had come and those who were on a shift. The next meeting is Friday at 18.30, same room. Tea is not provided. Anyone who cannot attend may send a written comment to the chair by Thursday evening; it will be read out, not voted on. The sinking fund remains in the building account until a motion names a supplier and a date."])</script><script>self.__next_f.push([1,"18:Ta97,"])</script><script>self.__next_f.push([1,"I was at the meeting. I will not pretend I took minutes. I went upstairs angry, and I am still angry, and anger is allowed to have a postcode.\u003cbr/\u003e\u003cbr/\u003eThe sinking fund is fourteen thousand pounds that nobody earned by being right. It came from an insurer. The building did not become wiser because a cheque arrived. What it became is a test of what we think a neighbour is for. Nora wants a lift. Tomasz wants a boiler. Ben wants paint. I want the garden that has been locked since October, with a notice that says «pending works» and no works pending.\u003cbr/\u003e\u003cbr/\u003eFamily life in this street happens in that rectangle of earth. Children who cannot be in the park after four because it is too far, and parents who cannot be in two places, and elderly people who cannot manage the bus to the common: that is not a hobby. That is care for the elderly and parental responsibility happening in the same square of ground. Equal opportunities are not only jobs and schools. They are also a door that opens onto grass.\u003cbr/\u003e\u003cbr/\u003eI see the lift. I see the boiler. I do not see why the garden has to lose so that a machine can win. What if we split the money? A decent boiler on the existing system, the garden restored, the lift put back on the agenda for the next fund. Neither of the big plans works on its own if the people they are for have nowhere to stand while they wait.\u003cbr/\u003e\u003cbr/\u003eMrs Beckett will say this is not the paper's business. She is right that it is ours. She is wrong that it is private. A building that cannot decide whether a child may sit on a patch of earth is a building that has already decided. That strikes me as unfair, and I would rather say so here, in a paper, than on the stairs where it turns into a row. Shall we agree, at least, that the garden is not the leftover?\u003cbr/\u003e\u003cbr/\u003eI will add one thing that did not fit into the three minutes we were given. Social responsibilities are easy to print on a noticeboard and hard to vote for when the alternative is a machine. Parental responsibilities, in this street, include finding a patch of ground that is not a car park and not a stairwell. Individual rights include Nora's right to reach her own door without performing a sport. None of those sentences is poetry. They are the minutes we did not take. If the Weekly will print them, the Friday meeting will have to read them. If it will not, I will pin them on the board next to the «pending works» sign, which has been pending since October, and which nobody, to date, has voted to take down. I have lived here six years. I have never seen this building agree on a date. Friday would be a start. Never had I thought a cheque would force us to say what we owe each other, but here we are."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m11l6\",\"phaseId\":\"enb2m11\",\"title\":\"The same money, two reports\",\"subtitle\":\"Un acta que informa y una carta que convence: el fondo de reserva no es neutro\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El dinero del edificio, con nombre\",\"itemIds\":[\"enb2m11asinkingfund\",\"enb2m11theresidentsmeeting\",\"enb2m11amotion\",\"enb2m11thegroundfloor\",\"enb2m11stepfreeaccess\",\"enb2m3carefortheelderly\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El acta no se moja; la vecina sí\",\"body\":\"Las dos lecturas hablan del mismo [[sinking fund|fondo de reserva]]: ha aparecido un dinero, y la junta tiene que votar. La primera es el \u003cb\u003eacta\u003c/b\u003e que redacta Tomasz, que es el técnico y el que toma nota: informa, enumera, no recomienda. La segunda es una \u003cb\u003ecarta al editor del semanario\u003c/b\u003e de una vecina del cuarto que quiere el jardín. Mismo fondo, dos posturas. Valeria las lee en la mesa de la cocina, con Amy de turno de noche. Palmer Road no se ha mudado.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m11l6e1\",\"type\":\"read\",\"prompt\":\"Lectura 1 — el acta. ¿Informa, o convence?\",\"title\":\"Minutes of the residents' meeting, 14 March\",\"source\":\"Acta tomada por Tomasz Wójcik, técnico de mantenimiento del edificio. Adaptada.\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m11l6e1q1\",\"q\":\"¿Cuánto hay en el fondo, y de dónde sale?\",\"options\":[\"14.600 libras, de un reembolso del seguro.\",\"14.600 libras, de una derrama nueva.\",\"No se dice la cifra a propósito.\"],\"answer\":0,\"why\":\"£14,600 following a repayment from the insurer.\"},{\"id\":\"enb2m11l6e1q2\",\"q\":\"¿Qué pide Nora, y con qué argumento que no es solo el suyo?\",\"options\":[\"Acceso sin escalón, también para carritos y maletas.\",\"Que le pongan un jardín en la planta baja.\",\"Que se pinte el portal.\"],\"answer\":0,\"why\":\"Step-free access; buggies, deliveries, suitcases. No está pidiendo solo para ella.\"},{\"id\":\"enb2m11l6e1q3\",\"q\":\"«These minutes do not recommend. They record.» ¿Qué está haciendo Tomasz con esa frase?\",\"options\":[\"Declarar la postura del acta: informar, no convencer.\",\"Confesar que no se enteró de la junta.\",\"Pedir que alguien copie las ideas en limpio.\"],\"answer\":0,\"inference\":true,\"why\":\"Es la frase de postura. Un acta que recomienda deja de ser acta. Tomasz lo dice para que no se la lean como una carta.\"},{\"id\":\"enb2m11l6e1q4\",\"q\":\"Tomasz, en el acta, «advised the meeting not to spend the whole fund on a garden». ¿Eso es informar o ya es convencer?\",\"options\":[\"Es el borde: registra su consejo como técnico, y el consejo tiene dirección.\",\"Es neutro: solo cita a Ben.\",\"Es una moción ya votada.\"],\"answer\":0,\"inference\":true,\"why\":\"Advised not to es una orden reportada en negativo, y es la suya. El acta no es tan plana como la última frase pretende. Un B2 lo nota.\"},{\"id\":\"enb2m11l6e1q5\",\"q\":\"¿Se votó algo?\",\"options\":[\"No. Se pidieron propuestas por escrito para el viernes.\",\"Sí: el ascensor, por mayoría.\",\"Sí: la caldera, porque Tomasz preside.\"],\"answer\":0,\"why\":\"No motion was passed. Written proposals by Friday.\"}],\"itemIds\":[\"enb2m11asinkingfund\",\"enb2m11amotion\",\"enb2m11stepfreeaccess\",\"enb2m11thereoughttobe\"]},{\"id\":\"enb2m11l6e2\",\"type\":\"read\",\"prompt\":\"Lectura 2 — la carta de la cuarta planta. ¿Informa, o convence?\",\"title\":\"A garden is not a luxury\",\"source\":\"Carta al Palmer Road Weekly, firmada por «a resident, 4C». Adaptada.\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m11l6e2q1\",\"q\":\"¿Qué quiere la autora, en concreto?\",\"options\":[\"Reabrir el jardín, y partir el dinero con la caldera.\",\"El ascensor, porque Nora es su amiga.\",\"Pintar el portal, que es lo más barato.\"],\"answer\":0,\"why\":\"Split: boiler + garden, lift later. No pide el lift ahora.\"},{\"id\":\"enb2m11l6e2q2\",\"q\":\"«Equal opportunities are not only jobs and schools.» ¿Qué está ensanchando?\",\"options\":[\"El campo SOCIETY: la igualdad también es un trozo de tierra en el edificio.\",\"La definición legal de discriminación laboral.\",\"El reglamento de Mrs Beckett.\"],\"answer\":0,\"inference\":true,\"why\":\"Lo dice con esas palabras. Un B2 que lea equal opportunities solo como «trabajo» se pierde la tesis.\"},{\"id\":\"enb2m11l6e2q3\",\"q\":\"¿Por qué escribe en el periódico y no en el rellano?\",\"options\":[\"Porque en el rellano se convierte en bronca, y aquí queda como argumento.\",\"Porque Mrs Beckett le ha prohibido hablar en la junta.\",\"Porque el acta de Tomasz es mentira.\"],\"answer\":0,\"why\":\"«rather say so here, in a paper, than on the stairs where it turns into a row.»\"},{\"id\":\"enb2m11l6e2q4\",\"q\":\"«A building that cannot decide whether a child may sit on a patch of earth is a building that has already decided.» ¿Qué infiere?\",\"options\":[\"Que no decidir ya es una decisión, y es en contra del jardín.\",\"Que los niños han votado en secreto.\",\"Que el seguro va a pedir el dinero de vuelta.\"],\"answer\":0,\"inference\":true,\"why\":\"Has already decided: la inacción no es neutra. Es la frase más B2 de la carta.\"},{\"id\":\"enb2m11l6e2q5\",\"q\":\"Las dos lecturas, juntas: ¿en qué coinciden?\",\"options\":[\"En la cifra, en las cuatro ideas, y en que no se ha votado todavía.\",\"En que el jardín tiene que ganar.\",\"En que Tomasz no debería haber tomado acta.\"],\"answer\":0,\"inference\":true,\"why\":\"14.600, cuatro ideas, no motion. El desacuerdo es qué hacer, no qué ha pasado. Sintetizar es eso.\"}],\"itemIds\":[\"enb2m11familylife\",\"enb2m11equalopportunities\",\"enb2m11thatstrikemeasunfair\",\"enb2m11thecommunalgarden\"]},{\"id\":\"enb2m11l6e3\",\"type\":\"mc\",\"prompt\":\"Postura\",\"question\":\"¿Desde dónde habla cada texto?\",\"options\":[\"El acta se reserva (y no del todo); la carta convence y cierra con una pregunta que ya es un plan.\",\"Los dos convencen igual, solo cambia el vocabulario.\",\"El acta es mentira y la carta es la verdad.\"],\"answer\":0,\"whyWrong\":[null,\"El acta enumera y no cierra. La carta parte el dinero y pregunta Shall we agree.\",\"Un B2 no elige un bando: nota la postura.\"],\"itemIds\":[\"enb2m11amotion\",\"enb2m11lettertotheneditor\"]},{\"id\":\"enb2m11l6e4\",\"type\":\"paraphrase\",\"prompt\":\"El consejo de Tomasz, reportado en negativo. Prohibido don't\",\"source\":\"Tomasz said: don't spend it all on the garden.\",\"forbid\":[\"don't\",\"Don't\",\"said\"],\"answers\":[\"He advised the meeting not to spend it all on the garden.\",\"He advised them not to spend the whole fund on the garden.\",\"He told the meeting not to spend it all on the garden.\"],\"itemIds\":[\"enb2m10headvisedmenotto\",\"enb2m11anewboiler\"]},{\"id\":\"enb2m11l6e5\",\"type\":\"bucket\",\"prompt\":\"¿Acta de Tomasz o carta de 4C?\",\"categories\":[\"Acta (informa, se reserva)\",\"Carta (convence)\"],\"items\":[{\"text\":\"These minutes do not recommend. They record.\",\"bucket\":0},{\"text\":\"I went upstairs angry, and I am still angry.\",\"bucket\":1},{\"text\":\"No motion was passed.\",\"bucket\":0},{\"text\":\"That strikes me as unfair.\",\"bucket\":1},{\"text\":\"The meeting closed at 19.10.\",\"bucket\":0},{\"text\":\"Shall we agree, at least, that the garden is not the leftover?\",\"bucket\":1}],\"itemIds\":[\"enb2m11amotion\",\"enb2m11shallweagreeon\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"
