ser la respuesta más de una vez\u003c/b\u003e. El A sale dos veces; el C, una. Si vas racionando («este ya lo he usado, no puede ser») fallas ítems que sabías.\u003cbr/\u003e\u003cbr/\u003eLa estrategia no cambia en el primer paso y cambia en el segundo:\u003cbr/\u003e1. En treinta segundos, decide \u003cb\u003equé es\u003c/b\u003e cada texto: un correo, un reglamento, un folleto de campaña, un foro. Eso es el propósito.\u003cbr/\u003e2. En otros treinta, decide \u003cb\u003edesde dónde habla\u003c/b\u003e: ¿informa, convence, se cubre las espaldas, se queja? Eso es la postura, y es lo nuevo.\u003cbr/\u003e3. Lee las preguntas. Predice. Busca el dato — o la actitud.\u003cbr/\u003e4. No caces la palabra: la misma sale en tres textos a propósito.\u003cbr/\u003e\u003cbr/\u003eHoy los cuatro textos giran alrededor de \u003cb\u003ellegar a St Elen's\u003c/b\u003e. Gwen escribe a un grupo. El operador pone condiciones. Una campaña defiende el estuario. Un visitante cuenta lo del satnav.18:Tb0c,"])</script><script>self.__next_f.push([1,"\u003cb\u003eTEXT A — email from Gwen Pryce, site guide\u003c/b\u003e\u003cbr/\u003eHello all, and thank you for booking the Saturday walk. Meet me at the north park-and-ride at 9.40: the shuttle is free with your ticket, and I would rather you used it than hunted for a space on the approach road. After leaving the shuttle, we walk the last ten minutes on a public right of way between two dry-stone walls — that stretch is the point of the morning, not an obstacle. Please ignore the satnav at the church; it still offers the farm track. Bring a coat: the ridge takes the wind even in July, and the visitor centre will hold your bags if you ask. Looking forward to showing you the estuary with the tide in, and to naming a bit of the local flora if anyone is interested. Gwen.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT B — shuttle conditions of carriage\u003c/b\u003e\u003cbr/\u003ePassengers must be at the north stop ten minutes before departure. Tickets for St Elen's include one shuttle ride in each direction on the day shown and on no other. If a service is suspended because of weather or a landslide, keep your ticket: a refund may be claimed online within twenty-eight days. The operator does not accept responsibility for connections missed because of congestion on the A-road, nor for visitors who follow satellite navigation onto private tracks. Pushchairs fold. One bag per passenger. Bicycles are not carried. Lost property is held at the Carmarthen depot for fourteen days. Complaints must be made in writing, with the ticket number.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT C — campaign leaflet, Hands Off the Estuary\u003c/b\u003e\u003cbr/\u003eThey want to pour a car park onto the lapwing field. They will tell you it is green travel. It is not. A field that has fed waders for four centuries is not a spare rectangle, and a World Heritage site is not a supermarket with extra parking. Write to the Trust. Write to the county. Standing on that ridge, you will understand what cannot be rebuilt once it is under tarmac. The priory has survived dissolution, storms and neglect. It will not survive 180 parking spaces and a low-emission zone that exists only on a sign. Add your name. Come to the meeting on the third Thursday. Bring a neighbour.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTEXT D — travel forum, posted Sunday 22.14\u003c/b\u003e\u003cbr/\u003eGo. Seriously, go. The ruin is smaller than the photographs and better. What nobody tells you is the last mile. Our satnav sent us down a farm track that ended in a gate and a very polite sheep. We lost forty minutes, missed Gwen's introduction and ended up on the coast path anyway, which was, to be fair, the best bit. Next time I would take the park-and-ride without thinking. There had been no sign at the church when we went through. There is now, apparently — a volunteer told me the Trust put one up on the Monday. I am putting it here, in writing, for the rest of you, because the machine will not."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l10\",\"phaseId\":\"enb2m9\",\"title\":\"Exam lab: Reading Part 3\",\"subtitle\":\"Cuatro textos, la postura de quien escribe, y un texto puede ser la respuesta más de una vez\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que cambia respecto al Part 3 del B1\",\"itemIds\":[\"enb2m9writersstance\",\"enb2m9textusedmorethanonce\",\"enb2m9awarenessofattitude\",\"enb2m9fourshorttexts\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El Part 3 de B2 no es el de B1 con textos más largos\",\"body\":\"$17\",\"table\":[[\"Texto\",\"Qué es\",\"Postura\"],[\"A — correo de Gwen\",\"aconsejar a su grupo\",\"orgullosa del sitio, partidaria de llegar andando\"],[\"B — condiciones del lanzadera\",\"cubrirse las espaldas\",\"neutra, institucional, sin adjetivos\"],[\"C — folleto de campaña\",\"convencer\",\"en contra del aparcamiento, en segunda persona\"],[\"D — foro de viajeros\",\"contar lo que le pasó\",\"mixta: el sitio vale, el satnav no\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m9l10e1\",\"type\":\"mc\",\"prompt\":\"La regla que el B1 no tenía que memorizar\",\"question\":\"En el Reading Part 3 del B2, un mismo texto…\",\"options\":[\"Puede ser la respuesta de más de una pregunta.\",\"Contesta como máximo una pregunta, para que el reparto sea justo.\",\"Solo se usa si ninguna otra encaja.\"],\"answer\":0,\"whyWrong\":[null,\"La clave oficial del Practice Paper 1 es B D A A B D C: A dos veces, B dos, D dos, C una. No hay reparto.\",\"No es el desempate: es una respuesta tan buena como las otras.\"],\"itemIds\":[\"enb2m9textusedmorethanonce\"]},{\"id\":\"enb2m9l10e2\",\"type\":\"mc\",\"prompt\":\"Lo que el B2 añade al descriptor\",\"question\":\"«Awareness of writers' stance and attitude» significa, en la práctica…\",\"options\":[\"Que además de localizar el dato tienes que notar si el texto informa, convence o "Segunda persona, imperativos, «you will understand», «add your name». No informa: te mete en el asunto. Eso es stance, y es C.\"},{\"id\":\"enb2m9l10e3q4\",\"q\":\"Which text treats the walk from the shuttle as the point of the visit, not as a nuisance?\",\"options\":[\"Texto A — el correo de Gwen\",\"Texto B — las condiciones del lanzadera\",\"Texto C — el folleto de campaña\",\"Texto D — el foro\"],\"answer\":0,\"inference\":true,\"why\":\"«that stretch is the point of the morning, not an obstacle». Gwen no se disculpa por los diez minutos: los vende. El foro dice que el sendero fue lo mejor, pero a posteriori y por accidente. A se usa por segunda vez — y eso es legal.\"},{\"id\":\"enb2m9l10e3q5\",\"q\":\"Which text tells you what to do with your ticket if the shuttle is suspended?\",\"options\":[\"Texto A — el correo de Gwen\",\"Texto B — las condiciones del lanzadera\",\"Texto C — el folleto de campaña\",\"Texto D — el foro\"],\"answer\":1,\"why\":\"«If a service is suspended… keep your ticket: a refund may be claimed online within twenty-eight days.» B se usa por segunda vez. Racionar textos es fallar.\"},{\"id\":\"enb2m9l10e3q6\",\"q\":\"Which text mentions a sheep, and in a tone that is not campaigning?\",\"options\":[\"Texto A — el correo de Gwen\",\"Texto B — las condiciones del lanzadera\",\"Texto C — el folleto de campaña\",\"Texto D — el foro\"],\"answer\":3,\"inference\":true,\"why\":\"«a gate and a very polite sheep». El tono es de anécdota, no de folleto. C también habla del campo, pero no hay oveja, y el tono es de batalla.\"}],\"itemIds\":[\"enb2m9writersstance\",\"enb2m9textusedmorethanonce\",\"enb2m9fourshorttexts\",\"enb2m9satnav\",\"enb2m9aguidedtour\",\"enb1m9whichtexttellsyou\"],\"tip\":\"A dos veces, B dos veces. Si en la 4 has pensado «A ya salió», has aplicado una regla que el examen no tiene. La clave oficial del Practice Paper 1 hace exactamente esto.\"},{\"id\":\"enb2m9l10e4\",\"type\":\"match\",\"prompt\":\"Empareja cada texto con su p notice each writer's ___. A text may be used more than ___, and the same ___ will appear in three texts on purpose.\",\"answers\":[\"topic\",\"stance\",\"once\",\"word\"],\"bank\":[\"topic\",\"stance\",\"once\",\"word\",\"author\",\"twice\",\"paragraph\",\"title\"],\"translation\":\"El Part 3 te da cuatro textos cortos sobre el mismo tema pero con propósitos distintos. En B2 además tienes que notar la postura de cada autor. Un texto puede usarse más de una vez, y la misma palabra aparecerá en tres textos a propósito.\",\"itemIds\":[\"enb2m9fourshorttexts\",\"enb2m9writersstance\",\"enb2m9textusedmorethanonce\",\"enb1m9samewordwrongtext\"]},{\"id\":\"enb2m9l10e8\",\"type\":\"mc\",\"prompt\":\"Predicción por postura, antes de buscar\",\"question\":\"«Which text tries to make the reader feel guilty about a field?» Sin leer, ¿dónde lo buscas?\",\"options\":[\"En el folleto de campaña.\",\"En las condiciones del lanzadera.\",\"En el correo de la guía.\"],\"answer\":0,\"whyWrong\":[null,\"Un reglamento no te hace sentir culpable: te dice qué pasa si llegas tarde.\",\"Gwen aconseja y enseña. No culpa.\"],\"itemIds\":[\"enb2m9awarenessofattitude\"],\"tip\":\"Feel guilty, urge, you must act — campaña. Refund, valid, not responsible — reglamento. That's the point of the morning — guía. I lost forty minutes — foro. La postura predice el texto.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B2 Communicator, Written Practice Paper 1\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b2-communicator-1288\",\"note\":\"Mira solo el Reading Part 3 y la clave. Cuenta cuántas veces sale cada letra. Cuando veas un A repetido, ya sabes por qué esta lección insiste.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n
