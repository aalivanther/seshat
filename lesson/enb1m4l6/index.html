broken \u003cb\u003eby the storm\u003c/b\u003e.\u003c/i\u003e — sin eso, parece un ladrillo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eSe CALLA cuando el agente es obvio, desconocido o irrelevante:\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eThe paper is delivered every morning.\u003c/i\u003e — ¿por el repartidor? Ya se sabe.\u003cbr/\u003e· \u003ci\u003eMy bike was stolen.\u003c/i\u003e — si se supiera quién, no habría frase.\u003cbr/\u003e· \u003ci\u003eNothing has been decided.\u003c/i\u003e — y aquí el silencio es \u003cb\u003edeliberado\u003c/b\u003e: el que no ha decidido nada prefiere no firmar.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEse último caso es el que hay que aprender a leer.\u003c/b\u003e En un texto de prensa, cada pasiva sin agente es una pregunta que alguien no ha contestado: \u003ci\u003e¿quién lo decidió? ¿quién lo pagó? ¿quién lo retiró?\u003c/i\u003e El examen no te va a preguntar por el «by», pero el Reading Part 4 te va a preguntar por cosas que solo se ven si te haces esa pregunta mientras lees.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY tres verbos con partícula que son de este campo y van en bloque:\u003c/b\u003e \u003cb\u003ecome across\u003c/b\u003e (toparse con algo sin buscarlo), \u003cb\u003efind out\u003c/b\u003e (averiguar), \u003cb\u003eshut down\u003c/b\u003e (cerrar del todo, un negocio o una fábrica). La partícula no es una preposición cualquiera: es parte del verbo, y en pasiva se queda pegada — \u003ci\u003ethe paper was shut down\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l6\",\"phaseId\":\"enb1m4\",\"title\":\"The paper nobody reads until it goes\",\"subtitle\":\"Prensa local, ayuntamiento y voluntarios — y el «by» que decide si sobra\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario del barrio\",\"itemIds\":[\"enb1m4comeacross\",\"enb1m4shutdown\",\"enb1m4volunteer\",\"enb1m4wascovered\",\"enb1m4council\",\"enb1m4findout\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: cuándo se pone el «by» y cuándo estorba\",\"body\":\"$17\",\"table\":[[\"Con «by» (informa)\",\"Sin «by» (se calla)\"],[\"The story was covered by two papers.\",\"The paper is delivered every morning.\"],[\"The window was broken by the storm.\",\"My bike was stolen.\"],[\"The article is written by a local journalist.\",\"Nothing has been decided yet.\"],[\"She was seen by two neighbours.\",\"The post was taken down.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l6e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario del barrio\",\"pairs\":[{\"target\":\"the council\",\"source\":\"el ayuntamiento\"},{\"target\":\"a volunteer\",\"source\":\"un voluntario, una voluntaria\"},{\"target\":\"The paper shut down in 2019.\",\"source\":\"El periódico cerró en 2019.\"},{\"target\":\"I came across the article online.\",\"source\":\"Me topé con el artículo en internet.\"}],\"itemIds\":[\"enb1m4council\",\"enb1m4volunteer\",\"enb1m4shutdown\",\"enb1m4comeacross\"],\"tip\":\"«the council» es quien decide sobre la biblioteca, la basura y el parque. No es «el consejo» de una empresa: eso es «the board».\"},{\"id\":\"enb1m4l6e2\",\"type\":\"mc\",\"prompt\":\"El verbo con partícula\",\"question\":\"«Me topé con el artículo en internet» →\",\"options\":[\"I came across the article online.\",\"I came with the article online.\",\"I found me the article online.\"],\"answer\":0,\"whyWrong\":[null,\"«come with» es acompañar a alguien. La partícula no se elige por lógica: viene pegada al verbo.\",\"Ese «me» es el reflexivo español colado. «find» no lo lleva nunca.\"],\"itemIds\":[\"enb1m4comeacross\"],\"tip\":\"«come across» es toparse sin buscar; «look for» es buscar; «find out» es averiguar. Tres verbos parecidos y tres momentos distintos de la misma búsqueda.\"},{\"id\":\"enb1m4l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la partícula\",\"text\":\"I came ___ the article online while I was looking for something else.\",\"answers\":[\"across\"],\"translation\":\"Me topé con el artículo en internet mientras buscaba otra cosa.\",\"hints\":[\"Seis letras, empieza por a-\",\"a-cross\"],\"itemIds\":[\"enb1m4comeacross\"],\"tip\":\"El verbo y su partícula se guardan juntos, como «depend on» o «put up with». Separarlos es aprender media palabra.\"},{\"id\":\"enb1m4l6e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The story was covered for two papers.\",\"answers\":[\"The story was covered by two papers.\"],\"why\":\"El agente de la pasiva va con «by», siempre. «for» diría que los periódicos son los destinatarios, no los autores — justo lo contrario.\",\"translation\":\"Dos periódicos dieron la noticia.\",\"itemIds\":[\"enb1m4wascovered\"]},{\"id\":\"enb1m4l6e5\",\"type\":\"transform\",\"prompt\":\"De activa a pasiva, con agente\",\"source\":\"Two papers covered the story.\",\"instruction\":\"Ponla en pasiva (el agente aquí SÍ informa)\",\"answers\":[\"The story was covered by two papers\",\"The story was covered by two papers.\"],\"translation\":\"Dos periódicos dieron la noticia.\",\"hints\":[\"Empieza por «The story…»\",\"The story was ... by two papers\"],\"itemIds\":[\"enb1m4wascovered\"],\"tip\":\"Aquí el «by» se queda porque «dos periódicos» es el dato de la frase. Si fuera «somebody covered the story», el agente se caería solo.\"},{\"id\":\"enb1m4l6e6\",\"type\":\"bucket\",\"prompt\":\"¿Esta pasiva dice quién, o se lo calla?\",\"categories\":[\"Dice quién (lleva «by»)\",\"Se calla quién (sin «by»)\"],\"items\":[{\"text\":\"The story was covered by two papers.\",\"bucket\":0},{\"text\":\"The window was broken by the storm.\",\"bucket\":0},{\"text\":\"The article is written by a local journalist.\",\"bucket\":0},{\"text\":\"She was seen by two neighbours.\",\"bucket\":0},{\"text\":\"The paper is delivered every morning.\",\"bucket\":1},{\"text\":\"Nothing has been decided yet.\",\"bucket\":1},{\"text\":\"The post was taken down.\",\"bucket\":1},{\"text\":\"The library was built in 1904.\",\"bucket\":1}],\"itemIds\":[\"enb1m4wascovered\",\"enb1m4bythestorm\",\"enb1m4isdelivered\",\"enb1m4takendown\"],\"tip\":\"Vuelve a la columna de la derecha y hazte la pregunta con cada una: ¿quién reparte? ¿quién ha decidido? ¿quién retiró la publicación? Leer prensa en inglés es, en gran parte, hacerse esas preguntas.\"},{\"id\":\"enb1m4l6e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la historia del periódico del barrio — cuatro huecos\",\"text\":\"The Hackney Gazette ___ down for six weeks in 2021 and nobody expected it back. For those six weeks the council's meetings were still held, but they were no longer ___ . Then a group of ___ took it on. It is now printed once a fortnight, ___ the old machines were sold years ago.\",\"answers\":[\"shut\",\"reported\",\"volunteers\",\"because\"],\"bank\":[\"shut\",\"reported\",\"volunteers\",\"because\",\"cut\",\"copies\",\"unless\"],\"translation\":\"El Hackney Gazette cerró seis semanas en 2021 y nadie esperaba que volviera. Durante esas seis semanas los plenos del ayuntamiento se siguieron celebrando, pero ya no se contaban. Entonces lo cogió un grupo de voluntarios. Ahora se imprime cada quince días, porque las máquinas viejas se vendieron hace años.\",\"itemIds\":[\"enb1m4shutdown\",\"enb1m4volunteer\",\"enb1m4council\",\"enb1m4wascovered\"],\"tip\":\"Fíjate en la frase del medio: «the meetings were still held, but they were no longer reported». Los plenos siguieron; lo que desapareció fue quien los contaba. Ese es el tema entero de la lección.\"},{\"id\":\"enb1m4l6e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «wrote»\",\"source\":\"Two papers wrote about the story.\",\"forbid\":[\"wrote\",\"about\"],\"answers\":[\"The story was covered by two papers\",\"Two papers covered the story\",\"The story was covered by two papers.\"],\"translation\":\"Dos periódicos escribieron sobre el caso.\",\"hints\":[\"Hay un verbo que significa «dar la noticia»\",\"The story was ... by two papers\"],\"itemIds\":[\"enb1m4wascovered\"],\"tip\":\"«cover a story» es la colocación del oficio: cubrir una noticia. Cambiar «write about» por «cover» sube el criterio de vocabulario sin escribir una palabra más.\"},{\"id\":\"enb1m4l6e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Quería averiguar quién lo pagó.\",\"answers\":[\"I wanted to find out who paid for it\",\"I wanted to find out who paid for it.\",\"I wanted to find out who had paid for it\"],\"hint\":\"«averiguar» son dos palabras en inglés, y la segunda es una partícula\",\"itemIds\":[\"enb1m4findout\"],\"tip\":\"«pay for» también va en bloque: se paga POR algo. «I paid the ticket» suena a que le pagaste al ticket.\"},{\"id\":\"enb1m4l6e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"The paper shut down in 2019 and the town had no local news for three years.\",\"answers\":[\"El periódico cerró en 2019 y el pueblo se quedó tres años sin noticias locales\",\"El periódico cerró en 2019 y la ciudad estuvo tres años sin noticias locales\"],\"itemIds\":[\"enb1m4shutdown\",\"enb1m4localpaper\"],\"tip\":\"«shut down» es cerrar del todo y para siempre: un negocio, una fábrica, un periódico. «Close» a secas también sirve para cerrar hoy y abrir mañana.\"},{\"id\":\"enb1m4l6e11\",\"type\":\"audiomc\",\"prompt\":\"Boletín local en formato examen: lee la pregunta ANTES del play. Dos escuchas, y usa el cuaderno.\",\"audio\":\"Good morning. The main stories this hour. A decision on the future of the evening library service has been postponed until April; the council says no cuts have been agreed. Two hundred people attended a meeting about the pool on Saturday, where it was announced that the building will be surveyed in the spring. And the Hackney Gazette, which shut down for six weeks in 2021, has been named local paper of the year. The award was collected by a volunteer, Mrs Beckett, who has written the letters page since March.\",\"question\":\"¿Qué se ha aplazado hasta abril?\",\"options\":[\"La decisión sobre el servicio de tardes de la biblioteca\",\"La reunión sobre la piscina\",\"La entrega del premio al periódico\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"La reunión de la piscina ya se celebró: fue el sábado y fueron doscientas personas.\",\"El premio ya se ha recogido — lo recogió una voluntaria.\"],\"itemIds\":[\"enb1m4council\",\"enb1m4volunteer\",\"enb1m4shutdown\"],\"tip\":\"Cuenta las pasivas del boletín: has been postponed, have been agreed, it was announced, will be surveyed, has been named, was collected. Seis en cuarenta segundos, y solo dos dicen quién. Así suena un informativo en inglés.\"},{\"id\":\"enb1m4l6e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"The story was covered by two papers, but nobody found out who paid for it.\",\"phonetic\":\"de STÓO-ri uos̬ KÁ-vad bai tuu PÉI-pas̬, bat NÓU-ba-di faund áut juu péid foo it\",\"translation\":\"Dos periódicos dieron la noticia, pero nadie averiguó quién lo pagó.\",\"itemIds\":[\"enb1m4wascovered\",\"enb1m4findout\"],\"tip\":\"Las dos mitades hacen lo contrario: la primera nombra al agente, la segunda dice que no se sabe. Es la frase-resumen de la lección.\"},{\"id\":\"enb1m4l6e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ahora lo sacan unos voluntarios y se imprime cada quince días.\",\"answers\":[\"It is run by volunteers now and it is printed once a fortnight\",\"It's run by volunteers now and it's printed once a fortnight\",\"It is run by volunteers now and it is printed every two weeks\"],\"hints\":[\"Dos pasivas: una con agente y otra sin él\",\"It is run by ... and it is printed ...\"],\"itemIds\":[\"enb1m4volunteer\",\"enb1m4copiesareprinted\"],\"tip\":\"«a fortnight» son quince días, y es palabra de uso diario en el Reino Unido: «once a fortnight», «a fort
