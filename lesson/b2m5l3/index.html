\u003cbr/\u003e· \u003cb\u003ezumal\u003c/b\u003e = sobre todo porque. Añade la razón que más pesa, no una más.\u003cbr/\u003e· \u003cb\u003ewobei\u003c/b\u003e = si bien / y con ello. Parece \u003ci\u003ezwar\u003c/i\u003e y no lo es: \u003ci\u003ezwar\u003c/i\u003e deja el verbo donde está; \u003ci\u003ewobei\u003c/i\u003e se lo lleva al final. \u003cb\u003e…, wobei die Lieferungen morgens bleiben können.\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ewohingegen\u003c/b\u003e = mientras que. Contrasta dos sujetos, no dos adjetivos.\u003cbr/\u003e· \u003cb\u003eindem\u003c/b\u003e = al hacer X. El \u003ci\u003ecómo\u003c/i\u003e, no el \u003ci\u003edónde\u003c/i\u003e (eso es \u003ci\u003ein dem\u003c/i\u003e en dos palabras).\u003cbr/\u003e· \u003cb\u003esodass\u003c/b\u003e = de modo que. Resultado, no propósito (el propósito es \u003ci\u003edamit\u003c/i\u003e).\u003cbr/\u003e\u003cbr/\u003eEl calco: *wobei ich bin anderer Meinung. Tras wobei, el verbo espera al final.\",\"table\":[[\"conector\",\"qué hace\",\"verbo\"],[\"zumal\",\"la razón que más pesa\",\"al final\"],[\"wobei\",\"concesión o añadido\",\"al final\"],[\"zwar\",\"concesión\",\"NO se mueve\"],[\"wohingegen\",\"contraste de sujetos\",\"al final\"],[\"indem\",\"el medio, el cómo\",\"al final\"],[\"sodass\",\"el resultado\",\"al final\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m5l3e1\",\"type\":\"bucket\",\"prompt\":\"¿El verbo se va al final o se queda?\",\"categories\":[\"verbo AL FINAL\",\"el verbo NO se mueve\"],\"items\":[{\"text\":\"wobei\",\"bucket\":0},{\"text\":\"zwar\",\"bucket\":1},{\"text\":\"zumal\",\"bucket\":0},{\"text\":\"allerdings\",\"bucket\":1},{\"text\":\"indem\",\"bucket\":0},{\"text\":\"jedoch\",\"bucket\":1},{\"text\":\"sodass\",\"bucket\":0},{\"text\":\"hingegen\",\"bucket\":1}],\"itemIds\":[\"b2m5wobei\",\"b2m5zwaraber\",\"b2m5zumal\",\"b1m7feallerdings\",\"b2m5indem\",\"b1m12gzjedoch\"],\"tip\":\"Esta tabla es la clínica adelantada: wobei y zwar parecen primos y n
