 möchte ___ Kuchen. (der Kuchen)\",\"options\":[\"ein\",\"einen\",\"eine\"],\"answer\":1,\"whyWrong\":[\"Kuchen es masculino y es el objeto → necesita la -en\",null,\"eine es para femeninos como die Cola\"],\"itemIds\":[\"moechte\",\"kuchen\"],\"tip\":\"der Kuchen es masculino → como objeto: einen Kuchen.\"},{\"id\":\"f3l4e2\",\"type\":\"mc\",\"prompt\":\"¿Cuál es correcta?\",\"question\":\"«Tengo un perro» →\",\"options\":[\"Ich habe einen Hund\",\"Ich habe ein Hund\",\"Ich habe eine Hund\"],\"answer\":0,\"whyWrong\":[null,\"der Hund es masculino y es objeto → einen, no ein\",\"eine es solo femenino\"],\"itemIds\":[\"hund\"],\"tip\":\"Llevas semanas diciendo «einen Hund» — eso ES el acusativo.\"},{\"id\":\"f3l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa (masculino)\",\"text\":\"Ich möchte ___ Tee. (der Tee)\",\"answers\":[\"einen\"],\"translation\":\"Quiero un té.\",\"hints\":[\"Masculino como objeto\",\"ein + en\"],\"itemIds\":[\"moechte\",\"tee\"]},{\"id\":\"f3l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa (femenino)\",\"text\":\"Ich möchte ___ Cola. (die Cola)\",\"answers\":[\"eine\"],\"translation\":\"Quiero una cola.\",\"hints\":[\"El femenino NO cambia en acusativo\"],\"itemIds\":[\"moechte\",\"cola\"],\"tip\":\"die Cola → eine Cola, igual que en nominativo. Solo el masculino se mueve.\"},{\"id\":\"f3l4e5\",\"type\":\"cloze\",\"prompt\":\"Completa (neutro)\",\"text\":\"Ich möchte ___ Wasser. (das Wasser)\",\"answers\":[\"ein\"],\"translation\":\"Quiero un agua.\",\"hints\":[\"El neutro tampoco cambia\"],\"itemIds\":[\"moechte\",\"wasser\"]},{\"id\":\"f3l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa la negación\",\"text\":\"Pedro hat ___ Auto. (negación)\",\"answers\":[\"kein\"],\"translation\":\"Pedro no tiene coche.\",\"hints\":[\"das Auto es neutro\",\"k-e-i-n sin terminación — como «k-e-i-n Auto» en la fase 0\"],\"itemIds\":[\"auto\"],\"tip\":\"Neutro: kein no cambia. Si fuera masculino sería keinen: «Ich habe keinen Hund».\"},{\"id\":\"f3l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa con brauchen\",\"text\":\"Ich brauche ___ Saft. (der Saft)\",\"answers\":[\"einen\"],\"translation\":\"Necesito un jugo.\",\"hints\":[\"brauchen también pide acusativo\",\"Masculino → e-i-n-e-n\"],\"itemIds\":[\"brauchen\",\"saft\"]},{\"id\":\"f3l4e8\",\"type\":\"build\",\"prompt\":\"Construye el pedido doble\",\"target\":\"Ich möchte einen Kaffee und ein Wasser\",\"translation\":\"Quiero un café y un agua\",\"distractors\":[\"eine\",\"möchtest\"],\"itemIds\":[\"moechte\",\"kaffee\",\"wasser\"],\"tip\":\"Kaffee masculino → einen; Wasser neutro → ein. Cada sustantivo con su forma.\"},{\"id\":\"f3l4e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich möchte einen Saft\",\"translation\":\"Quiero un jugo\",\"hints\":[\"möchte con ö — ¡tu Umlaut!\",\"Saft es masculino: fíjate si oyes ein o einen\"],\"itemIds\":[\"moechte\",\"saft\"]},{\"id\":\"f3l4e10\",\"type\":\"type\",\"prompt\":\"Traduce\",\"question\":\"Necesito un coche\",\"answers\":[\"Ich brauche ein Auto\"],\"hints\":[\"das Auto es neutro\",\"El neutro no cambia: ein\"],\"itemIds\":[\"brauchen\",\"auto\"],\"tip\":\"¿Escribiste «einen Auto»? Trampa clásica: solo el MASCULINO toma -en.\"},{\"id\":\"f3l4e12\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Pulsa escuchar y decide qué versión oíste\",\"book\":\"Ich hätte gern einen Kaffee.\",\"real\":\"Ich krieg' 'nen Kaffee, bitte.\",\"translation\":\"Quisiera un café. / Me pones un café.\",\"tip\":\"El einen que acabas de dominar se encoge a «'nen» en la calle. Reconócelo — tu acusativo sigue siendo el del libro.\"},{\"id\":\"f3l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quiero un pastel y una cola\",\"answers\":[\"Ich möchte einen Kuchen und eine Cola\"],\"hints\":[\"Kuchen masculino, Cola femenino\",\"einen Kuchen / eine Cola — y möchte con ö\"],\"itemIds\":[\"moechte\",\"kuchen\",\"cola\"]}]}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich\",\"url\":\"https://ww
