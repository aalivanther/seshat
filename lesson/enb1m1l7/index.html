003ethink \u003cb\u003ein\u003c/b\u003e you\u003c/i\u003e, \u003ci\u003emarried \u003cb\u003ewith\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl caso venenoso: «to» que no es infinitivo.\u003c/b\u003e En \u003cb\u003elook forward to\u003c/b\u003e, \u003cb\u003eget used to\u003c/b\u003e y \u003cb\u003ebe used to\u003c/b\u003e, ese «to» es una \u003cb\u003epreposición\u003c/b\u003e, así que detrás va \u003cb\u003e-ing\u003c/b\u003e, no infinitivo:\u003cbr/\u003e\u003ci\u003eI'm looking forward to \u003cb\u003eseeing\u003c/b\u003e the flat\u003c/i\u003e, no «to see».\u003cbr/\u003e\u003ci\u003eI've got used to \u003cb\u003eliving\u003c/b\u003e here\u003c/i\u003e, no «to live».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el adverbio.\u003c/b\u003e Regla de una línea que arregla tres errores: \u003cb\u003een inglés no se mete NADA entre el verbo y su objeto\u003c/b\u003e.\u003cbr/\u003e«I like \u003cs\u003every much\u003c/s\u003e this flat» → \u003cb\u003eI like this flat very much.\u003c/b\u003e\u003cbr/\u003e«I speak \u003cs\u003every well\u003c/s\u003e English» → \u003cb\u003eI speak English very well.\u003c/b\u003e\u003cbr/\u003eY los de frecuencia (always, never, usually, often) van \u003cb\u003eantes del verbo\u003c/b\u003e y \u003cb\u003edespués de «be»\u003c/b\u003e: \u003ci\u003eI \u003cb\u003ealways\u003c/b\u003e take the bus\u003c/i\u003e · \u003ci\u003eI \u003cb\u003eam always\u003c/b\u003e late\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l7\",\"phaseId\":\"enb1m1\",\"title\":\"Depend on, worry about\",\"subtitle\":\"La preposición es parte de la palabra — y el adverbio no se mete en medio\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Nueve unidades léxicas, no dieciocho palabras\",\"itemIds\":[\"enb1m1dependon\",\"enb1m1worryabout\",\"enb1m1lookforwardto\",\"enb1m1getonwith\",\"enb1m1getusedto\",\"enb1m1waitfor\",\"enb1m1listento\",\"enb1m1verymuch\",\"enb1m1alwaystake\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no hay regla, hay unidad léxica\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés — mal\",\"Inglés — bien\"],[\"depende de\",\"depends of\",\"depends on\"],[\"preocuparse por\",\"worry for\",\"worry about\"],[\"escuchar música\",\"listen music\",\"listen to music\"],[\"tener ganas de ver\",\"look forward to see\",\"look forward to seeing\"],[\"me gusta mucho esto\",\"I like very much this\",\"I like this very much\"],[\"siempre cojo el bus\",\"I take always the bus\",\"I always take the bus\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l7e1\",\"type\":\"match\",\"prompt\":\"Empareja el verbo con su preposición\",\"pairs\":[{\"target\":\"depend on\",\"source\":\"depender de\"},{\"target\":\"worry about\",\"source\":\"preocuparse por\"},{\"target\":\"wait for\",\"source\":\"esperar a\"},{\"target\":\"get on with\",\"source\":\"llevarse bien con\"},{\"target\":\"listen to\",\"source\":\"escuchar\"}],\"itemIds\":[\"enb1m1dependon\",\"enb1m1worryabout\",\"enb1m1waitfor\",\"enb1m1getonwith\",\"enb1m1listento\"],\"tip\":\"Apréndetelos en bloque y en voz alta: «dependON», «worryABOUT». Separados no se quedan; pegados, sí.\"},{\"id\":\"enb1m1l7e2\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje con las preposiciones correctas\",\"text\":\"It depends ___ the landlady. I've been waiting ___ her call all morning. Don't worry ___ the deposit — Amy has already paid it. I'm looking forward ___ seeing the room on Thursday.\",\"answers\":[\"on\",\"for\",\"about\",\"to\"],\"bank\":[\"on\",\"for\",\"about\",\"to\",\"of\",\"in\",\"with\"],\"translation\":\"Depende de la casera. Llevo toda la mañana esperando su llamada. No te preocupes por la fianza: Amy ya la ha pagado. Tengo ganas de ver la habitación el jueves.\",\"itemIds\":[\"enb1m1dependon\",\"enb1m1waitfor\",\"enb1m1worryabout\",\"enb1m1lookforwardto\"],\"tip\":\"Los tres distractores son las tres preposiciones que pone el español: «of» por depends, «in» por think, «with» por married. No están ahí por casualidad.\"},{\"id\":\"enb1m1l7e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It depends of the landlord.\",\"answers\":[\"It depends on the landlord.\"],\"why\":\"«depender DE» en español, «depend ON» en inglés. No hay razón: son dos recciones distintas y hay que aprender la inglesa como parte de la palabra.\",\"translation\":\"Depende del casero.\",\"itemIds\":[\"enb1m1dependon\"]},{\"id\":\"enb1m1l7e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I'm looking forward to see the flat.\",\"answers\":[\"I'm looking forward to seeing the flat.\"],\"why\":\"Ese «to» no es el del infinitivo: es una preposición, y detrás de preposición el inglés pone -ing. Igual que «I'm interested in learning», no «in learn».\",\"translation\":\"Tengo ganas de ver el piso.\",\"itemIds\":[\"enb1m1lookforwardto\"]},{\"id\":\"enb1m1l7e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I like very much this flat.\",\"answers\":[\"I like this flat very much.\"],\"why\":\"En inglés no se mete nada entre el verbo y su objeto. El español lo hace sin despeinarse («me gusta mucho este piso»), y por eso este error sobrevive hasta niveles altos.\",\"translation\":\"Me gusta mucho este piso.\",\"itemIds\":[\"enb1m1verymuch\"]},{\"id\":\"enb1m1l7e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I take always the bus to work.\",\"answers\":[\"I always take the bus to work.\"],\"why\":\"Los adverbios de frecuencia (always, never, usually, often, sometimes) van ANTES del verbo principal. Detrás de «be» es la única excepción: «I am always late».\",\"translation\":\"Siempre voy al trabajo en autobús.\",\"itemIds\":[\"enb1m1alwaystake\",\"enalways\"]},{\"id\":\"enb1m1l7e7\",\"type\":\"bucket\",\"prompt\":\"¿El inglés PONE preposición donde el español no, o al revés?\",\"categories\":[\"el inglés la pone (y el español no)\",\"el inglés NO la pone (y el español sí)\"],\"items\":[{\"text\":\"listen ___ music\",\"bucket\":0},{\"text\":\"wait ___ the bus\",\"bucket\":0},{\"text\":\"depend ___ the weather\",\"bucket\":0},{\"text\":\"enter the room\",\"bucket\":1},{\"text\":\"phone your sister\",\"bucket\":1},{\"text\":\"marry a doctor\",\"bucket\":1}],\"itemIds\":[\"enb1m1listento\",\"enb1m1waitfor\",\"enb1m1dependon\"],\"tip\":\"Los dos errores están separados a propósito: mezclar «preposición de más» y «preposición de menos» en el mismo ejercicio confunde en vez de enseñar.\"},{\"id\":\"enb1m1l7e8\",\"type\":\"build\",\"prompt\":\"Construye la frase — cuidado con dónde cae el adverbio\",\"target\":\"I like this neighbourhood very much\",\"translation\":\"Me gusta mucho este barrio\",\"distractors\":[\"so\",\"enjoy\"],\"itemIds\":[\"enb1m1verymuch\",\"enb1m1neighbourhood\"],\"tip\":\"Las dos fichas que sobran son las dos tentaciones del hispanohablante: «so much» a mitad de frase y «enjoy» donde va «like». Si te sobran las dos, la regla ya es tuya.\"},{\"id\":\"enb1m1l7e9\",\"type\":\"order\",\"prompt\":\"Ordena la conversación del primer día en el piso compartido\",\"sentences\":[\"I've just moved into the room upstairs.\",\"Oh, welcome! How are you getting on with the boxes?\",\"Slowly. I'm still looking for the kettle.\",\"Don't worry about it — you can use mine tonight.\"],\"translation\":\"«Acabo de mudarme a la habitación de arriba.» «¡Ah, bienvenida! ¿Qué tal vas con las cajas?» «Despacio. Sigo buscando el hervidor.» «No te preocupes, esta noche usa el mío.»\",\"itemIds\":[\"enb1m1just\",\"enb1m1getonwith\",\"enb1m1still\",\"enb1m1worryabout\"],\"tip\":\"«How are you getting on?» es la pregunta británica por excelencia para «¿qué tal vas?». Con «with» detrás, se refiere a una tarea; con una persona, a llevarse bien.\"},{\"id\":\"enb1m1l7e10\",\"type\":\"hearreal\",\"prompt\":\"¿Qué significa lo que oyes? El inglés hablado se come el auxiliar\",\"book\":\"It has been two years.\",\"real\":\"It's been two years.\",\"translation\":\"Han pasado dos años.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Han pasado dos años\",\"Son dos años (de contrato)\",\"Serán dos años\"],\"itemIds\":[\"enb1m1havelivedhere\"],\"tip\":\"Ese «'s» no es «is»: es «has». Y de ahí sale medio Listening perdido — el alumno oye «It's» y descarta el perfecto sin darse cuenta.\"},{\"id\":\"enb1m1l7e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Me he acostumbrado al ruido de la calle.\",\"answers\":[\"I have got used to the noise from the street\",\"I've got used to the noise from the street\",\"I have got used to the street noise\"],\"hint\":\"Después de ese «to» no va infinitivo: es preposición\",\"itemIds\":[\"enb1m1getusedto\",\"enb1m1putupwith\"],\"tip\":\"«get used to» = acostumbrarse (proceso). «be used to» = estar acostumbrado (estado). Y las dos llevan -ing detrás si viene un verbo.\"},{\"id\":\"enb1m1l7e12\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"I get on really well ___ my flatmate.\",\"answers\":[\"with\"],\"translation\":\"Me llevo muy bien con mi compañera de piso.\",\"hints\":[\"La misma que en español, esta vez\",\"get on ... someone\"],\"itemIds\":[\"enb1m1getonwith\",\"enflatmate\"],\"tip\":\"Aquí el español ayuda («llevarse bien CON»), pero no te fíes: es la excepción, no la norma.\"},{\"id\":\"enb1m1l7e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Depende del casero, así que no te preocupes por el contrato todavía.\",\"answers\":[\"It depends on the landlord, so don't worry about the contract yet\",\"It depends on the landlady, so don't worry about the contract yet\"],\"hints\":[\"Dos preposiciones regidas seguidas\",\"It depends ... , so don't worry ... yet\"],\"itemIds\":[\"enb1m1dependon\",\"enb1m1worryabout\",\"enb1m1notyet\"],\"tip\":\"Do
