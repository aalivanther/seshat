003cbr/\u003e· \u003cb\u003eher\u003c/b\u003e → suena una vocal floja: \u003cb\u003e[[ask her|preguntarle]]\u003c/b\u003e = \u003ci\u003eAAS-ka\u003c/i\u003e · \u003ci\u003eI gave her the key\u003c/i\u003e = \u003ci\u003eai GUÉI-va de kii\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ehis\u003c/b\u003e → «is̬»: \u003ci\u003ein his room\u003c/i\u003e = \u003ci\u003ei-NIS̬ ruum\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ethem\u003c/b\u003e → «dem», y en habla rápida se queda en «em»: \u003cb\u003e[[give them a key|darles una llave]]\u003c/b\u003e = \u003ci\u003eGUI-vem a kii\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa h vuelve\u003c/b\u003e solo en dos sitios: al principio de una frase (\u003ci\u003eHe phoned me\u003c/i\u003e) y cuando el pronombre lleva énfasis (\u003ci\u003eHER? No, HIS\u003c/i\u003e).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué esta clínica y no otra:\u003c/b\u003e media respuesta del Listening del examen depende de saber a quién se refiere una frase, y ese dato viaja en la sílaba más floja de la frase. «I gave it to her» suena \u003ci\u003eai guéi-vi-tu-a\u003c/i\u003e: cuatro palabras fundidas en tres sílabas. Si esperas oír «her» con su hache, no lo vas a oír nunca — porque no está.\u003cbr/\u003e\u003cbr/\u003eY esto no es una habilidad nueva: es el mismo \u003cb\u003eenlace consonante→vocal\u003c/b\u003e que trabajaste en el módulo 5 con \u003ci\u003ea lot of\u003c/i\u003e y \u003ci\u003ea bit of\u003c/i\u003e. Aquí el enlace se come una hache por el camino."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l5\",\"phaseId\":\"ena2m9\",\"title\":\"Clínica de sonido: tell 'im, ask 'er\",\"subtitle\":\"La h que desaparece — y por qué el Listening se te escapa justo ahí\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los cuatro sonidos de la clínica\",\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\",\"ena2m9weakthem\",\"ena2m9whoseorwhos\"]},{\"kind\":\"note\",\"note\":{\"title\":\"En el habla real, los pronombres se desinflan\",\"body\":\"$17\",\"table\":[[\"lo que está escrito\",\"lo que suena\",\"en español\"],[\"tell him\",\"TE-lim\",\"decirle\"],[\"ask her\",\"AAS-ka\",\"preguntarle\"],[\"I saw him\",\"ai SÓO-im\",\"lo vi\"],[\"give them a key\",\"GUI-vem a kii\",\"darles una llave\"],[\"in his room\",\"i-NIS̬ ruum\",\"en su habitación\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y el par que suena idéntico: whose / who's\",\"body\":\"\u003cb\u003e[[whose / who's|de quién / quién es]]\u003c/b\u003e se pronuncian \u003cb\u003eexactamente igual\u003c/b\u003e: \u003ci\u003ejuus̬\u003c/i\u003e. No hay ninguna diferencia de sonido, ni de longitud, ni de nada. El oído aquí no sirve para nada, y eso es una buena noticia: significa que no tienes que entrenarlo.\u003cbr/\u003e\u003cbr/\u003eLo que decide cuál escribes es la \u003cb\u003egramática\u003c/b\u003e:\u003cbr/\u003e· \u003cb\u003ewhose\u003c/b\u003e = \u003ci\u003ede quién\u003c/i\u003e, y le sigue un \u003cb\u003esustantivo\u003c/b\u003e o el verbo \u003ci\u003ebe\u003c/i\u003e: \u003ci\u003eWhose keys are these?\u003c/i\u003e · \u003ci\u003eWhose is this?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ewho's\u003c/b\u003e = \u003ci\u003ewho is\u003c/i\u003e / \u003ci\u003ewho has\u003c/i\u003e, y le sigue un \u003cb\u003everbo\u003c/b\u003e o un participio: \u003ci\u003eWho's coming tonight?\u003c/i\u003e · \u003ci\u003eWho's got the key?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003ePrueba de un segundo: \u003cb\u003esi puedes sustituirlo por «who is», lleva apóstrofo\u003c/b\u003e. Si no puedes, es whose.\u003cbr/\u003e\u003cbr/\u003eEs el mismo par que \u003ci\u003eits\u003c/i\u003e / \u003ci\u003eit's\u003c/i\u003e de la lección anterior, y el mismo que \u003ci\u003eyour\u003c/i\u003e / \u003ci\u003eyou're\u003c/i\u003e. En los tres, el apóstrofo señala un verbo escondido.\",\"table\":[[\"se escribe\",\"es\",\"detrás va\",\"ejemplo\"],[\"whose\",\"de quién\",\"un sustantivo o «is/are»\",\"Whose turn is it?\"],[\"who's\",\"who is / who has\",\"un verbo\",\"Who's got the key?\"],[\"its\",\"su (de ello)\",\"un sustantivo\",\"The flat and its garden\"],[\"it's\",\"it is\",\"un adjetivo o un verbo\",\"It's cold in here.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l5e1\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La h de him\",\"book\":\"Tell him tomorrow.\",\"real\":\"Tellim tomorrow.\",\"translation\":\"Díselo mañana.\",\"itemIds\":[\"ena2m9weakhim\"],\"tip\":\"Las dos son la MISMA frase: la segunda es cómo suena de verdad. La l de tell se enchufa a la i de him y la hache no llega a existir.\"},{\"id\":\"ena2m9l5e2\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La h de her\",\"book\":\"I asked her yesterday.\",\"real\":\"I askeder yesterday.\",\"translation\":\"Se lo pregunté ayer.\",\"itemIds\":[\"ena2m9weakher\",\"ena2m1asked\"],\"tip\":\"«asked her» son tres consonantes seguidas y luego una vocal floja: AAS-ka. Si esperas una hache, pierdes la palabra entera.\"},{\"id\":\"ena2m9l5e3\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? El them que se queda en 'em\",\"book\":\"Give them a key.\",\"real\":\"Give em a key.\",\"translation\":\"Dales una llave.\",\"itemIds\":[\"ena2m9weakthem\"],\"tip\":\"Este no lo produzcas todavía: reconócelo. En el examen escribe siempre «them».\"},{\"id\":\"ena2m9l5e4\",\"type\":\"audiomc\",\"prompt\":\"¿De quién habla? — 2 escuchas\",\"audio\":\"I saw her this morning and I told him about the rent.\",\"question\":\"¿A quién le contó lo del alquiler?\",\"options\":[\"A él\",\"A ella\",\"A los dos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«her» aparece al principio, con saw. El verbo told lleva «him» detrás\",\"Solo hay un verbo de contar en la frase\"],\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\",\"ena2m9ipaytherentonthefirst\"],\"tip\":\"La estrategia del examen: no persigas la hache, persigue el VERBO. Lo que va pegado detrás del verbo es el pronombre, y ahí lo cazas.\"},{\"id\":\"ena2m9l5e5\",\"type\":\"audiomc\",\"prompt\":\"Cuatro palabras en tres sílabas — 2 escuchas\",\"audio\":\"I gave it to her on Monday.\",\"question\":\"¿A quién se lo dio?\",\"options\":[\"A ella\",\"A él\",\"A nadie: no dice a quién\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«him» sonaría «im», con la i cerrada. Lo que suena al final es una vocal floja: her\",\"Sí lo dice, pero fundido: «it to her» se comprime en «i-tu-a»\"],\"itemIds\":[\"ena2m9weakher\",\"ena2m9icantfindit\"],\"tip\":\"«it to her» se funde en «i-tu-a». Es el trozo más comprimido de la frase y el que lleva la información. Cuenta con ello.\"},{\"id\":\"ena2m9l5e6\",\"type\":\"shadow\",\"prompt\":\"Sombrea el enlace — primero lento, luego a velocidad normal\",\"text\":\"Tell him, ask her and give them a key.\",\"phonetic\":\"TE-lim, AAS-ka and GUI-vem a KII\",\"translation\":\"Díselo, pregúntale y dales una llave.\",\"reps\":2,\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\",\"ena2m9weakthem\"],\"tip\":\"Tres enlaces seguidos y ni una hache. Si te sale sin separar las palabras, ya suenas a otra cosa.\"},{\"id\":\"ena2m9l5e7\",\"type\":\"bucket\",\"prompt\":\"¿whose o who's?\",\"categories\":[\"whose (de quién)\",\"who's (who is / who has)\"],\"items\":[{\"text\":\"___ keys are these?\",\"bucket\":0},{\"text\":\"___ coming tonight?\",\"bucket\":1},{\"text\":\"___ turn is it?\",\"bucket\":0},{\"text\":\"___ got the key?\",\"bucket\":1},{\"text\":\"___ is this jacket?\",\"bucket\":0},{\"text\":\"___ in the kitchen?\",\"bucket\":1}],\"itemIds\":[\"ena2m9whoseorwhos\",\"ena2m9whosekeysarethese\",\"ena2m9itsyourturn\"],\"tip\":\"La prueba de un segundo: si cabe «who is», lleva apóstrofo. «Who is keys are these?» no cabe, así que es whose.\"},{\"id\":\"ena2m9l5e8\",\"type\":\"cloze\",\"prompt\":\"Completa — suenan igual, así que decide por gramática\",\"text\":\"___ got my key? I can't find it anywhere.\",\"answers\":[\"Who's\",\"Whos\",\"who's\"],\"translation\":\"¿Quién tiene mi llave? No la encuentro por ningún sitio.\",\"hints\":[\"Detrás va un verbo (got), no un sustantivo\",\"Cabe «Who has…»\"],\"itemIds\":[\"ena2m9whoseorwhos\",\"ena2m9icantfindit\"]},{\"id\":\"ena2m9l5e9\",\"type\":\"listen\",\"prompt\":\"Dictado — dos pronombres flojos\",\"text\":\"I told him about it and I asked her for the key.\",\"translation\":\"Se lo conté a él y le pedí la llave a ella.\",\"hints\":[\"Los dos pronombres van pegados a su verbo y sin hache audible\",\"I told h… about it and I asked h… for the key.\"],\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\"],\"tip\":\"Escríbelos CON hache: se escriben him y her aunque no suenen. La ortografía no se encoge, solo el sonido.\"},{\"id\":\"ena2m9l5e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — sin separar las palabras\",\"text\":\"I saw him, I phoned her and I sent them a message.\",\"phonetic\":\"ái SÓO-im, ái FÓUN-da and ái SENT dem a ME-sich\",\"translation\":\"Lo vi, la llamé y les mandé un mensaje.\",\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\",\"ena2m9weakthem\",\"ena2m1phoned\"],\"tip\":\"Nota lo que pasa con «phoned her»: la d final se enchufa a la vocal de her y sale FÓUN-da. Ese es el enlace del módulo 5, otra vez.\"},{\"id\":\"ena2m9l5e11\",\"type\":\"mc\",\"prompt\":\"Por qué esta clínica vale para el examen\",\"question\":\"En el Listening del A2, ¿por qué se pierden tantas preguntas de «¿a quién?»\",\"options\":[\"Porque el pronombre va en la sílaba más floja de la frase y sin hache\",\"Porque los pronombres se pronuncian muy despacio y confunden\",\"Porque en el examen no se usan pronombres\"],\"answer\":0,\"whyWrong\":[null,\"Al revés: van tan rápido que se funden con el verbo de delante\",\"Se usan constantemente: son el hilo que sujeta cualquier conversación\"],\"itemIds\":[\"ena2m9weakhim\",\"ena2m9weakher\"],\"tip\":\"Estrategia de examen, en una línea: si la pregunta es «¿a quién?», escucha el trozo pegado DETRÁS del verbo, no una palabra suelta.\"},{\"id\":\"ena2m9l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿De quién es esta llave? Pregúntale a Amy, dile que la encontré en la cocina.\",\"answers\":[\"Whose is this key? Ask Amy, tell her I found it in the kitchen.\",\"Whose key is this? Ask Amy, tell her I found it in the kitchen.\",\"Whose is this key? Ask Amy and tell her I found it in the kitchen.\"],\"hints\":[\"whose sin apóstrofo + dos pronombres detrás de sus verbos\",\"Whose is this key? Ask Amy, tell h… I found i… in the kitchen.\"],\"itemIds\":[\"ena2m9whoseisthis\",\"ena2m9weakher\",\"ena2m9icantfindit\",\"eninthekitchen\"],\"tip\":\"Escrito lleva todo: whose, her, it. Dicho, la mitad se funde. Escribir y decir son dos oficios y hay que hacer los dos.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — The Sounds of English\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/pronunciation\",\"note\":\"Busca los vídeos de «weak forms» y «connected speech». Cinco minutos al día durante una semana: el Listening del examen se juega aquí, no en el vocabulario.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-
