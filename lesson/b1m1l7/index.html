bos. Equivocarse de cubo genera cartas.\u003cbr/\u003e· \u003cb\u003eKehrwoche\u003c/b\u003e (sobre todo en el sur): la semana en la que TE toca limpiar la escalera.\u003cbr/\u003e\u003cbr/\u003eY tres verbos que en alemán vienen pegados a su preposición — se aprenden en bloque, como una sola palabra:\u003cbr/\u003e· \u003cb\u003esich beschweren \u003cmark class=\"akk\"\u003eüber\u003c/mark\u003e\u003c/b\u003e + Akkusativ — quejarse DE algo: \u003ci\u003eEr beschwert sich über den Lärm.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003esich kümmern \u003cmark class=\"akk\"\u003eum\u003c/mark\u003e\u003c/b\u003e + Akkusativ — ocuparse DE algo: \u003ci\u003eIch kümmere mich um die Post.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eachten \u003cmark class=\"akk\"\u003eauf\u003c/mark\u003e\u003c/b\u003e + Akkusativ — prestar atención A algo: \u003ci\u003eBitte achten Sie auf die Ruhezeiten.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLa preposición \u003cb\u003eno se traduce\u003c/b\u003e del español: «quejarse DE» no es «von». Memoriza el bloque entero."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l7\",\"phaseId\":\"b1m1\",\"title\":\"Die Nachbarn und die Hausordnung\",\"subtitle\":\"Escuchar, entender y quejarse con educación\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las reglas no escritas (que sí están escritas)\",\"itemIds\":[\"b1m1hausordnung\",\"b1m1ruhezeit\",\"b1m1laerm\",\"b1m1muelltrennung\",\"b1m1treppenhaus\",\"b1m1sichbeschwerenueber\",\"b1m1sichkuemmernum\",\"b1m1achtenauf\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la Hausordnung y los verbos que la mandan\",\"body\":\"$17\",\"table\":[[\"verbo + preposición\",\"caso\",\"ejemplo\"],[\"sich beschweren über\",\"Akkusativ\",\"Ich beschwere mich über den Lärm\"],[\"sich kümmern um\",\"Akkusativ\",\"Ich kümmere mich um die Post\"],[\"achten auf\",\"Akkusativ\",\"Achten Sie auf die Ruhezeit\"],[\"sich freuen auf\",\"Akkusativ\",\"Ich freue mich auf den Einzug\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l7e1\",\"type\":\"match\",\"prompt\":\"Empareja las reglas de la casa\",\"pairs\":[{\"target\":\"die Hausordnung\",\"source\":\"el reglamento de la comunidad\"},{\"target\":\"die Ruhezeit\",\"source\":\"la hora de silencio\"},{\"target\":\"die Mülltrennung\",\"source\":\"la separación de la basura\"},{\"target\":\"das Treppenhaus\",\"source\":\"el rellano / la escalera\"}],\"itemIds\":[\"b1m1hausordnung\",\"b1m1ruhezeit\",\"b1m1muelltrennung\",\"b1m1treppenhaus\"]},{\"id\":\"b1m1l7e2\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: contestador de la administración · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist die Hausverwaltung Meier, eine Nachricht für alle Mieterinnen und Mieter im Vorderhaus. Wir möchten Sie daran erinnern, dass die Ruhezeit von zweiundzwanzig Uhr bis sieben Uhr gilt — und am Sonntag, das vergessen viele, den ganzen Tag. Das heißt: keine Waschmaschine, kein Staubsauger. Wenn es trotzdem mal laut wird, sprechen Sie bitte zuerst mit dem Nachbarn und erst dann mit uns. Vielen Dank.\",\"question\":\"„Am Sonntag gilt die Ruhezeit nur nachts.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«und am Sonntag … den ganzen Tag»: el domingo entero, no solo de noche\",null],\"itemIds\":[\"b1m1ruhezeit\",\"b1m1hausordnung\"],\"tip\":\"Lee la afirmación ANTES de darle al play: en el examen ese es el reflejo que separa aprobar de suspender.\"},{\"id\":\"b1m1l7e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, hier ist die Hausverwaltung Meier, eine Nachricht für alle Mieterinnen und Mieter im Vorderhaus. Wir möchten Sie daran erinnern, dass die Ruhezeit von zweiundzwanzig Uhr bis sieben Uhr gilt — und am Sonntag, das vergessen viele, den ganzen Tag. Das heißt: keine Waschmaschine, kein Staubsauger. Wenn es trotzdem mal laut wird, sprechen Sie bitte zuerst mit dem Nachbarn und erst dann mit uns. Vielen Dank.\",\"question\":\"¿Qué pide la administración si un día hay ruido?\",\"options\":[\"Hablar primero con el vecino y solo después con ellos\",\"Llamarles a ellos inmediatamente\",\"Avisar a la policía\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ellos son el segundo paso, no el primero\",\"De la policía no se dice nada\"],\"itemIds\":[\"b1m1laerm\",\"b1m1nachbarschaft\"]},{\"id\":\"b1m1l7e3\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje del vecino de abajo en el buzón de voz · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Abend, Frau Schuster, hier ist Ihr Nachbar von unten, Herr Adler. Ich möchte mich wirklich nicht beschweren, ähm, aber gestern war es nach Mitternacht ziemlich laut bei Ihnen. Ich muss unter der Woche um fünf Uhr aufstehen, das ist das ganze Problem. Könnten Sie die Musik nächstes Mal einfach etwas leiser machen? Am Wochenende ist mir das völlig egal, da schlafe ich sowieso länger. Danke Ihnen!\",\"question\":\"„Der Nachbar stört auch das Wochenende.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Am Wochenende ist mir das völlig egal»: el fin de semana le da igual\",null],\"itemIds\":[\"b1m1sichbeschwerenueber\",\"b1m1laerm\"],\"tip\":\"«Ich möchte mich wirklich nicht beschweren, aber…» = «no es por quejarme, pero…». Es LA fórmula de la queja educada alemana: lo que va detrás del «aber» ES la queja.\"},{\"id\":\"b1m1l7e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Abend, Frau Schuster, hier ist Ihr Nachbar von unten, Herr Adler. Ich möchte mich wirklich nicht beschweren, ähm, aber gestern war es nach Mitternacht ziemlich laut bei Ihnen. Ich muss unter der Woche um fünf Uhr aufstehen, das ist das ganze Problem. Könnten Sie die Musik nächstes Mal einfach etwas leiser machen? Am Wochenende ist mir das völlig egal, da schlafe ich sowieso länger. Danke Ihnen!\",\"question\":\"¿Qué pide el vecino?\",\"options\":[\"Que baje la música entre semana por la noche\",\"Que se mude a otro piso\",\"Que lo despierte a las cinco\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No pide nada tan drástico: está siendo de lo más cortés\",\"Dice que él se levanta a las cinco, no que ella lo despierte\"],\"itemIds\":[\"b1m1ruhezeit\"]},{\"id\":\"b1m1l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Der Nachbar beschwert sich ___ den Lärm.\",\"answers\":[\"über\"],\"translation\":\"El vecino se queja del ruido.\",\"hints\":[\"No es «von», aunque el español diga «de»\",\"ü-b-e-r + Akkusativ\"],\"itemIds\":[\"b1m1sichbeschwerenueber\",\"b1m1laerm\"],\"strictUmlaut\":true,\"tip\":\"«quejarse DE» → sich beschweren ÜBER. La preposición se aprende pegada al verbo, nunca traducida.\"},{\"id\":\"b1m1l7e5\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Meine Nachbarin kümmert sich ___ meine Post, wenn ich im Urlaub bin.\",\"answers\":[\"um\"],\"translation\":\"Mi vecina se ocupa de mi correo cuando estoy de vacaciones.\",\"hints\":[\"Otra vez no es «von»\",\"sich kümmern + preposición de «alrededor»\"],\"itemIds\":[\"b1m1sichkuemmernum\",\"a2m4nachbarin\"]},{\"id\":\"b1m1l7e6\",\"type\":\"gapbank\",\"prompt\":\"Completa la Hausordnung con las preposiciones correctas\",\"text\":\"Bitte achten Sie ___ die Ruhezeiten. Wer sich ___ den Lärm beschweren will, spricht zuerst mit dem Nachbarn. Jeder Mieter kümmert sich ___ seinen Müll.\",\"answers\":[\"auf\",\"über\",\"um\"],\"bank\":[\"auf\",\"über\",\"um\",\"von\",\"mit\",\"für\"],\"translation\":\"Por favor, respeten las horas de silencio. Quien quiera quejarse del ruido, habla primero con el vecino. Cada inquilino se ocupa de su basura.\",\"itemIds\":[\"b1m1achtenauf\",\"b1m1sichbeschwerenueber\",\"b1m1sichkuemmernum\"],\"tip\":\"Los tres bloques de la lección, uno detrás de otro. Si te salieron sin dudar, ya están automatizados.\"},{\"id\":\"b1m1l7e7\",\"type\":\"shadow\",\"prompt\":\"Sombrea la queja educada — pégate al audio\",\"text\":\"Könnten Sie bitte etwas leiser sein?\",\"phonetic\":\"KÖN-ten zii BI-te ET-vas LAI-za zain\",\"translation\":\"¿Podría hacer un poco menos de ruido?\",\"reps\":2,\"itemIds\":[\"b1m1laerm\"],\"tip\":\"«Könnten Sie...» es el Konjunktiv II de cortesía. Lo trabajarás a fondo en el módulo 2; aquí basta con que suene natural.\"},{\"id\":\"b1m1l7e8\",\"type\":\"hearreal\",\"prompt\":\"Escucha — ¿qué significa?\",\"book\":\"Das ist mir egal.\",\"real\":\"Das ist mir wurscht.\",\"translation\":\"Me da igual.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Me da igual\",\"Eso me molesta mucho\",\"Eso me parece muy bien\"],\"itemIds\":[\"b1m1natwurst\"],\"tip\":\"«wurscht» (o «wurst») = «salchicha», y significa «me da igual». Muy del sur y de Austria. Se entiende en todas partes; se dice entre amigos.\"},{\"id\":\"b1m1l7e9\",\"type\":\"mc\",\"prompt\":\"Registro: ¿a quién se lo dices?\",\"question\":\"„Könnten Sie bitte auf die Ruhezeit achten?“ — ¿Con quién hablas?\",\"options\":[\"Con un vecino al que tratas de usted\",\"Con tu mejor amigo\",\"Contigo mismo\"],\"answer\":0,\"whyWrong\":[null,\"A un amigo le dirías «Könntest du...» y probablemente sin tanto rodeo\",\"No es una frase reflexiva\"],\"itemIds\":[\"b1m1achtenauf\",\"b1m1ruhezeit\"],\"tip\":\"Sie + Könnten = distancia y cortesía máximas. En el examen, elegir mal el tratamiento cuesta puntos de Erfüllung.\"},{\"id\":\"b1m1l7e10\",\"type\":\"build\",\"prompt\":\"Construye la queja con relativo\",\"target\":\"Der Nachbar, der über mir wohnt, macht viel Lärm\",\"translation\":\"El vecino que vive encima de mí hace mucho ruido\",\"distractors\":[\"den\",\"wohnen\"],\"itemIds\":[\"b1m1laerm\",\"a2m4nachbarin\"],\"tip\":\"El vecino HACE la acción de vivir → der. Relativa intercalada entre comas, verbo al final.\"},{\"id\":\"b1m1l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me quejo del ruido que hacen mis vecinos\",\"answers\":[\"Ich beschwere mich über den Lärm, den meine Nachbarn machen\"],\"hints\":[\"sich beschweren über + Akkusativ\",\"..., den meine Nachbarn machen (el ruido lo RECIBE la acción)\"],\"itemIds\":[\"b1m1sichbeschwerenueber\",\"b1m1laerm\"],\"tip\":\"Preposición regida + relativo en acusativo en la misma frase. Este es el nivel de complejidad que el B1 espera de ti.\"},{\"id\":\"b1m1l7e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: un aviso a los vecinos · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, eine Information an alle Mieterinnen und Mieter: Ab dem ersten Oktober werden die Mülltonnen im Hof neu aufgestellt, Papier und Plastik tauschen den Platz. Und, ähm, noch eine Bitte zur Hausordnung: Zwischen dreizehn und fünfzehn Uhr gilt Mittagsruhe. Das haben in letzter Zeit ein paar Leute vergessen. Vielen Dank.\",\"question\":\"„Papier und Plastik bleiben da, wo sie jetzt stehen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Papier und Plastik tauschen den Platz»: se cambian de sitio el uno por el otro\",null],\"itemIds\":[\"b1m1muelltrennung\"],\"tip\":\"«tauschen» = intercambiar. Dos bloques en veinte segundos: basura y ruido. Cuando oigas «und noch eine Bitte», empieza el segundo tema.\"},{\"id\":\"b1m1l7e15\",\"type\":\"audiomc\",\"prompt\":\"Mismo aviso, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, eine Information an alle Mieterinnen und Mieter: Ab dem ersten Oktober werden die Mülltonnen im Hof neu aufgestellt, Papier und Plastik tauschen den Platz. Und, ähm, noch eine Bitte zur Hausordnung: Zwischen dreizehn und fünfzehn Uhr gilt Mittagsruhe. Das haben in letzter Zeit ein paar Leute vergessen. Vielen Dank.\",\"question\":\"¿Qué se recuerda sobre la Hausordnung?\",\"options\":[\"Que de una a tres hay descanso del mediodía\",\"Que el patio no se puede usar\",\"Que la escalera se limpia por turnos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del patio solo se dice dónde van los contenedores\",\"El turno de limpieza no aparece\"],\"itemIds\":[\"b1m1hausordnung\",\"b1m1ruhezeit\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m1-3\",\"book\":\"Das ist mir egal.\",\"real\":\"Das ist mir wurscht.\",\"meaning\":\"Me da igual\",\"when\":\"Con amigos, y sobre todo en el sur de Alemania y en Austria. Con la casera, con el jefe o en el examen, no. Y ojo: cambiarlo por «Das ist mir egal» tampoco basta — no es incorrecto, pero suena seco y en el Sprechen se lee como desinterés.\",\"register\":\"regional\",\"exam\":\"Das spielt für mich keine große Rolle.\",\"note\":\"También se oye «Das ist mir wurst». Literalmente «eso me es salchicha»: la comida como medida de la indiferencia.\",\"sound\":\"das ist mia vursht\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m1natwurst\"}}],\"resources\":[{\"label\":\"DW — Alltagsdeutsch\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Audios de vida cotidiana a velocidad real: escúchalos sin leer la transcripción la primera vez.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content
