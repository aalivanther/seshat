\u003ethe station was\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e✗ \u003ci\u003eShe asked me where was the station.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Se acabó el «do».\u003c/b\u003e El auxiliar de soporte solo existe en preguntas de verdad.\u003cbr/\u003e\u003ci\u003e«\u003cb\u003eDo\u003c/b\u003e you want a coffee?»\u003c/i\u003e → \u003ci\u003eHe asked me \u003cb\u003eif I wanted\u003c/b\u003e a coffee.\u003c/i\u003e\u003cbr/\u003e✗ \u003ci\u003eHe asked me if did I want a coffee.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. Si no hay palabra interrogativa, aparece \u003ci\u003eif\u003c/i\u003e o \u003ci\u003ewhether\u003c/i\u003e.\u003c/b\u003e\u003cbr/\u003e\u003ci\u003e«Have you finished?»\u003c/i\u003e → \u003ci\u003eThey asked me \u003cb\u003ewhether\u003c/b\u003e I had finished.\u003c/i\u003e\u003cbr/\u003eLos dos valen casi siempre. \u003cb\u003eWhether\u003c/b\u003e es el de registro alto y el obligatorio en dos sitios: con «or not» pegado (\u003ci\u003ewhether or not…\u003c/i\u003e) y detrás de preposición.\u003cbr/\u003e\u003cbr/\u003eY una cuarta, que es el otro calco: \u003cb\u003elas órdenes y peticiones no llevan «that».\u003c/b\u003e El español las cuenta con subjuntivo («me pidió \u003cb\u003eque le llamara\u003c/b\u003e»), y el inglés con \u003cb\u003einfinitivo\u003c/b\u003e:\u003cbr/\u003e\u003ci\u003eask / tell somebody \u003cb\u003eto\u003c/b\u003e do something\u003c/i\u003e — y en negativo, \u003cb\u003enot to\u003c/b\u003e:\u003cbr/\u003e\u003ci\u003eHe asked me \u003cb\u003eto call\u003c/b\u003e him back.\u003c/i\u003e · \u003ci\u003eShe told me \u003cb\u003enot to worry\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e✗ \u003ci\u003eHe asked me that I called him back.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l3\",\"phaseId\":\"enb1m3\",\"title\":\"She asked me where it was\",\"subtitle\":\"La pregunta referida deja de ser pregunta — y ese es elve delante del verbo («was»). Es el error más resistente del nivel, y sale igual en «I don't know where is the toilet».\",\"translation\":\"Me preguntó dónde estaba la estación.\",\"itemIds\":[\"enb1m3askedmewhereitwas\",\"enstation\"]},{\"id\":\"enb1m3l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"He asked me if did I want a coffee.\",\"answers\":[\"He asked me if I wanted a coffee.\"],\"why\":\"El «do/did» solo existe en preguntas de verdad. Contada, la pregunta pierde el auxiliar y el verbo se lleva el pasado: «wanted».\",\"translation\":\"Me preguntó si quería un café.\",\"itemIds\":[\"enb1m3askedmeifiwanted\",\"encoffee\"]},{\"id\":\"enb1m3l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She asked me that I called her back.\",\"answers\":[\"She asked me to call her back.\"],\"why\":\"El español cuenta las peticiones con subjuntivo («me pidió que le llamara»); el inglés, con infinitivo: ask somebody TO do something. Nunca «asked me that…».\",\"translation\":\"Me pidió que le llamara.\",\"itemIds\":[\"enb1m3askedmetocall\"]},{\"id\":\"enb1m3l3e5\",\"type\":\"transform\",\"prompt\":\"Cuenta la pregunta\",\"source\":\"«Where do you live?» she asked.\",\"instruction\":\"Cuéntalo con «She asked me…»\",\"answers\":[\"She asked me where I lived\",\"She asked me where I live\"],\"translation\":\"Me preguntó dónde vivía.\",\"hints\":[\"Fuera el «do» y fuera la inversión\",\"She asked me where I ...\"],\"itemIds\":[\"enb1m3askedmewhereitwas\"],\"tip\":\"Dos cosas caen a la vez: el «do» desaparece y el verbo se lleva el tiempo que llevaba el auxiliar. «do you live» → «I lived».\"},{\"id\":\"enb1m3l3e6\",\"type\":\"transform\",\"prompt\":\"Cuenta la orden\",\"source\":\"«Don't worry about the deposit,» she said.\",\"instruction\":\"Cuéntalo con «She told me…»\",\"answers\":[\"She told me not to worry about the deposit\",\"She told me not to worry\"],\"translation\":\"Me dijo que no me preocupara por la fianza.\",\"hints\":[\"En negativo, la partícula va delante del infinitivo\",\"She told me not to ...\"],\"itemIds\":[\"enb1m3toldmenotto\",\"enb1m1worryabout\"],\"tip\":\"«not to», en ese orden y sin nada en medio. «She told me to not worry» se oye, pero en el examen escribe «not to worry».\"},{\"id\":\"enb1m3l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que le preguntaron a Valeria en la entrevista\",\"text\":\"She asked me ___ I lived, ___ I had been in London and ___ I liked my job at the café. I told her ___ I had been here for two years.\",\"answers\":[\"where\",\"how long\",\"whether\",\"that\"],\"bank\":[\"where\",\"how long\",\"whether\",\"that\",\"did\",\"was\",\"when\"],\"translation\":\"Me preguntó dónde vivía, cuánto tiempo llevaba en Londres y si me gustaba mi trabajo en el café. Le dije que llevaba aquí dos años.\",\"itemIds\":[\"enb1m3askedmewhereitwas\",\"enb1m1howlong\",\"enb1m3askedmewhether\"],\"tip\":\"Las tres fichas que sobran son las tres tentaciones: «did» (el auxiliar que ya no cabe), «was» (la inversión) y «when» (que aquí no pega). Ninguna de las tres entra en una pregunta contada bien hecha.\"},{\"id\":\"enb1m3l3e8\",\"type\":\"build\",\"prompt\":\"Construye la pregunta contada\",\"target\":\"She asked me where the station was\",\"translation\":\"Me preguntó dónde estaba la estación\",\"distractors\":[\"is\",\"did\"],\"itemIds\":[\"enb1m3askedmewhereitwas\",\"enstation\"],\"tip\":\"Las dos fichas que sobran son las dos que pone un hispanohablante: el presente y el auxiliar. Ninguna cabe.\"},{\"id\":\"enb1m3l3e9\",\"type\":\"mc\",\"prompt\":\"If o whether\",\"question\":\"¿Cuál de estas frases EXIGE «whether» y no admite «if»?\",\"options\":[\"They asked me ___ or not I had finished.\",\"He asked me ___ I wanted a coffee.\",\"She asked me ___ I was free on Friday.\"],\"answer\":0,\"whyWrong\":[null,\"Aquí valen los dos; «if» es lo normal en el habla.\",\"Igual: los dos valen.\"],\"itemIds\":[\"enb1m3askedmewhether\"],\"tip\":\"«whether» es obligatorio en dos sitios: pegado a «or not» y detrás de preposición («the question of whether…»). Fuera de ahí, elige tú: «whether» suena más formal y en el Writing queda mejor.\"},{\"id\":\"enb1m3l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Quería saber por qué llegaba tarde.\",\"answers\":[\"She wanted to know why I was late\",\"He wanted to know why I was late\"],\"hint\":\"«wanted to know» funciona igual que «asked»: sin inversión detrás\",\"itemIds\":[\"enb1m3wantedtoknow\"],\"tip\":\"«wanted to know» es la alternativa elegante a repetir «asked» tres veces seguidas. Y arrastra la misma regla: nada de «why was I late».\"},{\"id\":\"enb1m3l3e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"He asked me to call him back.\",\"answers\":[\"Me pidió que le llamara\",\"Me pidió que le devolviera la llamada\",\"Me pidió que le llamase\"],\"itemIds\":[\"enb1m3askedmetocall\"],\"tip\":\"Fíjate en la asimetría: donde el inglés pone un infinitivo, el español pone un subjuntivo. Por eso el calco sale solo — y por eso hay que cazarlo a mano.\"},{\"id\":\"enb1m3l3e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres formas de contar una pregunta\",\"text\":\"She asked me where the station was. He asked me if I wanted a coffee. They asked me whether or not I had finished.\",\"phonetic\":\"shi aaskt mi uéa de STÉI-shon uos̬ · ji aaskt mi if ai UÓN-tid a KÓ-fi · dei aaskt mi UÉ-da oo not ai jad FÍ-nisht\",\"translation\":\"Me preguntó dónde estaba la estación. · Me preguntó si quería un café. · Me preguntaron si había terminado o no.\",\"itemIds\":[\"enb1m3askedmewhereitwas\",\"enb1m3askedmeifiwanted\",\"enb1m3askedmewhether\"],\"tip\":\"Dilas hasta que la mano no te tiemble al escribirlas. Este patrón cae en el Writing, en el Speaking Part 2 y en el Listening Part 4: es de los que se amortizan tres veces.\"},{\"id\":\"enb1m3l3e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos compañeras hablan de una entrevista. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"So how did it go?|Fine, I think. She asked me where I had worked before, and how long I had been in London.|Did she ask about the exam?|She wanted to know whether I had finished the course, and I said I hadn't, not yet. And then she asked me to send her my certificate when I get it.|That doesn't sound bad at all.|No. She didn't ask me anything about the hours, though, which is the bit I actually wanted to talk about.\",\"question\":\"¿Qué NO le preguntaron?\",\"options\":[\"Por el horario\",\"Por el curso\",\"Por dónde había trabajado antes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Sí: «whether I had finished the course».\",\"Sí, y es lo primero que cuenta.\"],\"itemIds\":[\"enb1m3wantedtoknow\",\"enb1m3askedmewhether\",\"enb1m1notyet\"],\"tip\":\"La respuesta llega en la última frase, detrás de un «though» pospuesto. En el Listening del examen, la información que contradice lo anterior suele llegar así: al final y con una palabrita.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Mira el Listening Part 4: una discusión de la que hay que sacar quién dice qué. Todo lo de esta lección se cobra ahí.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"Ic
