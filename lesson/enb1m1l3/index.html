\u003e.\u003c/i\u003e · \u003ci\u003eHave you signed it \u003cb\u003eyet\u003c/b\u003e?\u003c/i\u003e\u003cbr/\u003e\u003cb\u003estill\u003c/b\u003e = sigue pasando. Va \u003cb\u003eantes del verbo principal\u003c/b\u003e y detrás de «be»: \u003ci\u003eI'm \u003cb\u003estill\u003c/b\u003e looking.\u003c/i\u003e · \u003ci\u003eI \u003cb\u003estill\u003c/b\u003e haven't signed it.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa confusión que hay que deshacer:\u003c/b\u003e «todavía no» se dice de dos maneras y no significan lo mismo. \u003ci\u003eI haven't signed it \u003cb\u003eyet\u003c/b\u003e\u003c/i\u003e = neutro, lo firmaré. \u003ci\u003eI \u003cb\u003estill\u003c/b\u003e haven't signed it\u003c/i\u003e = con impaciencia, esto ya se está alargando.\u003cbr/\u003e\u003cbr/\u003eY la posición no es un detalle de estilo: es lo que corrige el criterio de gramática del examen. En español el adverbio se cuela donde quiere («ya he pagado», «he pagado ya»); en inglés, \u003cb\u003enunca entre el verbo y su objeto\u003c/b\u003e. \u003ci\u003eI haven't signed yet the contract\u003c/i\u003e está mal por eso, no por el adverbio.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eever / never\u003c/b\u003e viven en el mismo barrio: \u003ci\u003eHave you \u003cb\u003eever\u003c/b\u003e been to Manchester?\u003c/i\u003e · \u003ci\u003eI've \u003cb\u003enever\u003c/b\u003e been to Scotland.\u003c/i\u003e Y ojo, «never» ya es negativo: \u003ci\u003eI haven't never been\u003c/i\u003e no existe."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l3\",\"phaseId\":\"enb1m1\",\"title\":\"Already, yet, just, still\",\"subtitle\":\"Los cuatro adverbios del perfecto — y dónde va cada uno en la frase\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los cuatro, con su sitio\",\"itemIds\":[\"enb1m1already\",\"enb1m1notyet\",\"enb1m1just\",\"enb1m1still\",\"enb1m1everbeen\",\"enb1m1neverbeen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: qué dice cada uno y dónde se coloca\",\"body\":\"$17\",\"table\":[[\"Adverbio\",\"Dónde va\",\"Ejemplo\"],[\"just\",\"have + JUST + participio\",\"I've just moved in.\"],[\"already\",\"have + ALREADY + participio\",\"I've already paid.\"],[\"yet\",\"al FINAL (negativa/pregunta)\",\"I haven't signed it yet.\"],[\"still\",\"antes del verbo principal\",\"I'm still looking.\"],[\"ever / never\",\"have + EVER/NEVER + participio\",\"Have you ever been…?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l3e1\",\"type\":\"match\",\"prompt\":\"Empareja cada adverbio con lo que dice\",\"pairs\":[{\"target\":\"just\",\"source\":\"acabo de (hace un momento)\"},{\"target\":\"already\",\"source\":\"ya, antes de lo esperado\"},{\"target\":\"yet\",\"source\":\"todavía no / ¿ya? (negativas y preguntas)\"},{\"target\":\"still\",\"source\":\"sigue pasando, no ha cambiado\"}],\"itemIds\":[\"enb1m1just\",\"enb1m1already\",\"enb1m1notyet\",\"enb1m1still\"],\"tip\":\"Los cuatro empujan hacia el present perfect. Si ves uno en una pregunta de examen, el pasado simple casi seguro que no es la respuesta.\"},{\"id\":\"enb1m1l3e2\",\"type\":\"bucket\",\"prompt\":\"¿Va EN MEDIO (have + adv + participio) o AL FINAL?\",\"categories\":[\"en medio: have ___ done\",\"al final: … done ___\"],\"items\":[{\"text\":\"just\",\"bucket\":0},{\"text\":\"already\",\"bucket\":0},{\"text\":\"never\",\"bucket\":0},{\"text\":\"ever\",\"bucket\":0},{\"text\":\"yet\",\"bucket\":1},{\"text\":\"twice\",\"bucket\":1}],\"itemIds\":[\"enb1m1just\",\"enb1m1already\",\"enb1m1notyet\",\"enb1m1neverbeen\",\"entwice\"],\"tip\":\"«yet» es el raro del grupo: siempre al final y solo en negativas o preguntas. Los demás se meten entre el auxiliar y el participio, y las expresiones de cuántas veces —twice, three times— cierran la frase. Y «so far» no juega en esta liga: no es un adverbio de este hueco, es una expresión de tiempo entera y va donde van esas, al principio o al final: «So far everything has gone well».\"},{\"id\":\"enb1m1l3e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I haven't signed yet the contract.\",\"answers\":[\"I haven't signed the contract yet.\"],\"why\":\"«yet» va al final del todo. Y la regla de fondo, que vale para el nivel entero: en inglés no se mete NADA entre el verbo y su objeto.\",\"translation\":\"Todavía no he firmado el contrato.\",\"itemIds\":[\"enb1m1notyet\"]},{\"id\":\"enb1m1l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I just have moved in.\",\"answers\":[\"I have just moved in.\",\"I've just moved in.\"],\"why\":\"«just» va DENTRO del verbo compuesto: entre el auxiliar (have) y el participio (moved). El español lo pone delante de todo y suena natural; el inglés no.\",\"translation\":\"Acabo de instalarme.\",\"itemIds\":[\"enb1m1just\"]},{\"id\":\"enb1m1l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa con el adverbio correcto\",\"text\":\"I've ___ paid the deposit, so we can move in on Saturday.\",\"answers\":[\"already\"],\"translation\":\"Ya he pagado la fianza, así que podemos entrar el sábado.\",\"hints\":[\"Está hecho, y antes de lo esperado\",\"No es «yet»: la frase es afirmativa\"],\"itemIds\":[\"enb1m1already\",\"enb1m1deposit\"],\"tip\":\"«yet» habría sido imposible: es afirmativa. Ese detalle solo lo elimina bien quien conoce la regla, no quien traduce «ya».\"},{\"id\":\"enb1m1l3e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el mensaje de Valeria a Amy\",\"text\":\"I've ___ been to the estate agent. I haven't seen the flat ___, but they've ___ sent me the photos. I'm ___ waiting for the landlady to call.\",\"answers\":[\"already\",\"yet\",\"just\",\"still\"],\"bank\":[\"already\",\"yet\",\"just\",\"still\",\"ever\",\"never\",\"so far\"],\"translation\":\"Ya he ido a la inmobiliaria. Todavía no he visto el piso, pero acaban de mandarme las fotos. Sigo esperando a que llame la casera.\",\"itemIds\":[\"enb1m1already\",\"enb1m1notyet\",\"enb1m1just\",\"enb1m1still\",\"enb1m1estateagent\"],\"tip\":\"Los cuatro en cuatro líneas de WhatsApp real. Fíjate en que solo uno va al final: el de la frase negativa.\"},{\"id\":\"enb1m1l3e7\",\"type\":\"transform\",\"prompt\":\"Del hecho al «todavía no»\",\"source\":\"I have signed the contract.\",\"instruction\":\"Ponla en negativa con «yet»\",\"answers\":[\"I haven't signed the contract yet\",\"I have not signed the contract yet\"],\"translation\":\"Todavía no he firmado el contrato.\",\"hints\":[\"La negación va en el auxiliar\",\"El «yet», al final del todo\"],\"itemIds\":[\"enb1m1notyet\"]},{\"id\":\"enb1m1l3e8\",\"type\":\"mc\",\"prompt\":\"El matiz que los separa\",\"question\":\"Llevas tres semanas esperando el contrato y estás harta. ¿Qué dices?\",\"options\":[\"I still haven't signed the contract.\",\"I haven't signed the contract yet.\",\"I have already signed the contract.\"],\"answer\":0,\"whyWrong\":[null,\"Correcta pero neutra: dice el hecho, no la impaciencia.\",\"Dice lo contrario: que ya está firmado.\"],\"itemIds\":[\"enb1m1still\",\"enb1m1notyet\"],\"tip\":\"«still + negativa» lleva queja dentro. Es el tipo de matiz que el Listening Part 2 del examen pregunta como «actitud del hablante».\"},{\"id\":\"enb1m1l3e9\",\"type\":\"build\",\"prompt\":\"Construye la pregunta de experiencia\",\"target\":\"Have you ever been to Manchester\",\"translation\":\"¿Has estado alguna vez en Mánchester?\",\"distractors\":[\"did\",\"yet\"],\"itemIds\":[\"enb1m1everbeen\"],\"tip\":\"«been to» = haber estado y haber vuelto. «gone to» = estar allí ahora. Confundirlos cambia el significado entero.\"},{\"id\":\"enb1m1l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"No he estado nunca en Escocia.\",\"answers\":[\"I have never been to Scotland\",\"I've never been to Scotland\",\"I haven't been to Scotland\"],\"hint\":\"El adverbio de «nunca» ya niega: no hace falta negar el auxiliar además\",\"itemIds\":[\"enb1m1neverbeen\"],\"tip\":\"El español dobla la negación («no… nunca») y el inglés la prohíbe: «I haven't never been» no existe. Es un calco que se oye mucho y se corrige rápido.\"},{\"id\":\"enb1m1l3e11\",\"type\":\"shadow\",\"prompt\":\"Sombrea la cadena de los cuatro adverbios\",\"text\":\"I've just moved in, I've already paid, but I haven't unpacked yet.\",\"phonetic\":\"aiv dchast muuvd in, aiv ool-RÉ-di péid, bat ai JÁ-vent an-PÁKT yet\",\"translation\":\"Acabo de instalarme, ya he pagado, pero todavía no he deshecho las cajas.\",\"reps\":2,\"itemIds\":[\"enb1m1just\",\"enb1m1already\",\"enb1m1notyet\"],\"tip\":\"Pégate al audio y no te pares a pensar. La segunda pasada sale mejor: está medido.\"},{\"id\":\"enb1m1l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Acabo de mudarme y todavía no he conocido a los vecinos.\",\"answers\":[\"I have just moved in and I haven't met the neighbours yet\",\"I've just moved in and I haven't met the neighbours yet\",\"I have just moved and I haven't met the neighbours yet\"],\"hints\":[\"«just» dentro del verbo compuesto\",\"«yet» al final del todo\"],\"itemIds\":[\"enb1m1just\",\"enb1m1notyet\"],\"tip\":\"Dos adverbios en dos sitios distintos, y ninguno donde los pondría el español. Eso es exactamente lo que puntúa el criterio de gramática.\"},{\"id\":\"enb1m1l3e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: mensaje de voz de la inmobiliaria. Dos escuchas.\",\"audio\":\"Good afternoon, I'm calling from Hartley Lettings about the room in Palmer Road. Um, we've just had the reference back from your employer, which is fine. We haven't received the guarantor form yet, though, so we can't confirm anything until that arrives. And the landlady has already agreed the date, so it's only that one document. Could you send it over by Thursday?\",\"question\":\"¿Qué falta todavía?\",\"options\":[\"La referencia del trabajo\",\"El formulario del avalista\",\"La fecha de entrada\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Esa ya está: «we've just had the reference back».\",null,\"La fecha ya está acordada: «the landlady has already agreed the date».\"],\"itemIds\":[\"enb1m1notyet\",\"enb1m1already\",\"enb1m1just\"],\"tip\":\"Tres adverbios y tres estados distintos en veinte segundos: just (recién hecho), yet (falta), already (hecho hace tiempo). El examen decide la respuesta con ellos.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m1-2\",\"book\":\"I am very tired.\",\"real\":\"I'm shattered.\",\"meaning\":\"Estoy hecho polvo\",\"when\":\"Con amigos, compañeros y vecinos, en todo el Reino Unido. Es coloquial pero no vulgar: se lo dices a tu casera sin problema. En el Writing formal y en el Speaking de examen, no: allí sube el registro a «exhausted».\",\"register\":\"amigos\",\"exam\":\"I'm exhausted.\",\"note\":\"«shattered» es literalmente «hecho añicos», y es el adjetivo de cansancio más británico que hay. Sus primos: «knackered» (más informal todavía) y «worn out» (neutro).\",\"sound\":\"aim SHÁ-tad\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m1natshattered\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\
