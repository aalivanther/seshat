e mich gut mit meiner Mitbewohnerin.\u003c/i\u003e Literalmente «me entiendo con ella».\u003cbr/\u003e• \u003cb\u003esich verlassen AUF\u003c/b\u003e + Akkusativ: \u003ci\u003eAuf Leo kann man sich verlassen.\u003c/i\u003e Ojo: \u003cb\u003everlassen\u003c/b\u003e solo, sin «sich» y sin «auf», significa lo contrario — abandonar (\u003ci\u003eEr hat mich verlassen\u003c/i\u003e).\u003cbr/\u003e• \u003cb\u003evertrauen\u003c/b\u003e + Dativ, \u003cb\u003esin preposición\u003c/b\u003e: \u003ci\u003eIch vertraue [[dir|te]].\u003c/i\u003e El español dice «confío EN ti» y por eso sale el calco *«ich vertraue in dich».\u003cbr/\u003e\u003cbr/\u003eY la trampa del tiempo verbal (§6.8): «nos conocemos \u003cb\u003edesde hace\u003c/b\u003e cinco años» sigue siendo verdad ahora, así que el alemán usa \u003cb\u003epresente\u003c/b\u003e: \u003ci\u003eWir kennen uns \u003cb\u003eseit\u003c/b\u003e fünf Jahren.\u003c/i\u003e Decir *«Wir haben uns seit fünf Jahren gekannt» significaría que ya no os conocéis.\",\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"vor fünf Jahren\",\"pastExample\":\"Wir haben uns in Wien kennengelernt.\",\"nowLabel\":\"seit fünf Jahren (¡presente!)\",\"nowExample\":\"Wir kennen uns seit fünf Jahren.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l1e1\",\"type\":\"match\",\"prompt\":\"Empareja los bloques de la amistad\",\"pairs\":[{\"target\":\"sich gut mit jemandem verstehen\",\"source\":\"llevarse bien con alguien\"},{\"target\":\"sich auf jemanden verlassen\",\"source\":\"contar con alguien\"},{\"target\":\"jemandem vertrauen\",\"source\":\"confiar en alguien\"},{\"target\":\"verlässlich sein\",\"source\":\"ser de fiar\"}],\"itemIds\":[\"b1m10sichverstehenmit\",\"b1m10sichverlassenauf\",\"b1m10jemandemvertrauen\",\"b1m10verlaesslich\"]},{\"id\":\"b1m10l1e2\",\"type\":\"mc\",\"prompt\":\"El tiempo verbal de «desde hace»\",\"question\":\"«Nos conocemos desde hace cinco años» →\",\"options\":[\"Wir kennen uns seit fünf Jahren\",\"Wir haben uns seit fünf Jahren gekannt\",\"Wir kannten uns fünf Jahre\"],\"answer\":0,\"whyWrong\":[null,\"El Perfekt cierra la acción: sonaría a que ya no os conocéis\",\"El Präteritum lo pone entero en el pasado\"],\"itemIds\":[\"b1m10seitfuenfjahren\"],\"tip\":\"Regla de oro: si la situación sigue siendo verdad hoy, seit va con presente. (Para hechos ya cerrados DENTRO de ese periodo sí se usa el Perfekt: «Seit dem Streit haben wir uns dreimal gesehen».)\"},{\"id\":\"b1m10l1e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco de «confío en ti»\",\"wrong\":\"Ich vertraue in dich vollkommen.\",\"answers\":[\"Ich vertraue dir vollkommen.\"],\"why\":\"vertrauen rige DATIVO y sin preposición cuando confías en una persona: ich vertraue dir / ihm / meiner Freundin. El «en» del español no se traduce con «in». (Existe «vertrauen AUF» + Akkusativ — «Ich vertraue auf mein Glück» —, pero es confiar en que algo salga bien, no fiarse de alguien.)\",\"translation\":\"Confío plenamente en ti.\",\"itemIds\":[\"b1m10jemandemvertrauen\"]},{\"id\":\"b1m10l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"Auf Leo kann man sich immer ___.\",\"answers\":[\"verlassen\"],\"translation\":\"Con Leo siempre se puede contar.\",\"hints\":[\"sich v-e-r-l-a-s-s-e-n auf + Akkusativ\",\"ver…\"],\"itemIds\":[\"b1m10sichverlassenauf\"]},{\"id\":\"b1m10l1e5\",\"type\":\"gapbank\",\"prompt\":\"Rellena el retrato de una amistad\",\"text\":\"Anna und ich kennen uns ___ fünf Jahren. Ich verstehe mich sehr gut ___ ihr, weil sie ___ ist: Sie hört zu und ___ sich sofort, wenn ich sie brauche.\",\"answers\":[\"seit\",\"mit\",\"verlässlich\",\"meldet\"],\"bank\":[\"seit\",\"mit\",\"verlässlich\",\"meldet\",\"für\",\"auf\",\"verlassen\",\"melden\"],\"translation\":\"Anna y yo nos conocemos desde hace cinco años. Me llevo muy bien con ella porque es de fiar: escucha y da señales enseguida cuando la necesito.\",\"hints\":[\"s-e-i-t + presente\",\"sich verstehen M-I-T + Dativ\"],\"itemIds\":[\"b1
