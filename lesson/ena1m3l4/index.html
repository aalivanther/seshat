",\"$L16\",null,{\"lesson\":{\"id\":\"ena1m3l4\",\"phaseId\":\"ena1m3\",\"title\":\"I'm Colombian\",\"subtitle\":\"Nacionalidades — mayúscula siempre, país o nacionalidad\",\"minutes\":9,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las nacionalidades del curso\",\"itemIds\":[\"enspanish\",\"encolombian\",\"enbritish\",\"enmexican\",\"enamerican\",\"enareyouspanish\"]},{\"kind\":\"note\",\"note\":{\"title\":\"País o nacionalidad — y las dos con mayúscula\",\"body\":\"La nacionalidad es un adjetivo y va con BE: [[I'm Colombian.|Soy colombiana.]] · [[He's British.|Él es británico.]] TRAMPA doble para hispanohablantes: (1) en español «español» va en minúscula; en inglés \u003cb\u003eSpanish, British, Mexican llevan mayúscula SIEMPRE\u003c/b\u003e — escribir «spanish» es error de examen; (2) no confundas país y nacionalidad: I'm from Spain = I'm \u003cb\u003eSpanish\u003c/b\u003e (nunca «I'm Spain»).\",\"table\":[[\"país\",\"nacionalidad\"],[\"Spain\",\"Spanish\"],[\"Colombia\",\"Colombian\"],[\"Mexico\",\"Mexican\"],[\"the UK\",\"British\"],[\"the US\",\"American\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m3l4e1\",\"type\":\"mc\",\"prompt\":\"País o nacionalidad\",\"question\":\"Valeria es de Colombia. Valeria is …\",\"options\":[\"Colombian\",\"Colombia\",\"colombian\"],\"answer\":0,\"whyWrong\":[null,\"Colombia es el país — con BE va la nacionalidad: Colombian\",\"En inglés las nacionalidades van SIEMPRE con mayúscula\"],\"itemIds\":[\"encolombian\"]},{\"id\":\"ena1m3l4e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿país o nacionalidad?\",\"categories\":[\"país\",\"nacionalidad\"],\"items\":[{\"text\":\"Spain\",\"bucket\":0},{\"text\":\"Spanish\",\"bucket\":1},{\"text\":\"Colombian\",\"bucket\":1},{\"text\":\"Mexico\",\"bucket\":0},{\"text\":\"British\",\"bucket\":1},{\"text\":\"Colombia\",\"bucket\":0},{\"text\":\"Mexican\",\"bucket\":1},{\"text\":\"the UK\",\"bucket\":0}],\"itemIds\":[\"enspain\",\"enspanish\",\"encolombian\",\"enmexic mbia, así que es colombiana. Amy es del Reino Unido, así que es británica. En la clase de Valeria hay un hombre de México: es mexicano. Y dos mujeres de Estados Unidos: son estadounidenses.\",\"hints\":[\"Antes del hueco está el país: el hueco pide la NACIONALIDAD\",\"Mexico y Spain son países: con be no encajan\"],\"itemIds\":[\"encolombian\",\"enbritish\",\"enmexican\",\"enamerican\"],\"tip\":\"Mexico y Spain se quedan fuera a propósito: from pide país, pero be a secas pide nacionalidad. Ese es todo el examen de esta lección.\"},{\"id\":\"ena1m3l4e7\",\"type\":\"speak\",\"prompt\":\"Lee en voz alta — S líquida dos veces\",\"text\":\"I'm Spanish. I'm from Spain.\",\"phonetic\":\"áim SPÁ-nish. áim from spéin\",\"translation\":\"Soy español. Soy de España.\",\"itemIds\":[\"enspanish\",\"enspain\"]},{\"id\":\"ena1m3l4e12\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco — hay UN solo error\",\"wrong\":\"My flatmate is a British.\",\"answers\":[\"My flatmate is British.\"],\"why\":\"Con be, la nacionalidad va sola: se ES británico, no «un británico». El artículo del español aquí sobra.\",\"translation\":\"Mi compañera de piso es británica.\",\"hints\":[\"Sobra una palabra pequeña\",\"is British\"],\"itemIds\":[\"enbritish\",\"enflatmate\"],\"tip\":\"I'm Colombian, she's British, he's Mexican: nacionalidad pelada, sin a y con mayúscula.\"},{\"id\":\"ena1m3l4e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Soy británico\",\"answers\":[\"I'm British\",\"I am British\",\"I'm British.\"],\"hints\":[\"Nacionalidad con BE y mayúscula\",\"I'm B...\"],\"itemIds\":[\"enbritish\"]},{\"id\":\"ena1m3l4e9\",\"type\":\"audiomc\",\"prompt\":\"Solo con el oído: ¿qué es Amy?\",\"audio\":\"Amy isn't from the US. She's from the UK.\",\"question\":\"¿Qué es Amy?\",\"options\":[\"Británica\",\"Estadounidense\",\"Mexicana\"],\"answer\":0,\"whyWrong\":[null,\"the US suena en el audio — pero con isn't delante: NO es de allí\",\"Mexico no se menciona\"],\"itemIds\":[\"enbritish\",\"enamerican\",\"entheus\",\"entheuk\"],\"tip\":\"El isn't lo cambia todo: caza la negación ANTES de decidir. El examen adora esta trampa.\"},{\"id\":\"ena1m3l4e10\",\"type\":\"transform\",\"prompt\":\"Vacuna: país no es nacionalidad\",\"source\":\"She is Spain.\",\"instruction\":\"Corrígela — con BE va la nacionalidad\",\"answers\":[\"She is Spanish.\",\"She's Spanish.\",\"She is Spanish\",\"She's Spanish\"],\"translation\":\"Ella es española.\",\"hints\":[\"Spain es el país; con BE va el adjetivo\",\"She's Spa...\"],\"itemIds\":[\"enspanish\",\"enspain\"],\"tip\":\"I'm from Spain (país) pero I'm Spanish (nacionalidad): from pide país, BE a secas pide adjetivo.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m3-1\",\"book\":\"You're Spanish, aren't you?\",\"real\":\"You're Spanish, innit?\",\"meaning\":\"«Eres español, ¿verdad?» — coletilla para pedir confirmación\",\"when\":\"La oirás por todo Londres, sobre todo entre gente joven, pegada a cualquier frase. No la uses tú: en el examen y con desconocidos suena fuera de lugar; para confirmar en neutro vale «right?».\",\"register\":\"regional\",\"note\":\"innit nace de «isn't it» fundido — y el habla joven de Londres lo pega a todo\",\"sound\":\"Í-nit\",\"level\":\"a1\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Ale
