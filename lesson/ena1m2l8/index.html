\u003cbr/\u003e«This is my mum, Diane — she's very funny. This is my dad, Peter. He's very tall. And the young woman? She's not my sister — she's my aunt Sue! The two children are Tom and May.»\u003cbr/\u003e\u003cbr/\u003eY debajo, el comentario de un [[friend|amigo]]: «Nice photo! Your family is [[lovely|encantadora]]! — Ben»\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m2l8e1\",\"type\":\"mc\",\"prompt\":\"El post, dato 1\",\"question\":\"¿Quién es Sue?\",\"options\":[\"La tía de Amy\",\"La hermana de Amy\",\"La madre de Amy\"],\"answer\":0,\"whyWrong\":[null,\"sister suena en el texto — pero con not delante: she's NOT my sister\",\"Su madre es Diane\"],\"itemIds\":[\"enaunt\"],\"tip\":\"El Reading pone la palabra-cebo (sister) al lado de un not. Lee la frase entera, no la palabra suelta.\"},{\"id\":\"ena1m2l8e2\",\"type\":\"mc\",\"prompt\":\"El post, dato 2\",\"question\":\"¿Cómo es Peter?\",\"options\":[\"Muy alto\",\"Muy gracioso\",\"Joven\"],\"answer\":0,\"whyWrong\":[null,\"funny va con Diane, la madre\",\"young va con la mujer joven — que es Sue\"],\"itemIds\":[\"endad\",\"entall\"],\"tip\":\"Tres personas, tres adjetivos: la pregunta se responde cruzando QUIÉN con CUÁL, como en el examen.\"},{\"id\":\"ena1m2l8e3\",\"type\":\"mc\",\"prompt\":\"El cartel del museo\",\"question\":\"En la entrada: «FAMILY TICKET — 2 adults + 2 children». ¿Para cuántos niños vale?\",\"options\":[\"Dos\",\"Cuatro\",\"Uno\"],\"answer\":0,\"whyWrong\":[null,\"Cuatro son las personas en total — children son 2\",\"El cartel dice 2 children\"],\"itemIds\":[\"enchild\",\"entwo\"],\"tip\":\"adults = adultos. Los carteles del examen mezclan dos números para ver cuál lees de verdad.\"},{\"id\":\"ena1m2l8e4\",\"type\":\"match\",\"prompt\":\"Empareja las palabras del post\",\"pairs\":[{\"target\":\"photo\",\"source\":\"foto\"},{\"target\":\"friend\",\"source\":\"amigo\"},{\"target\":\"mum\",\"source\":\"mamá\"},{\"target\":\"dad\",\"source\":\"papá\"}],\"itemIds\":[\"enphoto\",\"enfriend\",\"enmum\",\"endad\"]},{\"id\":\"ena1m2l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa la línea del post\",\"text\":\"She's not my sister — she's my ___ Sue. (tía)\",\"answers\":[\"aunt\"],\"translation\":\"No es mi hermana: es mi tía Sue.\",\"hints\":[\"La u es muda: áant\",\"a-u-n-t\"],\"itemIds\":[\"enaunt\",\"ensister\"]},{\"id\":\"ena1m2l8e6\",\"type\":\"order\",\"prompt\":\"Ordena el pie de foto\",\"sentences\":[\"This is my mum, Diane.\",\"She's very funny.\",\"This is my dad, Peter.\",\"He's very tall.\"],\"translation\":\"Esta es mi madre, Diane. Es muy graciosa. Este es mi padre, Peter. Es muy alto.\",\"hints\":[\"Se presenta y LUEGO se describe — dos veces\",\"she va tras Diane; he, tras Peter\"],\"itemIds\":[\"enthisismy\",\"enmum\",\"endad\",\"enfunny\",\"entall\"],\"tip\":\"Presento → describo: el patrón de todo pie de foto. Y cada descripción con su sujeto puesto.\"},{\"id\":\"ena1m2l8e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"This is a photo of my family.\",\"translation\":\"Esta es una foto de mi familia.\",\"hints\":[\"La fórmula + photo con f\",\"This is a photo of ...\"],\"itemIds\":[\"enphoto\",\"enfamily\"]},{\"id\":\"ena1m2l8e10\",\"type\":\"read\",\"prompt\":\"Lee el post de Valeria y responde — no hace falta entender cada palabra\",\"title\":\"My family in Bogotá\",\"source\":\"Post de Valeria, con la foto de su familia\",\"text\":\"My family is big! This is a photo from Bogotá.\u003cbr/\u003e\u003cbr/\u003eThe tall man in the middle is my father. He's very funny. Next to him is his wife, my mother Rosa. She's very nice.\u003cbr/\u003e\u003cbr/\u003eThe young woman on the left is my sister. Her husband is a [[teacher|profesor]], and these are their two children: a boy and a [[baby|bebé]] girl.\u003cbr/\u003e\u003cbr/\u003eMy brother Andrés is not in the photo. He's a [[student|estudiante]] and he's always with his [[friends|amigos]]!\u003cbr/\u003e\u003cbr/\u003eThe old man and the old woman are my [[
