",\"subtitle\":\"El contraste que no es un but: una subordinada, dos lecturas de la misma calle\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Contraste de B2, no de B1\",\"itemIds\":[\"enb2m8whereas\",\"enb2m8bycontrast\",\"enb2m8evenif\",\"enb2m8exceptthat\",\"enb2m8once\",\"enb2m8natthenagain\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: whereas no es however, y even if no es even though\",\"body\":\"El B1 te dejó \u003ci\u003ealthough, even though, however, on the other hand\u003c/i\u003e. Hoy entran los que el EVP colocó en B2 y el curso respetó: \u003cb\u003ewhereas\u003c/b\u003e es el primero.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eWhereas\u003c/b\u003e + frase = contraste de dos hechos, a menudo en la misma oración. No lleva but detrás. ❌ \u003ci\u003eWhereas X, but Y\u003c/i\u003e. Es el conector del ensayo: pone las dos caras en una línea.\u003cbr/\u003e\u003cb\u003eBy contrast\u003c/b\u003e abre frase, con coma. Prima formal de on the other hand.\u003cbr/\u003e\u003cb\u003eEven if\u003c/b\u003e = aunque + hipótesis (puede que no pase). \u003cb\u003eEven though\u003c/b\u003e (B1) = aunque + hecho (sí pasa). El español «aunque» no avisa.\u003cbr/\u003e\u003cb\u003eExcept that\u003c/b\u003e = salvo que + frase. Except + nombre ya lo puedes tener; except that abre una cláusula.\u003cbr/\u003e\u003cb\u003eOnce\u003c/b\u003e + presente = en cuanto. No es «una vez». \u003ci\u003eOnce the lane is in…\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eThen again es la calle de on the other hand. En un ensayo, whereas / by contrast.\",\"table\":[[\"Conector\",\"Oficio\",\"No lo confundas con\"],[\"whereas + frase\",\"dos hechos en contraste\",\"however (adv, otra frase)\"],[\"even if\",\"aunque + hipótesis\",\"even though (hecho)\"],[\"except that\",\"salvo que + frase\",\"except + nombre\"],[\"once + presente\",\"en cuanto\",\"one time\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m8l1e1\",\"type\":\"match\",\"prompt\":\"Empareja el contraste con su oficio\",\"pairs\":[{\"target\":\"Whereas the lane would cut cars, it would also slow the buses.\",\"source\":\"dos hechos, una oración\"},{\"target\":\"By contrast, the side streets are already full.\",\"source\":\"abre frase, contraste formal\"},{\"target\":\"Even if the lane is built, the buses still have to turn.\",\"source\":\"aunque + hipótesis\"},{\"target\":\"The plan is sound, except that nobody has counted the buses.\",\"source\":\"salvo que + frase\"},{\"target\":\"Once the lane is in, you cannot put the parking back overnight.\",\"source\":\"en cuanto: ya no hay vuelta\"}],\"itemIds\":[\"enb2m8whereas\",\"enb2m8bycontrast\",\"enb2m8evenif\",\"enb2m8exceptthat\",\"enb2m8once\"],\"tip\":\"Cinco contrastes, cinco oficios. But haría el trabajo de todos y te dejaría en B1.\"},{\"id\":\"enb2m8l1e2\",\"type\":\"mc\",\"prompt\":\"Even if no es even though\",\"question\":\"«Aunque se construya el carril, los autobuses siguen teniendo que girar» (puede que no se construya) →\",\"options\":[\"Even if the lane is built, the buses still have to turn.\",\"Even though the lane is built, the buses still have to turn.\",\"Whereas the lane is built, the buses still have to turn.\"],\"answer\":0,\"whyWrong\":[null,\"Even though da por hecho que el carril YA está. El español «aunque» no avisa.\",\"Whereas contrasta dos hechos en paralelo, no una hipótesis.\"],\"itemIds\":[\"enb2m8evenif\",\"enb1m8eventhough\",\"enb2m8whereas\"],\"tip\":\"If = aún no es un hecho. Though = ya lo es. Una letra, un mundo.\"},{\"id\":\"enb2m8l1e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Whereas the lane would cut cars but it would also slow the buses.\",\"answers\":[\"Whereas the lane would cut cars, it would also slow the buses.\"],\"why\":\"Whereas ya es el contraste: no se le añade but. Es el mismo error que even though + but, un peldaño más formal.\",\"translation\":\"Mientras que el carril reduciría los coches, también retrasaría los autobuses.\",\"itemIds\":[\"enb2m8whereas\"]},{\"id\":\"enb2m8l1e4\",\"type\":\"transform\",\"prompt\":\"De however a whereas: una sola oración\",\"source\":\"The lane would cut cars. However, it would also slow the buses.\",\"instruction\":\"Únelas con whereas\",\"answers\":[\"Whereas the lane would cut cars, it would also slow the buses\",\"The lane would cut cars, whereas it would also slow the buses\"],\"translation\":\"Mientras que el carril reduciría los coches, también retrasaría los autobuses.\",\"hints\":[\"Whereas + frase, coma, frase\",\"Whereas the lane would cut cars, it would also ...\"],\"itemIds\":[\"enb2m8whereas\",\"enb1m8however\"],\"tip\":\"However necesita dos frases. Whereas las mete en una. Eso es exactamente «oración con más de una subordinada», el objetivo del handbook.\"},{\"id\":\"enb2m8l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el «en cuanto»\",\"text\":\"___ the lane is in, you cannot put the parking back overnight.\",\"answers\":[\"Once\"],\"translation\":\"En cuanto el carril esté, no se puede devolver el aparcamiento de un día para otro.\",\"hints\":[\"Cuatro letras, no es «one time»\",\"On...\"],\"itemIds\":[\"enb2m8once\",\"enb2m8parking\"],\"tip\":\"Once + presente, no futuro: once it is in, no once it will be. El español «en cuanto esté» empuja al subjuntivo; el inglés, al presente.\"},{\"id\":\"enb2m8l1e6\",\"type\":\"bucket\",\"prompt\":\"¿Hecho o hipótesis?\",\"categories\":[\"HECHO — even though / whereas / except that\",\"HIPÓTESIS — even if / once (aún no)\"],\"items\":[{\"text\":\"Even though it costs more, I buy the local one.\",\"bucket\":0},{\"text\":\"Whereas the lane would cut cars, it would also slow the buses.\",\"bucket\":0},{\"text\":\"The plan is sound, except that nobody has counted the buses.\",\"bucket\":0},{\"text\":\"Even if the lane is built, the buses still have to turn.\",\"bucket\":1},{\"text\":\"Once the lane is in, you cannot put the parking back.\",\"bucket\":1},{\"text\":\"If the council votes no, the air stays as it is.\",\"bucket\":1}],\"itemIds\":[\"enb1m8eventhough\",\"enb2m8whereas\",\"enb2m8exceptthat\",\"enb2m8evenif\",\"enb2m8once\"],\"tip\":\"Once está en hipótesis porque el carril aún no está. El presente es de calendario, no de hecho cumplido.\"},{\"id\":\"enb2m8l1e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — una oración\",\"source\":\"Mientras que el carril reduciría los coches, también retrasaría los autobuses.\",\"answers\":[\"Whereas the lane would cut cars, it would also slow the buses\",\"The lane would cut cars, whereas it would also slow the buses\"],\"hint\":\"Empieza por Whereas\",\"itemIds\":[\"enb2m8whereas\",\"enb2m8abikelane\"],\"tip\":\"Mientras que, en español de contraste, no es while de tiempo. Whereas no tiene la ambigüedad. Por eso es el del ensayo.\"},{\"id\":\"enb2m8l1e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"On the other hand, the air is worse than it was.\",\"real\":\"Then again, the air is worse than it was.\",\"translation\":\"Por otro lado / pensándolo bien, el aire está peor que antes.\",\"itemIds\":[\"enb2m8natthenagain\",\"enb1m4ontheotherhand\"],\"tip\":\"Then again es la concesión de café. Whereas no cabe en un café, y then again no cabe en un ensayo. Las tres alturas de la píldora de hoy.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m8-1\",\"book\":\"On the other hand\",\"real\":\"Then again\",\"meaning\":\"Por otro lado / pensándolo bien\",\"when\":\"Con amigos, al girar un argumento sin montar una subordinada. En el ensayo y en el Writing, la misma vuelta se dice «Whereas» o «By contrast». Then again en un informe es registro de menos.\",\"register\":\"amigos\",\"exam\":\"Whereas / By contrast\",\"note\":\"On the other hand es B1 y sigue valiendo. Whereas es el que el EVP marcó como B2 y el curso no te dio hasta hoy.\",\"sound\":\"den a-GHÉN\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m8natthenagain\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
