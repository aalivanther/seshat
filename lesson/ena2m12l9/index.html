ic/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T503,Se dijo en la primera lección y se repite aquí porque el día del examen es cuando importa: \u003cb\u003epast continuous\u003c/b\u003e (m3), \u003cb\u003eshould\u003c/b\u003e (m8), \u003cb\u003epresent perfect\u003c/b\u003e (m10) y \u003cb\u003ewill\u003c/b\u003e con el \u003cb\u003eprimer condicional\u003c/b\u003e (m11) están en la columna B1 del syllabus. No entran.\u003cbr/\u003e\u003cbr/\u003eTraducido a lo que se hace con las manos el 14 de junio:\u003cbr/\u003e· Si dudas entre \u003ci\u003eI have finished\u003c/i\u003e y \u003ci\u003eI finished\u003c/i\u003e → escribe \u003cb\u003eI finished\u003c/b\u003e.\u003cbr/\u003e· Si dudas entre \u003ci\u003eYou should rest\u003c/i\u003e y \u003ci\u003eWhy don't you rest?\u003c/i\u003e → escribe \u003cb\u003eWhy don't you rest?\u003c/b\u003e.\u003cbr/\u003e· Si dudas entre \u003ci\u003eI'll call you\u003c/i\u003e y \u003ci\u003eI'm going to call you\u003c/i\u003e → escribe \u003cb\u003eI'm going to call you\u003c/b\u003e.\u003cbr/\u003e· Si dudas entre \u003ci\u003eI was waiting\u003c/i\u003e y \u003ci\u003eI waited\u003c/i\u003e → escribe \u003cb\u003eI waited\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eNada de esto significa que sobre lo que aprendiste. En el Listening y en el Reading esas formas aparecen igual —los textos los escriben ingleses, no el syllabus— y reconocerlas es lo que evita quedarse en blanco. Lo que no se hace es \u003cb\u003eproducir\u003c/b\u003e lo que no te van a puntuar cuando tienes al lado una forma del A2 que dice lo mismo y que sí puntúa. Y en septiembre, cuando esto ya esté aprobado, esas cuatro estructuras son la primera lección del B1: no las has aprendido de más, las has aprendido de antes."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l9\",\"phaseId\":\"ena2m12\",\"title\":\"Strategy, and the whole A2 in one lesson\",\"subtitle\":\"El reloj, la frontera otra vez, y un ejercicio por cada módulo del nivel\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas tres frases del nivel\",\"itemIds\":[\"ena2m12tosumup\",\"ena2m12theexamcentre\",\"ena2m12thankyouforeverything\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El reloj: 1 h 20 sin pausa y sin avisos\",\"body\":\"El Listening viene con su propio ritmo: no hay nada que repartir, la grabación manda. El problema es el segundo bloque: \u003cb\u003eReading y Writing juntos, 1 h 20, sin descanso y sin que nadie te avise de nada\u003c/b\u003e. El fallo típico no es no saber: es llegar al Writing con doce minutos.\u003cbr/\u003e\u003cbr/\u003eReparto que funciona, y que conviene ensayar con reloj antes de junio: \u003cb\u003e45 minutos de Reading\u003c/b\u003e (unos 11 por tarea), \u003cb\u003e30 de Writing\u003c/b\u003e (15 por texto) y \u003cb\u003e5 de repaso\u003c/b\u003e. Y una regla que salva más puntos que cualquier truco de gramática: \u003cb\u003eescribe el Writing antes de terminar de rumiar el Reading\u003c/b\u003e. Una pregunta de opción múltiple dudosa vale una marca; un texto sin escribir vale doce.\u003cbr/\u003e\u003cbr/\u003eSi una pregunta te atasca, márcala y sigue: en el Reading todas las preguntas valen lo mismo, así que quedarse tres minutos en una es pagarla al triple.\",\"table\":[[\"Bloque\",\"Minutos\",\"Qué NO hacer\"],[\"Reading, 4 tareas\",\"45\",\"quedarse clavado en una pregunta\"],[\"Writing 1 (informal)\",\"15\",\"contestar solo dos de las tres preguntas\"],[\"Writing 2 (formal)\",\"15\",\"empezar con Hi y acabar con Love\"],[\"Repaso final\",\"5\",\"escribir más texto en vez de repasar\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"La frontera, otra vez — ahora como instrucción de examen\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l9e1\",\"type\":\"mc\",\"prompt\":\"El reloj del segundo bloque\",\"question\":\"Tienes 1 h 20 para Reading y Writing. ¿Cómo lo repartes?\",\"options\":[\"45 de Reading, 30 de Writing y 5 de repaso\",\"60 de Reading y 20 de Writing: el Reading tiene más preguntas\",\"40 y 40, que es lo justo\"],\"answer\":0,\"whyWrong\":[null,\"Con 20 minutos no salen dos textos de 50 palabras: son 24 marcas jugándose a lo loco\",\"El Writing necesita menos que el Reading, pero necesita terminar: 30 es el mínimo cómodo\"],\"itemIds\":[\"encountyourwords\",\"ena2m12checkyouranswers\"],\"tip\":\"Ensaya el reparto en casa con reloj DOS veces antes del examen. Es el entrenamiento que más nota mueve por minuto invertido.\"},{\"id\":\"ena2m12l9e2\",\"type\":\"cloze\",\"prompt\":\"Espiral, módulo 1: el pasado regular y el it que no se cae\",\"text\":\"___ rained all day, so we stayed at home.\",\"answers\":[\"It\"],\"translation\":\"Llovió todo el día, así que nos quedamos en casa.\",\"hints\":[\"En inglés el tiempo atmosférico necesita sujeto\",\"___ rained…\"],\"itemIds\":[\"ena2m1itrained\",\"ena2m1istayedathome\"],\"tip\":\"«Llovió» en inglés no existe sin sujeto: It rained. El pro-drop español es el error nº 2 del nivel y se cuela justo en el Writing.\"},{\"id\":\"ena2m12l9e3\",\"type\":\"transform\",\"prompt\":\"Espiral, módulo 2: ponlo en pasado\",\"source\":\"I go to the cinema and I see Amy there.\",\"instruction\":\"Cuéntalo como algo que pasó el sábado\",\"answers\":[\"I went to the cinema and I saw Amy there.\",\"I went to the cinema and saw Amy there.\"],\"translation\":\"Fui al cine y vi allí a Amy.\",\"hints\":[\"go → went, see → …\",\"I went… and I saw…\"],\"itemIds\":[\"ena2m2iwenttothecinema\",\"ena2m2isawamyyesterday\"],\"tip\":\"Los irregulares son la mitad de los verbos que vas a usar en el examen. Si dudas de uno, cambia de verbo: eso también es estrategia.\"},{\"id\":\"ena2m12l9e4\",\"type\":\"mc\",\"prompt\":\"Espiral, módulo 3: dónde va el adverbio\",\"question\":\"¿Cuál está bien?\",\"options\":[\"She speaks English very well.\",\"She speaks very well English.\",\"She very well speaks English.\"],\"answer\":0,\"whyWrong\":[null,\"El inglés no separa el verbo de su objeto: English va pegado a speaks\",\"El adverbio de modo no se pone delante del verbo\"],\"itemIds\":[\"ena2m3shespeaksenglishverywell\",\"ena2m3well\"],\"tip\":\"Verbo + objeto + adverbio. Esta es la trampa de colocación que más cae en la Tarea 1 del Reading.\"},{\"id\":\"ena2m12l9e5\",\"type\":\"cloze\",\"prompt\":\"Espiral, módulo 4: el superlativo\",\"text\":\"It's the ___ coffee in London, and it costs two pounds.\",\"answers\":[\"best\"],\"translation\":\"Es el mejor café de Londres, y cuesta dos libras.\",\"hints\":[\"good → better → …\",\"the b…\"],\"itemIds\":[\"ena2m4thebestcoffee\",\"ena2m4goodbetterbest\"],\"tip\":\"good/better/best y bad/worse/worst caen en el oral cada vez que comparas dos imágenes. Que salgan sin pensar.\"},{\"id\":\"ena2m12l9e6\",\"type\":\"mc\",\"prompt\":\"Espiral, módulo 5: contable o incontable\",\"question\":\"¿Cuál está bien?\",\"options\":[\"How much sugar do you take?\",\"How many sugar do you take?\",\"How much sugars do you take?\"],\"answer\":0,\"whyWrong\":[null,\"many va con plurales contables: how many spoons\",\"sugar no tiene plural cuando hablas de la sustancia\"],\"itemIds\":[\"ena2m5howmuchsugar\",\"ena2m5howmanypeoplearethere\"],\"tip\":\"much + incontable, many + contable plural. Y la lista negra de siempre: information, advice, news, luggage, homework, furniture.\"},{\"id\":\"ena2m12l9e7\",\"type\":\"cloze\",\"prompt\":\"Espiral, módulo 6: el futuro que sí entra\",\"text\":\"Next month I'm ___ to take the A2 exam in London.\",\"answers\":[\"going\"],\"translation\":\"El mes que viene voy a hacer el examen de A2 en Londres.\",\"hints\":[\"El futuro de intención del A2\",\"I'm go… to\"],\"itemIds\":[\"ena2m6imgoingtobook\",\"ena2m12theexamcentre\"],\"tip\":\"be going to es EL futuro del A2. Si en el examen te sale un will, no pasa nada: pero going to es el que te puntúan seguro.\"},{\"id\":\"ena2m12l9e8\",\"type\":\"mc\",\"prompt\":\"Espiral, módulo 7: la pareja que más se confunde\",\"question\":\"En la puerta pone: «You don't have to pay to enter.» ¿Qué significa?\",\"options\":[\"Entrar es gratis: pagar no es obligatorio\",\"Está prohibido pagar\",\"Hay que pagar antes de entrar\"],\"answer\":0,\"whyWrong\":[null,\"Lo prohibido se dice con mustn't: You mustn't pay\",\"La obligación sería You have to pay\"],\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7youmustntsmoke\"],\"tip\":\"mustn't = prohibido · don't have to = no hace falta. Se parecen en español y no se parecen en nada en inglés.\"},{\"id\":\"ena2m12l9e9\",\"type\":\"transform\",\"prompt\":\"Espiral, módulo 8: el consejo que sí es de A2\",\"source\":\"You should go home and rest.\",\"instruction\":\"Dilo sin should — con la fórmula del A2\",\"answers\":[\"Why don't you go home and rest?\",\"Why not go home and rest?\",\"You need to go home and rest.\"],\"translation\":\"¿Por qué no te vas a casa y descansas?\",\"hints\":[\"Empieza por una pregunta\",\"Why don't you…?\"],\"itemIds\":[\"ena2m8whydontyougohome\",\"ena2m8youneedtoseeadoctor\"],\"tip\":\"Este es el ejercicio de la frontera hecho hábito: la misma idea, con la herramienta que sí entra en el examen.\"},{\"id\":\"ena2m12l9e10\",\"type\":\"errorfix\",\"prompt\":\"Espiral, módulo 9: el pronombre de objeto\",\"wrong\":\"I saw she this morning at the bus stop.\",\"answers\":[\"I saw her this morning at the bus stop.\",\"I saw her this morning at the bus stop\"],\"why\":\"she es el sujeto (she works) y her el objeto (I saw her). El español los distingue igual («ella» / «la»), pero al hablar rápido se coge el primero que viene, y en el Writing se ve a la legua.\",\"translation\":\"La vi esta mañana en la parada del autobús.\",\"hints\":[\"Detrás del verbo va el pronombre de objeto\",\"I saw ___ this morning…\"],\"itemIds\":[\"ena2m9isawherthismorning\",\"ena2m9objectgroup\"]},{\"id\":\"ena2m12l9e11\",\"type\":\"bucket\",\"prompt\":\"Última pasada por la frontera: ¿lo escribo o lo cambio?\",\"categories\":[\"Lo escribo (A2, puntúa)\",\"Lo cambio por otra cosa (B1)\"],\"items\":[{\"text\":\"I finished my homework.\",\"bucket\":0},{\"text\":\"I've already finished my homework.\",\"bucket\":1},{\"text\":\"Why don't you take a day off?\",\"bucket\":0},{\"text\":\"You should take a day off.\",\"bucket\":1},{\"text\":\"I'm going to call you tomorrow.\",\"bucket\":0},{\"text\":\"I'll call you tomorrow.\",\"bucket\":1},{\"text\":\"It rained and we stayed at home.\",\"bucket\":0},{\"text\":\"It was raining, so we stayed at home.\",\"bucket\":1}],\"itemIds\":[\"ena2m10ivealreadyseenit\",\"ena2m8whydontyougohome\",\"ena2m6imgoingtobook\",\"ena2m3itwasrainingwhenileft\"],\"tip\":\"Las ocho frases son correctas en inglés. La columna de la derecha no está mal: está en el nivel siguiente. Guárdala para septiembre.\"},{\"id\":\"ena2m12l9e12\",\"type\":\"gapbank\",\"prompt\":\"El cierre del nivel: la nota de agradecimiento\",\"text\":\"Dear Miss Green, thank you for ___ this year. I am ___ to take the A2 exam in June at a centre in south London. Your classes ___ me a lot, and I am not nervous any more. To sum ___ : I arrived in London with ten words and now I can tell a story. Yours sincerely, Valeria\",\"answers\":[\"everything\",\"going\",\"helped\",\"up\"],\"bank\":[\"everything\",\"going\",\"helped\",\"up\",\"nothing\",\"asked\"],\"translation\":\"Estimada señorita Green: gracias por todo este año. Voy a presentarme al examen de A2 en junio, en un centro del sur de Londres. Sus clases me ayudaron mucho, y ya no estoy nerviosa. En resumen: llegué a Londres con diez palabras y ahora sé contar una historia. Atentamente, Valeria\",\"itemIds\":[\"ena2m12thankyouforeverything\",\"ena2m12tosumup\",\"ena2m12yourssincerely\",\"ena2m12theexamcentre\"],\"tip\":\"Fíjate en lo que hace esta nota: saludo formal, tres contenidos, un conector de resumen y una despedida que casa con el saludo. Es la Tarea 2 entera, escrita por gusto.\"},{\"id\":\"ena2m12l9e13\",\"type\":\"type\
