003cb\u003emonitor / check\u003c/b\u003e. *The office controls the hours suena a policía.\u003cbr/\u003e\u003cb\u003eimprove\u003c/b\u003e es el verbo que mata el rodeo \u003ci\u003emake the situation better\u003c/i\u003e. En B2 se prohíbe el rodeo para forzar esta palabra.\u003cbr/\u003e\u003cbr/\u003eY el circunloquio, que es la trampa nº 3 del nivel: no produce error, produce techo. El corrector automático lo da por bueno. El examinador le pone un 2 sobre 5 en Range.\",\"table\":[[\"Español\",\"Lo que escribes\",\"Lo que querías\"],[\"la agenda de citas\",\"agenda\",\"diary\"],[\"el orden del día\",\"diary\",\"agenda\"],[\"pretendo quedarme\",\"I pretend to stay\",\"I intend to stay\"],[\"avísame\",\"advise me\",\"notify me / let me know\"],[\"controlar las horas\",\"control the hours\",\"monitor / check the hours\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l5e1\",\"type\":\"bucket\",\"prompt\":\"¿diary o agenda?\",\"categories\":[\"diary — la de citas\",\"agenda — el orden del día\"],\"items\":[{\"text\":\"I'll put the meeting in my diary.\",\"bucket\":0},{\"text\":\"The first item on the agenda is pay.\",\"bucket\":1},{\"text\":\"Have you got your diary? I need a date.\",\"bucket\":0},{\"text\":\"What's on the agenda for Monday?\",\"bucket\":1},{\"text\":\"I've kept a diary since I arrived.\",\"bucket\":0},{\"text\":\"Nadia sent the agenda the night before.\",\"bucket\":1}],\"itemIds\":[\"enb2m2diary\",\"enb2m2agenda\"]},{\"id\":\"enb2m2l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I'll put the interview in my agenda.\",\"answers\":[\"I'll put the interview in my diary.\"],\"why\":\"Agenda es el orden del día. La de citas es diary. En una carta a Nadia, «agenda» para una fecha suena a que no has pisado una oficina británica.\",\"translation\":\"Apunto la entrevista en la agenda.\",\"itemIds\":[\"enb2m2diary\",\"enb2m2agenda\"]},{\"id\":\"enb2m2l5e3\",\"type\":\"errorfix\",\"prompt\":\"Otro falso amigo culto\",\"wrong\":\"I pretend to stay for a year.\",\"answers\":[\"I intend to stay for a year.\",\"I aim to stay for a year.\"],\"why\":\"Pretend es fingir. «Pretendo quedarme» es intend / aim to. El alumno culto los mezcla porque en español pretender no es fingir, y en inglés sí.\",\"translation\":\"Pretendo quedarme un año.\",\"itemIds\":[\"enb2m2intend\"]},{\"id\":\"enb2m2l5e4\",\"type\":\"errorfix\",\"prompt\":\"Avisar no es advise\",\"wrong\":\"Please advise us when you can start.\",\"answers\":[\"Please notify us when you can start.\",\"Please let us know when you can start.\"],\"why\":\"Advise es aconsejar. En una carta, «please advise» se ve (es jerga de oficina), pero lo que el alumno quiere decir con «avisar» es notify / let us know. En este curso, para avisar: notify. Para aconsejar: advise.\",\"translation\":\"Avísenos de cuándo puede empezar.\",\"itemIds\":[\"enb2m2notify\",\"enb2m2advise\"]},{\"id\":\"enb2m2l5e5\",\"type\":\"errorfix\",\"prompt\":\"Controlar las horas\",\"wrong\":\"The office controls working hours.\",\"answers\":[\"The office monitors working hours.\",\"The office checks working hours.\"],\"why\":\"Control es dominar. Una oficina que «controls working hours» suena a que manda sobre ellas como un régimen. Monitor / check es revisar.\",\"translation\":\"La oficina controla (revisa) las horas.\",\"itemIds\":[\"enb2m2monitor\"]},{\"id\":\"enb2m2l5e6\",\"type\":\"paraphrase\",\"prompt\":\"Prohíbe el rodeo: sin «make» ni «better»\",\"source\":\"This would make the situation better.\",\"forbid\":[\"make\",\"better\"],\"answers\":[\"This would improve the situation\",\"This would improve the situation.\",\"This would ease the situation\"],\"translation\":\"Esto mejoraría la situación.\",\"itemIds\":[\"enb2m2improve\",\"enb2m2ease\"],\"tip\":\"Ahí está el B2: se prohíbe el rodeo para forzar improve. En B1 se prohibía improve para forzar el rodeo. La lista de palabras vetadas se ha invertido.\"},{\"id\":\"enb2m2l5e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el recado de Nadia, sin calcos\",\"text\":\"Put the start date in your ___. I ___ to keep you on after probation. Please ___ us in writing if the Thursday hours change. The desk ___ hours; it does not police them. This should ___ the situation.\",\"answers\":[\"diary\",\"intend\",\"notify\",\"monitors\",\"improve\"],\"bank\":[\"diary\",\"intend\",\"notify\",\"monitors\",\"improve\",\"agenda\",\"control\"],\"translation\":\"Apunta la fecha de comienzo en tu agenda. Pretendo mantenerte después del periodo de prueba. Avísanos por escrito si cambian las horas del jueves. El mostrador revisa las horas; no las policía. Esto debería mejorar la situación.\",\"itemIds\":[\"enb2m2diary\",\"enb2m2intend\",\"enb2m2notify\",\"enb2m2monitor\",\"enb2m2improve\"]},{\"id\":\"enb2m2l5e8\",\"type\":\"mc\",\"prompt\":\"Advise o notify\",\"question\":\"Nadia writes: «She advised me to check the payslip.» ¿Qué hizo Nadia?\",\"options\":[\"Le aconsejó que revisara la nómina.\",\"Le avisó de que la nómina había llegado.\",\"Le fingió que la nómina estaba bien.\"],\"answer\":0,\"whyWrong\":[null,\"Avisar sería notified me that the payslip had arrived.\",\"Fingir sería pretended. Nadia no finge.\"],\"itemIds\":[\"enb2m2advise\"]},{\"id\":\"enb2m2l5e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — el verbo de aconsejar\",\"source\":\"Me aconsejó que revisara la nómina.\",\"answers\":[\"She advised me to check the payslip.\",\"She advised me to check the payslip\"],\"hint\":\"advise + objeto + to + infinitivo\",\"itemIds\":[\"enb2m2advise\",\"enb2m2payslip\"]},{\"id\":\"enb2m2l5e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Ahora avisar\",\"source\":\"Avísenos por escrito.\",\"answers\":[\"Please notify us in writing.\",\"Please let us know in writing.\"],\"itemIds\":[\"enb2m2notify\"]},{\"id\":\"enb2m2l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Pretendo quedarme un año. Lo apunto en la agenda.\",\"answers\":[\"I intend to stay for a year. I'll put it in my diary.\",\"I intend to stay for a year. I will put it in my diary.\"],\"itemIds\":[\"enb2m2intend\",\"enb2m2diary\"]},{\"id\":\"enb2m2l5e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: Sam, en el café, se lía con agenda. Pregunta antes del play. Dos escuchas.\",\"audio\":\"Priya put the Christmas rota on the agenda for Monday's meeting. That's the list of things we're going to talk about, not the book where I write my shifts. The book's my diary. I keep saying agenda for both and she looks at me as if I've never had a job.\",\"question\":\"¿Qué es, en boca de Sam, «the agenda»?\",\"options\":[\"El orden del día de la reunión del lunes\",\"El cuaderno donde apunta los turnos\",\"La carta de Nadia\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es the diary, y él mismo lo corrige.\",\"Nadia no sale en este audio.\"],\"itemIds\":[\"enb2m2agenda\",\"enb2m2diary\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-a
