 place \u003cb\u003ewhere\u003c/b\u003e I work\u003c/i\u003e · \u003ci\u003ethe day \u003cb\u003ewhen\u003c/b\u003e I got the job\u003c/i\u003e · \u003ci\u003ethe reason \u003cb\u003ewhy\u003c/b\u003e I left\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí vuelve el calco de ayer, disfrazado.\u003c/b\u003e En español decimos «el sitio donde trabajo \u003cu\u003een él\u003c/u\u003e» sin que nadie se escandalice, y «el día en que…». En inglés, \u003cb\u003ewhere ya significa «en el que»\u003c/b\u003e: si detrás pones otra preposición, sobra.\u003cbr/\u003e· \u003ci\u003ethe place where I work \u003cb\u003ein it\u003c/b\u003e\u003c/i\u003e ✗ → \u003ci\u003ethe place where I work\u003c/i\u003e ✓\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn regalo del inglés:\u003c/b\u003e con \u003ci\u003eday\u003c/i\u003e, \u003ci\u003etime\u003c/i\u003e, \u003ci\u003ereason\u003c/i\u003e y \u003ci\u003eplace\u003c/i\u003e, el relativo se puede \u003cb\u003equitar entero\u003c/b\u003e: \u003ci\u003ethe day I got the job\u003c/i\u003e, \u003ci\u003ethe reason I left\u003c/i\u003e. Suena más natural, y no es descuido: es lo que hace un nativo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn caso donde se prefiere «that»:\u003c/b\u003e detrás de \u003ci\u003ethe only\u003c/i\u003e, \u003ci\u003ethe first\u003c/i\u003e, \u003ci\u003ethe best\u003c/i\u003e, \u003ci\u003eeverything\u003c/i\u003e, \u003ci\u003esomething\u003c/i\u003e y \u003ci\u003enothing\u003c/i\u003e, cuando el hueco pide \u003ci\u003ewho\u003c/i\u003e o \u003ci\u003ewhich\u003c/i\u003e.\u003cbr/\u003e\u003ci\u003ethe only thing \u003cb\u003ethat\u003c/b\u003e matters\u003c/i\u003e — aquí «which» chirría. Pero si la frase pide \u003ci\u003ewhose\u003c/i\u003e, \u003ci\u003ewhere\u003c/i\u003e, \u003ci\u003ewhen\u003c/i\u003e o \u003ci\u003ewhy\u003c/i\u003e, esos no cambian: \u003ci\u003ethe only one \u003cb\u003ewhose\u003c/b\u003e contract doesn't say daytime\u003c/i\u003e, \u003ci\u003ethe only one \u003cb\u003ewhere\u003c/b\u003e they'll pay for the course\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m2l2\",\"phaseId\":\"enb1m2\",\"title\":\"Whose, where, when\",\"subtitle\":\"Los otros tres relativos — y el «en él» que sobra\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"De quién, dónde y cuándo\",\"itemIds\":[\"enb1m2whoseenglish\",\"enb1m2placewhereiwork\",\"enb1m2daywhen\",\"enb1m2reasonwhy\",\"enb1m2onlythingthat\",\"enb1m2nightshift\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: tres relativos más, y una trampa vieja\",\"body\":\"$17\",\"table\":[[\"Se refiere a…\",\"Relativo\",\"Ejemplo\"],[\"una persona\",\"who / that\",\"the colleague who sits next to me\"],[\"una cosa o un sitio\",\"which / that\",\"the café which opened in 2019\"],[\"algo DE alguien\",\"whose\",\"a colleague whose English is perfect\"],[\"un sitio (= en el que)\",\"where\",\"the place where I work\"],[\"un momento\",\"when\",\"the day when I got the job\"],[\"una razón\",\"why\",\"the reason why I left\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m2l2e1\",\"type\":\"match\",\"prompt\":\"Empareja\",\"pairs\":[{\"target\":\"a colleague whose English is perfect\",\"source\":\"una compañera cuyo inglés es perfecto\"},{\"target\":\"the place where I work\",\"source\":\"el sitio donde trabajo\"},{\"target\":\"the day when I got the job\",\"source\":\"el día en que conseguí el trabajo\"},{\"target\":\"the night shift\",\"source\":\"el turno de noche\"}],\"itemIds\":[\"enb1m2whoseenglish\",\"enb1m2placewhereiwork\",\"enb1m2daywhen\",\"enb1m2nightshift\"],\"tip\":\"«whose» suena exactamente igual que «who's». La diferencia está solo en el papel — y en el papel es donde te corrigen.\"},{\"id\":\"enb1m2l2e2\",\"type\":\"mc\",\"prompt\":\"Los dos que suenan igual\",\"question\":\"«una compañera cuyo inglés es perfecto» →\",\"options\":[\"a colleague whose English is perfect\",\"a colleague who's E rta es el cuadrante de turnos\"],\"itemIds\":[\"enb1m2onlythingthat\",\"enb1m2shiftpattern\"],\"tip\":\"Detrás de «the only», «the first» y «the best», cuando el hueco pide who o which, se prefiere «that» — casi nadie dice «which» ahí. Pero si la frase pide whose, where o why, esos se quedan igual: «the only one whose…», «the only one where…».\"},{\"id\":\"enb1m2l2e9\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"the day when I got the job\",\"translation\":\"el día en que conseguí el trabajo\",\"distractors\":[\"where\",\"who\"],\"itemIds\":[\"enb1m2daywhen\"],\"tip\":\"«where» es para sitios y «who» para personas: un día no es ninguna de las dos cosas.\"},{\"id\":\"enb1m2l2e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La razón por la que me fui era el turno de noche.\",\"answers\":[\"The reason why I left was the night shift\",\"The reason I left was the night shift\",\"The reason that I left was the night shift\"],\"hints\":[\"Empieza por «The reason…»\",\"The reason ... I left was the ...\"],\"itemIds\":[\"enb1m2reasonwhy\",\"enb1m2nightshift\"],\"tip\":\"Las tres valen. «The reason I left» es la que más se oye; «the reason why I left» es la que más se escribe.\"},{\"id\":\"enb1m2l2e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"That's the colleague whose English is perfect.\",\"translation\":\"Esa es la compañera cuyo inglés es perfecto.\",\"hints\":[\"Empieza por «That's…»\",\"That's the colleague ... English is perfect.\"],\"itemIds\":[\"enb1m2whoseenglish\",\"enb1m2colleague\"],\"tip\":\"Si escribes «who's» aquí, el dictado te lo da por malo con razón: se oye igual, pero solo una de las dos significa «cuyo».\"},{\"id\":\"enb1m2l2e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta\",\"text\":\"The place where I work is fine, but the only thing that matters now is the shift pattern.\",\"phonetic\":\"de pléis uéa ai ueek is̬ fain, bat di ÓUN-li zing dat MÁ-tas̬ nau is̬ de shift PÁ-ten
