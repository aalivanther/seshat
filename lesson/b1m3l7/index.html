\u003eIch muss mich krankmelden.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eDos notas de nivel: \u003cb\u003edie Beschwerden\u003c/b\u003e (siempre en plural) es la palabra técnica que usa el médico, más formal que \u003ci\u003eSchmerzen\u003c/i\u003e. Y en Austria y Suiza el hospital no es \u003ci\u003eKrankenhaus\u003c/i\u003e, sino \u003cb\u003edas Spital\u003c/b\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m3l7e1\",\"type\":\"match\",\"prompt\":\"Empareja las estaciones de la consulta\",\"pairs\":[{\"target\":\"einen Termin vereinbaren\",\"source\":\"concertar una cita\"},{\"target\":\"das Wartezimmer\",\"source\":\"la sala de espera\"},{\"target\":\"die Krankschreibung\",\"source\":\"el parte de baja\"},{\"target\":\"sich krankmelden\",\"source\":\"avisar de que estás de baja\"}],\"itemIds\":[\"b1m3einenterminvereinbaren\",\"b1m3daswartezimmer\",\"b1m3diekrankschreibung\",\"b1m3sichkrankmelden\"]},{\"id\":\"b1m3l7e2\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: mensaje de la consulta en el buzón de voz · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Marín, hier ist die Praxis Doktor Weber. Sie hatten wegen Ihrer Rückenschmerzen angerufen und einen Termin gewollt. Wir hätten Donnerstag um halb zehn frei, ähm, das ist der einzige Termin in dieser Woche. Bringen Sie bitte Ihre Versichertenkarte mit und kommen Sie zehn Minuten früher, wegen der Anmeldung. Wenn Donnerstag nicht geht, rufen Sie bitte heute noch zurück.\",\"question\":\"„Frau Marín soll zehn Minuten vor dem Termin da sein.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«kommen Sie zehn Minuten früher, wegen der Anmeldung»\"],\"itemIds\":[\"b1m3einenterminvereinbaren\",\"a2m8rueckenschmerzen\"],\"tip\":\"Lee la afirmación antes de darle al play. En el Teil 1 tienes diez segundos para eso, y son suficientes si sabes qué buscas.\"},{\"id\":\"b1m3l7e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Marín, hier ist die Praxis Doktor Weber. Sie hatten wegen Ihrer Rückenschmerzen angerufen und einen Termin gewollt. Wir hätten Donnerstag um halb zehn frei, ähm, das ist der einzige Termin in dieser Woche. Bringen Sie bitte Ihre Versichertenkarte mit und kommen Sie zehn Minuten früher, wegen der Anmeldung. Wenn Donnerstag nicht geht, rufen Sie bitte heute noch zurück.\",\"question\":\"¿Para cuándo le ofrecen la cita?\",\"options\":[\"El jueves a las 9:30\",\"El jueves a las 10:30\",\"El martes a las 9:30\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"halb zehn son las nueve y media, no las diez y media: el alemán cuenta hacia la hora siguiente\",\"El día que se oye es Donnerstag\"],\"itemIds\":[\"b1m3einenterminvereinbaren\"],\"tip\":\"«halb zehn» = 9:30. Es la trampa de reloj que el examen repite en cada Hören.\"},{\"id\":\"b1m3l7e3\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: la consulta transmite lo que dice la médica · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Praxis Doktor Weber, guten Tag. Frau Doktor Weber lässt Ihnen ausrichten, dass Ihre Werte in Ordnung sind. Ihre Beschwerden kommen also wahrscheinlich vom vielen Sitzen. Tabletten helfen da nur kurz, sagt sie. Sie sollten sich jeden Tag eine halbe Stunde bewegen, und am Arbeitsplatz wird am besten jede Stunde eine kurze Pause eingelegt. Wenn es in zwei Wochen nicht besser ist, kommen Sie bitte noch einmal vorbei.\",\"question\":\"„Die Ärztin empfiehlt vor allem Tabletten.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Tabletten helfen da nur kurz»: lo que recomienda es moverse y hacer pausas\",null],\"itemIds\":[\"b1m3beschwerden\",\"b1m3empfehlen\"],\"tip\":\"«nur kurz» le quita el valor a las pastillas sin decir «nein». En el Teil 1 la matización vale tanto como la negación.\"},{\"id\":\"b1m3l7e14\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Praxis Doktor Weber, guten Tag. Frau Doktor Weber lässt Ihnen ausrichten, dass Ihre Werte in Ordnung sind. Ihre Beschwerden kommen also wahrscheinlich vom vielen Sitzen. Tabletten helfen da nur kurz, sagt sie. Sie sollten sich jeden Tag eine halbe Stunde bewegen, und am Arbeitsplatz wird am besten jede Stunde eine kurze Pause eingelegt. Wenn es in zwei Wochen nicht besser ist, kommen Sie bitte noch einmal vorbei.\",\"question\":\"¿Qué es lo principal que recomienda la médica?\",\"options\":[\"Moverse a diario y hacer pausas\",\"Tomar pastillas durante dos semanas\",\"Cambiar de trabajo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice justo lo contrario: las pastillas solo ayudan poco tiempo\",\"No habla de cambiar de trabajo, sino de organizar pausas\"],\"itemIds\":[\"b1m3einepauseeinlegen\",\"b1m3sichbewegen\"],\"tip\":\"¿Oíste «wird … eingelegt»? Los médicos también hablan en pasiva. Ya la reconoces de oído.\"},{\"id\":\"b1m3l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la frase del teléfono\",\"text\":\"Guten Tag, ich möchte einen Termin ___.\",\"answers\":[\"vereinbaren\"],\"translation\":\"Buenos días, quisiera concertar una cita.\",\"hints\":[\"El verbo va al final tras möchte\",\"vereinb...\"],\"itemIds\":[\"b1m3einenterminvereinbaren\"]},{\"id\":\"b1m3l7e5\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe lo que dice la recepción\",\"text\":\"Nehmen Sie bitte im Wartezimmer Platz\",\"translation\":\"Tome asiento en la sala de espera, por favor\",\"hints\":[\"Imperativo de Sie\",\"Nehmen Sie bitte im ...\"],\"itemIds\":[\"b1m3daswartezimmer\",\"b1m3nehmensiedietreppe\"]},{\"id\":\"b1m3l7e6\",\"type\":\"shadow\",\"prompt\":\"Sombrea tu respuesta a „Was fehlt Ihnen?“\",\"text\":\"Ich habe seit drei Tagen starke Rückenschmerzen.\",\"phonetic\":\"ij JAA-be zait drai TAA-guen SHTAR-ke RÜ-ken-shmer-tsen\",\"translation\":\"Llevo tres días con fuertes dolores de espalda.\",\"reps\":2,\"itemIds\":[\"a2m8rueckenschmerzen\",\"a2m8seitdreitagen\",\"b1m3beschwerden\"],\"tip\":\"seit + Dativ y PRESENTE: «llevo tres días» nunca es Perfekt en alemán.\"},{\"id\":\"b1m3l7e7\",\"type\":\"hearreal\",\"prompt\":\"Escucha — ¿qué significa la frase?\",\"book\":\"Ich muss mich krankmelden.\",\"real\":\"Ich muss mich krankmelden, ich bin fix und fertig.\",\"translation\":\"Tengo que dar parte de baja, estoy hecho polvo.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Tengo que dar parte de baja porque estoy agotado\",\"Tengo que ir al gimnasio porque estoy en forma\",\"Tengo que llamar al médico para anular la cita\"],\"itemIds\":[\"b1m3sichkrankmelden\",\"b1m3natfixundfertig\"]},{\"id\":\"b1m3l7e8\",\"type\":\"mc\",\"prompt\":\"El papel que pide tu empresa\",\"question\":\"Tu jefe te pide „die Krankschreibung“. ¿Qué es?\",\"options\":[\"El justificante médico de la baja\",\"La receta para la farmacia\",\"La tarjeta del seguro médico\"],\"answer\":0,\"whyWrong\":[null,\"Eso es das Rezept\",\"Eso es die Versichertenkarte\"],\"itemIds\":[\"b1m3diekrankschreibung\",\"a2m8rezept\"]},{\"id\":\"b1m3l7e9\",\"type\":\"build\",\"prompt\":\"Construye la frase de la baja\",\"target\":\"Ich muss mich heute krankmelden\",\"altTargets\":[\"Heute muss ich mich krankmelden\"],\"translation\":\"Hoy tengo que dar parte de baja\",\"distractors\":[\"krank\",\"bin\"],\"itemIds\":[\"b1m3sichkrankmelden\"]},{\"id\":\"b1m3l7e10\",\"type\":\"gapbank\",\"prompt\":\"Completa el cartel de la consulta\",\"text\":\"In dieser Praxis ___ nur mit Termin behandelt. Die Versichertenkarte ___ am Empfang gezeigt. Kinder ___ von einer Kinderärztin untersucht.\",\"answers\":[\"wird\",\"wird\",\"werden\"],\"bank\":[\"wird\",\"werden\",\"ist\",\"sind\",\"man\"],\"translation\":\"En esta consulta solo se atiende con cita. La tarjeta sanitaria se muestra en recepción. A los niños los examina una pediatra.\",\"itemIds\":[\"praxis\",\"b1m3behandeln\",\"b1m3untersuchen\"],\"tip\":\"Los carteles alemanes van en pasiva casi siempre. Reconocerla de un vistazo es puro Lesen Teil 5.\"},{\"id\":\"b1m3l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Buenos días, quisiera concertar una cita.\",\"answers\":[\"Guten Tag, ich möchte einen Termin vereinbaren\"],\"hints\":[\"Fórmula fija de teléfono\",\"Guten Tag, ich möchte einen Termin ...\"],\"itemIds\":[\"b1m3einenterminvereinbaren\"],\"tip\":\"Esta llamada la vas a hacer de verdad si vives en el DACH. Dila en voz alta tres veces y ya no se te olvida.\"},{\"id\":\"b1m3l7e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: la consulta confirma el cambio de cita · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Marín, Praxis Doktor Weber. Sie hatten Ihren Termin morgen um halb elf abgesagt — das haben wir eingetragen, kein Problem. Der neue Termin ist am Donnerstag um sechzehn Uhr fünfzehn, nachmittags, so wie Sie es wollten. Und Ihre Krankschreibung liegt hier bei uns an der Anmeldung, die können Sie am Donnerstag gleich mitnehmen. Wir schicken sie nicht, ähm, das machen wir grundsätzlich nicht. Bis Donnerstag!\",\"question\":\"„Die Krankschreibung wird Frau Marín zugeschickt.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Wir schicken sie nicht»: la recoge ella el jueves en la recepción\",null],\"itemIds\":[\"b1m3diekrankschreibung\"],\"tip\":\"Cita anulada + cita nueva + un papel que recoger: tres datos en veinte segundos. Apunta hora y día en cuanto suenen.\"},{\"id\":\"b1m3l7e15\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Tag, Frau Marín, Praxis Doktor Weber. Sie hatten Ihren Termin morgen um halb elf abgesagt — das haben wir eingetragen, kein Problem. Der neue Termin ist am Donnerstag um sechzehn Uhr fünfzehn, nachmittags, so wie Sie es wollten. Und Ihre Krankschreibung liegt hier bei uns an der Anmeldung, die können Sie am Donnerstag gleich mitnehmen. Wir schicken sie nicht, ähm, das machen wir grundsätzlich nicht. Bis Donnerstag!\",\"question\":\"¿Cuándo es la cita nueva?\",\"options\":[\"El jueves a las 16:15\",\"Mañana a las 10:30\",\"El jueves por la mañana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Esa es la que anuló\",\"Pidió expresamente que fuera por la tarde\"],\"itemIds\":[\"b1m3einenterminvereinbaren\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m3-3\",\"book\":\"Ich muss ins Krankenhaus.\",\"real\":\"Ich muss ins Spital.\",\"meaning\":\"Tengo que ir al hospital\",\"when\":\"En Austria y en Suiza, siempre: allí «Krankenhaus» se entiende pero suena a alemán de Alemania. En Alemania, al revés: Spital suena antiguo o regional. En tu examen, siempre Krankenhaus — Spital hay que entenderlo, no producirlo.\",\"register\":\"regional\",\"exam\":\"Leider muss ich ins Krankenhaus und kann deshalb nicht kommen.\",\"note\":\"El examen es plurizéntrico: te pueden poner un texto austriaco con Spital, Stiege o Jänner (=Januar), y siempre con nota al pie.\",\"sound\":\"ij mus ins shpi-TAAL\",\"level\":\"b1\",\"itemId\":\"b1m3natspital\"}}],\"resources\":[{\"label\":\"DW — Wortschatz: Beim Arzt\",\"url\":\"https://learngerman.dw.com/de/nicos-weg/c-55735270\",\"note\":\"Diálogos de consulta médica con audio nativo y velocidad real.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero
