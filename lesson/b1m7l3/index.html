003e: coge el infinitivo, le añade una \u003cb\u003e-d\u003c/b\u003e y ya es un adjetivo.\u003cbr/\u003e\u003cbr/\u003esingen → singen\u003cb\u003ed\u003c/b\u003e → die singen\u003cb\u003ede\u003c/b\u003e [[Menge|multitud]]\u003cbr/\u003etanzen → tanzen\u003cb\u003ed\u003c/b\u003e → die tanzen\u003cb\u003eden\u003c/b\u003e Kinder\u003cbr/\u003esteigen → steigen\u003cb\u003ed\u003c/b\u003e → die steigen\u003cb\u003eden\u003c/b\u003e Preise\u003cbr/\u003ekommen → kommen\u003cb\u003ed\u003c/b\u003e → das kommen\u003cb\u003ede\u003c/b\u003e Fest\u003cbr/\u003e\u003cbr/\u003eSignificado: \u003cb\u003ela acción está pasando y la hace el sustantivo\u003c/b\u003e. Die singende Menge = la multitud canta (ella misma, ahora).\u003cbr/\u003e\u003cbr/\u003eDespués del -d se declina como cualquier adjetivo: \u003ci\u003edas kommend\u003cb\u003ee\u003c/b\u003e Fest\u003c/i\u003e (nominativo neutro), \u003ci\u003edie tanzend\u003cb\u003een\u003c/b\u003e Kinder\u003c/i\u003e (plural), \u003ci\u003ewegen des kommend\u003cb\u003een\u003c/b\u003e Festes\u003c/i\u003e (genitivo). Ahí es donde el examen te mide: no en formar el participio, sino en \u003cb\u003eponerle la terminación correcta dentro de una frase larga\u003c/b\u003e.\",\"table\":[[\"relativa (como en español)\",\"Partizip I (como en alemán escrito)\"],[\"die Menge, die singt\",\"die singende Menge\"],[\"die Kinder, die tanzen\",\"die tanzenden Kinder\"],[\"die Preise, die steigen\",\"die steigenden Preise\"],[\"das Fest, das kommt\",\"das kommende Fest\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l3e1\",\"type\":\"mc\",\"prompt\":\"¿Quién hace la acción?\",\"question\":\"„die singende Menge“\",\"options\":[\"la multitud canta\",\"alguien canta a la multitud\",\"la multitud es cantada\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería una frase con dativo: man singt der Menge etwas\",\"El Partizip I es SIEMPRE activo: el sustantivo hace la acción\"],\"itemIds\":[\"b1m7fesingend\",\"b1m7femenge\"],\"tip\":\"Partizip I = activo y simultáneo. El sustantivo hace la acción, y la hace ahora.\"},{\"id\":\"b1m7l3e2\",\"type\":\"match\",\"prompt\":\"Relativa española ↔ participio alemán\",\"pairs\":[{\"target\":\"die singende Menge\",\"source\":\"la multitud que canta\"},{\"target\":\"die tanzenden Kinder\",\"source\":\"los niños que bailan\"},{\"target\":\"die steigenden Preise\",\"source\":\"los precios que suben\"},{\"target\":\"das kommende Fest\",\"source\":\"la fiesta que viene\"}],\"itemIds\":[\"b1m7fesingend\",\"b1m7fetanzend\",\"b1m7festeigend\",\"b1m7fekommend\"]},{\"id\":\"b1m7l3e3\",\"type\":\"cloze\",\"prompt\":\"Forma el Partizip I (kommen) y decláralo\",\"text\":\"Das ___ Fest beginnt am Samstag.\",\"answers\":[\"kommende\"],\"translation\":\"La fiesta que viene empieza el sábado.\",\"hints\":[\"kommen + d = kommend\",\"das + adjetivo en nominativo neutro → -e\"],\"itemIds\":[\"b1m7fekommend\",\"b1m7fedaskommendefest\"]},{\"id\":\"b1m7l3e4\",\"type\":\"transform\",\"prompt\":\"De relativa a participio\",\"source\":\"die Menge, die singt\",\"instruction\":\"Dilo con Partizip I\",\"answers\":[\"die singende Menge\"],\"translation\":\"la multitud que canta\",\"hints\":[\"singen + d\",\"die + singende + Menge\"],\"itemIds\":[\"b1m7fesingend\",\"b1m7femenge\"],\"tip\":\"Esta transformación es la que jamás sale por transferencia del español. Practícala en las dos direcciones hasta que sea mecánica.\"},{\"id\":\"b1m7l3e5\",\"type\":\"cloze\",\"prompt\":\"Los precios de la Wiesn (steigen)\",\"text\":\"Jedes Jahr diskutiert München über die ___ Preise auf dem Oktoberfest.\",\"answers\":[\"steigenden\"],\"translation\":\"Cada año Múnich discute sobre los precios crecientes del Oktoberfest.\",\"hints\":[\"steigen + d = steigend\",\"Plural con die → -en\"],\"itemIds\":[\"b1m7festeigend\",\"b1m7feoktoberfest\"],\"strictUmlaut\":false},{\"id\":\"b1m7l3e6\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"Die tanzende Menge füllt den ganzen Platz\",\"translation\":\"La multitud que baila llena la plaza entera\",\"distractors\":[\"tanzt\",\"tanzen\"],\"itemIds\":[\"b1m7fetanzend\",\"b1m7femenge\"],\"tip\":\"Ojo: si pones «tanzt» necesitas una relativa entera. El participio te ahorra la subordinada — y eso es rango.\"},{\"id\":\"b1m7l3e7\",\"type\":\"errorfix\",\"prompt\":\"Falta una letra minúscula que vale una banda\",\"wrong\":\"Das kommend Fest ist im Jänner.\",\"answers\":[\"Das kommende Fest ist im Jänner.\"],\"why\":\"El Partizip I delante de un sustantivo es un ADJETIVO y se declina: das kommende Fest. Sin terminación, la frase es agramatical. Sin la -e, «kommend» solo puede ir suelto (adverbio).\",\"translation\":\"La fiesta que viene es en enero.\",\"itemIds\":[\"b1m7fekommend\",\"b1m7fejaenner\"]},{\"id\":\"b1m7l3e8\",\"type\":\"gapbank\",\"prompt\":\"Completa la crónica del periódico\",\"text\":\"Die ___ Kinder laufen vorne. Hinter ihnen kommt die ___ Menge. Über die ___ Preise ärgern sich alle.\",\"answers\":[\"tanzenden\",\"singende\",\"steigenden\"],\"bank\":[\"tanzenden\",\"singende\",\"steigenden\",\"tanzende\",\"singenden\",\"steigende\"],\"translation\":\"Los niños que bailan van delante. Detrás de ellos viene la multitud que canta. Todos se enfadan por los precios que suben.\",\"itemIds\":[\"b1m7fetanzend\",\"b1m7fesingend\",\"b1m7festeigend\"],\"tip\":\"Plural con die → -en; femenino singular con die → -e. El banco tiene las dos versiones de cada palabra a propósito.\"},{\"id\":\"b1m7l3e9\",\"type\":\"mc\",\"prompt\":\"Registro: ¿cuál escribirías en el examen?\",\"question\":\"En un artículo de prensa, ¿cómo suena mejor «los precios que suben»?\",\"options\":[\"die steigenden Preise\",\"die Preise, die steigen\",\"die Preise von dem Steigen\"],\"answer\":0,\"whyWrong\":[null,\"No está mal, pero es la forma hablada y larga: el texto escrito prefiere el participio\",\"Eso no existe en alemán\"],\"itemIds\":[\"b1m7festeigend\"],\"tip\":\"Las dos son correctas; el participio es más denso y más escrito. En «Strukturen» se puntúa el ESPECTRO: usa las dos, no siempre la fácil.\"},{\"id\":\"b1m7l3e10\",\"type\":\"transform\",\"prompt\":\"Ahora al revés: de participio a relativa\",\"source\":\"die tanzenden Kinder\",\"instruction\":\"Dilo con una frase de relativo\",\"answers\":[\"die Kinder, die tanzen\"],\"translation\":\"los niños que bailan\",\"hints\":[\"die Kinder, die ...\",\"El verbo va al final de la relativa\"],\"itemIds\":[\"b1m7fetanzend\"],\"tip\":\"Poder ir en las dos direcciones es lo que te salva cuando en el examen no te sale la terminación: siempre te queda la relativa.\"},{\"id\":\"b1m7l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La fiesta que viene empieza el sábado\",\"answers\":[\"Das kommende Fest beginnt am Samstag\",\"Das kommende Fest beginnt am Samstag.\"],\"hints\":[\"kommen + d + terminación de neutro\",\"Das kommende Fest ...\"],\"itemIds\":[\"b1m7fedaskommendefest\",\"b1m7fekommend\"],\"tip\":\"Un participio bien declinado en la primera frase de un texto vale más que tres adjetivos fáciles al final.\"},{\"id\":\"b1m7l3e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 · visita guiada por un mercado de Adviento vienés. UNA sola escucha. (Fragmento de entrenamiento: el Teil 2 de verdad son tres minutos y CINCO tareas seguidas — lo tienes completo en la lección «Hören: Fasnacht in Basel».)\",\"audio\":\"Grüß Gott und herzlich willkommen am Adventmarkt. Bevor wir losgehen, kurz zur Orientierung: Wir starten hier bei den singenden Kindern, gehen dann die Stiege hinauf zum großen Baum und enden beim Punschstand. Der Rundgang dauert ungefähr fünfzig Minuten. Zwei Bitten hätte ich: Bleiben Sie bitte beieinander, ab sechs wird's da vorn wirklich dicht. Und der Punsch am Schluss ist – nein, Entschuldigung, der Punsch ist nicht inkludiert, gratis ist nur der Kinderpunsch.\",\"question\":\"¿Cuánto dura el recorrido?\",\"options\":[\"Unos cincuenta minutos\",\"Una hora y media\",\"Hasta las seis\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Ese dato no aparece: el único número de duración es «fünfzig Minuten»\",\"Las seis es cuando se llena de gente, no cuando acaba\"],\"itemIds\":[\"b1m7feadventmarkt\",\"b1m7fesingend\"],\"tip\":\"«Wir starten … gehen dann … und enden …»: la guía te acaba de dar el índice del audio. En el Teil 2 ese índice vale más que cualquier palabra suelta.\"},{\"id\":\"b1m7l3e13\",\"type\":\"audiomc\",\"prompt\":\"Misma visita, segunda pregunta. Ojo a la frase que la guía corrige a medias. Misma pasada: una sola vez, sin volver atrás.\",\"audio\":\"Grüß Gott und herzlich willkommen am Adventmarkt. Bevor wir losgehen, kurz zur Orientierung: Wir starten hier bei den singenden Kindern, gehen dann die Stiege hinauf zum großen Baum und enden beim Punschstand. Der Rundgang dauert ungefähr fünfzig Minuten. Zwei Bitten hätte ich: Bleiben Sie bitte beieinander, ab sechs wird's da vorn wirklich dicht. Und der Punsch am Schluss ist – nein, Entschuldigung, der Punsch ist nicht inkludiert, gratis ist nur der Kinderpunsch.\",\"question\":\"¿Qué bebida va incluida en el precio?\",\"options\":[\"Solo el ponche infantil\",\"El ponche para todo el mundo\",\"Nada de beber\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Empieza a decirlo y se corrige: «nein, Entschuldigung, der Punsch ist nicht inkludiert»\",\"Sí hay algo gratis: el Kinderpunsch\"],\"itemIds\":[\"b1m7fepunsch\",\"b1m7femenge\",\"b1m7festiege\"],\"tip\":\"Quien habla en directo se corrige a media frase, y el examen lo aprovecha: vale lo que se dice DESPUÉS del «nein, Entschuldigung», nunca lo de antes. Y de propina, tres austriacismos: «Grüß Gott», «Adventmarkt», «inkludiert» (en Alemania: «inklusive»).\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push(
