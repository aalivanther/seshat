eshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6cf,"])</script><script>self.__next_f.push([1,"Hay una pareja de adjetivos que se parecen tanto que se confunden a diario: \u003ci\u003ebored\u003c/i\u003e y \u003ci\u003eboring\u003c/i\u003e, \u003ci\u003einterested\u003c/i\u003e e \u003ci\u003einteresting\u003c/i\u003e, \u003ci\u003etired\u003c/i\u003e y \u003ci\u003etiring\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eNo te lo aprendas por la etiqueta gramatical («participio pasado» y «participio presente»): esas palabras no te ayudan a decidir nada en mitad de una frase. Apréndete \u003cb\u003ela pregunta\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e-ed → cómo me siento YO\u003c/b\u003e (o cómo se siente una persona). \u003ci\u003eI'm [[bored|aburrido: así me siento yo]].\u003c/i\u003e · \u003ci\u003eI'm tired.\u003c/i\u003e · [[I'm interested in films.|Me interesan las películas.]]\u003cbr/\u003e\u003cb\u003e-ing → cómo es LA COSA\u003c/b\u003e que me lo provoca. \u003ci\u003eThe film is [[boring|aburrido: así es la cosa]].\u003c/i\u003e · \u003ci\u003eThe day was [[tiring|que cansa]].\u003c/i\u003e · \u003ci\u003eThe book is [[interesting|interesante]].\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el par que hunde conversaciones:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eI'm boring.\u003c/b\u003e = «Soy un muermo» — así soy yo, aburro a los demás.\u003cbr/\u003e· \u003cb\u003eI'm bored.\u003c/b\u003e = «Estoy aburrido» — así me siento ahora mismo.\u003cbr/\u003eUna letra de diferencia y un diagnóstico completamente distinto sobre tu persona.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error nº 1 del hispanohablante en este bloque:\u003c/b\u003e «me interesa la música» → \u003ci\u003eI'm \u003cb\u003einterested\u003c/b\u003e in music\u003c/i\u003e. Con -ing («I'm interesting in music») has dicho «soy interesante en la música», que no significa nada. Y ojo a la preposición: \u003cb\u003einterested IN\u003c/b\u003e, nunca «interested for» ni «interested about».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAviso honesto:\u003c/b\u003e esto es \u003cb\u003efrontera\u003c/b\u003e. LanguageCert lo coloca en su lista de B1, así que no te va a caer para producirlo; Cambridge sí lo evalúa en A2, y en la calle sale cada dos frases. Aquí se presenta para que lo reconozcas y lo puedas usar si te sale — no para examinarte de ello."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l7\",\"phaseId\":\"ena2m3\",\"title\":\"Bored or boring?\",\"subtitle\":\"Frontera: cómo me siento YO, cómo es LA COSA\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos caras del mismo adjetivo\",\"itemIds\":[\"ena2m3iminterestedin\",\"ena2m3interesting\",\"ena2m3bored\",\"ena2m3boring\",\"ena2m3tiring\",\"ena2m3exciting\",\"ena2m1tired\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos terminaciones, una sola pregunta\",\"body\":\"$17\",\"table\":[[\"la cosa (-ing)\",\"yo (-ed)\"],[\"The film is boring.\",\"I'm bored.\"],[\"The book is interesting.\",\"I'm interested in it.\"],[\"The day was tiring.\",\"I was tired.\"],[\"The match was exciting.\",\"We were excited.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l7e1\",\"type\":\"mc\",\"prompt\":\"«Me interesan las películas»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"I'm interested in films.\",\"I'm interesting in films.\",\"I'm interested for films.\"],\"answer\":0,\"whyWrong\":[null,\"Con -ing has dicho que TÚ eres interesante, no que la película te interese\",\"La preposición es in: interested in, siempre\"],\"itemIds\":[\"ena2m3iminterestedin\"],\"tip\":\"Dos cosas en una frase: la terminación -ed porque hablas de lo que sientes, y la preposición in, que va pegada.\"},{\"id\":\"ena2m3l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Habla de la PERSONA o de la COSA?\",\"categories\":[\"cómo me siento (-ed)\",\"cómo es la cosa (-ing)\"],\"items\":[{\"text\":\"bored\",\"bucket\":0},  que algo te interesa, la terminación es -ed: I'm interested in music. Y la preposición, in.\",\"translation\":\"Me interesa mucho la música.\",\"itemIds\":[\"ena2m3iminterestedin\"]},{\"id\":\"ena2m3l7e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige la terminación\",\"wrong\":\"The film was very bored.\",\"answers\":[\"The film was very boring.\"],\"why\":\"Una película no siente nada: no puede estar aburrida. Lo que puede es aburrir, y para eso el inglés usa -ing. Las cosas llevan -ing (boring, tiring, interesting); las personas, -ed (bored, tired, interested).\",\"translation\":\"La película era aburridísima.\",\"itemIds\":[\"ena2m3boring\",\"ena2m3bored\"]},{\"id\":\"ena2m3l7e8\",\"type\":\"match\",\"prompt\":\"Empareja cada forma con su significado\",\"pairs\":[{\"target\":\"bored\",\"source\":\"aburrido: así me siento yo\"},{\"target\":\"boring\",\"source\":\"aburrido: así es la cosa\"},{\"target\":\"tiring\",\"source\":\"que cansa\"},{\"target\":\"exciting\",\"source\":\"emocionante\"},{\"target\":\"interested in\",\"source\":\"interesado en, me interesa\"}],\"itemIds\":[\"ena2m3bored\",\"ena2m3boring\",\"ena2m3tiring\",\"ena2m3exciting\",\"ena2m3iminterestedin\"]},{\"id\":\"ena2m3l7e9\",\"type\":\"transform\",\"prompt\":\"Dilo desde ti\",\"source\":\"The book is interesting.\",\"instruction\":\"Dilo desde ti, con -ed y su preposición\",\"answers\":[\"I'm interested in the book.\",\"I am interested in the book.\"],\"translation\":\"El libro me interesa.\",\"hints\":[\"Cambias de sujeto: ya no habla el libro, hablas tú\",\"I'm interest… i… the book.\"],\"itemIds\":[\"ena2m3iminterestedin\",\"ena2m3interesting\",\"enbook\"]},{\"id\":\"ena2m3l7e10\",\"type\":\"build\",\"prompt\":\"Construye la frase — ojo a las dos terminaciones\",\"target\":\"It was a long and tiring day\",\"translation\":\"Fue un día largo y agotador\",\"distractors\":[\"tired\",\"boring\"],\"itemIds\":[\"ena2m3tiring\",\"ena2m1tired\"],\"tip\":\"El día no está cansado: cansa. Por eso tiring y
