t happens next is where [[manners|los modales]] and method part company. A lot of people send a second email that begins I'm sorry if you were offended. The HR manager files those under unfinished. They do not name the damage, and they hand the problem to the reader. The emails that actually repair something have four moves, and they are boring on purpose. You name the wording. You take responsibility. You say what you will do differently — a second draft, a night's sleep, getting a colleague to read it. You ask the other person whether they will accept the apology, and you stop.\u003cbr/\u003e\u003cbr/\u003eShe is not sentimental about this. \"I must admit I have sent the bad kind,\" she says. \"If I had waited, I would not have had a folder. The folder is my second draft, in a way.\" The office she works in is not British and not American. English is the language in which people who do not share a first language do their jobs. That makes the repair more, not less, important. There is no shared childhood to absorb a harsh line. There is only the sentence.\u003cbr/\u003e\u003cbr/\u003eA social convention in that office, which she would like to export, is that anyone can ask a colleague to read a difficult email before it goes. \"I got him to help\" is not a confession of weakness. It is how the damage is avoided. She has had the wording of her own messages checked more times than she can count. The people who will not ask are the people who later write I didn't mean it like that, which is true and which is also too late.\u003cbr/\u003e\u003cbr/\u003eNone of this is a moral. It is a process. If you have already sent the sentence, the process still runs: name, own, change, ask. If you have not, the process is shorter: wait. She has watched people skip the wait because they wanted the feeling of having been honest. Honesty without a second look is just speed. The folder on her desktop is called, without irony, Sent. She opens it when a new graduate says that apologies are just manners. \"They are manners,\" she says. \"They are also the only tool we have when the sentence has already left the building.\"\u003cbr/\u003e\u003cbr/\u003eA last note, because graduates always ask it: do you write the repair the same day? She says no, unless the damage is still spreading. A night's sleep is part of the method. If she had answered every angry inbox on the afternoon it arrived, the folder would be twice as thick. Even so, she does not recommend silence. A short line — I have read this; I will reply tomorrow — keeps the other person from inventing a worse sentence in the gap. Then you do the four steps, and you stop. Stopping is the part nobody teaches, and it is the part that makes the apology sound like one."])</script><script>self.__next_f.push([1,"18:Tc9f,"])</script><script>self.__next_f.push([1,"I am tired of clever people beginning every email with sorry. Sorry to bother you. Sorry for the delayed reply. Sorry if this is a silly question. It is not manners. It is a [[social convention|convención social]] that trains the writer to take up less room, and it is doing something to the word we actually need when we have caused harm.\u003cbr/\u003e\u003cbr/\u003eI must admit I do it. If I had kept a folder, it would be longer than the Bangalore one, and most of the sentences in it would be apologies for existing. That is not the same as an apology for a harsh line. One of them repairs a wound. The other asks permission to have a pulse.\u003cbr/\u003e\u003cbr/\u003eThere is a cost. When you have already said sorry fourteen times that week, the fifteenth — the one that ought to cost you something — sounds like the rest. The colleague who received a rude paragraph on Tuesday hears, on Wednesday, the same music you used to ask for a file. In hindsight, you have spent the word. Even so, the habit is hard to break, because it is rewarded: people call you nice, and niceness is a currency that still spends.\u003cbr/\u003e\u003cbr/\u003eI am not arguing for rudeness. I am arguing for keeping sorry for when you have something to own. You were late; say so, and say what you will do. You sent a tone you would not have sent if you had waited; name the tone, take responsibility, stop. You are not late, and you have not sent a tone: do not open with sorry. Open with the request. The request is allowed to take up the first line. That, too, is manners — the kind that leaves some sorry in the cupboard for the day you will need it.\u003cbr/\u003e\u003cbr/\u003eA friend of mine, who is kinder than I am, says this is easy to say and ugly to do if you are the person in the room with less power. She is right. I would not tell a new barista to start a complaint to her manager without a softener. I would tell her not to spend her whole stock of sorry on the coffee machine being noisy. Save one. You are going to need it for a sentence that actually did some damage, and when that day comes you will want the word to still mean something.\u003cbr/\u003e\u003cbr/\u003eOn reflection, the Bangalore process and this column want the same thing from opposite doors. She wants a repair that works. I want a language in which a repair can still be heard. If we had not cheapened the word, we would not need a four-step method to make it land. We did. So we do.\u003cbr/\u003e\u003cbr/\u003eI will add a practical test, because columns that only scold are another way of spending sorry. Tomorrow, before you send the first email of the day, count the sorrys already in the draft. If the first one is not attached to a harm you can name — a delay, a tone, a missed shift — take it out. Put the request in the first line. If the draft feels naked, that is the point: the request was allowed to take up that room all along. Keep one sorry for the afternoon you will actually need it. You will know the afternoon, because the wording will have been off, and you will want the word to still cost you something. That cost is the whole argument. A language in which every request arrives wrapped in sorry is a language in which a real apology cannot be heard. Save the word. Spend it once, on the sentence that did the damage, and then stop."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m6l6\",\"phaseId\":\"enb2m6\",\"title\":\"Manners, and the cost of a sentence\",\"subtitle\":\"Dos lecturas: cómo se repara un correo, y por qué disculparse de más también es un hábito\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Modales, convenciones, a toro pasado\",\"itemIds\":[\"enb2m6manners\",\"enb2m6asocialconvention\",\"enb2m6inhindsight\",\"enb2m6aharsh\",\"enb2m6thatcameoutwrong\",\"enb2m6sympathy\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: un texto que enseña a reparar, y otro que discute la disculpa misma\",\"body\":\"Dos lecturas, el mismo asunto: \u003cb\u003equé se hace con una frase que ha hecho daño\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa A informa.\u003c/b\u003e Es un artículo de una revista de oficina de Bengaluru — inglés como lengua de trabajo, no de casa. Verás \u003ci\u003ein hindsight, a second draft, the wording, get someone to read it\u003c/i\u003e. No te dice si Valeria merece perdón: te dice el proceso.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa B convence.\u003c/b\u003e Una columna de opinión: disculparse de más no es educación, es una convención que deja a quien escribe en deuda. Verás \u003ci\u003emanners, social convention, I must admit\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eLa pregunta de la lección: \u003cb\u003e¿informar o convencer?\u003c/b\u003e Y luego: qué harías tú con el correo de Valeria, habiendo leído las dos.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l6e1\",\"type\":\"read\",\"prompt\":\"Lectura A — informa. El proceso de reparar un correo, escrito desde una redacción de Bengaluru.\",\"title\":\"The cost of a careless email\",\"source\":\"From an office-skills newsletter published in Bengaluru (adapted)\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m6l6e1q1\",\"q\":\"What does the HR manager keep a folder of?\",\"options\":[\"Emails that did damage, used as teaching material, not to shame anyone\",\"Contracts that cost the company money\",\"Apologies she has not yet accepted\"],\"answer\":0,\"why\":\"«keeps a folder of them. Not to shame anyone: to teach the repair.» Them = the expensive sentences / emails sent too fast.\"},{\"id\":\"enb2m6l6e1q2\",\"q\":\"Why does she file «I'm sorry if you were offended» under unfinished?\",\"options\":[\"Because those emails do not name the damage and hand the problem to the reader.\",\"Because they are written in Indian English and she wants British forms.\",\"Because they are always the third draft.\"],\"answer\":0,\"inference\":true,\"why\":\"«They do not name the damage, and they hand the problem to the reader.» Eso es exactamente la no-disculpa de la L4.\"},{\"id\":\"enb2m6l6e1q3\",\"q\":\"What point is she making about English as a workplace language?\",\"options\":[\"That a repair matters more when people do not share a childhood to absorb a harsh line.\",\"That staff should switch to their first languages for difficult news.\",\"That British manners do not apply in Bengaluru.\"],\"answer\":0,\"inference\":true,\"why\":\"«There is no shared childhood to absorb a harsh line. There is only the sentence.» Hay que leerlo contra «English is the language in which people who do not share a first language do their jobs.»\"},{\"id\":\"enb2m6l6e1q4\",\"q\":\"What is «I got him to help» doing in this office, according to her?\",\"options\":[\"It is the convention that prevents the damage: a colleague reads the email first.\",\"It is a confession that the writer cannot write.\",\"It is how they attach blame to a colleague.\"],\"answer\":0,\"why\":\"«anyone can ask a colleague to read a difficult email before it goes. \\\"I got him to help\\\" is not a confession of weakness.»\"},{\"id\":\"enb2m6l6e1q5\",\"q\":\"The last line calls manners a tool. What does that imply about apology?\",\"options\":[\"That it is not decoration: it is what you still have after the sentence has gone.\",\"That manners are more important than changing the rota.\",\"That the folder should be deleted.\"],\"answer\":0,\"inference\":true,\"why\":\"«They are also the only tool we have when the sentence has already left the building.» Manners aquí no son etiqueta: son el procedimiento de la reparación.\"}],\"itemIds\":[\"enb2m6inhindsight\",\"enb2m6manners\",\"enb2m6asocialconvention\",\"enb2m6thewording\",\"enb2m6aseconddraft\",\"enb2m6igothimtohelp\",\"enb2m6imustadmit\",\"enb2m6aharsh\",\"enb2m6ididntmeanitlikethat\"],\"tip\":\"Cuenta los causativos: got him to help, had the wording checked. El artículo A es el módulo puesto a informar, y el inglés de oficina de Bengaluru es el que el alumno va a usar el 80 % de las veces.\"},{\"id\":\"enb2m6l6e2\",\"type\":\"read\",\"prompt\":\"Lectura B — convence. La misma disculpa, vista como hábito, no como virtud.\",\"title\":\"Stop apologising for existing\",\"source\":\"Opinion column in a London magazine (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m6l6e2q1\",\"q\":\"What distinction is the writer drawing between two kinds of sorry?\",\"options\":[\"Sorry that repairs harm versus sorry that asks permission to exist.\",\"Sorry in British English versus sorry in Indian English.\",\"Sorry to a manager versus sorry to a friend.\"],\"answer\":0,\"why\":\"«That is not the same as an apology for a harsh line. One of them repairs a wound. The other asks permission to have a pulse.»\"},{\"id\":\"enb2m6l6e2q2\",\"q\":\"Why, according to the writer, does the fifteenth sorry fail?\",\"options\":[\"Because the word has already been spent on smaller things, so the real apology sounds like the rest.\",\"Because fifteen is an unlucky number.\",\"Because colleagues never accept apologies on Wednesdays.\"],\"answer\":0,\"inference\":true,\"why\":\"«When you have already said sorry fourteen times… the fifteenth… sounds like the rest. … you have spent the word.» Hay que unir el recuento con «spent».\"},{\"id\":\"enb2m6l6e2q3\",\"q\":\"What does the kinder friend complicate?\",\"options\":[\"That dropping sorry is easier to advise than to do if you have less power in the room.\",\"That baristas should never complain.\",\"That the coffee machine is the real problem.\"],\"answer\":0,\"why\":\"«this is easy to say and ugly to do if you are the person in the room with less power.»\"},{\"id\":\"enb2m6l6e2q4\",\"q\":\"How does the last paragraph position this column against the Bengaluru article?\",\"options\":[\"As wanting the same outcome — a repair that can still be heard — from the opposite door.\",\"As a rejection of the four-step method.\",\"As proof that Indian offices have better manners.\"],\"answer\":0,\"inference\":true,\"why\":\"«the Bangalore process and this column want the same thing from opposite doors.» Sintetizar es exactamente esto: dos fuentes, un resultado, dos caminos.\"}],\"itemIds\":[\"enb2m6asocialconvention\",\"enb2m6imustadmit\",\"enb2m6ifihadknown\",\"enb2m6inhindsight\",\"enb2m6evenso\",\"enb2m6onreflection\",\"enb2m6manners\",\"enb2m6sympathy\",\"enb2m6asoftener\",\"enb2m6spenttheword\",\"enb2m6thenakedrequest\"],\"tip\":\"La B usa tercer condicional («If I had kept a folder, it would be longer»; «If we had not cheapened the word, we would not need…»). Cuéntalos. El artículo de opinión también es gramática.\"},{\"id\":\"enb2m6l6e3\",\"type\":\"mc\",\"prompt\":\"Sintetizar las dos\",\"question\":\"¿En qué coinciden las dos lecturas, aunque una informe y la otra convenza?\",\"options\":[\"En que una disculpa de verdad tiene que poder oírse, y eso exige no gastar la palabra en todo\",\"En que Valeria no debería escribirle a Priya\",\"En que el inglés de oficina de Bengaluru no sirve en Londres\"],\"answer\":0,\"whyWrong\":[null,\"Ninguna de las dos habla de Valeria por nombre; el caso es el procedimiento.\",\"La A trata ese inglés como el de trabajo de mucha gente; la B no lo discute.\"],\"itemIds\":[\"enb2m6manners\",\"enb2m6offeringanapology\"],\"tip\":\"Sintetizar no es elegir un bando. Es cazar lo que las dos firmarían. Aquí: sorry tiene que seguir significando algo.\"},{\"id\":\"enb2m6l6e4\",\"type\":\"paraphrase\",\"prompt\":\"Sin «about» ni «think»: pasa de la disculpa a la empatía\",\"source\":\"I'm sorry about your news.\",\"forbid\":[\"about\",\"think\",\"apologis\"],\"answers\":[\"I was sorry to hear that\",\"I was sorry to hear your news\",\"I was sad to hear that\"],\"translation\":\"Siento lo que te ha pasado.\",\"hints\":[\"La fórmula de condolencia / empatía del módulo\",\"I was sorry to hear ...\"],\"itemIds\":[\"enb2m6sympathy\"],\"tip\":\"«I was sorry to hear that» no es una disculpa de culpa. Es empatía. Mezclar las dos es otra forma de gastar la palabra.\"},{\"id\":\"enb2m6l6e5\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Visto ahora, debería haberlo comprobado.\",\"answers\":[\"In hindsight, I ought to have checked\",\"In hindsight I ought to have checked\",\"In hindsight, I should have checked\"],\"hint\":\"Empieza por «In hindsight»\",\"itemIds\":[\"enb2m6inhindsight\",\"enb2m6oughttohavechecked\"],\"tip\":\"In hindsight es un bloque. No «in the hindsight» ni «at hindsight».\"},{\"id\":\"enb2m6l6e6\",\"type\":\"cloze\",\"prompt\":\"Completa el incontable / plural\",\"text\":\"Good ___ are not the same as spending the word sorry on every line.\",\"answers\":[\"manners\"],\"translation\":\"Los buenos modales no son lo mismo que gastar la palabra «sorry» en cada línea.\",\"hints\":[\"Siempre plural en este sentido\",\"man...\"],\"itemIds\":[\"enb2m6manners\"],\"tip\":\"«A manner» es una manera de hacer algo. «Manners» son los modales. El artículo del singular te delata.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"me
