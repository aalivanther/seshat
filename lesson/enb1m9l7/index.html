8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T80e,"])</script><script>self.__next_f.push([1,"Un phrasal verb no es un verbo con una preposición suelta: es \u003cb\u003euna palabra de dos piezas\u003c/b\u003e, y la segunda pieza no significa nada por su cuenta. \u003ci\u003eDrop\u003c/i\u003e es «dejar caer»; \u003ci\u003edrop somebody off\u003c/i\u003e es «dejar a alguien en un sitio». No hay lógica que valga: se memoriza el bloque.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos seis del viaje:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eset off (for)\u003c/b\u003e — salir hacia un sitio. \u003ci\u003eWe set off for the airport at five.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eget in\u003c/b\u003e — llegar (un tren, un vuelo, una persona). \u003ci\u003eWhat time does your flight get in?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003edrop somebody off\u003c/b\u003e — dejar a alguien en un sitio, normalmente en coche. \u003ci\u003eCan you drop me off at the station?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003epick somebody up (from)\u003c/b\u003e — recoger a alguien. \u003ci\u003eI'll pick you up from the airport.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003esee somebody off\u003c/b\u003e — ir a despedir a alguien al andén o a la puerta. \u003ci\u003eWe went to see her off.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003echeck out (of)\u003c/b\u003e — dejar el hotel. \u003ci\u003eWe check out of the hotel at ten.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres avisos que valen puntos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003e\u003ci\u003epick up FROM\u003c/i\u003e, no «in».\u003c/b\u003e \u003ci\u003eI'll pick you up from the airport.\u003c/i\u003e El español dice «te recojo EN el aeropuerto» y el calco sale solo.\u003cbr/\u003e2. \u003cb\u003eCon «me», «you», «her», el pronombre va EN MEDIO.\u003c/b\u003e \u003ci\u003eDrop \u003cu\u003eme\u003c/u\u003e off\u003c/i\u003e, \u003ci\u003epick \u003cu\u003eyou\u003c/u\u003e up\u003c/i\u003e, \u003ci\u003esee \u003cu\u003eher\u003c/u\u003e off\u003c/i\u003e. «Drop off me» no existe. (La regla completa de dónde va el pronombre llega más adelante; de momento, con estos seis, en medio.)\u003cbr/\u003e3. \u003cb\u003e\u003ci\u003eget in\u003c/i\u003e es llegar, no entrar.\u003c/b\u003e \u003ci\u003eThe flight got in at nine\u003c/i\u003e = el vuelo llegó a las nueve. Y si alguien te dice \u003ci\u003ewhat time did you get in last night?\u003c/i\u003e, te está preguntando a qué hora llegaste a casa.\u003cbr/\u003e\u003cbr/\u003eY dos sustantivos que van con ellos y no son phrasal verbs: \u003cb\u003ea stopover\u003c/b\u003e (una escala) y \u003cb\u003ethe luggage allowance\u003c/b\u003e (lo que te dejan llevar). Fíjate en \u003ci\u003estopover\u003c/i\u003e, que es \u003ci\u003estop\u003c/i\u003e + \u003ci\u003eover\u003c/i\u003e convertido en una sola palabra: es lo que pasa con muchos phrasal verbs cuando se hacen sustantivo (\u003ci\u003ea takeaway\u003c/i\u003e, \u003ci\u003ea breakdown\u003c/i\u003e, \u003ci\u003ea check-in\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l7\",\"phaseId\":\"enb1m9\",\"title\":\"Can you drop me off?\",\"subtitle\":\"Seis phrasal verbs de viaje, y la preposición que va pegada y no se traduce\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los seis que hacen falta\",\"itemIds\":[\"enb1m9checkoutof\",\"enb1m9dropoff\",\"enb1m9pickupfrom\",\"enb1m9seeoff\",\"enb1m9getoffat\",\"enb1m9stopover\",\"enb1m9luggageallowance\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la preposición no se traduce, se aprende pegada\",\"body\":\"$17\",\"table\":[[\"Phrasal verb\",\"Qué significa\",\"Con pronombre\"],[\"set off for\",\"salir hacia\",\"—\"],[\"get in\",\"llegar\",\"—\"],[\"drop off\",\"dejar a alguien\",\"drop me off\"],[\"pick up from\",\"recoger a alguien\",\"pick you up\"],[\"see off\",\"ir a despedir\",\"see her off\"],[\"check out of\",\"dejar el hotel\",\"—\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l7e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro phrasal verbs\",\"pairs\":[{\"target\":\"Can you drop me off at the station?\",\"source\":\"¿Me puedes dejar en la estación?\"},{\"target\":\"I'll pick you up from the airport.\",\"source\":\"Te recojo en el aeropuerto.\"},{\"target\":\"We went to see her off.\",\"source\":\"Fuimos a despedirla.\"},{\"target\":\"We check out of the hotel at ten.\",\"source\":\"Dejamos el hotel a las diez.\"}],\"itemIds\":[\"enb1m9dropoff\",\"enb1m9pickupfrom\",\"enb1m9seeoff\",\"enb1m9checkoutof\"],\"tip\":\"Fíjate en dónde está el pronombre en las tres primeras: en medio, siempre. «Drop me off», «pick you up», «see her off». Es lo primero que se rompe al traducir del español.\"},{\"id\":\"enb1m9l7e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — phrasal verbs que ya traes del módulo 6\",\"pairs\":[{\"target\":\"turn up\",\"source\":\"presentarse, aparecer\"},{\"target\":\"put off\",\"source\":\"aplazar\"},{\"target\":\"run out of\",\"source\":\"quedarse sin\"},{\"target\":\"get over\",\"source\":\"recuperarse de\"},{\"target\":\"look after\",\"source\":\"cuidar de\"}],\"targetSeconds\":22,\"itemIds\":[\"enb1m6turnup\",\"enb1m6putoff\",\"enb1m5runoutof\",\"enb1m6getover\",\"enb1m6lookafter\"],\"tip\":\"Cinco que ya tienes. Los phrasal verbs no se aprenden una vez: se aprenden en tandas pequeñas y se repasan rápido, porque lo que falla no es entenderlos, es que salgan a tiempo.\"},{\"id\":\"enb1m9l7e3\",\"type\":\"mc\",\"prompt\":\"«Get in» no es entrar\",\"question\":\"«What time does your flight get in?» te pregunta…\",\"options\":[\"A qué hora llega tu vuelo\",\"A qué hora entras a embarcar\",\"A qué hora sale tu vuelo\"],\"answer\":0,\"whyWrong\":[null,\"Embarcar es «board». «Get in» habla de llegar a destino, no de entrar en ningún sitio.\",\"Salir es «leave», «depart» o «take off». «Get in» es justo lo contrario.\"],\"itemIds\":[\"enb1m9getin\"],\"tip\":\"«Get in» sirve para trenes, vuelos y personas: «the train gets in at six», «what time did you get in last night?». Y su pareja es «get off», que es bajarse. Ninguno de los dos tiene que ver con entrar y salir de sitios.\"},{\"id\":\"enb1m9l7e4\",\"type\":\"cloze\",\"prompt\":\"Completa la partícula\",\"text\":\"My train's at eight. Can you drop me ___ at the station on your way to work?\",\"answers\":[\"off\"],\"translation\":\"Mi tren sale a las ocho. ¿Me puedes dejar en la estación de camino al trabajo?\",\"hints\":[\"Es la misma partícula que en «see her ___» y en «get ___ at the third stop»\",\"Tres letras\"],\"itemIds\":[\"enb1m9dropoff\"],\"tip\":\"«Off» es la partícula de separarse: te bajas del coche, te bajas del tren, alguien se va y tú te quedas. Una vez que le pillas ese sentido, «drop off», «get off» y «see off» dejan de ser tres cosas sueltas.\"},{\"id\":\"enb1m9l7e5\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra\",\"wrong\":\"I'll pick you up in the airport.\",\"answers\":[\"I'll pick you up from the airport.\"],\"why\":\"«Pick up» pide «from» cuando dices de dónde recoges a alguien: sales de ahí con esa persona. El español dice «te recojo EN el aeropuerto» y el «in» se cuela por calco directo.\",\"translation\":\"Te recojo en el aeropuerto.\",\"itemIds\":[\"enb1m9pickupfrom\"]},{\"id\":\"enb1m9l7e6\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación en el coche\",\"text\":\"«Can you ___ me off at the station? My train's at eight.» «Course. And I'll ___ you up from the airport on Sunday, so don't get a taxi.» «Thanks. Do you want to come in and ___ me off, or shall I just get out at the door?»\",\"answers\":[\"drop\",\"pick\",\"see\"],\"bank\":[\"drop\",\"pick\",\"see\",\"get\",\"set\",\"check\",\"take\"],\"translation\":\"«¿Me dejas en la estación? Mi tren sale a las ocho.» «Claro. Y el domingo te recojo en el aeropuerto, así que no cojas taxi.» «Gracias. ¿Quieres entrar a despedirme o me bajo en la puerta y ya?»\",\"itemIds\":[\"enb1m9dropoff\",\"enb1m9pickupfrom\",\"enb1m9seeoff\"],\"tip\":\"Los tres huecos son los tres verbos del viaje que hacen otros por ti. Y fíjate en el tercero: «come in and see me off» es entrar en la estación a despedirte, no dejarte en la puerta. Esa diferencia la lleva entera la partícula.\"},{\"id\":\"enb1m9l7e7\",\"type\":\"bucket\",\"prompt\":\"¿Al principio del viaje o al final?\",\"categories\":[\"Antes de salir o al salir\",\"Al llegar o al volver\"],\"items\":[{\"text\":\"We set off for the airport at five.\",\"bucket\":0},{\"text\":\"We went to see her off.\",\"bucket\":0},{\"text\":\"Can you drop me off at the station?\",\"bucket\":0},{\"text\":\"What time does your flight get in?\",\"bucket\":1},{\"text\":\"I'll pick you up from the airport.\",\"bucket\":1},{\"text\":\"Get off at the third stop.\",\"bucket\":1}],\"itemIds\":[\"enb1m9setofffor\",\"enb1m9seeoff\",\"enb1m9dropoff\",\"enb1m9getin\",\"enb1m9pickupfrom\",\"enb1m9getoffat\"],\"tip\":\"Tres para salir y tres para llegar, y todos con la misma estructura. Si te los aprendes en pares opuestos —set off / get in, drop off / pick up— se sostienen mucho mejor que sueltos.\"},{\"id\":\"enb1m9l7e8\",\"type\":\"build\",\"prompt\":\"Construye la petición, con el pronombre donde va\",\"target\":\"Can you drop me off at the station\",\"translation\":\"¿Me puedes dejar en la estación?\",\"distractors\":[\"down\",\"in\"],\"itemIds\":[\"enb1m9dropoff\"],\"tip\":\"Las dos fichas que sobran son las dos partículas que un hispanohablante prueba primero: «down» por «dejar» y «in» por «en». La buena es «off», y el «me» va en medio.\"},{\"id\":\"enb1m9l7e9\",\"type\":\"transform\",\"prompt\":\"Dilo con el phrasal verb\",\"source\":\"We left for the airport at five.\",\"instruction\":\"Dilo con «set off»\",\"answers\":[\"We set off for the airport at five\",\"We set off for the airport at five.\"],\"translation\":\"Salimos hacia el aeropuerto a las cinco.\",\"hints\":[\"«Set off» no cambia en pasado: se escribe igual\",\"We set ... for the airport at five\"],\"itemIds\":[\"enb1m9setofffor\"],\"tip\":\"«Set» es de los irregulares que no cambian nunca: set / set / set. Así que «we set off» puede ser presente o pasado, y lo desambigua el resto de la frase — aquí, «at five» con el contexto de un viaje ya hecho.\"},{\"id\":\"enb1m9l7e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «pick» y sin «up»\",\"source\":\"I'll pick you up from the airport.\",\"forbid\":[\"pick\",\"up\"],\"answers\":[\"I'll collect you from the airport\",\"I'll come and get you from the airport\",\"I'll meet you at the airport and drive you home\"],\"translation\":\"Te recojo en el aeropuerto.\",\"hints\":[\"Hay un verbo formal de una sola pieza que significa lo mismo\",\"I'll co... you from the airport\"],\"itemIds\":[\"enb1m9pickupfrom\",\"enb1m9getin\"],\"tip\":\"«Collect» es el gemelo formal de «pick up», y es el que verás escrito en un correo de una empresa. Tener la versión de una pieza y la de dos es exactamente el criterio de rango del examen: la formal para escribir, la phrasal para hablar.\"},{\"id\":\"enb1m9l7e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Dejamos el hotel a las diez, así que puedes recogernos a y cuarto.\",\"answers\":[\"We check out of the hotel at ten, so you can pick us up at quarter past\",\"We check out of the hotel at ten, so you can pick us up at a quarter past\",\"We check out at ten, so you can pick us up at quarter past\"],\"hint\":\"El primero pide «of» detrás; el segundo lleva el pronombre en medio\",\"itemIds\":[\"enb1m9checkoutof\",\"enb1m9pickupfrom\"],\"tip\":\"«Check out» sin nada detrás también vale («we check out at ten»); en cuanto dices de dónde, aparece el «of». Es la misma mecánica que «get off» y «get off at the third stop».\"},{\"id\":\"enb1m9l7e12\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te está contando?\",\"source\":\"We had a two-hour stopover in Lisbon, and the second flight got in at half nine.\",\"answers\":[\"Hicimos una escala de dos horas en Lisboa y el segundo vuelo llegó a las nueve y media\",\"Tuvimos una escala de dos horas en Lisboa y el segundo vuelo llegó a las nueve y media\",\"Hicimos escala dos horas en Lisboa y el segundo vuelo llegó a las nueve y media\"],\"itemIds\":[\"enb1m9stopover\",\"enb1m9getin\",\"enb1m9adelay\"],\"tip\":\"«A two-hour stopover», otra vez con guion y en singular. Y «got in» es llegar: si lo traduces por «entró», la frase deja de tener sentido y te quedas buscando dónde entró.\"},{\"id\":\"enb1m9l7e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: organizando la vuelta. Dos escuchas.\",\"audio\":\"So what time does it get in?|Half nine, if it's on time. It won't be.|I'll pick you up, then. Text me when you've landed and I'll set off.|You don't have to do that. There's a bus every twenty minutes.|At half nine on a Sunday there isn't. Last time you waited fifty minutes with two cases in the rain.|Fair point.|Right. Text me when you've landed. If I don't hear anything by ten I'll assume you got the bus and I'll go back to bed.\",\"question\":\"¿Qué han acordado?\",\"options\":[\"Que Ben la recoge si ella le escribe al aterrizar\",\"Que ella coge el autobús porque pasa cada veinte minutos\",\"Que Ben la espera en el aeropuerto desde las nueve y media\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ben desmonta justo eso: «At half nine on a Sunday there isn't».\",\"No la espera: sale de casa cuando reciba el mensaje. «Text me when you've landed and I'll set off».\"],\"itemIds\":[\"enb1m9pickupfrom\",\"enb1m9setofffor\",\"enb1m9getin\",\"enb1m9illletyouknowwhen\"],\"tip\":\"Escucha «Text me when you've landed»: la temporal de la lección 3, con perfecto y sin «will», dentro de una conversación normal. Nadie la anuncia y está dos veces en veinte segundos.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
