 son \u003cb\u003esiete conversaciones inacabadas a dos voces\u003c/b\u003e, y el handbook exige que \u003cb\u003euna sea formal\u003c/b\u003e. Ya no es «¿qué contestarías tú?»: es «¿cómo sigue \u003ci\u003eesto\u003c/i\u003e?». Hay que haber leído el registro y la relación entre los dos hablantes \u003cb\u003eantes\u003c/b\u003e de elegir el remate.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué se falla:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003ePor elegir por palabras repetidas.\u003c/b\u003e Las opciones incorrectas copian léxico del audio.\u003cbr/\u003e2. \u003cb\u003ePor no oír el registro.\u003c/b\u003e Un remate de café en una conversación con una agencia es el distractor diseñado.\u003cbr/\u003e3. \u003cb\u003ePor no oír la relación.\u003c/b\u003e ¿Se están disculpando, negociando, reparando, cerrando?\u003cbr/\u003e\u003cbr/\u003eEstrategia: lee las tres opciones, descarta la absurda, oye la primera vez para la función, la segunda para el registro. Todo ×2.\u003cbr/\u003e\u003cbr/\u003eHoy hay siete. La número 4 es la formal: Valeria y Nadia Kowalczyk, de la agencia.\",\"table\":[[\"Lo que oyes\",\"La función\",\"El remate\"],[\"I shouldn't have said it like that.\",\"disculpa entre amigos\",\"It's all right. I know you.\"],[\"Allow me to rephrase that.\",\"reparación\",\"Go on.\"],[\"I sincerely apologise for the delay.\",\"disculpa formal\",\"Thank you. Let's start with the date.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia\",\"question\":\"En el Part 1 del B2, ¿qué decide el remate correcto?\",\"options\":[\"La función y el registro de la conversación inacabada\",\"Las palabras que se repiten entre el audio y la opción\",\"La opción más educada de las tres, siempre\"],\"answer\":0,\"whyWrong\":[null,\"Justo el truco del examen: las incorrectas copian léxico.\",\"Si la conversación es de café, la más educada es el distractor formal.\"],\"itemIds\":[\"enb2m6thecontinuation\",\"enb2m6theregister\"],\"tip\":\"Una de las siete es formal. Las otras seis no. Tratar las siete como formales es otra forma de no leer el registro.\"},{\"id\":\"enb2m6l10e2\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 1 de 7. Lee las opciones ANTES. Dos escuchas.\",\"audio\":\"I shouldn't have said it like that.|Look, I know you were tired—\",\"question\":\"¿Cuál es el remate adecuado?\",\"options\":[\"It's all right. Let's start again.\",\"I sincerely apologise for the inconvenience caused.\",\"The rota is on the fridge.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Registro de comité en una conversación de amigos. Sobrado.\",\"Cambia de tema y no contesta a la disculpa.\"],\"itemIds\":[\"enb2m6shouldnthavesaidit\",\"enb2m6thecontinuation\"],\"tip\":\"Función: aceptar una disculpa entre amigos. La B es la formal que el examen pone para quien no oye la relación.\"},{\"id\":\"enb2m6l10e3\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 2 de 7.\",\"audio\":\"If I had known it was your weekend, I wouldn't have put you on.|Yeah, well—\",\"question\":\"¿Cuál es el remate adecuado?\",\"options\":[\"It's done now. Can we fix next Saturday?\",\"I take full responsibility for the company's policy.\",\"What do you think of the new coffee machine?\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Priya no es «the company», y el tono es de compañeras, no de comunicado.\",\"Cambia de tema. El «Yeah, well» pide seguir con el turno, no con la máquina.\"],\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6thecontinuation\"],\"tip\":\"«Yeah, well» es un hueco: concede a medias y espera una propuesta. La A la da. Las otras dos no oyen el hueco.\"},{\"id\":\"enb2m6l10e4\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 3 de 7.\",\"audio\":\"No, hang on — what I meant was I was tired, not angry.|Right, so—\",\"question\":\"¿Cuál es el remate adecuado?\",\"options\":[\"So you own the wording, not the point. Fair enough.\",\"Allow me to rephrase that on your behalf.\",\"My bad. Search me.\"],\"
