-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T42c,El último Teil del Lesen es un \u003cb\u003etexto normativo\u003c/b\u003e: una \u003ci\u003eHausordnung\u003c/i\u003e, unas \u003ci\u003eTeilnahmebedingungen\u003c/i\u003e, las condiciones de un contrato. Cuatro preguntas de opción múltiple (27-30) en 10 minutos.\u003cbr/\u003eLo difícil no es el contenido: es el \u003cb\u003eregistro\u003c/b\u003e. Los reglamentos usan tres recursos que en el habla no existen:\u003cbr/\u003e· \u003cb\u003ePasiva impersonal\u003c/b\u003e: \u003ci\u003eDie Gebühr \u003cb\u003ewird\u003c/b\u003e nicht \u003cb\u003eerstattet\u003c/b\u003e.\u003c/i\u003e (no «wir erstatten nicht»)\u003cbr/\u003e· \u003cb\u003eNominalización\u003c/b\u003e: \u003ci\u003eDie \u003cb\u003eAnmeldung\u003c/b\u003e erfolgt schriftlich.\u003c/i\u003e (no «man meldet sich an»)\u003cbr/\u003e· \u003cb\u003esein + zu + Infinitiv\u003c/b\u003e = obligación: \u003ci\u003eDie Gebühr \u003cb\u003eist\u003c/b\u003e zu \u003cb\u003eüberweisen\u003c/b\u003e\u003c/i\u003e = «hay que transferirla». Y su pareja: \u003cb\u003eSie sind verpflichtet, … zu …\u003c/b\u003e / \u003cb\u003eDas Rauchen ist [[untersagt|prohibido]]\u003c/b\u003e.\u003cbr/\u003eEstrategia: las preguntas casi siempre son \u003cb\u003ecasos concretos\u003c/b\u003e («te das de baja diez días antes: ¿qué recuperas?»). Localiza el apartado, lee la \u003cb\u003econdición\u003c/b\u003e (bis / ab / weniger als) y aplica. El error típico es leer el apartado correcto y equivocarse de plazo.18:T89c,"])</script><script>self.__next_f.push([1,"1. Anmeldung\u003cbr/\u003eDie Anmeldung erfolgt schriftlich oder online. Sie wird erst mit der Zahlung der Kursgebühr [[verbindlich|vinculante]]. Teilnehmende unter 18 Jahren benötigen die Unterschrift eines Erziehungsberechtigten.\u003cbr/\u003e\u003cbr/\u003e2. Gebühren\u003cbr/\u003eDie Kursgebühr ist bis spätestens sieben Tage vor Kursbeginn zu überweisen. Bei einer Anmeldung weniger als sieben Tage vor Kursbeginn ist der Betrag sofort fällig. Eine Ermässigung von 20 Prozent erhalten Schülerinnen und Schüler, Studierende sowie Personen, die eine Bescheinigung des RAV* vorlegen.\u003cbr/\u003e\u003cbr/\u003e3. Rücktritt\u003cbr/\u003eEin Rücktritt ist bis 14 Tage vor Kursbeginn kostenfrei möglich. Danach werden 50 Prozent der Gebühr [[einbehalten|retenidos]]. Ab dem ersten Kurstag ist eine Rückerstattung ausgeschlossen. Massgeblich ist der Eingang der schriftlichen Abmeldung, nicht das Datum des Poststempels.\u003cbr/\u003e\u003cbr/\u003e4. Unterricht\u003cbr/\u003eDie Teilnehmenden sind verpflichtet, mindestens 70 Prozent der Unterrichtsstunden zu besuchen. Wer weniger teilnimmt, erhält keine Teilnahmebestätigung. Das Essen in den Unterrichtsräumen ist untersagt; Getränke in verschliessbaren Flaschen sind erlaubt.\u003cbr/\u003e\u003cbr/\u003e5. Haftung\u003cbr/\u003eFür mitgebrachte Wertgegenstände wird nicht gehaftet. Für Schäden an Möbeln und Geräten haften die Teilnehmenden selbst.\u003cbr/\u003e\u003cbr/\u003e6. Ausfall\u003cbr/\u003eFällt eine Unterrichtsstunde aus Gründen aus, die die Schule zu vertreten hat, so wird sie nachgeholt. Ist das nicht möglich, wird die Gebühr anteilig erstattet. Bei weniger als sechs Anmeldungen kann die Schule den Kurs bis drei Tage vor Beginn absagen; in diesem Fall wird die volle Gebühr zurückgezahlt.\u003cbr/\u003e\u003cbr/\u003e7. Zertifikat\u003cbr/\u003eAm Ende des Kurses findet ein schriftlicher Test statt. Wer ihn besteht und die Anwesenheitspflicht erfüllt hat, bekommt ein Zeugnis. Eine Wiederholung des Tests ist einmal möglich und kostet 25 Franken.\u003cbr/\u003e\u003cbr/\u003e*Der Betrag ist fällig = hay que pagarlo ya. In der Schweiz wird in Franken bezahlt. *RAV = Regionales Arbeitsvermittlungszentrum, la oficina de empleo suiza (en Alemania sería la Agentur für Arbeit). Y fíjate en la ortografía: Ermässigung, massgeblich, verschliessbar — en Suiza no se usa la ß, siempre ss."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m12l4\",\"phaseId\":\"b1m12\",\"title\":\"Lesen Teil 5\",\"subtitle\":\"El texto normativo: reglamentos, condiciones y letra pequeña\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El idioma de los reglamentos\",\"itemIds\":[\"b1m1hausordnung\",\"b1m12gzteilnahmebedingungen\",\"b1m12gzverpflichtet\",\"b1m12gzuntersagt\",\"b1m6gebuehr\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Teil 5: 10 minutos, 4 ítems, y un alemán que no habla nadie\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m12l4e1\",\"type\":\"read\",\"prompt\":\"Lesen Teil 5 en formato real: lee las condiciones y resuelve los cuatro casos. Tienes 10 minutos.\",\"title\":\"Teilnahmebedingungen der Sprachschule (Auszug)\",\"source\":\"Sprachschule Aarau (CH) — Teilnahmebedingungen, Stand Januar\",\"text\":\"$18\",\"questions\":[{\"id\":\"b1m12l4e1q1\",\"q\":\"Wann ist die Anmeldung verbindlich?\",\"options\":[\"Sobald man das Formular abschickt\",\"Erst wenn die Kursgebühr bezahlt ist\",\"Am ersten Kurstag\"],\"answer\":1,\"why\":\"«Sie wird erst mit der Zahlung der Kursgebühr verbindlich.»\"},{\"id\":\"b1m12l4e1q2\",\"q\":\"Sie melden sich fünf Tage vor Kursbeginn an. Was gilt für die Zahlung?\",\"options\":[\"Sie haben noch sieben Tage Zeit\",\"Sie müssen sofort zahlen\",\"Sie zahlen erst am ersten Kurstag\"],\"answer\":1,\"inference\":true,\"why\":\"Cinco días es «weniger als sieben Tage vor Kursbeginn» → «ist der Betrag sofort fällig».\"},{\"id\":\"b1m12l4e1q3\",\"q\":\"Sie melden sich zehn Tage vor Kursbeginn schriftlich ab. Was passiert mit der Gebühr?\",\"options\":[\"Sie bekommen alles zurü
