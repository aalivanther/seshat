ningún sitio.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY para tu examen la decisión ya está tomada:\u003c/b\u003e LanguageCert es un examen británico. La ortografía que vas a ver en los textos es \u003ci\u003ecolour\u003c/i\u003e, \u003ci\u003erealise\u003c/i\u003e, \u003ci\u003ecentre\u003c/i\u003e, \u003ci\u003etravelling\u003c/i\u003e. La americana \u003cb\u003eno se penaliza\u003c/b\u003e si eres coherente de arriba abajo, pero lo sensato es no abrir esa puerta: escribe en británico, que es lo que estás aprendiendo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres diferencias de ortografía que cubren casi todo:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003e-our / -or\u003c/b\u003e: colo\u003cb\u003eur\u003c/b\u003e, favou\u003cb\u003er\u003c/b\u003eite, neighbou\u003cb\u003er\u003c/b\u003e · color, favorite, neighbor\u003cbr/\u003e· \u003cb\u003e-ise / -ize\u003c/b\u003e: real\u003cb\u003eise\u003c/b\u003e, organ\u003cb\u003eise\u003c/b\u003e, apolog\u003cb\u003eise\u003c/b\u003e · realize, organize, apologize\u003cbr/\u003e· \u003cb\u003e-re / -er\u003c/b\u003e: cent\u003cb\u003ere\u003c/b\u003e, met\u003cb\u003ere\u003c/b\u003e, theat\u003cb\u003ere\u003c/b\u003e · center, meter, theater\u003cbr/\u003e\u003cbr/\u003eY una de gramática que casi nadie te cuenta: en británico, \u003ci\u003e«I've just eaten»\u003c/i\u003e; en americano también vale \u003ci\u003e«I just ate»\u003c/i\u003e. En tu examen, present perfect."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l4\",\"phaseId\":\"enb1m7\",\"title\":\"Lift or elevator?\",\"subtitle\":\"Siete pares de palabras, una decisión — y la carta formal del módulo\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los siete pares, por el lado que aún no tienes\",\"itemIds\":[\"enb1m7elevator\",\"enb1m7apartment\",\"enb1m7standinline\",\"enb1m7thefall\",\"enb1m7trash\",\"enb1m7drugstore\",\"enb1m7vacation\",\"enb1m7beconsistent\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no elijas la mejor, elige UNA\",\"body\":\"$17\",\"table\":[[\"Reino Unido\",\"Estados Unidos\",\"Español\"],[\"the lift\",\"the elevator\",\"el ascensor\"],[\"a flat\",\"an apartment\",\"un piso\"],[\"to queue\",\"to stand in line\",\"hacer cola\"],[\"autumn\",\"the fall\",\"el otoño\"],[\"the rubbish\",\"the trash\",\"la basura\"],[\"the chemist's\",\"the drugstore\",\"la farmacia\"],[\"a holiday\",\"a vacation\",\"unas vacaciones\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las americanas con lo que significan\",\"pairs\":[{\"target\":\"the elevator\",\"source\":\"el ascensor (así, en EE. UU.)\"},{\"target\":\"an apartment\",\"source\":\"un piso (así, en EE. UU.)\"},{\"target\":\"the fall\",\"source\":\"el otoño (así, en EE. UU.)\"},{\"target\":\"the drugstore\",\"source\":\"la farmacia (así, en EE. UU.)\"},{\"target\":\"a vacation\",\"source\":\"unas vacaciones (así, en EE. UU.)\"}],\"itemIds\":[\"enb1m7elevator\",\"enb1m7apartment\",\"enb1m7thefall\",\"enb1m7drugstore\",\"enb1m7vacation\"],\"tip\":\"Estas cinco las vas a leer y a oír constantemente: en series, en manuales, en cualquier web con dominio .com. Reconocerlas es obligatorio; usarlas, opcional.\"},{\"id\":\"enb1m7l4e2\",\"type\":\"bucket\",\"prompt\":\"¿De qué lado del Atlántico es cada una?\",\"categories\":[\"Reino Unido\",\"Estados Unidos\"],\"items\":[{\"text\":\"the lift\",\"bucket\":0},{\"text\":\"the elevator\",\"bucket\":1},{\"text\":\"autumn\",\"bucket\":0},{\"text\":\"the fall\",\"bucket\":1},{\"text\":\"a flat\",\"bucket\":0},{\"text\":\"an apartment\",\"bucket\":1},{\"text\":\"the chemist's\",\"bucket\":0},{\"text\":\"the drugstore\",\"bucket\":1}],\"itemIds\":[\"enb1m7elevator\",\"enb1m7apartment\",\"enb1m7thefall\",\"enb1m7drugstore\",\"enautumn\",\"ena2m8thechemists\",\"enflat\"],\"tip\":\"Fíjate en «the chemist's» con apóstrofo y ese: es «la (tienda) del farmacéutico», igual que «the baker's» o «the butcher's». El americano no hace eso.\"},{\"id\":\"enb1m7l4e3\",\"type\":\"mc\",\"prompt\":\"La decisión práctica\",\"question\":\"En el Writing de tu examen, ¿qué haces con estas dos variedades?\",\"options\":[\"Elijo una y la mantengo en todo el texto\",\"Uso la británica para unas palabras y la americana para otras\",\"Uso solo americana porque es más internacional\"],\"answer\":0,\"whyWrong\":[null,\"Mezclar es exactamente lo que sí se nota. El criterio de vocabulario mira la coherencia, no la nacionalidad.\",\"El examen es británico y todo lo que has estudiado también. Cambiar de variedad ahora te haría dudar en cada línea.\"],\"itemIds\":[\"enb1m7beconsistent\"],\"tip\":\"«Be consistent» es el consejo entero. No es que una sea mejor: es que un texto tiene que sonar como si lo hubiera escrito una sola persona.\"},{\"id\":\"enb1m7l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa en inglés BRITÁNICO\",\"text\":\"The lift wasn't working, so I had to carry the shopping up to the ___ on the fourth floor.\",\"answers\":[\"flat\"],\"translation\":\"El ascensor no funcionaba, así que tuve que subir la compra al piso del cuarto.\",\"hints\":[\"La frase ya ha elegido variedad con «lift»\",\"f...\"],\"itemIds\":[\"enb1m7apartment\",\"enflat\"],\"tip\":\"La frase ya dice «lift», o sea que está en británico. Meter «apartment» ahí rompería la coherencia dentro de la misma oración: eso es lo que se penaliza.\"},{\"id\":\"enb1m7l4e5\",\"type\":\"errorfix\",\"prompt\":\"Aquí no hay ninguna palabra inventada: hay dos variedades mezcladas. Arréglalo en británico.\",\"wrong\":\"I took the lift up to my apartment.\",\"answers\":[\"I took the lift up to my flat.\"],\"why\":\"«lift» es británico y «apartment» es americano: la frase cambia de país a mitad de camino. En británico entero sería «the lift… my flat»; en americano entero, «the elevator… my apartment». Las dos valen; la mezcla no.\",\"translation\":\"Subí en ascensor a mi piso.\",\"itemIds\":[\"enb1m7apartment\",\"enflat\"]},{\"id\":\"enb1m7l4e6\",\"type\":\"transform\",\"prompt\":\"Cambia de orilla\",\"source\":\"In autumn I take the lift up to my flat.\",\"instruction\":\"Dilo entero en inglés americano\",\"answers\":[\"In the fall I take the elevator up to my apartment.\",\"In the fall, I take the elevator up to my apartment.\"],\"translation\":\"En otoño subo en ascensor a mi piso.\",\"hints\":[\"Tres palabras cambian: la estación, el aparato y la vivienda\",\"In the f... I take the e... up to my a...\"],\"itemIds\":[\"enb1m7thefall\",\"enb1m7elevator\",\"enb1m7apartment\"],\"tip\":\"Fíjate en que «autumn» va sin artículo y «the fall» lo lleva obligatoriamente. No es solo cambiar la palabra: cada variedad trae su gramática pegada.\"},{\"id\":\"enb1m7l4e7\",\"type\":\"gapbank\",\"prompt\":\"Los conectores de la carta formal — completa antes de escribir la tuya\",\"text\":\"I am writing about the Conversation Café advertised at the Community Hall. ___ I have lived in London for two years, I still find some accents very difficult. ___, my exam is in June, so I need the practice. I work on Saturday mornings, ___ I could only come after twelve. ___ the timetable, could you tell me whether the sessions are free?\",\"answers\":[\"Although\",\"In addition\",\"therefore\",\"Apart from\"],\"bank\":[\"Although\",\"In addition\",\"therefore\",\"Apart from\",\"Otherwise\",\"Due to\",\"Unless\"],\"translation\":\"Escribo por el Conversation Café anunciado en el centro cívico. Aunque llevo dos años en Londres, algunos acentos me siguen resultando muy difíciles. Además, tengo el examen en junio, así que necesito la práctica. Trabajo los sábados por la mañana, por lo que solo podría ir después de las doce. Aparte del horario, ¿podría decirme si las sesiones son gratuitas?\",\"itemIds\":[\"enb1m1although\",\"enb1m2apartfrom\",\"enb1m1therefore\",\"enb1m2dueto\"],\"tip\":\"Los cuatro que te salen aquí son los cuatro que necesitas en el modelo de dentro de un momento: concesión, adición, consecuencia y «dejando eso aparte».\"},{\"id\":\"enb1m7l4e8\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"En Estados Unidos hacen cola de otra manera y lo llaman de otra manera.\",\"answers\":[\"In the United States they stand in line instead of queueing\",\"In the United States people stand in line, not queue\",\"In America they stand in line instead of queueing\"],\"hints\":[\"El verbo americano lleva preposición dentro\",\"In the United States they stand in ...\"],\"itemIds\":[\"enb1m7standinline\",\"ena2m7thequeue\"],\"tip\":\"«queue» es verbo y sustantivo en británico («I queued for an hour»). El americano usa «line» de sustantivo y «wait in line» o «stand in line» de verbo.\"},{\"id\":\"enb1m7l4e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Traduce al español\",\"source\":\"Take the trash out before you go on vacation.\",\"answers\":[\"Saca la basura antes de irte de vacaciones\",\"Saca la basura antes de que te vayas de vacaciones\"],\"hint\":\"Las dos palabras clave son americanas\",\"itemIds\":[\"enb1m7trash\",\"enb1m7vacation\"],\"tip\":\"En británico la misma frase sería «Take the rubbish out before you go on holiday». Dos palabras, y ya sabes de qué lado del mapa viene el texto.\"},{\"id\":\"enb1m7l4e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el anuncio, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Has visto este anuncio en el tablón del centro cívico del barrio. Escribe para pedir información. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Anuncio en el tablón del Community Hall\",\"text\":\"CONVERSATION CAFÉ — Practise your English with speakers from Scotland, Ireland, the USA, Australia and India. Saturdays, 11 a.m., Community Hall. All levels welcome. For details, write to the Community Hall.\"},\"bullets\":[\"Di de qué actividad escribes y dónde has visto el anuncio.\",\"Pregunta DOS cosas concretas, con pregunta incrustada y no directa.\",\"Pide que te contesten.\"],\"checks\":[{\"re\":\"(advertis|noticeboard|notice|poster)\",\"label\":\"Dices de qué actividad hablas y dónde la has visto\"},{\"re\":\"(could you tell me|i was wondering|would like to know|do you know)\",\"label\":\"Preguntas con una pregunta incrustada, no con una directa\"},{\"re\":\"(hearing from you|hear from you|get back to me|let me know|contact me)\",\"label\":\"Pides que te contesten\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — sin nombre, porque el anuncio no lo da\",\"Por qué escribes: «I am writing about the Conversation Café advertised…»\",\"Quién eres, en una línea: «Although I have lived in London for…, I still…»\",\"Punto 2 — tus dos preguntas: «Could you tell me whether…, and how much…?»\",\"Un dato tuyo con conector: «In addition, I work on…, therefore…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"therefore\",\"in addition\",\"apart from\",\"otherwise\",\"due to\",\"while\",\"since\",\"on the other hand\",\"besides\",\"for instance\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the Conversation Café advertised on the noticeboard at the Community Hall. Although I have lived in London for two years, I still find some accents difficult, and my exam is in June.\\nCould you tell me whether I need to book a place, and how much each session costs? In addition, I work on Saturday mornings, therefore I could only come after twelve.\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m7accent\",\"enb1m1although\",\"enb1m1therefore\",\"enb1m1havelivedhere\",\"enb1m3couldyoutellme\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y mira la ortografía del modelo — «Café», «noticeboard», «practise» con ese en el anuncio: británico de arriba abajo, sin una sola americana suelta.\"},{\"id\":\"enb1m7l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la misma escena, dos veces\",\"text\":\"I took the lift up to my flat. I took the elevator up to my apartment.\",\"phonetic\":\"ai tuk de lift ap tu mai flat · ai tuk di É-le-vei-ta ap tu mai a-PAAT-ment\",\"translation\":\"Subí en ascensor a mi piso. (británico y americano)\",\"itemIds\":[\"enb1m7elevator\",\"enb1m7apartment\",\"enflat\"],\"tip\":\"Dilas seguidas y escúchate: son la misma frase. Lo único que has cambiado es de qué país es tu inglés durante ocho palabras.\"},{\"id\":\"enb1m7l4e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"The chemist's is closed, but there's another one by the station.\",\"translation\":\"La farmacia está cerrada, pero hay otra al lado de la estación.\",\"hints\":[\"Empieza por la palabra británica para farmacia, con apóstrofo\",\"The c...'s is closed, but ...\"],\"itemIds\":[\"ena2m8thechemists\",\"enstation\"],\"tip\":\"«chemist's» acaba en el sonido /s/ y le sigue «is»: se pega todo. Si esperas dos palabras separadas, no las vas a oír nunca.\"},{\"id\":\"enb1m7l4e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Hi, it's Marco, from apartment 4B. Listen, the elevator's out again, and the super says it won't be fixed till Thursday. I know you've got the boxes coming up this weekend. If you want, I can give you a hand with them Saturday morning, before I leave for vacation.\",\"question\":\"¿De qué variedad del inglés es este mensaje, y por qué se sabe?\",\"options\":[\"Americana: apartment, elevator y vacation\",\"Británica: dice «give you a hand»\",\"No se puede saber por el vocabulario\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«give someone a hand» se dice en las dos orillas: no distingue nada.\",\"Sí se puede, y aquí hay tres marcas en treinta segundos. Ese es el ejercicio.\"],\"itemIds\":[\"enb1m7apartment\",\"enb1m7elevator\",\"enb1m7vacation\"],\"tip\":\"Tres palabras y ya sabes dónde estás. Eso, en el Listening, sirve para lo mismo que un mapa: te dice qué otras palabras esperar en los treinta segundos siguientes.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m7-3\",\"book\":\"I took the lift up to my flat in autumn.\",\"real\":\"I took the elevator up to my apartment in the fall.\",\"meaning\":\"Subí en ascensor a mi piso, en otoño.\",\"when\":\"La columna de la derecha es lo normal en Estados Unidos y Canadá, y lo vas a leer y oír todos los días en internet. Fuera de Norteamérica no se usa, y en tu examen —británico— tampoco.\",\"register\":\"regional\",\"exam\":\"In autumn I went up to the flat in the lift.\",\"note\":\"Lo que puntúa aquí no es cuál eliges: es no mezclarlas. Un texto con «lift» y «apartment» en la misma línea no es de ningún país, y el criterio de vocabulario lo nota. Elige una variedad al empezar el examen y no la sueltes.\",\"sound\":\"ai tuk di É-le-vei-ta ap tu mai a-PAAT-ment in de fool\",\"level\":\"b1\",\"produce\":false,\"itemId\":\"enb1m7natelevator\"}}],\"resources\":[{\"label\":\"Cambridge Dictionary — entrada de cualquier palabra\",\"url\":\"https://dictionary.cambridge.org/\",\"note\":\"Busca «lift» y «elevator» y fíjate en las etiquetas UK / US y en los dos audios de cada entrada. Es la manera más rápida de comprobar de qué orilla es una palabra que te encuentras.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/s
