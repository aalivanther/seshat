 uno ochenta», «pesa dos kilos». En inglés el que mide es \u003cb\u003ebe\u003c/b\u003e y el que pesa es \u003cb\u003eweigh\u003c/b\u003e:\u003cbr/\u003e• \u003ci\u003eI'm one metre eighty.\u003c/i\u003e — nunca \u003ci\u003eI measure…\u003c/i\u003e\u003cbr/\u003e• \u003ci\u003eIt weighs two kilos.\u003c/i\u003e — nunca \u003ci\u003eIt has two kilos.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY ojo a \u003cb\u003eweigh\u003c/b\u003e, que se escribe fatal y se dice fácil: «\u003cb\u003euéi\u003c/b\u003e», y con la -s de tercera persona «\u003cb\u003euéis̬\u003c/b\u003e». La gh no suena, igual que en \u003ci\u003eeight\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l6\",\"phaseId\":\"ena2m4\",\"title\":\"How tall? How heavy?\",\"subtitle\":\"Medir cosas: altura, peso, capacidad y temperatura\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Preguntar y decir cuánto\",\"itemIds\":[\"ena2m4howtallareyou\",\"ena2m4onemetreeighty\",\"ena2m4howheavyisit\",\"ena2m4itweighstwokilos\",\"ena2m4halfalitre\",\"ena2m4itstwentydegrees\",\"ena2m4howbigisit\",\"entall\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«How + adjetivo»: una sola fórmula para todas las medidas\",\"body\":\"$17\",\"table\":[[\"qué mides\",\"la pregunta\",\"la respuesta\"],[\"altura\",\"How tall are you?\",\"I'm one metre eighty.\"],[\"peso\",\"How heavy is it?\",\"It weighs two kilos.\"],[\"capacidad\",\"How big is the bottle?\",\"It's half a litre.\"],[\"temperatura\",\"What's the temperature?\",\"It's twenty degrees.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y ahora la parte rara: en Reino Unido conviven dos sistemas\",\"body\":\"Esto no es gramática, es supervivencia. En Reino Unido el sistema métrico es el oficial \u003cb\u003ey aun así\u003c/b\u003e la gente usa el viejo para unas cuantas cosas concretas:\u003cbr/\u003e\u003cbr/\u003e• \u003cb\u003eLa altura de las personas\u003c/b\u003e va en pies y pulgadas: «\u003ci\u003eI'm five foot ten\u003c/i\u003e» (1,78 m). Si dices \u003ci\u003eone metre seventy-eight\u003c/i\u003e te entienden perfectamente, pero te van a mirar como al del continente.\u003cbr/\u003e• \u003cb\u003eEl peso de las personas\u003c/b\u003e va en \u003ci\u003estones\u003c/i\u003e: «\u003ci\u003eI'm eleven stone\u003c/i\u003e» (unos 70 kg).\u003cbr/\u003e• \u003cb\u003eLas distancias en carretera\u003c/b\u003e van en millas, y los carteles también.\u003cbr/\u003e• \u003cb\u003eLa leche y la cerveza\u003c/b\u003e van en \u003ci\u003epints\u003c/i\u003e (algo más de medio litro).\u003cbr/\u003e• Pero \u003cb\u003ela comida del supermercado\u003c/b\u003e va en kilos y gramos, y el tiempo en \u003cb\u003egrados centígrados\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué haces tú con esto:\u003c/b\u003e nada, más que reconocerlo. Para el examen te basta con el sistema métrico, que es el que usan las escuchas. Lo de arriba está aquí para que, cuando alguien te diga «\u003ci\u003eI'm six foot two\u003c/i\u003e», no te quedes en blanco.\",\"table\":[[\"en la calle británica\",\"en el examen\",\"para qué\"],[\"five foot ten\",\"one metre seventy-eight\",\"altura de personas\"],[\"eleven stone\",\"seventy kilos\",\"peso de personas\"],[\"twenty miles\",\"thirty kilometres\",\"distancias\"],[\"a pint of milk\",\"half a litre\",\"líquidos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l6e1\",\"type\":\"match\",\"prompt\":\"Empareja cada pregunta con lo que mide\",\"pairs\":[{\"target\":\"How tall are you?\",\"source\":\"la altura de una persona\"},{\"target\":\"How heavy is it?\",\"source\":\"el peso\"},{\"target\":\"How big is it?\",\"source\":\"el tamaño, en general\"},{\"target\":\"How old is it?\",\"source\":\"la antigüedad\"}],\"itemIds\":[\"ena2m4howtallareyou\",\"ena2m4howheavyisit\",\"ena2m4howbigisit\",\"enhowold\"]},{\"id\":\"ena2m4l6e2\",\"type\":\"mc\",\"prompt\":\"«¿Cuánto mides?»\",\"question\":\"¿Cómo se pregunta la altura de una persona?\",\"options\":[\"How tall are you?\",\"How much do you measure?\",\"How much height have you?\"],\"answer\":0,\"whyWrong\":[null,\"measure existe, pero se usa para medir objetos con una cinta métrica, no para preguntar la estatura de alguien\",\"Ni have ni height entran aquí: el inglés lo resuelve con how + adjetivo\"],\"itemIds\":[\"ena2m4howtallareyou\"],\"tip\":\"Y la respuesta también va con be: I'm one metre eighty. En inglés no «mides» tu altura, la eres.\"},{\"id\":\"ena2m4l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta\",\"text\":\"___ tall is Ben?\",\"answers\":[\"How\"],\"translation\":\"¿Cuánto mide Ben?\",\"hints\":[\"Es la palabra que abre todas las preguntas de medida\",\"H…\"],\"itemIds\":[\"ena2m4howtallareyou\",\"entall\"]},{\"id\":\"ena2m4l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el verbo del peso\",\"text\":\"The bag ___ two kilos.\",\"answers\":[\"weighs\"],\"translation\":\"La bolsa pesa dos kilos.\",\"hints\":[\"Se dice «uéis̬» y se escribe con -gh en medio\",\"It w…\"],\"itemIds\":[\"ena2m4itweighstwokilos\"]},{\"id\":\"ena2m4l6e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el verbo — el «tener» español otra vez\",\"wrong\":\"It has two kilos.\",\"answers\":[\"It weighs two kilos.\"],\"why\":\"En español el peso «se tiene» a veces («tiene dos kilos»), pero en inglés el peso se PESA: weigh. Es la misma familia de errores que «I have 25 years» en lugar de «I'm 25»: el have español metiéndose donde no lo llaman.\",\"translation\":\"Pesa dos kilos.\",\"itemIds\":[\"ena2m4itweighstwokilos\"]},{\"id\":\"ena2m4l6e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la temperatura\",\"wrong\":\"There are twenty degrees today.\",\"answers\":[\"It's twenty degrees today.\"],\"why\":\"El español dice «hay veinte grados» o «hace veinte grados», y de ahí sale el there are. El inglés usa el it del tiempo, el mismo de It's raining y de It's cold, que traes del A1: It's twenty degrees.\",\"translation\":\"Hoy hace veinte grados.\",\"itemIds\":[\"ena2m4itstwentydegrees\",\"enitscold\",\"entwenty\"]},{\"id\":\"ena2m4l6e7\",\"type\":\"bucket\",\"prompt\":\"¿Esta medida es de tamaño o de peso y capacidad?\",\"categories\":[\"altura, largo, tamaño\",\"peso y capacidad\"],\"items\":[{\"text\":\"one metre eighty\",\"bucket\":0},{\"text\":\"two kilos\",\"bucket\":1},{\"text\":\"half a litre\",\"bucket\":1},{\"text\":\"twenty centimetres\",\"bucket\":0},{\"text\":\"five hundred grams\",\"bucket\":1},{\"text\":\"six foot two\",\"bucket\":0}],\"itemIds\":[\"ena2m4onemetreeighty\",\"ena2m4itweighstwokilos\",\"ena2m4halfalitre\"],\"tip\":\"«six foot two» es la altura de una persona a la británica: seis pies y dos pulgadas, o sea 1,88 m. Fíjate en que foot va en singular ahí, aunque sean seis.\"},{\"id\":\"ena2m4l6e8\",\"type\":\"audiomc\",\"prompt\":\"Cazar la medida — 2 escuchas\",\"audio\":\"The blue bag is bigger, but it weighs three kilos. The black one is smaller and it only weighs one kilo, so I took the black one.\",\"question\":\"¿Cuánto pesa la bolsa que se llevó?\",\"options\":[\"Un kilo\",\"Tres kilos\",\"Dos kilos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Tres kilos es la azul, la que NO se llevó\",\"Dos kilos no sale en el audio\"],\"itemIds\":[\"ena2m4itweighstwokilos\",\"ena2m4biggerthanmine\",\"ena2m2hetookthetrain\"],\"tip\":\"El audio te da dos datos y una decisión al final. Esa estructura —dos opciones y una elegida— es la del Listening del A2 casi siempre: escucha hasta el final antes de marcar.\"},{\"id\":\"ena2m4l6e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"¿Cuánto pesa? Pesa dos kilos.\",\"answers\":[\"How heavy is it? It weighs two kilos.\",\"How much does it weigh? It weighs two kilos.\"],\"hint\":\"la pregunta empieza por How\",\"itemIds\":[\"ena2m4howheavyisit\",\"ena2m4itweighstwokilos\"]},{\"id\":\"ena2m4l6e10\",\"type\":\"listen\",\"prompt\":\"Dictado — una medida y una temperatura\",\"text\":\"It's half a litre and it's four degrees.\",\"translation\":\"Es medio litro y está a cuatro grados.\",\"hints\":[\"half se dice «jaaf»: la l no suena\",\"It's h… a l… and it's four d…\"],\"itemIds\":[\"ena2m4halfalitre\",\"ena2m4itstwentydegrees\"]},{\"id\":\"ena2m4l6e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la medida y la comparación juntas\",\"text\":\"I'm one metre eighty, and my sister is taller than me.\",\"phonetic\":\"áim uan MÍI-ta ÉI-ti, and mái SÍS-ta is̬ TÓO-la dan mii\",\"translation\":\"Mido uno ochenta, y mi hermana es más alta que yo.\",\"itemIds\":[\"ena2m4onemetreeighty\",\"ena2m4olderthanme\",\"entall\",\"ensister\"],\"tip\":\"taller también lleva la -er floja: TÓO-la, no «tó-ler». Y fíjate en que la medida va con am y la comparación con is: dos veces el verbo be y ni un measure.\"},{\"id\":\"ena2m4l6e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Cuánto pesa? Pesa dos kilos y es más pequeño que el otro.\",\"answers\":[\"How heavy is it? It weighs two kilos and it's smaller than the other one.\",\"How much does it weigh? It weighs two kilos and it's smaller than the other one.\",\"How heavy is it? It weighs two kilos, and it's smaller than the other one.\"],\"hints\":[\"Pregunta de medida + peso con weigh + comparación con -er y than\",\"How h… is it? It w… two kilos and it's sm… th… the other one.\"],\"itemIds\":[\"ena2m4howheavyisit\",\"ena2m4itweighstwokilos\",\"ena2m4cheaperthan\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m4-4\",\"book\":\"It's very big.\",\"real\":\"It's massive.\",\"meaning\":\"Es enorme\",\"when\":\"Con amigos, para cualquier cosa grande de verdad: un piso, una maleta, una cola. Es de las palabras más usadas del inglés británico coloquial. En el examen escrito, very big o really big.\",\"register\":\"amigos\",\"note\":\"La familia entera funciona igual: massive (enorme), tiny (diminuto), freezing (helado), boiling (achicharrante). Son adjetivos que ya llevan el «muy» dentro, así que no admiten v
