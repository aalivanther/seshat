ij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T82f,"])</script><script>self.__next_f.push([1,"En la conversación real, el inglés \u003cb\u003ese come el principio de las frases\u003c/b\u003e cuando el que escucha puede reponerlo solo. Tiene nombre: \u003cb\u003eellipsis\u003c/b\u003e. No es habla descuidada — es habla eficiente, y la oyes cien veces al día.\u003cbr/\u003e\u003cbr/\u003e· \u003ci\u003eI have got to go\u003c/i\u003e → \u003cb\u003eGot to go.\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eThat sounds good\u003c/i\u003e → \u003cb\u003eSounds good.\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eDo you fancy a coffee?\u003c/i\u003e → \u003cb\u003eFancy a coffee?\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eHave you seen my keys?\u003c/i\u003e → \u003cb\u003eSeen my keys?\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eLo que cae es siempre lo mismo: el \u003cb\u003esujeto\u003c/b\u003e (I, that, you) y el \u003cb\u003eauxiliar\u003c/b\u003e (have, do). Y cae porque no hace falta: si te lo digo a la cara, ya sabes de quién hablo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo importante para ti es RECONOCERLO.\u003c/b\u003e Un alumno entrenado solo con frases completas oye «Fancy a coffee?» y no la encuentra en su memoria, porque él la guardó como «Do you fancy…». Y por eso se queda callado medio segundo de más. Producirlo es opcional; entenderlo, no.\u003cbr/\u003e\u003cbr/\u003eEn el \u003cb\u003eexamen escrito\u003c/b\u003e, frase completa siempre. En el Speaking, la elipsis no penaliza y suena natural.\u003cbr/\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eSegunda mitad, y es la de emergencia.\u003c/b\u003e Cuando no entiendes algo tienes \u003cb\u003ecuatro movimientos\u003c/b\u003e, los cuatro educados, y hay que tenerlos automáticos:\u003cbr/\u003e1. \u003cb\u003ePide repetición\u003c/b\u003e — \u003ci\u003e«Sorry, could you say that again?»\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003ePide velocidad\u003c/b\u003e — \u003ci\u003e«Could you speak a bit more slowly, please?»\u003c/i\u003e (\u003cb\u003eslowly\u003c/b\u003e, con -ly: es adverbio)\u003cbr/\u003e3. \u003cb\u003ePide otras palabras\u003c/b\u003e — \u003ci\u003e«Could you put it another way?»\u003c/i\u003e · \u003ci\u003e«What does that mean?»\u003c/i\u003e\u003cbr/\u003e4. \u003cb\u003eConfirma lo que has pillado\u003c/b\u003e — \u003ci\u003e«So you're saying…?»\u003c/i\u003e · \u003ci\u003e«In other words, …»\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl cuarto es el que más vale. El descriptor oficial del B1 dice literalmente que el candidato \u003cb\u003e«can repeat back part of what someone has said to confirm mutual understanding»\u003c/b\u003e: devolver lo entendido no es admitir una derrota, \u003cb\u003ees un punto del criterio\u003c/b\u003e. Y en la calle hace lo mismo: te da tiempo y ordena la conversación.\u003cbr/\u003e\u003cbr/\u003eLo que \u003cb\u003eno\u003c/b\u003e vale es asentir sin entender. Sale más caro cada vez."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m7l8\",\"phaseId\":\"enb1m7\",\"title\":\"Got to go. Sounds good.\",\"subtitle\":\"El inglés hablado se come el principio de las frases — y qué decir cuando no entiendes\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Frases mochas y peticiones de auxilio\",\"itemIds\":[\"enb1m7gottago\",\"enb1m7soundsgood\",\"enb1m7fancyacoffee\",\"enb1m7speakmoreslowly\",\"enb1m7whatdoesthatmean\",\"enb1m7putitanotherway\",\"enb1m7inotherwords\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: se cae lo que se puede reconstruir\",\"body\":\"$17\",\"table\":[[\"Cuando no entiendes\",\"Lo que dices\"],[\"quieres que lo repita\",\"Sorry, could you say that again?\"],[\"va demasiado rápido\",\"Could you speak a bit more slowly, please?\"],[\"una palabra suelta te bloquea\",\"What does that mean?\"],[\"la frase entera te bloquea\",\"Could you put it another way?\"],[\"crees que lo has pillado\",\"So you're saying…? / In other words, …\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m7l8e1\",\"type\":\"match\",\"prompt\":\"Empareja la frase mocha con lo que quiere decir\",\"pairs\":[{\"target\":\"Got to go.\",\"source\":\"Me tengo que ir.\"},{\"target\":\"Sounds good.\",\"source\":\"Me parece bien.\"},{\"target\":\"Fancy a coffee?\",\"source\":\"¿Te apetece un café?\"},{\"target\":\"In other words, you're not coming.\",\"source\":\"O sea, que no vienes.\"}],\"itemIds\":[\"enb1m7gottago\",\"enb1m7soundsgood\",\"enb1m7fancyacoffee\",\"enb1m7inotherwords\"],\"tip\":\"Las tres primeras han perdido el sujeto y el auxiliar. Si las buscas en tu memoria por la forma completa, no las vas a encontrar a tiempo: guárdalas así, cortas.\"},{\"id\":\"enb1m7l8e2\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál has oído: la del libro o la de la calle?\",\"book\":\"I have got to go now.\",\"real\":\"Got to go.\",\"translation\":\"Me tengo que ir.\",\"itemIds\":[\"enb1m7gottago\"],\"tip\":\"Las dos significan lo mismo y las dos son correctas. La de arriba la escribes; la de abajo la oyes. Confundir cuál va dónde es lo que baja el criterio de registro.\"},{\"id\":\"enb1m7l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa la frase mocha\",\"text\":\"— We could go on Saturday morning. — ___ good. See you at ten.\",\"answers\":[\"Sounds\"],\"translation\":\"— Podríamos ir el sábado por la mañana. — Me parece bien. Nos vemos a las diez.\",\"hints\":[\"Ha desaparecido el sujeto «That»\",\"S...\"],\"itemIds\":[\"enb1m7soundsgood\"],\"tip\":\"Fíjate en que el verbo sigue en tercera persona («sounds»), aunque el sujeto ya no esté. La -s es lo único que queda del «that» que se ha caído.\"},{\"id\":\"enb1m7l8e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Could you speak more slow, please?\",\"answers\":[\"Could you speak more slowly, please?\"],\"why\":\"«speak» es un verbo, así que lo que lo modifica es un adverbio: slowly, no slow. En español «despacio» sirve para las dos cosas; en inglés hay que ponerle el -ly.\",\"translation\":\"¿Puede hablar más despacio, por favor?\",\"itemIds\":[\"enb1m7speakmoreslowly\"]},{\"id\":\"enb1m7l8e5\",\"type\":\"transform\",\"prompt\":\"Aquí no basta con cambiar una palabra: la pregunta entera está mal montada\",\"source\":\"What means that?\",\"instruction\":\"Móntala bien, con auxiliar\",\"answers\":[\"What does that mean?\"],\"translation\":\"¿Qué significa eso?\",\"hints\":[\"En inglés la pregunta necesita «does», y detrás el verbo desnudo\",\"What d... that m...?\"],\"itemIds\":[\"enb1m7whatdoesthatmean\"],\"tip\":\"El calco es directo: «¿qué significa eso?» no lleva auxiliar en español. En inglés sí, y además el verbo pierde la -s porque ya la lleva el «does».\"},{\"id\":\"enb1m7l8e6\",\"type\":\"build\",\"prompt\":\"Construye la frase de emergencia\",\"target\":\"Sorry, I didn't catch that\",\"translation\":\"Perdona, no te he pillado\",\"distractors\":[\"don't\",\"take\"],\"itemIds\":[\"enb1m3didntcatch\"],\"tip\":\"«catch» aquí no es coger nada: es pillar lo que alguien ha dicho. Y va en pasado —didn't catch— porque se refiere al segundo que acaba de pasar.\"},{\"id\":\"enb1m7l8e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «put» ni «another»\",\"source\":\"Could you put it another way?\",\"forbid\":[\"put\",\"another\"],\"answers\":[\"Could you say it in a different way?\",\"Could you explain it differently?\",\"What do you mean exactly?\"],\"translation\":\"¿Me lo puedes decir de otra manera?\",\"hints\":[\"El adjetivo que significa «distinto»\",\"Could you say it in a d... way?\"],\"itemIds\":[\"enb1m7putitanotherway\",\"enb1m7whatdoesthatmean\"],\"tip\":\"Tres salidas para el mismo apuro. Si en el examen se te bloquea una, la siguiente sale sola — y el examinador no ve el bloqueo, ve a alguien que se reformula.\"},{\"id\":\"enb1m7l8e8\",\"type\":\"gapbank\",\"prompt\":\"Las cuatro maneras de pedir auxilio — complétalas\",\"text\":\"If you don't catch something, you have four moves and all four are polite. You can ask for a repeat: Sorry, could you say that ___ ? You can ask for speed: Could you speak a bit more ___ , please? You can ask for different words: Could you put it another ___ ? And you can check what you understood: So you're ___ we meet at six?\",\"answers\":[\"again\",\"slowly\",\"way\",\"saying\"],\"bank\":[\"again\",\"slowly\",\"way\",\"saying\",\"slow\",\"word\",\"telling\"],\"translation\":\"Si no pillas algo, tienes cuatro movimientos y los cuatro son educados. Puedes pedir que lo repitan: perdona, ¿lo puedes decir otra vez? Puedes pedir velocidad: ¿puedes hablar un poco más despacio, por favor? Puedes pedir otras palabras: ¿me lo puedes decir de otra manera? Y puedes comprobar lo que has entendido: entonces, ¿dices que quedamos a las seis?\",\"itemIds\":[\"encanyousaythatagain\",\"enb1m7speakmoreslowly\",\"enb1m7putitanotherway\",\"enb1m3sowhatyouresaying\"],\"tip\":\"El segundo hueco es la trampa: «slow» está en el banco a propósito. Detrás de un verbo va el adverbio, y el adverbio lleva -ly.\"},{\"id\":\"enb1m7l8e9\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, tiene una prima australiana en casa y no entiende ni la mitad de lo que dice. Contéstale tratando LAS TRES cosas que te pide, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hiya! My cousin from Melbourne landed on Friday and I've just had her on the phone — arvo, brekkie, heaps, no worries. I understood about half. Did you have this when you first got to London?? What do you actually DO when you don't understand? And are you still up for a weekend in October?\"},\"bullets\":[\"Cuéntale cómo te pasó a ti al principio, con un ejemplo concreto.\",\"Dile qué se hace de verdad cuando no entiendes.\",\"Contéstale a lo de octubre y propón un plan.\"],\"checks\":[{\"re\":\"(when i got here|at first|my first|the same|i was exactly)\",\"label\":\"Le cuentas cómo te pasó a ti, con un ejemplo\"},{\"re\":\"(repeat|slow down|say it back|so you'?re saying|put it another way)\",\"label\":\"Le dices qué se hace cuando no entiendes\"},{\"re\":\"(let me know|tell me|i'?m free|we could|shall we|why don'?t we)\",\"label\":\"Contestas a lo de octubre y propones un plan\"}],\"frame\":[\"Saludo: «Hi Emma,» y una línea que la tranquilice\",\"Punto 1 — cómo te pasó a ti: un ejemplo concreto de tu primera semana\",\"Punto 2 — qué se hace: pedir repetición, pedir velocidad, devolver lo entendido\",\"Un matiz con conector: «though…» / «Apart from…» / «At least…»\",\"Punto 3 — octubre: «Anyway, …» + un plan concreto\",\"Tu nombre a secas. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"though\",\"although\",\"anyway\",\"actually\",\"at least\",\"apart from\",\"in addition\",\"while\",\"on the other hand\",\"since\",\"otherwise\",\"all in all\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nDon't panic, because I was exactly the same when I got here. In my first week at the café a customer asked me something twice and I just smiled and nodded, which is the worst thing you can do.\\nWhat works is boring but it works. Ask for a repeat, ask her to slow down, and then say it back: \\\"So you're saying half past six, yeah?\\\" Nobody has ever minded, though I was terrified the first ten times.\\nAnyway, October is fine for me. Apart from the fifteenth I'm free every weekend, so let me know your dates and I'll book the train.\\nValeria\",\"itemIds\":[\"enb1m7speakmoreslowly\",\"enb1m3sowhatyouresaying\",\"enb1m3anyway\",\"enb1m2apartfrom\",\"encanyousaythatagain\"],\"tip\":\"Cuenta las palabras: 100-120. Y fíjate en el modelo — tres conectores distintos (though, Anyway, Apart from), un «So you're saying…» que es literalmente lo que puntúa en el oral, y ni un «Yours sincerely»: meter la despedida formal en una carta a una amiga baja el criterio de registro.\"},{\"id\":\"enb1m7l8e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¿Puede hablar un poco más despacio, por favor?\",\"answers\":[\"Could you speak a bit more slowly, please?\",\"Could you speak a little more slowly, please?\",\"Could you speak more slowly, please?\"],\"hint\":\"El adverbio del final lleva su terminación entera\",\"itemIds\":[\"enb1m7speakmoreslowly\"],\"tip\":\"El «a bit» de en medio no sobra: sin él, «Could you speak more slowly» suena a orden. Con él, a petición. Media palabra y cambia el registro.\"},{\"id\":\"enb1m7l8e11\",\"type\":\"type\",\"prompt\":\"Producción\",\"question\":\"O sea, que no vienes.\",\"answers\":[\"In other words, you're not coming\",\"In other words, you are not coming\",\"So you're saying you're not coming\"],\"hints\":[\"Tres palabras antes de la coma\",\"In o... w..., you're not coming\"],\"itemIds\":[\"enb1m7inotherwords\",\"enb1m3sowhatyouresaying\"],\"tip\":\"«In other words» resume lo que ha dicho el otro con tus palabras. Es la herramienta de confirmación más útil que tienes y la que el descriptor del B1 nombra expresamente.\"},{\"id\":\"enb1m7l8e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las cuatro de emergencia, seguidas\",\"text\":\"Sorry, could you say that again? Could you speak a bit more slowly, please? What does that mean? So you're saying we meet at six?\",\"phonetic\":\"SÓ-ri, kud yu sei dat a-GUÉN · kud yu spiik a bit moo SLÓU-li, plíis̬ · uot das dat miin · sóu yoo SÉI-ing ui miit at siks\",\"translation\":\"Perdona, ¿lo puedes repetir? · ¿Puede hablar un poco más despacio, por favor? · ¿Qué significa eso? · Entonces, ¿dices que quedamos a las seis?\",\"itemIds\":[\"encanyousaythatagain\",\"enb1m7speakmoreslowly\",\"enb1m7whatdoesthatmean\",\"enb1m3sowhatyouresaying\"],\"tip\":\"Dilas hasta que salgan sin pensar. El día que te bloquees de verdad no vas a tener tiempo de construirlas: o están hechas o te callas.\"},{\"id\":\"enb1m7l8e13\",\"type\":\"audiomc\",\"prompt\":\"Escucha y responde. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Right, so, Fancy a coffee before we start? No? Fair enough. Got to go over the numbers with Priya at eleven anyway, so let's say quarter past, and then we'll do the rota. Sounds good? Great. Oh, and bring the folder, will you.\",\"question\":\"¿A qué hora van a verse?\",\"options\":[\"A las once y cuarto\",\"A las once\",\"A la hora del café\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"A las once tiene otra cosa: repasar los números con Priya. Por eso propone más tarde.\",\"El café es lo que ofrece al principio y el otro lo rechaza («No? Fair enough»).\"],\"itemIds\":[\"enb1m7fancyacoffee\",\"enb1m7gottago\",\"enb1m7soundsgood\"],\"tip\":\"Tres frases mochas seguidas: «Fancy a coffee?», «Got to go over…» y «Sounds good?». Si tu oído las busca completas, se te va el dato de la hora mientras las reconstruyes.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m7-4\",\"book\":\"Please deal with this.\",\"real\":\"Please do the needful.\",\"meaning\":\"Haga lo que haga falta.\",\"when\":\"En correos de trabajo en la India y en buena parte del sur de Asia: es una fórmula de cierre normal y educada, ni antigua ni graciosa. Fuera de allí no se usa, y en tu examen tampoco.\",\"register\":\"regional\",\"exam\":\"Please could you deal with this?\",\"note\":\"El inglés de la India es lengua propia de más gente que el de Reino Unido y Australia juntos, así que esto no es una curiosidad: es una de las variedades que más vas a leer en un correo de trabajo. «Revert» por «contestar» y «prepone» —lo contrario de «postpone»— vienen del mismo sitio y son igual de correctos allí.\",\"sound\":\"plíis̬ du de NÍID-ful\",\"level\":\"b1\",\"produce\":false,\"itemId\":\"enb1m7natneedful\"}}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever Writing (practice paper)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Mira solo la Tarea 2 del Writing: la carta informal de 100-120 palabras. Cuenta las palabras del modelo oficial y compáralas con las del tuyo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</scrip
