\u003edelante del sustantivo\u003c/b\u003e (\u003ci\u003eenough bins\u003c/i\u003e). Es la única palabra del inglés que cambia de lado según lo que acompañe, y por eso se falla tanto.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo nuevo de hoy — la coletilla:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003etoo/enough + to + infinitivo\u003c/b\u003e: \u003ci\u003eIt's too expensive \u003cb\u003eto buy\u003c/b\u003e new.\u003c/i\u003e / \u003ci\u003eIt's cheap enough \u003cb\u003eto buy\u003c/b\u003e two.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003etoo/enough + for + persona\u003c/b\u003e: \u003ci\u003eIt's cheap enough \u003cb\u003efor us\u003c/b\u003e.\u003c/i\u003e / \u003ci\u003eIt's too expensive \u003cb\u003efor me\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e· Y los dos juntos: \u003ci\u003eIt's too expensive \u003cb\u003efor us to buy\u003c/b\u003e new.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco número uno:\u003c/b\u003e «demasiado caro» NO es \u003cmark class=\"akk\"\u003etoo much expensive\u003c/mark\u003e. \u003cb\u003etoo much\u003c/b\u003e solo va con \u003cb\u003esustantivos incontables\u003c/b\u003e (\u003ci\u003etoo much packaging\u003c/i\u003e) y \u003cb\u003etoo many\u003c/b\u003e con contables en plural (\u003ci\u003etoo many bottles\u003c/i\u003e). Delante de un adjetivo va \u003cb\u003etoo\u003c/b\u003e a secas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY tres incontables que este módulo usa a todas horas\u003c/b\u003e, para que no les pongas -s nunca: \u003cb\u003e[[packaging|embalaje]]\u003c/b\u003e, \u003cb\u003e[[litter|basura tirada por el suelo]]\u003c/b\u003e y \u003cb\u003e[[waste|residuos]]\u003c/b\u003e. \u003ci\u003eToo much litter\u003c/i\u003e, jamás «too many litters».\u003cbr/\u003e\u003cbr/\u003eY una diferencia útil: \u003cb\u003elitter\u003c/b\u003e es la basura que está donde no debe (en la calle, en el parque). \u003cb\u003eRubbish\u003c/b\u003e es la basura en general, la de tu cubo. \u003cb\u003eA bin\u003c/b\u003e es el cubo; \u003cb\u003ea recycling bin\u003c/b\u003e, el del reciclaje."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m8l4\",\"phaseId\":\"enb1m8\",\"title\":\"Too much, not enough\",\"subtitle\":\"Demasiado delante, suficiente detrás — y la coletilla que casi nadie escribe\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que sobra y lo que falta en el barrio\",\"itemIds\":[\"enb1m8toomanybottles\",\"enb1m8notenoughbins\",\"enb1m8tooexpensivetobuy\",\"enb1m8cheapenoughforus\",\"enb1m8thebin\",\"enb1m8litter\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dónde va cada una (y qué viene detrás)\",\"body\":\"$17\",\"table\":[[\"Estructura\",\"Ejemplo\",\"Español\"],[\"too + adjetivo\",\"too expensive\",\"demasiado caro\"],[\"too much + incontable\",\"too much packaging\",\"demasiado embalaje\"],[\"too many + contable pl.\",\"too many bottles\",\"demasiadas botellas\"],[\"adjetivo + enough\",\"cheap enough\",\"lo bastante barato\"],[\"enough + sustantivo\",\"enough bins\",\"suficientes cubos\"],[\"+ to / + for\",\"too expensive for me to buy\",\"demasiado caro para que yo lo compre\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m8l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro del barrio\",\"pairs\":[{\"target\":\"the recycling bin\",\"source\":\"el cubo del reciclaje\"},{\"target\":\"Please don't drop litter.\",\"source\":\"Por favor, no tires basura al suelo.\"},{\"target\":\"There aren't enough bins in the park.\",\"source\":\"No hay suficientes papeleras en el parque.\"},{\"target\":\"There are too many plastic bottles.\",\"source\":\"Hay demasiadas botellas de plástico.\"}],\"itemIds\":[\"enb1m8thebin\",\"enb1m8litter\",\"enb1m8notenoughbins\",\"enb1m8toomanybottles\"],\"tip\":\"«Litter» es una palabra de cartel: la vas a ver en cada parque de Londres («No littering», «Please take your litter home»). Y no tiene plural.\"},{\"id\":\"enb1m8l4e2\",\"type\":\"bucket\",\"prompt\":\"¿
