runtergebracht werden. In ihrem Haus wird seit Januar in vier Behältern getrennt; Sofía hat zum ersten Mal die Verpackungen richtig sortiert.\u003cbr/\u003e6. Am Donnerstag hat sie im Radio eine Diskussion über das Tempolimit gehört. Ein Mann sagte: „So ein Quatsch, das bringt nichts.“ Eine Frau antwortete: „Je langsamer wir fahren, desto weniger Benzin wird verbraucht.“\u003cbr/\u003e7. Am Freitag hat Sofía [[nachgerechnet|hecho las cuentas]]: neunzehn Euro Benzin [[gespart|ahorrados]], keine Parkgebühr, kein Stau. Nur einmal, beim Großeinkauf, hat ihr das Auto gefehlt.\u003cbr/\u003e8. Am Sonntag hat Anna die Wette verloren und Kuchen gebacken. „Und jetzt?“, fragte sie. Sofía lachte: „Jetzt fahre ich weiter mit dem Rad — aber nicht, weil ich muss, sondern weil es schneller ist.“\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: die Wette = la apuesta · zusagen = aceptar · klatschnass = empapado · nachrechnen = hacer cuentas · die Parkgebühr = el precio del aparcamiento · sondern = sino (tras negación)\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T5a6,"])</script><script>self.__next_f.push([1,"Und, Nico, hast du's durchgehalten? Die ganze Woche ohne Auto? | Ja. Sogar am Dienstag, bei dem Regen. | Im Ernst? Ich hätte am Dienstag sofort aufgegeben. | Ich war kurz davor, ehrlich. Ich stand um sieben an der Haltestelle, und die Tram kam einfach nicht. | Und? | Und dann kam sie doch, zehn Minuten später. Ich war trotzdem pünktlich, das war das Überraschende. | Und was war das Schlimmste? | Ehrlich? Gar nicht der Regen. Der Großeinkauf am Samstag. Vier Tüten im Bus, das war … nee. | Das kenn ich. | Und was ich total unterschätzt hab: Ich hab die ganze Woche mehr Leute getroffen als sonst im ganzen Monat. In der Tram triffst du ja dauernd jemanden. Im Auto sitzt du allein und ärgerst dich über den Stau. | Also schaffst du das Auto jetzt wirklich ab? | Ja. Weg ist weg. Ich hab die Anzeige schon geschrieben. | Und der Großeinkauf? | Einmal im Monat miete ich mir eins. Ich hab's ausgerechnet: Das kostet mich im Jahr, ähm, ungefähr ein Drittel von dem, was ich jetzt zahle. Versicherung, Werkstatt, der Parkplatz — das läppert sich. | Und was ist mit der Arbeit? Du fängst doch manchmal um sechs an. | Das ist der einzige Punkt. Um sechs fährt hier fast nichts. Da nehm ich das Rad, auch im Winter. Mal sehen, wie lange die Begeisterung hält. | Und deine Freundin? Die fährt doch gern Auto. | Die sagt, sie macht mit. Bis zum ersten Regen, sag ich. | Genau das hab ich vor einer Woche über dich gesagt. | Eben."])</script><script>self.__next_f.push([1,"19:T5a6,"])</script><script>self.__next_f.push([1,"Und, Nico, hast du's durchgehalten? Die ganze Woche ohne Auto? | Ja. Sogar am Dienstag, bei dem Regen. | Im Ernst? Ich hätte am Dienstag sofort aufgegeben. | Ich war kurz davor, ehrlich. Ich stand um sieben an der Haltestelle, und die Tram kam einfach nicht. | Und? | Und dann kam sie doch, zehn Minuten später. Ich war trotzdem pünktlich, das war das Überraschende. | Und was war das Schlimmste? | Ehrlich? Gar nicht der Regen. Der Großeinkauf am Samstag. Vier Tüten im Bus, das war … nee. | Das kenn ich. | Und was ich total unterschätzt hab: Ich hab die ganze Woche mehr Leute getroffen als sonst im ganzen Monat. In der Tram triffst du ja dauernd jemanden. Im Auto sitzt du allein und ärgerst dich über den Stau. | Also schaffst du das Auto jetzt wirklich ab? | Ja. Weg ist weg. Ich hab die Anzeige schon geschrieben. | Und der Großeinkauf? | Einmal im Monat miete ich mir eins. Ich hab's ausgerechnet: Das kostet mich im Jahr, ähm, ungefähr ein Drittel von dem, was ich jetzt zahle. Versicherung, Werkstatt, der Parkplatz — das läppert sich. | Und was ist mit der Arbeit? Du fängst doch manchmal um sechs an. | Das ist der einzige Punkt. Um sechs fährt hier fast nichts. Da nehm ich das Rad, auch im Winter. Mal sehen, wie lange die Begeisterung hält. | Und deine Freundin? Die fährt doch gern Auto. | Die sagt, sie macht mit. Bis zum ersten Regen, sag ",\"title\":\"Últimas piezas: clima y ahorro\",\"itemIds\":[\"b1m5klimawandel\",\"b1m5klimaschutz\",\"b1m5energiesparen\",\"b1m5umwelt\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sofía Marín: eine Woche ohne Auto\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m5l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 4)\",\"question\":\"¿Por qué el martes llegó antes con la bici?\",\"options\":[\"Porque salió más temprano\",\"Porque el centro estaba colapsado de tráfico\",\"Porque llovía y había menos gente\"],\"answer\":1,\"whyWrong\":[\"El texto no dice nada de la hora de salida\",null,\"La lluvia la empapó, pero no fue la razón de ir más rápido\"],\"itemIds\":[\"b1m5stau\",\"b1m5oeffentlichverkehrsmittel\"]},{\"id\":\"b1m5l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (frase 8)\",\"question\":\"¿Por qué sigue Sofía en bici al terminar la apuesta?\",\"options\":[\"Porque perdió la apuesta\",\"Porque le ha salido a cuenta y va más rápido\",\"Porque su coche se ha averiado\"],\"answer\":1,\"whyWrong\":[\"La apuesta la perdió Anna\",null,\"El texto nunca dice que el coche se estropee\"],\"itemIds\":[\"b1m5energiesparen\"],\"tip\":\"«nicht, weil…, sondern weil…» = no por obligación, sino por conveniencia. Tras negación, «pero» es sondern.\"},{\"id\":\"b1m5l9e3\",\"type\":\"order\",\"prompt\":\"Ordena la semana de Sofía\",\"sentences\":[\"Am Montag ist sie mit dem Bus zur Arbeit gefahren.\",\"Am Dienstag ist sie im Regen mit dem Fahrrad gefahren.\",\"Am Mittwoch musste der Müll getrennt werden.\",\"Am Freitag hat sie neunzehn Euro gespart.\"],\"translation\":\"El lunes fue en bus. El martes fue en bici bajo la lluvia. El miércoles hubo que separar la basura. El viernes había ahorrado diecinueve euros.\",\"hints\":[\"Sigue los días de la semana\",\"Montag → Dienstag → Mittwoch → Freitag\"],\"itemIds\":[\"b1m5muell\",\"b1m5energiesparen\"]},{\"id\":\"b1m5l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga: transporte que ya conoces del A1 y A2 — sin pensar\",\"pairs\":[{\"target\":\"Ich fahre mit dem Bus\",\"source\":\"Voy en autobús\"},{\"target\":\"das Fahrrad\",\"source\":\"la bicicleta\"},{\"target\":\"der Zug\",\"source\":\"el tren\"},{\"target\":\"die U-Bahn\",\"source\":\"el metro\"},{\"target\":\"das Auto\",\"source\":\"el coche\"}],\"targetSeconds\":22,\"itemIds\":[\"mitdembus\",\"fahrrad\",\"zug\",\"ubahn\",\"auto\"],\"tip\":\"Nada nuevo aquí: solo velocidad sobre lo que ya sabes. Esa es la hebra que rompe el estancamiento.\"},{\"id\":\"b1m5l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 1 (pasiva en Perfekt)\",\"text\":\"Im März ist in ihrer Straße ein neuer Radweg gebaut ___.\",\"answers\":[\"worden\"],\"translation\":\"En marzo se construyó un nuevo carril bici en su calle.\",\"hints\":[\"Participio de werden en la pasiva\",\"sin ge-\"],\"itemIds\":[\"b1m5istgebautworden\",\"b1m5radweg\"]},{\"id\":\"b1m5l9e6\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 6 (la proporción)\",\"text\":\"Je langsamer wir fahren, ___ weniger Benzin wird verbraucht.\",\"answers\":[\"desto\",\"umso\"],\"translation\":\"Cuanto más despacio vamos, menos gasolina se consume.\",\"hints\":[\"La pareja de je\",\"d...\"],\"itemIds\":[\"b1m5jedesto\",\"b1m5benzin\"]},{\"id\":\"b1m5l9e7\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿verbo al final o inversión?\",\"categories\":[\"verbo AL FINAL (subordinada)\",\"INVERSIÓN (verbo 2º)\"],\"items\":[{\"text\":\"weil\",\"bucket\":0},{\"text\":\"deshalb\",\"bucket\":1},{\"text\":\"obwohl\",\"bucket\":0},{\"text\":\"trotzdem\",\"bucket\":1},{\"text\":\"wenn\",\"bucket\":0},{\"text\":\"außerdem\",\"bucket\":1}],\"itemIds\":[\"a2m6weil\",\"a2m6deshalb\",\"a2m6wenn\"],\"tip\":\"En español «porque» y «por eso» se comportan igual. En alemán deciden toda la frase. Esta tabla es la que más puntos vale del nivel.\"},{\"id\":\"b1m5l9e8\",\"type\":\"transform\",\"prompt\":\"Espiral del A2: cuenta la escena en Perfekt\",\"source\":\"Sofía fährt mit dem Bus zur Arbeit.\",\"instruction\":\"Ponla en Perfekt\",\"answers\":[\"Sofía ist mit dem Bus zur Arbeit gefahren\",\"Sofía ist mit dem Bus zur Arbeit gefahren.\"],\"translation\":\"Sofía fue en autobús al trabajo.\",\"hints\":[\"fahren es de movimiento → sein\",\"Sofía ist ... gefahren\"],\"itemIds\":[\"mitdembus\",\"gefahren\"]},{\"id\":\"b1m5l9e9\",\"type\":\"errorfix\",\"prompt\":\"Anna escribió esto en el chat. Arréglalo.\",\"wrong\":\"Der Radweg ist von der Stadt gebaut geworden.\",\"answers\":[\"Der Radweg ist von der Stadt gebaut worden.\",\"Der Radweg ist von der Stadt gebaut worden\"],\"why\":\"En la pasiva, werden pierde el ge-: worden. geworden solo se usa cuando algo «se convierte» en otra cosa.\",\"translation\":\"El carril bici lo construyó la ciudad.\",\"itemIds\":[\"b1m5istgebautworden\",\"b1m5vonderstadt\"]},{\"id\":\"b1m5l9e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Man muss den Müll trennen.\",\"forbid\":[\"man\",\"muss\"],\"answers\":[\"Der Müll ist zu trennen.\",\"Die Trennung des Mülls ist Pflicht.\",\"Der Müll sollte getrennt werden.\",\"Der Müll soll getrennt werden.\",\"Der Müll ist getrennt zu sammeln.\",\"Mülltrennung ist Pflicht.\",\"Die Mülltrennung ist Pflicht.\",\"Es ist Pflicht, den Müll zu trennen.\"],\"translation\":\"Hay que separar la basura.\",\"hints\":[\"Sin man y sin muss: prueba «sein + zu + infinitivo» o un sustantivo\",\"Der Müll ist zu ...\"],\"itemIds\":[\"b1m5muell\",\"b1m5trennen\"],\"tip\":\"«sein + zu + Infinitiv» es la pasiva de obligación del alemán escrito: Das ist zu beachten. Rango puro.\"},{\"id\":\"b1m5l9e13\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 3 EN FORMATO REAL · afirmación 1 de 7. Una conversación de tres minutos entre Sofía y Nico, SIETE afirmaciones en alemán que se marcan Richtig o Falsch y UNA sola escucha: eso es el Teil 3. Las afirmaciones van en el orden de la conversación; lee la tuya antes de darle al play.\",\"audio\":\"$18\",\"question\":\"„Nico hat die ganze Woche ohne Auto geschafft.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Ja. Sogar am Dienstag, bei dem Regen»\"],\"itemIds\":[\"b1m5oeffentlichverkehrsmittel\",\"b1m5verzichtenauf\"],\"tip\":\"El Teil 3 no da tres opciones en español: da siete frases en alemán y solo Richtig o Falsch. Y con una pasada no hay tiempo de traducir — hay que entender a la primera.\"},{\"id\":\"b1m5l9e14\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 2 de 7. Misma conversación, una sola escucha.\",\"audio\":\"$19\",\"question\":\"„Am Dienstag ist Nico wegen der Straßenbahn zu spät gekommen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Ich war trotzdem pünktlich, das war das Überraschende»\",null],\"itemIds\":[\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"El tranvía llegó tarde Y él llegó puntual: los dos hechos caben en dos frases seguidas. En el Teil 3 quedarse con la primera mitad es el error más caro.\"},{\"id\":\"b1m5l9e15\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 3 de 7. Una escucha.\",\"audio\":\"$1a\",\"question\":\"„Am schlimmsten war für Nico das Wetter.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Ehrlich? Gar nicht der Regen» — lo peor fue la compra grande del sábado\",null],\"itemIds\":[\"b1m5verzichtenauf\"],\"tip\":\"«Ehrlich?» seguido de una negación anuncia la respuesta de verdad. En una conversación real, lo bueno casi nunca está en la primera frase.\"},{\"id\":\"b1m5l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 4 de 7. Una escucha.\",\"audio\":\"$1b\",\"question\":\"„In dieser Woche hat Nico mehr Leute getroffen als sonst.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«mehr Leute getroffen als sonst im ganzen Monat»\"],\"itemIds\":[\"b1m5umweltfreundlicherals\"],\"tip\":\"Una ventaja que no esperaba y que cuenta de pasada, en medio de una queja. El Teil 3 mete ahí sus afirmaciones porque nadie las está esperando.\"},{\"id\":\"b1m5l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 5 de 7. Una escucha.\",\"audio\":\"$1c\",\"question\":\"„Nico will sein Auto behalten und seltener benutzen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Weg ist weg. Ich hab die Anzeige schon geschrieben»: lo vende\",null],\"itemIds\":[\"b1m5verzichtenauf\",\"b1m5benzin\"],\"tip\":\"«Weg ist weg» — lo que se fue, se fue. Un giro corto y muy alemán para decir que la decisión ya no se discute.\"},{\"id\":\"b1m5l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 6 de 7. Una escucha.\",\"audio\":\"$1d\",\"question\":\"„Ein Mietwagen einmal im Monat kostet ihn weniger als sein eigenes Auto.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«ungefähr ein Drittel von dem, was ich jetzt zahle» — seguro, taller y plaza de aparcamiento incluidos\"],\"itemIds\":[\"b1m5verbrauchen\"],\"tip\":\"Aquí no hay ninguna cifra en euros: hay una fracción («ein Drittel») y una lista de gastos. Las afirmaciones de dinero del Teil 3 se juegan casi siempre así.\"},{\"id\":\"b1m5l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · afirmación 7 de 7. Una escucha. Si has aguantado tres minutos de conversación real sin desconectar, acabas de entrenar lo que el examen mide de verdad.\",\"audio\":\"$1e\",\"question\":\"„Wenn Nico um sechs anfängt, fährt er mit der Straßenbahn.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"«Um sechs fährt hier fast nichts. Da nehm ich das Rad»\",null],\"itemIds\":[\"b1m5radweg\",\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"La última afirmación llega en los últimos segundos, cuando ya estás cansado: exactamente donde la pone el examen. Por eso se entrena la resistencia y no solo el oído.\"},{\"id\":\"b1m5l9e11\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 2 — presenta tu tema en 3 minutos. Prepárate primero con las 5 diapositivas.\",\"topic\":\"Umweltschutz im Alltag: Was kann jeder tun?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"Ich möchte heute über … sprechen. Meine Präsentation hat fünf Teile.\"},{\"title\":\"2. Deine eigene Erfahrung\",\"hint\":\"Bei mir zu Hause wird der Müll … / Ich fahre meistens mit …\"},{\"title\":\"3. Die Situation in deinem Heimatland\",\"hint\":\"In Spanien wird … / Dort werden weniger … als in Deutschland.\"},{\"title\":\"4. Vor- und Nachteile + deine Meinung\",\"hint\":\"Einerseits …, andererseits … Meiner Meinung nach … Ein Beispiel dafür ist …\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"Zum Schluss möchte ich sagen, dass … Vielen Dank für eure Aufmerksamkeit.\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas (las 5 = banda A en «Erfüllung»)\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos 2 frases en pasiva (wird/werden + Partizip)\",\"Usé al menos 4 conectores distintos (weil, deshalb, trotzdem, außerdem…)\",\"Di un ejemplo propio y concreto, no una generalidad\"],\"model\":\"Diapositiva 2 (modelo): „Bei mir zu Hause wird der Müll seit einem Jahr in vier Behältern getrennt. Am Anfang war das kompliziert, weil ich nie wusste, wohin die Verpackungen gehören. Heute geht es automatisch, und ich verzichte außerdem an drei Tagen pro Woche auf das Auto.“\",\"itemIds\":[\"b1m5umwelt\",\"b1m5klimaschutz\",\"b1m5verzichtenauf\",\"b1m5muell\"],\"tip\":\"La segunda pasada sin andamio siempre sale mejor: es el efecto de repetición de tarea. Hazla, aunque te dé pereza.\"},{\"id\":\"b1m5l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"En mi opinión, hay que separar la basura y se debería ahorrar energía\",\"answers\":[\"Meiner Meinung nach muss der Müll getrennt werden und Energie sollte gespart werden\",\"Meiner Meinung nach muss der Müll getrennt werden und Energie sollte gespart werden.\",\"Meiner Meinung nach muss der Müll getrennt werden, und Energie sollte gespart werden\"],\"hints\":[\"Meiner Meinung nach + inversión, luego dos pasivas con modal\",\"Meiner Meinung nach muss der Müll ... und Energie sollte ...\"],\"itemIds\":[\"b1m1meinermeinungnach\",\"b1m5mussgetrenntwerden\",\"b1m5energiesparen\"],\"tip\":\"Fórmula de opinión + dos pasivas con modal en una sola frase. Módulo cerrado: ya escribes como un texto de examen.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Hören Teil 4: tres voces, ocho afirmaciones\",\"body\":\"El \u003cb\u003eTeil 4\u003c/b\u003e del Hören es una discusión de radio con \u003cb\u003etres voces\u003c/b\u003e —quien modera y dos invitados— y \u003cb\u003eocho afirmaciones\u003c/b\u003e (23-30) que se reparten entre a, b y c. \u003cb\u003eDos escuchas.\u003c/b\u003e En el audio nadie anuncia su papel antes de hablar: quien modera presenta a los invitados una sola vez, al principio.\u003cbr/\u003e\u003cbr/\u003eTres anclas, en este orden:\u003cbr/\u003e· la \u003cb\u003evoz\u003c/b\u003e — decídela en los primeros diez segundos;\u003cbr/\u003e· el \u003cb\u003epapel\u003c/b\u003e: quien modera pregunta y da turnos, el especialista trae cifras, el otro invitado defiende a los suyos;\u003cbr/\u003e· la \u003cb\u003epostura\u003c/b\u003e: uno está a favor, otro en contra, y quien modera casi nunca — casi.\u003cbr/\u003e\u003cbr/\u003eLo decisivo: las afirmaciones \u003cb\u003eno repiten las palabras del audio\u003c/b\u003e, las resumen. En este debate las tres voces dicen \u003ci\u003eTempolimit\u003c/i\u003e, \u003ci\u003eSicherheit\u003c/i\u003e y \u003ci\u003eKlima\u003c/i\u003e: por palabra clave no se resuelve ni una. Fórmulas que sí marcan el turno: \u003ci\u003eDas stimmt zwar, aber…\u003c/i\u003e · \u003ci\u003eDa widerspreche ich Ihnen\u003c/i\u003e · \u003ci\u003eNennen Sie es X, ich nenne es Y\u003c/i\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m5l9e20\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la investigadora de tráfico y c) el portavoz del club automovilístico. Nadie dice quién es antes de hablar: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$1f\",\"question\":\"„Fürs Klima bringt das weniger, als beide Lager behaupten.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él abre el tema del medio ambiente, no lo responde\",null,\"Él está en contra del límite, pero el argumento del clima no lo relativiza: lo usa contra ella al final\"],\"itemIds\":[\"b1m5tempolimit\",\"b1m5klimaschutz\",\"b1m5klimawandel\"],\"tip\":\"Ninguna de las ocho afirmaciones sale literal del audio. Y ojo con la primera: una experta que empieza quitándole razón a su propio bando no es una trampa, es un B1 real.\"},{\"id\":\"b1m5l9e21\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$20\",\"question\":\"„Nicht die Autobahn ist der gefährliche Teil des Straßennetzes.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo modera\",\"Ella sostiene lo contrario: donde no hay límite pasa más y más grave\",null],\"itemIds\":[\"b1m5unfall\",\"b1m5sicherheit\"],\"tip\":\"«Gefährlich wird es auf der Landstraße»: la afirmación lo dice al revés, con una negación. Darle la vuelta a una frase es exactamente lo que el Teil 4 te pide hacer en tiempo real.\"},{\"id\":\"b1m5l9e22\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$21\",\"question\":\"„Wo kein Limit gilt, sind die Unfälle schwerer.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él no aporta datos\",null,\"Él acaba de decir lo contrario: que la autopista es de lo más seguro que hay\"],\"itemIds\":[\"b1m5unfall\",\"b1m5geschwindigkeit\"],\"tip\":\"«Das stimmt zwar, aber…» le concede la mitad y le quita la otra mitad. Lo que puntúa es siempre lo que viene detrás del «aber».\"},{\"id\":\"b1m5l9e23\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. En el Teil 4 real siempre hay una o dos afirmaciones del moderador.\",\"audio\":\"$22\",\"question\":\"„Über den Preis der Maßnahme wird auffallend wenig gesprochen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella responde a eso: no cuesta casi nada. Quien echa en falta el tema es él\",\"Él no habla de dinero en ningún momento: habla de libertad\"],\"itemIds\":[\"b1m5massnahme\",\"b1m5abhaengenvon\"],\"tip\":\"Descartar al moderador por sistema cuesta dos puntos. Su marca no es el tema: es la forma. Pregunta, resume o —como aquí— echa algo en falta.\"},{\"id\":\"b1m5l9e24\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$23\",\"question\":\"„Weil es nichts kostet, wird der Streit auf einer anderen Ebene geführt.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pone el dinero sobre la mesa, pero no explica por qué se discute tanto\",null,\"Él es justo quien lleva el debate a ese otro terreno, un turno después\"],\"itemIds\":[\"b1m5massnahme\",\"b1m5wurdeeingefuehrt\"],\"tip\":\"«Wo kein Preis ist, bleibt nur das Gefühl» — y el otro recoge el guante en el turno siguiente («Nennen Sie es Gefühl»). Cuando dos turnos se responden así, el orden decide de quién es cada afirmación.\"},{\"id\":\"b1m5l9e25\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$24\",\"question\":\"„Den Autofahrern wird der letzte Rest Freiheit genommen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no defiende ninguna postura\",\"Ella responde a esa frase: esa libertad va a costa de otros\",null],\"itemIds\":[\"b1m5verboten\",\"b1m5verzichtenauf\"],\"tip\":\"«Nennen Sie es Gefühl. Ich nenne es Freiheit.» Reetiquetar la palabra del contrario es un recurso de debate clásico, y en el examen se convierte en afirmación.\"},{\"id\":\"b1m5l9e26\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8. Dos escuchas.\",\"audio\":\"$25\",\"question\":\"„Diese Freiheit geht zulasten von Menschen, die nie gefragt wurden.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",null,\"Él es quien habla de libertad: esta frase es la respuesta a la suya\"],\"itemIds\":[\"b1m5beitragenzu\",\"b1m5sicherheit\"],\"tip\":\"Aquí se cae quien va por palabras clave: «Freiheit» la dice él primero. Pero la frase que la limita es de ella, y esa es la que puntúa.\"},{\"id\":\"b1m5l9e27\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido — exactamente como en el examen.\",\"audio\":\"$26\",\"question\":\"„Diese Entscheidung sollte jeder für sich treffen dürfen.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsforscherin\",\"der Sprecher des Autoclubs\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él pide la frase de cierre, no la da\",\"Su frase final va de once minutos, no de quién decide\",null],\"itemIds\":[\"b1m5jedesto\",\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"La ronda final vale dos o tres ítems y llega cuando ya estás cansado: por eso el Teil 4 se entrena entero y no por trozos.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m5-4\",\"book\":\"Das ist mir egal.\",\"real\":\"Ist mir wurscht.\",\"meaning\":\"Me da igual\",\"when\":\"Entre amigos, perfecto. Es la pronunciación del sur (Baviera, Austria, Suabia); en el norte se dice «Das ist mir Wurst», sin la -sch. Con el casero, en un mail o en el examen, nunca: ahí suena a que pasas de quien te habla.\",\"register\":\"regional\",\"exam\":\"Das spielt für mich keine große Rolle.\",\"note\":\"Wurscht es Wurst (salchicha) con la vocal del sur. La lógica alemana: si todo da igual, es todo salchicha. Ojo, «egal» tampoco es tan inocente: dicho a alguien que te está pidiendo algo, también suena a desprecio.\",\"sound\":\"ist mia vursht\",\"level\":\"b1\"}}],\"resources\":[{\"label\":\"DW — Top-Thema: Umwelt\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Un artículo B1 por semana sobre medio ambiente, con audio y vocabulario: es tu canal de volumen.\"},{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Las 5 diapositivas del Teil 2 son siempre las mismas: compáralas con las de tu monólogo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"27:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática d
