it und danach\",\"subtitle\":\"Historia larga, espiral de los módulos 8 y 9, y tu monólogo\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas del módulo\",\"itemIds\":[\"b1m10sicherinnernanstreit\",\"b1m10enttaeuschtvon\",\"b1m10nachtragend\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sofía und Anna: der Streit um die Reise\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frases 3-4)\",\"question\":\"Warum war die Stimmung in Wien angespannt?\",\"options\":[\"Weil Sofía das Geld zweimal vergessen hatte\",\"Weil der Nachtzug Verspätung hatte\",\"Weil die Ferienwohnung zu klein war\"],\"answer\":0,\"whyWrong\":[null,\"El tren nocturno solo se menciona como medio de transporte\",\"El tamaño del piso no da problemas en la historia\"],\"itemIds\":[\"b1m10enttaeuschtvon\"]},{\"id\":\"b1m10l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (frase 6)\",\"question\":\"Was meint Anna mit „Es geht nicht um die Miete“?\",\"options\":[\"Dass ihr das Vertrauen wichtiger ist als das Geld\",\"Dass die Wohnung zu teuer war\",\"Dass Sofía nie Geld hat\"],\"answer\":0,\"whyWrong\":[null,\"El precio nunca se discute\",\"Sofía sí tiene el dinero: simplemente lo olvidó\"],\"itemIds\":[\"b1m10sichverlassenauf\",\"b1m10jemandemvertrauen\"],\"tip\":\"«Es geht darum, dass ich mich nicht mehr auf dich verlassen kann» es la clave — pero la respuesta no está escrita con la palabra «Vertrauen». Eso es inferir.\"},{\"id\":\"b1m10l9e3\",\"type\":\"order\",\"prompt\":\"Ordena la historia\",\"sentences\":[\"Anna bezahlte die Ferienwohnung im Voraus.\",\"Sofía vergaß zweimal, ihr das Geld zu überweisen.\",\"Beim Frühstück in Wien sagte Anna, dass sie enttäuscht sei.\",\"Am Abend sprachen sie sich auf der Stiege aus.\",\"Am nächsten Morgen lud Sofía Anna zu einer Jause ein.\"],\"translation\":\"Anna pagó el apartamento por adelantado. Sofía olvidó dos veces transferirle el dinero. En el desayuno en "type\":\"errorfix\",\"prompt\":\"Corrige la rección\",\"wrong\":\"Ich erinnere mich oft von diesem Streit.\",\"answers\":[\"Ich erinnere mich oft an diesen Streit.\"],\"why\":\"sich erinnern AN + Akkusativ. El «de» del español («acordarse DE») empuja hacia «von», que aquí no existe; y al cambiar la preposición cambia también el caso.\",\"translation\":\"Me acuerdo a menudo de aquella discusión.\",\"itemIds\":[\"b1m10sicherinnernanstreit\"]},{\"id\":\"b1m10l9e7\",\"type\":\"transform\",\"prompt\":\"Espiral b1m8: pon el plan en Futur I\",\"source\":\"Beim nächsten Mal rede ich sofort.\",\"instruction\":\"Ponla en Futur I (werden + infinitivo)\",\"answers\":[\"Beim nächsten Mal werde ich sofort reden\",\"Beim nächsten Mal werde ich sofort reden.\",\"Ich werde beim nächsten Mal sofort reden\"],\"translation\":\"La próxima vez hablaré enseguida.\",\"hints\":[\"werden en 2ª posición\",\"… werde ich sofort reden\"],\"itemIds\":[\"b1m10sichaussprechen\"],\"tip\":\"Espiral del módulo 8: el Futur I sirve para prometer. Tras una disculpa es justo lo que hace falta.\"},{\"id\":\"b1m10l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin las palabras duras\",\"source\":\"Du bist wirklich nachtragend!\",\"forbid\":[\"nachtragend\",\"Du\"],\"answers\":[\"Ich habe das Gefühl, dass die Sache noch nicht erledigt ist\",\"Mir scheint, dass die Sache für dich noch nicht erledigt ist\"],\"translation\":\"Tengo la sensación de que el asunto todavía no está zanjado.\",\"hints\":[\"Habla de tu percepción: «Ich habe das Gefühl, dass …»\",\"erledigt = zanjado\"],\"itemIds\":[\"b1m10nachtragend\"],\"tip\":\"Lo mismo, sin etiquetar al otro. Esta es la habilidad que separa un B1 que se hace entender de un B1 que se hace escuchar.\"},{\"id\":\"b1m10l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3: Leo pregunta a Sofía cómo acabó todo. UNA sola escucha, afirmación en alemán, Richtig o Falsch.\",\"audio\":\"Und, redet ihr wieder normal miteinander? | Ja. Seit dem Gespräch in Wien eigentlich besser als vorher. | Das hätt ich nicht gedacht. Ich dachte immer, so ein Streit macht was kaputt. | Kaputtgegangen ist nur die Vorstellung, dass wir nie streiten. Und ehrlich gesagt war die nicht viel wert.\",\"question\":\"Die beiden reden heute besser miteinander als vor dem Streit.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"«Seit dem Gespräch in Wien eigentlich besser als vorher»: el propio audio lo compara\"],\"itemIds\":[\"b1m10sichversoehnen\",\"b1m10sicherinnernanstreit\"],\"tip\":\"Una escucha, cuatro turnos: en el Teil 3 real son siete afirmaciones seguidas y en el mismo orden de la conversación. Si estás en la quinta y oyes algo de la tercera, es que te has quedado atrás.\"},{\"id\":\"b1m10l9e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3, segunda tarea: esta pide inferir, no localizar. Una escucha.\",\"audio\":\"Und, redet ihr wieder normal miteinander? | Ja. Seit dem Gespräch in Wien eigentlich besser als vorher. | Das hätt ich nicht gedacht. Ich dachte immer, so ein Streit macht was kaputt. | Kaputtgegangen ist nur die Vorstellung, dass wir nie streiten. Und ehrlich gesagt war die nicht viel wert.\",\"question\":\"Sofía meint, die Freundschaft sei durch den Streit kaputtgegangen.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Lo único que se rompió fue «die Vorstellung, dass wir nie streiten» — una idea, no la amistad\",null],\"itemIds\":[\"b1m10ehrlichgesagt\",\"b1m10sichaussprechen\"],\"tip\":\"Lo único que se rompió fue «die Vorstellung, dass wir nie streiten». Las preguntas de inferencia del Hören se resuelven igual que las del Lesen: nadie te lo dice con esas palabras.\"},{\"id\":\"b1m10l9e14\",\"type\":\"listen\",\"prompt\":\"Dictado corto: la frase con la que se abre una conversación honesta\",\"text\":\"Ehrlich gesagt habe ich mich sehr über dich geärgert\",\"translation\":\"La verdad es que me enfadé mucho contigo\",\"hints\":[\"Ehrlich gesagt … (y detrás, inversión)\",\"… habe ich mich sehr über dich geärgert\"],\"itemIds\":[\"b1m10ehrlichgesagt\",\"b1m10sichaergernueber\"],\"tip\":\"«Ehrlich gesagt» ocupa la posición 1: detrás va el verbo y luego el sujeto. Y ojo a la rección: sich ärgern ÜBER + acusativo.\"},{\"id\":\"b1m10l9e9\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de la frase 8\",\"text\":\"Sie haben sich lange ___, bis der Kaffee kalt war. (sincerarse)\",\"answers\":[\"ausgesprochen\"],\"translation\":\"Estuvieron sincerándose mucho rato, hasta que el café se enfrió.\",\"hints\":[\"sich aussprechen, separable: aus + ge + sprochen\",\"aus…\"],\"itemIds\":[\"b1m10sichaussprechen\"]},{\"id\":\"b1m10l9e10\",\"type\":\"monologue\",\"prompt\":\"Tu presentación de 3 minutos (Sprechen Teil 2 del examen)\",\"topic\":\"Ein Konflikt, den du erlebt hast — und wie er gelöst wurde\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"«Ich möchte heute über einen Konflikt sprechen, den ich selbst erlebt habe. Meine Präsentation hat fünf Teile.»\"},{\"title\":\"2. Eigene Erfahrung\",\"hint\":\"Qué pasó, con quién y por qué: «Vor zwei Jahren habe ich mich mit … gestritten, weil …»\"},{\"title\":\"3. Situation im Heimatland\",\"hint\":\"¿Cómo se resuelven los conflictos en tu país? ¿Se habla enseguida o se deja pasar? Da un ejemplo.\"},{\"title\":\"4. Vor- und Nachteile + eigene Meinung\",\"hint\":\"Hablar enseguida vs. tomar distancia: «Ein Vorteil ist … Meiner Meinung nach …»\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit.»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin parar\",\"Conté un conflicto concreto y cómo terminó (no en general)\",\"Usé al menos dos formas de Konjunktiv II (hätte, wäre, könnte, würde…)\",\"Usé «damit» o «um … zu» al menos una vez, con el sujeto correcto\"],\"model\":\"Diapositiva 2, como ejemplo: „Vor zwei Jahren habe ich mich mit meiner besten Freundin gestritten, weil ich ihr Geld nicht zurückgegeben habe. Ehrlich gesagt war das nur der Auslöser. Wir haben drei Tage nicht geredet. Dann habe ich ihr geschrieben, damit sie weiß, dass es mir leidtut. Heute glaube ich: Wir hätten früher reden sollen.“\",\"itemIds\":[\"b1m10sichstreitenmit\",\"b1m10sichaussprechen\",\"b1m10haettesagensollen\",\"b1m10damitzweck\"],\"tip\":\"Pasada 1 con el guion a la vista (fluidez). Pasada 2 sin guion, vigilando dos cosas: la forma sintética del Konjunktiv II y el sujeto de damit/um…zu.\"},{\"id\":\"b1m10l9e15\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 3 — lo que viene DESPUÉS de la presentación: 1-2 minutos y 16 puntos. Tu compañero acaba de presentar el mismo tema que tú («un conflicto que viviste»). Dale feedback, hazle UNA pregunta —es obligatoria—, reacciona a su feedback y contesta a la pregunta de la examinadora. En el examen esto no se prepara: se reacciona.\",\"topic\":\"Nach der Präsentation deines Partners: Rückmeldung geben, eine Frage stellen und auf die Frage der Prüferin antworten.\",\"slides\":[{\"title\":\"1 · Rückmeldung: dos frases concretas\",\"hint\":\"«Mir hat besonders gut gefallen, dass …» + «Interessant fand ich vor allem …». Nombra algo que él dijo de verdad; un «war sehr gut» no cuenta como feedback.\"},{\"title\":\"2 · Deine Frage — obligatoria\",\"hint\":\"«Ich hätte noch eine Frage: Würdest du heute wieder …?» Abierta, no de sí o no: si no puede contestarla con más de una frase, no te sirve.\"},{\"title\":\"3 · Auf sein Feedback reagieren\",\"hint\":\"«Danke, das freut mich.» · «Du hast recht, dass …» · «Ich kann das verstehen, aber …». Aceptar una crítica en una frase también puntúa.\"},{\"title\":\"4 · Die Frage der Prüferin\",\"hint\":\"«Wie macht man das in Ihrem Heimatland?» → dato + ejemplo concreto + «Meiner Meinung nach …». Es la misma receta de la diapositiva 3 de tu presentación, pero improvisada.\"}],\"planSeconds\":30,\"speakSeconds\":100,\"reps\":2,\"checklist\":[\"He dado DOS frases de feedback, y las dos nombran algo concreto de su presentación\",\"He hecho mi pregunta con «Ich hätte noch eine Frage:» y era abierta\",\"He reaccionado a su feedback con algo más que «danke»\",\"He contestado a la pregunta de la examinadora con dato + ejemplo + opinión\",\"He hablado al menos un minuto seguido, sin leer\"],\"model\":\"Mir hat besonders gut gefallen, dass du einen echten Streit erzählt hast und nicht nur allgemein geredet hast. Interessant fand ich vor allem, dass ihr drei Tage lang nicht miteinander gesprochen habt. Ich hätte noch eine Frage: Würdest du heute wieder drei Tage warten, oder würdest du sofort anrufen? … Danke für dein Feedback. Du hast recht, dass ich am Anfang zu schnell gesprochen habe; beim nächsten Mal fange ich langsamer an. Und zur Frage, wie man das bei uns macht: Bei uns wird viel diskutiert, aber selten sofort. Meine Familie wartet meistens bis zum nächsten gemeinsamen Essen, und dann spricht man darüber, als wäre nichts gewesen. Meiner Meinung nach ist das gar keine schlechte Lösung — solange man wirklich noch darüber spricht.\",\"itemIds\":[\"b1m10sichaussprechen\",\"b1m10ichkanndasverstehen\",\"b1m10diskutieren\",\"b1m10konfliktloesen\"],\"tip\":\"El Teil 3 se pierde por callarse: son 16 puntos que se dan por hablar minuto y medio. Llévate las tres frases hechas —feedback, pregunta, reacción— y rellénalas con lo que acabas de oír. Y no corrijas a tu compañero: no puntúa y no es tu papel.\"},{\"id\":\"b1m10l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Tendríamos que haber hablado antes; siento haberte herido.\",\"answers\":[\"Wir hätten früher reden sollen. Es tut mir leid, dass ich dich verletzt habe\",\"Wir hätten früher reden sollen. Es tut mir leid, dass ich dich verletzt habe.\",\"Wir hätten früher reden sollen, es tut mir leid, dass ich dich verletzt habe\"],\"hints\":[\"hätten + infinitivo + sollen\",\"Es tut mir leid, dass ich dich …\"],\"itemIds\":[\"b1m10haettesagensollen\",\"b1m10esteutmirleiddass\",\"b1m10jemandenverletzen\"],\"tip\":\"Módulo cerrado: consejo, cortesía, finalidad y perdón. Con estas dos frases se arreglan más amistades que con cualquier tabla de gramática.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m10-4\",\"book\":\"Jetzt ist es genug für mich.\",\"real\":\"Jetzt reicht's mir!\",\"meaning\":\"¡Ya está bien! / ¡Hasta aquí hemos llegado!\",\"when\":\"Cuando de verdad se te ha acabado la paciencia — con un compañero de piso, no con tu jefa. Es el final de una discusión, no su principio: quien lo dice ya no negocia.\",\"register\":\"amigos\",\"exam\":\"So kann es aus meiner Sicht nicht weitergehen.\",\"note\":\"De «reichen» (bastar) + dativo: «mir reicht es». Reconócelo al oírlo: es la señal de que hay que bajar el tono o dejar la conversación.\",\"sound\":\"yetst raijts mia\",\"level\":\"b1\",\"produce\":false,\"itemId\":\"b1m10natvjetztreichts\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Las 5 diapositivas del Teil 2 son siempre las mismas: tu plantilla del monólogo.\"},{\"label\":\"DW — Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/de/nicos-weg/c-36519789\",\"note\":\"Capítulos sobre amistad y conflictos: el mismo léxico de este módulo con vídeo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",
