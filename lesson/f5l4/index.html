",\"options\":[\"Ich gern Tee\",\"Ich mag Tee\",\"Ich mag gern Tee\"],\"answer\":1,\"whyWrong\":[\"gern no es un verbo — falta el verbo de la frase\",null,\"Redundante: o mögen + sustantivo, o verbo + gern\"],\"itemIds\":[\"lieber\",\"waslieber\"],\"tip\":\"mögen + sustantivo (Ich mag Tee) · verbo + gern (Ich trinke gern Tee). Dos caminos, no los mezcles.\"},{\"id\":\"f5l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta del hobby\",\"text\":\"Was ist dein ___? — Schwimmen!\",\"answers\":[\"Lieblingshobby\"],\"translation\":\"¿Cuál es tu hobby favorito? — ¡Nadar!\",\"hints\":[\"Lieblings- + Hobby, todo junto\",\"Con mayúscula: es sustantivo\"],\"itemIds\":[\"lieblingshobby\",\"schwimmen\"]},{\"id\":\"f5l4e7\",\"type\":\"build\",\"prompt\":\"Construye — el verbo sigue en 2ª posición\",\"target\":\"Am liebsten esse ich Pizza\",\"translation\":\"Lo que más me gusta es comer pizza\",\"distractors\":[\"ich esse gern\",\"mag\"],\"itemIds\":[\"amliebstenesse\"],\"tip\":\"«Am liebsten» ocupa la posición 1, así que el verbo va 2º y el sujeto (ich) después: esse ich.\"},{\"id\":\"f5l4e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Was trinkst du lieber, Tee oder Kaffee?\",\"translation\":\"¿Qué prefieres tomar, té o café?\",\"hints\":[\"Empieza con «Was trinkst du...»\",\"oder = o\"],\"itemIds\":[\"waslieber\"]},{\"id\":\"f5l4e9\",\"type\":\"type\",\"prompt\":\"Traduce\",\"question\":\"Prefiero tomar té\",\"answers\":[\"Ich trinke lieber Tee\"],\"hints\":[\"verbo + lieber + lo preferido\",\"trinken con ich: trinke\"],\"itemIds\":[\"ichtrinkelieber\"]},{\"id\":\"f5l4e11\",\"type\":\"cloze\",\"prompt\":\"¿gefällt o gefallen?\",\"text\":\"Ihm ___ Pferde. (le gustan)\",\"answers\":[\"gefallen\"],\"translation\":\"A él le gustan los caballos.\",\"hints\":[\"¿Lo que gusta es una cosa o varias? Pferde es plural\",\"Con plural: g-e-f-a-l-l-e-n\"],\"itemIds\":[\"gefallen\",\"pferd\"],\"tip\":\"El verbo concuerda con LO QUE gusta: Ihm gefällt der Hund (s
