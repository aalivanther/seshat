l we agree ___ a split?\",\"answers\":[\"However\",\"didn't\",\"on\"],\"bank\":[\"However\",\"didn't\",\"on\",\"So\",\"don't\",\"at\"],\"itemIds\":[\"enb2m11idratherwenot\",\"enb2m11shallweagreeon\"]},{\"id\":\"enb2m11l8e3\",\"type\":\"write\",\"prompt\":\"150-200. Al comité. Tres ideas, un plan. Concesión a la vista.\",\"scenario\":\"Mrs Beckett ha pedido propuestas por escrito para el viernes. Escribes la tuya: no es una carta al director, es un papel para la junta. Tienes que salir con un plan, no con un empate.\",\"genre\":\"proposal\",\"register\":\"polite\",\"bullets\":[\"Reconoce al menos una idea que no es la tuya (concesión).\",\"Rechaza gastar el fondo entero en una sola cosa, con alternativa.\",\"Cierra con un plan concreto (split / lift first / boiler + garden…).\"],\"checks\":[{\"re\":\"(to be fair|having said that|although|however|I see)\",\"label\":\"Hay concesión\"},{\"re\":\"(rather we didn't|what if we|split|instead)\",\"label\":\"Hay rechazo con alternativa\"},{\"re\":\"(agree on|I would recommend|there ought to be|the plan is)\",\"label\":\"Hay cierre en plan\"}],\"frame\":[\"Proposal to the residents' meeting\",\"Párrafo 1 — la cifra y las ideas (concesión)\",\"Párrafo 2 — rechazo con alternativa\",\"Párrafo 3 — Shall we agree / I would recommend / there ought to be\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"however\",\"although\",\"therefore\",\"to be fair\",\"having said that\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"Proposal to the residents' meeting\\nThe sinking fund holds £14,600. Four ideas are on the table: a lift, the garden, a new boiler, and paint. To be fair, Ben's paint would be visible by the end of the month. However, visibility is not the same as step-free access, and Nora on the ground floor cannot wait for a nicer wall.\\nI'd rather we didn't spend the whole sum on one item. What if we split it two ways? A boiler that actually lasts, because neither of the last repairs did, and a first payment on a stairlift. The garden, having said that, is not the leftover: it can come from the next fund.\\nNever had we sat down with a figure like this. There ought to be a plan that more than one floor can live with. I would therefore recommend the split, and I would be grateful if the chair could put this to a vote on Friday.\",\"itemIds\":[\"enb2m11asinkingfund\",\"enb2m11whatifwesplits\",\"enb2m11idratherwenot\",\"enb2m11thereoughttobe\",\"enb2m11seldomhadwesat\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m11-2\",\"book\":\"We should decide.\",\"real\":\"Let's just call it.\",\"meaning\":\"Cerremos ya / decidamos de una vez.\",\"when\":\"Call it es de rellano y de pub: se acaba la discusión. En el Part 3, Shall we agree on…? es lo que oye el examinador como cierre de plan. We should decide es el libro, y se queda corto porque no nombra el qué.\",\"register\":\"amigos\",\"exam\":\"Shall we agree on the lift?\",\"note\":\"Call it no lleva objeto del tema: por eso en el examen hay que poner on the lift, on a split, on Friday.\",\"sound\":\"lets dchast kool it\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m11shallweagreeon\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática d
