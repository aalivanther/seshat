den. Sie schreibt, eine Quelle behaupte das. Der Konjunktiv I — «habe bestätigt», «sei geschlossen worden» — ist die Distanz zwischen der Behauptung und der Zeitung. Wer nur die Schlagzeile liest, unterschreibt. Wer den Konjunktiv liest, nicht. Genau diese Distanz, sagt Herr Vogel am Abend im Treppenhaus, fehle in dem Boulevardblatt, das er im Briefkasten gefunden habe. Dort stehe dieselbe Geschichte ohne sei und ohne Quelle.\n\nEinen Tag später erschien die Stellungnahme der Firma Nordlicht GmbH. «Die Meldung ist falsch.» Das Unternehmen bestreitet, personenbezogene Daten verkauft zu haben. Es räumt ein, im Januar einen Vertrag über anonymisierte Nutzungsstatistiken geschlossen zu haben. «Das lässt sich belegen. Die Behauptung der Zeitung lässt sich so nicht belegen.» Beigelegt sei, so der Sprecher, ein Auszug aus dem Vertrag. Ob das ausreicht, entscheidet nicht die Schlagzeile.\n\nNordlicht wirft der Redaktion vor, die Quelle nicht geprüft zu haben. Nach Angaben der Firma sei der Zeuge ein Mitarbeiter, dem in der Probezeit gekündigt worden sei. Er habe ein Motiv. Die Firma will nichts von einem Verkauf gewusst haben — und setzt das «will» genau so: als Distanz zu einer [[Unterstellung|insinuación no demostrada]], nicht als Geständnis. Sofía liest den Satz zweimal. Will ist hier kein Wunsch. Will ist eine Wand zwischen der Firma und der Anschuldigung.\n\nEin Bericht in der Wiener Zeitung «Der Standard» vom selben Tag fällt vorsichtiger aus. [[Heuer|este año — Austria y sur de Alemania; en el escrito estándar: dieses Jahr]] seien mehrere Berliner Firmen mit ähnlichen Vorwürfen konfrontiert worden, schreibt die Korrespondentin, es habe sich aber in mindestens zwei Fällen herausgestellt, dass die Meldung übertrieben gewesen sei. Die Glaubwürdigkeit hänge nicht von der Schlagzeile ab, sondern von der Quelle und von der Reichweite, die ein Algorithmus der Empörung schenkt. Lucía Ortega schickt Sofía den Link aus Valencia, mit einer einzigen Frage: «¿De quién es la frase?»\n\nNico schreibt Sofía: «Ist das wahr?» Sie antwortet nicht mit ja oder nein. Sie antwortet: «Einer Quelle zufolge. Laut der Firma nicht.» Zwischen den zwei Sätzen liegt das ganze B2."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m1l6\",\"phaseId\":\"b2m1\",\"title\":\"Zwei Stimmen, eine Meldung\",\"subtitle\":\"Lectura larga: dos textos que se contradicen\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras que cargan los dos textos\",\"itemIds\":[\"b2m1reichweite\",\"b2m1algorithmus\",\"b2m1sichherausstellen\",\"b2m1unbestaetigt\",\"b2m1widersprechen\",\"b2m1glaubwuerdigkeit\",\"b2m1unterstellung\",\"b2m1nutzerdaten\",\"b2m1redaktionsschluss\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: contrastar, no comprender una sola voz\",\"body\":\"El Lesen Teil 1 y el Teil 4 del Goethe B2 no te preguntan «qué dice el texto». Te preguntan \u003cb\u003equién dice qué\u003c/b\u003e, y una misma persona puede ser la respuesta varias veces. Por eso aquí hay \u003cb\u003edos textos que no se ponen de acuerdo\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eLee primero las preguntas. Luego busca, en cada texto, no el dato: la \u003cb\u003eatribución\u003c/b\u003e. ¿Va en indicativo (lo firma el periódico) o en Konjunktiv I / sollen (lo firma otro)?\u003cbr/\u003e\u003cbr/\u003eNota plurizéntrica, como en el examen: el segundo texto cita un periódico vienés. Verás \u003cb\u003e[[Jänner|enero — en Austria; en Alemania se dice Januar]]\u003c/b\u003e y \u003cb\u003e[[heuer|este año — Austria y sur de Alemania; en el escrito estándar: dieses Jahr]]\u003c/b\u003e. El Goethe los glosa a pie de página, igual que aquí. El elenco sigue en Berlín: Clara Hofmann no se ha mudado a Viena.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l6e1\",\"type\":\"read\",\"prompt\":\"Lee los dos textos y responde. Las palabras subrayadas suenan y traducen.\",\"title\":\"Zwei Stimmen, eine Meldung\",\"source\":\"Berliner Abendblatt (Clara Hofmann) und Stellungnahme der Nordlicht GmbH; mit einem Zitat aus «Der Standard», Wien\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m1l6e1q1\",\"q\":\"Was behauptet Clara Hofmann — und was behauptet sie nicht?\",\"options\":[\"Que los datos se han vendido: lo firma el periódico en indicativo.\",\"Que una fuente interna lo afirma: el periódico se distancia con Konjunktiv I.\",\"Que Nordlicht ha confesado la venta en un comunicado.\"],\"answer\":1,\"inference\":true,\"why\":\"«habe bestätigt», «sei geschlossen worden»: K I. El periódico no escribe «hat verkauft». La Schlagzeile sí suena a hecho; el cuerpo, no.\"},{\"id\":\"b2m1l6e1q2\",\"q\":\"Was räumt Nordlicht ein, und was bestreitet die Firma?\",\"options\":[\"Admite un contrato de estadísticas anónimas; niega la venta de datos personales.\",\"Admite la venta y niega que la fuente exista.\",\"No admite nada: desmiente el texto entero, incluido el contrato de enero.\"],\"answer\":0,\"why\":\"«Es räumt ein, im Januar einen Vertrag über anonymisierte Nutzungsstatistiken geschlossen zu haben» y, a la vez, «bestreitet, personenbezogene Daten verkauft zu haben».\"},{\"id\":\"b2m1l6e1q3\",\"q\":\"Warum setzt Nordlicht das Verb «will» in «will nichts gewusst haben»?\",\"options\":[\"Porque el jefe quiere saber más.\",\"Porque la propia empresa se distancia de la acusación: sostiene que no sabía nada.\",\"Porque «will» aquí significa deber.\"],\"answer\":1,\"inference\":true,\"why\":\"El propio texto lo dice: «setzt das will genau so: als Distanz zu einer Unterstellung». Es el wollen de distanciamiento de la lección 4.\"},{\"id\":\"b2m1l6e1q4\",\"q\":\"Welche Haltung nimmt «Der Standard» ein?\",\"options\":[\"Da la razón entera a Hofmann.\",\"Da la razón entera a Nordlicht.\",\"Más cauta: este año ha habido casos parecidos y en al menos dos la noticia estaba hinchada.\"],\"answer\":2,\"why\":\"«vorsichtiger»; «es habe sich … herausgestellt, dass die Meldung übertrieben gewesen sei». Ni con uno ni con el otro.\"},{\"id\":\"b2m1l6e1q5\",\"q\":\"Was meint Sofía mit «Einer Quelle zufolge. Laut der Firma nicht»?\",\"options\":[\"Que Nico tiene que elegir un bando.\",\"Que la verdad es la de la fuente interna.\",\"Que un B2 no afirma: atribuye las dos voces y deja el hueco a la vista.\"],\"answer\":2,\"inference\":true,\"why\":\"Los dos giros de fuente (zufolge, laut) y ninguna de las dos frases en indicativo suyo. El módulo entero cabe en esa respuesta de WhatsApp.\"}],\"itemIds\":[\"b2m1schlagzeile\",\"b2m1quelle\",\"b2m1sei\",\"b2m1willgewusst\",\"b2m1sichherausstellen\",\"b2m1algorithmus\",\"b2m1reichweite\",\"b2m1glaubwuerdigkeit\",\"b2m1nutzerdaten\",\"b2m1unterstellung\",\"b2m1redaktionsschluss\"],\"tip\":\"Si fallaste una de inferencia: vuelve al modo del verbo, no al vocabulario. El dueño de la frase está en sei/habe/soll/will, no en el sustantivo.\"},{\"id\":\"b2m1l6e2\",\"type\":\"mc\",\"prompt\":\"El austriacismo del texto\",\"question\":\"„im Jänner“ — ¿qué escribirías en un examen Goethe (estándar alemán)?\",\"options\":[\"im Januar\",\"im Jänner\",\"heuer\"],\"answer\":0,\"whyWrong\":[null,\"Jänner es austriaco: se reconoce, no se produce en el Goethe\",\"heuer es «este año», no un mes\"],\"itemIds\":[\"b2m1nachangaben\"],\"tip\":\"Reconocer Jänner te da un punto de lectura. Escribirlo en el Forumsbeitrag te mete ruido. La norma de producción sigue siendo la alemana.\"},{\"id\":\"b2m1l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa lo que resultó\",\"text\":\"Es hat sich ___ , dass die Meldung übertrieben war.\",\"answers\":[\"herausgestellt\"],\"translation\":\"Resultó que la noticia estaba hinchada.\",\"hints\":[\"sich herausstellen en Perfekt\",\"heraus-ge-stellt\"],\"itemIds\":[\"b2m1sichherausstellen\"]},{\"id\":\"b2m1l6e4\",\"type\":\"transform\",\"prompt\":\"De indicativo (tuyo) a K I (de Hofmann)\",\"source\":\"Die Quelle hat den Vertrag im Januar geschlossen.\",\"instruction\":\"Cítalo como lo escribiría Hofmann\",\"answers\":[\"Die Quelle habe den Vertrag im Januar geschlossen\",\"Laut Hofmann habe die Quelle den Vertrag im Januar geschlossen\"],\"translation\":\"La fuente (dice Hofmann) cerró el contrato en enero.\",\"hints\":[\"hat → habe\",\"Hofmann no firma el hecho\"],\"itemIds\":[\"b2m1habegearbeitet\",\"b2m1quelle\"]},{\"id\":\"b2m1l6e5\",\"type\":\"gapbank\",\"prompt\":\"Resume el conflicto con los giros de fuente\",\"text\":\"___ Hofmann soll die Firma Daten verkauft haben. ___ der Firma handelt es sich um anonymisierte Statistiken. Einem Bericht aus Wien ___ war die Meldung in zwei Fällen übertrieben.\",\"answers\":[\"Laut\",\"Laut\",\"zufolge\"],\"bank\":[\"Laut\",\"zufolge\",\"Wegen\",\"Trotz\",\"Angeblich\"],\"translation\":\"Según Hofmann, la empresa habría vendido datos. Según la empresa, se trata de estadísticas anónimas. Según un informe de Viena, en dos casos la noticia estaba hinchada.\",\"itemIds\":[\"b2m1laut\",\"b2m1zufolge\"],\"tip\":\"Dos «Laut» no son trampa: cada uno abre una voz distinta. zufolge, detrás, cierra la tercera.\"},{\"id\":\"b2m1l6e6\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Die Firma widerspricht gegen die Meldung.\",\"answers\":[\"Die Firma widerspricht der Meldung.\"],\"why\":\"widersprechen rige dativo, sin preposición. El «gegen» es calco de «contradeci r CONTRA».\",\"translation\":\"La empresa contradice la noticia.\",\"itemIds\":[\"b2m1widersprechen\",\"b2m1meldung\"]},{\"id\":\"b2m1l6e7\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Según una fuente, la noticia no está confirmada\",\"answers\":[\"Einer Quelle zufolge ist die Meldung unbestätigt\",\"Laut einer Quelle ist die Meldung unbestätigt\",\"Einer Quelle zufolge sei die Meldung unbestätigt\"],\"hints\":[\"zufolge detrás o laut delante\",\"unbestätigt\"],\"itemIds\":[\"b2m1zufolge\",\"b2m1unbestaetigt\",\"b2m1quelle\"]}]}],\"resources\":[{\"label\":\"Der Standard — Startseite\",\"url\":\"https://www.derstandard.at/\",\"note\":\"Prensa austriaca: busca un titular y caza Jänner, heuer o sei/habe. Es el alemán del Lesen, no el de producción.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
