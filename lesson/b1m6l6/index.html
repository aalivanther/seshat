eg in einen Beruf: Man arbeitet im Betrieb und geht ein bis zwei Tage pro Woche in die Berufsschule. Anders als ein Studium wird sie vom ersten Monat an bezahlt. Wer keine Matura* hat, kann trotzdem einen Beruf lernen — und später, falls er will, doch noch studieren.\n\nNeu ist, dass immer mehr Erwachsene diesen Weg ein zweites Mal gehen. Laut einer Studie des Bundesinstituts für Berufsbildung ist inzwischen fast jeder zehnte Auszubildende älter als 27. Fachleute erklären das mit zwei Entwicklungen: Die Berufe verändern sich schneller als früher, und in der Pflege, im Handwerk und in der Technik werden dringend Leute gesucht. „Wer heute umsteigen will, findet fast immer einen Platz“, sagt eine Beraterin der Volkshochschule Wien.\n\nEinfach ist es trotzdem nicht. Während der Ausbildung verdient Martin etwa ein Drittel von dem, was er vorher bekommen hat. Seine Miete ist geblieben, und seine Freunde verstehen ihn nicht immer. „Am Anfang habe ich jeden Abend [[gerechnet|hecho cuentas]], ob das Geld bis zum Monatsende reicht“, erzählt er. Geholfen hat ihm, dass seine Partnerin Vollzeit arbeitet und dass ein Teil der Kurskosten zurückgezahlt worden ist.\n\nUnd die Sprache? In den Kursen der Volkshochschulen sitzen viele, die erst seit kurzem im Land sind. Sie hören dort immer denselben Satz: Ohne Deutsch geht es nicht weiter. Wer einen Abschluss nachholen will, braucht mindestens B1 — nicht, weil die Prüfung so schwer wäre, sondern weil im Betrieb den ganzen Tag geredet wird.\n\nMartin ist in zwei Jahren fertig. Ob er dann mehr verdient als früher, weiß er nicht. „Aber ich schlafe besser“, sagt er.\n\n*die Lehre = österr./schweiz. für „Ausbildung“ · *die Matura = österr./schweiz. für „Abitur“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m6l6\",\"phaseId\":\"b1m6\",\"title\":\"Lesen: Mit 30 noch einmal von vorn\",\"subtitle\":\"Un reportaje de prensa — inferir la postura, no buscar datos\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Formación profesional en los tres países\",\"itemIds\":[\"b1m6lehre\",\"b1m6matura\",\"b1m6abitur\",\"b1m6berufsschule\",\"b1m3derbetrieb\",\"b1m6umschulung\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un reportaje (Lesen Teil 2)\",\"body\":\"El Teil 2 son dos textos de prensa con 3 preguntas cada uno, y las preguntas \u003cb\u003eno piden datos\u003c/b\u003e: piden la intención, la actitud o la conclusión. Estrategia: lee el texto entero una vez sin parar, y solo después las preguntas.\u003cbr/\u003e\u003cbr/\u003eVocabulario que necesitas antes de entrar:\u003cbr/\u003e· \u003cb\u003edie duale Ausbildung\u003c/b\u003e: el camino DACH. Se trabaja en una empresa y se va uno o dos días a la [[Berufsschule|escuela de FP]]. Se cobra desde el primer mes.\u003cbr/\u003e· \u003cb\u003edie Lehre\u003c/b\u003e es lo mismo en Austria y Suiza; la \u003cb\u003eMatura\u003c/b\u003e es el Abitur austriaco y suizo. El examen es plurizéntrico y anota estas palabras a pie de página, como el texto de abajo.\u003cbr/\u003e· \u003cb\u003edie Umschulung\u003c/b\u003e: cambiar de profesión con formación pagada.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje y responde. Las preguntas van en alemán, como en el examen.\",\"title\":\"Mit 30 noch einmal von vorn\",\"source\":\"Reportaje de prensa (edición austriaca)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m6l6e1q1\",\"q\":\"Wie funktioniert die duale Ausbildung?\",\"options\":[\"Man studiert und arbeitet danach im Betrieb.\",\"Man arbeitet im Betrieb und geht an ein bis zwei Tagen in die Berufsschule.\",\"Man lernt zwei Berufe gleichzeitig.\"],\"answer\":1,\"why\":\"Párrafo 2. „dual“ no significa dos profesiones: significa empresa + escuela a la vez.\"},{\"id\":\"b1m6l6e1q2\",\"q\":\"Was sagt die Studie über die Auszubildenden?\",\"options\":[\"Fast jeder Zehnte ist älter als 27.\",\"Fast jeder Zweite hat keine Matura.\",\"Fast alle kommen aus der Gastronomie.\"],\"answer\":0,\"why\":\"Párrafo 3: «fast jeder zehnte Auszubildende älter als 27». Cuidado con los números en el Teil 2: suelen poner dos parecidos.\"},{\"id\":\"b1m6l6e1q3\",\"q\":\"Warum hat Martin seinen alten Beruf aufgegeben?\",\"options\":[\"Weil er zu wenig verdient hat.\",\"Weil er seine Abende verloren hat.\",\"Weil er die Küche nie gemocht hat.\"],\"answer\":1,\"inference\":true,\"why\":\"Él mismo dice «Ich habe gut verdient, aber ich bin abends nie zu Hause gewesen»: el dinero no era el problema, el horario sí. La respuesta está en el «aber».\"},{\"id\":\"b1m6l6e1q4\",\"q\":\"Was war für Martin am Anfang am schwierigsten?\",\"options\":[\"Die Prüfungen in der Berufsschule.\",\"Das Geld bis zum Monatsende.\",\"Der Kontakt zu den jüngeren Kollegen.\"],\"answer\":1,\"inference\":true,\"why\":\"«Am Anfang habe ich jeden Abend gerechnet, ob das Geld reicht» + gana un tercio y la renta sigue igual. El texto nunca dice «Geld war das Problem»: hay que juntarlo.\"},{\"id\":\"b1m6l6e1q5\",\"q\":\"Welche Aussage passt am besten zum ganzen Text?\",\"options\":[\"Ein Neuanfang mit 30 ist möglich, kostet aber Geld und Kraft.\",\"Eine Ausbildung lohnt sich nur für junge Leute.\",\"Ohne Matura findet man in Österreich keine Stelle.\"],\"answer\":0,\"inference\":true,\"why\":\"Pregunta global: el texto muestra las dos caras (hay plazas y ayuda, pero se gana un tercio y los amigos no lo entienden) y cierra con «Aber ich schlafe besser».\"}],\"itemIds\":[\"b1m6lehre\",\"b1m6matura\",\"b1m6berufsschule\",\"b1m3derbetrieb\",\"b1m6lautstudie\"],\"tip\":\"Fíjate en la última frase de cada párrafo: en un reportaje alemán casi siempre lleva la valoración. Ahí se responden las preguntas de inferencia.\"},{\"id\":\"b1m6l6e2\",\"type\":\"mc\",\"prompt\":\"Alemán plurizéntrico\",\"question\":\"En un anuncio de Viena lees «Lehrstelle frei». ¿Qué ofrecen?\",\"options\":[\"Una plaza de formación profesional\",\"Un puesto de profesor\",\"Un piso vacío\"],\"answer\":0,\"whyWrong\":[null,\"Profesor sería «Lehrer/in»; die Lehre es la formación, no la enseñanza\",\"«frei» aquí significa «vacante», no vivienda\"],\"itemIds\":[\"b1m6lehre\",\"b1m6ausbildungsplatz\"],\"tip\":\"Lehre (AT/CH) = Ausbildung (DE). El examen anota estas equivalencias a pie de página: úsalas, están para eso.\"},{\"id\":\"b1m6l6e3\",\"type\":\"match\",\"prompt\":\"Empareja los títulos y lugares del sistema\",\"pairs\":[{\"target\":\"die Berufsschule\",\"source\":\"la escuela de formación profesional\"},{\"target\":\"der Betrieb\",\"source\":\"la empresa donde te formas\"},{\"target\":\"die Matura\",\"source\":\"el bachillerato austriaco/suizo\"},{\"target\":\"die Umschulung\",\"source\":\"la reconversión profesional\"}],\"itemIds\":[\"b1m6berufsschule\",\"b1m3derbetrieb\",\"b1m6matura\",\"b1m6umschulung\"]},{\"id\":\"b1m6l6e4\",\"type\":\"mc\",\"prompt\":\"Inferir la actitud\",\"question\":\"„Aber ich schlafe besser“, sagt Martin. ¿Qué quiere decir?\",\"options\":[\"Que está satisfecho aunque gane menos\",\"Que la nueva formación es más fácil\",\"Que trabaja de noche\"],\"answer\":0,\"whyWrong\":[null,\"El texto no dice en ningún momento que sea fácil: dice lo contrario\",\"En la gastronomía era donde trabajaba de noche\"],\"itemIds\":[\"b1m6sichlohnen\"],\"tip\":\"Dormir mejor = tranquilidad, no horario. En el Lesen Teil 4 la postura se dice SIEMPRE así, en imágenes.\"},{\"id\":\"b1m6l6e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase del reportaje\",\"text\":\"Anders als ein Studium ___ die Ausbildung vom ersten Monat an bezahlt.\",\"answers\":[\"wird\"],\"translation\":\"A diferencia de una carrera, la formación se paga desde el primer mes.\",\"hints\":[\"Pasiva: auxiliar + Partizip\",\"w...\"],\"itemIds\":[\"b1m6studium\",\"b1m6ausbildungsplatz\"],\"tip\":\"Espiral del módulo 5: la pasiva sigue ahí. En prensa aparece en cada párrafo.\"},{\"id\":\"b1m6l6e6\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el resumen con el banco\",\"text\":\"Martin macht eine Ausbildung, ___ er einen neuen Beruf lernen will. Er verdient jetzt weniger als früher. ___ ist er zufrieden. ___ er abends müde ist, geht er zur Berufsschule.\",\"answers\":[\"weil\",\"Trotzdem\",\"Obwohl\"],\"bank\":[\"weil\",\"Trotzdem\",\"Obwohl\",\"Damit\",\"Denn\",\"dass\"],\"translation\":\"Martin hace una formación porque quiere aprender un oficio nuevo. Ahora gana menos que antes. Aun así está contento. Aunque por las noches está cansado, va a la escuela de FP.\",\"itemIds\":[\"b1m6obwohl\",\"b1m6trotzdem\",\"b1m6berufsschule\"]},{\"id\":\"b1m6l6e7\",\"type\":\"errorfix\",\"prompt\":\"Un compañero resumió el texto así. Arréglalo.\",\"wrong\":\"Trotzdem er weniger verdient, macht er weiter.\",\"answers\":[\"Obwohl er weniger verdient, macht er weiter.\",\"Obwohl er weniger verdient, macht er weiter\"],\"why\":\"trotzdem no puede abrir una subordinada: para eso está obwohl. Si quieres trotzdem, tienes que partir en dos frases: «Er verdient weniger. Trotzdem macht er weiter».\",\"translation\":\"Aunque gana menos, sigue adelante.\",\"itemIds\":[\"b1m6obwohl\",\"b1m6trotzdem\"]},{\"id\":\"b1m6l6e8\",\"type\":\"transform\",\"prompt\":\"Transforma: cuenta lo que dijo la asesora\",\"source\":\"„Wer heute umsteigen will, findet fast immer einen Platz“, sagt die Beraterin.\",\"instruction\":\"Cuéntalo con dass\",\"answers\":[\"Die Beraterin sagt, dass man heute fast immer einen Platz findet\",\"Die Beraterin sagt, dass man heute fast immer einen Platz findet.\"],\"translation\":\"La asesora dice que hoy casi siempre se encuentra plaza.\",\"hints\":[\"dass + … + verbo al final\",\"Die Beraterin sagt, dass man heute fast immer ...\"],\"itemIds\":[\"b1m6beratung\",\"b1m6ersagtdass\"]},{\"id\":\"b1m6l6e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera\",\"source\":\"Die Ausbildung ist nicht einfach.\",\"forbid\":[\"einfach\",\"nicht\"],\"answers\":[\"Die Ausbildung ist anstrengend\",\"Die Ausbildung ist anstrengend.\",\"Die Ausbildung ist schwer\",\"Die Ausbildung ist schwer.\",\"Die Ausbildung ist schwierig\",\"Die Ausbildung ist hart\"],\"translation\":\"La formación no es fácil.\",\"hints\":[\"Sin «einfach» y sin «nicht»: di lo mismo en positivo\",\"Die Ausbildung ist ...\"],\"itemIds\":[\"b1m6ausbildungsplatz\"],\"tip\":\"Decir en positivo lo que sabías decir solo en negativo es rango léxico puro: sube el criterio «Wortschatz».\"},{\"id\":\"b1m6l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Según un estudio, cada vez más adultos hacen una formación profesional\",\"answers\":[\"Laut einer Studie machen immer mehr Erwachsene eine Ausbildung\",\"Laut einer Studie machen immer mehr Erwachsene eine Ausbildung.\"],\"hints\":[\"Laut abre → inversión (machen immer mehr…)\",\"Laut einer Studie machen immer mehr ...\"],\"itemIds\":[\"b1m6lautstudie\",\"b1m6ausbildungsplatz\"],\"tip\":\"Citar un dato al empezar un comentario da autoridad y te resuelve la primera frase del examen escrito.\"},{\"id\":\"b1m6l6e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · información a un grupo en la jornada de puertas abiertas · tarea 1 de 2. Dos escuchas.\",\"audio\":\"So, herzlich willkommen zum Infoabend der Berufsschule. Bevor wir mit dem Rundgang anfangen, mach ich's kurz: drei Hinweise. Erstens: Die Anmeldung für das nächste Schuljahr läuft nur bis zum fünfzehnten März, danach nehmen wir niemanden mehr auf. Zweitens: Wer die Ausbildung neben dem Beruf machen möchte, kommt zweimal pro Woche abends – das dauert dann allerdings ein Jahr länger. Und drittens, das hören Sie heute noch oft genug: ohne Betrieb kein Ausbildungsplatz. Den Vertrag mit der Firma brauchen Sie vorher, nicht nachher.\",\"question\":\"„Wer die Ausbildung neben dem Beruf macht, ist genauso schnell fertig.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«das dauert dann allerdings ein Jahr länger»\",null],\"itemIds\":[\"b1m6berufsschule\",\"b1m6sichanmeldenfuer\"],\"tip\":\"«mach ich’s kurz: drei Hinweise» te acaba de dar el mapa del texto: vienen tres bloques. Coloca la afirmación en su bloque y ya sabes dónde escuchar.\"},{\"id\":\"b1m6l6e12\",\"type\":\"audiomc\",\"prompt\":\"Misma información, segunda tarea. Dos escuchas.\",\"audio\":\"So, herzlich willkommen zum Infoabend der Berufsschule. Bevor wir mit dem Rundgang anfangen, mach ich's kurz: drei Hinweise. Erstens: Die Anmeldung für das nächste Schuljahr läuft nur bis zum fünfzehnten März, danach nehmen wir niemanden mehr auf. Zweitens: Wer die Ausbildung neben dem Beruf machen möchte, kommt zweimal pro Woche abends – das dauert dann allerdings ein Jahr länger. Und drittens, das hören Sie heute noch oft genug: ohne Betrieb kein Ausbildungsplatz. Den Vertrag mit der Firma brauchen Sie vorher, nicht nachher.\",\"question\":\"¿Qué hace falta ANTES de tener la plaza en la escuela?\",\"options\":[\"Un contrato con una empresa\",\"Un certificado de idiomas\",\"Aprobar una prueba de acceso\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ningún certificado de idiomas sale en la charla\",\"Tampoco hay prueba de acceso: lo que hay es una empresa\"],\"itemIds\":[\"b1m6ausbildungsplatz\",\"b1m6lehre\"],\"tip\":\"«Ohne Betrieb kein Ausbildungsplatz» — sin verbo, como un eslogan. Ese alemán telegráfico es habitual en las charlas y desconcierta a quien espera oraciones enteras.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Lesen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Haz el Teil 2 oficial con reloj: 20 minutos, dos textos de prensa, tres preguntas cada uno.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
