filment\u003c/b\u003e — si has hecho lo que se te pedía. Las dos funciones, completas.\u003cbr/\u003e· \u003cb\u003eAccuracy and Range of grammar\u003c/b\u003e — no solo si aciertas: también \u003cb\u003ecuánta variedad\u003c/b\u003e arriesgas.\u003cbr/\u003e· \u003cb\u003eAccuracy and Range of vocabulary\u003c/b\u003e — y aquí dentro va \u003cb\u003ela ortografía\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003eOrganisation\u003c/b\u003e — cómo se enlazan las ideas… \u003cb\u003ey la puntuación\u003c/b\u003e. Sí: la coma, el punto y los párrafos \u003cb\u003eson puntos\u003c/b\u003e, no estética. Para un hispanohablante esto es una noticia, porque en español la coma se pone más por respiración que por regla.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa plantilla narrativa:\u003c/b\u003e saludo con una frase de alegría → función 1 (describir, con un detalle concreto: un nombre, una hora, una calle) → función 2 (proponer, con un plan cerrado) → cierre corto. \u003cb\u003eTres párrafos, no uno.\u003c/b\u003e Un bloque de 120 palabras sin puntos y aparte le cuesta puntos a Organisation aunque cada frase sea correcta.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY las tres trampas verbales que se cobran aquí:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ePerfecto contra pasado (trampa 1).\u003c/b\u003e \u003ci\u003eI have finished it two days ago\u003c/i\u003e es el calco de «lo he terminado hace dos días», que en España es normal. En inglés, con marcador de tiempo cerrado —\u003ci\u003eyesterday, last week, two days ago\u003c/i\u003e— va \u003cb\u003epasado simple, siempre\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003ePast perfect (trampa 12).\u003c/b\u003e Al contar, el inglés ordena: lo que pasó antes va en \u003ci\u003ehad + participio\u003c/i\u003e. \u003ci\u003eWhen I arrived, the class had already started\u003c/i\u003e no es lo mismo que \u003ci\u003ethe class started\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eFuturo con matiz (trampa 11).\u003c/b\u003e Detrás de \u003ci\u003ewhen, as soon as, before, after, until, if\u003c/i\u003e el inglés pone \u003cb\u003epresente\u003c/b\u003e, aunque hables de mañana. En español decimos «cuando llegue» —subjuntivo— y al traducir sale \u003ci\u003ewhen I will arrive\u003c/i\u003e. No existe."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l7\",\"phaseId\":\"enb1m12\",\"title\":\"Writing Part 2: the four criteria\",\"subtitle\":\"Cien a ciento veinte palabras con dos funciones, y los cuatro criterios convertidos en lista de comprobación\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de la carta a un amigo\",\"itemIds\":[\"enb1m12thetwofunctions\",\"enb1m12guesswhat\",\"enb1m12makeadayofit\",\"enb1m12cantwaittoseeyou\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La tarea 2, y los cuatro criterios que la corrigen\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l7e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de la carta informal\",\"pairs\":[{\"target\":\"the two functions\",\"source\":\"las dos cosas que la tarea manda hacer\"},{\"target\":\"Guess what!\",\"source\":\"¡A que no sabes qué!\"},{\"target\":\"Why don't we make a day of it?\",\"source\":\"¿Y si nos tiramos el día entero?\"},{\"target\":\"I can't wait to see you!\",\"source\":\"¡Tengo unas ganas de verte!\"}],\"itemIds\":[\"enb1m12thetwofunctions\",\"enb1m12guesswhat\",\"enb1m12makeadayofit\",\"enb1m12cantwaittoseeyou\"],\"tip\":\"«make a day of it» es una colocación entera: no se traduce pieza a pieza. Significa aprovechar la ocasión y quedarse todo el día, y en una carta informal vale por tres frases.\"},{\"id\":\"enb1m12l7e2\",\"type\":\"mc\",\"prompt\":\"Los cuatro criterios\",\"question\":\"¿Dónde puntúa la puntuación —las comas, los puntos, los párrafos—?\",\"options\":[\"En Organisation, junto con el enlace entre ideas.\",\"En Accuracy and Range of grammar.\",\"En ninguno: la puntuación no se corrige.\"],\"answer\":0,\"whyWrong\":[null,\"Grammar mide estructuras. La puntuación va en el criterio que mide cómo se organiza el texto.\",\"Sí se corrige, y está escrito en el handbook: «how coherently ideas are linked together in the text and how accurate the punctuation is».\"],\"tip\":\"Para un hispanohablante esto vale dinero: la coma antes de «and» en una enumeración, el punto y aparte entre las dos funciones y no usar el punto y coma como comodín. Tres reglas y un criterio entero mejora.\"},{\"id\":\"enb1m12l7e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el tiempo verbal — es la trampa número uno del nivel\",\"wrong\":\"I have finished the course two days ago.\",\"answers\":[\"I finished the course two days ago.\"],\"why\":\"«Lo he terminado hace dos días» es perfectamente normal en España, y por eso el calco sale solo. Pero en inglés \u003cb\u003e«ago» cierra el periodo\u003c/b\u003e: si el momento está terminado y dicho —\u003ci\u003eyesterday, last week, in 2023, two days ago\u003c/i\u003e—, el verbo va en \u003cb\u003epasado simple\u003c/b\u003e, sin excepción. El present perfect es para periodos que llegan hasta hoy: \u003ci\u003eI have finished it\u003c/i\u003e (y aquí está), \u003ci\u003eI have lived here for two years\u003c/i\u003e.\",\"translation\":\"Terminé el curso hace dos días.\",\"itemIds\":[\"enb1m1already\"]},{\"id\":\"enb1m12l7e4\",\"type\":\"transform\",\"prompt\":\"Ordena el relato: lo que pasó ANTES va en pluscuamperfecto\",\"source\":\"When I arrived, the class started.\",\"instruction\":\"Di que la clase ya había empezado antes de que tú llegaras\",\"answers\":[\"When I arrived, the class had already started\",\"When I arrived, the class had started\",\"The class had already started when I arrived\"],\"translation\":\"Cuando llegué, la clase ya había empezado.\",\"hints\":[\"Lo anterior va con «had» + participio\",\"When I arrived, the class had ___ ___\"],\"itemIds\":[\"enb1m1already\"],\"tip\":\"Las dos frases son correctas y cuentan cosas distintas: con pasado simple, la clase empezó justo al entrar tú; con pluscuamperfecto, llegaste tarde. El español tiene el pluscuamperfecto y el alumno no lo transfiere — se conforma con el pasado y pierde la mitad del relato.\"},{\"id\":\"enb1m12l7e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el plan. Ojo al tiempo verbal detrás de cada conector.\",\"text\":\"I'll text you as soon as I ___ at the station. If it ___ on Saturday, we can go to the museum instead. And when the exam ___ over, I'm going to sleep for a week.\",\"answers\":[\"arrive\",\"rains\",\"is\"],\"bank\":[\"arrive\",\"rains\",\"is\",\"will arrive\",\"will rain\",\"will be\"],\"translation\":\"Te escribo en cuanto llegue a la estación. Si llueve el sábado, podemos ir al museo. Y cuando termine el examen, voy a dormir una semana.\",\"itemIds\":[\"enb1m12thetwofunctions\"],\"tip\":\"Los tres distractores son la misma trampa tres veces. En español decimos «cuando llegue», «cuando acabe» —subjuntivo—, y como el subjuntivo no existe en inglés, el alumno lo sustituye por futuro. La explicación que funciona: el inglés ya sabe que es futuro por la otra mitad de la frase; repetirlo le sobra.\"},{\"id\":\"enb1m12l7e6\",\"type\":\"mc\",\"prompt\":\"Organisation en la práctica\",\"question\":\"Tienes 115 palabras correctas escritas de un tirón, sin un solo punto y aparte. ¿Qué criterio se resiente?\",\"options\":[\"Organisation: las ideas no están agrupadas ni enlazadas.\",\"Task fulfilment: la tarea está cumplida igual.\",\"Vocabulary: el léxico no depende de los párrafos.\"],\"answer\":0,\"whyWrong\":[null,\"Cumplida sí está — por eso el problema no es ese. Un texto puede cumplir la tarea y estar mal organizado.\",\"El léxico es el mismo tenga párrafos o no. Lo que cambia es si se ve dónde acaba una idea y empieza otra.\"],\"tip\":\"Regla de bolsillo: \u003cb\u003euna función, un párrafo\u003c/b\u003e. Si la tarea pide describir y proponer, tu carta tiene dos párrafos centrales. El examinador ve la estructura antes de leer una palabra.\"},{\"id\":\"enb1m12l7e7\",\"type\":\"cloze\",\"prompt\":\"Completa la apertura informal\",\"text\":\"___ what! I've finally booked my exam.\",\"answers\":[\"Guess\"],\"translation\":\"¡A que no sabes qué! Por fin he reservado el examen.\",\"hints\":[\"Del verbo «adivinar»\",\"G-u-e-s-s\"],\"itemIds\":[\"enb1m12guesswhat\"],\"tip\":\"«Guess what!» abre una carta informal con energía y en dos palabras. Es lo contrario exacto de «I am writing to inform you»: elige según la tarea, nunca por costumbre.\"},{\"id\":\"enb1m12l7e8\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿esta frase cumple la función de DESCRIBIR o la de PROPONER?\",\"categories\":[\"Describe: cuenta cómo es\",\"Propone: ofrece un plan\"],\"items\":[{\"text\":\"The whole street closes for the summer fair.\",\"bucket\":0},{\"text\":\"Why don't we make a day of it?\",\"bucket\":1},{\"text\":\"Nora brings out her old chairs and there's music until midnight.\",\"bucket\":0},{\"text\":\"You could come down on the Friday night.\",\"bucket\":1},{\"text\":\"It's always the last Saturday in July.\",\"bucket\":0},{\"text\":\"We could go to the market before the fair starts.\",\"bucket\":1}],\"itemIds\":[\"enb1m12makeadayofit\",\"enb1m12thetwofunctions\"],\"tip\":\"Fíjate en la columna de la derecha: las tres llevan modal o pregunta. Proponer en inglés es «could», «why don't we», «shall we» — nunca el presente pelado, que suena a orden.\"},{\"id\":\"enb1m12l7e9\",\"type\":\"build\",\"prompt\":\"Construye la propuesta\",\"target\":\"Why don't we make a day of it\",\"translation\":\"¿Y si nos tiramos el día entero?\",\"distractors\":[\"for\",\"shall\"],\"itemIds\":[\"enb1m12makeadayofit\"],\"tip\":\"Las dos fichas que sobran son las dos salidas falsas: «Why don't we FOR make…» es el calco de la preposición, y «shall» pertenece a la otra fórmula («Shall we make a day of it?»), que también vale pero no es esta.\"},{\"id\":\"enb1m12l7e10\",\"type\":\"write\",\"prompt\":\"TAREA 2 en condiciones: la carta a un amigo. 100-120 palabras, LAS DOS funciones, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, te escribe. Contéstale cumpliendo LAS DOS funciones que te pide la tarea: describir tu día favorito del año Y proponer qué podríais hacer juntas ese día. Si solo describes, has hecho media tarea.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Hi Valeria! Everyone here keeps talking about summer plans and I realised I've never asked you: what's your favourite day of the whole year? Mine's the first Sunday of the Christmas market, obviously. Anyway — I've got holiday to use up, so tell me when yours is and maybe I can come down.\"},\"bullets\":[\"Describe cuál es tu día favorito del año y cómo es.\",\"Propón qué podríais hacer juntas ese día.\"],\"checks\":[{\"re\":\"(favourite day|favorite day|my favourite|the best day)\",\"label\":\"Describes cuál es tu día favorito\"},{\"re\":\"(why don'?t we|we could|shall we|you could come)\",\"label\":\"Le propones un plan concreto\"}],\"frame\":[\"Saludo y una línea de alegría: «Hi Emma,» + «Guess what!»\",\"Párrafo 1 — FUNCIÓN 1: cuál es tu día y cómo es, con un detalle concreto (un nombre, una hora, una calle)\",\"Párrafo 2 — FUNCIÓN 2: el plan. «Why don't we…?» / «You could come down on…» / «We could…»\",\"Cierre corto y tu nombre. Sin «Yours sincerely»: eso es de la carta formal\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"although\",\"since\",\"besides\",\"therefore\",\"otherwise\",\"unless\",\"for instance\",\"of course\",\"at least\",\"anyway\",\"despite\",\"though\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nGuess what! I've finally booked my exam for the sixth of June!\\nMy favourite day of the year is the last Saturday in July, when the whole street closes for the summer fair. Nora brings out her old chairs, Mr Patel gives away the fruit he hasn't sold, and, of course, there's music until midnight. I've been going since my first summer here, and, although it always rains, I've never missed one.\\nWhy don't we make a day of it this year? You could come down on the Friday night, and we could go to the market before the fair starts. Bring your camera: the lights are lovely.\\nI can't wait to see you!\\nValeria\",\"itemIds\":[\"enb1m12guesswhat\",\"enb1m12makeadayofit\",\"enb1m12cantwaittoseeyou\",\"enb1m12thetwofunctions\",\"enb1m1although\"],\"tip\":\"Mira el modelo cuando termines y cuenta sus párrafos: tres, uno por función más el saludo. Y cuenta sus conectores: «since», «of course», «although». Ninguno es raro y los tres son B1 verificado — «moreover» y «furthermore» son B2 y aquí no pintan nada.\"},{\"id\":\"enb1m12l7e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa exactamente?\",\"source\":\"I can't wait to see you!\",\"answers\":[\"¡Tengo unas ganas de verte!\",\"¡Me muero de ganas de verte!\",\"¡Estoy deseando verte!\"],\"itemIds\":[\"enb1m12cantwaittoseeyou\"],\"tip\":\"Literalmente sería «no puedo esperar», pero no significa impaciencia: significa ilusión. Es el cierre estándar de una carta informal cuando hay un plan de por medio.\"},{\"id\":\"enb1m12l7e12\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «wait» y sin «can't»\",\"source\":\"I can't wait to see you!\",\"forbid\":[\"wait\",\"can't\",\"cannot\"],\"answers\":[\"I'm really looking forward to seeing you\",\"I'm so excited about seeing you\",\"It will be great to see you\"],\"translation\":\"¡Tengo unas ganas de verte!\",\"hints\":[\"Hay una fórmula del módulo 1 con «forward»\",\"I'm really looking f___ to s___ you\"],\"itemIds\":[\"enb1m1lookforwardto\"],\"tip\":\"Ojo al «to» de «looking forward to»: es preposición, no infinitivo, así que detrás va \u003cb\u003e-ing\u003c/b\u003e. «I look forward to see you» es el calco venenoso del nivel, porque parece un infinitivo y no lo es.\"},{\"id\":\"enb1m12l7e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Cumple las dos funciones: si solo describes, has hecho media tarea.\",\"answers\":[\"Cover both functions: if you only describe, you have done half the task\",\"Cover both functions. If you only describe, you have done half the task\",\"Do both functions: if you only describe, you've done half the task\"],\"hints\":[\"«las dos funciones» = both functions\",\"Cover both functions: if you only describe…\"],\"itemIds\":[\"enb1m12thetwofunctions\"],\"tip\":\"Fíjate en «if you only describe», presente. Detrás de «if» tampoco va futuro. Es la misma regla de la trampa 11, esta vez en tu propia frase de cierre.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
