",\"body\":\"Hoy juegas con las reglas exactas: pregunta ANTES del play, \u003cb\u003edos escuchas\u003c/b\u003e y a cazar. \u003cb\u003eParte 1\u003c/b\u003e: el dato — hora, precio, letra ([[the recording|la grabación]] repite, tú confirmas). \u003cb\u003eParte 2\u003c/b\u003e: la mejor réplica. \u003cb\u003eParte 3\u003c/b\u003e: la [[conversation|conversación]] de dos personas — te preguntan el [[topic|tema]], el lugar o la relación. Y de regalo, la batería de sonidos del curso: el golpe 13/30, las letras traidoras A/E/I, los precios… y el par nuevo \u003cb\u003elive/leave\u003c/b\u003e (i corta = vivir, i larga = irse): la vocal corta/larga es EL sonido que más respuestas decide en A1.\",\"table\":[[\"Parte\",\"Cazas\"],[\"1\",\"el dato: hora, precio, letra deletreada\"],[\"2\",\"la mejor réplica a lo que oyes\"],[\"3\",\"tema, lugar o relación de 2 hablantes\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m12l7e1\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: la hora — 2 escuchas\",\"audio\":\"The film starts at half past six.\",\"question\":\"¿A qué hora empieza la película?\",\"options\":[\"6:30\",\"6:15\",\"7:30\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"half past = y MEDIA, no y cuarto\",\"half past SIX: la base son las 6, no las 7\"],\"itemIds\":[\"enthefilmstarts\",\"enhalfpast\"],\"tip\":\"Primera escucha: ¿de qué va? (una película). Segunda: el dato (6:30). Nunca al revés.\"},{\"id\":\"ena1m12l7e2\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: el precio 13/30 — 2 escuchas\",\"audio\":\"The tickets cost thirty pounds.\",\"question\":\"¿Cuánto cuestan las entradas?\",\"options\":[\"£30\",\"£13\",\"£33\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"thirteen sonaría zée-TÍIN, golpe al final — oíste ZÉE-ti, plano\",\"thirty-three serían dos palabras seguidas\"],\"itemIds\":[\"enthirteen30\",\"enpound\"],\"tip\":\"El par que decide aprobados, por última vez antes del examen: golpe al principio = decena.\"},{\"id\":\"ena1m12l7e3\",\"type\":\"audiomc\",\"prompt\":\"Parte 1: el deletreo — 2 escuchas\",\"audio\":\"My name is Jane. J-A-N-E.\",\"question\":\"¿Qué nombre escribes?\",\"options\":[\"Jane\",\"Jean\",\"Jine\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La A suena «éi» y va en segunda posición — E-A al revés sería Jean\",\"Con I en segunda posición sonaría «ái»\"],\"itemIds\":[\"enletterA\",\"enletterE\",\"engj\"],\"tip\":\"El triángulo A=éi, E=íi, I=ái, con la J=yéi delante: apunta la LETRA que nombran, no el sonido español.\"},{\"id\":\"ena1m12l7e4\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: la réplica del precio — 2 escuchas\",\"audio\":\"How much is the coffee?\",\"question\":\"Elige la mejor réplica:\",\"options\":[\"It's two pounds fifty.\",\"Yes, please.\",\"You're welcome.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Yes, please responde a un ofrecimiento\",\"You're welcome responde a un gracias\"],\"itemIds\":[\"enbestreply\",\"enhowmuchisit\"],\"tip\":\"How much…? pide un precio: la réplica correcta SIEMPRE lleva números o pounds dentro.\"},{\"id\":\"ena1m12l7e5\",\"type\":\"audiomc\",\"prompt\":\"Parte 2: la réplica del ofrecimiento — 2 escuchas\",\"audio\":\"Do you want some tea?\",\"question\":\"Elige la mejor réplica:\",\"options\":[\"Yes, please!\",\"Fine, thanks.\",\"It's next to the bank.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Fine, thanks responde a How are you?\",\"Eso respondería a un Where is…?\"],\"itemIds\":[\"enbestreply\"],\"tip\":\"Ofrecimiento → Yes, please / No, thank you. Las fórmulas del módulo 5 son munición de examen.\"},{\"id\":\"ena1m12l7e6\",\"type\":\"audiomc\",\"prompt\":\"Parte 3: ¿dónde están? — 2 escuchas\",\"audio\":\"Can I have a sandwich and an orange juice, please? | Sure. Eat here or take away? | Here, please.\",\"question\":\"¿Dónde están los dos hablantes?\",\"options\":[\"En un café\",\"En un supermercado\",\"En el metro\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"En el súper nadie te pregunta eat here or take away\",\"tube no su
