3ePor qué se falla, y no es por vocabulario:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003ePor no leer la ficha antes.\u003c/b\u003e Los rótulos («Day the centre closes early», «Number of computers») te dicen \u003cb\u003equé tipo de dato\u003c/b\u003e buscas: un día, un número, un sitio. Con eso ya vas medio hecho.\u003cbr/\u003e2. \u003cb\u003ePor escribir de más.\u003c/b\u003e Si el hueco dice «Where to sign up» y escribes «you have to go to reception with some identification», \u003cb\u003eestá mal\u003c/b\u003e: pasan de tres palabras. La respuesta es \u003cb\u003eat reception\u003c/b\u003e.\u003cbr/\u003e3. \u003cb\u003ePor los números.\u003c/b\u003e \u003ci\u003esixteen\u003c/i\u003e y \u003ci\u003esixty\u003c/i\u003e, \u003ci\u003ethirteen\u003c/i\u003e y \u003ci\u003ethirty\u003c/i\u003e se distinguen \u003cb\u003esolo por dónde cae el acento\u003c/b\u003e (SIX-teen / SIX-ty). El examen lo sabe y los usa.\u003cbr/\u003e4. \u003cb\u003ePor no escuchar dos veces con dos cabezas distintas.\u003c/b\u003e Primera pasada: escribe lo que pilles, aunque sea a medias. Segunda: \u003cb\u003erellena huecos y comprueba\u003c/b\u003e. Y usa el cuaderno mientras suena — en el examen se puede.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eOrtografía:\u003c/b\u003e cuenta. Una palabra mal escrita hasta el punto de no reconocerse no puntúa. Los números puedes ponerlos \u003cb\u003een cifra\u003c/b\u003e (16) o en letra (sixteen): las dos valen.\u003cbr/\u003e\u003cbr/\u003eHoy vas a oír la charla de bienvenida de un centro cívico entera, dos veces, y luego a rellenar los siete huecos uno a uno."])</script><script>self.__next_f.push([1,"18:T49a,Good morning, everyone, and welcome to the Wentworth Learning Centre. I'll give you the practical information first, and then we'll have a look round. The centre is open from eight in the morning until nine at night, except on Thursdays, when we close at five for staff training, so do check before you come on a Thursday. Now, classes. You can look at the timetable online, but you can't sign up online: to sign up you have to come to reception, and bring some identification. The study room is on the first floor, and there are sixteen computers in there. They're free, but you can only book two hours a day. If you'd like to use the gym next door, our members pay four pounds a month, which is about half the normal price. The language classes, English, Spanish and Somali, are all on the second floor, in rooms twelve to fifteen. For your first class you don't need a book: the teacher gives you everything. Just bring a notebook and something to write with. And finally, every Friday at one o'clock there's a free talk in the café. This month they're all about local history, and next month, I'm told, they'll be about music. Right. Any questions before we start the tour?19:T49a,Good morning, everyone, and welcome to the Wentworth Learning Centre. I'll give you the practical information first, and then we'll have a look round. The centre is open from eight in the morning until nine at night, except on Thursdays, when we close at five for staff training, so do check before you come on a Thursday. Now, classes. You can look at the timetable online, but you can't sign up online: to sign up you have to come to reception, and bring some identification. The study room is on the first floor, and there are sixteen computers in there. They're free, but you can only book two hours a day. If you'd like to use the gym next door, our members pay four pounds a month, which is about half the normal price. The language classes, English, Spanish and Somali, are all on the second floor, in rooms twelve to fifteen. For your first class you don't need a book: the teacher gives you everything. Just bring a notebook and something to write with. And finally, every Friday at one o'clock there's a free talk in the café. This month they're all about local history, and next month, I'm told, they'll be about music. Right. Any questions before we start the tour?"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l10\",\"phaseId\":\"enb1m3\",\"title\":\"Exam lab: Listening Part 3\",\"subtitle\":\"Un monólogo largo, una ficha con siete huecos y un máximo de tres palabras\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos reglas de la ficha\",\"itemIds\":[\"enb1m3makenotes\",\"enb1m3nomorethanthree\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 3, y por qué se falla\",\"body\":\"$17\",\"table\":[[\"Rótulo de la ficha\",\"Qué dato buscas\",\"Respuesta válida\"],[\"Day the centre closes early\",\"un día de la semana\",\"(on) Thursdays\"],[\"Where to sign up\",\"un sitio\",\"at reception\"],[\"Number of computers\",\"una cifra\",\"sixteen / 16\"],[\"Cost of gym membership\",\"un precio\",\"four pounds\"],[\"What to bring\",\"una cosa\",\"a notebook\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Part 3, ¿qué es lo primero que se hace?\",\"options\":[\"Leer los rótulos de la ficha y decidir qué TIPO de dato busca cada hueco\",\"Escribir todo lo que se oiga y elegir después\",\"Esperar a la segunda escucha para empezar a escribir\"],\"answer\":0,\"whyWrong\":[null,\"No da tiempo: es un monólogo de varios minutos. Sin saber qué buscas, escribes lo que no sirve.\",\"Al revés: en la primera pasada se escribe lo que se pilla, y la segunda es para completar y comprobar.\"],\"itemIds\":[\"enb1m3makenotes\",\"enlistencarefully\"],\"tip\":\"Los rótulos son la mitad del ejercicio. «Number of…» ya te dice que viene una cifra; «Day…», que viene un día. Tu oído sabe qué cazar antes de que empiece el audio.\"},{\"id\":\"enb1m3l10e2\",\"type\":\"mc\",\"prompt\":\"La regla de las tres palabras\",\"question\":\"El hueco dice «Where to sign up». ¿Cuál de estas respuestas NO valdría?\",\"options\":[\"you have to go to reception with some identification\",\"at reception\",\"reception\"],\"answer\":0,\"whyWrong\":[null,\"Dos palabras y el dato exacto: perfecta.\",\"Una palabra, y también vale: el baremo acepta la versión mínima.\"],\"itemIds\":[\"enb1m3nomorethanthree\"],\"tip\":\"Escribir de más no es «por si acaso»: es una respuesta inválida. Si te sale una frase, tacha todo lo que no sea EL dato y quédate con dos palabras.\"},{\"id\":\"enb1m3l10e3\",\"type\":\"audiomc\",\"prompt\":\"PRIMERA ESCUCHA · La charla entera. Lee la pregunta antes del play, y usa el cuaderno mientras suena: vas a necesitar esas notas siete veces.\",\"notepad\":true,\"audio\":\"$18\",\"question\":\"¿De qué trata la charla?\",\"options\":[\"De cómo funciona el centro, antes de la visita guiada\",\"De los resultados de los cursos del año pasado\",\"De un cambio permanente de horario\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De resultados no se dice ni una palabra.\",\"El horario se menciona, pero como información normal, no como cambio.\"],\"itemIds\":[\"enb1m3makenotes\",\"enb1m3announced\"],\"tip\":\"La primera frase te da el género y el sitio: «welcome to… I'll give you the practical information first». En el Part 3 esa frase inicial vale oro: te dice qué clase de datos van a caer.\"},{\"id\":\"enb1m3l10e4\",\"type\":\"audiomc\",\"prompt\":\"SEGUNDA ESCUCHA · La misma charla. Ahora completa tus notas mientras suena.\",\"notepad\":true,\"audio\":\"$19\",\"question\":\"¿Qué hay que hacer para apuntarse a una clase?\",\"options\":[\"Ir a recepción con una identificación\",\"Rellenar el formulario de la web\",\"Llamar por teléfono un jueves\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El horario sí está en la web; apuntarse, no: «you can't sign up online».\",\"El jueves es el día que cierran antes, no el de las inscripciones.\"],\"itemIds\":[\"enb1m3doyouknowif\",\"enform\"],\"tip\":\"«You CAN look at the timetable online, BUT you can't sign up online» — el examen adora esa estructura: te da primero lo que sí se pue 9\",\"type\":\"listen\",\"prompt\":\"FICHA · hueco 5 de 7 — «Floor for the language classes». Escucha y escribe 1-3 palabras.\",\"text\":\"the second floor\",\"translation\":\"la segunda planta\",\"hints\":[\"Es una planta del edificio\",\"the se...\"],\"itemIds\":[\"enb1m3nomorethanthree\"],\"tip\":\"Ojo: en el audio salen tres plantas distintas (la sala de estudio, las clases de idiomas, las salas doce a quince). El rótulo dice «language classes»: solo esa.\"},{\"id\":\"enb1m3l10e10\",\"type\":\"listen\",\"prompt\":\"FICHA · hueco 6 de 7 — «What to bring to the first class». Escucha y escribe 1-3 palabras.\",\"text\":\"a notebook\",\"translation\":\"un cuaderno\",\"hints\":[\"Es una cosa que se lleva a clase\",\"a note...\"],\"itemIds\":[\"enb1m3makenotes\",\"enbook\"],\"tip\":\"Y fíjate en la trampa: justo antes dice «you don't need a book». Si te quedas con la primera palabra que suena a material de clase, escribes lo contrario de lo que se pide.\"},{\"id\":\"enb1m3l10e11\",\"type\":\"listen\",\"prompt\":\"FICHA · hueco 7 de 7 — «Topic of this month's talks». Escucha y escribe 1-3 palabras.\",\"text\":\"local history\",\"translation\":\"historia local\",\"hints\":[\"Es el tema de las charlas de ESTE mes\",\"local h...\"],\"itemIds\":[\"entopic\"],\"tip\":\"El audio da dos temas: este mes y el que viene. El rótulo dice «this month's», así que la música no vale. Los huecos de tema casi siempre traen un distractor así al lado.\"},{\"id\":\"enb1m3l10e12\",\"type\":\"mc\",\"prompt\":\"La trampa de los números\",\"question\":\"¿Cómo distingues «sixteen» de «sixty» cuando van sueltos?\",\"options\":[\"Por dónde cae el acento y por la -n final: six-TEEN frente a SIX-ty\",\"Por la vocal: una es más larga que la otra\",\"Por el contexto, porque suenan exactamente igual\"],\"answer\":0,\"whyWrong\":[null,\"La vocal de la primera sílaba es la misma en las dos.\",\"No suenan igual: el acento las separa, y el examen cuenta con que lo oigas.\"],\"itemIds\":[\"ensixteen60\"],\"
