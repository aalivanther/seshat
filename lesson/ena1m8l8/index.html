\u003c/b\u003e (contar tus aficiones + preguntar por las suyas) en 30-40 palabras — el formato exacto del Writing del A1.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m8l8e1\",\"type\":\"mc\",\"prompt\":\"El cartel, dato 1\",\"question\":\"¿Qué día hay fútbol?\",\"options\":[\"Los sábados\",\"Todos los días\",\"Los lunes\"],\"answer\":0,\"whyWrong\":[null,\"every day es la piscina, no el fútbol\",\"El lunes es cuando CIERRA la piscina\"],\"itemIds\":[\"enclub\",\"enplayfootball\"],\"tip\":\"En el Reading, cada dato pertenece a SU frase. every day suena bien — pero era de otra actividad.\"},{\"id\":\"ena1m8l8e2\",\"type\":\"mc\",\"prompt\":\"El cartel, dato 2\",\"question\":\"«First class free!» — ¿qué significa?\",\"options\":[\"La primera clase es gratis\",\"Todas las clases son gratis\",\"La primera clase está completa\"],\"answer\":0,\"whyWrong\":[null,\"First = la primera, solo esa\",\"Eso sería full — free es gratis\"],\"itemIds\":[\"enfree\"],\"tip\":\"free = gratis o libre, según el cartel. En un club deportivo con precios, casi siempre gratis.\"},{\"id\":\"ena1m8l8e3\",\"type\":\"mc\",\"prompt\":\"El cartel de la piscina\",\"question\":\"Es lunes y quieres nadar en el club. ¿Puedes?\",\"options\":[\"No — la piscina cierra los lunes\",\"Sí — abre todos los días\",\"Sí, pero solo por la tarde\"],\"answer\":0,\"whyWrong\":[null,\"every day dice la primera línea — pero la última lo corrige: closed on Mondays\",\"El horario 7am–10pm no aplica al día cerrado\"],\"itemIds\":[\"enclosed\",\"engoswimming\"],\"tip\":\"El examen adora el cartel que se corrige a sí mismo: la excepción va al final. Lee HASTA el final.\"},{\"id\":\"ena1m8l8e4\",\"type\":\"order\",\"prompt\":\"Ordena el mensaje de Amy\",\"sentences\":[\"Hiya! How are you?\",\"I go swimming at the new club on Saturdays.\",\"The first class is free!\",\"Do you want to come?\"],\"translation\":\"¡Hola! ¿Qué tal? Voy a nadar al club nuevo los sábados. ¡La primera clase es gratis! ¿Quieres venir?\",\"hints\":[\"Primero el saludo, luego la noticia\",\"La invitación cierra el mensaje\"],\"itemIds\":[\"engoswimming\",\"enclub\",\"enfree\"]},{\"id\":\"ena1m8l8e5\",\"type\":\"cloze\",\"prompt\":\"Completa tu plan del sábado\",\"text\":\"I go ___ on Saturdays. (a nadar)\",\"answers\":[\"swimming\"],\"translation\":\"Voy a nadar los sábados.\",\"hints\":[\"go + actividad en -ing\",\"go swimm...\"],\"itemIds\":[\"engoswimming\"],\"tip\":\"go swimming, go shopping: el inglés va «a nadar» con el -ing puesto. Otro sitio donde el traje -ing es obligatorio.\"},{\"id\":\"ena1m8l8e6\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora tú\",\"source\":\"Ben goes swimming every day.\",\"instruction\":\"Ahora hablas de TI — dilo\",\"answers\":[\"I go swimming every day\",\"I go swimming every day.\"],\"translation\":\"Voy a nadar todos los días.\",\"hints\":[\"De he a I: la -s se va\",\"I go ...\"],\"itemIds\":[\"engoswimming\",\"eneveryday\"],\"tip\":\"El camino inverso al de siempre: al pasar de Ben a I, goes pierde la -s. La regla funciona en los dos sentidos.\"},{\"id\":\"ena1m8l8e7\",\"type\":\"build\",\"prompt\":\"Construye tu afición completa\",\"target\":\"I play the guitar in my free time\",\"translation\":\"Toco la guitarra en mi tiempo libre\",\"distractors\":[\"plays\",\"music\"],\"itemIds\":[\"enguitar\",\"enfreetime\"],\"tip\":\"play the guitar CON the (los instrumentos lo llevan); play football SIN the (los deportes no). Par de reglas gemelas.\"},{\"id\":\"ena1m8l8e9\",\"type\":\"read\",\"prompt\":\"Lee el texto y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"Saturday people\",\"text\":\"Ben works from Monday to Friday, so his free time is [[short|corto]]. He loves football: on Saturdays he plays in the park with his friends, and in the evening he watches the [[match|el partido]] on TV.\u003cbr/\u003e\u003cbr/\u003eValeria doesn't like football, but she loves music. She plays the guitar every day, and at the weekend she goes swimming at the new club near the station. \\\"The first class is free,\\\" she says to Ben. \\\"Come with me!\\\"\u003cbr/\u003e\u003cbr/\u003e\\\"I can't swim,\\\" says Ben.\u003cbr/\u003e\u003cbr/\u003e\\\"[[Nobody|nadie]] can swim in the first class,\\\" says Valeria. \\\"That's the [[point|la gracia]].\\\"\",\"questions\":[{\"id\":\"ena1m8l8e9q1\",\"q\":\"When does Ben play football?\",\"options\":[\"On Saturdays\",\"Every evening\",\"From Monday to Friday\"],\"answer\":0,\"why\":\"«on Saturdays he plays in the park». Por la tarde lo VE en la tele, no lo juega.\"},{\"id\":\"ena1m8l8e9q2\",\"q\":\"What does Valeria do every day?\",\"options\":[\"She plays the guitar.\",\"She goes swimming.\",\"She watches football on TV.\"],\"answer\":0,\"why\":\"«She plays the guitar every day». Nadar es solo el fin de semana.\"},{\"id\":\"ena1m8l8e9q3\",\"q\":\"Why does Valeria say \\\"Nobody can swim in the first class\\\"?\",\"options\":[\"Because she wants Ben to come with her.\",\"Because the class is only for children.\",\"Because the club is closed at the weekend.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice el texto: se deduce de que Ben pone una excusa («I can't swim») y ella se la desmonta.\"},{\"id\":\"ena1m8l8e9q4\",\"q\":\"Ben and Valeria…\",\"options\":[\"…like different things, but they want to do things together.\",\"…both love football.\",\"…never go out at the weekend.\"],\"answer\":0,\"inference\":true,\"why\":\"Hay que juntar dos datos: a ella no le gusta el fútbol, y aun así le pide a Ben que vaya al club con ella.\"},{\"id\":\"ena1m8l8e9q5\",\"q\":\"How much is the first class at the club?\",\"options\":[\"Nothing — it's free.\",\"Five pounds.\",\"The text doesn't say.\"],\"answer\":0,\"why\":\"«The first class is free» — el mismo dato del cartel de arriba.\"}],\"itemIds\":[\"enfreetime\",\"enplayfootball\",\"enguitar\",\"engoswimming\",\"enclub\",\"enfree\"],\"tip\":\"Fíjate en la última pregunta que hace Valeria: en el examen, las frases de diálogo
