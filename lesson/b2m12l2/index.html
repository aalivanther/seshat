achtbusse. Eine Homeoffice-Pflicht unterschreibe ich nicht. Die Belegschaft ist nicht das Büro.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAnna, Krankenschwester.\u003c/b\u003e Ich kann nicht von zu Hause pflegen. Punkt. Wer zwei Tage Homeoffice zur Norm erklärt, erklärt meinen Beruf zur Ausnahme, und Ausnahmen werden in der Grafik unsichtbar. Ich gönne Sofía die zwei Tage. Ich will sie nicht als Maß für alle. Im Wesentlichen fehlt mir der Bus nach Mitternacht, nicht ein Schreibtisch.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLeo, Student.\u003c/b\u003e Ich wäre froh um zwei Tage, weil die Bibliothek voll ist und ich in Ruhe schreiben könnte. Pflicht fände ich trotzdem falsch: nicht jeder hat ein Zimmer, in dem man denken kann. Im Wohnheim teile ich mir den Tisch mit zwei anderen. Wahl ja. Zwang nein. Und bitte ohne Moral für die, die kommen müssen.\u003cbr/\u003e\u003cbr/\u003eSofía noch einmal, in einem Nachtrag: Wer Pflicht sagt, meint oft die Bahn. Ich meine den Code, den ich in Ruhe schreiben kann, und den Takt, den Anna nachts nicht hat. Beides in denselben Topf zu werfen ist genau der Fehler von Lesen Teil 1, wenn man nur das Thema sieht und nicht die Haltung. Kai bleibt bei der Küche. Leo bleibt beim Wohnheim. Anna bleibt beim Bus. Ich bleibe bei der Wahl. Vier Stimmen, ein Forum, und ja: eine Person kann mehrmals die Lösung sein, wenn die Aussage zwei Dinge von ihr trifft.\n\nDie vier Texte sind das Material. Die Aussagen unten sind das, was der Test umformuliert. Eine Person kann mehrmals die Lösung sein.\n\nNachsatz der Redaktion: Die vier Beiträge sind Absicht. Wer nur nach dem Wort Homeoffice sucht, verfehlt die Haltung. Sofía und Leo wollen Wahl. Kai und Anna wollen sichtbar bleiben, wo kein Schreibtisch ist. Das Forum wiederholt Personen, weil das Leben sie wiederholt: dieselbe Köchin, dieselbe Nacht, dieselbe Bahn. Wer das Forum überfliegt, sieht ein Thema. Wer die Haltungen liest, sieht vier Personen, nicht nur ein Schlagwort."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m12l2\",\"phaseId\":\"b2m12\",\"title\":\"Lesen Teil 1: cuatro voces, una puede repetir\",\"subtitle\":\"Einstellungen verstehen — se acabó el «0» del B1\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"La tarea que ya no es Richtig/Falsch\",\"itemIds\":[\"b2m12einstellungen\",\"b2m12viertexte\",\"b2m12mehrmals\",\"b1m12gzzuordnen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cuatro foros, nueve ítems, una persona puede ser la respuesta varias veces\",\"body\":\"El Teil 1 del B1 era un texto personal y seis Richtig/Falsch. El del B2 es otra operación: \u003cb\u003ecuatro textos de foro\u003c/b\u003e (~580 palabras en el Modellsatz) y \u003cb\u003easignar afirmaciones a personas\u003c/b\u003e. \u003cb\u003eUna persona puede ser la solución más de una vez. No existe el «0»\u003c/b\u003e del Teil 3 de B1. Si te sobra una afirmación, has emparejado mal, no has encontrado un hueco oficial.\u003cbr/\u003e\u003cbr/\u003eTiempo sugerido: \u003cb\u003e18 minutos\u003c/b\u003e. Estrategia: lee las afirmaciones, subraya la postura (no el tema), busca quién la sostiene aunque sea con otras palabras. Es el resumen-sin-copiar del m11, aplicado a un test.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m12l2e1\",\"type\":\"read\",\"prompt\":\"Cuatro voces sobre el Homeoffice. Una puede repetir. No hay «0».\",\"title\":\"Forum: Zwei Tage Homeoffice — Pflicht?\",\"source\":\"Lesen Teil 1, Modellformat (vier Beiträge)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m12l2e1q1\",\"q\":\"Wer lehnt eine Pflicht vor allem deshalb ab, weil nicht alle einen Schreibtisch haben?\",\"options\":[\"Sofía\",\"Kai\",\"Anna\",\"Leo\"],\"answer\":1,\"why\":\"Kai: oficios sin escritorio; la plantilla no es la oficina.\"},{\"id\":\"b2m12l2e1q2\",\"q\":\"Wer verbindet Homeoffice mit entlastetem Nahverkehr — und will trotzdem keine Pflicht?\",\"options\":[\"Sofía\",\"Kai\",\"Anna\",\"Leo\"],\"answer\":0,\"why\":\"Sofía
