un texto inglés, esta parte se adivina. Si lo sabes, son seis marcas que no dependen de «más vocabulario».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl cambio respecto al B1.\u003c/b\u003e En B1 el Part 1 eran cinco textos cortos con un hueco léxico. En B2 ese ejercicio desaparece. El Part 2 de B2 es un texto largo con frases enteras extraídas. No es un cloze de palabra: es un cloze de \u003cb\u003efunción\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEstrategia, en cuatro pasos:\u003c/b\u003e\u003cbr/\u003e1. Lee el texto con los huecos \u003cb\u003esin mirar el banco\u003c/b\u003e. Adivina la función de cada hueco: ¿frase-tema? ¿contraste? ¿cierre?\u003cbr/\u003e2. Lee las siete frases y etiquétalas igual: tema, contraste, transición, detalle, cierre, opinión, la que sobra.\u003cbr/\u003e3. Encaja por función, no por palabra repetida. Las trampas se construyen repitiendo un sustantivo del párrafo anterior.\u003cbr/\u003e4. La que sobra casi nunca es absurda: es \u003cb\u003eplausible y de otro párrafo\u003c/b\u003e. Si te encaja en dos huecos, no es esa.\u003cbr/\u003e\u003cbr/\u003eEl texto de abajo es nuestro, escrito con ese patrón. Ninguno es del papel oficial."])</script><script>self.__next_f.push([1,"18:T559,A school in east London asked families which languages they used at home. The list ran to forty-three. [1] ______ English, meanwhile, was the language of lessons, of the playground, and of every letter in the book bag. [2] ______ That split is now ordinary. [3] ______ By eleven, many of those children understand the home language far better than they can write it. Teachers call this a fluency gap. [4] ______ Schools have tried after-school classes, bilingual letters, and — more rarely — using the home language in the classroom itself. [5] ______ What the research does show is modest: children who keep a strong home language do not fall behind in English. [6] ______ The policy argument, the briefing says, belongs somewhere else.\n\nFrases:\nA  It is not a wave of new arrivals; many of the children were born here.\nB  The written word, in the heritage language, simply does not turn up enough times to stick.\nC  Turkish, Yoruba, Polish, Bengali, Spanish, Portuguese and Arabic all had more than a dozen families.\nD  None of these programmes is cheap, and none of them reaches every family.\nE  In conclusion, bilingualism should be banned in London schools.\nF  The advantage is small, and it is not the disaster that some columns announce.\nG  Outer boroughs sit lower, closer to a third, but the direction of travel is the same.\n\n¿Qué frase va en el hueco 1?"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l10\",\"phaseId\":\"enb2m1\",\"title\":\"Exam lab: Reading Part 2\",\"subtitle\":\"Seis frases extraídas, siete opciones: el párrafo al revés\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de la tarea\",\"itemIds\":[\"enb2m1gappedtext\",\"enb2m1leftoversentence\",\"enb2m1transition\",\"enb2m1refersback\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es el Part 2, y por qué este módulo lo entrena\",\"body\":\"$17\",\"table\":[[\"Lo que pide el hueco\",\"La pista en el texto\",\"La pista en la frase\"],[\"frase-tema\",\"empieza párrafo, el resto desarrolla\",\"afirma de qué va el bloque\"],[\"contraste\",\"el párrafo anterior iba en una dirección\",\"whereas / however / that said\"],[\"transición\",\"cierra una idea y abre la siguiente\",\"refers back + anuncia\"],[\"detalle\",\"la frase-tema ya está\",\"ejemplo, cifra, nombre\"],[\"la que sobra\",\"encaja «en general»\",\"no tiene ancla en NINGÚN hueco\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Reading Part 2 del B2, ¿qué decide la frase correcta de un hueco?\",\"options\":[\"La función: qué tiene que hacer esa frase en el párrafo\",\"Las palabras que se repiten entre el hueco y
