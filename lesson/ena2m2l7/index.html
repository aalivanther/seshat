t/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T65f,"])</script><script>self.__next_f.push([1,"Hasta ahora podías contar \u003cb\u003equé\u003c/b\u003e pasó y \u003cb\u003een qué orden\u003c/b\u003e. Falta lo que convierte una secuencia en una historia: el \u003cb\u003eporqué\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY hay una razón práctica además de la narrativa: el descriptor del A2 no dice «expresa opiniones». Dice \u003cb\u003e«expresa opiniones y da razones»\u003c/b\u003e. En el oral y en el escrito del examen, un «It was great» suelto vale menos que un «It was great \u003cb\u003ebecause\u003c/b\u003e there were a lot of people».\u003cbr/\u003e\u003cbr/\u003eLos dos conectores son estos, y son espejo el uno del otro:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ebecause\u003c/b\u003e = \u003cb\u003eporque\u003c/b\u003e. Detrás va la \u003cb\u003ecausa\u003c/b\u003e. \u003ci\u003eI was late \u003cb\u003ebecause\u003c/b\u003e I missed the bus.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eso\u003c/b\u003e = \u003cb\u003easí que\u003c/b\u003e. Detrás va la \u003cb\u003econsecuencia\u003c/b\u003e. \u003ci\u003eI missed the bus, \u003cb\u003eso\u003c/b\u003e I walked.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEs la misma información contada en los dos sentidos. Elige la que te salga: no hay una mejor.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa trampa nº 1: «because of».\u003c/b\u003e En español dices «a causa de que» y de ahí sale \u003ci\u003e[[because of I missed the bus|❌]]\u003c/i\u003e. En inglés \u003cb\u003ebecause\u003c/b\u003e va con una frase entera (sujeto + verbo) y \u003cb\u003ebecause of\u003c/b\u003e va con un sustantivo suelto: \u003ci\u003ebecause of the rain\u003c/i\u003e, \u003ci\u003ebecause of the bus\u003c/i\u003e. Si detrás hay un verbo, \u003cb\u003eof\u003c/b\u003e sobra siempre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa trampa nº 2: dónde va so.\u003c/b\u003e \u003ci\u003eso\u003c/i\u003e abre la \u003cb\u003esegunda\u003c/b\u003e mitad, la de la consecuencia, y lleva coma delante. Nunca abre la frase.\u003cbr/\u003e\u003cbr/\u003eY un tercero de regalo, que suena muy natural: \u003cb\u003e[[That's why…|Por eso…]]\u003c/b\u003e — abre una frase nueva con la consecuencia. \u003ci\u003eI missed the bus. \u003cb\u003eThat's why\u003c/b\u003e I was late.\u003c/i\u003e El calco a evitar es \u003ci\u003efor that\u003c/i\u003e, que no significa nada."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l7\",\"phaseId\":\"ena2m2\",\"title\":\"Because I missed the bus\",\"subtitle\":\"La causa y la consecuencia — y el descriptor que pide opiniones con razones\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Dar la razón\",\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2thatswhy\",\"ena2m2luckily\",\"ena2m2unfortunately\",\"ena2m2whatashame\",\"enbut\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos palabras, y la historia se sostiene sola\",\"body\":\"$17\",\"table\":[[\"quieres decir\",\"en inglés ✔\",\"el calco ❌\"],[\"Llegué tarde porque perdí el autobús.\",\"I was late because I missed the bus.\",\"…because of I missed the bus.\"],[\"por culpa de la lluvia\",\"because of the rain\",\"because the rain\"],[\"Perdí el autobús, así que fui andando.\",\"I missed the bus, so I walked.\",\"So I missed the bus, I walked.\"],[\"Por eso llegué tarde.\",\"That's why I was late.\",\"For that I was late.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y las tres palabras que ponen el sentimiento\",\"body\":\"Contar un contratiempo sin decir cómo te sentó es contarlo a medias. Con tres palabras basta, y las tres van al principio de la frase con coma:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[Luckily,|Por suerte,]]\u003c/b\u003e — lo que salvó la situación. \u003ci\u003eLuckily, Amy had a key.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003e[[Unfortunately,|Por desgracia,]]\u003c/b\u003e — lo que la empeoró. \u003ci\u003eUnfortunately, the shop was closed.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003e[[What a shame!|¡Qué pena!]]\u003c/b\u003e — la reacción, sola, como frase entera. Es lo que le dices a otro cuando te cuenta algo malo.\u003cbr/\u003e\u003cbr/\u003eOjo a \u003ci\u003eWhat a shame!\u003c/i\u003e: lleva \u003cb\u003ea\u003c/b\u003e obligatoriamente. \u003ci\u003eWhat shame!\u003c/i\u003e no es inglés, y \u003ci\u003eshame\u003c/i\u003e a secas significa «vergüenza», que es otra cosa. Lo mismo pasa con \u003ci\u003eWhat a pity!\u003c/i\u003e, que quiere decir exactamente igual.\u003cbr/\u003e\u003cbr/\u003eY una nota de uso que vale para el oral entero: cuando alguien te cuenta un desastre, \u003cb\u003een inglés se reacciona\u003c/b\u003e. Un silencio educado se lee como desinterés. \u003ci\u003eOh no! · What a shame! · That's terrible!\u003c/i\u003e — media palabra, pero se espera.\",\"table\":[[\"situación\",\"qué dices\"],[\"Amy tenía llave y me salvó\",\"Luckily, Amy had a key.\"],[\"encima la tienda estaba cerrada\",\"Unfortunately, the shop was closed.\"],[\"te lo cuentan a ti\",\"Oh no! What a shame!\"],[\"y resumes\",\"It was terrible.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l7e1\",\"type\":\"mc\",\"prompt\":\"«Llegué tarde porque perdí el autobús»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"I was late because I missed the bus.\",\"I was late because of I missed the bus.\",\"I was late for I missed the bus.\"],\"answer\":0,\"whyWrong\":[null,\"because of solo va con un sustantivo (because of the bus): si detrás hay verbo, of sobra\",\"«for» no introduce causas en inglés moderno\"],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m1missedthebus\"],\"tip\":\"Regla mecánica: ¿detrás hay un verbo? because. ¿Detrás hay solo un sustantivo? because of. No falla nunca.\"},{\"id\":\"ena2m2l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Cómo se dice esto en inglés: con because o con so?\",\"categories\":[\"because (detrás va la causa)\",\"so (detrás va la consecuencia)\"],\"items\":[{\"text\":\"porque\",\"bucket\":0},{\"text\":\"así que\",\"bucket\":1},{\"text\":\"por eso\",\"bucket\":1},{\"text\":\"es que\",\"bucket\":0},{\"text\":\"ya que\",\"bucket\":0},{\"text\":\"de modo que\",\"bucket\":1}],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2thatswhy\"],\"tip\":\"Clasifica por lo que viene DETRÁS, no por la palabra española. Si detrás va el motivo, because. Si va el resultado, so.\"},{\"id\":\"ena2m2l7e3\",\"type\":\"cloze\",\"prompt\":\"Completa con la causa\",\"text\":\"I was tired ___ I didn't sleep very well.\",\"answers\":[\"because\"],\"translation\":\"Estaba cansada porque no dormí muy bien.\",\"hints\":[\"Detrás viene el motivo\",\"b…\"],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2ididntsleep\",\"ena2m1tired\"]},{\"id\":\"ena2m2l7e4\",\"type\":\"cloze\",\"prompt\":\"Y ahora la misma idea del revés\",\"text\":\"I didn't sleep very well, ___ I was tired all day.\",\"answers\":[\"so\"],\"translation\":\"No dormí muy bien, así que estuve cansada todo el día.\",\"hints\":[\"Detrás viene el resultado\",\"s…\"],\"itemIds\":[\"ena2m2soiwalked\",\"ena2m2ididntsleep\",\"ena2m1tired\"],\"tip\":\"Misma información, dos montajes. Cuando escribas, alterna: dos because seguidos cansan a quien lee.\"},{\"id\":\"ena2m2l7e5\",\"type\":\"gapbank\",\"prompt\":\"La mañana con su porqué — elige del banco\",\"text\":\"I woke up late, ___ I missed the bus. I walked to work ___ there wasn't another bus. In the ___, I arrived at ten.\",\"answers\":[\"so\",\"because\",\"end\"],\"bank\":[\"so\",\"because\",\"end\",\"but\",\"after\",\"luckily\"],\"translation\":\"Me desperté tarde, así que perdí el autobús. Fui andando al trabajo porque no había otro autobús. Al final llegué a las diez.\",\"itemIds\":[\"ena2m2soiwalked\",\"ena2m2becauseimissedthebus\",\"ena2m2intheend\",\"ena2m1missedthebus\"],\"tip\":\"Los dos primeros huecos son el mismo mecanismo mirado al derecho y al revés: detrás del primero va lo que pasó después; detrás del segundo, el motivo.\"},{\"id\":\"ena2m2l7e6\",\"type\":\"transform\",\"prompt\":\"Une las dos frases con so\",\"source\":\"I missed the bus. I was late.\",\"instruction\":\"Únelas con so\",\"answers\":[\"I missed the bus, so I was late.\",\"I missed the bus so I was late.\"],\"translation\":\"Perdí el autobús, así que llegué tarde.\",\"hints\":[\"so abre la segunda mitad, con coma delante\",\"I missed the bus, s… I was late.\"],\"itemIds\":[\"ena2m2soiwalked\",\"ena2m1missedthebus\",\"enimlate\"]},{\"id\":\"ena2m2l7e7\",\"type\":\"transform\",\"prompt\":\"Y estas otras con because\",\"source\":\"I was tired. I didn't go out.\",\"instruction\":\"Únelas con because, empezando por lo que hiciste\",\"answers\":[\"I didn't go out because I was tired.\"],\"translation\":\"No salí porque estaba cansada.\",\"hints\":[\"Primero el hecho, después el motivo\",\"I didn't go out b… I was tired.\"],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2ididntgoout\",\"ena2m1tired\"],\"tip\":\"Fíjate en que has tenido que darle la vuelta al orden. Con because, la mitad que va delante es la que cuenta el hecho.\"},{\"id\":\"ena2m2l7e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «of» que sobra\",\"wrong\":\"I was late because of I missed the bus.\",\"answers\":[\"I was late because I missed the bus.\"],\"why\":\"because of va con un sustantivo (because of the rain, because of the traffic). Cuando detrás hay una frase entera con sujeto y verbo, el conector es because a secas. El «of» viene del «a causa DE QUE» español.\",\"translation\":\"Llegué tarde porque perdí el autobús.\",\"itemIds\":[\"ena2m2becauseimissedthebus\"]},{\"id\":\"ena2m2l7e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «por eso»\",\"wrong\":\"For that I was late.\",\"answers\":[\"That's why I was late.\"],\"why\":\"«Por eso» no se traduce palabra a palabra: «for that» no significa nada en inglés. Las dos formas buenas son That's why… al empezar una frase nueva, o …, so… uniendo las dos mitades.\",\"translation\":\"Por eso llegué tarde.\",\"itemIds\":[\"ena2m2thatswhy\",\"enimlate\"]},{\"id\":\"ena2m2l7e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin la palabra prohibida\",\"source\":\"I was late because I missed the bus.\",\"forbid\":[\"because\"],\"answers\":[\"I missed the bus, so I was late.\",\"I missed the bus. That's why I was late.\"],\"translation\":\"Llegué tarde porque perdí el autobús.\",\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2thatswhy\"],\"tip\":\"Poder decir lo mismo por dos caminos es lo que te salva en el oral cuando la primera opción no sale. Aquí solo hay que darle la vuelta a las mitades.\"},{\"id\":\"ena2m2l7e11\",\"type\":\"mc\",\"prompt\":\"La reacción que el inglés espera\",\"question\":\"Amy te cuenta que ha perdido la cartera. ¿Qué le dices?\",\"options\":[\"Oh no! What a shame!\",\"Oh no! What shame!\",\"Oh no! What a pity of you!\"],\"answer\":0,\"whyWrong\":[null,\"Falta el artículo: What A shame. Sin él, «shame» significa «vergüenza»\",\"«What a pity!» sí existe, pero sin «of you»\"],\"itemIds\":[\"ena2m2whatashame\",\"ena2m2mywallet\"],\"tip\":\"En inglés no reaccionar se lee como no importarte. Media palabra basta, pero hay que decirla.\"},{\"id\":\"ena2m2l7e12\",\"type\":\"audiomc\",\"prompt\":\"Cazar el motivo — 2 escuchas\",\"audio\":\"Why were you late? — I was late because I lost my keys. I went back home and then I missed the train.\",\"question\":\"¿Por qué llegó tarde?\",\"options\":[\"Perdió las llaves\",\"Se durmió\",\"Perdió la cartera\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dormirse no se menciona\",\"La cartera no sale: fueron las llaves\"],\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2mykeys\",\"enimlate\"],\"tip\":\"En el Listening, la palabra because es una señal luminosa: lo que viene justo detrás suele ser la respuesta.\"},{\"id\":\"ena2m2l7e13\",\"type\":\"speak\",\"prompt\":\"La cadena entera, en voz alta\",\"text\":\"I was late because I missed the bus, so I walked. Luckily, my boss said nothing.\",\"phonetic\":\"ái uos̬ LÉIT bi-KOS̬ ái mist de bas, sóu ái UÓOKT. LA-ki-li, mái bos SED NA-zing\",\"translation\":\"Llegué tarde porque perdí el autobús, así que fui andando. Por suerte, mi jefe no dijo nada.\",\"itemIds\":[\"ena2m2becauseimissedthebus\",\"ena2m2soiwalked\",\"ena2m2luckily\",\"ena2m2shesaidsorry\"],\"tip\":\"because suena «bi-KOS̬», con la s final sonora y sin la «e» de apoyo delante. Ni «bicós» ni «becaus».\"},{\"id\":\"ena2m2l7e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No salí porque estaba cansada. Por suerte, no me perdí nada.\",\"answers\":[\"I didn't go out because I was tired. Luckily, I didn't miss anything.\",\"I didn't go out because I was tired. Luckily I didn't miss anything.\"],\"hints\":[\"Negativa + because + la valoración con Luckily\",\"I d…'t go out b… I was tired. L…, I didn't miss anything.\"],\"itemIds\":[\"ena2m2ididntgoout\",\"ena2m2becauseimissedthebus\",\"ena2m2luckily\",\"ena2m1tired\"],\"tip\":\"Ahí tienes el descriptor del A2 cumplido: un hecho, su razón y una valoración. Tres piezas, y con eso se sube de banda.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m2-4\",\"book\":\"It was very bad luck.\",\"real\":\"Just my luck!\",\"meaning\":\"¡Lo que me faltaba! / ¡Qué mala suerte la mía!\",\"when\":\"Con amigos y compañeros, justo después de contar el contratiempo. Se dice con resignación y media sonrisa, nunca en serio. En un email de examen, mejor «Unfortunately…» o «It was very bad luck».\",\"register\":\"amigos\",\"note\":\"Es irónica: dice «mi suerte de siempre» y significa lo contrario. Nadie la usa cuando algo sale bien.\",\"sound\":\"chast mái LAK\",\"level\":\"a2\",\"itemId\":\"ena2m2unfortunately\"}}],\"resources\":[{\"label\":\"British Council — A2 speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Escucha un vídeo cualquiera y cuenta los because. Vas a ver que aparecen cada dos o tres frases: dar razones no es un adorno del nivel, es el nivel.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
