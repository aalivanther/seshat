c/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T94d,"])</script><script>self.__next_f.push([1,"Sehr geehrte Bewohnerinnen und Bewohner,\n\nin den letzten Monaten sind die Kosten für die [[Müllabfuhr|recogida de basuras]] stark gestiegen. Der Grund ist bekannt: In den Restmülltonnen im Hof wird immer wieder Material gefunden, das dort nicht hineingehört. Deshalb ist die folgende Ordnung beschlossen worden. Sie gilt ab 1. März für alle Wohnungen, auch für [[Untermieter|subarrendatarios]].\n\n1. Trennung. Der Müll muss in vier Behältern getrennt werden: Papier, Glas, Verpackungen und Restmüll. Der Biomüll wird seit Jänner* nicht mehr im Hof gesammelt. Er kann zum Sammelplatz in der Nebengasse gebracht werden. Wer keinen eigenen Behälter hat, kann einen im Büro der Hausverwaltung [[beantragen|solicitar]].\n\n2. Glas. Flaschen dürfen nur zwischen 7 und 20 Uhr in den Glascontainer geworfen werden. Nach 20 Uhr ist das wegen des Lärms verboten. Wer sich nicht daran hält, muss mit einer schriftlichen Verwarnung rechnen.\n\n3. Sperrmüll. Möbel und große Geräte dürfen nicht neben den Mistkübeln* abgestellt werden. Ein Termin für die Abholung muss telefonisch vereinbart werden. Die Abholung ist für die Bewohner kostenlos, wenn sie mindestens zwei Wochen vorher angemeldet wird. Wird sie nicht angemeldet, kostet sie 60 Euro.\n\n4. Batterien und Elektrogeräte gehören nicht in den Restmüll. Sie werden im Supermarkt in der Lindengasse kostenlos zurückgenommen. Das gilt auch für Geräte, die dort nicht gekauft worden sind.\n\n5. Fahrräder. Im Hof dürfen nur Räder abgestellt werden, die regelmäßig benutzt werden. Alte Fahrräder ohne Reifen werden nach einer schriftlichen Ankündigung von der Hausverwaltung entfernt. Der neue Fahrradständer neben dem Eingang ist im letzten Jahr von der Stadt bezahlt worden und kann von allen Parteien kostenlos genutzt werden.\n\n6. Kosten. Wird falsch getrennt, wird der Behälter von der Müllabfuhr nicht geleert. Die zusätzliche Leerung wird dann allen Parteien im Haus in Rechnung gestellt — auch denen, die richtig getrennt haben. Wir bitten Sie deshalb, mit den Nachbarn zu sprechen, statt sich bei uns zu beschweren.\n\nDie neue Ordnung wird nach sechs Monaten überprüft. Wer Fragen hat, kann sich jeden Dienstag von 9 bis 12 Uhr im Büro melden.\n\nMit freundlichen Grüßen\nIhre Hausverwaltung Lindengasse GmbH\n\n*Jänner = österr. für „Januar“ · *Mistkübel = österr. für „Mülltonne“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m5l6\",\"phaseId\":\"b1m5\",\"title\":\"Lesen: die neue Abfallordnung\",\"subtitle\":\"Texto normativo — el Lesen Teil 5 del examen, con austriacismos\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Palabras de reglamento que verás en el texto\",\"itemIds\":[\"b1m5sperrmuell\",\"b1m5abholung\",\"b1m5verboten\",\"b1m5restmuell\",\"b1m5massnahme\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se lee un texto normativo (Lesen Teil 5)\",\"body\":\"El Teil 5 del examen son 4 preguntas sobre un \u003cb\u003ereglamento\u003c/b\u003e: una Hausordnung, unas condiciones de contrato, las normas de un curso. Son 10 minutos y el texto está lleno de \u003cb\u003epasivas\u003c/b\u003e — por eso llega justo ahora.\u003cbr/\u003e\u003cbr/\u003eEstrategia en tres pasos: \u003cb\u003e1)\u003c/b\u003e lee primero el título y los números de los apartados: te dicen dónde está cada tema. \u003cb\u003e2)\u003c/b\u003e Busca los \u003cb\u003everbos modales en pasiva\u003c/b\u003e (muss … werden = obligación, darf nicht … werden = prohibición, kann … werden = posibilidad): ahí está siempre la respuesta. \u003cb\u003e3)\u003c/b\u003e Cuidado con las condiciones: \u003ci\u003ewenn\u003c/i\u003e, \u003ci\u003enur\u003c/i\u003e, \u003ci\u003eaußer\u003c/i\u003e cambian la respuesta entera.\u003cbr/\u003e\u003cbr/\u003eEl examen es \u003cb\u003eplurizéntrico\u003c/b\u003e: hay textos de Austria y Suiza, y los austriacismos van anotados a pie de página, exactamente como en el texto de abajo.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m5l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reglamento y responde. Las preguntas van en alemán, como en el examen.\",\"title\":\"Neue Abfallordnung — Haus Lindengasse 12, Wien\",\"source\":\"Aushang der Hausverwaltung (Wien, Österreich)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m5l6e1q1\",\"q\":\"Was muss man tun, bevor der Sperrmüll abgeholt wird?\",\"options\":[\"Einen Termin telefonisch vereinbaren.\",\"Die Möbel neben die Mülltonnen stellen.\",\"60 Euro im Büro bezahlen.\"],\"answer\":0,\"why\":\"Apartado 3: «Ein Termin für die Abholung muss telefonisch vereinbart werden.» Los 60 euros solo se pagan si NO se avisa.\"},{\"id\":\"b1m5l6e1q2\",\"q\":\"Wo kann man alte Batterien abgeben?\",\"options\":[\"In der Restmülltonne im Hof.\",\"Im Supermarkt in der Lindengasse.\",\"Am Sammelplatz in der Nebengasse.\"],\"answer\":1,\"why\":\"Apartado 4. El Sammelplatz de la Nebengasse es para el Biomüll (apartado 1): la trampa clásica del Teil 5 es mezclar dos apartados.\"},{\"id\":\"b1m5l6e1q3\",\"q\":\"Warum ist die neue Ordnung beschlossen worden?\",\"options\":[\"Weil die Hausverwaltung neue Container kaufen will.\",\"Weil falsch getrennter Müll das Haus mehr Geld kostet.\",\"Weil die Bewohner sich über den Lärm beschwert haben.\"],\"answer\":1,\"inference\":true,\"why\":\"El texto no dice «por dinero» con esas palabras: dice que los costes subieron y que en el Restmüll aparece lo que no toca. Hay que unir las dos frases.\"},{\"id\":\"b1m5l6e1q4\",\"q\":\"Ein Nachbar trennt seinen Müll falsch. Was bedeutet das für die anderen?\",\"options\":[\"Nur der Nachbar bezahlt die zusätzliche Leerung.\",\"Alle Parteien im Haus bezahlen mit.\",\"Der Behälter wird trotzdem geleert.\"],\"answer\":1,\"inference\":true,\"why\":\"Apartado 6: «allen Parteien im Haus in Rechnung gestellt — auch denen, die richtig getrennt haben». Por eso el texto pide hablar con los vecinos.\"},{\"id\":\"b1m5l6e1q5\",\"q\":\"Welcher Satz beschreibt den Text am besten?\",\"options\":[\"Eine Werbung für einen neuen Müllservice.\",\"Eine verbindliche Hausregel mit Fristen und Folgen.\",\"Ein persönlicher Brief einer Nachbarin.\"],\"answer\":1,\"inference\":true,\"why\":\"Pregunta global: el texto es un reglamento (fechas, obligaciones, consecuencias económicas), no publicidad ni carta personal. El registro «Sehr geehrte…» y las pasivas lo delatan.\"}],\"itemIds\":[\"b1m5sperrmuell\",\"b1m5abholung\",\"b1m5restmuell\",\"b1m5verboten\"],\"tip\":\"Fíjate en cuántas frases del texto son pasivas: en un reglamento alemán casi no hay sujetos humanos. Por eso la pasiva es contenido de examen, no adorno.\"},{\"id\":\"b1m5l6e2\",\"type\":\"mc\",\"prompt\":\"Vuelve al apartado 2\",\"question\":\"„Flaschen dürfen nur zwischen 7 und 20 Uhr in den Glascontainer geworfen werden.“ ¿Qué significa nur aquí?\",\"options\":[\"Fuera de ese horario está prohibido\",\"Solo las botellas, nada más\",\"Solo en ese contenedor\"],\"answer\":0,\"whyWrong\":[null,\"nur va delante del complemento de tiempo: es el horario lo que limita\",\"Eso sería «nur in den Glascontainer»\"],\"itemIds\":[\"b1m5verboten\"],\"tip\":\"En el Teil 5 la palabrita nur/außer/wenn decide la respuesta más veces que el vocabulario.\"},{\"id\":\"b1m5l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la frase del reglamento\",\"text\":\"Möbel dürfen nicht neben den Mülltonnen abgestellt ___.\",\"answers\":[\"werden\"],\"translation\":\"No se pueden dejar muebles junto a los cubos.\",\"hints\":[\"Prohibición en pasiva con modal\",\"abgestellt + ...\"],\"itemIds\":[\"b1m5sperrmuell\"]},{\"id\":\"b1m5l6e4\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario del reglamento\",\"pairs\":[{\"target\":\"der Sperrmüll\",\"source\":\"los trastos viejos (recogida especial)\"},{\"target\":\"die Abholung\",\"source\":\"la recogida\"},{\"target\":\"der Restmüll\",\"source\":\"la basura no reciclable\"},{\"target\":\"die Maßnahme\",\"source\":\"la medida\"}],\"itemIds\":[\"b1m5sperrmuell\",\"b1m5abholung\",\"b1m5restmuell\",\"b1m5massnahme\"]},{\"id\":\"b1m5l6e5\",\"type\":\"mc\",\"prompt\":\"Alemán plurizéntrico\",\"question\":\"En Viena lees «Mistkübel». ¿Qué es?\",\"options\":[\"Una multa\",\"Una Mülltonne (un cubo de basura)\",\"Un contenedor de vidrio\"],\"answer\":1,\"whyWrong\":[\"La multa sería «die Strafe»\",null,\"Ese es el Glascontainer, y también existe en Austria\"],\"itemIds\":[\"b1m5muelltonne\"],\"tip\":\"El examen anota los austriacismos a pie de página, igual que este texto. No te bloquees: la nota está siempre ahí.\"},{\"id\":\"b1m5l6e6\",\"type\":\"bucket\",\"prompt\":\"Clasifica las frases del reglamento\",\"categories\":[\"obligación / prohibición\",\"posibilidad\"],\"items\":[{\"text\":\"Der Müll muss getrennt werden.\",\"bucket\":0},{\"text\":\"Der Biomüll kann zum Sammelplatz gebracht werden.\",\"bucket\":1},{\"text\":\"Möbel dürfen nicht abgestellt werden.\",\"bucket\":0},{\"text\":\"Ein Behälter kann im Büro beantragt werden.\",\"bucket\":1},{\"text\":\"Ein Termin muss vereinbart werden.\",\"bucket\":0},{\"text\":\"Batterien können im Supermarkt abgegeben werden.\",\"bucket\":1}],\"itemIds\":[\"b1m5mussgetrenntwerden\",\"b1m5kannrecyceltwerden\",\"b1m5sperrmuell\"],\"tip\":\"Muss/darf nicht = lo que te obliga · kann = lo que te ofrece. Separar esas dos columnas es la mitad del Teil 5.\"},{\"id\":\"b1m5l6e7\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el aviso con el banco\",\"text\":\"Die Abholung ist kostenlos, wenn sie zwei Wochen vorher ___ wird. Batterien ___ im Supermarkt zurückgenommen. Die Ordnung ___ nach sechs Monaten überprüft.\",\"answers\":[\"angemeldet\",\"werden\",\"wird\"],\"bank\":[\"angemeldet\",\"werden\",\"wird\",\"worden\",\"ist\",\"anmelden\",\"sind\"],\"translation\":\"La recogida es gratis si se anuncia dos semanas antes. Las pilas se recogen en el supermercado. El reglamento se revisará a los seis meses.\",\"itemIds\":[\"b1m5abholung\",\"b1m5massnahme\"]},{\"id\":\"b1m5l6e8\",\"type\":\"transform\",\"prompt\":\"Transforma: la misma norma dicha con man\",\"source\":\"Der Sperrmüll muss telefonisch angemeldet werden.\",\"instruction\":\"Dilo con man\",\"answers\":[\"Man muss den Sperrmüll telefonisch anmelden\",\"Man muss den Sperrmüll telefonisch anmelden.\"],\"translation\":\"Los trastos hay que anunciarlos por teléfono.\",\"hints\":[\"man + modal + objeto + infinitivo al final\",\"Man muss den Sperrmüll ...\"],\"itemIds\":[\"b1m5sperrmuell\"],\"tip\":\"Las dos valen también por escrito: las Hausordnungen reales alternan pasiva y man. Lo que cambia es el foco — la pasiva borra al sujeto, man deja a alguien indefinido — y en el Schreiben te puntúa usar las dos.\"},{\"id\":\"b1m5l6e9\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto en el chat del edificio. Arréglalo.\",\"wrong\":\"Die Batterien können im Supermarkt zurückgenommen sein.\",\"answers\":[\"Die Batterien können im Supermarkt zurückgenommen werden.\",\"Die Batterien können im Supermarkt zurückgenommen werden\"],\"why\":\"La pasiva de proceso se cierra con werden, nunca con sein. Con «sein» dirías que ya están recogidas: un estado, no un servicio que se ofrece.\",\"translation\":\"Las pilas se pueden devolver en el supermercado.\",\"itemIds\":[\"b1m5kannrecyceltwerden\"]},{\"id\":\"b1m5l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La basura hay que separarla en cuatro contenedores\",\"answers\":[\"Der Müll muss in vier Behältern getrennt werden\",\"Der Müll muss in vier Behältern getrennt werden.\"],\"hints\":[\"muss + participio + werden\",\"Der Müll muss in vier Behältern ...\"],\"itemIds\":[\"b1m5mussgetrenntwerden\",\"b1m5muell\"],\"tip\":\"Acabas de escribir una frase de reglamento alemán entera. Ese es el registro del Teil 5 y de tu comentario del examen.\"},{\"id\":\"b1m5l6e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · megafonía de supermercado · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Liebe Kundinnen und Kunden, eine kurze Durchsage: Der Pfandautomat neben dem Eingang ist heute leider außer Betrieb. Ihre Flaschen können Sie trotzdem abgeben, und zwar direkt an Kasse zwei – dort bekommen Sie auch den Bon. Und noch etwas: Alte Batterien und kleine Elektrogeräte werden bei uns kostenlos zurückgenommen, auch wenn Sie sie nicht bei uns gekauft haben. Die Box dafür steht hinten bei der Information.\",\"question\":\"„Heute kann man keine Flaschen zurückgeben.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"La máquina está estropeada, pero «Ihre Flaschen können Sie trotzdem abgeben … an Kasse zwei»\",null],\"itemIds\":[\"b1m5pfand\",\"b1m5verpackung\"],\"tip\":\"«außer Betrieb» = fuera de servicio, y en las megafonías alemanas casi siempre viene seguido de la solución. Escucha lo que va DESPUÉS.\"},{\"id\":\"b1m5l6e12\",\"type\":\"audiomc\",\"prompt\":\"Mismo aviso, segunda tarea. Dos escuchas.\",\"audio\":\"Liebe Kundinnen und Kunden, eine kurze Durchsage: Der Pfandautomat neben dem Eingang ist heute leider außer Betrieb. Ihre Flaschen können Sie trotzdem abgeben, und zwar direkt an Kasse zwei – dort bekommen Sie auch den Bon. Und noch etwas: Alte Batterien und kleine Elektrogeräte werden bei uns kostenlos zurückgenommen, auch wenn Sie sie nicht bei uns gekauft haben. Die Box dafür steht hinten bei der Information.\",\"question\":\"¿Qué se recoge gratis aunque no se haya comprado allí?\",\"options\":[\"Pilas usadas y aparatos eléctricos pequeños\",\"Solo las botellas con depósito\",\"Los muebles viejos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las botellas también, pero de esas no dice nada de «aunque no las hayas comprado aquí»\",\"El Sperrmüll no lo recoge ningún supermercado\"],\"itemIds\":[\"b1m5darfnichtweggeworfenwerden\",\"b1m5recyceln\"],\"tip\":\"«werden … zurückgenommen» es la misma pasiva del reglamento que acabas de leer, pero por megafonía. El examen mezcla los dos canales a propósito.\"}]}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Lesen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1/ueb.html\",\"note\":\"Descarga el Modellsatz y haz el Teil 5 con reloj: 10 minutos, 4 preguntas, texto normativo como este.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
