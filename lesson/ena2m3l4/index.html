pero significa \u003cb\u003e«apenas»\u003c/b\u003e. \u003ci\u003eShe hardly works\u003c/i\u003e es «casi no trabaja», lo contrario de lo que querías decir. Es la palabra que más disgustos da del nivel.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa diferencia que decide todo:\u003c/b\u003e el \u003cb\u003eadjetivo\u003c/b\u003e describe a una persona o a una cosa (\u003ci\u003eShe's quick\u003c/i\u003e, «es rápida»); el \u003cb\u003eadverbio\u003c/b\u003e describe la ACCIÓN (\u003ci\u003eShe works quickly\u003c/i\u003e, «trabaja deprisa»). El español hace lo mismo, pero con una trampa: muchas veces usamos el adjetivo tal cual donde el inglés obliga al adverbio — «habla rápido», «canta bonito», «conduce lento». De ahí sale \u003ci\u003eShe speaks very quick\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l4\",\"phaseId\":\"ena2m3\",\"title\":\"Slowly, quickly, well\",\"subtitle\":\"Cómo se hace algo: el «-mente» inglés y dónde se pone\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los adverbios de modo\",\"itemIds\":[\"ena2m3slowly\",\"ena2m3quickly\",\"ena2m3quietly\",\"ena2m3badly\",\"ena2m3well\",\"ena2m3sheworkshard\",\"enlistencarefully\",\"enverywell\"]},{\"kind\":\"note\",\"note\":{\"title\":\"-ly es el «-mente» inglés\",\"body\":\"$17\",\"table\":[[\"adjetivo\",\"adverbio\",\"ejemplo\"],[\"slow\",\"slowly\",\"Can you speak more slowly?\"],[\"quick\",\"quickly\",\"She answered quickly.\"],[\"quiet\",\"quietly\",\"Come in quietly.\"],[\"bad\",\"badly\",\"He sings badly.\"],[\"careful\",\"carefully\",\"Listen carefully.\"],[\"easy\",\"easily\",\"She passed easily.\"],[\"good\",\"well\",\"She speaks English well.\"],[\"fast / hard / late\",\"fast / hard / late\",\"She works hard.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Dónde se pone: detrás del verbo — y si hay objeto, detrás del objeto\",\"body\":\"El adverbio de modo va \u003cb\u003edespués del verbo\u003c/b\u003e:\u003cbr/\u003e· \u003ci\u003eShe works hard.\u003c/i\u003e · \u003ci\u003eHe drives slowly.\u003c/i\u003e · \u003ci\u003eCome in quietly.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY si el verbo lleva un objeto, el adverbio \u003cb\u003eespera a que termine el objeto\u003c/b\u003e:\u003cbr/\u003e· \u003ci\u003eShe speaks \u003cu\u003eEnglish\u003c/u\u003e well.\u003c/i\u003e · \u003ci\u003eHe opened \u003cu\u003ethe door\u003c/u\u003e quietly.\u003c/i\u003e · \u003ci\u003eI read \u003cu\u003ethe letter\u003c/u\u003e carefully.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEse «espera» es la puerta de la lección 6, que es la trampa gorda del módulo: \u003cb\u003eentre el verbo y su objeto no se mete nada\u003c/b\u003e. Vete acostumbrando desde aquí.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY cuando hay varios complementos, el orden es CÓMO → DÓNDE → CUÁNDO:\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eShe sang beautifully at the party last night.\u003c/i\u003e\u003cbr/\u003eEl español los coloca como le apetece («anoche cantó de maravilla en la fiesta»). El inglés no: modo, lugar, tiempo, y en ese orden.\",\"table\":[[\"\",\"cómo\",\"dónde\",\"cuándo\"],[\"She sang\",\"beautifully\",\"at the party\",\"last night.\"],[\"He worked\",\"hard\",\"in the café\",\"yesterday.\"],[\"We danced\",\"badly\",\"at the concert\",\"on Sunday.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l4e1\",\"type\":\"match\",\"prompt\":\"Empareja los adverbios\",\"pairs\":[{\"target\":\"slowly\",\"source\":\"despacio\"},{\"target\":\"quickly\",\"source\":\"deprisa\"},{\"target\":\"quietly\",\"source\":\"en voz baja\"},{\"target\":\"badly\",\"source\":\"mal\"},{\"target\":\"well\",\"source\":\"bien\"}],\"itemIds\":[\"ena2m3slowly\",\"ena2m3quickly\",\"ena2m3quietly\",\"ena2m3badly\",\"ena2m3well\"]},{\"id\":\"ena2m3l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Describe cómo ES o cómo lo HACE?\",\"categories\":[\"adjetivo: cómo ES\",\"adverbio: cómo lo HACE\"],\"items\":[{\"text\":\"She's quick\",\"bucket\":0},{\"text\":\"She works quickly\",\"bucket\":1},{\"text\":\"He's a bad driver\",\"bucket\":0},{\"text\":\"He drives badly\",\"bucket\":1},{\"text\":\"Her English is good\",\"bucket\":0},{\"text\":\"She speaks English well\",\"bucket\":1}],\"itemIds\":[\"ena2m3quickly\",\"ena2m3badly\",\"ena2m3well\"],\"tip\":\"Mira a quién califica: si a una persona o a una cosa, adjetivo. Si al verbo, adverbio con -ly.\"},{\"id\":\"ena2m3l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa con el adverbio de «slow»\",\"text\":\"Can you speak more ___, please? I don't understand.\",\"answers\":[\"slowly\"],\"translation\":\"¿Puedes hablar más despacio, por favor? No te entiendo.\",\"hints\":[\"Es la acción de hablar, no cómo eres tú\",\"slow + …\"],\"itemIds\":[\"ena2m3slowly\"],\"tip\":\"Guárdate esta frase entera: en el oral del examen puedes pedir que repitan o que hablen más despacio, y no te resta.\"},{\"id\":\"ena2m3l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el adverbio de «good»\",\"text\":\"She plays the guitar very ___.\",\"answers\":[\"well\"],\"translation\":\"Toca la guitarra muy bien.\",\"hints\":[\"No es «goodly»: es la única forma irregular de la lista\",\"w…\"],\"itemIds\":[\"ena2m3well\",\"enguitar\"]},{\"id\":\"ena2m3l4e5\",\"type\":\"mc\",\"prompt\":\"El adverbio de good\",\"question\":\"good → …\",\"options\":[\"well\",\"goodly\",\"gooder\"],\"answer\":0,\"whyWrong\":[null,\"«goodly» no existe: good es el adjetivo y well es su adverbio\",\"«gooder» tampoco existe, ni como comparativo (es better)\"],\"itemIds\":[\"ena2m3well\"],\"tip\":\"well es la excepción más usada del inglés y la que más se falla. Aprendida esta, el resto son -ly a secas.\"},{\"id\":\"ena2m3l4e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el adjetivo colado donde iba un adverbio\",\"wrong\":\"She sings very good.\",\"answers\":[\"She sings very well.\"],\"why\":\"«good» califica a una persona o a una cosa (a good singer, good music). Aquí lo que se califica es la ACCIÓN de cantar, y para eso el inglés obliga al adverbio: well. El español no obliga —«canta bien» y «es buena»—, y por eso este error sobrevive hasta B2.\",\"translation\":\"Canta muy bien.\",\"itemIds\":[\"ena2m3well\"]},{\"id\":\"ena2m3l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el -ly que cambia el significado\",\"wrong\":\"She works hardly.\",\"answers\":[\"She works hard.\"],\"why\":\"hard ya es adverbio: «mucho, duro». Al ponerle -ly no lo refuerzas, lo conviertes en otra palabra: hardly significa «apenas», así que has dicho que casi no trabaja. Lo mismo pasa con late/lately y con near/nearly.\",\"translation\":\"Trabaja mucho.\",\"itemIds\":[\"ena2m3sheworkshard\"]},{\"id\":\"ena2m3l4e8\",\"type\":\"transform\",\"prompt\":\"Del adjetivo al adverbio\",\"source\":\"Ben is a careful driver.\",\"instruction\":\"Dilo con un verbo y un adverbio\",\"answers\":[\"Ben drives carefully.\",\"Ben drives very carefully.\"],\"translation\":\"Ben conduce con cuidado.\",\"hints\":[\"El adjetivo careful se transforma como los demás\",\"Ben drives care…\"],\"itemIds\":[\"enlistencarefully\",\"endriver\"]},{\"id\":\"ena2m3l4e9\",\"type\":\"build\",\"prompt\":\"Construye la frase — y fíjate en dónde cae el adverbio\",\"target\":\"She opened the door quietly\",\"translation\":\"Abrió la puerta sin hacer ruido\",\"distractors\":[\"quiet\",\"slow\"],\"itemIds\":[\"ena2m3quietly\",\"endoor\"],\"tip\":\"El objeto (the door) va pegado al verbo y el adverbio espera detrás. Esa es la regla que se explica entera en la lección 6.\"},{\"id\":\"ena2m3l4e10\",\"type\":\"gapbank\",\"prompt\":\"Un día de Amy en el hospital: rellena con el adverbio que toca\",\"text\":\"Amy works ___ at the hospital. She talks to people ___ and she listens ___. At home she cooks really ___.\",\"answers\":[\"hard\",\"quietly\",\"carefully\",\"well\"],\"bank\":[\"hard\",\"quietly\",\"carefully\",\"well\",\"badly\",\"slowly\"],\"translation\":\"Amy trabaja mucho en el hospital. Habla con la gente en voz baja y escucha con atención. En casa cocina muy bien.\",\"itemIds\":[\"ena2m3sheworkshard\",\"ena2m3quietly\",\"ena2m3well\",\"enlistencarefully\",\"enhospital\"],\"tip\":\"El primer hueco es el único sin -ly, y no por descuido: hard ya es adverbio. «hardly» diría lo contrario.\"},{\"id\":\"ena2m3l4e11\",\"type\":\"listen\",\"prompt\":\"Dictado — dos adverbios\",\"text\":\"She listens carefully and she answers quickly.\",\"translation\":\"Escucha con atención y contesta deprisa.\",\"hints\":[\"Los dos acaban igual\",\"She listens care… and she answers quick…\"],\"itemIds\":[\"enlistencarefully\",\"ena2m3quickly\"]},{\"id\":\"ena2m3l4e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — el orden cómo, dónde, cuándo\",\"text\":\"She sang beautifully at the party last night.\",\"phonetic\":\"shi sang BIÚU-ti-fli at de PAA-ti laast NÁIT\",\"translation\":\"Anoche cantó de maravilla en la fiesta.\",\"itemIds\":[\"ena2m3beautiful\",\"enlastnight\"],\"tip\":\"Modo, lugar, tiempo. Si te sale en ese orden sin pensarlo, ya hablas con la sintaxis inglesa y no con la española.\"},{\"id\":\"ena2m3l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Habla despacio y escucha con atención.\",\"answers\":[\"She speaks slowly and she listens carefully.\",\"She speaks slowly and listens carefully.\",\"He speaks slowly and he listens carefully.\"],\"hints\":[\"Los dos adverbios van detrás de su verbo\",\"She speaks slow… and she listens care…\"],\"itemIds\":[\"ena2m3slowly\",\"enlistencarefully\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m3-3\",\"book\":\"He works very hard.\",\"real\":\"He works his socks off.\",\"meaning\":\"Trabaja como un burro / se deja la piel\",\"when\":\"Entre amigos y compañeros, admirando a alguien que se mata a trabajar. Es informal pero cariñoso, nunca ofensivo. En el Writing del examen escribe la del libro: he works very hard.\",\"register\":\"amigos\",\"note\":\"Literalmente «trabaja hasta quedarse sin calcetines». El inglés tiene media docena de estas con off. Y ojo al hard sin -ly de la versión del libro.\",\"sound\":\"ji uéeks jis̬ SOKS of\",\"level\":\"a2\",\"itemId\":\"ena2m3sheworkshard\"}}],\"resources\":[{\"label\":\"British Council — Adverbials of manner\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/adverbials-manner\",\"note\":\"Lee la ficha y haz los ejercicios, pero apunta aparte los que NO llevan -ly (fast, hard, late, well). Esa lista corta es la que se falla.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
