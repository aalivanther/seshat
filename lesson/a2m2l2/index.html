La regla completa tiene dos mitades. Va con \u003cb\u003esein\u003c/b\u003e: 1) el movimiento de A a B (gefahren, gegangen, geflogen, gekommen) y 2) el \u003cb\u003ecambio de estado\u003c/b\u003e — por eso Ich \u003cb\u003ebin\u003c/b\u003e aufgestanden (aufstehen = levantarse: acostado → de pie). Todo lo demás va con \u003cb\u003ehaben\u003c/b\u003e: gegessen, gelesen, gekauft, geschlafen... (dormir no te mueve del sitio). Y ahora las dos excepciones estrella, favoritas del examen Goethe: \u003cb\u003e[[geblieben|quedado]]\u003c/b\u003e (bleiben = quedarse — ¡quedarse es NO moverse y aun así va con sein!) y \u003cb\u003e[[passiert|ocurrido]]\u003c/b\u003e (passieren = ocurrir): \u003ci\u003eWas \u003cb\u003eist\u003c/b\u003e passiert?\u003c/i\u003e Apréndelas como pareja rebelde — son dos, y las dos van con sein. Y fíjate en passiert: passieren acaba en \u003cb\u003e-ieren\u003c/b\u003e, así que por la regla del módulo anterior su participio va sin ge- — por eso es passiert y nunca «gepassiert».\",\"table\":[[\"con sein\",\"con haben\"],[\"gefahren · gegangen · geflogen\",\"gemacht · gekauft · gelernt\"],[\"gekommen · aufgestanden\",\"gegessen · getrunken · gelesen\"],[\"geblieben (¡excepción!)\",\"gesehen · geschrieben · geschlafen\"],[\"passiert (¡excepción!)\",\"gespielt · besucht · telefoniert\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m2l2e1\",\"type\":\"mc\",\"prompt\":\"¿haben o sein?\",\"question\":\"Ich ___ ein Buch gelesen.\",\"options\":[\"habe\",\"bin\"],\"answer\":0,\"whyWrong\":[null,\"Leer no te mueve del sitio ni te cambia de estado — sin movimiento, el auxiliar es haben\"],\"itemIds\":[\"gelesen\",\"buch\"],\"tip\":\"La pregunta clave: ¿el verbo me lleva de A a B o me cambia de estado? Si no, haben.\"},{\"id\":\"a2m2l2e2\",\"type\":\"mc\",\"prompt\":\"¿haben o sein?\",\"question\":\"Wir ___ nach Italien geflogen.\",\"options\":[\"haben\",\"sind\"],\"answer\":1,\"whyWrong\":[\"Volar te lleva de A a B — movimiento puro, y el movimiento
