ci\u003eBooks are expensive\u003c/i\u003e).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY su pareja\u003c/b\u003e, que es la mitad que nadie enseña: cuando \u003cb\u003eseñalas algo concreto\u003c/b\u003e, el the vuelve. [[The coffee here is very good.|El café de aquí está muy bueno.]] No hablas del café del mundo: hablas de ESTE. Lo mismo con \u003ci\u003eThe food was very good\u003c/i\u003e — la de anoche, no la comida en general.\u003cbr/\u003e\u003cbr/\u003eTruco para decidir en un segundo: \u003cb\u003e¿podrías añadir «en general» detrás?\u003c/b\u003e Si sí, fuera el the. Si lo que quieres es «este, el de aquí, el de ayer», el the se queda.\u003cbr/\u003e\u003cbr/\u003eY un recordatorio del módulo 3, que aquí recae: entre el verbo y su objeto \u003cb\u003eno se mete nada\u003c/b\u003e. Es \u003ci\u003eI like coffee very much\u003c/i\u003e, nunca \u003ci\u003e*I like very much coffee\u003c/i\u003e. La regla está explicada en \u003cb\u003eena2m3\u003c/b\u003e, lección 6; aquí solo se cobra."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l7\",\"phaseId\":\"ena2m5\",\"title\":\"I like music\",\"subtitle\":\"Hablando en general, el inglés quita el artículo — y el español lo pone\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"En general, y en concreto\",\"itemIds\":[\"ena2m5ilikemusic\",\"ena2m5lifeishard\",\"ena2m5moneyisnteverything\",\"ena2m5thecoffeehereisgood\",\"ena2m5ilovecooking\",\"enilike\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sin the cuando hablas del mundo; con the cuando señalas\",\"body\":\"$17\",\"table\":[[\"en general → sin the\",\"en concreto → con the\"],[\"I like music.\",\"I like the music in this café.\"],[\"Life is hard.\",\"The life of a nurse is hard.\"],[\"Money isn't everything.\",\"The money is on the table.\"],[\"Coffee is expensive.\",\"The coffee here is very good.\"],[\"I love cooking.\",\"The cooking was Amy's job.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\" ,\"enexpensive\"],\"tip\":\"Las tres fichas que sobran son las tres versiones españolas de la frase: The life, a café, the coffee. Ninguna dice lo que Valeria quiere decir.\"},{\"id\":\"ena2m5l7e8\",\"type\":\"mc\",\"prompt\":\"Espiral del módulo 3 — dónde va «very much»\",\"question\":\"«Me gusta muchísimo el café»\",\"options\":[\"I like coffee very much.\",\"I like very much coffee.\",\"I like very much the coffee.\"],\"answer\":0,\"whyWrong\":[null,\"Entre el verbo y su objeto no se mete nada: esa regla es de ena2m3, lección 6\",\"Dos errores en una: el orden y el the del genérico\"],\"itemIds\":[\"ena2m3ilikeitverymuch\",\"ena2m5ilikemusic\",\"encoffee\"],\"tip\":\"Las dos reglas del módulo se juntan aquí: coffee sin the porque es en general, y very much al final porque nada se cuela entre like y su objeto.\"},{\"id\":\"ena2m5l7e9\",\"type\":\"listen\",\"prompt\":\"Dictado\",\"text\":\"Money isn't everything.\",\"translation\":\"El dinero no lo es todo.\",\"hints\":[\"Empieza directamente por el sustantivo, sin artículo\",\"M… isn't everything.\"],\"itemIds\":[\"ena2m5moneyisnteverything\",\"ena2m5money\"],\"tip\":\"Si has escrito «The money», te ha traicionado el español. Es exactamente el error que esta lección viene a matar.\"},{\"id\":\"ena2m5l7e10\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Me encanta cocinar, pero la comida de este restaurante está buenísima.\",\"answers\":[\"I love cooking, but the food in this restaurant is delicious.\",\"I love cooking, but the food in this restaurant is really good.\",\"I love cooking, but the food here is delicious.\"],\"hint\":\"una mitad va en general y la otra señala un sitio\",\"itemIds\":[\"ena2m5ilovecooking\",\"ena2m5thefoodwasgood\",\"endelicious\"]},{\"id\":\"ena2m5l7e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me gusta la música, pero la música de este café es horrible.\",\"answers\":[\"I like music, but
