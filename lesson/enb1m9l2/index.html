unks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T81d,"])</script><script>self.__next_f.push([1,"\u003ci\u003eTravel documents\u003c/i\u003e y \u003ci\u003eentering and leaving a country\u003c/i\u003e son campos \u003cb\u003enuevos del temario oficial de B1\u003c/b\u003e. En el A2 aprendiste a decir \u003ci\u003emy passport\u003c/i\u003e y poco más; aquí hay que saber qué pasa con él.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLas cuatro palabras que no se pueden confundir:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003ea passport\u003c/b\u003e — el documento que dice quién eres.\u003cbr/\u003e· \u003cb\u003ea visa\u003c/b\u003e — el permiso para entrar en un país concreto. No es el pasaporte: es un papel (o un sello) aparte.\u003cbr/\u003e· \u003cb\u003ea boarding pass\u003c/b\u003e — la tarjeta de embarque. Es del vuelo, no tuya: sirve para un viaje y se tira.\u003cbr/\u003e· \u003cb\u003etravel insurance\u003c/b\u003e — el seguro. Y ojo: es \u003cb\u003eincontable\u003c/b\u003e, como \u003ci\u003eluggage\u003c/i\u003e, \u003ci\u003einformation\u003c/i\u003e y \u003ci\u003eadvice\u003c/i\u003e. «I bought two insurances» no existe; se dice \u003ci\u003etwo insurance policies\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el falso amigo del módulo, que es de los caros:\u003c/b\u003e \u003cb\u003e\u003ci\u003ecustoms\u003c/i\u003e es la aduana\u003c/b\u003e, el sitio donde miran lo que llevas. \u003cb\u003eNo son «las costumbres»\u003c/b\u003e —eso es \u003ci\u003ecustoms\u003c/i\u003e también en otro contexto, pero en un aeropuerto jamás— y encima \u003cb\u003eva siempre en plural\u003c/b\u003e: \u003ci\u003eWe went through customs\u003c/i\u003e. Al lado está \u003cb\u003eborder control\u003c/b\u003e, que es donde miran quién eres. Dos mostradores, dos preguntas distintas: la aduana pregunta \u003cb\u003equé llevas\u003c/b\u003e, el control de fronteras pregunta \u003cb\u003equién eres\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa estructura del día:\u003c/b\u003e \u003cb\u003e\u003ci\u003evalid until\u003c/i\u003e\u003c/b\u003e y \u003cb\u003e\u003ci\u003eexpire\u003c/i\u003e\u003c/b\u003e. Se dicen así y no de otra manera:\u003cbr/\u003e· \u003ci\u003eMy passport \u003cb\u003eis valid until\u003c/b\u003e 2031.\u003c/i\u003e — la preposición va pegada, como en \u003ci\u003egood at\u003c/i\u003e o \u003ci\u003edepend on\u003c/i\u003e.\u003cbr/\u003e· \u003ci\u003eMy driving licence \u003cb\u003eexpires\u003c/b\u003e in March.\u003c/i\u003e — \u003ci\u003eexpire\u003c/i\u003e es un verbo normal, sin «to» ni nada.\u003cbr/\u003eLo que \u003cb\u003eno\u003c/b\u003e se dice es «my passport expires until March» ni «is valid in 2031».\u003cbr/\u003e\u003cbr/\u003eY un aviso práctico que es de nivel: muchos países piden que el pasaporte \u003cb\u003esiga siendo válido varios meses después\u003c/b\u003e de la fecha de vuelta. Es exactamente el tipo de dato que el Reading del examen esconde en un folleto — y el tipo de frase que hay que saber leer sin diccionario."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l2\",\"phaseId\":\"enb1m9\",\"title\":\"Valid until 2031\",\"subtitle\":\"Pasaporte, visado, seguro y aduana — y un falso amigo que cuesta un ítem entero\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los papeles de un viaje de verdad\",\"itemIds\":[\"enb1m9visa\",\"enb1m9boardingpass\",\"enb1m9validuntil\",\"enb1m9expires\",\"enb1m9travelinsurance\",\"enb1m9bordercontrol\",\"enb1m9customs\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el campo que el A2 no tenía\",\"body\":\"$17\",\"table\":[[\"Mostrador\",\"Qué te preguntan\",\"Palabra\"],[\"Quién eres\",\"Passport, please.\",\"border control\"],[\"Qué llevas\",\"Anything to declare?\",\"customs\"],[\"Si puedes entrar\",\"Do you have a visa?\",\"a visa\"],[\"Si puedes volar\",\"Boarding pass, please.\",\"a boarding pass\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l2e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro papeles\",\"pairs\":[{\"target\":\"a visa\",\"source\":\"un visado\"},{\"target\":\"a boarding pass\",\"source\":\"la tarjeta de embarque\"},{\"target\":\"travel insurance\",\"source\":\"el seguro de viaje\"},{\"target\":\"border control\",\"source\":\"el control de fronteras\"}],\"itemIds\":[\"enb1m9visa\",\"enb1m9boardingpass\",\"enb1m9travelinsurance\",\"enb1m9bordercontrol\"],\"tip\":\"«Visa» se pronuncia «VÍI-s̬a», con la ese sonora del final vibrando. Si la dices con ese seca suena a la tarjeta de crédito, que se escribe igual y se pronuncia igual — de ahí que el contexto sea lo único que las separa.\"},{\"id\":\"enb1m9l2e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo del módulo\",\"question\":\"«We went through customs» significa…\",\"options\":[\"Pasamos por la aduana\",\"Seguimos las costumbres del país\",\"Pasamos por el control de pasaportes\"],\"answer\":0,\"whyWrong\":[null,\"Esa acepción existe en otros contextos («local customs»), pero en un aeropuerto o un puerto es siempre la aduana.\",\"Eso es «border control» o «passport control»: otro mostrador y otra pregunta.\"],\"itemIds\":[\"enb1m9customs\",\"enb1m9bordercontrol\"],\"tip\":\"Regla de bolsillo: si en la frase hay maletas, es la aduana. Si hay documentos, es el control de fronteras. Y «customs» va siempre en plural, aunque sea un solo mostrador.\"},{\"id\":\"enb1m9l2e3\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición que pide el adjetivo\",\"text\":\"Don't worry about the trip — my passport is valid ___ 2031.\",\"answers\":[\"until\",\"till\"],\"translation\":\"Por el viaje no te preocupes: el pasaporte me vale hasta 2031.\",\"hints\":[\"No es «to» ni «for»: es la de «hasta»\",\"Cinco letras\"],\"itemIds\":[\"enb1m9validuntil\"],\"tip\":\"«Valid until» se aprende pegado, como «good at» o «depend on»: la preposición no se traduce, se memoriza con la palabra. Y en un impreso lo verás abreviado como «Valid to» — ahí sí cambia, porque es lenguaje de formulario.\"},{\"id\":\"enb1m9l2e4\",\"type\":\"errorfix\",\"prompt\":\"Cambia UNA palabra\",\"wrong\":\"My driving licence expires until March.\",\"answers\":[\"My driving licence expires in March.\"],\"why\":\"«Expire» ya lleva dentro la idea de «hasta»: la fecha en la que caduca se dice con «in» (mes o año) o con «on» (día exacto). «Until» va con «valid», no con «expire».\",\"translation\":\"El carné de conducir me caduca en marzo.\",\"itemIds\":[\"enb1m9expires\",\"enb1m9validuntil\"]},{\"id\":\"enb1m9l2e5\",\"type\":\"bucket\",\"prompt\":\"¿Contable o incontable? El B1 lo pregunta sin avisar\",\"categories\":[\"Incontable (nunca lleva -s)\",\"Contable (lleva a / -s)\"],\"items\":[{\"text\":\"travel insurance\",\"bucket\":0},{\"text\":\"luggage\",\"bucket\":0},{\"text\":\"a boarding pass\",\"bucket\":1},{\"text\":\"information\",\"bucket\":0},{\"text\":\"a visa\",\"bucket\":1},{\"text\":\"a suitcase\",\"bucket\":1}],\"itemIds\":[\"enb1m9travelinsurance\",\"ena2m6luggage\",\"enb1m9boardingpass\",\"enb1m9visa\",\"ena2m6suitcase\",\"ena2m5uncountablegroup\"],\"tip\":\"La lista de incontables del A2 vuelve entera, y ahora con palabras de viaje dentro. Si necesitas contarlos, se les pone una unidad delante: «two pieces of luggage», «two insurance policies».\"},{\"id\":\"enb1m9l2e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el folleto que dan en el mostrador\",\"text\":\"Before you travel, check that your passport is ___ for the whole of your stay. Some countries also ask for a ___ , which you must apply for before you fly. At the airport you go through ___ control first and ___ afterwards, where you declare anything you have bought.\",\"answers\":[\"valid\",\"visa\",\"border\",\"customs\"],\"bank\":[\"valid\",\"visa\",\"border\",\"customs\",\"insurance\",\"passport\",\"boarding\"],\"translation\":\"Antes de viajar, compruebe que su pasaporte sigue en vigor durante toda su estancia. Algunos países piden además un visado, que hay que solicitar antes de volar. En el aeropuerto se pasa primero por el control de fronteras y después por la aduana, donde se declara lo que se haya comprado.\",\"itemIds\":[\"enb1m9validuntil\",\"enb1m9visa\",\"enb1m9bordercontrol\",\"enb1m9customs\"],\"tip\":\"Fíjate en el orden del folleto: primero quién eres (border control) y después qué llevas (customs). Es el orden real de cualquier aeropuerto, y saberlo te contesta media pregunta de Reading sin releer.\"},{\"id\":\"enb1m9l2e7\",\"type\":\"order\",\"prompt\":\"Ordena lo que hizo Valeria para renovar el pasaporte\",\"sentences\":[\"Valeria noticed that her passport was only valid until the following March.\",\"She filled in the form online and paid the fee with Amy's card, because hers had expired too.\",\"The post office checked the photograph twice and said the ears had to be visible.\",\"The new passport arrived eleven days later, in an envelope she nearly threw away.\",\"She booked the flights the same evening, three weeks in advance and half the price.\"],\"translation\":\"Valeria se dio cuenta de que el pasaporte solo le valía hasta el marzo siguiente. Rellenó el impreso por internet y pagó con la tarjeta de Amy, porque la suya también había caducado. En Correos le miraron la foto dos veces y le dijeron que tenían que verse las orejas. El pasaporte nuevo llegó once días después, en un sobre que casi tira. Reservó los vuelos esa misma tarde, con tres semanas de antelación y por la mitad de precio.\",\"itemIds\":[\"enb1m9validuntil\",\"enb1m9expires\",\"enb1m9inadvance\",\"enb1m2fillinform\"],\"tip\":\"Cuenta los tiempos verbales: pasado simple para lo que pasó y pluscuamperfecto para lo que ya había pasado antes («had expired»). Es narración normal, sin que nadie la anuncie — y es exactamente lo que el Reading Part 4 te va a pedir leer.\"},{\"id\":\"enb1m9l2e8\",\"type\":\"transform\",\"prompt\":\"Dilo con el adjetivo en vez de con el verbo\",\"source\":\"My passport expires in 2031.\",\"instruction\":\"Dilo con «valid»\",\"answers\":[\"My passport is valid until 2031\",\"My passport is valid until 2031.\"],\"translation\":\"El pasaporte me vale hasta 2031.\",\"hints\":[\"Necesitas «is» y la preposición de «hasta»\",\"My passport is valid ... 2031\"],\"itemIds\":[\"enb1m9validuntil\",\"enb1m9expires\"],\"tip\":\"Las dos dicen lo mismo mirando desde lados opuestos: una mira a la fecha final y la otra al tiempo que queda. En un formulario verás la segunda; hablando, la primera.\"},{\"id\":\"enb1m9l2e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¿Hace falta visado, o basta con el pasaporte?\",\"answers\":[\"Do you need a visa, or is a passport enough?\",\"Do I need a visa, or is a passport enough?\",\"Do you need a visa, or is the passport enough?\"],\"hint\":\"El impersonal español sale con «you» o con «I», nunca con «one»\",\"itemIds\":[\"enb1m9visa\",\"ena2m6passport\"],\"tip\":\"El «se» impersonal del español tiene tres salidas en inglés y la más natural hablando es «you». «One needs a visa» existe, pero suena a discurso del siglo pasado.\"},{\"id\":\"enb1m9l2e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te están pidiendo exactamente?\",\"source\":\"Have you got your boarding pass and something with a photograph on it?\",\"answers\":[\"¿Llevas la tarjeta de embarque y algo con foto?\",\"¿Tienes la tarjeta de embarque y algo con una foto?\",\"¿Tiene usted la tarjeta de embarque y algo con foto?\"],\"itemIds\":[\"enb1m9boardingpass\"],\"tip\":\"«Something with a photograph on it» es cómo se pide un documento con foto sin decir «identification»: más suave y muchísimo más frecuente. Guárdatela para el Speaking Part 2.\"},{\"id\":\"enb1m9l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El pasaporte me vale hasta 2031, pero el carné de conducir me caduca en marzo.\",\"answers\":[\"My passport is valid until 2031, but my driving licence expires in March\",\"My passport is valid until 2031 but my driving licence expires in March\",\"My passport is valid until 2031, but my driving licence expires in March.\"],\"hints\":[\"Primera mitad: «is valid until»\",\"Segunda mitad: el verbo va con «in»\"],\"itemIds\":[\"enb1m9validuntil\",\"enb1m9expires\"],\"tip\":\"Las dos maneras de hablar de una caducidad en la misma frase, cada una con su preposición. Escríbela dos veces sin mirar: es de las que caen en el Writing formal.\"},{\"id\":\"enb1m9l2e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"My passport is valid until 2031.\",\"translation\":\"El pasaporte me vale hasta 2031.\",\"hints\":[\"Empieza por «My passport…»\",\"My passport is valid ...\"],\"itemIds\":[\"enb1m9validuntil\"],\"tip\":\"Los años a partir de 2010 se dicen enteros: «two thousand and thirty-one». Los del siglo pasado, en dos mitades: «nineteen eighty-four». Equivocarse de sistema es lo que hace que un número clarísimo suene incomprensible.\"},{\"id\":\"enb1m9l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en el mostrador de facturación. Dos escuchas.\",\"audio\":\"Morning. Passport and booking reference, please.|Here you are.|Thank you. And you're travelling to Dublin, is that right?|That's right. Do I need anything else? I've got travel insurance, but it's on my phone.|You won't need the insurance at the desk. What you will need is something with a photograph on it, because the airline asks for it even though there's no border control on that route.|The passport's fine, then.|The passport's perfect. It's valid until 2031, so no problem there. One case going in the hold?|One case, yes.\",\"question\":\"¿Por qué le piden el pasaporte si no hay control de fronteras?\",\"options\":[\"Porque la compañía aérea exige un documento con foto\",\"Porque hace falta visado para entrar en Irlanda\",\"Porque el seguro de viaje va asociado al pasaporte\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De visado no se dice nada: lo que se dice es que en esa ruta no hay control de fronteras.\",\"El seguro se descarta expresamente: «You won't need the insurance at the desk».\"],\"itemIds\":[\"enb1m9bordercontrol\",\"enb1m9travelinsurance\",\"enb1m9validuntil\"],\"tip\":\"Aquí está la trampa clásica del Listening: suena «travel insurance» y una opción la repite, pero en el audio esa palabra aparece justo para DESCARTARLA. Si cazas palabras, marcas la tercera.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\
