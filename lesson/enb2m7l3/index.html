3e1\",\"type\":\"mc\",\"prompt\":\"¿Qué put off es este?\",\"question\":\"«The smell put me off» significa…\",\"options\":[\"Que el olor me quitó el hambre / me dio asco\",\"Que aplacé el olor\",\"Que apagué el olor\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el put off del B1, y no traga un olor como objeto de aplazamiento.\",\"Apagar sería put out (un fuego). Otro phrasal.\"],\"itemIds\":[\"enb2m7putofffood\",\"enb1m6putoff\"],\"tip\":\"El objeto te dice la acepción. Un appointment se aplaza. Un smell te quita el hambre. Misma forma, dos oficios.\"},{\"id\":\"enb2m7l3e2\",\"type\":\"bucket\",\"prompt\":\"¿Qué acepción?\",\"categories\":[\"LA QUE YA TENÍAS (B1)\",\"LA NUEVA (B2, comida y sitio)\"],\"items\":[{\"text\":\"Don't put off the appointment.\",\"bucket\":0},{\"text\":\"He gave up smoking two years ago.\",\"bucket\":0},{\"text\":\"The smell put me off.\",\"bucket\":1},{\"text\":\"The milk has gone off.\",\"bucket\":1},{\"text\":\"The freezer takes up half the kitchen.\",\"bucket\":1},{\"text\":\"I've cut out sugar.\",\"bucket\":1}],\"itemIds\":[\"enb1m6putoff\",\"enb1m6giveup\",\"enb2m7putofffood\",\"enb2m7goofffood\",\"enb2m7takeupspace\",\"enb2m7cutoutsugar\"],\"tip\":\"Give up no cambia de oficio: sigue siendo dejar un hábito. Los otros tres sí. Por eso give up se recicla y los otros tres tienen tarjeta nueva.\"},{\"id\":\"enb2m7l3e3\",\"type\":\"paraphrase\",\"prompt\":\"La evitación en directo: sin postpone ni defer\",\"source\":\"We should postpone the tasting.\",\"forbid\":[\"postpone\",\"defer\",\"delay\"],\"answers\":[\"We should put off the tasting\",\"We should put the tasting off\",\"Let's put off the tasting\"],\"translation\":\"Deberíamos aplazar la cata.\",\"hints\":[\"El phrasal del B1, el que el nativo usa\",\"We should put ... the tasting\"],\"itemIds\":[\"enb2m7postpone\",\"enb1m6putoff\",\"enb2m7defer\"],\"tip\":\"Si te ha salido postpone de primeras, te acabas de ver. Es correcto, y es la evitación. Sin postpone, tienes que usar el phrasal.\"},{\"id\":\"enb2m7l3e4\",\"type\":\"mc\",\"prompt\":\"Stop doing / stop to do, ahora en la cocina\",\"question\":\"«Paré para comer» (dejé de andar, con ese fin) →\",\"options\":[\"I stopped to eat.\",\"I stopped eating.\",\"I packed it in.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es «dejé de comer»: se acabó lo de comer. Es el otro.\",\"Packed it in es dejar un hábito del todo, no parar un minuto.\"],\"itemIds\":[\"enb1m11stoppedtolisten\",\"enb1m11stoppedlistening\",\"enb2m7natpackeditin\"],\"tip\":\"El enb1m11 ya te lo dejó con listen. Hoy es eat. La máquina es la misma: to = fin; -ing = se acabó la actividad.\"},{\"id\":\"enb2m7l3e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The milk has gone out.\",\"answers\":[\"The milk has gone off.\"],\"why\":\"Ponerse mala, de comida, es go off. Go out es salir / apagarse una luz. El calco de «se ha ido» empuja a out.\",\"translation\":\"La leche se ha puesto mala.\",\"itemIds\":[\"enb2m7goofffood\"]},{\"id\":\"enb2m7l3e6\",\"type\":\"cloze\",\"prompt\":\"Completa la acepción de sitio\",\"text\":\"The freezer takes ___ half the kitchen, so the breadboard lives on the chair.\",\"answers\":[\"up\"],\"translation\":\"El congelador ocupa media cocina, así que la tabla del pan vive en la silla.\",\"hints\":[\"La partícula de ocupar sitio\",\"u...\"],\"itemIds\":[\"enb2m7takeupspace\"],\"tip\":\"Take up a hobby / take up space. El objeto decide. Un hobby se empieza; el espacio se ocupa.\"},{\"id\":\"enb2m7l3e7\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué acepción?\",\"source\":\"I've cut out sugar.\",\"answers\":[\"He quitado el azúcar del todo\",\"He eliminado el azúcar\",\"He dejado el azúcar a cero\"],\"itemIds\":[\"enb2m7cutoutsugar\",\"enb1m6cutdownon\"],\"tip\":\"Cut down on salt (B1) era menos. Cut out sugar es cero. La partícula cambia la cantidad.\"},{\"id\":\"enb2m7l3e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Dejar un hábito\",\"book\":\"I stopped smoking.\",\"real\":\"I packed it in.\",\"translation\":\"Dejé de fumar / lo dejé.\",\"itemIds\":[\"enb2m7natpackeditin\",\"enb1m6giveup\",\"enb1m11stoppedlistening\"],\"tip\":\"Packed it in, gave up, stopped doing. Tres alturas. El examen quiere gave up smoking; la calle, packed it in; el libro, stopped smoking. Las tres son el mismo oficio.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m7-2\",\"book\":\"postpone\",\"real\":\"put it off\",\"meaning\":\"aplazarlo\",\"when\":\"Put off es lo que se dice. Postpone es lo que escribe quien no se quiere arriesgar con un phrasal — y es correcto. En el Writing formal, postpone y defer puntúan; en el Speaking, put it off suena a persona. Elegir siempre el latino es evitación, y ahora tiene nombre.\",\"register\":\"neutral\",\"exam\":\"postpone / defer\",\"note\":\"Esta es la tarjeta que te pone el espejo. Si en el ejercicio de paraphrase te ha salido postpone de primeras, te has reconocido.\",\"sound\":\"put it of\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb1m6putoff\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-
