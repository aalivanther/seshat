u003eIch träume von einem \u003cb\u003eeigenen\u003c/b\u003e Restaurant\u003c/i\u003e — eigen = propio, la palabra de los sueños serios.\",\"table\":[[\"\",\"werden\"],[\"ich\",\"werde\"],[\"du\",\"wirst — ¡pierde la d!\"],[\"er/sie/es\",\"wird\"],[\"wir\",\"werden\"],[\"ihr\",\"werdet\"],[\"sie/Sie\",\"werden\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m10l3e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el plan\",\"question\":\"„Ich möchte Koch werden“\",\"options\":[\"Quiero llegar a ser cocinero\",\"Soy cocinero\",\"Era cocinero\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Ich bin Koch» — sin möchte ni werden\",\"Eso sería «Ich war Koch» — pasado, no plan\"],\"itemIds\":[\"a2m10ichmoechtewerden\",\"koch\"],\"tip\":\"möchte + werden al final = tu plan de futuro. Sin werden solo tendrías un deseo de ahora («quiero un cocinero»... raro).\"},{\"id\":\"a2m10l3e2\",\"type\":\"match\",\"prompt\":\"Empareja los chunks del futuro\",\"pairs\":[{\"target\":\"Was möchtest du werden?\",\"source\":\"¿Qué quieres llegar a ser?\"},{\"target\":\"die Zukunft\",\"source\":\"el futuro\"},{\"target\":\"träumen von\",\"source\":\"soñar con\"},{\"target\":\"mein eigenes Restaurant\",\"source\":\"mi propio restaurante\"}],\"itemIds\":[\"a2m10wasmoechtestduwerden\",\"a2m10zukunft\",\"a2m10traeumenvon\",\"a2m10eigen\",\"a2m10restaurant\"]},{\"id\":\"a2m10l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta de los planes\",\"text\":\"Was möchtest du ___?\",\"answers\":[\"werden\"],\"translation\":\"¿Qué quieres llegar a ser?\",\"hints\":[\"El verbo de llegar a ser, al final de la pinza\",\"w-e-r-d-e-n\"],\"itemIds\":[\"a2m10wasmoechtestduwerden\"]},{\"id\":\"a2m10l3e4\",\"type\":\"transform\",\"prompt\":\"Transforma: del presente al plan\",\"source\":\"Ich bin Kellner.\",\"instruction\":\"Di qué quieres llegar a ser: cocinero\",\"answers\":[\"Ich möchte Koch werden\",\"Ich möchte Koch werden.\",\"Ich will Koch werden\",\"Ich will Koch werden.\"],\"translation\":\"Soy camarero. → Quiero llegar a ser cocinero.\",\"hints\":[\"bin se va — entra la pinza möchte ... werden\",\"Ich möchte Koch ...\"],\"itemIds\":[\"a2m10ichmoechtewerden\",\"kellner\",\"koch\"],\"tip\":\"bin → möchte ... werden: el presente se convierte en plan de futuro. La nueva profesión va en medio, sin artículo.\"},{\"id\":\"a2m10l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa — ¡ojo con la äu!\",\"text\":\"Ich ___ von einem eigenen Restaurant. (sueño)\",\"answers\":[\"träume\"],\"translation\":\"Sueño con un restaurante propio.\",\"hints\":[\"träumen con ich — la äu se queda\",\"tr-äu-me, suena troi-me\"],\"itemIds\":[\"a2m10ichtraeumevon\",\"a2m10traeumenvon\"],\"strictUmlaut\":true,\"tip\":\"träumen conserva su äu siempre — «traume» sin puntitos es otro despiste clásico. La äu suena oi.\"},{\"id\":\"a2m10l3e6\",\"type\":\"mc\",\"prompt\":\"Conjuga werden\",\"question\":\"Leo ___ Lehrer.\",\"options\":[\"werde\",\"wird\",\"werden\"],\"answer\":1,\"whyWrong\":[\"werde es de ich: Ich werde Lehrer\",null,\"werden es de wir/sie — Leo es er: wird\"],\"itemIds\":[\"lehrer\"],\"tip\":\"du wirst pierde la d; er wird pierde la -t final (la d que ves ahí es la de la raíz). Irregular, pero lo usarás tanto que se pegará solo.\"},{\"id\":\"a2m10l3e7\",\"type\":\"build\",\"prompt\":\"Construye tu plan\",\"target\":\"Ich möchte Koch werden\",\"translation\":\"Quiero llegar a ser cocinero\",\"distractors\":[\"wirst\",\"kannst\"],\"itemIds\":[\"a2m10ichmoechtewerden\",\"koch\"],\"tip\":\"möchte en 2ª posición, werden cerrando: la misma pinza modal que usas desde el A1 con können y müssen.\"},{\"id\":\"a2m10l3e8\",\"type\":\"listen\",\"prompt\":\"Escucha la pregunta de los planes\",\"text\":\"Was möchtest du werden?\",\"translation\":\"¿Qué quieres llegar a ser?\",\"hints\":[\"Empieza como la pregunta del lunes: Was ...\",\"möchtest ... werden\"],\"itemIds\":[\"a2m10wasmoechtestduwerden\"]},{\"id\":\"a2m10l3e9\",\"type\":\"transform\",\"prompt\":\"Transforma: ahora con Bettina\",\"so
