 y cuándo.\u003c/b\u003e Un verbo en pasado y un marcador: \u003ci\u003eLast Saturday I worked in the café.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e2. Con quién y dónde.\u003c/b\u003e Otro verbo en pasado: \u003ci\u003eThen I walked to the park with Amy.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Qué te pareció.\u003c/b\u003e Aquí entra was/were: \u003ci\u003eIt was great! There were a lot of people.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY el remate que te salva de quedarte callada: \u003cb\u003e[[How about you?|¿Y tú?]]\u003c/b\u003e — devuelves la pregunta y el otro sigue hablando.\u003cbr/\u003e\u003cbr/\u003eCon los conectores que ya tienes (\u003cb\u003eand\u003c/b\u003e, \u003cb\u003ebut\u003c/b\u003e, \u003cb\u003ethen\u003c/b\u003e) los tres bloques se enganchan solos. Los de causa —\u003ci\u003ebecause\u003c/i\u003e, \u003ci\u003eso\u003c/i\u003e— llegan en el módulo 2, y con ellos el minuto pasará a sonar a relato de verdad.\",\"table\":[[\"bloque\",\"qué dices\",\"ejemplo\"],[\"1. qué y cuándo\",\"verbo con -ed + marcador\",\"Last Saturday I worked in the café.\"],[\"2. con quién y dónde\",\"otro verbo con -ed\",\"Then I walked to the park with Amy.\"],[\"3. qué te pareció\",\"was / were + adjetivo\",\"It was great! There were a lot of people.\"],[\"remate\",\"devolver la pregunta\",\"How about you?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m1l9e1\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de cierre — todo esto ya lo tienes\",\"pairs\":[{\"target\":\"last week\",\"source\":\"la semana pasada\"},{\"target\":\"two days ago\",\"source\":\"hace dos días\"},{\"target\":\"There was…\",\"source\":\"Había… (una cosa)\"},{\"target\":\"There were…\",\"source\":\"Había… (varias)\"},{\"target\":\"I was lucky.\",\"source\":\"Tuve suerte.\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m1lastweek\",\"ena2m1twodaysago\",\"ena2m1therewas\",\"ena2m1therewere\",\"ena2m1iwaslucky\"],\"tip\":\"El cronómetro solo premia. Si sale sin pensar, está consolidado; si te paras, ese ítem volverá en el repaso.\"},{\"id\":\"ena2m1l9e2\",\"type\":\"gapbank\",\"prompt\":\"El fin de semana entero, con el banco de palabras\",\"text\":\"Last Saturday Valeria ___ to the street market. In the afternoon it ___ and she stayed at home. On Sunday there ___ a concert in the park and they ___ all evening.\",\"answers\":[\"walked\",\"rained\",\"was\",\"danced\"],\"bank\":[\"walked\",\"rained\",\"was\",\"danced\",\"were\",\"watched\",\"arrived\"],\"translation\":\"El sábado pasado Valeria fue andando al mercadillo. Por la tarde llovió y se quedó en casa. El domingo había un concierto en el parque y bailaron toda la noche.\",\"itemIds\":[\"ena2m1theywalkedtothepark\",\"ena2m1itrained\",\"ena2m1therewas\",\"endanced\"],\"tip\":\"El tercer hueco es el que separa a quien ha entendido la lección 3: «a concert» es UNA cosa, así que was. El were del banco está ahí a propósito.\"},{\"id\":\"ena2m1l9e3\",\"type\":\"bucket\",\"prompt\":\"Espiral: ¿este marcador pide pasado o presente?\",\"categories\":[\"pide pasado\",\"pide presente\"],\"items\":[{\"text\":\"two days ago\",\"bucket\":0},{\"text\":\"every day\",\"bucket\":1},{\"text\":\"last night\",\"bucket\":0},{\"text\":\"at the moment\",\"bucket\":1},{\"text\":\"yesterday\",\"bucket\":0},{\"text\":\"right now\",\"bucket\":1}],\"itemIds\":[\"ena2m1twodaysago\",\"eneveryday\",\"enlastnight\",\"enatthemoment\",\"enyesterday\",\"enrightnow\"],\"tip\":\"En el examen, clasificar el MARCADOR es más rápido y más fiable que pensar en el verbo. El tiempo lo manda la señal temporal.\"},{\"id\":\"ena2m1l9e4\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"El sábado pasado trabajé en el café y por la tarde vi una película.\",\"answers\":[\"Last Saturday I worked in the café and in the afternoon I watched a film.\",\"Last Saturday I worked in the café and I watched a film in the afternoon.\",\"Last Saturday I worked at the café and in the afternoon I watched a film.\"],\"hint\":\"el marcador de «pasado» va sin the y sin on\",\"itemIds\":[\"ena2m1iworked\",\"ena2m1shewatchedafilm\",\"ena2m1lastweekend\"]},{\"id\":\"ena2m1l9e5\",\"type\":\"translate\",\"prompt\":\"Traduce al español\",\"direction\":\"toEs\",\"mode\":\"recognize\",\"source\":\"There weren't any tickets, but there was a concert in the park.\",\"answers\":[\"No había entradas, pero había un concierto en el parque.\",\"No quedaban entradas, pero había un concierto en el parque.\"],\"itemIds\":[\"ena2m1therewasnt\",\"ena2m1therewas\",\"ena2m1concert\",\"enticket\"],\"tip\":\"Dos «había» en español y dos verbos ingleses distintos, weren't y was, decididos por lo que va detrás de cada uno.\"},{\"id\":\"ena2m1l9e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco más caro del nivel\",\"wrong\":\"Yesterday I have watched a film.\",\"answers\":[\"Yesterday I watched a film.\"],\"why\":\"Con yesterday, last… o …ago, el inglés exige pasado simple: son tiempos TERMINADOS. Y ojo, que aquí el español tampoco te ayuda: «ayer he visto una película» no es correcto en ningún sitio — \u003ci\u003eayer\u003c/i\u003e cierra el periodo y pide indefinido también en España. Donde sí se parte en dos es con \u003cb\u003ehoy\u003c/b\u003e: si tú dirías «hoy he visto una película», tu español te empuja a poner perfecto de más en inglés; si dirías «hoy vi una película», te empuja a lo contrario. Con \u003ci\u003eyesterday\u003c/i\u003e, \u003ci\u003elast…\u003c/i\u003e y \u003ci\u003e…ago\u003c/i\u003e la regla es una sola para todos: tiempo terminado, pasado simple, siempre.\",\"translation\":\"Ayer vi una película.\",\"itemIds\":[\"ena2m1shewatchedafilm\",\"enyesterday\"]},{\"id\":\"ena2m1l9e7\",\"type\":\"mc\",\"prompt\":\"Espiral: la regla de oro del módulo\",\"question\":\"«Los veranos trabajaba en un café» y «El verano pasado trabajé en un café». En inglés…\",\"options\":[\"worked vale para las dos: el contexto pone la diferencia\",\"hacen falta dos verbos distintos\",\"la primera va en presente\"],\"answer\":0,\"whyWrong\":[null,\"El imperfecto español no tiene forma propia en inglés: lo cubre el mismo pasado\",\"Ni una ni otra: las dos hablan de un tiempo terminado\"],\"itemIds\":[\"ena2m1iworked\"],\"tip\":\"Una forma para dos tiempos españoles. Es lo primero que se explicó en la lección 1 y lo que más tranquiliza del nivel.\"},{\"id\":\"ena2m1l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"There were a lot of people at the concert.\",\"forbid\":[\"a lot of\",\"people\",\"lot\"],\"answers\":[\"The concert was very busy.\",\"It was packed.\"],\"translation\":\"Había mucha gente en el concierto.\",\"itemIds\":[\"ena2m1therewere\",\"ena2m1concert\"],\"tip\":\"Decir lo mismo por otro camino es lo que te salva cuando en el oral no te sale una palabra. «It was packed» te lo enseñó la píldora de la lección 3.\"},{\"id\":\"ena2m1l9e9\",\"type\":\"audiomc\",\"prompt\":\"Cierre de oído — dos datos en un audio, como en la Parte 1 del examen\",\"audio\":\"Last weekend was terrible. It rained all day on Saturday and there weren't any buses on Sunday.\",\"question\":\"¿Qué pasó el domingo?\",\"options\":[\"No había autobuses\",\"Llovió todo el día\",\"Hubo un concierto\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso fue el sábado: el audio da los dos días en orden\",\"El concierto no suena\"],\"itemIds\":[\"ena2m1terrible\",\"ena2m1itrained\",\"ena2m1therewasnt\"],\"tip\":\"Cuando un audio corto trae DOS datos, la pregunta casi siempre va por el segundo. Apunta los dos y luego elige.\"},{\"id\":\"ena2m1l9e10\",\"type\":\"speak\",\"prompt\":\"Tu minuto, bloque a bloque — léelo primero y luego dilo mirando al frente\",\"text\":\"Last Saturday I worked in the café. Then I walked to the park with Amy. It was great!\",\"phonetic\":\"laast SÁ-ta-dei ái UÉEKT in de KÁ-fei. den ái UÓOKT tu de paak uid ÉI-mi. it uos̬ GRÉIT\",\"translation\":\"El sábado pasado trabajé en el café. Luego fui andando al parque con Amy. ¡Estuvo genial!\",\"itemIds\":[\"ena2m1iworked\",\"ena2m1theywalkedtothepark\",\"enitwasgreat\"],\"tip\":\"Los tres bloques de la nota, en tres frases. Cuida las dos /t/ finales: uéekt, uóokt.\"},{\"id\":\"ena2m1l9e11\",\"type\":\"monologue\",\"prompt\":\"El minuto de verdad: cuenta TU fin de semana\",\"topic\":\"Tu fin de semana pasado, en un minuto\",\"slides\":[{\"title\":\"1. Qué y cuándo\",\"hint\":\"Un verbo con -ed y un marcador: Last Saturday I… / Two days ago I…\"},{\"title\":\"2. Con quién y dónde\",\"hint\":\"Otro verbo con -ed: Then I walked / visited / cooked / watched…\"},{\"title\":\"3. Qué te pareció\",\"hint\":\"was / were + adjetivo: It was great / terrible. There were a lot of people. I was tired.\"}],\"planSeconds\":30,\"speakSeconds\":60,\"reps\":2,\"checklist\":[\"He usado al menos tres verbos en pasado acabados en -ed\",\"He dicho al menos un marcador (yesterday, last…, …ago)\",\"He usado there was o there were una vez\",\"He valorado el finde con was + adjetivo\",\"He cerrado con «How about you?»\"],\"model\":\"Last Saturday I worked in the café from nine to five. Then I walked home and I cooked dinner with my flatmate. In the evening we watched a film. On Sunday there was a street market near my house and I visited a friend. There were a lot of people and it was great! I was very tired on Sunday night, but it was a good weekend. How about you?\",\"itemIds\":[\"ena2m1lastweekend\",\"ena2m1iworked\",\"ena2m1therewere\",\"ena2m1howaboutyou\",\"ena2m1allweekend\"],\"tip\":\"Grábate las dos veces y compara: la segunda pasada siempre sale mejor, y esa es la que te llevas al examen. No te evalúas por lo bonito, sino por las casillas de la lista.\"},{\"id\":\"ena2m1l9e12\",\"type\":\"type\",\"prompt\":\"Cierre del módulo — el finde entero en una frase\",\"question\":\"El fin de semana pasado trabajé el sábado, había un concierto el domingo y estuvo genial.\",\"answers\":[\"Last weekend I worked on Saturday, there was a concert on Sunday and it was great.\",\"Last weekend I worked on Saturday, there was a concert on Sunday and it was great!\",\"Last weekend I worked on Saturday, there was a concert on Sunday, and it was great.\"],\"hints\":[\"Marcador + verbo con -ed + there was + valoración con was\",\"Last weekend I work… on Saturday, there w… a concert on Sunday and it was great.\"],\"itemIds\":[\"ena2m1lastweekend\",\"ena2m1iworked\",\"ena2m1therewas\",\"enitwasgreat\"],\"tip\":\"Ahí está el módulo entero: la -ed, el there was y el marcador. Con esto ya puedes contar cualquier cosa que te haya pasado — mientras el verbo sea de los que obedecen. Los que no, en el módulo 2.\"}]}],\"resources\":[{\"label\":\"British Council — A2 Speaking\",\"url\":\"https://learnenglish.britishcouncil.org/skills/speaking/a2-speaking\",\"note\":\"Ensaya el minuto con los vídeos: 30 segundos de papel, uno de habla y una segunda pasada. Siempre dos veces.\"},{\"label\":\"LanguageCert — ESOL A2 Access (página oficial)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/a2-access-2277\",\"note\":\"Hojéalo hoy 10 minutos: mira solo el formato del Spoken y del Writing. Vas a vivir con ellos doce módulos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés
