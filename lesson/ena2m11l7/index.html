t/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T57d,"])</script><script>self.__next_f.push([1,"Buena noticia en mitad de un módulo de frontera: \u003cb\u003e\u003ci\u003eprobably\u003c/i\u003e, \u003ci\u003epossibly\u003c/i\u003e y \u003ci\u003eperhaps\u003c/i\u003e están en la lista de gramática del A2 de LanguageCert\u003c/b\u003e, en el bloque de adverbios modales. No son frontera: son tuyos, puntúan y puedes usarlos libremente en el examen.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escala, de más a menos seguro:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003edefinitely\u003c/b\u003e → segurísimo, sin ninguna duda.\u003cbr/\u003e· \u003cb\u003e[[It'll probably rain.|Seguramente llueva.]]\u003c/b\u003e → muy posible. Es el que más se usa de los tres, con diferencia.\u003cbr/\u003e· \u003cb\u003e[[possibly|posiblemente]]\u003c/b\u003e · \u003cb\u003e[[Perhaps we'll go on Sunday.|Quizá vayamos el domingo.]]\u003c/b\u003e · \u003cb\u003emaybe\u003c/b\u003e → puede que sí, puede que no. Los tres dicen lo mismo que \u003ci\u003emight\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003e[[I'm not sure.|No estoy seguro.]]\u003c/b\u003e → la salida honesta cuando no quieres comprometerte con ninguna.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDiferencia práctica entre perhaps y maybe:\u003c/b\u003e ninguna de significado. \u003ci\u003ePerhaps\u003c/i\u003e es un pelín más formal y se escribe más; \u003ci\u003emaybe\u003c/i\u003e se habla más. En el examen escribe \u003ci\u003eperhaps\u003c/i\u003e y quedas mejor sin arriesgar nada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la jugada que te salva del módulo entero:\u003c/b\u003e si \u003ci\u003ewill\u003c/i\u003e y \u003ci\u003emight\u003c/i\u003e te dan respeto porque son frontera, di lo mismo con lo que ya es tuyo:\u003cbr/\u003e· \u003ci\u003eIt's \u003cb\u003eprobably\u003c/b\u003e going to rain.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003ePerhaps\u003c/b\u003e we're going to the park.\u003c/i\u003e\u003cbr/\u003eMisma idea, misma nota, y con la gramática que sí evalúan."])</script><script>self.__next_f.push([1,"18:T717,"])</script><script>self.__next_f.push([1,"El español coloca estos adverbios casi donde quiere: «seguramente llueva», «llueve, seguramente», «seguramente que va a llover». El inglés no: tiene \u003cb\u003eun sitio\u003c/b\u003e, y ese sitio ya lo aprendiste en el módulo 3 con \u003ci\u003eoften\u003c/i\u003e y \u003ci\u003ealways\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla, en una línea: detrás del primer auxiliar, delante del verbo de verdad.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e· con \u003cb\u003ewill\u003c/b\u003e: \u003ci\u003eIt will \u003cb\u003eprobably\u003c/b\u003e rain.\u003c/i\u003e · \u003ci\u003eIt'll \u003cb\u003eprobably\u003c/b\u003e be cold.\u003c/i\u003e\u003cbr/\u003e· con \u003cb\u003ebe\u003c/b\u003e solo: \u003ci\u003eIt's \u003cb\u003eprobably\u003c/b\u003e cold.\u003c/i\u003e — detrás del be, igual que [[He often goes to the cinema.|Va al cine a menudo.]] pero al revés, porque be manda distinto.\u003cbr/\u003e· con un verbo normal: \u003ci\u003eHe \u003cb\u003eprobably\u003c/b\u003e works late.\u003c/i\u003e — delante del verbo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la excepción, que es la que se falla:\u003c/b\u003e \u003cb\u003eEN NEGATIVA, \u003ci\u003eprobably\u003c/i\u003e SE ADELANTA\u003c/b\u003e y se pone \u003cb\u003edelante\u003c/b\u003e del \u003ci\u003ewon't\u003c/i\u003e:\u003cbr/\u003e· ✅ \u003cb\u003e[[It probably won't rain.|Seguramente no llueva.]]\u003c/b\u003e\u003cbr/\u003e· ❌ \u003ci\u003eIt won't probably rain.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e¿Por qué? Porque lo que estás diciendo es «es probable que NO», no «no es probable que». El adverbio se coloca delante de aquello a lo que se aplica, y aquí se aplica a la negación entera.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePerhaps y maybe juegan en otra liga:\u003c/b\u003e no se meten dentro de la frase, sino que \u003cb\u003ela abren\u003c/b\u003e. \u003ci\u003e\u003cb\u003ePerhaps\u003c/b\u003e we'll go on Sunday.\u003c/i\u003e · \u003ci\u003e\u003cb\u003eMaybe\u003c/b\u003e it'll be sunny.\u003c/i\u003e Y ojo, que ya lo viste en la lección 4: detrás de \u003ci\u003emaybe\u003c/i\u003e tiene que ir un futuro de verdad. \u003ci\u003eMaybe we go\u003c/i\u003e no dice lo que crees.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error de forma que se cuela aquí:\u003c/b\u003e \u003ci\u003eIt will probably \u003cb\u003eto\u003c/b\u003e rain.\u003c/i\u003e Ese \u003ci\u003eto\u003c/i\u003e no lo pone el adverbio: lo pone la costumbre española de meter infinitivo detrás de todo. Detrás de \u003ci\u003ewill\u003c/i\u003e el verbo va desnudo, con adverbio en medio o sin él."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l7\",\"phaseId\":\"ena2m11\",\"title\":\"It'll probably rain\",\"subtitle\":\"Los tres adverbios de probabilidad — y dónde los pone el inglés, que no es donde los pone el español\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Medir la duda sin arriesgar gramática\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itprobablywont\",\"ena2m11possibly\",\"ena2m11perhapswellgo\",\"ena2m11imnotsure\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Estos tres SÍ son de A2, y por eso son tu red de seguridad\",\"body\":\"$17\",\"table\":[[\"cuánta seguridad\",\"cómo se dice\",\"el modal equivalente\"],[\"segurísimo\",\"definitely\",\"will\"],[\"muy posible\",\"probably\",\"will (con matiz)\"],[\"puede que sí\",\"possibly · perhaps · maybe\",\"might · may\"],[\"ni idea\",\"I'm not sure.\",\"—\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Dónde se pone: la regla del módulo 3, aplicada a la duda\",\"body\":\"$18\",\"table\":[[\"situación\",\"dónde va probably\",\"ejemplo\"],[\"con will\",\"detrás del will\",\"It'll probably rain.\"],[\"con won't\",\"DELANTE del won't\",\"It probably won't rain.\"],[\"con be\",\"detrás del be\",\"It's probably cold.\"],[\"con verbo normal\",\"delante del verbo\",\"He probably works late.\"],[\"perhaps / maybe\",\"al principio de la frase\",\"Perhaps we'll go.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l7e1\",\"type\":\"mc\",\"prompt\":\"Cuánta seguridad hay\",\"question\":\"“It'll probably rain on Saturday.”\",\"options\":[\"Es bastante probable que llueva\",\"Va a llover seguro\",\"Es muy poco probable\"],\"answer\":0,\"whyWrong\":[null,\"Para eso bastaría «It'll rain» o «It's definitely going to rain»\",\"Eso sería «It probably won't rain»\"],\"itemIds\":[\"ena2m11itllprobablyrain\"],\"tip\":\"Probably es el escalón de «yo apostaría por esto». No es certeza, pero se le acerca mucho más que might.\"},{\"id\":\"ena2m11l7e2\",\"type\":\"bucket\",\"prompt\":\"¿Delante o detrás? Mira si la frase es afirmativa o negativa\",\"categories\":[\"afirmativa: detrás del will\",\"negativa: delante del won't\"],\"items\":[{\"text\":\"It'll probably rain.\",\"bucket\":0},{\"text\":\"It probably won't rain.\",\"bucket\":1},{\"text\":\"She'll probably come.\",\"bucket\":0},{\"text\":\"She probably won't come.\",\"bucket\":1},{\"text\":\"We'll probably be late.\",\"bucket\":0},{\"text\":\"We probably won't be late.\",\"bucket\":1}],\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itprobablywont\"],\"tip\":\"Lee la columna de la derecha en voz alta tres veces. Es un orden que el español no tiene y solo se instala repitiéndolo.\"},{\"id\":\"ena2m11l7e3\",\"type\":\"bucket\",\"prompt\":\"¿Abre la frase, o se mete dentro?\",\"categories\":[\"abre la frase: perhaps / maybe\",\"se mete dentro: probably / possibly\"],\"items\":[{\"text\":\"Perhaps we'll go on Sunday.\",\"bucket\":0},{\"text\":\"It'll probably rain.\",\"bucket\":1},{\"text\":\"Maybe it'll be sunny.\",\"bucket\":0},{\"text\":\"She'll possibly be late.\",\"bucket\":1},{\"text\":\"Perhaps it'll be cold.\",\"bucket\":0},{\"text\":\"We'll probably stay in.\",\"bucket\":1}],\"itemIds\":[\"ena2m11perhapswellgo\",\"ena2m11possibly\",\"ena2m11itllprobablyrain\",\"enanothertime\"],\"tip\":\"Perhaps y maybe son adverbios de frase entera: comentan todo lo que viene detrás. Por eso se ponen delante de todo, como un titular.\"},{\"id\":\"ena2m11l7e4\",\"type\":\"cloze\",\"prompt\":\"Colócalo en la afirmativa\",\"text\":\"Take an umbrella — it'll ___ rain this afternoon.\",\"answers\":[\"probably\"],\"translation\":\"Coge un paraguas: seguramente llueva esta tarde.\",\"hints\":[\"Va entre el will y el verbo\",\"it'll p… rain\"],\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11anumbrella\"]},{\"id\":\"ena2m11l7e5\",\"type\":\"cloze\",\"prompt\":\"Y ahora en la negativa\",\"text\":\"Don't worry about the picnic: it ___ won't rain.\",\"answers\":[\"probably\"],\"translation\":\"No te preocupes por el picnic: seguramente no llueva.\",\"hints\":[\"En negativa se adelanta: va antes del won't\",\"it p… won't rain\"],\"itemIds\":[\"ena2m11itprobablywont\",\"enpicnic\"],\"tip\":\"Compara las dos frases que acabas de escribir: la palabra es la misma y ha cambiado de lado. Eso es todo lo que hay que recordar de esta lección.\"},{\"id\":\"ena2m11l7e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige — sobra una palabra\",\"wrong\":\"It will probably to rain this afternoon.\",\"answers\":[\"It will probably rain this afternoon.\"],\"why\":\"Detrás de will el verbo va desnudo, tenga un adverbio en medio o no. Ese «to» sale de la costumbre española de poner infinitivo detrás de todo, y aquí no pinta nada: el adverbio no cambia la regla del modal.\",\"translation\":\"Seguramente llueva esta tarde.\",\"itemIds\":[\"ena2m11itllprobablyrain\"]},{\"id\":\"ena2m11l7e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el orden\",\"wrong\":\"It won't probably rain tonight.\",\"answers\":[\"It probably won't rain tonight.\"],\"why\":\"En negativa, probably se pone delante del won't. Lo que quieres decir es «es probable que NO llueva», y el adverbio se coloca delante de aquello a lo que se aplica: aquí, la negación entera.\",\"translation\":\"Seguramente no llueva esta noche.\",\"itemIds\":[\"ena2m11itprobablywont\"],\"tip\":\"Es el mismo tipo de decisión que ya tomaste en el módulo 3 con la posición del adverbio: el inglés no lo pone donde suena bien, lo pone donde significa lo que quieres.\"},{\"id\":\"ena2m11l7e8\",\"type\":\"transform\",\"prompt\":\"Dilo con el adverbio en vez de con el modal\",\"source\":\"It might rain this afternoon.\",\"instruction\":\"Dilo con perhaps y un futuro\",\"answers\":[\"Perhaps it'll rain this afternoon.\",\"Perhaps it will rain this afternoon.\"],\"translation\":\"Quizá llueva esta tarde.\",\"hints\":[\"Perhaps abre la frase, y detrás hace falta un futuro de verdad\",\"P… it'll rain this afternoon.\"],\"itemIds\":[\"ena2m11perhapswellgo\",\"ena2m11itmightrain\"],\"tip\":\"Ojo al detalle que decide: «Perhaps it rains» no vale. El adverbio no marca futuro, así que el will sigue haciendo falta.\"},{\"id\":\"ena2m11l7e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin las palabras prohibidas\",\"source\":\"It will probably rain on Sunday.\",\"forbid\":[\"probably\",\"will\"],\"answers\":[\"It might rain on Sunday.\",\"I think it's going to rain on Sunday.\"],\"translation\":\"Seguramente llueva el domingo.\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itmightrain\"],\"tip\":\"Las dos salidas son las dos rutas del módulo: la del modal y la de la opinión con going to. Ten las dos y no te quedas callado nunca.\"},{\"id\":\"ena2m11l7e10\",\"type\":\"audiomc\",\"prompt\":\"El sábado de Nora — pregunta primero, audio después\",\"audio\":\"I'm not sure about Saturday, dear. It'll probably be chilly in the morning, so I probably won't go to the market. Perhaps I'll go on Sunday instead, if it's sunny.\",\"question\":\"¿Qué va a hacer Nora el sábado?\",\"options\":[\"Seguramente no ir al mercado\",\"Ir al mercado por la mañana\",\"Quedarse en casa seguro, sin duda\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice lo contrario: «I probably won't go to the market»\",\"«Probably» no es seguridad: es una apuesta, no una certeza\"],\"itemIds\":[\"ena2m11itprobablywont\",\"ena2m11chilly\",\"ena2m11perhapswellgo\",\"ena2m11imnotsure\"],\"tip\":\"Tres adverbios en tres frases, y cada uno en su sitio: detrás del will, delante del won't y abriendo la frase. El audio es la nota entera dicha en voz alta.\"},{\"id\":\"ena2m11l7e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la duda medida\",\"text\":\"It'll probably be chilly, but it probably won't rain. Perhaps we'll go anyway.\",\"phonetic\":\"Í-tol PRO-bli bi CHÍ-li, bat it PRO-bli UÓUNT réin. pa-JAPS uíil góu É-ni-uei\",\"translation\":\"Seguramente haga fresquito, pero seguramente no llueva. Quizá vayamos igualmente.\",\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itprobablywont\",\"ena2m11perhapswellgo\",\"ena2m11chilly\"],\"tip\":\"Acuérdate de la clínica: probably son dos sílabas, «PRO-bli». Dicho con tres, esta frase suena a alumno leyendo.\"},{\"id\":\"ena2m11l7e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Seguramente llueva el sábado, pero seguramente no llueva el domingo. Quizá vayamos el domingo.\",\"answers\":[\"It'll probably rain on Saturday, but it probably won't rain on Sunday. Perhaps we'll go on Sunday.\",\"It will probably rain on Saturday, but it probably won't rain on Sunday. Perhaps we will go on Sunday.\"],\"hints\":[\"Detrás del will · delante del won't · perhaps abre la frase\",\"It'll p… rain on Saturday, but it p… won't rain on Sunday.\"],\"itemIds\":[\"ena2m11itllprobablyrain\",\"ena2m11itprobablywont\",\"ena2m1
