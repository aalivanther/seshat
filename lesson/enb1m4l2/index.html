u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T6ae,"])</script><script>self.__next_f.push([1,"Esta es \u003cb\u003ela\u003c/b\u003e lección del módulo, y no va de gramática: va de un reflejo. El español tiene una máquina de decir cosas sin culpable —el \u003cb\u003e«se»\u003c/b\u003e— y la usa a todas horas: \u003ci\u003ese limpia, se dice, se habla, se cierra, se puede\u003c/i\u003e. El inglés \u003cb\u003eno la tiene\u003c/b\u003e. Tiene tres piezas distintas, y hay que elegir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. La pasiva\u003c/b\u003e — cuando la acción y el resultado importan más que quién la hace. Es la salida \u003cb\u003eformal y escrita\u003c/b\u003e, la de la prensa y los carteles.\u003cbr/\u003e\u003ci\u003eSe limpia todas las tardes\u003c/i\u003e → \u003cb\u003eThe library is cleaned every evening.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. «you» genérico\u003c/b\u003e — cuando hablas de lo que puede o no puede hacer \u003cb\u003ecualquiera\u003c/b\u003e. Es la salida \u003cb\u003ehablada y de las normas\u003c/b\u003e, y ese «you» no es «tú»: es «uno».\u003cbr/\u003e\u003ci\u003eAquí no se puede comer\u003c/i\u003e → \u003cb\u003eYou aren't allowed to eat here.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. «they» / «people»\u003c/b\u003e — cuando el sujeto es \u003ci\u003ela gente\u003c/i\u003e, un grupo vago del que hablas desde fuera.\u003cbr/\u003e\u003ci\u003eDicen que la piscina cierra\u003c/i\u003e → \u003cb\u003eThey say the pool is closing.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el error que se comete, que no es el que parece.\u003c/b\u003e El hispanohablante no se equivoca de forma: se equivoca de \u003cb\u003efrecuencia\u003c/b\u003e. Tira siempre de \u003ci\u003ethey say\u003c/i\u003e —porque es lo más corto— y no produce la pasiva nunca. En el Writing formal eso se paga en el criterio de vocabulario, por registro: \u003ci\u003eThey say that the library will close\u003c/i\u003e en una carta al periódico suena a conversación de portal; \u003ci\u003eIt is said that…\u003c/i\u003e suena a lo que es.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco que hay que matar hoy:\u003c/b\u003e «Aquí se habla español» \u003cb\u003eno\u003c/b\u003e es «Here speaks Spanish». El inglés no puede dejar la frase sin sujeto: \u003cb\u003eSpanish is spoken here.\u003c/b\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m4l2\",\"phaseId\":\"enb1m4\",\"title\":\"Se dice, se hace, se cierra\",\"subtitle\":\"El «se» impersonal no existe en inglés: hay tres maneras de sustituirlo\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las tres salidas, una por una\",\"itemIds\":[\"enb1m4iscleaned\",\"enb1m4notallowed\",\"enb1m4theysay\",\"enb1m4isspoken\",\"enb1m4bythestorm\",\"enb1m4nobodyknows\",\"enb1m4wasseenby\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: un «se» español, tres salidas inglesas\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Cuándo\"],[\"Se limpia todos los días.\",\"It is cleaned every day.\",\"escrito, formal, prensa\"],[\"Aquí no se puede fumar.\",\"You can't smoke here.\",\"hablado, normas\"],[\"Dicen que va a cerrar.\",\"They say it's closing.\",\"hablado, rumor\"],[\"Se cree que fue un fallo.\",\"It is believed that it was a mistake.\",\"escrito, informe\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m4l2e1\",\"type\":\"mc\",\"prompt\":\"El calco que hay que matar\",\"question\":\"«En la tienda del señor Patel se habla español» →\",\"options\":[\"Spanish is spoken in Mr Patel's shop.\",\"In Mr Patel's shop speaks Spanish.\",\"It speaks Spanish in Mr Patel's shop.\"],\"answer\":0,\"whyWrong\":[null,\"Es el calco literal: en español la frase puede empezar sin sujeto, en inglés no. Aquí «speaks» se queda sin nadie que hable.\",\"«It» no habla español. El inglés necesita un sujeto de verdad, y el sujeto lógico aquí es el idioma.\"],\"itemIds\":[\"enb1m4isspoken\"],\"tip\":\"Regla de bolsillo: si en español el «se» va con un verbo que lleva objeto («se habla ESPAÑOL», «se vende PAN»), en inglés ese objeto sube a sujeto y va pasiva.\"},{\"id\":\"enb1m4l2e2\",\"type\":\"bucket\",\"prompt\":\"Cada frase resuelve el «se» de una manera. ¿Cuál?\",\"categories\":[\"Con PASIVA (be + participio)\",\"Con «you» o «they» (sin pasiva)\"],\"items\":[{\"text\":\"The library is cleaned every evening.\",\"bucket\":0},{\"text\":\"Spanish is spoken in this shop.\",\"bucket\":0},{\"text\":\"The pool was closed in March.\",\"bucket\":0},{\"text\":\"It is said that the roof leaks.\",\"bucket\":0},{\"text\":\"You aren't allowed to eat here.\",\"bucket\":1},{\"text\":\"They say the pool is closing.\",\"bucket\":1},{\"text\":\"You can't park on this street.\",\"bucket\":1},{\"text\":\"People think it's a mistake.\",\"bucket\":1}],\"itemIds\":[\"enb1m4iscleaned\",\"enb1m4isspoken\",\"enb1m4notallowed\",\"enb1m4theysay\"],\"tip\":\"Las ocho traducen un «se» español. La diferencia no es de significado, es de REGISTRO: la columna de la izquierda es la que se escribe, la de la derecha la que se habla.\"},{\"id\":\"enb1m4l2e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The library cleans every evening.\",\"answers\":[\"The library is cleaned every evening.\"],\"why\":\"Tal cual, la frase dice que la biblioteca limpia — ella, a alguien. El «se» español tapa esa diferencia; el inglés no: si a algo se lo hacen, va pasiva.\",\"translation\":\"La biblioteca se limpia todas las tardes.\",\"itemIds\":[\"enb1m4iscleaned\"]},{\"id\":\"enb1m4l2e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el aviso del tablón de la biblioteca\",\"text\":\"NOTICE — The reading room ___ cleaned every evening at eight. Bags must ___ left at the desk. ___ say the roof will be repaired in the spring, but nothing has ___ decided yet.\",\"answers\":[\"is\",\"be\",\"They\",\"been\"],\"bank\":[\"is\",\"be\",\"They\",\"been\",\"are\",\"does\",\"It\"],\"translation\":\"AVISO — La sala de lectura se limpia todas las tardes a las ocho. Las mochilas hay que dejarlas en el mostrador. Dicen que el tejado se arreglará en primavera, pero todavía no se ha decidido nada.\",\"itemIds\":[\"enb1m4iscleaned\",\"enb1m4theysay\"],\"tip\":\"Cuatro huecos y en los cuatro decide la FORMA, no el significado: singular/plural, infinitivo tras modal, sujeto de persona y participio tras «has». Así es como se falla o se acierta el Reading Part 1.\"},{\"id\":\"enb1m4l2e5\",\"type\":\"transform\",\"prompt\":\"Del «they» hablado a la pasiva escrita\",\"source\":\"People speak Spanish in Mr Patel's shop.\",\"instruction\":\"Ponla en pasiva (el idioma sube a sujeto)\",\"answers\":[\"Spanish is spoken in Mr Patel's shop\",\"Spanish is spoken in Mr Patel's shop.\"],\"translation\":\"En la tienda del señor Patel se habla español.\",\"hints\":[\"Empieza por «Spanish…»\",\"Spanish is ... in Mr Patel's shop\"],\"itemIds\":[\"enb1m4isspoken\"],\"tip\":\"Las dos frases son correctas y dicen lo mismo. Lo que cambia es dónde caben: la primera en una charla, la segunda en un folleto.\"},{\"id\":\"enb1m4l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa el auxiliar\",\"text\":\"The window ___ broken by the storm.\",\"answers\":[\"was\"],\"translation\":\"La ventana la rompió la tormenta.\",\"hints\":[\"Ya pasó, y el sujeto es singular\",\"Pasado de «be»\"],\"itemIds\":[\"enb1m4bythestorm\"],\"tip\":\"Aquí el «by» SÍ hace falta: sin él no sabrías que fue la tormenta y no un ladrillo. El agente se pone cuando informa; se calla cuando no.\"},{\"id\":\"enb1m4l2e7\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «broke»\",\"source\":\"The storm broke the window.\",\"forbid\":[\"broke\"],\"answers\":[\"The window was broken by the storm\",\"The window was broken in the storm\",\"The window was broken by the storm.\"],\"translation\":\"La tormenta rompió la ventana.\",\"hints\":[\"Empieza por lo que sufrió la acción: The window…\",\"The window was ... by the storm\"],\"itemIds\":[\"enb1m4bythestorm\"],\"tip\":\"Poder decir la misma idea en activa y en pasiva es «range of grammar», uno de los cuatro criterios del Writing. No es adorno: es un cuarto de la nota.\"},{\"id\":\"enb1m4l2e8\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — aquí la salida NO es la pasiva\",\"source\":\"En la sala de lectura no se puede comer.\",\"answers\":[\"You aren't allowed to eat in the reading room\",\"You are not allowed to eat in the reading room\",\"You can't eat in the reading room\",\"You cannot eat in the reading room\"],\"hint\":\"Empieza por el sujeto genérico, el que significa «uno»\",\"itemIds\":[\"enb1m4notallowed\"],\"tip\":\"Ese «You» no te señala a ti: es «uno», «la gente». En un cartel inglés es lo normal, y en español sonaría raro traducirlo por «tú».\"},{\"id\":\"enb1m4l2e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"Nobody knows who took the photo.\",\"answers\":[\"Nadie sabe quién hizo la foto\",\"Nadie sabe quién sacó la foto\",\"Nadie sabe quién tomó la foto\"],\"itemIds\":[\"enb1m4nobodyknows\"],\"tip\":\"«take a photo», nunca «make a photo» ni «do a photo». Es la colocación, y las colocaciones se aprenden enteras o no se aprenden.\"},{\"id\":\"enb1m4l2e10\",\"type\":\"mc\",\"prompt\":\"Cuestión de registro, no de gramática\",\"question\":\"Estás escribiendo una carta al periódico. ¿Cuál escribes?\",\"options\":[\"They say that the library will close.\",\"It is said that the library will close.\",\"People are saying the library closes.\"],\"answer\":1,\"whyWrong\":[\"No está mal, está fuera de sitio: en una carta formal suena a conversación de portal y baja el criterio de vocabulario por registro.\",null,\"Correcta al hablar, pero informal, y además el presente simple ahí promete una fecha que nadie ha dado.\"],\"itemIds\":[\"enb1m4theysay\",\"enb1m4itissaidthat\"],\"tip\":\"Las tres son inglés correcto. La nota no la baja el error: la baja escribir en el registro equivocado, que es lo que el examen llama «appropriacy».\"},{\"id\":\"enb1m4l2e11\",\"type\":\"build\",\"prompt\":\"Construye la frase con agente\",\"target\":\"She was seen by two neighbours\",\"translation\":\"La vieron dos vecinas\",\"distractors\":[\"for\",\"saw\"],\"itemIds\":[\"enb1m4wasseenby\"],\"tip\":\"El agente va con «by», nunca con «for». «for» es para quién se hace algo; «by» es quién lo hace.\"},{\"id\":\"enb1m4l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La biblioteca se limpia todas las tardes y en la sala de lectura no se puede comer.\",\"answers\":[\"The library is cleaned every evening and you aren't allowed to eat in the reading room\",\"The library is cleaned every evening and you are not allowed to eat in the reading room\",\"The library is cleaned every evening and you can't eat in the reading room\"],\"hints\":[\"Dos «se» seguidos y dos salidas distintas\",\"The library is ... and you aren't allowed to ...\"],\"itemIds\":[\"enb1m4iscleaned\",\"enb1m4notallowed\"],\"tip\":\"Dos «se» en una sola frase y cada uno con su salida. Elegir bien las dos, seguidas, ya es nivel B1.\"},{\"id\":\"enb1m4l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening en formato examen. Dos escuchas.\",\"audio\":\"Have you heard about the pool?|No, what about it?|They say it's closing in March. It was on the local page last night — apparently the council decided in the summer and nobody was told.|Hang on, who says? Because that's not what the notice at reception says.\",\"question\":\"¿Qué duda pone la segunda voz sobre la noticia?\",\"options\":[\"Que no se sabe quién lo dice y el aviso oficial dice otra cosa\",\"Que la piscina cerró en verano\",\"Que el ayuntamiento no existe\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La decisión se tomó en verano; el cierre sería en marzo. Son dos fechas distintas y la opción las mezcla.\",\"Nadie discute que haya ayuntamiento: se discute de dónde sale la información.\"],\"itemIds\":[\"enb1m4theysay\",\"enb1m4council\"],\"tip\":\"«They say…» y «nobody was told» son las dos formas de no decir quién. La pregunta «who says?» es exactamente lo que hay que preguntarle a un rumor — y lo que entrena el Listening Part 4, donde hay que separar hecho de opinión.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqp
