e te van a salir al paso cada cinco frases.\u003cbr/\u003e\u003cbr/\u003ePor eso aquí se hace esto:\u003cbr/\u003e· se te \u003cb\u003epresenta\u003c/b\u003e, para que entiendas lo que lees;\u003cbr/\u003e· se te hace \u003cb\u003ereconocer\u003c/b\u003e, que es donde de verdad se cobra —en el Listening y en el Reading del examen aparece, aunque no te lo pidan escribir—;\u003cbr/\u003e· y se te hace \u003cb\u003eproducirlo\u003c/b\u003e, primero con la frase medio puesta y después suelto, porque \u003ci\u003eIt'll rain\u003c/i\u003e y \u003ci\u003eif it rains\u003c/i\u003e los vas a necesitar hablando aunque el examen no te los pregunte.\u003cbr/\u003e\u003cbr/\u003eLo que NO se hace es \u003cb\u003emeterlo en el simulacro ni en la nota\u003c/b\u003e: el examen que preparas no lo pide, así que aquí tampoco se te va a suspender por ello. \u003cb\u003eTu futuro de examen sigue siendo \u003ci\u003ebe going to\u003c/i\u003e y el presente continuo del módulo 6.\u003c/b\u003e Lo de hoy va encima de una casa que ya está terminada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUna excepción, y es buena noticia:\u003c/b\u003e los adverbios de probabilidad de la lección 7 —\u003ci\u003eprobably\u003c/i\u003e, \u003ci\u003epossibly\u003c/i\u003e, \u003ci\u003eperhaps\u003c/i\u003e— SÍ están en la lista del A2 y sí puntúan. Si en algún momento la frontera te agobia, agárrate a ellos: \u003ci\u003eIt's probably going to rain\u003c/i\u003e dice lo mismo con la gramática que ya es tuya."])</script><script>self.__next_f.push([1,"18:T688,"])</script><script>self.__next_f.push([1,"La forma no trae nada nuevo, y esto es literal. En el módulo 7 aprendiste \u003cb\u003ela regla única de los modales\u003c/b\u003e: \u003cb\u003esin \u003ci\u003edo\u003c/i\u003e, sin \u003ci\u003e-s\u003c/i\u003e y sin \u003ci\u003eto\u003c/i\u003e\u003c/b\u003e. \u003ci\u003ewill\u003c/i\u003e es un modal, así que se porta igual que \u003ci\u003ecan\u003c/i\u003e y que \u003ci\u003emust\u003c/i\u003e:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ewill + verbo en forma de diccionario.\u003c/b\u003e \u003ci\u003eIt will \u003cb\u003erain\u003c/b\u003e.\u003c/i\u003e — nunca \u003ci\u003ewill to rain\u003c/i\u003e, nunca \u003ci\u003ewill rains\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eNegativa: \u003ci\u003ewon't\u003c/i\u003e\u003c/b\u003e (que es \u003ci\u003ewill not\u003c/i\u003e apretado). \u003ci\u003eIt \u003cb\u003ewon't\u003c/b\u003e rain.\u003c/i\u003e — nunca \u003ci\u003edoesn't will\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003ePregunta: \u003ci\u003ewill\u003c/i\u003e salta delante del sujeto.\u003c/b\u003e \u003ci\u003e\u003cb\u003eWill it\u003c/b\u003e be cold?\u003c/i\u003e — nunca \u003ci\u003eDoes it will…\u003c/i\u003e.\u003cbr/\u003e· \u003cb\u003eRespuesta corta: se devuelve el \u003ci\u003ewill\u003c/i\u003e.\u003c/b\u003e \u003ci\u003eYes, it \u003cb\u003ewill\u003c/b\u003e. / No, it \u003cb\u003ewon't\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e· Es el mismo para todas las personas: \u003ci\u003eI will · you will · she will · they will\u003c/i\u003e. Ni una sola \u003ci\u003e-s\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAl hablar casi nunca dirás «will» entero.\u003c/b\u003e Se contrae y se pega al sujeto: \u003cb\u003eI'll · you'll · he'll · she'll · it'll · we'll · they'll\u003c/b\u003e. Esa \u003ci\u003e'll\u003c/i\u003e no es una sílaba nueva; solo alarga la palabra de delante. La trabajamos entera en la lección 5.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y para qué sirve?\u003c/b\u003e Hoy quédate con tres trabajos, que son los tres más frecuentes:\u003cbr/\u003e1. \u003cb\u003eLa decisión que tomas AHORA MISMO\u003c/b\u003e, mientras hablas: \u003ci\u003e[[I'll help you.|Te echo una mano.]]\u003c/i\u003e (acabas de ver que alguien no llega).\u003cbr/\u003e2. \u003cb\u003eLa promesa\u003c/b\u003e: \u003ci\u003eI'll call you later.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eLa predicción de cabeza\u003c/b\u003e, sin pruebas delante: \u003ci\u003e[[It will rain tomorrow.|Mañana lloverá.]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl cuarto trabajo —repartirse el futuro con \u003ci\u003egoing to\u003c/i\u003e— es toda la lección 2."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m11l1\",\"phaseId\":\"ena2m11\",\"title\":\"It will rain tomorrow\",\"subtitle\":\"El otro futuro: la decisión de ahora mismo y la predicción a secas\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que pasará, y lo que no\",\"itemIds\":[\"ena2m11illhelpyou\",\"ena2m11itwillrain\",\"ena2m11itwontrain\",\"ena2m11willitbecold\",\"ena2m11yesitwill\",\"ena2m11wellbefine\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de empezar: esto es FRONTERA con el B1, y se dice claro\",\"body\":\"$17\",\"table\":[[\"\",\"¿lo evalúa el A2?\",\"qué hacemos con ello\"],[\"will / won't\",\"LanguageCert no · Cambridge sí\",\"presentar, reconocer, producir — fuera del simulacro\"],[\"might / may (posibilidad)\",\"LanguageCert no · Cambridge sí\",\"presentar, reconocer, producir — fuera del simulacro\"],[\"primera condicional\",\"LanguageCert no · Cambridge sí\",\"presentar, reconocer, producir — fuera del simulacro\"],[\"probably / possibly / perhaps\",\"SÍ, los dos\",\"producción libre: son tuyos\"],[\"be going to · continuo de futuro\",\"SÍ, los dos\",\"siguen siendo tu futuro de examen\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"will y won't: un modal más, y ya sabes cómo se portan los modales\",\"body\":\"$18\",\"table\":[[\"\",\"cómo se dice\",\"el error que hay que matar\"],[\"afirmativa\",\"It will rain. / It'll rain.\",\"It will rains.\"],[\"negativa\",\"It won't rain.\",\"It doesn't will rain.\"],[\"pregunta\",\"Will it be cold?\",\"Does it will be cold?\"],[\"respuesta corta\",\"Yes, it will. / No, it won't.\",\"Yes, it does.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m11l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce la decisión del momento\",\"question\":\"Amy llega cargada de bolsas y Valeria dice: “I'll help you.”\",\"options\":[\"Te echo una mano (lo decide ahora)\",\"Voy a ayudarte, ya lo tenía pensado\",\"Suelo ayudarte\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «I'm going to help you» — un plan de antes, y aquí Valeria acaba de ver las bolsas\",\"Eso sería «I help you» o «I usually help you»: rutina\"],\"itemIds\":[\"ena2m11illhelpyou\"],\"tip\":\"Will es la lengua de las reacciones: ves algo, abres la boca. Si el plan existía antes de abrirla, será going to.\"},{\"id\":\"ena2m11l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — el tiempo ya lo traes del A1\",\"pairs\":[{\"target\":\"It's raining.\",\"source\":\"Está lloviendo\"},{\"target\":\"It's sunny.\",\"source\":\"Hace sol\"},{\"target\":\"It's cold.\",\"source\":\"Hace frío\"},{\"target\":\"It's windy.\",\"source\":\"Hace viento\"},{\"target\":\"It's snowing.\",\"source\":\"Está nevando\"}],\"targetSeconds\":25,\"itemIds\":[\"enitsraining\",\"enitssunny\",\"enitscold\",\"enitswindy\",\"enitssnowing\"],\"tip\":\"Todo el módulo se mueve sobre estas cinco. Que salgan sin pensar es media lección ganada.\"},{\"id\":\"ena2m11l1e3\",\"type\":\"bucket\",\"prompt\":\"La regla única de los modales, aplicada a will\",\"categories\":[\"así se escribe\",\"así NO: sobra o falta algo\"],\"items\":[{\"text\":\"It will rain tomorrow.\",\"bucket\":0},{\"text\":\"It will rains tomorrow.\",\"bucket\":1},{\"text\":\"Will it be cold?\",\"bucket\":0},{\"text\":\"Does it will be cold?\",\"bucket\":1},{\"text\":\"She won't come.\",\"bucket\":0},{\"text\":\"She doesn't will come.\",\"bucket\":1},{\"text\":\"I'll help you.\",\"bucket\":0},{\"text\":\"I will to help you.\",\"bucket\":1}],\"itemIds\":[\"ena2m11itwillrain\",\"ena2m11willitbecold\",\"ena2m11itwontrain\",\"ena2m11illhelpyou\"],\"tip\":\"Los cuatro errores de la derecha son el mismo error: tratar a will como si fuera un verbo normal. No lo es — es un modal, y los modales van solos.\"},{\"id\":\"ena2m11l1e4\",\"type\":\"cloze\",\"prompt\":\"La contracción que usarás siempre\",\"text\":\"Don't worry — I ___ help you with the bags.\",\"answers\":[\"'ll\",\"will\"],\"translation\":\"No te preocupes: te echo una mano con las bolsas.\",\"hints\":[\"Es la decisión de este segundo, no un plan de ayer\",\"I … help you.\"],\"itemIds\":[\"ena2m11illhelpyou\",\"endontworry\"],\"tip\":\"Al hablar, «I will» entero suena a promesa solemne o a discusión. Lo normal es «I'll», pegadito.\"},{\"id\":\"ena2m11l1e5\",\"type\":\"cloze\",\"prompt\":\"La negativa entera\",\"text\":\"The forecast is good: it ___ rain tonight.\",\"answers\":[\"won't\",\"will not\"],\"translation\":\"La previsión es buena: esta noche no lloverá.\",\"hints\":[\"Will not, apretado en una sola palabra\",\"it w… rain tonight\"],\"itemIds\":[\"ena2m11itwontrain\"]},{\"id\":\"ena2m11l1e6\",\"type\":\"transform\",\"prompt\":\"De afirmación a pregunta\",\"source\":\"It will be cold tomorrow.\",\"instruction\":\"Conviértela en pregunta\",\"answers\":[\"Will it be cold tomorrow?\"],\"translation\":\"¿Hará frío mañana?\",\"hints\":[\"El modal salta delante del sujeto; nada de do\",\"W… it be cold tomorrow?\"],\"itemIds\":[\"ena2m11willitbecold\"],\"tip\":\"Exactamente lo mismo que hacías con can: «Can you swim?». Cambias la pieza y la mecánica no se mueve.\"},{\"id\":\"ena2m11l1e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige — hay un auxiliar de más\",\"wrong\":\"Does it will be cold tomorrow?\",\"answers\":[\"Will it be cold tomorrow?\"],\"why\":\"Will ya es el auxiliar: hace él la pregunta saltando delante del sujeto. Do y un modal nunca conviven — es la misma regla que te impedía escribir «Do you can swim?» en el módulo 7.\",\"translation\":\"¿Hará frío mañana?\",\"itemIds\":[\"ena2m11willitbecold\"]},{\"id\":\"ena2m11l1e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige la terminación\",\"wrong\":\"It will rains tomorrow.\",\"answers\":[\"It will rain tomorrow.\"],\"why\":\"Detrás de un modal el verbo va desnudo: sin -s, sin -ed y sin -ing. La tercera persona ya la lleva la frase entera, y el inglés no la marca dos veces.\",\"translation\":\"Mañana lloverá.\",\"itemIds\":[\"ena2m11itwillrain\"],\"tip\":\"Es el mismo motor de «She can swim» y de «She must go»: la pieza de delante se lleva la gramática y el verbo se queda limpio.\"},{\"id\":\"ena2m11l1e9\",\"type\":\"build\",\"prompt\":\"Construye la negativa\",\"target\":\"It won't rain tonight\",\"translation\":\"Esta noche no lloverá\",\"distractors\":[\"doesn't\",\"rains\"],\"itemIds\":[\"ena2m11itwontrain\"]},{\"id\":\"ena2m11l1e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Will it be cold tomorrow?\",\"translation\":\"¿Hará frío mañana?\",\"hints\":[\"Empieza por el modal\",\"W… it be cold tomorrow?\"],\"itemIds\":[\"ena2m11willitbecold\"]},{\"id\":\"ena2m11l1e11\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con lo que hace\",\"pairs\":[{\"target\":\"I'll help you.\",\"source\":\"Lo decide ahora mismo\"},{\"target\":\"It will rain tomorrow.\",\"source\":\"Predice, sin pruebas delante\"},{\"target\":\"It won't rain tonight.\",\"source\":\"Predice que NO pasará\"},{\"target\":\"Yes, it will.\",\"source\":\"Contesta que sí, en corto\"}],\"itemIds\":[\"ena2m11illhelpyou\",\"ena2m11itwillrain\",\"ena2m11itwontrain\",\"ena2m11yesitwill\"]},{\"id\":\"ena2m11l1e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — mirando el parte del tiempo\",\"text\":\"It will rain tomorrow, but it won't rain tonight. We'll be fine.\",\"phonetic\":\"it uil RÉIN ta-MO-rou, bat it UÓUNT réin tu-NÁIT. uíil bi FÁIN\",\"translation\":\"Mañana lloverá, pero esta noche no. No pasa nada.\",\"itemIds\":[\"ena2m11itwillrain\",\"ena2m11itwontrain\",\"ena2m11wellbefine\"],\"tip\":\"Fíjate en la diferencia de fuerza: «will» va flojito y casi no se oye; «won't» es largo y se oye desde la otra punta. Es el inglés avisando de dónde está la negación.\"},{\"id\":\"ena2m11l1e13\",\"type\":\"type\",\"prompt\":\"Cierre de producc
