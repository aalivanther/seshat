03c/i\u003e ya se distinguen. Por eso el K I «de verdad» es tan corto.\u003cbr/\u003e\u003cbr/\u003eY dos giros de fuente que van con esto, porque un B2 no dice «yo he leído»:\u003cbr/\u003e· \u003cb\u003elaut\u003c/b\u003e + dativo (o genitivo): \u003ci\u003elaut der Polizei\u003c/i\u003e, \u003ci\u003elaut eines Berichts\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ezufolge\u003c/b\u003e va \u003cu\u003edetrás\u003c/u\u003e de la fuente: \u003ci\u003eeinem Bericht \u003cb\u003ezufolge\u003c/b\u003e\u003c/i\u003e — jamás «zufolge einem Bericht», que es calco del español «según».\",\"table\":[[\"persona\",\"K I (¿se ve?)\",\"lo que se escribe\"],[\"er / sie / es\",\"habe, sei, komme — se ve\",\"K I\"],[\"sie (plural)\",\"haben, sind, kommen — NO se ve\",\"hätten, wären, kämen / würden\"],[\"wir\",\"haben, sind — NO se ve\",\"hätten, wären\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l2e1\",\"type\":\"bucket\",\"prompt\":\"¿Se ve el Konjunktiv I o hay que sustituir?\",\"categories\":[\"K I se distingue (se queda)\",\"coincide con el indicativo → K II\"],\"items\":[{\"text\":\"er habe\",\"bucket\":0},{\"text\":\"sie haben\",\"bucket\":1},{\"text\":\"er sei\",\"bucket\":0},{\"text\":\"sie sind\",\"bucket\":1},{\"text\":\"er komme\",\"bucket\":0},{\"text\":\"wir kommen\",\"bucket\":1}],\"itemIds\":[\"b2m1habe\",\"b2m1haetten\",\"b2m1sei\",\"b2m1waeren\"],\"tip\":\"Pregunta única: ¿esta forma es distinta del indicativo? Si no, K II.\"},{\"id\":\"b2m1l2e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Sie sagten, sie haben keine Zeit.\",\"answers\":[\"Sie sagten, sie hätten keine Zeit.\"],\"why\":\"«sie haben» es a la vez indicativo y Konjunktiv I: la cita se cae. En plural se sustituye por Konjunktiv II: hätten.\",\"translation\":\"Dijeron que no tienen tiempo.\",\"itemIds\":[\"b2m1haetten\"]},{\"id\":\"b2m1l2e3\",\"type\":\"transform\",\"prompt\":\"Sustituye para que se vea la cita\",\"source\":\"Die Zeugen sag
