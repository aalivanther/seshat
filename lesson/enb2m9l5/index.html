n leaves?|¿Me puede decir a qué hora sale el siguiente tren?]], jamás \u003ci\u003ewhen does the next train leave\u003c/i\u003e detrás del tell me.\u003cbr/\u003e\u003cbr/\u003eLa otra trampa de hoy es de este módulo: el \u003cb\u003esujeto colgante\u003c/b\u003e. El español no tiene -ing de circunstancia, así que el alumno que se anima a usarlo lo pega a cualquier principal: \u003ci\u003eWalking home, the rain started\u003c/i\u003e. Comunica. Y dice que la lluvia volvía a casa. La clínica es mecánica: \u003cb\u003epregunta quién hace el -ing; si no es el sujeto de detrás, reescribe\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY de propina, la preposición de la relativa. El manual pone \u003ci\u003ethe flat about which I told you\u003c/i\u003e, que es correcto y nadie dice. Lo normal, también en el examen, es [[the flat I told you about|el piso del que te hablé]]. La preposición al final no es informal: es inglés."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m9l5\",\"phaseId\":\"enb2m9\",\"title\":\"I don't know where it is\",\"subtitle\":\"Dos trampas que sobreviven en B2: el sujeto colgante y la interrogativa indirecta\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos frases que hay que dejar automáticas\",\"itemIds\":[\"enb2m9idontknowwhereitis\",\"enb2m9couldyoutellmewhen\",\"enb2m9thesameperson\",\"enb2m9nattoldyouabout\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Coe lo marca como problema «even for advanced learners»\",\"body\":\"$17\",\"table\":[[\"Lo que sale\",\"Por qué está mal\",\"La forma\"],[\"I don't know where is it\",\"has invertido una declarativa\",\"I don't know where it is\"],[\"Could you tell me when does it leave?\",\"has dejado el do-support de la pregunta\",\"when the next train leaves\"],[\"Walking home, the rain started\",\"el -ing no es de the rain\",\"Walking home, I got caught in the rain\"],[\"the flat about which I told you\",\"no está mal: está disfrazada de libro\",
