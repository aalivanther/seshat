m [[Zug|tren]] nach Basel. Wegen des Regens sind die Gassen [[nass|mojadas]], und trotz der Kälte stehen überall Menschen.\u003cbr/\u003e5. Um Punkt vier geht das Licht aus. \u003cb\u003eDie ganze Stadt wird dunkel gemacht\u003c/b\u003e, und tausende bemalte Laternen leuchten auf.\u003cbr/\u003e6. Sofía sagt nichts. Anna lacht: „Ich habe dir gesagt, dass es sich lohnt, obwohl du nicht schlafen konntest.“\u003cbr/\u003e7. Um sieben essen sie in einem Restaurant Mehlsuppe. Ein alter Mann am [[Nebentisch|la mesa de al lado]] erzählt, dass er dieses Jahr zum achtundsiebzigsten Mal dabei ist.\u003cbr/\u003e8. „Und langweilt Sie das nicht?“, fragt Sofía. Der Mann schaut sie an: „Ein Brauch, den man jedes Jahr wiederholt, ist kein alter Brauch. Er ist ein Kalender.“\u003cbr/\u003e9. Auf dem Rückweg schreibt Sofía an Lucía nach Valencia: „Im kommenden Jahr komme ich wieder. Und dann bringe ich ein Kostüm mit.“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m7l9\",\"phaseId\":\"b1m7\",\"title\":\"Sofía an der Fasnacht\",\"subtitle\":\"Historia larga, espiral de los dos módulos anteriores y monólogo\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas del módulo\",\"itemIds\":[\"b1m7febedeutung\",\"b1m7fezusammenhalt\",\"b1m7fesichverkleiden\",\"b1m7feerinnernan\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sofía an der Fasnacht — die lange Nacht von Basel\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m7l9e1\",\"type\":\"mc\",\"prompt\":\"¿Verdadero o falso? (frase 1)\",\"question\":\"„Sofía wohnt in Basel.“\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"whyWrong\":[\"Relee la frase 1: Sofía vive en Berlín y está dos semanas trabajando en Zúrich; a Basilea va de visita\",null],\"itemIds\":[\"b1m7fefasnacht\"]},{\"id\":\"b1m7l9e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 3) — espiral de b1m5: la pasiva\",\"question\":\"„Die Laternen werden von den Cliquen getragen.“ — ¿Quién lleva los faroles?\",\"options\":[\"Las comparsas llevan los faroles\",\"Los faroles llevan a las comparsas\",\"Nadie: los faroles van solos\"],\"answer\":0,\"whyWrong\":[null,\"Ese es el error clásico: en la pasiva el PRIMER sustantivo no es el agente\",\"«von den Cliquen» nombra al agente explícitamente\"],\"itemIds\":[\"b1m7femenge\"],\"tip\":\"En pasiva, el agente va con von. El primer sustantivo de la frase RECIBE la acción — la trampa del «principio del primer sustantivo».\"},{\"id\":\"b1m7l9e3\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 8) — inferencia\",\"question\":\"¿Qué quiere decir el hombre mayor con «Er ist ein Kalender»?\",\"options\":[\"Que la fiesta le sirve para saber qué día es\",\"Que repetir la fiesta cada año es lo que organiza su vida\",\"Que se apunta las fechas en un calendario\"],\"answer\":1,\"whyWrong\":[\"Sería una lectura demasiado literal\",null,\"No habla de apuntar nada: habla de la repetición\"],\"itemIds\":[\"b1m7febrauch\",\"b1m7febedeutung\"]},{\"id\":\"b1m7l9e4\",\"type\":\"cloze\",\"prompt\":\"Espiral de b1m5 — completa la pasiva (frase 5)\",\"text\":\"Die ganze Stadt ___ dunkel gemacht.\",\"answers\":[\"wird\"],\"translation\":\"Toda la ciudad se queda a oscuras (es puesta a oscuras).\",\"hints\":[\"Pasiva de presente: werden + Partizip II\",\"3ª persona del singular de werden\"],\"itemIds\":[\"b1m7femorgestraich\"],\"tip\":\"El español lo diría con «se»: «se apagan las luces». El alemán produce pasiva — y esa es una de las estructuras evaluables del nivel.\"},{\"id\":\"b1m7l9e5\",\"type\":\"cloze\",\"prompt\":\"Espiral de b1m6 — la subordinada encadenada (frase 6)\",\"text\":\"Ich habe dir gesagt, dass es sich lohnt, obwohl du nicht schlafen ___.\",\"answers\":[\"konntest\"],\"translation\":\"Te dije que merece la pena, aunque no pudieras dormir.\",\"hints\":[\"Dentro de obwohl, el verbo conjugado va al FINAL, detrás del infinitivo\",\"Präteritum de können con du\"],\"itemIds\":[\"b1m6obwohl\"],\"tip\":\"«…, obwohl du nicht schlafen konntest» — el modal conjugado cierra la frase. El calco español pondría «konntest» antes de «schlafen».\"},{\"id\":\"b1m7l9e6\",\"type\":\"cloze\",\"prompt\":\"El genitivo del módulo (frase 4)\",\"text\":\"Wegen ___ Regens sind die Gassen nass.\",\"answers\":[\"des\"],\"translation\":\"Por la lluvia las calles están mojadas.\",\"hints\":[\"wegen + genitivo\",\"der Regen es masculino\"],\"itemIds\":[\"b1m7fewegen\",\"b1m7fetrotzdesregens\"]},{\"id\":\"b1m7l9e7\",\"type\":\"order\",\"prompt\":\"Ordena la noche de Sofía\",\"sentences\":[\"Sofía bekommt eine Nachricht von Anna.\",\"Sie fahren mit dem Zug nach Basel.\",\"Um vier Uhr geht das Licht aus.\",\"Um sieben essen sie Mehlsuppe.\",\"Sofía schreibt an Lucía: „Im kommenden Jahr komme ich wieder.“\"],\"translation\":\"Sofía recibe un mensaje de Anna · Van en tren a Basilea · A las cuatro se apaga la luz · A las siete comen sopa de harina · Sofía le escribe a Lucía.\",\"itemIds\":[\"b1m7fefasnacht\",\"b1m7femorgestraich\"]},{\"id\":\"b1m7l9e8\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de fiesta — todo esto ya lo sabes del A2\",\"pairs\":[{\"target\":\"feiern\",\"source\":\"celebrar\"},{\"target\":\"die Einladung\",\"source\":\"la invitación\"},{\"target\":\"das Geschenk\",\"source\":\"el regalo\"},{\"target\":\"der Gast\",\"source\":\"el invitado\"},{\"target\":\"die Überraschung\",\"source\":\"la sorpresa\"}],\"targetSeconds\":25,\"itemIds\":[\"a2m9feiern\",\"a2m9einladung\",\"a2m4geschenk\",\"a2m9gast\",\"a2m9ueberraschung\"],\"tip\":\"Nada nuevo aquí: solo velocidad sobre lo que ya está consolidado. Esta hebra es la que rompe el estancamiento.\"},{\"id\":\"b1m7l9e9\",\"type\":\"build\",\"prompt\":\"Construye la frase final de Sofía (frase 9)\",\"target\":\"Im kommenden Jahr komme ich wieder\",\"translation\":\"El año que viene vuelvo\",\"distractors\":[\"kommend\",\"ich komme\"],\"itemIds\":[\"b1m7fekommend\"],\"tip\":\"Complemento de tiempo en posición 1 → verbo en 2ª → sujeto en 3ª. Y el participio declinado según el caso: in + Dativ neutro → im kommenden Jahr.\"},{\"id\":\"b1m7l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · megafonía en Basilea, la noche de la Fasnacht. Afirmación primero, DOS escuchas: Richtig o Falsch.\",\"audio\":\"Achtung, eine Durchsage: Wegen der Fasnacht fährt das Tram Nummer acht ab zwanzig Uhr nicht bis zum Bahnhof, sondern nur bis zum Barfüsserplatz. Von dort fährt alle zehn Minuten ein Ersatzbus. Und wer mit dem Velo unterwegs ist: Die Innenstadt ist ab Mitternacht komplett gesperrt. Wir danken für Ihr Verständnis.\",\"question\":\"Das Tram Nummer acht fährt am Abend nicht bis zum Bahnhof.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El aviso lo dice con todas las letras: «nicht bis zum Bahnhof, sondern nur bis zum Barfüsserplatz»\"],\"itemIds\":[\"b1m7fefasnacht\",\"b1m7fevelo\"],\"tip\":\"«nicht A, sondern B» reparte la información en dos mitades y el examen pregunta por la segunda. Y ojo al detalle suizo: allí es «das Tram» (en Alemania, «die Tram») y «Barfüsserplatz» se escribe con ss, porque en Suiza no existe la ß.\"},{\"id\":\"b1m7l9e13\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la frase del aviso\",\"text\":\"Von dort fährt alle zehn Minuten ein Ersatzbus.\",\"translation\":\"Desde allí sale un autobús sustitutorio cada diez minutos.\",\"hints\":[\"Empieza por «Von dort…» — y el verbo, el segundo\",\"Von dort fährt alle zehn Minuten ...\"],\"itemIds\":[\"b1m7fefasnacht\"],\"tip\":\"Un aviso empieza casi siempre por el lugar o la hora, no por el sujeto: eso empuja el verbo a la segunda posición y el sujeto al final. Dictarlo te obliga a oír ese orden, que es el que se te escapa al escribir.\"},{\"id\":\"b1m7l9e10\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 2 — presenta tu tema con las cinco diapositivas del examen. Planifica, habla, y repite la segunda vez sin mirar el andamio.\",\"topic\":\"Feste und Traditionen — braucht man sie heute noch?\",\"slides\":[{\"title\":\"1 · Thema vorstellen\",\"hint\":\"Di de qué vas a hablar y cómo has organizado la presentación: «Ich möchte heute über … sprechen. Zuerst …, danach …, zum Schluss …»\"},{\"title\":\"2 · Meine eigene Erfahrung\",\"hint\":\"Cuenta una fiesta que TÚ hayas vivido: cuándo, con quién, qué pasó. Perfekt o Präteritum, pero elige uno.\"},{\"title\":\"3 · Die Situation in meinem Herkunftsland\",\"hint\":\"Cómo se celebra en tu país: «Bei uns in … feiert man …». Da al menos un ejemplo concreto.\"},{\"title\":\"4 · Vor- und Nachteile + meine Meinung\",\"hint\":\"Einerseits … andererseits …; Meiner Meinung nach …, weil …. Cierra con un ejemplo.\"},{\"title\":\"5 · Abschluss und Dank\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit. Haben Sie Fragen?»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos 4 conectores distintos\",\"Di un ejemplo propio en la diapositiva 3\",\"Usé una vez während, wegen o trotz con genitivo\",\"En la segunda pasada hablé sin mirar las pistas\"],\"model\":\"Diapositiva 2, ejemplo: „Letztes Jahr war ich zum ersten Mal auf einem Adventmarkt in Wien. Wegen des Wetters war es sehr kalt, aber trotz der Kälte sind wir drei Stunden geblieben. Am besten hat mir der Punsch gefallen.“\",\"itemIds\":[\"b1m7fewaehrend\",\"b1m7fewegen\",\"b1m7fetrotz\",\"b1m7fetradition\"],\"tip\":\"Erfüllung del Teil 2 se mide por cuántas diapositivas tratas: las 5 = banda A, una sola = banda D. Vale 40 de los 100 puntos del oral.\"},{\"id\":\"b1m7l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"A pesar del frío hay miles de personas en la calle durante la fiesta\",\"answers\":[\"Trotz der Kälte stehen tausende Menschen während des Festes auf der Straße\",\"Trotz der Kälte stehen tausende Menschen während des Festes auf der Straße.\",\"Trotz der Kälte sind tausende Menschen während des Festes auf der Straße\"],\"hints\":[\"Trotz + genitivo femenino: der Kälte\",\"während des Festes en el medio, auf der Straße al final\"],\"itemIds\":[\"b1m7fetrotz\",\"b1m7fewaehrenddesfestes\",\"b1m7femenge\"],\"tip\":\"Dos genitivos en una frase, uno femenino y otro neutro. Si te salió, el módulo está cerrado.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m7-4\",\"book\":\"Das Fass ist angezapft, das Fest beginnt!\",\"real\":\"O'zapft is!\",\"meaning\":\"«¡Está pinchado!» — el barril está abierto: empieza el Oktoberfest\",\"when\":\"Lo grita el alcalde de Múnich el primer sábado de la Wiesn, al mediodía, cuando abre el primer barril. Fuera de ese contexto se usa en broma, para decir «ya empezamos». En un examen alemán no se escribe bávaro: ahí va la fila de examen, que es la de la prensa.\",\"register\":\"regional\",\"exam\":\"Mit dem Anstich des ersten Fasses ist das Oktoberfest eröffnet.\",\"note\":\"Bávaro puro: «angezapft ist» comido hasta quedar en tres sílabas. No hace falta producirlo, pero sí reconocerlo: sale en todos los telediarios de septiembre.\",\"sound\":\"O-tsapft is\",\"level\":\"b1\",\"itemId\":\"b1m7feoktoberfest\"}}],\"resources\":[{\"label\":\"SRF — Basler Fasnacht (Suiza)\",\"url\":\"https://www.srf.ch/\",\"note\":\"Reportajes en alemán suizo estándar sobre el Morgestraich. Escucha primero sin subtítulos, luego con ellos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — apren
