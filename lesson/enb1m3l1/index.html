03e1. TELL + persona\u003c/b\u003e, siempre. \u003ci\u003eHe \u003cb\u003etold me\u003c/b\u003e he was tired.\u003c/i\u003e Nunca \u003ci\u003etold that\u003c/i\u003e a secas: si dices \u003ci\u003etell\u003c/i\u003e, tienes que decir \u003cb\u003ea quién\u003c/b\u003e.\u003cbr/\u003e\u003cb\u003e2. SAY sin persona.\u003c/b\u003e \u003ci\u003eHe \u003cb\u003esaid\u003c/b\u003e he was tired.\u003c/i\u003e Y si quieres meterla, va con \u003cb\u003eto\u003c/b\u003e: \u003ci\u003eHe said \u003cb\u003eto me\u003c/b\u003e…\u003c/i\u003e — pero suena más raro y en el examen no hace falta.\u003cbr/\u003e\u003cb\u003e3. ASK + persona + pregunta o petición.\u003c/b\u003e \u003ci\u003eHe \u003cb\u003easked me\u003c/b\u003e if I was free.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLa frase que este módulo te quita de la boca es \u003cb\u003e«He said me…»\u003c/b\u003e. No existe. Y tampoco existe \u003cb\u003e«He explained me…»\u003c/b\u003e ni \u003cb\u003e«She suggested me…»\u003c/b\u003e: esos dos, como \u003ci\u003emention\u003c/i\u003e, \u003ci\u003edescribe\u003c/i\u003e, \u003ci\u003eannounce\u003c/i\u003e y \u003ci\u003epoint out\u003c/i\u003e, piden \u003cb\u003eto\u003c/b\u003e delante de la persona.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl «that» es opcional\u003c/b\u003e con \u003ci\u003esay\u003c/i\u003e y \u003ci\u003etell\u003c/i\u003e, y en el habla desaparece casi siempre: \u003ci\u003eHe told me (that) he was late\u003c/i\u003e. En el Writing es mejor ponerlo: ordena la frase."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m3l1\",\"phaseId\":\"enb1m3\",\"title\":\"Say, tell, ask\",\"subtitle\":\"Tres verbos de decir, tres construcciones — y el recado que hay que pasar\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Decir, contar, preguntar\",\"itemIds\":[\"enb1m3hesaidhewastired\",\"enb1m3toldmethat\",\"enb1m3askedme\",\"enb1m3leaveamessage\",\"enb1m3takeamessage\",\"enb1m3passonthemessage\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el español dice «me dijo» de tres maneras distintas\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés — mal\",\"Inglés — bien\"],[\"Me dijo que estaba cansado\",\"He said me that…\",\"He told me / He said (that)…\"],[\"Me explicó el contrato\",\"He explained me…\",\"He explained the contract to me\"],[\"Me sugirió otra zona\",\"She suggested me…\",\"She suggested another area (to me)\"],[\"Me preguntó si estaba libre\",\"He asked to me if…\",\"He asked me if I was free\"],[\"Me lo mencionó ayer\",\"He mentioned me it…\",\"He mentioned it to me yesterday\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m3l1e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del recado\",\"pairs\":[{\"target\":\"Can I leave a message?\",\"source\":\"¿Puedo dejar un recado?\"},{\"target\":\"Shall I take a message?\",\"source\":\"¿Quiere dejarle un recado?\"},{\"target\":\"Could you pass the message on to Amy?\",\"source\":\"¿Puedes darle el recado a Amy?\"},{\"target\":\"I'll get back to you tomorrow.\",\"source\":\"Te digo algo mañana.\"}],\"itemIds\":[\"enb1m3leaveamessage\",\"enb1m3takeamessage\",\"enb1m3passonthemessage\",\"enb1m3getbacktoyou\"],\"tip\":\"«Shall I take a message?» lo dice quien COGE el teléfono; «Can I leave a message?», quien llama. Las dos son fórmulas fijas: se aprenden enteras, no palabra a palabra.\"},{\"id\":\"enb1m3l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — los verbos de decir del módulo 1, ahora a velocidad\",\"pairs\":[{\"target\":\"Tell me what happened.\",\"source\":\"Cuéntame qué ha pasado.\"},{\"target\":\"She said that the rent was too high.\",\"source\":\"Dijo que el alquiler era demasiado alto.\"},{\"target\":\"Please explain the contract to me.\",\"source\":\"Explícame el contrato, por favor.\"},{\"target\":\"She suggested a cheaper area.\",\"source\":\"Me sugirió una zona más barata.\"},{\"target\":\"She told me about the flat.\",\"source\":\"Me habló del piso.\"}],\"targetSeconds\":24,\"itemIds\":[\"enb1m1tellme\",\"enb1m1saidthat\",\"enb1m1explainto\",\"enb1m1suggest\",\"enb1m1toldmeabout\"],\"tip\":\"Todo esto ya lo diste en el módulo 1. Aquí no se trata de aprenderlo otra vez: se trata de sacarlo sin pensar, que es lo que separa hablar de traducir.\"},{\"id\":\"enb1m3l1e3\",\"type\":\"mc\",\"prompt\":\"El verbo y su construcción\",\"question\":\"«Me dijo que estaba cansado» →\",\"options\":[\"He told me he was tired.\",\"He said me he was tired.\",\"He told he was tired.\"],\"answer\":0,\"whyWrong\":[null,\"«say» no admite la persona pegada: o va sin ella, o va con «to me».\",\"«tell» exige decir a quién: sin persona, la frase queda coja.\"],\"itemIds\":[\"enb1m3hesaidhewastired\",\"enb1m3toldmethat\"],\"tip\":\"Regla de bolsillo: TELL siempre con persona, SAY siempre sin ella. Si te sale «said me», cámbialo por «told me» y aciertas el 100 % de las veces.\"},{\"id\":\"enb1m3l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"He said me that he was tired.\",\"answers\":[\"He told me that he was tired.\"],\"why\":\"«say» no lleva la persona pegada. Con persona se usa «tell»: he told me. (La otra salida sería «He said to me that…», correcta pero rara.)\",\"translation\":\"Me dijo que estaba cansado.\",\"itemIds\":[\"enb1m3hesaidhewastired\"]},{\"id\":\"enb1m3l1e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"She told that she was busy.\",\"answers\":[\"She told me that she was busy.\"],\"why\":\"El error contrario: «tell» EXIGE la persona. O dices a quién («told me», «told Sam»), o cambias el verbo por «said».\",\"translation\":\"Me dijo que estaba ocupada.\",\"itemIds\":[\"enb1m3toldmethat\",\"enbusy\"]},{\"id\":\"enb1m3l1e6\",\"type\":\"bucket\",\"prompt\":\"¿La persona va pegada al verbo o detrás de «to»?\",\"categories\":[\"Persona pegada: tell me\",\"Persona con to: say to me\"],\"items\":[{\"text\":\"tell me\",\"bucket\":0},{\"text\":\"explain to me\",\"bucket\":1},{\"text\":\"ask me\",\"bucket\":0},{\"text\":\"say to me\",\"bucket\":1},{\"text\":\"warn me\",\"bucket\":0},{\"text\":\"suggest to me\",\"bucket\":1},{\"text\":\"mention it to me\",\"bucket\":1},{\"text\":\"remind me\",\"bucket\":0}],\"itemIds\":[\"enb1m3toldmethat\",\"enb1m1explainto\",\"enb1m1suggest\",\"enb1m3mentioned\"],\"tip\":\"La lista de la derecha es cerrada y corta: say, explain, suggest, mention, describe, recommend, announce, point out. Todo lo demás va a la izquierda. Apréndete la corta.\"},{\"id\":\"enb1m3l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de decir\",\"text\":\"She ___ me she was busy until six.\",\"answers\":[\"told\"],\"translation\":\"Me dijo que estaba ocupada hasta las seis.\",\"hints\":[\"Hay una persona («me») pegada al verbo\",\"El pasado de tell\"],\"itemIds\":[\"enb1m3toldmethat\"],\"tip\":\"Con «me» delante solo cabe «told». «said me» no existe en inglés, por muy bien que suene traducido del español.\"},{\"id\":\"enb1m3l1e8\",\"type\":\"build\",\"prompt\":\"Construye el recado\",\"target\":\"Could you pass the message on to Amy\",\"translation\":\"¿Puedes darle el recado a Amy?\",\"distractors\":[\"say\",\"for\"],\"itemIds\":[\"enb1m3passonthemessage\",\"enmessage\"],\"tip\":\"«pass on» es un verbo con partícula: se separa cuando el objeto es corto («pass it on») y se puede juntar cuando es largo. Y detrás de la persona va «to», no «for».\"},{\"id\":\"enb1m3l1e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¿Puedo dejar un recado?\",\"answers\":[\"Can I leave a message?\",\"Could I leave a message?\",\"May I leave a message?\"],\"hint\":\"El verbo es «dejar», y el recado es «message»\",\"itemIds\":[\"enb1m3leaveamessage\",\"enmessage\"],\"tip\":\"«recado» y «mensaje» son la misma palabra en inglés: message. Si quieres subir el registro por teléfono, «Could I…?» en vez de «Can I…?».\"},{\"id\":\"enb1m3l1e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"Shall I take a message?\",\"answers\":[\"¿Quiere dejarle un recado?\",\"¿Le doy el recado?\",\"¿Quieres dejar un recado?\"],\"itemIds\":[\"enb1m3takeamessage\"],\"tip\":\"Ojo con el «shall»: aquí no es futuro, es un ofrecimiento («¿le apunto el recado?»). Es de los pocos sitios donde «shall» sigue vivísimo en el inglés británico.\"},{\"id\":\"enb1m3l1e11\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"I'll get back to you tomorrow.\",\"translation\":\"Te digo algo mañana.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I will»\",\"I'll get back ...\"],\"itemIds\":[\"enb1m3getbacktoyou\"],\"tip\":\"«I'll» suena «ail», casi una sola sílaba. Si oyes «I get back», te has comido el futuro — y ese es el ejemplo de Coe: las contracciones no son acento, son gramática que se vuelve inaudible.\"},{\"id\":\"enb1m3l1e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: te dejan un recado en el café. Lee la pregunta ANTES del play. Dos escuchas.\",\"audio\":\"Hiya, it's Sam. Listen, a woman rang for you about half an hour ago — she didn't leave a name, she just said she was from the learning centre. She said the class on Thursday has been moved to the room upstairs, and she asked me to tell you to bring your passport this time. She'll ring back tomorrow anyway.\",\"question\":\"¿Qué te piden que lleves?\",\"options\":[\"El pasaporte\",\"El libro de clase\",\"El recibo del pago\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del libro no se dice nada.\",\"Tampoco: solo se habla de la sala y del pasaporte.\"],\"itemIds\":[\"enb1m3takeamessage\",\"enb1m3askedmetocall\"],\"tip\":\"«she asked me to tell you to…» es una petición referida dentro de otra. En el Listening del examen, ese encadenado es justo lo que se pregunta: quién le pide qué a quién.\"},{\"id\":\"enb1m3l1e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me dijo que estaba ocupada y que te llamaría luego.\",\"answers\":[\"She told me she was busy and that she would call you later\",\"She told me that she was busy and that she would call you later\",\"She said she was busy and that she would call you later\",\"She told me she was busy and she would call you later\"],\"hints\":[\"Con «me» detrás del verbo solo cabe uno de los dos\",\"She told me she was ... and that she would ...\"],\"itemIds\":[\"enb1m3toldmethat\",\"enb1m3shesaidshewouldcall\"],\"tip\":\"Dos cosas en una frase: el verbo que admite persona y el «would» del futuro contado desde el pasado. La segunda la desmontamos entera en la lección siguiente.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m3-1\",\"book\":\"He said he was tired.\",\"real\":\"He was like, 'I'm knackered'.\",\"meaning\":\"Y él va y dice: «estoy reventado»\",\"when\":\"Contando una anécdota entre amigos, y sobre todo entre menores de cuarenta. Es la forma más viva de citar a alguien en el inglés hablado de hoy — pero es SOLO para reconocerla: en el Writing y en el Speaking del examen baja el registro de golpe.\",\"register\":\"jerga\",\"exam\":\"He said (that) he was tired.\",\"note\":\"Aquí la versión del libro y la del examen coinciden, cosa rarísima en estas tarjetas: es que el estilo indirecto normal YA es lo que puntúa. Lo que cambia es la calle. Y ojo al «be like»: no significa «parecerse», significa «y dice/dijo», y lo que viene detrás es la cita literal, no una frase referida.\",\"sound\":\"ji uos̬ laik, aim NÁ-kad\",\"level\":\"b1\",\"itemId\":\"enb1m3natwaslike\"}}],\"resources\":[{\"label\":\"BBC Learning English — Reported speech\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/course/intermediate\",\"note\":\"Busca la unidad de reported speech y hazla entera antes de la lección 2: es la gramática que sostiene el módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
