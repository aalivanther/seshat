n appointment with Dr Ellis, please?\u003c/i\u003e El \u003ci\u003eI want an appointment\u003c/i\u003e suena tan mal como el \u003ci\u003eI want the chicken\u003c/i\u003e de la mesa.\u003cbr/\u003e\u003cb\u003e2. Te preguntan cuándo puedes\u003c/b\u003e: \u003ci\u003eIs Thursday morning OK?\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e3. Entras\u003c/b\u003e: \u003ci\u003eCome in. Sit down, please.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e4. El médico abre\u003c/b\u003e con [[What seems to be the problem?|¿Qué le pasa?]] — es fórmula fija; también oirás \u003ci\u003eWhat's the problem?\u003c/i\u003e y \u003ci\u003eHow can I help?\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e5. Te pregunta desde cuándo\u003c/b\u003e: [[When did it start?|¿Cuándo empezó?]] — pasado simple del módulo 1, con su \u003ci\u003edid\u003c/i\u003e y su verbo desnudo. Se contesta con los marcadores de aquel módulo: \u003ci\u003eTwo days ago.\u003c/i\u003e · \u003ci\u003eLast week.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003e6. Te explora\u003c/b\u003e, y ahí van los imperativos: [[Take a deep breath.|Respire hondo.]] · \u003ci\u003eOpen your mouth.\u003c/i\u003e · \u003ci\u003eDoes it hurt here?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos falsos amigos en esta lección, y los dos caros:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003esurgery\u003c/b\u003e no es «cirugía»: es la consulta o el ambulatorio. (La operación es \u003ci\u003ean operation\u003c/i\u003e.)\u003cbr/\u003e· \u003cb\u003ea prescription\u003c/b\u003e es la receta del médico. \u003ci\u003eA recipe\u003c/i\u003e es la de la tortilla — volveremos a ello en la farmacia."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l4\",\"phaseId\":\"ena2m8\",\"title\":\"I'd like to make an appointment\",\"subtitle\":\"El ambulatorio de principio a fin — y dos falsos amigos por el camino\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"De la recepción a la consulta\",\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"ena2m8thesurgery\",\"ena2m8whatseemstobetheproblem\",\"ena2m8whendiditstart\",\"ena2m8takeadeepbreath\",\"endoctor\",\"ennurse\",\"ena2m5couldihavethemenu\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El guion del ambulatorio, entero\",\"body\":\"$17\",\"table\":[[\"quién habla\",\"lo que dice\"],[\"tú, por teléfono\",\"Hello, I'd like to make an appointment, please.\"],[\"recepción\",\"Of course. Is Thursday morning OK?\"],[\"el médico\",\"Come in, sit down. What seems to be the problem?\"],[\"tú\",\"I don't feel very well. My throat hurts and I have a temperature.\"],[\"el médico\",\"When did it start?\"],[\"tú\",\"Two days ago.\"],[\"el médico\",\"Take a deep breath. It's nothing serious.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l4e1\",\"type\":\"mc\",\"prompt\":\"Llamas al ambulatorio\",\"question\":\"¿Cuál es la versión que puntúa?\",\"options\":[\"I'd like to make an appointment, please.\",\"I want an appointment.\",\"Give me an appointment for Thursday.\"],\"answer\":0,\"whyWrong\":[null,\"want con quien te atiende suena a exigencia, igual que en el restaurante del módulo 5\",\"Imperativo pelado: en inglés eso es una orden, no una petición\"],\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"ena2m5idlikethechicken\"],\"tip\":\"Es la misma escalera del módulo 5, aplicada a otra ventanilla: I'd like… para pedir algo, Could I…? para pedir permiso. No hay que aprender nada nuevo, solo no olvidarla.\"},{\"id\":\"ena2m8l4e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo del edificio\",\"question\":\"Tienes catarro y fiebre. ¿Adónde vas en Reino Unido?\",\"options\":[\"To the surgery.\",\"To the hospital.\",\"To the surgery — es decir, a que me operen.\"],\"answer\":0,\"whyWrong\":[null,\"El hospital es para urgencias e ingresos: con un catarro no se va\",\"surgery aquí NO es cirugía: es el consultorio del médico de cabecera\"],\"itemIds\":[\"ena2m8thesurgery\",\"enhospital\"],\"tip\":\"the surgery = el ambulatorio. La operación es an operation, y quien te la hace es a surgeon. La palabra engaña ella sola.\"},{\"id\":\"ena2m8l4e3\",\"type\":\"build\",\"prompt\":\"Construye la pregunta del médico\",\"target\":\"What seems to be the problem\",\"translation\":\"¿Qué le pasa?\",\"distractors\":[\"happens\",\"matter\"],\"itemIds\":[\"ena2m8whatseemstobetheproblem\"],\"tip\":\"Es una fórmula: no la analices palabra a palabra, apréndetela entera. La vas a oír igual en la consulta, en el banco y en el taller.\"},{\"id\":\"ena2m8l4e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la pregunta del pasado\",\"wrong\":\"When it started to hurt?\",\"answers\":[\"When did it start to hurt?\"],\"why\":\"La pregunta en pasado necesita el auxiliar did, y detrás el verbo se queda desnudo: start, no started. Es la regla del módulo 1, y recae aquí porque la frase es corta y suena bien en español («¿cuándo empezó?»). Sin did, en inglés no hay pregunta.\",\"translation\":\"¿Cuándo empezó a dolerte?\",\"itemIds\":[\"ena2m8whendiditstart\",\"ena2m8itreallyhurts\"]},{\"id\":\"ena2m8l4e5\",\"type\":\"cloze\",\"prompt\":\"Contesta al médico\",\"text\":\"— When did it start? — It started two days ___.\",\"answers\":[\"ago\"],\"translation\":\"— ¿Cuándo empezó? — Empezó hace dos días.\",\"hints\":[\"«Hace dos días» cierra por detrás\",\"a…\"],\"itemIds\":[\"ena2m8whendiditstart\",\"ena2m1twodaysago\"],\"tip\":\"Los marcadores del módulo 1 son justo lo que pide una consulta: two days ago, last week, yesterday morning. Sin ellos, el médico no tiene nada.\"},{\"id\":\"ena2m8l4e6\",\"type\":\"order\",\"prompt\":\"Ordena la visita, de la llamada a la puerta\",\"sentences\":[\"Hello, I'd like to make an appointment, please.\",\"Come in and sit down. What seems to be the problem?\",\"I have a sore throat and a temperature.\",\"When did it start?\",\"Take a deep breath. It's nothing serious.\"],\"translation\":\"Hola, quería pedir cita, por favor. — Pase y siéntese. ¿Qué le pasa? — Me duele la garganta y tengo fiebre. — ¿Cuándo empezó? — Respire hondo. No es nada grave.\",\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"ena2m8whatseemstobetheproblem\",\"ena2m8ihaveasorethroat\",\"ena2m8whendiditstart\",\"ena2m8takeadeepbreath\",\"ena2m8itsnothingserious\"],\"tip\":\"Ese es el guion completo. Si te lo sabes de memoria, la Parte 2 del oral —donde te toca INICIAR la situación— se resuelve sola.\"},{\"id\":\"ena2m8l4e7\",\"type\":\"audiomc\",\"prompt\":\"En la recepción del ambulatorio — 2 escuchas\",\"audio\":\"Good morning, Dr Ellis's surgery. I'm afraid the doctor is very busy today. Could you come on Thursday at half past four? And please bring your list of medicines.\",\"question\":\"¿Qué le dicen a Valeria?\",\"options\":[\"Que venga el jueves por la tarde\",\"Que vaya al hospital\",\"Que llame otra vez mañana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Nadie nombra el hospital: es la consulta de la doctora Ellis\",\"No le piden que llame: le dan una hora concreta\"],\"notepad\":true,\"itemIds\":[\"ena2m8thesurgery\",\"ena2m5imafraidwedonthaveany\",\"enbusy\",\"enthufri\"],\"tip\":\"Otra vez el «I'm afraid» del módulo 5: en cuanto suena, lo que viene detrás es un no o un pero. Y detrás del pero está el dato que te preguntan.\"},{\"id\":\"ena2m8l4e8\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Escucha a la recepcionista\",\"book\":\"What is the problem?\",\"real\":\"What's up, love?\",\"translation\":\"¿Qué le pasa?\",\"ask\":\"meaning\",\"meaningOptions\":[\"¿Qué le pasa?\",\"¿Qué hay ahí arriba?\",\"¿Está usted enamorada?\"],\"itemIds\":[\"ena2m8whatseemstobetheproblem\"],\"tip\":\"«love» aquí no es «amor»: es la coletilla cariñosa que usan en media Inglaterra con cualquiera, sobre todo fuera de Londres. No significa nada personal.\"},{\"id\":\"ena2m8l4e9\",\"type\":\"gapbank\",\"prompt\":\"La conversación entera: rellena con la ficha que toca\",\"text\":\"— Good morning. I'd like to make an ___, please. — What ___ to be the problem? — My back ___ and I can't sleep. — When did it ___?\",\"answers\":[\"appointment\",\"seems\",\"hurts\",\"start\"],\"bank\":[\"appointment\",\"seems\",\"hurts\",\"start\",\"surgery\",\"hospital\",\"finish\"],\"translation\":\"— Buenos días. Quería pedir cita, por favor. — ¿Qué le pasa? — Me duele la espalda y no puedo dormir. — ¿Cuándo empezó?\",\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"ena2m8whatseemstobetheproblem\",\"ena2m8ihurtmyback\",\"ena2m8whendiditstart\"],\"tip\":\"El último hueco es el de siempre: detrás de did, el verbo va desnudo. Si has puesto «started», vuelve al módulo 1 y repasa la lección 8.\"},{\"id\":\"ena2m8l4e10\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"mode\":\"produce\",\"source\":\"Quería pedir cita con la doctora Ellis, por favor.\",\"answers\":[\"I'd like to make an appointment with Dr Ellis, please.\",\"I would like to make an appointment with Dr Ellis, please.\",\"Could I make an appointment with Dr Ellis, please?\"],\"hint\":\"empieza por la fórmula del pedido del módulo 5\",\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"endoctor\"]},{\"id\":\"ena2m8l4e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tú, en la consulta\",\"text\":\"I don't feel very well. My throat hurts and it started two days ago.\",\"phonetic\":\"ái dóunt fíil VE-ri UÉL. mái ZRÓUT jéets and it STAA-tid tuu déis̬ a-GÓU\",\"translation\":\"No me encuentro muy bien. Me duele la garganta y empezó hace dos días.\",\"itemIds\":[\"ena2m8idontfeelwell\",\"ena2m8ihaveasorethroat\",\"ena2m1twodaysago\"],\"tip\":\"Tres datos en dos frases: cómo estás, qué te duele y desde cuándo. Con eso, cualquier médico del mundo ya puede trabajar.\"},{\"id\":\"ena2m8l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quería pedir cita. Me duele la espalda y empezó la semana pasada.\",\"answers\":[\"I'd like to make an appointment. My back hurts and it started last week.\",\"I would like to make an appointment. My back hurts and it started last week.\",\"I'd like to make an appointment, please. My back hurts and it started last week.\"],\"hints\":[\"I'd like + to + verbo · la espalda como sujeto · marcador del módulo 1\",\"I'd like to make an a… My back h… and it started l… week.\"],\"itemIds\":[\"ena2m8idliketomakeanappointment\",\"ena2m8ihurtmyback\",\"ena2m1lastweek\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m8-3\",\"book\":\"I have a stomach ache.\",\"real\":\"I've got a dodgy tummy.\",\"meaning\":\"Tengo la tripa fatal\",\"when\":\"Entre amigos, en casa y en el trabajo, para no dar detalles. Purísimo inglés británico. En la consulta y en el examen, la del libro: «a stomach ache» es lo que entiende el médico y lo que puntúa por escrito.\",\"register\":\"amigos\",\"note\":\"dodgy es «poco fiable, chungo»: sirve para una tripa, un coche y una web. Y tummy es «tripa» en el registro de andar por casa.\",\"sound\":\"áiv got a DO-dchi TA-mi\",\"level\":\"a2\",\"itemId\":\"ena2m8achegroup\"}}],\"resources\":[{\"label\":\"British Council — At the doctor's\",\"url\":\"https://learnenglish.britishcouncil.org/general-english/audio-zone\",\"note\":\"Busca un audio de consulta médica y escúchalo dos veces: la primera, solo para pillar la pregunta del médico; la segunda, para apuntar los síntomas. Así se entrena el Listening del examen.\"},{\"label\":\"NHS — Find a GP surgery\",\"url\":\"https://www.nhs.uk/nhs-services/gps/\",\"note\":\"Cinco minutos por la web real del sistema público británico. Fíjate solo en el vocabulario: surgery, GP, appointment, prescription. Es exactamente el de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_
