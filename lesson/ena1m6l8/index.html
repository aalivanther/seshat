ackets — £20. Cash only!\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: [[corner shop|tienda de barrio (la de la esquina)]] · [[all|todas]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eY al final, tu texto de examen: una \u003cb\u003enota de compra\u003c/b\u003e de dos funciones (informar + pedir) en 30-40 palabras — el formato exacto del Writing del A1.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m6l8e1\",\"type\":\"mc\",\"prompt\":\"El escaparate, dato 1\",\"question\":\"¿Cuándo está cerrada la tienda?\",\"options\":[\"Los domingos\",\"Los sábados\",\"Por las tardes\"],\"answer\":0,\"whyWrong\":[null,\"Open Monday TO Saturday: el sábado sí abre\",\"Abre de 8.00 a 21.00 — las tardes están incluidas\"],\"itemIds\":[\"enclosed\",\"enopen\"],\"tip\":\"En el Reading del examen la respuesta está SIEMPRE escrita en el texto. Vuelve al cartel, no a tu memoria.\"},{\"id\":\"ena1m6l8e2\",\"type\":\"mc\",\"prompt\":\"El escaparate, dato 2\",\"question\":\"«SALE! All jackets — £20» — ¿qué significa?\",\"options\":[\"Todas las chaquetas están rebajadas a £20\",\"Solo una chaqueta cuesta £20\",\"Las chaquetas cuestan desde £20\"],\"answer\":0,\"whyWrong\":[null,\"All = todas, no una\",\"El cartel da EL precio, no un precio mínimo\"],\"itemIds\":[\"ensale\",\"enjacket\"]},{\"id\":\"ena1m6l8e3\",\"type\":\"mc\",\"prompt\":\"El cartel de la caja\",\"question\":\"En la puerta ves «CASH ONLY». ¿Qué te avisa?\",\"options\":[\"Solo aceptan efectivo\",\"Solo aceptan tarjeta\",\"Hoy solo hay rebajas\"],\"answer\":0,\"whyWrong\":[null,\"card no aparece por ningún lado — cash es el efectivo\",\"sale no aparece en este cartel\"],\"itemIds\":[\"encash\"],\"tip\":\"Los carteles del examen son así: dos palabras y una consecuencia. Este te salva de llegar a la caja sin billetes.\"},{\"id\":\"ena1m6l8e4\",\"type\":\"order\",\"prompt\":\"Ordena el mensaje de Valeria a Amy\",\"sentences\":[\"Hi Amy! I'm at Mr Patel's shop.\",\"There's a sale — jackets are only twenty pounds!\",\"But
