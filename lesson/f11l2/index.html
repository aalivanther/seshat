ernen\",\"ge + lern + t\"],\"itemIds\":[\"gelernt\",\"lernen\"]},{\"id\":\"f11l2e5\",\"type\":\"build\",\"prompt\":\"Construye con la pinza\",\"target\":\"Ich habe Fußball gespielt\",\"translation\":\"Jugué al fútbol\",\"distractors\":[\"spiele\",\"bin\"],\"itemIds\":[\"ichhabefussball\",\"gespielt\"],\"tip\":\"habe en 2ª posición, gespielt AL FINAL — nunca «Ich habe gespielt Fußball».\"},{\"id\":\"f11l2e6\",\"type\":\"build\",\"prompt\":\"Construye la pregunta\",\"target\":\"Was hast du gestern gemacht?\",\"translation\":\"¿Qué hiciste ayer?\",\"distractors\":[\"machst\",\"gemachen\"],\"itemIds\":[\"washastdugemacht\",\"gemacht\",\"gestern\"],\"tip\":\"«gemachen» no existe: los regulares acaban en -t. La pinza: hast ... gemacht.\"},{\"id\":\"f11l2e7\",\"type\":\"cloze\",\"prompt\":\"Completa — ojo con la terminación\",\"text\":\"Ich habe viel ___. (trabajado)\",\"answers\":[\"gearbeitet\"],\"translation\":\"Trabajé mucho.\",\"hints\":[\"La raíz arbeit- acaba en t\",\"Por eso: ge + arbeit + et\"],\"itemIds\":[\"gearbeitet\"],\"tip\":\"Raíz en -t → Partizip en -et: gearbeitet. Si no, no podrías pronunciar la t final.\"},{\"id\":\"f11l2e8\",\"type\":\"build\",\"prompt\":\"Construye — cocinar en pasado\",\"target\":\"Ich habe für meine Familie gekocht\",\"translation\":\"Cociné para mi familia\",\"distractors\":[\"koche\",\"gekochen\"],\"itemIds\":[\"gekocht\",\"kochen\",\"familie\"],\"tip\":\"gekocht, con -t: es regular. «für meine Familie» queda dentro de la pinza.\"},{\"id\":\"f11l2e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich habe gestern gearbeitet\",\"translation\":\"Ayer trabajé\",\"hints\":[\"La pinza: habe ... gearbeitet\",\"gestern queda en medio\"],\"itemIds\":[\"gearbeitet\",\"gestern\"]},{\"id\":\"f11l2e10\",\"type\":\"type\",\"prompt\":\"Traduce\",\"question\":\"Compré pan\",\"answers\":[\"Ich habe Brot gekauft\"],\"hints\":[\"habe + Brot + Partizip de kaufen al final\",\"ge + kauf + t\"],\"itemIds\":[\"gekauft\",\"brot\"]},{
