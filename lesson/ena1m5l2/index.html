ón del examen: pedido, Anything else?, cierre. Reconócela entera y ya juegas en casa.\"},{\"id\":\"ena1m5l2e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Me pones un té y una tarta, por favor?\",\"answers\":[\"Can I have a tea and a cake, please?\",\"Can I have a tea and a cake, please\",\"Can I have a tea and a cake please\"],\"hints\":[\"El chunk de pedir + dos cosas con and\",\"Can I have a tea and ...\"],\"itemIds\":[\"entea\",\"encake\",\"encanihaveacoffee\"],\"tip\":\"El pedido de Amy en el cuento del sábado, escrito por ti antes de leerlo: así se siembra una historia.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena1m5-1\",\"book\":\"Here is your coffee.\",\"real\":\"Here you go!\",\"meaning\":\"«Aquí tienes» — al entregarte algo.\",\"when\":\"Lo dice quien te DA algo: el café, el cambio, una bolsa. Lo oirás en todas las cafeterías y tiendas de Londres. Tú no necesitas decirlo: responde con thank you y listo.\",\"register\":\"neutral\",\"note\":\"También oirás «There you go» — es exactamente lo mismo.\",\"sound\":\"JÍA yu góu\",\"level\":\"a1\"}}],\"resources\":[{\"label\":\"British Council — A1 Listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a1-listening\",\"note\":\"Busca los audios de café y restaurante: pedidos reales al nivel de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"d
