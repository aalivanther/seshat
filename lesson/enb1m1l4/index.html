nicipal. Lo paga \u003cb\u003equien vive\u003c/b\u003e en la casa, no el dueño, y los estudiantes a tiempo completo están exentos. En un anuncio, «bills included» no siempre lo incluye: \u003cb\u003ehay que preguntarlo\u003c/b\u003e.\u003cbr/\u003e\u003cb\u003ethe [[deposit|fianza]]\u003c/b\u003e — por ley, como máximo \u003cb\u003ecinco semanas\u003c/b\u003e de alquiler, y va a un sistema de custodia oficial, no al bolsillo del casero.\u003cbr/\u003e\u003cbr/\u003eY las siglas: \u003cb\u003epcm\u003c/b\u003e = per calendar month · \u003cb\u003epw\u003c/b\u003e = per week · \u003cb\u003eNS\u003c/b\u003e = \u003ci\u003enon-smoker\u003c/i\u003e, no fumadores · \u003cb\u003een suite\u003c/b\u003e = con baño propio · \u003cb\u003estudio\u003c/b\u003e = un solo espacio.\u003cbr/\u003e\u003cbr/\u003eY una que conviene saber leer aunque no la vayas a escribir nunca: \u003cb\u003e«No DSS»\u003c/b\u003e. DSS son las siglas del antiguo \u003ci\u003eDepartment of Social Security\u003c/i\u003e, y en un anuncio significa \u003cb\u003e«no acepto inquilinos que cobren ayudas»\u003c/b\u003e. No es una condición del piso: es un filtro contra personas. Los tribunales británicos la han declarado \u003cb\u003ediscriminación ilegal\u003c/b\u003e, y aun así sigue apareciendo. Si la ves, ya sabes con quién estás hablando.\u003cbr/\u003e\u003cbr/\u003eLa \u003cb\u003e[[viewing|visita]]\u003c/b\u003e dura quince minutos y suele haber cinco personas más esperando en la acera. La decisión se toma esa tarde.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la carta.\u003c/b\u003e La Tarea 1 del Writing es exactamente esto: reaccionas a un texto público —un anuncio, un cartel, un folleto— y escribes a un lector formal, cumpliendo \u003cb\u003eun número contado de puntos\u003c/b\u003e. Si te dejas uno fuera, la nota de \u003ci\u003eTask fulfilment\u003c/i\u003e se cae antes de que nadie mire tu gramática."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l4\",\"phaseId\":\"enb1m1\",\"title\":\"The flat hunt\",\"subtitle\":\"Descifrar un anuncio británico y escribirle a la casera\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario que decide si el piso es caro\",\"itemIds\":[\"enb1m1landlord\",\"enb1m1rent\",\"enb1m1deposit\",\"enb1m1billsincluded\",\"enb1m1counciltax\",\"enb1m1viewing\",\"enb1m1estateagent\",\"enb1m1damp\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: la aritmética del alquiler británico\",\"body\":\"$17\",\"table\":[[\"En el anuncio\",\"Qué significa\",\"Lo que pagas de verdad\"],[\"£160 pw\",\"por semana\",\"160 × 52 ÷ 12 = £693 al mes\"],[\"£700 pcm\",\"por mes de calendario\",\"£700\"],[\"bills included\",\"luz, agua, internet\",\"pregunta si el council tax entra\"],[\"deposit: 5 weeks\",\"fianza legal máxima\",\"£800 aprox.\"],[\"en suite / NS\",\"baño propio / no fumadores\",\"—\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del anuncio\",\"pairs\":[{\"target\":\"the rent\",\"source\":\"el alquiler mensual o semanal\"},{\"target\":\"the deposit\",\"source\":\"la fianza que dejas al entrar\"},{\"target\":\"bills included\",\"source\":\"gastos incluidos\"},{\"target\":\"council tax\",\"source\":\"el impuesto municipal\"},{\"target\":\"a viewing\",\"source\":\"la visita para ver el piso\"}],\"itemIds\":[\"enb1m1rent\",\"enb1m1deposit\",\"enb1m1billsincluded\",\"enb1m1counciltax\",\"enb1m1viewing\"]},{\"id\":\"enb1m1l4e2\",\"type\":\"mc\",\"prompt\":\"Haz la cuenta\",\"question\":\"«Room in shared house, £150 pw, bills included.» ¿Cuánto es al mes?\",\"options\":[\"£600\",\"£650\",\"£1,800\"],\"answer\":1,\"whyWrong\":[\"Eso es multiplicar por cuatro. El año tiene 52 semanas, no 48.\",null,\"Eso sería por trimestre: 150 × 52 ÷ 12 = 650.\"],\"itemIds\":[\"enb1m1rent\",\"enb1m1billsincluded\"],\"tip\":\"150 × 52 ÷ 12 = 650. La diferencia con «×4» son 50 £ al mes, que es justo lo que separa un piso que te puedes permitir de uno que no.\"},{\"id\":\"enb1m1l4e3\",\"type\":\"bucket\",\"prompt\":\"¿Va incluido en «bills included» o se paga aparte?\",\"categories\":[\"bills — normalmente incluido\",\"aparte — hay que preguntarlo\"],\"items\":[{\"text\":\"electricity\",\"bucket\":0},{\"text\":\"water\",\"bucket\":0},{\"text\":\"the internet\",\"bucket\":0},{\"text\":\"council tax\",\"bucket\":1},{\"text\":\"the deposit\",\"bucket\":1},{\"text\":\"contents insurance\",\"bucket\":1}],\"itemIds\":[\"enb1m1billsincluded\",\"enb1m1counciltax\",\"enb1m1deposit\"],\"tip\":\"El council tax es el que más disgustos da: mucha gente lo da por incluido y son 100-150 £ al mes por casa. Pregúntalo SIEMPRE por escrito.\"},{\"id\":\"enb1m1l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra que falta\",\"text\":\"The ___ is five weeks' rent, and you get it back when you move out.\",\"answers\":[\"deposit\"],\"translation\":\"La fianza son cinco semanas de alquiler, y te la devuelven al marcharte.\",\"hints\":[\"El dinero que dejas en depósito\",\"de-po-sit\"],\"itemIds\":[\"enb1m1deposit\"]},{\"id\":\"enb1m1l4e5\",\"type\":\"mc\",\"prompt\":\"Falso amigo del nivel\",\"question\":\"El casero dice: «The room is a bit damp in winter.» ¿Qué te está diciendo?\",\"options\":[\"Que hay humedad en las paredes\",\"Que hace un poco de frío\",\"Que es un poco oscuro\"],\"answer\":0,\"whyWrong\":[null,\"«frío» sería cold. Damp es agua en la pared, y sale más cara que el frío.\",\"«oscuro» sería dark.\"],\"itemIds\":[\"enb1m1damp\"],\"tip\":\"«damp» es la palabra que hay que oír en una viewing. Si aparece, mira detrás de los armarios y haz fotos el día que entres.\"},{\"id\":\"enb1m1l4e6\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"¿Está incluido el impuesto municipal?\",\"answers\":[\"Is the council tax included?\",\"Is council tax included?\",\"Does that include the council tax?\"],\"hint\":\"Empieza por el verbo «ser» en pregunta\",\"itemIds\":[\"enb1m1counciltax\",\"enb1m1billsincluded\"],\"tip\":\"Esta pregunta, hecha por escrito antes de firmar, vale más que cualquier ejercicio de este módulo.\"},{\"id\":\"enb1m1l4e7\",\"type\":\"build\",\"prompt\":\"Construye la pregunta de la visita\",\"target\":\"Could I come for a viewing on Thursday\",\"translation\":\"¿Podría ir a ver el piso el jueves?\",\"distractors\":[\"want\",\"must\"],\"itemIds\":[\"enb1m1viewing\"],\"tip\":\"En inglés el registro no es un pronombre: es la forma de la petición. «I want to see the flat» y «Could I come for a viewing?» dicen lo mismo y suenan a dos personas distintas.\"},{\"id\":\"enb1m1l4e8\",\"type\":\"bucket\",\"prompt\":\"¿Directo o educado? La escalera de registro del inglés\",\"categories\":[\"directo — con amigos\",\"educado — a la casera o a la agencia\"],\"items\":[{\"text\":\"Send me the contract.\",\"bucket\":0},{\"text\":\"Could you send me the contract, please?\",\"bucket\":1},{\"text\":\"I want to see the room.\",\"bucket\":0},{\"text\":\"I would like to see the room.\",\"bucket\":1},{\"text\":\"When can I move in?\",\"bucket\":0},{\"text\":\"I was wondering when I could move in.\",\"bucket\":1}],\"itemIds\":[\"enb1m1viewing\",\"enb1m1estateagent\"],\"tip\":\"En alemán el registro se juega en du/Sie. En inglés no existe ese par: se juega aquí, en cómo envuelves la petición. Nadie te va a corregir por ello — simplemente no te contestan.\"},{\"id\":\"enb1m1l4e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el anuncio del periódico\",\"text\":\"Double room in a ___ house near the park. £160 ___, bills ___. Non-smokers only. ___ this week.\",\"answers\":[\"shared\",\"pw\",\"included\",\"Viewings\"],\"bank\":[\"shared\",\"pw\",\"included\",\"Viewings\",\"pcm\",\"empty\",\"Deposits\"],\"translation\":\"Habitación doble en casa compartida cerca del parque. 160 £ por semana, gastos incluidos. Solo no fumadores. Visitas esta semana.\",\"itemIds\":[\"enb1m1sharedhouse\",\"enb1m1rent\",\"enb1m1billsincluded\",\"enb1m1viewing\"],\"tip\":\"Cuatro huecos que son cuatro decisiones de dinero. «pw» y «pcm» en el mismo banco a propósito: distinguirlos vale 50 £ al mes.\"},{\"id\":\"enb1m1l4e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el anuncio, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Antes de instalarse en el piso donde vive ahora con Amy, Valeria vio este anuncio en el periódico del barrio y escribió a la casera, Mrs Beckett, para interesarse por la habitación. Escribe tú esa carta, la que ella recuerda haber mandado. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Anuncio en el Hackney Gazette\",\"text\":\"ROOM TO LET — Large double room in a shared house near the park. £160 pw, bills included. Non-smokers only. Viewings this week. Please write to Mrs Beckett, 14 Palmer Road.\"},\"bullets\":[\"Di de qué anuncio hablas y dónde lo has visto.\",\"Pregunta al menos una cosa concreta del anuncio (los gastos, el contrato).\",\"Pide una visita y di cuándo puedes ir.\"],\"checks\":[{\"re\":\"(advertis|advert|gazette)\",\"label\":\"Dices de qué anuncio hablas\"},{\"re\":\"\\\\?\",\"label\":\"Preguntas algo concreto del anuncio\"},{\"re\":\"(viewing|see the room|visit)\",\"label\":\"Pides la visita y dices cuándo\"}],\"frame\":[\"Saludo: «Dear Mrs Beckett,» — con coma, y la línea siguiente en minúscula si continúa la frase\",\"Por qué escribes: «I am writing about the double room advertised in…»\",\"Quién eres, en una línea: «I have lived in London for… and I work…»\",\"Punto 2 — tus preguntas: «Could you tell me whether…, and how long…?»\",\"Punto 3 — la visita: «Although I work on…, I am free on… , so I could come for a viewing then.»\",\"Cierre + despedida: «I look forward to hearing from you. Yours sincerely, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"therefore\",\"besides\",\"despite\",\"in spite of\",\"unless\",\"for instance\",\"of course\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Mrs Beckett,\\nI am writing about the double room advertised in the Hackney Gazette. I have lived in London for two years and I work near the park, therefore the house would suit me very well. Could you tell me whether the bills include the council tax, and how long the contract lasts? Although I work on Saturdays, I am free on Thursday evening, so I could come for a viewing then. I look forward to hearing from you.\\nYours sincerely,\\nValeria Soto\",\"itemIds\":[\"enb1m1viewing\",\"enb1m1counciltax\",\"enb1m1although\",\"enb1m1therefore\",\"enb1m1havelivedhere\"],\"tip\":\"Cuenta las palabras antes de darle a comprobar: 70-100. Y fíjate en que el modelo no pide nada con «I want»: en inglés el registro se juega ahí, en la forma de la petición.\"},{\"id\":\"enb1m1l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Podría decirme si los gastos están incluidos?\",\"answers\":[\"Could you tell me whether the bills are included?\",\"Could you tell me if the bills are included?\",\"Could you tell me whether bills are included?\"],\"hints\":[\"Empieza por la fórmula educada de petición\",\"Could you tell me ...\"],\"itemIds\":[\"enb1m1billsincluded\",\"enb1m1tellme\"],\"tip\":\"Y ojo a lo que viene detrás de «tell me»: la pregunta pierde la inversión. No es «tell me are the bills included». Esa batalla la da el módulo 3 entera.\"},{\"id\":\"enb1m1l4e12\",\"type\":\"audiomc\",\"prompt\":\"Listening: la agencia devuelve la llamada. Lee la pregunta antes del play. Dos escuchas.\",\"audio\":\"Hello, is that Valeria? It's Hartley Lettings. Right, so, the room in Palmer Road — the rent is a hundred and sixty a week, and that does include gas, electricity and the internet. What it doesn't include is the council tax, I'm afraid; that's about ninety pounds a month between the three of you. The deposit is five weeks. Mrs Beckett can do a viewing on Thursday at six, if that suits.\",\"question\":\"¿Qué NO está incluido en el alquiler?\",\"options\":[\"La luz y el gas\",\"El impuesto municipal\",\"El internet\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Sí entran: «that does include gas, electricity and the internet».\",null,\"También entra, en la misma lista.\"],\"itemIds\":[\"enb1m1counciltax\",\"enb1m1billsincluded\",\"enb1m1rent\"],\"tip\":\"«What it doesn't include is…» es una estructura de énfasis, y en el examen suele traer LA respuesta. Cuando la oigas, apunta lo que viene detrás.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m1-3\",\"book\":\"It is very expensive.\",\"real\":\"It costs an arm and a leg.\",\"meaning\":\"Cuesta un ojo de la cara\",\"when\":\"Quejándote con amigos o compañeros de trabajo, y sobre precios de verdad —el alquiler, un billete de tren, una boda—, nunca sobre un café. En el Writing formal y en el Reading no aparece: allí el precio se comenta con un adverbio, no con una imagen.\",\"register\":\"amigos\",\"exam\":\"It's rather expensive.\",\"note\":\"El español pone un ojo y el inglés un brazo y una pierna: las dos lenguas pagan con el cuerpo. Ojo con «rather» en la versión de examen — suena a queja contenida, que es justo el tono que puntúa.\",\"sound\":\"it kosts an aam and a leg\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m1natarmandaleg\"}}],\"resources\":[{\"label\":\"SpareRoom — anuncios reales de habitación\",\"url\":\"https://www.spareroom.co.uk/\",\"note\":\"Abre cinco anuncios y busca pw, pcm, bills included y deposit. Es el texto auténtico de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\"
