\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4e7,Lee estas dos frases españolas en voz alta:\u003cbr/\u003e\u003cbr/\u003e«Aquí \u003cb\u003eno tienes que\u003c/b\u003e fumar.» · «\u003cb\u003eNo tienes que\u003c/b\u003e pagar, invita la casa.»\u003cbr/\u003e\u003cbr/\u003eSuenan igual, ¿verdad? Pues dicen cosas opuestas. La primera te está \u003cb\u003eprohibiendo\u003c/b\u003e algo; la segunda te está \u003cb\u003elibrando\u003c/b\u003e de una obligación. El español las escribe idénticas y deja que lo desenrede el contexto. \u003cb\u003eEl inglés no\u003c/b\u003e: tiene una palabra para cada una, y elegir mal cambia el sentido de la frase por completo.\u003cbr/\u003e\u003cbr/\u003e❌ \u003ci\u003eYou don't have to smoke here.\u003c/i\u003e no prohíbe nada. Lo que le estás diciendo a esa persona es «no estás obligada a fumar, pero si te apetece, adelante». En un aviso de un hospital, eso es un problema serio.\u003cbr/\u003e✅ \u003cb\u003eYou mustn't smoke here.\u003c/b\u003e es lo que querías decir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa forma de acordarse\u003c/b\u003e: mira el \u003cb\u003enot\u003c/b\u003e, y pregúntate a qué palabra está negando.\u003cbr/\u003e· En \u003cb\u003emustn't\u003c/b\u003e, el \u003ci\u003enot\u003c/i\u003e niega \u003cb\u003ela acción\u003c/b\u003e: «es obligatorio NO hacerlo». Puerta cerrada.\u003cbr/\u003e· En \u003cb\u003edon't have to\u003c/b\u003e, el \u003ci\u003enot\u003c/i\u003e niega \u003cb\u003ela obligación\u003c/b\u003e: «no es obligatorio hacerlo». Puerta abierta, tú eliges.\u003cbr/\u003e\u003cbr/\u003eY por eso [[It's up to you.|Tú decides.]] es la respuesta natural a \u003ci\u003edon't have to\u003c/i\u003e, y jamás a \u003ci\u003emustn't\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l4\",\"phaseId\":\"ena2m7\",\"title\":\"You don't have to pay\",\"subtitle\":\"Los dos «no tienes que» del español, y por qué en inglés son contrarios\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que no hace falta\",\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7shedoesnthavetowait\",\"ena2m7ididnthavetopay\",\"ena2m7itsuptoyou\",\"ena2m7isitcompulsory\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El error más caro de todo el módulo\",\"body\":\"$17\",\"table\":[[\"\",\"mustn't\",\"don't have to\"],[\"qué hace\",\"PROHÍBE\",\"EXIME\"],[\"quién decide\",\"la norma, no tú\",\"tú\"],[\"en español\",\"no se puede / está prohibido\",\"no hace falta / no es obligatorio\"],[\"ejemplo\",\"You mustn't smoke here.\",\"You don't have to pay.\"],[\"respuesta natural\",\"OK, sorry.\",\"Great, thanks!\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"don't have to: por dentro es un verbo normal\",\"body\":\"Y ahora la parte fácil. Como \u003cb\u003ehave to\u003c/b\u003e es un verbo corriente (lección 1), su negativa se hace con el \u003cb\u003edon't / doesn't\u003c/b\u003e de siempre — y en pasado, con el \u003cb\u003edidn't\u003c/b\u003e del módulo 2. Nada nuevo:\u003cbr/\u003e\u003cbr/\u003e[[You don't have to pay.|No hace falta pagar.]] · [[She doesn't have to wait.|No tiene por qué esperar.]] · [[I didn't have to pay.|No tuve que pagar.]]\u003cbr/\u003e\u003cbr/\u003eOjo a las dos trampas de forma, que son las de siempre:\u003cbr/\u003e· ❌ \u003ci\u003eShe doesn't has to wait\u003c/i\u003e → la -s ya se la llevó \u003cb\u003edoesn't\u003c/b\u003e.\u003cbr/\u003e· ❌ \u003ci\u003eI didn't had to pay\u003c/i\u003e → el pasado ya se lo llevó \u003cb\u003edidn't\u003c/b\u003e. Es exactamente la regla del módulo 1: una marca por frase, y la lleva el auxiliar.\u003cbr/\u003e\u003cbr/\u003eY para preguntar si algo es obligatorio tienes dos formas, las dos buenísimas para una ventanilla: \u003cb\u003eDo I have to…?\u003c/b\u003e y [[Is it compulsory?|¿Es obligatorio?]]\",\"table\":[[\"tiempo\",\"forma\",\"ejemplo\"],[\"presente, yo/tú/nosotros\",\"don't have to\",\"You don't have to pay.\"],[\"presente, él/ella\",\"doesn't have to\",\"She doesn't have to wait.\"],[\"pasado, todos\",\"didn't have to\",\"I didn't have to pay.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l4e1\",\"type\":\"bucket\",\"prompt\":\"¿Esa frase española prohíbe o exime?\",\"categories\":[\"PROHÍBE → mustn't\",\"EXIME → don't have to\"],\"items\":[{\"text\":\"Aquí no se puede fumar.\",\"bucket\":0},{\"text\":\"No hace falta que pagues, invita la casa.\",\"bucket\":1},{\"text\":\"No se puede aparcar delante de la puerta.\",\"bucket\":0},{\"text\":\"No tienes por qué esperar: puedes pedir cita.\",\"bucket\":1},{\"text\":\"No se puede entrar con comida.\",\"bucket\":0},{\"text\":\"No es obligatorio rellenar la última parte.\",\"bucket\":1}],\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\"],\"tip\":\"Truco: si puedes cambiar el español por «no es obligatorio», es don't have to. Si solo cabe «está prohibido», es mustn't.\"},{\"id\":\"ena2m7l4e2\",\"type\":\"mc\",\"prompt\":\"Le has dicho esto a alguien en un hospital: «You don't have to smoke here»\",\"question\":\"¿Qué acabas de decirle exactamente?\",\"options\":[\"Que no está obligado a fumar, pero que puede si quiere\",\"Que está prohibido fumar ahí\",\"Que solo se puede fumar en esa zona\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería You mustn't smoke here — el not de don't have to niega la obligación, no la acción\",\"Tampoco: no hay ningún «solo» en la frase\"],\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7youmustntsmoke\"],\"tip\":\"Este es EL error del módulo. No es un matiz: es decir lo contrario de lo que querías con toda la educación del mundo.\"},{\"id\":\"ena2m7l4e3\",\"type\":\"transform\",\"prompt\":\"El aviso quería PROHIBIR y le ha salido lo contrario\",\"source\":\"You don't have to smoke in here.\",\"instruction\":\"Arréglalo para que prohíba de verdad\",\"answers\":[\"You mustn't smoke in here.\",\"You must not smoke in here.\",\"You can't smoke in here.\"],\"translation\":\"Aquí no se puede fumar.\",\"hints\":[\"No es la negación de la obligación: es la prohibición de la acción\",\"You m…'t smoke in here.\"],\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\"]},{\"id\":\"ena2m7l4e4\",\"type\":\"transform\",\"prompt\":\"Y ahora al revés: la casa invita\",\"source\":\"You mustn't pay.\",\"instruction\":\"Dile que no hace falta pagar\",\"answers\":[\"You don't have to pay.\",\"You do not have to pay.\",\"You don't need to pay.\"],\"translation\":\"No hace falta pagar.\",\"hints\":[\"Aquí no prohíbes nada: le quitas la obligación\",\"You d…'t have to pay.\"],\"itemIds\":[\"ena2m7youdonthavetopay\"],\"tip\":\"Fíjate en lo que acabas de hacer dos veces seguidas: la misma frase española, dos ingleses opuestos. Esa es la lección entera.\"},{\"id\":\"ena2m7l4e5\",\"type\":\"gapbank\",\"prompt\":\"La cola de correos — completa con la forma que toca\",\"text\":\"At the post office you ___ take a ticket and wait for your number. You ___ push in front of other people: it's the one thing nobody here forgives. But if you only want a stamp, you ___ queue at the desk — there's a machine by the door.\",\"answers\":[\"have to\",\"mustn't\",\"don't have to\"],\"bank\":[\"have to\",\"mustn't\",\"don't have to\",\"can't\",\"doesn't have to\",\"has to\"],\"translation\":\"En correos hay que coger número y esperar tu turno. No se puede colar: es lo único que aquí no se perdona. Pero si solo quieres un sello, no hace falta hacer cola en la ventanilla: hay una máquina junto a la puerta.\",\"itemIds\":[\"ena2m7youhavetocheckin\",\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\",\"ena2m7thequeue\",\"enpostoffice\"],\"tip\":\"El tercer hueco es el de la lección: la máquina no te prohíbe hacer cola, te libra de ella.\"},{\"id\":\"ena2m7l4e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la -s de más\",\"wrong\":\"She doesn't has to wait.\",\"answers\":[\"She doesn't have to wait.\"],\"why\":\"doesn't ya se ha llevado la -s de tercera persona, así que detrás vuelve have. Es la misma regla del A1: «Does she work?», nunca «Does she works?».\",\"translation\":\"No tiene por qué esperar.\",\"itemIds\":[\"ena2m7shedoesnthavetowait\"]},{\"id\":\"ena2m7l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el pasado marcado dos veces\",\"wrong\":\"I didn't had to pay.\",\"answers\":[\"I didn't have to pay.\"],\"why\":\"El pasado ya lo lleva didn't; detrás, el verbo va desnudo. Una marca de pasado por frase, que es lo que aprendiste en el módulo 1 y sigue valiendo aquí.\",\"translation\":\"No tuve que pagar.\",\"itemIds\":[\"ena2m7ididnthavetopay\"]},{\"id\":\"ena2m7l4e8\",\"type\":\"cloze\",\"prompt\":\"En la peluquería: te dicen que la primera consulta es gratis\",\"text\":\"You ___ have to pay for the first visit.\",\"answers\":[\"don't\",\"do not\"],\"translation\":\"No hace falta pagar la primera visita.\",\"hints\":[\"No le prohíbes pagar: le quitas la obligación\",\"d…'t\"],\"itemIds\":[\"ena2m7youdonthavetopay\"]},{\"id\":\"ena2m7l4e9\",\"type\":\"audiomc\",\"prompt\":\"En el mostrador del museo — 2 escuchas\",\"audio\":\"You don't have to pay, it's free on Sundays. But you mustn't take photographs inside.\",\"question\":\"¿Qué pasa con las fotos?\",\"options\":[\"Están prohibidas dentro\",\"Son gratis los domingos\",\"Solo se pueden hacer sin flash\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo gratis es la entrada, no las fotos\",\"De flash no dice nada\"],\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7youmustntsmoke\"],\"tip\":\"Las dos frases van seguidas a propósito: una te abre la puerta y la otra te la cierra. Si las oyes como si fueran lo mismo, te pierdes la mitad del mensaje.\"},{\"id\":\"ena2m7l4e10\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"¿Es obligatorio? — No, tú decides.\",\"answers\":[\"Is it compulsory? No, it's up to you.\",\"Is it compulsory? No, it is up to you.\",\"Do I have to? No, it's up to you.\"],\"hint\":\"la pregunta de ventanilla y la respuesta que te deja elegir\",\"itemIds\":[\"ena2m7isitcompulsory\",\"ena2m7itsuptoyou\"]},{\"id\":\"ena2m7l4e11\",\"type\":\"mc\",\"prompt\":\"En el aparcamiento del hospital\",\"question\":\"«Aquí no se puede aparcar»\",\"options\":[\"You mustn't park here.\",\"You don't have to park here.\",\"You haven't to park here.\"],\"answer\":0,\"whyWrong\":[null,\"Eso dice «no estás obligado a aparcar aquí», que no es lo mismo ni de lejos\",\"have to niega con don't, como cualquier verbo normal\"],\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youcantparkhere\",\"enhospital\"]},{\"id\":\"ena2m7l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción — las dos, seguidas\",\"question\":\"No hace falta pagar. Pero no se puede fumar dentro.\",\"answers\":[\"You don't have to pay. But you mustn't smoke inside.\",\"You don't have to pay, but you mustn't smoke inside.\",\"You do not have to pay. But you must not smoke inside.\"],\"hints\":[\"Primero la que exime, después la que prohíbe\",\"You d…'t have to pay. But you m…'t smoke inside.\"],\"itemIds\":[\"ena2m7youdonthavetopay\",\"ena2m7youmustntsmoke\"],\"tip\":\"Si te salen las dos en la misma frase y con la forma correcta cada una, este módulo ya te ha dado lo que tenía que darte.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m7-4\",\"book\":\"You don't have to pay.\",\"real\":\"You don't need to pay.\",\"meaning\":\"No hace falta pagar\",\"when\":\"En cualquier mostrador de Reino Unido: need to es hoy tan corriente como have to y suena un poco más amable, menos a reglamento. Las dos valen en el examen, escrito y oral.\",\"register\":\"neutral\",\"note\":\"Y hay una tercera, más seca, que también oirás: «There's no need». Sirve ella sola de respuesta cuando alguien se ofrece a pagar.\",\"sound\":\"yu dóunt níid tu PÉI\",\"level\":\"a2\",\"itemId\":\"ena2m7youdonthavetopay\"}}],\"resources\":[{\"label\":\"British Council — Obligation and prohibition\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/modals-obligation-prohibition\",\"note\":\"Ahora sí, léela entera. Y haz el ejercicio 2, que es exactamente el contraste de esta lección: mustn't frente a don't have to.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
