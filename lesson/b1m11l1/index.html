\"exercises\",\"exercises\":[{\"id\":\"b1m11l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el tiempo verbal\",\"question\":\"„Ich werde im Ausland arbeiten.“\",\"options\":[\"Trabajo en el extranjero\",\"Voy a trabajar en el extranjero\",\"Trabajé en el extranjero\"],\"answer\":1,\"whyWrong\":[\"Eso sería «Ich arbeite im Ausland» — un solo verbo\",null,\"Eso sería «Ich habe im Ausland gearbeitet»\"],\"itemIds\":[\"b1m11zkimauslandarbeiten\",\"b1m11zkausland\"],\"tip\":\"werde (2ª posición) + arbeiten (al final): la pinza del Futur I.\"},{\"id\":\"b1m11l1e2\",\"type\":\"match\",\"prompt\":\"Empareja los planes\",\"pairs\":[{\"target\":\"Ich werde im Ausland arbeiten\",\"source\":\"Voy a trabajar en el extranjero\"},{\"target\":\"in Zukunft\",\"source\":\"en el futuro / de aquí en adelante\"},{\"target\":\"etwas vorhaben\",\"source\":\"tener algo planeado\"},{\"target\":\"die Absicht\",\"source\":\"la intención\"},{\"target\":\"voraussichtlich\",\"source\":\"previsiblemente\"}],\"itemIds\":[\"b1m11zkimauslandarbeiten\",\"b1m11zkinzukunft\",\"b1m11zkvorhaben\",\"b1m11zkabsicht\",\"b1m8gevoraussichtlich\"]},{\"id\":\"b1m11l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el Futur I\",\"text\":\"Nächstes Jahr ___ ich im Ausland arbeiten.\",\"answers\":[\"werde\"],\"translation\":\"El año que viene voy a trabajar en el extranjero.\",\"hints\":[\"El sujeto es ich\",\"werd- + e\"],\"itemIds\":[\"b1m11zkimauslandarbeiten\"]},{\"id\":\"b1m11l1e4\",\"type\":\"build\",\"prompt\":\"Construye el plan\",\"target\":\"Ich werde im Ausland arbeiten\",\"altTargets\":[\"Im Ausland werde ich arbeiten\"],\"translation\":\"Voy a trabajar en el extranjero\",\"distractors\":[\"arbeite\",\"bin\"],\"itemIds\":[\"b1m11zkimauslandarbeiten\",\"b1m11zkausland\"],\"tip\":\"El infinitivo cierra la frase. Si lo pones antes del complemento, suena a traducción del español.\"},{\"id\":\"b1m11l1e5\",\"type\":\"gapbank\",\"prompt\":\"Completa con la forma de werden que toca\",\"text\":\"Ich ___ nächsten Sommer nach Zürich ziehen. Du ___ mich sicher besuchen, oder? Meine Schwester ___ voraussichtlich in Madrid bleiben.\",\"answers\":[\"werde\",\"wirst\",\"wird\"],\"bank\":[\"werde\",\"wirst\",\"wird\",\"werden\",\"werdet\",\"wurde\"],\"translation\":\"El próximo verano me mudaré a Zúrich. Tú me visitarás seguro, ¿no? Mi hermana previsiblemente se quedará en Madrid.\",\"itemIds\":[\"b1m8gevoraussichtlich\"],\"tip\":\"werden es irregular en du/er: wirst, wird. El resto es regular.\"},{\"id\":\"b1m11l1e6\",\"type\":\"mc\",\"prompt\":\"¿Presente o Futur I? El matiz del nivel\",\"question\":\"Tu vuelo está comprado y sales el lunes. ¿Qué dice un alemán?\",\"options\":[\"Am Montag fliege ich nach Wien.\",\"Vielleicht werde ich am Montag nach Wien fliegen.\",\"Am Montag bin ich nach Wien geflogen.\"],\"answer\":0,\"whyWrong\":[null,\"El Futur I con «vielleicht» suena a plan inseguro, y tu vuelo ya está comprado\",\"Eso es pasado\"],\"itemIds\":[\"b1m8gevoraussichtlich\"],\"tip\":\"Futuro seguro y con fecha = PRESENTE. El Futur I se guarda para promesas, predicciones y planes en el aire.\"},{\"id\":\"b1m11l1e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco del español\",\"wrong\":\"Ich werde arbeiten im Ausland.\",\"answers\":[\"Ich werde im Ausland arbeiten.\",\"Ich werde im Ausland arbeiten\"],\"why\":\"El español pega el infinitivo al verbo conjugado («voy a trabajar en el extranjero»); el alemán lo manda AL FINAL: werde ... arbeiten, con todo lo demás en medio.\",\"translation\":\"Voy a trabajar en el extranjero.\",\"itemIds\":[\"b1m11zkimauslandarbeiten\"]},{\"id\":\"b1m11l1e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el plan\",\"text\":\"Sobald ich fertig bin, rufe ich dich an.\",\"translation\":\"En cuanto termine, te llamo.\",\"hints\":[\"Empieza con el conector sobald\",\"Sobald ich fertig ___, rufe ich ...\"],\"itemIds\":[\"b1m11zksobald\"],\"tip\":\"sobald manda el verbo al final (bin) y, tras la coma, el verbo principal abre la segunda parte (rufe).\"},{\"id\":\"b1m11l1e9\",\"type\":\"transform\",\"prompt\":\"Pásalo a Futur I\",\"source\":\"Ich lerne Deutsch.\",\"instruction\":\"Ponla en Futur I (werden + Infinitiv)\",\"answers\":[\"Ich werde Deutsch lernen.\",\"Ich werde Deutsch lernen\"],\"translation\":\"Voy a estudiar alemán.\",\"hints\":[\"werde en 2ª posición\",\"lernen se va al final\"],\"itemIds\":[\"b1m11zkinzukunft\"]},{\"id\":\"b1m11l1e10\",\"type\":\"speak\",\"prompt\":\"Léelo en voz alta — la melodía del plan\",\"text\":\"In Zukunft werde ich mehr Deutsch sprechen.\",\"phonetic\":\"in TSUU-kunft VEA-de ij mea doich SHPRE-jen (z = ts; sp = schp)\",\"translation\":\"En el futuro voy a hablar más alemán.\",\"itemIds\":[\"b1m11zkinzukunft\"]},{\"id\":\"b1m11l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Tengo la intención de trabajar en el extranjero\",\"answers\":[\"Ich habe die Absicht, im Ausland zu arbeiten\",\"Ich habe die Absicht, im Ausland zu arbeiten.\",\"Ich habe vor, im Ausland zu arbeiten\"],\"hints\":[\"die Absicht haben, ... zu + Infinitiv\",\"Ich habe die Absicht, im Ausland ___ arbeiten\"],\"itemIds\":[\"b1m11zkabsicht\",\"b1m11zkvorhaben\",\"b1m11zkausland\"],\"tip\":\"«die Absicht haben, ... zu ...» es el registro escrito de «ich will». En el Schreiben del examen vale oro.\"}]}],\"resources\":[{\"label\":\"Deutsche Welle — Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca los capítulos sobre planes y trabajo: el Futur I aparece justo donde lo esperas.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.j
