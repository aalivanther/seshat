e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y cómo se distingue de «ahora mismo»?\u003c/b\u003e Por lo que hay alrededor. Si hay una \u003cb\u003ehora o una fecha futura\u003c/b\u003e —\u003ci\u003eat six\u003c/i\u003e, \u003ci\u003eon Friday\u003c/i\u003e, \u003ci\u003etonight\u003c/i\u003e, \u003ci\u003enext weekend\u003c/i\u003e—, es un plan. Si hay \u003ci\u003enow\u003c/i\u003e, \u003ci\u003eright now\u003c/i\u003e o \u003ci\u003eat the moment\u003c/i\u003e, es lo de este segundo. Nunca hay confusión de verdad, porque nadie dice «estoy quedando con Amy a las seis» de ahora mismo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y entonces going to y el continuo hacen lo mismo?\u003c/b\u003e Casi. La diferencia es de grado y es fácil de recordar:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003egoing to\u003c/b\u003e = lo he decidido. \u003ci\u003eI'm going to book a hotel.\u003c/i\u003e (aún no lo he reservado)\u003cbr/\u003e· \u003cb\u003econtinuo\u003c/b\u003e = está apalabrado, con hora y sitio, y hay otra gente metida. \u003ci\u003eWe're meeting Amy at six.\u003c/i\u003e (Amy ya lo sabe)\u003cbr/\u003e\u003cbr/\u003eEn el examen las dos puntúan casi siempre igual. Pero para las citas —el 90 % de lo que vas a contar— el continuo es lo que suena a nativo.18:T602,"])</script><script>self.__next_f.push([1,"Este es el error más caro de la lección, y el más difícil de ver, porque \u003cb\u003een español la frase es impecable\u003c/b\u003e: «mañana \u003cb\u003evoy\u003c/b\u003e al cine», «el viernes \u003cb\u003esalgo\u003c/b\u003e a las diez», «la semana que viene \u003cb\u003etrabajo\u003c/b\u003e en Brighton». El español usa el presente para los planes sin ningún problema.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl inglés no.\u003c/b\u003e En inglés el presente simple significa \u003cb\u003erutina\u003c/b\u003e —lo que haces siempre— y nada más:\u003cbr/\u003e\u003cbr/\u003e· \u003ci\u003eI go to the cinema on Fridays.\u003c/i\u003e = voy al cine todos los viernes. Rutina.\u003cbr/\u003e· \u003cb\u003e❌\u003c/b\u003e \u003ci\u003eI go to the cinema tomorrow.\u003c/i\u003e = no significa nada. Suena a robot.\u003cbr/\u003e· \u003cb\u003e✅\u003c/b\u003e \u003ci\u003eI'\u003cb\u003em going\u003c/b\u003e to the cinema tomorrow.\u003c/i\u003e = mañana voy al cine.\u003cbr/\u003e\u003cbr/\u003eComo nadie te va a decir nada —se te entiende igual— este error se queda contigo hasta el B2 si no lo cazas ahora. La vacuna es de una línea: \u003cb\u003esi en la frase hay una fecha futura, el verbo no puede ir en presente simple\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora la excepción, que es una sola y es honesta:\u003c/b\u003e los \u003cb\u003ehorarios publicados\u003c/b\u003e. Un tren, un avión, un cine, una tienda: eso no es tu plan, es el plan del mundo, y va en presente simple.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003e[[The train leaves at ten.|El tren sale a las diez.]]\u003c/b\u003e · \u003ci\u003e[[The film starts at half past seven.|La película empieza a las siete y media.]]\u003c/i\u003e (esta ya la traías del A1) · \u003ci\u003eThe shop opens at nine.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eRegla para decidir en un segundo: \u003cb\u003e¿lo decides tú, o está en un cartel?\u003c/b\u003e Si lo decides tú, continuo. Si está en un cartel, presente simple."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m6l3\",\"phaseId\":\"ena2m6\",\"title\":\"We're meeting Amy at six\",\"subtitle\":\"La cita que ya está en la agenda — y el error que suena perfecto en español\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que ya está apalabrado\",\"itemIds\":[\"ena2m6weremeetingamyatsix\",\"ena2m6imleavingonfriday\",\"ena2m6imstayingwithemma\",\"ena2m6whatareyoudoingtonight\",\"ena2m6nextweekend\",\"ena2m6thetrainleavesatten\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El continuo también sirve para el futuro (y es lo que más se usa)\",\"body\":\"$17\",\"table\
