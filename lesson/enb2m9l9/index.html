\":\"note\",\"note\":{\"title\":\"El relato de este módulo es corto a propósito\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m9l9e1\",\"type\":\"order\",\"prompt\":\"Ordena el sábado. La circunstancia empaquetada va donde toca\",\"sentences\":[\"Hoping to catch the 9.15, they were on the platform at eight.\",\"There had been a landslide: the service was suspended.\",\"Rather than go home, they took the coach from Carmarthen.\",\"The site was closed for restoration, which proved, in the end, invaluable.\",\"Walking the coast path with Gwen, they saw the estuary with the tide in.\",\"It turned out to be the best day of the year.\"],\"translation\":\"Salieron a por el 9.15, lo suspendieron, eligieron el autocar, el recinto estaba cerrado, el sendero las salvó, y fue el mejor día.\",\"itemIds\":[\"enb2m9hopingtocatch\",\"enb2m9therehadbeen\",\"enb2m9ratherthanwait\",\"enb2m9thesitewasclosed\",\"enb2m9thecoastpath\",\"enb2m9thebestoftheyear\"]},{\"id\":\"enb2m9l9e2\",\"type\":\"audiomc\",\"prompt\":\"Amy y Valeria, en el autocar de vuelta. Pregunta ANTES. Dos escuchas.\",\"plays\":2,\"audio\":\"I still can't believe the priory was shut.|Having come all that way.|Yeah, but walking the coast path with Gwen — I'd rather that than a room full of people taking photos of a ruin.|The tide was in. I thought we were stuck.|She just pointed at the wall. Dry stone. Older than the priory, she said.|And the satnav would never have sent us that way.|On the way back I looked it up. It's a public right of way. It's been there four hundred years.|So the best day of the year was the one that went wrong.|Don't tell Ben. He'll say that's what buses are for.\",\"question\":\"¿Qué opinan, al final, del priorato cerrado?\",\"options\":[\"Que el cierre las mandó al sendero, y eso valió más que la visita.\",\"Que van a reclamar el dinero del autocar.\",\"Que Ben tenía razón y no deberían haber salido de Londres.\"],\"answer\":0,\"whyWrong\":[null,\"Nadie habla de rec
