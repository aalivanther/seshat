ue en el B1 vale puntos de vocabulario y de gramática a la vez.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eif\u003c/b\u003e — la condición normal. \u003ci\u003eIf you lose your boarding pass, go straight to the desk.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eunless\u003c/b\u003e — «a menos que». \u003cb\u003eYa lleva la negación dentro\u003c/b\u003e: \u003ci\u003eunless you book online\u003c/i\u003e = \u003ci\u003eif you don't book online\u003c/i\u003e. Por eso \u003cb\u003e«unless you don't…» es un error doble\u003c/b\u003e y es el fallo típico.\u003cbr/\u003e· \u003cb\u003eas long as\u003c/b\u003e — «siempre que», «mientras». Es una condición \u003cb\u003econ una pizca de aviso\u003c/b\u003e: te dejo, pero con esta condición. \u003ci\u003eYou can take it on board as long as it fits in the frame.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eprovided (that)\u003c/b\u003e — lo mismo que \u003ci\u003eas long as\u003c/i\u003e, pero \u003cb\u003eescrito y formal\u003c/b\u003e. Es la palabra de los folletos, los contratos y las cartas. \u003ci\u003eProvided that you check in online, you don't have to queue.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la cuarta, que no es una condición aunque lo parezca:\u003c/b\u003e \u003cb\u003e\u003ci\u003ein case\u003c/i\u003e\u003c/b\u003e = «por si acaso». No dice que vaya a pasar: dice que te preparas \u003cb\u003eantes\u003c/b\u003e, por si pasa. \u003ci\u003eTake a jumper \u003cb\u003ein case\u003c/b\u003e it gets cold\u003c/i\u003e — el jersey se coge ahora, haga frío o no.\u003cbr/\u003e\u003cbr/\u003eLa diferencia con \u003ci\u003eif\u003c/i\u003e se ve en la película:\u003cbr/\u003e· \u003ci\u003eTake a jumper \u003cb\u003eif\u003c/b\u003e it gets cold.\u003c/i\u003e → primero hace frío, luego coges el jersey. (Poco práctico si ya estás en el avión.)\u003cbr/\u003e· \u003ci\u003eTake a jumper \u003cb\u003ein case\u003c/b\u003e it gets cold.\u003c/i\u003e → coges el jersey ahora, por si eso.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí está la trampa de tiempo verbal otra vez\u003c/b\u003e, la misma de la lección 3: \u003cb\u003edetrás de todas estas conjunciones va PRESENTE, nunca «will»\u003c/b\u003e. \u003ci\u003eas long as it fits\u003c/i\u003e, \u003ci\u003ein case it gets cold\u003c/i\u003e, \u003ci\u003eprovided that you check in\u003c/i\u003e, \u003ci\u003eunless it rains\u003c/i\u003e. El español pone subjuntivo («siempre que quepa», «por si acaso hace frío») y el inglés pone presente. Es una sola regla para las temporales y para las condicionales, y por eso van juntas en este módulo.\u003cbr/\u003e\u003cbr/\u003eUn último detalle que se cobra en el Reading: \u003cb\u003e\u003ci\u003ein case of\u003c/i\u003e no es \u003ci\u003ein case\u003c/i\u003e\u003c/b\u003e. \u003ci\u003eIn case of\u003c/i\u003e + sustantivo es lenguaje de cartel: \u003ci\u003eIn case of fire, use the stairs\u003c/i\u003e. Ahí sí significa «en caso de»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l4\",\"phaseId\":\"enb1m9\",\"title\":\"As long as it fits\",\"subtitle\":\"Cuatro maneras de poner una condición — y «por si acaso», que no es ninguna de ellas\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las condiciones del billete barato\",\"itemIds\":[\"enb1m9aslongas\",\"enb1m9providedthat\",\"enb1m9incase\",\"enb1m9ifyoubookinadvance\",\"enb1m9inadvance\",\"enb1m9ifyoulose\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: cuatro condiciones que no dicen lo mismo\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Cuidado con\"],[\"Si pierdes la tarjeta…\",\"If you lose your boarding pass…\",\"—\"],[\"A menos que reserves antes\",\"Unless you book in advance\",\"«unless you don't book»\"],[\"Siempre que quepa\",\"As long as it fits\",\"«as long as it will fit»\"],[\"Siempre y cuando (escrito)\",\"Provided that you check in online\",\"—\"],[\"Por si acaso hace frío\",\"In case it gets cold\",\"«in case it will get cold»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l4e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro condiciones\",\"pairs\":[{\"target\":\"You can take it on board as long as it fits in the frame.\",\"source\":\"Puedes subirlo a bordo siempre que quepa en el medidor.\"},{\"target\":\"Provided that you check in online, you don't have to queue.\",\"source\":\"Siempre y cuando factures por internet, no hay que hacer cola.\"},{\"target\":\"Take a jumper in case it gets cold.\",\"source\":\"Llévate un jersey por si acaso hace frío.\"},{\"target\":\"If you lose your boarding pass, go straight to the desk.\",\"source\":\"Si pierdes la tarjeta de embarque, ve directo al mostrador.\"}],\"itemIds\":[\"enb1m9aslongas\",\"enb1m9providedthat\",\"enb1m9incase\",\"enb1m9ifyoulose\"],\"tip\":\"Lee los cuatro verbos que van detrás de la conjunción: fits, check in, gets, lose. Todos en presente, y las cuatro frases hablan del futuro. Es la misma regla de la lección 3 mudada a las condicionales.\"},{\"id\":\"enb1m9l4e2\",\"type\":\"mc\",\"prompt\":\"«Si» o «por si acaso»\",\"question\":\"Quieres decir: «Llévate un paraguas por si llueve.» →\",\"options\":[\"Take an umbrella in case it rains.\",\"Take an umbrella if it rains.\",\"Take an umbrella in case of it rains.\"],\"answer\":0,\"whyWrong\":[null,\"«If it rains» es coger el paraguas DESPUÉS de que llueva, que no sirve de nada: el paraguas se coge antes de salir.\",\"«In case of» va con sustantivo («in case of rain», «in case of fire»), nunca con una frase entera.\"],\"itemIds\":[\"enb1m9incase\",\"ena2m11ifitrains\"],\"tip\":\"Truco de bolsillo: si la acción se hace ANTES por prevención, es «in case». Si se hace DESPUÉS como reacción, es «if». En español las dos caben en «si llueve», y por eso el error no chirría al oído.\"},{\"id\":\"enb1m9l4e3\",\"type\":\"bucket\",\"prompt\":\"¿Pone una condición o previene por si acaso?\",\"categories\":[\"Condición (if / unless / as long as)\",\"Prevención (in case)\"],\"items\":[{\"text\":\"Take a jumper in case it gets cold.\",\"bucket\":1},{\"text\":\"You can board as long as it fits in the frame.\",\"bucket\":0},{\"text\":\"I'll print the ticket in case my phone dies.\",\"bucket\":1},{\"text\":\"Unless you book in advance, it costs double.\",\"bucket\":0},{\"text\":\"Bring some euros in case the machine won't take cards.\",\"bucket\":1},{\"text\":\"If you lose it, go to the desk.\",\"bucket\":0}],\"itemIds\":[\"enb1m9incase\",\"enb1m9aslongas\",\"enb1m9ifyoulose\",\"enb1m1unless\"],\"tip\":\"Las tres de prevención tienen algo en común: la acción principal se hace YA. Imprimir el billete, coger el jersey, llevar euros. Si la frase te obliga a hacer algo ahora mismo, es «in case».\"},{\"id\":\"enb1m9l4e4\",\"type\":\"errorfix\",\"prompt\":\"Sobra una palabra y falta otra. Arréglalo.\",\"wrong\":\"I'll go as long as it will be sunny.\",\"answers\":[\"I'll go as long as it is sunny.\"],\"why\":\"Detrás de «as long as» va presente, igual que detrás de «if», «unless», «when» o «as soon as». El futuro se queda en la mitad principal, que aquí ya lo tiene: «I'll go».\",\"translation\":\"Voy siempre que haga sol.\",\"itemIds\":[\"enb1m9aslongas\"]},{\"id\":\"enb1m9l4e5\",\"type\":\"errorfix\",\"prompt\":\"La doble negación de «unless». Cambia UNA palabra.\",\"wrong\":\"I won't go unless it doesn't rain.\",\"answers\":[\"I won't go unless it stops raining.\"],\"why\":\"«Unless» ya significa «si no»: al ponerle otra negación detrás, la frase dice lo contrario de lo que quieres. «I won't go unless it stops raining» es «no voy a menos que pare de llover».\",\"translation\":\"No voy a menos que deje de llover.\",\"itemIds\":[\"enb1m1unless\"]},{\"id\":\"enb1m9l4e6\",\"type\":\"cloze\",\"prompt\":\"Completa la conjunción del folleto\",\"text\":\"You do not need to print anything, ___ that you have the app on your phone.\",\"answers\":[\"provided\",\"providing\"],\"translation\":\"No hace falta imprimir nada, siempre y cuando lleve la aplicación en el móvil.\",\"hints\":[\"Es la versión escrita y formal de «as long as»\",\"Empieza por «pro…» y va seguida de «that»\"],\"itemIds\":[\"enb1m9providedthat\"],\"tip\":\"«Provided that» y «providing that» valen las dos, y el «that» se puede quitar. Es la palabra de los folletos y los contratos: si la reconoces, ya lees la letra pequeña de un billete.\"},{\"id\":\"enb1m9l4e7\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que le dicen a Valeria en el mostrador\",\"text\":\"The bag goes on board ___ it fits in the frame at the door. It isn't free ___ you booked it online: at the gate they charge forty pounds. And take a jumper ___ it gets cold, because the flight is three hours.\",\"answers\":[\"as long as\",\"unless\",\"in case\"],\"bank\":[\"as long as\",\"unless\",\"in case\",\"although\",\"so that\",\"in case of\"],\"translation\":\"La bolsa sube a bordo siempre que quepa en el medidor de la puerta. Gratis no es, a menos que la reservaras por internet: en la puerta de embarque te cobran cuarenta libras. Y llévate un jersey por si hace frío, que el vuelo son tres horas.\",\"itemIds\":[\"enb1m9aslongas\",\"enb1m1unless\",\"enb1m9incase\"],\"tip\":\"Los tres huecos son las tres condiciones del módulo en veinte segundos: permiso con condición, excepción y prevención. Y fíjate en «in case of», que está en el banco de propósito: no cabe en ningún hueco porque detrás de los tres hay una frase entera, no un sustantivo.\"},{\"id\":\"enb1m9l4e8\",\"type\":\"build\",\"prompt\":\"Construye la condición del billete barato\",\"target\":\"If you book in advance it costs half as much\",\"translation\":\"Si reservas con antelación cuesta la mitad\",\"distractors\":[\"will\",\"unless\"],\"itemIds\":[\"enb1m9ifyoubookinadvance\",\"enb1m9inadvance\"],\"tip\":\"Las dos fichas que sobran son las dos tentaciones: «will» detrás del «if» y «unless» por confundir la condición con la excepción. Aquí no hay excepción ninguna: es una regla que se cumple siempre, y por eso las dos mitades van en presente.\"},{\"id\":\"enb1m9l4e9\",\"type\":\"transform\",\"prompt\":\"Del «si no» al «a menos que»\",\"source\":\"If you don't book in advance, it costs double.\",\"instruction\":\"Dilo con «unless»\",\"answers\":[\"Unless you book in advance, it costs double\",\"Unless you book in advance, it costs double.\",\"It costs double unless you book in advance\"],\"translation\":\"A menos que reserves con antelación, cuesta el doble.\",\"hints\":[\"«Unless» ya lleva la negación dentro: el verbo va en afirmativo\",\"Unless you book ...\"],\"itemIds\":[\"enb1m1unless\",\"enb1m9inadvance\"],\"tip\":\"Al cambiar a «unless» desaparece el «don't». Si te lo dejas puesto, la frase dice justo lo contrario — y es un error que el corrector ve a un metro de distancia.\"},{\"id\":\"enb1m9l4e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Voy a imprimir el billete por si se me queda el móvil sin batería.\",\"answers\":[\"I'm going to print the ticket in case my phone dies\",\"I'll print the ticket in case my phone dies\",\"I'm going to print the ticket in case my phone runs out of battery\",\"I'm going to print the ticket in case the phone dies\"],\"hint\":\"«Por si acaso» es una sola conjunción de dos palabras\",\"itemIds\":[\"enb1m9incase\",\"enb1m9imgoingtorenew\"],\"tip\":\"«My phone dies» es como se dice de verdad que se queda sin batería. «My phone runs out of battery» se entiende, pero nadie lo dice así en la puerta de embarque.\"},{\"id\":\"enb1m9l4e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te está permitiendo exactamente?\",\"source\":\"You can change the date once, free of charge, provided that you do it twelve hours before departure.\",\"answers\":[\"Puede cambiar la fecha una vez, sin coste, siempre y cuando lo haga doce horas antes de la salida\",\"Puedes cambiar la fecha una vez, gratis, siempre que lo hagas doce horas antes de la salida\",\"Se puede cambiar la fecha una vez, sin cargo, siempre y cuando se haga doce horas antes de la salida\"],\"itemIds\":[\"enb1m9providedthat\"],\"tip\":\"Esta frase es literalmente el tipo de letra pequeña que trae el Reading Part 3. Fíjate en las tres condiciones escondidas: una sola vez, sin coste y con doce horas de margen. Perder una es perder el ítem.\"},{\"id\":\"enb1m9l4e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Puedes subirla a bordo siempre que quepa, pero llévate el recibo por si acaso.\",\"answers\":[\"You can take it on board as long as it fits, but take the receipt in case\",\"You can take it on board as long as it fits, but bring the receipt just in case\",\"You can take it on board as long as it fits, but take the receipt just in case\"],\"hints\":[\"Primera mitad: la condición con aviso\",\"Segunda mitad: «por si acaso», al final y a secas\"],\"itemIds\":[\"enb1m9aslongas\",\"enb1m9incase\",\"ena2m7thereceipt\"],\"tip\":\"«Just in case» al final y sin nada detrás es como se dice «por si acaso» a secas. Es de las tres o cuatro coletillas más útiles del inglés hablado y cabe en cualquier conversación.\"},{\"id\":\"enb1m9l4e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en el mostrador de la puerta de embarque. Dos escuchas.\",\"audio\":\"Is that going in the hold or are you taking it on?|Taking it on, if that's all right.|It has to fit in the frame here. Go on, try it.|It's a bit tight.|That's fine, that counts. If it hadn't gone in I'd have had to charge you forty pounds at this end, which nobody enjoys.|Forty? It was nine pounds online.|It always is. Book the bag when you book the seat and it's nine. Leave it to the gate and it's forty. Take your jacket out of it, though, in case you want it later — there's no heating on that aircraft worth speaking of.\",\"question\":\"¿Por qué le dice que saque la chaqueta de la bolsa?\",\"options\":[\"Por si la necesita durante el vuelo\",\"Porque así la bolsa cabe en el medidor\",\"Porque no se puede llevar ropa en el equipaje de mano\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La bolsa ya ha cabido: «That's fine, that counts». Lo de la chaqueta viene después y por otro motivo.\",\"Eso no se dice en ningún momento, y sería falso.\"],\"itemIds\":[\"enb1m9incase\",\"enb1m9aslongas\",\"enb1m9luggageallowance\"],\"tip\":\"«In case you want it later» es prevención pura: sacas la chaqueta AHORA por lo que pueda pasar después. Y fíjate en el «though» del final, que ya traes del módulo 6: cambia el sentido de todo lo anterior sin subir la voz.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
