1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T644,"])</script><script>self.__next_f.push([1,"\u003ci\u003eLee la historia en voz alta. Casi todo el vocabulario ya es tuyo; lo nuevo va glosado.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e1. Lucía Ortega wollte im Dezember den [[Christkindlmarkt|mercado navideño]] in Wien sehen — die Feste des Dezembers sind in Österreich heilig.\u003cbr/\u003e2. Am Bahnhof kaufte sie eine Fahrkarte hin und zurück und fragte nach der günstigsten Verbindung.\u003cbr/\u003e3. „Mit dem nächsten Zug fahren Sie über Salzburg“, sagte der freundliche Mann am Schalter. „Sie müssen in Salzburg umsteigen.“\u003cbr/\u003e4. Trotz des starken Regens fuhr der Zug planmäßig ab. Lucía hatte einen reservierten Platz am Fenster und freute sich auf die Reise.\u003cbr/\u003e5. Dann kam die Durchsage: „Der Zug hat voraussichtlich vierzig Minuten Verspätung.“ Lucía [[rechnete|calculó]] kurz nach: Der Anschluss war weg.\u003cbr/\u003e6. In Salzburg suchte sie die Information, verlief sich in der großen Halle und stand plötzlich vor einer geschlossenen Tür.\u003cbr/\u003e7. Eine Frau in Uniform sagte: „Keine Sorge. Der letzte Zug nach Zürich fährt um 22:40 von Gleis 3. Ihre Fahrkarte gilt weiter — Sie zahlen nichts.“\u003cbr/\u003e8. Weil sie drei Stunden Zeit hatte, aß Lucía eine Suppe, kaufte ein kleines Geschenk und schrieb ihrer Freundin Anna: „Ich bin noch unterwegs. Alles ist schiefgegangen, aber es war ein Abenteuer.“\u003cbr/\u003e9. Um Mitternacht kam sie in Zürich an. Am nächsten Morgen gab es frisches Brot, guten Kaffee — und die Geschichte, die sie seitdem jedem erzählt.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eApoyo: das Christkindl = niño Jesús (Austria) · nachrechnen = echar cuentas · die Halle = el vestíbulo · gelten = tener validez\u003c/i\u003e"])</script><script>self.__next_f.push([1,"18:T7b1,"])</script><script>self.__next_f.push([1,"Guten Abend bei «Unterwegs». Die Frage heute: Kann der Nachtzug den Kurzstreckenflug ersetzen? Bei mir sitzen eine Verkehrsplanerin und der Inhaber eines Reisebüros in Wien. Frau Doktor, Sie fahren die Strecke selbst? | Zweimal im Monat, Wien–Zürich. Und ich sage es gleich: Wer erwartet, dass das so bequem ist wie das eigene Bett, wird enttäuscht. Wer erwartet, morgens ohne Sicherheitskontrolle mitten in der Stadt zu stehen, nicht. | Bei mir im Büro sieht das anders aus. Ich verkaufe das gern, ehrlich. Nur buchen die Leute es einmal, finden es romantisch, und beim zweiten Mal nehmen sie wieder den Flieger. Weil der die Hälfte kostet. | Das ist der Kern, ja. Nur liegt das nicht am Zug, sondern daran, dass auf den Flug keine Steuer aufs Kerosin kommt. Bei gleichen Regeln sähe der Preis anders aus. | Und die Verspätungen? Da wird aus der schönsten Idee schnell eine Zumutung. | Ein verpasster Anschluss um sechs Uhr früh ist wirklich etwas anderes als eine Viertelstunde am Nachmittag. Solange man nachts nicht umsteigen muss, geht es; sobald man muss, wird es unangenehm. | Und dann steht man in Basel auf dem Bahnsteig und findet keinen Menschen, der einem hilft. Das ist mein eigentlicher Vorwurf: Es fehlt nicht an Zügen, es fehlt an Leuten, die einen weiterbringen. | Da stimme ich Ihnen zu. Was ich aber noch wichtiger finde: Es fehlt an einer einzigen Fahrkarte. Heute buchen Sie drei Bahnen, und wenn eine zu spät ist, hilft Ihnen die nächste nicht. | Genau deshalb kommen die Leute zu mir. Und trotzdem: Für eine Familie mit zwei Kindern rechnet sich das nie. | Bei den Familien haben Sie recht. Bei Geschäftsreisen sieht die Rechnung inzwischen anders aus, sobald man die Übernachtung dazuzählt. | Ein Satz zum Schluss, dann bedanke ich mich bei Ihnen beiden. | Probieren Sie es einmal ohne Umsteigen. Nicht gleich die Strecke mit drei Anschlüssen. | Und bucht früh. Vier Wochen vorher ist der Nachtzug ein ganz anderes Produkt."])</script><script>self.__next_f.push([1,"19:T7b1,"])</s Ein Satz zum Schluss, dann bedanke ich mich bei Ihnen beiden. | Probieren Sie es einmal ohne Umsteigen. Nicht gleich die Strecke mit drei Anschlüssen. | Und bucht früh. Vier Wochen vorher ist der Nachtzug ein ganz anderes Produkt."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m9l9\",\"phaseId\":\"b1m9\",\"title\":\"Die lange Reise\",\"subtitle\":\"Historia larga, espiral de los módulos 7 y 8, y tu monólogo\",\"minutes\":28,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las últimas piezas del módulo\",\"itemIds\":[\"b1m9unterwegssein\",\"b1m9sichverlaufen\",\"b1m9abenteuer\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Lucía fährt von Wien nach Zürich\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l9e1\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 3)\",\"question\":\"Wo muss Lucía umsteigen?\",\"options\":[\"In Wien\",\"In Salzburg\",\"In Zürich\"],\"answer\":1,\"whyWrong\":[\"En Viena empieza el viaje\",null,\"Zúrich es el destino final\"],\"itemIds\":[\"b1m9umsteigen\"]},{\"id\":\"b1m9l9e2\",\"type\":\"mc\",\"prompt\":\"Inferencia (frases 5-7)\",\"question\":\"Warum musste Lucía nichts extra bezahlen?\",\"options\":[\"Weil die Verspätung nicht ihre Schuld war\",\"Weil sie eine Fahrkarte hin und zurück hatte\",\"Weil der letzte Zug immer gratis ist\"],\"answer\":0,\"whyWrong\":[null,\"El billete de ida y vuelta no tiene nada que ver con el retraso\",\"Ningún tren es gratis en la historia\"],\"itemIds\":[\"b1m9verspaetung\",\"b1m9hinundzurueck\"],\"tip\":\"«Ihre Fahrkarte gilt weiter» no explica el porqué: lo infieres del retraso del tren. Así preguntan en el Lesen.\"},{\"id\":\"b1m9l9e3\",\"type\":\"order\",\"prompt\":\"Ordena el viaje de Lucía\",\"sentences\":[\"Lucía kaufte eine Fahrkarte hin und zurück.\",\"Der Zug fuhr trotz des starken Regens planmäßig ab.\",\"Die Durchsage meldete vierzig Minuten Verspätung.\",\"In Salzburg verlief sich Lucía in der großen Halle.\",\"Um Mitternacht kam sie in Zürich an.\"],\"translation\":\"Lucía compró un billete de ida y vuelta. El tren salió puntual a pesar de la fuerte lluvia. La megafonía anunció cuarenta minutos de retraso. En Salzburgo Lucía se perdió en el gran vestíbulo. A medianoche llegó a Zúrich.\",\"hints\":[\"Del billete a la llegada\",\"La megafonía llega después de salir\"],\"itemIds\":[\"b1m9hinundzurueck\",\"b1m9trotzdesregens\",\"b1m9durchsage\",\"b1m9sichverlaufen\"]},{\"id\":\"b1m9l9e4\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de fluidez: material del módulo, ahora contrarreloj\",\"pairs\":[{\"target\":\"den Anschluss verpassen\",\"source\":\"perder el enlace\"},{\"target\":\"ein freies Zimmer\",\"source\":\"una habitación libre\"},{\"target\":\"die Fahrkarte entwerten\",\"source\":\"picar el billete\"},{\"target\":\"unterwegs sein\",\"source\":\"estar de camino\"},{\"target\":\"Es lohnt sich\",\"source\":\"merece la pena\"}],\"targetSeconds\":25,\"itemIds\":[\"b1m9anschlussverpassen\",\"b1m9freieszimmer\",\"b1m9entwerten\",\"b1m9unterwegssein\",\"b1m3eslohntsich\"],\"tip\":\"Aquí no aprendes nada nuevo: automatizas lo que ya sabes. El cronómetro solo suma puntos, nunca te penaliza.\"},{\"id\":\"b1m9l9e5\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el final de la historia\",\"text\":\"Weil sie drei Stunden Zeit ___, aß Lucía eine Suppe und kaufte ___ Geschenk. Am ___ Morgen gab es ___ Brot und guten Kaffee.\",\"answers\":[\"hatte\",\"ein kleines\",\"nächsten\",\"frisches\"],\"bank\":[\"hatte\",\"ein kleines\",\"nächsten\",\"frisches\",\"hat\",\"ein kleiner\",\"nächste\",\"frischem\"],\"translation\":\"Como tenía tres horas de tiempo, Lucía comió una sopa y compró un regalito. A la mañana siguiente había pan fresco y buen café.\",\"hints\":[\"Tras weil, el verbo cierra la subordinada\",\"«am n-ä-c-h-s-t-e-n Morgen»: dativo → -en\"],\"itemIds\":[\"b1m9frischesbrot\",\"b1m9abenteuer\"]},{\"id\":\"b1m9l9e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige el mensaje de Lucía\",\"wrong\":\"Ich bin noch unterwegs und ich warte den letzten Zug.\",\"answers\":[\"Ich bin noch unterwegs und ich warte auf den letzten Zug.\"],\"why\":\"warten auf + Akkusativ. Sin la preposición, la frase suena a traducción literal del español «espero el último tren».\",\"translation\":\"Todavía estoy de camino y espero el último tren.\",\"itemIds\":[\"b1m9unterwegssein\",\"b1m9wartenaufanschluss\",\"b1m9mitdemletztenzug\"]},{\"id\":\"b1m9l9e7\",\"type\":\"transform\",\"prompt\":\"Espiral b1m8: pon el plan en Futur I\",\"source\":\"Nächstes Jahr fahre ich wieder nach Wien.\",\"instruction\":\"Ponla en Futur I (werden + infinitivo)\",\"answers\":[\"Nächstes Jahr werde ich wieder nach Wien fahren\",\"Nächstes Jahr werde ich wieder nach Wien fahren.\",\"Ich werde nächstes Jahr wieder nach Wien fahren\"],\"translation\":\"El año que viene volveré a ir a Viena.\",\"hints\":[\"werden en 2ª posición\",\"… werde ich wieder nach Wien fahren\"],\"itemIds\":[\"b1m9unterwegssein\"],\"tip\":\"Espiral del módulo 8: el Futur I marca intención y promesa. En una historia de viajes cierra perfecto.\"},{\"id\":\"b1m9l9e8\",\"type\":\"paraphrase\",\"prompt\":\"Cuéntalo sin usar las palabras fáciles\",\"source\":\"Alles ist schiefgegangen, aber es war schön.\",\"forbid\":[\"schiefgegangen\",\"schön\"],\"answers\":[\"Nichts hat funktioniert, aber es war trotzdem ein Abenteuer\",\"Nichts hat geklappt, aber es war trotzdem ein Abenteuer\",\"Nichts hat funktioniert, aber es war ein Abenteuer\",\"Nichts hat geklappt, aber es war ein Abenteuer\"],\"translation\":\"Nada funcionó, pero aun así fue una aventura.\",\"hints\":[\"«nichts hat funktioniert/geklappt»\",\"Cierra con «… ein Abenteuer»\"],\"itemIds\":[\"b1m9schiefgehen\",\"b1m9abenteuer\"],\"tip\":\"Rango léxico: quien solo tiene «schön» repite «schön» ocho veces. Quien tiene tres salidas, puntúa en Wortschatz.\"},{\"id\":\"b1m9l9e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 1 de 5 (mensaje en el contestador). Dos escuchas.\",\"audio\":\"Hallo Lucía, hier ist Anna. Du, ich habe deine Nachricht erst jetzt gelesen — was für eine Nacht! Pass auf: Sofía und ich holen dich am Sonntag vom Bahnhof ab, aber erst um halb acht, vorher habe ich Dienst. Wenn dein Zug Verspätung hat, schreib mir kurz. Und wenn du früher ankommst, setz dich einfach ins Café gegenüber vom Ausgang Nord. Bring bitte nichts mit, wirklich nichts — du hast schon genug geschleppt. Bis Sonntag!\",\"question\":\"Anna kann Lucía nicht früher abholen, weil sie arbeiten muss.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice «erst um halb acht, vorher habe ich Dienst»: el turno es justo la razón, dicha con otras palabras\"],\"itemIds\":[\"b1m9verspaetung\"],\"tip\":\"Con este texto cierras el Hören Teil 1 entero del módulo: contestador, radio, megafonía, tiempo e información a un grupo. Son exactamente los cinco tipos que caen en el examen.\"},{\"id\":\"b1m9l9e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 1, segunda tarea. Mismo audio, dos escuchas.\",\"audio\":\"Hallo Lucía, hier ist Anna. Du, ich habe deine Nachricht erst jetzt gelesen — was für eine Nacht! Pass auf: Sofía und ich holen dich am Sonntag vom Bahnhof ab, aber erst um halb acht, vorher habe ich Dienst. Wenn dein Zug Verspätung hat, schreib mir kurz. Und wenn du früher ankommst, setz dich einfach ins Café gegenüber vom Ausgang Nord. Bring bitte nichts mit, wirklich nichts — du hast schon genug geschleppt. Bis Sonntag!\",\"question\":\"¿Qué debe hacer Lucía si llega antes de lo previsto?\",\"options\":[\"Esperar en la cafetería de enfrente de la salida norte\",\"Ir en tranvía a casa de Anna\",\"Llamar a Anna enseguida\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El tranvía no aparece en el mensaje\",\"Llamar se lo pide solo si el tren lleva retraso, y por escrito\"],\"itemIds\":[\"b1m9verspaetung\"],\"tip\":\"En los contestadores el dato bueno viene después de «Pass auf:» o «Und noch etwas:». Son las dos señales de que llega la instrucción.\"},{\"id\":\"b1m9l9e9\",\"type\":\"cloze\",\"prompt\":\"Completa el verbo de la frase 6\",\"text\":\"In der großen Halle hat sich Lucía ___. (perderse)\",\"answers\":[\"verlaufen\"],\"translation\":\"En el gran vestíbulo Lucía se perdió.\",\"hints\":[\"sich v-e-r-l-a-u-f-e-n: participio sin ge\",\"ver…\"],\"itemIds\":[\"b1m9sichverlaufen\"]},{\"id\":\"b1m9l9e10\",\"type\":\"monologue\",\"prompt\":\"Tu presentación de 3 minutos (Sprechen Teil 2 del examen)\",\"topic\":\"Reisen im eigenen Land oder ins Ausland?\",\"slides\":[{\"title\":\"1. Thema vorstellen\",\"hint\":\"«Ich möchte heute über … sprechen. Meine Präsentation hat fünf Teile.»\"},{\"title\":\"2. Eigene Erfahrung\",\"hint\":\"Tu último viaje: adónde, con qué medio de transporte, qué salió bien o mal.\"},{\"title\":\"3. Situation im Heimatland\",\"hint\":\"¿Cómo viaja la gente en tu país? Trenes, coche, avión barato — con un ejemplo.\"},{\"title\":\"4. Vor- und Nachteile + eigene Meinung\",\"hint\":\"«Ein Vorteil ist … Ein Nachteil ist … Meiner Meinung nach …»\"},{\"title\":\"5. Abschluss und Dank\",\"hint\":\"«Das war meine Präsentation. Vielen Dank für Ihre Aufmerksamkeit.»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"Traté las 5 diapositivas, ninguna en menos de 20 segundos\",\"Hablé al menos 2:30 sin parar\",\"Usé al menos 4 conectores distintos (deshalb, außerdem, allerdings, trotzdem, weil)\",\"Di un ejemplo propio y concreto (un viaje de verdad)\",\"Usé al menos tres adjetivos declinados delante del sustantivo (der letzte Zug, ein freies Zimmer…)\"],\"model\":\"Diapositiva 2, como ejemplo: „Letzten Sommer bin ich mit dem Nachtzug von Wien nach Zürich gefahren. Ich hatte einen reservierten Platz, aber der Zug hatte vierzig Minuten Verspätung und ich habe den Anschluss verpasst. Trotzdem war es eine gute Erfahrung, weil ich morgens direkt im Zentrum angekommen bin.“\",\"itemIds\":[\"b1m9nachtzug\",\"b1m9reservierterplatz\",\"b1m9anschlussverpassen\",\"b1m9unterwegssein\"],\"tip\":\"Pasada 1 con el guion a la vista (fluidez). Pasada 2 sin mirar y vigilando dos cosas: la terminación del adjetivo y el verbo al final tras weil.\"},{\"id\":\"b1m9l9e14\",\"type\":\"monologue\",\"prompt\":\"Sprechen Teil 1 — «Gemeinsam etwas planen»: 2-3 minutos y 28 de los 100 puntos del oral. Aquí estás solo, así que HABLA LOS DOS PAPELES en voz alta: propones, tu compañera objeta (invéntale la pega) y tú reaccionas, contrapropones y cierras. Sin objeciones no hay negociación, y sin negociación no hay nota.\",\"topic\":\"Gemeinsam etwas planen: Ihr wollt zu zweit ein Wochenende in Wien verbringen. Plant die Reise.\",\"slides\":[{\"title\":\"1 · Wann fahren wir, und wie?\",\"hint\":\"Nachtzug, ICE o vuelo barato: propón uno con su motivo, deja que la otra voz lo rechace («Im Nachtzug schlafe ich schlecht») y contrapropón con «Wie wäre es, wenn …?».\"},{\"title\":\"2 · Wo übernachten wir?\",\"hint\":\"Jugendherberge, Ferienwohnung, Hotel. Compara precio y comodidad: «Die Jugendherberge ist billiger, aber …».\"},{\"title\":\"3 · Was machen wir dort?\",\"hint\":\"Dos planes concretos y un reparto: «Du suchst das Restaurant aus, du kennst dich besser aus».\"},{\"title\":\"4 · Wie teilen wir die Kosten?\",\"hint\":\"«Die Fahrkarten zahlt jeder selbst, die Wohnung teilen wir.» Hablar de dinero sin rodeos es muy alemán y aquí cumple un Leitpunkt entero.\"},{\"title\":\"5 · Punkt offen + Abschluss\",\"hint\":\"Añade una condición propia («Ich muss sonntags um acht zurück sein») y cierra repitiendo el acuerdo: «Dann also Freitag um achtzehn Uhr. — Abgemacht!»\"}],\"planSeconds\":180,\"speakSeconds\":180,\"reps\":2,\"checklist\":[\"He hecho al menos CUATRO propuestas (Wollen wir…? / Sollen wir…? / Wie wäre es, wenn…? / Ich hätte einen Vorschlag)\",\"He puesto al menos DOS objeciones en boca de la otra voz y las he resuelto con una contrapropuesta\",\"He reaccionado a cada propuesta antes de soltar la mía (Gute Idee, aber… / Einverstanden)\",\"He tratado los cuatro Leitpunkte y he añadido un punto propio\",\"He cerrado repitiendo el acuerdo completo (día, hora, sitio)\",\"He usado al menos tres palabras del módulo: Verbindung, umsteigen, Übernachtung, Ferienwohnung, Fahrkarte\"],\"model\":\"— Also, wir wollen ja ein Wochenende nach Wien. Wollen wir mit dem Nachtzug fahren? Dann sparen wir eine Übernachtung. — Im Nachtzug schlafe ich schlecht, ehrlich gesagt. — Verstehe. Wie wäre es, wenn wir freitags nach der Arbeit mit dem ICE fahren? Die günstigste Verbindung geht um achtzehn Uhr, einmal umsteigen in Nürnberg. — Einverstanden. Und wo übernachten wir? — Ich hätte einen Vorschlag: eine Ferienwohnung im dritten Bezirk. Die Jugendherberge wäre billiger, aber dann müssten wir das Zimmer mit vier Leuten teilen. — Dann die Ferienwohnung, das ist es mir wert. Und was machen wir am Samstag? — Vormittags den Adventmarkt, nachmittags ein Museum. Das Restaurant suchst du aus, du kennst dich dort besser aus. — Mache ich. Und die Kosten? — Die Fahrkarten zahlt jeder selbst, die Wohnung teilen wir: Ich buche, und du überweist mir deine Hälfte. — Abgemacht. Eins noch: Sonntags muss ich um acht zurück sein, ich habe Dienst. — Kein Problem, dann nehmen wir den Zug um vierzehn Uhr.\",\"itemIds\":[\"b1m9guenstigsteverbindung\",\"b1m9umsteigen\",\"b1m9jugendherberge\",\"b1m9ferienwohnung\",\"b1m9uebernachtung\",\"b1m9nachtzug\"],\"tip\":\"Cuenta cuántas veces reaccionas a la otra voz. Si son cero, estás monologando: en el Teil 1 eso hunde «Interaktion» aunque el alemán sea impecable. Y planifica el viaje de verdad, con horas y precios — el examinador puntúa que la planificación llegue a una decisión, no que sea bonita.\"},{\"id\":\"b1m9l9e11\",\"type\":\"type\",\"prompt\":\"Cierre del módulo\",\"question\":\"Todo salió mal, pero fue una aventura y merece la pena viajar en tren.\",\"answers\":[\"Alles ist schiefgegangen, aber es war ein Abenteuer und es lohnt sich, mit dem Zug zu reisen\",\"Alles ist schiefgegangen, aber es war ein Abenteuer und es lohnt sich, mit dem Zug zu reisen.\"],\"hints\":[\"Empieza por «Alles ist schief…»\",\"… und es lohnt sich, mit dem Zug zu reisen\"],\"itemIds\":[\"b1m9schiefgehen\",\"b1m9abenteuer\",\"b1m3eslohntsich\",\"b1m9mitdemletztenzug\"],\"tip\":\"Módulo cerrado: billete, transbordo, alojamiento, reclamación y opinión — con el adjetivo declinado dentro de frases largas.\"}]},{\"kind\":\"note\",\"note\":{\"title\":\"Hören Teil 4: tres voces, ocho afirmaciones\",\"body\":\"El \u003cb\u003eTeil 4\u003c/b\u003e del Hören es una discusión de radio con \u003cb\u003etres voces\u003c/b\u003e —quien modera y dos invitados— y \u003cb\u003eocho afirmaciones\u003c/b\u003e (23-30) que se reparten entre a, b y c. \u003cb\u003eDos escuchas.\u003c/b\u003e En el audio nadie anuncia su papel antes de hablar: quien modera presenta a los invitados una sola vez, al principio.\u003cbr/\u003e\u003cbr/\u003eTres anclas, en este orden:\u003cbr/\u003e· la \u003cb\u003evoz\u003c/b\u003e — decídela en los primeros diez segundos;\u003cbr/\u003e· el \u003cb\u003epapel\u003c/b\u003e: quien modera pregunta y da turnos, la especialista trae datos y quien vende viajes trae el mostrador;\u003cbr/\u003e· la \u003cb\u003epostura\u003c/b\u003e: uno defiende la idea, el otro la enfría.\u003cbr/\u003e\u003cbr/\u003eY lo decisivo: las afirmaciones \u003cb\u003eno repiten las palabras del audio\u003c/b\u003e, las resumen. Aquí las tres voces dicen \u003ci\u003eNachtzug\u003c/i\u003e, \u003ci\u003ePreis\u003c/i\u003e y \u003ci\u003eVerspätung\u003c/i\u003e: por palabra clave no se resuelve ni una. Fórmulas que marcan el turno: \u003ci\u003eDa stimme ich Ihnen zu, was ich aber wichtiger finde…\u003c/i\u003e · \u003ci\u003eBei mir sieht das anders aus\u003c/i\u003e · \u003ci\u003eDa haben Sie recht\u003c/i\u003e.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l9e15\",\"type\":\"audiomc\",\"prompt\":\"HÖREN TEIL 4 EN FORMATO REAL · afirmación 1 de 8. Un debate de radio, tres voces y OCHO afirmaciones que hay que repartir entre a) el moderador, b) la planificadora de transporte y c) el dueño de la agencia de viajes. Nadie dice quién es antes de hablar: se reconoce por lo que dice. DOS escuchas: la primera para fijar las voces, la segunda para colocar las frases.\",\"audio\":\"$18\",\"question\":\"„Bequem ist die Fahrt nicht, praktisch schon.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él pregunta si hace la ruta, no la valora\",null,\"Él la vende, pero lo que cuenta es cómo se comportan sus clientes, no cómo se viaja\"],\"itemIds\":[\"b1m9nachtzug\",\"b1m9kurzstreckenflug\",\"b1m9unterwegssein\"],\"tip\":\"Ninguna de las ocho afirmaciones sale literal del audio. Ella monta dos frases en paralelo («Wer erwartet …, wird enttäuscht / Wer erwartet …, nicht») y la afirmación resume las dos en cinco palabras.\"},{\"id\":\"b1m9l9e16\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 8. Mismo debate, dos escuchas.\",\"audio\":\"$19\",\"question\":\"„Die Leute probieren es einmal aus und fliegen danach wieder.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él solo modera\",\"Ella habla de su propia experiencia, no de la clientela\",null],\"itemIds\":[\"b1m9guenstigsteverbindung\",\"b1m9steigendepreise\"],\"tip\":\"Quien tiene mostrador habla de lo que hace la gente; quien investiga habla de por qué. Es un atajo fiable cuando dudas entre dos voces.\"},{\"id\":\"b1m9l9e17\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 8. Dos escuchas.\",\"audio\":\"$1a\",\"question\":\"„Der Preisunterschied kommt von den Steuern, nicht von der Bahn.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él no explica precios\",null,\"Él constata el precio; de dónde viene lo explica ella\"],\"itemIds\":[\"b1m9steigendepreise\",\"b1m9umweltfreundlichreisen\"],\"tip\":\"«Nicht am Zug, sondern daran, dass…»: el par «no A, sino B» es el molde favorito del Teil 4. Lo que puntúa es siempre la segunda mitad.\"},{\"id\":\"b1m9l9e18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 8. Dos escuchas. En el Teil 4 real siempre hay una o dos afirmaciones del moderador.\",\"audio\":\"$1b\",\"question\":\"„Eine gute Idee kann an der Unpünktlichkeit scheitern.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ella matiza esa idea: depende de si hay transbordo o no\",\"Su queja no es el retraso, es que no haya nadie en el andén\"],\"itemIds\":[\"b1m9verspaetung\",\"b1m9planmaessig\"],\"tip\":\"Descartar al moderador por sistema cuesta dos puntos. Su marca no es el tema: es la forma. Aquí resume la discusión en una frase, y esa frase es un ítem.\"},{\"id\":\"b1m9l9e19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 8. Dos escuchas.\",\"audio\":\"$1c\",\"question\":\"„Mit Umsteigen ist der Nachtzug etwas ganz anderes als ohne.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él plantea el problema del retraso, no distingue trayectos\",null,\"Él habla de Basilea, pero su tema es el personal, no el transbordo en sí\"],\"itemIds\":[\"b1m9umsteigen\",\"b1m9anschlussverpassen\",\"b1m9wartenaufanschluss\"],\"tip\":\"«Solange man nachts nicht umsteigen muss, geht es; sobald man muss, wird es unangenehm»: dos condiciones opuestas en una frase. Reconocer solange/sobald de oído vale un ítem entero.\"},{\"id\":\"b1m9l9e20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 6 de 8. Dos escuchas.\",\"audio\":\"$1d\",\"question\":\"„Nicht die Züge fehlen, sondern die Ansprechpartner.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no señala culpables\",\"Ella le da la razón justo después, pero lo dice él primero\",null],\"itemIds\":[\"b1m9sichkuemmernumproblem\",\"b1m9koenntenSiebitte\"],\"tip\":\"Los dos hablan de lo que falta, y con dos segundos de diferencia. Por eso las afirmaciones van en el orden del debate: la primera vez que se dice, cuenta.\"},{\"id\":\"b1m9l9e21\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 7 de 8. Dos escuchas.\",\"audio\":\"$1e\",\"question\":\"„Es müsste eine einzige Fahrkarte für die ganze Strecke geben.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo enlaza los turnos\",null,\"Él habla de personal en las estaciones, no de billetes\"],\"itemIds\":[\"b1m9billett\",\"b1m9einfachefahrt\",\"b1m9hinundzurueck\"],\"tip\":\"«Da stimme ich Ihnen zu. Was ich aber noch wichtiger finde…»: primero le da la razón y después dice lo suyo. La afirmación que puntúa es SIEMPRE lo que viene tras el «aber».\"},{\"id\":\"b1m9l9e22\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 8 de 8. Dos escuchas. Última ronda: cada invitado suelta una única frase, y muy rápido — exactamente como en el examen.\",\"audio\":\"$1f\",\"question\":\"„Wer rechtzeitig bucht, bekommt einen ganz anderen Preis.“ — Wer sagt das?\",\"options\":[\"der Moderator\",\"die Verkehrsplanerin\",\"der Reisebüroinhaber\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él pide la frase de cierre, no la da\",\"Su consejo final es otro: empezar por un trayecto sin transbordos\",null],\"itemIds\":[\"b1m9uebernachtung\",\"b1m9reservierterplatz\"],\"tip\":\"La ronda final vale dos o tres ítems y llega cuando ya estás cansado: por eso el Teil 4 se entrena entero y no por trozos.\"}]}],\"resources\":[{\"label\":\"ÖBB — Fahrplan Österreich\",\"url\":\"https://www.oebb.at/\",\"note\":\"Busca una conexión Wien→Zürich y lee los avisos: es el alemán de este módulo en estado puro.\"},{\"label\":\"Goethe — Modellsatz B1 (Sprechen)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Las 5 diapositivas del Teil 2 son siempre las mismas: la plantilla de tu monólogo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"20:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L20\",\"6\",{}]]\n"])</script></body></html>
