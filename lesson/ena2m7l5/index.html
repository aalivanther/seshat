ingleses pueden, así que hacen lo natural: \u003cb\u003ese comen la primera t\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003emustn't → \u003cb\u003eMA-sent\u003c/b\u003e. Dos golpes, y ni rastro de la t de \u003ci\u003emust\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eEsto no es dejadez ni acento raro: es la pronunciación normal, la que usa el locutor de la BBC. Y para ti tiene una consecuencia práctica muy concreta: \u003cb\u003esi escuchas esperando la t de must, no vas a reconocer la palabra\u003c/b\u003e. Vas a oír algo parecido a «masent» y te vas a quedar en blanco justo en el verbo que te está prohibiendo algo.\u003cbr/\u003e\u003cbr/\u003eLa misma tijera funciona en otros sitios que ya conoces: \u003ci\u003edidn't\u003c/i\u003e → «DÍ-dent», \u003ci\u003ewouldn't\u003c/i\u003e → «UÚ-dent», \u003ci\u003ecouldn't\u003c/i\u003e → «KU-dent». En todas ellas la n se traga lo que tiene delante.\"}},{\"kind\":\"note\",\"note\":{\"title\":\"hafta, hasta y cudja\",\"body\":\"El inglés hablado pega las palabras y las desgasta. Estas tres las vas a oír todos los días, y no vienen escritas en ningún sitio:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ehave to\u003c/b\u003e → \u003cb\u003ehafta\u003c/b\u003e. La v se vuelve f porque la t que viene detrás es sorda. \u003ci\u003eI have to go\u003c/i\u003e → «ái JAF-ta góu».\u003cbr/\u003e· \u003cb\u003ehas to\u003c/b\u003e → \u003cb\u003ehasta\u003c/b\u003e. Igual: \u003ci\u003eShe has to work\u003c/i\u003e → «shi JAS-ta uéek».\u003cbr/\u003e· \u003cb\u003ecould you\u003c/b\u003e → \u003cb\u003ecudja\u003c/b\u003e. La d y la y se funden en una sola consonante. \u003ci\u003eCould you help me?\u003c/i\u003e → «KUD-cha jelp mi».\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eNo se escriben así jamás.\u003c/b\u003e Esto no es para producirlo: es para reconocerlo. Tú puedes seguir diciendo «hav tu» toda tu vida y te entenderán perfectamente. Lo que no puedes es no entender «hafta» cuando te lo digan en una ventanilla, porque entonces te pierdes justo la obligación.\",\"table\":[[\"se escribe\",\"se oye\",\"ejemplo\"],[\"mustn't\",\"MA-sent\",\"You mustn't smoke.\"],[\"have to\",\"hafta\",\"I have to go.\"],[\"has to\",\"hasta\",\"She has to wait.\"],[\"could you\",\"cudja\",\"Could you help me?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"can y can't: la diferencia que decide si es sí o no\",\"body\":\"Esta es la que más cara sale, porque no es un matiz de acento: es entender lo contrario.\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003ecan\u003c/b\u003e afirmativo va \u003cb\u003eátono\u003c/b\u003e. Se encoge hasta casi desaparecer: «kan», o incluso «kn». \u003ci\u003eI can help you\u003c/i\u003e → «ái kan JELP yu», con el golpe de voz en HELP.\u003cbr/\u003e· \u003cb\u003ecan't\u003c/b\u003e va \u003cb\u003etónico y largo\u003c/b\u003e, y en británico con una vocal muy abierta, casi «aa». \u003ci\u003eI can't help you\u003c/i\u003e → «ái KAANT jelp yu», con el golpe de voz en CAN'T.\u003cbr/\u003e\u003cbr/\u003eO sea: \u003cb\u003ela palabra corta y débil es el sí; la larga y fuerte es el no.\u003c/b\u003e Justo al revés de lo que espera un hispanohablante, que pronunciaría las dos igual de claras.\u003cbr/\u003e\u003cbr/\u003eY como la t final de \u003ci\u003ecan't\u003c/i\u003e también se cae a menudo delante de consonante, la única pista fiable que te queda es \u003cb\u003edónde cae el acento y cuánto dura la vocal\u003c/b\u003e. Si la vocal es larga y el golpe está ahí, te están diciendo que no.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l5e1\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál has oído?\",\"book\":\"I have to go now.\",\"real\":\"I hafta go now.\",\"translation\":\"Me tengo que ir ya.\",\"itemIds\":[\"ena2m7haftahasta\",\"ena2m7imustgo\"],\"tip\":\"Las dos son la misma frase. La de abajo es lo que sale de una boca real a velocidad normal.\"},{\"id\":\"ena2m7l5e2\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál has oído?\",\"book\":\"She has to wait.\",\"real\":\"She hasta wait.\",\"translation\":\"Tiene que esperar.\",\"itemIds\":[\"ena2m7haftahasta\",\"ena2m7shedoesnthavetowait\"]},{\"id\":\"ena2m7l5e3\",\"type\":\"hearreal\",\"prompt\":\"¿Qué te está diciendo?\",\"book\":\"Could you help me?\",\"real\":\"Cudja help me?\",\"translation\":\"¿Me podría ayudar?\",\"ask\":\"meaning\",\"meaningOptions\":[\"¿Me podría ayudar?\",\"¿Le ayudo?\",\"No puedo ayudarle.\"],\"itemIds\":[\"ena2m7couldyousound\",\"encanyouhelpme\"],\"tip\":\"«cudja» de una pieza. Si buscas dos palabras separadas, no la encuentras.\"},{\"id\":\"ena2m7l5e4\",\"type\":\"audiomc\",\"prompt\":\"¿Te está diciendo que sí o que no? — 2 escuchas\",\"audio\":\"I'm sorry, I can't help you with that.\",\"question\":\"¿Le va a ayudar?\",\"options\":[\"No\",\"Sí\",\"Dice que lo mirará\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El can va largo y acentuado: KAANT. Eso es un no\",\"No dice nada de mirarlo\"],\"itemIds\":[\"ena2m7cantstrong\",\"ena2m7imafraidyoucant\"],\"tip\":\"La pista está en la duración: «KAANT», vocal larga y golpe de voz encima. El can del sí pasa de puntillas.\"},{\"id\":\"ena2m7l5e5\",\"type\":\"audiomc\",\"prompt\":\"Y ahora esta — 2 escuchas\",\"audio\":\"Yes, of course, I can do that for you today.\",\"question\":\"¿Le va a ayudar?\",\"options\":[\"Sí\",\"No\",\"Solo mañana\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Aquí el can es corto y átono, casi no suena: eso es el sí\",\"Dice today, no tomorrow\"],\"itemIds\":[\"ena2m7cantstrong\",\"ena2m7ofcourseyoucan\"]},{\"id\":\"ena2m7l5e6\",\"type\":\"bucket\",\"prompt\":\"¿La palabra clave va fuerte o va de puntillas?\",\"categories\":[\"suena fuerte y larga\",\"suena débil y corta\"],\"items\":[{\"text\":\"I CAN'T help you.\",\"bucket\":0},{\"text\":\"I can help you.\",\"bucket\":1},{\"text\":\"She CAN'T come today.\",\"bucket\":0},{\"text\":\"She can come today.\",\"bucket\":1},{\"text\":\"We CAN'T wait.\",\"bucket\":0},{\"text\":\"We can wait.\",\"bucket\":1}],\"itemIds\":[\"ena2m7cantstrong\"],\"tip\":\"En inglés, lo importante se alarga y lo de relleno se encoge. Un «no» es importante; un «sí» ya se da por hecho.\"},{\"id\":\"ena2m7l5e7\",\"type\":\"listen\",\"prompt\":\"Dictado — escribe exactamente lo que oigas\",\"text\":\"You mustn't park here.\",\"translation\":\"Aquí no se puede aparcar.\",\"strictContractions\":true,\"itemIds\":[\"ena2m7mustntsound\",\"ena2m7youcantparkhere\"],\"tip\":\"Aunque no oigas la t de must, se escribe. La contracción cuenta: aquí «must not» no vale, porque no es lo que ha sonado.\"},{\"id\":\"ena2m7l5e8\",\"type\":\"listen\",\"prompt\":\"Dictado — y ojo a la obligación\",\"text\":\"I have to go to the bank today.\",\"translation\":\"Hoy tengo que ir al banco.\",\"itemIds\":[\"ena2m7ihavetogotothebank\",\"ena2m7haftahasta\",\"enbank\"],\"tip\":\"Va a sonar «hafta», pero se escribe have to, en dos palabras.\"},{\"id\":\"ena2m7l5e9\",\"type\":\"shadow\",\"prompt\":\"Repite pegado al audio, sin la primera t\",\"text\":\"You mustn't smoke in here, I'm afraid.\",\"phonetic\":\"yu MA-sent smóuk in jía, áim a-FRÉID\",\"translation\":\"Aquí no se puede fumar, lo siento.\",\"reps\":2,\"itemIds\":[\"ena2m7mustntsound\",\"ena2m7youmustntsmoke\"]},{\"id\":\"ena2m7l5e10\",\"type\":\"speak\",\"prompt\":\"Las dos seguidas, y que se note cuál es cuál\",\"text\":\"I can help you. I can't help you.\",\"phonetic\":\"ái kan JELP yu / ái KAANT jelp yu\",\"translation\":\"Puedo ayudarle. / No puedo ayudarle.\",\"itemIds\":[\"ena2m7cantstrong\"],\"tip\":\"Alarga el KAANT hasta que te dé un poco de vergüenza. Ahí es donde empieza a sonar británico de verdad.\"},{\"id\":\"ena2m7l5e11\",\"type\":\"fastmatch\",\"prompt\":\"Contrarreloj: lo que ya sabes del módulo\",\"pairs\":[{\"target\":\"You mustn't smoke in here.\",\"source\":\"Aquí no se puede fumar.\"},{\"target\":\"You don't have to pay.\",\"source\":\"No hace falta pagar.\"},{\"target\":\"I have to go to the bank.\",\"source\":\"Tengo que ir al banco.\"},{\"target\":\"Out of order\",\"source\":\"Averiado\"},{\"target\":\"It's up to you.\",\"source\":\"Tú decides.\"}],\"targetSeconds\":25,\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7youdonthavetopay\",\"ena2m7ihavetogotothebank\",\"ena2m7outoforder\",\"ena2m7itsuptoyou\"],\"tip\":\"El cronómetro aquí solo suma: si tardas, no pasa nada. Lo que se entrena es la velocidad de acceso, no la puntería.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — Pronunciation: weak forms\",\"url\":\"https://www.bbc.co.uk/learningenglish/features/pronunciation\",\"note\":\"Busca los vídeos de «weak forms». Diez minutos y entiendes por qué el inglés hablado te suena a una sola palabra larga: la mitad de las piezas van sin acento a propósito.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
