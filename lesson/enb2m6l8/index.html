 que ya tienes. ❌ \u003ci\u003edespite I was tired\u003c/i\u003e — despite no traga una frase pelada; necesita the fact that, o un nombre, o un -ing.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEven so\u003c/b\u003e = aun así. Concesión de adverbio: mira hacia atrás, da la razón, y tira. Prima de however, más de relato que de informe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eRegret + -ing\u003c/b\u003e = te arrepientes de lo hecho. Ya lo cazamos. \u003cb\u003eOffering / accepting an apology\u003c/b\u003e son los nombres de las dos funciones: conviene tenerlos, porque el Speaking Part 1 a veces pregunta con ellos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eI got it done\u003c/b\u003e cierra los causativos: calle, participio, sin persona. Hoy escribes 150-200 palabras narrando el error. No es una disculpa a Priya (eso era la L4): es el relato a alguien que no estaba. Género: \u003ci\u003estory\u003c/i\u003e. El examen de LanguageCert SÍ pide relato en la Writing 2. Este sí cae.\",\"table\":[[\"Conector\",\"Detrás\",\"Ejemplo\"],[\"despite the fact that\",\"una frase\",\"despite the fact that I was tired\"],[\"even so\",\"coma, y sigue\",\"Even so, I should have waited.\"],[\"on reflection\",\"coma, cambio de postura\",\"On reflection, I was unfair.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m6l8e1\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Despite I was tired, I pressed send.\",\"answers\":[\"Despite the fact that I was tired, I pressed send.\",\"Despite being tired, I pressed send.\",\"Even though I was tired, I pressed send.\"],\"why\":\"Despite no traga una frase pelada. O le pones the fact that, o un -ing, o cambias a even though. Las tres valen; la que el módulo enseña es the fact that.\",\"translation\":\"A pesar de que estaba cansada, pulsé enviar.\",\"itemIds\":[\"enb2m6despithefact\",\"enb2m6pressedsend\",\"enb1m8eventhough\"]},{\"id\":\"enb2m6l8e2\",\"type\":\"cloze\",\"prompt\":\"Completa la concesión de relato\",\"text\":\"I was exhausted. ___ so, I should have waited.\",\"answers\":[\"Even\"],\"translation\":\"Estaba agotada. Aun así, debería haber esperado.\",\"hints\":[\"Cuatro letras, empiezan por E\",\"Ev...\"],\"itemIds\":[\"enb2m6evenso\",\"enb2m6shouldhavetoldyou\"],\"tip\":\"Even so mira hacia el dato anterior y no se lo come. Even though abriría una subordinada nueva.\"},{\"id\":\"enb2m6l8e3\",\"type\":\"gapbank\",\"prompt\":\"Completa el relato — without therefore/thus en el mismo banco\",\"text\":\"I regret ___ it. Despite the ___ that I had a point about the rota, the wording was off. Even ___, I pressed send. On reflection I got a second draft ___, and I still owe Priya the four steps.\",\"answers\":[\"sending\",\"fact\",\"so\",\"done\"],\"bank\":[\"sending\",\"fact\",\"so\",\"done\",\"to send\",\"reason\",\"if\",\"made\"],\"translation\":\"Lamento haberlo enviado. A pesar de que tenía razón con el turno, la redacción no era la que tocaba. Aun así, pulsé enviar. Pensándolo bien, conseguí sacar un segundo borrador, y todavía le debo a Priya los cuatro pasos.\",\"itemIds\":[\"enb2m6aregret\",\"enb2m6despithefact\",\"enb2m6evenso\",\"enb2m6igotitdone\",\"enb2m6onreflection\"],\"tip\":\"«To send» está de distractor porque es el otro regret. «Made» está porque get it done no es make it. El hueco 4 es causativo de calle.\"},{\"id\":\"enb2m6l8e4\",\"type\":\"write\",\"prompt\":\"El relato del error. 150-200 palabras, a Amy, que no estaba. Género: story. Registro directo.\",\"scenario\":\"Amy te pide por escrito qué pasó con Priya. No es una disculpa a Priya (eso ya lo enviaste): es el relato de un error, con un tercer condicional, un should/ought to have, y un cierre con on reflection o even so.\",\"genre\":\"story\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Amy\",\"text\":\"Right. What actually happened with Priya? Write it down for me, the whole thing, not the apology — I know you sent that. I want the afternoon.\"},\"bullets\":[\"Cuenta qué enviaste y por qué el tono falló, con un tercer condicional.\",\"Incluye un should have / ought to have y una medida (segundo borrador, esperar, hacer que alguien lo lea).\",\"Cierra con on reflection / even so / in hindsight, no con «that's it».\"],\"checks\":[{\"re\":\"if i had\",\"label\":\"Hay un tercer condicional (If I had…)\"},{\"re\":\"(should have|ought to have|should've)\",\"label\":\"Hay un should/ought to have\"},{\"re\":\"(on reflection|even so|in hindsight)\",\"label\":\"Cierras con un conector de arrepentimiento\"}],\"frame\":[\"Qué pasó, en orden: el turno, el correo, el send\",\"If I had…, I would have…\",\"In hindsight / I ought to have…\",\"Qué has hecho desde entonces (four steps, second draft, got Sam to read it)\",\"On reflection… / Even so…\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"in hindsight\",\"even so\",\"on reflection\",\"despite the fact that\",\"if I had\",\"anyway\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"Amy — here it is, the afternoon, not the apology.\\nI had a fair point about the rota and I put it in the first sentence. Then I wrote a second one I would not have written if I had waited. Despite the fact that the rota still needs fixing, the wording was off, and it came across as rude. I pressed send before Sam could look at it. In hindsight I ought to have given it a second look, and I could have asked him to read it: I got him to help with worse things last year. Even so, I sent it. I have now done the four steps to Priya, and she has accepted the apology and not the mess around the rota, which is fair. On reflection I was unfair, and I regret sending it. If I had realised how it would land, I wouldn't have pressed send. That's the afternoon.\",\"itemIds\":[\"enb2m6ifihadknown\",\"enb2m6oughttohavechecked\",\"enb2m6despithefact\",\"enb2m6evenso\",\"enb2m6onreflection\",\"enb2m6aregret\",\"enb2m6cameacrossas\",\"enb2m6pressedsend\"],\"tip\":\"Cuenta los condicionales: el modelo tiene dos. Y fíjate en el registro: es a Amy, así que no hay Dear Sir. Direct no es My bad en cada línea; es claridad sin fórmula de comité.\"},{\"id\":\"enb2m6l8e5\",\"type\":\"build\",\"prompt\":\"Construye el causativo de calle\",\"target\":\"I got it done\",\"translation\":\"Conseguí que se hiciera\",\"distractors\":[\"make\",\"did\"],\"itemIds\":[\"enb2m6igotitdone\"],\"tip\":\"Get it done es bloque. Make it done no existe; did it es que lo hiciste tú.\"},{\"id\":\"enb2m6l8e6\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa en un relato?\",\"source\":\"Even so, I should have waited.\",\"answers\":[\"Aun así, debería haber esperado\",\"Aun así debería haber esperado\",\"A pesar de eso, debería haber esperado\"],\"itemIds\":[\"enb2m6evenso\"],\"tip\":\"Even so no es even though. So aquí es «así», no «tan».\"},{\"id\":\"enb2m6l8e7\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Lamento haberlo enviado, a pesar de que tenía razón.\",\"answers\":[\"I regret sending it, despite the fact that I was right\",\"I regret sending it despite the fact that I was right\",\"I regret sending it, despite the fact that I had a point\"],\"hints\":[\"Regret + -ing, y despite the fact that + frase\",\"I regret sending it, despite the fact that ...\"],\"itemIds\":[\"enb2m6aregret\",\"enb2m6despithefact\"],\"tip\":\"Dos máquinas en una línea: el arrepentimiento del acto y la concesión del fondo. Eso es el relato de un error de B2, no una lista de excusas.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_
