Sofía las in der U-Bahn einen Wiener Kommentar mit Stiege und Jänner.\",\"An der Fußnote erkannte sie die Wörter, ohne sie in ihr Heft zu übernehmen.\",\"Nico sagte in der Küche: Kriegst du das hin? — und sie übersetzte im Kopf: Schaffst du das?\",\"Am Abend schrieb sie an Frau Schuster auf Standarddeutsch, mit ß und Januar.\"],\"itemIds\":[\"b2m10fussnote\",\"b2m10kriegen\",\"b2m10produktion\"]},{\"id\":\"b2m10l9exi1\",\"type\":\"mc\",\"prompt\":\"Inferencia: por qué no copia Stiege\",\"question\":\"Sofía reconoce Stiege y no la apunta en el cuaderno. ¿Por qué?\",\"options\":[\"Porque no entiende la palabra y no quiere dejar rastro del fallo\",\"Porque Nico le ha prohibido los austriacismos\",\"Porque reconocer no es producir: la nota al pie es el contrato de leer; la carta a Schuster, el del examen\"],\"answer\":2,\"whyWrong\":[\"La nota al pie se la explica; no hay fallo que esconder\",\"Nico habla en la cocina, no legisla el cuaderno\",null],\"itemIds\":[\"b2m10fussnote\",\"b2m10produktion\",\"b1m7festiege\"]},{\"id\":\"b2m10l9exi2\",\"type\":\"mc\",\"prompt\":\"Inferencia: traducir a Nico sin corregirle\",\"question\":\"Nico dice «Kriegst du das hin?» y Sofía traduce en la cabeza, sin corregirle. ¿Por qué?\",\"options\":[\"Porque el registro de la cocina admite kriegen; corregirle sería colar el examen en la amistad\",\"Porque no conoce erhalten y no se atreve\",\"Porque Frau Schuster está al otro lado de la pared\"],\"answer\":0,\"whyWrong\":[null,\"Por la noche escribe erhalten sin dudar: sí lo conoce\",\"Schuster es la destinataria del correo, no una vecina que escucha\"],\"itemIds\":[\"b2m10kriegen\",\"b2m10erhalten\",\"b2m10register\"]},{\"id\":\"b2m10l9e2\",\"type\":\"match\",\"prompt\":\"Tramo del Vortrag y fórmula\",\"pairs\":[{\"target\":\"Deutsch ist plurizentrisch: DE, AT, CH.\",\"source\":\"entrada\"},{\"target\":\"Jänner erkenne ich; Januar schreibe ich.\",\"source\":\"reconocer / producir\"},{\"target\":\"Kriegen ist kein Fehler — außer im Register.\",\"source\":\"clínica de traje\"},{\"target\":\"An der Wortbildung leite ich ab, was ich nicht gelernt habe.\",\"source\":\"red ante lo no visto\"}],\"itemIds\":[\"b2m10plurizentrisch\",\"b2m10wortbildung\",\"b2m10ableiten\"]},{\"id\":\"b2m10l9e3\",\"type\":\"monologue\",\"prompt\":\"Vortrag de 4 minutos. Planifica, habla, repite.\",\"topic\":\"Deutsch ist nicht gleich Deutsch: was ich erkenne, was ich schreibe\",\"slides\":[{\"title\":\"Einstieg\",\"hint\":\"Drei Normen, ein Exam. Ich möchte den Unterschied zwischen Erkennen und Produzieren klären.\"},{\"title\":\"Plurizentrisch lesen\",\"hint\":\"Jänner, Stiege, Strasse, Natel, RAV — Fußnote, nicht Panik.\"},{\"title\":\"Standard schreiben\",\"hint\":\"Im Goethe: Januar, Treppe, Straße. Zeitung vor Ort: anderer Vertrag.\"},{\"title\":\"Register\",\"hint\":\"kriegen / erhalten, Kumpel / Kollege. Das Amtsdeutsch ist kein Land.\"},{\"title\":\"Wortbildung und Schluss\",\"hint\":\"ableiten, wenn die Liste fehlt. Lesen plurizentrisch, schreiben deutsch.\"}],\"planSeconds\":180,\"speakSeconds\":240,\"reps\":2,\"checklist\":[\"Di que el alemán es pluricéntrico y nombré DE/AT/CH\",\"Di al menos dos regionalismos de reconocimiento y su pareja de producción\",\"Separé periódico local y Goethe como dos contratos\",\"Toqué el registro (kriegen/erhalten o Kumpel) y la Wortbildung\",\"Cerré con la frase del módulo y hablé cerca de 4 minutos en las dos pasadas\"],\"model\":\"Einstieg (modelo): „Deutsch ist plurizentrisch, und trotzdem hat das Goethe-Zertifikat B2 eine Produktionsnorm. Jänner erkenne ich in einem Wiener Text; Januar schreibe ich. Dasselbe gilt für Stiege und Treppe, für Strasse und Straße. Eine Zeitung vor Ort hat einen anderen Vertrag als der Forumsbeitrag. Kriegen ist in der Küche geläufig; in der Nachricht an den Chef heißt es erhalten. Und wenn eine Wortliste fehlt, leite ich über die Wortbildung ab. Lesen plurizentrisch, schreiben deutsch — das halte ich für ausgesprochen gelungen.“\",\"itemIds\":[\"b2m1 "außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Sibylle G. möchte ich Folgendes sagen: Zwar stimmt, dass Strasse in Bern die eigene Norm ist. Allerdings ist der Forumsbeitrag des Goethe ein anderer Vertrag: man liest die Fußnote und schreibt Straße. Ein Vorteil der Plurizentrik im Lesen ist, dass Wien und Bern nicht als Fehler gelten. Ein Nachteil ist, sie in die Produktion zu kippen und Lärm für Niveau zu halten. Deshalb sollte man Jänner erkennen und Januar schreiben. Außerdem gehört kriegen nicht in die Nachricht an die Prüferin, sondern erhalten. Ich plädiere dafür, drinnen die Herkunft zu hören und nach außen die Form zu wählen, weil nur so die Akte denselben Satz trägt. Das ist Höflichkeit, nicht Verrat. Nur so bleibt die Sache nachvollziehbar. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll.\",\"itemIds\":[],\"tip\":\"150 palabras: intro, concesión, dos argumentos, propuesta, cierre. Off-topic = 0.\"},{\"id\":\"b2m10l9extra1\",\"type\":\"errorfix\",\"prompt\":\"Producción: Januar, no Jänner.\",\"wrong\":\"Eva Pichler schreibt Jänner im Forumsbeitrag.\",\"answers\":[\"Eva Pichler schreibt Januar im Forumsbeitrag.\"],\"why\":\"Jänner se lee; en el Goethe se produce Januar. Un cambio, no un discurso.\",\"translation\":\"Eva Pichler escribe Januar en el comentario de foro.\",\"itemIds\":[]},{\"id\":\"b2m10l9extra2\",\"type\":\"transform\",\"prompt\":\"Registro escrito\",\"source\":\"Das ist echt stark.\",\"instruction\":\"Reescríbelo en registro de examen.\",\"answers\":[\"Das halte ich für ausgesprochen gelungen.\"],\"translation\":\"elogio de examen\",\"itemIds\":[]},{\"id\":\"b2m10l9extra3\",\"type\":\"errorfix\",\"prompt\":\"Registro: erhalten, no kriegen.\",\"wrong\":\"Ich kriege die Bestätigung morgen.
