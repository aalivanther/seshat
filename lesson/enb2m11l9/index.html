two thousand aside for the garden this year and the rest on a boiler that lasts?|Nora?|If there's a date for the lift, I can live with that.|There ought to be a date, then. Not a promise — a date.|Shall we agree on that? Boiler, a little garden, lift in writing for October.|Let's just call it. I'm on a shift at five.|Write it down, Tomasz.|Already have.\",\"question\":\"¿Cuál es el plan con el que salen?\",\"options\":[\"Caldera, un poco de jardín este año, y el ascensor por escrito para octubre.\",\"Pintar el portal y dejar el resto para otro día.\",\"Darle todo a Nora, que es quien más lo necesita.\"],\"answer\":0,\"whyWrong\":[null,\"Ben no está en este cierre. La pintura se ha caído.\",\"Nora cede a cambio de una fecha. Eso ES el compromiso.\"],\"itemIds\":[\"enb2m11aplanorarrangement\",\"enb2m11shallweagreeon\",\"enb2m11thereoughttobe\"]},{\"id\":\"enb2m11l9e3\",\"type\":\"monologue\",\"prompt\":\"Speaking Part 4, reloj de B2: 30 segundos y DOS MINUTOS. Un desacuerdo que acabó en plan.\",\"topic\":\"A time you had to reach a plan with people who did not want the same thing\",\"planSeconds\":30,\"speakSeconds\":120,\"reps\":2,\"slides\":[{\"title\":\"1. Anuncia\",\"hint\":\"«I'll talk about a residents' meeting. Three things: the money, the ideas, the plan we left with.»\"},{\"title\":\"2. El desacuerdo\",\"hint\":\"Four ideas. I see it rather differently. I'd rather we didn't… What if we…\"},{\"title\":\"3. El cierre\",\"hint\":\"Shall we agree on…? There ought to be… A date, not a promise.\"},{\"title\":\"4. Por qué importaba\",\"hint\":\"Equal opportunities / step-free access / care for the elderly. And that's what I wanted to say.\"}],\"checklist\":[\"Hablé al menos 1:45\",\"Anuncié el número de puntos\",\"Rechacé algo CON alternativa\",\"Cerré con un plan (Shall we agree / we decided to…)\",\"Mencioné un derecho o un deber, no solo el dinero\",\"Segunda pasada sin pistas\"],\"model\":\"Solo el punto 3: «I'd rather we didn't spend the whole fund on paint. What if we split it — a boiler that lasts, a little on the garden, and a date in writing for the lift? Nora said she could live with that if the date was real. Shall we agree on October, then? We did. Tomasz wrote it down before anyone could un-agree.»\",\"itemIds\":[\"enb2m11whatifwesplits\",\"enb2m11shallweagreeon\",\"enb2m11equalopportunities\"]},{\"id\":\"enb2m11l9e4\",\"type\":\"speak\",\"prompt\":\"La queja moral de examen\",\"text\":\"That strikes me as unfair.\",\"phonetic\":\"dat stráiks mi as an-FÉA\",\"translation\":\"Eso me parece injusto.\",\"itemIds\":[\"enb2m11thatstrikemeasunfair\"]},{\"id\":\"enb2m11l9e5\",\"type\":\"transform\",\"prompt\":\"Cierra, con Shall we agree on\",\"source\":\"So… the boiler, a bit of garden, and October for the lift?\",\"instruction\":\"Shall we agree on that?\",\"answers\":[\"Shall we agree on that?\",\"Shall we agree on that, then?\",\"Shall we agree on the boiler, a bit of garden, and October for the lift?\"],\"itemIds\":[\"enb2m11shallweagreeon\"]},{\"id\":\"enb2m11l9exw1\",\"type\":\"write\",\"prompt\":\"Writing 1 · formal 100-150. Off-topic = 0.\",\"scenario\":\"Write to Mr Patel at the council: the hall booking system gives the same two groups every late slot. Fair shares. Polite, 100-150. Off-topic = 0.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"bullets\":[\"Open with the purpose.\",\"One reason and one request.\",\"Close politely.\"],\"checks\":[{\"re\":\"(Dear|I am writing)\",\"label\":\"apertura formal\"},{\"re\":\"(could|would|please)\",\"label\":\"petición educada\"},{\"re\":\"(Yours sincerely|Kind regards)\",\"label\":\"cierre\"}],\"minWords\":100,\"maxWords\":150,\"model\":\"Dear Mr Patel,\\nI am writing about the late slot in the community hall. The same two groups have held Thursday after nine for a year, and newer residents cannot get a fair share of the room. Could you publish the waiting list, please, and rotate one Thursday a month? I would be grateful if you could also say how a new group applies, because the form on the door still points to an email that bounces. Please let me know by Friday whether a trial month is possible. Fair shares are not a slogan on the noticeboard if the key stays with the same two names.\\nKind regards,\\nValeria Soto\",\"itemIds\":[],\"tip\":\"Off-topic = 0. Could/would, not Give me.\"},{\"id\":\"enb2m11l9exw2\",\"type\":\"write\",\"prompt\":\"Writing 2 · 150-200. Off-topic = 0.\",\"scenario\":\"College magazine: who gets the last hour of the hall. Fair shares, one idea per paragraph. Off-topic = 0.\",\"genre\":\"article\",\"register\":\"polite\",\"bullets\":[\"Topic sentence first.\",\"One example.\",\"A close that does not copy the opening.\"],\"checks\":[{\"re\":\"(The problem is|The reason|First)\",\"label\":\"frase-tema\"},{\"re\":\"(for example|for instance)\",\"label\":\"ejemplo\"},{\"re\":\"(Could we|I would keep|I would)\",\"label\":\"cierre con propuesta\"}],\"minWords\":150,\"maxWords\":200,\"model\":\"The problem is that a 'first come' list is not a fair share when the first names never leave. The late hour is the only one a night-bus driver can use, and it has sat with two clubs since last winter. For example, the Tuesday chess group books in January and the form is full before the new year starts. I would keep a rotating Thursday and measure who actually comes after nine for a month. Could we at least try that, please, before anyone calls the empty chairs proof that nobody wants the room? A fair share is a rule you can check, not a feeling about who belongs. If the corner stays empty under a new name, we revisit. If it fills, the old list was never the whole street. That hour is not a luxury; it is the only hour that works. That hour is not a luxury; it is the only hour that works.\",\"itemIds\":[],\"tip\":\"Una idea por párrafo. Off-topic = 0.\"},{\"id\":\"enb2m11l9exd1\",\"type\":\"transform\",\"prompt\":\"Contraste.\",\"source\":\"Group A has the slot. Group B does not.\",\"instruction\":\"Un solo periodo con whereas.\",\"answers\":[\"Group A has the slot, whereas group B does not.\"],\"translation\":\"A tiene el hueco, mientras que B no.\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd2\",\"type\":\"errorfix\",\"prompt\":\"Fair shares, no fair share's.\",\"wrong\":\"The hall needs a fair share's list.\",\"answers\":[\"The hall needs a fair-shares list.\"],\"why\":\"El genitivo inglés no convierte el nombre del módulo en posesión.\",\"translation\":\"La sala necesita una lista de turnos justos.\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd3\",\"type\":\"cloze\",\"prompt\":\"Lista de espera.\",\"text\":\"Could you publish the waiting ___, please?\",\"answers\":[\"list\"],\"translation\":\"¿Podría publicar la lista de espera?\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd4\",\"type\":\"transform\",\"prompt\":\"Pasiva impersonal.\",\"source\":\"People believe the late slot is full.\",\"instruction\":\"It is widely believed…\",\"answers\":[\"It is widely believed that the late slot is full.\"],\"translation\":\"Se cree que el último hueco está lleno.\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd5\",\"type\":\"errorfix\",\"prompt\":\"Could, no Give me.\",\"wrong\":\"Give me the waiting list, please.\",\"answers\":[\"Could you give me the waiting list, please?\"],\"why\":\"Registro polite: Could you… please, no imperativo pelado.\",\"translation\":\"¿Podría enviarme la lista para el viernes?\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd6\",\"type\":\"cloze\",\"prompt\":\"Rotar.\",\"text\":\"I would ___ one Thursday a month.\",\"answers\":[\"rotate\"],\"translation\":\"Yo rotaría un jueves al mes.\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd7\",\"type\":\"transform\",\"prompt\":\"Concesión.\",\"source\":\"The list is old. It still decides.\",\"instruction\":\"Admittedly… Nevertheless…\",\"answers\":[\"Admittedly the list is old. Nevertheless it still decides.\"],\"translation\":\"Cierto, la lista es vieja. Aun así decide.\",\"itemIds\":[]},{\"id\":\"enb2m11l9exd8\",\"type\":\"errorfix\",\"prompt\":\"Presente, no pasado, en la regla.\",\"wrong\":\"A fair share was a rule you can check.\",\"answers\":[\"A fair share is a rule you can check.\"],\"why\":\"La definición va en presente: es una regla, no fue una.\",\"translation\":\"Un reparto justo es una regla que se puede comprobar.\",\"itemIds\":[]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m11-4\",\"book\":\"That is not fair.\",\"real\":\"That's out of order.\",\"meaning\":\"Eso no se hace / eso es injusto.\",\"when\":\"Out of order, dicho de una persona o de una decisión, es moral, no mecánico (el ascensor out of order es otra ficha, del A2). En el oral y en la carta, That strikes me as unfair. That is not fair es el libro, y se queda corto de rango.\",\"register\":\"amigos\",\"exam\":\"That strikes me as unfair.\",\"note\":\"Out of order de máquina y out of order de conducta se distinguen por el sujeto: the lift / that (lo que acaba de decir alguien).\",\"sound\":\"dats áut ov ÓO-da\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m11thatstrikemeasunfair\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Sesh
