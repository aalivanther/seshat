as\",\"itemIds\":[\"b1m6ichglaubedasswenn\",\"b1m6damit\",\"b1m6falls\",\"b1m6waehrend\",\"b1m6seitdem\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: cada subordinada cierra la SUYA\",\"body\":\"$17\",\"table\":[[\"bloque\",\"verbo que lo cierra\"],[\"Ich glaube,\",\"glaube (posición 2)\"],[\"dass er kommt,\",\"kommt\"],[\"wenn er Zeit hat.\",\"hat\"],[\"Ich spare, damit mein Sohn studieren kann.\",\"kann\"],[\"Seitdem ich hier wohne, spreche ich Deutsch.\",\"wohne · spreche (inversión)\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m6l3e1\",\"type\":\"mc\",\"prompt\":\"Cuenta los verbos\",\"question\":\"„Ich glaube, dass er kommt, wenn er Zeit hat.“ ¿Cuántas subordinadas hay?\",\"options\":[\"Ninguna: es una frase larga\",\"Una\",\"Dos\"],\"answer\":2,\"whyWrong\":[\"Hay dos comas y dos conectores: hay subordinadas\",\"dass abre una y wenn abre otra\",null],\"itemIds\":[\"b1m6ichglaubedasswenn\"],\"tip\":\"Regla de la barra: una barra en cada coma. Cada trozo cierra con su propio verbo.\"},{\"id\":\"b1m6l3e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich glaube, dass er kommt, wenn er hat Zeit.\",\"answers\":[\"Ich glaube, dass er kommt, wenn er Zeit hat.\",\"Ich glaube, dass er kommt, wenn er Zeit hat\"],\"why\":\"La segunda subordinada también manda su verbo al final: wenn er Zeit hat. Al encadenar, el alumno cuida la primera y se olvida de la segunda: es el error §6.3 del nivel.\",\"translation\":\"Creo que viene si tiene tiempo.\",\"itemIds\":[\"b1m6ichglaubedasswenn\"]},{\"id\":\"b1m6l3e3\",\"type\":\"match\",\"prompt\":\"Empareja conector y significado\",\"pairs\":[{\"target\":\"damit\",\"source\":\"para que (sujetos distintos)\"},{\"target\":\"falls\",\"source\":\"en caso de que\"},{\"target\":\"während\",\"source\":\"mientras\"},{\"target\":\"seitdem\",\"source\":\"desde que\"}],\"itemIds\":[\"b1m6damit\",\"b1m6falls\",\"b1m6waehrend\",\"b1m6seitdem\"]},{\"id\":\"b1m6l3e4\",\"type\":\"mc\",\"prompt\":\"damit o um … zu\",\"question\":\"«Ahorro para que mi hijo pueda estudiar» →\",\"options\":[\"Ich spare, um mein Sohn zu studieren.\",\"Ich spare, damit mein Sohn studieren kann.\"],\"answer\":1,\"whyWrong\":[\"um … zu solo vale si el sujeto es el MISMO en las dos partes. Aquí ahorro yo y estudia él\",null],\"itemIds\":[\"b1m6damit\",\"b1m6studium\"],\"tip\":\"Mismo sujeto → um … zu · sujetos distintos → damit. El español «para» no distingue, y ahí se pierden puntos.\"},{\"id\":\"b1m6l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa el conector temporal\",\"text\":\"___ ich in Wien wohne, spreche ich jeden Tag Deutsch.\",\"answers\":[\"Seitdem\",\"Seit\"],\"translation\":\"Desde que vivo en Viena hablo alemán todos los días.\",\"hints\":[\"«desde que» + verbo al final\",\"Seit...\"],\"itemIds\":[\"b1m6seitdem\"],\"tip\":\"Y ojo con el tiempo verbal: en alemán es PRESENTE (wohne, spreche). «Llevo dos años aquí» = Ich wohne seit zwei Jahren hier.\"},{\"id\":\"b1m6l3e6\",\"type\":\"gapbank\",\"prompt\":\"Completa el plan con el banco de conectores\",\"text\":\"Ich lerne jeden Abend, ___ ich die Prüfung bestehe. ___ ich durchfalle, wiederhole ich den Kurs. ___ ich lerne, passt meine Mutter auf das Kind auf.\",\"answers\":[\"damit\",\"Falls\",\"Während\"],\"bank\":[\"damit\",\"Falls\",\"Während\",\"Obwohl\",\"Deshalb\",\"Trotzdem\"],\"translation\":\"Estudio cada tarde para aprobar el examen. En caso de que suspenda, repito el curso. Mientras estudio, mi madre cuida del niño.\",\"itemIds\":[\"b1m6damit\",\"b1m6falls\",\"b1m6waehrend\",\"b1m6bestanden\",\"b1m6durchgefallen\"],\"tip\":\"Los tres son subordinantes: los tres mandan su verbo al final (bestehe, durchfalle, lerne).\"},{\"id\":\"b1m6l3e7\",\"type\":\"build\",\"prompt\":\"Construye la cadena entera\",\"target\":\"Ich glaube, dass sie einen Platz bekommt, wenn sie sich früh anmeldet\",\"translation\":\"Creo que consigue plaza si se apunta pronto\",\"distractors\":[\"deshalb\",\"meldet\"],\"itemIds\":[\"b1m6ichglaubedasswenn\",\"b1m6krippenplatz\",\"b1m6sichanmeldenfuer\"],\"tip\":\"Tres bloques, tres verbos al final de lo suyo: glaube · bekommt · anmeldet.\"},{\"id\":\"b1m6l3e8\",\"type\":\"errorfix\",\"prompt\":\"Otro clásico. Arréglalo.\",\"wrong\":\"Während ich lerne, mein Mann kocht.\",\"answers\":[\"Während ich lerne, kocht mein Mann.\",\"Während ich lerne, kocht mein Mann\"],\"why\":\"La subordinada antepuesta ocupa la posición 1 → la principal empieza por su verbo (kocht) y el sujeto va detrás. Es la misma inversión de «Gestern habe ich…», ahora con una subordinada delante.\",\"translation\":\"Mientras yo estudio, mi marido cocina.\",\"itemIds\":[\"b1m6waehrend\"]},{\"id\":\"b1m6l3e9\",\"type\":\"transform\",\"prompt\":\"Transforma: pon la subordinada delante\",\"source\":\"Ich melde mich an, falls es noch Plätze gibt.\",\"instruction\":\"Empieza la frase por falls\",\"answers\":[\"Falls es noch Plätze gibt, melde ich mich an\",\"Falls es noch Plätze gibt, melde ich mich an.\"],\"translation\":\"Si aún quedan plazas, me apunto.\",\"hints\":[\"Subordinada delante → la principal empieza por el verbo\",\"Falls es noch Plätze gibt, melde ...\"],\"itemIds\":[\"b1m6falls\",\"b1m6sichanmeldenfuer\"]},{\"id\":\"b1m6l3e10\",\"type\":\"listen\",\"prompt\":\"Escucha la frase encadenada y transcríbela\",\"text\":\"Ich glaube, dass er kommt, wenn er Zeit hat\",\"translation\":\"Creo que viene si tiene tiempo\",\"hints\":[\"Tres bloques separados por comas\",\"Ich glaube, dass er kommt, wenn ...\"],\"itemIds\":[\"b1m6ichglaubedasswenn\"]},{\"id\":\"b1m6l3e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera (mismo sujeto)\",\"source\":\"Ich lerne viel, damit ich die Prüfung bestehe.\",\"forbid\":[\"damit\",\"bestehe\"],\"answers\":[\"Ich lerne viel, um die Prüfung zu bestehen\",\"Ich lerne viel, um die Prüfung zu bestehen.\",\"Ich lerne viel, um die Prüfung zu schaffen\",\"Ich lerne viel, um die Prüfung zu schaffen.\"],\"translation\":\"Estudio mucho para aprobar el examen.\",\"hints\":[\"Mismo sujeto en las dos partes → um … zu\",\"Ich lerne viel, um die Prüfung zu ...\"],\"itemIds\":[\"b1m6damit\",\"b1m6bestanden\"],\"tip\":\"Con el mismo sujeto, um … zu es más natural que damit. Los nativos usan damit sobre todo cuando el sujeto cambia.\"},{\"id\":\"b1m6l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Ahorro para que mi hija pueda estudiar\",\"answers\":[\"Ich spare, damit meine Tochter studieren kann\",\"Ich spare, damit meine Tochter studieren kann.\"],\"hints\":[\"Sujetos distintos → damit, y el modal al final\",\"Ich spare, damit meine Tochter ...\"],\"itemIds\":[\"b1m6damit\",\"b1m6studium\"],\"tip\":\"damit + modal al final: una sola frase que demuestra dos reglas. Justo lo que premia el criterio «Strukturen».\"}]}],\"resources\":[{\"label\":\"Nicos Weg — B1\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"En el B1 de DW busca «Nebensätze»: diálogos con frases encadenadas dichas a velocidad real.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"m
