tatic/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T4ba,\u003ci\u003eLee en voz alta. El esqueleto de hoy es el de la síntesis, no el de la opinión.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eLena Krüger erteilte Hofmann das Wort und danach Vogel. Beide sahen nachts eine [[Lücke|laguna]]; sie nannten nicht dieselbe. Hofmann forderte die Verbindung für die Schicht. Vogel den [[Halt vor der Tür|aparcamiento ante la puerta]]. Sofía schrieb das [[Protokoll|acta]] ohne Wertung: Forderungen hinein, Adjektive raus. Die [[Diskrepanz|discrepancia]] ließ sie stehen. Einen Feind setzte sie nicht.\u003cbr/\u003e\u003cbr/\u003eKai bat, den [[Betriebsrat|comité de empresa]] und die Anwohner hinzuzufügen. Nicht weil er eine Seite wählte. Weil ein Protokoll, das eine Partei unsichtbar lässt, schon Partei ergriffen hat und es Zusammenfassung nennt. Lena notierte es. Zusammenfassend ließ sich sagen: zwei Lücken, eine Straße.\u003cbr/\u003e\u003cbr/\u003eLucía Ortega in Valencia bekam denselben Inhalt auf Spanisch, ohne die Wörter des Originals. Wenn der Inhalt die Sprache wechselt und überlebt, war es ein [[wesentlicher Inhalt|contenido esencial]]. Wenn nur Hofmanns Adjektive überleben, war es ein Leserbrief mit Datum. Der [[Dritte|tercero]] muss verstehen, was gefordert wird — auch wenn er in einer anderen Sprache liest."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m11l9\",\"phaseId\":\"b2m11\",\"title\":\"Vortrag: zwei Texte, ein Dritter\",\"subtitle\":\"Cuatro minutos de síntesis — y luego preguntas\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Abrir, atribuir, contrastar, cerrar\",\"itemIds\":[\"b2m5vermitteln\",\"b2m11natfasse\",\"b2m11moderation\",\"b2m11wesentlicherinhalt\",\"b2m11natalsoquasi\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Zwei Texte, ein Protokoll, und Lucía in Valencia\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m11l9e1\",\"type\":\"order\",\"prompt\":\"El relato de la Winsstraße\",\"sentences\":[\"Lena Krüger erteilte Hofmann das Wort und danach Vogel.\",\"Sofía schrieb das Protokoll ohne Wertung.\",\"Kai bat, den Betriebsrat und die Anwohner hinzuzufügen.\",\"Lucía in Valencia bekam denselben Inhalt auf Spanisch, ohne die Wörter des Originals.\"],\"itemIds\":[\"b2m11worterteilen\",\"b2m5protokoll\",\"b2m11hinzufuegen\",\"b2m11uebertragen\"]},{\"id\":\"b2m11l9exi1\",\"type\":\"mc\",\"prompt\":\"Inferencia: el español de Lucía\",\"question\":\"Lucía recibe el mismo contenido en español, sin las palabras del original. ¿Qué demuestra eso que el «ohne Wertung» del acta no llega a decir?\",\"options\":[\"Que Lucía habla mejor alemán que Sofía y por eso no necesita el original\",\"Que el Bezirksamt ha pedido una versión en español\",\"Que el contenido sobrevivió al cambio de lengua: si solo viajan los adjetivos de Hofmann, no era un resumen\"],\"answer\":2,\"whyWrong\":[\"Lucía lee el resultado, no el original; el relato no compara niveles\",\"Nadie en el Amt pide castellano; Lucía es la amiga del intercambio\",null],\"itemIds\":[\"b2m11uebertragen\",\"b2m11wesentlicherinhalt\",\"b2m11derdritte\"]},{\"id\":\"b2m11l9exi2\",\"type\":\"mc\",\"prompt\":\"Inferencia: por qué Kai añade y no elige\",\"question\":\"Kai pide añadir el Betriebsrat y los vecinos. ¿Por qué no elige bando?\",\"options\":[\"Porque el oficio del acta no es elegir: es no volver invisible a una parte\",\"Porque detesta a Hofmann y no quiere firmar su bus\",\"Porque Lena ha olvidado la fecha de la votación\"],\"answer\":0,\"whyWrong\":[null,\"Kai apoya el bus en la tertulia; aquí pide visibilidad, no un enemigo\",\"La votación es la semana siguiente; nadie ha perdido el calendario\"],\"itemIds\":[\"b2m11hinzufuegen\",\"b2m5protokoll\",\"b2m11ohnewertung\"]},{\"id\":\"b2m11l9e2\",\"type\":\"match\",\"prompt\":\"Tramo del Vortrag y fórmula\",\"pairs\":[{\"target\":\"Ich fasse den wesentlichen Inhalt kurz zusammen.\",\"source\":\"entrada / cierre\"},{\"target\":\"Beide Texte stimmen darin überein, dass …\",\"source\":\"acuerdo\"},{\"target\":\"Im Gegensatz zu A behauptet B …\",\"source\":\"contraste\"},{\"target\":\"Die Diskrepanz liegt in …\",\"source\":\"grieta\"}],\"itemIds\":[\"b2m11natfasse\",\"b2m11stimmenueberein\",\"b2m11imgegensatzzu\",\"b2m11diskrepanz\"]},{\"id\":\"b2m11l9e3\",\"type\":\"monologue\",\"prompt\":\"Vortrag de 4 minutos. Planifica, habla, repite.\",\"topic\":\"Zwei Texte, ein Protokoll: was der Dritte wissen muss\",\"slides\":[{\"title\":\"Einstieg\",\"hint\":\"Zwei Quellen zur Winsstraße. Ein Dritter, der sie nicht gelesen hat. Ich fasse zusammen, ich wähle nicht.\"},{\"title\":\"Übereinstimmung\",\"hint\":\"Beide sehen nachts eine Lücke.\"},{\"title\":\"Gegensatz\",\"hint\":\"Hofmann: Verbindung für die Schicht. Vogel: Halt vor dem Laden. wohingegen / im Gegensatz zu.\"},{\"title\":\"Diskrepanz\",\"hint\":\"Nicht der Wille — die Reihenfolge der Lücken. Was ins Protokoll gehört, was nicht.\"},{\"title\":\"Schluss und Fragen\",\"hint\":\"Zusammenfassend … Ich stehe für Fragen zur Verfügung.\"}],\"planSeconds\":180,\"speakSeconds\":240,\"reps\":2,\"checklist\":[\"Presenté dos fuentes y un tercero que no las ha leído\",\"Di el acuerdo (nachts eine Lücke) antes del contraste\",\"Nombré las dos Kernaussagen con im Gegensatz zu o wohingegen\",\"Marqué la Diskrepanz sin elegir bando — o marqué la opinión como mía y al final\",\"Cerré ofreciendo preguntas y hablé cerca de 4 minutos en las dos pasadas\"],\"model\":\"Einstieg (modelo): „Ich möchte Ihnen zwei Texte zur Winsstraße wiedergeben, für einen Dritten, der sie nicht gelesen hat. Beide stimmen darin überein, dass nachts etwas fehlt. Im Gegensatz zu Clara Hofmann, die eine Nachtlinie für die Schicht fordert, nennt Herr Vogel den Halt vor dem Laden. Die Diskrepan
