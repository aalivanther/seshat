päter\u003c/b\u003e (más tarde) → \u003cb\u003eam Abend\u003c/b\u003e (por la noche) — y \u003cb\u003eam Morgen\u003c/b\u003e para abrir. La elección en cada frase: ¿te moviste? → sein + participio (\u003ci\u003eZuerst \u003cb\u003esind\u003c/b\u003e wir zum Bahnhof \u003cb\u003egegangen\u003c/b\u003e\u003c/i\u003e). ¿Hiciste algo sin moverte? → haben + participio (\u003ci\u003eDann \u003cb\u003ehaben\u003c/b\u003e wir eine Fahrkarte \u003cb\u003egekauft\u003c/b\u003e\u003c/i\u003e). ¿Cómo estabas, qué tenías? → war/hatte directo (\u003ci\u003eAm Abend \u003cb\u003ewaren\u003c/b\u003e wir müde\u003c/i\u003e). Ojo a la posición: la señal de tiempo abre la frase → el verbo se queda en 2ª posición y el sujeto pasa detrás. Esa mezcla — Perfekt para lo que pasó, war/hatte para cómo era — es exactamente cómo narra un alemán.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m2l6e1\",\"type\":\"match\",\"prompt\":\"Ordena las señales del día\",\"pairs\":[{\"target\":\"zuerst\",\"source\":\"primero\"},{\"target\":\"später\",\"source\":\"más tarde\"},{\"target\":\"am Morgen\",\"source\":\"por la mañana\"},{\"target\":\"am Abend\",\"source\":\"por la tarde-noche\"}],\"itemIds\":[\"zuerst\",\"a2m2spaeter\",\"a2m2ammorgen\",\"amabend\"]},{\"id\":\"a2m2l6e2\",\"type\":\"cloze\",\"prompt\":\"Frase 1 del día: arranca la historia\",\"text\":\"___ sind wir zum Bahnhof gegangen. (primero)\",\"answers\":[\"Zuerst\"],\"translation\":\"Primero fuimos a la estación.\",\"hints\":[\"Tu señal A1 de «en primer lugar»\",\"Zu-erst, con mayúscula inicial\"],\"itemIds\":[\"zuerst\",\"gegangen\",\"bahnhof\"]},{\"id\":\"a2m2l6e3\",\"type\":\"cloze\",\"prompt\":\"Frase 2: ¿sein o haben?\",\"text\":\"Dann ___ wir eine Fahrkarte gekauft.\",\"answers\":[\"haben\"],\"translation\":\"Luego compramos un billete.\",\"hints\":[\"Comprar no te mueve del sitio\",\"h-a-b-e-n con wir\"],\"itemIds\":[\"dann\",\"gekauft\",\"fahrkarte\"],\"tip\":\"kaufen no es movimiento → haben. La señal de tiempo abre, haben se queda 2º.\"},{\"id\":\"a2m2l6e4\",\"type\":\"cloze\",\"prompt\":\"Frase 3: ¿sein o haben?\",\"text\":\"Später ___ wir ans Meer gefahren.\",\"answers\":[\"sind\"],\"translation\":\"Más tarde fuimos al mar.\",\"hints\":[\"fahren te lleva de A a B\",\"sein con wir\"],\"itemIds\":[\"a2m2spaeter\",\"a2m2ansmeer\",\"gefahren\"]},{\"id\":\"a2m2l6e5\",\"type\":\"cloze\",\"prompt\":\"Frase 4: el estado del final del día\",\"text\":\"Am Abend ___ wir müde, aber glücklich.\",\"answers\":[\"waren\"],\"translation\":\"Por la noche estábamos cansados, pero felices.\",\"hints\":[\"Estado → war/hatte, no Perfekt\",\"w-a-r-e-n con wir\"],\"itemIds\":[\"amabend\",\"muede\",\"gluecklich\"],\"tip\":\"Cómo estabas → war, directo y sin participio. Mezclar Perfekt y war así es narrar en alemán de verdad.\"},{\"id\":\"a2m2l6e6\",\"type\":\"mc\",\"prompt\":\"¿sein o haben? (interleaving)\",\"question\":\"Am Morgen ___ ich lange geschlafen.\",\"options\":[\"bin\",\"habe\"],\"answer\":1,\"whyWrong\":[\"Dormir no es movimiento ni cambio de estado — geschlafen va con haben. (Levantarse después, eso sí: bin aufgestanden)\",null],\"itemIds\":[\"a2m2ammorgen\"],\"tip\":\"El par del despertar: Ich habe geschlafen → Ich bin aufgestanden. Quieto con haben, cambio de estado con sein.\"},{\"id\":\"a2m2l6e7\",\"type\":\"build\",\"prompt\":\"Construye la cena del viaje\",\"target\":\"Am Abend haben wir viel gegessen\",\"translation\":\"Por la noche comimos mucho\",\"distractors\":[\"sind\",\"waren\"],\"itemIds\":[\"amabend\",\"gegessen\",\"viel\"],\"tip\":\"Am Abend abre → haben 2º y wir detrás. Comer va con haben — por mucho que te muevas al tenedor.\"},{\"id\":\"a2m2l6e8\",\"type\":\"build\",\"prompt\":\"Construye — con inversión libre\",\"target\":\"Später sind wir ins Hotel gegangen\",\"translation\":\"Más tarde fuimos al hotel\",\"distractors\":[\"haben\"],\"altTargets\":[\"Wir sind später ins Hotel gegangen\"],\"itemIds\":[\"a2m2spaeter\",\"hotel\",\"gegangen\"],\"tip\":\"Las dos versiones valen: Später delante (verbo 2º, wir detrás) o Wir delante. La pinza sein...gegangen no se toca.\"},{\"id\":\"a2m2l6e9\",\"type\":\"speak\",\"prompt\":\"Lee el día entero en voz alta (pulsa audio para comparar)\",\"text\":\"Zuerst waren wir am Strand und später im Hotel\",\"phonetic\":\"tsu-ÉAST VÁA-ren via am shtrant unt SHPÉE-ta im ho-TÉL\",\"translation\":\"Primero estuvimos en la playa y más tarde en el hotel\",\"itemIds\":[\"zuerst\",\"a2m2spaeter\",\"a2m2strand\",\"hotel\"]},{\"id\":\"a2m2l6e11\",\"type\":\"order\",\"prompt\":\"Ordena el día de viaje entero — la historia de las frases 1 a 4\",\"sentences\":[\"Zuerst sind wir zum Bahnhof gegangen.\",\"Dann haben wir eine Fahrkarte gekauft.\",\"Später sind wir ans Meer gefahren.\",\"Am Abend waren wir müde, aber glücklich.\"],\"translation\":\"Primero fuimos a la estación. Luego compramos un billete. Más tarde fuimos al mar. Por la noche estábamos cansados, pero felices.\",\"hints\":[\"Las señales mandan: zuerst → dann → später → am Abend\",\"El estado (waren) cierra el día\"],\"itemIds\":[\"zuerst\",\"gegangen\",\"dann\",\"fahrkarte\",\"gekauft\",\"a2m2spaeter\",\"a2m2ansmeer\",\"gefahren\",\"amabend\",\"muede\"],\"tip\":\"sein para moverte, haben para comprar, waren para cómo acabaste: la receta completa, ahora en orden.\"},{\"id\":\"a2m2l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Más tarde fuimos al mar\",\"answers\":[\"Später sind wir ans Meer gefahren\",\"Wir sind später ans Meer gefahren\"],\"hints\":[\"später delante → sind en 2ª posición\",\"ans Meer, con fahren y sein\"],\"itemIds\":[\"a2m2spaeter\",\"a2m2ansmeer\",\"gefahren\"],\"tip\":\"Señal de tiempo + sein + destino + participio: la frase-molde con la que puedes contar cualquier día de viaje.\"}]}],\"resources\":[{\"label\":\"lingua.com — lecturas A2\",\"url\":\"https://lingua.com/german/reading/\",\"note\":\"Textos «Mein Urlaub» en pasado: fíjate cómo alternan Perfekt y war/hatte, como en esta lección.\"},{\"label\":
