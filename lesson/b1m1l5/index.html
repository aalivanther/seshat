 \u003ci\u003edie Wohnung, die ich \u003cb\u003esuche\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003e· Una \u003cb\u003ecomparación\u003c/b\u003e («más caro \u003cu\u003eque\u003c/u\u003e en Viena») → \u003cb\u003eals\u003c/b\u003e. Y ojo: nunca «wie». \u003ci\u003ehöher \u003cb\u003eals\u003c/b\u003e in Wien\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eTruco operativo que funciona en caliente: \u003cb\u003esi puedes cambiar «que» por «el cual/la cual», es der/die/das. Si no, es dass.\u003c/b\u003e «El piso \u003ci\u003eel cual\u003c/i\u003e busco» ✓ → relativo. «Espero \u003ci\u003eel cual\u003c/i\u003e siga libre» ✗ → dass.\u003cbr/\u003e\u003cbr/\u003eBonus del nivel, porque en B1 ya opinas: \u003cb\u003eMeiner Meinung nach\u003c/b\u003e + verbo (jamás «in meiner Meinung»), y para negar y corregir, \u003cb\u003esondern\u003c/b\u003e tras negación: \u003ci\u003ekeine WG, \u003cb\u003esondern\u003c/b\u003e eine eigene Wohnung\u003c/i\u003e — «aber» ahí suena a traducción."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l5\",\"phaseId\":\"b1m1\",\"title\":\"Das „que“, das keins ist\",\"subtitle\":\"Clínica: dass · der/die/das · als — tres «que» distintos\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Un «que» para cada trabajo\",\"itemIds\":[\"b1m1dass\",\"b1m1als\",\"b1m1sondern\",\"b1m1meinermeinungnach\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el español tiene un «que»; el alemán tiene tres\",\"body\":\"$17\",\"table\":[[\"español\",\"alemán\",\"por qué\"],[\"Espero que esté libre\",\"Ich hoffe, dass sie frei ist\",\"frase entera → dass\"],[\"el piso que busco\",\"die Wohnung, die ich suche\",\"describe una cosa → relativo\"],[\"más caro que en Viena\",\"teurer als in Wien\",\"comparación → als\"],[\"cuando era niño\",\"als ich Kind war\",\"un momento único del pasado → als\"],[\"no una WG, sino un piso\",\"keine WG, sondern eine Wohnung\",\"tras negación → sondern\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Qué palabra falta en el hueco: dass o el relativo?\",\"categories\":[\"dass\",\"der / die / das (relativo)\"],\"items\":[{\"text\":\"Ich hoffe, ___ die Wohnung noch frei ist.\",\"bucket\":0},{\"text\":\"Die Wohnung, ___ ich gesehen habe, war zu teuer.\",\"bucket\":1},{\"text\":\"Ich glaube, ___ der Vermieter nett ist.\",\"bucket\":0},{\"text\":\"Der Vermieter, ___ die Wohnung zeigt, ist nett.\",\"bucket\":1},{\"text\":\"Es stimmt, ___ die Mieten steigen.\",\"bucket\":0},{\"text\":\"Die Mieten, ___ jedes Jahr steigen, sind ein Problem.\",\"bucket\":1}],\"itemIds\":[\"b1m1dass\",\"b1m1diewohnungdieichsuche\",\"b1m1vermieter\"],\"tip\":\"Mira lo que hay JUSTO antes del hueco: si es una coma detrás de un verbo de opinión (hoffe, glaube, stimmt), es dass. Si es un sustantivo, es relativo.\"},{\"id\":\"b1m1l5e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich suche eine Wohnung, dass hell ist.\",\"answers\":[\"Ich suche eine Wohnung, die hell ist.\"],\"why\":\"«dass» solo introduce frases enteras («espero QUE...»). Aquí el «que» describe el piso, así que es un relativo: die Wohnung → die.\",\"translation\":\"Busco un piso que sea luminoso.\",\"itemIds\":[\"b1m1dass\",\"b1m1einewohnungdiehellist\"]},{\"id\":\"b1m1l5e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich hoffe, dass die Wohnung ist noch frei.\",\"answers\":[\"Ich hoffe, dass die Wohnung noch frei ist.\"],\"why\":\"dass manda el verbo AL FINAL de su frase, como weil. El calco del español deja «ist» en segunda posición.\",\"translation\":\"Espero que el piso siga libre.\",\"itemIds\":[\"b1m1dass\"]},{\"id\":\"b1m1l5e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Die Miete ist höher wie in Wien.\",\"answers\":[\"Die Miete ist höher als in Wien.\"],\"why\":\"En comparaciones de desigualdad el alemán usa «als». «wie» solo vale para igualdad: so teuer wie in Wien.\",\"translation\":\"El alquiler es más alto que en Viena.\",\"itemIds\":[\"b1m1als\"]},{\"id\":\"b1m1l5e5\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"In meiner Meinung ist die Miete zu hoch.\",\"answers\":[\"Meiner Meinung nach ist die Miete zu hoch.\"],\"why\":\"«en mi opinión» no se traduce palabra por palabra: la fórmula alemana es «meiner Meinung nach», con «nach» DETRÁS y sin preposición delante.\",\"translation\":\"En mi opinión el alquiler es demasiado alto.\",\"itemIds\":[\"b1m1meinermeinungnach\",\"a2m6meinung\"]},{\"id\":\"b1m1l5e6\",\"type\":\"mc\",\"prompt\":\"El otro trabajo de «als»\",\"question\":\"„___ ich Kind war, haben wir in einem Altbau gewohnt.“\",\"options\":[\"Als\",\"Wenn\",\"Dass\"],\"answer\":0,\"whyWrong\":[null,\"wenn es «cuando» repetido o «si» — para UN momento único del pasado se usa als\",\"dass introduce una frase completiva, no un tiempo\"],\"itemIds\":[\"b1m1als\",\"b1m1altbau\"],\"tip\":\"als = una sola vez en el pasado · wenn = cada vez / si. Es el reparto que el español no hace.\"},{\"id\":\"b1m1l5e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el correo al casero\",\"text\":\"Sehr geehrte Frau Kaltenbach, ich habe gelesen, ___ die Wohnung noch frei ist. Es ist genau die Wohnung, ___ ich suche. Sie ist größer ___ meine jetzige Wohnung.\",\"answers\":[\"dass\",\"die\",\"als\"],\"bank\":[\"dass\",\"die\",\"als\",\"wie\",\"der\",\"den\"],\"translation\":\"Estimada Sra. Kaltenbach: he leído que el piso sigue libre. Es exactamente el piso que busco. Es más grande que mi piso actual.\",\"itemIds\":[\"b1m1dass\",\"b1m1diewohnungdieichsuche\",\"b1m1als\"],\"tip\":\"Los tres «que» del español, uno detrás de otro, en cuatro líneas de correo real. Esto es exactamente lo que corrige el examen.\"},{\"id\":\"b1m1l5e8\",\"type\":\"cloze\",\"prompt\":\"Completa tras la negación\",\"text\":\"Ich suche keine WG, ___ eine eigene Wohnung.\",\"answers\":[\"sondern\"],\"translation\":\"No busco un piso compartido, sino uno propio.\",\"hints\":[\"Tras una negación, «pero» se dice de otra forma\",\"son-dern\"],\"itemIds\":[\"b1m1sondern\",\"b1m1wg\"],\"tip\":\"aber = pero (añade) · sondern = sino (corrige lo negado). Solo aparece tras kein/nicht.\"},{\"id\":\"b1m1l5e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «Meinung»\",\"source\":\"Meiner Meinung nach sind die Mieten zu hoch.\",\"forbid\":[\"Meinung\",\"meiner\"],\"answers\":[\"Ich finde, dass die Mieten zu hoch sind\",\"Ich glaube, dass die Mieten zu hoch sind\",\"Ich denke, dass die Mieten zu hoch sind\",\"Ich finde die Mieten zu hoch\",\"Für mich sind die Mieten zu hoch\"],\"translation\":\"En mi opinión los alquileres son demasiado altos.\",\"hints\":[\"Un verbo de opinión + dass\",\"Ich finde, dass ...\"],\"itemIds\":[\"b1m1meinermeinungnach\",\"a2m6finden\",\"b1m1steigendemieten\"],\"tip\":\"Tener DOS formas de opinar es criterio de Wortschatz en el examen: si repites «meiner Meinung nach» cinco veces, bajas de banda.\"},{\"id\":\"b1m1l5e10\",\"type\":\"transform\",\"prompt\":\"De relativa a completiva\",\"source\":\"Die Wohnung, die ich suche, ist günstig.\",\"instruction\":\"Empieza con «Ich hoffe, dass ...» y di que el piso que buscas es barato\",\"answers\":[\"Ich hoffe, dass die Wohnung, die ich suche, günstig ist\"],\"translation\":\"Espero que el piso que busco sea barato.\",\"hints\":[\"dass manda su verbo al final del todo\",\"Ich hoffe, dass die Wohnung, die ich suche, ... ist\"],\"itemIds\":[\"b1m1dass\",\"b1m1diewohnungdieichsuche\",\"guenstig\"],\"tip\":\"Dos subordinadas encajadas y dos verbos al final. Si te sale esta, la sintaxis del B1 ya no te asusta.\"},{\"id\":\"b1m1l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Creo que el piso que vi es más caro que el mío\",\"answers\":[\"Ich glaube, dass die Wohnung, die ich gesehen habe, teurer als meine ist\",\"Ich glaube, dass die Wohnung, die ich gesehen habe, teurer ist als meine\",\"Ich denke, dass die Wohnung, die ich gesehen habe, teurer als meine ist\"],\"hints\":[\"Los tres «que» de la lección en una sola frase: dass, die, als\",\"Ich glaube, dass die Wohnung, die ich gesehen habe, ...\"],\"itemIds\":[\"b1m1dass\",\"b1m1diewohnungdieichsuche\",\"b1m1als\"],\"tip\":\"dass + relativo + als. El español los escribiría los tres igual; tú acabas de repartirlos bien.\"},{\"id\":\"b1m1l5e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1, mensaje 5: una megafonía · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Achtung, eine Durchsage für die wartenden Bürgerinnen und Bürger: Die Nummern von A einhundertzwanzig bis A einhundertvierzig werden heute nicht mehr aufgerufen. Unser System ist, ähm, seit einer Stunde ausgefallen. Wer sich anmelden möchte, kommt bitte morgen zwischen acht und zwölf noch einmal, ohne neuen Termin. Wir bitten um Entschuldigung.\",\"question\":\"„Die Nummern A 120 bis A 140 werden heute noch aufgerufen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«werden heute nicht mehr aufgerufen»: el «nicht mehr» le da la vuelta a toda la frase\",null],\"itemIds\":[\"b1m1sichanmelden\"],\"tip\":\"«nicht mehr» es el enemigo natural del Richtig/Falsch: si te lo comes, marcas Richtig y pierdes el punto.\"},{\"id\":\"b1m1l5e13\",\"type\":\"audiomc\",\"prompt\":\"Misma megafonía, segunda tarea. Dos escuchas.\",\"audio\":\"Achtung, eine Durchsage für die wartenden Bürgerinnen und Bürger: Die Nummern von A einhundertzwanzig bis A einhundertvierzig werden heute nicht mehr aufgerufen. Unser System ist, ähm, seit einer Stunde ausgefallen. Wer sich anmelden möchte, kommt bitte morgen zwischen acht und zwölf noch einmal, ohne neuen Termin. Wir bitten um Entschuldigung.\",\"question\":\"¿Qué debe hacer quien quiera empadronarse?\",\"options\":[\"Volver mañana por la mañana sin pedir cita nueva\",\"Pedir una cita nueva por internet\",\"Esperar a que llamen su número\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice justo «ohne neuen Termin»\",\"Hoy ya no se llama a nadie más\"],\"itemIds\":[\"b1m1sichanmelden\"]}]}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (B1)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «dass-Satz» y «Relativsatz» en B1: la distinción con más ejemplos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
