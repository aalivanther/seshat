praech\",\"a2interview\",\"a2anrufbeantworter\",\"a2einmal\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Los 4 Teile de Hören — cuántas veces suena cada uno\",\"body\":\"Unos 30 minutos, 20 ítems. \u003cb\u003eTeil 1\u003c/b\u003e: cinco textos cortos (radio, [[Ansage|anuncio por megafonía]], Anrufbeantworter) — cada uno suena \u003cb\u003ezweimal\u003c/b\u003e, marcas a/b/c. \u003cb\u003eTeil 2\u003c/b\u003e: UN Gespräch largo que suena \u003cb\u003eeinmal\u003c/b\u003e — emparejas, por ejemplo, personas o días con actividades. \u003cb\u003eTeil 3\u003c/b\u003e: cinco Gespräche cortos del día a día, cada uno \u003cb\u003eeinmal\u003c/b\u003e, a/b/c. \u003cb\u003eTeil 4\u003c/b\u003e: un Interview que suena \u003cb\u003ezweimal\u003c/b\u003e — marcas sí o no. La estrategia no cambia desde el A1: casi toda respuesta es un DATO — una hora, un precio, un lugar, quién habla. Antes de cada audio, lee la pregunta y decide QUÉ vas a cazar. Y si un texto suena einmal, tu primera escucha es la única: lápiz listo.\",\"table\":[[\"Teil\",\"Qué oyes\",\"Escuchas\"],[\"1\",\"5 textos cortos (mensajes, avisos)\",\"zweimal\"],[\"2\",\"1 Gespräch largo — emparejar\",\"einmal\"],[\"3\",\"5 Gespräche cortos del día a día\",\"einmal\"],[\"4\",\"1 Interview — sí/no\",\"zweimal\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl2e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de las instrucciones\",\"pairs\":[{\"target\":\"das Gespräch\",\"source\":\"la conversación\"},{\"target\":\"das Interview\",\"source\":\"la entrevista\"},{\"target\":\"der Anrufbeantworter\",\"source\":\"el contestador automático\"},{\"target\":\"einmal\",\"source\":\"una sola vez\"}],\"itemIds\":[\"a2gespraech\",\"a2interview\",\"a2anrufbeantworter\",\"a2einmal\"]},{\"id\":\"a2examl2e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica en ráfaga: ¿cuántas veces suena cada Teil?\",\"categories\":[\"zweimal\",\"einmal\"],\"items\":[{\"text\":\"Teil 1: fünf kurze Texte\",\"bucket\":0},{\"text\":\"Teil 2: das lange Gespräch\",\"bucket\":1},{\"text\":\"Teil 3: fünf kurze Gespräche\",\"bucket\":1},{\"text\":\"Teil 4: das Interview\",\"bucket\":0}],\"itemIds\":[\"a2gespraech\",\"a2interview\",\"zweimal\",\"a2einmal\"],\"tip\":\"Regla mnemotécnica: los EXTREMOS (Teil 1 y 4) suenan dos veces; el CENTRO (2 y 3), solo una.\"},{\"id\":\"a2examl2e3\",\"type\":\"mc\",\"prompt\":\"Estrategia de Hören\",\"question\":\"Va a empezar el Teil 2 (el Gespräch largo, una sola escucha, emparejar). ¿Qué haces en los segundos previos?\",\"options\":[\"Cierro los ojos y me concentro\",\"Miro los días y las imágenes y decido qué dato cazar\",\"Repaso el Teil 1\"],\"answer\":1,\"whyWrong\":[\"Con los ojos cerrados no ves el cuadro de emparejar — y ahí está la mitad de la respuesta\",null,\"El Teil 1 ya pasó: lo que no marcaste, déjalo ir\"],\"itemIds\":[\"a2gespraech\",\"a2einmal\"],\"tip\":\"En los audios de una sola escucha, la preparación ES la estrategia: quien sabe qué busca, lo oye.\"},{\"id\":\"a2examl2h1\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 1 de 5. Un Anrufbeantworter. Lee la pregunta, caza el dato (día y hora) y dale al play. Suena DOS veces.\",\"audio\":\"Hallo Anna, hier ist Nico. Ich komme am Samstag nicht. Ich muss im Restaurant arbeiten. Geht es am Sonntag um drei Uhr? Ruf mich bitte an. Tschüss!\",\"question\":\"Wann kommt Nico?\",\"options\":[\"Am Samstag\",\"Am Sonntag um 3 Uhr\",\"Am Sonntag um 2 Uhr\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"El sábado lo nombra para descartarlo: «ich komme am Samstag nicht»\",null,\"Las dos no salen: es um drei Uhr\"],\"itemIds\":[\"a2anrufbeantworter\",\"a2m1amsamstag\",\"a2m1amsonntag\",\"a2m10restaurant\"],\"tip\":\"Trampa clásica del Teil 1: se oye primero el día que NO vale. El dato bueno llega después, con la hora.\"},{\"id\":\"a2examl2h2\",\"type\":\"audiomc\",\"prompt\":\"Teil 1 · texto 2 de 5. Una Ansage en la estación. Dos escuchas. Caza el Gleis.\",\"audio\":\"Achtung, eine Ansage: Der Zug nach Hamburg fährt heute nicht von Gleis drei, sondern von Gleis fünf ab. Abfahrt um zehn Uhr. Vielen Dank.\",\"question\":\"Von welchem Gleis fährt der Zug ab?\",\"options\":[\"Gleis 3\",\"Gleis 5\",\"Gleis 10\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"Gleis drei es el andén que ya no vale: «nicht von Gleis drei»\",null,\"Las diez son la hora de salida, no el andén\"],\"itemIds\":[\"ansage\",\"zug\",\"gleis\",\"bahnhof\"],\"tip\":\"En las Ansagen, el dato a cazar casi siempre es el Gleis o la hora. Aquí el «nicht … sondern» te lo sirve en bandeja.\"},{\"id\":\"a2examl2h3\",\"type\":\"audiomc\",\"prompt\":\"Teil 1 · texto 3 de 5. Un aviso en la panadería. Dos escuchas. Caza el precio de HOY.\",\"audio\":\"Liebe Kundinnen und Kunden, das Brot kostet heute nur zwei Euro, nicht drei. Der Kuchen bleibt bei vier Euro. Das Angebot gilt nur heute.\",\"question\":\"Was kostet das Brot heute?\",\"options\":[\"2 Euro\",\"3 Euro\",\"4 Euro\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Tres euros es el precio viejo: «nicht drei»\",\"Cuatro es el pastel, no el pan\"],\"itemIds\":[\"brot\",\"kosten\",\"euro\",\"kuchen\",\"zwei\"],\"tip\":\"Tres números en diez segundos. Apunta pan / pastel por separado: el examen mezcla a propósito.\"},{\"id\":\"a2examl2h4\",\"type\":\"audiomc\",\"prompt\":\"Teil 1 · texto 4 de 5. Mensaje de la consulta de Doktor Weber. Dos escuchas. Caza el día Y la hora nuevos.\",\"audio\":\"Praxis Doktor Weber, guten Tag. Sofia, Ihr Termin am Dienstag um neun Uhr geht leider nicht. Können Sie am Mittwoch um vierzehn Uhr kommen? Bitte rufen Sie uns an. Auf Wiederhören.\",\"question\":\"Wann soll Sofia in die Praxis kommen?\",\"options\":[\"Am Dienstag um 9 Uhr\",\"Am Mittwoch um 14 Uhr\",\"Am Mittwoch um 9 Uhr\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"El martes a las nueve es la cita que se cancela\",null,\"El miércoles sí, pero a las catorce, no a las nueve — el examen mezcla día bueno con hora vieja\"],\"itemIds\":[\"termin\",\"arzt\",\"dienstag\",\"mittwoch\",\"a2m2leider\"],\"tip\":\"Cuando cambian una cita, suenan DOS pares día+hora. Quédate con el segundo: el primero es el que «geht nicht».\"},{\"id\":\"a2examl2h5\",\"type\":\"audiomc\",\"prompt\":\"Teil 1 · texto 5 de 5. La Apotheke llama. Dos escuchas. Caza hasta qué hora HOY.\",\"audio\":\"Guten Tag, hier spricht die Apotheke am Bahnhof. Das Medikament von Anna ist da. Sie kann es heute bis achtzehn Uhr abholen. Morgen öffnen wir erst um acht Uhr. Auf Wiederhören.\",\"question\":\"Bis wann kann Anna das Medikament heute holen?\",\"options\":[\"Bis 8 Uhr\",\"Bis 18 Uhr\",\"Bis 12 Uhr\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"Las ocho son la apertura de MAÑANA, no el cierre de hoy\",null,\"Las doce no salen: es un distractor limpio\"],\"itemIds\":[\"apotheke\",\"medikament\",\"acht\",\"bahnhof\"],\"tip\":\"heute bis achtzehn / morgen erst um acht: dos relojes. La pregunta dice heute — ignora el de mañana.\"},{\"id\":\"a2examl2h6\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 2 · el Gespräch largo, UNA sola escucha, emparejar. Cinco tareas (esta y las cuatro siguientes). Lee las cinco antes: no hay segunda pasada. ¿Qué hace Leo el lunes?\",\"audio\":\"Sofia, wie sieht unsere Woche aus? | Am Montag hat Leo Deutschkurs, von sechs bis acht. | Und Dienstag? | Dienstag arbeitet Anna im Krankenhaus bis fünf. Sie geht nicht zum Sport. | Was macht Lucia am Mittwoch? | Lucia geht am Mittwoch ins Kino, um sieben Uhr, nicht um acht. | Und du, Sofia? | Donnerstag habe ich einen Termin bei Doktor Weber, um zehn Uhr. Um neun geht es nicht. | Super. Freitag essen wir bei Nico im Restaurant, um acht Uhr. Schwimmen gehen wir dieses Wochenende nicht. | Gut. Bis Freitag!\",\"question\":\"Was macht Leo am Montag?\",\"options\":[\"Er hat Deutschkurs\",\"Er arbeitet im Krankenhaus\",\"Er geht ins Kino\"],\"answer\":0,\"plays\":1,\"notepad\":true,\"whyWrong\":[null,\"El hospital es Anna, el martes\",\"El cine es Lucía, el miércoles\"],\"itemIds\":[\"a2gespraech\",\"a2einmal\",\"montag\",\"a2m10deutschkurs\"],\"tip\":\"Teil 2: las cinco tareas van EN EL ORDEN de la semana. Apunta un dato por día y no intentes retener el diálogo entero.\"},{\"id\":\"a2examl2h7\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · tarea 2 de 5. Mismo Gespräch, una sola pasada. ¿Qué hace Anna el martes?\",\"audio\":\"Sofia, wie sieht unsere Woche aus? | Am Montag hat Leo Deutschkurs, von sechs bis acht. | Und Dienstag? | Dienstag arbeitet Anna im Krankenhaus bis fünf. Sie geht nicht zum Sport. | Was macht Lucia am Mittwoch? | Lucia geht am Mittwoch ins Kino, um sieben Uhr, nicht um acht. | Und du, Sofia? | Donnerstag habe ich einen Termin bei Doktor Weber, um zehn Uhr. Um neun geht es nicht. | Super. Freitag essen wir bei Nico im Restaurant, um acht Uhr. Schwimmen gehen wir dieses Wochenende nicht. | Gut. Bis Freitag!\",\"question\":\"Was macht Anna am Dienstag?\",\"options\":[\"Sie hat Deutschkurs\",\"Sie arbeitet im Krankenhaus\",\"Sie geht zum Sport\"],\"answer\":1,\"plays\":1,\"notepad\":true,\"whyWrong\":[\"El curso es de Leo, el lunes\",null,\"Lo nombra para descartarlo: «Sie geht nicht zum Sport»\"],\"itemIds\":[\"a2gespraech\",\"dienstag\",\"krankenhaus\"],\"tip\":\"Anna es enfermera: el Krankenhaus le encaja. El examen aun así mete un «nicht zum Sport» para quien se quede con la última palabra.\"},{\"id\":\"a2examl2h8\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · tarea 3 de 5. Misma pasada. ¿Qué hace Lucía el miércoles?\",\"audio\":\"Sofia, wie sieht unsere Woche aus? | Am Montag hat Leo Deutschkurs, von sechs bis acht. | Und Dienstag? | Dienstag arbeitet Anna im Krankenhaus bis fünf. Sie geht nicht zum Sport. | Was macht Lucia am Mittwoch? | Lucia geht am Mittwoch ins Kino, um sieben Uhr, nicht um acht. | Und du, Sofia? | Donnerstag habe ich einen Termin bei Doktor Weber, um zehn Uhr. Um neun geht es nicht. | Super. Freitag essen wir bei Nico im Restaurant, um acht Uhr. Schwimmen gehen wir dieses Wochenende nicht. | Gut. Bis Freitag!\",\"question\":\"Was macht Lucia am Mittwoch?\",\"options\":[\"Sie geht ins Kino\",\"Sie geht zum Arzt\",\"Sie isst im Restaurant\"],\"answer\":0,\"plays\":1,\"notepad\":true,\"whyWrong\":[null,\"La consulta es Sofía, el jueves\",\"El restaurante es el viernes, con Nico\"],\"itemIds\":[\"a2gespraech\",\"mittwoch\",\"kino\"],\"tip\":\"«um sieben Uhr, nicht um acht»: la hora falsa está ahí por si la pregunta fuera la hora. Esta pregunta es el plan, no el reloj.\"},{\"id\":\"a2examl2h9\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · tarea 4 de 5. Misma pasada. ¿Adónde va Sofía el jueves?\",\"audio\":\"Sofia, wie sieht unsere Woche aus? | Am Montag hat Leo Deutschkurs, von sechs bis acht. | Und Dienstag? | Dienstag arbeitet Anna im Krankenhaus bis fünf. Sie geht nicht zum Sport. | Was macht Lucia am Mittwoch? | Lucia geht am Mittwoch ins Kino, um sieben Uhr, nicht um acht. | Und du, Sofia? | Donnerstag habe ich einen Termin bei Doktor Weber, um zehn Uhr. Um neun geht es nicht. | Super. Freitag essen wir bei Nico im Restaurant, um acht Uhr. Schwimmen gehen wir dieses Wochenende nicht. | Gut. Bis Freitag!\",\"question\":\"Wohin geht Sofia am Donnerstag?\",\"options\":[\"Ins Kino\",\"Zu Doktor Weber\",\"Ins Restaurant\"],\"answer\":1,\"plays\":1,\"notepad\":true,\"whyWrong\":[\"El cine es el miércoles, Lucía\",null,\"El restaurante es el viernes\"],\"itemIds\":[\"a2gespraech\",\"donnerstag\",\"termin\",\"arzt\"],\"tip\":\"«Um neun geht es nicht»: otra hora-trampa. La pregunta es DÓNDE, no a qué hora — no te distraigas.\"},{\"id\":\"a2examl2h10\",\"type\":\"audiomc\",\"prompt\":\"Teil 2 · tarea 5 de 5. La del final, cuando ya has bajado la guardia. Misma pasada.\",\"audio\":\"Sofia, wie sieht unsere Woche aus? | Am Montag hat Leo Deutschkurs, von sechs bis acht. | Und Dienstag? | Dienstag arbeitet Anna im Krankenhaus bis fünf. Sie geht nicht zum Sport. | Was macht Lucia am Mittwoch? | Lucia geht am Mittwoch ins Kino, um sieben Uhr, nicht um acht. | Und du, Sofia? | Donnerstag habe ich einen Termin bei Doktor Weber, um zehn Uhr. Um neun geht es nicht. | Super. Freitag essen wir bei Nico im Restaurant, um acht Uhr. Schwimmen gehen wir dieses Wochenende nicht. | Gut. Bis Freitag!\",\"question\":\"Wohin gehen sie am Freitag?\",\"options\":[\"Zum Schwimmen\",\"Ins Restaurant\",\"Zum Sport\"],\"answer\":1,\"plays\":1,\"notepad\":true,\"whyWrong\":[\"«Schwimmen gehen wir dieses Wochenende nicht»: se nombra para descartarlo\",null,\"El deporte ya se descartó el martes, con Anna\"],\"itemIds\":[\"a2gespraech\",\"freitag\",\"a2m10restaurant\",\"koch\"],\"tip\":\"El último dato del Teil 2 suele traer un «nicht» pegado. Quien apunta el primer sustantivo que oye, falla — y no hay segunda pasada.\"},{\"id\":\"a2examl2h11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3 · diálogo 1 de 5. Cinco Gespräche cortos del día a día, cada uno UNA vez. Caza qué compra.\",\"audio\":\"Sofia, das Brot kostet zwei Euro, der Kuchen drei Euro. | Ich nehme das Brot, bitte. Der Kuchen ist zu teuer. | Gut, zwei Euro.\",\"question\":\"Was kauft Sofia?\",\"options\":[\"Nur das Brot\",\"Nur den Kuchen\",\"Brot und Kuchen\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"El pastel se nombra para decir que NO: «zu teuer»\",\"Paga dos euros, no cinco: solo el pan\"],\"itemIds\":[\"a2gespraech\",\"a2einmal\",\"brot\",\"kuchen\",\"teuer\"],\"tip\":\"En el Teil 3 el dato vive en lo que SE LLEVA, no en lo que se menciona. Dos precios en el aire; una sola compra.\"},{\"id\":\"a2examl2h12\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · diálogo 2 de 5. Una sola escucha. Caza la hora. Leo, ya se sabe, llega tarde.\",\"audio\":\"Leo, wann treffen wir uns? Um fünf? | Nein, um fünf arbeite ich noch. Um sechs? | Um sechs habe ich Deutschkurs. Geht es um sieben am Bahnhof? | Ja, um sieben. Diesmal bin ich pünktlich!\",\"question\":\"Wann treffen sie sich?\",\"options\":[\"Um 5 Uhr\",\"Um 6 Uhr\",\"Um 7 Uhr\"],\"answer\":2,\"plays\":1,\"whyWrong\":[\"Las cinco las descarta él: todavía trabaja\",\"Las seis las descarta el otro: tiene curso\",null],\"itemIds\":[\"a2gespraech\",\"bahnhof\",\"a2m10deutschkurs\",\"a2m10puenktlich\"],\"tip\":\"Tres horas en un diálogo de diez segundos. Las dos primeras se tiran; quédate con la que cierra el trato.\"},{\"id\":\"a2examl2h13\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · diálogo 3 de 5. En la farmacia. Una sola escucha. Caza cuánto paga.\",\"audio\":\"Guten Tag, Lucia. Die Tabletten kosten acht Euro, der Saft fünf Euro. | Ich nehme die Tabletten, bitte. | Acht Euro.\",\"question\":\"Was bezahlt Lucia?\",\"options\":[\"5 Euro\",\"8 Euro\",\"13 Euro\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Cinco es el zumo, que no se lleva\",null,\"Trece sería las dos cosas: solo pide las pastillas\"],\"itemIds\":[\"apotheke\",\"tablette\",\"saft\",\"euro\",\"acht\"],\"tip\":\"Misma trampa que el pan y el pastel: se oyen dos precios, se paga uno. Suma solo si oyes «und».\"},{\"id\":\"a2examl2h14\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · diálogo 4 de 5. Una sola escucha. Caza el lugar.\",\"audio\":\"Treffen wir uns im Kino? | Nein, das Kino ist heute voll. Im Park? | Es regnet. Dann am Bahnhof? | Ja, am Bahnhof um vier Uhr.\",\"question\":\"Wo treffen sie sich?\",\"options\":[\"Im Kino\",\"Im Park\",\"Am Bahnhof\"],\"answer\":2,\"plays\":1,\"whyWrong\":[\"El cine está lleno: primera propuesta tumbada\",\"El parque cae por la lluvia\",null],\"itemIds\":[\"a2gespraech\",\"kino\",\"bahnhof\",\"regen\"],\"tip\":\"Tres sitios, dos rechazos, un sí. El que cierra es el bueno — igual que con las horas del diálogo de Leo.\"},{\"id\":\"a2examl2h15\",\"type\":\"audiomc\",\"prompt\":\"Teil 3 · diálogo 5 de 5. Una sola escucha. Caza CÓMO va Nico, no cómo iría si lloviera.\",\"audio\":\"Nico, fährst du mit dem Bus zum Bahnhof? | Nein, der Bus braucht zu lange. Ich fahre mit dem Fahrrad, das dauert zehn Minuten. | Und bei Regen? | Dann nehme ich den Zug.\",\"question\":\"Wie fährt Nico normalerweise zum Bahnhof?\",\"options\":[\"Mit dem Bus\",\"Mit dem Fahrrad\",\"Mit dem Zug\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"El bus es justo lo que descarta: «braucht zu lange»\",null,\"El tren es el plan B, si llueve — la pregunta es «normalerweise»\"],\"itemIds\":[\"a2gespraech\",\"bus\",\"fahrrad\",\"zug\",\"bahnhof\"],\"tip\":\"«Und bei Regen?» mete el plan B. Si la pregunta dice normalerweise, ignora la excepción.\"},{\"id\":\"a2examl2h16\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 4 · el Interview, DOS escuchas, sí o no. Cinco afirmaciones (esta y las cuatro siguientes). Léelas antes: la primera pasada para las voces, la segunda para decidir.\",\"audio\":\"Guten Tag, heute im Interview: Doktor Weber, Ärztin in Berlin. Frau Weber, wann ist Ihre Praxis geöffnet? | Montag bis Freitag, von acht bis sechzehn Uhr. Am Wochenende bleibt die Praxis zu. | Beginnen Sie um sieben? | Nein, um acht. Um sieben ist noch geschlossen. | Was kostet ein Termin? | Der Termin kostet nichts. In der Apotheke zahlt man, zum Beispiel acht Euro für Tabletten. | Arbeiten Sie auch am Abend? | Nein. Nach sechzehn Uhr nicht. Wer sehr krank ist, geht ins Krankenhaus. | Sehen Sie viele Patienten am Tag? | Ja, zwanzig Patienten. Nicht dreißig.\",\"question\":\"Die Praxis ist am Wochenende geöffnet.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"«Am Wochenende bleibt die Praxis zu»: zu = cerrada\",null],\"itemIds\":[\"a2interview\",\"zweimal\",\"wochenende\",\"arzt\"],\"tip\":\"zu = cerrado, no «de usted». En el Teil 4 la afirmación casi nunca copia las palabras del audio: caza la idea.\"},{\"id\":\"a2examl2h17\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 2 de 5. Mismo Interview, dos escuchas.\",\"audio\":\"Guten Tag, heute im Interview: Doktor Weber, Ärztin in Berlin. Frau Weber, wann ist Ihre Praxis geöffnet? | Montag bis Freitag, von acht bis sechzehn Uhr. Am Wochenende bleibt die Praxis zu. | Beginnen Sie um sieben? | Nein, um acht. Um sieben ist noch geschlossen. | Was kostet ein Termin? | Der Termin kostet nichts. In der Apotheke zahlt man, zum Beispiel acht Euro für Tabletten. | Arbeiten Sie auch am Abend? | Nein. Nach sechzehn Uhr nicht. Wer sehr krank ist, geht ins Krankenhaus. | Sehen Sie viele Patienten am Tag? | Ja, zwanzig Patienten. Nicht dreißig.\",\"question\":\"Doktor Weber beginnt um acht Uhr.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Las siete las nombra el periodista; ella las corrige: «Nein, um acht»\"],\"itemIds\":[\"a2interview\",\"arzt\",\"acht\",\"umachtuhr\"],\"tip\":\"El entrevistador mete la hora falsa a propósito. La respuesta está en la corrección, no en la pregunta.\"},{\"id\":\"a2examl2h18\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 3 de 5. Dos escuchas. Ojo: hay un precio en el audio que no es el del Termin.\",\"audio\":\"Guten Tag, heute im Interview: Doktor Weber, Ärztin in Berlin. Frau Weber, wann ist Ihre Praxis geöffnet? | Montag bis Freitag, von acht bis sechzehn Uhr. Am Wochenende bleibt die Praxis zu. | Beginnen Sie um sieben? | Nein, um acht. Um sieben ist noch geschlossen. | Was kostet ein Termin? | Der Termin kostet nichts. In der Apotheke zahlt man, zum Beispiel acht Euro für Tabletten. | Arbeiten Sie auch am Abend? | Nein. Nach sechzehn Uhr nicht. Wer sehr krank ist, geht ins Krankenhaus. | Sehen Sie viele Patienten am Tag? | Ja, zwanzig Patienten. Nicht dreißig.\",\"question\":\"Ein Termin bei Doktor Weber kostet acht Euro.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"«Der Termin kostet nichts». Los ocho euros son las pastillas de la farmacia, no la consulta\",null],\"itemIds\":[\"a2interview\",\"termin\",\"euro\",\"acht\",\"tablette\"],\"tip\":\"El número que oyes no es siempre el de la pregunta. Aquí ocho euros viven en la Apotheke; la consulta es gratis.\"},{\"id\":\"a2examl2h19\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 4 de 5. Dos escuchas.\",\"audio\":\"Guten Tag, heute im Interview: Doktor Weber, Ärztin in Berlin. Frau Weber, wann ist Ihre Praxis geöffnet? | Montag bis Freitag, von acht bis sechzehn Uhr. Am Wochenende bleibt die Praxis zu. | Beginnen Sie um sieben? | Nein, um acht. Um sieben ist noch geschlossen. | Was kostet ein Termin? | Der Termin kostet nichts. In der Apotheke zahlt man, zum Beispiel acht Euro für Tabletten. | Arbeiten Sie auch am Abend? | Nein. Nach sechzehn Uhr nicht. Wer sehr krank ist, geht ins Krankenhaus. | Sehen Sie viele Patienten am Tag? | Ja, zwanzig Patienten. Nicht dreißig.\",\"question\":\"Doktor Weber arbeitet auch am Abend.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"notepad\":true,\"whyWrong\":[\"«Nach sechzehn Uhr nicht»: a las cuatro cierra. Quien está muy enfermo va al hospital, no a su consulta\",null],\"itemIds\":[\"a2interview\",\"abend\",\"arzt\",\"krankenhaus\"],\"tip\":\"auch am Abend es justo lo que niega. En el Teil 4, un «auch» en la afirmación suele ser la trampa.\"},{\"id\":\"a2examl2h20\",\"type\":\"audiomc\",\"prompt\":\"Teil 4 · afirmación 5 de 5. La última. Dos escuchas.\",\"audio\":\"Guten Tag, heute im Interview: Doktor Weber, Ärztin in Berlin. Frau Weber, wann ist Ihre Praxis geöffnet? | Montag bis Freitag, von acht bis sechzehn Uhr. Am Wochenende bleibt die Praxis zu. | Beginnen Sie um sieben? | Nein, um acht. Um sieben ist noch geschlossen. | Was kostet ein Termin? | Der Termin kostet nichts. In der Apotheke zahlt man, zum Beispiel acht Euro für Tabletten. | Arbeiten Sie auch am Abend? | Nein. Nach sechzehn Uhr nicht. Wer sehr krank ist, geht ins Krankenhaus. | Sehen Sie viele Patienten am Tag? | Ja, zwanzig Patienten. Nicht dreißig.\",\"question\":\"Doktor Weber sieht zwanzig Patienten am Tag.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"notepad\":true,\"whyWrong\":[null,\"Treinta es el número que descarta: «Nicht dreißig»\"],\"itemIds\":[\"a2interview\",\"patient\",
