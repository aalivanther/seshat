módulo es \u003cb\u003ecalendario\u003c/b\u003e, no causa. \u003ci\u003eThe talk is due to start at seven.\u003c/i\u003e La causa (\u003ci\u003eI left due to the hours\u003c/i\u003e) ya la tienes del B1, y conviven: las separa lo que va detrás. Calendario → infinitivo. Causa → sustantivo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que puntúa\u003c/b\u003e cuando el rumor va a un informe: no \u003ci\u003esupposed to\u003c/i\u003e, sino \u003ci\u003eIt is said to be…\u003c/i\u003e, \u003ci\u003eIt is rumoured to be…\u003c/i\u003e o \u003ci\u003eAccording to…\u003c/i\u003e. \u003ci\u003eReputed to\u003c/i\u003e lo vas a leer; no hace falta escribirlo."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l3\",\"phaseId\":\"enb2m5\",\"title\":\"Supposed to, meant to\",\"subtitle\":\"La misma forma, dos oficios: la norma y el rumor\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Norma, rumor, ideal, calendario\",\"itemIds\":[\"enb2m5supposedtoobligation\",\"enb2m5supposedtorumor\",\"enb2m5meanttoideal\",\"enb2m5reputedtobe\",\"enb2m5natmeanttobegreat\",\"enb2m5dueatseven\",\"enb2m5itislikelythat\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el manual nunca separa supposed (norma) de supposed (rumor)\",\"body\":\"$17\",\"table\":[[\"Forma\",\"Oficio\",\"Ejemplo\"],[\"supposed to + persona\",\"norma\",\"You're supposed to submit it.\"],[\"supposed to + cosa\",\"rumor\",\"It's supposed to be haunted.\"],[\"meant to\",\"ideal o rumor\",\"It's meant to be quiet / great.\"],[\"due to + infinitivo\",\"calendario\",\"The talk is due to start at seven.\"],[\"said to / rumoured to\",\"rumor de escrito\",\"It is said to be the oldest.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l3e1\",\"type\":\"bucket\",\"prompt\":\"¿Esta «supposed / meant» es norma o es rumor?\",\"categories\":[\"NORMA — hay que hacerlo\",\"RUMOR o IDEAL — lo dicen / debería ser así\"],\"items\":[{\"text\":\"You're supposed to submit the form by Friday.\",\"bucket\":0},{\"text\":\"Residents are obliged to report any damage.\",\"bucket\":0},{\"text\":\"It's supposed to be haunted.\",\"bucket\":1},{\"text\":\"It's meant to be great.\",\"bucket\":1},{\"text\":\"This street is meant to be quiet after ten.\",\"bucket\":1},{\"text\":\"It is reputed to be the oldest house on the street.\",\"bucket\":1}],\"itemIds\":[\"enb2m5supposedtoobligation\",\"enb2m5obligedto\",\"enb2m5supposedtorumor\",\"enb2m5natmeanttobegreat\",\"enb2m5meanttoideal\",\"enb2m5reputedtobe\"],\"tip\":\"Atajo: si el sujeto es una persona y hay fecha o reglamento, es norma. Si el sujeto es una casa, una película o un barrio, es rumor.\"},{\"id\":\"enb2m5l3e2\",\"type\":\"mc\",\"prompt\":\"El «due to» de este módulo no es el del B1\",\"question\":\"«La charla está prevista para las siete» →\",\"options\":[\"The talk is due to start at seven.\",\"The talk is due to the seven o'clock.\",\"The talk is supposed to the seven.\"],\"answer\":0,\"whyWrong\":[null,\"Ese «due to» es el de causa, y detrás iría un sustantivo («due to the delay»). Aquí es calendario: detrás va infinitivo.\",\"«Supposed to» de norma pediría «supposed to start», no «supposed to the seven».\"],\"itemIds\":[\"enb2m5dueatseven\",\"enb1m2dueto\"],\"tip\":\"Las dos «due to» conviven y el examen las usa las dos. Las separa lo que va detrás: infinitivo = horario; sustantivo = causa.\"},{\"id\":\"enb2m5l3e3\",\"type\":\"paraphrase\",\"prompt\":\"Pásalo a registro de escrito: sin «people say» ni «supposed»\",\"source\":\"It's supposed to be haunted.\",\"forbid\":[\"supposed\",\"people say\",\"they say\",\"apparently\"],\"answers\":[\"It is said to be haunted\",\"It is rumoured to be haunted\",\"According to local people it is haunted\"],\"translation\":\"Dicen que está encantada.\",\"hints\":[\"Empieza por «It is said…» o «It is rumoured…»\",\"It is said to be ...\"],\"itemIds\":[\"enb2m5supposedtorumor\",\"enb2m5reputedtobe\",\"enb1m3rumour\"],\"tip\":\"En un informe, «It is said to be» o «It is rumoured to be». «Reputed to» lo vas a leer; no hace falta escribirlo. «Apparently» vale en un correo.\"},{\"id\":\"enb2m5l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The talk is due to it starts at seven.\",\"answers\":[\"The talk is due to start at seven.\"],\"why\":\"Detrás del «due to» de calendario va infinitivo, no una frase. Es el mismo patrón que «likely to» y «bound to»: be + adjetivo + to + infinitivo.\",\"translation\":\"La charla está prevista para las siete.\",\"itemIds\":[\"enb2m5dueatseven\"]},{\"id\":\"enb2m5l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa el rumor de Nora\",\"text\":\"The house opposite is ___ to be haunted. Nobody has lived there since March.\",\"answers\":[\"supposed\",\"meant\",\"said\"],\"translation\":\"Dicen que la casa de enfrente está encantada. No vive nadie desde marzo.\",\"hints\":[\"Es la perífrasis del rumor\",\"sup- / me- / said\"],\"itemIds\":[\"enb2m5supposedtorumor\",\"enb2m5meanttoideal\",\"enb2m5reputedtobe\",\"enb2m5thehouseopposite\"],\"tip\":\"Las tres caben. En la calle, «supposed» y «meant»; en el papel, «said to» o «rumoured to». «Reputed» lo reconoces; no lo fuerces.\"},{\"id\":\"enb2m5l3e6\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué oficio tiene esta «supposed»?\",\"source\":\"You're supposed to submit the form by Friday.\",\"answers\":[\"Se supone que tienes que entregar el formulario para el viernes\",\"Tienes que entregar el formulario para el viernes\",\"Se espera que entregues el formulario para el viernes\"],\"itemIds\":[\"enb2m5supposedtoobligation\"],\"tip\":\"Aquí no hay rumor: hay una fecha y un «tú». Es norma. Si la traduces por «dicen que entregas el formulario», has cogido el otro oficio.\"},{\"id\":\"enb2m5l3e7\",\"type\":\"build\",\"prompt\":\"Construye la frase de calendario\",\"target\":\"The talk is due to start at seven\",\"translation\":\"La charla está prevista para las siete\",\"distractors\":[\"starts\",\"starting\"],\"itemIds\":[\"enb2m5dueatseven\"],\"tip\":\"Las dos fichas que sobran son las que pone quien calca «está previsto que empieza»: un presente o un -ing. Detrás de «due to» de calendario, infinitivo.\"},{\"id\":\"enb2m5l3e8\",\"type\":\"shadow\",\"prompt\":\"Sombra el rumor: pégate al ritmo\",\"text\":\"It's supposed to be haunted.\",\"phonetic\":\"its sa-PÓUS̬d tu bi JÓON-tid\",\"translation\":\"Dicen que está encantada.\",\"reps\":2,\"itemIds\":[\"enb2m5supposedtorumor\"],\"tip\":\"«Supposed» en la calle suena «sa-PÓUST»: la -ed se come. Si la sueltas entera, suenas a libro abierto.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m5-3\",\"book\":\"It is supposed to be good\",\"real\":\"It's meant to be great\",\"meaning\":\"Dicen que está genial / se supone que merece la pena\",\"when\":\"Al recomendar un sitio, una serie, un restaurante, sin haber ido. Es rumor con ganas. En el Writing, la misma frase se pone en formal: «It is said to be». No la uses para una norma («You're meant to submit the form» vale en la calle; en un reglamento, «You are required to»).\",\"register\":\"amigos\",\"exam\":\"It is said to be\",\"note\":\"«Meant to» y «supposed to» de rumor son intercambiables en conversación. El examen las acepta las dos. «Reputed to» lo vas a leer; no hace falta producirlo.\",\"sound\":\"its ment tu bi greit\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m5natmeanttobegreat\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconM
