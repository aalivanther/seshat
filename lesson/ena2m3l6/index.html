e [[I really like this film.|Esta película me gusta mucho.]]\u003cbr/\u003e\u003cb\u003e2. Pon el bloque AL FINAL, detrás del objeto:\u003c/b\u003e [[I like it very much.|Me gusta muchísimo.]] · [[She speaks English very well.|Habla inglés muy bien.]]\u003cbr/\u003e\u003cbr/\u003eCuál usar es cuestión de gusto: \u003ci\u003ereally\u003c/i\u003e delante es más natural al hablar; \u003ci\u003every much\u003c/i\u003e al final suena algo más formal y es la que encaja en un email de examen. Lo que no existe es la de en medio.\u003cbr/\u003e\u003cbr/\u003eY ojo a un detalle que confunde: \u003cb\u003every much\u003c/b\u003e y \u003cb\u003ea lot\u003c/b\u003e van con el verbo (I like it very much / a lot), mientras que \u003cb\u003every\u003c/b\u003e a secas solo acompaña a adjetivos y adverbios (very nice, very well). \u003ci\u003eI like it very\u003c/i\u003e no se dice."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m3l6\",\"phaseId\":\"ena2m3\",\"title\":\"I really like this film\",\"subtitle\":\"La trampa gorda del módulo: entre el verbo y su objeto no se mete nada\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Decir cuánto te gusta y cómo de bien se hace algo\",\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"ena2m3shespeaksenglishverywell\",\"ena2m3ilikeitverymuch\",\"ena2m3often\",\"ena2m3heoftengoestothecinema\",\"enalways\",\"ennever\",\"enverywell\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El verbo y su objeto no se separan. Nunca.\",\"body\":\"$17\",\"table\":[[\"en español\",\"en inglés, mal\",\"en inglés, bien\"],[\"Me gusta mucho esta peli.\",\"I like very much this film.\",\"I really like this film.\"],[\"Me gusta muchísimo.\",\"I like very much it.\",\"I like it very much.\"],[\"Habla muy bien inglés.\",\"She speaks very well English.\",\"She speaks English very well.\"],[\"Toca muy bien la guitarra.\",\"He plays very well the guitar.\",\"He plays the guitar very well.\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y los de frecuencia van en otro sitio del que crees\",\"body\":\"Los adverbios de frecuencia —\u003cb\u003ealways, usually, [[often|a menudo]], sometimes, never\u003c/b\u003e— ya los colocaste en el A1, pero merece la pena repetir la regla porque el pasado y las frases largas la vuelven a romper:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eDelante del verbo normal\u003c/b\u003e: [[He often goes to the cinema.|Va al cine a menudo.]] · \u003ci\u003eShe never works on Sunday.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eDetrás de be\u003c/b\u003e: \u003ci\u003eI'm often tired.\u003c/i\u003e · \u003ci\u003eShe's never late.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eEl español los pone al final o donde le apetece («voy al cine a menudo», «llego tarde a menudo»), y de ahí salen \u003ci\u003eI go often to the cinema\u003c/i\u003e y \u003ci\u003eI am late often\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eRegla de bolsillo, y sirve para las dos mitades de esta lección: \u003cb\u003een inglés, lo que modifica al verbo se pone DELANTE del verbo o al FINAL de todo — pero nunca en medio.\u003c/b\u003e\",\"table\":[[\"español\",\"inglés, mal\",\"inglés, bien\"],[\"Voy al cine a menudo.\",\"I go often to the cinema.\",\"I often go to the cinema.\"],[\"Llego tarde a menudo.\",\"I am late often.\",\"I'm often late.\"],[\"Nunca trabaja los domingos.\",\"She works never on Sunday.\",\"She never works on Sunday.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m3l6e1\",\"type\":\"mc\",\"prompt\":\"«Esta peli me gusta mucho»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"I really like this film.\",\"I like very much this film.\",\"I like much this film.\"],\"answer\":0,\"whyWrong\":[null,\"Ahí has metido «very much» entre el verbo y su objeto: ese es el orden español, no el inglés\",\"«much» solo no acompaña a un verbo en afirmativa: hace falta very much o a lot\"],\"itemIds\":[\"ena2m3ireallylikethisfilm\"],\"tip\":\"Dos salidas y ninguna en medio: really delante del verbo, o very much detrás del objeto.\"},{\"id\":\"ena2m3l6e2\",\"type\":\"mc\",\"prompt\":\"«Habla inglés muy bien»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"She speaks English very well.\",\"She speaks very well English.\",\"She speaks very well the English.\"],\"answer\":0,\"whyWrong\":[null,\"El objeto (English) va pegado al verbo; el adverbio espera detrás\",\"Y además los idiomas no llevan artículo: English, no the English\"],\"itemIds\":[\"ena2m3shespeaksenglishverywell\"]},{\"id\":\"ena2m3l6e3\",\"type\":\"bucket\",\"prompt\":\"¿Está bien colocado o no?\",\"categories\":[\"bien colocado\",\"mal colocado\"],\"items\":[{\"text\":\"I really like this film\",\"bucket\":0},{\"text\":\"I like very much this film\",\"bucket\":1},{\"text\":\"She speaks English very well\",\"bucket\":0},{\"text\":\"She speaks very well English\",\"bucket\":1},{\"text\":\"I often go to the cinema\",\"bucket\":0},{\"text\":\"I go often to the cinema\",\"bucket\":1}],\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"ena2m3shespeaksenglishverywell\",\"ena2m3heoftengoestothecinema\",\"ena2m3often\"],\"tip\":\"Los tres malos tienen el mismo fallo: algo metido entre el verbo y lo que viene detrás. Es un solo error con tres disfraces.\"},{\"id\":\"ena2m3l6e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige el error más resistente del hispanohablante\",\"wrong\":\"I like very much this film.\",\"answers\":[\"I like this film very much.\"],\"why\":\"En inglés el objeto va pegado a su verbo: like this film. El «mucho» tiene que salir de en medio, y tiene dos sitios: delante del verbo (I really like this film) o al final de todo (I like this film very much). En español ese orden es natural, y por eso este error sobrevive hasta niveles altos si nadie lo nombra.\",\"translation\":\"Esta película me gusta mucho.\",\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"ena2m3ilikeitverymuch\"]},{\"id\":\"ena2m3l6e5\",\"type\":\"errorfix\",\"prompt\":\"El mismo error, otro disfraz\",\"wrong\":\"She speaks very well English.\",\"answers\":[\"She speaks English very well.\"],\"why\":\"Idéntico caso: English es el objeto de speaks y no se le separa. El adverbio de modo espera a que termine el objeto. Recuerda la lección 4: «She opened the door quietly», no «She opened quietly the door».\",\"translation\":\"Habla inglés muy bien.\",\"itemIds\":[\"ena2m3shespeaksenglishverywell\"]},{\"id\":\"ena2m3l6e6\",\"type\":\"errorfix\",\"prompt\":\"Y ahora con un adverbio de frecuencia\",\"wrong\":\"He goes often to the cinema.\",\"answers\":[\"He often goes to the cinema.\"],\"why\":\"Los adverbios de frecuencia (always, usually, often, sometimes, never) van DELANTE del verbo normal y DETRÁS de be. El español los coloca al final, y por eso salen «I go often» o «I am late often».\",\"translation\":\"Va al cine a menudo.\",\"itemIds\":[\"ena2m3heoftengoestothecinema\",\"ena2m3often\"]},{\"id\":\"ena2m3l6e7\",\"type\":\"cloze\",\"prompt\":\"Completa — el graduador va delante del verbo\",\"text\":\"I ___ like this café: the coffee is great.\",\"answers\":[\"really\"],\"translation\":\"Este café me gusta mucho: el café está buenísimo.\",\"hints\":[\"Seis letras, y significa «de verdad, mucho»\",\"r…\"],\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"encoffee\"]},{\"id\":\"ena2m3l6e8\",\"type\":\"transform\",\"prompt\":\"La otra salida: el bloque al final\",\"source\":\"I really like this film.\",\"instruction\":\"Dilo con el bloque al final, en vez de delante del verbo\",\"answers\":[\"I like this film very much.\",\"I like this film a lot.\"],\"translation\":\"Esta película me gusta mucho.\",\"hints\":[\"El objeto se queda pegado al verbo y el «mucho» se va al final\",\"I like this film v… m…\"],\"itemIds\":[\"ena2m3ilikeitverymuch\",\"ena2m3ireallylikethisfilm\"]},{\"id\":\"ena2m3l6e9\",\"type\":\"build\",\"prompt\":\"Construye la frase con el adverbio de frecuencia\",\"target\":\"She often works at the weekend\",\"translation\":\"Trabaja los fines de semana a menudo\",\"distractors\":[\"work\",\"always\"],\"itemIds\":[\"ena2m3often\",\"enatweekend\",\"enwork\"],\"tip\":\"often va delante del verbo, no al final. Y el verbo mantiene su -s de tercera persona: works.\"},{\"id\":\"ena2m3l6e10\",\"type\":\"gapbank\",\"prompt\":\"Los viernes de Ben: rellena con la ficha que toca\",\"text\":\"Ben ___ goes to the cinema on Fridays. He likes action films very ___, but he doesn't like horror films. His sister speaks English very ___, and she reads ___.\",\"answers\":[\"often\",\"much\",\"well\",\"quickly\"],\"bank\":[\"often\",\"much\",\"well\",\"quickly\",\"never\",\"slowly\"],\"translation\":\"Ben va al cine a menudo los viernes. Las películas de acción le gustan mucho, pero las de terror no. Su hermana habla inglés muy bien y lee deprisa.\",\"itemIds\":[\"ena2m3often\",\"ena2m3ilikeitverymuch\",\"ena2m3well\",\"ena2m3quickly\",\"enletsgotothecinema\"],\"tip\":\"Fíjate en el segundo hueco: «very much» va detrás del objeto (action films), nunca entre likes y films.\"},{\"id\":\"ena2m3l6e11\",\"type\":\"audiomc\",\"prompt\":\"Qué le gusta y qué no — 2 escuchas\",\"audio\":\"I really like this café, but I don't like the music very much.\",\"question\":\"¿Qué le gusta?\",\"options\":[\"El café, pero no mucho la música\",\"La música, pero no el café\",\"Ni el café ni la música\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Está al revés: el «really like» va con el café\",\"El café sí le gusta: lo dice en la primera mitad\"],\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"ena2m3ilikeitverymuch\"],\"tip\":\"Las dos mitades usan las DOS salidas: really delante del verbo, very much al final. Ninguna en medio.\"},{\"id\":\"ena2m3l6e12\",\"type\":\"write\",\"prompt\":\"Contesta a Emma — 30-50 palabras\",\"scenario\":\"Emma, tu amiga de Manchester, te escribe: «I need a good film for Saturday night. What do you like?». Contéstale por email.\",\"bullets\":[\"Di qué película te gusta, con «I really like…» o «I like… a lot»\",\"Descríbela con un graduador (quite, so, a bit, very)\",\"Di algo que alguien hace de una manera concreta, con un adverbio\"],\"checks\":[{\"re\":\"(i really like|i like .* a lot|i love)\",\"label\":\"«I really like…» o «I like… a lot»\"},{\"re\":\"(quite|so |a bit|very|really)\",\"label\":\"un graduador (quite, so, a bit, very)\"},{\"re\":\"(very well|really well|beautifully|badly|quickly|slowly|quietly|carefully)\",\"label\":\"un adverbio de modo bien colocado\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"direct\",\"requireConnectors\":{\"min\":2,\"bank\":[\"and\",\"but\",\"because\",\"so\"]},\"model\":\"Hi Emma! I really like an old Colombian film, Los pajaros. It's quite long, but it isn't boring: the story is very interesting and the actors speak slowly, so you understand everything. I like it very much. Watch it!\",\"itemIds\":[\"ena2m3ireallylikethisfilm\",\"ena2m3ilikeitverymuch\",\"ena2m3slowly\",\"ena2m3quitetall\"],\"tip\":\"Cuenta las palabras y revisa una sola cosa antes de darle a corregir: que no haya nada metido entre un verbo y su objeto. Es donde el corrector del examen te va a mirar.\"},{\"id\":\"ena2m3l6e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Voy al cine a menudo y me gusta muchísimo.\",\"answers\":[\"I often go to the cinema and I like it very much.\",\"I often go to the cinema and I really like it.\",\"I often go to the cinema and I like it a lot.\"],\"hints\":[\"often delante del verbo · very much al final\",\"I o… go to the cinema and I like it v… much.\"],\"itemIds\":[\"ena2m3heoftengoestothecinema\",\"ena2m3ilikeitverymuch\",\"ena2m3often\"],\"tip\":\"Las dos reglas de la lección en una sola frase. Si te sale sin pararte a pensar, has cerrado el error más caro del nivel.\"}]}],\"resources\":[{\"label\":\"British Council — Adverbials: position\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/adverbials-position\",\"note\":\"Lee solo el apartado de mid position y end position, y busca en los ejemp
