shat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Te60,"])</script><script>self.__next_f.push([1,"Most people in Britain can name their monthly salary. Far fewer can name their [[take-home pay|líquido]] without turning the [[payslip|nómina]] over. That gap is not a private failing. It is the result of a document that was designed by payroll software, not by a reader, and of a culture that still treats pay as a secret even when the law has started to treat it as information.\u003cbr/\u003e\u003cbr/\u003eThis briefing does not argue that everyone should discuss their salary at lunch. It sets out what the numbers on a UK payslip actually mean, and what has changed, quietly, in the last few years.\u003cbr/\u003e\u003cbr/\u003eThe top figure is [[gross pay|bruto]]. It is the contractual amount before anything is taken off. Below it sit the deductions. Income tax is the one people expect. [[National Insurance|la Seguridad Social británica]] is the one they ring the agency about, convinced there has been a [[delay in payment|retraso en el pago]]. There has not. NI is a deduction with another name, and it is not optional. Pension contributions, where they exist, sit on the same list. What remains is net pay, also called take-home pay: the figure that hits the bank.\u003cbr/\u003e\u003cbr/\u003eA 2024 survey of workers in hospitality and social care in Greater London found that two in five could not identify the NI line on their own payslip, and that one in three had, at least once, compared the gross figure with a colleague's net figure and concluded they were being underpaid. They were often wrong. They were also, the briefing notes, not foolish. The document invites the mistake.\u003cbr/\u003e\u003cbr/\u003e[[Pay transparency|transparencia salarial]] has a narrower meaning in law than it has in columns. From 2026, larger employers in Britain are being pushed to publish more about the range of pay for a role, and some job adverts now carry a salary band as a matter of course. The briefing records this as a fact. It does not say the bands are generous, and it does not say they are honest. It says they exist, and that a candidate who cannot read a band is at a disadvantage that has nothing to do with talent.\u003cbr/\u003e\u003cbr/\u003eWhat would actually [[ease the workload|aliviar la carga]] of the first month in a new post is smaller and less glamorous. A one-page key to the payslip, written in the language of the people who receive it. A line in the [[job description|descripción del puesto]] that states the hours, the overtime rate, and whether December runs longer. A named person to ask, in writing, when a deduction appears that was not there the month before. None of this requires a campaign. All of it requires a sentence that does one job.\u003cbr/\u003e\u003cbr/\u003eThe last number is the one the briefing will not dress up. In inner London, the [[going rate|lo que se está pagando]] for part-time advice-desk work sits well below what a full-time bus driver earns with overtime, and well above what a café pays for the same number of hours. That is not a moral ranking. It is a map. People who cannot read the map spend their first three months angry at the wrong figure.\u003cbr/\u003e\u003cbr/\u003eA further practical point, because the first month is where most of the anger sits. New starters often have a [[probation period|periodo de prueba]] of three or six months, during which hours can still move and overtime is not always in the contract. The briefing's advice is unglamorous and the same in every sector it has looked at: photograph the job description on day one, keep every payslip, and put questions to payroll in writing. A sentence that does one job is worth more, in that first month, than a conversation on a bus about who earns more. The bus will still be there on Friday. The wrong figure, once it has been believed, is harder to unsay."])</script><script>self.__next_f.push([1,"18:Td36,"])</script><script>self.__next_f.push([1,"I am tired of being told that not discussing my salary is a political failure. It is manners. It is also, in every workplace I have actually lasted in, the difference between a team and a queue of people waiting to be offended.\u003cbr/\u003e\u003cbr/\u003eThe charities will tell you that [[pay transparency|transparencia salarial]] is overdue. They have studies, and the studies are not nothing. They say people who cannot read a [[payslip|nómina]] are at a disadvantage, and I believe them. I have been that person. I have stared at [[National Insurance|NI]] and thought the company was stealing. It was not. I rang someone, I asked, I learned. I did not stand up in the staff room and ask the man next to me what he took home, which is the gesture the new columns keep dressing up as courage.\u003cbr/\u003e\u003cbr/\u003ePay is not a personality. It is a contract. The going rate for a job is useful when you apply. It is poison when you have already signed, because there is always someone in the room who does more overtime, or who started in a cheaper year, or who has a child and a rent that make the same figure look like a different life. Comparing [[take-home pay|líquido]] across those lives is not information. It is a hobby that eats goodwill.\u003cbr/\u003e\u003cbr/\u003eI have watched it happen. A café that used to close well starts to close badly because two people learned, in a round of drinks, that their [[net pay|neto]] was not the same. A bus garage that used to cover shifts for each other becomes a place where nobody picks up the phone after five. The [[rise in|subida de]] resentment is faster than any rise in pay. The people who publish the studies never have to work the Christmas rota with the person they have just taught to feel cheated.\u003cbr/\u003e\u003cbr/\u003eThe practical proposal is not secrecy for its own sake. Read your own payslip. Learn the difference between gross and net. Ask payroll, in writing, about a deduction you do not recognise. Ask the agency, if you have one. Do not ask the colleague who has to sit next to you on Monday. That question does not ease anyone's [[workload|carga]]. It adds one.\u003cbr/\u003e\u003cbr/\u003eI know the counter-argument. Silence protects the employer. Sometimes it does. It also protects the person who cannot afford a war at work, and who is not a coward for choosing a contract over a scene. A considerable sum on a spreadsheet is still a considerable sum if nobody else at the table knows it. It is not made larger by being announced.\u003cbr/\u003e\u003cbr/\u003eIf that sounds old-fashioned, it is because some old-fashioned things still work. A team is not an audience. A payslip is not a poster. Keep yours in your bag, learn what it says, and let other people keep theirs. The city is expensive enough without turning the staff room into another market.\u003cbr/\u003e\u003cbr/\u003eI will concede one thing, because the briefing is not wrong about everything. A worker who cannot tell [[gross pay|bruto]] from net is at a real disadvantage, and pretending otherwise is snobbery. Learn the document. Learn the going rate for the job before you sign. Ask the agency, if you have one, to confirm a deduction in a single written line. Do all of that. Then stop. The leap from «I can read my own payslip» to «I am entitled to the contents of yours» is the leap the new columns want you to make, and it is the leap I will not make with you. Manners, in this particular city, are not a luxury. They are how people last."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m2l6\",\"phaseId\":\"enb2m2\",\"title\":\"What the payslip actually says\",\"subtitle\":\"Dos lecturas: un informe sobre transparencia salarial, y una columna que pide silencio\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de los dos textos\",\"itemIds\":[\"enb2m2grosspay\",\"enb2m2netpay\",\"enb2m2nationalinsurance\",\"enb2m2paytransparency\",\"enb2m2thegoingrate\",\"enb2m2ease\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos textos, el mismo sueldo, dos intenciones\",\"body\":\"Otra vez dos lecturas del mismo asunto. Hoy: \u003cb\u003ehablar del sueldo\u003c/b\u003e. El primero es un informe de una organización laboral sobre [[pay transparency|transparencia salarial]] y alfabetización de la nómina. El segundo es una columna que sostiene que preguntar lo que cobra un compañero es de mal gusto, y que la transparencia es una moda que rompe equipos.\u003cbr/\u003e\u003cbr/\u003eLos dos usan cifras. Solo uno quiere que, el lunes, hagas algo distinto con tu [[payslip|nómina]]. Lee primero el título, adivina la postura, y no pares en cada palabra nueva. Al menos dos preguntas de cada texto son de inferencia.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m2l6e1\",\"type\":\"read\",\"prompt\":\"Lee el informe. Toca las glosas si te bloquean. Luego responde.\",\"title\":\"The number at the bottom\",\"source\":\"From a briefing by a London workers' advice charity (adapted)\",\"text\":\"$17\",\"questions\":[{\"id\":\"enb2m2l6e1q1\",\"q\":\"What is the briefing mainly trying to do?\",\"options\":[\"Explain what the figures on a UK payslip mean, without telling people to discuss pay at lunch.\",\"Convince workers to demand a higher salary from their manager on Monday.\",\"Argue that National Insurance is optional and often a mistake.\"],\"answer\":0,\"inference\":true,\"why\":\"«This briefing does not argue that everyone should discuss their salary at lunch. It sets out what the numbers… actually mean.» La C es lo contrario de lo que dice sobre NI.\"},{\"id\":\"enb2m2l6e1q2\",\"q\":\"Why do people ring the agency about National Insurance?\",\"options\":[\"Because they think there has been a delay in payment, and there has not.\",\"Because NI is a new tax that only started in 2026.\",\"Because the agency takes NI out twice by mistake.\"],\"answer\":0,\"why\":\"«National Insurance is the one they ring the agency about, convinced there has been a delay in payment. There has not.»\"},{\"id\":\"enb2m2l6e1q3\",\"q\":\"What mistake did one in three workers in the survey make?\",\"options\":[\"They compared a gross figure with a colleague's net figure.\",\"They refused to open the payslip at all.\",\"They published their salary on social media.\"],\"answer\":0,\"why\":\"«one in three had, at least once, compared the gross figure with a colleague's net figure».\"},{\"id\":\"enb2m2l6e1q4\",\"q\":\"What does the briefing say pay transparency means in law?\",\"options\":[\"A narrower thing than in columns: more published information about the range of pay for a role.\",\"A duty to tell your colleagues the exact figure on the bottom of your payslip.\",\"A ban on salary bands in job adverts.\"],\"answer\":0,\"why\":\"«Pay transparency has a narrower meaning in law than it has in columns» y describe las bandas en anuncios.\"},{\"id\":\"enb2m2l6e1q5\",\"q\":\"Why does the briefing end with the comparison between advice-desk work, bus driving and café hours?\",\"options\":[\"To offer a map of the going rate, not a moral ranking of jobs.\",\"To tell café workers they should retrain as bus drivers.\",\"To prove that advice-desk work is the best-paid part-time job in London.\"],\"answer\":0,\"inference\":true,\"why\":\"«That is not a moral ranking. It is a map.» Quien elige B o C ha leído la cifra y no la función del párrafo.\"}],\"itemIds\":[\"enb2m2takehomepay\",\"enb2m2grosspay\",\"enb2m2nationalinsurance\",\"enb2m2paytransparency\",\"enb2m2thegoingrate\",\"enb2m2thedelayin\"]},{\"id\":\"enb2m2l6e2\",\"type\":\"read\",\"prompt\":\"Ahora la columna. Misma ciudad, mismo sueldo, otra intención.\",\"title\":\"Keep your payslip in your bag\",\"source\":\"Opinion column in a London weekly (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m2l6e2q1\",\"q\":\"What is the writer asking the reader not to do?\",\"options\":[\"Ask a colleague what they take home.\",\"Read their own payslip or contact payroll.\",\"Use salary bands when they apply for a job.\"],\"answer\":0,\"why\":\"«Do not ask the colleague who has to sit next to you on Monday.» Leer la nómina propia y preguntar a payroll SÍ lo recomienda.\"},{\"id\":\"enb2m2l6e2q2\",\"q\":\"Why does the writer call comparing take-home pay «a hobby that eats goodwill»?\",\"options\":[\"Because people's lives around the same figure are not the same, so the comparison is not information.\",\"Because take-home pay is illegal to mention under any circumstances.\",\"Because charities have proved that all salaries in London are already equal.\"],\"answer\":0,\"inference\":true,\"why\":\"El párrafo del contrato: overtime, año de entrada, hijos, alquiler. La cifra no es comparable sin esa capa. Eso hay que inferirlo como «no es información».\"},{\"id\":\"enb2m2l6e2q3\",\"q\":\"What happened, according to the writer, in the café and the bus garage?\",\"options\":[\"Once people learned that net pay was not the same, cooperation got worse.\",\"Pay rose, and the resentment disappeared.\",\"The studies forced both workplaces to publish every salary.\"],\"answer\":0,\"why\":\"«A café that used to close well starts to close badly… A bus garage… nobody picks up the phone after five.»\"},{\"id\":\"enb2m2l6e2q4\",\"q\":\"Who does the writer say silence also protects?\",\"options\":[\"The person who cannot afford a war at work.\",\"Only the employer, in every case.\",\"The charity that published the survey.\"],\"answer\":0,\"why\":\"«It also protects the person who cannot afford a war at work, and who is not a coward for choosing a contract over a scene.»\"},{\"id\":\"enb2m2l6e2q5\",\"q\":\"How does this column use the briefing's material?\",\"options\":[\"It accepts that people misread payslips, then refuses the leap from that fact to discussing pay with colleagues.\",\"It denies that National Insurance exists.\",\"It copies the briefing's last paragraph and agrees with the map of the going rate.\"],\"answer\":0,\"inference\":true,\"why\":\"«I have stared at National Insurance and thought the company was stealing. It was not.» Acepta el dato del informe. Niega la consecuencia política. Eso es stance.\"}],\"itemIds\":[\"enb2m2paytransparency\",\"enb2m2netpay\",\"enb2m2takehomepay\",\"enb2m2workload\",\"enb2m2considerablesum\"]},{\"id\":\"enb2m2l6e3\",\"type\":\"mc\",\"prompt\":\"Las dos posturas\",\"question\":\"¿En qué se distinguen de verdad los dos textos?\",\"options\":[\"El informe enseña a leer la nómina y se niega a convertir eso en una campaña; la columna acepta la lectura y rechaza la pregunta al compañero.\",\"El informe está a favor de hablar del sueldo en el almuerzo y la columna no ha visto una nómina.\",\"El informe habla de Londres y la columna, de otra ciudad.\"],\"answer\":0,\"whyWrong\":[null,\"La columna HA visto una nómina: cuenta el error de NI. El informe NO pide el almuerzo.\",\"Los dos están en Londres, y la columna usa un garaje de autobuses a propósito.\"],\"itemIds\":[\"enb2m2paytransparency\"]},{\"id\":\"enb2m2l6e4\",\"type\":\"cloze\",\"prompt\":\"La casilla que la gente llama «retraso»\",\"text\":\"People ring the agency about ___ Insurance, convinced there has been a delay.\",\"answers\":[\"National\"],\"translation\":\"La gente llama a la agencia por la National Insurance, convencida de que ha habido un retraso.\",\"itemIds\":[\"enb2m2nationalinsurance\",\"enb2m2thedelayin\"]},{\"id\":\"enb2m2l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Sin «going rate» — una formulación precisa, no un rodeo de B1\",\"source\":\"That is the going rate for the job.\",\"forbid\":[\"going\",\"rate\"],\"answers\":[\"That is what the job pays at the moment\",\"That is what people are paying for the job now\",\"That is the current market pay for the job\",\"That is what the job is paying now\"],\"translation\":\"Eso es lo que se está pagando ahora mismo por el puesto.\",\"itemIds\":[\"enb2m2thegoingrate\"]},{\"id\":\"enb2m2l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume los dos textos sin mezclarles la postura\",\"text\":\"The briefing explains ___ pay, net pay and National ___. It records that pay ___ is narrower in law than in columns. The column accepts the misreading of the payslip. ___, it tells the reader not to ask a colleague what they take home.\",\"answers\":[\"gross\",\"Insurance\",\"transparency\",\"Nevertheless\"],\"bank\":[\"gross\",\"Insurance\",\"transparency\",\"Nevertheless\",\"net\",\"Moreover\",\"agenda\"],\"translation\":\"El informe explica el bruto, el neto y la National Insurance. Deja constancia de que la transparencia salarial es más estrecha en la ley que en las columnas. La columna acepta la mala lectura de la nómina. Aun así, dice al lector que no pregunte a un compañero lo que cobra.\",\"itemIds\":[\"enb2m2grosspay\",\"enb2m2nationalinsurance\",\"enb2m2paytransparency\",\"enb2m1nevertheless\"]},{\"id\":\"enb2m2l6e7\",\"type\":\"errorfix\",\"prompt\":\"Después de leer, un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"The column says the rise of resentment is fast.\",\"answers\":[\"The column says the rise in resentment is fast.\",\"The column says the rise in resentment is faster than any rise in pay.\"],\"why\":\"Rise IN, no rise OF: la misma preposición que the rise in prices. El calco es «la subida de».\",\"translation\":\"La columna dice que la subida del resentimiento es rápida.\",\"itemIds\":[\"enb2m2therisein\"]},{\"id\":\"enb2m2l6e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"La frase del informe\",\"source\":\"People who cannot read the map spend their first three months angry at the wrong figure.\",\"answers\":[\"Quienes no saben leer el mapa se pasan los tres primeros meses enfadados con la cifra equivocada\",\"La gente que no sabe leer el mapa pasa sus tres primeros meses enfadada con la cifra incorrecta\",\"Quien no sabe leer el mapa se pasa los tres primeros meses enfadado con la cifra equivocada\"],\"itemIds\":[\"enb2m2thegoingrate\",\"enb2m2precisely\"]},{\"id\":\"enb2m2l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"El bruto no es el líquido. La práctica está muy extendida.\",\"answers\":[\"Gross pay is not take-home pay. The practice is widespread.\",\"Gross pay is not net pay. The practice is widespread.\"],\"itemIds\":[\"enb2m2grosspay\",\"enb2m2takehomepay\",\"enb2m2widespread\"]},{\"id\":\"enb2m2l6e10\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Ben, después de leer. Pregunta antes del play. Una sola escucha.\",\"audio\":\"The first one just wants you to read the bottom line.|The second one wants you to keep it in your bag. Same payslip, opposite Monday.|Would you ask me what I take home?|Not on the bus. Not after this column. I'd ask Nadia, in writing, if a deduction looked wrong.\",\"question\":\"¿Qué haría Valeria si una retención se viera rara?\",\"options\":[\"Preguntarle a Nadia por escrito, no a Ben en el autobús\",\"Preguntarle a Ben, porque es su amigo\",\"No abrir la nómina, como dice la columna\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Dice explícitamente que no en el autobús.\",\"La columna dice que SÍ leas la tuya. Lo que no hagas es preguntar al de al lado.\"],\"itemIds\":[\"enb2m2adeduction\",\"enb2m2notify\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"6\",{}]]\n"])</script></body></html>
