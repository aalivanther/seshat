u003c/b\u003e + frase: \u003ci\u003eIt is likely that the noise comes from next door.\u003c/i\u003e\u003cbr/\u003eLas dos dicen lo mismo. La de \u003ci\u003ethat\u003c/i\u003e es más de informe; la de \u003ci\u003eto\u003c/i\u003e, más de conversación.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escala, de más seguro a menos:\u003c/b\u003e\u003cbr/\u003e1. \u003ci\u003eIt's bound to…\u003c/i\u003e / \u003ci\u003eIt's certain to…\u003c/i\u003e — inevitable.\u003cbr/\u003e2. \u003ci\u003eIt is highly likely that…\u003c/i\u003e — te mojas mucho, con datos.\u003cbr/\u003e3. \u003ci\u003eIt's likely to…\u003c/i\u003e — te mojas.\u003cbr/\u003e4. \u003ci\u003eIt may well be…\u003c/i\u003e — te mojas a medias, con un empujón.\u003cbr/\u003e5. \u003ci\u003eIt could be…\u003c/i\u003e / \u003ci\u003eIt might be…\u003c/i\u003e — no lo descarto.\u003cbr/\u003e6. \u003ci\u003eIt's much less likely…\u003c/i\u003e — lo bajo de altura a propósito.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl calco:\u003c/b\u003e ❌ \u003ci\u003eIt's probably that it rains.\u003c/i\u003e El español pone «que» detrás de «probable»; el inglés no. O \u003ci\u003elikely to\u003c/i\u003e + infinitivo, o \u003ci\u003elikely that\u003c/i\u003e + frase. Nunca las dos a la vez.\u003cbr/\u003e\u003cbr/\u003eY un aviso de nivel: \u003cb\u003e«I think»\u003c/b\u003e no es un error. Es la salida fácil. En un informe, en una charla y en el Speaking Part 4, \u003ci\u003eI think\u003c/i\u003e te deja en B1. El B2 se quita de en medio."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l1\",\"phaseId\":\"enb2m5\",\"title\":\"More likely than not\",\"subtitle\":\"La escala: de «puede» a «casi seguro», sin decir «yo creo»\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis alturas de la misma afirmación\",\"itemIds\":[\"enb2m5islikelyto\",\"enb2m5highlylikelythat\",\"enb2m5morelikelyto\",\"enb2m5muchlesslikely\",\"enb2m5maywellbe\",\"enb2m5natoddsare\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el B2 no aprende modales nuevos; aprende a mojarse a medias\",\"body\":\"$17\",\"table\":[[\"Altura\",\"Fórmula\",\"Cuándo\"],[\"Inevitable\",\"bound to / certain to\",\"no hay otra lectura\"],[\"Muy probable\",\"highly likely that\",\"hay datos, no certeza\"],[\"Probable\",\"likely to / likely that\",\"la altura por defecto del informe\"],[\"Bien podría\",\"may well be\",\"posible y además plausible\"],[\"No lo descarto\",\"could / might\",\"una hipótesis más\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l1e1\",\"type\":\"match\",\"prompt\":\"Empareja cada fórmula con la altura de compromiso\",\"pairs\":[{\"target\":\"It's bound to fail if we rush it.\",\"source\":\"inevitable: no hay otra lectura\"},{\"target\":\"It is highly likely that the sample is contaminated.\",\"source\":\"muy probable: hay datos, no certeza\"},{\"target\":\"It's likely to rain later.\",\"source\":\"probable: la altura por defecto\"},{\"target\":\"It may well be a coincidence.\",\"source\":\"bien podría: plausible, no segura\"},{\"target\":\"It's much less likely than it looks.\",\"source\":\"la bajas de altura a propósito\"}],\"itemIds\":[\"enb2m5boundto\",\"enb2m5highlylikelythat\",\"enb2m5islikelyto\",\"enb2m5maywellbe\",\"enb2m5muchlesslikely\"],\"tip\":\"Cinco frases, cinco alturas. El examen no pregunta «¿es correcto?»: pregunta «¿cuánto se moja el que habla?».\"},{\"id\":\"enb2m5l1e2\",\"type\":\"mc\",\"prompt\":\"El «that» y el «to» no se mezclan\",\"question\":\"«Es muy probable que la muestra esté contaminada» →\",\"options\":[\"It is highly likely that the sample is contaminated.\",\"It is highly likely the sample to be contaminated.\",\"It is highly likely that the sample to be contaminated.\"],\"answer\":0,\"whyWrong\":[null,\"Has mezclado las dos construcciones: o «likely that + frase» o «likely to + infinitivo».\",\"Sobra el «to be»: detrás de «that» va una frase con sujeto y verbo conjugado.\"],\"itemIds\":[\"enb2m5highlylikelythat\"],\"tip\":\"Atajo: si ves «that», lo que sigue es una frase (the sample IS). Si ves «to», lo que sigue es infinitivo (the sample is likely TO be).\"},{\"id\":\"enb2m5l1e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It's probably to rain later.\",\"answers\":[\"It's likely to rain later.\"],\"why\":\"«Probably» es un adverbio y no abre una cláusula con «that». O «It's likely to rain», o «It will probably rain», o «It's likely that it will rain». Las tres valen; la que el módulo enseña es la primera.\",\"translation\":\"Es probable que llueva más tarde.\",\"itemIds\":[\"enb2m5islikelyto\"]},{\"id\":\"enb2m5l1e4\",\"type\":\"transform\",\"prompt\":\"Súbelo de altura: de «puede» a «muy probable»\",\"source\":\"It might rain later.\",\"instruction\":\"Dilo con «highly likely that»\",\"answers\":[\"It is highly likely that it will rain later\",\"It's highly likely that it will rain later\",\"It is highly likely that it rains later\"],\"translation\":\"Es muy probable que llueva más tarde.\",\"hints\":[\"Empieza por «It is highly likely that…»\",\"It is highly likely that it will ... later\"],\"itemIds\":[\"enb2m5highlylikelythat\"],\"tip\":\"Subir de altura no es poner «very» delante de «might». Es cambiar de máquina: de un modal a una perífrasis con be.\"},{\"id\":\"enb2m5l1e5\",\"type\":\"bucket\",\"prompt\":\"¿Cuánto se moja el que habla?\",\"categories\":[\"SE MOJA — probable o más\",\"NO SE MOJA — posible, no más\"],\"items\":[{\"text\":\"It's likely to rain later.\",\"bucket\":0},{\"text\":\"It is highly likely that the sample is contaminated.\",\"bucket\":0},{\"text\":\"Younger people are more likely to believe it.\",\"bucket\":0},{\"text\":\"It may well be a coincidence.\",\"bucket\":1},{\"text\":\"It might be an allergy.\",\"bucket\":1},{\"text\":\"It could be the pipes.\",\"bucket\":1}],\"itemIds\":[\"enb2m5islikelyto\",\"enb2m5highlylikelythat\",\"enb2m5morelikelyto\",\"enb2m5maywellbe\",\"enb1m6mightbe\"],\"tip\":\"«May well» engaña: suena seguro y no lo es. El «well» empuja hacia lo plausible, no hacia lo cierto. En un informe, no lo uses como cierre.\"},{\"id\":\"enb2m5l1e6\",\"type\":\"cloze\",\"prompt\":\"Completa la comparación de probabilidades\",\"text\":\"Younger people are more ___ to believe an unexplained story than a dull one.\",\"answers\":[\"likely\"],\"translation\":\"La gente joven es más propensa a creerse una historia sin explicar que una aburrida.\",\"hints\":[\"Es el adjetivo de probabilidad del módulo\",\"lik...\"],\"itemIds\":[\"enb2m5morelikelyto\"],\"tip\":\"«more / less likely to» es la pieza que el handbook pide con nombre propio: no solo decir que algo es probable, sino COMPARAR dos probabilidades.\"},{\"id\":\"enb2m5l1e7\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — sin «I think»\",\"source\":\"Es mucho menos probable de lo que parece.\",\"answers\":[\"It's much less likely than it looks\",\"It is much less likely than it looks\",\"It's much less likely than it seems\"],\"hint\":\"Empieza por «It's much less…»\",\"itemIds\":[\"enb2m5muchlesslikely\"],\"tip\":\"Bajar de altura a propósito es una habilidad de B2: no es dudar, es situar. El examinador lo oye.\"},{\"id\":\"enb2m5l1e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la altura por defecto del informe\",\"text\":\"It is highly likely that the sample is contaminated.\",\"phonetic\":\"it is̬ JÁI-li LÁIK-li dat de SÁAM-pol is̬ kon-TÁ-mi-nei-tid\",\"translation\":\"Es muy probable que la muestra esté contaminada.\",\"itemIds\":[\"enb2m5highlylikelythat\"],\"tip\":\"El golpe va en HIGH-ly, LIKE-ly y CON-ta. «That» y «is» pasan de puntillas. Si le das el mismo peso a todas las sílabas, suena a lista de la compra, no a informe.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb2m5-1\",\"book\":\"It is probable that\",\"real\":\"Odds are\",\"meaning\":\"Lo más seguro es que… / Hay muchas papeletas de que…\",\"when\":\"Con amigos, al vaticinar algo cotidiano: que llegue tarde, que llueva, que el autobús no venga. En un informe, en una reclamación o en el Writing del examen no cabe: allí la misma altura se dice «It is highly likely that».\",\"register\":\"amigos\",\"exam\":\"It is highly likely that\",\"note\":\"«Odds» son las cuotas de una apuesta. Quien ignore la raya de Odds are y ponga «It is probable that» en una caña no pasa nada; quien ponga «Odds are» en el informe le baja la banda de registro.\",\"sound\":\"ods aa\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"enb2m5natoddsare\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
