 es una secuencia — y tú ya tienes los conectores del A1 para narrarla: \u003cb\u003ezuerst\u003c/b\u003e → \u003cb\u003edann\u003c/b\u003e → \u003cb\u003edanach\u003c/b\u003e → \u003cb\u003eam Abend\u003c/b\u003e. El plan completo: \u003ci\u003eZuerst schicke ich die Einladungen. Dann kaufe ich ein. Danach bereite ich die Wohnung vor. Am Abend feiern wir zusammen — \u003cb\u003elos geht's!\u003c/b\u003e\u003c/i\u003e Y como el anfitrión no lo hace todo solo, reparte tareas con el imperativo de la lección 2: a uno — \u003ci\u003e\u003cb\u003eBring\u003c/b\u003e bitte einen Kuchen \u003cb\u003emit\u003c/b\u003e!\u003c/i\u003e — y a varios — \u003ci\u003e\u003cb\u003eKauft\u003c/b\u003e bitte Saft und Brot!\u003c/i\u003e Fíjate cómo los separables (mitbringen, vorbereiten) mantienen su prefijo al final también dentro de la cadena: la pinza nunca descansa.\",\"table\":[[\"paso\",\"frase del plan\"],[\"1 · zuerst\",\"Zuerst schicke ich die Einladungen\"],[\"2 · dann\",\"Dann kaufe ich Saft, Brot und einen Kuchen\"],[\"3 · danach\",\"Danach bereite ich die Wohnung vor\"],[\"4 · am Abend\",\"Am Abend feiern wir zusammen!\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m9l6e1\",\"type\":\"order\",\"prompt\":\"Ordena el plan de la fiesta\",\"sentences\":[\"Zuerst schicke ich die Einladungen.\",\"Dann kaufe ich Saft, Brot und einen Kuchen.\",\"Danach bereite ich die Wohnung vor.\",\"Am Abend feiern wir zusammen — los geht's!\"],\"translation\":\"Primero envío las invitaciones. Luego compro zumo, pan y un pastel. Después preparo el piso. Por la noche celebramos juntos — ¡allá vamos!\",\"hints\":[\"La cadena del A1: zuerst → dann → danach → am Abend\",\"Primero se invita, al final se celebra\"],\"itemIds\":[\"zuerst\",\"a2m9einladung\",\"schicken\",\"dann\",\"saft\",\"brot\",\"kuchen\",\"danach\",\"a2m9vorbereiten\",\"wohnung\",\"amabend\",\"a2m9feiern\",\"a2m9losgehts\"],\"tip\":\"La lógica manda: sin Einladungen no hay Gäste, sin compra no hay Kuchen — y feiern siempre cierra.\"},{\"id\":\"a2m9l6e2\",\"type\":\"build\",\"prompt\":\"Reparte la tarea — a Leo y Sofia (ihr)\",\"target\":\"Kauft bitte Saft und Brot\",\"translation\":\"Comprad zumo y pan, por favor\",\"altTargets\":[\"Bitte kauft Saft und Brot\"],\"distractors\":[\"Kaufen\",\"gekauft\"],\"itemIds\":[\"kaufen\",\"saft\",\"brot\"],\"tip\":\"A dos amigos se les ordena con la forma de ihr sin pronombre: Kauft! — «Kaufen Sie» sería para desconocidos.\"},{\"id\":\"a2m9l6e3\",\"type\":\"build\",\"prompt\":\"Reparte la tarea — a Nico (du)\",\"target\":\"Bring bitte einen Kuchen mit\",\"translation\":\"Trae un pastel, por favor\",\"altTargets\":[\"Bitte bring einen Kuchen mit\"],\"distractors\":[\"Gebracht\",\"du\"],\"itemIds\":[\"a2m9mitbringen\",\"kuchen\"],\"tip\":\"Imperativo separable: Bring abre la orden, mit la cierra — y el bitte en medio la endulza.\"},{\"id\":\"a2m9l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa el primer paso\",\"text\":\"Zuerst schicke ich die ___. (invitaciones)\",\"answers\":[\"Einladungen\"],\"translation\":\"Primero envío las invitaciones.\",\"hints\":[\"Plural de die Einladung\",\"Einladung + en, con mayúscula\"],\"itemIds\":[\"a2m9einladung\",\"schicken\",\"zuerst\"]},{\"id\":\"a2m9l6e5\",\"type\":\"mc\",\"prompt\":\"Comprensión del plan\",\"question\":\"En el plan de la fiesta, ¿qué haces PRIMERO?\",\"options\":[\"Enviar las invitaciones\",\"Comprar zumo y pan\",\"Celebrar con todos\"],\"answer\":0,\"whyWrong\":[null,\"Eso es el paso 2 — dann\",\"Eso es el final — am Abend feiern wir\"],\"itemIds\":[\"zuerst\",\"a2m9einladung\"],\"tip\":\"zuerst marca el arranque de toda secuencia alemana — sin invitados no hay fiesta que preparar.\"},{\"id\":\"a2m9l6e6\",\"type\":\"cloze\",\"prompt\":\"Completa el gran final\",\"text\":\"Am Abend ___ wir zusammen. (celebramos)\",\"answers\":[\"feiern\"],\"translation\":\"Por la noche celebramos juntos.\",\"hints\":[\"El verbo de la lección 3\",\"Am Abend abre → el verbo va 2º\"],\"itemIds\":[\"a2m9feiern\",\"a2m9wirfeiernzusammen\",\"amabend\"],\"tip\":\"Am Abend abre la frase → feiern inmediatamente 2º y wir 3º: la inversión del A1, ahora en la fiesta.\"},{\"id\":\"a2m9l6e7\",\"type\":\"listen\",\"prompt\":\"Escucha el chunk del anfitrión\",\"text\":\"Wir feiern zusammen\",\"translation\":\"Celebramos juntos\",\"hints\":[\"El título del módulo, casi\",\"Wir ... zusammen\"],\"itemIds\":[\"a2m9wirfeiernzusammen\",\"a2m9feiern\"]},{\"id\":\"a2m9l6e10\",\"type\":\"hearreal\",\"prompt\":\"El plan está cerrado y tu amigo se despide — escucha: ¿qué significa?\",\"book\":\"Auf Wiedersehen!\",\"real\":\"Bis dann!\",\"translation\":\"¡Hasta luego! / nos vemos.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Hasta luego — nos vemos pronto\",\"Bienvenido a la fiesta\",\"Ven aquí ahora mismo\"],\"itemIds\":[\"a2m9natvbisdann\"],\"tip\":\"Entre amigos casi nunca oirás Auf Wiedersehen: la despedida real de los planes es Bis dann! — y puedes decirla tú también.\"},{\"id\":\"a2m9l6e8\",\"type\":\"mc\",\"prompt\":\"El grito de salida\",\"question\":\"„Los geht's!“\",\"options\":[\"¡Empezamos! / ¡Allá vamos!\",\"¡Se acabó!\",\"¡Vete!\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Es ist vorbei» — los geht's abre, no cierra\",\"Eso sería «Geh!» — los geht's incluye a todos, no echa a nadie\"],\"itemIds\":[\"a2m9losgehts\"],\"tip\":\"Los geht's (= es geht los) es el pistoletazo de salida alemán: fiestas, partidos, viajes. Apréndelo como grito, no como gramática.\"},{\"id\":\"a2m9l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Trae un pastel, por favor\",\"answers\":[\"Bring bitte einen Kuchen mit\",\"Bring bitte einen Kuchen mit!\",\"Bitte bring einen Kuchen mit\",\"Bitte bring einen Kuchen mit!\"],\"hints\":[\"Imperativo de du + separable\",\"Bring ... mit\"],\"itemIds\":[\"a2m9mitbringen\",\"kuchen\"],\"tip\":\"Orden + bitte + pinza separable: ya sabes delegar en alemán. Un anfitrión que delega es un anfitrión que disfruta.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — «Feste planen» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Los personajes organizan fiestas paso a paso — compara su plan con el de esta lección.\"},{\"label\":\"Goethe — Deutsch für dich (ejercicios A2)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Busca «Einladung»: el examen A2 pide escribir justo esta secuencia en la parte de Schreiben.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
