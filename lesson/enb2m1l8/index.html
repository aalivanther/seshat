 Not only is the first sentence…, no Not only the first sentence is…. Es una de las tres inversiones de B2. Sin ella, la frase es correcta y suena a B1 — exactamente la evitación del nivel.\",\"translation\":\"No solo es larga la primera frase, sino que además esconde el punto.\",\"itemIds\":[\"enb2m1notonlybutalso\"]},{\"id\":\"enb2m1l8e4\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de apertura y cierre\",\"text\":\"___ , state the point in the first line. ___ the fact that the first draft mixed two ideas, Amy was lost. ___ is the first sentence long, but it also hides the request. ___ , the second version does one job.\",\"answers\":[\"To begin with\",\"Due to\",\"Not only\",\"To sum up\"],\"bank\":[\"To begin with\",\"Due to\",\"Not only\",\"To sum up\",\"What's more\",\"So yeah\",\"Because\"],\"translation\":\"Para empezar, di el punto en la primera línea. Debido a que el primer borrador mezclaba dos ideas, Amy se perdió. No solo es larga la primera frase, sino que además esconde la petición. En resumen, la segunda versión hace un solo trabajo.\",\"itemIds\":[\"enb2m1tobeginwith\",\"enb2m1duetothefact\",\"enb2m1notonlybutalso\",\"enb2m1tosumup\"],\"tip\":\"El hueco 2 es «Due to» porque detrás va «the fact that». Si pones Because, gramática distinta y el banco ya no encaja con the fact that.\"},{\"id\":\"enb2m1l8e5\",\"type\":\"transform\",\"prompt\":\"Énfasis con inversión\",\"source\":\"The first sentence is long and it hides the point.\",\"instruction\":\"Dilo con Not only… but also e inversión\",\"answers\":[\"Not only is the first sentence long, but it also hides the point\",\"Not only is the first sentence long, but it also hides the point.\",\"Not only is the first sentence long but it also hides the point\"],\"translation\":\"No solo es larga la primera frase, sino que además esconde el punto.\",\"itemIds\":[\"enb2m1notonlybutalso\"]},{\"id\":\"enb2m1l8e6\",\"type\":\"paraphrase\",\"prompt\":\"La concesión, sin «it is true that»\",\"source\":\"It is true that the email was polite, but it was not clear.\",\"forbid\":[\"true\"],\"answers\":[\"Admittedly, the email was polite, but it was not clear\",\"Admittedly the email was polite, but it was not clear\",\"Granted, the email was polite, but it was not clear\",\"The email was polite; nevertheless, it was not clear\"],\"translation\":\"Es verdad que el correo era educado, pero no era claro.\",\"itemIds\":[\"enb2m1itistruethat\",\"enb2m1admittedly\",\"enb2m1granted\",\"enb2m1nevertheless\"]},{\"id\":\"enb2m1l8e7\",\"type\":\"write\",\"prompt\":\"150-200 palabras, en párrafos. Un artículo corto para la revista del centro comunitario.\",\"scenario\":\"La revista del centro comunitario pide a Valeria un artículo breve para vecinos que, como ella, escriben en inglés como segunda lengua. El título que le dan: «Why your email is harder to read than you think». Trata LOS TRES puntos, en tres párrafos, con al menos tres conectores distintos del banco. 150-200 palabras: si te sales, recorta; si te quedas corto, te falta un párrafo.\",\"genre\":\"article\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Hackney Community Review — call for pieces\",\"text\":\"We want 150–200 words on a writing habit that makes English emails harder to read. Give one problem, one example from daily life, and one thing a reader can do on Monday morning.\"},\"bullets\":[\"Nombra el problema en la primera frase del primer párrafo (frase-tema).\",\"Pon un ejemplo concreto (un correo, un aviso, un vecino).\",\"Cierra con una cosa que el lector pueda hacer el lunes, no con «in conclusion I think».\"],\"checks\":[{\"re\":\"(paragraph|topic sentence|first line|one idea)\",\"label\":\"Nombras el problema del párrafo o de la primera línea\"},{\"re\":\"(email|notice|draft|neighbour|council|bin)\",\"label\":\"Das un ejemplo concreto de la vida diaria\"},{\"re\":\"(monday|first line|cut|rewrite|one idea|stand alone)\",\"label\":\"Cierras con una acción, no con una opinión vaga\"}],\"frame\":[\"Párrafo 1 — el problema: «To begin with, the problem is that…»\",\"Párrafo 2 — el ejemplo: «Last week… Whereas… As a result…»\",\"Párrafo 3 — la acción: «For a start, put the request in the first line. All things considered…»\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"to begin with\",\"whereas\",\"as a result\",\"admittedly\",\"nevertheless\",\"for a start\",\"all things considered\",\"even if\",\"in terms of\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"To begin with, the problem is that many of us write emails in English the way we would write them in Spanish: two ideas in one paragraph, and the request in the third line. The reader does not work harder. The reader stops.\\nLast week I wrote to the landlady about the bin rota. Admittedly, the English was fine. Nevertheless, my flatmate reached the third sentence and still did not know what I wanted. Whereas she cuts every message into blocks, I had written a conversation. As a result, I rewrote it on the bus, with the request in the first line and one reason after it.\\nFor a start, put the point in the first sentence and stop when the idea is done. Even if the email is polite, it is not clear until each paragraph stands alone. All things considered, that is the cheapest change a writer can make on a Monday morning.\",\"itemIds\":[\"enb2m1tobeginwith\",\"enb2m1theproblemis\",\"enb2m1admittedly\",\"enb2m1nevertheless\",\"enb2m1whereas\",\"enb2m1asaresult\",\"enb2m1forastart\",\"enb2m1evenif\",\"enb2m1allthingsconsidered\"],\"tip\":\"Cuenta las palabras: 150-200. Tres párrafos visibles. El modelo usa to begin with, admittedly, nevertheless, whereas, as a result, for a start, even if y all things considered: más de tres, a propósito, para que veas el techo, no el suelo.\"},{\"id\":\"enb2m1l8e8\",\"type\":\"cloze\",\"prompt\":\"La causa con cara amable\",\"text\":\"___ to Amy's notes, the second draft landed.\",\"answers\":[\"Thanks\"],\"translation\":\"Gracias a las notas de Amy, el segundo borrador aterrizó.\",\"itemIds\":[\"enb2m1thanksto\"]},{\"id\":\"enb2m1l8e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés — con inversión\",\"source\":\"No solo es larga la primera frase, sino que además esconde el punto.\",\"answers\":[\"Not only is the first sentence long, but it also hides the point.\",\"Not only is the first sentence long but it also hides the point.\"],\"hint\":\"Not only is…, but it also…\",\"itemIds\":[\"enb2m1notonlybutalso\"]},{\"id\":\"enb2m1l8e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Para empezar, di el punto. En resumen, la primera versión enterraba la petición.\",\"answers\":[\"To begin with, state the point. To sum up, the first version buried the request.\",\"For a start, state the point. To sum up, the first version buried the request.\"],\"itemIds\":[\"enb2m1tobeginwith\",\"enb2m1tosumup\"]},{\"id\":\"enb2m1l8e11\",\"type\":\"listen\",\"prompt\":\"Dictado: la inversión, tal cual se escribe\",\"text\":\"Not only is the first sentence long, but it also hides the point.\",\"translation\":\"No solo es larga la primera frase, sino que además esconde el punto.\",\"itemIds\":[\"enb2m1notonlybutalso\"]},{\"id\":\"enb2m1l8e12\",\"type\":\"audiomc\",\"prompt\":\"LISTENING LARGO · pregunta 1 de 2. Dos voces, varios marcadores. Cuaderno mientras suena. Dos escuchas.\",\"notepad\":true,\"audio\":\"Have you sent the piece to the Review?|Not yet. To begin with, I had three ideas in the first paragraph. Amy said it read like a conversation.|Granted, she was right. What did you cut?|The story about Nora's lift. It was true, but it wasn't the point. Thanks to that cut, the request sits in the first line now.|And the ending?|All things considered, I just tell them to put the point first on Monday. No «in conclusion I think».\",\"question\":\"¿Qué cortó Valeria y por qué?\",\"options\":[\"La anécdota del ascensor de Nora, porque no era el punto\",\"El primer párrafo entero, porque Amy no lo entendía\",\"El cierre, porque «in conclusion I think» le parecía culto\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No cortó el párrafo entero: cortó una idea que sobraba dentro.\",\"El cierre lo cambió, pero no es lo que se le pregunta: se le pregunta qué cortó.\"],\"itemIds\":[\"enb2m1tobeginwith\",\"enb2m1granted\",\"enb2m1thanksto\",\"enb2m1allthingsconsidered\"]},{\"id\":\"enb2m1l8e13\",\"type\":\"audiomc\",\"prompt\":\"Misma conversación · pregunta 2 de 2.\",\"notepad\":true,\"audio\":\"Have you sent the piece to the Review?|Not yet. To begin with, I had three ideas in the first paragraph. Amy said it read like a conversation.|Granted, she was right. What did you cut?|The story about Nora's lift. It was true, but it wasn't the point. Thanks to that cut, the request sits in the first line now.|And the ending?|All things considered, I just tell them to put the point first on Monday. No «in conclusion I think».\",\"question\":\"¿Cómo cierra Valeria el artículo?\",\"options\":[\"Con una acción para el lunes, sin «in conclusion I think»\",\"Con «in conclusion I think», porque es un artículo\",\"Con la anécdota del ascensor, que había reservado para el final\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice explícitamente que eso no va.\",\"Esa anécdota es lo que cortó.\"],\"itemIds\":[\"enb2m1allthingsconsidered\",\"enb2m1inconclusion\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"tit
