 have a car\u003c/i\u003e), que es más de lo que abarca su primo \u003ci\u003ewould\u003c/i\u003e — pero eso es la lección de mañana.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn negativa y en pregunta se cae la -d\u003c/b\u003e, porque el \u003ci\u003edid\u003c/i\u003e ya carga el pasado:\u003cbr/\u003e· \u003ci\u003eI \u003cb\u003edidn't use to\u003c/b\u003e like coffee.\u003c/i\u003e\u003cbr/\u003e· \u003ci\u003e\u003cb\u003eDid you use to\u003c/b\u003e walk to school?\u003c/i\u003e\u003cbr/\u003eVerás \u003ci\u003edidn't used to\u003c/i\u003e escrito por ahí, incluso por nativos. En un examen, la forma segura es \u003cb\u003euse to\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e«\u003cb\u003eAHORA VIENE EL ERROR DEL MÓDULO, Y ES GRANDE.\u003c/b\u003e»\u003cbr/\u003eEl español dice \u003ci\u003esuelo hacer ejercicio\u003c/i\u003e, \u003ci\u003esuelo acostarme pronto\u003c/i\u003e, \u003ci\u003esuele llover en marzo\u003c/i\u003e. Y el hispanohablante, con toda la lógica del mundo, traduce eso por \u003cb\u003e\u003cs\u003eI use to do exercise\u003c/s\u003e\u003c/b\u003e. \u003cb\u003eEso no existe en inglés.\u003c/b\u003e No es que suene mal: es que no es una forma de la lengua. \u003ci\u003eUsed to\u003c/i\u003e vive \u003cb\u003esolo\u003c/b\u003e en el pasado y no tiene presente.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLo que sí se dice\u003c/b\u003e, y son tres, en orden de frecuencia:\u003cbr/\u003e· \u003cb\u003eusually\u003c/b\u003e — \u003ci\u003eI usually go to bed early.\u003c/i\u003e La normal, la de todos los días.\u003cbr/\u003e· \u003cb\u003enormally\u003c/b\u003e — \u003ci\u003eI normally walk home.\u003c/i\u003e Igual de buena.\u003cbr/\u003e· \u003cb\u003etend to\u003c/b\u003e — \u003ci\u003eI tend to get up early.\u003c/i\u003e Un punto más cuidada; queda muy bien por escrito.\u003cbr/\u003e\u003cbr/\u003eEs un error caro porque \u003cb\u003eno se corrige solo con los años\u003c/b\u003e: se fosiliza. Nadie te va a parar en mitad de una conversación para decírtelo — te entienden igual —, así que se queda contigo hasta el examen. Nómbralo hoy y déjalo nombrado.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY un detalle de pronunciación que separa a los dos usados:\u003c/b\u003e en \u003ci\u003eused to\u003c/i\u003e la s suena \u003cb\u003es de serpiente\u003c/b\u003e: «IÚUS-tu», y la t se pega. Pero en \u003ci\u003eI used a knife\u003c/i\u003e suena con zumbido: «ai iúus̬d a náif». Misma palabra escrita, dos sonidos, y el que te delata es el primero."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m10l3\",\"phaseId\":\"enb1m10\",\"title\":\"I used to, and I don't any more\",\"subtitle\":\"El hábito que se acabó — y el error de presente que casi ningún libro nombra\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que hacías antes, y lo que haces ahora\",\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10didntuseto\",\"enb1m10didyouuseto\",\"enb1m10iusuallygotobed\",\"enb1m10notanymore\",\"enb1m10backthen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: «used to» es SOLO pasado, y ahí está la trampa\",\"body\":\"$17\",\"table\":[[\"Español\",\"Inglés\",\"Nunca\"],[\"Antes vivía con mi hermana\",\"I used to live with my sister.\",\"—\"],[\"Antes no me gustaba el café\",\"I didn't use to like coffee.\",\"I didn't used to like coffee.\"],[\"Suelo acostarme pronto\",\"I usually go to bed early.\",\"I use to go to bed early.\"],[\"Suele llover en marzo\",\"It usually rains in March.\",\"It uses to rain in March.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m10l3e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del hábito\",\"pairs\":[{\"target\":\"I used to live with my sister.\",\"source\":\"Antes vivía con mi hermana.\"},{\"target\":\"I didn't use to like coffee.\",\"source\":\"Antes no me gustaba el café.\"},{\"target\":\"I usually go to bed early.\",\"source\":\"Suelo acostarme pronto.\"},{\"target\":\"Not any more.\",\"source\":\"Ya no.\"}],\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10didntuseto\",\"enb1m10iusuallygotobed\",\"enb1m10notanymore\"],\"tip\":\"Fíjate en la tercera: es la única que está en presente, y es justo la que el hispanohablante intenta decir con «use to». Tenlas juntas en la cabeza a propósito.\"},{\"id\":\"enb1m10l3e2\",\"type\":\"mc\",\"prompt\":\"El error del módulo, en una pregunta\",\"question\":\"«Suelo hacer deporte los sábados.» →\",\"options\":[\"I usually do sport on Saturdays.\",\"I use to do sport on Saturdays.\",\"I used to do sport on Saturdays.\"],\"answer\":0,\"whyWrong\":[null,\"«I use to» no existe en inglés. Ni en presente ni en ningún sitio: la única forma viva es «used to», y es pasado.\",\"Esa sí existe, pero significa lo contrario de lo que quieres decir: «antes hacía deporte los sábados, y ya no».\"],\"itemIds\":[\"enb1m10iusuallygotobed\",\"enb1m10usedtolive\"],\"tip\":\"Las tres opciones se entienden en una conversación, y por eso nadie te corrige nunca. En el examen, la segunda cuenta como error de gramática y la tercera como error de sentido.\"},{\"id\":\"enb1m10l3e3\",\"type\":\"bucket\",\"prompt\":\"¿Con qué estructura se dice cada una en inglés?\",\"categories\":[\"Va con «used to» (pasado)\",\"Va con «usually / tend to» (presente)\"],\"items\":[{\"text\":\"Antes vivía con mi hermana.\",\"bucket\":0},{\"text\":\"Suelo acostarme pronto.\",\"bucket\":1},{\"text\":\"De pequeño no me gustaba el café.\",\"bucket\":0},{\"text\":\"Normalmente vuelvo andando.\",\"bucket\":1},{\"text\":\"Íbamos al mismo colegio.\",\"bucket\":0},{\"text\":\"Suele llover en marzo.\",\"bucket\":1}],\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10iusuallygotobed\",\"enb1m10didntuseto\"],\"tip\":\"Truco para decidir en medio segundo: si en español la frase admite «antes» delante, es «used to». Si admite «normalmente», es «usually». En español las dos se dicen con «solía» o con «suelo», y por eso se confunden.\"},{\"id\":\"enb1m10l3e4\",\"type\":\"errorfix\",\"prompt\":\"Esto es lo que escribe un hispanohablante en presente. Arréglalo.\",\"wrong\":\"I use to go to bed early.\",\"answers\":[\"I usually go to bed early.\"],\"why\":\"«Used to» solo existe en pasado; en presente no hay ninguna forma parecida. Para una costumbre de ahora el inglés usa un adverbio: usually, normally, o «tend to» + infinitivo.\",\"translation\":\"Suelo acostarme pronto.\",\"itemIds\":[\"enb1m10iusuallygotobed\"]},{\"id\":\"enb1m10l3e5\",\"type\":\"cloze\",\"prompt\":\"Completa la forma correcta\",\"text\":\"I didn't ___ to like coffee, but now I drink three cups a day.\",\"answers\":[\"use\"],\"translation\":\"Antes no me gustaba el café, pero ahora me tomo tres tazas al día.\",\"hints\":[\"Tres letras\",\"El «didn't» ya lleva el pasado: el verbo va limpio\"],\"itemIds\":[\"enb1m10didntuseto\"],\"tip\":\"Es la misma regla de siempre en inglés: detrás de «did» / «didn't» el verbo va sin marca de pasado. «I didn't went» chirría a todo el mundo; «I didn't used to» es exactamente el mismo fallo, solo que menos visible.\"},{\"id\":\"enb1m10l3e6\",\"type\":\"build\",\"prompt\":\"Construye la pregunta\",\"target\":\"Did you use to walk to school\",\"translation\":\"¿Ibas al colegio andando, de pequeña?\",\"distractors\":[\"used\",\"usually\"],\"itemIds\":[\"enb1m10didyouuseto\"],\"tip\":\"«Used» sobra por la misma razón que en la negativa, y «usually» sobra porque esto es pasado. Las dos fichas de más son las dos salidas que la gente toma.\"},{\"id\":\"enb1m10l3e7\",\"type\":\"transform\",\"prompt\":\"De la costumbre de ahora a la de antes\",\"source\":\"I usually walk to work.\",\"instruction\":\"Dilo como algo que ya no haces\",\"answers\":[\"I used to walk to work\",\"I used to walk to work.\"],\"translation\":\"Antes iba al trabajo andando.\",\"hints\":[\"Cambia el adverbio por la estructura del pasado\",\"I ... to walk to work\"],\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10iusuallygotobed\"],\"tip\":\"Fíjate en que «usually» desaparece del todo: no se dice «I used to usually walk». La idea de «una y otra vez» ya la lleva dentro «used to».\"},{\"id\":\"enb1m10l3e8\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que le cuenta Valeria a Mrs Beckett\",\"text\":\"I ___ to live with my sister in Bogotá. We shared a room until I was nineteen. Back ___ , I ___ to think the room was tiny.\",\"answers\":[\"used\",\"then\",\"used\"],\"bank\":[\"used\",\"then\",\"there\",\"did\",\"was\",\"have\"],\"translation\":\"Antes vivía con mi hermana en Bogotá. Compartimos habitación hasta que cumplí diecinueve. Por aquel entonces me parecía que el cuarto era diminuto.\",\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10backthen\"],\"tip\":\"«Back then» es la manera normal de decir «por aquel entonces», y viene muy bien en el Writing: coloca al lector en el pasado sin repetir fechas.\"},{\"id\":\"enb1m10l3e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar las palabras prohibidas\",\"source\":\"I don't smoke now, but I smoked for ten years.\",\"forbid\":[\"now\",\"ten\",\"years\"],\"answers\":[\"I used to smoke\",\"I used to smoke, but not any more\",\"I used to smoke but I gave up\"],\"translation\":\"Antes fumaba.\",\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10notanymore\"],\"tip\":\"Tres frases de información condensadas en tres palabras. Eso es lo que «used to» compra: la parte de «y ya no» viene de regalo, sin decirla.\"},{\"id\":\"enb1m10l3e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Suelo comer a la una, pero los jueves como más tarde.\",\"answers\":[\"I usually have lunch at one, but on Thursdays I eat later\",\"I normally have lunch at one, but on Thursdays I eat later\",\"I usually have lunch at one, but I eat later on Thursdays\"],\"hint\":\"La costumbre de AHORA no se dice con la estructura del pasado\",\"itemIds\":[\"enb1m10iusuallygotobed\"],\"tip\":\"Si te ha salido «I use to have lunch», enhorabuena: acabas de cazar en ti el error más frecuente y menos corregido del nivel. Ahora ya no se te va a escapar.\"},{\"id\":\"enb1m10l3e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y ahora al revés: ¿qué significa?\",\"source\":\"Did you use to walk to school?\",\"answers\":[\"¿Ibas al colegio andando?\",\"¿Ibas andando al colegio de pequeña?\",\"¿Solías ir al colegio andando?\"],\"itemIds\":[\"enb1m10didyouuseto\"],\"tip\":\"En español la pregunta se hace con el imperfecto a secas («¿ibas?»), y por eso al traducir hacia el inglés se nos olvida el «used to». Al revés se ve mejor.\"},{\"id\":\"enb1m10l3e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I didn't use to like coffee.\",\"translation\":\"Antes no me gustaba el café.\",\"strictContractions\":true,\"hints\":[\"Empieza por «I didn't…»\",\"I didn't ... to like coffee\"],\"itemIds\":[\"enb1m10didntuseto\"],\"tip\":\"En el audio no vas a oír ninguna diferencia entre «use» y «used»: en habla normal suenan igual. La que decide es la ortografía, y en un dictado eso cuenta.\"},{\"id\":\"enb1m10l3e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — y fíjate en la s\",\"text\":\"I used to live here, but I don't any more.\",\"phonetic\":\"ai IÚUS-tu liv jía, bat ai dóunt É-ni móo\",\"translation\":\"Antes vivía aquí, pero ya no.\",\"itemIds\":[\"enb1m10usedtolive\",\"enb1m10notanymore\"],\"tip\":\"«Used to» suena «IÚUS-tu», con s de serpiente y la d comida. Compáralo con «I used a knife» («ai iúus̬d a náif»), donde la s zumba. Es la misma palabra escrita y dos sonidos distintos: el primero es el del hábito.\"}]}],\"resources\":[{\"label\":\"Cambridge Dictionary — «used to»\",\"url\":\"https://dictionary.cambridge.org/grammar/british-grammar/used-to\",\"note\":\"Baja hasta el recuadro de los errores típicos. Ahí está, con estas palabras: «used to» no tiene presente. Léelo una vez en inglés y se te queda para siempre.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"
