icket ist nicht neu, aber die Abhängigkeit vom Auto in der Spätschicht schon. Die Verantwortung für den Takt liegt nicht bei uns in der Küche. Deshalb bitte ich Sie, bis Ende des Monats zu prüfen, ob die Firma einen Anteil übernimmt. Außerdem bräuchte die Nachtbuslinie eine klare Auskunft, weil sonst niemand weiß, woran die Verspätung liegt. Allerdings ändert eine mündliche Zusage nichts an der nächsten Rechnung. Ich stehe für Rückfragen gern zur Verfügung. Eine kurze schriftliche Bestätigung reicht.\\nMit freundlichen Grüßen\\nNico\",\"itemIds\":[],\"tip\":\"Menos de 50 palabras o tema equivocado: 0. Ni un du.\"},{\"id\":\"b2m9l5ex82\",\"type\":\"write\",\"prompt\":\"Aufgabe 1 · Forumsbeitrag. Off-topic = 0.\",\"scenario\":\"Foro Stadttakt: un oyente dice que la Verkehrswende es capricho de quien vive en el centro. Reacciona con Woran es liegt, no con culpa. Off-topic = 0.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Uwe L.\",\"text\":\"Die Verspätung liegt am Personal, das nicht will. Wer im Zentrum wohnt, redet von Wende. Wir am Rand warten.\"},\"bullets\":[\"Concede un punto a Uwe L. y marca el desacuerdo.\",\"Una ventaja y un inconveniente, con ejemplo.\",\"Una propuesta concreta y un cierre.\"],\"checks\":[{\"re\":\"(zwar|allerdings|jedoch)\",\"label\":\"concedes antes de rebatir\"},{\"re\":\"(Vorteil|Nachteil|einerseits|andererseits)\",\"label\":\"ventaja e inconveniente\"},{\"re\":\"(sollte|müsste|schlage vor|Vorschlag)\",\"label\":\"hay propuesta\"}],\"frame\":[\"Apertura\",\"concesión\",\"pro/contra\",\"propuesta\",\"cierre\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"zwar\",\"allerdings\",\"deshalb\",\"weil\",\"außerdem\",\"dennoch\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":140,\"maxWords\":180,\"model\":\"Zu dem Beitrag von Uwe L. möchte ich Folgendes sagen: Zwar stimmt, dass am Rand der letzte Bus früher geht. Allerdings liegt die Verspätung oft an der fehlenden Wendezeit, nicht am Willen der Fahrerin. Ein Vorteil klarer Ursachen ist, dass man die Stelle benennen kann: Verantwortung für den Takt, nicht Schuld der Schicht. Ein Nachteil der Schuldzuweisung ist, dass niemand das Interesse an einem Zuschuss ernst nimmt. Deshalb sollte der Senat sagen, woran der Takt hängt, in einem Satz. Außerdem müsste das Jobticket die Spätschicht einschließen. Ich plädiere dafür, weniger über Charaktere zu reden und mehr über Abhängigkeit vom Auto, weil nur so die Debatte einen Namen hat, den man prüfen kann. Nur so bleibt die Sache nachvollziehbar. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll. Das ist die Mindestanforderung an ein Protokoll, das jemand in drei Monaten noch verstehen soll.\",\"itemIds\":[],\"tip\":\"150 palabras: intro, concesión, dos argumentos, propuesta, cierre. Off-topic = 0.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b2m9-4\",\"book\":\"Ich bin stolz darauf.\",\"real\":\"Da bin ich schon stolz drauf.\",\"meaning\":\"De eso sí que estoy orgulloso.\",\"when\":\"Para marcar que el orgullo no es general: es de ESA cosa. El «da» inicial y el «schon» ponen el foco. En el Vortrag se recupera el darauf delante: «Darauf bin ich durchaus stolz».\",\"register\":\"amigos\",\"exam\":\"Darauf bin ich durchaus stolz.\",\"note\":\"drauf = darauf fundido, igual que drauf an. El examen no funde: pone darauf en el Vorfeld y suena a frase hecha de oral culto.\",\"sound\":\"da bin ij shoon shtolts DRAUF\",\"level\":\"b2\",\"produce\":true,\"itemId\":\"b2m9natstolzdrauf\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks
