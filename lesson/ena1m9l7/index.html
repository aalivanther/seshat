 / FÉEST / NÉES — la misma vocal floja, sin r\"],[\"la r británica\",\"solo suena si detrás hay vocal: very sí, work no\"],[\"la -ing\",\"entera: LÉE-ning, UÉE-king — nunca «-in»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m9l7e1\",\"type\":\"audiomc\",\"prompt\":\"Pregunta primero, escucha después — elige la réplica\",\"audio\":\"What do you do?\",\"question\":\"¿Cuál es la réplica que responde de verdad?\",\"options\":[\"I'm a nurse.\",\"I'm 25.\",\"Very well, thank you.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Esa responde a «How old are you?»\",\"Esa responde a «How are you?»\"],\"itemIds\":[\"enwhatdoyoudo\",\"ennurse\"],\"tip\":\"Tres réplicas de presentación — solo una habla de trabajo. El Listening T2 del examen es exactamente este juego.\"},{\"id\":\"ena1m9l7e2\",\"type\":\"audiomc\",\"prompt\":\"Diálogo con trampa — 2 escuchas\",\"audio\":\"Where do you work? | I work at a school — but I'm not a teacher. I'm a cook!\",\"question\":\"¿Qué es la persona?\",\"options\":[\"Cocinero\",\"Profesor\",\"Estudiante\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"teacher suena — pero con not delante: NO lo es\",\"student no suena en el audio\"],\"itemIds\":[\"encook\",\"enschool\",\"enwork\"],\"tip\":\"school te empuja hacia teacher — y el audio lo sabe. La respuesta vive DESPUÉS del but.\"},{\"id\":\"ena1m9l7e3\",\"type\":\"audiomc\",\"prompt\":\"Deletrean un nombre — 2 escuchas\",\"audio\":\"A: What's your name? | B: I'm Jean. J-E-A-N.\",\"question\":\"¿Cómo se escribe el nombre?\",\"options\":[\"Jean\",\"Jane\",\"Jen\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Jane sería J-A-N-E: la A suena /éi/ y la E suena /íi/ — el par de letras que engaña\",\"Faltaría una letra: sonaron cuatro, J-E-A-N\"],\"itemIds\":[\"enfirst\"],\"tip\":\"Las letras traidoras del deletreo: A=éi, E=íi, I=ái. Apunta la LETRA que dicen, no el sonido español.\"},{\"id\":\"ena1m9l7e4\",\"type\":\"audiomc\",\"prompt\":\"Par mínimo: ¿qué oíste?\",\"audio\":\"I work in t
