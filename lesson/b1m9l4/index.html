\"La preposición del verbo\",\"question\":\"Ich möchte mich ___ das Zimmer beschweren.\",\"options\":[\"über\",\"von\",\"für\"],\"answer\":0,\"whyWrong\":[null,\"«von» es el calco de «quejarse DE»: en alemán no existe con beschweren\",\"«für» sería «a favor de»\"],\"itemIds\":[\"b1m9sichbeschwerenueberzimmer\"],\"tip\":\"sich beschweren über + Akkusativ. El bloque se memoriza entero, como una sola palabra.\"},{\"id\":\"b1m9l4e2\",\"type\":\"match\",\"prompt\":\"Empareja verbo y preposición\",\"pairs\":[{\"target\":\"sich beschweren über\",\"source\":\"quejarse de\"},{\"target\":\"sich kümmern um\",\"source\":\"ocuparse de\"},{\"target\":\"achten auf\",\"source\":\"vigilar / prestar atención a\"},{\"target\":\"warten auf\",\"source\":\"esperar (algo)\"}],\"itemIds\":[\"b1m9sichbeschwerenueberzimmer\",\"b1m9sichkuemmernumproblem\",\"b1m9achtenaufgepaeck\",\"b1m9wartenaufanschluss\"]},{\"id\":\"b1m9l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la reclamación\",\"text\":\"Mein Koffer ist ___. Er ist in München geblieben.\",\"answers\":[\"weg\"],\"translation\":\"Mi maleta ha desaparecido. Se quedó en Múnich.\",\"hints\":[\"Tres letras: «fuera / ya no está»\",\"w…\"],\"itemIds\":[\"b1m9kofferweg\"]},{\"id\":\"b1m9l4e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la reclamación\",\"wrong\":\"Ich möchte mich von dem lauten Zimmer beschweren.\",\"answers\":[\"Ich möchte mich über das laute Zimmer beschweren.\"],\"why\":\"sich beschweren pide ÜBER + Akkusativ. Al cambiar la preposición cambia también el caso: über das laute Zimmer (acusativo), no «von dem» (dativo).\",\"translation\":\"Me quejo de la habitación ruidosa.\",\"itemIds\":[\"b1m9sichbeschwerenueberzimmer\"],\"tip\":\"Dos errores en cadena por una sola preposición: por eso la rección se aprende con caso incluido.\"},{\"id\":\"b1m9l4e5\",\"type\":\"gapbank\",\"prompt\":\"Rellena la reclamación en recepción\",\"text\":\"Guten Abend. ___ ist schiefgegangen: Mein Koffer ist ___. ___ Sie sich bitte darum ___?\",\"answers\":[\"Etwas\",\"weg\",\"Könnten\",\"kümmern\"],\"bank\":[\"Etwas\",\"weg\",\"Könnten\",\"kümmern\",\"Nichts\",\"da\",\"Könnte\",\"beschweren\"],\"translation\":\"Buenas noches. Algo ha salido mal: mi maleta ha desaparecido. ¿Podría ocuparse de ello, por favor?\",\"hints\":[\"Con «Sie» la forma es «K-ö-n-n-t-e-n», no «Könnte»\",\"darum k-ü-m-m-e-r-n = ocuparse de ello\"],\"itemIds\":[\"b1m9schiefgehen\",\"b1m9kofferweg\",\"b1m9koenntenSiebitte\",\"b1m9sichkuemmernumproblem\"],\"tip\":\"«darum» es el da-Kompositum de «um das»: se refiere al problema entero sin repetirlo.\"},{\"id\":\"b1m9l4e6\",\"type\":\"build\",\"prompt\":\"Construye la petición cortés\",\"target\":\"Könnten Sie mir bitte helfen\",\"translation\":\"¿Podría ayudarme, por favor?\",\"distractors\":[\"Könnte\",\"hilfst\"],\"itemIds\":[\"b1m9koenntenSiebitte\"],\"tip\":\"Könnten (con Umlaut) es la forma sintética: «würden Sie können» no existe.\"},{\"id\":\"b1m9l4e7\",\"type\":\"transform\",\"prompt\":\"De la exigencia a la reclamación educada\",\"source\":\"Geben Sie mir mein Geld zurück!\",\"instruction\":\"Pídelo con Konjunktiv II de cortesía\",\"answers\":[\"Könnten Sie mir bitte mein Geld zurückgeben?\",\"Könnten Sie mir mein Geld zurückgeben?\",\"Würden Sie mir bitte mein Geld zurückgeben?\",\"Würden Sie mir mein Geld zurückgeben?\",\"Könnten Sie mir bitte das Geld zurückgeben?\",\"Wäre es möglich, mir mein Geld zurückzugeben?\"],\"translation\":\"¿Podría devolverme el dinero, por favor?\",\"hints\":[\"Könnten Sie mir bitte …?\",\"El verbo se va al final: … zurückgeben\"],\"itemIds\":[\"b1m9geldzurueck\",\"b1m9koenntenSiebitte\"]},{\"id\":\"b1m9l4e8\",\"type\":\"cloze\",\"prompt\":\"Completa — vigilar el equipaje\",\"text\":\"Bitte achten Sie ___ Ihr Gepäck!\",\"answers\":[\"auf\"],\"translation\":\"¡Por favor, vigilen su equipaje!\",\"hints\":[\"achten + preposición fija\",\"…f\"],\"itemIds\":[\"b1m9achtenaufgepaeck\"]},{\"id\":\"b1m9l4e9\",\"type\":\"listen\",\"prompt\":\"Escucha la frase comodín del viajero\",\"text\":\"Etwas ist schiefgegangen\",\"translation\":\"Algo ha salido mal\",\"hints\":[\"Empieza por Etwas …\",\"… ist schief…\"],\"itemIds\":[\"b1m9schiefgehen\"]},{\"id\":\"b1m9l4e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin sonar agresivo\",\"source\":\"Das Zimmer ist schlecht und laut!\",\"forbid\":[\"schlecht\",\"laut\"],\"answers\":[\"Leider ist das Zimmer sehr unruhig\",\"Leider ist das Zimmer nicht so ruhig, wie ich gehofft hatte\",\"Leider ist das Zimmer ziemlich unruhig\",\"Das Zimmer ist leider nicht sehr ruhig\"],\"translation\":\"Por desgracia la habitación no es nada tranquila.\",\"hints\":[\"Empieza con «Leider …»\",\"Di lo que NO es: nicht ruhig / unruhig\"],\"itemIds\":[\"b1m9sichbeschwerenueberzimmer\"],\"tip\":\"«Leider» + negación suave = la reclamación que funciona en recepción. Decir lo mismo sin adjetivos duros es habilidad de nivel.\"},{\"id\":\"b1m9l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Quisiera quejarme de la habitación. ¿Podría ocuparse de ello?\",\"answers\":[\"Ich möchte mich über das Zimmer beschweren. Könnten Sie sich bitte darum kümmern?\",\"Ich möchte mich über das Zimmer beschweren. Könnten Sie sich darum kümmern?\"],\"hints\":[\"beschweren über + Akkusativ\",\"Könnten Sie sich bitte darum …?\"],\"itemIds\":[\"b1m9sichbeschwerenueberzimmer\",\"b1m9sichkuemmernumproblem\",\"b1m9koenntenSiebitte\"],\"tip\":\"Hecho + petición cortés: con estas dos frases resuelves cualquier incidencia en los tres países.\"},{\"id\":\"b1m9l4e12\",\"type\":\"write\",\"prompt\":\"Schreiben Aufgabe 3 — el correo formal de la incidencia. UNAS 40 PALABRAS y 15 minutos: hecho, petición y nada más. Registro de usted de principio a fin.\",\"scenario\":\"Viajaste el lunes en tren nocturno de Berlín a Viena y tu maleta no ha llegado. Escribe al servicio de atención al viajero de la compañía: di qué viaje hiciste, cuál es el problema y pide que se ocupen y te digan cuándo la tendrás.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"frame\":[\"Anrede: Sehr geehrte Damen und Herren,\",\"El viaje: cuándo y de dónde a dónde\",\"El hecho, sin dramatismo: Leider ist mein Koffer nicht angekommen.\",\"La petición en Konjunktiv II: Könnten Sie sich bitte darum kümmern …?\",\"Mit freundlichen Grüßen + tu nombre\"],\"bullets\":[\"Abre con la Anrede formal\",\"Di qué viaje hiciste y cuándo\",\"Explica el problema: la maleta no ha llegado\",\"Pide con cortesía que se ocupen y que te informen\",\"Cierra con la Grußformel\"],\"checks\":[{\"re\":\"Sehr geehrte\",\"label\":\"Anrede formal\"},{\"re\":\"(Montag|gefahren|Zug|Reise)\",\"label\":\"el viaje\"},{\"re\":\"(Koffer|Gepäck)\",\"label\":\"la maleta\"},{\"re\":\"(Könnten Sie|Wäre es möglich|Ich bitte Sie|kümmern|mitteilen)\",\"label\":\"petición cortés\"},{\"re\":\"(Mit freundlichen Grüßen|Freundliche Grüße)\",\"label\":\"Grußformel\"}],\"requireConnectors\":{\"min\":1,\"bank\":[\"leider\",\"deshalb\",\"daher\",\"außerdem\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":32,\"maxWords\":55,\"model\":\"Sehr geehrte Damen und Herren,\\nam Montag bin ich mit dem Nachtzug von Berlin nach Wien gefahren. Leider ist mein Koffer nicht angekommen. Könnten Sie sich bitte darum kümmern und mir mitteilen, wann ich ihn bekomme?\\nMit freundlichen Grüßen\\nLucía Ortega\",\"itemIds\":[\"b1m9kofferweg\",\"b1m9sichkuemmernumproblem\",\"b1m9koenntenSiebitte\",\"b1m9nachtzug\",\"b1m8gesehrgeehrte\",\"a2mitfreundlichengruessen\"],\"tip\":\"La Aufgabe 3 no se aprueba escribiendo bonito, se aprueba cumpliendo los puntos en cuarenta palabras. Cuenta los tuyos: si pasas de cincuenta, algo sobra — y ese algo te está robando minutos de la Aufgabe 2, que vale el doble.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-col
