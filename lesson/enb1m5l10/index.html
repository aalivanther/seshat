ks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T7ae,"])</script><script>self.__next_f.push([1,"Cada módulo cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e: una lección entera dedicada a UNA parte del LanguageCert. Hoy toca la \u003cb\u003eTarea 1 del Writing\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eQué te dan:\u003c/b\u003e un texto corto y público —un anuncio, un cartel, una carta al director— y \u003cb\u003etres puntos de contenido\u003c/b\u003e en forma de lista. \u003cb\u003eQué escribes:\u003c/b\u003e una carta formal de \u003cb\u003e70-100 palabras\u003c/b\u003e a alguien que no conoces.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí está la trampa.\u003c/b\u003e Casi nadie suspende esta tarea por gramática. Se suspende por dos cosas:\u003cbr/\u003e1. \u003cb\u003eDejarse un punto de contenido.\u003c/b\u003e Los tres puntúan por separado, y el criterio de Task fulfilment se hunde entero antes de que nadie mire un verbo. La regla oficial es dura: \u003cb\u003e«no credit for off-topic responses»\u003c/b\u003e. Escribir maravillosamente sobre otra cosa vale cero.\u003cbr/\u003e2. \u003cb\u003eEscribir de menos.\u003c/b\u003e Por debajo de 70 palabras se penaliza. Por encima de 100 no se penaliza tanto, pero se pierde tiempo del Reading, que da el doble de puntos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa plantilla de cinco líneas\u003c/b\u003e, y no hace falta más:\u003cbr/\u003e1. \u003ci\u003eDear Sir or Madam,\u003c/i\u003e (sin nombre) o \u003ci\u003eDear Mrs Beckett,\u003c/i\u003e (con nombre).\u003cbr/\u003e2. \u003cb\u003ePor qué escribes:\u003c/b\u003e \u003ci\u003eI am writing regarding…\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003ePunto 1 y punto 2\u003c/b\u003e, con un conector: \u003ci\u003eAlthough…\u003c/i\u003e / \u003ci\u003eIn spite of…\u003c/i\u003e\u003cbr/\u003e4. \u003cb\u003ePunto 3, la petición:\u003c/b\u003e \u003ci\u003eI would be grateful if you could…\u003c/i\u003e o \u003ci\u003eCould you tell me whether…?\u003c/i\u003e\u003cbr/\u003e5. \u003cb\u003eCierre y despedida:\u003c/b\u003e \u003ci\u003eI look forward to hearing from you.\u003c/i\u003e + \u003ci\u003eYours faithfully,\u003c/i\u003e / \u003ci\u003eYours sincerely,\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa regla de las despedidas, que cae siempre:\u003c/b\u003e si empiezas \u003cb\u003esin nombre\u003c/b\u003e (\u003ci\u003eDear Sir or Madam\u003c/i\u003e), acabas con \u003cb\u003eYours faithfully\u003c/b\u003e. Si empiezas \u003cb\u003econ nombre\u003c/b\u003e (\u003ci\u003eDear Mrs Beckett\u003c/i\u003e), acabas con \u003cb\u003eYours sincerely\u003c/b\u003e. No hay más.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eAntes de escribir, cuenta los puntos con el dedo.\u003c/b\u003e Literalmente: tres puntos, tres dedos, y no sueltas el bolígrafo hasta que has bajado los tres."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m5l10\",\"phaseId\":\"enb1m5\",\"title\":\"Exam lab: Writing Part 1\",\"subtitle\":\"Setenta palabras, tres puntos de contenido y cuatro criterios que se cobran por separado\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas fijas de la carta\",\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\",\"enb1m5yoursfaithfully\",\"enb1m5contentpoints\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 1, y por qué se falla\",\"body\":\"$17\",\"table\":[[\"Los cuatro criterios\",\"Qué mira\"],[\"Task fulfilment\",\"¿Están los TRES puntos? ¿Es el registro correcto?\"],[\"Grammar\",\"¿Los tiempos verbales y las estructuras del nivel?\"],[\"Vocabulary\",\"¿Palabras de B1 o las mismas cuatro de siempre?\"],[\"Organisation\",\"¿Párrafos, conectores y puntuación?\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m5l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En la Tarea 1 del Writing, ¿qué te hunde la nota más rápido?\",\"options\":[\"Dejarte uno de los tres puntos de contenido\",\"Cometer dos errores de gramática\",\"Usar una palabra que no es exactamente la del anuncio\"],\"answer\":0,\"whyWrong\":[null,\"La gramática es UN criterio de cuatro, y dos errores no lo tumban.\",\"Al contrario: reformular con tus palabras suma en el criterio de vocabulario.\"],\"itemIds\":[\"enb1m5contentpoints\"],\"tip\":\"Regla de oro: los puntos de contenido primero, la elegancia después. Un texto correcto que se deja un punto puntúa menos que uno con fallos que los trata los tres.\"},{\"id\":\"enb1m5l10e2\",\"type\":\"order\",\"prompt\":\"Ordena las cinco líneas de la carta formal\",\"sentences\":[\"Dear Sir or Madam,\",\"I am writing regarding the coat I ordered online on 12 April.\",\"Although it arrived quickly, the zip was broken.\",\"I would be grateful if you could send me a replacement.\",\"I look forward to hearing from you.\"],\"translation\":\"Estimados señores: · Les escribo en relación con el abrigo que pedí por internet el 12 de abril. · Aunque llegó rápido, la cremallera estaba rota. · Les agradecería que me enviaran uno nuevo. · Quedo a la espera de su respuesta.\",\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\",\"enb1m1although\"],\"tip\":\"Esta es la plantilla entera. Apréndetela de memoria y en el examen solo tendrás que rellenar los huecos con el tema que te toque: el andamio ya está de pie.\"},{\"id\":\"enb1m5l10e3\",\"type\":\"match\",\"prompt\":\"Empareja cada fórmula con lo que hace en la carta\",\"pairs\":[{\"target\":\"I am writing regarding…\",\"source\":\"por qué escribes (primera línea)\"},{\"target\":\"Although it arrived on time, …\",\"source\":\"el problema, con un conector\"},{\"target\":\"I would be grateful if you could…\",\"source\":\"lo que pides\"},{\"target\":\"I look forward to hearing from you.\",\"source\":\"el cierre\"},{\"target\":\"Yours faithfully,\",\"source\":\"la despedida de cuando no sabes el nombre\"}],\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\",\"enb1m5yoursfaithfully\",\"enb1m1although\"],\"tip\":\"Cinco fórmulas y cinco funciones. Ninguna es opcional: quitar el cierre o la despedida te baja el criterio de Organisation aunque el contenido esté entero.\"},{\"id\":\"enb1m5l10e4\",\"type\":\"bucket\",\"prompt\":\"¿Esto cabe en la carta formal del examen?\",\"categories\":[\"Sí, va en la carta formal\",\"No: eso es de un mensaje a un amigo\"],\"items\":[{\"text\":\"I am writing regarding an order I placed last week.\",\"bucket\":0},{\"text\":\"I would be grateful if you could refund the cost.\",\"bucket\":0},{\"text\":\"Yours faithfully,\",\"bucket\":0},{\"text\":\"Hiya! Guess what happened.\",\"bucket\":1},{\"text\":\"I'm skint till payday.\",\"bucket\":1},{\"text\":\"Anyway, let me know.\",\"bucket\":1}],\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5yoursfaithfully\",\"enb1m5natskint\",\"enb1m3anyway\"],\"tip\":\"Ninguna está mal escrita: están mal colocadas. El error de registro no se ve al releer, porque cada frase por separado es correcta — y es de los que más nota cuestan.\"},{\"id\":\"enb1m5l10e5\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"I look forward to hear from you.\",\"answers\":[\"I look forward to hearing from you.\"],\"why\":\"Ese «to» no es de infinitivo: es preposición, y detrás de una preposición va -ing. Parece un infinitivo y no lo es — el mismo caso que «I'm used to working nights».\",\"translation\":\"Quedo a la espera de su respuesta.\",\"itemIds\":[\"enb1m5lookforwardtohearing\",\"enb1m1lookforwardto\"]},{\"id\":\"enb1m5l10e6\",\"type\":\"cloze\",\"prompt\":\"La regla de las despedidas\",\"text\":\"If the letter begins «Dear Sir or Madam», it has to end «Yours ___».\",\"answers\":[\"faithfully\"],\"translation\":\"Si la carta empieza con «Dear Sir or Madam», tiene que acabar con «Yours faithfully».\",\"hints\":[\"La otra opción es «sincerely», y esa va con nombre\",\"faith...\"],\"itemIds\":[\"enb1m5yoursfaithfully\"],\"tip\":\"Sin nombre → faithfully. Con nombre → sincerely. Y las dos llevan coma detrás y minúscula en la segunda palabra: «Yours faithfully,», nunca «Yours Faithfully».\"},{\"id\":\"enb1m5l10e7\",\"type\":\"gapbank\",\"prompt\":\"Completa la plantilla de cinco líneas\",\"text\":\"Dear Sir or ___, I am ___ regarding the coat I ordered online. Although it arrived quickly, the zip was broken. I would be ___ if you could send me a replacement. I look forward to ___ from you. Yours faithfully, Valeria Soto\",\"answers\":[\"Madam\",\"writing\",\"grateful\",\"hearing\"],\"bank\":[\"Madam\",\"writing\",\"grateful\",\"hearing\",\"Mister\",\"written\",\"sorry\",\"listening\"],\"translation\":\"Estimados señores: les escribo en relación con el abrigo que pedí por internet. Aunque llegó rápido, la cremallera estaba rota. Les agradecería que me enviaran uno nuevo. Quedo a la espera de su respuesta. Atentamente, Valeria Soto.\",\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5gratefulifyoucould\",\"enb1m5lookforwardtohearing\",\"enb1m5yoursfaithfully\"],\"tip\":\"Cuatro huecos y la carta entera de pie. En el examen no vas a tener el banco de palabras: por eso conviene que estas cuatro te salgan sin pensarlas.\"},{\"id\":\"enb1m5l10e8\",\"type\":\"transform\",\"prompt\":\"De la orden a la petición formal\",\"source\":\"Send me a new one.\",\"instruction\":\"Dilo como se escribe en una carta formal\",\"answers\":[\"I would be grateful if you could send me a new one\",\"I would be grateful if you could send me a replacement\",\"I'd be grateful if you could send me a new one\",\"Could you send me a new one?\"],\"translation\":\"Les agradecería que me enviaran uno nuevo.\",\"hints\":[\"Empieza por la fórmula de agradecimiento anticipado\",\"I would be grateful if you could ...\"],\"itemIds\":[\"enb1m5gratefulifyoucould\"],\"tip\":\"El imperativo pelado («Send me…») en una carta a una empresa suena a orden y baja el registro. La misma idea envuelta es la que consigue respuesta — y la que puntúa.\"},{\"id\":\"enb1m5l10e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «want» y sin «money»\",\"source\":\"I want my money back.\",\"forbid\":[\"want\",\"money\"],\"answers\":[\"I would like a refund\",\"Could I have a refund, please\",\"I would be grateful if you could refund the cost\"],\"translation\":\"Quiero que me devuelvan el dinero.\",\"hints\":[\"Hay una palabra de una sola pieza para «devolución del dinero»\",\"I would like a ...\"],\"itemIds\":[\"enb1m5refund\",\"enb1m5gratefulifyoucould\"],\"tip\":\"«I want» no se escribe nunca en una carta formal. Y fíjate en la escalera: «I would like» ya vale, «Could I have…?» sube un peldaño y «I would be grateful if…» es la de examen.\"},{\"id\":\"enb1m5l10e10\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1 completa, en formato examen. Lee el recuadro, cuenta los tres puntos con el dedo y escribe. 70-100 palabras.\",\"scenario\":\"Has leído esta llamada a los lectores en el periódico de tu barrio. Escribe al periódico. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Hackney Gazette — llamada a los lectores\",\"text\":\"IS IT WORTH IT? Last week we asked readers whether subscriptions are quietly eating their wages. Nearly two hundred of you wrote in. We are printing a selection next month. Write to: Letters, Hackney Gazette, 5 Wilton Way, London E8.\"},\"bullets\":[\"Di de qué artículo escribes y cuándo lo leíste.\",\"Da tu opinión y apóyala con un ejemplo tuyo.\",\"Propón algo concreto al periódico o a sus lectores.\"],\"checks\":[{\"re\":\"(article|last week|gazette|piece)\",\"label\":\"Dices de qué artículo escribes y cuándo lo leíste\"},{\"re\":\"(in my opinion|i think|i believe|for instance|for example)\",\"label\":\"Das tu opinión y la apoyas con un ejemplo\"},{\"re\":\"(suggest|could you|should|why not|i would like to see)\",\"label\":\"Propones algo concreto\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — el periódico no da un nombre, así que sin nombre\",\"Por qué escribes: «I am writing regarding your article about…, which I read last week.»\",\"Punto 2 — tu opinión: «In my opinion the problem is not…, but…»\",\"El ejemplo tuyo, con cifra: «For instance, I was paying… a month for…»\",\"Punto 3 — tu propuesta: «Could you print…?» / «I would like to see…»\",\"Cierre + despedida: «I look forward to reading it. Yours faithfully, …»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"though\",\"in spite of\",\"in addition\",\"on the other hand\",\"therefore\",\"besides\",\"for instance\",\"of course\",\"unless\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing regarding your article about subscriptions, which I read last week. In my opinion the problem is not the price but the fact that nobody notices it. For instance, I was paying twelve pounds a month for a gym I had stopped using in March. Although the sum was small, it came to a hundred and forty-four pounds a year. Could you print a short checklist next month so that readers can go through their bank statements? I look forward to reading it.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m5writingregarding\",\"enb1m5subscription\",\"enb1m5spendon\",\"enb1m5yoursfaithfully\",\"enb1m5contentpoints\",\"enb1m1forinstance\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y repasa el modelo con los tres dedos: artículo y fecha (uno), opinión con ejemplo y cifra (dos), propuesta concreta (tres). Los tres bajados, sin adornos de más.\"},{\"id\":\"enb1m5l10e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Les escribo en relación con el abrigo que pedí por internet.\",\"answers\":[\"I am writing regarding the coat I ordered online\",\"I am writing regarding the coat that I ordered online\",\"I'm writing regarding the coat I ordered online\",\"I am writing regarding the coat I ordered on the internet\"],\"hints\":[\"Es la segunda línea de la plantilla\",\"I am writing ... the coat I ordered online\"],\"itemIds\":[\"enb1m5writingregarding\"],\"tip\":\"«regarding» es la palabra de carta; en conversación dirías «about». Y ojo con la relativa: «the coat I ordered», sin «that». En inglés se calla, y callarla suma en el criterio de gramática.\"},{\"id\":\"enb1m5l10e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe el cierre de la carta\",\"text\":\"I look forward to hearing from you.\",\"translation\":\"Quedo a la espera de su respuesta.\",\"hints\":[\"Empieza por «I look…»\",\"I look forward to ... from you\"],\"itemIds\":[\"enb1m5lookforwardtohearing\"],\"tip\":\"Si has escrito «hear», vuelve al ejercicio 5. Es el fallo más repetido de esta línea, y esta línea la escribe todo el mundo en el examen.\"},{\"id\":\"enb1m5l10e13\",\"type\":\"mc\",\"prompt\":\"La regla dura del recuento\",\"question\":\"Has escrito 62 palabras y has tratado los tres puntos. ¿Qué haces?\",\"options\":[\"Alargar el punto 2 con un ejemplo concreto hasta pasar de 70\",\"Añadir una frase de relleno del tipo «Thank you very much for everything»\",\"Dejarlo: si están los tres puntos, la extensión da igual\"],\"answer\":0,\"whyWrong\":[null,\"El relleno se nota y no suma en ningún criterio: ocupa palabras sin decir nada.\",\"La extensión no da igual: por debajo del mínimo se penaliza.\"],\"itemIds\":[\"enb1m5contentpoints\",\"enb1m1forinstance\"],\"tip\":\"Cuando te falten palabras, la solución es siempre la misma: un ejemplo con una cifra. «For instance, I was paying twelve pounds a month for…» son doce palabras que además suben el criterio de vocabulario. Laboratorio hecho: te quedan las partes del examen que verás en los módulos siguientes.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Writing)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo la Tarea 1 con el reloj: veinte minutos, 70-100 palabras y los tres puntos. Después compárala con la rúbrica oficial, criterio por criterio.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favico
