03rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T550,Mira estas cinco palabras: \u003cb\u003eh\u003cu\u003eur\u003c/u\u003et · n\u003cu\u003eur\u003c/u\u003ese · w\u003cu\u003eor\u003c/u\u003ese · f\u003cu\u003eir\u003c/u\u003est · w\u003cu\u003eor\u003c/u\u003ek\u003c/b\u003e. Se escriben de tres maneras (-ur-, -or-, -ir-) y \u003cb\u003esuenan exactamente igual\u003c/b\u003e: una vocal floja, larga, con la boca casi cerrada y la lengua quieta en el centro. En español no existe; lo más parecido es la e de «Ernesto» dicha con desgana y estirada.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY lo importante: no hay r.\u003c/b\u003e El inglés británico no pronuncia la r si detrás no viene una vocal. \u003ci\u003ehurt\u003c/i\u003e es «jéet», \u003ci\u003enurse\u003c/i\u003e es «nées», \u003ci\u003ework\u003c/i\u003e es «uéek». Meter la r española ahí es lo que hace que \u003ci\u003ework\u003c/i\u003e suene a \u003ci\u003ewalk\u003c/i\u003e y que no te entiendan.\u003cbr/\u003e\u003cbr/\u003eDel A1 ya traes dos de las cinco: [[nurse|enfermera]] y [[first|primero]]. Hoy se les suman \u003cb\u003ehurt\u003c/b\u003e, \u003cb\u003eworse\u003c/b\u003e y \u003cb\u003ework\u003c/b\u003e, que son las tres que más vas a usar en este módulo.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa segunda mitad de la clínica\u003c/b\u003e es la de siempre, la que se cobra desde el módulo 1: las consonantes amontonadas al final. \u003ci\u003ecoughed\u003c/i\u003e es \u003cb\u003euna\u003c/b\u003e sílaba: «koft». \u003ci\u003easked\u003c/i\u003e es «aaskt». \u003ci\u003eworked\u003c/i\u003e es «uéekt». La boca española quiere abrir una vocal detrás («cofed», «askéd») y ahí se va la marca de pasado.\u003cbr/\u003e\u003cbr/\u003eY un aviso de ortografía: \u003cb\u003ecough\u003c/b\u003e se lee «kof» — la -gh suena F, como en \u003ci\u003eenough\u003c/i\u003e y \u003ci\u003elaugh\u003c/i\u003e. Rima con «off», no con «go»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m8l5\",\"phaseId\":\"ena2m8\",\"title\":\"hurt, nurse, worse, first, work\",\"subtitle\":\"La vocal larga que no tiene r — y las consonantes que se amontonan al final\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los sonidos de esta lección\",\"itemIds\":[\"ena2m8hurtgroup\",\"ena2m8acough\",\"ena2m8icoughedallnight\",\"ena2m8itsgettingworse\",\"ena2m8itreallyhurts\",\"ennurse\",\"enfirst\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Una vocal, cinco escrituras distintas y ni una r\",\"body\":\"$17\",\"table\":[[\"se escribe\",\"suena\",\"no suena\"],[\"hurt\",\"jéet\",\"«jurt»\"],[\"nurse\",\"nées\",\"«nurs»\"],[\"worse\",\"uées\",\"«uors»\"],[\"first\",\"féest\",\"«first»\"],[\"work\",\"uéek\",\"«uork»\"],[\"coughed\",\"koft (una sílaba)\",\"«co-fed»\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m8l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Lleva la vocal larga de hurt, o no?\",\"categories\":[\"suena como hurt\",\"otra vocal\"],\"items\":[{\"text\":\"nurse\",\"bucket\":0},{\"text\":\"worse\",\"bucket\":0},{\"text\":\"first\",\"bucket\":0},{\"text\":\"work\",\"bucket\":0},{\"text\":\"hot\",\"bucket\":1},{\"text\":\"walk\",\"bucket\":1},{\"text\":\"heart\",\"bucket\":1},{\"text\":\"word\",\"bucket\":0}],\"itemIds\":[\"ena2m8hurtgroup\",\"ennurse\",\"enfirst\"],\"tip\":\"heart es la trampa: se escribe casi como hurt y suena «jaat», con la a bien abierta. Son dos palabras distintas y dos vocales distintas.\"},{\"id\":\"ena2m8l5e2\",\"type\":\"mc\",\"prompt\":\"La r que no está\",\"question\":\"¿Cómo suena «It hurts»?\",\"options\":[\"it JÉETS\",\"it JURTS\",\"it JAATS\"],\"answer\":0,\"whyWrong\":[null,\"La r española no va: detrás de la vocal, en inglés británico la r no suena\",\"Esa es la vocal de heart, que es otra palabra\"],\"itemIds\":[\"ena2m8itreallyhurts\",\"ena2m8hurtgroup\"],\"tip\":\"Regla del curso, y sirve para todo el inglés británico: la r solo se pronuncia si detrás hay una vocal. En hurt no la hay.\"},{\"id\":\"ena2m8l5e3\",\"type\":\"shadow\",\"prompt\":\"Repite pegado al audio — las cinco seguidas\",\"text\":\"hurt, nurse, worse, first, work\",\"phonetic\":\"jéet · nées · uées · féest · uéek\",\"translation\":\"doler, enfermera, peor, primero, trabajo\",\"reps\":3,\"itemIds\":[\"ena2m8hurtgroup\"],\"tip\":\"Dilo sin mover la lengua entre palabra y palabra: la vocal es la misma en las cinco. Si notas que la boca se te abre, has metido una vocal española.\"},{\"id\":\"ena2m8l5e4\",\"type\":\"mc\",\"prompt\":\"La ortografía que engaña\",\"question\":\"«cough» rima con…\",\"options\":[\"off\",\"go\",\"though\"],\"answer\":0,\"whyWrong\":[null,\"Esa sería la lectura de dough o though; cough no\",\"though es «dóu», sin f al final\"],\"itemIds\":[\"ena2m8acough\"],\"tip\":\"La -gh inglesa es un cementerio de sonidos: en cough y enough suena F, en though no suena nada, y en night tampoco. Se aprende palabra a palabra.\"},{\"id\":\"ena2m8l5e5\",\"type\":\"listen\",\"prompt\":\"Dictado — una sílaba, tres consonantes\",\"text\":\"I coughed all night.\",\"translation\":\"Me pasé la noche tosiendo.\",\"hints\":[\"cough + la terminación del pasado\",\"I cough… all night.\"],\"itemIds\":[\"ena2m8icoughedallnight\",\"ena2m8acough\"],\"tip\":\"coughed suena «koft»: k-o-f-t, sin ninguna vocal detrás de la f. Es el mismo cierre de asked y worked del módulo 1.\"},{\"id\":\"ena2m8l5e6\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la frase de la consulta\",\"text\":\"It really hurts and it's getting worse.\",\"phonetic\":\"it RÍA-li JÉETS and its GUE-ting UÉES\",\"translation\":\"Me duele muchísimo y va a peor.\",\"itemIds\":[\"ena2m8itreallyhurts\",\"ena2m8itsgettingworse\"],\"tip\":\"Dos veces la misma vocal larga: hurts y worse. Si te salen iguales, la clínica está hecha.\"},{\"id\":\"ena2m8l5e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige la posición del adverbio\",\"wrong\":\"It hurts really much.\",\"answers\":[\"It really hurts.\"],\"why\":\"Del módulo 3: lo que gradúa al verbo va DELANTE del verbo (really hurts) o al final del todo (it hurts a lot), nunca detrás del verbo suelto. Y «really much» no es una pareja que exista: o really + verbo, o very much al final.\",\"translation\":\"Me duele muchísimo.\",\"itemIds\":[\"ena2m8itreallyhurts\",\"ena2m3ireallylikethisfilm\"]},{\"id\":\"ena2m8l5e8\",\"type\":\"cloze\",\"prompt\":\"Completa con el comparativo\",\"text\":\"My back is getting ___ , not better.\",\"answers\":[\"worse\"],\"translation\":\"La espalda me va a peor, no a mejor.\",\"hints\":[\"El comparativo irregular de bad, del módulo 4\",\"w…\"],\"itemIds\":[\"ena2m8itsgettingworse\",\"ena2m4badworseworst\"]},{\"id\":\"ena2m8l5e9\",\"type\":\"match\",\"prompt\":\"Empareja el sonido con su palabra\",\"pairs\":[{\"target\":\"hurt\",\"source\":\"jéet — doler\"},{\"target\":\"cough\",\"source\":\"kof — la tos\"},{\"target\":\"worse\",\"source\":\"uées — peor\"},{\"target\":\"knee\",\"source\":\"níi — la rodilla\"}],\"itemIds\":[\"ena2m8hurtgroup\",\"ena2m8acough\",\"ena2m8bodypartsgroup\"],\"tip\":\"Las cuatro se leen fatal si te fías de las letras. Este módulo tiene mala ortografía en casi todas sus palabras clave: fíate del oído.\"},{\"id\":\"ena2m8l5e10\",\"type\":\"audiomc\",\"prompt\":\"Escucha a la enfermera — 2 escuchas\",\"audio\":\"The nurse asked me a lot of questions. She worked here first, before the hospital, and she said my knee was getting worse.\",\"question\":\"¿Qué dijo la enfermera de la rodilla?\",\"options\":[\"Que va a peor\",\"Que ya está bien\",\"Que hay que operar\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"worse es «peor»: justo lo contrario\",\"No dice nada de operaciones\"],\"itemIds\":[\"ena2m8itsgettingworse\",\"ena2m8hurtgroup\",\"ennurse\"],\"tip\":\"Cuenta cuántas veces suena la vocal larga en ese audio: nurse, worked, first, worse. Cuatro en dos frases. Por eso se entrena.\"},{\"id\":\"ena2m8l5e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me pasé la noche tosiendo y hoy me duele el pecho.\",\"answers\":[\"I coughed all night and today my chest hurts.\",\"I coughed all night and my chest hurts today.\",\"Last night I coughed all night and today my chest hurts.\"],\"hints\":[\"cough + -ed, y la parte del cuerpo como sujeto\",\"I cough… all night and today my ch… hurts.\"],\"itemIds\":[\"ena2m8icoughedallnight\",\"ena2m8bodypartsgroup\",\"ena2m8myheadhurts\"],\"tip\":\"Dilo en voz alta antes de darle a corregir: koft, chest, jéets. Tres cierres consonánticos seguidos y ni una vocal de propina.\"}]}],\"resources\":[{\"label\":\"BBC Learning English — The sounds of English\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/features/pronunciation\",\"note\":\"Busca el vídeo de la vocal /ɜː/ (la de nurse) y míralo dos veces: una mirando la boca, otra con los ojos cerrados. Es la vocal más rentable del módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile
