ay football in the park.\",\"Then I have lunch with my family.\",\"In the evening we watch films at my flat.\",\"I love Saturdays!\"],\"translation\":\"Déjame pensar… Vale: mi día favorito es el sábado. Por la mañana juego al fútbol en el parque. Luego como con mi familia. Por la tarde vemos películas en mi piso. ¡Me encantan los sábados!\",\"hints\":[\"Arranque → mañana → mediodía → tarde → cierre con emoción\",\"Let me think abre, I love… cierra\"],\"itemIds\":[\"enmyfavouriteday\",\"enplayfootball\",\"enletmethink\"],\"tip\":\"El minuto tiene forma de día: mañana → mediodía → tarde. Cronología = organización gratis.\"},{\"id\":\"ena1m12l9e6\",\"type\":\"audiomc\",\"prompt\":\"La pregunta de seguimiento — 2 escuchas\",\"audio\":\"And what do you do on Sundays?\",\"question\":\"¿Qué te pregunta el examinador después de tu minuto?\",\"options\":[\"Qué haces los domingos\",\"Qué hiciste el domingo pasado\",\"Si te gustan los sábados\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"what DO you do es presente — el pasado no te lo van a exigir en el A1\",\"Saturdays no suena: dijo Sundays\"],\"itemIds\":[\"enexaminer\",\"enweekend\"],\"tip\":\"Las preguntas de seguimiento reciclan tu tema en presente simple. Respira y contesta con tus frases.\"},{\"id\":\"ena1m12l9e7\",\"type\":\"cloze\",\"prompt\":\"El día de los resultados\",\"text\":\"Your results: PASS. Well done — you can ___ it!\",\"answers\":[\"do\"],\"translation\":\"Tus resultados: APTO. ¡Bien hecho — tú puedes!\",\"hints\":[\"You can D-O it: hacerlo, poder con ello\",\"d-o\"],\"itemIds\":[\"enresults\",\"enwelldone\",\"enyoucandoit\"],\"tip\":\"PASS con el 50% — y High Pass desde 101/150. Los resultados, online, en 3 días hábiles.\"},{\"id\":\"ena1m12l9e8\",\"type\":\"transform\",\"prompt\":\"La vacuna reina, por última vez — espiral del módulo 3\",\"source\":\"I have twenty-five years.\",\"instruction\":\"El día del examen, esta NO: corrígela\",\"answers\":[\"I'm twenty-five years old.\",\"I am twenty-five ye
