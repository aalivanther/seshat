a en tres tiempos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eReconoce algo\u003c/b\u003e — \u003ci\u003eThat's a good point.\u003c/i\u003e · \u003ci\u003eI see what you mean.\u003c/i\u003e · \u003ci\u003eTo be fair, …\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eAmortigua\u003c/b\u003e — \u003ci\u003eI'm not so sure about that.\u003c/i\u003e · \u003ci\u003eI'm afraid I disagree.\u003c/i\u003e · \u003ci\u003eI partly agree.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eDa la razón\u003c/b\u003e — \u003ci\u003e…because the bin lorry can't get down there.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el paso 3 no es opcional.\u003c/b\u003e Un desacuerdo sin motivo, en el examen, cuenta como un turno perdido: la consigna oficial pide «expresar acuerdo y desacuerdo \u003cb\u003econ razones\u003c/b\u003e». Si dices \u003ci\u003eI don't think so\u003c/i\u003e y te callas, el interlocutor tiene que tirarte de la lengua, y eso baja la nota.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa escalera, de más suave a más fuerte:\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eI partly agree.\u003c/i\u003e / \u003ci\u003eI agree up to a point.\u003c/i\u003e — casi un sí.\u003cbr/\u003e· \u003ci\u003eI see what you mean, but…\u003c/i\u003e — el clásico.\u003cbr/\u003e· \u003ci\u003eI'm not so sure about that.\u003c/i\u003e — la más útil de todas: no dice «no», dice «convénceme».\u003cbr/\u003e· \u003ci\u003eI'm afraid I disagree.\u003c/i\u003e — un no claro y perfectamente educado. \u003cb\u003eEsta es la de examen.\u003c/b\u003e\u003cbr/\u003e· \u003ci\u003eI disagree.\u003c/i\u003e — un no seco. Existe, pero úsala sabiendo lo que haces.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePara marcar que lo que viene es TU opinión y no un hecho:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eAs far as I'm concerned, …\u003c/b\u003e — «por lo que a mí respecta».\u003cbr/\u003e· \u003cb\u003eIf you ask me, …\u003c/b\u003e — más coloquial.\u003cbr/\u003eLas dos hacen algo que el examen mide: separar el hecho de la opinión, que ya viste en el módulo 4.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUn aviso de forma:\u003c/b\u003e \u003ci\u003eagree\u003c/i\u003e es un VERBO, no un adjetivo. \u003ci\u003eI agree\u003c/i\u003e, nunca \u003ci\u003e«I am agree»\u003c/i\u003e. Y lleva \u003cb\u003ewith\u003c/b\u003e para personas (\u003ci\u003eI agree with you\u003c/i\u003e) y \u003cb\u003eon\u003c/b\u003e o \u003cb\u003eabout\u003c/b\u003e para asuntos (\u003ci\u003ewe agree on the gates\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l8\",\"phaseId\":\"enb1m11\",\"title\":\"I'm not so sure about that\",\"subtitle\":\"Discrepar en inglés es un arte de amortiguadores — y el examen los cuenta\",\"minutes\":17,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis maneras de no estar de acuerdo sin ofender a nadie\",\"itemIds\":[\"enb1m11natnotsosure\",\"enb1m11imafraididisagree\",\"enb1m11iseewhatyoumean\",\"enb1m11thatsagoodpoint\",\"enb1m11ipartlyagree\",\"enb1m11asfarasimconcerned\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué «I disagree» a secas suena mal, y qué se dice en su lugar\",\"body\":\"$17\",\"table\":[[\"Lo que quieres decir\",\"Cómo se dice\",\"Cuándo\"],[\"Casi te doy la razón\",\"I partly agree.\",\"para ceder terreno\"],[\"No me convence\",\"I'm not so sure about that.\",\"la más útil de todas\"],[\"No, y lo digo bien\",\"I'm afraid I disagree.\",\"la de examen\"],[\"Esto es mi opinión\",\"As far as I'm concerned, …\",\"para separar hecho de opinión\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l8e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro maneras de responder\",\"pairs\":[{\"target\":\"That's a good point.\",\"source\":\"Ahí tienes razón.\"},{\"target\":\"I'm not so sure about that.\",\"source\":\"No lo tengo yo tan claro.\"},{\"target\":\"I'm afraid I disagree.\",\"source\":\"Me temo que no estoy de acuerdo.\"},{\"target\":\"I partly agree with you.\",\"source\":\"Estoy de acuerdo contigo en parte.\"}],\"itemIds\":[\"enb1m11thatsagoodpoint\",\"enb1m11natnotsosure\",\"enb1m11imafraididisagree\",\"enb1m11ipartlyagree\"],\"tip\":\"Ordénalas mentalmente de más suave a más dura: partly agree, not so sure, afraid I disagree. Tener las tres en la boca es lo que te permite discutir tres minutos sin repetirte.\"},{\"id\":\"enb1m11l8e2\",\"type\":\"mc\",\"prompt\":\"El registro del desacuerdo\",\"question\":\"En una discusión de examen, ¿cuál es la forma más segura de decir que no?\",\"options\":[\"I'm afraid I disagree, because the lorry can't get down there.\",\"I disagree.\",\"No, that's wrong.\"],\"answer\":0,\"whyWrong\":[null,\"No está mal, pero va desnuda y sin motivo: en el examen es un turno corto y sin desarrollar, que es lo que baja la banda.\",\"Eso corrige a la otra persona en vez de discrepar de ella. En una discusión entre iguales suena agresivo.\"],\"itemIds\":[\"enb1m11imafraididisagree\",\"enb1m11natnotsosure\"],\"tip\":\"Fíjate en lo que hace la opción buena: amortigua («I'm afraid») y da la razón («because…»). Esas dos piezas juntas son media nota de la parte oral, y no cuestan vocabulario nuevo.\"},{\"id\":\"enb1m11l8e3\",\"type\":\"bucket\",\"prompt\":\"¿Le está dando la razón o se la está quitando?\",\"categories\":[\"Le da la razón\",\"Discrepa\"],\"items\":[{\"text\":\"That's a good point.\",\"bucket\":0},{\"text\":\"I'm not so sure about that.\",\"bucket\":1},{\"text\":\"To be fair, you're right about the bins.\",\"bucket\":0},{\"text\":\"I'm afraid I disagree.\",\"bucket\":1},{\"text\":\"I partly agree with you.\",\"bucket\":0},{\"text\":\"I see what you mean, but it isn't that simple.\",\"bucket\":1}],\"itemIds\":[\"enb1m11thatsagoodpoint\",\"enb1m11natnotsosure\",\"enb1m11tobefair\",\"enb1m11imafraididisagree\",\"enb1m11ipartlyagree\",\"enb1m11iseewhatyoumean\"],\"tip\":\"Las dos últimas engañan: «I partly agree» y «I see what you mean, but…» empiezan igual de amables y acaban en sitios contrarios. Lo que decide es lo que viene DESPUÉS del amortiguador.\"},{\"id\":\"enb1m11l8e4\",\"type\":\"cloze\",\"prompt\":\"Completa: «agree» es verbo, no adjetivo\",\"text\":\"I ___ with you up to a point.\",\"answers\":[\"agree\"],\"translation\":\"Estoy de acuerdo contigo hasta cierto punto.\",\"hints\":[\"Ojo: no lleva «am» delante\",\"Cinco letras\"],\"itemIds\":[\"enb1m11ipartlyagree\"],\"tip\":\"«I am agree» es de los errores que más rápido delatan a un hispanohablante, porque en español «estar de acuerdo» lleva verbo copulativo. En inglés «agree» ya es el verbo entero.\"},{\"id\":\"enb1m11l8e5\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que dijo Marie en la reunión\",\"text\":\"«___ a good point about the bins,» said Marie, «and ___ with you up to a point. But ___ I disagree about the mornings: half the street is asleep.»\",\"answers\":[\"That's\",\"I agree\",\"I'm afraid\"],\"bank\":[\"That's\",\"I agree\",\"I'm afraid\",\"It takes\",\"I'm not\",\"As far as\"],\"translation\":\"«Ahí tienes razón con lo de los cubos», dijo Marie, «y estoy de acuerdo contigo hasta cierto punto. Pero me temo que no estoy de acuerdo con lo de las mañanas: media calle está durmiendo.»\",\"itemIds\":[\"enb1m11thatsagoodpoint\",\"enb1m11ipartlyagree\",\"enb1m11imafraididisagree\"],\"tip\":\"Los tres huecos son la receta entera y en orden: reconocer, ceder, discrepar. Léela seguida en voz alta: así es como suena un turno de B1 bien montado.\"},{\"id\":\"enb1m11l8e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin usar las palabras prohibidas\",\"source\":\"I'm not so sure about that.\",\"forbid\":[\"sure\",\"not\"],\"answers\":[\"I'm afraid I disagree\",\"I have my doubts about that\",\"I partly agree, but I would need convincing\"],\"translation\":\"No lo tengo yo tan claro.\",\"itemIds\":[\"enb1m11natnotsosure\",\"enb1m11imafraididisagree\",\"enb1m11ipartlyagree\"],\"tip\":\"Tres registros distintos para la misma duda: una de examen, una neutra y una que cede terreno. En el oral conviene tener las tres, porque repetir el mismo amortiguador cuatro veces también se nota.\"},{\"id\":\"enb1m11l8e7\",\"type\":\"write\",\"prompt\":\"Writing Tarea 2: la carta informal. Lee el mensaje de Emma, mira el esqueleto y contéstale. 100-120 palabras, tres conectores distintos.\",\"scenario\":\"Emma, tu amiga de Mánchester, ha visto lo del callejón en el grupo del barrio y no lo ve claro. Contéstale tratando LAS TRES cosas, y usa al menos tres conectores distintos: la coherencia es un criterio entero de los cuatro.\",\"genre\":\"mail-informal\",\"register\":\"direct\",\"stimulus\":{\"author\":\"Emma (Manchester)\",\"text\":\"Saw your thing about the gates on that community page. Half the comments are people shouting at each other and I couldn't work out what had actually happened. And are you sure gating it is a good idea? My mum's street did that and the bins ended up on the pavement for about two years.\"},\"bullets\":[\"Cuéntale qué ha pasado de verdad en el callejón.\",\"Dile en qué le das la razón y en qué no.\",\"Propón algo concreto y pídele su opinión.\"],\"checks\":[{\"re\":\"(rubble|mattress|fly-?tipping|litter|entry|alley)\",\"label\":\"Cuentas qué ha pasado de verdad\"},{\"re\":\"(good point|you'?re right|i see what you mean|to be fair|partly agree|not so sure|i'?m afraid)\",\"label\":\"Dices en qué le das la razón y en qué no\"},{\"re\":\"(what if|how about|why don'?t|we could|let me know|what do you think)\",\"label\":\"Propones algo y le pides su opinión\"}],\"frame\":[\"Saludo: «Hi Emma,» y una primera línea que ordene el lío\",\"Qué pasó, en dos o tres frases y en pasado simple\",\"Dale la razón en algo: «To be fair, you've got a good point about…»\",\"Y quítasela con motivo: «…, though» + la razón\",\"Tu propuesta, con «So what if we…?» o «How about…?»\",\"Pídele su opinión y firma con tu nombre a secas\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"though\",\"to be fair\",\"having said that\",\"actually\",\"anyway\",\"at least\",\"besides\",\"on the other hand\",\"in spite of\",\"luckily\",\"apart from\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":100,\"maxWords\":120,\"model\":\"Hi Emma,\\nIgnore the comments. Half of them are from people who don't even live here.\\nWhat's actually going on is this: somebody dumped a mattress in the entry in December, then three bags of rubble in February, and after the bags split there was litter the whole way down. The council took the mattress away and left the rest.\\nTo be fair, you've got a good point about the bins. That's exactly what the people against it said, though, and nobody had an answer.\\nSo what if we tried it for six months and wrote down everything that goes wrong? That idea wasn't even mine. What do you think?\\nValeria\",\"itemIds\":[\"enb1m11theentry\",\"enb1m8litter\",\"enb1m11tobefair\",\"enb1m11thatsagoodpoint\",\"enb1m11whatifwe\",\"enb1m5though\"],\"tip\":\"Cuenta las palabras: 100-120. Y mira el modelo: le da la razón antes de quitársela, el desacuerdo llega con un «though» al final de la frase, y la propuesta es concreta y con plazo. Ni un «Yours sincerely» — meter la despedida formal en un mensaje a una amiga baja el criterio de vocabulario por registro.\"},{\"id\":\"enb1m11l8e8\",\"type\":\"build\",\"prompt\":\"Construye el desacuerdo de examen\",\"target\":\"I'm afraid I disagree with you\",\"translation\":\"Me temo que no estoy de acuerdo contigo\",\"distractors\":[\"am\",\"about\"],\"itemIds\":[\"enb1m11imafraididisagree\"],\"tip\":\"Las dos fichas que sobran son los dos calcos: «am» por «estoy de acuerdo» y «about» por confundir la preposición. Con personas va «with»; con asuntos, «on» o «about».\"},{\"id\":\"enb1m11l8e9\",\"type\":\"transform\",\"prompt\":\"Envuelve el desacuerdo\",\"source\":\"I disagree.\",\"instruction\":\"Dilo con amortiguador y con motivo, empezando por «I'm afraid»\",\"answers\":[\"I'm afraid I disagree, because the lorry can't get down there\",\"I'm afraid I disagree, because the lorry can't get down there.\",\"I'm afraid I disagree because the lorry can't get down there\"],\"translation\":\"Me temo que no estoy de acuerdo, porque el camión no puede bajar por ahí.\",\"hints\":[\"Amortiguador delante, motivo detrás\",\"I'm afraid I disagree, because ...\"],\"itemIds\":[\"enb1m11imafraididisagree\"],\"tip\":\"Dos palabras delante y una razón detrás convierten un turno de A2 en uno de B1. No has aprendido vocabulario nuevo: has aprendido a colocarlo.\"},{\"id\":\"enb1m11l8e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Entiendo lo que dices, pero por lo que a mí respecta es cosa suya.\",\"answers\":[\"I see what you mean, but as far as I'm concerned it's their job\",\"I see what you mean, but as far as I am concerned it's their job\",\"I see what you mean, but as far as I'm concerned, it's their job\"],\"hint\":\"La segunda mitad marca que lo que viene es opinión, no hecho\",\"itemIds\":[\"enb1m11iseewhatyoumean\",\"enb1m11asfarasimconcerned\"],\"tip\":\"«As far as I'm concerned» no es «hasta donde yo sé» — eso es «as far as I know», del módulo 3. Esta marca opinión; la otra marca información incompleta. Se parecen y no se pueden cambiar.\"},{\"id\":\"enb1m11l8e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Te está diciendo que sí o que no?\",\"source\":\"I'm not so sure about that, to be honest.\",\"answers\":[\"No lo tengo yo tan claro, la verdad\",\"No estoy yo tan seguro de eso, la verdad\",\"La verdad es que no lo veo tan claro\"],\"itemIds\":[\"enb1m11natnotsosure\"],\"tip\":\"Es un no, pero un no que deja la puerta abierta: literalmente está pidiendo que le convenzas. Si lo traduces por «no estoy de acuerdo» pierdes justo esa invitación, que es lo mejor que tiene la frase.\"},{\"id\":\"enb1m11l8e12\",\"type\":\"hearreal\",\"prompt\":\"¿Cuál de las dos has oído? La diferencia es una sílaba que se evapora\",\"book\":\"I am not so sure about that.\",\"real\":\"I'm not so sure about that.\",\"translation\":\"No lo tengo yo tan claro.\",\"itemIds\":[\"enb1m11natnotsosure\"],\"tip\":\"En una discusión de verdad nadie dice «I am»: sale «aim», pegado y en medio segundo. Si esperas oír dos palabras, se te pasa el arranque de la frase y con él la pista de que viene un desacuerdo.\"},{\"id\":\"enb1m11l8e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: dos vecinos discuten en la puerta del centro cívico. Dos escuchas.\",\"audio\":\"So you're for it, then.|I'm for anything that stops somebody dumping a sofa outside my back door.|Fair enough. I'm not so sure about that, though. Once it's gated, that's the bins on the pavement every Tuesday, and half this street is over seventy.|That's a good point, and to be fair nobody at the meeting had an answer for it.|So what do we do?|What if the ones who can do it take the bins round for the ones who can't? Four houses, six bins. It's fifteen minutes.|You'd do that?|I'd do it for six months and see. If it turns into a chore, I'll say so.\",\"question\":\"¿Cómo acaba la conversación?\",\"options\":[\"Con una propuesta concreta que los dos aceptan probar\",\"Sin acuerdo: cada uno se queda donde estaba\",\"Con los dos en contra de las verjas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Sí hay acuerdo: uno propone llevar los cubos de los vecinos mayores y el otro acepta probarlo.\",\"Uno está claramente a favor desde la primera frase.\"],\"itemIds\":[\"enb1m11natnotsosure\",\"enb1m11thatsagoodpoint\",\"enb1m11tobefair\",\"enb1m11whatifwe\"],\"tip\":\"Cuenta los movimientos: reconocer, discrepar con motivo, volver a reconocer, proponer y aceptar a prueba. Son cinco, caben en cuarenta segundos, y son literalmente el Spoken Part 3 del examen.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m11-3\",\"book\":\"I disagree.\",\"real\":\"I'm not so sure about that.\",\"meaning\":\"No lo tengo yo tan claro\",\"when\":\"En cualquier discusión hablada: reunión de vecinos, trabajo, café. Es la forma normal de decir que no sin cerrar la puerta — de hecho invita al otro a explicarse. En el Writing formal y en el Spoken del examen, la versión de la derecha, que es un no claro y perfectamente educado.\",\"register\":\"neutral\",\"exam\":\"I'm afraid I disagree.\",\"note\":\"El británico casi nunca discrepa de frente: primero reconoce algo («that's a good point»), luego amortigua y solo entonces da su razón. Saltarse los dos primeros pasos no es más eficaz: es más difícil de escuchar.\",\"sound\":\"aim not sóu shóo a-báut dat\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m11natnotsosure\"}}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
