ce de dos maneras:\u003cbr/\u003e· \u003ci\u003eWe're running two hours late.\u003c/i\u003e — la más frecuente hablando.\u003cbr/\u003e· \u003ci\u003eThere's a \u003cb\u003etwo-hour\u003c/b\u003e delay.\u003c/i\u003e — y ojo con el guion y con el singular: \u003cb\u003etwo-hour\u003c/b\u003e, no «two hours». Cuando un número y un sustantivo hacen de adjetivo delante de otro sustantivo, el sustantivo pierde la -s: \u003ci\u003ea five-minute walk\u003c/i\u003e, \u003ci\u003ea ten-pound note\u003c/i\u003e, \u003ci\u003ea three-week holiday\u003c/i\u003e. Es de las cosas que más rápido delatan el nivel por escrito.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos: cancelar va en pasiva.\u003c/b\u003e \u003ci\u003eThe eight-fifteen \u003cb\u003ehas been cancelled\u003c/b\u003e.\u003c/i\u003e Nadie dice quién lo canceló, y eso es el módulo 4 trabajando aquí dentro. Si dices \u003ci\u003ethe train cancelled\u003c/i\u003e suena a que el tren decidió no venir.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTres: el enlace se pierde, y se llama \u003ci\u003econnection\u003c/i\u003e.\u003c/b\u003e \u003ci\u003eI've missed my connection.\u003c/i\u003e Y el autobús que ponen cuando el tren no puede circular tiene nombre propio en el Reino Unido: \u003cb\u003ea replacement bus service\u003c/b\u003e. Verlo escrito en un panel y entenderlo a la primera ahorra media hora de vida.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCuatro: lo que se reclama es \u003ci\u003ecompensation\u003c/i\u003e, no \u003ci\u003eindemnisation\u003c/i\u003e.\u003c/b\u003e Y es \u003cb\u003eincontable\u003c/b\u003e: \u003ci\u003eYou can claim compensation\u003c/i\u003e, nunca «a compensation». Se pide con \u003ci\u003eclaim\u003c/i\u003e: \u003ci\u003eclaim compensation\u003c/i\u003e, \u003ci\u003emake a claim\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY la mitad práctica de la lección: la carta.\u003c/b\u003e El Writing Task 1 del examen es exactamente esto — \u003cb\u003eresponder por escrito a un texto público\u003c/b\u003e (un aviso, un cartel, una carta de una empresa) tratando \u003cb\u003eun número definido de puntos\u003c/b\u003e, en \u003cb\u003e70-100 palabras\u003c/b\u003e, y con \u003cb\u003eregistro formal\u003c/b\u003e. Las tres reglas que deciden la nota:\u003cbr/\u003e1. \u003cb\u003eLos tres puntos se tratan los tres.\u003c/b\u003e Dejarte uno fuera tumba el criterio de \u003ci\u003eTask fulfilment\u003c/i\u003e antes de que nadie mire tu gramática.\u003cbr/\u003e2. \u003cb\u003eLa petición va envuelta.\u003c/b\u003e \u003ci\u003eI want a refund\u003c/i\u003e baja el registro entero. Va \u003ci\u003eI would be grateful if you could…\u003c/i\u003e o \u003ci\u003eCould you tell me whether…?\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eSin nombre en la carta de entrada, sin nombre en el saludo:\u003c/b\u003e \u003ci\u003eDear Sir or Madam\u003c/i\u003e → \u003ci\u003eYours faithfully\u003c/i\u003e. Con nombre, \u003ci\u003eDear Mr Patel\u003c/i\u003e → \u003ci\u003eYours sincerely\u003c/i\u003e. Ese par se memoriza y ya no se falla nunca."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m9l5\",\"phaseId\":\"enb1m9\",\"title\":\"The eight-fifteen has been cancelled\",\"subtitle\":\"Contar una incidencia y reclamar por escrito sin sonar a exigencia\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario de lo que sale mal\",\"itemIds\":[\"enb1m9adelay\",\"enb1m9cancelled\",\"enb1m9connection\",\"enb1m9compensation\",\"enb1m9replacementbus\",\"enb1m9onstrike\",\"enb1m9heldup\",\"enb1m9imafraidtheresbeen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: en inglés el retraso se sufre, no se tiene\",\"body\":\"$17\",\"table\":[[\"Lo que quieres decir\",\"Se dice\",\"Lo que NO se dice\"],[\"Llevamos dos horas de retraso\",\"We're running two hours late.\",\"We have two hours of delay.\"],[\"Un retraso de dos horas\",\"a two-hour delay\",\"a two hours delay\"],[\"Han cancelado el de las ocho\",\"The eight-fifteen has been cancelled.\",\"The eight-fifteen cancelled.\"],[\"He perdido el enlace\",\"I've missed my connection.\",\"I've lost my connection.\"],[\"Se puede reclamar\",\"You can claim compensation.\",\"You can claim a compensation.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m9l5e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro incidencias\",\"pairs\":[{\"target\":\"The eight-fifteen has been cancelled.\",\"source\":\"El de las ocho y cuarto lo han cancelado.\"},{\"target\":\"I've missed my connection.\",\"source\":\"He perdido el enlace.\"},{\"target\":\"a replacement bus service\",\"source\":\"un autobús sustitutivo\"},{\"target\":\"You can claim compensation.\",\"source\":\"Se puede reclamar una indemnización.\"}],\"itemIds\":[\"enb1m9cancelled\",\"enb1m9connection\",\"enb1m9replacementbus\",\"enb1m9compensation\"],\"tip\":\"Las cuatro salen en el mismo panel de una estación británica un día malo, y en ese orden. Reconocerlas leyendo es lo que separa entender qué ha pasado de mirar la pantalla sin enterarte.\"},{\"id\":\"enb1m9l5e2\",\"type\":\"mc\",\"prompt\":\"El retraso, dicho como se dice\",\"question\":\"«Llevamos dos horas de retraso.» →\",\"options\":[\"We're running two hours late.\",\"We have two hours of delay.\",\"We are two hours of late.\"],\"answer\":0,\"whyWrong\":[null,\"El calco exacto del español. Se entiende, pero nadie lo dice: el retraso no se «tiene».\",\"«Of» ahí no pinta nada. En inglés el retraso se mide con «late»: two hours late, ten minutes late.\"],\"itemIds\":[\"enb1m9adelay\"],\"tip\":\"«Running late» sirve también para personas: «Sorry, I'm running a bit late». Es la manera educada de avisar de que llegas tarde sin decir «I'm late», que suena a confesión.\"},{\"id\":\"enb1m9l5e3\",\"type\":\"errorfix\",\"prompt\":\"El guion y la -s. Cambia UNA palabra.\",\"wrong\":\"We had a two hours delay at Crewe.\",\"answers\":[\"We had a two-hour delay at Crewe.\"],\"why\":\"Cuando un número y un sustantivo hacen de adjetivo delante de otro sustantivo, el sustantivo va en singular y con guion: «a two-hour delay», «a five-minute walk», «a ten-pound note». Con la -s puesta, la frase no es que suene rara: está mal.\",\"translation\":\"Tuvimos un retraso de dos horas en Crewe.\",\"itemIds\":[\"enb1m9adelay\"]},{\"id\":\"enb1m9l5e4\",\"type\":\"cloze\",\"prompt\":\"Completa la pasiva del panel\",\"text\":\"We are sorry to announce that the eight-fifteen to Cardiff has been ___ .\",\"answers\":[\"cancelled\",\"canceled\"],\"translation\":\"Lamentamos comunicar que el de las ocho y cuarto a Cardiff ha sido cancelado.\",\"hints\":[\"Va en participio, detrás de «has been»\",\"Con doble ele en inglés británico\"],\"itemIds\":[\"enb1m9cancelled\"],\"tip\":\"En inglés británico se escribe «cancelled», con dos eles; el americano pone una. Las dos se aceptan aquí, pero en un examen británico escribe la de dos: es la que espera el corrector.\"},{\"id\":\"enb1m9l5e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el aviso de la megafonía de la estación de autobuses\",\"text\":\"We are sorry to announce that the 18:40 service to Bristol has been ___ and will not run today. A ___ bus service will leave from stand C in twenty minutes. Passengers who have missed a ___ should speak to a member of staff, who will explain how to claim ___ .\",\"answers\":[\"cancelled\",\"replacement\",\"connection\",\"compensation\"],\"bank\":[\"cancelled\",\"replacement\",\"connection\",\"compensation\",\"delayed\",\"insurance\",\"platform\"],\"translation\":\"Lamentamos comunicar que el servicio de las 18:40 a Bristol ha sido cancelado y hoy no circulará. Un autobús sustitutivo saldrá de la dársena C dentro de veinte minutos. Los viajeros que hayan perdido un enlace deben dirigirse al personal, que les explicará cómo reclamar una indemnización.\",\"itemIds\":[\"enb1m9cancelled\",\"enb1m9replacementbus\",\"enb1m9connection\",\"enb1m9compensation\"],\"tip\":\"Fíjate en el primer hueco: «delayed» está en el banco y encaja gramaticalmente, pero lo descarta lo que viene detrás («will not run today»). Un retraso sigue circulando; una cancelación, no. Así se elige en el examen: leyendo la frase entera con la palabra puesta.\"},{\"id\":\"enb1m9l5e6\",\"type\":\"transform\",\"prompt\":\"Ponlo como lo pondría el panel\",\"source\":\"They have cancelled the eight-fifteen.\",\"instruction\":\"Dilo en pasiva, sin decir quién\",\"answers\":[\"The eight-fifteen has been cancelled\",\"The eight-fifteen has been cancelled.\"],\"translation\":\"El de las ocho y cuarto ha sido cancelado.\",\"hints\":[\"Empieza por «The eight-fifteen…»\",\"The eight-fifteen has ... cancelled\"],\"itemIds\":[\"enb1m9cancelled\"],\"tip\":\"La pasiva del módulo 4 vuelve aquí sin que nadie la anuncie: en un aviso público jamás se dice quién decidió qué. Y en el Reading eso significa que el agente no está — no lo busques.\"},{\"id\":\"enb1m9l5e7\",\"type\":\"order\",\"prompt\":\"Ordena lo que pasó aquel sábado en Victoria\",\"sentences\":[\"The board went blank at twenty past six and came back with the word CANCELLED next to our service.\",\"Nobody said anything for ten minutes, and then a man with a clipboard sent us all to stand C.\",\"The replacement bus arrived forty minutes late and only had room for half the queue.\",\"By the time we reached Bristol I had missed my connection and the last train had gone.\",\"The taxi cost thirty-one pounds, and I kept the receipt because Ben told me to.\"],\"translation\":\"El panel se quedó en blanco a las seis y veinte y volvió con la palabra CANCELADO al lado de nuestro servicio. Nadie dijo nada durante diez minutos y luego un señor con una carpeta nos mandó a todos a la dársena C. El autobús sustitutivo llegó cuarenta minutos tarde y solo cabía la mitad de la cola. Para cuando llegamos a Bristol yo había perdido el enlace y el último tren ya se había ido. El taxi costó treinta y una libras, y guardé el recibo porque me lo dijo Ben.\",\"itemIds\":[\"enb1m9cancelled\",\"enb1m9replacementbus\",\"enb1m9connection\",\"enb1m9bythetime\",\"ena2m7thereceipt\"],\"tip\":\"Fíjate en la cuarta frase: «By the time we reached Bristol I had missed…». La temporal de la lección 3 en pasado, con pluscuamperfecto detrás. Es exactamente la frase que necesitas para contar una incidencia por escrito.\"},{\"id\":\"enb1m9l5e8\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee el aviso de la compañía, mira el esqueleto y contesta. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"La compañía de autocares ha publicado este aviso después de cancelar tu servicio. Escribe a atención al cliente. Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Midland Coaches — Customer Care\",\"text\":\"NOTICE TO PASSENGERS. We apologise for the disruption to services from London to the South West on Saturday 9 May. Passengers whose service was cancelled may be entitled to a refund of the fare and, in some cases, to compensation for reasonable additional costs. Please write to Customer Care with the date, the service and any receipts.\"},\"bullets\":[\"Di de qué servicio hablas y qué día era.\",\"Cuenta qué pasó y qué te costó a ti.\",\"Pide la devolución y pregunta cómo se tramita.\"],\"checks\":[{\"re\":\"(cancelled|18:40|9 may|saturday)\",\"label\":\"Dices de qué servicio hablas y qué día era\"},{\"re\":\"(replacement bus|missed my connection|taxi|never arrived)\",\"label\":\"Cuentas qué pasó y qué te costó\"},{\"re\":\"(refund|compensation|grateful if you could|could you)\",\"label\":\"Pides la devolución y preguntas cómo se tramita\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — el aviso no da nombre, así que sin nombre\",\"Por qué escribes: «I am writing about the… service on…» + la fecha exacta\",\"Qué pasó, en dos frases y con una temporal: «Once the announcement was made,…»\",\"Qué te costó, con un conector de consecuencia: «Therefore…»\",\"La petición, envuelta: «I would be grateful if you could…» + una condición con «provided that…»\",\"Una pregunta educada sobre el trámite + cierre: «I look forward to hearing from you. Yours faithfully,…»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"once\",\"as long as\",\"provided that\",\"in case\",\"until\",\"by the time\",\"although\",\"therefore\",\"besides\",\"otherwise\",\"in addition\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the 18:40 coach to Bristol on Saturday 9 May, which was cancelled twenty minutes before it was due to leave.\\nOnce the announcement was made, we were sent to a replacement bus that never arrived. Therefore I missed my connection and paid for a taxi.\\nI would be grateful if you could refund the fare, provided that a photograph of the ticket is enough. Could you also tell me how long a claim takes?\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m9cancelled\",\"enb1m9replacementbus\",\"enb1m9connection\",\"enb1m9providedthat\",\"enb1m9once\",\"enb1m5gratefulifyoucould\",\"enb1m5yoursfaithfully\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y mira el modelo: ni un «I want», ni una orden pelada. La petición va envuelta en «I would be grateful if you could…», la condición en «provided that» y la consecuencia en «Therefore» — que es lo que el criterio de Organisation llama coherencia, y son puntos.\"},{\"id\":\"enb1m9l5e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"He perdido el enlace y me temo que ha habido un problema con la reserva.\",\"answers\":[\"I've missed my connection and I'm afraid there's been a problem with my booking\",\"I have missed my connection and I'm afraid there has been a problem with my booking\",\"I've missed my connection and I'm afraid there's been a problem with the booking\"],\"hint\":\"«Me temo que» abre la mala noticia; «ha habido» va con «there»\",\"itemIds\":[\"enb1m9connection\",\"enb1m9imafraidtheresbeen\",\"ena2m6thebooking\"],\"tip\":\"«I'm afraid» no significa que tengas miedo: es el amortiguador con el que un británico anuncia cualquier cosa desagradable. Sin él, la misma frase suena a reproche.\"},{\"id\":\"enb1m9l5e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te están ofreciendo?\",\"source\":\"If your service was cancelled, you may be entitled to a refund and, in some cases, to compensation.\",\"answers\":[\"Si le cancelaron el servicio, puede que tenga derecho a una devolución y, en algunos casos, a una indemnización\",\"Si te cancelaron el servicio, puedes tener derecho a la devolución y, en algunos casos, a una indemnización\",\"Si su servicio fue cancelado, podría tener derecho a una devolución y en algunos casos a una indemnización\"],\"itemIds\":[\"enb1m9cancelled\",\"enb1m9compensation\",\"enb1m5refund\"],\"tip\":\"«May be entitled to» es la fórmula con la que una empresa británica te promete algo sin prometerte nada. Reconocerla es de nivel: el «may» está ahí precisamente para que no sea una promesa.\"},{\"id\":\"enb1m9l5e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"The eight-fifteen has been cancelled.\",\"translation\":\"El de las ocho y cuarto ha sido cancelado.\",\"hints\":[\"Empieza por «The eight-fifteen…»\",\"The eight-fifteen has been ...\"],\"itemIds\":[\"enb1m9cancelled\"],\"tip\":\"Las horas se dicen así en los paneles y en la megafonía: «the eight-fifteen», «the ten-forty», como si fueran el nombre del tren. Si esperas oír «the train at a quarter past eight», no vas a reconocer nada.\"},{\"id\":\"enb1m9l5e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres frases que preparas antes de llegar al mostrador\",\"text\":\"I'm afraid there's been a problem. The eight-fifteen was cancelled and I've missed my connection. Can I claim compensation?\",\"phonetic\":\"aim a-FRÉID des̬ bin a PRO-blem · di éit-fif-TÍIN uos̬ KÁN-seld and aiv mist mai ko-NÉK-shon · kan ai kléim kom-pen-SÉI-shon\",\"translation\":\"Me temo que ha habido un problema. El de las ocho y cuarto lo cancelaron y he perdido el enlace. ¿Puedo reclamar una indemnización?\",\"itemIds\":[\"enb1m9imafraidtheresbeen\",\"enb1m9cancelled\",\"enb1m9connection\",\"enb1m9compensation\"],\"tip\":\"Tres frases, quince segundos: el amortiguador, el hecho y la petición. Dilas dos veces antes de llegar al mostrador y no te vas a bloquear — y de paso es exactamente el tipo de intervención que puntúa en el Speaking Part 2.\"},{\"id\":\"enb1m9l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: en el mostrador de atención al viajero. Dos escuchas.\",\"audio\":\"I'm afraid there's been a problem. The eighteen-forty was cancelled and I've missed my connection at Bristol.|Right. Have you still got the ticket?|On my phone.|That's fine, a photograph does. Now, the fare comes back automatically within a week, you don't have to ask for that.|And the taxi? It was thirty-one pounds.|That's a separate form, and it isn't automatic. You send the receipt and they decide. I'll be honest with you: with a cancellation they usually pay it, as long as you can show the last train had gone.|And how long does that take?|Six weeks, they say. Eight, in my experience.\",\"question\":\"¿Qué le dicen sobre el dinero del taxi?\",\"options\":[\"Que hay que pedirlo aparte y no está garantizado\",\"Que se devuelve solo, como el billete\",\"Que no se devuelve nunca\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Lo automático es el billete: «the fare comes back automatically». El taxi es «a separate form, and it isn't automatic».\",\"Al contrario: dice que con una cancelación suelen pagarlo, siempre que puedas demostrar que ya no había tren.\"],\"itemIds\":[\"enb1m9compensation\",\"enb1m9aslongas\",\"enb1m9connection\"],\"tip\":\"Escucha el «as long as» del final: es la condición del módulo metida en una conversación real, y es exactamente lo que separa «te lo pagan» de «te lo pagan si demuestras esto». En el Listening Part 2 esa clase de matiz ES la respuesta.\"}]}],\"resources\":[{\"label\":\"National Rail — Delay Repay\",\"url\":\"https://www.nationalrail.co.uk/travel-information/delay-repay/\",\"note\":\"Lee solo la primera pantalla, sin diccionario. Está escrita en el inglés exacto de esta lección: delayed, cancelled, claim, compensation, within 28 days. Si entiendes ese párrafo, entiendes cualquier panel de estación británica.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
