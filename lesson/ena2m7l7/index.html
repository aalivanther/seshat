-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T478,En español, «quiero un café» dicho en un bar no ofende a nadie. Con un «por favor» detrás y buen tono, es una frase perfectamente normal. \u003cb\u003eEn inglés no lo es.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e❌ \u003ci\u003eI want a coffee.\u003c/i\u003e se oye como «tráeme un café», y no lo arregla ningún \u003ci\u003eplease\u003c/i\u003e. Suena a niño pidiendo, o a cliente maleducado.\u003cbr/\u003e\u003cbr/\u003eEl motivo es de fondo y conviene entenderlo una vez, porque explica medio idioma: \u003cb\u003eel español marca la cortesía con el verbo y el tono\u003c/b\u003e («quería», «quisiera», «me pone…»), y \u003cb\u003eel inglés la marca con el modal\u003c/b\u003e. Cambiar de \u003ci\u003ecan\u003c/i\u003e a \u003ci\u003ecould\u003c/i\u003e es en inglés lo que cambiar de «quiero» a «querría» en español. Si no mueves el modal, no has sido educado, digas lo que digas después.\u003cbr/\u003e\u003cbr/\u003eLo que sí se dice:\u003cbr/\u003e· \u003cb\u003eCould I have a coffee, please?\u003c/b\u003e — la de siempre, la que nunca falla.\u003cbr/\u003e· \u003cb\u003eI'd like a coffee, please.\u003c/b\u003e — «quisiera». \u003ci\u003eI'd like\u003c/i\u003e es la versión educada de \u003ci\u003eI want\u003c/i\u003e, y es literalmente \u003ci\u003eI would like\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eGrábate esta equivalencia: \u003cb\u003eI want = quiero\u003c/b\u003e (a secas, con el dedo señalando) · \u003cb\u003eI'd like = quisiera\u003c/b\u003e.18:T439,Los tres piden lo mismo y los tres son correctos. Lo que cambia es \u003cb\u003ea cuánta distancia te pones\u003c/b\u003e de la otra persona:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. Can I…?\u003c/b\u003e — el escalón normal. Con amigos, en un café, en una tienda. [[Can I sit here?|¿Puedo sentarme aquí?]] No es maleducado: es directo y corriente.\u003cbr/\u003e\u003cb\u003e2. Could I…?\u003c/b\u003e — \u003cb\u003eel escalón por defecto de este curso\u003c/b\u003e. Sirve absolutamente en todas partes: con un desconocido, en una ventanilla, en un correo, en el examen. Si solo te vas a quedar con uno, quédate con este. [[Could I have a stamp, please?|¿Me pone un sello, por favor?]]\u003cbr/\u003e\u003cb\u003e3. May I…?\u003c/b\u003e — el más formal de los tres. Una oficina, una entrevista, un trámite serio, alguien mucho mayor. [[May I ask a question?|¿Puedo hacerle una pregunta?]] Ojo: usado con un amigo suena antiguo, casi de broma.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTodos son modales\u003c/b\u003e, así que los tres van con el verbo desnudo: ❌ \u003ci\u003eMay I to ask…\u003c/i\u003e. Y el \u003cb\u003eplease\u003c/b\u003e va al final, detrás de una coma, que es donde lo pone el inglés — no al principio como el «por favor» del español.19:T4d2,La segunda tarea del Writing te pide escribir a alguien que \u003cb\u003eno es tu amigo\u003c/b\u003e: un casero, una oficina, un taller, una tienda. Y aquí está la clave que casi nadie te dice: \u003cb\u003een inglés el registro no es un pronombre\u003c/b\u003e. En español pasas de «tú» a «usted» y ya has cambiado de registro sin tocar nada más. El inglés dice \u003ci\u003eyou\u003c/i\u003e a todo el mundo, así que \u003cb\u003eel registro se juega entero en la forma de la petición\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eSe monta con tres piezas, siempre las mismas:\u003cbr/\u003e\u003cbr/\u003e· \u003cb\u003eAbrir\u003c/b\u003e: \u003ci\u003eDear Sir or Madam,\u003c/i\u003e · [[I'm sorry to bother you.|Perdone que le moleste.]] · \u003ci\u003eI'm writing about…\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003ePedir\u003c/b\u003e: \u003cb\u003eCould I…? / Could you…?\u003c/b\u003e · \u003ci\u003eWould it be possible to…?\u003c/i\u003e · [[Is it possible to pay by card?|¿Se puede pagar con tarjeta?]]\u003cbr/\u003e· \u003cb\u003eCerrar\u003c/b\u003e: [[Thank you for your help.|Gracias por su ayuda.]] · \u003ci\u003eThank you very much.\u003c/i\u003e · \u003ci\u003eBest wishes,\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eCon esas tres piezas ya escribes neutro-formal, aunque el resto de la frase sea A2 puro. Y al revés: un texto lleno de \u003ci\u003eI want\u003c/i\u003e y de imperativos pelados (\u003ci\u003eSend me the form\u003c/i\u003e) puede no tener ni un fallo de gramática y aun así perder puntos, porque \u003cb\u003eel error de "])</script><script>self.__next_f.push([1,"registro se penaliza aparte\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l7\",\"phaseId\":\"ena2m7\",\"title\":\"Could I have a stamp, please?\",\"subtitle\":\"Can → Could → May: los tres escalones, y por qué «I want» suena a orden\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Pedir como es debido\",\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7astamp\",\"ena2m7mayiaskaquestion\",\"ena2m7idliketosendthis\",\"ena2m7isitpossibleto\",\"ena2m7thankyouforyourhelp\",\"enpostoffice\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Por qué «I want a coffee» suena fatal (y en español no)\",\"body\":\"$17\",\"table\":[[\"español\",\"❌ lo que sale solo\",\"✅ lo que se dice\"],[\"Quiero un sello.\",\"I want a stamp.\",\"Could I have a stamp, please?\"],[\"Quiero mandar esto a España.\",\"I want to send this to Spain.\",\"I'd like to send this to Spain.\"],[\"¿Me lo puede mirar?\",\"You must check it.\",\"Could you check it, please?\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"La escalera: can, could, may\",\"body\":\"$18\",\"table\":[[\"escalón\",\"fórmula\",\"dónde\"],[\"directo\",\"Can I…?\",\"amigos, un café, la tienda del barrio\"],[\"neutro-formal\",\"Could I…? / I'd like…\",\"ventanilla, desconocidos, el examen\"],[\"formal\",\"May I…? / Is it possible to…?\",\"oficina, trámite, alguien mayor\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"El registro que puntúa: cómo se monta una petición neutro-formal\",\"body\":\"$19\",\"table\":[[\"función\",\"informal (a un amigo)\",\"neutro-formal (lo que puntúa)\"],[\"abrir\",\"Hi Amy!\",\"Dear Sir or Madam,\"],[\"pedir\",\"Send me the form.\",\"Could you send me the form, please?\"],[\"pedir para mí\",\"I want an appointment.\",\"I'd like to make an appointment.\"],[\"cerrar\",\"See you!\",\"Thank you for your help.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l7e1\",\"type\":\"mc\",\"prompt\":\"Estás en correos, delante de un desconocido\",\"question\":\"«¿Me pone un sello, por favor?»\",\"options\":[\"Could I have a stamp, please?\",\"I want a stamp.\",\"You must give me a stamp.\"],\"answer\":0,\"whyWrong\":[null,\"I want suena a orden en inglés, y el please no lo salva\",\"must obliga a la otra persona: en una petición es directamente grosero\"],\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7astamp\",\"enpostoffice\"],\"tip\":\"Si solo te llevas una fórmula de todo el módulo, que sea esta: Could I have…, please?\"},{\"id\":\"ena2m7l7e2\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «quiero» que suena a orden\",\"wrong\":\"I want a coffee, please.\",\"answers\":[\"I'd like a coffee, please.\",\"I would like a coffee, please.\"],\"why\":\"I want es «quiero», con el dedo señalando. En inglés, la cortesía se marca en el verbo: I'd like es exactamente «quisiera». Y no, el please no arregla el I want: es como decir «tráeme un café, por favor».\",\"translation\":\"Quisiera un café, por favor.\",\"itemIds\":[\"ena2m7idliketosendthis\",\"encanihaveacoffee\"]},{\"id\":\"ena2m7l7e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el «to» del modal más formal\",\"wrong\":\"May I to ask a question?\",\"answers\":[\"May I ask a question?\"],\"why\":\"may es un modal como can, could y must: detrás va el verbo desnudo. Ser más formal no cambia la gramática, solo el modal que eliges.\",\"translation\":\"¿Puedo hacerle una pregunta?\",\"itemIds\":[\"ena2m7mayiaskaquestion\"]},{\"id\":\"ena2m7l7e4\",\"type\":\"bucket\",\"prompt\":\"¿Se lo dirías a un amigo o a una ventanilla?\",\"categories\":[\"a un amigo (directo)\",\"a una ventanilla (neutro-formal)\"],\"items\":[{\"text\":\"Can I sit here?\",\"bucket\":0},{\"text\":\"Could I have a stamp, please?\",\"bucket\":1},{\"text\":\"Give me the form.\",\"bucket\":0},{\"text\":\"May I ask a question?\",\"bucket\":1},{\"text\":\"I want to send this.\",\"bucket\":0},{\"text\":\"I'd like to send this to Spain.\",\"bucket\":1}],\"itemIds\":[\"ena2m7canisithere\",\"ena2m7couldihaveastamp\",\"ena2m7mayiaskaquestion\",\"ena2m7idliketosendthis\"],\"tip\":\"Ojo: «Give me the form» y «I want to send this» no son incorrectas. Son de otro registro, y usarlas en la ventanilla es el error que el examen penaliza aparte de la gramática.\"},{\"id\":\"ena2m7l7e5\",\"type\":\"gapbank\",\"prompt\":\"En la ventanilla de correos — completa el diálogo\",\"text\":\"— Good morning. ___ I have five stamps for Spain, ___? — Of course. Anything else? — Yes. ___ I ask you one more question? Is it possible to pay by card? — Yes, of course you can.\",\"answers\":[\"Could\",\"please\",\"May\"],\"bank\":[\"Could\",\"please\",\"May\",\"want\",\"Give\",\"I'd like\"],\"translation\":\"— Buenos días. ¿Me pone cinco sellos para España, por favor? — Claro. ¿Algo más? — Sí. ¿Puedo hacerle una pregunta más? ¿Se puede pagar con tarjeta? — Sí, claro que sí.\",\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7mayiaskaquestion\",\"ena2m7isitpossibleto\",\"enplease\"],\"tip\":\"Las tres fichas que sobran son las tres formas de sonar brusco. Fíjate en dónde te habrían encajado y en cómo habría cambiado el tono.\"},{\"id\":\"ena2m7l7e6\",\"type\":\"transform\",\"prompt\":\"Sube un escalón de cortesía\",\"source\":\"I want to send this to Spain.\",\"instruction\":\"Dilo como se lo dirías a un desconocido\",\"answers\":[\"I'd like to send this to Spain.\",\"I would like to send this to Spain.\",\"Could I send this to Spain, please?\"],\"translation\":\"Quisiera mandar esto a España.\",\"hints\":[\"Cambia el verbo de «quiero» a «quisiera»\",\"I'd l… to send this to Spain.\"],\"itemIds\":[\"ena2m7idliketosendthis\"]},{\"id\":\"ena2m7l7e7\",\"type\":\"cloze\",\"prompt\":\"La fórmula más formal de las tres\",\"text\":\"___ I ask you a question?\",\"answers\":[\"May\",\"Could\",\"Can\"],\"translation\":\"¿Puedo hacerle una pregunta?\",\"hints\":[\"El escalón de arriba del todo: oficina, trámite, alguien mayor\",\"M…\"],\"itemIds\":[\"ena2m7mayiaskaquestion\"]},{\"id\":\"ena2m7l7e8\",\"type\":\"order\",\"prompt\":\"Ordena la conversación de la ventanilla\",\"sentences\":[\"Good morning. Could I have five stamps for Spain, please?\",\"Of course. Anything else?\",\"Yes. Is it possible to pay by card?\",\"I'm afraid you can't, it's cash only.\",\"Never mind. Thank you for your help.\"],\"translation\":\"— Buenos días. ¿Me pone cinco sellos para España, por favor? — Claro. ¿Algo más? — Sí. ¿Se puede pagar con tarjeta? — Lo siento, no puede ser: solo en efectivo. — No pasa nada. Gracias por su ayuda.\",\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7isitpossibleto\",\"ena2m7imafraidyoucant\",\"ena2m7thankyouforyourhelp\",\"encash\"]},{\"id\":\"ena2m7l7e9\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés, en registro de ventanilla\",\"direction\":\"toTarget\",\"source\":\"¿Se puede pagar con tarjeta? Gracias por su ayuda.\",\"answers\":[\"Is it possible to pay by card? Thank you for your help.\",\"Can I pay by card? Thank you for your help.\",\"Could I pay by card? Thank you for your help.\"],\"hint\":\"una pregunta neutra y el cierre de siempre\",\"itemIds\":[\"ena2m7isitpossibleto\",\"ena2m7thankyouforyourhelp\",\"encanipaybycard\"]},{\"id\":\"ena2m7l7e10\",\"type\":\"speak\",\"prompt\":\"Léelo entero, con el please al final\",\"text\":\"Excuse me, could I have a stamp for Spain, please?\",\"phonetic\":\"eks-KIÚUS̬ mi, kud ái jav a STAMP fo spéin, plíis̬\",\"translation\":\"Perdone, ¿me pone un sello para España, por favor?\",\"itemIds\":[\"ena2m7couldihaveastamp\",\"ena2m7astamp\",\"enexcuseme\"],\"tip\":\"El please va al final y con su coma delante. Ponerlo al principio, como el «por favor» español, delata al hispanohablante en la primera frase.\"},{\"id\":\"ena2m7l7e11\",\"type\":\"audiomc\",\"prompt\":\"¿Qué registro está usando? — 2 escuchas\",\"audio\":\"Good afternoon. I'm sorry to bother you. Could you tell me when the post office closes, please?\",\"question\":\"¿Con quién está hablando?\",\"options\":[\"Con un desconocido, en la calle\",\"Con un amigo de toda la vida\",\"Con un niño\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"A un amigo no le dices «I'm sorry to bother you»: eso es distancia educada\",\"Ni el saludo ni la fórmula encajan con un niño\"],\"itemIds\":[\"ena2m7imsorrytobotheryou\",\"enpostoffice\",\"enclosed\"],\"tip\":\"Tres marcas de registro en dos frases: el saludo completo, la disculpa de apertura y el Could you. Ese paquete es el neutro-formal entero.\"},{\"id\":\"ena2m7l7e12\",\"type\":\"write\",\"prompt\":\"Escribe el correo — 30-50 palabras\",\"scenario\":\"El taller te ha llamado: tu coche ya está listo, pero tú no puedes ir a recogerlo hasta el viernes por la mañana. Escríbeles un correo. No los conoces de nada, así que va en registro neutro-formal.\",\"bullets\":[\"Abre como se abre una carta a alguien que no conoces\",\"Pide poder recogerlo el viernes, con una fórmula cortés (Could I…?)\",\"Da las gracias al final\"],\"checks\":[{\"re\":\"\\\\bdear\\\\b|i'm sorry to bother|i am writing\",\"label\":\"una apertura neutro-formal\"},{\"re\":\"\\\\bcould i\\\\b|\\\\bcould you\\\\b|would it be possible|\\\\bmay i\\\\b\",\"label\":\"la petición con could o may\"},{\"re\":\"thank you|thanks\",\"label\":\"el agradecimiento del cierre\"}],\"minWords\":30,\"maxWords\":50,\"register\":\"polite\",\"requireConnectors\":{\"min\":2,\"bank\":[\"but\",\"because\",\"and\",\"so\"]},\"frame\":[\"Dear Sir or Madam, / I'm sorry to bother you.\",\"Explica el problema: no puedes ir hoy y por qué\",\"Could I … on Friday morning?\",\"Thank you for your help.\"],\"model\":\"Dear Sir or Madam, I'm sorry to bother you. My car is ready, but I can't collect it today because I have to work. Could I come on Friday morning? I don't have to be at work until eleven. Thank you very much for your help.\",\"itemIds\":[\"ena2m7imsorrytobotheryou\",\"ena2m7thankyouforyourhelp\",\"ena2m7ihavetogotothebank\",\"ena2m7youdonthavetopay\",\"ena2m7thegarage\"],\"tip\":\"El corrector busca las tres funciones: apertura, petición cortés y cierre. Un texto con las tres y gramática de A2 puntúa más que uno impecable escrito en «I want».\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m7-6\",\"book\":\"Could I have a stamp, please?\",\"real\":\"Could I get a stamp, please?\",\"meaning\":\"¿Me pone un sello, por favor?\",\"when\":\"En cafés, tiendas y ventanillas, sobre todo entre gente joven: «Could I get…» se ha comido media isla en veinte años. A alguien mayor puede sonarle americano y un poco brusco, así que en el examen y por escrito, siempre have.\",\"register\":\"neutral\",\"note\":\"Los dos verbos piden lo mismo. La diferencia es de generación, no de educación: have es lo de siempre y get es lo de ahora.\",\"sound\":\"kud ái guet a STAMP, plíis̬\",\"level\":\"a2\",\"itemId\":\"ena2m7couldihaveastamp\"}}],\"resources\":[{\"label\":\"British Council — Requests\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/requests\",\"note\":\"La página entera vale, y es corta. Cuenta cuántas peticiones empiezan por «I want»: ninguna, y no es casualidad.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"me
