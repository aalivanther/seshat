»: se dice \u003cb\u003eMA-sent\u003c/b\u003e, en dos golpes. Si esperas oír la t de \u003ci\u003emust\u003c/i\u003e, no vas a reconocer la palabra cuando te la digan. Lo trabajamos entero en la lección 5.\u003cbr/\u003e\u003cbr/\u003eY una vecina que dice lo mismo con otra cara: \u003cb\u003eisn't allowed\u003c/b\u003e. [[Smoking isn't allowed.|No está permitido fumar.]] Ojo aquí al sujeto: en español decimos «está prohibido fumar» sin sujeto, y de ahí sale el ❌ \u003ci\u003eIs not allowed to smoke\u003c/i\u003e. En inglés alguien tiene que ocupar el hueco: o \u003cb\u003eSmoking\u003c/b\u003e, o \u003cb\u003eIt\u003c/b\u003e, o \u003cb\u003eYou\u003c/b\u003e.18:T47d,Los carteles no hablan como la gente: recortan. Y como recortan siempre igual, con tres moldes los entiendes todos.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e1. No + verbo en -ing\u003c/b\u003e → prohibición. [[No smoking|Prohibido fumar]] · \u003ci\u003eNo parking\u003c/i\u003e · \u003ci\u003eNo entry\u003c/i\u003e · \u003ci\u003eNo photographs\u003c/i\u003e.\u003cbr/\u003e\u003cb\u003e2. Do not + verbo\u003c/b\u003e → prohibición, más seca todavía. [[Do not enter|No pasar]] · \u003ci\u003eDo not touch\u003c/i\u003e · \u003ci\u003eDo not lean on the door\u003c/i\u003e. Nunca \u003ci\u003edon't\u003c/i\u003e: los carteles no se contraen.\u003cbr/\u003e\u003cb\u003e3. Un sustantivo a secas\u003c/b\u003e → información o restricción. [[Staff only|Solo personal]] · [[Out of order|Averiado]] · \u003ci\u003eExit\u003c/i\u003e · \u003ci\u003eWay out\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso que más disgustos da a un hispanohablante\u003c/b\u003e: [[Push / Pull|Empujar / Tirar]] en las puertas. \u003cb\u003ePull\u003c/b\u003e es «tirar DE», no «pulsar». Y \u003cb\u003ePush\u003c/b\u003e, que se parece tanto a «pulsar», es «empujar». Las dos van justo al revés de lo que te dice el oído. Míralas dos segundos ahora y te ahorras el empujón contra la puerta del banco.\u003cbr/\u003e\u003cbr/\u003eUn par más que verás en Londres cada día: \u003cb\u003eMind the gap\u003c/b\u003e (cuidado con el hueco, en el metro), \u003cb\u003eKeep left\u003c/b\u003e, \u003cb\u003ePlease queue here\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m7l3\",\"phaseId\":\"ena2m7\",\"title\":\"You mustn't smoke in here\",\"subtitle\":\"Lo que está prohibido — y cómo lo escriben los carteles ingleses\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Prohibido\",\"itemIds\":[\"ena2m7youmustntsmoke\",\"ena2m7smokingisntallowed\",\"ena2m7nosmoking\",\"ena2m7donotenter\",\"ena2m7outoforder\",\"ena2m7staffonly\",\"ena2m7pushpull\",\"ensign\"]},{\"kind\":\"note\",\"note\":{\"title\":\"mustn't: la puerta cerrada\",\"body\":\"$17\",\"table\":[[\"lo que quieres decir\",\"cómo se dice\",\"cuándo\"],[\"Está prohibido fumar.\",\"You mustn't smoke.\",\"hablando con alguien\"],[\"No está permitido fumar.\",\"Smoking isn't allowed.\",\"neutro, en un aviso o hablando\"],[\"PROHIBIDO FUMAR\",\"No smoking\",\"en un cartel, sin verbo\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"El inglés de los carteles: tres moldes y ya está\",\"body\":\"$18\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m7l3e1\",\"type\":\"match\",\"prompt\":\"Empareja el cartel con lo que quiere decir\",\"pairs\":[{\"target\":\"No smoking\",\"source\":\"Prohibido fumar\"},{\"target\":\"Do not enter\",\"source\":\"No pasar\"},{\"target\":\"Out of order\",\"source\":\"Averiado\"},{\"target\":\"Staff only\",\"source\":\"Solo personal\"},{\"target\":\"Push\",\"source\":\"Empujar\"}],\"itemIds\":[\"ena2m7nosmoking\",\"ena2m7donotenter\",\"ena2m7outoforder\",\"ena2m7staffonly\",\"ena2m7pushpull\"]},{\"id\":\"ena2m7l3e2\",\"type\":\"mc\",\"prompt\":\"Estás delante de la puerta del banco y pone PULL\",\"question\":\"¿Qué haces?\",\"options\":[\"Tiras de la puerta\",\"Empujas la puerta\",\"Pulsas un botón\"],\"answer\":0,\"whyWrong\":[null,\"Empujar
