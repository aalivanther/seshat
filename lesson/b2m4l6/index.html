asst Transcript und Modulbeschreibungen. Eine ohne diese Unterlagen eingereichte Bitte wird zurückgewiesen. Der Studiengang, dessen Module anerkannt werden sollen, muss mit dem hiesigen vergleichbar sein.\n\nIm Forum schreibt Mira aus Wien: «Die gestern veröffentlichte Ordnung gilt bei uns auch, nur heisst die Immatrikulation hier [[Inskription|matrícula — Austria; en Alemania: Immatrikulation]]. Die zu lesende Literatur steht, und die Frist auch. Was mich stört: die vom Ausschuss beschlossene Sieben-Tage-Regel. In der Sprechstunde hat Holm gesagt, sieben Tage seien Praxis. Im Forum sagt eine Kommilitonin, deren Antrag abgelehnt wurde, sieben Tage seien sieben Tage. Das zu lösende Problem ist nicht die Endung. Das zu lösende Problem ist, dass die Ordnung und die Sprechstunde zwei verschiedene Fristen haben.»\n\nLeo liest beides in der Bibliothek. Die ständig steigende Zahl der Anträge, schreibt das Amt in einer Fussnote, habe die Härte erklärt. Die vom Amt genannte Härte erklärt nicht, warum Holm in der Sprechstunde etwas anderes sagt als §4. Leo faltet den Satz auf: «eine nach diesem Tag eingereichte Arbeit» = eine Arbeit, die nach diesem Tag eingereicht wird. Dann schreibt er an Holm. Nicht: «Das ist doch Quatsch.» Sondern: «Die in §4 genannte Frist weicht von der in der Sprechstunde genannten Praxis ab. Hiermit bitte ich um Klärung.»\n\nSofía, die das über die Schulter liest, nickt. Der eine lange Satz ist kein Schmuck. Er ist ein Werkzeug. Wer ihn falten kann, kann ihn auch anfechten.\n\nAnna schreibt unter Miras Beitrag: «In der Pflege gibt es die zu versorgenden Patienten, nicht die zu lesende Literatur. Trotzdem gilt dieselbe Endung.» Herr Vogel, der das Forum nicht kennt, sagt im Treppenhaus nur: «Was mich stört: die Jugend und ihre Fristen.» Leo antwortet nicht. Er hat einen Antrag zu schreiben, und die in der Ordnung genannte Vorlesungszeit endet in zwölf Werktagen. Die Kommilitonin, deren Antrag abgelehnt wurde, hat ihm ihr Transcript gezeigt. Ohne Modulbeschreibung, sagt §4a, wird nichts anerkannt. Ein Erstsemester verstünde den Satz vielleicht nicht. Leo versteht ihn. Deshalb faltet er. Nico ruft an und fragt, ob Leo am Samstag kochen kommt. Leo sagt: «Nach der in der Ordnung genannten Vorlesungszeit. Vorher nicht.» Nico versteht das Gerundivum nicht, aber den Samstag schon."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m4l6\",\"phaseId\":\"b2m4\",\"title\":\"§4 der Studienordnung\",\"subtitle\":\"Lectura larga: un reglamento y un foro que lo contradice\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del Teil 5\",\"itemIds\":[\"b2m4studienordnung\",\"b2m4einschreibung\",\"b2m4modulhandbuch\",\"b2m4leistungspunkte\",\"b2m4inskription\",\"b2m4vorlesungszeit\",\"b2m4kommilitonin\",\"b2m4erstsemester\",\"b2m4modulbeschreibung\",\"b2m4transcript\",\"b2m4werktag\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: títulos de índice, no la novela\",\"body\":\"El Lesen Teil 5 del Goethe B2 es una [[Studienordnung|plan de estudios]] : asignar títulos de un índice a párrafos, y cuatro sobran. Aquí hay un reglamento y, debajo, un hilo de foro. No se ponen de acuerdo en los plazos. Lee los atributos largos deshaciéndolos.\u003cbr/\u003e\u003cbr/\u003eNota plurizéntrica: el foro cita a una estudiante de Viena. Verás \u003cb\u003e[[Inskription|matrícula — en Austria; en Alemania: Immatrikulation]]\u003c/b\u003e. Reconocer, no producir.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m4l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reglamento y el foro. Deshaz los atributos si te bloquean.\",\"title\":\"§4 Abgabe und Verlängerung\",\"source\":\"Studienordnung, Seminar Holm (bearbeitet); Forum «Studieren in DACH»\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m4l6e1q1\",\"q\":\"Wann muss der Antrag auf Verlängerung eingehen?\",\"options\":[\"Como muy tarde siete días antes de la Abgabefrist, en el Prüfungsamt\",\"El último día de clase\",\"Después de entregar el trabajo\"],\"answer\":0,\"why\":\"«spätestens sieben Tage vor der Frist im Prüfungsamt».\"},{\"id\":\"b2m4l6e1q2\",\"q\":\"Was meint Mira mit «zwei verschiedene Fristen»?\",\"options\":[\"Que en Viena hay otra fecha\",\"Que Holm en tutoría habla de práctica y el §4 habla de siete días estrictos: reglamento y pasillo no coinciden\",\"Que el Stipendium tiene otra fecha\"],\"answer\":1,\"inference\":true,\"why\":\"Holm: sieben Tage seien Praxis. La compañera rechazada: sieben Tage seien sieben Tage. El foro contra el reglamento.\"},{\"id\":\"b2m4l6e1q3\",\"q\":\"Welche Unterlagen verlangt §4a?\",\"options\":[\"Solo una carta\",\"Transcript y descripciones de módulos; sin eso se rechaza la petición\",\"El DNI\"],\"answer\":1,\"why\":\"«Der … Nachweis umfasst Transcript und Modulbeschreibungen. Eine ohne diese Unterlagen eingereichte Bitte wird zurückgewiesen.»\"},{\"id\":\"b2m4l6e1q4\",\"q\":\"Wie schreibt Leo an Holm — und warum so?\",\"options\":[\"«Das ist doch Quatsch»\",\"Con un atributo y Hiermit: describe la contradicción sin acusar, el traje de B2\",\"No escribe\"],\"answer\":1,\"inference\":true,\"why\":\"«Die in §4 genannte Frist weicht von der in der Sprechstunde genannten Praxis ab. Hiermit bitte ich um Klärung.»\"},{\"id\":\"b2m4l6e1q5\",\"q\":\"Was ist «Inskription» im Wiener Beitrag?\",\"options\":[\"Una inscripción a un club\",\"La matrícula universitaria austriaca; en Alemania se dice Immatrikulation\",\"Un examen\"],\"answer\":1,\"why\":\"Glosa del propio texto. Reconocer, no producir.\"}],\"itemIds\":[\"b2m4studienordnung\",\"b2m4abgabefrist\",\"b2m4antrag\",\"b2m4pruefungsamt\",\"b2m4wibetreuung\",\"b2m4anerkennung\",\"b2m4inskription\",\"b2m4sprechstunde\",\"b2m4modulhandbuch\",\"b2m4leistungspunkte\",\"b2m4vorlesungszeit\",\"b2m4kommilitonin\",\"b2m4erstsemester\",\"b2m4modulbeschreibung\",\"b2m4transcript\",\"b2m4werktag\"]},{\"id\":\"b2m4l6e2\",\"type\":\"transform\",\"prompt\":\"Deshaz el atributo de §4\",\"source\":\"eine nach diesem Tag eingereichte Arbeit\",\"instruction\":\"Relativa\",\"answers\":[\"eine Arbeit, die nach diesem Tag eingereicht wird\",\"eine Arbeit, die nach diesem Tag eingereicht wurde\"],\"itemIds\":[\"b2m4hausarbeit\"]},{\"id\":\"b2m4l6e3\",\"type\":\"cloze\",\"prompt\":\"El austriacismo\",\"text\":\"In Wien sagt man ___ , in Berlin Immatrikulation.\",\"answers\":[\"Inskription\"],\"itemIds\":[\"b2m4inskription\",\"b2m4immatrikulation\"]},{\"id\":\"b2m4l6e4\",\"type\":\"gapbank\",\"prompt\":\"Relativos del reglamento\",\"text\":\"Alles, ___ nach diesem Tag eingeht, wird nicht berücksichtigt. Der Studiengang, ___ Module anerkannt werden sollen, muss vergleichbar sein. Die Betreuung, auf ___ sich der Antrag stützt, muss befürworten.\",\"answers\":[\"was\",\"dessen\",\"die\"],\"bank\":[\"was\",\"dessen\",\"die\",\"das\",\"deren\",\"dem\",\"dass\"],\"itemIds\":[\"b2m4alleswas\",\"b2m4dessen\",\"b2m4antrag\",\"b2m4wibetreuung\"]},{\"id\":\"b2m4l6e5\",\"type\":\"mc\",\"prompt\":\"Leistungspunkte\",\"question\":\"„Die Leistungspunkte werden erst nach der Bewertung gutgeschrieben.“\",\"options\":[\"Los créditos se apuntan cuando el trabajo ya está calificado, no al entregarlo\",\"Los puntos del examen oral\",\"La nota de corte\"],\"answer\":0,\"whyWrong\":[null,\"Eso no son ECTS\",\"Eso es Numerus clausus\"],\"itemIds\":[\"b2m4leistungspunkte\"]},{\"id\":\"b2m4l6e6\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Alles, das in der Ordnung steht, gilt.\",\"answers\":[\"Alles, was in der Ordnung steht, gilt.\"],\"why\":\"Tras alles, etwas, nichts, das (pronombre) el relativo es was, no das.\",\"itemIds\":[\"b2m4alleswas\"]},{\"id\":\"b2m4l6e7\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"el trabajo entregado después de ese día; todo lo que llega tarde\",\"answers\":[\"die nach diesem Tag eingereichte Arbeit; alles, was zu spät eingeht\",\"eine nach diesem Tag eingereichte Arbeit; alles, was nach der Frist e
