n\",\"body\":\"Sobreviven porque el español no las distingue y porque son \u003cb\u003ecorrectas en comunicación\u003c/b\u003e: quien te oye *do a decision te entiende. El descriptor de B2 perdona eso \u003cb\u003ehasta que no\u003c/b\u003e: en una reseña y en un informe, la colocación imposible baja el criterio de vocabulario.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLista cerrada de hoy, para no abrir un pozo:\u003c/b\u003e\u003cbr/\u003e· make a decision / an effort / a cake · ❌ do\u003cbr/\u003e· do homework / the washing up / the shopping · ❌ make\u003cbr/\u003e· take a photo / a look (o have a look) · ❌ make a photo / make a look\u003cbr/\u003e· heavy rain / traffic · ❌ strong rain\u003cbr/\u003e· strong coffee / accent · ❌ heavy coffee\u003cbr/\u003e\u003cbr/\u003eHave a look y take a look valen las dos. Make a look, no.\u003cbr/\u003e\u003cbr/\u003eY dos funciones del temario que este campo pide: \u003cb\u003epreference for\u003c/b\u003e y \u003cb\u003esuggest an alternative\u003c/b\u003e (con razón). En una reseña, el pero sin alternativa es una queja; con alternativa, es B2.\",\"table\":[[\"Español\",\"Bloque\",\"Trampa\"],[\"tomar una decisión\",\"make a decision\",\"do / take a decision (take se oye; el examen espera make)\"],[\"hacer una foto\",\"take a photo\",\"make a photo\"],[\"hacer un esfuerzo\",\"make an effort\",\"do an effort\"],[\"hacer los deberes\",\"do homework\",\"make homework\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m7l5e1\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"Can I make a photo of the specials board?\",\"answers\":[\"Can I take a photo of the specials board?\",\"Can I have a look at the specials board?\"],\"why\":\"Hacer una foto es take a photo, nunca make. Make a photo es el calco literal, y se entiende, y baja nota.\",\"translation\":\"¿Puedo hacer una foto de la pizarra de las especialidades?\",\"itemIds\":[\"enb2m7takeaphoto\",\"enb2m7havealook\",\"enb2m7pointat\"]},{\"id\":\"enb2m7l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"You have to do an effort with the sourdough.\",\"answers\":[\"You have to make an effort with the sourdough.\"],\"why\":\"Esfuerzo se hace con make, no con do. Do an effort no existe. Es el gemelo de do a decision.\",\"translation\":\"Hay que hacer un esfuerzo con el pan de masa madre.\",\"itemIds\":[\"enb2m7makeaneffort\"]},{\"id\":\"enb2m7l5e3\",\"type\":\"bucket\",\"prompt\":\"¿Make, do, take o have?\",\"categories\":[\"MAKE / TAKE — decisión, esfuerzo, foto\",\"DO / HAVE — deberes, vistazo\"],\"items\":[{\"text\":\"___ a decision\",\"bucket\":0},{\"text\":\"___ an effort\",\"bucket\":0},{\"text\":\"___ a photo\",\"bucket\":0},{\"text\":\"___ homework\",\"bucket\":1},{\"text\":\"___ a look\",\"bucket\":1},{\"text\":\"___ the shopping\",\"bucket\":1}],\"itemIds\":[\"enb2m7makeadecision\",\"enb2m7makeaneffort\",\"enb2m7takeaphoto\",\"enb2m7dohomework\",\"enb2m7havealook\"],\"tip\":\"Have a look y take a look valen las dos; por eso look está en DO/HAVE. Take a photo no se cambia por have.\"},{\"id\":\"enb2m7l5e4\",\"type\":\"mc\",\"prompt\":\"El pero con alternativa\",\"question\":\"En una reseña, ¿cuál es B2?\",\"options\":[\"The special was bland; I would suggest an alternative: a seasonal soup.\",\"The special was bland.\",\"The special was very bad and I do not like it.\"],\"answer\":0,\"whyWrong\":[null,\"Es una queja. El temario pide suggesting with reason/alternative.\",\"Very bad es B1, y no propone nada.\"],\"itemIds\":[\"enb2m7suggestanalternative\",\"enb2m7bland\",\"enb2m7seasonal\"],\"tip\":\"El pero sin alternativa es A2. El pero con un plato en su lugar es el descriptor de B2.\"},{\"id\":\"enb2m7l5e5\",\"type\":\"gapbank\",\"prompt\":\"Completa los bloques\",\"text\":\"Have a ___ at the board, make a ___ about the soup, and don't ___ a photo of people eating. If you're dissatisfied ___ the portion, suggest an ___.\",\"answers\":[\"look\",\"decision\",\"take\",\"with\",\"alternative\"],\"bank\":[\"look\",\"decision\",\"take\",\"with\",\"alternative\",\"see\",\"do\",\"make\",\"of\",\"option\"],\"translation\":\"Echa un vistazo a la pizarra, toma una decisión sobre la sopa, y no hagas fotos de la gente comiendo. Si no te convence la ración, propone una alternativa.\",\"itemIds\":[\"enb2m7havealook\",\"enb2m7makeadecision\",\"enb2m7takeaphoto\",\"enb2m7dissatisfiedwith\",\"enb2m7suggestanalternative\"],\"tip\":\"Make está de distractor para el hueco de take a photo. Option es prima de alternative, no el bloque del temario.\"},{\"id\":\"enb2m7l5e6\",\"type\":\"paraphrase\",\"prompt\":\"Sin «like» ni «love»: di la preferencia con el bloque\",\"source\":\"I like sourdough more than sliced bread.\",\"forbid\":[\"like\",\"love\",\"prefer\"],\"answers\":[\"I have a preference for sourdough\",\"I'm keen on sourdough\",\"She has an interest in sourdough\"],\"translation\":\"Me gusta más el pan de masa madre que el de molde.\",\"hints\":[\"Preference for / keen on / have an interest in\",\"I have a preference ... sourdough\"],\"itemIds\":[\"enb2m7preferencefor\",\"enb2m7keenon\",\"enb2m7haveaninterestin\"],\"tip\":\"Like es A1. Preference for es el nombre que el handbook usa. En un Writing, el nombre puntúa más que el verbo chato.\"},{\"id\":\"enb2m7l5e7\",\"type\":\"type\",\"prompt\":\"Cierre de la clínica\",\"question\":\"tomar una decisión / hacer una foto / hacer un esfuerzo\",\"answers\":[\"make a decision, take a photo, make an effort\",\"make a decision / take a photo / make an effort\",\"make a decision, take a photo and make an effort\"],\"hints\":[\"Tres bloques, tres verbos distintos\",\"make a decision, take a photo, make an ...\"],\"itemIds\":[\"enb2m7makeadecision\",\"enb2m7takeaphoto\",\"enb2m7makeaneffort\",\"enb2m7collocation\"],\"tip\":\"Tres «hacer» en español, tres verbos en inglés. Esa es toda la clínica. No hay una regla por encima: hay la lista.\"},{\"id\":\"enb2m7l5e8\",\"type\":\"fastmatch\",\"prompt\":\"Fluidez sobre colocaciones del B1 — ya vistas\",\"pairs\":[{\"target\":\"I'm responsible for the till.\",\"source\":\"Soy responsable de la caja.\"},{\"target\":\"I spend too much on takeaways.\",\"source\":\"Me gasto demasiado en comida a domicilio.\"},{\"target\":\"food waste\",\"source\":\"la comida que acaba en la basura\"},{\"target\":\"Don't throw it away.\",\"source\":\"No lo tires.\"},{\"target\":\"It depends on the landlord.\",\"source\":\"Depende del casero.\"}],\"targetSeconds\":26,\"itemIds\":[\"enb1m2responsiblefor\",\"enb1m5spendon\",\"enb1m8foodwaste\",\"enb1m8throwaway\",\"enb1m1dependon\"],\"tip\":\"Cinco recciones y colocaciones que ya eran tuyas. Si estas no salen, las de hoy tampoco van a salir bajo reloj de examen.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-i
