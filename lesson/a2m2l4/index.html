 See\u003c/b\u003e = el lago (¡no «el mar» aunque suene a inglés sea!). (Y para liar más: \u003cb\u003edie See\u003c/b\u003e, femenino, también es el mar — Nordsee; pero a tu nivel: der See = lago.) Y dos plurales con Umlaut para cazar: der Ausflug → die Ausfl\u003cb\u003eü\u003c/b\u003ege, der Strand → die Str\u003cb\u003eä\u003c/b\u003ende.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m2l4e1\",\"type\":\"match\",\"prompt\":\"Empareja el destino con su traducción\",\"pairs\":[{\"target\":\"die Reise\",\"source\":\"el viaje\"},{\"target\":\"der Ausflug\",\"source\":\"la excursión\"},{\"target\":\"der Strand\",\"source\":\"la playa\"},{\"target\":\"das Meer\",\"source\":\"el mar\"}],\"itemIds\":[\"a2m2reise\",\"a2m2ausflug\",\"a2m2strand\",\"a2m2meer\"]},{\"id\":\"a2m2l4e2\",\"type\":\"mc\",\"prompt\":\"El par traicionero\",\"question\":\"„der See“ =\",\"options\":[\"el lago\",\"el mar\",\"la playa\"],\"answer\":0,\"whyWrong\":[null,\"El mar es das Meer — der See parece el «sea» inglés, pero es el lago\",\"La playa es der Strand\"],\"itemIds\":[\"a2m2see\",\"a2m2meer\",\"a2m2strand\"],\"tip\":\"das Meer = mar · der See = lago. Y sí, existe die See (femenino, el mar — Nordsee), pero a tu nivel quédate con: der See = lago.\"},{\"id\":\"a2m2l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa el recorrido (repaso A1)\",\"text\":\"Zuerst waren wir am ___, dann am Strand. (la estación)\",\"answers\":[\"Bahnhof\"],\"translation\":\"Primero estuvimos en la estación, luego en la playa.\",\"hints\":[\"Tu palabra A1 para la estación de tren\",\"Bahn + hof, con mayúscula\"],\"itemIds\":[\"bahnhof\",\"a2m2strand\",\"zuerst\"],\"tip\":\"waren + lugares: así se cuenta un recorrido. El léxico A1 del viaje sigue vivo — ahora en pasado.\"},{\"id\":\"a2m2l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa el plural (¡Umlaut!)\",\"text\":\"Wir haben viele ___ gemacht. (excursiones)\",\"answers\":[\"Ausflüge\"],\"translation\":\"Hicimos muchas excursiones.\",\"hints\":[\"Plural de Ausflug: la u toma Umlaut\",\"Aus-flü-ge, con ü\"],\"itemIds\":[\"a2m2ausflug\",\"gemacht\"],\"strictUmlaut\":true,\"tip\":\"Como Zug → Züge: der Ausflug → die Ausflüge. «Ausfluge» sin Umlaut cuenta como error.\"},{\"id\":\"a2m2l4e5\",\"type\":\"mc\",\"prompt\":\"¿haben o sein?\",\"question\":\"Wir ___ viel gereist.\",\"options\":[\"haben\",\"sind\"],\"answer\":1,\"whyWrong\":[\"reisen te mueve de un sitio a otro — movimiento → sein\",null],\"itemIds\":[\"a2m2gereist\"],\"tip\":\"reisen va con sein (te mueves), pero eine Reise machen va con haben (machen no se mueve). El verbo manda, no el tema.\"},{\"id\":\"a2m2l4e6\",\"type\":\"listen\",\"prompt\":\"Escucha y escribe lo que oyes\",\"text\":\"Die Reise war sehr schön\",\"translation\":\"El viaje fue muy bonito\",\"hints\":[\"Reise: la ei suena «ai», la s zumbada (como abeja)\",\"schön con ö\"],\"itemIds\":[\"a2m2reise\",\"schoen\"]},{\"id\":\"a2m2l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa la escena\",\"text\":\"Das ___ war kalt, aber der Strand war schön. (el mar)\",\"answers\":[\"Meer\"],\"translation\":\"El mar estaba frío, pero la playa era bonita.\",\"hints\":[\"El mar — con das, no confundir con el lago\",\"M-e-e-r, con mayúscula\"],\"itemIds\":[\"a2m2meer\",\"a2m2strand\",\"kalt\"]},{\"id\":\"a2m2l4e8\",\"type\":\"build\",\"prompt\":\"Construye la colocación\",\"target\":\"Wir haben einen Ausflug gemacht\",\"translation\":\"Hicimos una excursión\",\"distractors\":[\"sind\",\"gefahren\"],\"itemIds\":[\"a2m2ausflug\",\"gemacht\"],\"tip\":\"einen Ausflug machen = chunk completo. machen no se mueve → haben, aunque la excursión sí se mueva.\"},{\"id\":\"a2m2l4e9\",\"type\":\"build\",\"prompt\":\"Construye el resumen del viaje\",\"target\":\"Die Reise war schön, aber teuer\",\"translation\":\"El viaje fue bonito, pero caro\",\"distractors\":[\"hatte\",\"ist\"],\"itemIds\":[\"a2m2reise\",\"schoen\",\"teuer\"],\"tip\":\"war + dos adjetivos y un aber: la reseña de viaje más alemana que existe.\"},{\"id\":\"a2m2l4e10\
