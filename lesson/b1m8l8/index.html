ivo + dato\u003c/b\u003e — \u003ci\u003eam 3. März habe ich bei Ihnen … bestellt (Bestellnummer …).\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eProblema\u003c/b\u003e — \u003ci\u003eLeider ist die Ware beschädigt angekommen.\u003c/i\u003e\u003cbr/\u003e4. \u003cb\u003ePetición\u003c/b\u003e — \u003ci\u003eDeshalb bitte ich Sie um einen Umtausch\u003c/i\u003e / \u003ci\u003eBitte erstatten Sie mir den Betrag.\u003c/i\u003e\u003cbr/\u003e5. \u003cb\u003ePlazo + Gruß\u003c/b\u003e — \u003ci\u003eIch bitte Sie um eine Antwort bis zum 20. März.\u003c/i\u003e + \u003cb\u003eMit freundlichen Grüßen\u003c/b\u003e + tu nombre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos reglas que valen la nota entera\u003c/b\u003e:\u003cbr/\u003e• \u003cb\u003eAnrede y Gruß son obligatorios\u003c/b\u003e. Sin ellos, «Erfüllung» cae y la tarea puede valer 0.\u003cbr/\u003e• \u003cb\u003eNi un du\u003c/b\u003e. Ni «dein», ni «dir», ni «kannst». La fuga de registro es el fallo más caro y el más fácil de evitar: relee solo buscando esas cuatro palabras antes de entregar.\u003cbr/\u003e\u003cbr/\u003eY usa el módulo: \u003cb\u003eFutur I\u003c/b\u003e para el aviso serio (\u003ci\u003eAndernfalls werde ich den Vertrag kündigen\u003c/i\u003e), \u003cb\u003efalls\u003c/b\u003e para la alternativa (\u003ci\u003eFalls kein Ersatzgerät vorhanden ist …\u003c/i\u003e) y \u003cb\u003enominalización\u003c/b\u003e para el registro (\u003ci\u003edie Erstattung des Betrags\u003c/i\u003e)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l8\",\"phaseId\":\"b1m8\",\"title\":\"Schreiben: die Beschwerde-Mail\",\"subtitle\":\"El mail formal de la Aufgabe 3 — Anrede, Gruß y ni un «du» en 40 palabras\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El esqueleto del correo formal\",\"itemIds\":[\"b1m8gesehrgeehrte\",\"a2mitfreundlichengruessen\",\"b1m8gebittenum\",\"b1m8gehiermit\",\"b1m8geerstatten\",\"b1m8geumtausch\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La plantilla del mail formal: cinco líneas y ninguna improvisada\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m8l8e1\",\"type\":\"mc\",\"prompt\":\"La despedida formal\",\"question\":\"¿Cuál cierra un correo formal alemán?\",\"options\":[\"Mit freundlichen Grüßen\",\"Liebe Grüße\",\"Bis bald!\"],\"answer\":0,\"whyWrong\":[null,\"«Liebe Grüße» es para amigos y compañeros de confianza\",\"«Bis bald» es informal y además promete un reencuentro\"],\"itemIds\":[\"a2mitfreundlichengruessen\"],\"tip\":\"Mit freundlichen Grüßen NO lleva coma detrás. Es la única despedida que funciona con cualquier destinatario desconocido.\"},{\"id\":\"b1m8l8e2\",\"type\":\"bucket\",\"prompt\":\"¿Va en el mail formal o en el informal?\",\"categories\":[\"mail formal (Sie)\",\"mail informal (du)\"],\"items\":[{\"text\":\"Sehr geehrte Damen und Herren,\",\"bucket\":0},{\"text\":\"Hallo Anna,\",\"bucket\":1},{\"text\":\"Ich bitte Sie um eine schnelle Antwort.\",\"bucket\":0},{\"text\":\"Schreib mir mal, wenn du Zeit hast!\",\"bucket\":1},{\"text\":\"Mit freundlichen Grüßen\",\"bucket\":0},{\"text\":\"Liebe Grüße\",\"bucket\":1}],\"itemIds\":[\"b1m8gesehrgeehrte\",\"a2mitfreundlichengruessen\",\"b1m8gebittenum\"],\"tip\":\"En el examen escribes los dos correos el mismo día. Ten las seis fórmulas memorizadas por parejas: cada una tiene su gemela del otro registro.\"},{\"id\":\"b1m8l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa la apertura\",\"text\":\"Sehr geehrte Damen und Herren, ___ 3. März habe ich bei Ihnen eine Kaffeemaschine bestellt.\",\"answers\":[\"am\"],\"translation\":\"Estimados señores: el 3 de marzo pedí una cafetera en su tienda.\",\"hints\":[\"Fecha concreta: an + dem\",\"Dos letras\"],\"itemIds\":[\"b1m8gesehrgeehrte\",\"b1m8gebestellung\"],\"tip\":\"Tras la coma del Anrede, la frase sigue en MINÚSCULA. Es una convención alemana que los correctores miran.\"},{\"id\":\"b1m8l8e4\",\"type\":\"errorfix\",\"prompt\":\"Caza la fuga de registro\",\"wrong\":\"Sehr geehrte Damen und Herren, kannst du mir bitte den Betrag erstatten?\",\"answers\":[\"Sehr geehrte Damen und Herren, können Sie mir bitte den Betrag erstatten?\"],\"why\":\"Anrede formal + tuteo = registro mezclado. En «Erfüllung» eso es Textsorte fallado, y arrastra toda la tarea hacia la banda baja aunque no haya ni un error gramatical más.\",\"translation\":\"Estimados señores: ¿podrían reembolsarme el importe, por favor?\",\"itemIds\":[\"b1m8gesehrgeehrte\",\"b1m8geerstatten\",\"b1m8gebetrag\"]},{\"id\":\"b1m8l8e5\",\"type\":\"gapbank\",\"prompt\":\"Monta el correo entero\",\"text\":\"Sehr geehrte Damen und Herren, am 3. März habe ich bei Ihnen ein Gerät bestellt. ___ ist die Ware beschädigt angekommen. ___ bitte ich Sie um einen Umtausch. ___ kein Ersatzgerät vorhanden ist, erstatten Sie mir bitte den Betrag. Mit freundlichen ___\",\"answers\":[\"Leider\",\"Deshalb\",\"Falls\",\"Grüßen\"],\"bank\":[\"Leider\",\"Deshalb\",\"Falls\",\"Grüßen\",\"Obwohl\",\"Küssen\",\"Weil\"],\"translation\":\"Estimados señores: el 3 de marzo pedí un aparato en su tienda. Por desgracia la mercancía llegó dañada. Por eso les pido un cambio. En caso de que no haya aparato de repuesto, reembólsenme el importe. Atentamente.\",\"itemIds\":[\"b1m8geumtausch\",\"b1m6falls\",\"b1m8geerstatten\",\"a2mitfreundlichengruessen\"],\"tip\":\"Leider · Deshalb · Falls: tres conectores y el correo ya tiene estructura. Kohärenz se puntúa así de literalmente.\"},{\"id\":\"b1m8l8e6\",\"type\":\"transform\",\"prompt\":\"Sube el registro\",\"source\":\"Ich will das Gerät umtauschen.\",\"instruction\":\"Dilo en registro formal, con «bitten um»\",\"answers\":[\"Ich bitte Sie um einen Umtausch des Geräts.\",\"Ich bitte Sie um den Umtausch des Geräts.\"],\"translation\":\"Les pido el cambio del aparato.\",\"hints\":[\"bitten um + acusativo\",\"umtauschen → der Umtausch, y el complemento en genitivo\"],\"itemIds\":[\"b1m8gebittenum\",\"b1m8geumtausch\"],\"tip\":\"Nominalización + genitivo + rección. Tres cosas del módulo en una sola frase de reclamación.\"},{\"id\":\"b1m8l8e7\",\"type\":\"paraphrase\",\"prompt\":\"El aviso serio, sin amenazar\",\"source\":\"Wenn Sie nicht antworten, kündige ich den Vertrag.\",\"forbid\":[\"wenn\",\"kündige\"],\"answers\":[\"Andernfalls werde ich den Vertrag kündigen.\",\"Andernfalls werde ich den Vertrag kündigen\",\"Falls ich keine Antwort erhalte, werde ich den Vertrag kündigen.\",\"Falls ich keine Antwort erhalte, werde ich den Vertrag kündigen\",\"Falls Sie nicht antworten, werde ich den Vertrag kündigen\"],\"translation\":\"Si no responden, rescindiré el contrato.\",\"hints\":[\"«andernfalls» = en caso contrario\",\"Y el Futur I: werde ... kündigen\"],\"itemIds\":[\"b1m8gewerden\",\"b1m8gekuendigen\",\"b1m8gevertrag\"],\"tip\":\"El Futur I aquí no es futuro: es compromiso firme. Por eso el alemán comercial lo usa exactamente en esta frase.\"},{\"id\":\"b1m8l8e8\",\"type\":\"build\",\"prompt\":\"Construye la línea del plazo\",\"target\":\"Ich bitte Sie um eine Antwort bis zum 20. März\",\"translation\":\"Les ruego una respuesta antes del 20 de marzo\",\"distractors\":[\"für\",\"dich\"],\"itemIds\":[\"b1m8gebittenum\",\"b1m8gefrist\"],\"tip\":\"Poner una fecha concreta convierte una queja en una reclamación. Y en el examen cumple un punto de contenido sin gastar palabras.\"},{\"id\":\"b1m8l8e9\",\"type\":\"mc\",\"prompt\":\"La regla que cuesta 40 puntos\",\"question\":\"En la Aufgabe 1 piden 80 palabras y escribes 35, todas perfectas. ¿Qué pasa?\",\"options\":[\"«Erfüllung» se puntúa E y la tarea vale 0\",\"Se descuenta un poco por brevedad\",\"No pasa nada si no hay errores\"],\"answer\":0,\"whyWrong\":[null,\"No hay descuentos parciales: por debajo del 50 % de las palabras es E automática\",\"La corrección es por bandas y «Erfüllung = E» anula la tarea entera\"],\"itemIds\":[\"b1m8gebeschwerde\"],\"tip\":\"Menos del 50 % de las palabras pedidas o tema fallado: E automática. Un punto de contenido olvidado NO anula la tarea — baja la banda de «Erfüllung», que ya es bastante caro.\"},{\"id\":\"b1m8l8e10\",\"type\":\"type\",\"prompt\":\"Escribe la línea del problema\",\"question\":\"Por desgracia la mercancía llegó dañada\",\"answers\":[\"Leider ist die Ware beschädigt angekommen\",\"Leider ist die Ware beschädigt angekommen.\",\"Leider kam die Ware beschädigt an\"],\"hints\":[\"Leider en posición 1 → inversión: ist die Ware ...\",\"angekommen al final\"],\"itemIds\":[\"b1m8geware\",\"b1m8gelieferung\"],\"tip\":\"«Leider» abre casi toda reclamación alemana. Y al ir en posición 1 obliga a inversión: leider ist, no «leider die Ware ist».\"},{\"id\":\"b1m8l8e11\",\"type\":\"write\",\"prompt\":\"Cierre del bloque: la Aufgabe 3 de verdad. UNAS 40 PALABRAS en 15 minutos — los tres puntos, Anrede, Gruß y registro de usted de principio a fin. Escribir de más no suma: gasta el tiempo del Aufgabe 2.\",\"scenario\":\"Pediste una cafetera por internet el 3 de marzo (número de pedido 48-2291). El paquete llegó ayer, pero la máquina viene con el cristal roto. Escribe al servicio de atención al cliente.\",\"genre\":\"mail-formal\",\"register\":\"Sie\",\"frame\":[\"1. Anrede: Sehr geehrte Damen und Herren,\",\"2. Qué pediste y cuándo, con el número de pedido\",\"3. Cuál es el problema\",\"4. Qué quieres: el reembolso del importe, con un plazo\",\"5. Mit freundlichen Grüßen + tu nombre\"],\"bullets\":[\"Abre con la Anrede formal\",\"Di qué pediste y cuándo, con el número de pedido\",\"Nombra el problema de la mercancía\",\"Pide el reembolso del importe (o el cambio)\",\"Cierra con la Grußformel\"],\"checks\":[{\"re\":\"Sehr geehrte\",\"label\":\"Anrede formal\"},{\"re\":\"(Bestellnummer|bestellt)\",\"label\":\"el pedido y su número\"},{\"re\":\"(beschädigt|kaputt|gebrochen|fehlt|nicht angekommen)\",\"label\":\"el problema\"},{\"re\":\"(Umtausch|umtauschen|erstatten|Erstattung|Betrag|zurückschicken)\",\"label\":\"reembolso o cambio\"},{\"re\":\"(Mit freundlichen Grüßen|Freundliche Grüße)\",\"label\":\"Grußformel\"}],\"requireConnectors\":{\"min\":2,\"bank\":[\"leider\",\"deshalb\",\"außerdem\",\"daher\",\"allerdings\",\"falls\",\"andernfalls\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":32,\"maxWords\":55,\"model\":\"Sehr geehrte Damen und Herren,\\nam 3. März habe ich bei Ihnen eine Kaffeemaschine bestellt (Bestellnummer 48-2291). Leider ist das Glas gebrochen. Deshalb bitte ich Sie um eine Erstattung des Betrags bis zum 20. März.\\nMit freundlichen Grüßen\\nSofía Marín\",\"itemIds\":[\"b1m8gesehrgeehrte\",\"a2mitfreundlichengruessen\",\"b1m8gebittenum\",\"b1m8geerstatten\",\"b1m8gebetrag\"],\"tip\":\"Cuarenta palabras dan para cinco líneas: Anrede, dato, problema, petición, Gruß. Ni una descripción de más. Y antes de entregar, relee solo buscando du, dich, dir y dein: treinta segundos que salvan la banda de «Erfüllung».\"},{\"id\":\"b1m8l8e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 4 · debate de radio. Nadie se presenta antes de cada turno: quien modera pregunta, la asesora habla de su consulta y el del comercio, de sus clientes. DOS escuchas: la primera para las voces, la segunda para decidir. (Fragmento: en el examen son OCHO afirmaciones para tres voces.)\",\"audio\":\"Jetzt kaufen, später zahlen — bequem oder gefährlich? Darüber diskutieren heute eine Schuldnerberaterin und ein Vertreter des Handels. Frau Kollegin, fangen Sie an. | Gefährlich, ganz klar. Bei uns sitzen inzwischen Leute mit zwanzig kleinen Raten gleichzeitig. Jede einzelne ist harmlos, zusammen sind's sechshundert Euro im Monat, und keiner hat den Überblick. | Da widerspreche ich Ihnen. Der Verbraucher ist erwachsen. Wer sein Budget kennt, kommt damit gut zurecht — und für viele ist das die einzige Möglichkeit, überhaupt eine Waschmaschine zu bezahlen.\",\"question\":\"„Nicht die einzelne Rate ist das Problem, sondern die Summe.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Schuldnerberaterin\",\"Der Händlervertreter\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Él solo formula la pregunta del programa\",null,\"Él defiende justo lo contrario: que el consumidor sabe lo que hace\"],\"itemIds\":[\"b1m8gerate\",\"b1m8geschulden\"],\"tip\":\"Ninguna de las dos afirmaciones se puede casar por palabra clave: hay que resumir el turno entero. Y «Da widerspreche ich Ihnen» marca el cambio de bando y va con DATIVO: Ihnen, dir, mir. Oírlo te ordena el resto del debate.\"},{\"id\":\"b1m8l8e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo debate, segunda afirmación. Dos escuchas.\",\"audio\":\"Jetzt kaufen, später zahlen — bequem oder gefährlich? Darüber diskutieren heute eine Schuldnerberaterin und ein Vertreter des Handels. Frau Kollegin, fangen Sie an. | Gefährlich, ganz klar. Bei uns sitzen inzwischen Leute mit zwanzig kleinen Raten gleichzeitig. Jede einzelne ist harmlos, zusammen sind's sechshundert Euro im Monat, und keiner hat den Überblick. | Da widerspreche ich Ihnen. Der Verbraucher ist erwachsen. Wer sein Budget kennt, kommt damit gut zurecht — und für viele ist das die einzige Möglichkeit, überhaupt eine Waschmaschine zu bezahlen.\",\"question\":\"„Erwachsene Menschen können selbst entscheiden, was sie sich leisten.“ — Wer sagt das?\",\"options\":[\"Der Moderator\",\"Die Schuldnerberaterin\",\"Der Händlervertreter\"],\"answer\":2,\"plays\":2,\"whyWrong\":[\"Él no defiende ninguna postura\",\"Ella avisa justo de lo contrario\",null],\"itemIds\":[\"b1m8gebudget\",\"b1m8geverbraucher\"],\"tip\":\"Las dos posturas que acabas de separar son el molde de tu reclamación y de tu comentario: una habla de riesgos, la otra de responsabilidad. En el Schreiben te bastará con elegir bando y quedarte con dos argumentos.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>
