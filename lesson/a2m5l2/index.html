tiv\u003c/mark\u003e: Das Buch liegt \u003cmark class=\\\"dat\\\"\u003eauf dem Tisch\u003c/mark\u003e · Die Jacke hängt \u003cmark class=\\\"dat\\\"\u003eim Schrank\u003c/mark\u003e. \u003cb\u003e¿Wohin?\u003c/b\u003e (¿a dónde va? — flecha) → \u003cmark class=\\\"akk\\\"\u003eAkkusativ\u003c/mark\u003e: Ich [[lege|pongo]] das Buch \u003cmark class=\\\"akk\\\"\u003eauf den Tisch\u003c/mark\u003e · Ich gehe \u003cmark class=\\\"akk\\\"\u003ein die Küche\u003c/mark\u003e. El truco: en la foto quieta nada cambia de sitio → dem (der/das) y der (die); con la flecha algo viaja → den, die, das. Las contracciones que ya usas salen de aquí: in dem = \u003cb\u003eim\u003c/b\u003e, an dem = \u003cb\u003eam\u003c/b\u003e (foto) · in das = \u003cb\u003eins\u003c/b\u003e, an das = \u003cb\u003eans\u003c/b\u003e (flecha). Los verbos de PONER (legen, stellen...) llegan en la próxima lección — hoy entrena el ojo.\",\"table\":[[\"preposición\",\"significado\"],[\"in\",\"en, dentro de\"],[\"an\",\"en, pegado a (pared, ventana)\"],[\"auf\",\"sobre (tocando)\"],[\"über\",\"encima de (sin tocar)\"],[\"unter\",\"debajo de\"],[\"vor\",\"delante de\"],[\"hinter\",\"detrás de\"],[\"neben\",\"al lado de\"],[\"zwischen\",\"entre\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m5l2e1\",\"type\":\"mc\",\"prompt\":\"¿Wo o Wohin?\",\"question\":\"„Ich gehe in die Küche“\",\"options\":[\"Wohin — movimiento: voy A la cocina\",\"Wo — posición: estoy EN la cocina\"],\"answer\":0,\"whyWrong\":[null,\"«in die» es Akkusativ: la flecha. La foto quieta sería «Ich bin in der Küche»\"],\"itemIds\":[\"a2m5ichgeheindiekueche\",\"kueche\"],\"tip\":\"gehen es flecha pura: siempre pide Wohin + Akkusativ.\"},{\"id\":\"a2m5l2e2\",\"type\":\"fastmatch\",\"prompt\":\"Empareja rápido — el artículo lo cambia todo (chunks del A1, ahora con nombre)\",\"targetSeconds\":25,\"pairs\":[{\"target\":\"im Zimmer\",\"source\":\"en la habitación (estoy dentro)\"},{\"target\":\"ins Zimmer\",\"source\":\"a la habitación (voy hacia dentro)\"},{\"target\":\"an der Wand\",\"source\":\"en la pared (está colgado)\"},{\"target\":\"an die Wand\",\"source\":\"a la pared (lo cuelgo ahí)\"}],\"itemIds\":[\"imzimmer\",\"anderwand\",\"a2m5an\",\"zimmer\"],\"tip\":\"im/an der = foto (Dativ) · ins/an die = flecha (Akkusativ). Dos letras, dos mundos.\"},{\"id\":\"a2m5l2e3\",\"type\":\"cloze\",\"prompt\":\"Completa — la flecha\",\"text\":\"Ich gehe in ___ Küche. (voy A la cocina)\",\"answers\":[\"die\"],\"translation\":\"Voy a la cocina.\",\"hints\":[\"Movimiento → Akkusativ\",\"Küche es femenino: en acusativo no cambia\"],\"itemIds\":[\"a2m5ichgeheindiekueche\",\"kueche\"]},{\"id\":\"a2m5l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa — la foto quieta\",\"text\":\"Ich bin in ___ Küche. (estoy EN la cocina)\",\"answers\":[\"der\"],\"translation\":\"Estoy en la cocina.\",\"hints\":[\"Posición → Dativ\",\"die Küche en Dativ: die → d-e-r\"],\"itemIds\":[\"kueche\"],\"tip\":\"Mismo in, otra pregunta: sin movimiento el femenino cambia die → der. La foto pide Dativ.\"},{\"id\":\"a2m5l2e5\",\"type\":\"mc\",\"prompt\":\"Caza el error\",\"question\":\"«Me voy a la cama» →\",\"options\":[\"Ich gehe ins Bett\",\"Ich gehe im Bett\"],\"answer\":0,\"whyWrong\":[null,\"im = in dem (Dativ) — la foto quieta: «estoy en la cama». Para ir HACIA allí: ins = in das (Akkusativ)\"],\"itemIds\":[\"a2m5ichgeheinsbett\",\"bett\"],\"tip\":\"ins Bett gehen — con flecha. «Ich gehe im Bett» significaría que caminas DENTRO de la cama.\"},{\"id\":\"a2m5l2e6\",\"type\":\"bucket\",\"prompt\":\"El ejercicio estrella: ¿Wo o Wohin? Clasifica en ráfaga\",\"categories\":[\"Wo? (Dativ)\",\"Wohin? (Akkusativ)\"],\"items\":[{\"text\":\"Das Handy liegt auf dem Tisch.\",\"bucket\":0},{\"text\":\"Ich gehe in die Küche.\",\"bucket\":1},{\"text\":\"Die Lampe steht neben dem Bett.\",\"bucket\":0},{\"text\":\"Nico geht ins Bett.\",\"bucket\":1},{\"text\":\"Die Jacke hängt im Schrank.\",\"bucket\":0},{\"text\":\"Wir fahren in die Stadt.\",\"bucket\"
