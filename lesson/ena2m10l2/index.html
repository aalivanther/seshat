ue sí hay que aprender\u003c/b\u003e son dos familias y tres cabezotas:\u003cbr/\u003e· \u003cb\u003e-en sobre el infinitivo\u003c/b\u003e: see → saw → \u003cb\u003eseen\u003c/b\u003e, eat → ate → \u003cb\u003eeaten\u003c/b\u003e, give → gave → \u003cb\u003egiven\u003c/b\u003e, take → took → \u003cb\u003etaken\u003c/b\u003e.\u003cbr/\u003e· \u003cb\u003e-en sobre la vocal del pasado\u003c/b\u003e: write → wrote → \u003cb\u003ewritten\u003c/b\u003e, speak → spoke → \u003cb\u003espoken\u003c/b\u003e, break → broke → \u003cb\u003ebroken\u003c/b\u003e.\u003cbr/\u003e· y las tres que van por libre: \u003cb\u003edo → did → done\u003c/b\u003e, \u003cb\u003ego → went → gone\u003c/b\u003e, \u003cb\u003ebe → was/were → been\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl error que hay que matar hoy:\u003c/b\u003e meter la SEGUNDA columna detrás de have. \u003ci\u003eI have went\u003c/i\u003e, \u003ci\u003eshe has wrote\u003c/i\u003e, \u003ci\u003ewe have saw\u003c/i\u003e — los tres son el mismo fallo. Detrás de \u003cb\u003ehave\u003c/b\u003e va siempre la \u003cb\u003etercera\u003c/b\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l2\",\"phaseId\":\"ena2m10\",\"title\":\"The third column\",\"subtitle\":\"El participio: la columna que el pasado simple no te pidió\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las familias del participio\",\"itemIds\":[\"ena2m10thirdcolumn\",\"ena2m10seengroup\",\"ena2m10writtengroup\",\"ena2m10donegroup\",\"ena2m10boughtsame\",\"ena2m10hadmade\",\"ena2m10taken\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Buena noticia: la mitad de la columna te la sabes ya\",\"body\":\"$17\",\"table\":[[\"infinitivo\",\"pasado (módulo 2)\",\"participio (aquí)\"],[\"work\",\"worked\",\"worked\"],[\"buy\",\"bought\",\"bought\"],[\"say\",\"said\",\"said\"],[\"see\",\"saw\",\"seen\"],[\"take\",\"took\",\"taken\"],[\"write\",\"wrote\",\"written\"],[\"do\",\"did\",\"done\"],[\"go\",\"went\",\"gone\"],[\"be\",\"was / were\",\"been\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l2e1\",\"type\":\"match\",\"prompt\":\"Empareja el pasado con su participio — primera tanda\",\"pairs\":[{\"target\":\"saw\",\"source\":\"seen\"},{\"target\":\"wrote\",\"source\":\"written\"},{\"target\":\"went\",\"source\":\"gone\"},{\"target\":\"did\",\"source\":\"done\"}],\"itemIds\":[\"ena2m10seengroup\",\"ena2m10writtengroup\",\"ena2m10donegroup\"],\"tip\":\"Estos cuatro son los que más caen y los que más se fallan. Si sales de la lección con estos, sales con lo importante.\"},{\"id\":\"ena2m10l2e2\",\"type\":\"match\",\"prompt\":\"Segunda tanda — aquí hay trampa: dos no cambian\",\"pairs\":[{\"target\":\"ate\",\"source\":\"eaten\"},{\"target\":\"took\",\"source\":\"taken\"},{\"target\":\"bought\",\"source\":\"bought\"},{\"target\":\"made\",\"source\":\"made\"}],\"itemIds\":[\"ena2m10seengroup\",\"ena2m10taken\",\"ena2m10boughtsame\",\"ena2m10hadmade\"],\"tip\":\"bought y made emparejan consigo mismos, y no es un error del ejercicio: es la regla. Los de -ought y unos cuantos más repiten la segunda forma.\"},{\"id\":\"ena2m10l2e3\",\"type\":\"bucket\",\"prompt\":\"¿Segunda columna (pasado) o tercera (participio)?\",\"categories\":[\"pasado: va solo\",\"participio: va detrás de have\"],\"items\":[{\"text\":\"saw\",\"bucket\":0},{\"text\":\"seen\",\"bucket\":1},{\"text\":\"wrote\",\"bucket\":0},{\"text\":\"written\",\"bucket\":1},{\"text\":\"went\",\"bucket\":0},{\"text\":\"gone\",\"bucket\":1},{\"text\":\"did\",\"bucket\":0},{\"text\":\"done\",\"bucket\":1}],\"itemIds\":[\"ena2m10seengroup\",\"ena2m10writtengroup\",\"ena2m10donegroup\"],\"tip\":\"Truco para no dudar: las terceras formas SUENAN a acabadas — seen, written, gone, done. Y ninguna de ellas puede aparecer sin have delante.\"},{\"id\":\"ena2m10l2e4\",\"type\":\"mc\",\"prompt\":\"¿Cuál va detrás de have?\",\"question\":\"“I have ___ that film three times.”\",\"options\":[\"seen\",\"saw\",\"see\" fix\",\"prompt\":\"Corrige la columna equivocada\",\"wrong\":\"I have went to the doctor.\",\"answers\":[\"I have gone to the doctor.\",\"I've gone to the doctor.\"],\"why\":\"went es la SEGUNDA columna y va sola: «I went to the doctor yesterday». Detrás de have hace falta la tercera, que en go es gone. Es el fallo número uno de este módulo y no se arregla razonando: se arregla teniendo las tres columnas en la cabeza.\",\"translation\":\"He ido al médico.\",\"itemIds\":[\"ena2m10donegroup\",\"endoctor\"]},{\"id\":\"ena2m10l2e10\",\"type\":\"errorfix\",\"prompt\":\"Y el mismo fallo con otro verbo\",\"wrong\":\"She has wrote to me twice.\",\"answers\":[\"She has written to me twice.\",\"She's written to me twice.\"],\"why\":\"wrote es el pasado (She wrote to me last week). El participio de write es written, con dos tes y sin la -o- larga. Su familia entera funciona igual: spoke → spoken, broke → broken.\",\"translation\":\"Me ha escrito dos veces.\",\"itemIds\":[\"ena2m10writtengroup\",\"entwice\"]},{\"id\":\"ena2m10l2e11\",\"type\":\"listen\",\"prompt\":\"Dictado — dos participios seguidos\",\"text\":\"I've eaten and I've taken my keys.\",\"translation\":\"He comido y he cogido las llaves.\",\"hints\":[\"eat → ate → … y take → took → …\",\"I've ea…n and I've ta…n my keys.\"],\"itemIds\":[\"ena2m10seengroup\",\"ena2m10taken\",\"ena2m2mykeys\"]},{\"id\":\"ena2m10l2e12\",\"type\":\"fastmatch\",\"prompt\":\"Ráfaga de terceras columnas\",\"pairs\":[{\"target\":\"see\",\"source\":\"seen\"},{\"target\":\"write\",\"source\":\"written\"},{\"target\":\"go\",\"source\":\"gone\"},{\"target\":\"do\",\"source\":\"done\"},{\"target\":\"take\",\"source\":\"taken\"}],\"targetSeconds\":28,\"itemIds\":[\"ena2m10seengroup\",\"ena2m10writtengroup\",\"ena2m10donegroup\",\"ena2m10taken\"],\"tip\":\"El cronómetro aquí solo premia. Estas cinco tienen que salir sin pensar, porque en una conversación no hay tiempo de consultar una tabla.\"},{\"id\":\"ena2m10l2e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"He hecho los deberes y he escrito dos correos.\",\"answers\":[\"I've done my homework and I've written two emails.\",\"I have done my homework and I have written two emails.\",\"I've done my homework and written two emails.\",\"I've done the homework and I've written two emails.\"],\"hints\":[\"Dos terceras columnas: do → … y write → …\",\"I've d…e my homework and I've wr…n two emails.\"],\"itemIds\":[\"ena2m10donegroup\",\"ena2m10writtengroup\",\"enhomework\",\"enemail\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m10-2\",\"book\":\"I have finished.\",\"real\":\"I'm done.\",\"meaning\":\"Ya está / He terminado\",\"when\":\"Entre amigos y compañeros: acabas la comida, el turno o una tarea. Es cortísima y clarísima. Ojo, no es el participio de este módulo haciendo de perfecto: es done funcionando como adjetivo, «listo». En el examen escrito, I've finished.\",\"register\":\"amigos\",\"note\":\"Su gemela para preguntar es «Are you done?» — «¿has acabado?». Y en un restaurante, «Are you done with that?» significa «¿se lo retiro?».\",\"sound\":\"áim DAN\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Irregular verbs\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/irregular-verbs\",\"note\":\"Mira la tabla 10 minutos, pero solo la TERCERA columna, tapando las otras dos. Y por familias, nunca por orden alfabético.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\"
