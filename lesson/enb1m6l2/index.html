e to pay\u003c/b\u003e = no hace falta pagar (puedes, si te apetece, pero nadie te obliga).\u003cbr/\u003e\u003cbr/\u003eEn español las dos caben en «no tienes que pagar», y por eso el hispanohablante escribe \u003ci\u003eYou mustn't pay for the appointment\u003c/i\u003e queriendo decir que es gratis — y dice algo bastante raro. \u003cb\u003eEs el error de modal más caro del nivel\u003c/b\u003e, porque cambia el significado entero de la frase, no solo la forma.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY un tercero, que suena más británico que los dos:\u003c/b\u003e \u003ci\u003eneedn't\u003c/i\u003e. \u003ci\u003eYou needn't bring your passport\u003c/i\u003e = \u003ci\u003eyou don't need to bring it\u003c/i\u003e. Es formal y educado, va sin \u003ci\u003eto\u003c/i\u003e detrás y se oye muchísimo en avisos y en consultas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eCómo funciona esto de verdad en el Reino Unido\u003c/b\u003e, que es la mitad de la lección:\u003cbr/\u003e1. Lo primero de todo es \u003cb\u003eregister with a GP\u003c/b\u003e — darse de alta con un médico de cabecera, que es la puerta de entrada a todo lo demás.\u003cbr/\u003e2. El \u003cb\u003eGP\u003c/b\u003e no es «el médico general» de la traducción literal: es \u003ci\u003etu\u003c/i\u003e médico, el que te lleva y el que decide si te manda al especialista con un \u003cb\u003ereferral\u003c/b\u003e.\u003cbr/\u003e3. Quien coge el teléfono es \u003cb\u003ethe receptionist\u003c/b\u003e, y no es una secretaria: decide qué es urgente y qué no. Hablarle bien es una técnica, no una cortesía.\u003cbr/\u003e4. Si no tienes cita y no es grave, existe el \u003cb\u003ewalk-in centre\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eY el falso amigo que hay que aprender hoy: \u003cb\u003e\u003ci\u003esurgery\u003c/i\u003e es el consultorio\u003c/b\u003e, el sitio. La operación es \u003ci\u003ean operation\u003c/i\u003e. «I'm going to the surgery» es «voy al médico», no «voy a que me operen»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m6l2\",\"phaseId\":\"enb1m6\",\"title\":\"Registering with a GP\",\"subtitle\":\"Cómo se entra en el sistema — y por qué «mustn't» y «don't have to» no son lo mismo\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El vocabulario que abre la puerta\",\"itemIds\":[\"enb1m6gp\",\"ena2m8thesurgery\",\"enb1m6registerwith\",\"enb1m6bookanappointment\",\"enb1m6donthaveto\",\"enb1m6neednt\",\"enb1m6walkincentre\",\"enb1m6receptionist\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: prohibido no es lo mismo que innecesario\",\"body\":\"$17\",\"table\":[[\"Lo que quieres decir\",\"Se dice\",\"Lo que NO se dice\"],[\"Está prohibido\",\"You mustn't smoke here.\",\"—\"],[\"No hace falta\",\"You don't have to pay.\",\"You mustn't pay.\"],[\"No hace falta (más formal)\",\"You needn't come in person.\",\"You needn't to come.\"],[\"Es obligatorio\",\"You have to register first.\",\"You must to register first.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m6l2e1\",\"type\":\"match\",\"prompt\":\"Empareja las cuatro piezas del sistema\",\"pairs\":[{\"target\":\"a GP\",\"source\":\"un médico de cabecera\"},{\"target\":\"the surgery\",\"source\":\"el consultorio, el centro de salud\"},{\"target\":\"the receptionist\",\"source\":\"la persona del mostrador\"},{\"target\":\"a walk-in centre\",\"source\":\"un centro que atiende sin cita\"}],\"itemIds\":[\"enb1m6gp\",\"ena2m8thesurgery\",\"enb1m6receptionist\",\"enb1m6walkincentre\"],\"tip\":\"«GP» se dice siempre por las siglas, letra a letra: dchii-PÍI. Nadie dice «General Practitioner» en voz alta salvo en un formulario.\"},{\"id\":\"enb1m6l2e2\",\"type\":\"mc\",\"prompt\":\"El falso amigo del módulo\",\"question\":\"«I'm at the surgery» significa…\",\"options\":[\"Estoy en el consultorio del médico\",\"Estoy en el quirófano\",\"Me están operando\"],\"answer\":0,\"whyWrong\":[null,\"El quirófano es «the operating theatre» — otro falso amigo de propina: «theatre» ahí no es un teatro.\",\"Eso sería «I'm having an operation».\"],\"itemIds\":[\"ena2m8thesurgery\"],\"tip\":\"«Surgery» tiene las dos acepciones en el diccionario, pero en la vida diaria británica el 95 % de las veces es el sitio: el consultorio del GP. Y «the doctor's» vale igual: «I'm at the doctor's».\"},{\"id\":\"enb1m6l2e3\",\"type\":\"bucket\",\"prompt\":\"¿Está prohibido o simplemente no hace falta?\",\"categories\":[\"Prohibido (mustn't)\",\"No hace falta (don't have to / needn't)\"],\"items\":[{\"text\":\"You mustn't take more than eight tablets a day.\",\"bucket\":0},{\"text\":\"You don't have to pay for the appointment.\",\"bucket\":1},{\"text\":\"You needn't bring your passport.\",\"bucket\":1},{\"text\":\"You mustn't smoke in the waiting room.\",\"bucket\":0},{\"text\":\"You don't have to come in person.\",\"bucket\":1},{\"text\":\"You mustn't give your tablets to anyone else.\",\"bucket\":0}],\"itemIds\":[\"enb1m6donthaveto\",\"enb1m6neednt\",\"ena2m7youmustntsmoke\"],\"tip\":\"Truco para no equivocarte nunca: si detrás cabe «…or you'll be in trouble», es «mustn't». Si detrás cabe «…but you can if you want», es «don't have to».\"},{\"id\":\"enb1m6l2e4\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante quiso decir que la cita es gratis. Arréglalo.\",\"wrong\":\"You mustn't pay for a GP appointment.\",\"answers\":[\"You don't have to pay for a GP appointment.\"],\"why\":\"«mustn't» prohíbe: eso dice que está PROHIBIDO pagar. Para decir que no es obligatorio —que es gratis— va «don't have to». En español las dos son «no tienes que pagar», y ahí nace el error.\",\"translation\":\"No hace falta pagar por la cita con el médico de cabecera.\",\"itemIds\":[\"enb1m6donthaveto\"]},{\"id\":\"enb1m6l2e5\",\"type\":\"errorfix\",\"prompt\":\"Otra vez: cambia UNA palabra\",\"wrong\":\"You must to register with a GP.\",\"answers\":[\"You have to register with a GP.\"],\"why\":\"Los modales van con infinitivo SIN «to»: «you must register». Si te sale el «to», la solución rápida es cambiar el modal por «have to», que sí lo lleva — y de paso suena más natural en un consejo práctico.\",\"translation\":\"Hay que darse de alta con un médico de cabecera.\",\"itemIds\":[\"enb1m6registerwith\"]},{\"id\":\"enb1m6l2e6\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición que pide el verbo\",\"text\":\"The first thing you do is register ___ a GP.\",\"answers\":[\"with\"],\"translation\":\"Lo primero que se hace es darse de alta con un médico de cabecera.\",\"hints\":[\"No es «in» ni «at»: es la de «con»\",\"Cuatro letras\"],\"itemIds\":[\"enb1m6registerwith\"],\"tip\":\"«register WITH a GP» (con una persona) pero «register AT a surgery» (en un sitio). La preposición no se traduce: se aprende pegada al verbo, como una sola palabra.\"},{\"id\":\"enb1m6l2e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el folleto de bienvenida del centro de salud\",\"text\":\"To see a doctor here you first ___ to register with a GP. It takes ten minutes and you ___ need to pay anything. You ___ smoke anywhere in the building — there's a sign on every door.\",\"answers\":[\"have\",\"don't\",\"mustn't\"],\"bank\":[\"have\",\"don't\",\"mustn't\",\"needn't\",\"must\",\"should\",\"may\"],\"translation\":\"Para que le vea un médico, primero hay que darse de alta con un GP. Se tarda diez minutos y no hay que pagar nada. Está prohibido fumar en todo el edificio: hay un cartel en cada puerta.\",\"itemIds\":[\"enb1m6registerwith\",\"enb1m6donthaveto\",\"ena2m7youmustntsmoke\"],\"tip\":\"Fíjate en el tercer hueco: el cartel en cada puerta es la pista. Cuando un texto se molesta en decir que hay carteles, está hablando de una prohibición, no de una recomendación.\"},{\"id\":\"enb1m6l2e8\",\"type\":\"transform\",\"prompt\":\"Sube el registro sin cambiar el significado\",\"source\":\"You don't need to come in person.\",\"instruction\":\"Dilo con «needn't»\",\"answers\":[\"You needn't come in person\",\"You needn't come in person.\"],\"translation\":\"No hace falta que venga en persona.\",\"hints\":[\"«needn't» va sin «to» detrás\",\"You needn't ... in person\"],\"itemIds\":[\"enb1m6neednt\"],\"tip\":\"«need» tiene dos vidas: como verbo normal («you don't need TO come») y como modal («you needn't come»). La segunda es más formal y es la que verás escrita en cartas oficiales británicas.\"},{\"id\":\"enb1m6l2e9\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Tengo que pedir cita.\",\"answers\":[\"I need to book an appointment\",\"I have to book an appointment\",\"I need to make an appointment\",\"I have to make an appointment\"],\"hint\":\"El verbo de «pedir cita» en inglés es el de reservar\",\"itemIds\":[\"enb1m6bookanappointment\"],\"tip\":\"«Book» o «make», las dos valen. Lo que no vale es «ask an appointment»: la cita se reserva, no se pide.\"},{\"id\":\"enb1m6l2e10\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"Y al revés: ¿qué te están diciendo exactamente?\",\"source\":\"You needn't bring any identification.\",\"answers\":[\"No hace falta que traiga ninguna identificación\",\"No necesita traer identificación\",\"No hace falta traer identificación\"],\"itemIds\":[\"enb1m6neednt\"],\"tip\":\"Cuidado con traducirlo como «no debe traer identificación»: eso en español suena a prohibición, y aquí no hay ninguna. «No hace falta» es la traducción exacta.\"},{\"id\":\"enb1m6l2e11\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"You don't have to pay for a GP appointment.\",\"translation\":\"No hace falta pagar por la cita con el médico de cabecera.\",\"strictContractions\":true,\"hints\":[\"Empieza por «You don't…»\",\"You don't have to pay for a ...\"],\"itemIds\":[\"enb1m6donthaveto\",\"ena2m7haftahasta\"],\"tip\":\"«have to» suena «hafta», una sola pieza. Si esperas oír «hav-tu» separado, te vas a perder justo el trozo que decide el significado de la frase.\"},{\"id\":\"enb1m6l2e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"No hace falta que vengas en persona, pero tienes que darte de alta con un médico de cabecera.\",\"answers\":[\"You don't have to come in person, but you have to register with a GP\",\"You needn't come in person, but you have to register with a GP\",\"You don't need to come in person, but you have to register with a GP\",\"You needn't come in person, but you have to register with a GP.\"],\"hints\":[\"Primera mitad: no es obligatorio\",\"Segunda mitad: sí lo es\"],\"itemIds\":[\"enb1m6neednt\",\"enb1m6registerwith\"],\"tip\":\"Las dos mitades de la misma frase, una con obligación y otra sin ella. Poder decir eso sin dudar es exactamente lo que separa un A2 de un B1 en el criterio de gramática.\"},{\"id\":\"enb1m6l2e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: la llamada al mostrador. Dos escuchas.\",\"audio\":\"Good morning, Palmer Road Medical Centre.|Hello — I'd like to register, please. I've just moved into the area.|Of course. Have you got proof of address with you?|I've got a letter from my landlady. Is that all right, or do I need a passport?|A letter's fine. You don't have to bring a passport — a lot of people haven't got one. And you needn't come in this morning, we're open till six.|Lovely. And is there a charge for registering?|None at all. Registering's free, and so is seeing the GP.\",\"question\":\"¿Qué le dicen que traiga?\",\"options\":[\"Un justificante de domicilio, y con la carta le vale\",\"El pasaporte, sin falta\",\"Nada: puede registrarse por teléfono ahora mismo\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo lo contrario: «You don't have to bring a passport».\",\"Le dicen que puede ir por la tarde, no que no haga falta ir.\"],\"itemIds\":[\"enb1m6registerwith\",\"enb1m6donthaveto\",\"enb1m6neednt\"],\"tip\":\"Cuenta los modales de esta llamada: «don't have to», «needn't». Ninguno prohíbe nada, y sin embargo el hispanohablante que oye mal uno de los dos sale de la llamada creyendo que no puede registrarse. Ahí es donde se paga la confusión.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
