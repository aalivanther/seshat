link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T419,A partir de ahora, cada módulo te pone \u003cb\u003edos lecturas del mismo asunto\u003c/b\u003e: una que informa y una que convence. Es el descriptor de nivel convertido en lección, y es lo que el Reading Part 3 del B2 llama \u003ci\u003ewriters' stance and attitude\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eHoy el asunto es el [[bilingualism|bilingüismo]] en Londres: lenguas de herencia, lenguas minoritarias, la palabra escrita. El primer texto es un informe de una organización educativa. El segundo es una columna de opinión. \u003cb\u003eLos dos usan datos. Solo uno está intentando que cambies de idea.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eReglas, las de siempre y una nueva:\u003cbr/\u003e1. Lee el título y adivina la postura \u003cb\u003eantes\u003c/b\u003e de entrar.\u003cbr/\u003e2. Las palabras difíciles están glosadas; en el examen no, y la estrategia es la misma: no pares.\u003cbr/\u003e3. Al menos dos preguntas de cada texto son de inferencia: la respuesta no está escrita con esas palabras.\u003cbr/\u003e4. \u003cb\u003eNueva:\u003c/b\u003e cuando termines el segundo, pregúntate qué haría cada autor con el párrafo del otro. Si no sabes, no has leído la postura, has leído el tema.18:T103e,"])</script><script>self.__next_f.push([1,"Last year a primary school in east London counted the languages spoken at home by its pupils. The list ran to forty-three. Turkish, Yoruba, Polish, Bengali, Spanish, Portuguese and Arabic all had more than a dozen families. English was the language of the classroom, of the playground at lunch, and of the letters that went home in book bags. Everything else lived in kitchens, on buses, and in the WhatsApp groups that grandparents still refuse to leave.\u003cbr/\u003e\u003cbr/\u003eThat split is now the ordinary British childhood, and it is the fact that this briefing sets out to describe. It is not an argument for or against [[bilingualism|bilingüismo]]. It is a description of what the numbers actually show, and of what teachers say they can and cannot do with them.\u003cbr/\u003e\u003cbr/\u003eThe first number is the one that surprises people from outside the city. In inner London, more than half of children in state primary schools speak a language other than English at home. The figure has been stable for a decade. It is not a wave. It is the water. Outer boroughs sit lower, closer to a third, but the direction of travel is the same. The children are not, on the whole, new arrivals. Many were born here. Their parents were born here. What they have is a [[heritage language|lengua de herencia]]: a language that belongs to the family rather than to the street.\u003cbr/\u003e\u003cbr/\u003eThe second number is less comfortable. By the age of eleven, a large share of those children can understand their family language far better than they can speak it, and they can speak it far better than they can write it. Teachers call this a [[fluency gap|brecha de fluidez]]. It is not laziness and it is not a lack of love for the language. It is what happens when a child spends six hours a day reading and writing in English and twenty minutes at the table answering a grandmother in Spanish. The [[written word|palabra escrita]], in the heritage language, simply does not turn up enough times to stick.\u003cbr/\u003e\u003cbr/\u003eSchools have tried three kinds of response, and the briefing is careful not to rank them. Some run after-school classes in the community language, taught by a parent or a local volunteer. Some send letters home in two languages, at least for the first year. A smaller number have begun to treat the home language as a resource in the classroom itself: a child who can explain a science idea in Turkish is asked to do so, and then to find the English for it. None of these programmes is cheap, and none of them reaches every family. The schools that do most tend to be the ones that already have a bilingual adult on the staff.\u003cbr/\u003e\u003cbr/\u003eWhat the research does show, and here the briefing is firmer, is a pattern that holds across languages. Children who keep a strong home language do not fall behind in English. They do not fall behind in mathematics. In several London studies they pull slightly ahead in the tasks that ask them to hold two ideas at once. The advantage is small. It is not magic. It is also not the disaster that some newspaper columns keep announcing.\u003cbr/\u003e\u003cbr/\u003eThe last point is practical. A child who arrives in Year 5 with very little English needs a different kind of help from a child who has spoken English at school since she was four and Spanish at home since she was born. Lumping both under \"English as an additional language\" hides the difference, and it is the second child — the bilingual child who is not a beginner — whose needs the system still finds hardest to name.\u003cbr/\u003e\u003cbr/\u003eA note on terms, because they get mixed. A [[heritage language|lengua de herencia]] is the language of a family inside a city that runs in another language. A [[minority language|lengua minoritaria]] is a language with an official or historic claim on a place — Welsh in Wales, Gaelic in the islands, Irish in parts of the north. [[Preserving a minority language|Preservar una lengua minoritaria]] is a public task, with schools and signage and a budget. Keeping a heritage language alive is a private one, done at a kitchen table. The briefing will not pretend those two jobs are the same. The briefing ends there, on purpose. The policy argument belongs somewhere else."])</script><script>self.__next_f.push([1,"19:Te9e,"])</script><script>self.__next_f.push([1,"I am going to say something that will get me uninvited from three dinner tables, and I am going to say it anyway. If you raise a child in London and you want that child to be free, you should speak English at home.\u003cbr/\u003e\u003cbr/\u003eI do not say this because I dislike other languages. I grew up with two. I say it because I have watched, for twenty years in the same borough, what happens when a family treats English as a school subject and keeps the \"real\" language for the kitchen. The child becomes a translator at eight, a reluctant interpreter at twelve, and a person who cannot write a formal paragraph in either language at sixteen. That is not richness. That is a split that nobody asked the child to carry.\u003cbr/\u003e\u003cbr/\u003eThe charities will tell you that [[bilingualism|bilingüismo]] is a gift. The word is doing a lot of work. A gift is something you can put down. A child cannot put down the fact that her science homework is in a language her mother does not read, or that her grandmother's stories have no written form she has been taught to keep. The [[written word|palabra escrita]] is not a luxury. It is how a person later applies for a job, disputes a bill, and tells a doctor what is wrong. If that skill only exists in one of the two languages, then one of the two is a hobby.\u003cbr/\u003e\u003cbr/\u003ePeople who disagree with me usually reach for the same studies. They say bilingual children do not fall behind. Fine. Not falling behind is a low bar. I want to know who writes the best paragraph in the room at fourteen, who can sit an exam without translating in their head, who does not freeze when a stranger on the bus asks a question at full speed. Those are not racist tests. They are the tests the city already sets, every day, and it sets them in English.\u003cbr/\u003e\u003cbr/\u003eThere is also a quieter cost. A language that lives only in the mouth of the family becomes a private code. That can feel like love. It can also become a wall. I have sat in parents' evenings where a fifteen-year-old had to explain her own report to her father, sentence by sentence, and I have seen the look on both of their faces. Nobody in that room was free.\u003cbr/\u003e\u003cbr/\u003eThe practical proposal is not cruelty. Speak the home language, by all means, in songs, in jokes, in the first years. Then, as soon as school starts in earnest, let English be the language of homework, of arguments about the news, of the long conversation at dinner. Keep the other language alive as a language, not as a duty. Visit. Phone. Watch a film. Do not ask a child to be a bridge when she has not yet been allowed to be a person.\u003cbr/\u003e\u003cbr/\u003eI know the counter-argument. Language is identity. Losing one is a death. I have some patience for that when the language is genuinely a [[minority language|lengua minoritaria]] under threat, and I have none at all when the child in front of me cannot explain a simple timetable in the language of the country she lives in. Identity that cannot fill in a form is not identity. It is a story adults tell to feel better about a choice they have already made.\u003cbr/\u003e\u003cbr/\u003eIf that sounds harsh, it is because the city is harsh. London will not pause so that a family can finish a sentence in another language. The bus will not. The job interview will not. The exam paper will not. I have no brief against [[preserving a minority language|preservar una lengua minoritaria]] where the language still has a street, a school and a sign. Welsh on a station wall in Cardiff is not the same as Spanish at a kitchen table in Hackney, and pretending they are the same is how a column becomes a sermon. The kindest thing a parent can do, in this particular city, is to give a child one language that will stand up in all of those rooms — and to stop calling that a loss."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m1l6\",\"phaseId\":\"enb2m1\",\"title\":\"Two languages, two writers\",\"subtitle\":\"Dos lecturas del mismo asunto, y la postura de quien escribe\",\"minutes\":22,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras de los dos textos\",\"itemIds\":[\"enb2m1bilingualism\",\"enb2m1minoritylanguage\",\"enb2m1heritagelanguage\",\"enb2m1thewrittenword\",\"enb2m1preservealanguage\",\"enb2m1fluencygap\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Cómo se leen dos textos que no se ponen de acuerdo\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m1l6e1\",\"type\":\"read\",\"prompt\":\"Lee el informe. Toca las palabras subrayadas si te bloquean. Luego responde: al menos dos preguntas no se contestan buscando.\",\"title\":\"Two languages at the kitchen table\",\"source\":\"From a briefing by a London education charity (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m1l6e1q1\",\"q\":\"What is the briefing mainly trying to do?\",\"options\":[\"Describe what the numbers show, without arguing for a policy.\",\"Convince parents to speak only English at home.\",\"Rank the three kinds of school response from best to worst.\"],\"answer\":0,\"inference\":true,\"why\":\"Lo dice dos veces: «It is not an argument» y «The briefing ends there, on purpose.» Quien elige la B o la C ha leído el tema, no la postura.\"},{\"id\":\"enb2m1l6e1q2\",\"q\":\"What does the text mean by a heritage language?\",\"options\":[\"A language that belongs to the family rather than to the street.\",\"A language that is dying out in the country it comes from.\",\"Any language other than English taught as a school subject.\"],\"answer\":0,\"why\":\"«a language that belongs to the family rather than to the street». No es una lengua en peligro ni una asignatura.\"},{\"id\":\"enb2m1l6e1q3\",\"q\":\"Why does a fluency gap appear by the age of eleven?\",\"options\":[\"Because the written word in the home language does not turn up enough times.\",\"Because parents stop loving the home language.\",\"Because inner London has too many new arrivals.\"],\"answer\":0,\"why\":\"Seis horas de inglés escrito contra veinte minutos de español hablado. El texto lo nombra: the written word does not stick.\"},{\"id\":\"enb2m1l6e1q4\",\"q\":\"What does the research show about children who keep a strong home language?\",\"options\":[\"They do not fall behind in English or mathematics.\",\"They always write better paragraphs than monolingual children.\",\"They need to be taught English from scratch in Year 5.\"],\"answer\":0,\"why\":\"«do not fall behind… The advantage is small. It is not magic.» La C describe a otro niño, el que llega en Year 5.\"},{\"id\":\"enb2m1l6e1q5\",\"q\":\"Why does the briefing refuse to end with a policy recommendation?\",\"options\":[\"Because its job, as it presents itself, is to describe, not to convince.\",\"Because the writers could not agree on which programme is cheapest.\",\"Because the government has forbidden charities from giving advice.\"],\"answer\":0,\"inference\":true,\"why\":\"«The policy argument belongs somewhere else» solo tiene sentido si este texto se ha definido como informe, no como columna. Eso es postura, y no está en una sola frase de dato.\"}],\"itemIds\":[\"enb2m1bilingualism\",\"enb2m1heritagelanguage\",\"enb2m1fluencygap\",\"enb2m1thewrittenword\"],\"tip\":\"La pregunta 1 y la 5 son de postura. Si las fallaste, no te faltaba vocabulario: te faltaba preguntarte para qué está escrito el texto, no de qué trata.\"},{\"id\":\"enb2m1l6e2\",\"type\":\"read\",\"prompt\":\"Ahora la columna. Misma ciudad, mismo asunto, otra intención. Lee y mira desde dónde habla.\",\"title\":\"The kindness of one language\",\"source\":\"Opinion column in a London weekly (adapted)\",\"text\":\"$19\",\"questions\":[{\"id\":\"enb2m1l6e2q1\",\"q\":\"What is the writer asking parents in London to do?\",\"options\":[\"Make English the language of homework and of the long conversations at home.\",\"Stop speaking any other language, even in songs and jokes.\",\"Move out of London so that the child can keep a heritage language.\"],\"answer\":0,\"why\":\"El párrafo de la propuesta es explícito: canciones y chistes sí; deberes y conversación larga, en inglés. La B es una caricatura de la postura.\"},{\"id\":\"enb2m1l6e2q2\",\"q\":\"Why does the writer reject the word «gift» for bilingualism?\",\"options\":[\"Because a gift is something you can put down, and a child cannot put this down.\",\"Because charities use the word only when they want money.\",\"Because bilingualism has no benefits at all, in the writer's view.\"],\"answer\":0,\"inference\":true,\"why\":\"«The word is doing a lot of work. A gift is something you can put down.» No niega que haya dos lenguas: niega que eso se pueda tratar como un adorno.\"},{\"id\":\"enb2m1l6e2q3\",\"q\":\"What does the writer consider a low bar?\",\"options\":[\"Not falling behind in English.\",\"Writing the best paragraph in the room at fourteen.\",\"Explaining a timetable to a stranger on the bus.\"],\"answer\":0,\"why\":\"«Not falling behind is a low bar.» Las otras dos son, para esta autora, el listón de verdad.\"},{\"id\":\"enb2m1l6e2q4\",\"q\":\"When does the writer have patience for the identity argument?\",\"options\":[\"When the language is a minority language genuinely under threat.\",\"Whenever a family feels that language is identity.\",\"Never: the writer calls all identity arguments a story adults tell.\"],\"answer\":0,\"why\":\"«I have some patience for that when the language is genuinely a minority language under threat, and I have none at all when…» La C se pasa de frenada: la autora distingue.\"},{\"id\":\"enb2m1l6e2q5\",\"q\":\"Why does the writer call English-at-home «the kindest thing»?\",\"options\":[\"Because the city will not pause for a family to finish a sentence in another language.\",\"Because English is morally better than other languages.\",\"Because teachers have asked her to write the column.\"],\"answer\":0,\"inference\":true,\"why\":\"El último párrafo no dice que el inglés sea superior: dice que Londres no espera. «Kindest» es pragmático, no moral, y hay que inferirlo contra la caricatura de la B.\"}],\"itemIds\":[\"enb2m1bilingualism\",\"enb2m1thewrittenword\",\"enb2m1minoritylanguage\",\"enb2m1preservealanguage\"],\"tip\":\"Este texto usa datos del primero («do not fall behind») para discutirlos. Eso es stance: no niega el dato, niega lo que el dato basta para probar.\"},{\"id\":\"enb2m1l6e3\",\"type\":\"mc\",\"prompt\":\"Las dos posturas, en una pregunta\",\"question\":\"¿En qué se distinguen de verdad los dos textos?\",\"options\":[\"El primero describe y se niega a recomendar; el segundo recomienda y usa los datos como listón bajo.\",\"El primero está a favor del bilingüismo y el segundo no ha leído ningún estudio.\",\"El primero habla de Londres y el segundo de otra ciudad.\"],\"answer\":0,\"whyWrong\":[null,\"El segundo SÍ ha leído los estudios: los cita y les baja el listón. Eso no es ignorancia, es discusión.\",\"Los dos están en el mismo borough, a veces en la misma escuela.\"],\"itemIds\":[\"enb2m1bilingualism\"],\"tip\":\"«Informar o convencer» no es «tiene datos o no tiene datos». Los dos tienen datos. Cambia para qué los usan.\"},{\"id\":\"enb2m1l6e4\",\"type\":\"cloze\",\"prompt\":\"La palabra del informe\",\"text\":\"What they have is a ___ language: a language that belongs to the family rather than to the street.\",\"answers\":[\"heritage\"],\"translation\":\"Lo que tienen es una lengua de herencia: una lengua que pertenece a la familia, no a la calle.\",\"itemIds\":[\"enb2m1heritagelanguage\"]},{\"id\":\"enb2m1l6e5\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin «fluency gap» — con palabras de B2, no con un rodeo de B1\",\"source\":\"Teachers call this a fluency gap.\",\"forbid\":[\"fluency\",\"gap\"],\"answers\":[\"Teachers say the children understand more than they can write\",\"Teachers say they understand more than they can speak or write\",\"Teachers say speaking and writing lag behind understanding\",\"Teachers say the children cannot write as well as they understand\"],\"translation\":\"Los profesores dicen que los niños entienden más de lo que pueden escribir.\",\"itemIds\":[\"enb2m1fluencygap\"],\"tip\":\"En B2 el paraphrase no pide un rodeo: pide la formulación precisa que no usa la etiqueta. «Understand more than they can write» es más B2 que «it is a thing that happens with language».\"},{\"id\":\"enb2m1l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume los dos textos sin mezclarles la postura\",\"text\":\"The briefing describes ___ in London and refuses to give a policy. It names a ___ language and a fluency ___. The column uses the same studies but calls «not falling behind» a low bar. ___, it tells parents to make English the language of homework.\",\"answers\":[\"bilingualism\",\"heritage\",\"gap\",\"In conclusion\"],\"bank\":[\"bilingualism\",\"heritage\",\"gap\",\"In conclusion\",\"dialect\",\"accent\",\"Moreover\"],\"translation\":\"El informe describe el bilingüismo en Londres y se niega a dar una política. Nombra una lengua de herencia y una brecha de fluidez. La columna usa los mismos estudios pero llama «no quedarse atrás» un listón bajo. En conclusión, dice a los padres que hagan del inglés la lengua de los deberes.\",\"itemIds\":[\"enb2m1bilingualism\",\"enb2m1heritagelanguage\",\"enb2m1fluencygap\",\"enb2m1inconclusion\"],\"tip\":\"«Moreover» sumaría en la misma dirección. Aquí el último hueco cierra, no suma: por eso In conclusion.\"},{\"id\":\"enb2m1l6e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante después de leer. Arréglalo.\",\"wrong\":\"The column says bilingualism is a gift, that is a problem.\",\"answers\":[\"The column says bilingualism is a gift; that is a problem.\",\"The column says bilingualism is called a gift, and that is a problem.\",\"The column says bilingualism is a gift. That is a problem.\"],\"why\":\"Comma splice otra vez, ahora con «that is». O punto, o punto y coma, o and. La columna, además, NO dice que el bilingüismo sea un regalo: dice que las organizaciones lo llaman así y que la palabra trabaja de más.\",\"translation\":\"La columna dice que el bilingüismo es un regalo; eso es un problema.\",\"itemIds\":[\"enb2m1commasplice\",\"enb2m1bilingualism\"]},{\"id\":\"enb2m1l6e8\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"La frase del informe, con precisión\",\"source\":\"The written word, in the heritage language, simply does not turn up enough times to stick.\",\"answers\":[\"La palabra escrita, en la lengua de herencia, simplemente no aparece las veces suficientes para quedarse\",\"La palabra escrita en la lengua de herencia no aparece las suficientes veces como para quedarse\",\"La palabra escrita, en la lengua de herencia, no sale las veces suficientes para fijarse\"],\"itemIds\":[\"enb2m1thewrittenword\",\"enb2m1heritagelanguage\"]},{\"id\":\"enb2m1l6e9\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Preservar una lengua minoritaria no es lo mismo que escribir un párrafo que se sostenga.\",\"answers\":[\"Preserving a minority language is not the same as writing a paragraph that stands alone.\",\"Preserving a minority language is not the same as writing a paragraph that has to stand alone.\"],\"itemIds\":[\"enb2m1preservealanguage\",\"enb2m1minoritylanguage\",\"enb2m1standsalone\"]},{\"id\":\"enb2m1l6e10\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria y Amy, después de leer las dos piezas. Pregunta antes del play. Una sola escucha — el examen te dará dos.\",\"audio\":\"So the first one doesn't want to tell you what to do.|That's the point, I think. It's a briefing. The second one absolutely does. She uses the same study and then says it's a low bar.|Would you write like the second one in the exam?|The stance, maybe. The «so yeah» — no.\",\"question\":\"¿En qué están de acuerdo Valeria y Amy?\",\"options\":[\"En que el primero describe y el segundo recomienda\",\"En que el segundo no ha leído el estudio\",\"En que en el examen hay que escribir como la columna, palabra por palabra\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Amy dice que la columna USA el mismo estudio.\",\"Amy distingue la postura del registro: la postura sí, el «so yeah» no.\"],\"itemIds\":[\"enb2m1bilingualism\",\"enb2m1natinconclusion\"]}]}],\"resources\":[{\"label\":\"British Council — bilingualism in education (overview)\",\"url\":\"https://www.britishcouncil.org/voices-magazine/why-we-need-bilingual-education\",\"note\":\"Un texto real de divulgación. Lee un párrafo y decide si informa o convence. Es el gesto de esta lección, aplicado a un original.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1a:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L1a\",\"6\",{}]]\n"])</script></body></html>
