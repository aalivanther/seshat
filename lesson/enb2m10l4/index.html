n el que cambia algo ([[at that point|en ese momento]]) y un cierre que no es «y ya está».\u003cbr/\u003e· Una \u003cb\u003edescripción\u003c/b\u003e con los sentidos y con una evaluación: no un inventario de muebles.\u003cbr/\u003e· Una \u003cb\u003ecarta personal\u003c/b\u003e que cuenta o describe, no que discute una tesis.\u003cbr/\u003e\u003cbr/\u003eLa regla dura sigue siendo la del B1: \u003ci\u003eoff-topic answers score nothing\u003c/i\u003e. Si te piden el primer día en una galería y escribes sobre el tren a Gales, son cero puntos de Task fulfilment, da igual la gramática.\u003cbr/\u003e\u003cbr/\u003eY la capa de este módulo tiene que verse: al menos una relativa con past perfect, al menos un at that point o un looking back. Si todo va en pasado simple, es un relato de B1 con más palabras."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m10l4\",\"phaseId\":\"enb2m10\",\"title\":\"150 to 200 words, and something happens\",\"subtitle\":\"El relato y la descripción: la Writing Part 2 exacta, todavía sin reloj de examen\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que el handbook pide, con esas palabras\",\"itemIds\":[\"enb2m10anarrativecomposition\",\"enb2m10adescriptivecomposition\",\"enb2m10atthatpoint\",\"enb2m10thesmallroomattheback\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sorpresa nº 3: la Writing 2 de LanguageCert NO es un ensayo\",\"body\":\"$17\",\"table\":[[\"Género\",\"Qué tiene que pasar\",\"Qué no es\"],[\"Relato\",\"algo cambia en un punto; hay fondo y noticia\",\"una lista de cosas que hicimos\"],[\"Descripción\",\"sentidos + evaluación (I found it…)\",\"un inventario: there was a chair, there was a lamp\"],[\"Carta personal\",\"lector concreto, dos funciones\",\"un ensayo con Dear Amy\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m10l4e1\",\"type\":\"mc\",\"prompt\":\"Qué pide de verdad la Writing 2\",\"question\":\"La Writing Part 2 del LanguageCert B2 es…\",\"options\":[\"Una carta personal, un relato o una descripción, de 150-200 palabras.\",\"Un ensayo a favor y en contra, de 140-190 palabras, como el First.\",\"Una carta formal de 100-150 palabras con tres puntos.\"],\"answer\":0,\"whyWrong\":[null,\"Eso es Cambridge B2 First, Part 1. Aquí el ensayo se enseña y no se examina.\",\"Eso es la Writing Part 1, que ya entrenaste.\"],\"itemIds\":[\"enb2m10anarrativecomposition\",\"enb2m10adescriptivecomposition\",\"enb2m10onefiftytotwohundred\"]},{\"id\":\"enb2m10l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Relato, descripción o fuera de tema?\",\"categories\":[\"Relato o descripción (puntúa)\",\"Fuera de tema (cero)\"],\"items\":[{\"text\":\"Describe a place that made an impression on you, and say why.\",\"bucket\":0},{\"text\":\"Write about your earliest childhood memory.\",\"bucket\":0},{\"text\":\"Discuss the advantages and disadvantages of public art.\",\"bucket\":1},{\"text\":\"Tell a story ending with the words: «…and the door closed.»\",\"bucket\":0},{\"text\":\"Write a report for your manager on visitor numbers.\",\"bucket\":1},{\"text\":\"Describe a person who taught you something, and how.\",\"bucket\":0}],\"itemIds\":[\"enb2m10anarrativecomposition\",\"enb1m12offtopicscoresnothing\"]},{\"id\":\"enb2m10l4e3\",\"type\":\"cloze\",\"prompt\":\"El instante en que cambia la capa\",\"text\":\"We were looking at a still life. ___ that point Ade opened the small room at the back.\",\"answers\":[\"At\"],\"translation\":\"Estábamos mirando un bodegón. En ese momento Ade abrió la sala pequeña del fondo.\",\"itemIds\":[\"enb2m10atthatpoint\",\"enb2m10thesmallroomattheback\"]},{\"id\":\"enb2m10l4e4\",\"type\":\"order\",\"prompt\":\"Ordena un relato mínimo de tres capas\",\"sentences\":[\"Nora, who had been waiting in the doorway, took my arm.\",\"We'd been walking around the rooms when Ade appeared.\",\"At that point he opened the small room at the back.\",\"Inside was the painting she had been looking for.\",\"«Forty years,» murmured Nora.\"],\"itemIds\":[\"enb2m10whohadbeenwaiting\",\"enb2m10atthatpoint\",\"enb2m10murmurednora\"]},{\"id\":\"enb2m10l4e5\",\"type\":\"write\",\"prompt\":\"Un relato corto, 150-200. Tres puntos de contenido. Capas a la vista.\",\"scenario\":\"Una revista del barrio pide relatos de 150-200 palabras con este título: «The room at the back». Tienes que contar una visita a un sitio (una galería, un museo, una casa) en la que lo importante no era lo de la sala grande, sino lo que había detrás.\",\"genre\":\"story\",\"register\":\"direct\",\"bullets\":[\"Di adónde fuiste y con quién, y qué se esperaba ver.\",\"Cuenta qué había «detrás» (una sala, una persona, un objeto) y cómo se llegó ahí.\",\"Cierra con cómo te dejó eso, sin decir «fue increíble» a secas.\"],\"checks\":[{\"re\":\"(galler|museum|exhibition|room at the back|Ade|Nora)\",\"label\":\"Situas la visita en un sitio concreto\"},{\"re\":\"(had (been )?(waiting|looking|kept|missed|raining)|who had)\",\"label\":\"Hay al menos una capa de past perfect / relativa de fondo\"},{\"re\":\"(at that point|looking back|in the end|turned out|murmured|said quietly)\",\"label\":\"Hay un punto de giro o un cierre evaluado\"}],\"frame\":[\"Párrafo 1 — el plan y el fondo (who had been… / we'd been…)\",\"Párrafo 2 — at that point: la sala de atrás, lo que había\",\"Párrafo 3 — la evaluación (I found it… / looking back…)\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"at that point\",\"looking back\",\"in the end\",\"although\",\"because\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"Nora, who had been waiting in the doorway of the gallery for twenty minutes, took my arm as if she might change her mind. We'd been walking around the main rooms — still lifes, a loud installation, captions I did not finish — when Ade Balogun appeared and asked if we had seen the small room at the back.\\nAt that point I thought he was being polite. He wasn't. He opened a door I had not noticed, and inside was a single photograph, on loan from Leeds, of a woman standing on a station platform. Nora, who had kept a ticket from that same station for forty years, said nothing. Just nodded.\\nLooking back, the exhibition in the main rooms has faded. The photograph has not. I found it profoundly moving, not because it was beautiful, but because Nora, who had not been inside a gallery in forty years, recognised the platform before she recognised herself.\",\"itemIds\":[\"enb2m10anarrativecomposition\",\"enb2m10atthatpoint\",\"enb2m10thesmallroomattheback\",\"enb2m10whohadbeenwaiting\",\"enb2m10profoundlymoving\"],\"tip\":\"El modelo tiene tres párrafos, un at that point, dos relativas con had, un Said nothing, y una evaluación que no es «bonito». Copia la arquitectura, no la anécdota.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"si
