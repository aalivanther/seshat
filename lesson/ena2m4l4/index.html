tatic/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m4l4\",\"phaseId\":\"ena2m4\",\"title\":\"The cheapest in the shop\",\"subtitle\":\"El superlativo: el THE que no se cae y la preposición que el español cambia\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El primero de todos\",\"itemIds\":[\"ena2m4thecheapestinthe\",\"ena2m4thebiggestroom\",\"ena2m4themostexpensive\",\"ena2m4thebestcoffee\",\"ena2m4theworstday\",\"ena2m4theyoungestinthefamily\",\"ensale\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Del comparativo al superlativo hay dos cambios, y ninguno es difícil\",\"body\":\"Si ayer aprendiste a decir «más barato que», hoy solo tienes que decir «\u003cb\u003eel\u003c/b\u003e más barato \u003cb\u003ede todos\u003c/b\u003e». Los cambios son estos:\u003cbr/\u003e\u003cbr/\u003e1. La terminación pasa de \u003cb\u003e-er\u003c/b\u003e a \u003cb\u003e-est\u003c/b\u003e: cheap → cheaper → [[the cheapest|el más barato]]. Y el \u003ci\u003emore\u003c/i\u003e pasa a \u003cb\u003ethe most\u003c/b\u003e: expensive → more expensive → [[the most expensive|el más caro]].\u003cbr/\u003e2. \u003cb\u003eDelante va THE, y no se cae nunca.\u003c/b\u003e Ni en el habla rápida, ni en un mensaje, ni cuando el sustantivo va detrás. \u003ci\u003eIt's best coffee in London\u003c/i\u003e está mal; \u003ci\u003eIt's \u003cb\u003ethe\u003c/b\u003e best coffee in London\u003c/i\u003e está bien.\u003cbr/\u003e\u003cbr/\u003eLos irregulares son los mismos tres de ayer: good → \u003cb\u003ethe best\u003c/b\u003e, bad → \u003cb\u003ethe worst\u003c/b\u003e, far → the furthest.\u003cbr/\u003e\u003cbr/\u003eY la ortografía tampoco cambia: los mismos retoques del comparativo (big → the biggest, easy → the easiest, nice → the nicest).\",\"table\":[[\"adjetivo\",\"comparativo\",\"superlativo\"],[\"cheap\",\"cheaper\",\"the cheapest\"],[\"big\",\"bigger\",\"the biggest\"],[\"easy\",\"easier\",\"the easiest\"],[\"expensive\",\"more expensive\",\"the most expensive\"],[\"good\",\"better\",\"the best\"],[\"bad\",\"worse\",\"the worst\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"«El más barato DE la tienda» — y aquí es donde el español te traiciona\",\"body\":\"Después del superlativo, el español pone siempre \u003cb\u003ede\u003c/b\u003e: el más barato \u003ci\u003ede\u003c/i\u003e la tienda, la habitación más grande \u003ci\u003edel\u003c/i\u003e piso, el mejor café \u003ci\u003ede\u003c/i\u003e Londres. Y la mano traduce \u003ci\u003eof\u003c/i\u003e, que es lo que parece.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEn inglés casi siempre es IN.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e• Con \u003cb\u003esitios\u003c/b\u003e: the cheapest one \u003cb\u003ein\u003c/b\u003e the shop · the best coffee \u003cb\u003ein\u003c/b\u003e London · the biggest room \u003cb\u003ein\u003c/b\u003e the flat.\u003cbr/\u003e• Con \u003cb\u003egrupos de personas\u003c/b\u003e: the youngest \u003cb\u003ein\u003c/b\u003e the family · the tallest \u003cb\u003ein\u003c/b\u003e the class.\u003cbr/\u003e• Con \u003cb\u003eperiodos de tiempo\u003c/b\u003e, y solo ahí, sí es \u003cb\u003eOF\u003c/b\u003e: the worst day \u003cb\u003eof\u003c/b\u003e my life · the hottest day \u003cb\u003eof\u003c/b\u003e the year.\u003cbr/\u003e\u003cbr/\u003eAsí que la regla práctica es corta: \u003cb\u003esi detrás hay un sitio o un grupo de gente, IN. Si detrás hay un trozo de tiempo, OF.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eY una última cosa que casi nadie avisa: \u003ci\u003ethe best of the shop\u003c/i\u003e no es solo raro, es que significa otra cosa (algo así como «lo mejorcito que da de sí la tienda»). No es que suene extranjero: es que se entiende mal.\",\"table\":[[\"español\",\"inglés\",\"qué hay detrás\"],[\"el más barato de la tienda\",\"the cheapest in the shop\",\"un sitio\"],[\"el mejor café de Londres\",\"the best coffee in London\",\"un sitio\"],[\"el pequeño de la familia\",\"the youngest in the family\",\"un grupo\"],[\"el peor día de mi vida\",\"the worst day of my life\",\"un periodo de tiempo\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m4l4e1\",\"type\":\"mc\",\"prompt\":\"El superlativo de cheap\",\"question\":\"«El más barato» es…\",\"options\":[\"the cheapest\",\"the more cheap\",\"cheapest\"],\"answer\":0,\"whyWrong\":[null,\"more es para comparar dos, no para coronar a uno; y cheap es corto\",\"Le falta el THE, que en el superlativo no se cae nunca\"],\"itemIds\":[\"ena2m4thecheapestinthe\"]},{\"id\":\"ena2m4l4e2\",\"type\":\"match\",\"prompt\":\"Empareja cada adjetivo con su superlativo\",\"pairs\":[{\"target\":\"the cheapest\",\"source\":\"el más barato\"},{\"target\":\"the most expensive\",\"source\":\"el más caro\"},{\"target\":\"the best\",\"source\":\"el mejor\"},{\"target\":\"the worst\",\"source\":\"el peor\"}],\"itemIds\":[\"ena2m4thecheapestinthe\",\"ena2m4themostexpensive\",\"ena2m4thebestcoffee\",\"ena2m4theworstday\"]},{\"id\":\"ena2m4l4e3\",\"type\":\"bucket\",\"prompt\":\"¿Este superlativo lleva -est o lleva the most?\",\"categories\":[\"the + adjetivo + -est\",\"the most + adjetivo\"],\"items\":[{\"text\":\"cheap\",\"bucket\":0},{\"text\":\"expensive\",\"bucket\":1},{\"text\":\"big\",\"bucket\":0},{\"text\":\"comfortable\",\"bucket\":1},{\"text\":\"young\",\"bucket\":0},{\"text\":\"interesting\",\"bucket\":1}],\"itemIds\":[\"ena2m4thecheapestinthe\",\"ena2m4themostexpensive\",\"ena2m4theyoungestinthefamily\"],\"tip\":\"La frontera es la misma de la lección 2: lo que llevaba -er lleva -est, y lo que llevaba more lleva the most. No hay dos reglas, hay una.\"},{\"id\":\"ena2m4l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el superlativo\",\"text\":\"It's the ___ (cheap) jacket in the shop.\",\"answers\":[\"cheapest\"],\"translation\":\"Es la chaqueta más barata de la tienda.\",\"hints\":[\"cheap es corto: la marca va dentro de la palabra\",\"cheap + …\"],\"itemIds\":[\"ena2m4thecheapestinthe\",\"enjacket\",\"enshop\"]},{\"id\":\"ena2m4l4e5\",\"type\":\"cloze\",\"prompt\":\"Y ahora con una palabra larga\",\"text\":\"It's the ___ expensive flat in the street.\",\"answers\":[\"most\"],\"translation\":\"Es el piso más caro de la calle.\",\"hints\":[\"expensive no aguanta la -est\",\"the … expensive\"],\"itemIds\":[\"ena2m4themostexpensive\",\"enflat\"]},{\"id\":\"ena2m4l4e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la preposición — el calco del superlativo\",\"wrong\":\"It's the biggest room of the flat.\",\"answers\":[\"It's the biggest room in the flat.\"],\"why\":\"El español dice «del piso» y de ahí sale el of. Pero detrás del superlativo, cuando lo que viene es un SITIO, el inglés pone IN: in the flat, in the shop, in London. El of se guarda para los periodos de tiempo (the worst day OF my life).\",\"translation\":\"Es la habitación más grande del piso.\",\"itemIds\":[\"ena2m4thebiggestroom\",\"enroom\",\"enflat\"],\"tip\":\"Este error no rompe la comunicación, pero es de los que un corrector marca sin pensar. Y es baratísimo de arreglar: una preposición.\"},{\"id\":\"ena2m4l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el artículo que falta\",\"wrong\":\"It's best coffee in London.\",\"answers\":[\"It's the best coffee in London.\"],\"why\":\"El superlativo lleva THE siempre, y el español ayuda a olvidarlo porque a veces decimos «es mejor café de Londres» sin artículo. En inglés no hay excepción: the best, the cheapest, the most expensive.\",\"translation\":\"Es el mejor café de Londres.\",\"itemIds\":[\"ena2m4thebestcoffee\",\"enlondon\"]},{\"id\":\"ena2m4l4e8\",\"type\":\"mc\",\"prompt\":\"in u of: ¿qué hay detrás?\",\"question\":\"«El peor día de mi vida» es…\",\"options\":[\"the worst day of my life\",\"the worst day in my life\",\"the worst day from my life\"],\"answer\":0,\"whyWrong\":[null,\"Aquí detrás no hay un sitio, hay un periodo de tiempo (my life): toca of\",\"from no entra en esta construcción en ningún caso\"],\"itemIds\":[\"ena2m4theworstday\"],\"tip\":\"La única familia que se lleva OF es la del tiempo: of my life, of the year, of the month, of the day. Todo lo demás, IN.\"},{\"id\":\"ena2m4l4e9\",\"type\":\"order\",\"prompt\":\"Ordena la tarde de compras de Valeria\",\"sentences\":[\"On Saturday Valeria went to the street market with Amy.\",\"She saw three jackets: a blue one, a red one and a black one.\",\"The blue one was the cheapest in the market, but it was too small.\",\"In the end she bought the black one, because it was the most comfortable.\"],\"translation\":\"El sábado Valeria fue al mercadillo con Amy. Vio tres chaquetas: una azul, una roja y una negra. La azul era la más barata del mercadillo, pero le quedaba pequeña. Al final compró la negra, porque era la más cómoda.\",\"itemIds\":[\"ena2m4thecheapestinthe\",\"ena2m4themostexpensive\",\"ena2m2intheend\",\"ena2m2boughtgroup\",\"ena2m2isawamyyesterday\",\"ena2m1streetmarket\",\"enjacket\"],\"tip\":\"Fíjate en cómo se encadena una decisión de compra: qué había, cuál era el más algo, y por qué te quedaste con otro. Eso es exactamente la misión del módulo.\"},{\"id\":\"ena2m4l4e10\",\"type\":\"build\",\"prompt\":\"Construye el superlativo entero\",\"target\":\"It's the cheapest one in the shop\",\"translation\":\"Es el más barato de la tienda\",\"distractors\":[\"of\",\"most\",\"cheaper\"],\"itemIds\":[\"ena2m4thecheapestinthe\",\"enshop\"],\"tip\":\"Tres fichas sobrantes, tres errores clásicos: la preposición española, el most que aquí no toca y el comparativo en lugar del superlativo.\"},{\"id\":\"ena2m4l4e11\",\"type\":\"translate\",\"prompt\":\"Traduce al inglés\",\"direction\":\"toTarget\",\"source\":\"Es la habitación más grande del piso.\",\"answers\":[\"It's the biggest room in the flat.\",\"It's the biggest room in the apartment.\"],\"hint\":\"detrás hay un sitio\",\"itemIds\":[\"ena2m4thebiggestroom\",\"enroom\",\"enflat\"]},{\"id\":\"ena2m4l4e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — dos superlativos seguidos\",\"text\":\"It's the best coffee in London, and it isn't the most expensive.\",\"phonetic\":\"its de best KO-fi in LAN-dan, and it is̬nt de móust iks-PEN-siv\",\"translation\":\"Es el mejor café de Londres, y no es el más caro.\",\"itemIds\":[\"ena2m4thebestcoffee\",\"ena2m4themostexpensive\"],\"tip\":\"«the best» se dice pegado, casi «debest». El the del superlativo es átono: no lo separes ni lo alargues.\"},{\"id\":\"ena2m4l4e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Es la chaqueta más cara de las rebajas, pero es la más cómoda.\",\"answers\":[\"It's the most expensive jacket in the sale, but it's the most comfortable.\",\"It's the most expensive jacket in the sale but it's the most comfortable.\"],\"hints\":[\"Dos veces the most, y la preposición del sitio\",\"It's the m… expensive jacket i… the sale, but it's the m… comfortable.\"],\"itemIds\":[\"ena2m4themostexpensive\",\"ena2m4morecomfortable\",\"ensale\"]}]}],\"resources\":[{\"label\":\"British Council — Superlative adjectives\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/comparative-superlative-adjectives\",\"note\":\"Haz los ejercicios y fíjate solo en una cosa: qué preposición aparece detrás de cada superlativo. Verás que casi siempre es in.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next
