hasta niveles muy altos: no es que el alumno no sepa la regla, es que \u003cb\u003eel español no le ofrece ninguna pista de que haya dos grupos\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003eEl inglés parte esos verbos en dos montones. Y —esto es lo importante— \u003cb\u003eno hay ninguna lógica que los separe\u003c/b\u003e: no es que unos sean de comunicación y otros no (\u003ci\u003etell\u003c/i\u003e es el más comunicativo de todos y está en el montón A). Es \u003cb\u003ereparto léxico puro\u003c/b\u003e, como el género de los sustantivos en español. Así que no se razona: se clasifica.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMONTÓN A — la persona va pegada al verbo.\u003c/b\u003e\u003cbr/\u003e\u003cb\u003etell · give · show · send · lend · buy\u003c/b\u003e (y también \u003ci\u003ebring, offer, teach, ask, make, cook\u003c/i\u003e)\u003cbr/\u003e→ \u003ci\u003e[[Tell me the truth.|Dime la verdad.]]\u003c/i\u003e · \u003ci\u003eGive her the keys.\u003c/i\u003e · \u003ci\u003e[[Show me how it works.|Enséñame cómo funciona.]]\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eMONTÓN B — la persona necesita TO.\u003c/b\u003e\u003cbr/\u003e\u003cb\u003eexplain · say · describe · suggest · recommend · mention\u003c/b\u003e (y \u003ci\u003erepeat\u003c/i\u003e)\u003cbr/\u003e→ \u003ci\u003e[[Can you explain it to me?|¿Me lo explicas?]]\u003c/i\u003e · \u003ci\u003e[[What did she say to you?|¿Qué te dijo?]]\u003c/i\u003e · \u003ci\u003eDescribe the flat to me.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEl montón que memorizas es el B: seis verbos.\u003c/b\u003e Todo lo demás se comporta como \u003ci\u003etell\u003c/i\u003e. Seis palabras contra un error que dura años.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDos avisos para no pasarte de listo:\u003c/b\u003e\u003cbr/\u003e1. Los del montón A \u003cb\u003etambién\u003c/b\u003e pueden llevar \u003ci\u003eto\u003c/i\u003e, pero entonces la cosa va primero: \u003ci\u003eGive the keys \u003cb\u003eto her\u003c/b\u003e\u003c/i\u003e. Las dos son correctas. Los del montón B \u003cb\u003enunca\u003c/b\u003e pueden quitarlo.\u003cbr/\u003e2. \u003cb\u003esay\u003c/b\u003e y \u003cb\u003etell\u003c/b\u003e son la pareja que más se cruza. \u003ci\u003etell\u003c/i\u003e casi siempre lleva persona (\u003ci\u003etell me\u003c/i\u003e, \u003ci\u003etell him\u003c/i\u003e); \u003ci\u003esay\u003c/i\u003e casi nunca la lleva, y si la lleva, con \u003ci\u003eto\u003c/i\u003e: \u003ci\u003eShe said nothing\u003c/i\u003e · \u003ci\u003eShe said it to me\u003c/i\u003e."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m9l2\",\"phaseId\":\"ena2m9\",\"title\":\"Tell me · explain it to me\",\"subtitle\":\"Dos montones de verbos, y solo hay que memorizar el pequeño\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los dos montones, y cuatro frases para probarlos\",\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\",\"ena2m9canyouexplainittome\",\"ena2m9didyoutellhim\",\"ena2m9whatdidshesaytoyou\",\"ena2m9showmehowitworks\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El error que el español provoca, y por qué es tan tozudo\",\"body\":\"$17\",\"table\":[[\"en español\",\"montón A (sin to)\",\"montón B (con to)\"],[\"Me dijo la verdad.\",\"She told me the truth.\",\"—\"],[\"Me lo explicó.\",\"—\",\"She explained it to me.\"],[\"Me enseñó el piso.\",\"She showed me the flat.\",\"—\"],[\"Me lo describió.\",\"—\",\"She described it to me.\"],[\"Me mandó un mensaje.\",\"She sent me a message.\",\"—\"],[\"Me recomendó la calle.\",\"—\",\"She recommended the street to me.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m9l2e1\",\"type\":\"bucket\",\"prompt\":\"EL CUBO DEL MÓDULO — ¿la persona va pegada al verbo o necesita «to»?\",\"categories\":[\"verbo + PERSONA (sin to)\",\"verbo + TO + persona\"],\"items\":[{\"text\":\"tell\",\"bucket\":0},{\"text\":\"explain\",\"bucket\":1},{\"text\":\"give\",\"bucket\":0},{\"text\":\"say\",\"bucket\":1},{\"text\":\"show\",\"bucket\":0},{\"text\":\"describe\",\"bucket\":1},{\"text\":\"send\",\"bucket\":0},{\"text\":\"suggest\",\"bucket\":1}],\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\"],\"tip\":\"Este es EL ejercicio del módulo. No hay regla que deducir: hay dos montones. Memoriza el de la derecha —seis verbos— y da por hecho que todo lo demás está en el de la izquierda.\"},{\"id\":\"ena2m9l2e2\",\"type\":\"bucket\",\"prompt\":\"Segunda pasada, con los que no salieron antes\",\"categories\":[\"verbo + PERSONA (sin to)\",\"verbo + TO + persona\"],\"items\":[{\"text\":\"lend\",\"bucket\":0},{\"text\":\"recommend\",\"bucket\":1},{\"text\":\"buy\",\"bucket\":0},{\"text\":\"mention\",\"bucket\":1},{\"text\":\"bring\",\"bucket\":0},{\"text\":\"repeat\",\"bucket\":1}],\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\"],\"tip\":\"«Repeat» es la que más pilla: «¿me lo repites?» es Can you repeat it TO me? — o, mejor todavía, Can you say that again?\"},{\"id\":\"ena2m9l2e3\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco estrella del nivel\",\"wrong\":\"He explained me the rules.\",\"answers\":[\"He explained the rules to me.\"],\"why\":\"«explain» está en el montón B: la persona solo puede ir detrás de TO, y detrás del verbo va la cosa. En español «me explicó las normas» es la única forma posible, y de ahí sale el error. Los seis del montón B son explain, say, describe, suggest, recommend y mention.\",\"translation\":\"Me explicó las normas.\",\"itemIds\":[\"ena2m9explaintogroup\"],\"tip\":\"Si dudas, prueba a meter la cosa delante: «explained the rules…» ¿suena bien? Entonces la persona va con to detrás.\"},{\"id\":\"ena2m9l2e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige — el mismo montón, otro verbo\",\"wrong\":\"What did she say you?\",\"answers\":[\"What did she say to you?\"],\"why\":\"«say» también es del montón B. La pareja que hay que tener clara: She TOLD me (sin to) frente a She SAID it TO me. Y en el 90 % de los ca e the flat (persona pegada)\"},{\"target\":\"recommend\",\"source\":\"…the street to me (persona con to)\"}],\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\"]},{\"id\":\"ena2m9l2e9\",\"type\":\"transform\",\"prompt\":\"Cambia de montón sin cambiar el significado\",\"source\":\"She explained the house rules to me.\",\"instruction\":\"Dilo con «tell» — y fíjate en lo que le pasa al «to»\",\"answers\":[\"She told me the house rules.\",\"She told me about the house rules.\"],\"translation\":\"Me explicó las normas de la casa.\",\"hints\":[\"tell es del montón A: la persona se pega al verbo y el «to» desaparece\",\"She told m… the house rules.\"],\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\"],\"tip\":\"Este ejercicio es el mejor examen de si has entendido el cubo: cambiar de verbo obliga a mover la persona y a quitar la preposición.\"},{\"id\":\"ena2m9l2e10\",\"type\":\"gapbank\",\"prompt\":\"La primera semana en el piso — elige el verbo\",\"text\":\"Amy ___ me the truth about the neighbours. Then she ___ the house rules to me, one by one. In the end she ___ me the note on the fridge.\",\"answers\":[\"told\",\"explained\",\"showed\"],\"bank\":[\"told\",\"explained\",\"showed\",\"said\",\"listened\",\"wanted\"],\"translation\":\"Amy me dijo la verdad sobre los vecinos. Luego me explicó las normas de la casa, una por una. Al final me enseñó la nota de la nevera.\",\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\",\"ena2m9nextdoorneighbour\",\"enfridge\"],\"tip\":\"El segundo hueco lleva «to me» detrás: eso ya te dice que el verbo es del montón B. Los otros dos llevan la persona pegada, así que son del montón A.\"},{\"id\":\"ena2m9l2e11\",\"type\":\"build\",\"prompt\":\"Construye la petición\",\"target\":\"Can you explain it to me\",\"translation\":\"¿Me lo explicas?\",\"distractors\":[\"explains\",\"for\"],\"itemIds\":[\"ena2m9canyouexplainittome\"]},{\"id\":\"ena2m9l2e12\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — los dos montones en una frase\",\"text\":\"She told me the rules, but she didn't explain them to me.\",\"phonetic\":\"shi TÓULD mi de ruuls̬, bat shi DÍ-dent iks-PLÉIN dem tu mi\",\"translation\":\"Me dijo las normas, pero no me las explicó.\",\"itemIds\":[\"ena2m9tellmegroup\",\"ena2m9explaintogroup\",\"enbut\"],\"tip\":\"Una frase, los dos patrones. Si te sale sin pensarlo, el cubo está montado.\"},{\"id\":\"ena2m9l2e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Por qué no me lo explicaste?\",\"answers\":[\"Why didn't you explain it to me?\",\"Why didn't you explain that to me?\"],\"hints\":[\"Pregunta en pasado con did (módulo 2) + verbo del montón B\",\"Why didn't you explain it t… m…?\"],\"itemIds\":[\"ena2m9canyouexplainittome\",\"ena2m9whydidntyoutellme\"],\"tip\":\"Compárala con «Why didn't you tell me?», que es de la lección 7: mismo significado, dos montones, dos construcciones.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m9-2\",\"book\":\"I don't understand.\",\"real\":\"You've lost me.\",\"meaning\":\"Me he perdido / no te sigo.\",\"when\":\"Cuando alguien te está explicando algo y te has descolgado: en una conversación con amigos, con compañeros de piso o de trabajo. Es más suave que «I don't understand», porque pone la culpa en la explicación y no en ti. En el examen escrito, la del libro.\",\"register\":\"amigos\",\"note\":\"Y fíjate en el pronombre: «me» detrás del verbo, como toda la lección. Lo que sigue después suele ser «Can you say that again?».\",\"sound\":\"yuuv LOST mi\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Verbs with two objects\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/verbs-two-objects\",\"note\":\"La lista oficial de los dos patrones. Cópiate a mano solo los seis del montón B en un papel y pégalo donde estudias: es el único que hay que memorizar.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-
