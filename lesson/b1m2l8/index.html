 sehe das anders. / Da bin ich ganz Konstanzes Meinung.\u003c/i\u003e\u003cbr/\u003e2. \u003cb\u003eTesis\u003c/b\u003e propia: \u003ci\u003eMeiner Meinung nach sind flexible Arbeitszeiten ein großer Vorteil.\u003c/i\u003e\u003cbr/\u003e3. \u003cb\u003eRazón + ejemplo propio\u003c/b\u003e: \u003ci\u003eIch arbeite seit zwei Jahren … Deshalb …\u003c/i\u003e ← el ejemplo propio es lo que separa un B1 de un A2.\u003cbr/\u003e4. \u003cb\u003eConcesión\u003c/b\u003e: \u003ci\u003eAllerdings muss man … / Das stimmt zwar, aber …\u003c/i\u003e\u003cbr/\u003e5. \u003cb\u003eCierre\u003c/b\u003e: una frase que resuma tu postura.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY los conectores no son adorno: son 10 de los 40 puntos\u003c/b\u003e (criterio Kohärenz). Los cuatro imprescindibles de este género, con lo que le hacen al verbo:\u003cbr/\u003e· \u003cb\u003edeshalb\u003c/b\u003e (por eso) → inversión\u003cbr/\u003e· \u003cb\u003eaußerdem\u003c/b\u003e (además) → inversión\u003cbr/\u003e· \u003cb\u003eallerdings\u003c/b\u003e (ahora bien) → inversión\u003cbr/\u003e· \u003cb\u003etrotzdem\u003c/b\u003e (aun así) → inversión\u003cbr/\u003e\u003cbr/\u003eLos cuatro son adverbios: \u003cu\u003elos cuatro provocan inversión\u003c/u\u003e. Si te acuerdas de eso, ya no escribes «*Deshalb ich denke»."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m2l8\",\"phaseId\":\"b1m2\",\"title\":\"Deine Meinung im Forum\",\"subtitle\":\"Escritura — el comentario de opinión (80 palabras)\",\"minutes\":15,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los conectores que arman un argumento\",\"itemIds\":[\"b1m2allerdings\",\"b1m2einerseits\",\"b1m2ichsehedasanders\",\"b1m2dasstimmtzwar\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el comentario de foro no es un correo\",\"body\":\"$17\",\"table\":[[\"paso\",\"función\",\"Redemittel\"],[\"1\",\"reaccionar\",\"Ich sehe das anders / Da stimme ich zu\"],[\"2\",\"tesis\",\"Meiner Meinung nach …\"],[\"3\",\"razón + ejemplo\",\"Ich arbeite seit … Deshalb …\"],[\"4\",\"conceder\",\"Allerdings … / Das stimmt zwar, aber …\"],[\"5\",\"cerrar\",\"Trotzdem … / Deswegen finde ich …\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m2l8e1\",\"type\":\"bucket\",\"prompt\":\"¿Comentario de foro o correo informal?\",\"categories\":[\"Forumsbeitrag (comentario)\",\"informelle E-Mail (correo)\"],\"items\":[{\"text\":\"Hallo Nico, wie geht es dir?\",\"bucket\":1},{\"text\":\"Ich sehe das anders als Konstanze.\",\"bucket\":0},{\"text\":\"Viele Grüße, Sofía\",\"bucket\":1},{\"text\":\"Meiner Meinung nach ist das ein Vorteil für alle.\",\"bucket\":0},{\"text\":\"Liebe Anna, danke für deine Mail!\",\"bucket\":1},{\"text\":\"Allerdings sollte es klare Regeln geben.\",\"bucket\":0}],\"itemIds\":[\"b1m2ichsehedasanders\",\"b1m2allerdings\",\"b1m1meinermeinungnach\"],\"tip\":\"Escribir «Hallo …» y «Viele Grüße» en un comentario de foro es tema fallado. Y tema fallado = Erfüllung E = 0 puntos de 40.\"},{\"id\":\"b1m2l8e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Deshalb ich denke, dass flexible Zeiten besser sind.\",\"answers\":[\"Deshalb denke ich, dass flexible Zeiten besser sind.\"],\"why\":\"«deshalb» ocupa la posición 1 y obliga a inversión: el verbo va inmediatamente detrás. En español «por eso yo pienso» no mueve nada.\",\"translation\":\"Por eso pienso que los horarios flexibles son mejores.\",\"itemIds\":[\"a2m6deshalb\",\"a2m6denken\"]},{\"id\":\"b1m2l8e3\",\"type\":\"cloze\",\"prompt\":\"Completa la reacción\",\"text\":\"Ich ___ das anders als Konstanze.\",\"answers\":[\"sehe\"],\"translation\":\"Yo lo veo de otra manera que Konstanze.\",\"hints\":[\"El verbo de «ver»\",\"Ich s... das anders\"],\"itemIds\":[\"b1m2ichsehedasanders\"],\"tip\":\"«Ich sehe das anders» es la forma educada de decir «no estoy de acuerdo». Abre el 90% de los comentarios de foro alemanes.\"},{\"id\":\"b1m2l8e4a\",\"type\":\"cloze\",\"prompt\":\"Completa el borrador — la consecuencia\",\"text\":\"Ich arbeite seit zwei Jahren im Homeoffice. ___ habe ich am Nachmittag Zeit für meine Familie. Allerdings muss man zu Hause sehr diszipliniert sein. Einmal pro Woche gehe ich trotzdem ins Büro, weil mir die Kollegen fehlen. Zurück ins alte Büroleben möchte ich aber nicht, denn ich fühle mich jetzt viel freier.\",\"answers\":[\"Deshalb\"],\"translation\":\"Llevo dos años teletrabajando. Por eso tengo tiempo por las tardes para mi familia. Ahora bien, en casa hay que ser muy disciplinado. Aun así voy a la oficina una vez por semana, porque echo de menos a los compañeros. Pero a la vida de oficina de antes no quiero volver, porque ahora me siento mucho más libre.\",\"hints\":[\"Adverbio de consecuencia, verbo justo detrás\",\"D... — encadena una consecuencia\"],\"itemIds\":[\"a2m6deshalb\",\"b1m2homeoffice\"],\"tip\":\"«Deshalb» encadena una consecuencia («por eso»): el teletrabajo CAUSA el tiempo libre por las tardes. Como todo adverbio en posición 1, el verbo va justo detrás.\"},{\"id\":\"b1m2l8e4b\",\"type\":\"cloze\",\"prompt\":\"Completa el borrador — el pero\",\"text\":\"Ich arbeite seit zwei Jahren im Homeoffice. Deshalb habe ich am Nachmittag Zeit für meine Familie. ___ muss man zu Hause sehr diszipliniert sein. Einmal pro Woche gehe ich trotzdem ins Büro, weil mir die Kollegen fehlen. Zurück ins alte Büroleben möchte ich aber nicht, denn ich fühle mich jetzt viel freier.\",\"answers\":[\"Allerdings\"],\"translation\":\"Llevo dos años teletrabajando. Por eso tengo tiempo por las tardes para mi familia. Ahora bien, en casa hay que ser muy disciplinado. Aun así voy a la oficina una vez por semana, porque echo de menos a los compañeros. Pero a la vida de oficina de antes no quiero volver, porque ahora me siento mucho más libre.\",\"hints\":[\"Adverbio de matiz, verbo justo detrás\",\"A... — introduce el pero\"],\"itemIds\":[\"b1m2allerdings\"],\"tip\":\"«Allerdings» introduce el pero, el matiz frente a lo dicho antes. Misma sintaxis que «Deshalb» (adverbio en posición 1, verbo detrás) pero significa justo lo contrario: no es una consecuencia, es una salvedad.\"},{\"id\":\"b1m2l8e4c\",\"type\":\"cloze\",\"prompt\":\"Completa el borrador — la razón\",\"text\":\"Ich arbeite seit zwei Jahren im Homeoffice. Deshalb habe ich am Nachmittag Zeit für meine Familie. Allerdings muss man zu Hause sehr diszipliniert sein. Einmal pro Woche gehe ich trotzdem ins Büro, ___ mir die Kollegen fehlen. Zurück ins alte Büroleben möchte ich aber nicht, denn ich fühle mich jetzt viel freier.\",\"answers\":[\"weil\"],\"translation\":\"Llevo dos años teletrabajando. Por eso tengo tiempo por las tardes para mi familia. Ahora bien, en casa hay que ser muy disciplinado. Aun así voy a la oficina una vez por semana, porque echo de menos a los compañeros. Pero a la vida de oficina de antes no quiero volver, porque ahora me siento mucho más libre.\",\"hints\":[\"Conjunción subordinante: el verbo se va al final\",\"w___\"],\"itemIds\":[],\"tip\":\"«weil» manda el verbo conjugado al final de su frase («…fehlen»). No es un adverbio como los dos huecos anteriores: aquí no hay inversión, hay orden subordinado.\"},{\"id\":\"b1m2l8e4d\",\"type\":\"cloze\",\"prompt\":\"Completa el borrador — la razón sin tocar el orden\",\"text\":\"Ich arbeite seit zwei Jahren im Homeoffice. Deshalb habe ich am Nachmittag Zeit für meine Familie. Allerdings muss man zu Hause sehr diszipliniert sein. Einmal pro Woche gehe ich trotzdem ins Büro, weil mir die Kollegen fehlen. Zurück ins alte Büroleben möchte ich aber nicht, ___ ich fühle mich jetzt viel freier.\",\"answers\":[\"denn\"],\"translation\":\"Llevo dos años teletrabajando. Por eso tengo tiempo por las tardes para mi familia. Ahora bien, en casa hay que ser muy disciplinado. Aun así voy a la oficina una vez por semana, porque echo de menos a los compañeros. Pero a la vida de oficina de antes no quiero volver, porque ahora me siento mucho más libre.\",\"hints\":[\"Conjunción coordinante: no toca el orden\",\"d___\"],\"itemIds\":[],\"tip\":\"«denn» también significa «porque», pero es coordinante: a diferencia de «weil», no manda el verbo al final. «...möchte ich nicht, denn ich fühle mich...» — orden normal a ambos lados.\"},{\"id\":\"b1m2l8e5\",\"type\":\"mc\",\"prompt\":\"El «llevo dos años» del español\",\"question\":\"«Llevo dos años teletrabajando» →\",\"options\":[\"Ich arbeite seit zwei Jahren im Homeoffice\",\"Ich habe zwei Jahre im Homeoffice gearbeitet\",\"Ich werde zwei Jahre im Homeoffice arbeiten\"],\"answer\":0,\"whyWrong\":[null,\"Eso dice que ya terminaste — el Perfekt cierra la acción\",\"Eso es futuro\"],\"itemIds\":[\"b1m2homeoffice\"],\"tip\":\"«seit + Dativ + PRESENTE». El español usa «llevo» y el alemán el presente: si sigue pasando, presente. Es un calco clásico del §6.8.\"},{\"id\":\"b1m2l8e6\",\"type\":\"build\",\"prompt\":\"Construye la concesión\",\"target\":\"Das stimmt zwar, aber es gibt auch Nachteile\",\"translation\":\"Es cierto, pero también hay desventajas\",\"distractors\":[\"obwohl\",\"gibt es\"],\"itemIds\":[\"b1m2dasstimmtzwar\",\"b1m2vorteilnachteil\"],\"tip\":\"«zwar …, aber …» es el par de la concesión. Concede primero y objeta después: así se argumenta en B1.\"},{\"id\":\"b1m2l8e7\",\"type\":\"transform\",\"prompt\":\"Ponle inversión\",\"source\":\"Ich muss diszipliniert sein. Allerdings.\",\"instruction\":\"Escríbelo como una sola frase que empiece por «Allerdings»\",\"answers\":[\"Allerdings muss ich diszipliniert sein\"],\"translation\":\"Ahora bien, tengo que ser disciplinado.\",\"hints\":[\"Allerdings ocupa la posición 1 → verbo detrás\",\"Allerdings muss ich ...\"],\"itemIds\":[\"b1m2allerdings\"]},{\"id\":\"b1m2l8e8\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «Meinung»\",\"source\":\"Meiner Meinung nach sind flexible Arbeitszeiten besser.\",\"forbid\":[\"Meinung\",\"Meiner\"],\"answers\":[\"Ich finde flexible Arbeitszeiten besser\",\"Ich denke, dass flexible Arbeitszeiten besser sind\",\"Ich finde, dass flexible Arbeitszeiten besser sind\",\"Für mich sind flexible Arbeitszeiten besser\"],\"translation\":\"En mi opinión los horarios flexibles son mejores.\",\"hints\":[\"Verbo de valoración directo\",\"Ich finde ...\"],\"itemIds\":[\"b1m1meinermeinungnach\",\"b1m2flexiblearbeitszeiten\",\"a2m6finden\"],\"tip\":\"En 80 palabras vas a opinar tres o cuatro veces. Si las cuatro empiezan igual, bajas de banda en Wortschatz. Ten dos fórmulas mínimo.\"},{\"id\":\"b1m2l8e9\",\"type\":\"cloze\",\"prompt\":\"Completa el par de la doble cara\",\"text\":\"___ spare ich Zeit, andererseits fehlen mir die Kollegen.\",\"answers\":[\"Einerseits\"],\"translation\":\"Por un lado ahorro tiempo, por otro echo de menos a los compañeros.\",\"hints\":[\"El compañero fijo de «andererseits»\",\"Einer-seits\"],\"itemIds\":[\"b1m2einerseits\"],\"tip\":\"«einerseits … andererseits» va en pareja: si abres uno, tienes que cerrar el otro. Suena muy B1 y cuesta poco.\"},{\"id\":\"b1m2l8e10\",\"type\":\"write\",\"prompt\":\"Escribe tu comentario. Lee primero el comentario publicado y el esqueleto.\",\"scenario\":\"En el foro de una revista se debate sobre los horarios flexibles. Konstanze ha publicado su opinión. Escribe TU comentario reaccionando a lo que dice. No es un correo: nada de Anrede ni de Gruß.\",\"genre\":\"forum\",\"stimulus\":{\"author\":\"Konstanze_87\",\"text\":\"Ich halte nichts von der Gleitzeit. Früher wusste jeder, wann die Kollegen da sind, und um fünf war Feierabend. Heute schreibt mir mein Chef um neun Uhr abends Mails. Feste Arbeitszeiten schützen die Angestellten — flexible Zeiten nützen nur der Firma.\"},\"bullets\":[\"Reacciona a Konstanze y di tu opinión (Ich sehe das anders / Meiner Meinung nach …).\",\"Da una razón con un ejemplo de tu propia experiencia.\",\"Concede algo al otro lado (Allerdings … / Das stimmt zwar, aber …).\"],\"checks\":[{\"re\":\"(meinung nach|ich finde|ich sehe das|ich halte)\",\"label\":\"Reaccionas y das tu opinión\"},{\"re\":\"(ich arbeite|meine erfahrung|bei mir|seit \\\\w+ jahren|zum beispiel)\",\"label\":\"Das un ejemplo propio\"},{\"re\":\"(allerdings|natürlich|zwar|man muss)\",\"label\":\"Concedes algo al otro lado\"}],\"frame\":[\"Paso 1 — reaccionar: «Ich finde den Beitrag von Konstanze interessant, aber ich sehe das anders.»\",\"Paso 2 — tesis: «Meiner Meinung nach sind flexible Arbeitszeiten …»\",\"Paso 3 — razón + ejemplo propio: «Ich arbeite seit … Deshalb …»\",\"Paso 4 — añadir: «Außerdem …»\",\"Paso 5 — conceder y cerrar: «Allerdings … Trotzdem …»\",\"SIN Anrede y SIN Gruß: un comentario no es un correo.\"],\"requireConnectors\":{\"min\":3,\"bank\":[\"deshalb\",\"außerdem\",\"allerdings\",\"trotzdem\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Ich finde den Beitrag von Konstanze interessant, aber ich sehe das anders. Meiner Meinung nach sind flexible Arbeitszeiten ein großer Vorteil. Ich arbeite seit zwei Jahren im Homeoffice und kann morgens früher anfangen. Deshalb habe ich am Nachmittag Zeit für meine Familie. Außerdem spare ich jeden Tag eine Stunde Fahrt. Allerdings muss man diszipliniert sein, denn die Arbeit hört nie richtig auf. Trotzdem möchte ich nicht mehr zurück ins Büro. Feste Zeiten passen nicht zu jedem Leben.\",\"itemIds\":[\"b1m2allerdings\",\"b1m2ichsehedasanders\",\"b1m2flexiblearbeitszeiten\",\"b1m2homeoffice\",\"b1m1meinermeinungnach\"],\"tip\":\"Cuenta tus palabras y comprueba los tres puntos antes de dar por terminado. Un comentario brillante que se olvida de conceder pierde más nota que uno normal que trata los tres.\"},{\"id\":\"b1m2l8e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: un pódcast sobre comentarios de foro · tarea 1 de 2. Dos escuchas.\",\"audio\":\"… ich lese beruflich sehr viele Kommentare, und mir fällt auf: Die guten fangen fast nie mit «Ich finde» an. Die fangen mit einer Beobachtung an. Erst dann kommt die Meinung, und danach — das ist der Teil, den fast alle weglassen — ein Beispiel aus dem eigenen Leben. Einerseits, andererseits, ähm, das klingt schlau. Allerdings bleibt es ohne Beispiel leer.\",\"question\":\"„Die guten Kommentare fangen mit der eigenen Meinung an.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Die fangen mit einer Beobachtung an. Erst dann kommt die Meinung»\",null],\"itemIds\":[\"b1m2einerseits\"],\"tip\":\"«Erst dann kommt …» ordena los pasos. Si la afirmación cambia el orden, es Falsch aunque todas las palabras estén en el audio.\"},{\"id\":\"b1m2l8e12\",\"type\":\"audiomc\",\"prompt\":\"Mismo pódcast, segunda tarea. Dos escuchas.\",\"audio\":\"… ich lese beruflich sehr viele Kommentare, und mir fällt auf: Die guten fangen fast nie mit «Ich finde» an. Die fangen mit einer Beobachtung an. Erst dann kommt die Meinung, und danach — das ist der Teil, den fast alle weglassen — ein Beispiel aus dem eigenen Leben. Einerseits, andererseits, ähm, das klingt schlau. Allerdings bleibt es ohne Beispiel leer.\",\"question\":\"¿Qué les falta a casi todos los comentarios?\",\"options\":[\"Un ejemplo de la propia experiencia\",\"Una opinión clara\",\"Un saludo al principio\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La opinión sí está: lo que falta viene después de ella\",\"Del saludo no se habla\"],\"itemIds\":[\"b1m2allerdings\"],\"tip\":\"Lo que puntúa está entre guiones: «— das ist der Teil, den fast alle weglassen —». En el audio esos incisos se oyen como una bajada de voz.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m2-4\",\"book\":\"Ich mache das sofort.\",\"real\":\"Mach ich gleich.\",\"meaning\":\"Ahora mismo lo hago\",\"when\":\"Respondiendo de viva voz a un compañero o a un amigo. En un correo de trabajo no: ni la frase recortada ni el «gleich» — allí se escribe entera y con un verbo que comprometa.\",\"register\":\"amigos\",\"exam\":\"Ich kümmere mich sofort darum.\",\"note\":\"Lo que se cae no es el sujeto: es el «Das» de delante. «Das mache ich gleich» → «Mach ich gleich», con el verbo abriendo la frase y la -e de «mache» comida. Es el alemán hablado en su forma más económica: dos palabras y un compromiso.\",\"sound\":\"maj ij glaij\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m2natmachichgleich\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Schreiben Aufgabe 2)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"Compara tu comentario con el modelo oficial: fíjate en que no lleva ni saludo ni despedida.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
