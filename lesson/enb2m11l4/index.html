n una propuesta concreta, no solo en el malestar.\",\"Siempre se publica en un periódico nacional.\",\"Se escribe en registro de amigos, para que se lea de verdad.\"],\"answer\":0,\"whyWrong\":[null,\"Puede ser el semanario del barrio. El género no lo da el papel: lo da el cierre.\",\"Al contrario: do not, ought, I would recommend. Out of order se queda en el rellano.\"],\"itemIds\":[\"enb2m11lettertotheneditor\"]},{\"id\":\"enb2m11l4e2\",\"type\":\"match\",\"prompt\":\"El campo SOCIETY, en castellano de verdad\",\"pairs\":[{\"target\":\"equal opportunities\",\"source\":\"igualdad de oportunidades\"},{\"target\":\"individual rights\",\"source\":\"los derechos de cada uno\"},{\"target\":\"social responsibilities\",\"source\":\"las responsabilidades de todos\"},{\"target\":\"parental responsibilities\",\"source\":\"las responsabilidades de los padres\"}],\"itemIds\":[\"enb2m11equalopportunities\",\"enb2m11individualrights\",\"enb2m11socialresponsibilities\",\"enb2m11parentalresponsibilities\"]},{\"id\":\"enb2m11l4e3\",\"type\":\"bucket\",\"prompt\":\"¿Carta al director o mensaje al grupo del rellano?\",\"categories\":[\"Carta (examen / periódico)\",\"Rellano (calle)\"],\"items\":[{\"text\":\"I do not agree that the garden should go.\",\"bucket\":0},{\"text\":\"That's out of order.\",\"bucket\":1},{\"text\":\"There ought to be step-free access in a building this size.\",\"bucket\":0},{\"text\":\"Let's just call it and go to the pub.\",\"bucket\":1},{\"text\":\"Equal opportunities are not a luxury in a four-storey house.\",\"bucket\":0},{\"text\":\"Yeah, I'm not sure about that.\",\"bucket\":1}],\"itemIds\":[\"enb2m11idonotagree\",\"enb2m11thatsoutoforder\",\"enb2m11equalopportunities\"]},{\"id\":\"enb2m11l4e4\",\"type\":\"write\",\"prompt\":\"Carta al director, 150-200. Hecho, por qué importa, propuesta.\",\"scenario\":\"El semanario del barrio ha publicado que el ayuntamiento quiere quitar el tramo de acera rebajada junto a Palmer Road «porque estorba las terrazas». Escribes al director. No es una queja a Mrs Beckett: es opinión pública.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"bullets\":[\"Parte de un hecho (la acera rebajada, quién la usa).\",\"Explica por qué importa en términos de derechos o de equal opportunities / care for the elderly.\",\"Propón una alternativa concreta (there ought to be / I would recommend).\"],\"checks\":[{\"re\":\"(pavement|kerb|step-free|wheelchair|buggy|elderly|ground floor)\",\"label\":\"Hay un hecho de acceso\"},{\"re\":\"(equal opportunit|rights|responsib|care for the elderly|fair)\",\"label\":\"Lo enganchas a un derecho o un deber\"},{\"re\":\"(ought to|recommend \\\\w+ing|there (ought|should|has) to be)\",\"label\":\"Cierras con una propuesta\"}],\"frame\":[\"Dear Editor,\",\"Párrafo 1 — el hecho\",\"Párrafo 2 — derechos / equal opportunities / care for the elderly\",\"Párrafo 3 — there ought to be… / I would recommend…\",\"Yours faithfully, Valeria Soto\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"however\",\"although\",\"therefore\",\"not only\",\"given that\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":150,\"maxWords\":200,\"model\":\"Dear Editor,\\nThe council proposes to remove the dropped kerb on Palmer Road so that two more tables can go out in summer. I do not agree.\\nThe kerb is not an ornament. It is how Nora, who lives on the ground floor, reaches the shop, and how any parent with a buggy reaches the surgery. Equal opportunities are not a luxury in a four-storey street: they are the difference between going out and staying in. Care for the elderly is not only a service the council funds; it is also a pavement that a person can actually use.\\nNot only is the dropped kerb cheaper to keep than to rip out, but it is also the only step-free access for four buildings. I would therefore recommend leaving it where it is. There ought to be a way to have both a terrace and a pavement. Removing the kerb is not that way.\\nI would be grateful if you could publish this.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb2m11lettertotheneditor\",\"enb2m11equalopportunities\",\"enb2m11idonotagree\",\"enb2m11thereoughttobe\",\"enb2m3carefortheelderly\",\"enb2m11notonlyisitcheaper\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
