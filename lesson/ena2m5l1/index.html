ow much?\u003c/i\u003e — [[bread|el pan]], [[rice|el arroz]], [[salt|la sal]], [[soup|la sopa]], [[meat|la carne]].\u003cbr/\u003e\u003cbr/\u003eHasta aquí, el español hace algo parecido: tampoco dices «dos panes» cuando hablas de pan en general. \u003cb\u003eEl problema es que los dos idiomas no reparten igual.\u003c/b\u003e [[vegetables|las verduras]] en inglés se cuentan y en español las tratas como un bloque; y en el módulo siguiente vas a ver diez palabras que el español pluraliza sin pestañear y el inglés no deja.\u003cbr/\u003e\u003cbr/\u003eY una cosa que parece una excepción y no lo es: \u003cb\u003eTwo coffees, please.\u003c/b\u003e Cuando pides, no estás hablando del café como materia, estás contando \u003cb\u003etazas\u003c/b\u003e. Igual con \u003ci\u003etwo teas\u003c/i\u003e, \u003ci\u003ethree beers\u003c/i\u003e. Fuera de la barra, el café vuelve a su montón: \u003ci\u003eI don't drink coffee.\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m5l1\",\"phaseId\":\"ena2m5\",\"title\":\"Two coffees, please\",\"subtitle\":\"El inglés parte los sustantivos en dos montones — y no los reparte como el español\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que hay en la mesa\",\"itemIds\":[\"ena2m5salt\",\"ena2m5soup\",\"ena2m5meat\",\"ena2m5vegetables\",\"ena2m5twocoffeesplease\",\"ena2m5thefoodwasgood\",\"ensugar\",\"enbread\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Dos montones, y cada uno con su gramática\",\"body\":\"$17\",\"table\":[[\"se cuenta (countable)\",\"no se cuenta (uncountable)\"],[\"an apple · two apples\",\"bread · rice · salt · soup\"],[\"lleva a / an\",\"no lleva a / an\"],[\"tiene plural en -s\",\"no tiene plural\"],[\"How many? · a few\",\"How much? · a little\"],[\"The apples are on the table.\",\"The bread is on the table.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m5l1e1\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento — la despensa del ints\":[\"apple empieza por vocal\",\"a → a…\"],\"itemIds\":[\"enapple\",\"entoast\",\"enbreakfast\"],\"tip\":\"toast va sin nada porque no se cuenta: las tostadas son «some toast», por raro que suene desde el español.\"},{\"id\":\"ena2m5l1e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el plural imposible\",\"wrong\":\"I bought some breads at Mr Patel's shop.\",\"answers\":[\"I bought some bread at Mr Patel's shop.\"],\"why\":\"bread no tiene plural en inglés: es materia, como el agua o la sal. Si necesitas contarlo, cuentas las barras — «two loaves of bread» —, pero la palabra bread se queda quieta.\",\"translation\":\"Compré pan en la tienda de Mr Patel.\",\"itemIds\":[\"enbread\",\"enshop\"]},{\"id\":\"ena2m5l1e6\",\"type\":\"match\",\"prompt\":\"Empareja cada palabra con su montón\",\"pairs\":[{\"target\":\"salt\",\"source\":\"la sal — no se cuenta\"},{\"target\":\"vegetables\",\"source\":\"las verduras — sí se cuentan\"},{\"target\":\"soup\",\"source\":\"la sopa — no se cuenta\"},{\"target\":\"sandwich\",\"source\":\"el sándwich — sí se cuenta\"}],\"itemIds\":[\"ena2m5salt\",\"ena2m5vegetables\",\"ena2m5soup\",\"ensandwich\"]},{\"id\":\"ena2m5l1e7\",\"type\":\"transform\",\"prompt\":\"De uno a dos\",\"source\":\"Can I have a coffee, please?\",\"instruction\":\"Pide dos\",\"answers\":[\"Can I have two coffees, please?\"],\"translation\":\"¿Me pones dos cafés, por favor?\",\"hints\":[\"a → two, y la taza se pluraliza\",\"Can I have two coff…, please?\"],\"itemIds\":[\"encanihaveacoffee\",\"ena2m5twocoffeesplease\"]},{\"id\":\"ena2m5l1e8\",\"type\":\"mc\",\"prompt\":\"El verbo que va detrás\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"The soup is very hot.\",\"The soup are very hot.\",\"The soups is very hot.\"],\"answer\":0,\"whyWrong\":[null,\"soup no se cuenta, así que el verbo va en singular\",\"soup no tiene plural\"],\"itemIds\":[\"ena2m5soup\",\"enitshot\"],\"tip\":\"Regla mecánica: montón de la derecha → verbo en singular, siempre. Es la misma que te va a salvar con news y con information.\"},{\"id\":\"ena2m5l1e9\",\"type\":\"build\",\"prompt\":\"Construye el pedido\",\"target\":\"Two coffees and some bread please\",\"translation\":\"Dos cafés y pan, por favor\",\"distractors\":[\"coffee\",\"breads\"],\"itemIds\":[\"ena2m5twocoffeesplease\",\"enbread\",\"enplease\"],\"tip\":\"Las dos fichas que sobran son justo las dos trampas: coffee sin -s cuando cuentas tazas, y bread con -s cuando no se cuenta.\"},{\"id\":\"ena2m5l1e10\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"The food was very good.\",\"translation\":\"La comida estaba muy buena.\",\"hints\":[\"Empieza por The f…\",\"The food w… very good.\"],\"itemIds\":[\"ena2m5thefoodwasgood\"]},{\"id\":\"ena2m5l1e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — tu primer pedido del módulo\",\"text\":\"Two coffees and a sandwich, please.\",\"phonetic\":\"tuu KO-fis̬ and a SÁN-uich, plíis̬\",\"translation\":\"Dos cafés y un sándwich, por favor.\",\"itemIds\":[\"ena2m5twocoffeesplease\",\"ensandwich\",\"enplease\"],\"tip\":\"coffees termina en /z/: «KO-fis̬», con la lengua vibrando. Y el please al final no es un adorno: sin él, en inglés, esto es una orden.\"},{\"id\":\"ena2m5l1e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La comida estaba muy buena, pero la sopa tenía demasiada sal.\",\"answers\":[\"The food was very good, but there was too much salt in the soup.\",\"The food was very good, but the soup had too much salt.\",\"The food was very good but there was too much salt in the soup.\"],\"hints\":[\"food y soup y salt: los tres del montón que no se cuenta, los tres con verbo en singular\",\"The food w… very good, but there w… too m… salt in the soup.\"],\"itemIds\":[\"ena2m5thefoodwasgood\",\"ena2m5soup\",\"ena2m5salt\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m5-1\",\"book\":\"Two coffees, please.\",\"real\":\"Two coffees, cheers.\",\"meaning\":\"Dos cafés, gracias\",\"when\":\"En una ba
