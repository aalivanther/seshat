chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8a4,"])</script><script>self.__next_f.push([1,"Cada módulo de este curso cierra con un \u003cb\u003elaboratorio de examen\u003c/b\u003e: una lección entera dedicada a UNA parte del LanguageCert. Antes del simulacro habrás pasado por las \u003cb\u003ecatorce partes\u003c/b\u003e del examen —las diez del escrito y las cuatro del oral— una a una, así que el papel completo no te pillará de nuevas.\u003cbr/\u003e\u003cbr/\u003eHoy toca el \u003cb\u003eListening Part 1\u003c/b\u003e: \u003cb\u003esiete frases sueltas\u003c/b\u003e —una afirmación, una explicación, una descripción, una instrucción o una pregunta— y por cada una, \u003cb\u003etres respuestas\u003c/b\u003e. Eliges la que \u003cb\u003econtestarías tú\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí está la trampa del nivel.\u003c/b\u003e En A1 y A2 el Part 1 era discriminación: oías una palabra y la emparejabas con un dibujo o un número. \u003cb\u003eEn B1 eso desaparece.\u003c/b\u003e La pregunta ya no es «¿qué has oído?», es \u003cb\u003e«¿qué se contesta a esto?»\u003c/b\u003e, y se decide por \u003cb\u003efunción\u003c/b\u003e, no por vocabulario. Las tres opciones suelen contener palabras del audio: elegir por parecido es exactamente lo que te tumba.\u003cbr/\u003e\u003cbr/\u003eUn ejemplo \u003cb\u003eliteral del \u003ci\u003ePractice Paper\u003c/i\u003e oficial\u003c/b\u003e (volverá en el módulo 12, para que lo reconozcas). Oyes: \u003ci\u003e«Have you heard the new album?»\u003c/i\u003e Opciones:\u003cbr/\u003ea) \u003ci\u003eOh, don't you know it?\u003c/i\u003e · b) \u003ci\u003eI can sing very well.\u003c/i\u003e · c) \u003ci\u003eIt's great, isn't it?\u003c/i\u003e\u003cbr/\u003eLa (b) es absurda y se cae sola: comparte el campo del disco —cantar— y nada más. La (a) tiene palabras plausibles pero contesta a otra pregunta. La (c) es la única que \u003cb\u003econtesta que sí y da una opinión\u003c/b\u003e a la vez, que es exactamente lo que el B1 añade sobre el A2.\u003cbr/\u003e\u003cbr/\u003eLos ejercicios de abajo son nuestros, escritos con ese mismo patrón: ninguno es del papel oficial, y ninguno te lo va a vender como tal.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eEstrategia, en tres pasos:\u003c/b\u003e\u003cbr/\u003e1. \u003cb\u003eLee las tres opciones antes del play.\u003c/b\u003e Casi siempre una es absurda: descártala ya y quédate con dos.\u003cbr/\u003e2. Al oír, pregúntate \u003cb\u003equé acto de habla\u003c/b\u003e es: ¿me piden opinión, permiso, información, ayuda? ¿O me están ofreciendo algo?\u003cbr/\u003e3. \u003cb\u003eTodo se oye dos veces.\u003c/b\u003e La primera pasada, decide. La segunda, confirma — y si dudabas entre dos, escucha la entonación: una pregunta que sube pide sí/no; una que baja pide información."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m1l10\",\"phaseId\":\"enb1m1\",\"title\":\"Exam lab: Listening Part 1\",\"subtitle\":\"Siete frases sueltas y una pregunta que no es «¿qué has entendido?»\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las respuestas que hay que reconocer\",\"itemIds\":[\"enb1m1itsgreatisntit\",\"enb1m1imafraidnot\",\"enb1m1sodoi\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué es exactamente el Part 1, y por qué se falla\",\"body\":\"$17\",\"table\":[[\"Lo que oyes\",\"Lo que se pide\",\"Lo que contestas\"],[\"What do you think of…?\",\"una opinión\",\"It's great, isn't it?\"],[\"Could you give me a hand?\",\"ayuda\",\"Of course. What do you need?\"],[\"Is the room still free?\",\"sí o no\",\"I'm afraid not.\"],[\"I've been here for hours.\",\"empatía\",\"So have I. It's ridiculous.\"],[\"Do you mind if I open the window?\",\"permiso\",\"Not at all.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m1l10e1\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de empezar\",\"question\":\"En el Part 1 del B1, ¿qué decide la respuesta correcta?\",\"options\":[\"La función: qué se te está pidiendo\",\"Las palabras que se repiten entre el audio y la opción\",\"La opción más larga de las tres\"],\"answer\":0,\"whyWrong\":[null,\"Justo al revés: las opciones incorrectas se construyen repitiendo palabras del audio.\",\"La longitud no dice nada; las tres suelen ser parecidas.\"],\"itemIds\":[\"enbestreply\"],\"tip\":\"Regla de oro del Part 1: si eliges por parecido de palabras, estás jugando a lo que el examen quiere que pierdas.\"},{\"id\":\"enb1m1l10e2\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 1 de 7. Lee las tres opciones ANTES del play. Dos escuchas.\",\"audio\":\"What do you think of the new café on the corner?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"It's great, isn't it?\",\"Oh, don't you know it?\",\"I can make coffee very well.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Contesta a otra pregunta: a «do you know the café?», no a «qué te parece».\",\"Tiene la palabra «coffee» y no dice nada de lo que se ha preguntado.\"],\"itemIds\":[\"enb1m1itsgreatisntit\"],\"tip\":\"«What do you think of…?» pide OPINIÓN. Solo una de las tres da una. Y fíjate en la coletilla «isn't it?»: invita al otro a estar de acuerdo, que es lo natural en una charla.\"},{\"id\":\"enb1m1l10e3\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 2 de 7. Dos escuchas.\",\"audio\":\"Excuse me, is the room in Palmer Road still available?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"I'm afraid not — we let it on Tuesday.\",\"Yes, I've lived there for two years.\",\"It's on the second floor.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Contesta a «¿cuánto llevas viviendo allí?», que no es lo que se ha preguntado.\",\"Da información del piso, pero no dice si sigue libre.\"],\"itemIds\":[\"enb1m1imafraidnot\",\"enexcuseme\"],\"tip\":\"«I'm afraid not» es la forma educada de decir «no» en inglés británico. Un «no» pelado suena seco; este no, y significa exactamente lo mismo.\"},{\"id\":\"enb1m1l10e4\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 3 de 7. Dos escuchas.\",\"audio\":\"I've been waiting for the landlord for two hours.\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"So have I. It's ridiculous.\",\"Yes, I waited yesterday.\",\"He lives in Palmer Road.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Cambia de tiempo verbal y de tema: el otro habla de ahora, no de ayer.\",\"Es información suelta: no responde a la queja.\"],\"itemIds\":[\"enb1m1sodoi\",\"enb1m1waitfor\"],\"tip\":\"Esto no es una pregunta: es una queja, y lo que se espera es EMPATÍA. «So have I» copia el auxiliar del otro — si él dice «have», tú dices «So have I»; si dice «I'm tired», «So am I».\"},{\"id\":\"enb1m1l10e5\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 4 de 7. Dos escuchas.\",\"audio\":\"Do you mind if I open the window? It's very warm in here.\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"Not at all, go ahead.\",\"Yes, of course I do.\",\"I've already closed it.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«Yes, I do mind» significa «sí me molesta»: le estarías diciendo que NO. Es la trampa clásica de «Do you mind…?».\",\"Contradice la situación: la ventana está cerrada, por eso lo pregunta.\"],\"itemIds\":[\"enb1m1already\"],\"tip\":\"«Do you mind…?» pregunta si te MOLESTA. Por eso el permiso se da diciendo «No» («Not at all», «Of course not») y se niega diciendo «Yes». Es al revés que en español, y cae en el examen.\"},{\"id\":\"enb1m1l10e6\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 5 de 7. Dos escuchas.\",\"audio\":\"Could you give me a hand with these boxes?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"Of course. Where do you want them?\",\"Yes, I have two hands.\",\"They're in the kitchen.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Entiende «hand» literalmente: es exactamente el error que la opción quiere provocar.\",\"Responde a «dónde están», que nadie ha preguntado.\"],\"itemIds\":[\"enb1m1getonwith\"],\"tip\":\"«give me a hand» = echar una mano. La opción literal está ahí a propósito: el Part 1 usa las expresiones hechas como filtro.\"},{\"id\":\"enb1m1l10e7\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 6 de 7. Dos escuchas.\",\"audio\":\"How long have you been living in this flat?\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"Since March, so about six months.\",\"It's about twenty minutes from here.\",\"Yes, I live here.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«How long» aquí es tiempo, no distancia. La opción juega con el otro sentido de «how long».\",\"«How long» no se contesta con sí o no.\"],\"itemIds\":[\"enb1m1howlong\",\"enb1m1sincemarch\"],\"tip\":\"La pregunta reina del módulo, ahora en formato examen. Y la respuesta copia el tiempo verbal: perfecto en la pregunta, perfecto —o su marcador— en la respuesta.\"},{\"id\":\"enb1m1l10e8\",\"type\":\"audiomc\",\"prompt\":\"Part 1 · ítem 7 de 7. Dos escuchas.\",\"audio\":\"Don't forget to send the guarantor form before Thursday.\",\"question\":\"¿Cuál es la mejor respuesta?\",\"options\":[\"I won't. I've already printed it.\",\"Yes, I forgot it last week.\",\"Thursday is my day off.\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Admite un olvido pasado en vez de responder al aviso.\",\"Recoge la palabra «Thursday» y no contesta a lo que se pide.\"],\"itemIds\":[\"enb1m1already\"],\"tip\":\"A un «Don't forget…» se contesta «I won't» — no «Yes». Es la respuesta que da un nativo y la que el examen espera; en español diríamos «que no, que no se me olvida».\"},{\"id\":\"enb1m1l10e9\",\"type\":\"match\",\"prompt\":\"Empareja cada frase con el ACTO DE HABLA que es\",\"pairs\":[{\"target\":\"What do you think of it?\",\"source\":\"pedir una opinión\"},{\"target\":\"Do you mind if I sit here?\",\"source\":\"pedir permiso\"},{\"target\":\"Could you give me a hand?\",\"source\":\"pedir ayuda\"},{\"target\":\"I've been waiting for hours.\",\"source\":\"quejarse (busca empatía)\"},{\"target\":\"Don't forget the form.\",\"source\":\"recordar algo (avisar)\"}],\"itemIds\":[\"enbestreply\",\"enb1m1waitfor\"],\"tip\":\"Si sabes nombrar el acto de habla, la opción correcta cae sola. Este emparejamiento es literalmente la estrategia del Part 1 puesta en ejercicio.\"},{\"id\":\"enb1m1l10e10\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta: las cinco respuestas que más se repiten\",\"text\":\"It's great, isn't it? I'm afraid not. So have I. Not at all. Of course — where do you want them?\",\"phonetic\":\"its gréit, Í-s̬ent it · aim a-FRÉID not · sóu jav ai · not at ool · ov koos\",\"translation\":\"Está genial, ¿verdad? · Me temo que no. · Yo también. · En absoluto. · Claro, ¿dónde las quieres?\",\"itemIds\":[\"enb1m1itsgreatisntit\",\"enb1m1imafraidnot\",\"enb1m1sodoi\"],\"tip\":\"En el Part 2 del oral tendrás que decir estas mismas fórmulas, no solo reconocerlas. Dilas hasta que salgan sin pensar.\"},{\"id\":\"enb1m1l10e11\",\"type\":\"transform\",\"prompt\":\"Copia el auxiliar del otro\",\"source\":\"I'm shattered.\",\"instruction\":\"Contesta «yo también»\",\"answers\":[\"So am I\",\"So am I.\",\"Me too\",\"Me too.\"],\"translation\":\"Yo también.\",\"hints\":[\"El auxiliar de la frase es «am»\",\"So ... I\"],\"itemIds\":[\"enb1m1sodoi\",\"enb1m1natshattered\"],\"tip\":\"«So + auxiliar + yo». Si el otro dice «I have», tú «So have I»; si dice «I do», «So do I»; si dice «I'm», «So am I». Y en negativo: «Neither do I».\"},{\"id\":\"enb1m1l10e12\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"Me temo que no: la alquilamos el martes.\",\"answers\":[\"I'm afraid not, we let it on Tuesday\",\"I'm afraid not. We let it on Tuesday\",\"I am afraid not, we let it on Tuesday\"],\"hints\":[\"La forma educada de decir «no»\",\"I'm afraid ...\"],\"itemIds\":[\"enb1m1imafraidnot\"],\"tip\":\"Un laborat
