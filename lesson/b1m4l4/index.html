 con \u003ci\u003eteilnehmen\u003c/i\u003e pide Dativ y con \u003ci\u003esich erinnern\u003c/i\u003e pide Akkusativ. La preposición sola no decide nada — \u003cu\u003emanda el verbo\u003c/u\u003e. Por eso el bloque se memoriza entero, con su ejemplo y su artículo.\u003cbr/\u003e\u003cbr/\u003eDos de estos verbos son separables y eso [[verwirrt|confunde]] al principio: \u003ci\u003eab\u003c/i\u003ehängen y \u003ci\u003eteil\u003c/i\u003enehmen sueltan su prefijo al final: \u003ci\u003eEs \u003cb\u003ehängt\u003c/b\u003e von der Zeit \u003cb\u003eab\u003c/b\u003e\u003c/i\u003e · \u003ci\u003eIch \u003cb\u003enehme\u003c/b\u003e an dem Kurs \u003cb\u003eteil\u003c/b\u003e\u003c/i\u003e.\",\"table\":[[\"bloque\",\"caso\",\"ejemplo\"],[\"abhängen von\",\"Dativ\",\"Es hängt von dir ab.\"],[\"teilnehmen an\",\"Dativ\",\"Ich nehme an der Diskussion teil.\"],[\"bestehen aus\",\"Dativ\",\"Das Spiel besteht aus drei Teilen.\"],[\"sich ärgern über\",\"Akkusativ\",\"Ich ärgere mich über die Werbung.\"],[\"achten auf\",\"Akkusativ\",\"Achte auf deine Bildschirmzeit!\"],[\"sich erinnern an\",\"Akkusativ\",\"Ich erinnere mich an das Spiel.\"],[\"sich kümmern um\",\"Akkusativ\",\"Ich kümmere mich um mein Konto.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l4e1\",\"type\":\"match\",\"prompt\":\"Empareja bloque y significado\",\"pairs\":[{\"target\":\"abhängen von\",\"source\":\"depender de\"},{\"target\":\"teilnehmen an\",\"source\":\"participar en\"},{\"target\":\"sich kümmern um\",\"source\":\"ocuparse de\"},{\"target\":\"sich erinnern an\",\"source\":\"acordarse de\"}],\"itemIds\":[\"b1m4abhaengenvon\",\"b1m4teilnehmenan\",\"b1m4sichkuemmernum\",\"b1m4sicherinnernan\"]},{\"id\":\"b1m4l4e2\",\"type\":\"bucket\",\"prompt\":\"Clasifica el bloque por su caso\",\"categories\":[\"+ Dativ\",\"+ Akkusativ\"],\"items\":[{\"text\":\"abhängen von\",\"bucket\":0},{\"text\":\"teilnehmen an\",\"bucket\":0},{\"text\":\"bestehen aus\",\"bucket\":0},{\"text\":\"sich ärgern über\",\"bucket\":1},{\"text\":\"achten auf\",\"bucket\":1},{\"text\":\"sich erinnern an\",\"bucket\":1},{\"text\":\"sich kümmern um\",\"bucket\":1}],\"itemIds\":[\"b1m4abhaengenvon\",\"b1m4teilnehmenan\",\"b1m4bestehenaus\",\"b1m4sichaergernueber\",\"b1m4achtenauf\",\"b1m4sicherinnernan\",\"b1m4sichkuemmernum\"],\"tip\":\"an aparece en los dos lados: teilnehmen AN + D, sich erinnern AN + A. Manda el verbo, no la preposición.\"},{\"id\":\"b1m4l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición\",\"text\":\"Das hängt ___ dir ab.\",\"answers\":[\"von\"],\"translation\":\"Eso depende de ti.\",\"hints\":[\"abhängen + preposición fija con Dativ\",\"dir es Dativ: la preposición que lo pide\"],\"itemIds\":[\"b1m4abhaengenvon\"],\"tip\":\"«Das hängt von dir ab» es una frase entera de conversación. Guárdala tal cual: sirve en cualquier discusión.\"},{\"id\":\"b1m4l4e4\",\"type\":\"cloze\",\"prompt\":\"Completa el bloque separable\",\"text\":\"Ich nehme ___ der Diskussion teil.\",\"answers\":[\"an\"],\"translation\":\"Participo en el debate.\",\"hints\":[\"teilnehmen + preposición con Dativ\",\"der Diskussion es Dativ\"],\"itemIds\":[\"b1m4teilnehmenan\"]},{\"id\":\"b1m4l4e5\",\"type\":\"gapbank\",\"prompt\":\"Completa el comentario de un foro\",\"text\":\"Ich ärgere mich ___ die Werbung in jeder App. Aber alles hängt ___ den Eltern ab: Sie müssen ___ die Zeiten achten.\",\"answers\":[\"über\",\"von\",\"auf\"],\"bank\":[\"über\",\"von\",\"auf\",\"an\",\"um\",\"aus\"],\"translation\":\"Me molesta la publicidad en cada aplicación. Pero todo depende de los padres: tienen que vigilar los horarios.\",\"itemIds\":[\"b1m4sichaergernueber\",\"b1m4abhaengenvon\",\"b1m4achtenauf\",\"b1m4diewerbung\"]},{\"id\":\"b1m4l4e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la preposición regida\",\"wrong\":\"Ich erinnere mich von dem Spiel.\",\"answers\":[\"Ich erinnere mich an das Spiel.\"],\"why\":\"«acordarse DE» te empuja a von, pero sich erinnern rige an + Akkusativ: an das Spiel. La preposición española nunca sirve de guía.\",\"translation\":\"Me acuerdo del juego.\",\"itemIds\":[\"b1m4sicherinnernan\"]},{\"id\":\"b1m4l4e7\",\"type\":\"build\",\"prompt\":\"Construye el bloque con su caso\",\"target\":\"Ich kümmere mich um meine kleine Schwester\",\"translation\":\"Me ocupo de mi hermana pequeña\",\"distractors\":[\"von\",\"für\"],\"itemIds\":[\"b1m4sichkuemmernum\",\"schwester\"]},{\"id\":\"b1m4l4e8\",\"type\":\"mc\",\"prompt\":\"Elige el bloque correcto\",\"question\":\"«El juego consta de tres partes» →\",\"options\":[\"Das Spiel besteht aus drei Teilen\",\"Das Spiel besteht von drei Teilen\",\"Das Spiel besteht in drei Teilen\"],\"answer\":0,\"whyWrong\":[null,\"von va con abhängen, no con bestehen\",\"in con bestehen significa otra cosa («consistir en» una idea abstracta)\"],\"itemIds\":[\"b1m4bestehenaus\",\"b1m4dasvideospiel\"]},{\"id\":\"b1m4l4e9\",\"type\":\"listen\",\"prompt\":\"Escucha el consejo y transcríbelo\",\"text\":\"Achte auf deine Bildschirmzeit\",\"translation\":\"Vigila tu tiempo de pantalla\",\"hints\":[\"Imperativo de du + bloque con auf\",\"Achte ... deine Bildschirmzeit\"],\"itemIds\":[\"b1m4achtenauf\",\"b1m4diebildschirmzeit\"]},{\"id\":\"b1m4l4e10\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera, sin el verbo prohibido\",\"source\":\"Das hängt von den Eltern ab.\",\"forbid\":[\"hängt\",\"abhängen\"],\"answers\":[\"Die Eltern entscheiden das\",\"Das entscheiden die Eltern\"],\"translation\":\"Eso depende de los padres.\",\"hints\":[\"Sin «depender»: ¿quién decide?\",\"Die Eltern ...\"],\"itemIds\":[\"b1m4abhaengenvon\",\"eltern\"],\"tip\":\"Parafrasear un verbo con rección difícil es la salida de emergencia del oral: si no te sale la preposición, cambia de verbo.\"},{\"id\":\"b1m4l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Participo en el debate.\",\"answers\":[\"Ich nehme an der Diskussion teil\"],\"hints\":[\"Separable + preposición con Dativ\",\"Ich nehme an der Diskussion ...\"],\"itemIds\":[\"b1m4teilnehmenan\"],\"tip\":\"Verbo separable Y con rección: el prefijo al final, la preposición en su sitio. Dos reglas a la vez, como en el examen.\"},{\"id\":\"b1m4l4e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: megafonía del instituto · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Eine Durchsage für alle Klassen: Die Abstimmung über die neuen Handyregeln ist ausgewertet. Teilgenommen haben achtzig Prozent von euch, das ist mehr als je zuvor. Die Regeln gelten ab Montag, nachlesen könnt ihr sie ab heute Nachmittag auf der Schulhomepage. Ob das Ganze funktioniert, hängt jetzt, ähm, nicht von uns Lehrern ab, sondern von euch — ihr habt die Regeln schließlich selbst gemacht.\",\"question\":\"„Die neuen Regeln gelten schon ab heute Nachmittag.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«Die Regeln gelten ab Montag»; hoy por la tarde solo se pueden LEER en la web\",null],\"itemIds\":[\"b1m4abhaengenvon\",\"b1m4teilnehmenan\"],\"tip\":\"Dos fechas en la misma frase con dos hechos distintos: cuándo entra en vigor y cuándo se puede consultar. El Teil 1 vive de esa confusión.\"},{\"id\":\"b1m4l4e13\",\"type\":\"audiomc\",\"prompt\":\"Misma megafonía, segunda tarea. Dos escuchas.\",\"audio\":\"Eine Durchsage für alle Klassen: Die Abstimmung über die neuen Handyregeln ist ausgewertet. Teilgenommen haben achtzig Prozent von euch, das ist mehr als je zuvor. Die Regeln gelten ab Montag, nachlesen könnt ihr sie ab heute Nachmittag auf der Schulhomepage. Ob das Ganze funktioniert, hängt jetzt, ähm, nicht von uns Lehrern ab, sondern von euch — ihr habt die Regeln schließlich selbst gemacht.\",\"question\":\"¿Qué participación hubo en la votación?\",\"options\":[\"El ochenta por ciento del alumnado\",\"La mitad del alumnado\",\"Solo los delegados de clase\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La cifra que se oye es «achtzig Prozent»\",\"Votaron todas las clases, no solo los delegados\"],\"itemIds\":[\"b1m4achtenauf\",\"b1m4regelnvereinbaren\"]}]}],\"resources\":[{\"label\":\"Goethe — Wortliste B1\",\"url\":\"https://www.goethe.de/pro/relaunch/prf/de/Goethe-Zertifikat_B1_Wortliste.pdf\",\"note\":\"La lista oficial marca cada verbo con su preposición y su caso. Es la fuente de estos bloques.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L17\",\"6\",{}]]\n"])</script></body></html>
