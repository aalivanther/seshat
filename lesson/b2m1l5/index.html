3c/u\u003e de la segunda pieza del verbo: \u003ci\u003eIch habe den Bericht \u003cb\u003enicht gelesen\u003c/b\u003e.\u003c/i\u003e «Ich habe nicht den Bericht gelesen» niega el informe, no la lectura.\u003cbr/\u003e5. El \u003cb\u003eVorfeld admite una sola pieza\u003c/b\u003e, y elegir cuál es la herramienta de cohesión más barata del alemán. Cinco frases seguidas con \u003ci\u003eIch\u003c/i\u003e suenan a redacción de instituto. \u003ci\u003eEinem Bericht zufolge …\u003c/i\u003e ata con lo anterior."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m1l5\",\"phaseId\":\"b2m1\",\"title\":\"Das Vorfeld und der Mittelfeld\",\"subtitle\":\"Clínica: dónde va todo lo que no es el verbo\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El orden que no duele y fosiliza\",\"itemIds\":[\"b2m1esihm\",\"b2m1nichtgesehen\",\"b2m1boulevardblatt\",\"b2m1leitartikel\",\"b2m1korrespondent\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: entre los dos verbos el orden es información\",\"body\":\"$17\",\"table\":[[\"pieza\",\"sitio\",\"calco que suena raro\"],[\"es ihm\",\"pronombres primero, Akk antes que Dat\",\"gestern ihm es\"],[\"te-ka-mo-lo\",\"tiempo → causa → modo → lugar\",\"nach München morgen\"],[\"nicht + Partizip\",\"delante de la segunda pieza\",\"habe nicht den Bericht\"],[\"Vorfeld\",\"UNA pieza, y se elige\",\"Ich, Ich, Ich…\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m1l5e1\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich habe gestern ihm es gegeben.\",\"answers\":[\"Ich habe es ihm gestern gegeben.\"],\"why\":\"Los pronombres van delante de todo, y el acusativo (es) delante del dativo (ihm). El español pone el tiempo primero; el alemán, los pronombres.\",\"translation\":\"Se lo di ayer.\",\"itemIds\":[\"b2m1esihm\"]},{\"id\":\"b2m1l5e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Ich h
