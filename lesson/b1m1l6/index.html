js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T95a,"])</script><script>self.__next_f.push([1,"Am Montag um neun Uhr stand Marlene Gruber zum ersten Mal vor dem [[Altbau|edificio antiguo]] in der Kaiserstraße. Sie war nicht allein. Vor der Haustür warteten schon dreißig Leute, die alle dasselbe wollten: die Wohnung im dritten Stock. 60 Quadratmeter, 890 Euro Warmmiete, ein kleiner Balkon.\n\n„Ich habe gedacht, dass ich viel zu früh bin“, erzählt Marlene und lacht. „Am Ende war ich die Letzte in der [[Schlange|cola]].“ Die Besichtigung dauerte genau zwölf Minuten. Danach ging sie die [[Stiege|escalera — en Austria; en Alemania se dice „die Treppe“]] hinunter und wusste schon: Diese Wohnung bekomme ich nie.\n\nMarlene ist Krankenschwester und verdient nicht schlecht. Trotzdem sucht sie seit fünf Monaten. In Wien, in Zürich, in Berlin oder in München ist die Wohnungssuche zu einem [[Wettbewerb|competición]] geworden. Wer eine Wohnung will, die zentral liegt und bezahlbar ist, braucht drei Dinge: einen guten Vertrag, ein hohes Gehalt und sehr viel Glück. In den letzten zehn Jahren sind die Mieten in vielen Städten um mehr als vierzig Prozent gestiegen. Die [[Löhne|los sueldos]] nicht.\n\nDie Vermieter bekommen für jede Anzeige zweihundert Mails. Deshalb entscheiden sie oft in zwei Minuten. „Sie suchen nicht den Menschen, der die Wohnung am dringendsten braucht“, sagt eine [[Mitarbeiterin|empleada]] einer Beratungsstelle. „Sie suchen den Mieter, den sie am wenigsten fürchten müssen: keine Kinder, kein Haustier, keine Probleme.“\n\nWas tun? Die Stadt Wien baut seit hundert Jahren [[Gemeindewohnungen|viviendas municipales]] und hat damit die Mieten lange niedrig gehalten. Fast die Hälfte der Wiener lebt heute in einer Wohnung, die der Stadt gehört oder von ihr [[gefördert|subvencionada]] wird. Deshalb sind die Mieten dort niedriger als in München, obwohl beide Städte ähnlich groß sind. In Deutschland dagegen sind viele öffentliche Wohnungen verkauft worden. Fachleute fordern deshalb, dass wieder mehr gebaut wird. Andere sagen, dass Bauen allein nicht reicht, solange die Mieten schneller steigen als die [[Löhne|los sueldos]].\n\nUnd Marlene? Nach dem sechsundzwanzigsten Termin hat sie eine Zusage bekommen — für ein Zimmer in einer WG, zwanzig Minuten außerhalb. „Ich habe nicht die Wohnung gefunden, die ich wollte“, sagt sie. „Aber ich habe eine gefunden, die ich bezahlen kann. Im Moment ist das dasselbe.“"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l6\",\"phaseId\":\"b1m1\",\"title\":\"200 Bewerber für 60 Quadratmeter\",\"subtitle\":\"Lectura larga — la crisis de la vivienda, contada desde Viena\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Cinco palabras que cargan el texto\",\"itemIds\":[\"b1m1wohnungsnot\",\"b1m1steigendemieten\",\"b1m1bezahlbar\",\"b1m1sichleistenkoennen\",\"b1m1altbau\",\"b1m1stiege\",\"b1m1zusage\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: cómo se lee un texto de B1\",\"body\":\"Vas a leer 320 palabras de una revista vienesa. \u003cb\u003eNo hace falta entender cada palabra\u003c/b\u003e — hace falta entender qué quiere decir quien escribe. Tres reglas:\u003cbr/\u003e\u003cbr/\u003e1. \u003cb\u003eLee el título primero\u003c/b\u003e y adivina de qué va. El título ya es media comprensión.\u003cbr/\u003e2. \u003cb\u003eNo pares en cada palabra nueva.\u003c/b\u003e Las difíciles están glosadas — tócalas si te bloquean, sáltalas si no.\u003cbr/\u003e3. Al final hay \u003cb\u003ecinco preguntas, y tres son de inferencia\u003c/b\u003e: la respuesta no está escrita con esas palabras, hay que deducirla. Eso es exactamente el Lesen Teil 2 del examen.\u003cbr/\u003e\u003cbr/\u003eNota plurizéntrica, como en el examen real: el texto es austriaco. Verás \u003cb\u003edie [[Stiege|escalera — palabra austriaca; en Alemania: die Treppe]]\u003c/b\u003e, que en Alemania sería «die Treppe». El Goethe pone estos austriacismos a pie de página, igual que aquí.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l6e1\",\"type\":\"read\",\"prompt\":\"Lee el reportaje y responde. Tócate las palabras subrayadas si te bloquean.\",\"title\":\"200 Bewerber für 60 Quadratmeter\",\"source\":\"Aus einem Onlinemagazin aus Wien (bearbeitet)\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m1l6e1q1\",\"q\":\"Wie lange dauerte die Besichtigung?\",\"options\":[\"Zwölf Minuten\",\"Zwei Minuten\",\"Zwanzig Minuten\"],\"answer\":0,\"why\":\"„Die Besichtigung dauerte genau zwölf Minuten.“ Los dos minutos son lo que tardan los caseros en decidir.\"},{\"id\":\"b1m1l6e1q2\",\"q\":\"Was will die Mitarbeiterin der Beratungsstelle sagen?\",\"options\":[\"Die Vermieter wählen nach Risiko, nicht nach Bedarf.\",\"Die Vermieter bevorzugen Familien mit Kindern.\",\"Die Vermieter entscheiden nach dem Zufall.\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice con esas palabras: lo deduces de «den Mieter, den sie am wenigsten fürchten müssen» y de la lista «keine Kinder, kein Haustier, keine Probleme».\"},{\"id\":\"b1m1l6e1q3\",\"q\":\"Was ist die Hauptaussage des Textes?\",\"options\":[\"Krankenschwestern verdienen zu wenig Geld.\",\"Wien baut zu wenige neue Häuser.\",\"Die Wohnungssuche ist ein Wettbewerb geworden, den nicht der Bedarf entscheidet.\"],\"answer\":2,\"inference\":true,\"why\":\"Todo el texto —la cola, los doscientos correos, la decisión en dos minutos, el final de Marlene— apunta a lo mismo: gana quien menos riesgo parece, no quien más lo necesita.\"},{\"id\":\"b1m1l6e1q4\",\"q\":\"Warum sagt Marlene am Ende: „Im Moment ist das dasselbe“?\",\"options\":[\"Weil das WG-Zimmer genauso groß ist wie die Wohnung.\",\"Weil eine Wohnung, die sie nicht bezahlen kann, für sie keine Wohnung ist.\",\"Weil sie in der WG genauso viel Miete zahlt wie vorher.\"],\"answer\":1,\"inference\":true,\"why\":\"Compara «die Wohnung, die ich wollte» con «eine, die ich bezahlen kann»: ha bajado el listón hasta que las dos cosas significan lo mismo.\"},{\"id\":\"b1m1l6e1q5\",\"q\":\"Was hat Wien anders gemacht als viele deutsche Städte?\",\"options\":[\"Es hat die öffentlichen Wohnungen verkauft.\",\"Es hat seit hundert Jahren Gemeindewohnungen gebaut.\",\"Es hat die Mieten per Gesetz verboten.\"],\"answer\":1,\"why\":\"„Die Stadt Wien baut seit hundert Jahren Gemeindewohnungen“ — en Alemania, en cambio, se vendieron muchas viviendas públicas.\"}],\"itemIds\":[\"b1m1wohnungsnot\",\"b1m1altbau\",\"b1m1stiege\",\"b1m1zusage\",\"b1m1bezahlbar\"],\"tip\":\"¿Fallaste alguna de inferencia? Normal la primera vez: en A2 la respuesta estaba escrita, en B1 hay que deducirla. Vuelve al párrafo y busca las DOS frases que, juntas, la sostienen.\"},{\"id\":\"b1m1l6e2\",\"type\":\"mc\",\"prompt\":\"Vocabulario del texto\",\"question\":\"„Ich kann mir die Wohnung nicht leisten.“\",\"options\":[\"No me puedo permitir el piso\",\"No encuentro el piso\",\"No me gusta el piso\"],\"answer\":0,\"whyWrong\":[null,\"«encontrar» sería finden\",\"«gustar» sería gefallen\"],\"itemIds\":[\"b1m1sichleistenkoennen\"],\"tip\":\"sich etwas leisten können = poder permitirse algo. Es la frase clave de todo el tema vivienda en B1.\"},{\"id\":\"b1m1l6e3\",\"type\":\"cloze\",\"prompt\":\"Completa la palabra del problema\",\"text\":\"In vielen Städten gibt es eine große ___: zu wenige Wohnungen für zu viele Menschen.\",\"answers\":[\"Wohnungsnot\"],\"translation\":\"En muchas ciudades hay una gran escasez de vivienda: demasiado pocos pisos para demasiada gente.\",\"hints\":[\"Wohnung + die Not (la necesidad, la penuria)\",\"Woh-nungs-not\"],\"itemIds\":[\"b1m1wohnungsnot\"]},{\"id\":\"b1m1l6e4\",\"type\":\"mc\",\"prompt\":\"Participio como adjetivo\",\"question\":\"„die steigenden Mieten“ significa...\",\"options\":[\"los alquileres que suben\",\"los alquileres que han subido\",\"los alquileres altos\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «die gestiegenen Mieten», con participio de pasado\",\"Eso sería «die hohen Mieten»\"],\"itemIds\":[\"b1m1steigendemieten\"],\"tip\":\"El español dice «los precios QUE SUBEN» (relativa); el alemán lo empaqueta en un adjetivo: steigend + terminación. Nunca sale por transferencia: hay que decidir usarlo.\"},{\"id\":\"b1m1l6e5\",\"type\":\"transform\",\"prompt\":\"De relativa a participio\",\"source\":\"die Mieten, die steigen\",\"instruction\":\"Dilo en una sola pieza, con el participio como adjetivo\",\"answers\":[\"die steigenden Mieten\"],\"translation\":\"los alquileres que suben\",\"hints\":[\"steigen → steigend + terminación de plural\",\"die ...enden Mieten\"],\"itemIds\":[\"b1m1steigendemieten\"],\"tip\":\"Relativa ↔ participio atributivo: la transformación que sube el criterio «Strukturen: Spektrum» del examen.\"},{\"id\":\"b1m1l6e6\",\"type\":\"gapbank\",\"prompt\":\"Resume el texto completando los huecos\",\"text\":\"Marlene sucht eine Wohnung, ___ bezahlbar ist. Bei der Besichtigung waren dreißig Leute, ___ alle dasselbe wollten. Am Ende hat sie ein Zimmer gefunden, ___ sie bezahlen kann.\",\"answers\":[\"die\",\"die\",\"das\"],\"bank\":[\"die\",\"das\",\"der\",\"den\",\"dass\",\"als\"],\"translation\":\"Marlene busca un piso que sea asequible. En la visita había treinta personas que querían todas lo mismo. Al final ha encontrado una habitación que puede pagar.\",\"itemIds\":[\"b1m1bezahlbar\",\"b1m1besichtigung\",\"zimmer\"],\"tip\":\"Tres relativos seguidos, dos de sujeto y uno de objeto — y en femenino/neutro la forma no cambia. Por eso el masculino es el único que hay que pensar.\"},{\"id\":\"b1m1l6e7\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Die Mieten steigen schneller wie die Löhne.\",\"answers\":[\"Die Mieten steigen schneller als die Löhne.\"],\"why\":\"Comparación de desigualdad → «als». «wie» se reserva para «tan ... como» (so schnell wie).\",\"translation\":\"Los alquileres suben más rápido que los sueldos.\",\"itemIds\":[\"b1m1als\",\"b1m1steigendemieten\"]},{\"id\":\"b1m1l6e8\",\"type\":\"mc\",\"prompt\":\"El austriacismo del texto\",\"question\":\"„Sie ging die Stiege hinunter.“ ¿Qué palabra usaría un alemán?\",\"options\":[\"die Treppe\",\"die Straße\",\"der Aufzug\"],\"answer\":0,\"whyWrong\":[null,\"die Straße es la calle\",\"der Aufzug es el ascensor — justo lo que un Altbau no tiene\"],\"itemIds\":[\"b1m1stiege\",\"b1m1treppenhaus\"],\"tip\":\"El examen es plurizéntrico: textos de Austria y Suiza con nota al pie. Si ves una palabra rara con asterisco, la nota te la traduce — no pierdas tiempo.\"},{\"id\":\"b1m1l6e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin usar «leisten»\",\"source\":\"Ich kann mir die Wohnung nicht leisten.\",\"forbid\":[\"leisten\"],\"answers\":[\"Die Wohnung ist zu teuer für mich\",\"Die Wohnung ist für mich zu teuer\",\"Ich habe nicht genug Geld für die Wohnung\",\"Ich kann die Wohnung nicht bezahlen\"],\"translation\":\"No me puedo permitir el piso.\",\"hints\":[\"Dilo con «zu teuer»\",\"Die Wohnung ist zu ... für mich\"],\"itemIds\":[\"b1m1sichleistenkoennen\",\"wohnung\"],\"tip\":\"Rodear la palabra que no te sale es LA habilidad del B1: el descriptor del nivel dice literalmente «compensar definiendo o parafraseando».\"},{\"id\":\"b1m1l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Busco un piso que sea asequible\",\"answers\":[\"Ich suche eine Wohnung, die bezahlbar ist\",\"Ich suche eine Wohnung, die günstig ist\"],\"hints\":[\"Relativo femenino + verbo al final\",\"Ich suche eine Wohnung, die ...\"],\"itemIds\":[\"b1m1bezahlbar\",\"b1m1einewohnungdiehellist\"],\"tip\":\"La frase del texto, ahora en tu boca. Ese es el circuito completo: input largo → producción propia.\"},{\"id\":\"b1m1l6e11\",\"type\":\"audiomc\",\"prompt\":\"Del texto al oído: el mismo tema, ahora en la radio. Hören Teil 1 · tarea 1 de 2, dos escuchas.\",\"audio\":\"… und zum Schluss noch eine Zahl aus Berlin: Auf eine freie Wohnung kommen inzwischen im Schnitt, ähm, über zweihundert Bewerbungen. Bezahlbar ist in der Innenstadt praktisch nichts mehr. Der Mieterverein rät deshalb: Wer sucht, sollte auch die Außenbezirke anschauen — da sind die Mieten zwar auch gestiegen, aber, na ja, immer noch deutlich niedriger.\",\"question\":\"„Auf eine freie Wohnung in Berlin kommen im Schnitt über zweihundert Bewerbungen.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La cifra es justo esa: «im Schnitt … über zweihundert Bewerbungen»\"],\"itemIds\":[\"b1m1wohnungsnot\",\"b1m1bezahlbar\"],\"tip\":\"En un boletín de radio la cifra llega enseguida y no se repite. Apúntala en cuanto suene.\"},{\"id\":\"b1m1l6e12\",\"type\":\"audiomc\",\"prompt\":\"Mismo boletín, segunda tarea. Dos escuchas.\",\"audio\":\"… und zum Schluss noch eine Zahl aus Berlin: Auf eine freie Wohnung kommen inzwischen im Schnitt, ähm, über zweihundert Bewerbungen. Bezahlbar ist in der Innenstadt praktisch nichts mehr. Der Mieterverein rät deshalb: Wer sucht, sollte auch die Außenbezirke anschauen — da sind die Mieten zwar auch gestiegen, aber, na ja, immer noch deutlich niedriger.\",\"question\":\"¿Qué aconseja la asociación de inquilinos?\",\"options\":[\"Buscar también en los barrios de las afueras\",\"Buscar solo en el centro, que es donde hay oferta\",\"Esperar a que bajen los alquileres\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Del centro dice que ya no queda nada asequible\",\"Dice que también fuera han subido: nadie espera bajadas\"],\"itemIds\":[\"b1m1steigendemieten\"],\"tip\":\"«zwar … aber» concede algo para quitártelo después. La opinión de verdad está siempre tras el «aber».\"}]}],\"resources\":[{\"label\":\"derStandard — Wohnen\",\"url\":\"https://www.derstandard.at/\",\"note\":\"Prensa austriaca: busca «Wohnen» o «Mieten» y lee un titular al día. Es el alemán del Lesen Teil 2.\"},{\"label\":\"Nachrichtenleicht\",\"url\":\"https://www.nachrichtenleicht.de/\",\"note\":\"Noticias alemanas en lenguaje sencillo: el escalón perfecto entre el A2 y la prensa real.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
