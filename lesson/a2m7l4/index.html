 tus verbos del dativo: \u003cb\u003epassen\u003c/b\u003e habla de talla, \u003cb\u003estehen\u003c/b\u003e de estilo — \u003ci\u003eDie Hose passt mir nicht\u003c/i\u003e ≠ \u003ci\u003eDie Hose steht mir nicht\u003c/i\u003e.\",\"table\":[[\"la queja\",\"qué pasa\",\"qué pides\"],[\"zu eng\",\"te aprieta\",\"eine Nummer größer\"],[\"zu weit\",\"te queda holgado\",\"eine Nummer kleiner\"],[\"zu teuer\",\"se sale del presupuesto\",\"etwas Billigeres... o Rabatt\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2m7l4e1\",\"type\":\"match\",\"prompt\":\"Empareja el vocabulario de tienda\",\"pairs\":[{\"target\":\"die Umkleidekabine\",\"source\":\"el probador\"},{\"target\":\"eng\",\"source\":\"estrecho / ajustado\"},{\"target\":\"weit\",\"source\":\"ancho / holgado\"},{\"target\":\"der Rabatt\",\"source\":\"el descuento\"}],\"itemIds\":[\"a2m7umkleidekabine\",\"a2m7eng\",\"a2m7weit\",\"a2m7rabatt\"]},{\"id\":\"a2m7l4e2\",\"type\":\"mc\",\"prompt\":\"El chunk de las ofertas\",\"question\":\"«La camiseta está de oferta» →\",\"options\":[\"Das T-Shirt ist in Angebot\",\"Das T-Shirt ist im Angebot\"],\"answer\":1,\"whyWrong\":[\"Falta la contracción: in + dem = im — el chunk fijo es «im Angebot», con dativo escondido\",null],\"itemIds\":[\"a2m7imangebot\",\"tshirt\"],\"tip\":\"im Angebot = la etiqueta naranja del supermercado alemán. Apréndelo como bloque — el dativo va incluido.\"},{\"id\":\"a2m7l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta clave\",\"text\":\"Entschuldigung, wo ist die ___? (el probador)\",\"answers\":[\"Umkleidekabine\"],\"translation\":\"Perdone, ¿dónde está el probador?\",\"hints\":[\"Um + kleide + kabine — la cabina de cambiarse\",\"Con mayúscula: es un sustantivo\"],\"itemIds\":[\"a2m7umkleidekabine\"],\"tip\":\"Palabra compuesta transparente: umkleiden (cambiarse de ropa) + Kabine. El alemán te la deletrea solo.\"},{\"id\":\"a2m7l4e4\",\"type\":\"mc\",\"prompt\":\"¿eng o weit?\",\"question\":\"La camisa te aprieta. Dices:\",\"opt
