s y muy formales, pero \u003cb\u003ewürde gehen / würde kommen\u003c/b\u003e es igual de correcto y muchísimo más frecuente. Basta con reconocerlas.\u003cbr/\u003e\u003cbr/\u003e*\u003ci\u003eIch würde Zeit haben\u003c/i\u003e es el error diagnóstico del nivel: se dice \u003cb\u003eIch hätte Zeit\u003c/b\u003e. Para el resto de verbos, \u003cb\u003ewürde + infinitivo\u003c/b\u003e es la forma normal y correcta: \u003ci\u003eIch würde mit ihr reden\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eLas tres fórmulas de consejo que cubren el 90 % de las situaciones:\u003cbr/\u003e• \u003cb\u003eAn deiner Stelle würde ich…\u003c/b\u003e (yo en tu lugar…) — la más suave.\u003cbr/\u003e• \u003cb\u003eDu solltest…\u003c/b\u003e (deberías…) — directa pero educada.\u003cbr/\u003e• \u003cb\u003eEs wäre besser, wenn du…\u003c/b\u003e (sería mejor que…) — la más diplomática; ojo, tras \u003ci\u003ewenn\u003c/i\u003e el verbo se va al final.\u003cbr/\u003e\u003cbr/\u003eY para el reproche mirando atrás: \u003cb\u003eDas hätte ich nicht sagen sollen\u003c/b\u003e (no debería haber dicho eso) — [[hätte|habría]] + infinitivo + \u003ci\u003esollen\u003c/i\u003e, los tres al final y en ese orden."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m10l3\",\"phaseId\":\"b1m10\",\"title\":\"An deiner Stelle würde ich…\",\"subtitle\":\"Dar consejo en Konjunktiv II — las tres fórmulas que lo hacen todo\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas del consejo\",\"itemIds\":[\"b1m10andeinerstelle\",\"b1m10dusolltest\",\"b1m10eswaerebesserwenn\",\"b1m10koenntestdu\",\"b1m10waeresmoeglich\",\"b1m10haettesagensollen\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Konjunktiv II: cuándo würde y cuándo NO\",\"body\":\"$17\",\"table\":[[\"indicativo\",\"Konjunktiv II\",\"uso típico\"],[\"ich habe\",\"ich hätte\",\"Ich hätte gern… / Das hätte ich nicht gesagt\"],[\"ich bin\",\"ich wäre\",\"Es wäre besser, wenn…\"],[\"ich kann\",\"ich kön e, könnte, müsste, möchte, wollte, wüsste. «Wenn ich Zeit haben würde» se oye en la calle y nadie te va a decir que sea agramatical, pero en el examen la forma que puntúa es la sintética: en la subordinada con wenn, hätte. Y así te ahorras el segundo würde.\",\"translation\":\"Si tuviera más tiempo, te visitaría.\",\"itemIds\":[\"b1m10eswaerebesserwenn\"]},{\"id\":\"b1m10l3e4\",\"type\":\"transform\",\"prompt\":\"Output 1 — hazlo cortés\",\"source\":\"Kannst du mir helfen?\",\"instruction\":\"Ponlo en Konjunktiv II (forma sintética)\",\"answers\":[\"Könntest du mir helfen?\",\"Könntest du mir bitte helfen?\"],\"translation\":\"¿Podrías ayudarme?\",\"hints\":[\"kann → k__nnte\",\"Könntest du …?\"],\"itemIds\":[\"b1m10koenntestdu\"]},{\"id\":\"b1m10l3e5\",\"type\":\"transform\",\"prompt\":\"Output 2 — del imperativo al consejo\",\"source\":\"Entschuldige dich bei ihr!\",\"instruction\":\"Dilo como consejo con «Du solltest …»\",\"answers\":[\"Du solltest dich bei ihr entschuldigen\",\"Du solltest dich bei ihr entschuldigen.\"],\"translation\":\"Deberías pedirle perdón.\",\"hints\":[\"Du solltest dich bei ihr …\",\"El infinitivo cierra la frase\"],\"itemIds\":[\"b1m10dusolltest\",\"b1m10sichentschuldigenbei\"]},{\"id\":\"b1m10l3e6\",\"type\":\"gapbank\",\"prompt\":\"Rellena los consejos a un amigo\",\"text\":\"___ deiner Stelle ___ ich sofort mit ihr reden. Du ___ ihr wenigstens schreiben. Und es ___ besser, wenn du dich nicht wieder aufregst.\",\"answers\":[\"An\",\"würde\",\"solltest\",\"wäre\"],\"bank\":[\"An\",\"würde\",\"solltest\",\"wäre\",\"In\",\"werde\",\"solltet\",\"wären\"],\"translation\":\"Yo en tu lugar hablaría con ella enseguida. Deberías al menos escribirle. Y sería mejor que no volvieras a alterarte.\",\"hints\":[\"«A-n deiner Stelle» es fijo: nunca «In»\",\"El sujeto es «es», en singular: w__re, no w__ren\"],\"itemIds\":[\"b1m10andeinerstelle\",\"b1m10dusolltest\",\"b1m10eswaerebesserwenn\"],\"tip\":\"Las tres fórmulas seguidas suenan a amigo que se preocupa, no a jefe. Es el tono que se pide en el Sprechen Teil 1.\"},{\"id\":\"b1m10l3e7\",\"type\":\"build\",\"prompt\":\"Construye el reproche mirando atrás\",\"target\":\"Das hätte ich nicht sagen sollen\",\"translation\":\"No debería haber dicho eso\",\"distractors\":[\"habe\",\"a2m1gesagt\"],\"altTargets\":[\"Ich hätte das nicht sagen sollen\"],\"itemIds\":[\"b1m10haettesagensollen\"],\"tip\":\"Orden fijo del irreal del pasado con modal: hätte … + infinitivo + sollen. Nunca «gesagt sollen».\"},{\"id\":\"b1m10l3e8\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula diplomática\",\"text\":\"Es ___ besser, wenn wir in Ruhe darüber reden.\",\"answers\":[\"wäre\"],\"translation\":\"Sería mejor que habláramos con calma sobre ello.\",\"hints\":[\"sein en Konjunktiv II\",\"w__re\"],\"itemIds\":[\"b1m10eswaerebesserwenn\"],\"tip\":\"Tras «wenn» el alemán hablado deja el indicativo (…wenn wir reden) y nadie te lo corrige. Escrito y en el examen queda mejor el Konjunktiv II: «…, wenn wir in Ruhe darüber reden würden». Las dos se aceptan aquí.\"},{\"id\":\"b1m10l3e9\",\"type\":\"listen\",\"prompt\":\"Escucha el consejo\",\"text\":\"An deiner Stelle würde ich mit ihr reden\",\"translation\":\"Yo en tu lugar hablaría con ella\",\"hints\":[\"Empieza por An deiner …\",\"… würde ich mit ihr reden\"],\"itemIds\":[\"b1m10andeinerstelle\"]},{\"id\":\"b1m10l3e10\",\"type\":\"speak\",\"prompt\":\"Afectiva — di en voz alta el consejo que TÚ darías\",\"text\":\"An deiner Stelle würde ich sofort anrufen. An deiner Stelle würde ich erst einmal warten.\",\"phonetic\":\"an DAI-na SHTE-le VÜA-de ij zo-FOAT AN-ru-fen / … east AIN-mal VAR-ten\",\"translation\":\"Yo en tu lugar llamaría enseguida. / Yo en tu lugar esperaría primero.\",\"itemIds\":[\"b1m10andeinerstelle\"],\"tip\":\"Las dos frases tienen la misma forma y contenido opuesto: elegir una te obliga a procesar el significado con el Konjunktiv II ya puesto.\"},{\"id\":\"b1m10l3e11\",\"type\":\"paraphrase\",\"prompt\":\"El mismo consejo, más suave\",\"source\":\"Du musst dich entschuldigen!\",\"forbid\":[\"musst\",\"müssen\"],\"answers\":[\"An deiner Stelle würde ich mich entschuldigen\",\"Du solltest dich vielleicht entschuldigen\",\"Du solltest dich entschuldigen\",\"Es wäre besser, wenn du dich entschuldigst\",\"Es wäre besser, wenn du dich entschuldigen würdest\",\"Ich würde mich an deiner Stelle entschuldigen\"],\"translation\":\"Yo en tu lugar pediría perdón.\",\"hints\":[\"An deiner Stelle würde ich …\",\"O bien: Du solltest …\"],\"itemIds\":[\"b1m10andeinerstelle\",\"b1m10dusolltest\",\"b1m10sichentschuldigenbei\"],\"tip\":\"«Du musst» es una orden. El Konjunktiv II convierte la orden en consejo sin cambiar el contenido: eso es la cortesía alemana.\"},{\"id\":\"b1m10l3e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Yo en tu lugar hablaría con ella; sería mejor que no esperaras más.\",\"answers\":[\"An deiner Stelle würde ich mit ihr reden. Es wäre besser, wenn du nicht länger wartest\",\"An deiner Stelle würde ich mit ihr reden. Es wäre besser, wenn du nicht länger wartest.\",\"An deiner Stelle würde ich mit ihr sprechen. Es wäre besser, wenn du nicht länger wartest\",\"An deiner Stelle würde ich mit ihr reden. Es wäre besser, wenn du nicht länger warten würdest\",\"An deiner Stelle würde ich mit ihr reden. Es wäre besser, wenn du nicht länger warten würdest.\"],\"hints\":[\"An deiner Stelle würde ich …\",\"Es wäre besser, wenn du … (verbo al final)\"],\"itemIds\":[\"b1m10andeinerstelle\",\"b1m10eswaerebesserwenn\"],\"tip\":\"Dos consejos encadenados con dos formas distintas de Konjunktiv II: exactamente lo que se pide en el Sprechen Teil 1 para negociar.\"}]}],\"resources\":[{\"label\":\"DW — Deutsch lernen, Konjunktiv II\",\"url\":\"https://learngerman.dw.com/de/grammatik/c-56599699\",\"note\":\"Explicación y ejercicios del Konjunktiv II con las formas sintéticas del grupo cerrado.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\"
