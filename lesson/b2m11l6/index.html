_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T9ff,"])</script><script>self.__next_f.push([1,"Die Winsstraße nach Mitternacht ist keine Idylle. Wer um vier zur Schicht muss, steht an einer Haltestelle, an der nichts kommt. Das ist die Kernaussage, und sie braucht keine Moral. Im Wesentlichen fehlt eine Verbindung, nicht ein Vortrag über das Auto.\n\nLaut Zahlen des Bezirks sind in diesem Kiez dreihundert Menschen in Pflege, Küche, Reinigung mit Schichtbeginn vor sechs. Nach Angaben der BVG fährt die letzte Tram kurz nach Mitternacht. Demgegenüber bleibt das Auto die einzige planbare Option — nicht aus Trotz, aus Fahrplan. Wer das als Hobby der Autofahrer verkauft, missversteht die Tagesordnung.\n\nIch bin für den Nachtbus. Das heißt nicht, dass ich gegen jeden Parkplatz bin. Es heißt, dass die Voraussetzung für den Verzicht eine Linie ist, die existiert. Details wie die Farbe der Haltestelle, das Modell des Fahrzeugs, der Name der Kampagne lasse ich weg: sie gehören nicht ins Fazit.\n\nIm Gegensatz zu dem, was in der Bewohnerversammlung oft gesagt wird, ist der Bus keine Strafe für den Laden unten. Ein Laden, der von Schichtarbeiterinnen lebt, lebt auch von ihrer Ankunft. So die Betreiberin der Bäckerei in der zweiten Reihe, die ich zitieren darf: ohne Frühschicht keine Brötchen um sieben. Das ist keine Pointe. Das ist der wesentliche Inhalt.\n\nZusammenfassend lässt sich sagen: der Bezirk kann den Takt bestellen. Er kann ihn auch weiter der Grafik überlassen, in der die Pendler nicht vorkommen. Beides ist eine Entscheidung. Nur eines von beiden ist eine Lösung. Mit anderen Worten: wer den Bus verweigert, weil jemand irgendwo einmal falsch geparkt hat, verwechselt Ursache und Anekdote.\n\nIch bitte die Moderation, das so ins Protokoll zu nehmen — ohne meine Adjektive, mit der Forderung. Der Dritte, der morgen nur das Protokoll liest, muss verstehen, was gefordert wird, nicht, wen ich unmöglich finde. Das ist vermitteln. Alles andere ist ein Leserbrief mit Datum.\n\nNoch ein Satz an die Gegenposition, ohne sie zu verhöhnen: wer den Parkraum verteidigt, verteidigt oft denselben Arbeitsweg, nur von der anderen Seite. Die Diskrepanz liegt nicht im Willen. Sie liegt in der Frage, welche Lücke man zuerst schließt. Ich gehe davon aus, dass beides auf die Tagesordnung gehört. Nur nicht als Feindschaft. Die Vermittlung, die ich der Moderation zumute, ist genau das: zwei Lücken stehen lassen, ohne aus der Nachtschicht einen Feind des Ladens zu machen. Wer das nicht ins Protokoll nimmt, hat den Ausgangstext nicht gelesen, sondern sortiert. Ein Dritter braucht beide Sätze. Einen Feind braucht er nicht."])</script><script>self.__next_f.push([1,"18:T9e4,"])</script><script>self.__next_f.push([1,"Sehr geehrte Damen und Herren, ich wohne in der Winsstraße und schreibe nicht, weil ich das Auto verehre. Ich schreibe, weil der Laden unter uns ohne Halt vor der Tür stirbt. Das ist meine Kernaussage. Alles andere ist Beiwerk.\n\nIm Gegensatz zu dem Kommentar von Frau Hofmann sehe ich nachts nicht zuerst die Schicht. Ich sehe die Kundschaft, die um halb acht noch Brot kauft, weil sie selbst Schicht hatte — und die nicht drei Straßen weiter trägt, wenn der letzte Platz weg ist. Dem Artikel zufolge ist der Bus die Voraussetzung. Demgegenüber ist für uns der Halt die Voraussetzung. Beide Sätze können wahr sein. In der Winsstraße sind sie es nicht zur selben Zeit.\n\nNach Angaben des Einzelhandels im Kiez sind in zwei Jahren vier Läden geschlossen worden, sobald die Parkspur zur «Begegnungszone» wurde. Ich zitiere keine Moral. Ich zitiere Kassen. Wohingegen der Bus in der Grafik der Redaktion schon als Lösung dasteht, steht er in unserer Straße noch als Versprechen. Ein Versprechen füllt kein Regal.\n\nIch bitte, das Protokoll ohne meine Verärgerung zu schreiben und mit der Forderung: kein Nachtnetz, das den Parkraum ersatzlos streicht. Sich der eigenen Meinung enthalten heißt hier: meine Adjektive dürfen fehlen, die Zahl der geschlossenen Läden nicht. Details wie mein Alter oder der Name meiner Katze gehören nicht ins Fazit. Die Diskrepanz schon.\n\nBeide Texte stimmen darin überein, dass nachts etwas fehlt. Die Autorin nennt den Takt. Ich nenne den Halt. Mit anderen Worten: wir verhandeln zwei Lücken, als wäre es eine. Das ist der Fehler der Tagesordnung, nicht der Charakter der Nachbarn.\n\nZusammenfassend lässt sich sagen: ich bin nicht gegen den Bus. Ich bin gegen eine Lösung, die den Laden als Kollateralschaden verbucht. Der Dritte, der nur das Protokoll liest, soll das so wiedergegeben bekommen — umgeschrieben, wo meine Sätze zu scharf sind, aber nicht umgedreht. Vermitteln ist nicht schlichten um jeden Preis. Vermitteln ist, beide Kernaussagen stehen zu lassen.\n\nEin letzter Satz an die Moderation: wenn Lena Krüger das Wort erteilt, möchte ich nicht als der Mann vom Auto erscheinen. Ich möchte als der Nachbar vom Laden erscheinen. Das ist keine Kleinigkeit. Das ist, wen der Dritte morgen vor sich hat. Die Vermittlung, die ich mir wünsche, lässt den Halt vor der Tür stehen, auch wenn die Nachtschicht zu Recht den Bus verlangt. Zwei Sätze, ein Protokoll. Wer nur einen stehen lässt, hat nicht vermittelt. Er hat Partei ergriffen und es Zusammenfassung genannt."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b2m11l6\",\"phaseId\":\"b2m11\",\"title\":\"Zwei Quellen, ein Protokoll\",\"subtitle\":\"Hofmann y Vogel no se ponen de acuerdo — tú se lo cuentas a un tercero\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El tercero no ha leído nada\",\"itemIds\":[\"b2m5vermitteln\",\"b2m11derdritte\",\"b2m11wiedergeben\",\"b2m11vermittlung\",\"b2m6nachtschicht\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El tercero no tiene el original: si copias, no entiende; si opinas, no se fía\",\"body\":\"Lena ha convocado el debate. Clara Hofmann ha publicado un comentario. Herr Vogel, vecino jubilado de Sofía, ha escrito al distrito. Los dos textos se contradicen. Tu trabajo —el de Sofía en el protocolo, el tuyo en esta lección— es resumir y contrastar: que un tercero que no ha leído las fuentes sepa qué se sostiene, dónde coinciden y dónde no. Sin tu bando.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m11l6e1\",\"type\":\"read\",\"prompt\":\"Fuente A. Subraya la Kernaussage, no el ejemplo del segundo párrafo.\",\"title\":\"Der Kiez braucht den Bus, nicht das schlechte Gewissen\",\"source\":\"Clara Hofmann, Kommentar, Lokalredaktion Berlin\",\"text\":\"$17\",\"questions\":[{\"id\":\"b2m11l6e1q1\",\"q\":\"Was ist laut Hofmann die Kernaussage?\",\"options\":[\"Die Farbe der Haltestelle sei falsch.\",\"Nach Mitternacht fehlt eine Verbindung für die Schicht.\",\"Der Laden unten müsse schließen.\"],\"answer\":1,\"why\":\"Primer párrafo: «Im Wesentlichen fehlt eine Verbindung, nicht ein Vortrag über das Auto.»\"},{\"id\":\"b2m11l6e1q2\",\"q\":\"Was soll ins Protokoll, was nicht?\",\"options\":[\"Ihre Adjektive und wen sie unmöglich findet.\",\"Die Forderung, ohne ihre Adjektive, so dass ein Dritter sie versteht.\",\"Nur das Zitat der Bäckerei.\"],\"answer\":1,\"why\":\"«ohne meine Adjektive, mit der Forderung. Der Dritte […] muss verstehen, was gefordert wird.»\"},{\"id\":\"b2m11l6e1q3\",\"q\":\"Wie steht Hofmann zum Parkplatz?\",\"options\":[\"Sie will alle Parkplätze abschaffen.\",\"Sie ist für den Bus und sagt ausdrücklich, das heiße nicht, gegen jeden Parkplatz zu sein.\",\"Sie ignoriert den Laden.\"],\"answer\":1,\"inference\":true,\"why\":\"«Das heißt nicht, dass ich gegen jeden Parkplatz bin.» La tesis es el bus como presupuesto, no la guerra al bordillo.\"},{\"id\":\"b2m11l6e1q4\",\"q\":\"Wozu dient das Zitat der Bäckerei?\",\"options\":[\"Als Pointe gegen Vogel.\",\"Als Beleg, dass der Laden von der Schicht lebt, nicht gegen sie.\",\"Als Detail, das ins Fazit gehört wie die Farbe der Haltestelle.\"],\"answer\":1,\"why\":\"«ohne Frühschicht keine Brötchen um sieben. Das ist keine Pointe. Das ist der wesentliche Inhalt.»\"},{\"id\":\"b2m11l6e1q5\",\"q\":\"Wo sieht Hofmann die Diskrepanz mit der Gegenposition?\",\"options\":[\"Im Willen der Anwohner, die das Auto lieben.\",\"Nicht im Willen, sino en qué laguna se cierra primero.\",\"En que Vogel no ha leído las cifras.\"],\"answer\":1,\"inference\":true,\"why\":\"Cierre: «Die Diskrepanz liegt nicht im Willen. Sie liegt in der Frage, welche Lücke man zuerst schließt.»\"}],\"itemIds\":[\"b2m11kernaussage\",\"b2m5vermitteln\",\"b2m11derdritte\",\"b2m11fazit\",\"b2m11ausgangstext\"]},{\"id\":\"b2m11l6e2\",\"type\":\"read\",\"prompt\":\"Fuente B. Contrasta. El tercero necesita las DOS, no tu favorita.\",\"title\":\"Ohne Halt vor der Tür kein Laden\",\"source\":\"Herr Vogel, Schreiben an das Bezirksamt Prenzlauer Berg\",\"text\":\"$18\",\"questions\":[{\"id\":\"b2m11l6e2q1\",\"q\":\"Was ist Vogels Kernaussage?\",\"options\":[\"Er verehrt das Auto.\",\"Ohne Halt vor der Tür stirbt der Laden.\",\"Der Bus sei grundsätzlich falsch.\"],\"answer\":1,\"why\":\"Lo declara al principio y lo repite al final: no está contra el bus, está contra perder el Halt.\"},{\"id\":\"b2m11l6e2q2\",\"q\":\"Worin stimmen beide Texte überein?\",\"options\":[\"Dass der Bus sofort kommen muss.\",\"Dass nachts etwas fehlt.\",\"Dass der Laden schließen soll.\"],\"answer\":1,\"why\":\"Vogel lo escribe con la fórmula del módulo: «Beide Texte stimmen darin überein, dass nachts etwas fehlt.»\"},{\"id\":\"b2m11l6e2q3\",\"q\":\"Was darf laut Vogel im Protokoll fehlen — und was nicht?\",\"options\":[\"Die Zahl der geschlossenen Läden darf fehlen.\",\"Seine Verärgerung darf fehlen; die Zahl der geschlossenen Läden nicht.\",\"Die Diskrepanz darf fehlen.\"],\"answer\":1,\"inference\":true,\"why\":\"«meine Adjektive dürfen fehlen, die Zahl der geschlossenen Läden nicht.» Hay que separar enfado y dato.\"},{\"id\":\"b2m11l6e2q4\",\"q\":\"Wie definiert Vogel «vermitteln»?\",\"options\":[\"Schlichten um jeden Preis.\",\"Beide Kernaussagen stehen lassen, umschreiben ohne umzudrehen.\",\"Die Autorin korrigieren.\"],\"answer\":1,\"why\":\"«Vermitteln ist nicht schlichten um jeden Preis. Vermitteln ist, beide Kernaussagen stehen zu lassen.»\"},{\"id\":\"b2m11l6e2q5\",\"q\":\"Worin liegt die Diskrepanz zwischen Hofmann und Vogel?\",\"options\":[\"In der Moral der Autofahrer.\",\"En qué laguna se nombra primero: el Takt o el Halt.\",\"En que uno quiere el bus y el otro no.\"],\"answer\":1,\"inference\":true,\"why\":\"Los dos niegan estar contra el otro objeto. La grieta es la prioridad: conexión nocturna frente a parada ante la tienda. Vogel: «wir verhandeln zwei Lücken, als wäre es eine.»\"}],\"itemIds\":[\"b2m11gegenposition\",\"b2m11diskrepanz\",\"b2m11wiedergeben\",\"b2m11stimmenueberein\"]},{\"id\":\"b2m11l6e3\",\"type\":\"mc\",\"prompt\":\"Lo que el tercero necesita oír primero\",\"question\":\"Sofía abre el protocolo. ¿Qué frase resume sin tomar partido?\",\"options\":[\"Ich finde Hofmann überzeugender.\",\"Beide Seiten sehen nachts eine Lücke; die Diskrepanz liegt in der Ursache.\",\"Vogel verehrt das Auto.\"],\"answer\":1,\"whyWrong\":[\"Opinión: prohibida en el acta\",null,\"Eso es precisamente lo que Vogel pide que no se escriba\"],\"itemIds\":[\"b2m5vermitteln\",\"b2m11diskrepanz\",\"b2m11ohnewertung\",\"b2m11luecke\",\"b2m11haltvorder\"]},{\"id\":\"b2m11l6e4\",\"type\":\"paraphrase\",\"prompt\":\"Síntesis para el tercero, sin las palabras clave de ambos\",\"source\":\"Hofmann fordert den Nachtbus, Vogel verteidigt die Parkplätze.\",\"forbid\":[\"Nachtbus\",\"Parkplätze\",\"fordert\",\"verteidigt\"],\"answers\":[\"Die eine Seite will eine Verbindung nach Mitternacht, die andere den Halt vor der Tür.\",\"Im Wesentlichen stehen eine Nachtlinie und der Halt vor den Läden gegeneinander.\"],\"itemIds\":[\"b2m5vermitteln\",\"b2m11imwesentlichen\",\"b2m11derdritte\"]},{\"id\":\"b2m11l6e5\",\"type\":\"gapbank\",\"prompt\":\"El acta en tres frases\",\"text\":\"Beide Texte stimmen darin ___, dass nachts etwas fehlt. ___ Hofmann nennt den Takt, Vogel den Halt. Die ___ liegt in der Reihenfolge, nicht im Willen.\",\"answers\":[\"überein\",\"Im Gegensatz zu\",\"Diskrepanz\"],\"bank\":[\"überein\",\"Im Gegensatz zu\",\"Diskrepanz\",\"Allerdings\",\"Kumpel\",\"Jänner\"],\"itemIds\":[\"b2m11stimmenueberein\",\"b2m11imgegensatzzu\",\"b2m11diskrepanz\"]},{\"id\":\"b2m11l6e6\",\"type\":\"order\",\"prompt\":\"El orden de una síntesis que se puede leer sin los originales\",\"sentences\":[\"Beide Seiten sehen nachts eine Lücke.\",\"Hofmann nennt die fehlende Verbindung für die Schicht.\",\"Vogel nennt den Halt vor dem Laden.\",\"Die Diskrepanz liegt darin, welche Lücke zuerst geschlossen wird.\"],\"itemIds\":[\"b2m11stimmenueberein\",\"b2m11diskrepanz\"]},{\"id\":\"b2m11l6e7\",\"type\":\"type\",\"prompt\":\"Cierre: una frase de protocolo\",\"question\":\"Ambos coinciden en que de noche falta algo; la discrepancia está en la causa\",\"answers\":[\"Beide stimmen darin überein, dass nachts etwas fehlt; die Diskrepanz liegt in der Ursache\",\"Beide stimmen darin überein, dass nachts etwas fehlt; die Diskrepanz liegt in der Ursache.\"],\"itemIds\":[\"b2m11stimmenueberein\",\"b2m11diskrepanz\"]}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"c
