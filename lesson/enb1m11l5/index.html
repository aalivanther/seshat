.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T8d3,"])</script><script>self.__next_f.push([1,"Un phrasal verb es un verbo con una partícula pegada: \u003ci\u003elook \u003cb\u003eup\u003c/b\u003e\u003c/i\u003e, \u003ci\u003esort \u003cb\u003eout\u003c/b\u003e\u003c/i\u003e, \u003ci\u003eturn \u003cb\u003edown\u003c/b\u003e\u003c/i\u003e. Con un sustantivo detrás casi siempre valen las dos posiciones:\u003cbr/\u003e· \u003ci\u003eI looked \u003cb\u003eup the word\u003c/b\u003e.\u003c/i\u003e = \u003ci\u003eI looked \u003cb\u003ethe word up\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePero con un PRONOMBRE —it, them, him, her— solo hay una posición, y va EN MEDIO:\u003c/b\u003e\u003cbr/\u003e\u003cmark class=\"akk\"\u003e\u003ci\u003eI looked \u003cb\u003eit\u003c/b\u003e up.\u003c/i\u003e — jamás «I looked up it».\u003c/mark\u003e\u003cbr/\u003e· \u003ci\u003eI'll sort \u003cb\u003eit\u003c/b\u003e out.\u003c/i\u003e · \u003ci\u003eCould you turn \u003cb\u003eit\u003c/b\u003e down?\u003c/i\u003e · \u003ci\u003eDon't throw \u003cb\u003ethem\u003c/b\u003e away.\u003c/i\u003e · \u003ci\u003eFill \u003cb\u003eit\u003c/b\u003e in online.\u003c/i\u003e\u003cbr/\u003eEsto no tiene excepciones y no depende del verbo: si el objeto es un pronombre y el phrasal se puede partir, \u003cb\u003ese parte\u003c/b\u003e. El español pone el pronombre delante del verbo entero («lo busqué»), y de ahí sale el calco.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e¿Y los que no se parten?\u003c/b\u003e Los que llevan \u003cb\u003epreposición de verdad\u003c/b\u003e, no partícula. Ahí el pronombre va detrás, pegado a la preposición:\u003cbr/\u003e· \u003ci\u003eThe council are looking \u003cb\u003einto it\u003c/b\u003e.\u003c/i\u003e — nunca «looking it into».\u003cbr/\u003e· \u003ci\u003eI can't put up \u003cb\u003ewith it\u003c/b\u003e.\u003c/i\u003e · \u003ci\u003eShe deals \u003cb\u003ewith them\u003c/b\u003e all day.\u003c/i\u003e · \u003ci\u003eThey get away \u003cb\u003ewith it\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cb\u003eTruco práctico:\u003c/b\u003e los de \u003cb\u003etres piezas\u003c/b\u003e (put up with, get away with, look forward to) \u003cb\u003eno se parten nunca\u003c/b\u003e. Y de los de dos, si dudas, coloca el pronombre en medio: aciertas la gran mayoría de las veces.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLos siete de hoy son los de reclamar, y valen para la carta y para el oral:\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003esort out\u003c/b\u003e — arreglar un lío. \u003ci\u003eI'll sort it out.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003elook up\u003c/b\u003e — buscar un dato. \u003ci\u003eI looked it up on their website.\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003elook into\u003c/b\u003e — estudiar un asunto oficialmente. \u003cb\u003eEs la palabra que quieres que use el ayuntamiento en su respuesta.\u003c/b\u003e\u003cbr/\u003e· \u003cb\u003eturn down\u003c/b\u003e — bajar el volumen (y también rechazar una oferta).\u003cbr/\u003e· \u003cb\u003ethrow away\u003c/b\u003e — tirar a la basura.\u003cbr/\u003e· \u003cb\u003efill in\u003c/b\u003e — rellenar un impreso. (En americano, \u003ci\u003efill out\u003c/i\u003e.)\u003cbr/\u003e· \u003cb\u003eget away with\u003c/b\u003e — salirse con la suya, quedar impune.\u003cbr/\u003e\u003cbr/\u003eY los que ya traías y siguen valiendo: \u003ci\u003eput up with\u003c/i\u003e (m1), \u003ci\u003edeal with\u003c/i\u003e (m2), \u003ci\u003efind out\u003c/i\u003e (m4), \u003ci\u003eput off\u003c/i\u003e y \u003ci\u003ecarry on\u003c/i\u003e (m6)."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m11l5\",\"phaseId\":\"enb1m11\",\"title\":\"I looked it up\",\"subtitle\":\"El pronombre parte los phrasal verbs por la mitad — menos cuando no puede\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Los siete que hacen falta para reclamar algo\",\"itemIds\":[\"enb1m11sortitout\",\"enb1m11lookeditup\",\"enb1m11lookinto\",\"enb1m11turnitdown\",\"enb1m8throwaway\",\"enb1m11fillitin\",\"enb1m11getawaywithit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla del pronombre, que es una y no admite discusión\",\"body\":\"$17\",\"table\":[[\"Con sustantivo\",\"Con pronombre\",\"Lo que NO se dice\"],[\"I looked up the rule.\",\"I looked it up.\",\"I looked up it.\"],[\"I'll sort out the bins.\",\"I'll sort them out.\",\"I'll sort out them.\"],[\"They're looking into the case.\",\"They're looking into it.\",\"They're looking it into.\"],[\"I can't put up with the noise.\",\"I can't put up with it.\",\"I can't put it up with.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m11l5e1\",\"type\":\"match\",\"prompt\":\"Empareja los cuatro phrasal verbs de reclamar\",\"pairs\":[{\"target\":\"I'll sort it out tomorrow.\",\"source\":\"Lo arreglo mañana.\"},{\"target\":\"The council are looking into it.\",\"source\":\"El ayuntamiento lo está estudiando.\"},{\"target\":\"Fill it in online.\",\"source\":\"Rellénalo por internet.\"},{\"target\":\"They always get away with it.\",\"source\":\"Siempre se salen con la suya.\"}],\"itemIds\":[\"enb1m11sortitout\",\"enb1m11lookinto\",\"enb1m11fillitin\",\"enb1m11getawaywithit\"],\"tip\":\"Mira dónde cae el «it» en cada una: en dos va en medio y en dos va al final. No es azar — es si la palabra de detrás es partícula o preposición.\"},{\"id\":\"enb1m11l5e2\",\"type\":\"mc\",\"prompt\":\"La regla del pronombre\",\"question\":\"«Lo busqué en su web» es…\",\"options\":[\"I looked it up on their website.\",\"I looked up it on their website.\",\"I it looked up on their website.\"],\"answer\":0,\"whyWrong\":[null,\"Con pronombre, el phrasal se parte. «Look up it» no se dice en ninguna variedad del inglés.\",\"El pronombre delante del verbo es el orden español («lo busqué»). En inglés el objeto va siempre detrás del verbo.\"],\"itemIds\":[\"enb1m11lookeditup\"],\"tip\":\"Es una regla sin excepciones, así que se puede aplicar a ciegas: pronombre + phrasal partible = el pronombre va en medio. Ni se piensa.\"},{\"id\":\"enb1m11l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Un solo fallo: el pronombre está donde no va.\",\"wrong\":\"I looked up it.\",\"answers\":[\"I looked it up.\"],\"why\":\"Con un pronombre (it, them, him, her) el phrasal verb se parte y el pronombre va EN MEDIO. Con un sustantivo valdrían las dos: «I looked up the rule» y «I looked the rule up».\",\"translation\":\"Lo busqué.\",\"itemIds\":[\"enb1m11lookeditup\"]},{\"id\":\"enb1m11l5e4\",\"type\":\"bucket\",\"prompt\":\"¿Se parte o no se parte? Piensa dónde pondrías «it»\",\"categories\":[\"Se parte: look IT up\",\"No se parte: look into IT\"],\"items\":[{\"text\":\"look up\",\"bucket\":0},{\"text\":\"look into\",\"bucket\":1},{\"text\":\"sort out\",\"bucket\":0},{\"text\":\"put up with\",\"bucket\":1},{\"text\":\"throw away\",\"bucket\":0},{\"text\":\"deal with\",\"bucket\":1},{\"text\":\"turn down\",\"bucket\":0},{\"text\":\"get away with\",\"bucket\":1}],\"itemIds\":[\"enb1m11lookeditup\",\"enb1m11lookinto\",\"enb1m11sortitout\",\"enb1m1putupwith\",\"enb1m8throwaway\",\"enb1m2dealwith\",\"enb1m11turnitdown\",\"enb1m11getawaywithit\"],\"tip\":\"Mira la columna de la derecha: los tres de tres piezas están todos ahí, y «look into» y «deal with» llevan preposición de verdad. Los de la izquierda llevan partícula — up, out, away, down—, y esas sí se dejan partir.\"},{\"id\":\"enb1m11l5e5\",\"type\":\"cloze\",\"prompt\":\"Completa poniendo el pronombre donde va\",\"text\":\"The music was very loud, so I asked them to turn ___ down.\",\"answers\":[\"it\"],\"translation\":\"La música estaba altísima, así que les pedí que la bajaran.\",\"hints\":[\"El phrasal es «turn down» y el objeto es un pronombre\",\"Dos letras\"],\"itemIds\":[\"enb1m11turnitdown\"],\"tip\":\"«Turn it down» sirve para la música, la tele y la calefacción. Y con una oferta de trabajo significa otra cosa: rechazarla. Mismo phrasal, dos vidas.\"},{\"id\":\"enb1m11l5e6\",\"type\":\"build\",\"prompt\":\"Construye la respuesta que quieres del ayuntamiento\",\"target\":\"The council are looking into it\",\"translation\":\"El ayuntamiento lo está estudiando\",\"distractors\":[\"in\",\"them\"],\"itemIds\":[\"enb1m11lookinto\",\"enb1m4council\"],\"tip\":\"Cuidado con las fichas que sobran: una te tienta a cambiar la preposición y la otra a cambiar el pronombre. «Look into» va entero, con «into», y el pronombre va DETRÁS: nunca «looking it into».\"},{\"id\":\"enb1m11l5e7\",\"type\":\"transform\",\"prompt\":\"Cambia el sustantivo por un pronombre\",\"source\":\"I'll sort out the bins tomorrow.\",\"instruction\":\"Di «los cubos» con un pronombre\",\"answers\":[\"I'll sort them out tomorrow\",\"I'll sort them out tomorrow.\",\"I will sort them out tomorrow\"],\"translation\":\"Los arreglo mañana.\",\"hints\":[\"«the bins» son varios, así que el pronombre es «them»\",\"I'll sort ... out tomorrow\"],\"itemIds\":[\"enb1m11sortitout\"],\"tip\":\"El sustantivo podía ir en dos sitios; el pronombre solo en uno. Por eso este ejercicio es el que de verdad demuestra que has entendido la regla.\"},{\"id\":\"enb1m11l5e8\",\"type\":\"gapbank\",\"prompt\":\"Completa con la partícula que falta\",\"text\":\"The council said they would look ___ it. Nobody turned ___, so I sorted it ___ myself and threw the rubbish ___.\",\"answers\":[\"into\",\"up\",\"out\",\"away\"],\"bank\":[\"into\",\"up\",\"out\",\"away\",\"after\",\"down\",\"off\"],\"translation\":\"El ayuntamiento dijo que lo miraría. No apareció nadie, así que lo arreglé yo misma y tiré la basura.\",\"itemIds\":[\"enb1m11lookinto\",\"enb1m11sortitout\",\"enb1m8throwaway\"],\"tip\":\"«Turn up» aquí no es subir el volumen: es aparecer, presentarse. Un phrasal verb cambia de significado entero con la partícula, y por eso se aprenden de dos en dos, no por verbos.\"},{\"id\":\"enb1m11l5e9\",\"type\":\"write\",\"prompt\":\"Writing Tarea 1: la carta formal. Lee lo que te han contestado, mira el esqueleto y escribe. El esqueleto es tu andamio, no el modelo.\",\"scenario\":\"Llevas desde marzo con basura y muebles tirados en el callejón de detrás de Palmer Road. Escribe al ayuntamiento (70-100 palabras). Trata LOS TRES puntos: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Environmental Services (automatic reply)\",\"text\":\"Thank you for contacting us. Your enquiry has been logged as reference 40118. Please note that reports about waste in private alleyways may fall outside our remit. If you wish to take this further, write to the address below quoting your reference number.\"},\"bullets\":[\"Di dónde está el problema y desde cuándo.\",\"Di qué habéis probado ya los vecinos.\",\"Pide que lo estudien y que te contesten.\"],\"checks\":[{\"re\":\"(entry|alley|alleyway|palmer road|behind the houses)\",\"label\":\"Dices dónde está el problema\"},{\"re\":\"(tried|rang|phoned|wrote|ourselves|residents)\",\"label\":\"Dices qué habéis probado ya\"},{\"re\":\"(look into|could you|would it be possible|i would be grateful|let me know|confirm|reply)\",\"label\":\"Pides que lo estudien y que te contesten\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — la respuesta no da nombre, así que sin nombre\",\"Por qué escribes + el número de referencia: «I am writing about…»\",\"Punto 1 — dónde y desde cuándo, con una fecha concreta\",\"Punto 2 — lo que ya habéis probado: «Residents have tried…» (montón A: -ing)\",\"Un conector de contraste antes de decir que no sirvió: «In spite of that,…»\",\"Punto 3 — la petición, envuelta: «I would be grateful if you could look into…»\",\"Cierre + despedida: «I look forward to hearing from you. Yours faithfully,…»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"in spite of\",\"in addition\",\"on the other hand\",\"therefore\",\"besides\",\"for instance\",\"at least\",\"having said that\",\"to be fair\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing about the fly-tipping in the entry behind Palmer Road, which has been going on since March.\\nResidents have tried moving the bags ourselves, and we rang the office twice in April. In spite of that, nothing has changed and the pile is now blocking the bins.\\nI would be grateful if you could look into it and tell me which department is responsible. In addition, please could you confirm whether the entry is council property?\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m11flytipping\",\"enb1m11theentry\",\"enb1m11lookinto\",\"enb1m5inspiteof\",\"enb1m4inaddition\",\"enb1m11geringroup\"],\"tip\":\"Cuenta las palabras antes de comprobar: 70-100. Y fíjate en el modelo: ni una orden, ni un «I want». La petición va envuelta en «I would be grateful if you could…», y el verbo que se le pide al ayuntamiento es «look into» — que es exactamente la palabra con la que ellos contestan cuando de verdad van a hacer algo.\"},{\"id\":\"enb1m11l5e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"No lo tires: rellénalo por internet y ya está.\",\"answers\":[\"Don't throw it away: fill it in online and that's it\",\"Don't throw it away. Fill it in online and that's it\",\"Don't throw it away, just fill it in online\"],\"hint\":\"Los dos phrasal verbs se parten, y en los dos el pronombre es el mismo\",\"itemIds\":[\"enb1m8throwaway\",\"enb1m11fillitin\"],\"tip\":\"Dos phrasal verbs partidos en una sola frase corta. Si te han salido los dos sin pensarlo, la regla ya está puesta.\"},{\"id\":\"enb1m11l5e11\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa exactamente?\",\"source\":\"They always get away with it.\",\"answers\":[\"Siempre se salen con la suya\",\"Siempre les sale gratis\",\"Nunca les pasa nada\"],\"itemIds\":[\"enb1m11getawaywithit\"],\"tip\":\"«Get away with it» lleva dentro la idea de que hubo algo mal hecho y nadie lo pagó. Es una de esas expresiones que en el oral te ahorran tres frases de explicación.\"},{\"id\":\"enb1m11l5e12\",\"type\":\"listen\",\"prompt\":\"Dictado: escribe la frase que oyes\",\"text\":\"I'll sort it out tomorrow.\",\"translation\":\"Lo arreglo mañana.\",\"strictContractions\":true,\"hints\":[\"Empieza por la contracción de «I will»\",\"I'll sort ... tomorrow\"],\"itemIds\":[\"enb1m11sortitout\"],\"tip\":\"Escribe la contracción: en un dictado se corrige lo que sonó, y ahí sonó «I'll», no «I will». En el habla rápida «sort it out» se funde en tres golpes seguidos, «SOO-ti-táut».\"},{\"id\":\"enb1m11l5e13\",\"type\":\"audiomc\",\"prompt\":\"Listening: Valeria llama al ayuntamiento. Dos escuchas.\",\"audio\":\"Environmental Services, good morning.|Hello. I'm ringing about reference forty thousand one hundred and eighteen — the alleyway behind Palmer Road.|Bear with me. Right, I've got it. That was logged in March and closed in April.|Closed? Nobody came.|It says here: outside remit, private land.|It isn't private land. I looked it up on the Land Registry last night and it's yours.|Right. In that case I'll reopen it and pass it to the enforcement team, and they'll look into it. I can't tell you when.|Can you send me that in writing?|I can email you the reference. That's as much as I can do from here.\",\"question\":\"¿Qué consigue Valeria en la llamada?\",\"options\":[\"Que reabran el caso y lo pasen al equipo de inspección\",\"Que le confirmen que el callejón es privado\",\"Que le den una fecha para retirar los muebles\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Ocurre lo contrario: ella demuestra que NO es privado y el ayuntamiento acepta que es suyo.\",\"Se lo niegan expresamente: «I can't tell you when».\"],\"itemIds\":[\"enb1m11lookeditup\",\"enb1m11lookinto\",\"enb1m11theentry\"],\"tip\":\"Escucha la frase que le da la vuelta a la llamada: «I looked it up on the Land Registry last night». No discute — trae un dato. En el Speaking Part 3 eso es exactamente lo que separa una opinión de un argumento.\"}]}],\"resources\":[{\"label\":\"GOV.UK — Report fly-tipping\",\"url\":\"https://www.gov.uk/report-flytipping\",\"note\":\"Léela entera: son cuatro pantallas y está escrita en el inglés más claro que produce la administración británica. Fíjate en cuántos phrasal verbs hay y en dónde cae el pronombre en cada uno.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"
