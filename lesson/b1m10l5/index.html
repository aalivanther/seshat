c/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m10l5\",\"phaseId\":\"b1m10\",\"title\":\"Klinik: damit oder um…zu\",\"subtitle\":\"Processing Instruction — el sujeto decide, no el significado\",\"minutes\":13,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las dos finalidades y tres estados de ánimo\",\"itemIds\":[\"b1m10damitzweck\",\"b1m10umzuzweck\",\"b1m10sauersein\",\"b1m10beleidigtsein\",\"b1m10nachtragend\"]},{\"kind\":\"note\",\"note\":{\"title\":\"«Para» son dos cosas distintas en alemán\",\"body\":\"El español dice «para» siempre. El alemán mira \u003cb\u003equién hace la segunda acción\u003c/b\u003e:\u003cbr/\u003e\u003cbr/\u003e• \u003cb\u003eMISMO sujeto\u003c/b\u003e → \u003cb\u003eum … zu\u003c/b\u003e + infinitivo: \u003ci\u003eIch rufe dich an, \u003cb\u003eum\u003c/b\u003e mich \u003cb\u003ezu\u003c/b\u003e entschuldigen.\u003c/i\u003e (llamo yo, me disculpo yo)\u003cbr/\u003e• \u003cb\u003eSUJETO DISTINTO\u003c/b\u003e → \u003cb\u003edamit\u003c/b\u003e + frase con verbo al final: \u003ci\u003eIch rufe dich an, \u003cb\u003edamit du\u003c/b\u003e Bescheid \u003cb\u003eweißt\u003c/b\u003e.\u003c/i\u003e (llamo yo, lo sabes tú)\u003cbr/\u003e\u003cbr/\u003eRegla operativa: escribe la segunda mitad y pregúntate «¿quién?». Si la respuesta es la misma persona, \u003cb\u003eum … zu\u003c/b\u003e; si cambia, \u003cb\u003edamit\u003c/b\u003e. El calco *«für dass» no existe en alemán, y \u003cb\u003edamit\u003c/b\u003e con el mismo sujeto suena pesado aunque sea gramatical.\u003cbr/\u003e\u003cbr/\u003eTruco del examen: \u003cb\u003edamit\u003c/b\u003e se puede usar SIEMPRE (también con el mismo sujeto), pero \u003cb\u003eum…zu\u003c/b\u003e NO: con sujetos distintos es un error puro. Si dudas, damit te salva.\u003cbr/\u003e\u003cbr/\u003eY el Konjunktiv II sigue trabajando aquí: \u003ci\u003eIch habe ihr geschrieben, damit sie sich nicht [[ärgert|enfada]].\u003c/i\u003e · \u003ci\u003eEs wäre gut, wenn wir reden würden.\u003c/i\u003e\",\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"irreal del pasado (ya no tiene arreglo)\",\"pastExample\":\"Das hätte ich nicht sagen sollen.\",\"nowLabel\":\"irreal del presente (todavía es posible)\",\"nowExample\":\"An deiner Stelle würde ich mich entschuldigen.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m10l5e1\",\"type\":\"mc\",\"prompt\":\"Referencial 1 — ¿quién se disculpa?\",\"question\":\"„Ich habe ihr geschrieben, damit sie sich entschuldigt.“\",\"options\":[\"Ella se disculpa\",\"Yo me disculpo\",\"Los dos se disculpan\"],\"answer\":0,\"whyWrong\":[null,\"Si me disculpara yo, sería «…, um mich zu entschuldigen»\",\"La frase solo nombra un sujeto para la segunda acción\"],\"itemIds\":[\"b1m10damitzweck\",\"b1m10sichentschuldigenbei\"],\"tip\":\"El conector te dice quién actúa: damit + nuevo sujeto. Tapa «damit sie» y la frase deja de tener respuesta.\"},{\"id\":\"b1m10l5e2\",\"type\":\"mc\",\"prompt\":\"Referencial 2 — la misma frase, otro conector\",\"question\":\"„Ich habe ihr geschrieben, um mich zu entschuldigen.“\",\"options\":[\"Yo me disculpo\",\"Ella se disculpa\"],\"answer\":0,\"whyWrong\":[null,\"um … zu no puede cambiar de sujeto: el que escribe es el que se disculpa\"],\"itemIds\":[\"b1m10umzuzweck\",\"b1m10sichentschuldigenbei\"]},{\"id\":\"b1m10l5e3\",\"type\":\"bucket\",\"prompt\":\"Referencial 3 — ¿cabe «um … zu» o hace falta «damit»?\",\"categories\":[\"um … zu (mismo sujeto)\",\"damit (sujeto distinto)\"],\"items\":[{\"text\":\"Ich schreibe ihr, … ich mich entschuldige.\",\"bucket\":0},{\"text\":\"Ich erkläre es dir, … du es verstehst.\",\"bucket\":1},{\"text\":\"Wir reden in Ruhe, … wir eine Lösung finden.\",\"bucket\":0},{\"text\":\"Ich mache das Fenster zu, … der Lärm dich nicht stört.\",\"bucket\":1},{\"text\":\"Sie ruft an, … sie sich verabredet.\",\"bucket\":0},{\"text\":\"Ich koche heute, … du dich ausruhen kannst.\",\"bucket\":1}],\"itemIds\":[\"b1m10umzuzweck\",\"b1m10damitzweck\"],\"tip\":\"No mires el significado: cuenta los sujetos. Mismo sujeto en las dos mitades → um … zu; distinto → damit, siempre.\"},{\"id\":\"b1m10l5e4\",\"type\":\"errorfix\",\"prompt\":\"Corrige la finalidad\",\"wrong\":\"Ich erkläre es dir noch einmal, um du es zu verstehen.\",\"answers\":[\"Ich erkläre es dir noch einmal, damit du es verstehst.\"],\"why\":\"um … zu no admite sujeto propio: en cuanto aparece «du», hay que cambiar a damit y conjugar el verbo al final (verstehst). El calco viene del «para que» español.\",\"translation\":\"Te lo explico otra vez para que lo entiendas.\",\"itemIds\":[\"b1m10damitzweck\",\"b1m10umzuzweck\"]},{\"id\":\"b1m10l5e5\",\"type\":\"transform\",\"prompt\":\"Output 1 — cambia de sujeto y de conector\",\"source\":\"Ich rufe dich an, um mich zu entschuldigen.\",\"instruction\":\"Dilo con el sujeto cambiado: que sea ELLA la que se entere\",\"answers\":[\"Ich rufe dich an, damit du Bescheid weißt\",\"Ich rufe dich an, damit du Bescheid weißt.\",\"Ich rufe dich an, damit du es weißt\"],\"translation\":\"Te llamo para que lo sepas.\",\"hints\":[\"Sujeto distinto → damit\",\"… damit du Bescheid weißt (verbo al final)\"],\"itemIds\":[\"b1m10damitzweck\"]},{\"id\":\"b1m10l5e6\",\"type\":\"transform\",\"prompt\":\"Output 2 — al revés, sin repetir el sujeto\",\"source\":\"Ich gehe früher, damit ich pünktlich bin.\",\"instruction\":\"Dilo con «um … zu» (el sujeto es el mismo)\",\"answers\":[\"Ich gehe früher, um pünktlich zu sein\",\"Ich gehe früher, um pünktlich zu sein.\"],\"translation\":\"Me voy antes para llegar puntual.\",\"hints\":[\"um … zu + infinitivo\",\"… um pünktlich zu sein\"],\"itemIds\":[\"b1m10umzuzweck\"],\"tip\":\"Con el mismo sujeto, damit es correcto pero pesado. El alemán elegante prefiere um … zu.\"},{\"id\":\"b1m10l5e7\",\"type\":\"gapbank\",\"prompt\":\"Output 3 — el mensaje entero\",\"text\":\"Ich schreibe dir, ___ du weißt, was los war. Ich war einfach ___ und habe zu schnell reagiert. Ich möchte mich melden, ___ mich zu entschuldigen, ___ wir uns nicht wochenlang aus dem Weg gehen.\",\"answers\":[\"damit\",\"sauer\",\"um\",\"damit\"],\"bank\":[\"damit\",\"sauer\",\"um\",\"sauber\",\"für dass\",\"nachtragend\",\"zu\"],\"translation\":\"Te escribo para que sepas qué pasó. Estaba simplemente cabreado y reaccioné demasiado rápido. Quiero dar señales de vida para disculparme, para que no nos evitemos durante semanas.\",\"hints\":[\"Dos veces cambia el sujeto, una vez no\",\"«für dass» no existe en alemán\"],\"itemIds\":[\"b1m10damitzweck\",\"b1m10umzuzweck\",\"b1m10sauersein\"],\"tip\":\"Tres finalidades seguidas en un mensaje real: así es como se usan de verdad los dos conectores.\"},{\"id\":\"b1m10l5e8\",\"type\":\"bucket\",\"prompt\":\"Konjunktiv II — ¿würde o forma sintética?\",\"categories\":[\"würde + infinitivo\",\"forma sintética (hätte, wäre, könnte…)\"],\"items\":[{\"text\":\"Ich … mehr Zeit (haben)\",\"bucket\":1},{\"text\":\"Ich … mit ihr reden (reden)\",\"bucket\":0},{\"text\":\"Das … besser (sein)\",\"bucket\":1},{\"text\":\"Er … sich entschuldigen (können)\",\"bucket\":1},{\"text\":\"Wir … dich abholen (abholen)\",\"bucket\":0},{\"text\":\"Du … früher gehen (müssen)\",\"bucket\":1}],\"itemIds\":[\"b1m10eswaerebesserwenn\",\"b1m10andeinerstelle\",\"b1m10koenntestdu\"],\"tip\":\"*«Ich würde Zeit haben» es el error diagnóstico del B1. Con haben, sein, wissen y los modales el examen espera la forma sintética (hätte, wäre, wüsste, könnte…): no es que el würde sea agramatical, es que ahí nadie lo usa.\"},{\"id\":\"b1m10l5e13\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3: dos amigos hablando. UNA sola escucha y la tarea del examen: una afirmación en alemán, Richtig o Falsch. (Aquí van dos; el Teil 3 completo, con las siete, está en la lección «Richtig zuhören».)\",\"audio\":\"Du, Sofía, kann ich dich kurz was fragen? Ich hab Anna nichts von der Feier erzählt, um sie zu überraschen. War das dumm? | Ehrlich gesagt: ja. Anna mag keine Überraschungen, das weißt du doch. | Ich wollt ihr halt eine Freude machen. | Dann ruf sie heute noch an, damit sie es von dir erfährt und nicht von irgendwem anders. Sonst ist sie wirklich sauer.\",\"question\":\"Nico hat Anna nichts erzählt, weil er sie überraschen wollte.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":1,\"whyWrong\":[null,\"Él mismo lo dice: «Ich hab Anna nichts von der Feier erzählt, um sie zu überraschen»\"],\"itemIds\":[\"b1m10umzuzweck\",\"b1m10damitzweck\"],\"tip\":\"La respuesta está en la finalidad: «um sie zu überraschen». Mismo sujeto (Nico calla, Nico sorprende) → um … zu. Si en el audio hubieras oído «damit sie sich freut», el que se alegra sería otro.\"},{\"id\":\"b1m10l5e14\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 3, segunda tarea del mismo diálogo. Una escucha.\",\"audio\":\"Du, Sofía, kann ich dich kurz was fragen? Ich hab Anna nichts von der Feier erzählt, um sie zu überraschen. War das dumm? | Ehrlich gesagt: ja. Anna mag keine Überraschungen, das weißt du doch. | Ich wollt ihr halt eine Freude machen. | Dann ruf sie heute noch an, damit sie es von dir erfährt und nicht von irgendwem anders. Sonst ist sie wirklich sauer.\",\"question\":\"Sofía rät ihm, mit dem Anruf noch ein paar Tage zu warten.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":1,\"whyWrong\":[\"Le dice justo lo contrario: «Dann ruf sie heute noch an, damit sie es von dir erfährt»\",null],\"itemIds\":[\"b1m10damitzweck\",\"b1m10sauersein\"],\"tip\":\"«…, damit sie es von dir erfährt» — cambia el sujeto (llama él, se entera ella): por eso damit y no um … zu. En una escucha, la conjunción es la pista más rápida de quién hace qué.\"},{\"id\":\"b1m10l5e9\",\"type\":\"cloze\",\"prompt\":\"Completa el estado de ánimo\",\"text\":\"Sie redet nicht mehr mit mir — sie ist immer noch ___. (ofendida)\",\"answers\":[\"beleidigt\"],\"translation\":\"Ya no habla conmigo: sigue ofendida.\",\"hints\":[\"Participio usado como adjetivo predicativo\",\"bel…\"],\"itemIds\":[\"b1m10beleidigtsein\"]},{\"id\":\"b1m10l5e10\",\"type\":\"build\",\"prompt\":\"Construye la frase con damit\",\"target\":\"Ich mache das Fenster zu, damit dich der Lärm nicht stört\",\"translation\":\"Cierro la ventana para que el ruido no te moleste\",\"distractors\":[\"um\",\"zu stören\"],\"altTargets\":[\"Ich mache das Fenster zu, damit der Lärm dich nicht stört\"],\"itemIds\":[\"b1m10damitzweck\",\"b1m1laerm\"]},{\"id\":\"b1m10l5e11\",\"type\":\"paraphrase\",\"prompt\":\"Dilo sin la palabra fácil\",\"source\":\"Ich bin sauer auf dich.\",\"forbid\":[\"sauer\"],\"answers\":[\"Ich habe mich sehr über dich geärgert\",\"Ich habe mich über dich geärgert\",\"Ich bin ziemlich enttäuscht von dir\",\"Ich bin enttäuscht von dir\"],\"translation\":\"Me he enfadado mucho contigo.\",\"hints\":[\"sich ärgern über + Akkusativ\",\"O: enttäuscht sein von + Dativ\"],\"itemIds\":[\"b1m10sauersein\",\"b1m10sichaergernueber\",\"b1m10enttaeuschtvon\"],\"tip\":\"«sauer» es coloquial y suena a portazo. Las dos alternativas dicen lo mismo en registro neutro: eso es rango léxico.\"},{\"id\":\"b1m10l5e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Te escribo para que lo sepas y para disculparme.\",\"answers\":[\"Ich schreibe dir, damit du es weißt, und um mich zu entschuldigen\",\"Ich schreibe dir, damit du es weißt, und um mich zu entschuldigen.\",\"Ich schreibe dir, damit du Bescheid weißt, und um mich zu entschuldigen\"],\"hints\":[\"Primero cambia el sujeto → damit\",\"Después el sujeto es el mismo → um … zu\"],\"itemIds\":[\"b1m10damitzweck\",\"b1m10umzuzweck\",\"b1m10sichentschuldigenbei\"],\"tip\":\"Los dos conectores en la misma frase, cada uno donde toca. Si te salieron sin pensar, la trampa §6.8 ya no te alcanza.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\
