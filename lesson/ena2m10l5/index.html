u003cb\u003e've\u003c/b\u003e pegada al sujeto: \u003ci\u003eI've\u003c/i\u003e «áiv», \u003ci\u003eyou've\u003c/i\u003e «yuuv», \u003ci\u003ewe've\u003c/i\u003e «uiv», \u003ci\u003ethey've\u003c/i\u003e «déiv».\u003cbr/\u003e2. \u003cb\u003e's\u003c/b\u003e en tercera persona: \u003ci\u003ehe's\u003c/i\u003e «jíis̬», \u003ci\u003eshe's\u003c/i\u003e «shíis̬».\u003cbr/\u003e3. En \u003cb\u003epregunta\u003c/b\u003e, \u003ci\u003ehave\u003c/i\u003e pierde la jota y se pega al sujeto: \u003ci\u003eHave you seen it?\u003c/i\u003e → «\u003cb\u003eav-yu\u003c/b\u003e síin it».\u003cbr/\u003e4. En \u003cb\u003enegativa\u003c/b\u003e, en cambio, \u003cb\u003esuena fuerte\u003c/b\u003e: \u003cb\u003ehaven't\u003c/b\u003e «JÁ-vent», \u003cb\u003ehasn't\u003c/b\u003e «JÁ-s̬ent». El inglés acentúa la negación siempre.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY ahora el par que decide todo:\u003c/b\u003e esa \u003cb\u003e's\u003c/b\u003e puede ser \u003cb\u003eis\u003c/b\u003e o \u003cb\u003ehas\u003c/b\u003e, y suenan igual. ¿Cómo se sabe? \u003cb\u003ePor lo que viene detrás\u003c/b\u003e:\u003cbr/\u003e· \u003ci\u003eHe's \u003cb\u003eworking\u003c/b\u003e.\u003c/i\u003e → \u003cb\u003eis\u003c/b\u003e + -ing → está trabajando ahora.\u003cbr/\u003e· \u003ci\u003eHe's \u003cb\u003eworked\u003c/b\u003e here for years.\u003c/i\u003e → \u003cb\u003ehas\u003c/b\u003e + participio → lleva años trabajando.\u003cbr/\u003e\u003cbr/\u003eNo hay que adivinarlo: se mira la palabra siguiente. Y si es \u003ci\u003ebeen\u003c/i\u003e, es \u003cb\u003ehas\u003c/b\u003e seguro, porque \u003ci\u003eis been\u003c/i\u003e no existe.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eÚltima pieza:\u003c/b\u003e en el habla rápida, \u003ci\u003ehave\u003c/i\u003e tras un participio con -n se funde del todo: \u003ci\u003eWhere have you been?\u003c/i\u003e suena casi «\u003cb\u003euéa-vyu-bíin\u003c/b\u003e». Es una sola cosa, no cuatro palabras."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m10l5\",\"phaseId\":\"ena2m10\",\"title\":\"The disappearing have\",\"subtitle\":\"Clínica de sonido: 've, 's y el have que casi no suena\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que el oído tiene que cazar\",\"itemIds\":[\"ena2m10iveweak\",\"ena2m10hesshesweak\",\"ena2m10haveyouweak\",\"ena2m10haventhasnt\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El tiempo verbal que se oye menos de todo el inglés\",\"body\":\"$17\",\"table\":[[\"escrito\",\"suena\",\"qué es\"],[\"I have seen it.\",\"áiv SÍIN it\",\"'ve átona: casi no está\"],[\"He's working.\",\"jíis̬ UÉE-king\",\"is → ahora mismo\"],[\"He's worked here.\",\"jíis̬ UÉEKT jía\",\"has → experiencia\"],[\"Have you seen it?\",\"av-yu SÍIN it\",\"have sin jota, pegado a you\"],[\"I haven't seen it.\",\"ái JÁ-vent SÍIN it\",\"la negación SÍ se oye\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m10l5e1\",\"type\":\"mc\",\"prompt\":\"La 's que hay que desambiguar\",\"question\":\"“He's worked in three countries.” — ese 's es…\",\"options\":[\"has\",\"is\",\"was\"],\"answer\":0,\"whyWrong\":[null,\"«is worked» no existe: detrás de is iría -ing (he's working)\",\"was no se contrae nunca en 's\"],\"itemIds\":[\"ena2m10hesshesweak\",\"ena2m10shesworkedin\"],\"tip\":\"La regla es de la palabra siguiente, no del oído: -ing → is · participio → has. Nunca al revés.\"},{\"id\":\"ena2m10l5e2\",\"type\":\"bucket\",\"prompt\":\"¿Ese 's es IS o es HAS? Míralo por lo que viene detrás\",\"categories\":[\"'s = is (ahora)\",\"'s = has (experiencia)\"],\"items\":[{\"text\":\"She's cooking dinner.\",\"bucket\":0},{\"text\":\"She's cooked dinner.\",\"bucket\":1},{\"text\":\"He's been to Spain.\",\"bucket\":1},{\"text\":\"He's at the station.\",\"bucket\":0},{\"text\":\"Amy's finished her shift.\",\"bucket\":1},{\"text\":\"Amy's very tired.\",\"bucket\":0}],\"itemIds\":[\"ena2m10hesshesweak\",\"ena2m10ivebeento\"],\"tip\":\"Los dos primeros se diferencian en UNA letra escrita y en nada al oído: cooking / cooked. Por eso este ejercicio se hace con los ojos antes que con las orejas.\"},{\"id\":\"ena2m10l5e3\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle?\",\"book\":\"I have seen it.\",\"real\":\"I've seen it.\",\"translation\":\"Lo he visto.\",\"itemIds\":[\"ena2m10iveweak\",\"ena2m10seengroup\"],\"tip\":\"La forma larga solo se dice cuando quieres insistir («I HAVE seen it, I promise»). En todo lo demás, la contracción.\"},{\"id\":\"ena2m10l5e4\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? La pregunta, a velocidad real\",\"book\":\"Have you seen it?\",\"real\":\"Seen it?\",\"translation\":\"¿Lo has visto?\",\"itemIds\":[\"ena2m10haveyouweak\"],\"tip\":\"En la calle desaparece el auxiliar entero. Tú no tienes que producirlo así, pero sí reconocerlo: es la forma normal de preguntar entre amigos.\"},{\"id\":\"ena2m10l5e5\",\"type\":\"hearreal\",\"prompt\":\"¿Qué significa lo que has oído?\",\"book\":\"He has worked here for years.\",\"real\":\"He's worked here for years.\",\"translation\":\"Lleva años trabajando aquí.\",\"ask\":\"meaning\",\"meaningOptions\":[\"Lleva años trabajando aquí\",\"Está trabajando aquí ahora mismo\",\"Trabajaba aquí y ya no\"],\"itemIds\":[\"ena2m10hesshesweak\",\"ena2m10howlonghaveyou\"],\"tip\":\"Lo que descarta las otras dos es worked: con is iría working, y si ya no trabajara aquí sería «he worked here for years», en pasado simple y sin has.\"},{\"id\":\"ena2m10l5e6\",\"type\":\"listen\",\"prompt\":\"Dictado — escribe la contracción tal cual suena\",\"text\":\"I've been there twice.\",\"translation\":\"He estado allí dos veces.\",\"strictContractions\":true,\"hints\":[\"Empieza por una sola sílaba: sujeto + v\",\"I'v… been there twice.\"],\"itemIds\":[\"ena2m10iveweak\",\"ena2m10ivebeento\",\"entwice\"],\"tip\":\"Aquí sí se te exige la contracción: has oído «áiv», no «ái jav», y transcribir lo que sonó es la mitad del trabajo del Listening.\"},{\"id\":\"ena2m10l5e7\",\"type\":\"listen\",\"prompt\":\"Dictado — y ahora la negativa, que sí se oye entera\",\"text\":\"She hasn't finished yet.\",\"translation\":\"Todavía no ha terminado.\",\"strictContractions\":true,\"hints\":[\"El auxiliar negativo de she\",\"She ha…'t finished yet.\"],\"itemIds\":[\"ena2m10haventhasnt\",\"ena2m10shehasntcalledyet\"]},{\"id\":\"ena2m10l5e8\",\"type\":\"shadow\",\"prompt\":\"Sombrea la cadena de contracciones — primero lento, luego a velocidad normal\",\"text\":\"I've seen it, she's seen it, they've all seen it.\",\"phonetic\":\"áiv SÍIN it, shíis̬ SÍIN it, déiv ool SÍIN it\",\"translation\":\"Yo la he visto, ella la ha visto, la han visto todos.\",\"reps\":2,\"itemIds\":[\"ena2m10iveweak\",\"ena2m10hesshesweak\",\"ena2m10seengroup\"],\"tip\":\"Tres auxiliares en una frase y ninguno con vocal propia. Si te sale sin meter una «e» delante de la v, la clínica está funcionando.\"},{\"id\":\"ena2m10l5e9\",\"type\":\"shadow\",\"prompt\":\"Sombrea la pregunta fundida\",\"text\":\"Where have you been?\",\"phonetic\":\"uéa-vyu BÍIN\",\"translation\":\"¿Dónde te habías metido?\",\"reps\":2,\"itemIds\":[\"ena2m10wherehaveyoubeen\",\"ena2m10haveyouweak\"],\"tip\":\"Cuatro palabras escritas, dos golpes de voz reales. El acento cae entero en been; todo lo demás es rampa.\"},{\"id\":\"ena2m10l5e10\",\"type\":\"audiomc\",\"prompt\":\"Escucha dos veces — decide si es presente o experiencia\",\"audio\":\"Ben's driven that bus for ten years.\",\"question\":\"¿Qué se dice de Ben?\",\"options\":[\"Lleva diez años conduciendo ese autobús\",\"Está conduciendo el autobús ahora\",\"Va a conducir el autobús diez años\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Para eso haría falta driving, no driven\",\"El futuro no suena por ninguna parte\"],\"itemIds\":[\"ena2m10hesshesweak\",\"ena2m10howlonghaveyou\",\"enbus\"],\"tip\":\"driven es participio, así que ese 's solo puede ser has. La forma del verbo desambigua el auxiliar: es el truco que salva estas preguntas.\"},{\"id\":\"ena2m10l5e11\",\"type\":\"speak\",\"prompt\":\"Di el contraste, con el desnivel bien marcado\",\"text\":\"She's working today, but she's worked here for years.\",\"phonetic\":\"shíis̬ UÉE-king tu-DÉI, bat shíis̬ UÉEKT jía fo YÍAS̬\",\"translation\":\"Hoy está trabajando, pero lleva años trabajando aquí.\",\"itemIds\":[\"ena2m10hesshesweak\",\"ena2m10howlonghaveyou\"],\"tip\":\"Las dos mitades empiezan igual y significan cosas distintas. La diferencia la lleva entera la terminación del verbo, no el auxiliar.\"},{\"id\":\"ena2m10l5e12\",\"type\":\"type\",\"prompt\":\"Cierre — escríbelo con las contracciones\",\"question\":\"Lo he visto, pero ella todavía no lo ha visto.\",\"answers\":[\"I've seen it, but she hasn't seen it yet.\",\"I've seen it but she hasn't seen it yet.\",\"I've seen it, but she hasn't seen it yet!\"],\"hints\":[\"'ve en la primera mitad, hasn't en la segunda\",\"I'v… seen it, but she ha…'t seen it yet.\"],\"itemIds\":[\"ena2m10iveweak\",\"ena2m10haventhasnt\",\"ena2m10haveyoufinishedyet\"],\"tip\":\"Fíjate en el desnivel de la frase: la primera mitad se dice en un suspiro y la segunda golpea en hasn't. Ese es el ritmo que hay que copiar.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-ena2m10-5\",\"book\":\"I have not seen him.\",\"real\":\"I've not seen him.\",\"meaning\":\"No lo he visto\",\"when\":\"Muy británico, sobre todo en el norte y en Escocia: en vez de contraer el not (haven't), se contrae el have y el not queda suelto. Las dos son correctas y las dos se escriben. En el examen, cualquiera de las dos vale.\",\"register\":\"regional\",\"note\":\"Es una de las pocas veces en que el inglés te deja elegir dónde poner la contracción. Un londinense dirá «I haven't seen him»; un mancuniano, «I've not seen him».\",\"sound\":\"áiv not SÍIN jim\",\"level\":\"a2\"}}],\"resources\":[{\"label\":\"British Council — Contractions\",\"url\":\"https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/contractions\",\"note\":\"Cinco minutos leyendo y diez repitiendo en voz alta. Fíjate en la lista de 's ambiguas: es la que decide la mitad de las preguntas de Listening.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
