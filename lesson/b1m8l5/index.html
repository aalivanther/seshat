003cb\u003eSehr geehrte Damen und Herren,\u003c/b\u003e (o Sehr geehrter Herr Reuter, si sabes el nombre)\u003cbr/\u003e• \u003cb\u003ePronombre\u003c/b\u003e: du/dich/dir/dein → \u003cb\u003eSie/Ihnen/Ihr\u003c/b\u003e, siempre con mayúscula\u003cbr/\u003e• \u003cb\u003eVerbo\u003c/b\u003e: kannst du → \u003cb\u003ekönnen Sie\u003c/b\u003e; schick mir → \u003cb\u003eschicken Sie mir\u003c/b\u003e\u003cbr/\u003e• \u003cb\u003ePetición\u003c/b\u003e: Kannst du mir sagen …? → \u003cb\u003eKönnten Sie mir bitte mitteilen, ob …?\u003c/b\u003e (Konjunktiv II de cortesía)\u003cbr/\u003e• \u003cb\u003eGruß\u003c/b\u003e: Liebe Grüße / Bis bald → \u003cb\u003eMit freundlichen Grüßen\u003c/b\u003e (sin coma detrás)\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa trampa del hispanohablante\u003c/b\u003e: el español mezcla sin problema («¿Me puede decir…? Gracias, un abrazo»). El alemán no. Y hay una fuga concretísima que el corrector caza en dos segundos: empezar con \u003ci\u003eSehr geehrte Damen und Herren\u003c/i\u003e y a mitad del texto escribir \u003ci\u003ekannst du\u003c/i\u003e. Es el mismo error que firmar una instancia con un emoji.\u003cbr/\u003e\u003cbr/\u003eRegla práctica para el examen: \u003cb\u003eelige el registro en la primera línea y no lo sueltes\u003c/b\u003e. Si dudas, mira el Anrede que tú mismo escribiste."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m8l5\",\"phaseId\":\"b1m8\",\"title\":\"Clínica: du oder Sie?\",\"subtitle\":\"El mismo contenido, dos registros — y el examen los pide con 20 minutos de diferencia\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las fórmulas del registro formal\",\"itemIds\":[\"b1m8gesehrgeehrte\",\"a2mitfreundlichengruessen\",\"b1m8gekoenntensie\",\"b1m8gemitteilen\",\"b1m8gebittenum\",\"b1m8gehiermit\"]},{\"kind\":\"note\",\"note\":{\"title\":\"El registro no es cortesía: es una decisión de tarea\",\"body\":\"$17\",\"table\":[[\"función\",\"du (informal)\",\"S
