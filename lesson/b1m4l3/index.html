+ Akkusativ\u003cbr/\u003e\u003ci\u003ehablar \u003cb\u003ede\u003c/b\u003e algo\u003c/i\u003e → \u003cb\u003esprechen über\u003c/b\u003e + Akkusativ\u003cbr/\u003e\u003cbr/\u003ePor eso NO se aprenden como «verbo + preposición»: se aprenden como \u003cb\u003eun solo bloque\u003c/b\u003e, con su ejemplo. La memoria guarda «warten auf den Bus» igual de fácil que «warten», y así la preposición no se pierde.\u003cbr/\u003e\u003cbr/\u003eEl par que hay que separar bien:\u003cbr/\u003e\u003cb\u003esich freuen auf\u003c/b\u003e + algo que \u003cu\u003eva a pasar\u003c/u\u003e → \u003ci\u003eIch freue mich auf das Wochenende.\u003c/i\u003e (ilusión)\u003cbr/\u003e\u003cb\u003esich freuen über\u003c/b\u003e + algo que \u003cu\u003eya pasó\u003c/u\u003e → \u003ci\u003eIch freue mich über dein Geschenk.\u003c/i\u003e (alegría)\u003cbr/\u003eY ojo con el calco: \u003ci\u003e*Ich freue mich für das Geschenk\u003c/i\u003e. Con \u003cb\u003efür\u003c/b\u003e solo te alegras \u003cu\u003epor una persona\u003c/u\u003e: \u003ci\u003eIch freue mich für dich!\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m4l3\",\"phaseId\":\"b1m4\",\"title\":\"Verben mit Präposition (1)\",\"subtitle\":\"warten AUF, denken AN, sich freuen AUF/ÜBER — bloques, no palabras\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Seis bloques con su preposición pegada\",\"itemIds\":[\"b1m4wartenauf\",\"b1m4denkenan\",\"b1m4sichfreuenauf\",\"b1m4sichfreuenueber\",\"b1m4sprechenueber\",\"b1m4sichinteressierenfuer\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: no hay regla, hay bloques\",\"body\":\"$17\",\"table\":[[\"bloque\",\"caso\",\"ejemplo\"],[\"warten auf\",\"Akkusativ\",\"Ich warte auf den Bus.\"],[\"denken an\",\"Akkusativ\",\"Ich denke an dich.\"],[\"sich freuen auf\",\"Akkusativ (futuro)\",\"Ich freue mich auf das Wochenende.\"],[\"sich freuen über\",\"Akkusativ (pasado)\",\"Ich freue mich über dein Geschenk.\"],[\"sprechen über\",\"Akkusativ\",\"Wir sprechen über das Verbot.\"],[\"sich interessieren für\",\"Akkusativ\",\"Ich interessiere mich für Technik.\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m4l3e1\",\"type\":\"match\",\"prompt\":\"Empareja bloque y significado\",\"pairs\":[{\"target\":\"warten auf\",\"source\":\"esperar a (algo o alguien)\"},{\"target\":\"denken an\",\"source\":\"pensar en\"},{\"target\":\"sich interessieren für\",\"source\":\"interesarse por\"},{\"target\":\"sprechen über\",\"source\":\"hablar de / sobre\"}],\"itemIds\":[\"b1m4wartenauf\",\"b1m4denkenan\",\"b1m4sichinteressierenfuer\",\"b1m4sprechenueber\"]},{\"id\":\"b1m4l3e2\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición del bloque\",\"text\":\"Ich warte ___ deine Nachricht.\",\"answers\":[\"auf\"],\"translation\":\"Espero tu mensaje.\",\"hints\":[\"warten no va con für\",\"warten ___ + Akkusativ\"],\"itemIds\":[\"b1m4wartenauf\",\"nachricht\"],\"tip\":\"«esperar A» → warten AUF. El «a» español no ayuda: hay que memorizar el bloque entero.\"},{\"id\":\"b1m4l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición del bloque\",\"text\":\"Ich denke oft ___ dich.\",\"answers\":[\"an\"],\"translation\":\"Pienso a menudo en ti.\",\"hints\":[\"denken no va con in\",\"denken ___ + Akkusativ\"],\"itemIds\":[\"b1m4denkenan\"]},{\"id\":\"b1m4l3e4\",\"type\":\"bucket\",\"prompt\":\"¿auf (lo que viene) o über (lo que ya pasó)?\",\"categories\":[\"sich freuen AUF (futuro)\",\"sich freuen ÜBER (ya ocurrido)\"],\"items\":[{\"text\":\"Ich freue mich ___ das Wochenende.\",\"bucket\":0},{\"text\":\"Ich freue mich ___ dein Geschenk.\",\"bucket\":1},{\"text\":\"Ich freue mich ___ den Urlaub im Juli.\",\"bucket\":0},{\"text\":\"Ich freue mich ___ deine Nachricht von gestern.\",\"bucket\":1},{\"text\":\"Wir freuen uns ___ das Konzert nächste Woche.\",\"bucket\":0},{\"text\":\"Wir freuen uns ___ die gute Note.\",\"bucket\":1}],\"itemIds\":[\"b1m4sichfreuenauf\",\"b1m4sichfreuenueber\"],\"tip\":\"Si aún no ha pasado, auf. Si ya está aquí, über. La marca temporal de la frase te lo dice siempre.\"},{\"id\":\"b1m4l3e5\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco del español\",\"wrong\":\"Ich freue mich für dein Geschenk.\",\"answers\":[\"Ich freue mich über dein Geschenk.\"],\"why\":\"«Me alegro POR tu regalo» te empuja a für, pero für solo vale con personas (Ich freue mich für dich!). Con una cosa que ya ha pasado: über.\",\"translation\":\"Me alegro por tu regalo.\",\"itemIds\":[\"b1m4sichfreuenueber\"]},{\"id\":\"b1m4l3e6\",\"type\":\"errorfix\",\"prompt\":\"Corrige la preposición\",\"wrong\":\"Ich warte für den Bus.\",\"answers\":[\"Ich warte auf den Bus.\"],\"why\":\"warten rige auf + Akkusativ, siempre. für es el calco directo del «esperar por» y no existe con este verbo.\",\"translation\":\"Espero el autobús.\",\"itemIds\":[\"b1m4wartenauf\",\"bus\"]},{\"id\":\"b1m4l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa las preposiciones regidas\",\"text\":\"Ich interessiere mich ___ Technik. Meine Freunde sprechen oft ___ Videospiele. Ich freue mich schon ___ das nächste Treffen.\",\"answers\":[\"für\",\"über\",\"auf\"],\"bank\":[\"für\",\"über\",\"auf\",\"an\",\"von\",\"mit\"],\"translation\":\"Me intereso por la tecnología. Mis amigos hablan a menudo de videojuegos. Ya me hace ilusión el próximo encuentro.\",\"itemIds\":[\"b1m4sichinteressierenfuer\",\"b1m4sprechenueber\",\"b1m4sichfreuenauf\",\"b1m4dasvideospiel\"],\"tip\":\"Tres bloques distintos, tres preposiciones distintas, y ninguna coincide con la española. Es memoria, no lógica.\"},{\"id\":\"b1m4l3e8\",\"type\":\"build\",\"prompt\":\"Construye con el bloque completo\",\"target\":\"Ich interessiere mich für soziale Netzwerke\",\"translation\":\"Me intereso por las redes sociales\",\"distractors\":[\"an\",\"über\"],\"itemIds\":[\"b1m4sichinteressierenfuer\",\"b1m4dassozialenetzwerk\"]},{\"id\":\"b1m4l3e9\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich freue mich auf das Wochenende\",\"translation\":\"Me hace ilusión el fin de semana\",\"hints\":[\"El bloque de la ilusión: auf + Akkusativ\",\"Ich freue mich ... das Wochenende\"],\"itemIds\":[\"b1m4sichfreuenauf\",\"wochenende\"]},{\"id\":\"b1m4l3e10\",\"type\":\"transform\",\"prompt\":\"Transforma: cambia el tiempo y cambia la preposición\",\"source\":\"Ich freue mich auf das Konzert.\",\"instruction\":\"Dilo cuando el concierto YA ha sido genial\",\"answers\":[\"Ich freue mich über das Konzert\"],\"translation\":\"Me alegro del concierto (que ya fue).\",\"hints\":[\"Lo que ya pasó pide über\",\"Ich freue mich ... das Konzert\"],\"itemIds\":[\"b1m4sichfreuenauf\",\"b1m4sichfreuenueber\"],\"tip\":\"Una preposición marca la diferencia entre ilusión y alegría. En español eso no se ve, y por eso hay que practicarlo aparte.\"},{\"id\":\"b1m4l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Espero tu mensaje.\",\"answers\":[\"Ich warte auf deine Nachricht\"],\"hints\":[\"warten + preposición fija\",\"Ich warte ... deine Nachricht\"],\"itemIds\":[\"b1m4wartenauf\",\"nachricht\"],\"tip\":\"Si la preposición te salió sin pensar, el bloque ya está guardado como una sola pieza. Ese es el objetivo del módulo.\"},{\"id\":\"b1m4l3e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información del centro escolar a las familias · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Liebe Eltern, eine Information aus der Schulleitung. Viele Kolleginnen und Kollegen ärgern sich zurzeit über dasselbe: Die Kinder warten nicht mehr. Nicht auf den Bus, nicht auf eine Antwort, auf gar nichts. Bevor Sie jetzt an die Handys denken — wir sehen genau dasselbe bei uns Erwachsenen. Deshalb laden wir Sie am Donnerstag zu einem Elternabend ein, ähm, ohne erhobenen Zeigefinger, das versprechen wir.\",\"question\":\"„Die Schule macht allein die Handys der Kinder verantwortlich.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«wir sehen genau dasselbe bei uns Erwachsenen»: se incluyen ellos mismos\",null],\"itemIds\":[\"b1m4sichaergernueber\",\"b1m4wartenauf\",\"b1m4denkenan\"],\"tip\":\"«Bevor Sie jetzt an die Handys denken —» anuncia que va a decir lo contrario de lo que esperas. Es el giro típico de estos avisos.\"},{\"id\":\"b1m4l3e13\",\"type\":\"audiomc\",\"prompt\":\"Misma información, segunda tarea. Dos escuchas.\",\"audio\":\"Liebe Eltern, eine Information aus der Schulleitung. Viele Kolleginnen und Kollegen ärgern sich zurzeit über dasselbe: Die Kinder warten nicht mehr. Nicht auf den Bus, nicht auf eine Antwort, auf gar nichts. Bevor Sie jetzt an die Handys denken — wir sehen genau dasselbe bei uns Erwachsenen. Deshalb laden wir Sie am Donnerstag zu einem Elternabend ein, ähm, ohne erhobenen Zeigefinger, das versprechen wir.\",\"question\":\"¿A qué invita el centro?\",\"options\":[\"A una reunión de padres el jueves\",\"A una charla con un experto en tecnología\",\"A firmar unas normas nuevas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"No se anuncia ningún experto\",\"Aquí no se firma nada\"],\"itemIds\":[\"b1m4sichinteressierenfuer\"]}]}],\"resources\":[{\"label\":\"DW — Grammatik: Verben mit Präpositionen\",\"url\":\"https://learngerman.dw.com/de/grammatik/c-56230145\",\"note\":\"La lista oficial del B1 con audio: apréndelos con el ejemplo, nunca en lista pelada.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\
