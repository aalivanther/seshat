s Kind habe ich viel gespielt“\",\"options\":[\"De niño jugaba mucho\",\"Ahora juego mucho\",\"Mi hijo juega mucho\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Jetzt spiele ich viel» — presente, sin als Kind\",\"Eso sería «Mein Kind spielt viel» — als Kind habla de TU infancia\"],\"itemIds\":[\"a2m3vielgespielt\",\"a2m3alskind\",\"gespielt\"],\"tip\":\"als Kind + Perfekt = el imperfecto español («jugaba») sin aprender un tiempo nuevo.\"},{\"id\":\"a2m3l1e2\",\"type\":\"match\",\"prompt\":\"Empareja las piezas de la biografía\",\"pairs\":[{\"target\":\"als Kind\",\"source\":\"de niño\"},{\"target\":\"die Kindheit\",\"source\":\"la infancia\"},{\"target\":\"aufgewachsen\",\"source\":\"crecido\"},{\"target\":\"jetzt\",\"source\":\"ahora\"}],\"itemIds\":[\"a2m3alskind\",\"a2m3kindheit\",\"a2m3aufgewachsen\",\"jetzt\"]},{\"id\":\"a2m3l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa el arranque de la biografía\",\"text\":\"Als ___ habe ich viel gespielt.\",\"answers\":[\"Kind\"],\"translation\":\"De niño jugaba mucho.\",\"hints\":[\"Tu palabra A1 para «niño»\",\"K-i-n-d — sustantivo, con mayúscula\"],\"itemIds\":[\"a2m3alskind\",\"kind\",\"gespielt\"],\"tip\":\"als Kind va sin artículo — y Kind con mayúscula, porque sigue siendo sustantivo.\"},{\"id\":\"a2m3l1e4\",\"type\":\"mc\",\"prompt\":\"¿haben o sein?\",\"question\":\"Ich ___ in Mexiko aufgewachsen.\",\"options\":[\"habe\",\"bin\"],\"answer\":1,\"whyWrong\":[\"aufwachsen es cambio de estado — de bebé a adulto, como aufgestanden (acostado → de pie): va con sein\",null],\"itemIds\":[\"a2m3binaufgewachsen\",\"a2m3aufgewachsen\",\"aufgestanden\"],\"tip\":\"Crecer te transforma: cambio de estado → sein. La regla de a2m2 sigue mandando.\"},{\"id\":\"a2m3l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el participio de crecer\",\"text\":\"Ich bin in Mexiko ___. (crecido)\",\"answers\":[\"aufgewachsen\"],\"translation\":\"Crecí en México.\",\"hints\":[\"aufwachsen es separable: el ge- se cuela en medio\",\"auf + ge + wachsen\"],\"itemIds\":[\"a2m3binaufgewachsen\",\"a2m3aufgewachsen\"],\"tip\":\"Como aufgestanden y eingekauft: en los separables el ge- va EN MEDIO — aufgewachsen.\"},{\"id\":\"a2m3l1e6\",\"type\":\"build\",\"prompt\":\"Construye el chunk estrella — las dos posiciones valen\",\"target\":\"Als Kind habe ich in Guadalajara gewohnt\",\"translation\":\"De niño vivía en Guadalajara\",\"altTargets\":[\"Ich habe als Kind in Guadalajara gewohnt\"],\"distractors\":[\"bin\",\"wohne\"],\"itemIds\":[\"a2m3alskindgewohnt\",\"a2m3gewohnt\",\"a2m3alskind\"],\"tip\":\"Als Kind abre → habe 2º, ich 3º. wohnen no te mueve de A a B: vivir en un sitio va con haben.\"},{\"id\":\"a2m3l1e7\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich bin in Mexiko aufgewachsen\",\"translation\":\"Crecí en México\",\"hints\":[\"bin + participio al final\",\"auf-ge-wachsen, con chs = ks\"],\"itemIds\":[\"a2m3binaufgewachsen\",\"a2m3aufgewachsen\"]},{\"id\":\"a2m3l1e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"De niño jugaba mucho\",\"answers\":[\"Als Kind habe ich viel gespielt\",\"Ich habe als Kind viel gespielt\"],\"hints\":[\"als Kind abre → habe 2º\",\"Als Kind habe ich viel ...\"],\"itemIds\":[\"a2m3vielgespielt\",\"a2m3alskind\",\"gespielt\"],\"tip\":\"El imperfecto español sale gratis: als Kind + tu Perfekt de siempre. Tu biografía ya tiene primera frase.\"}]}],\"resources\":[{\"label\":\"Nicos Weg — busca «Kindheit» (A2)\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Los personajes cuentan su infancia con als Kind + Perfekt — la maqueta de esta lección.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/se
