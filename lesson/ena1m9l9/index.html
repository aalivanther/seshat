o (frase 7)\",\"Esa es Valeria (frase 6)\"],\"itemIds\":[\"encooking\"]},{\"id\":\"ena1m9l9e2\",\"type\":\"mc\",\"prompt\":\"Comprensión (frase 4)\",\"question\":\"“Ben can't cook, but he can make tea.” — ¿Qué SABE hacer Ben?\",\"options\":[\"Preparar té\",\"Cocinar\",\"Nadar\"],\"answer\":0,\"whyWrong\":[null,\"can't cook: eso es justo lo que NO sabe\",\"swim no aparece en el cuento\"],\"itemIds\":[\"encook\"],\"tip\":\"can y can't reparten la frase: lo que no sabe antes del but, lo que sí después. El but siempre avisa del giro.\"},{\"id\":\"ena1m9l9e3\",\"type\":\"order\",\"prompt\":\"Ordena el sábado como en el cuento\",\"sentences\":[\"It's Saturday and it's raining.\",\"Amy is cooking lunch in the kitchen.\",\"Ben makes tea for everyone.\",\"The cat is sleeping under the bed.\",\"Amy says: \\\"I love Saturdays at home!\\\"\"],\"translation\":\"Es sábado y está lloviendo. Amy está cocinando la comida en la cocina. Ben prepara té para todos. El gato está durmiendo debajo de la cama. Amy dice: «¡Me encantan los sábados en casa!».\",\"hints\":[\"Primero la escena (lluvia), luego cada personaje\",\"La frase feliz de Amy cierra el cuento\"],\"itemIds\":[\"enitsraining\",\"encooking\",\"ensleeping\"]},{\"id\":\"ena1m9l9e4\",\"type\":\"shadow\",\"prompt\":\"Sombrea la pregunta del ahora\",\"text\":\"What are you doing?\",\"phonetic\":\"uót aa yu DÚ-ing\",\"translation\":\"¿Qué estás haciendo?\",\"reps\":2,\"itemIds\":[\"enwhatareyoudoing\"]},{\"id\":\"ena1m9l9e5\",\"type\":\"cloze\",\"prompt\":\"Completa la frase 7\",\"text\":\"The cat is ___ under the bed. (durmiendo)\",\"answers\":[\"sleeping\"],\"translation\":\"El gato está durmiendo debajo de la cama.\",\"hints\":[\"sleep + la terminación del ahora\",\"sleep + ing\"],\"itemIds\":[\"ensleeping\",\"enunderthebed\"],\"tip\":\"sleeping arranca en s líquida — la clínica de la lección 7, de guardia hasta en la siesta del gato.\"},{\"id\":\"ena1m9l9e6\",\"type\":\"shadow\",\"prompt\":\"Sombrea el final feliz de Amy\",\"text\":\"I love Saturdays at home!\",\"phonetic\":\"ái LOV SÁ-ta-deis̬ at JÓUM\",\"translation\":\"¡Me encantan los sábados en casa!\",\"reps\":2,\"itemIds\":[\"enathome\"]},{\"id\":\"ena1m9l9e7\",\"type\":\"fastmatch\",\"prompt\":\"Espiral del módulo 7: tu casa, a ritmo\",\"pairs\":[{\"target\":\"kitchen\",\"source\":\"cocina\"},{\"target\":\"living room\",\"source\":\"salón\"},{\"target\":\"bedroom\",\"source\":\"dormitorio\"},{\"target\":\"sofa\",\"source\":\"sofá\"},{\"target\":\"fridge\",\"source\":\"nevera\"}],\"targetSeconds\":22,\"itemIds\":[\"enkitchen\",\"enlivingroom\",\"enbedroom\",\"ensofa\",\"enfridge\"],\"tip\":\"La casa del módulo 7, de visita en el cuento. Si baja sola, sigue tuya.\"},{\"id\":\"ena1m9l9e8\",\"type\":\"audiomc\",\"prompt\":\"Espiral del módulo 8: el tiempo al oído\",\"audio\":\"What's the weather like? | It's windy and cold, but it isn't raining.\",\"question\":\"¿Qué tiempo hace?\",\"options\":[\"Viento y frío\",\"Lluvia\",\"Sol\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"raining suena — pero con isn't: NO llueve\",\"sunny no suena en el audio\"],\"itemIds\":[\"enwhatstheweatherlike\",\"enitswindy\",\"enitsraining\"],\"tip\":\"El parte del módulo 8, con la trampa del isn't. La respuesta buena vive antes del but.\"},{\"id\":\"ena1m9l9e9\",\"type\":\"transform\",\"prompt\":\"Espiral del módulo 8: de hacerlo a saber hacerlo\",\"source\":\"Amy cooks very well.\",\"instruction\":\"Dilo con can (ella SABE cocinar)\",\"answers\":[\"Amy can cook very well\",\"Amy can cook very well.\",\"She can cook very well\",\"She can cook very well.\"],\"translation\":\"Amy sabe cocinar muy bien.\",\"hints\":[\"can entra y la -s de cooks se va\",\"Amy can cook ...\"],\"itemIds\":[\"encook\",\"enshecanswim\",\"enverywell\"],\"tip\":\"can congela el verbo: cooks pierde su -s. La regla del módulo 8, aplicada a la cocinera del cuento.\"},{\"id\":\"ena1m9l9e10\",\"type\":\"cloze\",\"prompt\":\"Espiral del módulo 7: cuenta antes de hablar\",\"text\":\"The
