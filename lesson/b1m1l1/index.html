03e2. \u003cb\u003eTu opinión.\u003c/b\u003e El B1 deja de preguntar «¿dónde vives?» y empieza a preguntar «¿qué te parece?». Por eso el nivel entero gira sobre temas de opinión: la vivienda, el trabajo, la salud, el medio ambiente.\u003cbr/\u003e3. \u003cb\u003eAutonomía.\u003c/b\u003e Vas a escribir 80 palabras seguidas y a hablar tres minutos sin que nadie te dé la frase hecha. Da respeto la primera vez y deja de darlo a la tercera.\u003cbr/\u003e\u003cbr/\u003eY este módulo empieza donde empieza toda vida nueva: con una mudanza. \u003cb\u003eIch bin [[umgezogen|me he mudado]]\u003c/b\u003e — ojo, con \u003cb\u003esein\u003c/b\u003e, porque es movimiento; luego \u003cb\u003eziehe ich ein\u003c/b\u003e (entro a vivir) y poco a poco \u003cb\u003elebe ich mich ein\u003c/b\u003e ([[sich einleben|adaptarse]])."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l1\",\"phaseId\":\"b1m1\",\"title\":\"Angekommen\",\"subtitle\":\"Bienvenido al B1 — y tu mudanza contada en una frase\",\"minutes\":10,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las piezas de una mudanza\",\"itemIds\":[\"b1m1umziehen\",\"b1m1einziehen\",\"b1m1ausziehen\",\"b1m1sicheinleben\",\"b1m1endlichangekommen\",\"b1m1kartons\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Qué cambia ahora (y qué no)\",\"body\":\"$17\",\"table\":[[\"A2\",\"B1\"],[\"Textos de 5 líneas\",\"Artículos de 300-450 palabras\"],[\"«Wo wohnst du?»\",\"«Was hältst du von den Mieten?»\"],[\"30-40 palabras escritas\",\"80 palabras con estructura\"],[\"Responder preguntas\",\"Hablar 3 minutos seguidos\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l1e1\",\"type\":\"match\",\"prompt\":\"Empareja los tres momentos de una mudanza\",\"pairs\":[{\"target\":\"umziehen\",\"source\":\"mudarse\"},{\"target\":\"einziehen\",\"source\":\"entrar a vivir en el piso nuevo\"},{\"target\":\"ausziehen\",\"source\":\"dejar el piso\"},{\"target\":\"sich einleben\",\"source\":\"adaptarse al sitio nuevo\"}],\"itemIds\":[\"b1m1umziehen\",\"b1m1einziehen\",\"b1m1ausziehen\",\"b1m1sicheinleben\"],\"tip\":\"Los tres primeros son el mismo verbo (ziehen = tirar/moverse) con tres prefijos: um- cambias de casa, ein- entras, aus- sales.\"},{\"id\":\"b1m1l1e2\",\"type\":\"fastmatch\",\"prompt\":\"Calentamiento veloz — esto ya es tuyo del A1\",\"pairs\":[{\"target\":\"die Wohnung\",\"source\":\"el piso\"},{\"target\":\"das Zimmer\",\"source\":\"la habitación\"},{\"target\":\"das Haus\",\"source\":\"la casa\"},{\"target\":\"das Schlafzimmer\",\"source\":\"el dormitorio\"},{\"target\":\"das Wohnzimmer\",\"source\":\"el salón\"}],\"targetSeconds\":22,\"itemIds\":[\"wohnung\",\"zimmer\",\"haus\",\"schlafzimmer\",\"wohnzimmer\"],\"tip\":\"El B1 no se gana añadiendo palabras: se gana sacando MÁS RÁPIDO las que ya tienes. El cronómetro aquí solo premia, nunca castiga.\"},{\"id\":\"b1m1l1e3\",\"type\":\"mc\",\"prompt\":\"El auxiliar de la mudanza\",\"question\":\"«Me mudé el sábado» →\",\"options\":[\"Ich habe am Samstag umgezogen\",\"Ich bin am Samstag umgezogen\",\"Ich bin am Samstag umziehen\"],\"answer\":1,\"whyWrong\":[\"umziehen es movimiento de un sitio a otro: pide sein, no haben\",null,\"Falta el participio: el infinitivo no cierra un Perfekt\"],\"itemIds\":[\"b1m1umziehen\",\"a2m1amsamstag\"],\"tip\":\"Como gehen y fahren: si hay cambio de lugar, el Perfekt va con sein. Ich bin umgezogen.\"},{\"id\":\"b1m1l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa el prefijo\",\"text\":\"Am ersten August ziehe ich in die neue Wohnung ___.\",\"answers\":[\"ein\"],\"translation\":\"El uno de agosto entro a vivir en el piso nuevo.\",\"hints\":[\"Entrar en el piso, no salir\",\"ziehen + prefijo de «dentro»\"],\"itemIds\":[\"b1m1einziehen\",\"wohnung\"],\"tip\":\"El prefijo separable viaja al final de la frase: ziehe ... ein. La pinza verbal del A2, intacta.\"},{\"id\":\"b1m1l1e5\",\"type\":\"mc\",\"prompt\":\"Primer contacto con una Relativsatz\",\"question\":\"„Ich habe eine Wohnung gefunden, die hell und günstig ist.“\",\"options\":[\"He encontrado un piso que es luminoso y barato\",\"He encontrado un piso, pero es luminoso y barato\",\"Busco un piso luminoso y barato\"],\"answer\":0,\"whyWrong\":[null,\"«die» aquí no es «pero»: engancha la descripción al piso\",\"El Perfekt (habe ... gefunden) dice que ya lo encontraste\"],\"itemIds\":[\"b1m1einewohnungdiehellist\",\"wohnung\",\"guenstig\"],\"tip\":\"Esa palabrita «die» es el motor del módulo: convierte dos frases en una. La desmontamos en la lección 3.\"},{\"id\":\"b1m1l1e6\",\"type\":\"build\",\"prompt\":\"Construye la frase del día 1\",\"target\":\"Ich bin endlich in Berlin angekommen\",\"altTargets\":[\"Endlich bin ich in Berlin angekommen\"],\"translation\":\"Por fin he llegado a Berlín\",\"distractors\":[\"habe\",\"ankommen\"],\"itemIds\":[\"b1m1endlichangekommen\"],\"tip\":\"ankommen también va con sein. Y «angekommen» no es solo llegar físicamente: es sentirse llegado.\"},{\"id\":\"b1m1l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa el reflexivo\",\"text\":\"Ich habe ___ in der neuen Stadt schnell eingelebt.\",\"answers\":[\"mich\"],\"translation\":\"Me he adaptado rápido a la ciudad nueva.\",\"hints\":[\"sich einleben es reflexivo\",\"Con «ich» el reflexivo es acusativo\"],\"itemIds\":[\"b1m1sicheinleben\"],\"tip\":\"sich einleben = adaptarse. Es la palabra que los alemanes usan para lo que tú estás haciendo ahora mismo con el idioma.\"},{\"id\":\"b1m1l1e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich bin am Wochenende umgezogen\",\"translation\":\"Me mudé el fin de semana\",\"hints\":[\"Empieza como un Perfekt con sein\",\"Ich bin am Wochenende ...\"],\"itemIds\":[\"b1m1umziehen\",\"wochenende\"]},{\"id\":\"b1m1l1e9\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — es la frase con la que llegas\",\"text\":\"Ich bin endlich angekommen.\",\"phonetic\":\"ij bin ENT-lij AN-gue-ko-men\",\"translation\":\"Por fin he llegado.\",\"itemIds\":[\"b1m1endlichangekommen\"],\"tip\":\"Fíjate en el acento: ANgekommen, en la primera sílaba, porque el prefijo an- es separable y por eso se lleva el golpe de voz.\"},{\"id\":\"b1m1l1e10\",\"type\":\"transform\",\"prompt\":\"Del presente al pasado\",\"source\":\"Ich ziehe nach Berlin um.\",\"instruction\":\"Ponla en Perfekt\",\"answers\":[\"Ich bin nach Berlin umgezogen\",\"Nach Berlin bin ich umgezogen\"],\"translation\":\"Me he mudado a Berlín.\",\"hints\":[\"Movimiento → auxiliar sein\",\"El ge- de los separables se cuela en medio: um-ge-zogen\"],\"itemIds\":[\"b1m1umziehen\"],\"tip\":\"umgezogen, como eingekauft o kennengelernt: en los separables el ge- va EN MEDIO.\"},{\"id\":\"b1m1l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me mudé a Berlín y me he adaptado rápido\",\"answers\":[\"Ich bin nach Berlin umgezogen und ich habe mich schnell eingelebt\",\"Ich bin nach Berlin umgezogen und habe mich schnell eingelebt\"],\"hints\":[\"umziehen con sein, einleben con haben\",\"Ich bin nach Berlin ... und habe mich schnell ...\"],\"itemIds\":[\"b1m1umziehen\",\"b1m1sicheinleben\"],\"tip\":\"Dos auxiliares distintos en la misma frase: sein para el movimiento, haben para lo demás. Ya estás produciendo B1.\"},{\"id\":\"b1m1l1e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1, mensaje 1 · tarea 1 de 2. Lee la afirmación ANTES de darle al play y marca Richtig o Falsch. Como en el examen, este texto suena DOS veces.\",\"audio\":\"Guten Tag, Frau Marín, hier ist die Spedition Nordstern, ähm, wegen Ihres Umzugs am Samstag. Also, unser Wagen ist um acht Uhr bei Ihnen, nicht um zehn, wie wir gesagt hatten — da hat sich der Kollege leider vertan. Und ganz wichtig: Beschriften Sie bitte alle Kartons, sonst wissen wir nachher nicht, was in welches Zimmer soll. Bis Samstag!\",\"question\":\"„Der Wagen der Spedition kommt am Samstag um zehn Uhr.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Lo dice y lo corrige en la misma frase: «um acht Uhr …, nicht um zehn». La corrección manda\",null],\"itemIds\":[\"b1m1umziehen\"],\"tip\":\"Así abre el Teil 1 de verdad: primero una afirmación Richtig/Falsch, después una de tres opciones. Y el dato que decide llega detrás de un «nicht».\"},{\"id\":\"b1m1l1e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea: la de tres opciones. Dos escuchas, como en el examen.\",\"audio\":\"Guten Tag, Frau Marín, hier ist die Spedition Nordstern, ähm, wegen Ihres Umzugs am Samstag. Also, unser Wagen ist um acht Uhr bei Ihnen, nicht um zehn, wie wir gesagt hatten — da hat sich der Kollege leider vertan. Und ganz wichtig: Beschriften Sie bitte alle Kartons, sonst wissen wir nachher nicht, was in welches Zimmer soll. Bis Samstag!\",\"question\":\"¿Qué le piden a Sofía?\",\"options\":[\"Que ponga en cada caja de qué habitación es\",\"Que baje las cajas al portal\",\"Que llame para confirmar la hora\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Nadie le pide que mueva nada: para eso van ellos\",\"Le informan del cambio, no le piden que devuelva la llamada\"],\"itemIds\":[\"b1m1kartons\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m1-1\",\"book\":\"Ich habe eine Wohnung gefunden.\",\"real\":\"Ich hab' 'ne Wohnung gefunden.\",\"meaning\":\"He encontrado piso\",\"when\":\"Con amigos y hablando: así suena de verdad. Lo que no se hace nunca es ESCRIBIRLO — ni en un correo a la casera ni en el Schreiben: allí «eine» va entera y sin apóstrofo.\",\"register\":\"amigos\",\"exam\":\"Ich möchte Ihnen mitteilen, dass ich eine Wohnung gefunden habe.\",\"note\":\"«'ne» es «eine» comida por el habla rápida; también verás 'nen (einen) y 'nem (einem). Reconocerlo te ahorra media conversación.\",\"sound\":\"ij jab ne VOO-nung gue-FUN-den\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m1natnewohnung\"}}],\"resources\":[{\"label\":\"DW — Nicos Weg B1\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"El curso B1 de DW arranca también con temas de vida cotidiana: escúchalo para calibrar la velocidad del nivel.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
