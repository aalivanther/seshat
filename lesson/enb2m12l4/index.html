7q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:Tacc,"])</script><script>self.__next_f.push([1,"Candidates who fail the B2 Communicator often say, afterwards, that the English was fine. What was not fine was the last forty minutes. The written paper is two hours and forty minutes with no break. The listening takes about thirty of those, and then Reading and Writing share two hours and ten. There is no cloze to wake you up with a small victory. There is one long text, then a gapped paragraph, then four short texts with a stance to detect, then seven open questions, and then — with whatever clock you have left — two pieces of writing that add up to 250 to 350 words.\u003cbr/\u003e\u003cbr/\u003eThe handbook does not say this, because handbooks do not. The practice paper does, if you time it. Twenty-five minutes of audio for twenty-six questions is not more questions. It is the same questions with the answer further away. Two hours and ten for reading and writing is not more time than B1. It is the same time for forty percent more reading and fifty-five percent more writing. Half the problem is the clock. The other half is going on writing as if the clock were someone else's job.\u003cbr/\u003e\u003cbr/\u003eThe spoken exam is a different paper and a different day, and that is a kindness. It lasts thirteen minutes. Part 3 is a written prompt, twenty seconds to think, and an interlocutor who says, as a matter of design, that they have different ideas. You leave with a plan or you have done a B1. Part 4 is two minutes, not ninety seconds, with the same thirty seconds of preparation you had last year. People freeze because they try to say everything. The descriptor wants highlighting of significant points and subsidiary points underneath. That is the same skill as the past perfect in a relative clause, said out loud, with a clock on the table.\u003cbr/\u003e\u003cbr/\u003eThere are no skill minimums. The written paper is marked out of 150; you pass at 75; a High Pass is 101. Listening, Reading and Writing add up. That sentence has ruined more last weeks than it has saved, because candidates hear «add up» and stop training the writing. Twenty-four raw marks out of seventy-six is not a third you can donate. It is the third that happens when you are tired. Online with live remote proctoring means you can sit it from Palmer Road at a time you choose. It does not mean the clock is softer. Nadia Kowalczyk, who rang from the agency last year, still wants an accredited B2. The posts have not moved. Book the exam. Time a full paper. Transfer nothing you have not already decided. The English, by the time you reach this module, is not the part that fails. Time the paper once, without stopping, on a Sunday. If the second writing task is still a blank page at minute 155, you have your answer, and it is not a relative clause. Do it again the next Sunday. The resistance is the exam."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m12l4\",\"phaseId\":\"enb2m12\",\"title\":\"One long text — and no cloze\",\"subtitle\":\"Reading 1 y 2: el Part 1 cambió de naturaleza; el 2 sigue siendo reconstruir el párrafo\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que desapareció y lo que se quedó\",\"itemIds\":[\"enb2m12onelongtext\",\"enb2m12nocloze\",\"enb2m12sixextracted\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Sorpresa nº 2: se acabó el hueco en el Reading\",\"body\":\"En B1 el Part 1 eran cinco textos cortos de 25-50 palabras con un hueco. En B2 es [[one long text with six questions|un solo texto largo con seis preguntas de comprensión]]. [[There is no
