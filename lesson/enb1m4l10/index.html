who\u003c/i\u003e → persona, \u003ci\u003ehow many\u003c/i\u003e → número, \u003ci\u003ewhy\u003c/i\u003e → razón.\u003cbr/\u003e3. \u003cb\u003eCopia del texto.\u003c/b\u003e No parafrasees por elegancia: si la respuesta está escrita, cópiala tal cual y recorta hasta tres palabras.\u003cbr/\u003e4. \u003cb\u003eLas preguntas van en el orden del texto.\u003c/b\u003e Si has contestado la 4 en el párrafo tres, la 5 no está en el primero.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el aviso de este módulo:\u003c/b\u003e el texto del Part 4 es expositivo o biográfico, y ese género \u003cb\u003evive en pasiva\u003c/b\u003e. Vas a ver \u003ci\u003ewas closed down, has been tried, is left, was collected\u003c/i\u003e por todas partes. Si la pasiva te frena, no es que no sepas leer: es que este es tu texto de entrenamiento.\u003cbr/\u003e\u003cbr/\u003eHoy el texto trae \u003cb\u003elas ocho\u003c/b\u003e, y las ocho se escriben: cuatro en el primer ejercicio y cuatro en el segundo, con el mismo texto delante —en el examen la hoja no se retira—. Dos de cada cuatro no se contestan localizando: hay que juntar dos frases separadas."])</script><script>self.__next_f.push([1,"18:T950,"])</script><script>self.__next_f.push([1,"When the Valley Voice was closed down in 2016, nobody expected to see it again. The paper had been printed every Thursday since 1919, and in its last year it was still read by four thousand people. But the company that owned it had bought eleven other local titles, and the decision was taken in an office in London.\u003cbr/\u003e\u003cbr/\u003eGwen Pritchard was twenty-six and had worked there for four years. \"We were told on a Tuesday and the last edition was printed on the Thursday,\" she says. \"Nobody came up from London. It was done by email.\"\u003cbr/\u003e\u003cbr/\u003eFor three years the valley had no paper of its own, and what happened next was not dramatic, which is exactly why people remember it. Council meetings were still held, but they were no longer reported. Two schools were merged and almost nobody heard about it until the letters arrived. A [[planning application|solicitud de licencia de obra]] for two hundred houses was approved with four objections; the previous one, in 2013, had received six hundred.\u003cbr/\u003e\u003cbr/\u003e\"It is easy to say that a newspaper is only news,\" says a lecturer in Cardiff who studies what has become known as a [[news desert|zona sin prensa local]]. \"What is actually lost is the record. If nothing is written down, nothing can be checked later.\"\u003cbr/\u003e\u003cbr/\u003eThe Valley Voice came back in 2019, and it came back small. It is now written almost entirely by volunteers: a retired teacher, two [[sixth-formers|estudiantes de bachillerato]] and a nurse who does the sport. Sixteen pages are produced every fortnight and printed in Cardiff, because the last printer in the valley shut down in 2021. Gwen edits it in the evenings; she is paid for eight hours a week and works about twenty.\u003cbr/\u003e\u003cbr/\u003eThe model is not comfortable and she says so. \"We are not a business. We are kept alive by a [[grant|subvención pública]], a chip shop that buys the back page and about six hundred people who pay two pounds a month. If any one of those three stopped, we would stop.\"\u003cbr/\u003e\u003cbr/\u003eShe is asked constantly whether a website would be cheaper. It would. It has been tried twice in this valley, and both times it was read by the people who already followed the news. The paper is left in the surgery, the chip shop and the two pubs, and it is picked up by people who were not looking for it.\u003cbr/\u003e\u003cbr/\u003e\"That is the whole argument,\" Gwen says. \"Not the paper. The people who weren't looking.\""])</script><script>self.__next_f.push([1,"19:T950,"])</script><script>self.__next_f.push([1,"When the Valley Voice was closed down in 2016, nobody expected to see it again. The paper had been printed every Thursday since 1919, and staff told that the paper was closing? (máximo 3 palabras)\",\"accepted\":[\"by email\",\"email\",\"by e-mail\",\"in an email\"],\"inference\":true,\"why\":\"El texto nunca escribe «the staff were told by email». Dice «We were told on a Tuesday» y, dos líneas después, «Nobody came up from London. It was done by email.» Hay que unir las dos: ese «it» es la comunicación del cierre.\"},{\"id\":\"enb1m4l10e1q3\",\"q\":\"How many people still read the paper in its last year? (máximo 3 palabras)\",\"accepted\":[\"four thousand\",\"4000\",\"4,000\",\"four thousand people\",\"40 00\"],\"why\":\"«in its last year it was still read by four thousand people». Otro agente de pasiva convertido en respuesta: por eso hay que leer los «by».\"},{\"id\":\"enb1m4l10e1q4\",\"q\":\"According to the lecturer, what is lost when nothing gets written down? (máximo 3 palabras)\",\"accepted\":[\"the record\",\"record\",\"its record\"],\"inference\":true,\"why\":\"Ella lo dice de los periódicos en general —«What is actually lost is the record»— y el texto lo demuestra tres párrafos antes con los plenos que ya no se cuentan y las escuelas que se fusionaron sin que nadie se enterara. La respuesta está, pero hay que traerla de un sitio a otro.\"}],\"itemIds\":[\"enb1m4shutdown\",\"enb1m4volunteer\",\"enb1m4council\",\"enb1m4localpaper\",\"enb1m4copiesareprinted\"],\"tip\":\"Cuenta las pasivas del texto: was closed down, had been printed, was read, was taken, were told, were held, were reported, were merged, was approved, is written, are produced, is paid, are kept, is asked, has been tried, is left, is picked up. Diecisiete. Eso es el Reading Part 4, y por eso este módulo iba antes que los de opinión.\"},{\"id\":\"enb1m4l10e1b\",\"type\":\"read\",\"prompt\":\"Reading Part 4, segunda mitad. El mismo texto, delante otra vez —en el examen no te lo quitan— y las preguntas 5 a 8. Máximo tres palabras cada una.\",\"title\":\"The paper that was brought back\",\"source\":\"From a weekly paper published in Cardiff (adapted)\",\"text\":\"$19\",\"questions\":[{\"id\":\"enb1m4l10e1bq5\",\"q\":\"Who writes the paper now? (máximo 3 palabras)\",\"accepted\":[\"volunteers\",\"mostly volunteers\",\"local volunteers\",\"unpaid volunteers\"],\"why\":\"«It is now written almost entirely by volunteers». El agente de la pasiva es exactamente la respuesta.\"},{\"id\":\"enb1m4l10e1bq6\",\"q\":\"How many hours a week is Gwen paid for? (máximo 3 palabras)\",\"accepted\":[\"eight\",\"eight hours\",\"8\",\"8 hours\",\"for eight hours\"],\"why\":\"«she is paid for eight hours a week and works about twenty». La trampa está servida: te preguntan por las que le pagan, no por las que trabaja.\"},{\"id\":\"enb1m4l10e1bq7\",\"q\":\"How many different sources of money keep the paper alive? (una palabra)\",\"accepted\":[\"three\",\"3\"],\"inference\":true,\"why\":\"Hay que contarlas: la subvención, la tienda de patatas fritas que paga la contraportada y las seiscientas personas que ponen dos libras al mes. Ella lo remata sin numerar la lista: «If any one of those three stopped, we would stop».\"},{\"id\":\"enb1m4l10e1bq8\",\"q\":\"Why is the paper left in the surgery and the pubs? (máximo 3 palabras)\",\"accepted\":[\"to reach strangers\",\"to reach new readers\",\"to reach new people\",\"for new readers\",\"to find new readers\"],\"inference\":true,\"why\":\"El texto no dice «para llegar a lectores nuevos»: dice que la web «was read by the people who already followed the news» y que el papel «is picked up by people who were not looking for it». La razón la montas tú, y Gwen la firma en la última línea: «Not the paper. The people who weren't looking.»\"}],\"itemIds\":[\"enb1m4volunteer\",\"enb1m4localpaper\",\"enb1m4copiesareprinted\"],\"tip\":\"Ocho preguntas, ocho marks, y ni una de test: eso es el Reading Part 4 entero. Y fíjate en lo que acaban de pedirte dos veces: no localizar una línea, sino juntar dos que están en párrafos distintos.\"},{\"id\":\"enb1m4l10e2\",\"type\":\"mc\",\"prompt\":\"La estrategia, antes de nada\",\"question\":\"En el Reading Part 4, ¿qué haces PRIMERO?\",\"options\":[\"Leer el texto por encima sin buscar nada\",\"Leer la primera pregunta y buscarla en el texto\",\"Traducir el primer párrafo entero\"],\"answer\":0,\"whyWrong\":[null,\"Buscar sin saber de qué va el texto te hace leer cuatro veces lo mismo. Y el reloj del Reading corre con el del Writing: son 2 h 10 para los dos.\",\"Traducir es la manera más cara de leer. En el examen no hay tiempo para hacerlo ni con un párrafo.\"],\"itemIds\":[\"enb1m4skimthetext\"],\"tip\":\"«Skim» es leer por encima para hacerse una idea. «Scan» es barrer buscando un dato concreto. El Part 4 se hace en ese orden: primero skim, luego scan pregunta a pregunta.\"},{\"id\":\"enb1m4l10e3\",\"type\":\"mc\",\"prompt\":\"La regla de las tres palabras\",\"question\":\"La pregunta es «Where is the paper printed?». ¿Qué escribes?\",\"options\":[\"The paper is printed in Cardiff every fortnight.\",\"In Cardiff\",\"Cardiff, because the last printer in the valley shut down.\"],\"answer\":1,\"whyWrong\":[\"Ocho palabras: se puntúa como incorrecta aunque el contenido sea perfecto. La instrucción del examen es un máximo, no una sugerencia.\",null,\"Contesta lo que se pregunta y añade una razón que nadie ha pedido — y se pasa de tres palabras.\"],\"itemIds\":[\"enb1m4copyfromthetext\"],\"tip\":\"Regla de bolsillo: contesta como si te cobraran por palabra. La respuesta correcta casi nunca pasa de dos.\"},{\"id\":\"enb1m4l10e4\",\"type\":\"match\",\"prompt\":\"Cada «wh-» pide una clase de respuesta. Empareja.\",\"pairs\":[{\"target\":\"When…?\",\"source\":\"una fecha o un momento\"},{\"target\":\"Where…?\",\"source\":\"un sitio\"},{\"target\":\"Who…?\",\"source\":\"una persona o un grupo\"},{\"target\":\"How many…?\",\"source\":\"un número\"},{\"target\":\"Why…?\",\"source\":\"una razón corta\"}],\"itemIds\":[\"enb1m4underlinethekeyword\"],\"tip\":\"Saber qué CLASE de respuesta esperan descarta media página antes de leerla. Si la pregunta empieza por «how many», estás buscando una cifra: sáltate todo lo demás.\"},{\"id\":\"enb1m4l10e5\",\"type\":\"type\",\"prompt\":\"Recorta la respuesta a tres palabras como mucho\",\"question\":\"La respuesta larga es «The paper is now written almost entirely by volunteers». ¿Qué escribirías en la hoja?\",\"answers\":[\"volunteers\",\"Volunteers\",\"by volunteers\",\"local volunteers\"],\"hints\":[\"Solo la parte que contesta al «who»\",\"Una sola palabra basta\"],\"itemIds\":[\"enb1m4copyfromthetext\",\"enb1m4volunteer\"],\"tip\":\"Recortar es la mitad del ejercicio. Localizar la frase es fácil; quedarse con la palabra que contesta y tirar el resto es lo que separa el ocho del cinco.\"},{\"id\":\"enb1m4l10e6\",\"type\":\"cloze\",\"prompt\":\"Completa la instrucción del examen\",\"text\":\"Answer the questions. Write no more ___ three words for each answer.\",\"answers\":[\"than\"],\"translation\":\"Contesta a las preguntas. Escribe un máximo de tres palabras por respuesta.\",\"hints\":[\"Comparativo\",\"more ...\"],\"itemIds\":[\"enb1m4copyfromthetext\"],\"tip\":\"«no more than» es la fórmula exacta de la hoja del examen. Reconocerla al vuelo evita el error más caro del Part 4: contestar de más.\"},{\"id\":\"enb1m4l10e7\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The answer must have no more that three words.\",\"answers\":[\"The answer must have no more than three words.\"],\"why\":\"«than» es la palabra del comparativo; «that» es el relativo o la conjunción. Se escriben casi igual y se confunden a la velocidad de escritura del examen.\",\"translation\":\"La respuesta no puede tener más de tres palabras.\",\"itemIds\":[\"enb1m4copyfromthetext\"]},{\"id\":\"enb1m4l10e8\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye las instrucciones del Part 4 — tres huecos\",\"text\":\"Read the question first and underline the key word. ___ skim the text before you start answering. Copy the answer ___ the text when you can, and never write a full sentence, ___ you will run out of time.\",\"answers\":[\"Always\",\"from\",\"otherwise\"],\"bank\":[\"Always\",\"from\",\"otherwise\",\"Never\",\"of\",\"unless\",\"although\"],\"translation\":\"Lee primero la pregunta y subraya la palabra clave. Lee siempre el texto por encima antes de empezar a contestar. Copia la respuesta del texto cuando puedas, y no escribas nunca una frase entera; si no, te quedarás sin tiempo.\",\"itemIds\":[\"enb1m4skimthetext\",\"enb1m4copyfromthetext\",\"enb1m4underlinethekeyword\",\"enb1m2otherwise\"],\"tip\":\"Tres huecos y ni una palabra de contenido: un adverbio, una preposición y un conector. Es exactamente el reparto del Reading Part 1 — el laboratorio del módulo 2 vuelve aquí de rebote.\"},{\"id\":\"enb1m4l10e9\",\"type\":\"transform\",\"prompt\":\"El texto del Part 4 está lleno de estas. Pásala a pasiva.\",\"source\":\"The company closed the paper in 2016.\",\"instruction\":\"Ponla en pasiva, sin decir quién\",\"answers\":[\"The paper was closed in 2016\",\"The paper was closed down in 2016\",\"The paper was closed in 2016.\"],\"translation\":\"El periódico se cerró en 2016.\",\"hints\":[\"Empieza por «The paper…» y quita la empresa\",\"The paper was ... in 2016\"],\"itemIds\":[\"enb1m4shutdown\",\"enb1m4wasbuilt\"],\"tip\":\"Y ahora fíjate en lo que acabas de hacer: has borrado a la empresa de la frase. En el examen, cada pasiva sin agente es una pregunta que el texto no contesta — y a veces es justo la que te preguntan.\"},{\"id\":\"enb1m4l10e10\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"Subraya la palabra clave de la pregunta.\",\"answers\":[\"Underline the key word in the question\",\"Underline the key word in the question.\",\"Underline the key word of the question\"],\"hint\":\"Empieza por el imperativo del verbo de subrayar\",\"itemIds\":[\"enb1m4underlinethekeyword\"],\"tip\":\"En el examen se puede escribir en el cuadernillo: subrayar, tachar, apuntar al margen. Nadie corrige eso, y hacerlo cambia la nota.\"},{\"id\":\"enb1m4l10e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — las tres órdenes del Part 4\",\"text\":\"Skim the text first. Underline the key word in the question. Copy the answer from the text.\",\"phonetic\":\"skim de tekst feest · an-da-LÁIN de kii ueed in de KUÉS-chon · KÓ-pi di ÁAN-sa from de tekst\",\"translation\":\"Lee el texto por encima primero. · Subraya la palabra clave de la pregunta. · Copia la respuesta del texto.\",\"itemIds\":[\"enb1m4skimthetext\",\"enb1m4underlinethekeyword\",\"enb1m4copyfromthetext\"],\"tip\":\"Dilas hasta que salgan solas. El día del examen no vas a razonar la estrategia: vas a ejecutarla o no, y eso se decide ahora.\"},{\"id\":\"enb1m4l10e12\",\"type\":\"audiomc\",\"prompt\":\"Cierre del módulo en formato Listening. Dos escuchas.\",\"audio\":\"Valeria? The correction's in this week's Gazette, page two. Short, but it's there.|Oh, good. Did they say where the photo came from?|They did, yes — it was taken in Leeds in 2019, exactly as you told them. And the editor's asked whether somebody from the library would write a short piece about the evening service.|Me?|Well, you're the one who wrote the letter.\",\"question\":\"¿Qué le proponen a Valeria al final?\",\"options\":[\"Que escriba un texto sobre el servicio de tardes\",\"Que mande otra carta al director\",\"Que hable con el ayuntamiento\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La carta ya está escrita: es lo que ha provocado todo lo demás.\",\"Del ayuntamiento no se habla en esta conversación.\"],\"itemIds\":[\"enb1m4wascovered\",\"enb1m4wasposted\",\"enb1m4misleading\"],\"tip\":\"Cuatro laboratorios hechos —Listening 1, Reading 1, Listening 3 y Reading 4—, seis por delante. Y la carta de la lección 8 acaba de tener consecuencias: en el módulo que viene, Valeria escribe.\"},{\"id\":\"enb1m4l10e13\",\"type\":\"type\",\"prompt\":\"Cierre del laboratorio\",\"question\":\"El periódico se cerró en 2016 y ahora lo sacan unos voluntarios.\",\"answers\":[\"The paper was closed in 2016 and it is now written by volunteers\",\"The paper was closed down in 2016 and it is now written by volunteers\",\"The paper was closed in 2016 and it's now written by volunteers\"],\"hints\":[\"Dos pasivas: la primera sin agente, la segunda con él\",\"The paper was ... in 2016 and it is now written by ...\"],\"itemIds\":[\"enb1m4shutdown\",\"enb1m4volunteer\",\"enb1m4wasbuilt\"],\"tip\":\"Una frase, dos pasivas y una decisión en cada una: en la primera el agente sobra, en la segunda es la noticia. Si eso ya lo decides sin pensarlo, el módulo ha hecho su trabajo.\"}]}],\"resources\":[{\"label\":\"LanguageCert — B1 Achiever, Practice Paper 1 (Reading)\",\"url\":\"https://www.languagecert.org/en/language-exams/english/languagecert-international-esol/b1-achiever-2279\",\"note\":\"Haz solo el Reading Part 4 con el papel oficial, cronometrado y sin mirar las claves. Ocho preguntas, quince minutos, tres palabras como máximo por respuesta.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"1a:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-w
