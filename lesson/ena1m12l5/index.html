area 1\u003c/b\u003e: respondes a un email con 3 puntos dados — responde LOS TRES. \u003cb\u003eTarea 2\u003c/b\u003e: una nota o postal cumpliendo 2 funciones (invitar, agradecer, informar, disculparse). La plantilla: \u003cb\u003eDear + nombre,\u003c/b\u003e → 2-3 frases con los puntos → \u003cb\u003eSee you soon!\u003c/b\u003e o \u003cb\u003eBest wishes,\u003c/b\u003e + tu nombre. El saludo y la despedida dan puntos casi gratis. Y las 4 funciones son tu módulo 11: invitar = \u003cb\u003eDo you want to come…?\u003c/b\u003e · agradecer = \u003cb\u003eThank you for…\u003c/b\u003e · disculparse = \u003cb\u003eSorry, I can't come.\u003c/b\u003e · informar = The party is \u003cb\u003eon\u003c/b\u003e Saturday \u003cb\u003eat\u003c/b\u003e seven. Apunta a 35-45 palabras: cumples sin pasarte. Trampa de preposición: thank you \u003cb\u003efor\u003c/b\u003e (nunca «of»).\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena1m12l5e1\",\"type\":\"mc\",\"prompt\":\"Las reglas del juego\",\"question\":\"¿Cuántas palabras piden los dos textos del Writing?\",\"options\":[\"30-50\",\"10-15\",\"80-100\"],\"answer\":0,\"whyWrong\":[null,\"Muy corto: no da para cumplir los puntos pedidos\",\"De más tampoco: no hay tiempo y creces en errores\"],\"itemIds\":[\"endearamy\"],\"tip\":\"Apunta a 35-45. Y cuenta: responder TODOS los puntos vale más que una frase bonita.\"},{\"id\":\"ena1m12l5e2\",\"type\":\"match\",\"prompt\":\"Empareja función y fórmula — el corazón de la Tarea 2\",\"pairs\":[{\"target\":\"Do you want to come to my party?\",\"source\":\"invitar\"},{\"target\":\"Thank you for the invitation!\",\"source\":\"agradecer\"},{\"target\":\"Sorry, I can't come.\",\"source\":\"disculparse\"},{\"target\":\"The party is on Saturday at seven.\",\"source\":\"informar\"}],\"itemIds\":[\"endoyouwanttocome\",\"enthankyoufortheinvitation\",\"ensorryicant\"],\"tip\":\"Las 4 funciones del examen = tus chunks del módulo 11. El Writing ya estaba aprendido.\"},{\"id\":\"ena1m12l5e3\",\"type\
