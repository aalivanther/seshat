ar, nunca el verbo: \u003cb\u003eYes, I did. / No, I didn't.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ePor qué al principio se te olvida el did entero:\u003c/b\u003e en español la pregunta se hace con la entonación y el orden apenas cambia («¿adónde fuiste?»). En inglés no hay entonación que valga — \u003cb\u003esin auxiliar no hay pregunta\u003c/b\u003e, ni en escrito ni en oral.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa excepción que ya viste en el módulo 1\u003c/b\u003e, y que ahora se cobra: cuando la palabra qu- \u003cb\u003eES el sujeto\u003c/b\u003e, el auxiliar sobra. \u003cb\u003e[[What happened?|¿Qué pasó?]]\u003c/b\u003e, \u003cb\u003e[[Who told you?|¿Quién te lo dijo?]]\u003c/b\u003e, \u003cb\u003eWho phoned?\u003c/b\u003e Nadie dice \u003ci\u003eWho did tell you?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eRegla corta para decidir en un segundo: si la pregunta es «\u003cb\u003e¿quién\u003c/b\u003e hizo algo?» o «\u003cb\u003e¿qué\u003c/b\u003e pasó?», nada de did. Si es «¿qué hiciste \u003cb\u003etú\u003c/b\u003e?», did obligatorio."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m2l4\",\"phaseId\":\"ena2m2\",\"title\":\"Where did you go?\",\"subtitle\":\"Preguntar por lo que le pasó a otro — y sacarle la historia entera\",\"minutes\":11,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las preguntas que hacen hablar a otro\",\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2whathappenednext\",\"ena2m2didyouseeit\",\"ena2m2howdidyougethome\",\"ena2m2whotoldyou\",\"ena2m2whydidyouleave\",\"ena2m1whatdidyoudo\",\"ena2m1yesidid\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La pregunta en pasado: tres piezas y siempre en el mismo orden\",\"body\":\"$17\",\"table\":[[\"quieres saber…\",\"pregunta\",\"el verbo va…\"],[\"adónde\",\"Where did you go?\",\"go, desnudo\"],[\"qué\",\"What did you do?\",\"do, desnudo\"],[\"cómo\",\"How did you get home?\",\"get, desnudo\"],[\"por qué\",\"Why did you leave?\",\"leave, desnudo\"],[\"sí o no\",\"Did you see it?\",\"see, desnudo\"],[\"quién lo hizo\",\"Who told you?\",\"told — sin auxiliar, aquí sí va el pasado\"]]}},{\"kind\":\"note\",\"note\":{\"title\":\"Y ahora, cómo suena de verdad\",\"body\":\"En el Listening del examen no vas a oír «did you» separado y limpio. Al hablar a velocidad normal, \u003cb\u003edid you\u003c/b\u003e se funde en una sílaba: \u003cb\u003e«DÍ-dyu»\u003c/b\u003e, y a veces directamente \u003cb\u003e«dja»\u003c/b\u003e.\u003cbr/\u003e\u003cbr/\u003e· Did you see it? → \u003cb\u003eDÍ-dyu SÍI it\u003c/b\u003e\u003cbr/\u003e· What did you do? → \u003cb\u003euót-dyu DÚU\u003c/b\u003e\u003cbr/\u003e· Where did you go? → \u003cb\u003euéa-dyu GÓU\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eEsto no es dejadez ni acento raro: es \u003cb\u003ecómo se habla\u003c/b\u003e. Lo importante para ti es que \u003cb\u003elo que se encoge al hablar se escribe entero\u003c/b\u003e. Tú escribe \u003ci\u003eDid you\u003c/i\u003e; solo tienes que reconocerlo cuando llega pegado.\u003cbr/\u003e\u003cbr/\u003eY un aviso de estrategia: si en el examen pierdes el principio de una pregunta, \u003cb\u003eno la des por perdida\u003c/b\u003e. El final («…go?», «…see it?») lleva el verbo, y el verbo suele bastar para contestar.\",\"table\":[[\"escrito\",\"cómo suena\",\"qué se ha fundido\"],[\"Did you see it?\",\"DÍ-dyu SÍI it\",\"did + you\"],[\"What did you do?\",\"uót-dyu DÚU\",\"did + you, y el what se pega\"],[\"Where did you go?\",\"uéa-dyu GÓU\",\"lo mismo\"],[\"Who told you?\",\"juu TÓULD-yu\",\"told + you\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m2l4e1\",\"type\":\"mc\",\"prompt\":\"«¿Adónde fuiste?»\",\"question\":\"¿Cuál es la buena?\",\"options\":[\"Where did you go?\",\"Where did you went?\",\"Where you went?\"],\"answer\":0,\"whyWrong\":[null,\"Pasado dos veces: did ya lo marca y go va desnudo\",\"Sin auxiliar no hay pregunta inglesa: la entonación sola es calco del español\"],\"itemIds\":[\"ena2m2wheredidyougo\"]},{\"id\":\"ena2m2l4e2\",\"type\":\"bucket\",\"prompt\":\"¿Esta pregunta necesita did o no?\",\"categories\":[\"necesita did\",\"sin did: la palabra qu- ES el sujeto\"],\"items\":[{\"text\":\"¿Adónde fuiste?\",\"bucket\":0},{\"text\":\"¿Quién te lo dijo?\",\"bucket\":1},{\"text\":\"¿Qué pasó?\",\"bucket\":1},{\"text\":\"¿Cómo volviste a casa?\",\"bucket\":0},{\"text\":\"¿Por qué te fuiste?\",\"bucket\":0},{\"text\":\"¿Quién llamó?\",\"bucket\":1}],\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2whotoldyou\",\"ena2m1whathappened\",\"ena2m2howdidyougethome\",\"ena2m2whydidyouleave\"],\"tip\":\"El truco: traduce la pregunta y mira si la palabra qu- hace de sujeto. «¿QUIÉN te lo dijo?» — quién es el que dice, así que es sujeto y no hace falta did.\"},{\"id\":\"ena2m2l4e3\",\"type\":\"cloze\",\"prompt\":\"Completa la pregunta\",\"text\":\"Where ___ you go last night?\",\"answers\":[\"did\"],\"translation\":\"¿Adónde fuiste anoche?\",\"hints\":[\"El ayudante del pasado, igual para todas las personas\",\"d…\"],\"itemIds\":[\"ena2m2wheredidyougo\",\"enlastnight\"]},{\"id\":\"ena2m2l4e4\",\"type\":\"cloze\",\"prompt\":\"Y ahora la excepción — sin auxiliar el verbo SÍ lleva el pasado\",\"text\":\"Who ___ (tell) you about the party?\",\"answers\":[\"told\"],\"translation\":\"¿Quién te habló de la fiesta?\",\"hints\":[\"Aquí «quién» es el sujeto: no hay did que lleve la marca\",\"tell → t…\"],\"itemIds\":[\"ena2m2whotoldyou\"],\"tip\":\"Fíjate en el mecanismo: sin auxiliar, la marca de pasado vuelve al verbo. No es otra regla — es la misma, mirada del otro lado.\"},{\"id\":\"ena2m2l4e5\",\"type\":\"transform\",\"prompt\":\"Pásala a pregunta\",\"source\":\"You went home early.\",\"instruction\":\"Hazla pregunta de sí o no\",\"answers\":[\"Did you go home early?\"],\"translation\":\"¿Te fuiste a casa pronto?\",\"hints\":[\"El auxiliar abre la frase y el verbo se desnuda\",\"D… you g… home early?\"],\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2icamehomelate\"]},{\"id\":\"ena2m2l4e6\",\"type\":\"transform\",\"prompt\":\"Otra, con palabra qu-\",\"source\":\"She saw the message.\",\"instruction\":\"Pregunta cuándo, con «When»\",\"answers\":[\"When did she see the message?\"],\"translation\":\"¿Cuándo vio el mensaje?\",\"hints\":[\"When + did + sujeto + verbo desnudo\",\"When d… she s… the message?\"],\"itemIds\":[\"ena2m2didyouseeit\",\"ena2m2shegotamessage\",\"enmessage\"]},{\"id\":\"ena2m2l4e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el doble pasado en pregunta\",\"wrong\":\"Where did you went?\",\"answers\":[\"Where did you go?\"],\"why\":\"did ya dice que la frase es pasada, así que el verbo vuelve a su forma de diccionario. Con los rebeldes se nota más porque went y go no se parecen, pero la regla es la misma que con «Did you watched?».\",\"translation\":\"¿Adónde fuiste?\",\"itemIds\":[\"ena2m2wheredidyougo\"]},{\"id\":\"ena2m2l4e8\",\"type\":\"errorfix\",\"prompt\":\"Corrige el auxiliar que sobra\",\"wrong\":\"Who did tell you about the party?\",\"answers\":[\"Who told you about the party?\"],\"why\":\"Cuando la palabra qu- es el sujeto de la frase (¿quién?, ¿qué?), no hay auxiliar: el verbo lleva su pasado directamente. Who told you? · What happened? · Who phoned?\",\"translation\":\"¿Quién te habló de la fiesta?\",\"itemIds\":[\"ena2m2whotoldyou\",\"ena2m1whathappened\"]},{\"id\":\"ena2m2l4e9\",\"type\":\"hearreal\",\"prompt\":\"¿Libro o calle? Lo que hace el «did you» a velocidad normal\",\"book\":\"Did you have a good time?\",\"real\":\"Didja have a good time?\",\"translation\":\"¿Te lo pasaste bien?\",\"itemIds\":[\"ena2m2wehadagoodtime\",\"ena2m1yesidid\"],\"tip\":\"Se escribe «Did you» y se dice «didja». No copies la forma de la calle al escribir: solo tienes que reconocerla al oírla.\"},{\"id\":\"ena2m2l4e10\",\"type\":\"hearreal\",\"prompt\":\"Y con palabra qu- delante\",\"book\":\"Where did you go?\",\"real\":\"Where'd you go?\",\"translation\":\"¿Adónde fuiste?\",\"itemIds\":[\"ena2m2wheredidyougo\"],\"tip\":\"El did se reduce hasta convertirse en una d pegada al where. Si en el examen solo pillas «…you go?», ya sabes que te preguntan por el pasado.\"},{\"id\":\"ena2m2l4e11\",\"type\":\"audiomc\",\"prompt\":\"Cazar el dato — 2 escuchas\",\"audio\":\"Where did you go on Saturday? — I went to the cinema with Ben. After that we had dinner in a Turkish place near the station.\",\"question\":\"¿Qué hicieron después del cine?\",\"options\":[\"Cenaron\",\"Fueron al parque\",\"Cogieron el tren\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"El parque no sale en el audio\",\"La estación se nombra solo para situar el restaurante\"],\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2afterthat\",\"ena2m2wehadagoodtime\"],\"tip\":\"«near the station» está ahí para despistarte: nombra un sitio que no es la respuesta. En el Listening del examen siempre hay uno de estos.\"},{\"id\":\"ena2m2l4e12\",\"type\":\"build\",\"prompt\":\"Construye la pregunta\",\"target\":\"How did you get home last night\",\"translation\":\"¿Cómo volviste a casa anoche?\",\"distractors\":[\"got\",\"gets\"],\"itemIds\":[\"ena2m2howdidyougethome\",\"enlastnight\",\"enhome\"]},{\"id\":\"ena2m2l4e13\",\"type\":\"speak\",\"prompt\":\"El interrogatorio completo, en voz alta\",\"text\":\"Where did you go? What happened next? Did you have a good time?\",\"phonetic\":\"uéa-dyu GÓU? uót JÁ-pend NEKST? DÍ-dyu jav a gud TÁIM\",\"translation\":\"¿Adónde fuiste? ¿Y luego qué pasó? ¿Te lo pasaste bien?\",\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2whathappenednext\",\"ena2m2wehadagoodtime\"],\"tip\":\"Estas tres preguntas sacan una historia entera de cualquiera. Apréndetelas como un bloque: te salvan la Parte 2 del oral.\"},{\"id\":\"ena2m2l4e14\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"—¿Adónde fuiste anoche? —Fui al cine. —¿Lo pasaste bien? —Sí.\",\"answers\":[\"Where did you go last night? I went to the cinema. Did you have a good time? Yes, I did.\",\"Where did you go last night? I went to the cinema. Did you have a good time? Yes I did.\"],\"hints\":[\"Pregunta con did + verbo desnudo · respuesta con la forma rara · respuesta corta con el auxiliar\",\"Where d… you g… last night? I w… to the cinema. D… you have a good time? Yes, I d…\"],\"itemIds\":[\"ena2m2wheredidyougo\",\"ena2m2iwenttothecinema\",\"ena2m2wehadagoodtime\",\"ena2m1yesidid\"],\"tip\":\"En cuatro líneas has usado el sistema entero: did + base para preguntar, la forma irregular para contestar y el auxiliar solo para el «sí». Eso es el A2 del pasado.\"}]}],\"resources\":[{\"label\":\"British Council — A2 listening\",\"url\":\"https://learnenglish.britishcouncil.org/skills/listening/a2-listening\",\"note\":\"Elige una conversación cualquiera y cuenta cuántos «did you» pillas fundidos en uno solo. No transcribas: solo cázalos. Cinco minutos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":
