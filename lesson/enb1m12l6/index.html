003e«Candidates do not receive any credit for off-topic responses.»\u003c/i\u003e\u003c/b\u003e Si te dejas un punto de contenido, o si te vas por otro lado, el criterio de \u003ci\u003eTask fulfilment\u003c/i\u003e —uno de los cuatro— se cae entero \u003cb\u003eantes de que nadie mire tu gramática\u003c/b\u003e. Por eso el primer gesto del día es tonto y salva puntos: \u003cb\u003ecuenta las viñetas con el dedo\u003c/b\u003e, escribe un número al margen, y al terminar vuelve y táchalos uno a uno.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eLa plantilla de cinco líneas que siempre funciona:\u003c/b\u003e\u003cbr/\u003e1. Saludo: \u003ci\u003eDear Sir or Madam,\u003c/i\u003e (si no sabes el nombre) o \u003ci\u003eDear Mrs Beckett,\u003c/i\u003e (si lo sabes).\u003cbr/\u003e2. Por qué escribes: \u003ci\u003eI am writing in response to your advertisement…\u003c/i\u003e\u003cbr/\u003e3. Punto 1 y punto 2, en dos o tres frases.\u003cbr/\u003e4. Punto 3, y una pregunta si encaja.\u003cbr/\u003e5. Cierre y despedida: \u003ci\u003eI look forward to hearing from you. Yours faithfully,\u003c/i\u003e (sin nombre) o \u003ci\u003eYours sincerely,\u003c/i\u003e (con nombre).\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY el registro.\u003c/b\u003e Formal en inglés no es poner palabras largas: es \u003cb\u003ecómo se pide\u003c/b\u003e. \u003ci\u003eI want a place\u003c/i\u003e es una exigencia; \u003ci\u003eI would be delighted to take part\u003c/i\u003e y \u003ci\u003eCould you tell me whether…?\u003c/i\u003e son inglés formal. Aquí es donde aparece tu \u003cb\u003etrampa 4\u003c/b\u003e: el español resuelve con «se» —\u003ci\u003ese dice que, se construyó en 1904\u003c/i\u003e— lo que el inglés resuelve con \u003cb\u003epasiva\u003c/b\u003e. Un \u003ci\u003eThey say that…\u003c/i\u003e en una carta formal suena a cotilleo; \u003ci\u003eIt is said that…\u003c/i\u003e suena a lo que es. La pasiva no es adorno: es registro."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb1m12l6\",\"phaseId\":\"enb1m12\",\"title\":\"Writing Part 1: seventy to a hundred\",\"subtitle\":\"La carta formal, los tres puntos de contenido que se cuentan con el dedo, y el «se» impersonal que en inglés es pasiva\",\"minutes\":18,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de la carta formal\",\"itemIds\":[\"enb1m12coverallthreepoints\",\"enb1m12iamwritinginresponse\",\"enb1m12offtopicscoresnothing\",\"enb1m12iwouldbedelighted\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La tarea 1, y la regla que decide la mitad de la nota antes de escribir\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb1m12l6e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de la carta formal\",\"pairs\":[{\"target\":\"Cover all three content points.\",\"source\":\"Trata los tres puntos de contenido.\"},{\"target\":\"I am writing in response to your advertisement.\",\"source\":\"Les escribo en respuesta a su anuncio.\"},{\"target\":\"Off-topic answers score nothing.\",\"source\":\"Lo que se sale del tema no puntúa.\"},{\"target\":\"I would be delighted to take part.\",\"source\":\"Me encantaría participar.\"}],\"itemIds\":[\"enb1m12coverallthreepoints\",\"enb1m12iamwritinginresponse\",\"enb1m12offtopicscoresnothing\",\"enb1m12iwouldbedelighted\"],\"tip\":\"«I would be delighted» es la fórmula de aceptar por escrito. Es formal sin ser antigua, y le encaja igual a un periódico que a una empresa.\"},{\"id\":\"enb1m12l6e2\",\"type\":\"mc\",\"prompt\":\"La regla dura del baremo\",\"question\":\"Escribes 95 palabras impecables, pero solo tratas dos de los tres puntos. ¿Qué pasa?\",\"options\":[\"Se cae el criterio de Task fulfilment, que es uno de los cuatro.\",\"Pierdes un tercio de un criterio y poco más.\",\"No pasa nada mientras el inglés sea correcto.\"],\"answer\":0,\"whyWrong\":[null,\"Ojalá. El baremo mide «si el candidato ha hecho lo que se le pedía», y con dos de tres la respuesta es no.\",\"«Candidates do not receive any credit for off-topic responses» está escrito así en el handbook. El inglés correcto no rescata una tarea sin cumplir.\"],\"itemIds\":[\"enb1m12offtopicscoresnothing\",\"enb1m12coverallthreepoints\"],\"tip\":\"Traducido a gestos: los treinta segundos que tardas en numerar las viñetas y taparlas al final valen más que cualquier palabra elegante que puedas poner.\"},{\"id\":\"enb1m12l6e3\",\"type\":\"order\",\"prompt\":\"Ordena la plantilla de cinco líneas de la carta formal\",\"sentences\":[\"Dear Sir or Madam,\",\"I am writing in response to the competition advertised in Saturday's paper.\",\"The place I would most like to visit is Lisbon, because I have never seen the Atlantic.\",\"Could you tell me when the winners are announced?\",\"I look forward to hearing from you. Yours faithfully, Valeria Soto\"],\"translation\":\"Estimados señores: Les escribo en respuesta al concurso anunciado en el periódico del sábado. El sitio que más me gustaría visitar es Lisboa, porque no he visto nunca el Atlántico. ¿Podrían decirme cuándo se anuncia a los ganadores? Quedo a la espera de su respuesta. Atentamente, Valeria Soto.\",\"itemIds\":[\"enb1m12iamwritinginresponse\",\"enb1m5yoursfaithfully\",\"enb1m5lookforwardtohearing\"],\"tip\":\"«Yours faithfully» va con «Dear Sir or Madam»; «Yours sincerely» va cuando has puesto el apellido. Es una pareja fija y el examinador la mira: forma parte de Organisation.\"},{\"id\":\"enb1m12l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula de apertura\",\"text\":\"I am writing in ___ to your advertisement in Saturday's paper.\",\"answers\":[\"response\",\"reply\"],\"translation\":\"Les escribo en respuesta a su anuncio en el periódico del sábado.\",\"hints\":[\"Del verbo «to respond»\",\"res-pon-se\"],\"itemIds\":[\"enb1m12iamwritinginresponse\"],\"tip\":\"Esta frase hace dos cosas de una vez: dice para qué escribes y demuestra que has leído el texto de entrada. Empieza siempre por ahí y ya llevas el primer punto de Task fulfilment medio hecho.\"},{\"id\":\"enb1m12l6e5\",\"type\":\"transform\",\"prompt\":\"Sube el registro: pásala a pasiva y calla al agente\",\"source\":\"They will announce the winners in May.\",\"instruction\":\"Dilo en pasiva (quién lo anuncia no importa)\",\"answers\":[\"The winners will be announced in May\",\"The winners are going to be announced in May\"],\"translation\":\"Los ganadores se anunciarán en mayo.\",\"hints\":[\"El sujeto pasa a ser «the winners»\",\"The winners will ___ ___ in May\"],\"itemIds\":[\"enb1m4itissaidthat\"],\"tip\":\"En español dirías «se anunciarán»: ese «se» es exactamente lo que el inglés resuelve con pasiva. Y fíjate en que el agente desaparece — es que no hacía falta: el «they» del original no era nadie.\"},{\"id\":\"enb1m12l6e6\",\"type\":\"paraphrase\",\"prompt\":\"Dilo de otra manera — sin «they» y sin «say»\",\"source\":\"They say the competition is very popular.\",\"forbid\":[\"they\",\"say\"],\"answers\":[\"It is said that the competition is very popular\",\"The competition is believed to be very popular\",\"The competition is reported to be very popular\"],\"translation\":\"Se dice que el concurso es muy popular.\",\"hints\":[\"Empieza por «It is…»\",\"It is s___ that…\"],\"itemIds\":[\"enb1m4itissaidthat\"],\"tip\":\"«They say» no está mal, pero en una carta formal suena a rumor de pasillo. «It is said that…» es la misma idea con el registro que puntúa. Tener las dos y saber cuál toca es literalmente el criterio de rango.\"},{\"id\":\"enb1m12l6e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el registro, no la gramática\",\"wrong\":\"I want to enter the competition.\",\"answers\":[\"I would like to enter the competition.\",\"I would be delighted to enter the competition.\"],\"why\":\"«I want» es gramaticalmente impecable y pragmáticamente un portazo: en una carta a un desconocido suena a exigencia. El inglés formal envuelve la petición en un condicional: \u003cb\u003eI would like to…\u003c/b\u003e, \u003cb\u003eI would be delighted to…\u003c/b\u003e, \u003cb\u003eCould you…?\u003c/b\u003e Al hispanohablante le cuesta verlo porque «quiero participar» en español no suena brusco — pero se está corrigiendo un texto inglés con criterios ingleses.\",\"translation\":\"Me gustaría participar en el concurso.\",\"itemIds\":[\"enb1m12iwouldbedelighted\"]},{\"id\":\"enb1m12l6e8\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿esto va en la carta formal o en la carta a un amigo?\",\"categories\":[\"Carta formal (Tarea 1)\",\"Carta a un amigo (Tarea 2)\"],\"items\":[{\"text\":\"Dear Sir or Madam,\",\"bucket\":0},{\"text\":\"Guess what!\",\"bucket\":1},{\"text\":\"I look forward to hearing from you.\",\"bucket\":0},{\"text\":\"Write back soon!\",\"bucket\":1},{\"text\":\"I would be delighted to take part.\",\"bucket\":0},{\"text\":\"I can't wait to see you!\",\"bucket\":1}],\"itemIds\":[\"enb1m5yoursfaithfully\",\"enb1m12iwouldbedelighted\",\"enb1m12guesswhat\",\"enb1m12cantwaittoseeyou\"],\"tip\":\"Mezclar las dos columnas es el error de registro más caro del Writing: un «Guess what!» en la carta al periódico o un «Yours faithfully» a tu amiga de Mánchester le cuesta puntos a Task fulfilment y a Vocabulary a la vez.\"},{\"id\":\"enb1m12l6e9\",\"type\":\"gapbank\",\"prompt\":\"Monta la carta formal con sus tres fórmulas\",\"text\":\"Dear Sir or Madam, I am writing in ___ to the advertisement in Saturday's paper. I would be ___ to take part. I look ___ to hearing from you.\",\"answers\":[\"response\",\"delighted\",\"forward\"],\"bank\":[\"response\",\"delighted\",\"forward\",\"question\",\"afraid\",\"behind\"],\"translation\":\"Estimados señores: Les escribo en respuesta al anuncio del periódico del sábado. Me encantaría participar. Quedo a la espera de su respuesta.\",\"itemIds\":[\"enb1m12iamwritinginresponse\",\"enb1m12iwouldbedelighted\",\"enb1m5lookforwardtohearing\"],\"tip\":\"Las tres son bloques enteros: no se montan palabra a palabra, se escriben de carrerilla. Tenerlas automáticas te ahorra tres minutos del reloj y te asegura el registro sin pensarlo.\"},{\"id\":\"enb1m12l6e10\",\"type\":\"write\",\"prompt\":\"TAREA 1 en condiciones: la carta formal. 70-100 palabras, los TRES puntos, y contador vivo.\",\"scenario\":\"Has visto este anuncio en el periódico del barrio. Escribe al periódico para participar en el concurso. Trata LOS TRES puntos de la lista: dejarte uno fuera te tumba el criterio de Task fulfilment antes de que nadie mire tu gramática.\",\"genre\":\"mail-formal\",\"register\":\"polite\",\"stimulus\":{\"author\":\"Anuncio en el Camden Gazette\",\"text\":\"WIN A WEEKEND FOR TWO — Tell us where in Europe you would most like to go, who you would take with you, and why. The best letter wins two return tickets and two nights in a hotel. Write to the Travel Desk, Camden Gazette, by 30 April.\"},\"bullets\":[\"Di adónde te gustaría ir.\",\"Di con quién irías.\",\"Di por qué quieres ese viaje.\"],\"checks\":[{\"re\":\"(lisbon|i would (most )?like to (go|visit)|would like to travel)\",\"label\":\"Dices adónde te gustaría ir\"},{\"re\":\"(with my|with a friend|flatmate|my sister|amy)\",\"label\":\"Dices con quién irías\"},{\"re\":\"(because|since i|as i have)\",\"label\":\"Dices por qué quieres ese viaje\"}],\"frame\":[\"Saludo: «Dear Sir or Madam,» — con coma\",\"Por qué escribes: «I am writing in response to the competition advertised in…»\",\"Punto 1 — el sitio: «The place I would most like to visit is…, because…»\",\"Punto 2 — la persona: «I would travel with…, who…»\",\"Punto 3 — el motivo, y una pregunta si te sobra sitio: «Could you tell me when…?»\",\"Cierre: «I look forward to hearing from you. Yours faithfully, [tu nombre]»\"],\"requireConnectors\":{\"min\":2,\"bank\":[\"although\",\"therefore\",\"besides\",\"despite\",\"in spite of\",\"unless\",\"for instance\",\"of course\",\"since\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":100,\"model\":\"Dear Sir or Madam,\\nI am writing in response to the competition advertised in Saturday's Camden Gazette. I would be delighted to take part.\\nThe place I would most like to visit is Lisbon, because I have never seen the Atlantic. I would travel with my flatmate Amy, who has worked night shifts all year and therefore needs a break.\\nAlthough we could go in August, we would both prefer May. Could you tell me when the winners are announced?\\nI look forward to hearing from you.\\nYours faithfully,\\nValeria Soto\",\"itemIds\":[\"enb1m12iamwritinginresponse\",\"enb1m12iwouldbedelighted\",\"enb1m12coverallthreepoints\",\"enb1m1although\",\"enb1m1therefore\",\"enb1m5yoursfaithfully\"],\"tip\":\"Cuenta las palabras al terminar. Si te has quedado en 62, no añadas relleno: añade una frase que refuerce uno de los tres puntos. Si te has ido a 118, quita adjetivos, no ideas.\"},{\"id\":\"enb1m12l6e11\",\"type\":\"mc\",\"prompt\":\"El gesto de treinta segundos\",\"question\":\"¿Qué haces ANTES de escribir la primera palabra de la Tarea 1?\",\"options\":[\"Numerar las viñetas del enunciado y escribir el número al margen.\",\"Contar cuántas palabras te caben en cada línea.\",\"Elegir los conectores que vas a usar.\",\"Copiar el texto de entrada para no perderlo de vista.\"],\"answer\":0,\"whyWrong\":[null,\"El contador de palabras se mira al final. Antes de escribir no te dice nada.\",\"Los conectores salen solos si tienes claro qué vas a decir. Elegirlos antes te lleva a forzarlos.\",\"Copiar el enunciado gasta palabras de tu cupo y no puntúa: el examinador ya lo ha leído.\"],\"itemIds\":[\"enb1m12coverallthreepoints\",\"enb1m5contentpoints\"],\"tip\":\"Y el gesto gemelo, al final: vuelve al enunciado y tacha las viñetas una a una comprobando que cada una está EN TU TEXTO. Dos gestos, sesenta segundos, un criterio entero salvado.\"},{\"id\":\"enb1m12l6e12\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés, en registro de carta formal\",\"source\":\"Les escribo en respuesta a su anuncio y me encantaría participar.\",\"answers\":[\"I am writing in response to your advertisement and I would be delighted to take part\",\"I am writing in response to your advertisement, and I would be delighted to take part\",\"I am writing in response to your advert and I would be delighted to take part\"],\"hint\":\"Son las dos fórmulas de apertura del módulo, unidas por «and»\",\"itemIds\":[\"enb1m12iamwritinginresponse\",\"enb1m12iwouldbedelighted\"],\"tip\":\"Con esas dos frases ya tienes las primeras veinte palabras de la Tarea 1 escritas antes de pensar. Ese es el sentido de una plantilla: liberar cabeza para el contenido.\"},{\"id\":\"enb1m12l6e13\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Trata los tres puntos de contenido: lo que se sale del tema no puntúa.\",\"answers\":[\"Cover all three content points: off-topic answers score nothing\",\"Cover all three content points. Off-topic answers score nothing\",\"Cover all three content points, because off-topic answers score nothing\"],\"hints\":[\"Las dos frases del módulo, con dos puntos en medio\",\"Cover all three content points: off-topic answers…\"],\"itemIds\":[\"enb1m12coverallthreepoints\",\"enb1m12offtopicscoresnothing\"],\"tip\":\"Escríbetela en la esquina del papel el día del examen. Es la única nota que de verdad hace falta llevar apuntada.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\
