\",\"Ich hatte einen schlechten Tag, trotzdem war das nicht fair\"],\"translation\":\"Tuve un mal día. Aun así, no fue justo.\",\"hints\":[\"trotzdem es adverbio → verbo inmediatamente detrás\",\"Trotzdem war das …\"],\"itemIds\":[\"b1m10zwaraber\"],\"tip\":\"*«Trotzdem das war nicht fair» es la trampa §6.3 en directo: en español «aun así» no mueve nada, en alemán obliga a la inversión.\"},{\"id\":\"b1m10l8e7\",\"type\":\"cloze\",\"prompt\":\"Completa la propuesta\",\"text\":\"Hättest du Lust auf ein ___ Gespräch bei einem Kaffee?\",\"answers\":[\"klärendes\"],\"translation\":\"¿Te apetecería una conversación aclaratoria con un café?\",\"hints\":[\"Partizip I como adjetivo: klärend + terminación\",\"ein … Gespräch (neutro) → -es\"],\"itemIds\":[\"b1m10klaerendesgespraech\"],\"tip\":\"Espiral del b1m9: sin artículo que marque el neutro, el adjetivo se pone la -s. «ein klärendes Gespräch».\"},{\"id\":\"b1m10l8e8\",\"type\":\"paraphrase\",\"prompt\":\"Suaviza la propuesta\",\"source\":\"Wir müssen uns endlich versöhnen.\",\"forbid\":[\"müssen\",\"versöhnen\"],\"answers\":[\"Es wäre schön, wenn wir wieder aufeinander zugehen könnten\",\"Es wäre schön, wenn wir wieder aufeinander zugehen würden\",\"Ich würde gern wieder auf dich zugehen\",\"Ich fände es schön, wenn wir wieder aufeinander zugehen könnten\"],\"translation\":\"Estaría bien que volviéramos a dar el paso el uno hacia el otro.\",\"hints\":[\"Konjunktiv II: Es wäre schön, wenn …\",\"aufeinander zugehen\"],\"itemIds\":[\"b1m10sichversoehnen\",\"b1m10aufeinanderzugehen\"]},{\"id\":\"b1m10l8e9\",\"type\":\"speak\",\"prompt\":\"Di el correo en voz alta antes de escribirlo\",\"text\":\"Es tut mir leid, dass ich so laut geworden bin. Können wir uns treffen, damit wir in Ruhe reden?\",\"phonetic\":\"es tuut mia lait, das ij zoo laut gue-VOA-den bin · KÖ-nen via uns TRE-fen, da-MIT via in RUU-e REE-den\",\"translation\":\"Siento haber levantado tanto la voz. ¿Podemos vernos para hablar con calma?\",\"itemIds\":[\"b1m10esteutmirleiddass\",\"b1m10damitzweck\"],\"tip\":\"Planificación previa (Ellis): decir el texto antes de escribirlo baja los errores sin costarte tiempo de examen.\"},{\"id\":\"b1m10l8e10\",\"type\":\"write\",\"prompt\":\"Escribe el correo a tu amiga tras la discusión\",\"genre\":\"mail-informal\",\"scenario\":\"El sábado discutiste con tu amiga Anna en una fiesta y le levantaste la voz delante de todos. Llevas tres días sin escribirle. Mándale un correo de unas 80 palabras. Trátala de tú.\",\"register\":\"du\",\"frame\":[\"Anrede: «Liebe Anna,» + coma y minúscula en la línea siguiente\",\"Disculpa con el hecho: «es tut mir leid, dass …»\",\"Explicación honesta: «Ich war einfach …» / «…, weil …»\",\"Concesión: «Trotzdem …» / «Zwar …, aber …»\",\"Propuesta con finalidad: «Können wir uns treffen, damit …?»\",\"Gruß: «Liebe Grüße»\"],\"bullets\":[\"Pide perdón nombrando lo que pasó (es tut mir leid, dass … / entschuldigen)\",\"Explica por qué reaccionaste así (weil / denn / dass ich …)\",\"Propón veros para hablarlo, con «damit» o con «um … zu»\"],\"checks\":[{\"re\":\"(es tut mir[^.!?]{0,20}leid|entschuldig)\",\"label\":\"disculpa nombrando el hecho\"},{\"re\":\"(weil|denn|dass ich)\",\"label\":\"explicación\"},{\"re\":\"(damit|um [^.!?]{0,40}zu )\",\"label\":\"propuesta con finalidad\"}],\"requireConnectors\":{\"min\":3,\"bank\":[\"trotzdem\",\"deshalb\",\"außerdem\",\"weil\",\"damit\",\"denn\",\"aber\",\"allerdings\"]},\"rubric\":[\"erfuellung\",\"kohaerenz\",\"wortschatz\",\"strukturen\"],\"minWords\":70,\"maxWords\":110,\"model\":\"Liebe Anna, es tut mir wirklich leid, dass ich am Samstag so laut geworden bin. Das war nicht so gemeint, ich hatte einfach einen schrecklichen Tag im Büro. Trotzdem war das dir gegenüber nicht fair. An deiner Stelle wäre ich auch sauer gewesen. Können wir uns bald treffen, damit wir in Ruhe darüber reden? Ich lade dich zum Frühstück ein, weil ich mich gern bei dir entschuldigen möchte. Sag mir einfach, wann es dir passt. Liebe Grüße, Sofía\",\"itemIds\":[\"b1m10esteutmirleiddass\",\"b1m10nichtsogemeint\",\"b1m10damitzweck\",\"b1m10sichentschuldigenbei\",\"b1m10andeinerstelle\"],\"tip\":\"Fíjate en el modelo: los tres puntos de contenido están en las tres primeras frases. Lo demás es adorno — pero el adorno es lo que da Wortschatz.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
