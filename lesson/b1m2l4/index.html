que hay que tener automatizadas:\u003cbr/\u003e· \u003cb\u003eKönnten Sie …?\u003c/b\u003e — para pedir una acción. \u003ci\u003eKönnten Sie mir das bitte erklären?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eHätten Sie …?\u003c/b\u003e — para preguntar por disponibilidad. \u003ci\u003eHätten Sie am Freitag Zeit?\u003c/i\u003e\u003cbr/\u003e· \u003cb\u003eWäre es möglich, … zu …?\u003c/b\u003e — para lo delicado. \u003ci\u003eWäre es möglich, später anzufangen?\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eY aquí llega la trampa del hispanohablante\u003c/b\u003e, que vale por todo el módulo. El español tiene UNA forma de condicional («podría», «tendría», «sería»), así que el alumno construye \u003cb\u003ewürde + infinitivo\u003c/b\u003e para todo. Pero un grupo de verbos muy frecuentes tiene \u003cu\u003eforma propia, corta\u003c/u\u003e, y es la que se espera:\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003ehätte · wäre · könnte · müsste · sollte · dürfte · wüsste\u003c/b\u003e — y también \u003cb\u003emöchte\u003c/b\u003e, \u003cb\u003ewollte\u003c/b\u003e, \u003cb\u003eginge\u003c/b\u003e, \u003cb\u003ekäme\u003c/b\u003e. No es una lista cerrada de siete: son los verbos de uso diario, y la lista se puede alargar.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003eIch würde Zeit haben\u003c/i\u003e no es agramatical —se oye—, pero suena a rodeo y en el examen baja el criterio Strukturen: lo natural es \u003cb\u003eIch hätte Zeit\u003c/b\u003e. Con el resto de verbos (machen, kommen, arbeiten…) sí se usa würde con toda normalidad: \u003ci\u003eIch würde einen Kurs machen\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003eY el otro escenario de este módulo: el \u003cb\u003e[[Vorstellungsgespräch|la entrevista de trabajo]]\u003c/b\u003e, donde todo se pide en Konjunktiv II."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m2l4\",\"phaseId\":\"b1m2\",\"title\":\"Könnten Sie …?\",\"subtitle\":\"Konjunktiv II de cortesía — pedir sin sonar a or ereesmoeglich\",\"b1m2ichhaettegern\"]},{\"id\":\"b1m2l4e3\",\"type\":\"transform\",\"prompt\":\"Hazlo cortés\",\"source\":\"Können Sie mir das erklären?\",\"instruction\":\"Ponlo en Konjunktiv II de cortesía\",\"answers\":[\"Könnten Sie mir das erklären?\"],\"translation\":\"¿Podría explicármelo?\",\"hints\":[\"können → forma propia con Umlaut\",\"Könn... + terminación de Sie\"],\"itemIds\":[\"b1m2koenntensie\"],\"strictUmlaut\":true,\"tip\":\"El único cambio visible es el Umlaut: konnten (pasado) ≠ könnten (cortesía). Un punto y medio de diferencia.\"},{\"id\":\"b1m2l4e4\",\"type\":\"transform\",\"prompt\":\"Hazlo cortés\",\"source\":\"Haben Sie am Freitag Zeit?\",\"instruction\":\"Ponlo en Konjunktiv II de cortesía\",\"answers\":[\"Hätten Sie am Freitag Zeit?\"],\"translation\":\"¿Tendría tiempo el viernes?\",\"hints\":[\"haben tiene forma propia: no admite würde\",\"Hätt... + terminación de Sie\"],\"itemIds\":[\"b1m2haettensiezeit\"],\"strictUmlaut\":true},{\"id\":\"b1m2l4e5\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Würden Sie am Freitag Zeit hätten?\",\"answers\":[\"Hätten Sie am Freitag Zeit?\",\"Würden Sie am Freitag Zeit haben?\"],\"why\":\"Detrás de «würden» va el INFINITIVO (haben), nunca otra forma de Konjunktiv: «Würden Sie … Zeit hätten?» no existe. Las dos salidas buenas son «Würden Sie am Freitag Zeit haben?» y, mucho más natural con haben, la forma corta: «Hätten Sie am Freitag Zeit?».\",\"translation\":\"¿Tendría tiempo el viernes?\",\"itemIds\":[\"b1m2haettensiezeit\"]},{\"id\":\"b1m2l4e6\",\"type\":\"bucket\",\"prompt\":\"¿Forma propia o con würde?\",\"categories\":[\"forma PROPIA (hätte, wäre, könnte …)\",\"con WÜRDE + infinitivo\"],\"items\":[{\"text\":\"haben\",\"bucket\":0},{\"text\":\"arbeiten\",\"bucket\":1},{\"text\":\"sein\",\"bucket\":0},{\"text\":\"machen\",\"bucket\":1},{\"text\":\"können\",\"bucket\":0},{\"text\":\"kaufen\",\"bucket\":1},{\"text\":\"müssen\",\"bucket\":0},{\"text\":\"telefonieren\",\"bucket\":1}],\"itemIds\":[\"b1m2ichhaettezeit\",\"b1m2koennte\",\"b1m2muesste\"],\"tip\":\"Los de forma propia que hay que tener automatizados: hätte, wäre, könnte, müsste, sollte, dürfte, wüsste — y añade möchte, wollte, ginge, käme. Con el resto de verbos, würde + infinitivo es lo normal.\"},{\"id\":\"b1m2l4e7\",\"type\":\"cloze\",\"prompt\":\"Completa la fórmula delicada\",\"text\":\"___ es möglich, eine halbe Stunde später anzufangen?\",\"answers\":[\"Wäre\"],\"translation\":\"¿Sería posible empezar media hora más tarde?\",\"hints\":[\"sein en Konjunktiv II, con Umlaut\",\"W-ä-r-e\"],\"itemIds\":[\"b1m2waereesmoeglich\"],\"strictUmlaut\":true,\"tip\":\"«Wäre es möglich, ... zu ...?» es la fórmula para pedir algo que quizá molesta. Es literalmente la Aufgabe 3 del Schreiben.\"},{\"id\":\"b1m2l4e8\",\"type\":\"cloze\",\"prompt\":\"Completa la preposición regida\",\"text\":\"Ich bewerbe mich ___ einer großen Firma in Wien.\",\"answers\":[\"bei\"],\"translation\":\"Me presento a un puesto en una empresa grande de Viena.\",\"hints\":[\"sich bewerben + preposición fija con Dativ\",\"«einer Firma» ya está en dativo\"],\"itemIds\":[\"b1m2sichbewerbenbei\"],\"tip\":\"sich bewerben BEI + empresa (dónde) · sich bewerben UM + puesto (qué). Dos preposiciones, dos significados.\"},{\"id\":\"b1m2l4e9\",\"type\":\"gapbank\",\"prompt\":\"Completa el correo a la empresa\",\"text\":\"Sehr geehrte Frau Neumann, vielen Dank für Ihre Einladung. ___ Sie mir sagen, wie lange das Gespräch dauert? ___ Sie am Donnerstag auch Zeit? Ich ___ gern mehr über die Stelle erfahren.\",\"answers\":[\"Könnten\",\"Hätten\",\"würde\"],\"bank\":[\"Könnten\",\"Hätten\",\"würde\",\"Wären\",\"dürfte\",\"sollten\"],\"translation\":\"Estimada Sra. Neumann: muchas gracias por su invitación. ¿Podría decirme cuánto dura la entrevista? ¿Tendría tiempo también el jueves? Me gustaría saber más sobre el puesto.\",\"itemIds\":[\"b1m2koenntensie\",\"b1m2haettensiezeit\",\"b1m2vorstellungsgespraech\"],\"tip\":\"El tercer hueco sí lleva würde: «erfahren» no tiene forma corta propia. En los dos primeros, la forma corta (Könnten / Hätten) es la que se espera en un correo formal.\"},{\"id\":\"b1m2l4e10\",\"type\":\"build\",\"prompt\":\"Construye la frase de la entrevista\",\"target\":\"Ich hätte gern mehr Verantwortung\",\"translation\":\"Me gustaría tener más responsabilidad\",\"distractors\":[\"würde\",\"haben\"],\"itemIds\":[\"b1m2ichhaettegern\",\"b1m2verantwortung\"],\"tip\":\"«Ich hätte gern ...» no es solo para pedir un café: en una entrevista es la forma elegante de decir lo que quieres.\"},{\"id\":\"b1m2l4e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"¿Podría explicarme cómo es el periodo de prueba?\",\"answers\":[\"Könnten Sie mir erklären, wie die Probezeit ist?\",\"Könnten Sie mir bitte erklären, wie die Probezeit ist?\",\"Könnten Sie mir sagen, wie die Probezeit ist?\",\"Könnten Sie mir erklären, wie die Probezeit abläuft?\"],\"hints\":[\"Cortesía con Sie + Konjunktiv II\",\"Könnten Sie mir erklären, wie ...\"],\"itemIds\":[\"b1m2koenntensie\",\"b1m2probezeit\"],\"strictUmlaut\":true,\"tip\":\"Cortesía + subordinada con «wie» y verbo al final. Con esta frase entras en cualquier entrevista sin sonar a manual.\"},{\"id\":\"b1m2l4e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información a un grupo (presentación del día de curso) · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Morgen und willkommen zum Kurs «Höflich, aber klar». Wir machen das heute so: Am Vormittag üben wir die drei Formeln, die im Büro fast immer funktionieren — Könnten Sie…, Wäre es möglich…, Ich hätte gern… Nach der Mittagspause rufen Sie dann wirklich an, ähm, in echt, bei unserer Partnerfirma. Das ist der Teil, vor dem alle Angst haben. Und der Teil, der etwas bringt.\",\"question\":\"„Am Vormittag wird nur geübt, telefoniert wird noch nicht.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Las llamadas de verdad son «nach der Mittagspause»; por la mañana solo se practican las tres fórmulas\"],\"itemIds\":[\"b1m2koenntensie\",\"b1m2ichhaettegern\"],\"tip\":\"«am Vormittag … nach der Mittagspause» ordena el día. En el Teil 1 los marcadores de tiempo valen más que el vocabulario difícil.\"},{\"id\":\"b1m2l4e13\",\"type\":\"audiomc\",\"prompt\":\"Misma presentación, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Morgen und willkommen zum Kurs «Höflich, aber klar». Wir machen das heute so: Am Vormittag üben wir die drei Formeln, die im Büro fast immer funktionieren — Könnten Sie…, Wäre es möglich…, Ich hätte gern… Nach der Mittagspause rufen Sie dann wirklich an, ähm, in echt, bei unserer Partnerfirma. Das ist der Teil, vor dem alle Angst haben. Und der Teil, der etwas bringt.\",\"question\":\"¿Qué se hace después de la pausa del mediodía?\",\"options\":[\"Llamadas de verdad a la empresa asociada\",\"Repasar otra vez las tres fórmulas\",\"Un examen escrito\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Eso es lo de la mañana\",\"No se menciona ningún examen\"],\"itemIds\":[\"b1m2waereesmoeglich\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m2-2\",\"book\":\"Kannst du mir kurz helfen?\",\"real\":\"Kannste mir kurz helfen?\",\"meaning\":\"¿Me echas una mano un momento?\",\"when\":\"Entre compañeros de confianza y solo hablando: no se escribe, ni siquiera en un chat de trabajo. Con el jefe, con un cliente o en la Aufgabe 3 del Schreiben, Sie y Konjunktiv II.\",\"register\":\"amigos\",\"exam\":\"Könnten Sie mir bitte kurz helfen?\",\"note\":\"«kannst du» se funde en «kannste»; igual pasa con «haste» (hast du) y «willste» (willst du). Se oye constantemente y no se escribe nunca.\",\"sound\":\"KANS-te mia kurts JEL-fen\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m2natkannste\"}}],\"resources\":[{\"label\":\"Goethe — Modellsatz B1 (Schreiben Aufgabe 3)\",\"url\":\"https://www.goethe.de/de/spr/kup/prf/prf/gzb1.html\",\"note\":\"La tarea 3
