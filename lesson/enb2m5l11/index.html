\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L14\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$15\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/3wewq8b1ctw16.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/seshat/_next/static/chunks/1xdq4aay_ni2g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"74JZwaE0iQEESQ1_1bHEe\"}\n"])</script><script>self.__next_f.push([1,"16:I[62838,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\",\"/seshat/_next/static/chunks/43pt76iu8dzk2.js\",\"/seshat/_next/static/chunks/07q-or5ggprdo.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T41a,El alemán B2 dedica un módulo entero a la sanidad. Aquí el campo entra donde la gramática lo pide. Una lista de espera, una dosis de recuerdo y un buscador son el sitio natural de \u003ci\u003ehighly likely\u003c/i\u003e, \u003ci\u003emay well\u003c/i\u003e y \u003ci\u003ethere is no conclusive evidence\u003c/i\u003e. No se dice «yo creo» de una cola de dieciocho semanas.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eDr Google no es el enemigo.\u003c/b\u003e Buscarse un síntoma cuando la cita tarda tres semanas es lo que hace cualquiera. El error es tratar la primera página como un diagnóstico. Farida Haq lo dice sin reírse: the search is not the problem; treating the search as a diagnosis is.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eUptake no es «si funciona».\u003c/b\u003e Es cuánta gente se pone la vacuna. Si la única historia en circulación es que el pinchazo «ya es un resfriado», la cobertura está bound to fall. Eso es un dato con altura, no una bronca.\u003cbr/\u003e\u003cbr/\u003eAmy viene del turno. Nora se ha buscado la tos. Valeria apunta las seis alturas en el reverso de un folleto. La cola seguirá ahí por la mañana. Lo que cambia es la altura a la que se nombra.18:Tcfc,"])</script><script>self.__next_f.push([1,"On a Tuesday evening in Kentish Town Library, Dr Farida Haq did not begin with a virus. She began with a queue. Eighteen weeks is the target in England for a non-urgent [[referral to a specialist|volante al especialista]]. It is highly likely, she said, that many of the people in the room had already waited longer. The [[waiting list|lista de espera]] is not a rumour. It is a number the NHS publishes every month. What the number does not say is what people do while they wait.\u003cbr/\u003e\u003cbr/\u003eThey search. A cough that has lasted three weeks is typed into a bar before it is described to a [[GP|médico de cabecera]]. The first result is rarely a clinic. It is a page that lists twelve diseases, three of them grave, and a thread in which a stranger in another country is sure it is cancer. Haq called this [[self-diagnosis|autodiagnóstico]]. She did not laugh at it. «The search is what you do when a ten-minute appointment is three weeks away. The search is not the problem. Treating the search as a diagnosis is.»\u003cbr/\u003e\u003cbr/\u003eShe offered a second figure, from a [[public health|salud pública]] desk in Leeds. Adult [[vaccine|vacuna]] uptake for the autumn [[booster|dosis de recuerdo]] among people over sixty-five had fallen four points on the previous year. It is bound to fall further, she said, if the only message in circulation is that the jab is «just a cold now». A booster is not a rumour. It is a dose with a name, a batch and a date. People who skip it are not fools. They are more likely to have read a thread than a leaflet. [[Misinformation|la desinformación]] does not need to be a lie. It only needs to be louder than the leaflet.\u003cbr/\u003e\u003cbr/\u003eA woman in the third row — later she gave her name as Nora, and she lives on Palmer Road — asked whether looking things up was being treated as a crime. Haq said it was not. It is obvious, she said, that a person with a new [[symptom|síntoma]] will look. What is much less likely to help is stopping at the first page. The evidence strongly suggests that people who bring a printout to the GP get a better conversation, not a worse one, provided they treat the printout as a question and not as a verdict.\u003cbr/\u003e\u003cbr/\u003eShe walked through the scale she wanted the room to steal. Bound to wait, if the referral is not urgent. Highly likely to be nothing serious, if the cough is new and you are otherwise well. May well be worth a booster, if you are over sixty-five or you work nights on a ward, as the nurse in the second row does. Much less likely to be the rare disease on page one. No conclusive evidence, if you have not been examined.\u003cbr/\u003e\u003cbr/\u003eThe last ten minutes were practical. If the wait is long, do not put off the appointment you already have. If a neighbour has a hypothesis from a forum, ask what would disprove it. If you have no data, say so. «I think it's serious» is a feeling. «There is no conclusive evidence yet» is a sentence a clinic can use.\u003cbr/\u003e\u003cbr/\u003eShe was due to finish at eight. She overran, again. Amy Wright, who had come off a late shift, stayed. Nora stayed. Valeria Soto, who had come because Amy had asked her to, stayed and wrote the six heights on the back of a leaflet. Bound to. Highly likely. Likely. May well. Could. Much less likely. Six ways of not saying I think, and a queue that will still be there in the morning."])</script><script>self.__next_f.push([1,"19:T42c,Amy: Nora, you don't need twelve diseases before breakfast. You need the GP. The search is fine. The verdict isn't. Nora: The appointment is in three weeks. What am I supposed to do until then, sit on my hands? Amy: You're supposed to keep the appointment. You're not supposed to decide it's cancer because a forum said so. The evidence strongly suggests a cough that started last Tuesday is a cough. It may well be nothing. It is much less likely to be the thing on page one. Valeria: And the booster? Nora, you're over sixty-five. Haq said uptake is bound to fall if the only story in the street is it's just a cold. Nora: I had the flu jab last year. I was poorly for two days. Amy: That's not a reason. That's a feeling. The ward is full of people who skipped it. I'm not telling you what to think. I'm telling you the height. Highly likely to protect you. Not certain. Not nothing. Nora: Search me, then. I'll keep the appointment. I won't print the twelve diseases. I'll print the one question. Valeria: That's the briefing. That's the scale. That's not I think."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l11\",\"phaseId\":\"enb2m5\",\"title\":\"Dr Google and the list\",\"subtitle\":\"Salud pública: la escala aplicada a una cola, una vacuna y un buscador\",\"minutes\":20,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Las palabras del briefing\",\"itemIds\":[\"enb2m5publichealth\",\"enb2m5vaccine\",\"enb2m5abooster\",\"enb2m5uptake\",\"enb2m5selfdiagnosis\",\"enb2m5drgoogle\",\"enb2m5misinformation\",\"enb1m1waitinglist\",\"enb1m6gp\",\"enb1m6referral\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La misma escala, otro campo: una cola no es un fantasma\",\"body\":\"$17\",\"table\":[[\"Altura\",\"En este campo\"],[\"bound to\",\"la espera, si el volante no es urgente\"],[\"highly likely\",\"que no sea grave, si la tos es nueva y estás bien\"],[\"may well\",\"que merezca la dosis de recuerdo, si pasas de 65 o trabajas en planta\"],[\"much less likely\",\"la enfermedad rara de la página uno\"],[\"no conclusive evidence\",\"si nadie te ha explorado\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l11e1\",\"type\":\"match\",\"prompt\":\"Empareja el campo de salud pública\",\"pairs\":[{\"target\":\"public health\",\"source\":\"la salud pública\"},{\"target\":\"a vaccine\",\"source\":\"una vacuna\"},{\"target\":\"a booster\",\"source\":\"una dosis de recuerdo\"},{\"target\":\"vaccine uptake\",\"source\":\"la cobertura vacunal\"},{\"target\":\"self-diagnosis\",\"source\":\"el autodiagnóstico\"},{\"target\":\"Dr Google\",\"source\":\"buscarse los síntomas en internet\"}],\"itemIds\":[\"enb2m5publichealth\",\"enb2m5vaccine\",\"enb2m5abooster\",\"enb2m5uptake\",\"enb2m5selfdiagnosis\",\"enb2m5drgoogle\"],\"tip\":\"Uptake no es «si la vacuna funciona». Es cuánta gente se la pone. Si las mezclas, el informe miente.\"},{\"id\":\"enb2m5l11e2\",\"type\":\"mc\",\"prompt\":\"Qué no es Dr Google\",\"question\":\"En este módulo, «Dr Google» es…\",\"options\":[\"Buscarse los síntomas en internet: útil como pregunta, ruinoso como veredicto\",\"Un médico de cabecera que atiende por videollamada\",\"La prueba concluyente de que tienes lo de la página uno\"],\"answer\":0,\"whyWrong\":[null,\"El GP sigue siendo el de la consulta. Dr Google es el mote de la calle para el buscador.\",\"Justo lo contrario: no hay pruebas concluyentes hasta que alguien te explora.\"],\"itemIds\":[\"enb2m5drgoogle\",\"enb2m5selfdiagnosis\",\"enb2m5conclusive\",\"enb1m6gp\"]},{\"id\":\"enb2m5l11e3\",\"type\":\"read\",\"prompt\":\"Lectura de salud pública. Lee entero antes de las preguntas. Las cinco se infieren: la respuesta no está escrita con esas palabras.\",\"title\":\"What Dr Google will not tell you\",\"source\":\"Write-up of Dr Farida Haq's public-health evening at Kentish Town Library (adapted)\",\"text\":\"$18\",\"questions\":[{\"id\":\"enb2m5l11e3q1\",\"q\":\"Why does Haq begin with a queue rather than a virus?\",\"options\":[\"Because the wait, not the germ, is what sends people to a search bar before they reach a GP.\",\"Because the library had a plumbing problem that evening.\",\"Because she wants the room to cancel their vaccines.\"],\"answer\":0,\"inference\":true,\"why\":\"No dice «la cola empuja al buscador» con esas palabras. Empieza por eighteen weeks, dice que the waiting list is a number, y el segundo párrafo abre: They search. Hay que hacer el puente.\"},{\"id\":\"enb2m5l11e3q2\",\"q\":\"What is Haq's stance on looking symptoms up online?\",\"options\":[\"The search is understandable; treating the first page as a diagnosis is the problem.\",\"Looking anything up is a crime, as Nora feared.\",\"The first result is usually a clinic and should be trusted.\"],\"answer\":0,\"inference\":true,\"why\":\"«The search is not the problem. Treating the search as a diagnosis is.» Y a Nora: looking things up was not being treated as a crime. Postura: concede la búsqueda, corta el veredicto.\"},{\"id\":\"enb2m5l11e3q3\",\"q\":\"What work is the Leeds booster figure doing in the talk?\",\"options\":[\"It shows that a loud story in the street is more likely to move uptake than a leaflet.\",\"It proves that people over sixty-five never catch colds.\",\"It is an argument for closing the Leeds desk.\"],\"answer\":0,\"inference\":true,\"why\":\"Haq no dice «la historia gana al folleto». Da la caída de cuatro puntos, dice bound to fall further if the only message is «just a cold», y cierra: misinformation only needs to be louder than the leaflet. El lector monta la causa.\"},{\"id\":\"enb2m5l11e3q4\",\"q\":\"What does Haq want people to do with a printout at the GP?\",\"options\":[\"Bring it as a question, not as a verdict.\",\"Leave it at home, because searching is forbidden.\",\"Hand it over as a confirmed diagnosis.\"],\"answer\":0,\"inference\":true,\"why\":\"«provided they treat the printout as a question and not as a verdict.» La frase está; la postura —el printout ayuda si no usurpa al clínico— hay que inferirla contra Nora, que temía que buscar fuera un delito.\"},{\"id\":\"enb2m5l11e3q5\",\"q\":\"Why does the write-up mention that Amy, Nora and Valeria stayed when Haq overran?\",\"options\":[\"It treats their attention as a finding: they leave with a scale instead of «I think», and the queue will still be there.\",\"It is a complaint about the caretaker.\",\"It proves that the Leeds study was replicated in Kentish Town.\"],\"answer\":0,\"inference\":true,\"why\":\"El cierre nombra a las tres y deja las seis alturas en el folleto. No dice «el método funcionó». Lo muestra: nobody left, six ways of not saying I think, and a queue that will still be there. Misma operación que la charla de la L6, ahora en salud pública.\"}],\"itemIds\":[\"enb2m5publichealth\",\"enb2m5vaccine\",\"enb2m5abooster\",\"enb2m5uptake\",\"enb2m5selfdiagnosis\",\"enb2m5drgoogle\",\"enb2m5misinformation\",\"enb2m5highlylikelythat\",\"enb2m5boundto\",\"enb2m5maywellbe\",\"enb2m5evidencesuggests\",\"enb2m5conclusive\",\"enb1m1waitinglist\",\"enb1m6gp\",\"enb1m6referral\",\"enb1m6symptom\"],\"tip\":\"Cinco preguntas, cinco inferencias. Si contestaste subrayando una sola línea, vuelve al puente: cola → buscador, historia → cobertura, printout → pregunta.\"},{\"id\":\"enb2m5l11e4\",\"type\":\"mc\",\"prompt\":\"Sintetizar: el dato y la altura\",\"question\":\"¿Qué hace Haq con la tos de tres semanas y con la dosis de recuerdo?\",\"options\":[\"Las pone en la escala: la tos, highly likely nothing serious si estás bien; el booster, may well be worth it si pasas de 65 o trabajas en planta.\",\"Las declara las dos como urgencias de A\u0026E.\",\"Niega que Nora tenga tos y que Amy trabaje de noche.\"],\"answer\":0,\"whyWrong\":[null,\"A\u0026E no aparece. El briefing es de espera no urgente y de prevención, no de urgencias.\",\"Nora está en la tercera fila; Amy, en la segunda, de enfermera. Las nombra para anclar la escala, no para desmentirlas.\"],\"itemIds\":[\"enb2m5highlylikelythat\",\"enb2m5maywellbe\",\"enb2m5abooster\",\"enb1m6symptom\"],\"tip\":\"Sintetizar aquí es ver que la misma máquina (likely / may well / bound to) sirve para una cola y para una vacuna. No son dos charlas: es una escala.\"},{\"id\":\"enb2m5l11e5\",\"type\":\"cloze\",\"prompt\":\"La cobertura, no el milagro\",\"text\":\"Vaccine ___ had fallen four points on the previous year.\",\"answers\":[\"uptake\"],\"translation\":\"La cobertura vacunal había bajado cuatro puntos respecto al año anterior.\",\"hints\":[\"La palabra de cuánta gente se la pone\",\"up...\"],\"itemIds\":[\"enb2m5uptake\",\"enb2m5vaccine\"],\"tip\":\"Uptake es cobertura. Si pones «effect» o «success», estás contestando a otra pregunta.\"},{\"id\":\"enb2m5l11e6\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It's probably that I have something serious.\",\"answers\":[\"It's likely that I have something serious.\",\"It is likely that I have something serious.\",\"It's likely to be something serious.\",\"It is likely to be something serious.\"],\"why\":\"El español pone «que» detrás de «probable» y el calco sale It's probably that. En inglés: likely that + frase, o likely to + infinitivo. Nunca probably that.\",\"translation\":\"Es probable que tenga algo serio.\",\"itemIds\":[\"enb2m5islikelyto\",\"enb2m5highlylikelythat\"]},{\"id\":\"enb2m5l11e7\",\"type\":\"paraphrase\",\"prompt\":\"Sin «I think» ni «cancer» — como el briefing\",\"source\":\"I think it's cancer.\",\"forbid\":[\"think\",\"cancer\",\"believe\"],\"answers\":[\"There is no conclusive evidence\",\"There is no conclusive evidence.\",\"It is much less likely than it looks\",\"It is much less likely than it looks.\",\"It may well be nothing\",\"It may well be nothing.\"],\"translation\":\"Yo creo que es cáncer.\",\"hints\":[\"Baja de altura hasta la ignorancia honesta o hasta much less likely\",\"There is no conclusive ...\"],\"itemIds\":[\"enb2m5conclusive\",\"enb2m5muchlesslikely\",\"enb2m5maywellbe\"],\"tip\":\"«I think it's cancer» es la primera página. «There is no conclusive evidence» es la frase que Haq quiere oír en la consulta.\"},{\"id\":\"enb2m5l11e8\",\"type\":\"gapbank\",\"prompt\":\"Completa el párrafo de hallazgos — sin «I think»\",\"text\":\"It is highly ___ that many people wait longer than eighteen weeks. The evidence strongly ___ a GP visit, not a verdict from a forum. Uptake is ___ to fall if the only story is that the jab is just a cold. There is no ___ evidence that a three-week cough is the disease on page one.\",\"answers\":[\"likely\",\"suggests\",\"bound\",\"conclusive\"],\"bank\":[\"likely\",\"suggests\",\"bound\",\"conclusive\",\"probably\",\"certain\",\"rumour\",\"evidences\"],\"translation\":\"Es muy probable que mucha gente espere más de dieciocho semanas. La evidencia apunta con fuerza a una visita al médico de cabecera, no a un veredicto de un foro. La cobertura está destinada a caer si la única historia es que el pinchazo ya es un resfriado. No hay pruebas concluyentes de que una tos de tres semanas sea la enfermedad de la página uno.\",\"itemIds\":[\"enb2m5highlylikelythat\",\"enb2m5evidencesuggests\",\"enb2m5boundto\",\"enb2m5conclusive\",\"enb1m6gp\"],\"tip\":\"«Probably» es el calco del e6. «Evidences» es el plural que no existe. Los dos están de distractor a propósito.\"},{\"id\":\"enb2m5l11e9\",\"type\":\"translate\",\"direction\":\"toEs\",\"prompt\":\"¿Qué significa en un informe de salud pública?\",\"source\":\"Misinformation does not need to be a lie. It only needs to be louder than the leaflet.\",\"answers\":[\"La desinformación no necesita ser una mentira. Solo necesita ser más alta que el folleto\",\"La desinformación no tiene por qué ser una mentira. Solo necesita ser más ruidosa que el folleto\",\"La desinformación no hace falta que sea mentira. Solo tiene que sonar más alto que el folleto\"],\"itemIds\":[\"enb2m5misinformation\",\"enb2m5uptake\"],\"tip\":\"Haq está bajando la altura de la palabra «desinformación»: no exige una conspiración. Exige un volumen. Eso también es B2.\"},{\"id\":\"enb2m5l11e10\",\"type\":\"audiomc\",\"prompt\":\"AUDIO LARGO — cocina de Palmer Road. Valeria, Amy, Nora. Lee la pregunta ANTES. Dos escuchas. Cuaderno abierto.\",\"notepad\":true,\"audio\":\"$19\",\"question\":\"¿Qué acepta Nora al final?\",\"options\":[\"Mantener la cita y llevar una pregunta, no doce enfermedades\",\"Cancelar la cita y fiarse del foro\",\"Ponerse la dosis de recuerdo esa misma noche, en la cocina\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Dice lo contrario: I'll keep the appointment. I won't print the twelve diseases.\",\"De pincharse en la cocina no habla nadie. Amy gradúa el booster; no lo administra en el fregadero.\"],\"itemIds\":[\"enb2m5drgoogle\",\"enb2m5selfdiagnosis\",\"enb2m5abooster\",\"enb2m5uptake\",\"enb2m5evidencesuggests\",\"enb2m5maywellbe\",\"enb2m5muchlesslikely\",\"enb2m5natsearchme\",\"enb1m6gp\",\"enb1m6bookanappointment\"],\"tip\":\"Tres voces, seis alturas. Amy no dice «yo creo»: dice highly likely, may well, much less likely. Nora baja de las doce enfermedades a una pregunta. Eso es el módulo, en una cocina.\"},{\"id\":\"enb2m5l11e11\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta — la frase de la consulta\",\"text\":\"There is no conclusive evidence yet.\",\"phonetic\":\"déar is̬ nou kon-KLÚU-siv É-vi-dans yet\",\"translation\":\"Aún no hay pruebas concluyentes.\",\"itemIds\":[\"enb2m5conclusive\"],\"tip\":\"Golpe en CLU y en EVI. Si le das el mismo peso a «there is no», se te deshace la ignorancia honesta.\"},{\"id\":\"enb2m5l11e12\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"La cobertura vacunal (cuánta gente se la pone).\",\"answers\":[\"vaccine uptake\",\"Vaccine uptake\",\"vaccine uptake.\"],\"itemIds\":[\"enb2m5
