ions\":[\"The bus is very cheaper than a taxi.\",\"The bus is far cheaper than a taxi.\",\"The bus is very much cheap than a taxi.\"],\"answer\":1,\"whyWrong\":[\"«very» no toca nunca un comparativo. Very cheap sí; very cheaper, jamás.\",null,\"Aquí se mezclan dos intentos y no sale ninguno: «cheap» ya ni siquiera está comparado.\"],\"itemIds\":[\"enb1m8farcheaper\",\"enbus\"],\"tip\":\"Los que sí valen delante de un comparativo: far, much, a lot, a bit, slightly, no. La lista es corta, y «very» no está en ella.\"},{\"id\":\"enb1m8l1e4\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"The bus is very cheaper than a taxi.\",\"answers\":[\"The bus is much cheaper than a taxi.\",\"The bus is far cheaper than a taxi.\",\"The bus is a lot cheaper than a taxi.\"],\"why\":\"«very» modifica adjetivos normales (very cheap), no comparativos. Para reforzar un comparativo hay que usar much, far o a lot.\",\"translation\":\"El autobús es mucho más barato que un taxi.\",\"itemIds\":[\"enb1m8farcheaper\"]},{\"id\":\"enb1m8l1e5\",\"type\":\"errorfix\",\"prompt\":\"Otra vez el mismo mecanismo, con otra palabra\",\"wrong\":\"This month's bill is only slightly more high.\",\"answers\":[\"This month's bill is only slightly higher.\"],\"why\":\"«high» es corto: hace el comparativo con -er (higher). «More» solo entra con adjetivos largos, y nunca los dos a la vez.\",\"translation\":\"La factura de este mes es solo un pelín más alta.\",\"itemIds\":[\"enb1m8slightly\",\"enb1m8energybill\"]},{\"id\":\"enb1m8l1e6\",\"type\":\"bucket\",\"prompt\":\"¿La diferencia es grande o pequeña?\",\"categories\":[\"GRANDE — far, much, a lot\",\"PEQUEÑA — a bit, slightly\"],\"items\":[{\"text\":\"far cheaper\",\"bucket\":0},{\"text\":\"slightly higher\",\"bucket\":1},{\"text\":\"a lot greener\",\"bucket\":0},{\"text\":\"a bit worse\",\"bucket\":1},{\"text\":\"much better\",\"bucket\":0},{\"text\":\"slightly more expensive\",\"bucket\":1}],\"itemIds\":[\"enb1m8farcheaper\",\"enb1m8slightly\",\"enb1m8greener\"],\"tip\":\"«Slightly» es la palabra del británico que no quiere alarmar a nadie: «the bill is slightly higher» puede querer decir «se ha disparado». Ya volveremos sobre eso en la lección 7.\"},{\"id\":\"enb1m8l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa el matizador que pide el sentido\",\"text\":\"It's only ___ higher than last month — about two pounds.\",\"answers\":[\"slightly\",\"a bit\"],\"translation\":\"Es solo un poco más alta que la del mes pasado: unas dos libras.\",\"hints\":[\"«Dos libras» es una diferencia pequeña\",\"sl... o «a bit»\"],\"itemIds\":[\"enb1m8slightly\",\"enb1m8energybill\"],\"tip\":\"El «about two pounds» del final es la pista: con esa cifra, «far higher» sería mentira. El matizador tiene que cuadrar con el dato, y el examen lo comprueba justo así.\"},{\"id\":\"enb1m8l1e8\",\"type\":\"build\",\"prompt\":\"Construye la frase del módulo\",\"target\":\"The bus is far greener than the car\",\"translation\":\"El autobús contamina bastante menos que el coche\",\"distractors\":[\"very\",\"more\"],\"itemIds\":[\"enb1m8greener\",\"enbus\",\"encar\"],\"tip\":\"Las dos fichas que sobran son las dos que pone un hispanohablante: «very» y «more» (greener ya lleva su -er dentro).\"},{\"id\":\"enb1m8l1e9\",\"type\":\"transform\",\"prompt\":\"Sube el matizador\",\"source\":\"Bikes are a bit cleaner than cars.\",\"instruction\":\"Dilo con «far» (la diferencia es enorme)\",\"answers\":[\"Bikes are far cleaner than cars\",\"Bikes are far cleaner than cars.\"],\"translation\":\"Las bicis contaminan muchísimo menos que los coches.\",\"hints\":[\"Solo cambia el matizador\",\"Bikes are ... cleaner than cars\"],\"itemIds\":[\"enb1m8farcheaper\",\"enbike\",\"encar\"],\"tip\":\"Fíjate en lo barato que sale el matiz: una palabra, y la frase pasa de «un poco» a «muchísimo». En el examen, ese es todo el trabajo del criterio de vocabulario.\"},{\"id\":\"enb1m8l1e10\",\"type\":\"gapbank\",\"prompt\":\"Completa la conversación sobre la factura\",\"text\":\"Amy: The gas bill came this morning. It's only ___ higher than last month — about three pounds.\\nValeria: Mine is ___ worse. It went up by thirty.\",\"answers\":[\"slightly\",\"far\"],\"bank\":[\"slightly\",\"far\",\"very\",\"more\",\"so\"],\"translation\":\"Amy: Ha llegado la factura del gas. Es solo un pelín más alta que la del mes pasado: unas tres libras. · Valeria: La mía está muchísimo peor. Subió treinta.\",\"itemIds\":[\"enb1m8slightly\",\"enb1m8farcheaper\",\"enb1m8energybill\"],\"tip\":\"Los tres distractores del banco son los tres que se cuelan de verdad: «very», «more» y «so» delante de un comparativo. Ninguno cabe.\"},{\"id\":\"enb1m8l1e11\",\"type\":\"translate\",\"direction\":\"toTarget\",\"prompt\":\"Tradúcelo al inglés\",\"source\":\"En casa reciclamos casi todo.\",\"answers\":[\"We recycle almost everything at home\",\"At home we recycle almost everything\",\"We recycle nearly everything at home\"],\"hint\":\"Empieza por el sujeto y el verbo del reciclaje\",\"itemIds\":[\"enb1m8recycle\",\"enhome\"],\"tip\":\"«Recycle» lleva el golpe en la segunda sílaba: rii-SÁI-kol. Con el acento en la primera suena a otra palabra y el examinador tiene que adivinar.\"},{\"id\":\"enb1m8l1e12\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"The bus is far greener than the car.\",\"translation\":\"El autobús contamina bastante menos que el coche.\",\"hints\":[\"Empieza por «The bus is…»\",\"The bus is far ... than the car.\"],\"itemIds\":[\"enb1m8greener\",\"enb1m8farcheaper\"],\"tip\":\"«far» y «for» suenan casi igual en boca británica (faa / fo), y solo el sitio en la frase los separa: delante de un comparativo siempre es «far».\"},{\"id\":\"enb1m8l1e13\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta con el ritmo correcto\",\"text\":\"It's far cheaper, and it's a lot greener too.\",\"phonetic\":\"its faa CHÍI-pa, and its a lot GRÍI-na tuu\",\"translation\":\"Es muchísimo más barato, y además contamina bastante menos.\",\"itemIds\":[\"enb1m8farcheaper\",\"enb1m8greener\"],\"tip\":\"El golpe cae en FAR, CHEA- y GREE-. «It's» y «and» pasan de puntillas. Si acentúas todas las sílabas por igual, suena a español con palabras inglesas.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-enb1m8-1\",\"book\":\"much more expensive\",\"real\":\"way more expensive\",\"meaning\":\"muchísimo más caro\",\"when\":\"Hablando, con cualquiera menos con un tribunal: «way» es el matizador de la calle y se oye a todas horas (way better, way too much, way more). En el Writing NO se escribe: en un texto formal baja el registro y el criterio de vocabulario lo nota.\",\"register\":\"neutral\",\"exam\":\"considerably more expensive\",\"note\":\"«way» viene de «a long way» — «un largo trecho más caro». Por eso no admite matices: o es mucho, o no se usa «way».\",\"sound\":\"uéi moo iks-PÉN-siv\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"enb1m8natwaymore\"}}],\"resources\":[{\"label\":\"BBC Learning English — Comparatives and superlatives\",\"url\":\"https://www.bbc.co.uk/learningenglish/english/course/intermediate\",\"note\":\"Busca la unidad de comparativos y quédate solo con la parte de los matizadores (much, far, a bit). Diez minutos.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 —
