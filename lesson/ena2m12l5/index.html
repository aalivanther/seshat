cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T47a,\u003cb\u003eTarea 3\u003c/b\u003e (7 ítems): cuatro textos cortos del \u003cb\u003emismo tema\u003c/b\u003e —una nota, un aviso, una tarjeta de cita, un correo— pero con \u003cb\u003epropósitos distintos\u003c/b\u003e: uno invita, otro avisa, otro se disculpa, otro informa. Te dan siete situaciones y tienes que decir a qué texto va cada una. La pregunta de fondo es siempre la misma: \u003cb\u003e¿para qué se escribió esto?\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003eTarea 4\u003c/b\u003e (7 ítems): \u003cb\u003eun solo texto continuo\u003c/b\u003e —una historia, una descripción, una explicación— con siete preguntas de tres opciones. Es la novedad del nivel: por primera vez hay que leer de corrido, no buscar un dato en una tabla. Tres reglas que valen puntos: \u003cb\u003e1)\u003c/b\u003e las preguntas van \u003cb\u003een el orden del texto\u003c/b\u003e, así que avanza en paralelo; \u003cb\u003e2)\u003c/b\u003e la opción que repite una palabra del texto suele ser la trampa —el texto dice lo mismo con otras palabras—; \u003cb\u003e3)\u003c/b\u003e cuando aparezca una palabra que no conoces, \u003cb\u003eno pares\u003c/b\u003e: [[Guess the word from the context|adivínala por el contexto]], sigue leyendo y vuelve luego. En un texto de 200 palabras siempre hay tres o cuatro que no sabes, y eso es normal también para quien aprueba.18:T648,"])</script><script>self.__next_f.push([1,"Three weeks before her real exam, Valeria spent a Saturday at a practice day in a small centre in south London. She arrived forty minutes early, because Amy told her a story about a bus that never came.\u003cbr/\u003e\u003cbr/\u003eThe building was not what she expected. There were no big halls: just three rooms above a language school, a [[corridor|pasillo]] with twelve plastic chairs and a coffee machine that was out of order. Twenty-two candidates waited there and nobody talked.\u003cbr/\u003e\u003cbr/\u003eAt nine o'clock a woman with a [[folder|carpeta]] opened the door. 'Passports and ID cards, please. Phones in the box.' Valeria put her phone in the box and felt better immediately: for one hour and forty minutes, nothing outside that room existed.\u003cbr/\u003e\u003cbr/\u003eThe Listening was first. The recording started with a voice saying 'You will hear each part twice', and Valeria almost laughed: she knew that sentence better than her own address. The Reading and the Writing came together, without a break. She finished the Reading with twenty-five minutes left, which was more time than she needed for two texts of fifty words.\u003cbr/\u003e\u003cbr/\u003eIn the afternoon they practised the Spoken exam too, in a smaller room with a red light on the [[recorder|grabadora]]. Nine minutes. The examiner was friendly, but he never said if an answer was good or bad. 'In June nobody in this room gives you a mark,' he explained. 'Another examiner listens to the recording afterwards.'\u003cbr/\u003e\u003cbr/\u003eShe came out at half past four. Outside, a man from her group asked her how it went. 'I don't know,' she said. 'But on the fourteenth, nothing is going to surprise me.'"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"ena2m12l5\",\"phaseId\":\"ena2m12\",\"title\":\"Reading: tasks 3 and 4\",\"subtitle\":\"Cuatro textos con distinto propósito, y la lectura larga de verdad\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"El kit de la lectura larga\",\"itemIds\":[\"ena2m12thepurposeofthetext\",\"ena2m12guessfromthecontext\",\"ena2m12theopeninghours\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Tarea 3: para qué se escribió · Tarea 4: leer de verdad\",\"body\":\"$17\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"ena2m12l5e1\",\"type\":\"mc\",\"prompt\":\"Tarea 3: ¿para qué se escribió?\",\"question\":\"«Sorry! I came at six but you weren't in. I left the parcel with your neighbour at number 14. — Dave»\",\"options\":[\"Explicar por qué no pudo entregar algo\",\"Invitar a alguien a una fiesta\",\"Pedir dinero por un servicio\"],\"answer\":0,\"whyWrong\":[null,\"No hay ninguna invitación: hay un paquete\",\"No se menciona ningún precio\"],\"itemIds\":[\"ena2m12thepurposeofthetext\",\"ena2m9alettercameforyou\"],\"tip\":\"Resume el propósito en un verbo: explicar, invitar, avisar, pedir, disculparse. Si no te sale el verbo, no lo has entendido.\"},{\"id\":\"ena2m12l5e2\",\"type\":\"mc\",\"prompt\":\"Tarea 3: el mismo tema, otro propósito\",\"question\":\"«THE LIBRARY WILL BE CLOSED ON 3rd JUNE. Opening hours from 4th June: 9 a.m. to 5 p.m.»\",\"options\":[\"Informar de un cambio de horario\",\"Disculparse con un cliente concreto\",\"Invitar a un acto\"],\"answer\":0,\"whyWrong\":[null,\"Un aviso no se dirige a nadie en particular: no hay ni nombre ni firma\",\"No hay ni fecha de acto ni invitación: hay un horario\"],\"itemIds\":[\"ena2m12theopeninghours\",\"ena2m12thenotice\"],\"tip\":\"Si el texto no tiene destinatario con nombre, casi nunca es disculpa ni invitación: es un aviso.\"},{\"id\":\"ena2m12l5e3\",\"type\":\"match\",\"prompt\":\"Empareja cada texto con su propósito — así se resuelve la Tarea 3\",\"pairs\":[{\"target\":\"Come to my flat on Saturday at eight!\",\"source\":\"invitar\"},{\"target\":\"The lift is out of order until Friday.\",\"source\":\"avisar\"},{\"target\":\"I'm very sorry about yesterday.\",\"source\":\"disculparse\"},{\"target\":\"The course costs ninety pounds a term.\",\"source\":\"informar\"}],\"itemIds\":[\"ena2m12thepurposeofthetext\",\"ena2m7outoforder\",\"ena2m5imsosorryaboutthat\"],\"tip\":\"Cuatro textos, cuatro propósitos: es literalmente el diseño de la Tarea 3. Nunca hay dos textos con el mismo.\"},{\"id\":\"ena2m12l5e4\",\"type\":\"mc\",\"prompt\":\"La palabra que no sabes\",\"question\":\"Lees «the corridor was full of plastic chairs» y no sabes qué es corridor. ¿Qué haces?\",\"options\":[\"Sigo leyendo: por las sillas y por la frase siguiente ya sé que es un sitio de paso\",\"Paro y busco la palabra en la lista de vocabulario\",\"Dejo la pregunta en blanco y paso al texto siguiente\"],\"answer\":0,\"whyWrong\":[null,\"En el examen no hay lista, y parar rompe el hilo de la lectura\",\"Casi nunca la pregunta depende de ESA palabra: dejarla en blanco regala un punto\"],\"itemIds\":[\"ena2m12guessfromthecontext\"],\"tip\":\"En un texto de 200 palabras hay tres o cuatro que no sabes. Quien aprueba también las tiene: la diferencia es que no para.\"},{\"id\":\"ena2m12l5e5\",\"type\":\"read\",\"prompt\":\"Tarea 4 del Reading: lee el texto entero y responde. Toca las palabras subrayadas si necesitas la glosa.\",\"title\":\"The exam centre in south London\",\"text\":\"$18\",\"source\":\"relato del curso\",\"questions\":[{\"id\":\"ena2m12l5e5q1\",\"q\":\"Why did Valeria arrive forty minutes early?\",\"options\":[\"Because of a story Amy told her about a bus\",\"Because the exam started at eight o'clock\",\"Because she wanted to buy a coffee first\"],\"answer\":0,\"why\":\"«because Amy told her a story about a bus that never came». La máquina de café aparece, pero rota y después.\"},{\"id\":\"ena2m12l5e5q2\",\"q\":\"How many people were waiting in the corridor?\",\"options\":[\"Twenty-two\",\"Twelve\",\"Three\"],\"answer\":0,\"why\":\"Doce son las sillas y tres las salas. El texto pone los tres números seguidos justo para eso.\"},{\"id\":\"ena2m12l5e5q3\",\"q\":\"Why did Valeria feel better after putting her phone in the box?\",\"options\":[\"Because from that moment nothing outside the room could reach her\",\"Because her phone was broken and she was worried about it\",\"Because she did not want the other candidates to call her\"],\"answer\":0,\"inference\":true,\"why\":\"El texto no dice «se relajó»: lo enseña con «nothing outside that room existed». Hay que unir el gesto con la frase.\"},{\"id\":\"ena2m12l5e5q6\",\"q\":\"How much time did Valeria have left when she finished the Reading?\",\"options\":[\"Twenty-five minutes\",\"Forty minutes\",\"Twelve minutes\"],\"answer\":0,\"why\":\"«She finished the Reading with twenty-five minutes left». Los cuarenta son los que llegó antes y los doce son las sillas del pasillo: el texto pone los números lejos unos de otros a propósito.\"},{\"id\":\"ena2m12l5e5q4\",\"q\":\"What does the examiner explain about the Spoken exam?\",\"options\":[\"That the person who marks it is not in the room\",\"That the room was too dark for the recorder to work\",\"That the candidate has to speak into a camera\"],\"answer\":0,\"inference\":true,\"why\":\"Lo dice sin decirlo: «nobody in this room gives you a mark» + «another examiner listens to the recording afterwards». Y eso explica por qué no comenta ninguna respuesta.\"},{\"id\":\"ena2m12l5e5q5\",\"q\":\"What does Valeria mean by 'But on the fourteenth, nothing is going to surprise me'?\",\"options\":[\"That she still does not know her level, but the format will not catch her out\",\"That she is sure she is going to pass with a High Pass\",\"That she has already seen the questions of the real exam\"],\"answer\":0,\"inference\":true,\"why\":\"Acaba de decir «I don't know»: no habla de la nota, habla del formato. Es justo lo que entrena este módulo — y el día 14 es el de su examen de verdad.\"}],\"tip\":\"Fíjate en el orden: las preguntas van en el orden del texto, y en el examen también. Aquí son seis; el día del examen, siete sobre un texto de este tamaño. Avanza en paralelo y no vuelvas atrás.\"},{\"id\":\"ena2m12l5e6\",\"type\":\"cloze\",\"prompt\":\"Completa la estrategia\",\"text\":\"If you don't know a word, guess it from the ___ and keep reading.\",\"answers\":[\"context\"],\"translation\":\"Si no sabes una palabra, adivínala por el contexto y sigue leyendo.\",\"hints\":[\"Lo que hay alrededor de la palabra\",\"from the con…\"],\"itemIds\":[\"ena2m12guessfro
