e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el caso de la preposición regida\",\"wrong\":\"Ich nehme an die Prüfung teil.\",\"answers\":[\"Ich nehme an der Prüfung teil.\",\"Ich nehme an der Prüfung teil\"],\"why\":\"teilnehmen an rige DATIVO, no acusativo: an der Prüfung. Es de esos bloques que hay que memorizar con el caso pegado, porque el español («participar EN») no da ninguna pista.\",\"translation\":\"Me presento al examen.\",\"itemIds\":[\"b1m12gzteilnehmenan\"]},{\"id\":\"b1m12l1e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Ich bereite mich auf die Prüfung vor.\",\"translation\":\"Me estoy preparando para el examen.\",\"hints\":[\"Verbo separable: bereite … vor\",\"auf die Prüfung: acusativo\"],\"itemIds\":[\"b1m12gzsichvorbereitenauf\"]},{\"id\":\"b1m12l1e9\",\"type\":\"fastmatch\",\"prompt\":\"Velocidad sobre lo que ya sabes: el vocabulario de examen del A1/A2\",\"pairs\":[{\"target\":\"die Prüfung\",\"source\":\"el examen\"},{\"target\":\"die Antwort\",\"source\":\"la respuesta\"},{\"target\":\"der Antwortbogen\",\"source\":\"la hoja de respuestas\"},{\"target\":\"die Meinung\",\"source\":\"la opinión\"},{\"target\":\"Einverstanden!\",\"source\":\"¡De acuerdo!\"}],\"targetSeconds\":25,\"itemIds\":[\"pruefung\",\"antwort\",\"a2antwortbogen\",\"a2m6meinung\",\"a2einverstanden\"],\"tip\":\"Todo esto ya es tuyo desde el A2. Aquí solo se trata de que salga rápido, sin traducir por dentro.\"},{\"id\":\"b1m12l1e10\",\"type\":\"transform\",\"prompt\":\"Del hablado al registro del examen\",\"source\":\"Ich mache im Juni die Prüfung.\",\"instruction\":\"Dilo con «teilnehmen an»\",\"answers\":[\"Ich nehme im Juni an der Prüfung teil.\",\"Im Juni nehme ich an der Prüfung teil.\"],\"translation\":\"Me presento al examen en junio.\",\"hints\":[\"nehme … teil, con «an der Prüfung» en medio\",\"an + Dativ\"],\"itemIds\":[\"b1m12gzteilnehmenan\",\"ichmachediepruefung\"]},{\"id\":\"b1m12l1e11\",\"type\":\"type\",\"prompt\":\"Cierre de producc
