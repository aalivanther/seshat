.js\",\"/seshat/_next/static/chunks/2403rij-pmwx7.js\",\"/seshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T482,Dos frases se convierten en una:\u003cbr/\u003e«Ich suche eine Wohnung.» + «Die Wohnung ist hell.» → \u003cb\u003eIch suche eine Wohnung, \u003cmark class=\"akk\"\u003edie\u003c/mark\u003e hell ist.\u003c/b\u003e\u003cbr/\u003e\u003cbr/\u003eTres cosas, y solo tres:\u003cbr/\u003e1. \u003cb\u003eComa obligatoria\u003c/b\u003e antes del relativo. Siempre. Sin excepción.\u003cbr/\u003e2. El relativo \u003cb\u003ecopia el género\u003c/b\u003e del sustantivo al que se engancha: der Nachbar → \u003cb\u003eder\u003c/b\u003e · die Wohnung → \u003cb\u003edie\u003c/b\u003e · das Zimmer → \u003cb\u003edas\u003c/b\u003e · plural → \u003cb\u003edie\u003c/b\u003e.\u003cbr/\u003e3. El \u003cb\u003everbo se va al final\u003c/b\u003e de la relativa, como con weil. Por eso decimos «..., die hell \u003cb\u003eist\u003c/b\u003e», nunca «..., die ist hell».\u003cbr/\u003e\u003cbr/\u003eEn Nominativ el relativo es \u003cb\u003eidéntico al artículo\u003c/b\u003e que ya sabes: der/die/das/die. Eso es una regalía: no hay nada nuevo que memorizar, solo hay que mirar el sustantivo de la izquierda.\u003cbr/\u003e\u003cbr/\u003eY el aviso que salva el examen: el español dice «que» para todo. El alemán \u003cb\u003eno\u003c/b\u003e. Aquí «que» es \u003cb\u003eder/die/das\u003c/b\u003e porque sustituye a una cosa o a una persona. Cuando «que» introduce una frase entera («Espero \u003ci\u003eque\u003c/i\u003e el piso siga libre»), es [[dass|«que» completivo]] — y esa batalla la damos en la lección 5."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m1l3\",\"phaseId\":\"b1m1\",\"title\":\"Eine Wohnung, die hell ist\",\"subtitle\":\"Relativsätze en Nominativ — der, die, das\",\"minutes\":12,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Tres descripciones con relativo\",\"itemIds\":[\"b1m1einewohnungdiehellist\",\"b1m1einnachbarderhilft\",\"b1m1einzimmerdasfreiist\",\"b1m1vermieter\",\"b1m1mieter\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La regla detrás: el relativo copia el género y manda el verbo al final\",\"body\":\"$17\",\"table\":[[\"antecedente\",\"relativo (Nominativ)\",\"ejemplo\"],[\"der Nachbar\",\"der\",\"ein Nachbar, der immer hilft\"],[\"die Wohnung\",\"die\",\"eine Wohnung, die hell ist\"],[\"das Zimmer\",\"das\",\"ein Zimmer, das frei ist\"],[\"die Nachbarn (Pl.)\",\"die\",\"Nachbarn, die nett sind\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m1l3e1\",\"type\":\"mc\",\"prompt\":\"¿Qué relativo pide este sustantivo?\",\"question\":\"„Ich habe einen Vermieter, ___ sehr freundlich ist.“\",\"options\":[\"der\",\"die\",\"das\"],\"answer\":0,\"whyWrong\":[null,\"die es para femenino y plural — der Vermieter es masculino\",\"das es para neutro\"],\"itemIds\":[\"b1m1vermieter\"],\"tip\":\"«einen» te despista: es acusativo en la frase principal. Pero el relativo mira el GÉNERO (der Vermieter), no el caso de fuera.\"},{\"id\":\"b1m1l3e2\",\"type\":\"cloze\",\"prompt\":\"Completa el relativo\",\"text\":\"Ich suche eine Wohnung, ___ nicht zu teuer ist.\",\"answers\":[\"die\"],\"translation\":\"Busco un piso que no sea demasiado caro.\",\"hints\":[\"d-i-e Wohnung → ¿qué género?\",\"Femenino en Nominativ: igual que el artículo\"],\"itemIds\":[\"b1m1einewohnungdiehellist\",\"wohnung\"]},{\"id\":\"b1m1l3e3\",\"type\":\"cloze\",\"prompt\":\"Completa el relativo\",\"text\":\"Wir haben ein Zimmer, ___ ab Mai frei ist.\",\"answers\":[\"das\"],\"translation\":\"Tenemos una habitación que está libre a partir de mayo.\",\"hints\":[\"d-a-s Zimmer → neutro\",\"El relativo copia el género\"],\"itemIds\":[\"b1m1einzimmerdasfreiist\",\"zimmer\"]},{\"id\":\"b1m1l3e4\",\"type\":\"mc\",\"prompt\":\"¿Dónde va el verbo?\",\"question\":\"Elige la frase correcta:\",\"options\":[\"Ich habe einen Nachbarn, der ist immer freundlich\",\"Ich habe einen Nachbarn, der immer freundlich ist\"],\"answer\":1,\"whyWrong\":[\"En la relativa el verbo va AL FINAL, como con weil: «der immer freundlich ist»\",null],\"itemIds\":[\"b1m1einnachbarderhilft\",\"a2m4nachbarin\"],\"tip\":\"El calco «der ist immer freundlich» es el error nº1 del nivel: en español el verbo va detrás del «que», en alemán se va al final.\"},{\"id\":\"b1m1l3e5\",\"type\":\"build\",\"prompt\":\"Construye la relativa\",\"target\":\"Ich habe einen Nachbarn, der immer hilft\",\"translation\":\"Tengo un vecino que siempre ayuda\",\"distractors\":[\"die\",\"hilfen\"],\"itemIds\":[\"b1m1einnachbarderhilft\"],\"tip\":\"Coma, relativo, y el verbo cerrando. Tres piezas fijas.\"},{\"id\":\"b1m1l3e6\",\"type\":\"transform\",\"prompt\":\"Une las dos frases en una\",\"source\":\"Ich habe eine Wohnung gefunden. Die Wohnung liegt im ersten Stock.\",\"instruction\":\"Únelas con un relativo\",\"answers\":[\"Ich habe eine Wohnung gefunden, die im ersten Stock liegt\"],\"translation\":\"He encontrado un piso que está en la primera planta.\",\"hints\":[\"El segundo «die Wohnung» se convierte en el relativo\",\"..., die im ersten Stock ...\"],\"itemIds\":[\"b1m1einewohnungdiehellist\",\"wohnung\"],\"tip\":\"La operación es siempre la misma: repites el sustantivo → lo cambias por el relativo → mandas el verbo al final.\"},{\"id\":\"b1m1l3e7\",\"type\":\"gapbank\",\"prompt\":\"Completa el anuncio con los relativos correctos\",\"text\":\"Wir vermieten eine Wohnung, ___ im dritten Stock liegt. Es gibt einen Balkon, ___ nach Süden zeigt, und ein Bad, ___ neu renoviert ist.\",\"answers\":[\"die\",\"der\",\"das\"],\"bank\":[\"die\",\"der\",\"das\",\"den\",\"dem\",\"dass\"],\"translation\":\"Alquilamos un piso que está en la tercera planta. Hay un balcón que da al sur y un baño que está recién reformado.\",\"itemIds\":[\"wohnung\",\"b1m1einzimmerdasfreiist\"],\"tip\":\"Mira solo el sustantivo de la izquierda: die Wohnung → die · der Balkon → der · das Bad → das. En Nominativ el relativo es el artículo.\"},{\"id\":\"b1m1l3e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe la descripción\",\"text\":\"Das ist eine Wohnung, die sehr hell ist\",\"translation\":\"Es un piso que es muy luminoso\",\"hints\":[\"Coma antes del relativo\",\"Das ist eine Wohnung, die ...\"],\"itemIds\":[\"b1m1einewohnungdiehellist\"]},{\"id\":\"b1m1l3e9\",\"type\":\"mc\",\"prompt\":\"Plural\",\"question\":\"„Ich habe Nachbarn, ___ sehr nett sind.“\",\"options\":[\"der\",\"die\",\"das\"],\"answer\":1,\"whyWrong\":[\"der es masculino singular\",null,\"das es neutro singular\"],\"itemIds\":[\"a2m4nachbarin\"],\"tip\":\"El plural usa «die» para todos los géneros — igual que el artículo definido plural.\"},{\"id\":\"b1m1l3e10\",\"type\":\"build\",\"prompt\":\"Construye — con el verbo al final\",\"target\":\"Das ist der Vermieter, der die Wohnung zeigt\",\"translation\":\"Ese es el casero que enseña el piso\",\"distractors\":[\"den\",\"zeigen\"],\"itemIds\":[\"b1m1vermieter\",\"wohnung\"]},{\"id\":\"b1m1l3e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Busco una habitación que esté libre a partir de mayo\",\"answers\":[\"Ich suche ein Zimmer, das ab Mai frei ist\"],\"hints\":[\"das Zimmer → relativo «das»\",\"Ich suche ein Zimmer, das ab Mai ...\"],\"itemIds\":[\"b1m1einzimmerdasfreiist\",\"zimmer\"],\"tip\":\"Coma + das + verbo al final. Con esta frase escribes tu primer mail a una WG.\"},{\"id\":\"b1m1l3e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1, mensaje 3 · tarea 1 de 2. Dos escuchas, como en el examen.\",\"audio\":\"Sofía, ich bin's, Anna. Du, ich hab da was für dich: Im Haus von meiner Kollegin wird eine Wohnung frei, ähm, dritter Stock, Altbau, sechzig Quadratmeter. Und das Beste: Die Küche bleibt drin. Möbliert ist sie also nicht, aber die Küche musst du wenigstens nicht kaufen. Ruf mich an, bevor das jemand anders sieht!\",\"question\":\"„Die Wohnung liegt im dritten Stock.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Anna lo dice de pasada, entre dos comas: «dritter Stock, Altbau, sechzig Quadratmeter»\"],\"itemIds\":[\"b1m1altbau\",\"b1m1quadratmeter\"],\"tip\":\"Anna suelta tres datos seguidos sin respirar. En el R/F basta con cazar UNO: el que aparece en la afirmación.\"},{\"id\":\"b1m1l3e13\",\"type\":\"audiomc\",\"prompt\":\"Mismo mensaje, segunda tarea. Dos escuchas.\",\"audio\":\"Sofía, ich bin's, Anna. Du, ich hab da was für dich: Im Haus von meiner Kollegin wird eine Wohnung frei, ähm, dritter Stock, Altbau, sechzig Quadratmeter. Und das Beste: Die Küche bleibt drin. Möbliert ist sie also nicht, aber die Küche musst du wenigstens nicht kaufen. Ruf mich an, bevor das jemand anders sieht!\",\"question\":\"¿Qué es lo que Sofía NO tendrá que comprar?\",\"options\":[\"La cocina\",\"Los muebles del salón\",\"Nada: el piso viene amueblado\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"De los muebles dice justo lo contrario\",\"«möbliert ist sie nicht» — no viene amueblado\"],\"itemIds\":[\"b1m1moebliert\"]}]}],\"resources\":[{\"label\":\"Deutsche Welle — Relativsätze\",\"url\":\"https://learngerman.dw.com/es/overview\",\"note\":\"Busca «Relativsatz» en el B1 de DW: la misma regla con ejemplos hablados.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\
