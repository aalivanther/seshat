lla: anuncio ↔ persona\",\"body\":\"30 minutos, 20 ítems, 4 Teile: un texto corto de periódico o revista (marcas a/b/c), información práctica tipo programa o tablón (buscas EL dato), un correo (a/b/c sobre su contenido) y el formato estrella: las \u003cb\u003eAnzeigen\u003c/b\u003e. Ahí lees varios anuncios breves y la pregunta es siempre la misma: \u003cb\u003eWelche Anzeige passt?\u003c/b\u003e — qué anuncio encaja con qué persona. Siempre sobra uno: o un anuncio no encaja con nadie, o una persona se marca con \u003cb\u003eX\u003c/b\u003e. La técnica: primero lee QUÉ busca la persona (¿algo [[billig|barato]]? ¿una [[Wohnung|vivienda]]? ¿un plan para el [[Wochenende|fin de semana]]?), subraya sus 2-3 palabras clave y solo entonces ve a los anuncios a buscar la pareja. Ojo con la trampa clásica: un anuncio que comparte UNA palabra con la persona pero falla en lo importante — el precio, el día, el lugar.\"}},{\"kind\":\"note\",\"note\":{\"title\":\"überfliegen: leer por encima es una técnica, no una trampa\",\"body\":\"En Lesen NO hay tiempo para leer cada texto palabra a palabra — y no hace falta. La técnica se llama \u003cb\u003eüberfliegen\u003c/b\u003e, literalmente «sobrevolar»: 1) lee primero la PREGUNTA y sus opciones; 2) sobrevuela el texto buscando solo números, nombres, días y las palabras de la pregunta; 3) aterriza en la frase donde está el dato y léela con calma. El orden importa: pregunta → sobrevuelo → aterrizaje. Quien empieza leyendo el texto entero lee dos veces; quien sobrevuela, una.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"a2examl3e1\",\"type\":\"match\",\"prompt\":\"Empareja el kit de Lesen\",\"pairs\":[{\"target\":\"die Anzeige\",\"source\":\"el anuncio\"},{\"target\":\"zu verkaufen\",\"source\":\"se vende\"},{\"target\":\"überfliegen\",\"source\":\"leer por encima\"},{\"target\":\"Welche Anzeige passt?\",\"source\":\"¿Qué anuncio encaja?\"}],\"itemIds\":[\"a2anzeige\",\"a2zuverkaufen\",\"a2ueberfliegen\",\"a2welcheanzeigepasst\"]},
