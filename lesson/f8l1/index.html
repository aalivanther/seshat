\":\"f8l1e4\",\"type\":\"cloze\",\"prompt\":\"Completa con el plural\",\"text\":\"Meine ___ sind blau. (ojos)\",\"answers\":[\"Augen\"],\"translation\":\"Mis ojos son azules.\",\"hints\":[\"das Auge + n en plural\",\"A-u-g-e-n, con mayúscula\"],\"itemIds\":[\"auge\",\"blau\"]},{\"id\":\"f8l1e5\",\"type\":\"cloze\",\"prompt\":\"Completa el plural con Umlaut (¡no se perdona!)\",\"text\":\"Ich habe zwei ___. (pies)\",\"answers\":[\"Füße\"],\"translation\":\"Tengo dos pies.\",\"hints\":[\"der Fuß toma Umlaut en plural\",\"F-ü-ß-e, con ü\"],\"itemIds\":[\"fuss\"],\"strictUmlaut\":true,\"tip\":\"Fuß → Füße: sin la ü sería otro plural inventado. Como Bruder → Brüder.\"},{\"id\":\"f8l1e6\",\"type\":\"cloze\",\"prompt\":\"Otro plural con Umlaut (¡tampoco se perdona!)\",\"text\":\"Meine ___ sind klein. (manos)\",\"answers\":[\"Hände\"],\"translation\":\"Mis manos son pequeñas.\",\"hints\":[\"die Hand toma Umlaut en plural\",\"H-ä-n-d-e, con ä\"],\"itemIds\":[\"hand\",\"klein\"],\"strictUmlaut\":true,\"tip\":\"Hand → Hände. El Umlaut ES el plural aquí — escribir «Hande» es el error clásico a cazar.\"},{\"id\":\"f8l1e7\",\"type\":\"build\",\"prompt\":\"Construye la frase\",\"target\":\"Mein Kopf ist klein, aber meine Arme sind groß\",\"translation\":\"Mi cabeza es pequeña, pero mis brazos son grandes\",\"distractors\":[\"meine Kopf\",\"seid\"],\"itemIds\":[\"kopf\",\"arm\",\"klein\",\"gross\"],\"tip\":\"mein Kopf (masculino singular) pero meine Arme (plural). Y coma antes de aber, siempre.\"},{\"id\":\"f8l1e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe (¡caza el sind!)\",\"text\":\"Meine Beine sind müde\",\"translation\":\"Mis piernas están cansadas\",\"hints\":[\"Beine: ei suena «ai»\",\"sind, nunca «siend» — y müde con ü\"],\"itemIds\":[\"bein\",\"muede\"]},{\"id\":\"f8l1e9\",\"type\":\"type\",\"prompt\":\"Traduce con artículo\",\"question\":\"el pie (con artículo)\",\"answers\":[\"der Fuß\"],\"hints\":[\"Masculino\",\"Con ß al final\"],\"itemIds\":[\"fuss\"]},{\"
