eshat/_next/static/chunks/0dd6fx9me56xx.js\",\"/seshat/_next/static/chunks/3gtsi9pisg2o9.js\",\"/seshat/_next/static/chunks/3cpfos98oonxz.js\",\"/seshat/_next/static/chunks/1m9dx_fskra2g.js\",\"/seshat/_next/static/chunks/0cyttl2l7eele.js\",\"/seshat/_next/static/chunks/03veldm2tml_q.js\"],\"LessonPlayer\"]\n10:C\n17:T934,"])</script><script>self.__next_f.push([1,"In der Schweiz besitzt fast jede zweite Person ein [[Halbtax|abono de media tarifa]]. Wer eines hat, fährt mit dem Zug, dem Bus und dem Tram* für den halben Preis. Trotzdem diskutiert das Land seit Monaten über eine alte Idee: Soll der [[öffentliche Verkehr|el transporte público]] gratis werden?\u003cbr/\u003e\u003cbr/\u003eDie Befürworter rechnen einfach. In Zürich stehen an einem normalen Werktag Tausende Autos im Stau. Wären Bus und Bahn kostenlos, so sagen sie, würden viele Pendlerinnen und Pendler das Auto stehen lassen. Weniger Autos bedeuten weniger [[Lärm|ruido]], sauberere Luft und mehr Platz für Velos*. In einigen Städten Europas gibt es den Nulltarif bereits, und die Fahrgastzahlen sind dort deutlich gestiegen.\u003cbr/\u003e\u003cbr/\u003eDie Gegner halten dagegen, und ihre Argumente sind nicht nur finanzieller Natur. Ein Billett* kostet in der Schweiz viel, das stimmt — aber die Pünktlichkeit, die dichten [[Takte|frecuencias]] und die sauberen Wagen kosten eben auch etwas. «Gratis gibt es nicht», schreibt der Verkehrsökonom Martin Brunner. «Es zahlt dann einfach jemand anderes, nämlich alle über die Steuern, auch die Frau, die im Bergdorf lebt und nie ein Tram sieht.» Brunner [[befürchtet|teme]] zudem, dass volle Züge zur Hauptverkehrszeit noch voller würden, während die Bahn gleichzeitig weniger Geld für neue Strecken hätte.\u003cbr/\u003e\u003cbr/\u003eInteressant ist, was die Fahrgäste selbst sagen. In einer Umfrage der SBB nannten die Befragten nicht den Preis als grössten Ärger, sondern die fehlenden Sitzplätze am Morgen und die Anschlüsse, die man bei einer Verspätung verpasst. Wer täglich von Bern nach Zürich pendelt, möchte vor allem sicher sitzen und pünktlich ankommen. Ob das Billett dann fünf Franken kostet oder gar nichts, scheint zweitrangig zu sein.\u003cbr/\u003e\u003cbr/\u003eVielleicht liegt genau darin die Antwort. Ein Nulltarif klingt grosszügig, löst aber kein einziges der Probleme, die die Leute wirklich nennen. Wer mehr Menschen in den Zug bringen will, sollte zuerst dafür sorgen, dass der Zug pünktlich fährt und dass alle einen Platz finden. Danach — und erst danach — darf man über den Preis reden.\u003cbr/\u003e\u003cbr/\u003e\u003ci\u003e* das Tram = schweiz. für „die Straßenbahn“ · das Velo = schweiz. für „das Fahrrad“ · das Billett = schweiz. für „die Fahrkarte“ · grösster/grosszügig = en Suiza no se escribe ß\u003c/i\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"b1m9l6\",\"phaseId\":\"b1m9\",\"title\":\"Lesen: die Schweiz und ihr Billett\",\"subtitle\":\"Lectura larga — prensa suiza, con nota al pie de helvetismos\",\"minutes\":14,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Helvetismos y transporte\",\"itemIds\":[\"b1m9billett\",\"b1m9tram\",\"b1m7fevelo\",\"b1m9pendeln\",\"b1m5oeffentlichverkehrsmittel\"]},{\"kind\":\"note\",\"note\":{\"title\":\"Antes de leer: el alemán del examen es plurizéntrico\",\"body\":\"En el Goethe/ÖSD B1 los textos vienen «de distintos medios en lengua alemana»: puede tocarte una carta desde Viena o un artículo de un diario suizo. Los \u003ci\u003ehelvetismos\u003c/i\u003e y \u003ci\u003eaustriacismos\u003c/i\u003e se marcan con una nota al pie, exactamente como aquí abajo: \u003cb\u003edas Billett\u003c/b\u003e* (= die Fahrkarte), \u003cb\u003edas Tram\u003c/b\u003e* (= die Straßenbahn), \u003cb\u003edas Velo\u003c/b\u003e* (= das Fahrrad), \u003cb\u003eparkieren\u003c/b\u003e* (= parken).\u003cbr/\u003e\u003cbr/\u003eEstrategia de lectura: primero el \u003cb\u003etítulo\u003c/b\u003e y la fuente (te dicen el género y la postura), luego una pasada rápida sin diccionario, y solo entonces las preguntas. Las preguntas de \u003ci\u003einferencia\u003c/i\u003e no tienen su respuesta escrita en ninguna línea: se deducen del tono y de lo que el autor deja caer.\"}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m9l6e1\",\"type\":\"read\",\"prompt\":\"Lee el artículo y responde. Las palabras subrayadas suenan y se traducen al tocarlas.\",\"title\":\"Zwei Franken für den Berg: die Schweiz streitet über den Nulltarif\",\"source\":\"Kommentar aus einer Schweizer Tageszeitung\",\"text\":\"$17\",\"questions\":[{\"id\":\"b1m9l6e1q1\",\"q\":\"Was kann man mit einem Halbtax machen?\",\"options\":[\"Gratis fahren\",\"Für den halben Preis fahren\",\"Nur am Wochenende fahren\"],\"answer\":1,\"why\":\"Zeile 2: «fährt … für den halben Preis».\"},{\"id\":\"b1m9l6e1q2\",\"q\":\"Welches Argument nennen die Befürworter des Nulltarifs?\",\"options\":[\"Die Züge wären pünktlicher\",\"Es gäbe weniger Autos und weniger Lärm\",\"Die Bahn hätte mehr Geld\"],\"answer\":1,\"why\":\"«Weniger Autos bedeuten weniger Lärm, sauberere Luft und mehr Platz für Velos.»\"},{\"id\":\"b1m9l6e1q3\",\"q\":\"Was meint Martin Brunner mit „auch die Frau, die im Bergdorf lebt und nie ein Tram sieht“?\",\"options\":[\"Dass auch Leute zahlen würden, die den Nutzen gar nicht haben\",\"Dass in den Bergen mehr Trams fahren sollten\",\"Dass Frauen seltener mit dem Tram fahren\"],\"answer\":0,\"inference\":true,\"why\":\"No lo dice literalmente: lo deduces de «Es zahlt dann einfach jemand anderes … über die Steuern». El ejemplo del pueblo de montaña ilustra quién paga sin recibir nada.\"},{\"id\":\"b1m9l6e1q4\",\"q\":\"Wie ist die Haltung des Autors am Ende des Textes?\",\"options\":[\"Er ist klar für den Nulltarif\",\"Er hält den Nulltarif für die falsche erste Massnahme\",\"Er findet den Preis der Billette zu hoch\"],\"answer\":1,\"inference\":true,\"why\":\"El autor no dice «ich bin dagegen»: lo señala con «löst aber kein einziges der Probleme» y con el orden que propone («zuerst … danach — und erst danach»).\"},{\"id\":\"b1m9l6e1q5\",\"q\":\"Was ärgert die Fahrgäste laut der Umfrage am meisten?\",\"options\":[\"Der Preis der Billette\",\"Fehlende Sitzplätze und verpasste Anschlüsse\",\"Die schmutzigen Wagen\"],\"answer\":1,\"why\":\"«nannten die Befragten nicht den Preis …, sondern die fehlenden Sitzplätze … und die Anschlüsse».\"}],\"itemIds\":[\"b1m9billett\",\"b1m9tram\",\"b1m7fevelo\",\"b1m9pendeln\",\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"Fíjate en el truco del comentario de prensa: la opinión del autor casi nunca lleva «ich finde». Va en el último párrafo y en palabras como «vielleicht», «erst danach».\"},{\"id\":\"b1m9l6e2\",\"type\":\"match\",\"prompt\":\"Empareja el helvetismo con el alemán estándar\",\"pairs\":[{\"target\":\"das Billett\",\"source\":\"die Fahrkarte\"},{\"target\":\"das Tram\",\"source\":\"die Straßenbahn\"},{\"target\":\"das Velo\",\"source\":\"das Fahrrad\"},{\"target\":\"parkieren\",\"source\":\"parken\"}],\"itemIds\":[\"b1m9billett\",\"b1m9tram\",\"b1m7fevelo\"],\"tip\":\"En el examen los helvetismos siempre llevan nota al pie: no hay que saberlos, hay que saber USAR la nota.\"},{\"id\":\"b1m9l6e3\",\"type\":\"mc\",\"prompt\":\"Comprensión global\",\"question\":\"Welche Überschrift passt am besten zum Text?\",\"options\":[\"Gratis fahren löst die falschen Probleme\",\"Die Schweizer fahren zu viel Auto\",\"Das Halbtax wird teurer\"],\"answer\":0,\"whyWrong\":[null,\"El atasco de Zúrich es solo un argumento dentro del texto, no el tema\",\"El precio del Halbtax no se discute en ningún momento\"],\"itemIds\":[\"b1m5oeffentlichverkehrsmittel\"]},{\"id\":\"b1m9l6e4\",\"type\":\"cloze\",\"prompt\":\"Completa con una palabra del texto\",\"text\":\"Wer täglich von Bern nach Zürich fährt, muss ___.\",\"answers\":[\"pendeln\"],\"translation\":\"Quien va a diario de Berna a Zúrich tiene que desplazarse (commuting).\",\"hints\":[\"El verbo de quien viaja al trabajo cada día\",\"p…\"],\"itemIds\":[\"b1m9pendeln\"]},{\"id\":\"b1m9l6e5\",\"type\":\"gapbank\",\"prompt\":\"Reconstruye el argumento de los partidarios\",\"text\":\"___ Bus und Bahn kostenlos, würden viele Pendler das Auto stehen lassen. Weniger Autos bedeuten ___ Luft und mehr Platz für Velos. In ___ Städten gibt es den Nulltarif schon, und die Fahrgastzahlen sind dort ___ gestiegen.\",\"answers\":[\"Wären\",\"sauberere\",\"einigen\",\"deutlich\"],\"bank\":[\"Wären\",\"sauberere\",\"einigen\",\"deutlich\",\"Wenn\",\"sauberste\",\"einige\",\"deutliche\"],\"translation\":\"Si el autobús y el tren fueran gratis, muchos commuters dejarían el coche. Menos coches significan aire más limpio y más sitio para las bicis. En algunas ciudades ya existe la tarifa cero y allí el número de pasajeros ha subido claramente.\",\"hints\":[\"Condicional irreal sin «wenn»: el verbo abre la frase, y «Wenn» solo no basta porque se quedaría sin verbo\",\"«d-e-u-t-l-i-c-h» aquí es adverbio: no se declina\"],\"itemIds\":[\"b1m5oeffentlichverkehrsmittel\",\"b1m7fevelo\"],\"tip\":\"«Wären Bus und Bahn kostenlos, …» = «Wenn Bus und Bahn kostenlos wären, …». La condicional sin wenn empieza directamente por el verbo: muy frecuente en prensa.\"},{\"id\":\"b1m9l6e6\",\"type\":\"bucket\",\"prompt\":\"¿A favor o en contra del Nulltarif? (Lesen Teil 4 en miniatura)\",\"categories\":[\"dafür (a favor)\",\"dagegen (en contra)\"],\"items\":[{\"text\":\"„Weniger Autos, sauberere Luft.“\",\"bucket\":0},{\"text\":\"„Gratis gibt es nicht — es zahlen alle über die Steuern.“\",\"bucket\":1},{\"text\":\"„Volle Züge würden noch voller.“\",\"bucket\":1},{\"text\":\"„Viele würden das Auto stehen lassen.“\",\"bucket\":0},{\"text\":\"„In anderen Städten sind die Fahrgastzahlen gestiegen.“\",\"bucket\":0},{\"text\":\"„Die Bahn hätte weniger Geld für neue Strecken.“\",\"bucket\":1}],\"itemIds\":[\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"Ninguna frase dice «ich bin dafür/dagegen»: la postura se infiere. Eso es exactamente el Teil 4 del Lesen.\"},{\"id\":\"b1m9l6e7\",\"type\":\"errorfix\",\"prompt\":\"Corrige el helvetismo mal usado\",\"wrong\":\"In Zürich habe ich eine Fahrkarte für das Tram gekauft und bin mit dem Velo gefahren.\",\"answers\":[\"In Zürich habe ich ein Billett für das Tram gekauft und bin mit dem Velo gefahren.\"],\"why\":\"No es un error de gramática, es de variedad: en Suiza el billete se llama «das Billett» (neutro), así que el artículo pasa de «eine» a «ein». En un texto suizo, mezclar «Fahrkarte» con «Tram» y «Velo» suena raro.\",\"translation\":\"En Zúrich compré un billete para el tranvía y fui en bici.\",\"itemIds\":[\"b1m9billett\",\"b1m9tram\",\"b1m7fevelo\"]},{\"id\":\"b1m9l6e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 2 de 5 (información de tráfico en la radio suiza). Dos escuchas.\",\"audio\":\"Und nun die Verkehrsinformationen von Radio Limmatstadt. Wegen Bauarbeiten am Hauptbahnhof Zürich fahren die Trams der Linien elf und vierzehn diese Woche einen Umweg über die Sihlstrasse. Wer ein Billett für die kurze Strecke gelöst hat, kann damit auch den Ersatzbus benutzen. Und noch etwas für die Pendlerinnen und Pendler: Ab Freitag verkehren die Züge nach Bern wieder normal.\",\"question\":\"Die Trams der Linien elf und vierzehn fahren diese Woche wie immer.\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"Esta semana dan un rodeo por la Sihlstrasse a causa de las obras: «fahren … einen Umweg»\",null],\"itemIds\":[\"b1m9tram\",\"b1m9billett\",\"b1m9pendeln\"],\"tip\":\"El alemán de la radio suiza es el mismo que estudias, con dos avisos: sin ß (Sihlstrasse) y con su léxico propio (das Tram, das Billett). El oído se acostumbra en tres textos.\"},{\"id\":\"b1m9l6e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1 · texto 2, segunda tarea. Mismo audio, dos escuchas.\",\"audio\":\"Und nun die Verkehrsinformationen von Radio Limmatstadt. Wegen Bauarbeiten am Hauptbahnhof Zürich fahren die Trams der Linien elf und vierzehn diese Woche einen Umweg über die Sihlstrasse. Wer ein Billett für die kurze Strecke gelöst hat, kann damit auch den Ersatzbus benutzen. Und noch etwas für die Pendlerinnen und Pendler: Ab Freitag verkehren die Züge nach Bern wieder normal.\",\"question\":\"¿Qué pasa con el billete de trayecto corto?\",\"options\":[\"Sirve también para el autobús sustitutorio\",\"Hay que comprarlo otra vez\",\"Solo vale el viernes\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Justo lo contrario: «kann damit auch den Ersatzbus benutzen»\",\"El viernes es cuando vuelven a la normalidad los trenes a Berna, otra información\"],\"itemIds\":[\"b1m9billett\"],\"tip\":\"«ein Billett lösen» es la forma suiza y formal de «comprar un billete». Si oyes «lösen» y piensas en «resolver», pierdes la frase entera.\"},{\"id\":\"b1m9l6e8\",\"type\":\"transform\",\"prompt\":\"Del sustantivo al verbo\",\"source\":\"Ich fahre täglich zwischen Bern und Zürich hin und her.\",\"instruction\":\"Dilo con el verbo del texto\",\"answers\":[\"Ich pendle täglich zwischen Bern und Zürich\",\"Ich pendle täglich zwischen Bern und Zürich.\",\"Ich pendele täglich zwischen Bern und Zürich\"],\"translation\":\"Voy y vengo a diario entre Berna y Zúrich.\",\"hints\":[\"El verbo empieza por p…\",\"Ich pendl__ täglich …\"],\"itemIds\":[\"b1m9pendeln\"]},{\"id\":\"b1m9l6e9\",\"type\":\"paraphrase\",\"prompt\":\"Dilo con tus palabras (sin copiar al autor)\",\"source\":\"Ein Nulltarif löst kein einziges der Probleme, die die Leute wirklich nennen.\",\"forbid\":[\"Nulltarif\",\"löst\",\"Probleme\"],\"answers\":[\"Wenn die Fahrt gratis wäre, würde sich für die Fahrgäste nichts verbessern\",\"Wenn die Fahrt gratis wäre, würde sich für die Fahrgäste nichts ändern\",\"Gratis zu fahren würde den Fahrgästen nicht wirklich helfen\",\"Auch eine kostenlose Fahrt würde den Fahrgästen nicht wirklich helfen\"],\"translation\":\"La tarifa cero no resuelve nada de lo que la gente menciona de verdad.\",\"hints\":[\"Empieza con «Wenn die Fahrt gratis wäre, …»\",\"Konjunktiv II: würde sich … verbessern\"],\"itemIds\":[\"b1m3eslohntsich\"],\"tip\":\"Reformular la tesis ajena con tus palabras es lo primero que se hace en la Schreiben Aufgabe 2. Copiarla literalmente no puntúa.\"},{\"id\":\"b1m9l6e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"En Suiza mucha gente se desplaza a diario en transporte público.\",\"answers\":[\"In der Schweiz pendeln viele Menschen täglich mit den öffentlichen Verkehrsmitteln\",\"In der Schweiz pendeln viele Menschen täglich mit den öffentlichen Verkehrsmitteln.\",\"In der Schweiz pendeln viele Leute täglich mit den öffentlichen Verkehrsmitteln\"],\"hints\":[\"Empieza con «In der Schweiz …» → verbo 2º\",\"mit den öffentlich__ Verkehrsmitteln (dativo plural)\"],\"itemIds\":[\"b1m9pendeln\",\"b1m5oeffentlichverkehrsmittel\"],\"tip\":\"«den öffentlichen Verkehrsmitteln»: dativo plural, -en por todas partes. El plural es la casilla más agradecida de la declinación.\"}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m9-3\",\"book\":\"Guten Tag! / Auf Wiedersehen!\",\"real\":\"Servus!\",\"meaning\":\"Hola y también adiós (Austria y Baviera)\",\"when\":\"Entre conocidos, en Austria y el sur de Alemania, tanto al llegar como al despedirse. Con un desconocido de usted en Viena, mejor «Grüß Gott»; en el norte y en el examen, ninguno de los dos.\",\"register\":\"regional\",\"exam\":\"Guten Tag! Und beim Abschied: Auf Wiedersehen!\",\"note\":\"Del latín «servus» (siervo): «a su servicio». Sirve para saludar Y despedirse, como el «ciao» italiano.\",\"sound\":\"ZEA-vus\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m9natvservus\"}}],\"resources\":[{\"label\":\"SRF — Nachrichten (Schweiz)\",\"url\":\"https://www.srf.ch/news\",\"note\":\"Prensa suiza real: fíjate en la ausencia de ß y en Billett, Tram, Velo, parkieren.\"},{\"label\":\"DW — Top-Thema mit Vokabeln (B1)\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Artículos B1 con vocabulario glosado: el mismo formato que este `read`.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunks/0pzp42ldqy46z.js\"],\"IconMark\"]\nf:null\n14:[[\"$\",\"title\",\"0\",{\"children\":\"Seshat — aprende idiomas\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Seshat: cursos de idiomas en cuaderno interactivo. Alemán e inglés A1–B2 — frase usable primero, gramática después.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"3\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Seshat\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"5\",{\"rel\":\"icon\",\"href\":\"/seshat/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L18\",\"6\",{}]]\n"])</script></body></html>
