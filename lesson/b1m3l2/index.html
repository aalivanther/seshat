usas una.\u003cbr/\u003e\u003cbr/\u003e1. La fácil, la que ya haces: \u003cb\u003eman\u003c/b\u003e + verbo normal → \u003ci\u003eMan spricht hier Deutsch.\u003c/i\u003e\u003cbr/\u003e2. La del nivel B1, la que aparece en los textos de prensa y en los reglamentos del examen: \u003cb\u003ewerden + Partizip II\u003c/b\u003e → \u003ci\u003eHier \u003cb\u003ewird\u003c/b\u003e Deutsch \u003cb\u003egesprochen\u003c/b\u003e.\u003c/i\u003e\u003cbr/\u003e\u003cbr/\u003eFíjate en la mecánica: \u003cb\u003ewerden\u003c/b\u003e se conjuga y ocupa la 2ª posición; el \u003cb\u003ePartizip II\u003c/b\u003e (el mismo que usas en el Perfekt: gesprochen, gemacht, empfohlen) cierra la frase. Es otra vez la pinza verbal del A2, con otra pieza dentro.\u003cbr/\u003e\u003cbr/\u003eY el aviso que decide media nota: \u003cb\u003ewerden ≠ sein\u003c/b\u003e. \u003ci\u003eDie Tür \u003cb\u003ewird\u003c/b\u003e geöffnet\u003c/i\u003e = la puerta se está abriendo (pasa algo). \u003ci\u003eDie Tür \u003cb\u003eist\u003c/b\u003e geöffnet\u003c/i\u003e = la puerta está abierta (resultado). Como en español dices «está abierto», tu mano escribirá \u003ci\u003eist\u003c/i\u003e siempre. [[Achtung|atención]]: en el examen eso es un error de Strukturen.\",\"table\":[[\"activa (man)\",\"pasiva (werden + Partizip)\"],[\"Man spricht hier Deutsch.\",\"Hier wird Deutsch gesprochen.\"],[\"Man empfiehlt Bewegung.\",\"Bewegung wird empfohlen.\"],[\"Man untersucht den Patienten.\",\"Der Patient wird untersucht.\"],[\"Man macht das jeden Tag.\",\"Das wird jeden Tag gemacht.\"]],\"viz\":{\"kind\":\"timeline\",\"pastLabel\":\"Aktiv — importa QUIÉN\",\"pastExample\":\"Die Ärztin untersucht den Patienten.\",\"nowLabel\":\"Passiv — importa QUÉ pasa\",\"nowExample\":\"Der Patient wird untersucht.\"}}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m3l2e1\",\"type\":\"mc\",\"prompt\":\"Solo la forma decide: ¿quién hace la acción?\",\"question\":\"„Die Ärztin wird von der Patientin angerufen.“ ¿Quién llama por teléfono?\",\"options\":[\"Die Patientin\",\"Die Ärztin\"],\"answer\":0,\"whyWrong\":[null,\"Die Ärztin es el primer nombre, pero NO es quien actúa: lleva la acción encima. El agente va detrás de von\"],\"itemIds\":[\"b1m3dieaerztin\"],\"tip\":\"Tu cerebro quiere que el primer sustantivo sea el que hace. En pasiva es justo al revés: quien hace va tras «von».\"},{\"id\":\"b1m3l2e2\",\"type\":\"mc\",\"prompt\":\"Reconoce la pasiva\",\"question\":\"„Hier wird Deutsch gesprochen.“\",\"options\":[\"Aquí se habla alemán\",\"Aquí quiere hablar alemán\",\"Aquí ha hablado alemán\"],\"answer\":0,\"whyWrong\":[null,\"Eso sería «Hier will jemand Deutsch sprechen»\",\"Eso sería «Hier hat jemand Deutsch gesprochen»\"],\"itemIds\":[\"b1m3hierwirddeutschgesprochen\"],\"tip\":\"wird + Partizip = tu «se» impersonal. No hay ningún «él/ella» escondido en wird.\"},{\"id\":\"b1m3l2e3\",\"type\":\"bucket\",\"prompt\":\"Clasifica: ¿activa o pasiva?\",\"categories\":[\"Aktiv (alguien hace)\",\"Passiv (wird + Partizip)\"],\"items\":[{\"text\":\"Man empfiehlt Bewegung.\",\"bucket\":0},{\"text\":\"Bewegung wird empfohlen.\",\"bucket\":1},{\"text\":\"Der Arzt untersucht den Körper.\",\"bucket\":0},{\"text\":\"Der Körper wird untersucht.\",\"bucket\":1},{\"text\":\"Hier wird Deutsch gesprochen.\",\"bucket\":1},{\"text\":\"Hier spricht man Deutsch.\",\"bucket\":0},{\"text\":\"Das Formular wird ausgefüllt.\",\"bucket\":1},{\"text\":\"Ich fülle das Formular aus.\",\"bucket\":0}],\"itemIds\":[\"b1m3empfehlen\",\"b1m3derkoerper\",\"b1m3hierwirddeutschgesprochen\"],\"tip\":\"La marca es siempre la misma pareja: una forma de werden + un participio al final.\"},{\"id\":\"b1m3l2e4\",\"type\":\"cloze\",\"prompt\":\"Completa la pasiva\",\"text\":\"Das Formular ___ am Computer ausgefüllt.\",\"answers\":[\"wird\"],\"translation\":\"El formulario se rellena en el ordenador.\",\"hints\":[\"Sujeto en singular → la forma de werden\",\"w-i-r-d, no ist\"],\"itemIds\":[\"b1m3eswirdempfohlen\"],\"tip\":\"«ist ausgefüllt» diría que el formulario YA está relleno. Aquí describimos lo que se hace.\"},{\"id\":\"b1m3l2e5\",\"type\":\"build\",\"prompt\":\"Construye la pasiva (con la pinza)\",\"target\":\"Das Rezept wird vom Arzt geschrieben\",\"translation\":\"La receta la escribe el médico\",\"distractors\":[\"ist\",\"schreibt\"],\"itemIds\":[\"a2m8rezept\",\"arzt\"],\"tip\":\"vom = von dem. El agente («por el médico») va con von + Dativ.\"},{\"id\":\"b1m3l2e6\",\"type\":\"transform\",\"prompt\":\"Transforma: de man a pasiva\",\"source\":\"Man empfiehlt 10.000 Schritte pro Tag.\",\"instruction\":\"Dilo en Passiv Präsens\",\"answers\":[\"10.000 Schritte pro Tag werden empfohlen\",\"10.000 Schritte werden pro Tag empfohlen\",\"Pro Tag werden 10.000 Schritte empfohlen\"],\"translation\":\"Se recomiendan 10.000 pasos al día.\",\"hints\":[\"El objeto de man pasa a ser sujeto → plural, así que werden\",\"... werden empfohlen\"],\"itemIds\":[\"b1m3eswirdempfohlen\",\"b1m3empfehlen\"],\"tip\":\"Sujeto plural → werden (no wird). El participio de empfehlen es empfohlen, con o.\"},{\"id\":\"b1m3l2e7\",\"type\":\"mc\",\"prompt\":\"werden o sein: elige\",\"question\":\"«La consulta se abre a las ocho» →\",\"options\":[\"Die Praxis wird um acht geöffnet\",\"Die Praxis ist um acht geöffnet\",\"Die Praxis öffnet sich um acht\"],\"answer\":0,\"whyWrong\":[null,\"«ist geöffnet» describe el resultado (está abierta), no la acción de abrirla\",\"El alemán no usa el reflexivo para esto: öffnen sich lo hacen las puertas automáticas, no las consultas\"],\"itemIds\":[\"praxis\"],\"tip\":\"Regla de bolsillo: si en español cabe «se está + participio», en alemán va wird.\"},{\"id\":\"b1m3l2e8\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe\",\"text\":\"Es wird empfohlen, mehr zu gehen\",\"translation\":\"Se recomienda caminar más\",\"hints\":[\"Empieza por Es wird ...\",\"empfohlen, con o\"],\"itemIds\":[\"b1m3eswirdempfohlen\"]},{\"id\":\"b1m3l2e9\",\"type\":\"errorfix\",\"prompt\":\"Corrige el calco del español\",\"wrong\":\"Hier ist Deutsch gesprochen.\",\"answers\":[\"Hier wird Deutsch gesprochen.\"],\"why\":\"«Se habla alemán» describe una ACCIÓN habitual, no un estado. La acción pide werden; sein describiría un resultado («está hablado»), que aquí no significa nada.\",\"translation\":\"Aquí se habla alemán.\",\"itemIds\":[\"b1m3hierwirddeutschgesprochen\"],\"tip\":\"El español «está + participio» te empuja a ist. En pasiva de acción, siempre wird.\"},{\"id\":\"b1m3l2e10\",\"type\":\"gapbank\",\"prompt\":\"Completa el cartel de la consulta\",\"text\":\"In dieser Praxis ___ auch Spanisch gesprochen. Die Untersuchung ___ von einer Ärztin gemacht. Termine ___ online vereinbart.\",\"answers\":[\"wird\",\"wird\",\"werden\"],\"bank\":[\"wird\",\"werden\",\"ist\",\"sind\",\"hat\"],\"translation\":\"En esta consulta se habla también español. El reconocimiento lo hace una médica. Las citas se concretan online.\",\"itemIds\":[\"b1m3dieuntersuchung\",\"b1m3dieaerztin\",\"praxis\"],\"tip\":\"Singular → wird · plural → werden. El banco tiene ist/sind justo para tentarte.\"},{\"id\":\"b1m3l2e11\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Se recomienda beber mucha agua.\",\"answers\":[\"Es wird empfohlen, viel Wasser zu trinken\"],\"hints\":[\"Empieza por Es wird ...\",\"..., viel Wasser zu trinken\"],\"itemIds\":[\"b1m3eswirdempfohlen\",\"wasser\"],\"tip\":\"«Es wird empfohlen, … zu + infinitivo» es una fórmula entera. Cópiala tal cual en el examen escrito.\"},{\"id\":\"b1m3l2e12\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: información a la plantilla · tarea 1 de 2. Dos escuchas.\",\"audio\":\"Guten Morgen, eine Information aus der Verwaltung für alle Kolleginnen und Kollegen: Ab nächster Woche wird am Schreibtisch nicht mehr gegessen. In der Küche natürlich schon, die ist ja groß genug. Kontrollieren wird das niemand, ähm, es wird empfohlen, mehr nicht. Aber die Tastaturen sehen aus, wie sie aussehen, und die Reinigungsfirma beschwert sich zu Recht. Vielen Dank.\",\"question\":\"„Im ganzen Gebäude darf ab nächster Woche nicht mehr gegessen werden.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":1,\"plays\":2,\"whyWrong\":[\"«In der Küche natürlich schon»: la cocina sigue siendo para comer\",null],\"itemIds\":[\"b1m3eswirdempfohlen\",\"b1m3derschreibtisch\"],\"tip\":\"La frase que salva la respuesta es la que llega DESPUÉS de la norma. En el Teil 1 casi siempre hay una excepción detrás.\"},{\"id\":\"b1m3l2e13\",\"type\":\"audiomc\",\"prompt\":\"Misma información, segunda tarea. Dos escuchas.\",\"audio\":\"Guten Morgen, eine Information aus der Verwaltung für alle Kolleginnen und Kollegen: Ab nächster Woche wird am Schreibtisch nicht mehr gegessen. In der Küche natürlich schon, die ist ja groß genug. Kontrollieren wird das niemand, ähm, es wird empfohlen, mehr nicht. Aber die Tastaturen sehen aus, wie sie aussehen, und die Reinigungsfirma beschwert sich zu Recht. Vielen Dank.\",\"question\":\"¿Quién va a controlar la norma?\",\"options\":[\"Nadie: es una recomendación\",\"El personal de limpieza\",\"La Verwaltung, con avisos\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"La empresa de limpieza se queja, pero no controla a nadie\",\"Dice literalmente «Kontrollieren wird das niemand»\"],\"itemIds\":[\"b1m3eswirdempfohlen\"],\"tip\":\"«Es wird empfohlen» — pasiva sin agente: se recomienda, y no se dice quién. Es LA estructura de los avisos alemanes.\"}]}],\"resources\":[{\"label\":\"Goethe — Deutsch für dich (B1)\",\"url\":\"https://www.goethe.de/prj/dfd/de/home.cfm\",\"note\":\"Filtra por B1 y busca «Passiv»: ejercicios interactivos de werden + Partizip.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201
