ión social, no vocabulario suelto\",\"body\":\"En B1 los temas dejan de ser «mi familia» y pasan a ser debates: sedentarismo, deporte obligatorio, límites de velocidad. El primero de todos, y uno de los que sale de verdad en el examen, es este: \u003cb\u003e[[Sitzen ist das neue Rauchen|estar sentado es el nuevo tabaco]]\u003c/b\u003e. La frase la repiten médicos y periódicos desde hace años.\u003cbr/\u003e\u003cbr/\u003eDos piezas que vas a usar todo el módulo: \u003cb\u003esich bewegen\u003c/b\u003e (moverse, y por extensión hacer ejercicio) — es reflexivo, así que dices \u003ci\u003eIch bewege \u003cu\u003emich\u003c/u\u003e\u003c/i\u003e —, y \u003cb\u003eder Bewegungsmangel\u003c/b\u003e, la palabra compuesta que traduce «sedentarismo»: \u003ci\u003eBewegung\u003c/i\u003e (movimiento) + \u003ci\u003eMangel\u003c/i\u003e (falta). El alemán no dice «sedentarismo», dice «falta de movimiento», y eso ya te explica cómo lo piensan.\",\"table\":[[\"alemán\",\"español\",\"ojo\"],[\"sich bewegen\",\"moverse / hacer ejercicio\",\"reflexivo: ich bewege mich\"],[\"die Bewegung\",\"el movimiento / la actividad física\",\"die → die Bewegungen\"],[\"der Bewegungsmangel\",\"el sedentarismo\",\"Bewegung + Mangel (falta)\"],[\"den ganzen Tag sitzen\",\"estar sentado todo el día\",\"Akkusativ de tiempo: den ganzen Tag\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b1m3l1e1\",\"type\":\"mc\",\"prompt\":\"Reconoce el eslogan\",\"question\":\"„Sitzen ist das neue Rauchen.“\",\"options\":[\"Estar sentado es el nuevo tabaco\",\"Fumar sentado es lo nuevo\",\"Los fumadores están sentados\"],\"answer\":0,\"whyWrong\":[null,\"Sitzen es el SUJETO de la frase: lo que se compara con fumar es el hecho de estar sentado\",\"No habla de personas, sino de dos hábitos\"],\"itemIds\":[\"b1m3sitzenistdasneuerauchen\"],\"tip\":\"El infinitivo con mayúscula (das Sitzen, das Rauchen) funciona como sustantivo: «el estar sentado», «el fumar».\"},{\"id\":\"b1m3l1e2\",\"type\":\"match\",\"prompt\":\"Empareja las piezas del tema\",\"pairs\":[{\"target\":\"sich bewegen\",\"source\":\"moverse / hacer ejercicio\"},{\"target\":\"die Bewegung\",\"source\":\"el movimiento / la actividad física\"},{\"target\":\"der Bewegungsmangel\",\"source\":\"el sedentarismo\"},{\"target\":\"der Schreibtisch\",\"source\":\"el escritorio\"}],\"itemIds\":[\"b1m3sichbewegen\",\"b1m3diebewegung\",\"b1m3derbewegungsmangel\",\"b1m3derschreibtisch\"]},{\"id\":\"b1m3l1e3\",\"type\":\"cloze\",\"prompt\":\"Completa con el Akkusativ de tiempo\",\"text\":\"Ich sitze den ___ Tag am Schreibtisch.\",\"answers\":[\"ganzen\"],\"translation\":\"Estoy sentado todo el día al escritorio.\",\"hints\":[\"den ... Tag: masculino en Akkusativ\",\"ganz + -en\"],\"itemIds\":[\"b1m3denganzentagsitzen\",\"b1m3derschreibtisch\"],\"tip\":\"«den ganzen Tag» ya lo usabas en A2 con el Perfekt; aquí es la marca de tiempo del sedentarismo.\"},{\"id\":\"b1m3l1e4\",\"type\":\"mc\",\"prompt\":\"Desmonta la palabra compuesta\",\"question\":\"„der Bewegungsmangel“ está formado por ...\",\"options\":[\"Bewegung (movimiento) + Mangel (falta)\",\"Bewegung (movimiento) + Mangel (mucho)\",\"Bewegen (mover) + Mangel (peligro)\"],\"answer\":0,\"whyWrong\":[null,\"der Mangel es la FALTA de algo, no la abundancia\",\"der Mangel no es peligro (das Risiko); y la primera parte es el sustantivo Bewegung\"],\"itemIds\":[\"b1m3derbewegungsmangel\",\"b1m3diebewegung\"],\"tip\":\"Truco de examen: en un compuesto alemán manda la ÚLTIMA palabra. Bewegungsmangel es un Mangel, no una Bewegung.\"},{\"id\":\"b1m3l1e5\",\"type\":\"build\",\"prompt\":\"Construye la queja más frecuente\",\"target\":\"Ich bewege mich zu wenig\",\"translation\":\"Me muevo demasiado poco\",\"distractors\":[\"bewegt\",\"sich\"],\"itemIds\":[\"b1m3sichbewegen\"],\"tip\":\"El reflexivo cambia con la persona: ich bewege MICH, du bewegst DICH, er bewegt SICH.\"},{\"id\":\"b1m3l1e6\",\"type\":\"listen\",\"prompt\":\"Escucha y transcribe el eslogan\",\"text\":\"Sitzen ist das neue Rauchen\",\"translation\":\"Estar sentado es el nuevo tabaco\",\"hints\":[\"Empieza con el infinitivo sustantivado\",\"Sitzen ist das ...\"],\"itemIds\":[\"b1m3sitzenistdasneuerauchen\"]},{\"id\":\"b1m3l1e7\",\"type\":\"cloze\",\"prompt\":\"Completa el reflexivo\",\"text\":\"Nach der Arbeit ___ ich mich eine Stunde.\",\"answers\":[\"bewege\"],\"translation\":\"Después del trabajo me muevo una hora.\",\"hints\":[\"El verbo va 2º porque «Nach der Arbeit» ocupa la posición 1\",\"sich bewegen → ich ...\"],\"itemIds\":[\"b1m3sichbewegen\",\"stunde\"],\"tip\":\"Nach der Arbeit abre la frase → verbo inmediatamente después, y el sujeto ich detrás. La inversión del A2 sigue mandando.\"},{\"id\":\"b1m3l1e8\",\"type\":\"speak\",\"prompt\":\"Dilo en voz alta: tu diagnóstico\",\"text\":\"Ich sitze den ganzen Tag am Schreibtisch und bewege mich zu wenig.\",\"phonetic\":\"ij ZI-tse deen GAN-tsen taak am SHRAIP-tish unt be-VEE-gue mij tsu VEE-nij\",\"translation\":\"Estoy sentado todo el día al escritorio y me muevo demasiado poco.\",\"itemIds\":[\"b1m3denganzentagsitzen\",\"b1m3derschreibtisch\",\"b1m3sichbewegen\"],\"tip\":\"Es la frase que oirás en cualquier oficina alemana. Dila entera de un tirón: es tu primer chunk largo del módulo.\"},{\"id\":\"b1m3l1e9\",\"type\":\"mc\",\"prompt\":\"Infiere la intención del eslogan\",\"question\":\"¿Por qué los médicos comparan el sedentarismo con el tabaco?\",\"options\":[\"Porque quieren asustar y así conseguir que la gente reaccione\",\"Porque quien se sienta mucho suele fumar mucho\",\"Porque sentarse produce humo en el cuerpo\"],\"answer\":0,\"whyWrong\":[null,\"El eslogan no dice nada sobre los hábitos de los fumadores\",\"La comparación es retórica, no física\"],\"itemIds\":[\"b1m3sitzenistdasneuerauchen\",\"b1m3derbewegungsmangel\"],\"tip\":\"En B1 casi todas las preguntas de lectura son así: no «¿qué dice?», sino «¿para qué lo dice?».\"},{\"id\":\"b1m3l1e10\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Me muevo demasiado poco.\",\"answers\":[\"Ich bewege mich zu wenig\"],\"hints\":[\"Reflexivo: ich ... mich\",\"Ich bewege mich zu ...\"],\"itemIds\":[\"b1m3sichbewegen\"],\"tip\":\"Con esta frase ya puedes entrar en el debate. En la próxima lección aprendes a decirlo sin sujeto: la pasiva.\"},{\"id\":\"b1m3l1e11\",\"type\":\"audiomc\",\"prompt\":\"Hören Teil 1: un consejo de salud en la radio · tarea 1 de 2. Lee la afirmación, dale al play y marca Richtig o Falsch. El Teil 1 se oye DOS veces.\",\"audio\":\"Und jetzt unser Gesundheitstipp am Morgen. Neun Stunden — so lange sitzt ein Büroangestellter in Deutschland im Schnitt pro Tag, den Weg zur Arbeit nicht mitgerechnet. Wer dagegen im Krankenhaus oder im Verkauf arbeitet, kommt locker auf zwölftausend Schritte am Tag. Beneiden Sie diese Kolleginnen und Kollegen aber nicht zu schnell: Denen tun abends die Füße weh. Gesund ist, ähm, weder das eine noch das andere. Gesund ist der Wechsel.\",\"question\":\"„Die neun Stunden sind ohne den Weg zur Arbeit gerechnet.“ — Richtig oder falsch?\",\"options\":[\"Richtig\",\"Falsch\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"«den Weg zur Arbeit nicht mitgerechnet»: el trayecto queda fuera de esas nueve horas\"],\"itemIds\":[\"b1m3denganzentagsitzen\",\"b1m3sichbewegen\"],\"tip\":\"Los textos cortos del examen son así: informativos y con una cifra que hay que retener. Los micro-diálogos de treinta segundos no existen en ningún Teil — el diálogo de verdad lo tienes al final del módulo, y dura tres minutos.\"},{\"id\":\"b1m3l1e12\",\"type\":\"audiomc\",\"prompt\":\"Mismo consejo, segunda tarea. Dos escuchas.\",\"audio\":\"Und jetzt unser Gesundheitstipp am Morgen. Neun Stunden — so lange sitzt ein Büroangestellter in Deutschland im Schnitt pro Tag, den Weg zur Arbeit nicht mitgerechnet. Wer dagegen im Krankenhaus oder im Verkauf arbeitet, kommt locker auf zwölftausend Schritte am Tag. Beneiden Sie diese Kolleginnen und Kollegen aber nicht zu schnell: Denen tun abends die Füße weh. Gesund ist, ähm, weder das eine noch das andere. Gesund ist der Wechsel.\",\"question\":\"¿Qué se considera sano al final del texto?\",\"options\":[\"Alternar: ni estar sentado todo el día ni andar todo el día\",\"Dar doce mil pasos diarios\",\"Estar sentado, si son menos de nueve horas\"],\"answer\":0,\"plays\":2,\"whyWrong\":[null,\"Los doce mil pasos son el otro extremo, y de ese dice que acaba con los pies doloridos\",\"No pone ningún límite de horas: propone cambiar de postura\"],\"itemIds\":[\"b1m3diegesundheit\"]}]},{\"kind\":\"nativo\",\"nativo\":{\"id\":\"nat-b1m3-1\",\"book\":\"Ich habe keine Lust, Sport zu machen.\",\"real\":\"Ich hab keinen Bock auf Sport.\",\"meaning\":\"No me apetece nada hacer deporte\",\"when\":\"Entre amigos y en familia, constantemente. Con el médico, con el jefe o en cualquier texto de examen, jamás: «Bock» es de la calle y en el Schreiben cuenta como registro roto.\",\"register\":\"amigos\",\"exam\":\"Ich habe im Moment wenig Motivation, Sport zu treiben.\",\"note\":\"«Bock haben auf + Akkusativ» es el «apetecer» de la calle. Con keinen suena a queja simpática, no a grosería.\",\"sound\":\"ij jap KAI-nen bok auf shport\",\"level\":\"b1\",\"produce\":true,\"itemId\":\"b1m3natkeinenbock\"}}],\"resources\":[{\"label\":\"DW — Top-Thema mit Vokabeln (B1)\",\"url\":\"https://learngerman.dw.com/de/top-thema/s-8031\",\"note\":\"Textos de prensa de dos minutos con vocabulario glosado: el formato exacto de la lectura de este módulo.\"}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#fbf7f0\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/seshat/_next/static/chunks/089504k7jbt2_.js\",\"/seshat/_next/static/chunks/3fqe0byvkgxms.js\",\"/seshat/_next/static/chunks/3fq40u30u6ehq.js\",\"/seshat/_next/static/chunk
