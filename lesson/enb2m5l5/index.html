ce, research, information: incontables.\u003c/b\u003e ❌ \u003ci\u003ean evidence, the evidences, a research, informations.\u003c/i\u003e ✓ \u003ci\u003ethe evidence, research, a piece of research, a study.\u003c/i\u003e El verbo va en singular: \u003ci\u003ethe evidence \u003cb\u003esuggests\u003c/b\u003e\u003c/i\u003e.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e2. Phenomenon es contable, y el plural es phenomena.\u003c/b\u003e ✓ \u003ci\u003ean unexplained phenomenon\u003c/i\u003e · ✓ \u003ci\u003ethese phenomena\u003c/i\u003e · ❌ \u003ci\u003ea phenomena\u003c/i\u003e. El español «un fenómeno / fenómenos» no avisa del cambio de forma.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e3. Explanation, hypothesis, sample, trend: contables.\u003c/b\u003e Llevan artículo. ❌ \u003ci\u003eWe need explanation.\u003c/i\u003e ✓ \u003ci\u003eWe need \u003cb\u003ean\u003c/b\u003e explanation.\u003c/i\u003e El español a veces las deja peladas («hace falta explicación») y el inglés no.\u003cbr/\u003e\u003cbr/\u003e\u003cb\u003e4. Data:\u003c/b\u003e en informes actuales va con singular (\u003ci\u003ethe data is incomplete\u003c/i\u003e) y nadie te baja nota. El plural \u003ci\u003ethe data are\u003c/i\u003e existe y suena a laboratorio viejo.\u003cbr/\u003e\u003cbr/\u003eEn la misma lección, la deducción en pasado que faltaba: \u003ci\u003emay have left, could have been, can't have been\u003c/i\u003e. El calco *\u003ci\u003emustn't have\u003c/i\u003e para descartar es el gemelo del *\u003ci\u003emustn't be\u003c/i\u003e del B1: \u003ci\u003emustn't\u003c/i\u003e no deduce, prohíbe."])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L16\",null,{\"lesson\":{\"id\":\"enb2m5l5\",\"phaseId\":\"enb2m5\",\"title\":\"The evidence, a phenomenon\",\"subtitle\":\"Clínica: el artículo que el español no pone, y el que pone de más\",\"minutes\":16,\"sections\":[{\"kind\":\"phrases\",\"title\":\"Lo que se cuenta y lo que no\",\"itemIds\":[\"enb2m5mayhaveleft\",\"enb2m5canthavebeen\",\"enb2m5couldhavebeen\",\"enb2m5theevidence\",\"enb2m5aphenomenon\",\"enb2m5research\",\"enb2m5anexplanation\",\"enb2m5itisobviousthat\"]},{\"kind\":\"note\",\"note\":{\"title\":\"La clínica: el determinante, que es el 27 % de tus errores y no se cura solo\",\"body\":\"$17\",\"table\":[[\"Incontable — sin a/an, sin plural\",\"Contable — con artículo\",\"Trampa\"],[\"evidence, research, information\",\"a phenomenon, a sample, a trend\",\"evidences / a research\"],[\"the evidence suggests\",\"an unexplained phenomenon\",\"a phenomena\"],[\"research shows\",\"a plausible explanation\",\"we need explanation\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"enb2m5l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Se puede poner «a / an» delante?\",\"categories\":[\"INCONTABLE — nunca a/an ni plural\",\"CONTABLE — lleva artículo\"],\"items\":[{\"text\":\"evidence\",\"bucket\":0},{\"text\":\"research\",\"bucket\":0},{\"text\":\"information\",\"bucket\":0},{\"text\":\"phenomenon\",\"bucket\":1},{\"text\":\"explanation\",\"bucket\":1},{\"text\":\"sample\",\"bucket\":1},{\"text\":\"hypothesis\",\"bucket\":1},{\"text\":\"trend\",\"bucket\":1}],\"itemIds\":[\"enb2m5theevidence\",\"enb2m5research\",\"enb2m5aphenomenon\",\"enb2m5anexplanation\",\"enb2m5asampleof\",\"enb2m5hypothesis\",\"enb2m5atrend\"],\"tip\":\"Si dudas, pregúntate: ¿puedo contar dos? Dos explanations, sí. Dos evidences, no. Esa pregunta te ahorra el 27 %.\"},{\"id\":\"enb2m5l5e2\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"A research shows a clear trend.\",\"answers\":[\"Research shows a clear trend.\",\"The research shows a clear trend.\",\"A study shows a clear trend.\"],\"why\":\"«Research» es incontable: no lleva «a». Si quieres un recuento, cambia de palabra: «a study», «a paper», «a piece of research».\",\"translation\":\"La investigación muestra una tendencia clara.\",\"itemIds\":[\"enb2m5research\",\"enb2m5atrend\"]},{\"id\":\"enb2m5l5e3\",\"type\":\"errorfix\",\"prompt\":\"Esto lo escribió un hispanohablante. Arréglalo.\",\"wrong\":\"It mustn't have been a ghost.\",\"answers\":[\"It can't have been a ghost.\"],\"why\":\"«Mustn't» prohíbe; no deduce. Para descartar una lectura del pasado se usa «can't have» + participio, igual que en presente se usa «can't be» y no «mustn't be».\",\"translation\":\"No puede haber sido un fantasma.\",\"itemIds\":[\"enb2m5canthavebeen\"]},{\"id\":\"enb2m5l5e4\",\"type\":\"mc\",\"prompt\":\"El plural que no se parece\",\"question\":\"«Un fenómeno sin explicar» →\",\"options\":[\"an unexplained phenomenon\",\"an unexplained phenomena\",\"a unexplained phenomenon\"],\"answer\":0,\"whyWrong\":[null,\"«Phenomena» ya es el plural. Con «an» estás diciendo «un fenómenos».\",\"«Phenomenon» empieza por vocal: el artículo es «an».\"],\"itemIds\":[\"enb2m5aphenomenon\"],\"tip\":\"Guárdate el par: phenomenon / phenomena, criterion / criteria, datum / data. Son tres, no treinta, y salen en cualquier texto de este campo.\"},{\"id\":\"enb2m5l5e5\",\"type\":\"transform\",\"prompt\":\"De lo posible ahora a lo posible anoche\",\"source\":\"She may leave the light on.\",\"instruction\":\"Dilo sobre anoche: «puede que se dejara…»\",\"answers\":[\"She may have left the light on\",\"She might have left the light on\"],\"translation\":\"Puede que se dejara la luz encendida.\",\"hints\":[\"Modal + have + participio\",\"She may have ... the light on\"],\"itemIds\":[\"enb2m5mayhaveleft\"],\"tip\":\"«Leave» → «left». El participio irregular es el que se come el alumno cuando traduce «haber dejado» con infinitivo.\"},{\"id\":\"enb2m5l5e6\",\"type\":\"gapbank\",\"prompt\":\"Completa lo que Amy le dice a Nora, sin «I think»\",\"text\":\"It ___ have been a ghost: there is no ___ for that. She ___ have left the light on, or it could have been a fox. It is ___ that the data we have is incomplete.\",\"answers\":[\"can't\",\"evidence\",\"may\",\"obvious\"],\"bank\":[\"can't\",\"evidence\",\"may\",\"obvious\",\"mustn't\",\"proofs\",\"must\",\"surely\"],\"translation\":\"No puede haber sido un fantasma: no hay pruebas de eso. Puede que se dejara la luz encendida, o podría haber sido un zorro. Es evidente que los datos que tenemos están incompletos.\",\"itemIds\":[\"enb2m5canthavebeen\",\"enb2m5theevidence\",\"enb2m5mayhaveleft\",\"enb2m5itisobviousthat\",\"enb2m5couldhavebeen\"],\"tip\":\"«Mustn't» está en el banco para que lo veas y no lo cojas. Es la trampa de esta lección, no un sinónimo.\"},{\"id\":\"enb2m5l5e7\",\"type\":\"cloze\",\"prompt\":\"Completa el incontable\",\"text\":\"There is no conclusive ___ that the house is haunted.\",\"answers\":[\"evidence\"],\"translation\":\"No hay pruebas concluyentes de que la casa esté encantada.\",\"hints\":[\"Incontable, empieza por e\",\"evi...\"],\"itemIds\":[\"enb2m5conclusive\",\"enb2m5theevidence\",\"enb2m5supposedtorumor\"],\"tip\":\"«There is», no «there are»: una sola masa de evidencia, aunque sean diez informes. El verbo delata el artículo.\"},{\"id\":\"enb2m5l5e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción — las tres alturas de anoche\",\"question\":\"No puede haber sido un fantasma; puede que se dejara la luz; podría haber sido un zorro.\",\"answers\":[\"It can't have been a ghost; she may have left the light on; it could have been a fox\",\"It can't have been a ghost, she may have left the light on, it could have been a fox\",\"It can't have been a ghost. She may have left the light on. It could have been a fox.\"],\"hints\":[\"Tres modales + have + participio\",\"It can't have been ...; she may have left ...; it could have been ...\"],\"itemIds\":[\"enb2m5canthavebeen\",\"enb2m5mayhaveleft\",\"enb2m5couldhavebeen\"],\"tip\":\"Tres alturas, cero «I think». Es exactamente la conversación de la L9, y es exactamente lo que el Speaking Part 4 quiere oír cuando el tema es una creencia.\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"
