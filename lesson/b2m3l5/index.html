03e sí. Y \u003ci\u003e*die Entscheidung von gehen\u003c/i\u003e tampoco.\",\"table\":[[\"español\",\"alemán\",\"fábrica\"],[\"el leer\",\"das Lesen\",\"das + inf.\"],[\"la decisión de irse\",\"die Entscheidung zu gehen\",\"Nomen + zu + inf.\"],[\"la resolución de marcharse\",\"der Entschluss zum Weggang\",\"Nomen + zu + Nomen\"]]}},{\"kind\":\"exercises\",\"exercises\":[{\"id\":\"b2m3l5e1\",\"type\":\"bucket\",\"prompt\":\"¿Qué fábrica es?\",\"categories\":[\"das + infinitivo\",\"Nomen + zu + inf. / Nomen\"],\"items\":[{\"text\":\"das Lesen\",\"bucket\":0},{\"text\":\"die Entscheidung zu gehen\",\"bucket\":1},{\"text\":\"das Schreiben\",\"bucket\":0},{\"text\":\"der Entschluss zum Weggang\",\"bucket\":1},{\"text\":\"das Speichern\",\"bucket\":0},{\"text\":\"die Möglichkeit zu widersprechen\",\"bucket\":1}],\"itemIds\":[\"b2m3daslesen\",\"b2m3entscheidungzu\",\"b2m3dasschreiben\",\"b2m3entschlusszum\"]},{\"id\":\"b2m3l5e2\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Lesen langer Studien ist anstrengend.\",\"answers\":[\"Das Lesen langer Studien ist anstrengend.\"],\"why\":\"El infinitivo sustantivado lleva artículo y mayúscula: Das Lesen. Sin ellos parece un verbo suelto al inicio, y el alemán no empieza así una afirmación.\",\"translation\":\"Leer estudios largos es agotador.\",\"itemIds\":[\"b2m3daslesen\"]},{\"id\":\"b2m3l5e3\",\"type\":\"errorfix\",\"prompt\":\"Un hispanohablante escribió esto. Arréglalo.\",\"wrong\":\"Die Entscheidung von gehen war schwer.\",\"answers\":[\"Die Entscheidung zu gehen war schwer.\",\"Der Entschluss zum Weggang war schwer.\"],\"why\":\"«la decisión DE irse» no se calca con von. El alemán pide zu + infinitivo o zum + sustantivo.\",\"translation\":\"La decisión de irse fue difícil.\",\"itemIds\":[\"b2m3entscheidungzu\",\"b2m3entschlusszum\"]},{\"id\":\"b2m3l5e4\",\"type\":\"mc\",\"prompt\":\"¿Cuándo NO nominalizar?\",\"question\":\"Un párrafo de foro a un compañero. ¿Qué suena a B2 y no a circular?\",\"options\":[\"Unter Berücksichtigung der Durchführung der Überprüfung …\",\"Ich habe die Studie gelesen. Die Ergebnisse überzeugen mich, obwohl die Methode angreifbar ist.\",\"Nach erfolgter Kenntnisnahme der Thematik …\"],\"answer\":1,\"whyWrong\":[\"Eso es Papierdeutsch: tres -ung seguidas. Kohärenz se cae igual que la pobreza\",null,\"Fórmula de administración. En un foro suena a parodia\"],\"itemIds\":[\"b2m3papierdeutsch\",\"b2m3verbalstil\",\"b2m3nominalstil\"],\"tip\":\"El B2 alterna. Enseñar solo la subida produce alumnos que escriben como una circular.\"},{\"id\":\"b2m3l5e5\",\"type\":\"paraphrase\",\"prompt\":\"Bájalo a verbal — sin Entscheidung ni Entschluss\",\"source\":\"Die Entscheidung zu gehen war schwer.\",\"forbid\":[\"Entscheidung\",\"Entschluss\"],\"answers\":[\"Es war schwer, zu gehen\",\"Es fiel mir schwer, zu gehen\",\"Weggehen war schwer\"],\"itemIds\":[\"b2m3entscheidungzu\"]},{\"id\":\"b2m3l5e6\",\"type\":\"gapbank\",\"prompt\":\"Mayúscula, artículo, zu\",\"text\":\"___ Lesen der Studie dauerte zwei Stunden. Danach fiel die Entscheidung, ___ Anwendung zu stoppen. Der Entschluss ___ Stopp lag beim Team.\",\"answers\":[\"Das\",\"die\",\"zum\"],\"bank\":[\"Das\",\"die\",\"zum\",\"von\",\"lesen\",\"der\"],\"translation\":\"Leer el estudio llevó dos horas. Después se tomó la decisión de detener la aplicación. La resolución de pararla la tenía el equipo.\",\"itemIds\":[\"b2m3daslesen\",\"b2m3entscheidungzu\",\"b2m3entschlusszum\",\"b2m3anwendung\"]},{\"id\":\"b2m3l5e7\",\"type\":\"hearreal\",\"prompt\":\"¿Calle o libro?\",\"book\":\"Das ist wichtig.\",\"real\":\"Das ist echt wichtig.\",\"translation\":\"Eso es importante.\",\"itemIds\":[\"b2m3natechtwichtig\"]},{\"id\":\"b2m3l5e8\",\"type\":\"type\",\"prompt\":\"Cierre de producción\",\"question\":\"Leer ayuda; la decisión de irse fue difícil\",\"answers\":[\"Das Lesen hilft. Die Entscheidung zu gehen war schwer\",\"Das Lesen hilft, aber die Entscheidung zu gehen war schwer\"],
